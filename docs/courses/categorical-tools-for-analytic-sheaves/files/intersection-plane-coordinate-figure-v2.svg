<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<title>Intersection lines in the diagonal rational plane</title>
<desc>Coordinates u,v map to (u+v,-u,-v). The lines v=-u, u=0 and v=0 are the real extensions of three rational intersection spaces. Their pairwise intersections are zero; the last two span the plane. The displayed six-edge cycle has coefficients 1,-1,1,-1,1,-1.</desc>
<!-- Original course diagram and reproducible scene source: CC0-1.0. -->
<rect width="1000" height="760" fill="white"/>
<text x="34" y="50" fill="#17212E" font-family="Arial, sans-serif" font-size="30">Three intersection lines inside X1</text>
<text x="34" y="87" fill="#17212E" font-family="Arial, sans-serif" font-size="20">X1 = {(x,y,z) : x+y+z=0} over Q</text>
<text x="34" y="116" fill="#17212E" font-family="Arial, sans-serif" font-size="19">Coordinate chart: Phi(u,v)=(u+v,-u,-v)</text>
<line x1="110" y1="150" x2="110" y2="510" stroke="#D6DDE6" stroke-width="1"/>
<line x1="110" y1="510" x2="470" y2="510" stroke="#D6DDE6" stroke-width="1"/>
<text x="103" y="538" fill="#17212E" font-family="Arial, sans-serif" font-size="16">-2</text>
<text x="79" y="515" fill="#17212E" font-family="Arial, sans-serif" font-size="16">-2</text>
<line x1="200" y1="150" x2="200" y2="510" stroke="#D6DDE6" stroke-width="1"/>
<line x1="110" y1="420" x2="470" y2="420" stroke="#D6DDE6" stroke-width="1"/>
<text x="193" y="538" fill="#17212E" font-family="Arial, sans-serif" font-size="16">-1</text>
<text x="79" y="425" fill="#17212E" font-family="Arial, sans-serif" font-size="16">-1</text>
<line x1="290" y1="150" x2="290" y2="510" stroke="#D6DDE6" stroke-width="1"/>
<line x1="110" y1="330" x2="470" y2="330" stroke="#D6DDE6" stroke-width="1"/>
<line x1="380" y1="150" x2="380" y2="510" stroke="#D6DDE6" stroke-width="1"/>
<line x1="110" y1="240" x2="470" y2="240" stroke="#D6DDE6" stroke-width="1"/>
<text x="373" y="538" fill="#17212E" font-family="Arial, sans-serif" font-size="16">1</text>
<text x="79" y="245" fill="#17212E" font-family="Arial, sans-serif" font-size="16">1</text>
<line x1="470" y1="150" x2="470" y2="510" stroke="#D6DDE6" stroke-width="1"/>
<line x1="110" y1="150" x2="470" y2="150" stroke="#D6DDE6" stroke-width="1"/>
<text x="463" y="538" fill="#17212E" font-family="Arial, sans-serif" font-size="16">2</text>
<text x="79" y="155" fill="#17212E" font-family="Arial, sans-serif" font-size="16">2</text>
<line x1="94" y1="330" x2="510" y2="330" stroke="#8896A8" stroke-width="2"/>
<line x1="290" y1="528" x2="290" y2="138" stroke="#8896A8" stroke-width="2"/>
<text x="518" y="339" fill="#17212E" font-family="Arial, sans-serif" font-size="21">u</text>
<text x="277" y="143" fill="#17212E" font-family="Arial, sans-serif" font-size="21">v</text>
<line x1="110" y1="150" x2="470" y2="510" stroke="#245CB3" stroke-width="4"/>
<line x1="290" y1="510" x2="290" y2="150" stroke="#137E65" stroke-width="4"/>
<line x1="110" y1="330" x2="470" y2="330" stroke="#B63C48" stroke-width="4"/>
<circle cx="200" cy="240" r="5" fill="#245CB3" stroke="white"/>
<circle cx="290" cy="240" r="5" fill="#137E65" stroke="white"/>
<circle cx="380" cy="330" r="5" fill="#B63C48" stroke="white"/>
<circle cx="290" cy="330" r="5" fill="#17212E" stroke="white"/>
<text x="300" y="359" fill="#17212E" font-family="Arial, sans-serif" font-size="17">0</text>
<text x="570" y="199" fill="#245CB3" font-family="Arial, sans-serif" font-size="22">Y2 = X1  intersect  X2 : v = -u</text>
<text x="570" y="231" fill="#245CB3" font-family="Arial, sans-serif" font-size="18">v12 = (0,1,-1) = Phi(-1,1)</text>
<text x="570" y="284" fill="#137E65" font-family="Arial, sans-serif" font-size="22">Y3 = X1  intersect  X3 : u = 0</text>
<text x="570" y="316" fill="#137E65" font-family="Arial, sans-serif" font-size="18">v13 = (1,0,-1) = Phi(0,1)</text>
<text x="570" y="369" fill="#B63C48" font-family="Arial, sans-serif" font-size="22">Y4 = X1  intersect  X4 : v = 0</text>
<text x="570" y="401" fill="#B63C48" font-family="Arial, sans-serif" font-size="18">v14 = (1,-1,0) = Phi(1,0)</text>
<text x="570" y="453" fill="#17212E" font-family="Arial, sans-serif" font-size="21">Y3 + Y4 = X1</text>
<text x="570" y="487" fill="#17212E" font-family="Arial, sans-serif" font-size="19">Y2  intersect  Y3 = Y2  intersect  Y4 = 0</text>
<line x1="34" y1="570" x2="966" y2="570" stroke="#BCC6D3" stroke-width="1"/>
<text x="34" y="607" fill="#17212E" font-family="Arial, sans-serif" font-size="19">Distribution defect: Y2  intersect  (Y3+Y4) = Y2;  (Y2 intersect Y3)+(Y2 intersect Y4) = 0</text>
<text x="34" y="644" fill="#17212E" font-family="Arial, sans-serif" font-size="19">The six-edge H2 class:  (12,13,14,23,24,34) -&gt; (1,-1,1,-1,1,-1)</text>
<text x="34" y="681" fill="#17212E" font-family="Arial, sans-serif" font-size="19">Its image in the intersection-line complex:  v12 - v13 + v14 = 0</text>
<text x="34" y="734" fill="#17212E" font-family="Arial, sans-serif" font-size="16">Drawn lines are real extensions of the indicated rational subspaces. Proof: lesson Section 4.</text>
</svg>
