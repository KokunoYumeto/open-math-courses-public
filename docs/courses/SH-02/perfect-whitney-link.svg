    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start" x="504" y="87.48225" transform="rotate(-0 504 87.48225)">PL4–PL7: finite constructions retain the arrows</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14233e" x="749.916" y="133.6587" transform="rotate(-0 749.916 133.6587)">RΓc(S;A) ≃ fib[ RΓ(S̄;Ā) → RΓ(∂S̄;Ā) ]</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="752.4" y="165.04785" transform="rotate(-0 752.4 165.04785)">The arrow is restriction; the comparison is extension by zero.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #14233e" transform="translate(595.320062 212.685864)">Product-collar metric → finite convex cover of the half</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #14233e" transform="translate(560.919789 227.857598)">Derived Čech columns are finite sums of perfect stalk complexes.</text>
   </g>
