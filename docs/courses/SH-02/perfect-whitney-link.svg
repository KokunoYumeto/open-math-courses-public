   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="87.48225" transform="rotate(-0 7.2 87.48225)">PL3: the end coordinate and completion</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14233e" transform="translate(32.670563 182.052413)">Q = {h ≤ C}</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14233e" transform="translate(29.8515 195.489788)">compact core</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="272.556" y="166.27257" transform="rotate(-0 272.556 166.27257)">H × [C, ∞)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="272.556" y="182.19393" transform="rotate(-0 272.556 182.19393)">Φ(b,t) = β(t−C,b)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="122.868" y="136.47105" transform="rotate(-0 122.868 136.47105)">H = {h=C}</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #325d44" x="290.7" y="200.318274" transform="rotate(-0 290.7 200.318274)">v = w/dh(w),  dh(v) = 1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="234" y="238.53105" transform="rotate(-0 234 238.53105)">Each finite flow segment stays in a compact h-band.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #285f91" x="234" y="256.451274" transform="rotate(-0 234 256.451274)">s = (t−C)/(1+t−C)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14233e" x="70.704" y="341.8611" transform="rotate(-0 70.704 341.8611)">same Q</text>
   </g>
   <g id="text_10">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle" x="272.556" y="321.40377" transform="rotate(-0 272.556 321.40377)">H × [0,1]</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle" x="272.556" y="338.54985" transform="rotate(-0 272.556 338.54985)">S ≅ int(S̄)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #a63c4b" x="422.244" y="288.74457" transform="rotate(-0 422.244 288.74457)">∂S̄ = H × {1}</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #285f91" x="252.144" y="355.857714" transform="rotate(-0 252.144 355.857714)">r̄ collapses the attached collar</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="234" y="399.78585" transform="rotate(-0 234 399.78585)">Ā = r̄⁻¹(A|Q),   j⁻¹Ā ≃ A by NMG5</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #56667e" transform="translate(18.54 424.139463)">The rectangles suppress the H-direction.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #56667e" transform="translate(18.54 436.457056)">They do not identify H with an interval or give</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #56667e" transform="translate(18.54 448.77465)">coordinates on an arbitrary singular link.</text>
   </g>
  </g>
