  </g>
  <g id="text_37">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="28.713125" y="56.316562" transform="rotate(-0 28.713125 56.316562)">Original Whitney strata • arbitrary bounded weak k-coefficients • generic complex normal covector</text>
  </g>
  <g id="text_38">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="58.953125" y="406.236562" transform="rotate(-0 58.953125 406.236562)">Cₛ(v): ρ≤v², |g|≤av²; dashed α=v²/r².</text>
  </g>
  <g id="text_39">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="58.953125" y="438.636562" transform="rotate(-0 58.953125 438.636562)">κ-fibre: [max(√ρ, √(|g|/a)), r].</text>
  </g>
  <g id="text_40">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506479" transform="translate(58.953125 452.881375)">This is a diagram of values, not a coordinate</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506479" transform="translate(58.953125 465.198969)">chart or a claim that every value is attained.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506479" transform="translate(58.953125 477.516562)">π, ρ and g keep their original meanings.</text>
  </g>
  <g id="text_41">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="28.713125" y="542.316562" transform="rotate(-0 28.713125 542.316562)">N=0 makes both endpoint restrictions invertible; the phase path compares g and −g.</text>
