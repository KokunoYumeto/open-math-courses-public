<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-labelledby="title desc">
<title id="title">The Cartesian graph square and its proper-support base-change map</title>
<desc id="desc">X maps to X times Y by the graph of f. Its vertical map is f. The right vertical map is f times the identity of Y. The bottom map is the diagonal of Y. This square is Cartesian. Its base-change mate beta identifies diagonal pullback after direct image along f times the identity with direct image along f after graph pullback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245c75"/></marker></defs>
<rect x="0" y="0" width="940" height="380" rx="10" fill="#f4f8fa"/>
<g fill="#142b3a" font-family="Cambria, Georgia, serif">
<text x="130" y="55" text-anchor="middle" font-size="23">X</text>
<text x="765" y="55" text-anchor="middle" font-size="23">X × Y</text>
<text x="130" y="190" text-anchor="middle" font-size="23">Y</text>
<text x="765" y="190" text-anchor="middle" font-size="23">Y × Y</text>
<path d="M160,47 L714,47" fill="none" stroke="#245c75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="447.5" y="35" text-anchor="middle" font-size="18">Γ<tspan baseline-shift="sub" font-size=".68em">f</tspan></text>
<path d="M130,72 L130,160" fill="none" stroke="#245c75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="105" y="122.5" text-anchor="middle" font-size="19">f</text>
<path d="M765,72 L765,160" fill="none" stroke="#245c75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="810" y="122.5" text-anchor="middle" font-size="18">f × id<tspan baseline-shift="sub" font-size=".68em">Y</tspan></text>
<path d="M160,182 L714,182" fill="none" stroke="#245c75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="447.5" y="170" text-anchor="middle" font-size="18">Δ<tspan baseline-shift="sub" font-size=".68em">Y</tspan></text>
<text x="447.5" y="235" text-anchor="middle" font-size="21">Cartesian square (GBT.21)</text>
<text x="262" y="322" text-anchor="middle" font-size="23">Δ<tspan baseline-shift="sub" font-size=".68em">Y</tspan><tspan baseline-shift="super" font-size=".68em">*</tspan> (f × id<tspan baseline-shift="sub" font-size=".68em">Y</tspan>)<tspan baseline-shift="sub" font-size=".68em">!</tspan> (F ⊠ G)</text>
<path d="M501,315 L553,315" fill="none" stroke="#245c75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="529" y="299" text-anchor="middle" font-size="21">β</text>
<text x="731" y="322" text-anchor="middle" font-size="23">f<tspan baseline-shift="sub" font-size=".68em">!</tspan> Γ<tspan baseline-shift="sub" font-size=".68em">f</tspan><tspan baseline-shift="super" font-size=".68em">*</tspan> (F ⊠ G)</text>
</g></svg>
