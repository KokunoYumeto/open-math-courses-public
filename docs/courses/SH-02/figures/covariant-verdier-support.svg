<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="390" viewBox="0 0 1060 390" role="img" aria-labelledby="title desc"><title id="title">Compact support cofiber sequence and its filtered colimit</title><desc id="desc">For compact K inside relatively compact open U and compact L containing the closure of U, Q equals L minus U. The pointwise cofiber sequence A_F(Q) to A_F(L) to F(U) maps by its colimit cone to Gamma_c(X minus K;F) to Gamma_c(X;F) to F[K]. Both rows, or both columns in the portrait diagram, are cofiber sequences. See SH02-SXM-4.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#516b87"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f7f9fc"/><g font-family="Georgia,serif"><text x="530" y="38" font-size="29" fill="#23354b" text-anchor="middle">The complement triangle</text><text x="530" y="70" font-size="20" fill="#23354b" text-anchor="middle">Q = L ∖ U;   K ⊂ U,   closure(U) ⊂ L</text><text x="180" y="141" font-size="25" fill="#23354b" text-anchor="middle">A<tspan baseline-shift="sub" font-size="17">F</tspan>(Q)</text><text x="180" y="280" font-size="25" fill="#23354b" text-anchor="middle">Γ<tspan baseline-shift="sub" font-size="17">c</tspan>(X ∖ K; F)</text><path d="M 180 157 L 180 243" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="252" y="204" font-size="17" fill="#23354b" text-anchor="middle">colimit</text><text x="530" y="141" font-size="25" fill="#23354b" text-anchor="middle">A<tspan baseline-shift="sub" font-size="17">F</tspan>(L)</text><text x="530" y="280" font-size="25" fill="#23354b" text-anchor="middle">Γ<tspan baseline-shift="sub" font-size="17">c</tspan>(X; F)</text><path d="M 530 157 L 530 243" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="602" y="204" font-size="17" fill="#23354b" text-anchor="middle">colimit</text><text x="880" y="141" font-size="25" fill="#23354b" text-anchor="middle">F(U)</text><text x="880" y="280" font-size="25" fill="#23354b" text-anchor="middle">F[K]</text><path d="M 880 157 L 880 243" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="952" y="204" font-size="17" fill="#23354b" text-anchor="middle">colimit</text><path d="M 278 132 L 424 132" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 632 132 L 795 132" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 278 272 L 424 272" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 632 272 L 795 272" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="530" y="340" font-size="19" fill="#23354b" text-anchor="middle">Both rows are cofiber sequences. Vertical maps are the same diagram’s colimit cones.</text><text x="530" y="371" font-size="17" fill="#23354b" text-anchor="middle">Proof: SH02-SXM-4, equations (SXM.8)–(SXM.9).</text></g></svg>
