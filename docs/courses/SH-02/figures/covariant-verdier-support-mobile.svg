<svg xmlns="http://www.w3.org/2000/svg" width="590" height="675" viewBox="0 0 590 675" role="img" aria-labelledby="title desc"><title id="title">Compact support cofiber sequence and its filtered colimit, portrait</title><desc id="desc">For compact K inside relatively compact open U and compact L containing the closure of U, Q equals L minus U. The pointwise cofiber sequence A_F(Q) to A_F(L) to F(U) maps by its colimit cone to Gamma_c(X minus K;F) to Gamma_c(X;F) to F[K]. Both rows, or both columns in the portrait diagram, are cofiber sequences. See SH02-SXM-4.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#516b87"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f7f9fc"/><g font-family="Georgia,serif"><text x="295" y="39" font-size="27" fill="#23354b" text-anchor="middle">The complement triangle</text><text x="295" y="74" font-size="20" fill="#23354b" text-anchor="middle">Q = L ∖ U;  closure(U) ⊂ L</text><text x="295" y="105" font-size="19" fill="#23354b" text-anchor="middle">K ⊂ U; both columns read downward</text><text x="135" y="202" font-size="25" fill="#23354b" text-anchor="middle">A<tspan baseline-shift="sub" font-size="17">F</tspan>(Q)</text><text x="435" y="202" font-size="24" fill="#23354b" text-anchor="middle">Γ<tspan baseline-shift="sub" font-size="17">c</tspan>(X ∖ K; F)</text><path d="M 228 194 L 322 194" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="277" y="176" font-size="15" fill="#23354b" text-anchor="middle">colimit</text><text x="135" y="350" font-size="25" fill="#23354b" text-anchor="middle">A<tspan baseline-shift="sub" font-size="17">F</tspan>(L)</text><text x="435" y="350" font-size="24" fill="#23354b" text-anchor="middle">Γ<tspan baseline-shift="sub" font-size="17">c</tspan>(X; F)</text><path d="M 228 342 L 322 342" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="277" y="324" font-size="15" fill="#23354b" text-anchor="middle">colimit</text><text x="135" y="498" font-size="25" fill="#23354b" text-anchor="middle">F(U)</text><text x="435" y="498" font-size="24" fill="#23354b" text-anchor="middle">F[K]</text><path d="M 228 490 L 322 490" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="277" y="472" font-size="15" fill="#23354b" text-anchor="middle">colimit</text><path d="M 135 224 L 135 315" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 135 372 L 135 463" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 435 224 L 435 315" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 435 372 L 435 463" fill="none" stroke="#516b87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="295" y="579" font-size="19" fill="#23354b" text-anchor="middle">Vertical arrows form cofiber sequences.</text><text x="295" y="610" font-size="19" fill="#23354b" text-anchor="middle">Horizontal arrows are colimit cones.</text><text x="295" y="644" font-size="17" fill="#23354b" text-anchor="middle">Proof: SH02-SXM-4, (SXM.8)–(SXM.9).</text></g></svg>
