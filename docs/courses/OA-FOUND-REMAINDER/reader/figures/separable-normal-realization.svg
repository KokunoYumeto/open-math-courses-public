<g font-size="18"><text x="146" y="84">Dense normal states φₙ</text><text x="146" y="114">φ = Σₙ 2⁻ⁿ φₙ</text><text x="420" y="84">Faithful normal state φ</text><text x="420" y="114">GNS space Hφ is separable</text><text x="694" y="84">Compact metric unit ball</text><text x="694" y="114">countable weakly total Λ(aⱼ)</text></g>
<g stroke="#22657b" stroke-width="2" marker-end="url(#arrow)"><path d="M267 100H300"/><path d="M573 100H540"/></g>
<g fill="white" stroke="#a5b6b9" stroke-width="1.5"><rect x="25" y="200" width="155" height="60" rx="9"/><rect x="320" y="200" width="200" height="60" rx="9"/><rect x="630" y="200" width="185" height="60" rx="9"/></g>
<g font-size="23"><text x="102" y="236">M</text><text x="420" y="236">πφ(M) ⊆ B(Hφ)</text><text x="722" y="236">∫⊕ M(x) dμ(x)</text></g>
<g stroke="#22657b" stroke-width="2" marker-end="url(#arrow)"><path d="M180 230H314"/><path d="M520 230H624"/><path d="M420 144V194"/></g>
<g font-size="15"><text x="248" y="193">πφ faithful and normal</text><text x="572" y="193">Ad W</text><text x="572" y="281">Theorem 4.1</text></g>
