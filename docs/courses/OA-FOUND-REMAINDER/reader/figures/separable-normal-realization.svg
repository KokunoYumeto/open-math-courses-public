<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img" aria-labelledby="title desc">
<title id="title">Separable predual to a normal central direct integral</title>
<desc id="desc">For nonzero M with separable predual: the weighted normal-state sum gives a faithful normal state, its GNS space is separable, and a unitary supplied by Theorem 4.1 gives the abstract direct-integral realization. The specified central subalgebra becomes the diagonal algebra.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#22657b"/></marker></defs>
