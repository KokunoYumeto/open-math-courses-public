<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="585" viewBox="0 0 1100 585" role="img" aria-labelledby="title desc">
<title id="title">Full tensor-weight transport and common-factor cocycle cancellation</title>
<desc id="desc">Unitary GNS transport preserves the full finite-positive multiplier criterion. Two orthogonal column projections identify the diagonal tensor weight. The modular matrix-unit identity gives the cocycle with an identity on the common second factor.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#185d77"/></marker></defs>
<rect width="1100" height="585" rx="18" fill="#f5f3ed"/>
<g font-family="Georgia,serif" font-size="24" fill="#202833">
<text x="34" y="45" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Whole positive cones and exact closed domains</text>
<rect x="30" y="70" width="475" height="105" rx="12" fill="white" stroke="#8baab4"/>
<text x="50" y="105">GNS unitary B ⊗ C</text><text x="50" y="140">finite-positive vector tests ↔ same tests</text>
<path d="M510 122H565" stroke="#185d77" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="580" y="70" width="490" height="105" rx="12" fill="#e5f1f5" stroke="#8baab4"/>
<text x="600" y="105">OT.1: transported tensor weight</text><text x="600" y="140">all finite values and all infinite values</text>
<rect x="30" y="215" width="475" height="155" rx="12" fill="white" stroke="#8baab4"/>
<text x="50" y="250">ρ = φ₁ ⊕ φ₂;  θ = ρ ⊗ μ</text><text x="50" y="290">q₁ + q₂ = I,  q₁q₂ = 0</text>
<text x="50" y="330">θ(X) = ‖q₁ξ‖² + ‖q₂ξ‖²</text><text x="50" y="355" font-size="18">finite case: X½ = λξ; converse handles ∞</text>
<path d="M510 290H565" stroke="#185d77" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="580" y="215" width="490" height="155" rx="12" fill="#e5f1f5" stroke="#8baab4"/>
<text x="600" y="250">OT.2: θ = Θ₁ ⊕ Θ₂</text><text x="600" y="290">Θⱼ = φⱼ ⊗ μ</text><text x="600" y="330">full corner GNS and graph identifications</text>
<path d="M825 378V413" stroke="#185d77" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="430" width="1040" height="120" rx="12" fill="#e8eee6" stroke="#91a88a"/>
<text x="50" y="469">σₜ^(Θ₁⊕Θ₂)(E₂₁ ⊗ I) = (σₜ^ρ(E₂₁)) ⊗ I</text>
<text x="50" y="515" font-size="28">OT.3:  [DΘ₂ : DΘ₁]ₜ = [Dφ₂ : Dφ₁]ₜ ⊗ I</text>
</g></svg>