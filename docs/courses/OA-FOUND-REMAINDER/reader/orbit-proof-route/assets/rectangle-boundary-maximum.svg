<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">An interior maximum reaches the rectangle boundary</title>
<desc id="desc">For Q equal to [0,4] times [0,2], c=(2,1), q=(2,0), d=1 and an illustrated radius r=0.7. The circle lies inside Q. Its point p=c+(r/d)(q-c) tends to q as r increases to d. Mean value makes h equal to h(c) on each such circle.</desc>
<rect width="640" height="350" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14283c" font-size="19">
<text x="30" y="32" font-size="22" font-weight="bold">From an interior maximum to the boundary</text>
<rect x="80" y="60" width="400" height="200" rx="0" fill="#e8f1fa" stroke="#183c5b" stroke-width="2"/>
<circle cx="280" cy="160" r="70" fill="none" stroke="#147f8c" stroke-width="3"/>
<path d="M280 160V260" fill="none" stroke="#a64729" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="280" cy="160" r="5" fill="#14283c"/>
<circle cx="280" cy="230" r="5" fill="#147f8c"/>
<circle cx="280" cy="260" r="5" fill="#a64729"/>
<text x="295" y="159">c=(2,1)</text>
<text x="295" y="188">h(c)=M</text>
<text x="180" y="183" fill="#147f8c">r&lt;d</text>
<text x="295" y="234" fill="#147f8c">p</text>
<text x="295" y="264" fill="#a64729">q=(2,0)</text>
<text x="490" y="90">Q</text>
<text x="490" y="126">d=1</text>
<text x="80" y="287" font-size="17">Example: Q=[0,4]×[0,2]; the drawn radius is r=0.7.</text>
<text x="30" y="320" font-size="19">Mean value gives h(p)=M; as r↑d, continuity gives |h(q)|=M.</text>
</g>
</svg>
