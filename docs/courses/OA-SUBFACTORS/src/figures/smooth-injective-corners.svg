<svg xmlns="http://www.w3.org/2000/svg" width="740" height="820" viewBox="0 0 740 820"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs><rect width="740" height="820" fill="white"/>
<text x="26" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17324a" font-weight="bold">Generation gives a projection with the right trace</text>
<text x="26" y="72" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">A is a finite factor; increasing finite Fℓ generate A. Proof: Theorem 61.8.</text>
<rect x="18" y="94" width="704" height="185" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="36" y="129" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Compress onto L²(Fℓ), then Haar-average the right unitary action.</text>
<text x="36" y="167" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">βℓ(Lₓ) = E_Fℓ(x) → x;   βℓ(ρ(x)) = zℓ(x) → τ_A(x)1.</text>
<text x="36" y="205" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">zℓ(x) ∈ Z(Fℓ); any weak cluster commutes with every fixed Fₖ.</text>
<text x="36" y="249" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">A point-ultraweak cluster β fixes all A and has the right-trace identity.</text>
<rect x="18" y="298" width="704" height="281" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="333" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">A nonzero corner uses both left and right support</text>
<text x="36" y="370" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">B = Matₙ(A),  p ∈ B,  t = τ_B(p),  q = L_p ρ(p).</text>
<rect x="45" y="396" width="215" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="62" y="430" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">B(qL²(B))</text>
<rect x="493" y="396" width="199" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="556" y="430" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">p B p</text>
<line x1="270" y1="420" x2="483" y2="420" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="355" y="402" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">β_p</text>
<text x="36" y="483" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">β_p(X) = t⁻¹ p β_B(X) p;   β_B(q) = t p;   β_p(q) = p.</text>
<text x="36" y="520" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">β_p(ρ_p(y)) = τ_B(y)/t · p = τ_pBp(y) p.</text>
<text x="36" y="556" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">The projection uses t⁻¹. The scalar support mass is τ_B(β_B(q)) = t².</text>
<rect x="18" y="598" width="704" height="139" rx="8" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="633" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">Finite tower corners → βⱼ on L²(Mⱼ) → Θ on the canonical T.</text>
<text x="36" y="673" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Generating hypotheses: lesson60.5. Tower: 61.2. Cluster: 61.7.</text>
<text x="36" y="709" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">The bicommutant condition needed for 61.6 remains a separate input.</text>
<text x="26" y="773" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Exact algebra maps and trace constants; diagram positions are schematic.</text>
<text x="26" y="802" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Human sources: von Neumann; Popa, DOI 10.1007/BF02392646, §2.2/4.5.</text>
</svg>