<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Four full basis coordinates and one half-supported coordinate</title>
<desc id="desc">The index nine-halves diagonal example has four coordinates supported by the identity of N and a fifth supported by p zero of N trace one-half. Right coefficients reconstruct x as the sum of u i c i. The geometric corner E eleven has M trace one-third and is a different projection.</desc>
<rect width="960" height="650" rx="20" fill="#f8faf9"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;font-style:normal;fill:#172635}.head{font-size:26px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.eq{font-size:24px}.box{fill:white;stroke:#bccbd0;stroke-width:2}</style>
<text x="40" y="49" class="head" text-anchor="start">A fractional coordinate is a projection corner</text>
<text x="40" y="83" class="small" text-anchor="start">For the explicit diagonal inclusion N ⊂ M₃(T) with T ≅ M₂(T)</text>
<rect x="40" y="113" width="152" height="152" rx="12" class="box"/>
<rect x="54" y="173" width="124" height="23" rx="4" fill="#dce9e8"/>
<rect x="54" y="173" width="124" height="23" rx="4" fill="#2c7779"/>
<text x="116" y="145" class="label" text-anchor="middle">c₁</text>
<text x="116" y="223" class="small" text-anchor="middle">cᵢ ∈ N</text>
<text x="116" y="249" class="small" text-anchor="middle">τN(1) = 1</text>
<rect x="222" y="113" width="152" height="152" rx="12" class="box"/>
<rect x="236" y="173" width="124" height="23" rx="4" fill="#dce9e8"/>
<rect x="236" y="173" width="124" height="23" rx="4" fill="#2c7779"/>
<text x="298" y="145" class="label" text-anchor="middle">c₂</text>
<text x="298" y="223" class="small" text-anchor="middle">cᵢ ∈ N</text>
<text x="298" y="249" class="small" text-anchor="middle">τN(1) = 1</text>
<rect x="404" y="113" width="152" height="152" rx="12" class="box"/>
<rect x="418" y="173" width="124" height="23" rx="4" fill="#dce9e8"/>
<rect x="418" y="173" width="124" height="23" rx="4" fill="#2c7779"/>
<text x="480" y="145" class="label" text-anchor="middle">c₃</text>
<text x="480" y="223" class="small" text-anchor="middle">cᵢ ∈ N</text>
<text x="480" y="249" class="small" text-anchor="middle">τN(1) = 1</text>
<rect x="586" y="113" width="152" height="152" rx="12" class="box"/>
<rect x="600" y="173" width="124" height="23" rx="4" fill="#dce9e8"/>
<rect x="600" y="173" width="124" height="23" rx="4" fill="#2c7779"/>
<text x="662" y="145" class="label" text-anchor="middle">c₄</text>
<text x="662" y="223" class="small" text-anchor="middle">cᵢ ∈ N</text>
<text x="662" y="249" class="small" text-anchor="middle">τN(1) = 1</text>
<rect x="768" y="113" width="152" height="152" rx="12" class="box"/>
<rect x="782" y="173" width="124" height="23" rx="4" fill="#dce9e8"/>
<rect x="782" y="173" width="62" height="23" rx="4" fill="#c1753c"/>
<text x="844" y="145" class="label" text-anchor="middle">c₅</text>
<text x="844" y="223" class="small" text-anchor="middle">c₅ ∈ p₀N</text>
<text x="844" y="249" class="small" text-anchor="middle">τN(p₀) = ½</text>
<text x="480" y="287" class="small" text-anchor="middle">Right N-module coordinates</text>
<text x="480" y="317" class="eq" text-anchor="middle">L²(M) ≅ L²(N)⁴ ⊕ p₀L²(N)</text>
<text x="480" y="345" class="eq" text-anchor="middle">Index = 1 + 1 + 1 + 1 + ½ = 9⁄2</text>
<rect x="40" y="374" width="880" height="82" rx="12" class="box"/>
<text x="480" y="406" class="eq" text-anchor="middle">x = u₁c₁ + u₂c₂ + u₃c₃ + u₄c₄ + u₅c₅</text>
<text x="480" y="437" class="small" text-anchor="middle">cᵢ = E_N(uᵢ* x); coefficients multiply on the right</text>
<rect x="40" y="479" width="430" height="129" rx="12" fill="#e4eeed"/>
<rect x="490" y="479" width="430" height="129" rx="12" fill="#f3e8dd"/>
<text x="61" y="513" class="label" text-anchor="start">Basis support in N</text>
<text x="61" y="549" class="eq" text-anchor="start">p₀ = ι(r),  τN(p₀) = ½</text>
<text x="61" y="583" class="small" text-anchor="start">Supports the final right coordinate</text>
<text x="511" y="513" class="label" text-anchor="start">Geometric corner in N′ ∩ M</text>
<text x="511" y="549" class="eq" text-anchor="start">q = E₁₁,  τM(q) = ⅓</text>
<text x="511" y="583" class="small" text-anchor="start">Selects the first diagonal block of M</text>
<text x="40" y="637" class="small" text-anchor="start">Bars show projection traces, not spectra or a finite-dimensional model of T.</text>
</svg>
