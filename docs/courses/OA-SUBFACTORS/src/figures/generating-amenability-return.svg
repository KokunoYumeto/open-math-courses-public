<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080">
<title>From an actual generating tunnel to the full compatible hypertrace</title>
<rect width="1120" height="1080" fill="#fafbfc"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315b76"/></marker></defs>
<text x="30" y="43" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172d3d">A generating tunnel gives a compatible hypertrace</text>
<text x="30" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172d3d">N ⊂ M proper finite index;  U ⊂ᴱ V₀ arbitrary smooth expected representation.</text>
<rect x="30" y="112" width="1040" height="150" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#172d3d">Exact downward extension — Theorems 61.13–61.14</text>
<text x="46" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Uⱼ₊₁ = Uⱼ ∩ {gⱼ}′;      each step is normal, faithful, nondegenerate and smooth.</text>
<text x="46" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">One step:  E₋₁(u) = d E(gug);      gug = E₋₁(u)g;      every partial support is retained.</text>
<text x="46" y="237" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Smoothness follows through the actual finite corner and w = λ⁻¹ᐟ²eg, not an infinite map.</text>
<path d="M550 274 L550 306" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="320" width="1040" height="158" rx="10" fill="#eef6eb" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#172d3d">The original physical relative commutants</text>
<text x="46" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Pⱼ = Nⱼ′ ∩ M;      Φⱼ : V₀ → Uⱼ;      Φⱼ|M = E_Nⱼ;      [Pⱼ,Uⱼ] = 0.</text>
<text x="46" y="416" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">For p ∈ Pⱼ:  E_Nⱼ(pa) = E_Nⱼ(ap), by the original trace pairing.</text>
<text x="46" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Finite common rows give Φⱼ(px) = Φⱼ(xp) for every x ∈ V₀.</text>
<path d="M550 490 L550 522" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="536" width="1040" height="137" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#172d3d">Normal compatible states at each depth — Theorem 61.15</text>
<text x="46" y="603" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">ψⱼ is a normal state on Uⱼ extending τ_Nⱼ;      φⱼ = ψⱼ Φⱼ.</text>
<text x="46" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">φⱼ|M = τ;      φⱼE = φⱼ;      φⱼ centralizes the whole Pⱼ.</text>
<path d="M550 685 L550 717" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="731" width="1040" height="153" rx="10" fill="#f6f1e7" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#172d3d">The uniform physical return — equation (61.55)</text>
<text x="46" y="798" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">|φⱼ(mx − xm)| ≤ 2 ‖x‖ ‖m − E_Pⱼ(m)‖₂,τ  → 0, for every fixed m ∈ M.</text>
<text x="46" y="827" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Generation:  (⋃ Pⱼ)″ = M.      Take a cofinal cluster in σ(V₀*, V₀).</text>
<text x="46" y="856" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">The limit is M-central, restricts to τ and preserves E; it may be singular.</text>
<text x="30" y="933" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="bold" fill="#172d3d">Theorem 61.16: strong amenability ⇔ a generating ordinary tunnel</text>
<text x="30" y="973" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172d3d">Proper finite index and separable predual; no extremality or finite depth.</text>
<text x="30" y="1011" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Forward implication: existing SA.7.  Converse: the full state construction above.</text>
<text x="30" y="1048" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">The separate physical bicommutant identity remains unproved here. Positions are schematic.</text>
</svg>
