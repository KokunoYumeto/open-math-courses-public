<text x="47" y="370" class="small">P₀ on r_j: probabilities 2/3, 1/3;  Q₀ on s_k (k ≥ 1): 1/2, 1/2.</text>
<text x="47" y="401" class="math">κ = 1;    t ≤ 3 P₀(t),    t ≤ 2 Q₀(t);    overlap ≤ 2.</text>
<rect x="25" y="442" width="850" height="267" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="479" class="head">2. Interior cancellation leaves only three defects  [69.7–69.9]</text>
<text x="47" y="518" class="small">f_L(s_k) = 2ᵏ for 0 ≤ k &lt; L, and 0 afterward; c_L = (2L − 1)/3.</text>
<rect x="63" y="546" width="229" height="90" rx="9" fill="#e8f1f7" stroke="#789bae"/>
<text x="83" y="579" class="math">s₀</text>
<text x="83" y="613" class="small">weighted defect: 1/9</text>
<rect x="336" y="546" width="229" height="90" rx="9" fill="#e8f1f7" stroke="#789bae"/>
