<text x="629" y="579" class="math">s_L</text>
<text x="629" y="613" class="small">weighted defect: 1/9</text>
<text x="47" y="681" class="math">All interior differences vanish; total ‖f_L − T f_L‖₁ = 4/9.</text>
<rect x="25" y="731" width="850" height="307" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="768" class="head">3. The best larger-center density stays separated  [69.10–69.13]</text>
