<text x="34" y="1080" class="small">Each of L active larger fibers has optimal unnormalized cost 1/6.</text>
<text x="34" y="1114" class="small">Proved: no modulus from stationarity alone, even for this one fixed model.</text>
<text x="34" y="1146" class="small">Actual general core localization still requires projection information.</text>
