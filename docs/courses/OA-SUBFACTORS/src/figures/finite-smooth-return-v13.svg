<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210">
<title>Finite smooth representation selected by a compatible state</title>
<desc>Exact support-corner and centralizer maps, arbitrary finite tower smoothness, original expectation mismatch and preserved cost minimum. CC0 1.0.</desc>
<rect width="1800" height="1210" fill="#f7f8fc"/>
<text x="60" y="61" font-family="Segoe UI, sans-serif" font-size="36" font-weight="600" fill="#172033">A finite smooth representation selected by one compatible state</text>
<text x="60" y="105" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#415274">TR12.1–TR12.20  |  physical N subset M and original E, P₀, τ, TrA, TrB retained</text>
<rect x="60" y="160" width="480" height="145" rx="15" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
<rect x="60" y="395" width="480" height="125" rx="15" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
<rect x="660" y="160" width="480" height="145" rx="15" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
<rect x="660" y="395" width="480" height="125" rx="15" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
<rect x="1260" y="160" width="480" height="145" rx="15" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
<rect x="1260" y="395" width="480" height="125" rx="15" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
<text x="84" y="206" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#172033">Original B = &lt;M, eR&gt;</text>
<text x="84" y="248" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#172033">Compatible M-central ψ, ψ|M = τ</text>
<text x="84" y="283" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#526481">Original center restriction may be singular</text>
<text x="684" y="206" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#172033">B^q = qB**q</text>
<text x="684" y="249" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#172033">q = supp ψ = supp(ψ|A**)</text>
<text x="684" y="284" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#526481">φ is normal and faithful on B^q</text>
<text x="1284" y="203" font-family="Segoe UI, sans-serif" font-size="27" font-weight="600" fill="#172033">Vψ = centralizer of φ in B^q</text>
<text x="1284" y="247" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#172033">τψ = φ|Vψ is finite, normal, faithful</text>
<text x="1284" y="283" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#526481">Γψ comes from bounded right actions</text>
<line x1="548" y1="225" x2="648" y2="225" stroke="#526481" stroke-width="4"/>
<polygon points="648,225 636,217 636,233" fill="#526481"/>
<text x="558" y="186" font-family="Segoe UI, sans-serif" font-size="23" font-weight="600" fill="#172033">qTq</text>
<text x="555" y="272" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#172033">UCP</text>
<line x1="1148" y1="225" x2="1248" y2="225" stroke="#526481" stroke-width="4"/>
<polygon points="1248,225 1236,217 1236,233" fill="#526481"/>
<text x="1171" y="186" font-family="Segoe UI, sans-serif" font-size="23" font-weight="600" fill="#172033">Γψ</text>
<text x="1155" y="271" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#172033">normal UCP</text>
<line x1="300" y1="317" x2="300" y2="384" stroke="#526481" stroke-width="4"/>
<polygon points="300,384 292,372 308,372" fill="#526481"/>
<text x="315" y="360" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172033">E</text>
<line x1="900" y1="317" x2="900" y2="384" stroke="#526481" stroke-width="4"/>
<polygon points="900,384 892,372 908,372" fill="#526481"/>
<text x="915" y="360" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172033">Eᵠ</text>
<line x1="1500" y1="317" x2="1500" y2="384" stroke="#526481" stroke-width="4"/>
<polygon points="1500,384 1492,372 1508,372" fill="#526481"/>
<text x="1515" y="360" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172033">Eψ</text>
<text x="84" y="437" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#172033">Original A = &lt;N, eR&gt;</text>
<text x="84" y="480" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#172033">Canonical normal faithful expectation E</text>
<text x="684" y="437" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#172033">A^q = qA**q</text>
<text x="684" y="480" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#172033">Eᵠ = E**|B^q, original restriction EΝ</text>
<text x="1284" y="437" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#172033">Uψ = A^q ∩ Vψ</text>
<text x="1284" y="481" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#172033">Eψ preserves the finite trace τψ</text>
<line x1="548" y1="455" x2="648" y2="455" stroke="#526481" stroke-width="4"/>
<polygon points="648,455 636,447 636,463" fill="#526481"/>
<text x="558" y="433" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#172033">qTq</text>
<line x1="1148" y1="455" x2="1248" y2="455" stroke="#526481" stroke-width="4"/>
<polygon points="1248,455 1236,447 1236,463" fill="#526481"/>
<text x="1171" y="433" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#172033">Γψ</text>
<rect x="60" y="555" width="790" height="275" rx="15" fill="#eef4ff" stroke="#c9d2e3" stroke-width="2"/>
<text x="85" y="603" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#172033">Physical embeddings at every finite stage</text>
<text x="85" y="649" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">j(m) = qm is a faithful normal *-homomorphism.</text>
<text x="85" y="687" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">L**(q)ij = δij qfi; repeat with each physical basis.</text>
<text x="85" y="725" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">The same Jones cups and expectations remain.</text>
<text x="85" y="763" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">N′ ∩ Mj commutes with Uψ for every finite j.</text>
<text x="85" y="800" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#172033">Both original physical relative-commutant traces remain.</text>
<rect x="885" y="555" width="855" height="275" rx="15" fill="#f3f0ff" stroke="#c9d2e3" stroke-width="2"/>
<text x="910" y="603" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#172033">The original center expectation is different</text>
<text x="910" y="649" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">αP₀ = θα,   θ = ℓ/w;   α = τψ|jψ(D₀)″.</text>
<text x="910" y="687" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">The α-preserving map is Pα(t) = P₀(θ⁻¹t).</text>
<text x="910" y="725" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">Λψ fixes the image jψ(t) = qι(t)q.</text>
<text x="910" y="763" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">α(P₀ log θ − log θ) = α((θ − 1) log θ) ≥ 0.</text>
<text x="910" y="800" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#172033">The constructed finite trace keeps this original test.</text>
<rect x="60" y="865" width="1680" height="225" rx="15" fill="#ffffff" stroke="#3c577f" stroke-width="2"/>
<text x="85" y="912" font-family="Segoe UI, sans-serif" font-size="29" font-weight="600" fill="#172033">Exact original-state return and preserved minimum</text>
<text x="85" y="956" font-family="Segoe UI, sans-serif" font-size="27" font-weight="400" fill="#172033">Λψ(T) = Γψ(qTq),   EψΛψ = ΛψE,   τψΛψ = ψ.</text>
<text x="85" y="997" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#172033">Every compatible η returns to ηΛψ on original B. If ψ(J_e) = 0, then Λψ(J_e) = 0.</text>
<text x="85" y="1038" font-family="Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#172033">At an original minimizer m:  minη η(Λψ(a)) = m, attained by τψ. Here a is the original cost.</text>
<text x="85" y="1075" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#8a2a2a">The unrestricted existence of an original joint-balanced state remains unproved.</text>
<text x="60" y="1155" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#172033">Proof: TR12.1–TR12.20. Human context: Popa (1994), §§2.3–2.4, Definition 3.1.1 and Proposition 3.2.2.</text>
<text x="60" y="1190" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#526481">Schematic boxes and arrows; areas do not encode trace masses. CC0 1.0.</text>
</svg>
