<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1110" viewBox="0 0 1560 1110">
<rect width="1560" height="1110" fill="#fafbf9"/>
<text x="60" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#172e35">All five original likelihoods: finite averages and cost bounds</text>
<text x="60" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#172e35">Fixed λ = 1 + δ,  δ = 2⁻³¹ 25⁻¹⁹⁸¹⁵³;   qi = Ri⁻¹;   Q = Σi qi</text>
<rect x="60" y="155" width="1440" height="168" rx="18" fill="#e9f0e5" stroke="#245c74" stroke-width="2"/>
<text x="85" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#172e35">Actual pointwise dimension and tangent identities — FM21.3–FM21.4</text>
<text x="85" y="249" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#172e35">Σi βi⁻¹(qi) = d;     H = Q − d + K(w1 − R1) ≥ 0</text>
<text x="85" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#172e35">H = Σi (Ri − wi)² / (wi² Ri);    C = Σi |qi − wi⁻¹|</text>
<rect x="60" y="405" width="682" height="205" rx="18" fill="#e8f0f3" stroke="#245c74" stroke-width="2"/>
<text x="85" y="454" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172e35">Original full-H average AL — every seed</text>
<text x="85" y="498" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#172e35">Actual WM.16 sets retain central parity.</text>
<text x="85" y="542" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#172e35">‖AL(Q) − d‖ ≤ 4(d − 1)/(2L + 1).</text>
<text x="85" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#172e35">No normality assumption on the seed.</text>
<rect x="818" y="405" width="682" height="205" rx="18" fill="#e8f0f3" stroke="#245c74" stroke-width="2"/>
<text x="843" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#172e35">Parity-balanced finite average — FM21.10</text>
<text x="843" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">Abar_L = ½ A_L(id + β1);</text>
<text x="843" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">Abar_L β1 = Abar_L, on the full center.</text>
<text x="843" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">‖Abar_L(Q) − d‖ ≤ 3(d − 1)/(2L + 1).</text>
<line x1="402" y1="323" x2="402" y2="405" stroke="#245c74" stroke-width="4"/>
<polygon points="402.00,405.00 393.85,390.08 410.15,390.08" fill="#245c74"/>
<line x1="1158" y1="323" x2="1158" y2="405" stroke="#245c74" stroke-width="4"/>
<polygon points="1158.00,405.00 1149.85,390.08 1166.15,390.08" fill="#245c74"/>
<rect x="60" y="700" width="682" height="205" rx="18" fill="#e8f0f3" stroke="#245c74" stroke-width="2"/>
<text x="85" y="748" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#172e35">Concrete finite original cost — FM21.16</text>
<text x="85" y="792" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">Original L* = 208 δ⁻²; balanced L* = 156 δ⁻².</text>
<text x="85" y="836" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">For every actual seed:  φL*(C) &lt; 19 δ.</text>
<text x="85" y="880" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">All five discrepancy terms are controlled.</text>
<rect x="818" y="700" width="682" height="205" rx="18" fill="#e9f0e5" stroke="#245c74" stroke-width="2"/>
<text x="843" y="748" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#172e35">Every original compatible state — FM21.14</text>
<text x="843" y="792" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">Invariant ω gives ω(Q) = d exactly.</text>
<text x="843" y="836" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">Cω ≤ 2δ √(d/λ) + 4(λ − λ⁻¹) &lt; 18δ.</text>
<text x="843" y="880" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#172e35">Original physical return and cost retained.</text>
<line x1="402" y1="610" x2="402" y2="700" stroke="#245c74" stroke-width="4"/>
<polygon points="402.00,700.00 393.85,685.08 410.15,685.08" fill="#245c74"/>
<line x1="1158" y1="610" x2="1158" y2="700" stroke="#245c74" stroke-width="4"/>
<polygon points="1158.00,700.00 1149.85,685.08 1166.15,685.08" fill="#245c74"/>
<rect x="60" y="975" width="1440" height="86" rx="18" fill="#f5ead3" stroke="#245c74" stroke-width="2"/>
<text x="85" y="1024" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172e35">The endpoint ω(R1) = λ/(4+λ) remains unresolved; no positive cost floor is claimed.</text>
<text x="60" y="1099" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#172e35">Physical τ, EA/P0, both canonical traces, all five Ri and singular states remain original.</text>
</svg>
