<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1460" viewBox="0 0 1120 1460">
<rect width="1120" height="1460" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#375f78"/></marker></defs>
<text x="30" y="43" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" fill="#172f44">An ordinary core generates itself</text>
<text x="30" y="79" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#172f44">Proper finite index d &gt; 1; inherited physical trace τ; original ordinary cups.</text>
<rect x="30" y="110" width="1040" height="175" rx="10" fill="#eaf3f8" stroke="#8daabd" stroke-width="2"/>
<text x="47" y="142" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#172f44">Actual restricted tower inside R — equation (17.43)</text>
<text x="47" y="180" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" fill="#172f44">R = A₀   ⊃   A₁ = S   ⊃   A₂   ⊃   A₃   ⊃   · · ·</text>
<text x="47" y="216" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">Aⱼ = R ∩ Lⱼ.  Original gⱼ ∈ Aⱼ;  E_(Aⱼ₊₁)(gⱼ) = 1/d.</text>
<text x="47" y="253" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">Every restricted expectation is normal and faithful.  Provider 51.1.</text>
<path d="M550,297 L550,330" stroke="#375f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="343" width="1040" height="240" rx="10" fill="#edf5e9" stroke="#8daabd" stroke-width="2"/>
<text x="47" y="377" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#172f44">Full supported matrix corner — Theorem 17.14</text>
<text x="47" y="416" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">P = Aⱼ₊₂,  Q = Aⱼ₊₁,  A = Aⱼ;  common partial row (aᵣ), supports fᵣ.</text>
<text x="47" y="453" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">f Matₙ(P) f  ⟶  A,       Ψ(C) = Σᵣ,ₛ aᵣ Cᵣₛ gⱼ aₛ*</text>
<text x="47" y="491" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">Σᵣ aᵣ gⱼ aᵣ* = 1.  The finite row proves full range, not just density.</text>
<text x="47" y="529" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">τ(Ψ(C)) = (1/d) Σᵣ τ(Cᵣᵣ);    canonical Tr = d τ on the whole positive cone.</text>
<text x="47" y="564" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">All central blocks and fractional supports remain.  No factoriality is used.</text>
<path d="M550,595 L550,628" stroke="#375f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="640" width="1040" height="175" rx="10" fill="#eaf3f8" stroke="#8daabd" stroke-width="2"/>
<text x="47" y="674" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#172f44">Factor endpoints give an actual generating tunnel — Theorem 17.15</text>
<text x="47" y="712" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">If S and R are factors, every Aⱼ is a II₁ factor by the full cup corners.</text>
<text x="47" y="750" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">Lⱼ′ ∩ M  ⊂  Aⱼ′ ∩ R;    the left-hand union already generates R.</text>
<text x="47" y="788" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">Thus the whole internal core is S ⊂ R, and 61.15 gives full strong amenability.</text>
<path d="M550,827 L550,860" stroke="#375f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="874" width="1040" height="157" rx="10" fill="#f5f0e7" stroke="#8daabd" stroke-width="2"/>
<text x="47" y="908" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#172f44">Whole-pair model isomorphism — Theorem 17.16</text>
<text x="47" y="946" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">α : (N ⊂ M) ≅ (S ⊂ R)  pulls every Aⱼ, cup and partial row back into M.</text>
<text x="47" y="984" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">This is an ordinary generating tunnel for the original whole pair.</text>
<text x="47" y="1019" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">Proper / separable: strong amenability ⇔ global approximation ⇔ generation ⇔ model.</text>
<text x="30" y="1071" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#172f44">An abstract represented copy need not be an embedded core of fixed larger factors.</text>
<text x="30" y="1107" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#172f44">Popa 4.1.2(i)–(v), p.210; 5.1.1, p.226.  The physical bicommutant is separate.</text>
<rect x="30" y="1150" width="1040" height="260" rx="10" fill="#edf0fa" stroke="#8daabd" stroke-width="2"/>
<text x="47" y="1188" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#172f44">Extremality: full opposite-model characterization — Theorem 17.18</text>
<text x="47" y="1227" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">ρ : (S ⊂ R)  →  (B₁ ⊂ B₀), normal anti; CTS.7 needs no amenability.</text>
<text x="47" y="1265" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">β : (N ⊂ M) → (B₁ ⊂ B₀), the supplied normal whole-pair anti-isomorphism.</text>
<text x="47" y="1303" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">α = ρ⁻¹ β : (N ⊂ M) → (S ⊂ R) has TWO multiplication reversals.</text>
<text x="47" y="1341" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">It is a normal trace-preserving isomorphism; 17.16 gives strong amenability.</text>
<text x="47" y="1380" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#172f44">Without extremality the index-ten trace obstruction63.9 remains.</text>
</svg>
