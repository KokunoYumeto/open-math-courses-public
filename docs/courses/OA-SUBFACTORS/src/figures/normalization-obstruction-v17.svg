<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510"><rect width="1800" height="1510" fill="#f7f8fb"/><text x="65" y="83" fill="#17243b" font-family="Arial" font-size="45" font-weight="700">Probability normalization does not force a zero RN character</text><text x="65" y="130" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">Exact amenable H action on K = F2((t)); beta_g F(x) = F(g^-1 x)</text><rect x="65" y="161" width="1670" height="222" rx="18" fill="#e8f0fc" stroke="#a8b5ca" stroke-width="3"/><text x="95" y="217" fill="#17243b" font-family="Arial" font-size="33" font-weight="700">Explicit faithful probability  [NZ.2–NZ.4]</text><text x="95" y="265" fill="#17243b" font-family="Arial" font-size="30" font-weight="400">dmu = (2/3) f dm;  m(O) = 1;  f = 1 on O,  f = |x|^-2 outside O</text><text x="95" y="316" fill="#17243b" font-family="Arial" font-size="30" font-weight="400">mu(O) = 2/3;   mu(K \ O) = 1/3;   integral f dm = 3/2</text><text x="95" y="362" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">T: x -&gt; t^-1 x expands the norm by 2.  az: x -&gt; x+1 preserves this probability.</text><rect x="65" y="419" width="793" height="257" rx="18" fill="#edf7ef" stroke="#8bb799" stroke-width="3"/><text x="94" y="474" fill="#17243b" font-family="Arial" font-size="32" font-weight="700">Normal RN derivative  [NZ.8–NZ.9]</text><text x="94" y="524" fill="#17243b" font-family="Arial" font-size="30" font-weight="400">D_T = 1/2 on O;  D_T = 2 outside O</text><text x="94" y="577" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">mu(D_T) = (1/2)(2/3) + 2(1/3) = 1</text><text x="94" y="628" fill="#17243b" font-family="Arial" font-size="25" font-weight="400">All fixed-word derivatives are boundedly invertible.</text><rect x="920" y="419" width="815" height="257" rx="18" fill="#fff1e7" stroke="#c8a17f" stroke-width="3"/><text x="950" y="474" fill="#17243b" font-family="Arial" font-size="32" font-weight="700">Every invariant state  [NZ.10–NZ.11]</text><text x="950" y="521" fill="#17243b" font-family="Arial" font-size="27" font-weight="400">omega(1_B_N) = 0 for every compact ball B_N</text><text x="950" y="583" fill="#17243b" font-family="Arial" font-size="34" font-weight="700">omega(log D_T) = log 2 &gt; 0</text><text x="950" y="630" fill="#17243b" font-family="Arial" font-size="27" font-weight="400">Three actual translation labels: total = 3 log 2.</text><line x1="858" y1="546" x2="920" y2="546" stroke="#3f658d" stroke-width="5"/><polygon points="920,546 903,536 903,556" fill="#3f658d"/><text x="70" y="746" fill="#17243b" font-family="Arial" font-size="31" font-weight="700">Compact-ball inclusions and disjoint translations  [NZ.10]</text><rect x="90" y="773" width="257" height="72" rx="18" fill="#ffffff" stroke="#a8b5ca" stroke-width="3"/><text x="108" y="816" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">O</text><rect x="385" y="773" width="257" height="72" rx="18" fill="#ffffff" stroke="#a8b5ca" stroke-width="3"/><text x="403" y="816" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">B_1 = t^-1 O</text><rect x="680" y="773" width="257" height="72" rx="18" fill="#ffffff" stroke="#a8b5ca" stroke-width="3"/><text x="698" y="816" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">B_2 = t^-2 O</text><line x1="347" y1="809" x2="385" y2="809" stroke="#3f658d" stroke-width="5"/><polygon points="385,809 368,799 368,819" fill="#3f658d"/><line x1="642" y1="809" x2="680" y2="809" stroke="#3f658d" stroke-width="5"/><polygon points="680,809 663,799 663,819" fill="#3f658d"/><text x="999" y="809" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">Haar volumes: 1, 2, 4, ...</text><text x="999" y="846" fill="#17243b" font-family="Arial" font-size="24" font-weight="400">Inclusions only; no metric scale encoded.</text><text x="95" y="908" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">For each N, arbitrarily many disjoint b+B_N exist with b in F2[t,t^-1].</text><text x="95" y="953" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">Finite additivity: r omega(1_B_N) &lt;= 1 for every r; therefore omega(1_B_N) = 0.</text><rect x="65" y="1001" width="1670" height="339" rx="18" fill="#f0edf9" stroke="#b4a4cb" stroke-width="3"/><text x="94" y="1060" fill="#17243b" font-family="Arial" font-size="34" font-weight="700">Separate fixed weighted center Z(W)  [NZ.6]</text><text x="94" y="1113" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">Actual plane-parity lamps give X = sum_r b_r t^-r, normally in K.</text><text x="94" y="1163" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">Full original derivative D_g</text><text x="978" y="1163" fill="#17243b" font-family="Arial" font-size="29" font-weight="400">Affine factor derivative Dbar_g</text><line x1="531" y1="1155" x2="931" y2="1155" stroke="#755a9d" stroke-width="5"/><polygon points="931,1155 914,1145 914,1165" fill="#755a9d"/><text x="563" y="1204" fill="#755a9d" font-family="Arial" font-size="25" font-weight="400">normal E_muU(. | X)</text><text x="94" y="1259" fill="#17243b" font-family="Arial" font-size="27" font-weight="400">Invariant states also escape all compact X-balls.  The two normal laws remain distinct.</text><text x="94" y="1308" fill="#17243b" font-family="Arial" font-size="26" font-weight="400">log Dbar_g is not asserted equal to E(log D_g | X); singular means need not commute with E.</text><text x="65" y="1420" fill="#17243b" font-family="Arial" font-size="29" font-weight="700">The explicit action disproves the general forcing principle; it is not the fixed subfactor model.</text><text x="65" y="1471" fill="#17243b" font-family="Arial" font-size="27" font-weight="400">The original zero-translation endpoint still requires a proof on full Z(W), with its two trace identities.</text></svg>