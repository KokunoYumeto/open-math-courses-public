<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1330" viewBox="0 0 900 1330">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#294961"/></marker></defs>
<rect width="900" height="1330" fill="#f7fafc"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="29" fill="#17354b" font-weight="bold">Keep every initial support</text>
<text x="32" y="76" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Unequal columns → one exact transported projection → finite local approximation</text>
<rect x="24" y="104" width="852" height="282" rx="5" fill="white" stroke="#c9d6df"/>
<rect x="24" y="412" width="852" height="408" rx="5" fill="white" stroke="#c9d6df"/>
<rect x="24" y="848" width="852" height="386" rx="5" fill="white" stroke="#c9d6df"/>
<text x="44" y="141" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">1. Overlap of initial supports does not consume extra range</text>
<text x="44" y="176" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Lemma 74.1: Σ τ(rᵢ) ≤ 1;  yᵢ = yᵢrᵢ;  vᵢ* vⱼ = δᵢⱼrᵢ</text>
<text x="44" y="211" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">Initial supports (M₈ example)</text>
<text x="455" y="211" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">Orthogonal final projections</text>
<rect x="44" y="229" width="170" height="28" rx="5" fill="#267aab" stroke="none"/>
<text x="226" y="251" font-family="Arial,sans-serif" font-size="18" fill="#17354b" font-weight="normal">r₁: trace 1/4</text>
<rect x="44" y="273" width="85" height="28" rx="5" fill="#7e5da8" stroke="none"/>
<text x="141" y="295" font-family="Arial,sans-serif" font-size="18" fill="#17354b" font-weight="normal">r₂: trace 1/8</text>
<rect x="44" y="317" width="85" height="28" rx="5" fill="#389984" stroke="none"/>
<text x="141" y="339" font-family="Arial,sans-serif" font-size="18" fill="#17354b" font-weight="normal">r₃: trace 1/8</text>
<path d="M360 285L430 285" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="455" y="249" width="170" height="48" rx="5" fill="#267aab" stroke="none"/>
<rect x="628" y="249" width="85" height="48" rx="5" fill="#7e5da8" stroke="none"/>
<rect x="716" y="249" width="85" height="48" rx="5" fill="#389984" stroke="none"/>
<text x="455" y="332" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">τ(g) = 1/4 + 1/8 + 1/8 = 1/2</text>
<text x="455" y="365" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">The initial projections may overlap.</text>
<text x="44" y="450" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">2. Transport the variable diagonal projection exactly</text>
<text x="44" y="485" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Illustrative data: f₁ = 1, f₂ = z, f₃ = 0; τ(z) = 1/4</text>
<text x="44" y="518" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">L = 3, c = 5/4, τ(q) = 1/24, ρ = 7/8, λ = 1/7</text>
<rect x="55" y="552" width="126" height="118" rx="5" fill="#edf2f5" stroke="#ccd7df"/>
<rect x="59" y="554" width="118" height="112" rx="5" fill="#267aab" stroke="none"/>
<text x="60" y="698" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">d₁₁f₁</text>
<rect x="215" y="552" width="126" height="118" rx="5" fill="#edf2f5" stroke="#ccd7df"/>
<rect x="219" y="638" width="118" height="28" rx="5" fill="#7e5da8" stroke="none"/>
<text x="220" y="698" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">d₂₂f₂</text>
<rect x="375" y="552" width="126" height="118" rx="5" fill="#edf2f5" stroke="#ccd7df"/>
<text x="380" y="698" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">d₃₃f₃</text>
<text x="55" y="731" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">F = d₁₁ + d₂₂z ∈ Bₗ</text>
<text x="55" y="763" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">τ(F) = 35/96</text>
<path d="M530 596L593 596" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="615" y="547" width="221" height="126" rx="5" fill="#e7f2ee" stroke="#75a99a"/>
<text x="635" y="581" font-family="Arial,sans-serif" font-size="22" fill="#17354b" font-weight="bold">H = s⁰F ∈ S</text>
<text x="635" y="617" font-family="Arial,sans-serif" font-size="22" fill="#17354b" font-weight="normal">τ(H) = 5/96</text>
<text x="635" y="650" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">s⁰ ∈ Nₗ ∩ S</text>
<text x="540" y="725" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">T₀* T₀ = H;  T₀ T₀* = g</text>
<text x="540" y="762" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">V ∈ U(N):  VHV* = g</text>
<text x="44" y="801" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">74.13–74.18: no column deletion and no additional padded identity.</text>
<text x="44" y="888" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">3. What the estimates prove</text>
<rect x="45" y="912" width="810" height="96" rx="5" fill="#e9f4ed" stroke="#8bb49b"/>
<text x="62" y="943" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="bold">g ∈ VSV*, τ(g) = cτ(q) &gt; 0</text>
<text x="62" y="978" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Small commutators and small compression distance (Theorem 74.2)</text>
<path d="M450 1010L450 1052" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="1060" width="810" height="79" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<text x="62" y="1090" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="bold">sⱼ = 1[1/2,1](E_Bⱼ(g)) ∈ Bⱼ</text>
<text x="62" y="1123" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">Finite local form for every finite test set and trace cap (74.3–74.4)</text>
<path d="M740 1141L740 1172" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="44" y="1196" font-family="Arial,sans-serif" font-size="19" fill="#8c5035" font-weight="normal">Common central support / unrestricted global and generating conclusions: open</text>
<text x="32" y="1256" font-family="Arial,sans-serif" font-size="15" fill="#17354b" font-weight="normal">Proof locators 74.1–74.24. First local form: Popa, Theorem 4.3.1, pp. 217–219.</text>
<text x="32" y="1279" font-family="Arial,sans-serif" font-size="15" fill="#17354b" font-weight="normal">Rounding motivation: 4.2.2, pp. 213–214. Polar completion: Appendix A.2.1, pp. 249–251.</text>
<text x="32" y="1302" font-family="Arial,sans-serif" font-size="15" fill="#17354b" font-weight="normal">Schematic objects and trace arithmetic; not a prescribed Jones-core model.</text>
</svg>
