<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900">
<rect width="1120" height="900" fill="#fafbfc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315b76"/></marker></defs>
<text x="30" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#172d3d" font-weight="bold">One common tensor factor in the actual upper opposite tower</text>
<text x="30" y="79" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">d = [M:N] &gt; 1;  B_j = M_j′ ∩ T;  all traces are the inherited physical trace τ.</text>
<rect x="30" y="125" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="158" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">B₁</text>
<text x="46" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">= A_j ⊗ R₀ at stage j</text>
<rect x="390" y="125" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="406" y="158" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">B₀</text>
<text x="406" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">= A_j ⊗ R₀ at stage j</text>
<rect x="750" y="125" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="766" y="158" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">B₋₁</text>
<text x="766" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">= A_j ⊗ R₀ at stage j</text>
<path d="M337 175 L382 175" fill="none" stroke="#315b76" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M697 175 L742 175" fill="none" stroke="#315b76" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="150" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">E₀ : B₀ → B₁</text>
<text x="640" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">q₀ ∈ B₋₁;  Tr₀ = dτ</text>
<rect x="30" y="300" width="1020" height="125" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="333" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">Split the binary sites, retaining a full copy in the complement</text>
<text x="46" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">R₀ = R_even ⊗ R_odd;    H = R_odd ⊂ B₁;    θ : R₀ → R_even reindexes the sites.</text>
<text x="46" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">B_j⁰ = H′ ∩ B_j = A_j ⊗ R_even;     Ψ_j = id_{A_j} ⊗ θ, for every j ≤ 1.</text>
<rect x="30" y="480" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="513" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">B₁⁰</text>
<text x="46" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">= A_j ⊗ R_even</text>
<rect x="390" y="480" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="406" y="513" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">B₀⁰</text>
<text x="406" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">= A_j ⊗ R_even</text>
<rect x="750" y="480" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="766" y="513" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">B₋₁⁰</text>
<text x="766" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">= A_j ⊗ R_even</text>
<path d="M337 530 L382 530" fill="none" stroke="#315b76" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M697 530 L742 530" fill="none" stroke="#315b76" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="620" width="1020" height="119" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="653" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">Both cup conventions and both expectations are retained</text>
<text x="46" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">Ψ_{j−1}(e_j) = e_j;   Ψ_{j−1}(q_j) = q_j;   Ψ_j(h_j) = h_j, for j ≤ 0.</text>
<text x="46" y="714" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">q_j = h_j^(−1/2) e_j h_j^(−1/2);    F_j(x) = E_j(h_j^(1/2) x h_j^(1/2)).</text>
<rect x="30" y="770" width="1020" height="98" rx="10" fill="#fff0e9" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="803" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">Any prescribed unital D ≅ Mat_n in B₁</text>
<text x="46" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">One unitary in B₁ conjugates D into R₀; compatible maps give B_j ≅ D′ ∩ B_j.</text>
<text x="31" y="893" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#172d3d" font-weight="normal">Theorem 50.7 and (50.24)–(50.28). Subscripts decrease along the upper tower. Box widths encode no trace masses.</text>
</svg>
