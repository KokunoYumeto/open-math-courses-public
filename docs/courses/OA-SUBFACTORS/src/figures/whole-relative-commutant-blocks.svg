<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1390" viewBox="0 0 900 1390">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#294961"/></marker></defs>
<rect width="900" height="1390" fill="#f7fafc"/>
<text x="32" y="43" font-family="Arial,sans-serif" font-size="29" fill="#17354b" font-weight="bold">Whole finite blocks inside a residual corner</text>
<text x="32" y="79" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Retain f → insert the local algebra in a core → repair a finite-stage support</text>
<rect x="24" y="106" width="852" height="325" rx="5" fill="white" stroke="#c9d6df"/>
<rect x="24" y="453" width="852" height="425" rx="5" fill="white" stroke="#c9d6df"/>
<rect x="24" y="900" width="852" height="416" rx="5" fill="white" stroke="#c9d6df"/>
<text x="44" y="145" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">1. A corner block enters a whole core (76.6–76.7)</text>
<rect x="45" y="166" width="387" height="137" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<rect x="476" y="166" width="377" height="137" rx="5" fill="#e7f2ee" stroke="#75a99a"/>
<text x="61" y="204" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="bold">Retained whole stage: f ∈ N_m</text>
<text x="61" y="243" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">s = fb;  b ∈ B_m</text>
<text x="61" y="282" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">P_s = f(bA_m b)</text>
<path d="M434 234L468 234" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="492" y="204" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="bold">New whole core S₁ ⊂ R₁</text>
<text x="492" y="243" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">f, b, s ∈ S₁;  P_s ⊂ R₁</text>
<text x="492" y="282" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">All a_y ∈ R₁;  R₁ may have center.</text>
<text x="44" y="347" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Cup-tail rotation u ∈ N_m fixes A_m and inserts f into the future core.</text>
<text x="44" y="387" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="bold">s need not lie in N_m. The projection retained in the tail is f.</text>
<text x="44" y="417" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">No BF or second central local form is used.</text>
<text x="44" y="492" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">2. Repair the finite threshold without losing its whole origin</text>
<text x="44" y="533" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">g = 1[1/2,1](E_Bⱼ¹(s));  η = ‖g − s‖₂;  |τ(g) − τ(s)| ≤ η².</text>
<rect x="45" y="554" width="809" height="124" rx="5" fill="#fff3ea" stroke="#cba47b"/>
<text x="63" y="589" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Adjust s within f to r:  r ≤ f,  τ(r) = τ(g),  ‖r − s‖₂ ≤ η.</text>
<text x="63" y="626" font-family="Arial,sans-serif" font-size="22" fill="#17354b" font-weight="bold">v ∈ U(N):  vgv* = r,  ‖v − 1‖₂ ≤ 4η.</text>
<text x="63" y="659" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">r ∈ vBⱼ¹v*;  full finite block r(vAⱼ¹v*)r.</text>
<text x="44" y="719" font-family="Arial,sans-serif" font-size="22" fill="#17354b" font-weight="bold">Compression error ≤ (α/8)√τ(s) + 12R*η + ξ</text>
<text x="44" y="758" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Four support-change units + eight target-conjugation units = twelve.</text>
<text x="44" y="799" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">η &lt; min(√τ(s)/4, α√τ(s)/(128R*));  ξ &lt; α√τ(s)/16.</text>
<text x="44" y="839" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Final normalized errors &lt; 9√2α/32 and 9√2α/64 (76.9–76.12).</text>
<text x="44" y="939" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">3. Retain the prescribed finite prefix (76.13–76.25)</text>
<text x="44" y="978" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Higher index a = d^(k+1);  φE_k = φ;  actual higher core S_k ⊂ R.</text>
<rect x="45" y="999" width="254" height="54" rx="5" fill="#e7f2ee" stroke="#8baac7"/>
<text x="63" y="1035" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">D ⊂ N_k</text>
<rect x="323" y="999" width="254" height="54" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<text x="341" y="1035" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">Q ⊂ N</text>
<rect x="601" y="999" width="254" height="54" rx="5" fill="#fff3ea" stroke="#8baac7"/>
<text x="619" y="1035" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">P ⊂ M</text>
<text x="44" y="1093" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">P = ⊕ P_rᵢ ⊕ fA_k;   Q = ⊕ Q_rᵢ ⊕ fB_k;   D = ⊕ D_rᵢ ⊕ C f.</text>
<text x="44" y="1135" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">E_N(P) = Q;  E_Nₖ(P) = D;  A_k ⊂ P and B_k ⊂ Q exactly.</text>
<text x="44" y="1177" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Selected whole-stage supports: Σ τ(rᵢ) &gt; 1 − θ;  residual τ(f) &lt; θ.</text>
<text x="44" y="1219" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">A unital M₂ ⊂ N_k commutes with P. Every earlier cup is in A_k.</text>
<text x="44" y="1261" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">The selected blocks may use different ordinary continuations of the same prefix.</text>
<text x="44" y="1298" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">The residual is an old corner block; it is retained in the finite square.</text>
<path d="M32 1338H868" stroke="#8c5035" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="32" y="1364" font-family="Arial,sans-serif" font-size="18" fill="#8c5035" font-weight="normal">Exact full whole-stage partition / single-stage alignment / generating tunnel: still open.</text>
<text x="32" y="1385" font-family="Arial,sans-serif" font-size="15" fill="#17354b" font-weight="normal">Proof 76.1–76.25. Popa, 3.2.4(i), 4.3.1, 4.4.1. Domains/support schematic; no geometric subfactor model.</text>
</svg>
