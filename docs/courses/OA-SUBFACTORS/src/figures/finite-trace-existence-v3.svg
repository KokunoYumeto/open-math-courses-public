<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">Constructing normal traces on every finite von Neumann algebra</title><desc id="desc">Trace-free projection comparison makes the unitary orbit hull uniformly small on decreasing projections. Positive compactness puts its closure in the normal predual. Countable subgroup fixed points and compactness give a fixed point for the full unitary group. It is a normal trace with unchanged central values.</desc>
<rect width="1100" height="440" fill="#f7fafc"/><g font-family="Cambria, Georgia, serif" fill="#17364c">
<text x="28" y="42" font-size="28">Normal traces from a positive functional's unitary orbit hull</text>
<text x="28" y="80" font-size="22">M finite; φ positive normal; Kφ is its norm-closed convex unitary orbit hull.</text>
<rect x="25" y="110" width="320" height="183" rx="12" fill="#e5effa" stroke="#7892a8"/>
<text x="42" y="145" font-size="24">Trace-free projection control</text>
<text x="42" y="181" font-size="22">eⱼ orthogonal, fⱼ ∼ eⱼ</text><text x="42" y="214" font-size="22">⇒ fⱼ → 0 σ-strongly</text>
<text x="42" y="246" font-size="21">Uniform decreasing-tail bound</text><text x="42" y="277" font-size="20">TE10–TE11</text>
<rect x="390" y="110" width="320" height="183" rx="12" fill="#e7f4ed" stroke="#7892a8"/>
<text x="407" y="145" font-size="24">Positive weak compactness</text>
<text x="407" y="181" font-size="22">pMp derived from supports</text><text x="407" y="214" font-size="22">All closure points normal</text>
<text x="407" y="246" font-size="21">Kφ weakly compact</text><text x="407" y="277" font-size="20">TE1–TE6</text>
<rect x="755" y="110" width="320" height="183" rx="12" fill="#fff1db" stroke="#7892a8"/>
<text x="772" y="145" font-size="24">Full-group fixed point</text>
<text x="772" y="181" font-size="22">Countable subgroup first</text><text x="772" y="214" font-size="22">Compact finite intersections</text>
<text x="772" y="246" font-size="21">Invariance ⇒ normal trace τφ</text><text x="772" y="277" font-size="20">TE7–TE9, TE12</text>
<g stroke="#526b7d" stroke-width="3" fill="#526b7d"><path d="M349 201H379"/><path d="M714 201H745"/><path d="M375 195L384 201L375 207Z"/><path d="M741 195L750 201L741 207Z"/></g>
<rect x="25" y="319" width="1050" height="82" rx="12" fill="#edf0fa" stroke="#7892a8"/>
<text x="42" y="350" font-size="22">τφ(a) = φ(a) for a ∈ Z(M); normal traces separate every nonzero x ∈ M⁺.</text>
<text x="42" y="383" font-size="22">Nonzero finite factor: τ(1) = 1; τ faithful and unique among all tracial states. TE13–TE15.</text>
<text x="28" y="429" font-size="19">Arrows are proved implications. No separability or cardinality assumption on M or its representation.</text>
</g></svg>
