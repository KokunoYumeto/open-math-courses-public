<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1490" viewBox="0 0 1000 1490">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#426580"/></marker></defs>
<rect width="1000" height="1490" fill="#f2f6fb"/>
<text x="30" y="44" font-family="Arial,sans-serif" font-size="31" fill="#18334b" font-weight="bold">Exact trace certificates close the residual</text>
<text x="30" y="78" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">Actual weights • finite full partition • primitive promotion • precise scope</text>
<rect x="25" y="103" width="950" height="296" rx="12" fill="#fff" stroke="#b9ccdc"/>
<text x="48" y="141" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold">1. A physical support needs an exact finite trace certificate</text>
<rect x="48" y="162" width="415" height="112" rx="12" fill="#eaf2fc" stroke="#b9ccdc"/>
<rect x="538" y="162" width="415" height="112" rx="12" fill="#eaf7f1" stroke="#b9ccdc"/>
<text x="65" y="194" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="normal">Bⱼ = ⊕ℓ Mat_(nⱼℓ)</text>
<text x="65" y="227" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">ranks: 0 ≤ hℓ ≤ nⱼℓ, hℓ integer</text>
<text x="65" y="258" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">minimal weights: ωⱼℓ = τ(eℓ)</text>
<line x1="478" y1="216" x2="522" y2="216" stroke="#426580" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="555" y="194" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="normal">Σℓ ωⱼℓ hℓ = τ(f) exactly</text>
<text x="555" y="228" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="normal">g ∈ Bⱼ with τ(g) = τ(f)</text>
<text x="555" y="261" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="normal">u ∈ N and ugu* = f</text>
<text x="49" y="316" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">Conjugate only the new tunnel:  f ∈ uBⱼu* ⊂ uAⱼu*.</text>
<text x="49" y="351" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="normal">Finite alignment makes the trace set independent of the tunnel choice.</text>
<text x="49" y="382" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">Proof: 78.1–78.3; Theorems 78.2–78.3</text>
<rect x="25" y="420" width="950" height="277" rx="12" fill="#fff" stroke="#b9ccdc"/>
<text x="48" y="458" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold">2. Keep the old square and enlarge its retained corner</text>
<text x="49" y="497" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="bold">Selected whole-stage blocks</text>
<text x="671" y="497" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="bold">Retained residual</text>
<rect x="49" y="517" width="205" height="55" rx="12" fill="#eaf2fc" stroke="#b9ccdc"/>
<rect x="270" y="517" width="205" height="55" rx="12" fill="#eaf2fc" stroke="#b9ccdc"/>
<rect x="491" y="517" width="153" height="55" rx="12" fill="#eaf2fc" stroke="#b9ccdc"/>
<rect x="662" y="517" width="292" height="55" rx="12" fill="#fff1df" stroke="#b9ccdc"/>
<text x="67" y="552" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">P₁ / Q₁</text>
<text x="288" y="552" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">P₂ / Q₂</text>
<text x="539" y="552" font-family="Arial,sans-serif" font-size="27" fill="#18334b" font-weight="normal">…</text>
<text x="679" y="552" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">fA₀ / ℂf</text>
<line x1="808" y1="584" x2="808" y2="618" stroke="#426580" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="49" y="615" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">r₁ + ··· + r_q + f = 1 exactly</text>
<text x="49" y="647" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">P₀ ⊂ P*;   all old blocks and targets stay fixed</text>
<text x="49" y="678" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal">78.4–78.9; EN EP* = EQ*</text>
<text x="669" y="645" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">f(uAⱼu*)f / f(uBⱼu*)f</text>
<text x="669" y="674" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal">contains fA₀ / ℂf</text>
<rect x="25" y="719" width="950" height="322" rx="12" fill="#fff" stroke="#b9ccdc"/>
<text x="48" y="757" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold">3. Primitive example: the scalar trace becomes valid ranks</text>
<text x="49" y="794" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">C = [[2, 1], [1, 2]],  ρ = 3,  v = (−1, 2),  τ(v) = 1/2</text>
<rect x="48" y="821" width="280" height="131" rx="12" fill="#fff1df" stroke="#b9ccdc"/>
<rect x="360" y="821" width="280" height="131" rx="12" fill="#eaf7f1" stroke="#b9ccdc"/>
<rect x="672" y="821" width="280" height="131" rx="12" fill="#eaf7f1" stroke="#b9ccdc"/>
<text x="65" y="853" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="bold">level 0</text>
<text x="377" y="853" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="bold">level 1</text>
<text x="689" y="853" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="bold">level 2</text>
<text x="65" y="885" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">ranks (−1, 2)</text>
<text x="377" y="885" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">ranks (0, 3)</text>
<text x="689" y="885" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">ranks (3, 6)</text>
<text x="65" y="916" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">capacities (1, 1)</text>
<text x="377" y="916" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">capacities (3, 3)</text>
<text x="689" y="916" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">capacities (9, 9)</text>
<text x="65" y="943" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">weights (1/2, 1/2)</text>
<text x="377" y="943" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">weights (1/6, 1/6)</text>
<text x="689" y="943" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">weights (1/18, 1/18)</text>
<line x1="333" y1="887" x2="352" y2="887" stroke="#426580" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="646" y1="887" x2="665" y2="887" stroke="#426580" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="49" y="990" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="normal">Cᵏv ≥ 0 and Cᵏ(n − v) ≥ 0 eventually; the trace remains exactly 1/2.</text>
<text x="49" y="1023" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">Primitive proof: 78.10–78.17; worked system: Example 78.8</text>
<rect x="25" y="1063" width="950" height="316" rx="12" fill="#fff" stroke="#b9ccdc"/>
<text x="48" y="1101" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold">4. Reducible diagnostic: scalar subtraction does not suffice</text>
<text x="49" y="1138" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="normal">α = √2/2,   Fₖ = Mat_(2ᵏ) ⊕ Mat_(2ᵏ),   C = 2I₂</text>
<text x="49" y="1177" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="normal">Two disjoint physical conjugates of (0, 1): each trace = 1 − α.</text>
<text x="49" y="1216" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="normal">Residual trace: 1 − 2(1 − α) = √2 − 1 ∈ (0, 1).</text>
<rect x="49" y="1240" width="901" height="71" rx="12" fill="#fff1df" stroke="#b9ccdc"/>
<text x="67" y="1271" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal">Formal canonical ranks: (1, −1) → (2, −2) → (4, −4) → ···</text>
<text x="67" y="1301" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">Negative second rank at every stage: no finite certificate.</text>
<text x="49" y="1345" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal">Abstract system only; no actual Jones-core or subfactor counterexample.</text>
<text x="49" y="1369" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">78.18–78.21; Example 78.7; Exercise 78.4</text>
<text x="30" y="1420" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="bold">Finite depth supplies a primitive tail with the actual reflected trace (78.6).</text>
<text x="30" y="1449" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">Human source: S. Popa, Classification of amenable subfactors of type II (1994),</text>
<text x="30" y="1475" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal">Theorem 4.4.1(1), printed p.222. General exact partition and generating routes remain assigned.</text>
</svg>
