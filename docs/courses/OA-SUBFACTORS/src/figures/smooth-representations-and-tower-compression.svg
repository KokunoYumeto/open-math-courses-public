<svg xmlns="http://www.w3.org/2000/svg" width="740" height="920" viewBox="0 0 740 920"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs><rect width="740" height="920" fill="white"/>
<text x="26" y="40" font-family="Arial, sans-serif" font-size="25" fill="#17324a" font-weight="bold">Compress first, then use the tracial tower</text>
<text x="26" y="72" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">Conditional hypotheses: T injective; (M′ ∩ T)′ ∩ T = M.</text>
<rect x="18" y="94" width="704" height="333" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="36" y="130" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">1. Keep the original tracial GNS space explicit</text>
<rect x="45" y="167" width="100" height="56" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="87" y="201" font-family="Arial, sans-serif" font-size="22" fill="#17324a" font-weight="normal">V</text>
<rect x="279" y="167" width="184" height="56" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="307" y="201" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">B(L²(T))</text>
<rect x="593" y="167" width="100" height="56" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="631" y="201" font-family="Arial, sans-serif" font-size="22" fill="#17324a" font-weight="normal">T</text>
<line x1="155" y1="195" x2="269" y2="195" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="177" y="176" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">p π(·) p</text>
<line x1="473" y1="195" x2="583" y2="195" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="518" y="176" font-family="Arial, sans-serif" font-size="22" fill="#17324a" font-weight="normal">Θ</text>
<text x="36" y="267" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">H₀ = closure of π(⋃ⱼ Mⱼ)ξ = L²(T).  p commutes with every Mⱼ.</text>
<text x="36" y="303" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">F(v) = Θ(pπ(v)p) lies in T and commutes with M′ ∩ T.</text>
<text x="36" y="339" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">The assumed bicommutant identity gives F(V) ⊂ M.</text>
<text x="36" y="375" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Smoothness gives [F(U),e₀] = 0; Markov faithfulness gives F(U) ⊂ N.</text>
<text x="36" y="409" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Θ and F may be singular. No normal map of an infinite represented tower.</text>
<rect x="18" y="446" width="704" height="191" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="481" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">2. Finite row formula gives full expectation compatibility</text>
<text x="36" y="521" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">T₀ = Σᵢ aᵢ bᵢ,   bᵢ = E(aᵢ* T₀),   cᵢ = E_N(aᵢ).</text>
<text x="36" y="558" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">E(T₀) = Σᵢ cᵢ bᵢ;   E_N F(T₀) = Σᵢ cᵢ F(bᵢ) = F(E(T₀)).</text>
<text x="36" y="605" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">The state τF is M-central and E-compatible. Proof: 61.1, 61.6.</text>
<rect x="18" y="656" width="704" height="179" rx="8" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="691" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">3. The cluster point fixes every tracial tower element</text>
<text x="36" y="731" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">qⱼ projects L²(T) onto L²(Mⱼ); βⱼ projects B(L²(Mⱼ)) onto Mⱼ.</text>
<text x="36" y="769" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Θⱼ(X) = βⱼ(qⱼ X qⱼ);   Θⱼ(x) = E_Mⱼ(x) → x for every x ∈ T.</text>
<text x="36" y="807" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Take a point-ultraweak cluster only after this exact identity. Proof: 61.7.</text>
<text x="26" y="870" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Conditional proof only: full nonextremal bicommutant input remains unproved.</text>
<text x="26" y="901" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Human source: Sorin Popa, DOI 10.1007/BF02392646, §4.5, pp. 223–225.</text>
</svg>