<text x="40" y="846" class="label" text-anchor="start">Additivity and normalization force uniqueness</text>
<text x="40" y="884" class="small" text-anchor="start">t = dimₚ H;  aₙ = floor(nt);  bₙ = ceil(nt)</text>
<text x="40" y="921" class="small" text-anchor="start">aₙ standard copies  ↪  n copies of H  ↪  bₙ copies</text>
<text x="40" y="958" class="small" text-anchor="start">aₙ/n ≤ D(H) ≤ bₙ/n;  interval width ≤ 1/n</text>
