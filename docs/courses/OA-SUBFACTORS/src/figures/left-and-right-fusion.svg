<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1400" role="img" aria-labelledby="title desc">
<title id="title">Two fusion directions and their different roots</title>
<desc id="desc">The right sequence H begins at the N unit, fixes left N, and has endomorphism blocks A n minus one. The left sequence L begins at the M unit, fixes right M, and has blocks opposite B n. Its left endomorphism factors are opposite M n. The dual right sequence K is conjugated to L by reversing the word and taking adjoints. The linear map C a star C inverse reverses products and preserves the dual tower trace. H and L share their odd words, giving A two j isomorphic to opposite B two j plus one. Their even roots differ. In the actual diagonal corner inclusion with t one third and index nine halves, the same odd projection has right endomorphism trace one third and left endomorphism trace two thirds.</desc>
<rect width="560" height="1400" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#15283b}.head{font-size:23px;font-weight:bold}.label{font-size:19px;font-weight:bold}.small{font-size:17px}.word{font-size:18px}</style>
<text x="280" y="36" class="head" text-anchor="middle">The two fusion directions</text>
<rect x="20" y="58" width="520" height="287" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="94" class="label" text-anchor="start">Right fusion: fixed left N, root 1<tspan baseline-shift="sub" font-size="70%">N</tspan></text>
<text x="40" y="127" class="label" text-anchor="start">Word</text>
<text x="292" y="127" class="small" text-anchor="start">Outer factors</text>
<text x="445" y="127" class="small" text-anchor="start">Bimod. End</text>
<text x="40" y="165" class="word" text-anchor="start">H₀ = 1<tspan baseline-shift="sub" font-size="70%">N</tspan></text>
<text x="305" y="165" class="word" text-anchor="start">N–N</text>
<text x="459" y="165" class="word" text-anchor="start">ℂ</text>
<text x="40" y="203" class="word" text-anchor="start">H₁ = X</text>
<text x="305" y="203" class="word" text-anchor="start">N–M</text>
<text x="459" y="203" class="word" text-anchor="start">A₀</text>
<text x="40" y="241" class="word" text-anchor="start">H₂ = X ⊠<tspan baseline-shift="sub" font-size="70%">M</tspan> X̄</text>
<text x="305" y="241" class="word" text-anchor="start">N–N</text>
<text x="459" y="241" class="word" text-anchor="start">A₁</text>
<text x="40" y="279" class="word" text-anchor="start">H₃ = X ⊠<tspan baseline-shift="sub" font-size="70%">M</tspan> X̄ ⊠<tspan baseline-shift="sub" font-size="70%">N</tspan> X</text>
<text x="305" y="279" class="word" text-anchor="start">N–M</text>
<text x="459" y="279" class="word" text-anchor="start">A₂</text>
<text x="40" y="315" class="small" text-anchor="start">Right End: T₀ = N;  Tₙ = Mₙ₋₁ for n ≥ 1</text>
<rect x="20" y="366" width="520" height="287" rx="10" fill="#f0f7f0" stroke="#9cb4cd"/>
<text x="40" y="402" class="label" text-anchor="start">Left fusion: fixed right M, root 1<tspan baseline-shift="sub" font-size="70%">M</tspan></text>
<text x="40" y="435" class="label" text-anchor="start">Word</text>
<text x="292" y="435" class="small" text-anchor="start">Outer factors</text>
<text x="445" y="435" class="small" text-anchor="start">Bimod. End</text>
<text x="40" y="473" class="word" text-anchor="start">L₀ = 1<tspan baseline-shift="sub" font-size="70%">M</tspan></text>
<text x="305" y="473" class="word" text-anchor="start">M–M</text>
<text x="459" y="473" class="word" text-anchor="start">B₀ᵒᵖ</text>
<text x="40" y="511" class="word" text-anchor="start">L₁ = X</text>
<text x="305" y="511" class="word" text-anchor="start">N–M</text>
<text x="459" y="511" class="word" text-anchor="start">B₁ᵒᵖ</text>
<text x="40" y="549" class="word" text-anchor="start">L₂ = X̄ ⊠<tspan baseline-shift="sub" font-size="70%">N</tspan> X</text>
<text x="305" y="549" class="word" text-anchor="start">M–M</text>
<text x="459" y="549" class="word" text-anchor="start">B₂ᵒᵖ</text>
<text x="40" y="587" class="word" text-anchor="start">L₃ = X ⊠<tspan baseline-shift="sub" font-size="70%">M</tspan> X̄ ⊠<tspan baseline-shift="sub" font-size="70%">N</tspan> X</text>
<text x="305" y="587" class="word" text-anchor="start">N–M</text>
<text x="459" y="587" class="word" text-anchor="start">B₃ᵒᵖ</text>
<text x="40" y="623" class="small" text-anchor="start">Left End: Mₙᵒᵖ at every level n ≥ 0</text>
<rect x="20" y="674" width="520" height="261" rx="10" fill="#f2eefb" stroke="#9cb4cd"/>
<text x="40" y="710" class="label" text-anchor="start">Dual right sequence and conjugate reversal</text>
<text x="40" y="748" class="small" text-anchor="start">K₀ = 1<tspan baseline-shift="sub" font-size="70%">M</tspan>;  K₁ = X̄;  K₂ = X̄ ⊠<tspan baseline-shift="sub" font-size="70%">N</tspan> X</text>
<text x="40" y="783" class="small" text-anchor="start">K₃ = X̄ ⊠<tspan baseline-shift="sub" font-size="70%">N</tspan> X ⊠<tspan baseline-shift="sub" font-size="70%">M</tspan> X̄;  outer factors M–Pₙ</text>
<text x="40" y="818" class="small" text-anchor="start">Cₙ: Kₙ → Lₙ is antiunitary; reverses words</text>
<text x="40" y="853" class="small" text-anchor="start">θₙ(a) = Cₙ a* Cₙ⁻¹;  θₙ(ab) = θₙ(b)θₙ(a)</text>
<text x="40" y="891" class="small" text-anchor="start">θₙ preserves the dual tower trace</text>
<rect x="20" y="956" width="520" height="162" rx="10" fill="#fff5e8" stroke="#9cb4cd"/>
<text x="40" y="992" class="label" text-anchor="start">Shared odd words, two even categories</text>
<text x="40" y="1027" class="small" text-anchor="start">H₁ = L₁ = X;  H₃ = L₃ = X ⊠<tspan baseline-shift="sub" font-size="70%">M</tspan> X̄ ⊠<tspan baseline-shift="sub" font-size="70%">N</tspan> X</text>
<text x="40" y="1062" class="small" text-anchor="start">A₂ⱼ ≅ B₂ⱼ₊₁ᵒᵖ;  even roots 1<tspan baseline-shift="sub" font-size="70%">N</tspan> and 1<tspan baseline-shift="sub" font-size="70%">M</tspan></text>
<text x="40" y="1097" class="small" text-anchor="start">Right and left inclusions act at different ends</text>
<rect x="20" y="1139" width="520" height="167" rx="10" fill="#fceeed" stroke="#9cb4cd"/>
<text x="40" y="1175" class="label" text-anchor="start">Actual diagonal corners: t = 1/3, d = 9/2</text>
<text x="40" y="1211" class="small" text-anchor="start">The same p on X has right End trace 1/3</text>
<text x="40" y="1247" class="small" text-anchor="start">Left End trace: 1/(dt) = 2/3</text>
<text x="40" y="1283" class="small" text-anchor="start">Odd algebra identification need not preserve traces</text>
<text x="40" y="1345" class="small" text-anchor="start">X̄ is the conjugate bimodule;  1<tspan baseline-shift="sub" font-size="70%">N</tspan> = L²(N), 1<tspan baseline-shift="sub" font-size="70%">M</tspan> = L²(M)</text>
<text x="40" y="1375" class="small" text-anchor="start">Theorem 19.5; Corollary 19.6; Proposition 19.7</text>
</svg>
