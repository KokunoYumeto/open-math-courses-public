<svg xmlns="http://www.w3.org/2000/svg" width="500" height="460" viewBox="0 0 500 460" role="img" aria-labelledby="title desc">
<title id="title">The dual and the normalized expectation</title>
<desc id="desc">The dual E-prime maps N-prime to M-prime, with identity value c and Jones-projection value one. Conjugation by J identifies their positive cones with M1 and M. The lower map E1 is one over c times that transport, with identity value one and Jones-projection value one over c.</desc>
<rect width="500" height="460" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:19px;font-weight:bold}.algebra{font-size:23px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426987"/></marker></defs>
<text x="24" y="32" class="title" text-anchor="start">Two maps, two normalizations</text>
<text x="24" y="60" class="small" text-anchor="start">Assume c = E′(1) &lt; ∞.</text>
<text x="80" y="118" class="algebra" text-anchor="middle">N′</text>
<text x="420" y="118" class="algebra" text-anchor="middle">M′</text>
<line x1="115" y1="111" x2="381" y2="111" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="99" class="label" text-anchor="middle">E′</text>
<text x="250" y="153" class="label" text-anchor="middle">E′(1) = c1     E′(e) = 1</text>
<line x1="80" y1="257" x2="80" y2="141" stroke="#426987" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<line x1="420" y1="257" x2="420" y2="141" stroke="#426987" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<text x="95" y="209" class="small" text-anchor="start">J(·)J</text>
<text x="360" y="209" class="small" text-anchor="start">J(·)J</text>
<text x="80" y="285" class="algebra" text-anchor="middle">M₁</text>
<text x="420" y="285" class="algebra" text-anchor="middle">M</text>
<line x1="115" y1="278" x2="381" y2="278" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="262" class="label" text-anchor="middle">E₁ = c⁻¹ Ê</text>
<text x="250" y="322" class="label" text-anchor="middle">E₁(1) = 1     E₁(e) = c⁻¹1</text>
<line x1="24" y1="349" x2="476" y2="349" stroke="#a4b4c8"/>
<text x="24" y="379" class="label" text-anchor="start">Ê(x) = J E′(JxJ) J, for x ≥ 0.</text>
<text x="24" y="409" class="small" text-anchor="start">Vertical arrows identify positive cones.</text>
<text x="24" y="437" class="small" text-anchor="start">Theorem 21.3 and Proposition 21.5.</text>
</svg>
