<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1490" viewBox="0 0 1000 1490">
<title>Finite trace order and the remaining support</title>
<desc>Nested trace simplexes test finite integer ranks. The changing two-block vector promotes at level two. Critical path weights allow a kernel correction; a transcendental parameter forbids it. The unrestricted actual amenable-inclusion partition remains open.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#416682"/></marker></defs>
<rect width="1000" height="1490" fill="#f2f6fb"/>
<text x="30" y="45" font-family="Arial,sans-serif" font-size="31" fill="#16344d" font-weight="bold">Finite trace order and the remaining support</text>
<text x="30" y="79" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="normal">Exact finite ranks • all norm traces • critical-path repair • precise boundary</text>
<rect x="25" y="103" width="950" height="280" rx="12" fill="#fff" stroke="#b9cdda"/>
<text x="47" y="141" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="bold">1. All compatible norm traces control promotion</text>
<text x="48" y="178" font-family="Arial,sans-serif" font-size="25" fill="#16344d" font-weight="normal">Kⱼ,ⱼ ⊃ Kⱼ,ⱼ₊₁ ⊃ Kⱼ,ⱼ₊₂ ⊃ ···</text>
<text x="48" y="216" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">aₖ = minℓ(vₖℓ / nₖℓ) ↗ minσ σ(v)</text>
<text x="48" y="254" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">bₖ = maxℓ(vₖℓ / nₖℓ) ↘ maxσ σ(v)</text>
<rect x="48" y="274" width="900" height="58" rx="12" fill="#e9f6ef" stroke="#b9cdda"/>
<text x="66" y="312" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">If every σ has 0 &lt; σ(v) &lt; 1, then 0 ≤ vₖ ≤ nₖ at a finite level.</text>
<text x="48" y="361" font-family="Arial,sans-serif" font-size="18" fill="#16344d" font-weight="normal">Weights are minimal-projection weights; σ ranges over all norm traces. 79.1–79.6</text>
<rect x="25" y="403" width="950" height="247" rx="12" fill="#fff" stroke="#b9cdda"/>
<text x="47" y="441" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="bold">2. A changing two-block system: Dⱼ = [[j + 2, 1], [1, j + 2]]</text>
<rect x="48" y="465" width="280" height="129" rx="12" fill="#eaf2fc" stroke="#b9cdda"/>
<text x="65" y="494" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="bold">level 0</text>
<text x="65" y="526" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">ranks (−2, 3)</text>
<text x="65" y="558" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="normal">capacities (1, 1)</text>
<text x="65" y="583" font-family="Arial,sans-serif" font-size="18" fill="#16344d" font-weight="normal">weights (1/2, 1/2)</text>
<rect x="360" y="465" width="280" height="129" rx="12" fill="#eaf2fc" stroke="#b9cdda"/>
<text x="377" y="494" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="bold">level 1</text>
<text x="377" y="526" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">ranks (−1, 4)</text>
<text x="377" y="558" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="normal">capacities (3, 3)</text>
<text x="377" y="583" font-family="Arial,sans-serif" font-size="18" fill="#16344d" font-weight="normal">weights (1/6, 1/6)</text>
<rect x="672" y="465" width="280" height="129" rx="12" fill="#e9f6ef" stroke="#b9cdda"/>
<text x="689" y="494" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="bold">level 2</text>
<text x="689" y="526" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">ranks (1, 11)</text>
<text x="689" y="558" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="normal">capacities (12, 12)</text>
<text x="689" y="583" font-family="Arial,sans-serif" font-size="18" fill="#16344d" font-weight="normal">weights (1/24, 1/24)</text>
<line x1="333" y1="528" x2="351" y2="528" stroke="#416682" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="645" y1="528" x2="664" y2="528" stroke="#416682" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="48" y="628" font-family="Arial,sans-serif" font-size="20" fill="#16344d" font-weight="normal">Exact trace = 1/2; the first valid promotion is level 2. Example 79.4</text>
<rect x="25" y="670" width="950" height="266" rx="12" fill="#fff" stroke="#b9cdda"/>
<text x="47" y="708" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="bold">3. Critical path trace: a kernel correction gives the certificate</text>
<text x="48" y="743" font-family="Arial,sans-serif" font-size="22" fill="#16344d" font-weight="normal">δ = 2, t = 1/4. Level 4 capacities (2, 3, 1); weights (1, 3, 5)/16.</text>
<rect x="48" y="765" width="423" height="100" rx="12" fill="#fff1df" stroke="#b9cdda"/>
<rect x="529" y="765" width="423" height="100" rx="12" fill="#e9f6ef" stroke="#b9cdda"/>
<text x="65" y="797" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="normal">signed ranks (2, 3, −1)</text>
<text x="65" y="831" font-family="Arial,sans-serif" font-size="22" fill="#16344d" font-weight="normal">trace 3/8; character −1</text>
<line x1="481" y1="814" x2="519" y2="814" stroke="#416682" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="546" y="797" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="normal">valid ranks (0, 2, 0)</text>
<text x="546" y="831" font-family="Arial,sans-serif" font-size="22" fill="#16344d" font-weight="normal">trace 3/8; character 0</text>
<text x="48" y="901" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="normal">Difference polynomial = 1 − 4t: it vanishes at t = 1/4. 79.18</text>
<text x="48" y="925" font-family="Arial,sans-serif" font-size="18" fill="#16344d" font-weight="normal">Bounded integer coins prove every dyadic trace is available. Theorem 79.6</text>
<rect x="25" y="956" width="950" height="295" rx="12" fill="#fff" stroke="#b9cdda"/>
<text x="47" y="994" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="bold">4. Transcendental noncritical trace: no alternative certificate</text>
<text x="48" y="1031" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="normal">Choose transcendental t ∈ (1/5, 1/4), δ = 1/√t &gt; 2.</text>
<text x="48" y="1072" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">Outermost level-4 p: τ(p) = 1 − 3t + t² &lt; 11/25 &lt; 1/2.</text>
<text x="48" y="1112" font-family="Arial,sans-serif" font-size="22" fill="#16344d" font-weight="normal">Two disjoint physical conjugates: residual R(t) = −1 + 6t − 2t² &gt; 0.</text>
<rect x="48" y="1132" width="901" height="62" rx="12" fill="#fff1df" stroke="#b9cdda"/>
<text x="65" y="1171" font-family="Arial,sans-serif" font-size="23" fill="#16344d" font-weight="normal">Any finite q with τ(q) = R(t) would have χ(q) = R(0) = −1.</text>
<text x="48" y="1227" font-family="Arial,sans-serif" font-size="19" fill="#16344d" font-weight="normal">Impossible for a projection. The path GNS algebra is still a II₁ factor. Proposition 79.7</text>
<rect x="25" y="1271" width="950" height="138" rx="12" fill="#fff" stroke="#b9cdda"/>
<text x="47" y="1309" font-family="Arial,sans-serif" font-size="24" fill="#16344d" font-weight="bold">5. Actual inclusion: the unrestricted proof still needs additional input</text>
<text x="48" y="1345" font-family="Arial,sans-serif" font-size="21" fill="#16344d" font-weight="normal">Use actual norm-trace uniqueness or an actual critical-path trace identification.</text>
<text x="48" y="1378" font-family="Arial,sans-serif" font-size="20" fill="#16344d" font-weight="normal">Factoriality alone supplies neither; no amenable-subfactor counterexample is inferred.</text>
<text x="30" y="1445" font-family="Arial,sans-serif" font-size="19" fill="#16344d" font-weight="normal">Proof locators: 79.1–79.18. Human source endpoint: S. Popa (1994),</text>
<text x="30" y="1474" font-family="Arial,sans-serif" font-size="19" fill="#16344d" font-weight="normal">Classification of amenable subfactors of type II, Theorem 4.4.1(1), printed p.222.</text>
</svg>
