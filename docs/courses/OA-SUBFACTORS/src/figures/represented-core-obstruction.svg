<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850">
<rect width="1080" height="850" fill="#fafbfc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315b76"/></marker></defs>
<text x="32" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#172d3d" font-weight="bold">A commuting-square image need not be an actual core</text>
<text x="32" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">H = binary hyperfinite factor;  K = any II₁ factor;  v ∈ U(K).</text>
<rect x="32" y="104" width="1016" height="104" rx="12" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="50" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172d3d" font-weight="bold">An actual core, transported by a controlled unitary</text>
<text x="50" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">P₀ = Mat₂ ⊗ H ⊗ 1;     u = E₀₀ ⊗ 1 ⊗ 1 + E₁₁ ⊗ 1 ⊗ v;     Pᵥ = uP₀u*.</text>
<text x="50" y="204" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">Ad(u) fixes Q pointwise and preserves the trace.  Theorem 51.7 constructs the tunnel with core P₀.</text>
<rect x="32" y="252" width="390" height="112" rx="12" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="50" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172d3d" font-weight="bold">Q = 1 ⊗ H ⊗ 1</text>
<text x="50" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">The smaller represented algebra.</text>
<rect x="606" y="252" width="442" height="112" rx="12" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="624" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172d3d" font-weight="bold">Pᵥ = { Σ Eᵢⱼ ⊗ bᵢⱼ ⊗ vᵢvⱼ* }</text>
<text x="624" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">v₀ = 1;  v₁ = v;  bᵢⱼ ∈ H.</text>
<rect x="32" y="430" width="390" height="112" rx="12" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="50" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172d3d" font-weight="bold">N = 1 ⊗ H ⊗ K</text>
<text x="50" y="500" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">The fixed smaller II₁ factor.</text>
<rect x="606" y="430" width="442" height="112" rx="12" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="624" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172d3d" font-weight="bold">M = Mat₂ ⊗ H ⊗ K</text>
<text x="624" y="500" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">[M:N] = [Pᵥ:Q] = 4.</text>
<path d="M430 307 L596 307" stroke="#315b76" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M430 487 L596 487" stroke="#315b76" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M208 374 L208 420" stroke="#315b76" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M828 374 L828 420" stroke="#315b76" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="321" y="400" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="normal">E_N E_{Pᵥ} = E_{Pᵥ} E_N = E_Q</text>
<rect x="32" y="573" width="1016" height="112" rx="12" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="50" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172d3d" font-weight="bold">One common basis verifies nondegeneracy and the index</text>
<text x="50" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">aᵢⱼ = √2 Eᵢⱼ ⊗ 1 ⊗ vᵢvⱼ*;     E_N(aᵢⱼ* aₖₗ) = δᵢₖδⱼₗ 1;     Σ aᵢⱼaᵢⱼ* = 4·1.</text>
<text x="50" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">Every y ∈ M equals Σ aᵢⱼ E_N(aᵢⱼ* y);   the coefficients lie in Q when y ∈ Pᵥ.</text>
<rect x="32" y="710" width="1016" height="110" rx="12" fill="#fff0e9" stroke="#91aabb" stroke-width="2"/>
<text x="50" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172d3d" font-weight="bold">Every actual core must contain D = N′ ∩ M = Mat₂ ⊗ 1 ⊗ 1</text>
<text x="50" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">X = (E₀₁ + E₁₀) ⊗ 1 ⊗ 1 ∈ D;     dist₂(X, Pᵥ)² = 1 − |τ(v)|².</text>
<text x="50" y="810" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">For v = diag(1,−1), E_{Pᵥ}(X) = 0 and dist₂(X, Pᵥ) = 1.  Proof: (51.26), (51.38).</text>
<text x="33" y="842" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#172d3d" font-weight="normal">Square and tensor-factor positions are schematic. All formulas retain the normalized product traces.</text>
</svg>
