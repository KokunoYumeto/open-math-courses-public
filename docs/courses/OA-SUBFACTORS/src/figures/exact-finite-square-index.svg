<svg xmlns="http://www.w3.org/2000/svg" width="760" height="860" viewBox="0 0 760 860" role="img" aria-labelledby="title desc">
<title id="title">An exact finite square forces an algebraic-integer index</title>
<desc id="desc">Finite matrix-frame coefficients transport to the actual factor inclusion. Its scalar Jones index is an eigenvalue of L transpose L. The strongly amenable weighted-spin index16/3, and all its positive integer powers, fail this necessary condition.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs><rect width="760" height="860" fill="white"/>
<text x="25" y="37" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#17324a">What an exact finite square would imply</text>
<text x="25" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">Actual II₁ factors P ⊂ Q;  d = [Q : P] &lt; ∞.  Proposition 31.6.</text>
<rect x="20" y="92" width="720" height="236" rx="9" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="90" y="135" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17324a">B</text>
<line x1="140" y1="126" x2="574" y2="126" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="607" y="135" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17324a">Q</text>
<text x="84" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17324a">finite dimensional</text>
<text x="585" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17324a">factor</text>
<text x="90" y="261" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17324a">A</text>
<line x1="140" y1="253" x2="574" y2="253" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="607" y="261" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17324a">P</text>
<line x1="99" y1="227" x2="99" y2="178" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="619" y1="227" x2="619" y2="178" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="198" y="196" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17324a">E_P(B) ⊂ A</text>
<text x="198" y="229" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">ultraweak span(BP) = Q</text>
<text x="45" y="305" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324a">All embeddings are unital; E_P is the physical tracial expectation.</text>
<line x1="380" y1="339" x2="380" y2="365" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="377" width="720" height="180" rx="9" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="40" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#17324a">Finite frame uᵣ ∈ B for F : B → A  (Lemma 30.1)</text>
<text x="40" y="447" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324a">Normal transport:  x = Σᵣ uᵣ E_P(uᵣ* x),   x ∈ Q.</text>
<text x="40" y="485" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324a">On L²(Q):  Σᵣ uᵣ e_P uᵣ* = 1.</text>
<text x="40" y="529" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17324a">E_Q(e_P) = 1/d  ⇒  Σᵣ uᵣ uᵣ* = d1.</text>
<line x1="380" y1="568" x2="380" y2="593" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="605" width="720" height="102" rx="9" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="40" y="640" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17324a">s = Lt,  (Lᵀs)ⱼ / tⱼ = d  ⇒  LᵀLt = dt.</text>
<text x="40" y="678" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17324a">det(XI − LᵀL) is monic with integer coefficients.</text>
<rect x="20" y="729" width="720" height="100" rx="9" fill="#fff3e5" stroke="#9eb3c5"/>
<text x="40" y="764" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">Weighted spin:  dʳ = 16ʳ/3ʳ is rational and not an integer.</text>
<text x="40" y="799" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">No exact square at any r ≥ 1. Its bicommutant holds by 62.6.</text>
<text x="25" y="850" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17324a">Proofs: 31.6–31.7. Finite-frame source: Lemma 30.1; human context: Bischoff et al., App. C.</text>
</svg>
