<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1790" viewBox="0 0 1000 1790">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#45647e"/></marker></defs>
<rect width="1000" height="1790" fill="#f4f7fb"/>
<text x="35" y="42" font-family="Arial,sans-serif" font-size="30" fill="#18334b" font-weight="bold" text-anchor="start">Relative entropy reaches the extremal graph bound</text>
<text x="35" y="74" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="normal" text-anchor="start">Actual trace • complete finite square • retained residual • no separability</text>
<rect x="30" y="100" width="940" height="305" rx="14" fill="#ffffff" stroke="#bccddd"/>
<text x="52" y="136" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold" text-anchor="start">1. The matrix sectors are the two coordinates of an isometry</text>
<text x="55" y="177" font-family="Arial,sans-serif" font-size="25" fill="#18334b" font-weight="normal" text-anchor="start">Hⱼ = ⊕ᵢ (ℂ^(nᵢ) ⊗ ℂ^(gᵢⱼ))</text>
<line x1="410" y1="169" x2="545" y2="169" stroke="#45647e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="565" y="177" font-family="Arial,sans-serif" font-size="25" fill="#18334b" font-weight="normal" text-anchor="start">Hₐ ⊗ Hₑ,ⱼ</text>
<text x="395" y="205" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="normal" text-anchor="start">Vⱼ : |i,a,b〉 ↦ |i,a〉 ⊗ |i,b〉</text>
<rect x="60" y="227" width="400" height="113" rx="14" fill="#eaf2fb" stroke="#bccddd"/>
<rect x="535" y="227" width="395" height="113" rx="14" fill="#eaf7f2" stroke="#bccddd"/>
<text x="80" y="259" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="bold" text-anchor="start">Trace out the multiplicity coordinate</text>
<text x="80" y="289" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">σℓⱼ = ⊕ᵢ Tr_mult((yℓⱼ)ᵢᵢ)</text>
<text x="80" y="321" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">(Eᴅ xℓzⱼ)ᵢ = σℓⱼ,ᵢ / sᵢ</text>
<text x="555" y="259" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="bold" text-anchor="start">Trace out the matrix coordinate</text>
<text x="555" y="289" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">ωₑ,ⱼ = ⊕ᵢ (nᵢ/mⱼ) I_(gᵢⱼ)</text>
<text x="555" y="321" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal" text-anchor="start">Σℓ(Sσℓⱼ − Syℓⱼ) ≤ pⱼ Sωₑ,ⱼ</text>
<text x="55" y="376" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="normal" text-anchor="start">The two sector labels agree in VⱼHⱼ. Off-sector terms vanish under either partial trace.</text>
<text x="790" y="395" font-family="Arial,sans-serif" font-size="16" fill="#18334b" font-weight="normal" text-anchor="middle">77.1–77.2; (77.8)–(77.12)</text>
<rect x="30" y="425" width="940" height="275" rx="14" fill="#ffffff" stroke="#bccddd"/>
<text x="52" y="461" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold" text-anchor="start">2. The actual trace gives a joint probability on the edges</text>
<text x="55" y="503" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="bold" text-anchor="start">Example L = 2</text>
<text x="55" y="537" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">D = Mat₂ ⊕ ℂ</text>
<text x="55" y="569" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">Q = Mat₃ ⊕ ℂ</text>
<text x="55" y="606" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="normal" text-anchor="start">G = [1  0; 1  1]</text>
<text x="380" y="503" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">q = (1/2, 1/2)</text>
<text x="690" y="503" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">p = (3/4, 1/4)</text>
<text x="380" y="549" font-family="Arial,sans-serif" font-size="25" fill="#18334b" font-weight="normal" text-anchor="start">r = [1/2  0; 1/4  1/4]</text>
<text x="380" y="587" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="normal" text-anchor="start">rᵢⱼ = nᵢgᵢⱼtⱼ;  row sums q, column sums p</text>
<text x="55" y="650" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="normal" text-anchor="start">H(Q|D) ≤ Σ rᵢⱼ log(mⱼsᵢ/nᵢtⱼ) ≤ 2 log Σ gᵢⱼ√(qᵢpⱼ) ≤ log ‖G‖²</text>
<text x="55" y="682" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal" text-anchor="start">Scalar log concavity, then pairing two unit vectors through G.  (77.5), (77.6), (77.13)</text>
<rect x="30" y="720" width="940" height="310" rx="14" fill="#ffffff" stroke="#bccddd"/>
<text x="52" y="756" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold" text-anchor="start">3. Keep every finite block, including the residual</text>
<rect x="55" y="782" width="535" height="92" rx="14" fill="#eaf2fb" stroke="#bccddd"/>
<rect x="620" y="782" width="325" height="92" rx="14" fill="#fff4df" stroke="#bccddd"/>
<text x="75" y="815" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="bold" text-anchor="start">Selected whole-stage pieces</text>
<text x="75" y="849" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">rBₘr ⊂ rAₘr : corner matrix norm ≤ β</text>
<text x="640" y="815" font-family="Arial,sans-serif" font-size="21" fill="#18334b" font-weight="bold" text-anchor="start">Exact residual corner</text>
<text x="640" y="849" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">fB₀ ⊂ fA₀ : same G₀</text>
<line x1="270" y1="883" x2="430" y2="925" stroke="#45647e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="780" y1="883" x2="565" y2="925" stroke="#45647e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="55" y="916" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold" text-anchor="start">β = ‖Γ‖</text>
<text x="365" y="961" font-family="Arial,sans-serif" font-size="26" fill="#18334b" font-weight="normal" text-anchor="start">Q ⊂ P ⊂ M,  EₙEₚ = Eᵩ</text>
<text x="55" y="997" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">For each positive partition x:  Eₚx → x in L², so H(M|N) ≤ log β².</text>
<text x="735" y="1019" font-family="Arial,sans-serif" font-size="17" fill="#18334b" font-weight="normal" text-anchor="middle">77.3, 77.5, 77.6; (77.30)</text>
<rect x="30" y="1050" width="940" height="350" rx="14" fill="#ffffff" stroke="#bccddd"/>
<text x="52" y="1086" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold" text-anchor="start">4. Extremality makes the factor entropy equal log d</text>
<text x="55" y="1129" font-family="Arial,sans-serif" font-size="26" fill="#18334b" font-weight="normal" text-anchor="start">Eₙ(e) = Eₙ′∩ₘ(e) = c1,  c = 1/d</text>
<line x1="670" y1="1120" x2="925" y2="1120" stroke="#45647e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="695" y="1160" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="normal" text-anchor="start">average by N-unitaries</text>
<text x="55" y="1204" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="normal" text-anchor="start">y = (cn)⁻¹ Σ uᵢeuᵢ* → 1 in L²;   p = 1[0,1+a](y)</text>
<text x="55" y="1242" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">eᵢ′ = p ∧ uᵢeuᵢ*,   xᵢ = eᵢ′/[(1+a)cn],   x₀ = 1 − Σxᵢ ≥ 0</text>
<text x="55" y="1280" font-family="Arial,sans-serif" font-size="22" fill="#18334b" font-weight="normal" text-anchor="start">Removed trace ≤ ε²/a²; first ε → 0, then a → 0.  (77.20)–(77.25)</text>
<rect x="55" y="1308" width="890" height="58" rx="14" fill="#eaf7f2" stroke="#bccddd"/>
<text x="500" y="1347" font-family="Arial,sans-serif" font-size="27" fill="#18334b" font-weight="bold" text-anchor="middle">log d = H(M|N) ≤ log ‖Γ‖² ≤ log d   ⇒   ‖Γ‖² = d</text>
<text x="55" y="1383" font-family="Arial,sans-serif" font-size="20" fill="#18334b" font-weight="normal" text-anchor="start">Principal and dual norms agree by rooted closed-walk growth; finite weights need not agree.</text>
<rect x="30" y="1420" width="940" height="275" rx="14" fill="#ffffff" stroke="#bccddd"/>
<text x="52" y="1456" font-family="Arial,sans-serif" font-size="24" fill="#18334b" font-weight="bold" text-anchor="start">5. Scalar dimension mass alone cannot replace that entropy proof</text>
<text x="55" y="1495" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">For every L ≥ 1, the same G has ‖G‖² = (3 + √5)/2 &lt; 3.</text>
<text x="55" y="1533" font-family="Arial,sans-serif" font-size="23" fill="#18334b" font-weight="normal" text-anchor="start">Canonical density = (3,2);  total mass = 3 − 1/(L+2) → 3.</text>
<line x1="80" y1="1598" x2="915" y2="1598" stroke="#5d758c" stroke-width="3"/>
<circle cx="120" cy="1598" r="5" fill="#a34145"/>
<text x="120" y="1575" font-family="Arial,sans-serif" font-size="20" fill="#a34145" font-weight="normal" text-anchor="middle">(3+√5)/2</text>
<circle cx="235" cy="1598" r="5" fill="#315b96"/>
<text x="235" y="1575" font-family="Arial,sans-serif" font-size="20" fill="#315b96" font-weight="normal" text-anchor="middle">8/3</text>
<circle cx="400" cy="1598" r="5" fill="#315b96"/>
<text x="400" y="1575" font-family="Arial,sans-serif" font-size="20" fill="#315b96" font-weight="normal" text-anchor="middle">11/4</text>
<circle cx="735" cy="1598" r="5" fill="#315b96"/>
<text x="735" y="1575" font-family="Arial,sans-serif" font-size="20" fill="#315b96" font-weight="normal" text-anchor="middle">35/12</text>
<circle cx="902" cy="1598" r="5" fill="#315b96"/>
<text x="902" y="1575" font-family="Arial,sans-serif" font-size="20" fill="#315b96" font-weight="normal" text-anchor="middle">3</text>
<text x="235" y="1631" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal" text-anchor="middle">L=1</text>
<text x="400" y="1631" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal" text-anchor="middle">L=2</text>
<text x="735" y="1631" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal" text-anchor="middle">L=10</text>
<text x="902" y="1631" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal" text-anchor="middle">limit</text>
<text x="55" y="1672" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal" text-anchor="start">Number-line positions are schematic; values are exact. Abstract finite pair, not a subfactor counterexample.</text>
<text x="35" y="1730" font-family="Arial,sans-serif" font-size="19" fill="#18334b" font-weight="normal" text-anchor="start">Proof locators: Lesson77.  Sources: Pimsner–Popa (1986, 1991); Popa (1994), 4.4.1(3).</text>
<text x="35" y="1762" font-family="Arial,sans-serif" font-size="18" fill="#18334b" font-weight="normal" text-anchor="start">Reproducible SVG • GPT-6.1 Sol (OpenAI) • Ultra • CC0 • October 2026</text>
</svg>
