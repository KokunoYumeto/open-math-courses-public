<svg xmlns="http://www.w3.org/2000/svg" width="540" height="640" viewBox="0 0 540 640" role="img" aria-labelledby="title desc">
<title id="title">A finite frame identifies the limit basic construction</title>
<desc id="desc">A nondegenerate commuting square has horizontal index kappa and vertical index c. The vertical frame in Q0 transports to every Qn over Pn. Its fixed Gram projection p gives M1 equals p M_m(N) p, with normalized trace c inverse times the unnormalized matrix trace. Repeating identifies every level of the Jones tower.</desc>
<rect width="540" height="640" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:18px}.small{font-size:16px}</style>
<text x="24" y="33" class="title" text-anchor="start">A finite square produces an inclusion</text>
<text x="24" y="64" class="small" text-anchor="start">Horizontal index κ; vertical index c.</text>
<text x="62" y="112" class="label" text-anchor="middle">Q₀</text>
<text x="176" y="112" class="label" text-anchor="middle">Q₁</text>
<text x="334" y="112" class="label" text-anchor="middle">Qₙ</text>
<text x="470" y="112" class="label" text-anchor="middle">M</text>
<text x="270" y="112" class="label" text-anchor="middle">⋯</text>
<path d="M86 106 H148" stroke="#426987" stroke-width="2"/>
<text x="117.0" y="94" class="small" text-anchor="middle">⊂</text>
<path d="M360 106 H447" stroke="#426987" stroke-width="2"/>
<text x="403.5" y="94" class="small" text-anchor="middle">⊂</text>
<text x="62" y="209" class="label" text-anchor="middle">P₀</text>
<text x="176" y="209" class="label" text-anchor="middle">P₁</text>
<text x="334" y="209" class="label" text-anchor="middle">Pₙ</text>
<text x="470" y="209" class="label" text-anchor="middle">N</text>
<text x="270" y="209" class="label" text-anchor="middle">⋯</text>
<path d="M86 203 H148" stroke="#426987" stroke-width="2"/>
<text x="117.0" y="191" class="small" text-anchor="middle">⊂</text>
<path d="M360 203 H447" stroke="#426987" stroke-width="2"/>
<text x="403.5" y="191" class="small" text-anchor="middle">⊂</text>
<text x="62" y="164" class="label" text-anchor="middle">∪</text>
<text x="176" y="164" class="label" text-anchor="middle">∪</text>
<text x="334" y="164" class="label" text-anchor="middle">∪</text>
<text x="470" y="164" class="label" text-anchor="middle">∪</text>
<text x="116" y="149" class="small" text-anchor="middle">κ</text>
<text x="80" y="174" class="small" text-anchor="start">c</text>
<text x="270" y="249" class="small" text-anchor="middle">Qₙ = span(Q₀Pₙ); E_Pₙ|Q₀ = E_P₀</text>
<rect x="24" y="277" width="492" height="115" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="306" class="heading" text-anchor="middle">One vertical frame at every level</text>
<text x="270" y="338" class="label" text-anchor="middle">uᵢ ∈ Q₀;  x = Σᵢ uᵢ E_Pₙ(uᵢ* x)</text>
<text x="270" y="364" class="small" text-anchor="middle">Σᵢ uᵢuᵢ* = c1;  pᵢⱼ = E_P₀(uᵢ* uⱼ).</text>
<rect x="24" y="413" width="492" height="115" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="442" class="heading" text-anchor="middle">The matrix corner is the actual tower level</text>
<text x="270" y="474" class="label" text-anchor="middle">M₁ = p Mₘ(N) p;  τ₁ = c⁻¹(τ_N ⊗ Trₘ)</text>
<text x="270" y="500" class="small" text-anchor="middle">Trₘ is unnormalized; (τ_N ⊗ Trₘ)(p) = c.</text>
<rect x="24" y="549" width="492" height="73" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="578" class="heading" text-anchor="middle">Repeat with the common finite Jones projection</text>
<text x="270" y="610" class="label" text-anchor="middle">Theorem 30.4 and Proposition 30.5.</text>
</svg>
