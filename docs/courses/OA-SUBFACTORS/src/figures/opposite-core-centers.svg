<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="title desc">
<title id="title">Finite opposite bases and the atomic parts of the two centers</title><desc id="desc">The actual opposite Markov triple has finite bases and trace-preserving center transport two steps apart. Adjacent atomic parts agree, and the actual opposite joint center is scalar. Six exact support intervals illustrate index16/3.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#365e79"/></marker></defs>
<rect width="1000" height="1070" fill="white"/><g font-family="Arial, DejaVu Sans, sans-serif">
<text x="40" y="42" font-size="30" font-weight="bold" fill="#132b42" text-anchor="start">Actual opposite models: bases and center type</text>
<text x="40" y="76" font-size="21" font-weight="normal" fill="#132b42" text-anchor="start">Every finite index d &gt; 1; arbitrary centers; original normalized trace τ.</text>
<rect x="30" y="102" width="940" height="264" rx="12" fill="#eef5fc" stroke="#9aafbd"/>
<text x="54" y="140" font-size="23" font-weight="bold" fill="#132b42" text-anchor="start">The whole tracial basic-construction triple (63.40)–(63.43)</text>
<text x="80" y="191" font-size="25" font-weight="bold" fill="#132b42" text-anchor="start">P = Bⱼ₊₁</text>
<text x="394" y="191" font-size="25" font-weight="bold" fill="#132b42" text-anchor="start">Q = Bⱼ</text>
<text x="722" y="191" font-size="25" font-weight="bold" fill="#132b42" text-anchor="start">A = Bⱼ₋₁</text>
<path d="M252,183 L355,183" stroke="#365e79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M558,183 L690,183" stroke="#365e79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="54" y="234" font-size="23" font-weight="normal" fill="#132b42" text-anchor="start">qAq = Pq;    E_Q(q) = 1/d;    T_A(q) = (1/d)1</text>
<text x="54" y="277" font-size="23" font-weight="bold" fill="#132b42" text-anchor="start">Z(A) → Z(P):   zq = θⱼ(z)q,   τ(θⱼ(z)) = τ(z)</text>
<text x="54" y="316" font-size="21" font-weight="normal" fill="#132b42" text-anchor="start">Two-step center transport; adjacent centers need not be equal.</text>
<text x="54" y="345" font-size="21" font-weight="normal" fill="#132b42" text-anchor="start">Both tracial expectations satisfy E(x) ≥ x/d.</text>
<rect x="30" y="390" width="940" height="294" rx="12" fill="#edf7f3" stroke="#9aafbd"/>
<text x="54" y="430" font-size="25" font-weight="bold" fill="#132b42" text-anchor="start">The actual atomic projections agree (63.48)</text>
<text x="54" y="472" font-size="23" font-weight="normal" fill="#132b42" text-anchor="start">t = atomic part of Z(P);    r = atomic part of Z(Q)</text>
<text x="54" y="512" font-size="23" font-weight="normal" fill="#132b42" text-anchor="start">a = atomic part of Z(A):    t ≤ r ≤ a;    aq = tq</text>
<text x="54" y="552" font-size="22" font-weight="normal" fill="#132b42" text-anchor="start">(r − t)q = 0       ⇒       E_Q((r − t)q) = (r − t)/d = 0</text>
<text x="54" y="592" font-size="24" font-weight="bold" fill="#132b42" text-anchor="start">Hence t = r as projections in Q.</text>
<text x="54" y="632" font-size="23" font-weight="normal" fill="#132b42" text-anchor="start">For actual opposite pairs: Z(P) ∩ Z(Q) = ℂ1.</text>
<text x="54" y="663" font-size="21" font-weight="normal" fill="#132b42" text-anchor="start">Therefore both centers are atomic, or both are diffuse (63.49).</text>
<rect x="30" y="708" width="940" height="238" rx="12" fill="#fff5e9" stroke="#9aafbd"/>
<text x="54" y="750" font-size="23" font-weight="bold" fill="#132b42" text-anchor="start">Exact support construction at d = 16/3 (Exercise 63.10)</text>
<rect x="70" y="778" width="157.5" height="55" rx="0" fill="#287db1" stroke="white"/>
<text x="148.75" y="813" font-size="21" font-weight="bold" fill="white" text-anchor="middle">1</text>
<text x="148.75" y="863" font-size="18" font-weight="normal" fill="#132b42" text-anchor="middle">3/16</text>
<rect x="227.5" y="778" width="157.5" height="55" rx="0" fill="#287db1" stroke="white"/>
<text x="306.25" y="813" font-size="21" font-weight="bold" fill="white" text-anchor="middle">2</text>
<text x="306.25" y="863" font-size="18" font-weight="normal" fill="#132b42" text-anchor="middle">3/16</text>
<rect x="385.0" y="778" width="157.5" height="55" rx="0" fill="#287db1" stroke="white"/>
<text x="463.75" y="813" font-size="21" font-weight="bold" fill="white" text-anchor="middle">3</text>
<text x="463.75" y="863" font-size="18" font-weight="normal" fill="#132b42" text-anchor="middle">3/16</text>
<rect x="542.5" y="778" width="157.5" height="55" rx="0" fill="#287db1" stroke="white"/>
<text x="621.25" y="813" font-size="21" font-weight="bold" fill="white" text-anchor="middle">4</text>
<text x="621.25" y="863" font-size="18" font-weight="normal" fill="#132b42" text-anchor="middle">3/16</text>
<rect x="700.0" y="778" width="157.5" height="55" rx="0" fill="#287db1" stroke="white"/>
<text x="778.75" y="813" font-size="21" font-weight="bold" fill="white" text-anchor="middle">5</text>
<text x="778.75" y="863" font-size="18" font-weight="normal" fill="#132b42" text-anchor="middle">3/16</text>
<rect x="857.5" y="778" width="52.5" height="55" rx="0" fill="#d99839" stroke="white"/>
<text x="883.75" y="813" font-size="21" font-weight="bold" fill="white" text-anchor="middle">6</text>
<text x="883.75" y="863" font-size="18" font-weight="normal" fill="#132b42" text-anchor="middle">1/16</text>
<text x="54" y="901" font-size="21" font-weight="normal" fill="#132b42" text-anchor="start">Six basis slots: five full initial supports and one support of trace 1/3.</text>
<text x="54" y="931" font-size="20" font-weight="normal" fill="#132b42" text-anchor="start">Bar widths are exact final center traces; their sum is 1.</text>
<text x="40" y="982" font-size="21" font-weight="normal" fill="#132b42" text-anchor="start">Opposite pair: no extremality, amenability, depth or separability assumed.</text>
<text x="40" y="1016" font-size="20" font-weight="normal" fill="#132b42" text-anchor="start">Extremal ordinary cores inherit the scalar joint center and dichotomy by CTS.7.</text>
<text x="40" y="1050" font-size="19" font-weight="normal" fill="#132b42" text-anchor="start">Proofs63.11–63.13. Human context: Popa (1994), §1.4.2, Corollary(i), p.187.</text>
</g></svg>
