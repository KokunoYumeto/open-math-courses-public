<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1050" viewBox="0 0 760 1050" role="img"><title>The canonical tracial tower inside the actual opposite model</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs>
<rect width="760" height="1050" fill="white"/>
<text x="25" y="36" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324a">The actual opposite model has its own tracial cup</text>
<text x="25" y="69" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">Bⱼ = Mⱼ′ ∩ T;  λ = 1/d.  No factoriality of Bⱼ is assumed.</text>
<rect x="20" y="90" width="720" height="166" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="52" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324a">Mⱼ₋₁</text>
<text x="320" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324a">Mⱼ</text>
<text x="581" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324a">Mⱼ₊₁</text>
<line x1="152" y1="120" x2="284" y2="120" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<line x1="410" y1="120" x2="553" y2="120" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="52" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324a">Bⱼ₊₁</text>
<text x="320" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324a">Bⱼ</text>
<text x="581" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324a">Bⱼ₋₁</text>
<line x1="152" y1="204" x2="284" y2="204" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<line x1="410" y1="204" x2="553" y2="204" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="47" y="244" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324a">The bottom row consists of fixed actual commutants in the finite T.</text>
<rect x="20" y="278" width="720" height="173" rx="8" fill="#fff4e7" stroke="#9eb3c5"/>
<text x="40" y="312" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17324a">Original cup eⱼ:  E_Bⱼ(eⱼ) = λhⱼ</text>
<text x="40" y="349" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324a">hⱼ = ηⱼ(κⱼ⁻¹) &gt; 0;  Fⱼ(x) = Eⱼ(hⱼ¹ᐟ² x hⱼ¹ᐟ²).</text>
<text x="40" y="384" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324a">eⱼ x eⱼ = Fⱼ(x)eⱼ;  τ(Fⱼ(x)) = τ(hⱼx).</text>
<text x="40" y="423" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324a">Eⱼ : Bⱼ → Bⱼ₊₁ preserves the inherited trace.</text>
<line x1="380" y1="462" x2="380" y2="486" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="498" width="720" height="183" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="40" y="534" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17324a">Corrected cup qⱼ = hⱼ⁻¹ᐟ² eⱼ hⱼ⁻¹ᐟ²</text>
<text x="40" y="573" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17324a">qⱼ x qⱼ = Eⱼ(x)qⱼ;   E_Bⱼ(qⱼ) = λ1.</text>
<text x="40" y="611" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324a">W*(Bⱼ, qⱼ) = Bⱼ₋₁;   qⱼ has full central support.</text>
<text x="40" y="651" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">Canonical trace on the whole basic construction:  Tr = dτ.</text>
<rect x="20" y="704" width="720" height="259" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="40" y="738" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">Actual weighted spin: p = 1/4, q = 3/4, λ = 3/16.</text>
<text x="40" y="773" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">First-site labels</text>
<text x="407" y="773" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P₀</text>
<text x="604" y="773" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P₁</text>
<text x="40" y="809" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">h</text>
<text x="407" y="809" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">3</text>
<text x="604" y="809" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">1/3</text>
<text x="40" y="845" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">E_Bⱼ(eⱼ)</text>
<text x="407" y="845" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">9/16</text>
<text x="604" y="845" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">1/16</text>
<text x="40" y="881" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">E_Bⱼ(qⱼ)</text>
<text x="407" y="881" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">3/16</text>
<text x="604" y="881" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">3/16</text>
<text x="40" y="928" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">Cup vectors on 01,10:  (√3/2, 1/2)  →  (1/2, √3/2).</text>
<text x="25" y="997" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324a">Proofs 63.6–63.8; exact weighted-spin calculation: Exercise 63.7.</text>
<text x="25" y="1029" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#17324a">Human context: Popa, Classification of amenable subfactors, §1.4.3, printed188.</text>
</svg>
