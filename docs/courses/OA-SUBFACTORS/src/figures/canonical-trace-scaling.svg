<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">The canonical trace multiplier and the center condition</title>
<desc id="desc">The old left matrix algebra becomes all operators on its n-squared dimensional Hilbert space. Both canonical trace normalizations are shown. The smaller and larger centers remain separate. A spectral-piece example has vanishing total defect but two large piece defects.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315b70"/></marker></defs>
<rect width="640" height="1120" fill="#f9fcfe"/>
<text x="320" y="35" font-family="Arial, sans-serif" font-size="26" fill="#163c50" text-anchor="middle" font-weight="bold">One matrix factor; two operator traces</text>
<text x="320" y="67" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">H = L²(M⁰) ⊗ L²(Mₙ);  dim L²(Mₙ) = n²</text>
<rect x="35" y="96" width="255" height="82" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="162.5" y="125" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">Old leg: L(Mₙ)</text>
<text x="162.5" y="152" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">n copies of its defining action</text>
<rect x="350" y="96" width="255" height="82" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="477.5" y="125" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">New leg: M(n²)</text>
<text x="477.5" y="152" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">All operators on L²(Mₙ)</text>
<line x1="295" y1="137" x2="345" y2="137" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="163" y="207" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="normal">e_R = e₀ ⊗ I</text>
<text x="478" y="207" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="normal">e_R⁰ = e₀ ⊗ r</text>
<text x="320" y="239" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">r projects onto 1_D;  rank(r) = Tr(r) = 1</text>
<rect x="35" y="270" width="570" height="81" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320.0" y="299" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">A = A₀ ⊗ L(Mₙ) ⊂ Ã = A₀ ⊗ M(n²)</text>
<text x="320.0" y="326" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">The same first leg A₀ = ⟨N⁰, e₀⟩</text>
<rect x="35" y="370" width="570" height="81" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320.0" y="399" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">B = B₀ ⊗ L(Mₙ) ⊂ B̃ = B₀ ⊗ M(n²)</text>
<text x="320.0" y="426" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">The same first leg B₀ = ⟨M⁰, e₀⟩</text>
<text x="320" y="483" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="normal">Old normalization: Tr₀ ⊗ trₙ</text>
<text x="320" y="516" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="normal">New normalization: Tr₀ ⊗ Tr on L²(Mₙ)</text>
<text x="320" y="553" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="bold">Tr(L_b) = n² trₙ(b) ⇒ C_new(q) = n² C_old(q)</text>
<text x="320" y="585" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Center measures agree; relative L² defects are unchanged.</text>
<line x1="35" y1="612" x2="605" y2="612" stroke="#315b70" stroke-width="2"/>
<text x="320" y="647" font-family="Arial, sans-serif" font-size="24" fill="#163c50" text-anchor="middle" font-weight="bold">The centers agree within each row</text>
<text x="320" y="680" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">Z(A) = Z(Ã) ↔ Z(S⁰)</text>
<text x="320" y="712" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">Z(B) = Z(B̃) ↔ Z(R⁰)</text>
<text x="320" y="746" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="bold">Z(A) ∩ M′ ↔ Z(S) ∩ Z(R)</text>
<text x="320" y="777" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">A block in Z(A) needs justification before localizing M defects.</text>
<line x1="35" y1="798" x2="605" y2="798" stroke="#315b70" stroke-width="2"/>
<text x="320" y="832" font-family="Arial, sans-serif" font-size="24" fill="#713d26" text-anchor="middle" font-weight="bold">Spectral-piece warning · Example 52.7</text>
<rect x="50" y="856" width="220" height="75" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="160.0" y="885" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">p z′₀: dim k+1</text>
<text x="160.0" y="912" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">u sends it to support z′₁</text>
<rect x="370" y="856" width="220" height="75" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="480.0" y="885" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">p z′₁: dim k</text>
<text x="480.0" y="912" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">u sends it to support z′₀</text>
<line x1="280" y1="888" x2="360" y2="888" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="360" y1="907" x2="280" y2="907" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="966" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">k = 4ᵗ/2;  Tr(p) = k + ½</text>
<text x="320" y="1000" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">Total relative defect: 1/√(k+½) → 0</text>
<text x="320" y="1033" font-family="Arial, sans-serif" font-size="21" fill="#713d26" text-anchor="middle" font-weight="bold">Each spectral-piece relative defect: √2</text>
<text x="320" y="1065" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">An actual nondegenerate square; no core realization claimed.</text>
<text x="320" y="1097" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">52.3: full trace multiplier · 52.5: verified block hypothesis</text>
</svg>
