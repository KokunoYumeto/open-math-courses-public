<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
<title id="title">Transported tails and their full core closure</title>
<desc id="desc">A specified pair isomorphism transports Jones cups. Full tensor tails become first-leg commutants; coherent unitaries identify their closure. An index-four Bell tunnel shows why an arbitrary infinite common factor cannot always be removed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315b70"/></marker></defs>
<rect width="640" height="1080" fill="#f9fcfe"/>
<text x="320" y="35" font-family="Arial, sans-serif" font-size="26" fill="#163c50" text-anchor="middle" font-weight="bold">A specified tensor map realizes a core</text>
<text x="320" y="66" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="normal">σ : (S ⊗ P ⊂ R ⊗ P) → (S ⊂ R)</text>
<text x="320" y="94" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">P = Mₙ or ℛ · normal and trace preserving</text>
<rect x="40" y="116" width="560" height="78" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="146" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">fⱼ = σ(gⱼ ⊗ 1) ∈ Bⱼ</text>
<text x="320" y="175" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Bⱼ = σ(Aⱼ ⊗ P) = R ∩ Lⱼ⁰;  Aⱼ = R ∩ Lⱼ</text>
<line x1="320" y1="195" x2="320" y2="222" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="229" width="560" height="78" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="259" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">Lⱼ₊₂⁰ = Lⱼ₊₁⁰ ∩ {fⱼ}′</text>
<text x="320" y="288" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">E(Lⱼ₊₁⁰)(fⱼ) = λ1;  λ = 1 / [M:N]</text>
<text x="320" y="336" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Recognized ambient Jones tunnel · 51.13–51.15</text>
<line x1="320" y1="348" x2="320" y2="375" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="382" width="560" height="78" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="412" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">uⱼ ∈ Bⱼ₊₁;  wⱼ = uⱼ ··· u₀</text>
<text x="320" y="441" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">wⱼ gᵢ wⱼ* = fᵢ for every 0 ≤ i ≤ j</text>
<text x="320" y="488" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="normal">Eⱼ = Aⱼ′ ∩ R  →  Fⱼ = Bⱼ′ ∩ R</text>
<text x="320" y="518" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Fⱼ = σ(Eⱼ ⊗ 1): the commutant removes the leg</text>
<line x1="320" y1="530" x2="320" y2="556" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="563" width="560" height="78" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="593" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">α(x) = wⱼ₋₂ x wⱼ₋₂* for x ∈ Eⱼ, j ≥ 2</text>
<text x="320" y="622" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Later uᵢ lie in Bⱼ and fix this value exactly</text>
<text x="320" y="672" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">α(R) = (⋃ Fⱼ)″ = σ(R ⊗ 1) = R⁰</text>
<text x="320" y="704" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">α(Lⱼ′ ∩ M) = (Lⱼ⁰)′ ∩ M;  E_N(R⁰) = S⁰</text>
<text x="320" y="732" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Both entire core closures · 51.18–51.21</text>
<line x1="35" y1="756" x2="605" y2="756" stroke="#315b70" stroke-width="2"/>
<text x="320" y="790" font-family="Arial, sans-serif" font-size="25" fill="#713d26" text-anchor="middle" font-weight="bold">An arbitrary infinite leg can fail</text>
<text x="320" y="822" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">M = ⊗ᵣ≥₁ M₂;  N = 1 ⊗ ⊗ᵣ≥₂ M₂</text>
<text x="320" y="854" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">gⱼ is the Bell projection on sites j+1 and j+2</text>
<rect x="57" y="878" width="56" height="38" rx="5" fill="#f5e8dc" stroke="#a68165"/>
<text x="85" y="904" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">1</text>
<rect x="169" y="878" width="56" height="38" rx="5" fill="#f5e8dc" stroke="#a68165"/>
<text x="197" y="904" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">2</text>
<rect x="281" y="878" width="56" height="38" rx="5" fill="#f5e8dc" stroke="#a68165"/>
<text x="309" y="904" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">3</text>
<rect x="393" y="878" width="56" height="38" rx="5" fill="#f5e8dc" stroke="#a68165"/>
<text x="421" y="904" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">4</text>
<rect x="505" y="878" width="56" height="38" rx="5" fill="#f5e8dc" stroke="#a68165"/>
<text x="533" y="904" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">5</text>
<line x1="85" y1="872" x2="197" y2="872" stroke="#315b70" stroke-width="2"/>
<text x="141" y="904" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">g₀</text>
<line x1="197" y1="926" x2="309" y2="926" stroke="#315b70" stroke-width="2"/>
<text x="253" y="946" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">g₁</text>
<text x="320" y="977" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">[M:N] = 4;  E_N(g₀) = ¼1;  core = N ⊂ M</text>
<text x="320" y="1010" font-family="Arial, sans-serif" font-size="20" fill="#713d26" text-anchor="middle" font-weight="normal">D = N gives D′ ∩ S = ℂ and D′ ∩ R = M₂</text>
<text x="320" y="1040" font-family="Arial, sans-serif" font-size="18" fill="#713d26" text-anchor="middle" font-weight="normal">Tensor splitting holds; the finite pair cannot be a core.</text>
<text x="320" y="1069" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">Theorem 51.4 · finite deletion 51.5 · obstruction 51.6</text>
</svg>
