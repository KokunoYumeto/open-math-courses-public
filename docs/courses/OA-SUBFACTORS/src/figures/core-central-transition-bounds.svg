<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315e78"/></marker></defs>
<rect width="900" height="1160" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#18364c}.title{font-size:27px;font-weight:bold}.head{font-size:23px;font-weight:bold}.math{font-family:Georgia,serif;font-size:25px}.small{font-size:18px}.arrow{fill:none;stroke:#315e78;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="34" y="42" class="title">A common basis controls the joint center</text>
<text x="34" y="76" class="small">General cores; exact bounds precede the remaining localization problem.</text>
<rect x="25" y="99" width="850" height="232" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="136" class="head">1. Keep the first range and pull it down  [68.1]</text>
<rect x="48" y="157" width="770" height="50" fill="#e8f1f7" stroke="#789bae"/>
<rect x="48" y="157" width="180" height="50" fill="#b9d8e9" stroke="#789bae"/>
<text x="63" y="189" class="math">q₁ = eK₁</text>
<text x="283" y="189" class="math">1 − eK₁: normalized trace (d − 1)/d</text>
<text x="48" y="246" class="math">v₁ = eK₁  →  a₁ = 1;     g = Σ aᵢ* aᵢ ≥ 1.</text>
<text x="48" y="290" class="math">t = ⌈d⌉,   b_d = 1 + d(t − 1),   1/d ≤ κ ≤ b_d/d.</text>
<rect x="25" y="353" width="850" height="310" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="390" class="head">2. Both central transitions are bounded  [68.9–68.11]</text>
<text x="48" y="427" class="math">D₀ = Z(S) ∨ Z(R)</text>
<path d="M400,438 L155,486" class="arrow"/>
<path d="M421,438 L675,486" class="arrow"/>
<text x="78" y="521" class="math">Q₀ → Z(S)</text>
<text x="571" y="521" class="math">Pκ → Z(R)</text>
<text x="48" y="568" class="math">x ≥ 0:     x ≤ d Q₀(x),      x ≤ d Pκ(x) ≤ b_d P₀(x).</text>
<text x="48" y="613" class="small">At most ⌊d⌋ supports of any finite partition overlap on either side.</text>
<rect x="25" y="685" width="850" height="326" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="722" class="head">3. Comparable positive kernels can still differ  [68.17]</text>
<path d="M124,790 L747,790" stroke="#315e78" stroke-width="2"/>
<text x="435.5" y="778.0" class="math">3/2</text>
<path d="M124,944 L747,944" stroke="#315e78" stroke-width="2"/>
<text x="435.5" y="932.0" class="math">3/2</text>
<path d="M124,790 L747,944" stroke="#315e78" stroke-width="2"/>
<text x="370.5" y="859.0" class="math">1/2</text>
<path d="M124,944 L747,790" stroke="#315e78" stroke-width="2"/>
<text x="500.5" y="859.0" class="math">1/2</text>
<circle cx="124" cy="790" r="28" fill="#e8f1f7" stroke="#315e78"/>
<text x="111" y="798" class="math">s1</text>
<circle cx="124" cy="944" r="28" fill="#e8f1f7" stroke="#315e78"/>
<text x="111" y="952" class="math">s2</text>
<circle cx="747" cy="790" r="28" fill="#e8f1f7" stroke="#315e78"/>
<text x="734" y="798" class="math">r1</text>
<circle cx="747" cy="944" r="28" fill="#e8f1f7" stroke="#315e78"/>
<text x="734" y="952" class="math">r2</text>
<text x="48" y="986" class="small">Each edge has joint measure 1/4; κ has both marginals 1.</text>
<text x="34" y="1051" class="math">b = (1, 3):    Q₀ b = (2, 2),    Qκ b = (3/2, 5/2).</text>
<text x="34" y="1090" class="small">Proved: small ‖ζ − Qκ P₀ ζ‖₁/c from relative Følner  [68.13].</text>
<text x="34" y="1128" class="small">Still required: the stronger joint-density or compressed-mixing input.</text>
</svg>
