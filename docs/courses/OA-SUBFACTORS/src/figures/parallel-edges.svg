<svg xmlns="http://www.w3.org/2000/svg" width="500" height="470" viewBox="0 0 500 470" role="img" aria-labelledby="title desc">
<title id="title">Two edges count two copies</title>
<desc id="desc">The principal graph for P tensor one inside P tensor M2 has two vertices and two parallel edges. The root is the N-N unit and the other class is Y. At levels zero to four, the multiplicity is 1,2,4,8,16, yielding one matrix endomorphism block of that size. Its adjacency norm is two and its index is four.</desc>
<rect width="500" height="470" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:19px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}</style>
<text x="24" y="32" class="title" text-anchor="start">Two edges count two copies</text>
<text x="24" y="61" class="label" text-anchor="start">N = P ⊗ 1  ⊂  M = P ⊗ M₂</text>
<path d="M85,144 Q250,70 415,144" fill="none" stroke="#2b6fbd" stroke-width="3"/>
<path d="M85,144 Q250,218 415,144" fill="none" stroke="#2b9383" stroke-width="3"/>
<circle cx="85" cy="144" r="9" fill="#1e5c9d" stroke="#172c45" stroke-width="1.5"/>
<circle cx="415" cy="144" r="9" fill="white" stroke="#172c45" stroke-width="1.5"/>
<text x="85" y="119" class="label" text-anchor="middle">1_N</text>
<text x="415" y="119" class="label" text-anchor="middle">Y</text>
<text x="85" y="196" class="small" text-anchor="middle">N–N</text>
<text x="415" y="196" class="small" text-anchor="middle">N–M</text>
<text x="250" y="225" class="label" text-anchor="middle">X = Y ⊕ Y</text>
<text x="28" y="267" class="small" text-anchor="start">Level n</text>
<text x="143" y="267" class="small" text-anchor="start">Class</text>
<text x="258" y="267" class="small" text-anchor="start">Copies</text>
<text x="350" y="267" class="small" text-anchor="start">End(Hₙ)</text>
<text x="47" y="298" class="label" text-anchor="start">0</text>
<text x="151" y="298" class="label" text-anchor="start">1_N</text>
<text x="279" y="298" class="label" text-anchor="start">1</text>
<text x="365" y="298" class="label" text-anchor="start">ℂ</text>
<text x="47" y="327" class="label" text-anchor="start">1</text>
<text x="151" y="327" class="label" text-anchor="start">Y</text>
<text x="279" y="327" class="label" text-anchor="start">2</text>
<text x="365" y="327" class="label" text-anchor="start">M₂</text>
<text x="47" y="356" class="label" text-anchor="start">2</text>
<text x="151" y="356" class="label" text-anchor="start">1_N</text>
<text x="279" y="356" class="label" text-anchor="start">4</text>
<text x="365" y="356" class="label" text-anchor="start">M₄</text>
<text x="47" y="385" class="label" text-anchor="start">3</text>
<text x="151" y="385" class="label" text-anchor="start">Y</text>
<text x="279" y="385" class="label" text-anchor="start">8</text>
<text x="365" y="385" class="label" text-anchor="start">M₈</text>
<text x="47" y="414" class="label" text-anchor="start">4</text>
<text x="151" y="414" class="label" text-anchor="start">1_N</text>
<text x="279" y="414" class="label" text-anchor="start">16</text>
<text x="365" y="414" class="label" text-anchor="start">M₁₆</text>
<line x1="24" y1="433" x2="476" y2="433" stroke="#a4b4c8"/>
<text x="24" y="458" class="small" text-anchor="start">Adjacency norm 2; index 4. The root fixes the parity.</text>
</svg>
