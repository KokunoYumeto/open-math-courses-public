<svg xmlns="http://www.w3.org/2000/svg" width="500" height="725" viewBox="0 0 500 725" role="img" aria-labelledby="title desc">
<title id="title">Why every bounded vector is detected</title>
<desc id="desc">Failure of the uniform orbital test gives a unit vector orthogonal to all conjugates of R in the ultrapower. Matrix approximation puts Q and its commutant join in their span. Corner pinching preserves orthogonality under multiplication by Q. A uniformly bounded finite basis spans the whole ultrapower, contradicting norm one.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#415b78"/></marker></defs>
<rect width="500" height="725" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.main{font-size:18px}.detail{font-size:15px}</style>
<text x="250" y="33" text-anchor="middle" class="title">A missed vector cannot exist</text>
<rect x="20" y="60" width="460" height="82" rx="9" fill="#edf3fa" stroke="#6686aa"/>
<text x="250" y="90" text-anchor="middle" class="main">Failure of the orbital test</text>
<text x="250" y="120" text-anchor="middle" class="detail">x ∈ M^ω, ‖x‖₂ = 1; equation (17.11)</text>
<line x1="250" y1="144" x2="250" y2="172" stroke="#415b78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="180" width="460" height="82" rx="9" fill="#edf3fa" stroke="#6686aa"/>
<text x="250" y="210" text-anchor="middle" class="main">x is orthogonal to W</text>
<text x="250" y="240" text-anchor="middle" class="detail">W = closed span of uR^ωu*; equation (17.4)</text>
<line x1="250" y1="264" x2="250" y2="292" stroke="#415b78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="300" width="460" height="82" rx="9" fill="#edf3fa" stroke="#6686aa"/>
<text x="250" y="330" text-anchor="middle" class="main">The commuting join lies in W</text>
<text x="250" y="360" text-anchor="middle" class="detail">Q ∨ (Q′ ∩ M^ω) ⊆ W; Lemma 17.2</text>
<line x1="250" y1="384" x2="250" y2="412" stroke="#415b78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="420" width="460" height="82" rx="9" fill="#edf3fa" stroke="#6686aa"/>
<text x="250" y="450" text-anchor="middle" class="main">Corner pinching preserves orthogonality</text>
<text x="250" y="480" text-anchor="middle" class="detail">a x b ∈ W⊥ for a, b ∈ Q; Lemma 17.3</text>
<line x1="250" y1="504" x2="250" y2="532" stroke="#415b78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="540" width="460" height="82" rx="9" fill="#edf3fa" stroke="#6686aa"/>
<text x="250" y="570" text-anchor="middle" class="detail">The finite basis spans every bounded vector</text>
<text x="250" y="600" text-anchor="middle" class="detail">M^ω = Σⱼ uⱼ R^ω, uⱼ ∈ Q; equation (17.13)</text>
<line x1="250" y1="624" x2="250" y2="652" stroke="#415b78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="679" text-anchor="middle" class="main">Then x ⟂ M^ω, contradicting ‖x‖₂ = 1.</text>
<text x="250" y="710" text-anchor="middle" class="detail">Q is the ultraproduct of the late factors.</text>
</svg>
