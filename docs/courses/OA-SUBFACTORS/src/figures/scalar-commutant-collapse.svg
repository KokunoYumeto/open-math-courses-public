<svg xmlns="http://www.w3.org/2000/svg" width="740" height="800" viewBox="0 0 740 800"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs><rect width="740" height="800" fill="white"/>
<text x="26" y="40" font-family="Arial, sans-serif" font-size="23" fill="#17324a" font-weight="bold">Recovering the initial bicommutant at a finite stage</text>
<text x="26" y="73" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Bⱼ = Mⱼ′ ∩ T;  Cⱼ = Bⱼ′ ∩ T. Fixed-endpoint proofs: 62.3–62.6.</text>
<rect x="18" y="96" width="704" height="202" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="36" y="130" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">A normal trace-preserving anti-isomorphism γ, with j ≥ 1:</text>
<rect x="40" y="151" width="230" height="47" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="65" y="181" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">M₋ⱼ₊₁</text>
<rect x="481" y="151" width="218" height="47" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="540" y="181" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">Bⱼ₋₁</text>
<line x1="280" y1="174" x2="470" y2="174" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="366" y="165" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">γ</text>
<rect x="40" y="218" width="230" height="47" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="65" y="249" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">M₋ⱼ</text>
<rect x="481" y="218" width="218" height="47" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="540" y="249" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">Bⱼ</text>
<line x1="280" y1="242" x2="470" y2="242" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="366" y="232" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">γ</text>
<text x="36" y="286" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">γ(gⱼ) = eⱼ;  E_(M₋ⱼ′ ∩ M₋ⱼ₊₁)(gⱼ) = λ1.</text>
<rect x="18" y="318" width="704" height="171" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="355" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">E_Cⱼ(eⱼ) lies in Cⱼ ∩ Bⱼ₋₁, because Mⱼ₋₁ ⊂ Cⱼ.</text>
<text x="36" y="394" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Transport the relative expectation through γ: E_Cⱼ(eⱼ) = λ1.</text>
<text x="36" y="432" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Collapse stages starting at M₁:  E_C₁(Mⱼ₊₁) ⊂ E_C₁(Mⱼ).</text>
<text x="36" y="470" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">Normality closes the union and gives C₁ = M₁.</text>
<rect x="18" y="509" width="704" height="172" rx="8" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="545" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">M ⊂ C₀ ⊂ C₁ = M₁.</text>
<text x="36" y="583" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Each y ∈ C₀ commutes with J Dₖ J at every finite level.</text>
<text x="36" y="621" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">The generating union Dₖ is dense in M, so y commutes with JMJ.</text>
<text x="36" y="659" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Only M₁ acts here on L²(M):  y ∈ (JMJ)′ = M. Thus C₀ = M.</text>
<text x="26" y="722" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">Generation also gives tower injection via 61.7–61.8.</text>
<text x="26" y="755" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">With C₀ = M, compression in 61.6 gives E_N F = F E. Proof: 62.5.</text>
<text x="26" y="787" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Human source: Popa, DOI 10.1007/BF02392646, §4.5.1, pp. 223–224.</text>
</svg>