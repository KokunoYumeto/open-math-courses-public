<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc">
<title id="title">Two algebras share one infinite binary tensor factor</title>
<desc id="desc">Commuting matrix factors in the smaller algebra, decreasing complements, and exact coefficient and error bounds.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315b70"/></marker></defs>
<rect width="640" height="1000" fill="#f9fcfe"/>
<text x="320" y="37" font-family="Arial, sans-serif" font-size="27" fill="#163c50" text-anchor="middle" font-weight="bold">A common factor for A ⊂ B</text>
<text x="320" y="68" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Finite type II algebras; centers may be nontrivial</text>
<rect x="45" y="91" width="550" height="82" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320.0" y="120" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">Q₁, Q₂, … ⊂ A</text>
<text x="320.0" y="147" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Each Qₖ ≅ M₂; different Qₖ commute exactly</text>
<line x1="320" y1="174" x2="320" y2="212" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="220" width="550" height="82" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320.0" y="249" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">Dₖ = Q₁ ⊗ ··· ⊗ Qₖ ≅ M(2ᵏ)</text>
<text x="320.0" y="276" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Lemma 50.3 repairs the next factor inside Dₖ′ ∩ A</text>
<line x1="320" y1="303" x2="320" y2="344" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="351" width="245" height="85" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="167.5" y="380" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">Pₖᴬ = Dₖ′ ∩ A</text>
<text x="167.5" y="407" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Pₖ₊₁ᴬ ⊂ Pₖᴬ</text>
<rect x="350" y="351" width="245" height="85" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="472.5" y="380" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">Pₖᴮ = Dₖ′ ∩ B</text>
<text x="472.5" y="407" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Pₖ₊₁ᴮ ⊂ Pₖᴮ</text>
<text x="320" y="399" font-family="Arial, sans-serif" font-size="27" fill="#163c50" text-anchor="middle" font-weight="normal">⊂</text>
<text x="320" y="472" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">Coefficients lie in the appropriate complement</text>
<text x="320" y="503" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">4ᵏ coefficients × tail error &lt; 3·8⁻ᵏ</text>
<text x="320" y="536" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">Reconstruction error &lt; 3·2⁻ᵏ → 0</text>
<line x1="320" y1="550" x2="320" y2="587" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="596" width="550" height="80" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320.0" y="625" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">ℛ₀ = (⋃ Dₖ)″ ⊂ A</text>
<text x="320.0" y="652" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Pᴬ = ℛ₀′ ∩ A; Pᴮ = ℛ₀′ ∩ B; Pᴬ ⊂ Pᴮ</text>
<line x1="320" y1="677" x2="320" y2="710" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="742" font-family="Arial, sans-serif" font-size="27" fill="#163c50" text-anchor="middle" font-weight="bold">A ≅ Pᴬ ⊗ ℛ₀</text>
<text x="320" y="778" font-family="Arial, sans-serif" font-size="27" fill="#163c50" text-anchor="middle" font-weight="bold">B ≅ Pᴮ ⊗ ℛ₀</text>
<text x="320" y="813" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Both maps are multiplication with the same ℛ₀.</text>
<text x="320" y="845" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Traces factorize; maps are normal and injective.</text>
<line x1="35" y1="867" x2="605" y2="867" stroke="#315b70" stroke-width="2"/>
<text x="320" y="901" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="bold">Exact upper bounds at k = 1, 2, 3</text>
<text x="115" y="936" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">k=1: 3/2ᵏ = 3/2</text>
<text x="320" y="936" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">k=2: 3/2ᵏ = 3/4</text>
<text x="525" y="936" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">k=3: 3/2ᵏ = 3/8</text>
<text x="320" y="974" font-family="Arial, sans-serif" font-size="15" fill="#163c50" text-anchor="middle" font-weight="normal">Theorem 50.4 · equations 50.11–50.14 · complements need not be factors</text>
</svg>
