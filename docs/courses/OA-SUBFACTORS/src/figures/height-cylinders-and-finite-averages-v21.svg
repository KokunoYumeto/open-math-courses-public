<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="940" viewBox="0 0 1460 940">
<rect width="1460" height="940" fill="#fafbf9"/>
<text x="60" y="68" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">Fixed WM.22: what finite height-state repair proves</text>
<text x="60" y="116" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400">Original full center, two starting phases, all five likelihoods retained</text>
<rect x="60" y="155" width="590" height="205" rx="18" fill="#e8f0f3" stroke="#245c74" stroke-width="2"/>
<text x="85" y="205" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Actual height-conditioned states</text>
<text x="85" y="248" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">ηK from μU; ρK from μV</text>
<text x="85" y="291" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">First-hit prefix has the tilted weights.</text>
<text x="85" y="334" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">Post-hit finite-lamp error → 0.</text>
<rect x="815" y="155" width="590" height="205" rx="18" fill="#e8f0f3" stroke="#245c74" stroke-width="2"/>
<text x="840" y="205" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Entire cylinder law — HC19.2</text>
<text x="840" y="248" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">Height-state clusters restrict to</text>
<text x="840" y="291" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">the positive-drift lamp probabilities.</text>
<text x="840" y="334" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">Their remote lamp expectations → 1.</text>
<line x1="650" y1="257" x2="815" y2="257" stroke="#245c74" stroke-width="4"/>
<polygon points="815.00,257.00 799.20,265.63 799.20,248.37" fill="#245c74"/>
<text x="665" y="210" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">finite</text>
<text x="665" y="238" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">lamp tests</text>
<rect x="60" y="455" width="590" height="205" rx="18" fill="#f5ead3" stroke="#245c74" stroke-width="2"/>
<text x="85" y="505" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Every finite group average — HC19.7</text>
<text x="85" y="548" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">The origin defect may cancel.</text>
<text x="85" y="591" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">At a sufficiently remote lamp x:</text>
<text x="85" y="634" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">supx ‖σ − σ βax‖ = 2.</text>
<rect x="815" y="455" width="590" height="205" rx="18" fill="#e8f0f3" stroke="#245c74" stroke-width="2"/>
<text x="840" y="505" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">A full Følner cluster — HC19.8</text>
<text x="840" y="548" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">For every fixed group element:</text>
<text x="840" y="591" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">the invariance defect tends to 0.</text>
<text x="840" y="634" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">All finite lamp marginals are fair.</text>
<line x1="355" y1="360" x2="355" y2="455" stroke="#245c74" stroke-width="4"/>
<polygon points="355.00,455.00 346.37,439.20 363.63,439.20" fill="#245c74"/>
<line x1="1108" y1="360" x2="1108" y2="455" stroke="#245c74" stroke-width="4"/>
<polygon points="1108.00,455.00 1099.37,439.20 1116.63,439.20" fill="#245c74"/>
<line x1="650" y1="559" x2="815" y2="559" stroke="#245c74" stroke-width="4"/>
<polygon points="815.00,559.00 799.20,567.63 799.20,550.37" fill="#245c74"/>
<text x="663" y="504" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">weak-star</text>
<text x="663" y="533" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">cluster</text>
<rect x="60" y="755" width="1345" height="110" rx="18" fill="#f0f1ee" stroke="#245c74" stroke-width="2"/>
<text x="85" y="805" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Endpoint still unresolved: ω(R1) = λ/(4+λ)?</text>
<text x="85" y="848" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">Cylinder convergence does not evaluate the bounded measurable full-center Ri.</text>
<text x="60" y="915" fill="#172e35" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">The remote test varies with the finite average. It gives no floor for all invariant states.</text>
</svg>
