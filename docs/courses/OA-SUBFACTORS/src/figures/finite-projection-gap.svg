<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1090" role="img" aria-labelledby="title desc">
<title id="title">A forbidden parameter gap bounds the length of a projection sequence</title>
<desc id="desc">For a gap between a ell plus one and a ell, a long sequence has a first stalled kernel K n equal K n plus one, with two at most n at most ell minus one. Compression by K n minus two leaves a nonzero tail with orthogonal distant terms. That tail has at most ell minus one terms, so the original sequence has at most two ell minus three terms. At parameter two thirds the three projections e,f,e attain this bound.</desc>
<rect width="560" height="1090" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#15283b}.small{font-size:17px}.body{font-size:20px}.head{font-size:23px;font-weight:bold}.label{font-size:19px;font-weight:bold}</style>
<text x="280" y="38" class="head" text-anchor="middle">A gap gives a finite-length bound</text>
<rect x="20" y="62" width="520" height="133" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="96" class="label" text-anchor="start">aᵣ = 1 / (4 cos²(π/r)),     ℓ ≥ 3</text>
<text x="40" y="132" class="body" text-anchor="start">aℓ₊₁ &lt; λ &lt; aℓ</text>
<text x="40" y="168" class="small" text-anchor="start">P₀,…,Pℓ₋₁ &gt; 0,      Pℓ &lt; 0</text>
<path d="M280,202 v17 m-6,-6 l6,6 6,-6" fill="none" stroke="#52738e" stroke-width="2"/>
<rect x="20" y="228" width="520" height="159" rx="10" fill="#f0f7f0" stroke="#9cb4cd"/>
<text x="40" y="263" class="label" text-anchor="start">Long-sequence case: L ≥ ℓ</text>
<text x="40" y="299" class="small" text-anchor="start">Kⱼ = 1 − (q₁ ∨ ⋯ ∨ qⱼ),    K₀ = 1</text>
<text x="40" y="334" class="label" text-anchor="start">First stall: Kₙ = Kₙ₊₁,    2 ≤ n ≤ ℓ − 1</text>
<text x="40" y="369" class="small" text-anchor="start">qₙ₊₁ ≤ q₁ ∨ ⋯ ∨ qₙ₋₁</text>
<path d="M280,394 v17 m-6,-6 l6,6 6,-6" fill="none" stroke="#52738e" stroke-width="2"/>
<rect x="20" y="420" width="520" height="158" rx="10" fill="#fff5e8" stroke="#9cb4cd"/>
<text x="40" y="455" class="label" text-anchor="start">Compress by Kₙ₋₂</text>
<text x="40" y="491" class="body" text-anchor="start">rᵢ = qₙ₊ᵢ Kₙ₋₂ ≠ 0</text>
<text x="40" y="526" class="small" text-anchor="start">Same adjacent relation, parameter λ</text>
<text x="40" y="558" class="small" text-anchor="start">rᵢ rⱼ = 0 whenever |i − j| ≥ 2</text>
<path d="M280,585 v17 m-6,-6 l6,6 6,-6" fill="none" stroke="#52738e" stroke-width="2"/>
<rect x="20" y="610" width="520" height="163" rx="10" fill="#f2eefb" stroke="#9cb4cd"/>
<text x="40" y="646" class="label" text-anchor="start">Tail length = L − n + 1 ≤ ℓ − 1</text>
<text x="40" y="684" class="small" text-anchor="start">A second stalled containment would make</text>
<text x="40" y="713" class="small" text-anchor="start">a nonzero tail term orthogonal to its own range.</text>
<text x="40" y="750" class="label" text-anchor="start">Therefore L ≤ n + ℓ − 2 ≤ 2ℓ − 3</text>
<rect x="20" y="797" width="520" height="243" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="833" class="label" text-anchor="start">First gap example: λ = 2/3,   ℓ = 3</text>
<text x="40" y="872" class="small" text-anchor="start">q₁ = q₃ = e,     q₂ = f,     efe = (2/3)e</text>
<text x="40" y="909" class="small" text-anchor="start">K₁ = 1 − e,    K₂ = K₃ = 0</text>
<text x="40" y="946" class="small" text-anchor="start">n = 2; compressed tail has 2 terms.</text>
<text x="40" y="986" class="label" text-anchor="start">L = 3 = 2ℓ − 3</text>
<text x="40" y="1020" class="small" text-anchor="start">Sharp here; no sharpness claim in later gaps.</text>
<text x="40" y="1070" class="small" text-anchor="start">Lemmas 42.4–42.5; Theorem 42.6; equation 42.20</text>
</svg>
