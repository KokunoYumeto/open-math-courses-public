<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" role="img" aria-labelledby="title desc">
<title id="title">Two-step Jones cups and composed densities</title>
<desc id="desc">Five consecutive factors A through E, blocked triple A C E, normalized four-cup projection, inverse dual density cancellation, exact index, and four-site weighted-spin coefficients.</desc>
<rect width="760" height="1120" fill="#f8fafc"/>
<text x="30" y="38" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="28" text-anchor="start" font-weight="bold">Two-step Jones cups</text>
<text x="30" y="66" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal">64.1–64.3: actual factors, projections, expectations and index</text>
<text x="30" y="99" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal">Every adjacent index is d; λ = 1/d.</text>
<rect x="32" y="116" width="108" height="58" rx="9" fill="#ffffff" stroke="#a8bed2"/>
<text x="86" y="149" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">A</text>
<rect x="179" y="116" width="108" height="58" rx="9" fill="#ffffff" stroke="#a8bed2"/>
<text x="233" y="149" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">B</text>
<rect x="326" y="116" width="108" height="58" rx="9" fill="#ffffff" stroke="#a8bed2"/>
<text x="380" y="149" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">C</text>
<rect x="473" y="116" width="108" height="58" rx="9" fill="#ffffff" stroke="#a8bed2"/>
<text x="527" y="149" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">D</text>
<rect x="620" y="116" width="108" height="58" rx="9" fill="#ffffff" stroke="#a8bed2"/>
<text x="674" y="149" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">E</text>
<line x1="144" y1="145" x2="175" y2="145" stroke="#365b80" stroke-width="2"/>
<text x="159.5" y="141" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" font-weight="normal">⊂</text>
<line x1="291" y1="145" x2="322" y2="145" stroke="#365b80" stroke-width="2"/>
<text x="306.5" y="141" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" font-weight="normal">⊂</text>
<line x1="438" y1="145" x2="469" y2="145" stroke="#365b80" stroke-width="2"/>
<text x="453.5" y="141" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" font-weight="normal">⊂</text>
<line x1="585" y1="145" x2="616" y2="145" stroke="#365b80" stroke-width="2"/>
<text x="600.5" y="141" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" font-weight="normal">⊂</text>
<text x="380" y="204" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="normal">p₀ ∈ C</text>
<text x="527" y="204" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="normal">p₁ ∈ D</text>
<text x="674" y="204" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="normal">p₂ ∈ E</text>
<line x1="86" y1="224" x2="86" y2="248" stroke="#0f766e" stroke-width="3"/>
<line x1="380" y1="224" x2="380" y2="248" stroke="#0f766e" stroke-width="3"/>
<line x1="674" y1="224" x2="674" y2="248" stroke="#0f766e" stroke-width="3"/>
<line x1="86" y1="248" x2="674" y2="248" stroke="#0f766e" stroke-width="3"/>
<text x="380" y="277" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Blocked triple: A ⊂ C ⊂ E</text>
<rect x="30" y="299" width="700" height="130" rx="9" fill="#ffffff" stroke="#a8bed2"/>
<text x="50" y="330" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="start" font-weight="bold">q = d p₁ p₀ p₂ p₁</text>
<text x="50" y="362" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="normal">q² = q     E_C(q) = λ²1     E = ⟨C, q⟩</text>
<text x="50" y="397" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="normal">[C : A] = [E : C] = d²;    τ_E(q) = λ²</text>
<rect x="30" y="449" width="700" height="196" rx="9" fill="#edf7f5" stroke="#79b8ad"/>
<text x="50" y="480" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="bold">Canonical adjacent cups and their cancellation</text>
<text x="50" y="514" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">κ₀ ∈ A′∩B,   κ₁ ∈ B′∩C,   κ₂ = η₁(κ₁⁻¹) ∈ C′∩D</text>
<text x="50" y="548" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="normal">K = κ₀κ₁;   τ_C(K) = 1;   H = F₀ ∘ F₁</text>
<text x="50" y="582" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold">q′ = d r₁ r₀ r₂ r₁ = K½ q K½</text>
<text x="50" y="617" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="normal">E_C(q′) = λ²K;    sharp index of H is d²</text>
<text x="30" y="679" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold">64.5: the exact four-site spin projections</text>
<text x="30" y="708" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">p + q = 1; r = √(pq); d = 1/(pq).</text>
<rect x="30" y="724" width="700" height="150" rx="9" fill="#ffffff" stroke="#a8bed2"/>
<text x="52" y="755" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold">Basis state</text>
<text x="283" y="755" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold">0011</text>
<text x="405" y="755" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold">0101</text>
<text x="527" y="755" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold">1010</text>
<text x="649" y="755" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold">1100</text>
<text x="52" y="796" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">Old vector ξ</text>
<text x="52" y="837" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">Modified vector ζ</text>
<text x="283" y="796" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">q</text>
<text x="283" y="837" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">p</text>
<text x="405" y="796" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">r</text>
<text x="405" y="837" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">r</text>
<text x="527" y="796" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">r</text>
<text x="527" y="837" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">r</text>
<text x="649" y="796" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">p</text>
<text x="649" y="837" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">q</text>
<text x="30" y="908" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal">Both vectors have norm 1 and weight 2; both cup traces are p²q².</text>
<text x="30" y="940" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">K on the last two sites: diag((q/p)², 1, 1, (p/q)²).</text>
<rect x="30" y="961" width="700" height="111" rx="9" fill="#eaf0f8" stroke="#a8bed2"/>
<text x="50" y="991" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="bold">At p = 1/4 and q = 3/4:</text>
<text x="50" y="1023" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">d² = 256/9;  τ(G) = 9/256;  K = diag(9, 1, 1, 1/9)</text>
<text x="50" y="1055" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">E_last two(G) = diag(81, 9, 9, 1)/256</text>
<text x="30" y="1100" fill="#142b43" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal">Finite blocking is proved. The general shifted comparison remains separate.</text>
</svg>
