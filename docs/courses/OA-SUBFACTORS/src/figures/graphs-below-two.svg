<circle cx="335" cy="121" r="7" fill="#ffffff" stroke="#172c45" stroke-width="1.5"/>
<circle cx="425" cy="121" r="7" fill="#ffffff" stroke="#172c45" stroke-width="1.5"/>
<text x="24" y="151" class="small">Aℓ has ℓ vertices and h = ℓ + 1.</text>
<text x="24" y="192" class="label">D₆: arms (1, 1, 3); h = 10</text>
<line x1="65" y1="242" x2="145" y2="242" stroke="#55738f" stroke-width="2.5"/>
<line x1="145" y1="242" x2="225" y2="242" stroke="#55738f" stroke-width="2.5"/>
<line x1="225" y1="242" x2="305" y2="242" stroke="#55738f" stroke-width="2.5"/>
<line x1="305" y1="242" x2="385" y2="217" stroke="#55738f" stroke-width="2.5"/>
<line x1="305" y1="242" x2="385" y2="267" stroke="#55738f" stroke-width="2.5"/>
