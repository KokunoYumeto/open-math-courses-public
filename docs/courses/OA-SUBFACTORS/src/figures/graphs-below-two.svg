<circle cx="255" cy="455" r="7" fill="#ffffff" stroke="#172c45" stroke-width="1.5"/>
<text x="24" y="521" class="small">Red endpoint: μ² = 4 sin²(2π/9) lies in (1, 2).</text>
<text x="24" y="563" class="label">E₈: arms (1, 2, 4); h = 30</text>
