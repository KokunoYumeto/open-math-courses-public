<svg xmlns="http://www.w3.org/2000/svg" width="500" height="670" viewBox="0 0 500 670" role="img" aria-labelledby="title desc">
<title id="title">Graphs with adjacency norm below two</title>
<desc id="desc">A5 and D6 illustrate their families. E6, E7, E8 have arm lengths 1,2,2; 1,2,3; 1,2,4. Filled endpoints mark roots of minimum Perron weight. The red E7 endpoint has squared Perron coordinate between one and two and is therefore impossible for a principal graph.</desc>
<rect width="500" height="670" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:19px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}</style>
<text x="24" y="31" class="title">The candidates below norm two</text>
<text x="24" y="58" class="small">Filled vertex: an endpoint of minimum Perron weight.</text>
<text x="24" y="92" class="label">A₅: a path; h = 6</text>
<line x1="65" y1="121" x2="155" y2="121" stroke="#55738f" stroke-width="2.5"/>
<line x1="155" y1="121" x2="245" y2="121" stroke="#55738f" stroke-width="2.5"/>
<line x1="245" y1="121" x2="335" y2="121" stroke="#55738f" stroke-width="2.5"/>
<line x1="335" y1="121" x2="425" y2="121" stroke="#55738f" stroke-width="2.5"/>
