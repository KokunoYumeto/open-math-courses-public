<circle cx="360" cy="617" r="7" fill="#ffffff" stroke="#172c45" stroke-width="1.5"/>
<circle cx="425" cy="617" r="7" fill="#ffffff" stroke="#172c45" stroke-width="1.5"/>
<circle cx="295" cy="582" r="7" fill="#ffffff" stroke="#172c45" stroke-width="1.5"/>
