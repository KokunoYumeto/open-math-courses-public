<circle cx="385" cy="267" r="7" fill="#ffffff" stroke="#172c45" stroke-width="1.5"/>
<text x="24" y="297" class="small">Dℓ has arms (1, 1, ℓ − 3); h = 2(ℓ − 1).</text>
<text x="24" y="334" class="label">E₆: arms (1, 2, 2); h = 12</text>
<line x1="65" y1="389" x2="145" y2="389" stroke="#55738f" stroke-width="2.5"/>
