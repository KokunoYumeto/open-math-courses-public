<svg xmlns="http://www.w3.org/2000/svg" width="500" height="430" viewBox="0 0 500 430" role="img" aria-labelledby="title desc">
<title id="title">Removing one row permits a matrix copy</title>
<desc id="desc">For M5 plus M8, each minimal row has trace one thirteenth. Two pairs in M5 and four pairs in M8 give six copies of M2. The identity has trace twelve thirteenths; each minimal projection of the copied M2 has trace six thirteenths.</desc>
<rect width="500" height="430" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:19px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}</style>
<text x="24" y="32" class="title" text-anchor="start">A nearly full copy of M₂</text>
<text x="24" y="60" class="small" text-anchor="start">Every cell represents one minimal row: trace 1/13.</text>
<text x="24" y="136" class="label" text-anchor="start">M₅</text>
<rect x="78" y="105" width="43" height="43" rx="4" fill="#2b6fbd"/>
<text x="99.5" y="132" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">a1</text>
<rect x="127" y="105" width="43" height="43" rx="4" fill="#2b9383"/>
<text x="148.5" y="132" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">b1</text>
<rect x="176" y="105" width="43" height="43" rx="4" fill="#2b6fbd"/>
<text x="197.5" y="132" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">a2</text>
<rect x="225" y="105" width="43" height="43" rx="4" fill="#2b9383"/>
<text x="246.5" y="132" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">b2</text>
<rect x="274" y="105" width="43" height="43" rx="4" fill="#d8dde5"/>
<text x="295.5" y="132" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#172c45">×</text>
<text x="78" y="170" class="small" text-anchor="start">2 copies of M₂; one row removed</text>
<text x="24" y="221" class="label" text-anchor="start">M₈</text>
<rect x="78" y="190" width="43" height="43" rx="4" fill="#2b6fbd"/>
<text x="99.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">a3</text>
<rect x="127" y="190" width="43" height="43" rx="4" fill="#2b9383"/>
<text x="148.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">b3</text>
<rect x="176" y="190" width="43" height="43" rx="4" fill="#2b6fbd"/>
<text x="197.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">a4</text>
<rect x="225" y="190" width="43" height="43" rx="4" fill="#2b9383"/>
<text x="246.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">b4</text>
<rect x="274" y="190" width="43" height="43" rx="4" fill="#2b6fbd"/>
<text x="295.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">a5</text>
<rect x="323" y="190" width="43" height="43" rx="4" fill="#2b9383"/>
<text x="344.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">b5</text>
<rect x="372" y="190" width="43" height="43" rx="4" fill="#2b6fbd"/>
<text x="393.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">a6</text>
<rect x="421" y="190" width="43" height="43" rx="4" fill="#2b9383"/>
<text x="442.5" y="217" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="white">b6</text>
<text x="78" y="255" class="small" text-anchor="start">4 copies of M₂; all rows retained</text>
<line x1="24" y1="278" x2="476" y2="278" stroke="#a4b4c8"/>
<text x="24" y="311" class="label" text-anchor="start">Identity q: 12 retained cells, τ(q) = 12/13.</text>
<text x="24" y="340" class="label" text-anchor="start">Blue projection: six a-cells, trace 6/13.</text>
<text x="24" y="369" class="label" text-anchor="start">Green projection: six b-cells, trace 6/13.</text>
<text x="24" y="405" class="small" text-anchor="start">Equal traces allow unitary matching with Az.</text>
</svg>
