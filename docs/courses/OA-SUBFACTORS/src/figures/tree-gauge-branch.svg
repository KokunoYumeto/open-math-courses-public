<svg xmlns="http://www.w3.org/2000/svg" width="540" height="890" viewBox="0 0 540 890" role="img" aria-labelledby="title desc">
<title id="title">One branching phase remains after tree gauge normalization</title>
<desc id="desc">The root leaf matrix is normalized to one. An edge couples the two endpoint diagonal entries by C_u(v,v)=mu_v/mu_u times the conjugate of C_v(u,u). Four edge-copy phases give local row and column phases with inverse diagonal products at opposite endpoints. Degree-two matrices are forced as z,k;k,minus conjugate z. The triple-point block is X=-a P_u+alpha(1-P_u), with the real part of alpha fixed by delta and t0. Its two distinct conjugate unit-circle choices follow from the positive discriminant (4-delta squared)(delta-t0) squared. On D the phase is plus or minus i; flipping only the tip columns in one graph copy exchanges it. Simultaneously flipping rows and columns leaves the matrix unchanged. Lemmas36.1–36.3, Theorem36.4 and Proposition36.5.</desc>
<rect width="540" height="890" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}</style>
<text x="24" y="33" class="title" text-anchor="start">Normalize the arms; keep the branch phase</text>
<rect x="24" y="56" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="85" class="heading" text-anchor="middle">Start at a leaf, then proceed along the tree</text>
<text x="270" y="114" class="label" text-anchor="middle">Root matrix = 1; edge diagonals remain coupled.</text>
<text x="270" y="139" class="label" text-anchor="middle">Cᵤ(v,v) = (μᵥ/μᵤ) conjugate(Cᵥ(u,u))</text>
<rect x="24" y="191" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="220" class="heading" text-anchor="middle">A degree-two vertex is forced</text>
<text x="270" y="249" class="label" text-anchor="middle">Cᵥ = [ z  k ; k  −conjugate(z) ],  k &gt; 0</text>
<text x="270" y="274" class="label" text-anchor="middle">First off-diagonal row/column entries positive.</text>
<text x="270" y="299" class="label" text-anchor="middle">Parent fixes z.</text>
<rect x="24" y="326" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="355" class="heading" text-anchor="middle">The triple point has one remaining unit phase</text>
<text x="270" y="384" class="label" text-anchor="middle">X = −a Pᵤ + α(1−Pᵤ);  |α| = 1</text>
<text x="270" y="409" class="label" text-anchor="middle">Re(α) = (δ²−δt₀−2)/(2a),  a ≠ 0</text>
<rect x="24" y="461" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="490" class="heading" text-anchor="middle">The two choices are distinct</text>
<text x="270" y="519" class="label" text-anchor="middle">4a² − (δ²−δt₀−2)² = (4−δ²)(δ−t₀)² &gt; 0</text>
<text x="270" y="544" class="label" text-anchor="middle">Thus α and conjugate(α) are two gauge classes.</text>
<text x="270" y="616" class="heading" text-anchor="middle">On D: equal tips force α = +i or −i</text>
<circle cx="130" cy="726" r="61" fill="none" stroke="#adbacb"/>
<path d="M51 726 H209 M130 649 V803" stroke="#7c9bbd" fill="none"/>
<circle cx="130" cy="665" r="6" fill="#276a89"/>
<text x="158" y="671" class="label" text-anchor="middle">+i</text>
<circle cx="130" cy="787" r="6" fill="#276a89"/>
<text x="158" y="793" class="label" text-anchor="middle">−i</text>
<text x="190" y="753" class="small" text-anchor="middle">Re</text>
<text x="152" y="648" class="small" text-anchor="middle">Im</text>
<text x="365" y="683" class="heading" text-anchor="middle">Swap tip columns only:</text>
<text x="365" y="713" class="label" text-anchor="middle">α ↦ −α = conjugate(α)</text>
<text x="365" y="752" class="heading" text-anchor="middle">Swap rows and columns:</text>
<text x="365" y="782" class="label" text-anchor="middle">α stays unchanged.</text>
<text x="270" y="844" class="heading" text-anchor="middle">One graph-copy flip exchanges the two D classes.</text>
<text x="270" y="874" class="small" text-anchor="middle">All maps preserve the traced grid and Jones cups.</text>
</svg>
