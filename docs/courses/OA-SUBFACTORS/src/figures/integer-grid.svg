<svg xmlns="http://www.w3.org/2000/svg" width="640" height="865" viewBox="0 0 640 865">
<title>Integer rectangle and its algebraic reflection about zero</title>
<desc>Original corners A minus3 minus1, A minus3 1, A minus2 minus1, A minus2 1. Reflected corners A 1 3, A minus1 3, A 1 2, A minus1 2. Horizontal arrows point right and vertical arrows point upward.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24475e"/></marker></defs>
<rect width="640" height="865" rx="16" fill="#f7fafc"/>
<text x="320" y="30" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#193b50">Commuting integer rectangles</text>
<text x="320" y="61" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#193b50">Exact coordinate reflection about zero</text>
<text x="320" y="98" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#193b50">i = −3, j = −1, k = 1, l = 2</text>
<rect x="77" y="116" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="180" y="153" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(−3,−1)</text>
<rect x="357" y="116" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="460" y="153" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(−3,1)</text>
<rect x="77" y="258" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="180" y="295" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(−2,−1)</text>
<rect x="357" y="258" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="460" y="295" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(−2,1)</text>
<path d="M290 142 L345 142" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M290 284 L345 284" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M180 247 L180 189" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M460 247 L460 189" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="320" y="220" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#193b50">E_P E_B = E_B E_P = E_C</text>
<text x="320" y="347" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#193b50">Each lower algebra is included above.</text>
<text x="320" y="488" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#193b50">Θ₀ : A(r,s) ↦ A(−s,−r)</text>
<rect x="77" y="506" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="180" y="543" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(1,3)</text>
<rect x="357" y="506" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="460" y="543" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(−1,3)</text>
<rect x="77" y="648" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="180" y="685" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(1,2)</text>
<rect x="357" y="648" width="206" height="56" rx="9" fill="#e0eef4" stroke="#83a9bb"/>
<text x="460" y="685" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">A(−1,2)</text>
<path d="M290 532 L345 532" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M290 674 L345 674" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M180 637 L180 579" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M460 637 L460 579" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="320" y="610" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#193b50">E_P E_B = E_B E_P = E_C</text>
<text x="320" y="737" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#193b50">Each lower algebra is included above.</text>
<path d="M320 365 L320 431" stroke="#24475e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="355" y="405" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#193b50">Θ₀</text>
<text x="320" y="785" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#193b50">Arrows show inclusions.</text>
<text x="320" y="815" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#193b50">Θ₀ reverses products and preserves inclusions.</text>
<text x="320" y="845" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#193b50">Infinite normal extension needs separate hypotheses.</text>
</svg>
