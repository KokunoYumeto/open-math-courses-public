<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1350" viewBox="0 0 740 1350">
<rect width="740" height="1350" fill="#f7fafc"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#365d75"/></marker></defs>
<text x="370" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#133c53">Full support from a factorial larger core</text>
<text x="370" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">The smaller canonical center may move under M.</text>
<rect x="20" y="96" width="700" height="228" rx="12" fill="#eaf3f8" stroke="#9bb8c9"/>
<text x="370" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">1 · Transfer through the common cup-factor basis</text>
<text x="200" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#133c53">z ∈ Z(A)</text>
<text x="543" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#133c53">I(z) = d ν(z) · 1 ∈ Z(B)</text>
<path d="M282 172L385 172" stroke="#365d75" stroke-width="3" marker-end="url(#arrow)"/>
<text x="370" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#133c53">I(z) = Σ aᵢ z aᵢ*;  B is a factor because R is a factor.</text>
<text x="370" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">e A e = S e;  e B e = R e;  ν(z) = Tr(e z).</text>
<text x="370" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">This scalar identity does not assert that Z(A) commutes with M.</text>
<rect x="20" y="345" width="700" height="245" rx="12" fill="#e8f4ed" stroke="#9bb8c9"/>
<text x="370" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#133c53">2 · Balance the central dimension with a finite test set</text>
<text x="370" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">h = n · 1 + f;  τ(f) = d − n.</text>
<text x="370" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Average h with powers of v ∈ K₁:  ‖h̄ − d · 1‖ ≤ 1/L.</text>
<text x="370" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#133c53">Include the basis unitaries and v powers in the Følner test set.</text>
<text x="370" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#133c53">ζ = C_A(p), c = Tr(p):  ‖ζ − c · 1‖₁ &lt; σ c.</text>
<rect x="20" y="612" width="700" height="448" rx="12" fill="#fdf0e6" stroke="#9bb8c9"/>
<text x="370" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">3 · Exact example: trim excess and fill deficits</text>
<text x="370" y="686" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#133c53">Center weights 1/2, 1/2 · fourfold dimension scaling</text>
<rect x="65" y="709" width="270" height="100" rx="12" fill="#e6b69b" stroke="#9bb8c9"/>
<rect x="405" y="709" width="270" height="100" rx="12" fill="#9ec5d6" stroke="#9bb8c9"/>
<text x="200" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">Left dimension: 36</text>
<text x="540" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">Right dimension: 32</text>
<text x="200" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Delete dimension 2</text>
<text x="540" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Add dimension 2</text>
<path d="M200 814L200 865" stroke="#365d75" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M540 814L540 865" stroke="#365d75" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="65" y="873" width="270" height="72" rx="12" fill="#b1d4bd" stroke="#9bb8c9"/>
<rect x="405" y="873" width="270" height="72" rx="12" fill="#b1d4bd" stroke="#9bb8c9"/>
<text x="200" y="918" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#133c53">Target dimension: 34</text>
<text x="540" y="918" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#133c53">Target dimension: 34</text>
<text x="370" y="984" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Deleted scalar trace 1 + added scalar trace 1 = 2.</text>
<text x="370" y="1025" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#133c53">C_A(q) = 34 · 1;  Tr(q) = 34;  ‖p − q‖₂² / 34 = 1/17.</text>
<rect x="20" y="1080" width="700" height="179" rx="12" fill="#eeeff9" stroke="#9bb8c9"/>
<text x="370" y="1117" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#133c53">4 · Integer rounding retains the entire Jones support</text>
<text x="370" y="1160" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#133c53">C(q) = k · 1 ⇒ q = sum of k pieces, each equivalent to e_R₀.</text>
<text x="370" y="1200" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">Defect / √k &lt; (√2 + 1) ε₀ / 4 &lt; ε.</text>
<text x="370" y="1238" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">This supplies BF₁, then both local forms and the every-core converse.</text>
<text x="370" y="1294" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">Proof: 58.1–58.7. Lower panel: exact support arithmetic, Example 58.9.</text>
<text x="370" y="1325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#133c53">Block schematic; no spatial or small-error instance asserted. Original · CC0.</text>
</svg>
