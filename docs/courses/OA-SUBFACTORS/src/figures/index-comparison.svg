<svg xmlns="http://www.w3.org/2000/svg" width="540" height="570" viewBox="0 0 540 570" role="img" aria-labelledby="title desc">
<title id="title">One scalar index in two representations</title>
<desc id="desc">The direct sum of two faithful normal representations has summand projections p1 and p2 in the common target commutant A. Its dual T from B to A compresses to the two representation duals. A diagonal reference weight splits both closed spatial forms and their domains. All three identity values have the same scalar c, possibly infinite.</desc>
<rect width="540" height="570" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}.box{fill:#edf3fb;stroke:#7c9bbd;stroke-width:1.5}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426987"/></marker></defs>
<text x="24" y="34" class="title" text-anchor="start">Compare inside H = H₁ ⊕ H₂</text>
<text x="24" y="66" class="label" text-anchor="start">A = π(M)′ ⊂ B = π(N)′;   p₁, p₂ ∈ A</text>
<rect x="24" y="92" width="492" height="115" rx="8" class="box"/>
<text x="270" y="120" class="heading" text-anchor="middle">The common commutant dual</text>
<text x="112" y="156" class="heading" text-anchor="middle">B₊</text>
<text x="428" y="156" class="heading" text-anchor="middle">Â₊</text>
<line x1="145" y1="150" x2="388" y2="150" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="142" class="label" text-anchor="middle">T</text>
<text x="270" y="189" class="label" text-anchor="middle">T(1) = c1,   c ∈ [1, ∞]</text>
<line x1="160" y1="210" x2="150" y2="244" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="380" y1="210" x2="390" y2="244" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="253" width="232" height="136" rx="8" class="box"/>
<text x="140" y="281" class="heading" text-anchor="middle">On H₁</text>
<text x="140" y="311" class="small" text-anchor="middle">T₁ = T restricted to p₁Bp₁</text>
<text x="140" y="340" class="label" text-anchor="middle">T₁(p₁) = c p₁</text>
<text x="140" y="369" class="small" text-anchor="middle">The dual in that representation</text>
<rect x="284" y="253" width="232" height="136" rx="8" class="box"/>
<text x="400" y="281" class="heading" text-anchor="middle">On H₂</text>
<text x="400" y="311" class="small" text-anchor="middle">T₂ = T restricted to p₂Bp₂</text>
<text x="400" y="340" class="label" text-anchor="middle">T₂(p₂) = c p₂</text>
<text x="400" y="369" class="small" text-anchor="middle">The dual in that representation</text>
<text x="270" y="235" class="small" text-anchor="middle">compress by pᵢ</text>
<line x1="24" y1="417" x2="516" y2="417" stroke="#a4b4c8"/>
<text x="24" y="447" class="label" text-anchor="start">β(a) = β₁(p₁ap₁) + β₂(p₂ap₂)</text>
<text x="24" y="477" class="small" text-anchor="start">Diagonal references split both spatial derivatives.</text>
<text x="24" y="503" class="small" text-anchor="start">Their closed-form domains split as well.</text>
<text x="24" y="541" class="small" text-anchor="start">Lemma 22.1 and Theorem 22.2.</text>
</svg>
