<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1640" viewBox="0 0 1460 1640" role="img" aria-labelledby="title desc">
<title id="title">Physical endpoint rigidity and a singular abelian witness</title>
<desc id="desc">The physical conditional expectation of a projection is another projection, forcing equality in the faithful trace. A separate abelian model satisfies twisted state identities with original discrepancy one third.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34566f" stroke-width="1.6"/></marker></defs>
<rect width="1460" height="1640" fill="#fafcfe"/>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#183548} .title{font-size:30px;font-weight:bold} .head{font-size:26px;font-weight:bold} .sub{font-size:21px} .body{font-size:23px} .small{font-size:20px} .eq{font-size:25px} .box{fill:#fff;stroke:#83a7bd;stroke-width:2}</style>
<text x="38" y="48" class="title">Two different tests of the original joint defect</text>
<text x="38" y="80" class="sub">V9.1–V9.20 • Exact formulas; boxes are coordinate diagrams, not trace-scaled areas.</text>
<rect x="30" y="106" width="680" height="850" rx="15" class="box"/>
<rect x="738" y="106" width="692" height="850" rx="15" class="box"/>
<text x="52" y="147" class="head">Actual finite-factor inclusion</text>
<text x="52" y="181" class="sub">C = N′ ∩ M,   E_C preserves the faithful physical τ</text>
<text x="52" y="231" class="eq">k_F = (s/t) f + (t/s)(1−f)</text>
<text x="52" y="269" class="eq">k_C = (s/t) c + (t/s)(1−c)</text>
<text x="52" y="304" class="small">f and c are projections;   0 &lt; t &lt; 1/2,   s = 1−t</text>
<path d="M356 322L356 369" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="90" y="402" class="eq">E_C(k_F) = k_C  ⇒  E_C(f) = c</text>
<text x="64" y="452" class="body">τ(f) = τ(c),   τ(fc) = τ(c)</text>
<text x="64" y="494" class="eq">‖f−c‖₂² = τ(f)+τ(c)−2 Re τ(fc) = 0</text>
<path d="M356 516L356 554" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="200" y="592" class="eq">Faithfulness ⇒ f = c</text>
<text x="64" y="642" class="body">Every ordinary core:   k_F = k_C = k₀</text>
<text x="64" y="681" class="body">Original labels:   w = ℓ;   original cost = 0</text>
<text x="64" y="720" class="body">Every compatible hypertrace:   α = αP₀</text>
<text x="52" y="777" class="head">Unequal-trace diagonal model (HC9)</text>
<text x="64" y="819" class="small">Projection</text>
<text x="290" y="819" class="small">τ</text>
<text x="470" y="819" class="small">dual trace</text>
<text x="64" y="856" class="body">c</text>
<text x="290" y="856" class="body">t</text>
<text x="470" y="856" class="body">s</text>
<text x="64" y="893" class="body">1−c</text>
<text x="290" y="893" class="body">s</text>
<text x="470" y="893" class="body">t</text>
<text x="762" y="147" class="head">Abelian identities without a physical inclusion</text>
<text x="762" y="181" class="sub">D₀ = ℓ∞(ℕ₀ × {0,1}); inherited atomic probability trace</text>
<text x="764" y="233" class="small">U labels</text>
<text x="997" y="233" class="small">Atoms and inherited masses</text>
<text x="1325" y="233" class="small">V labels</text>
<text x="765" y="289" class="eq">sⱼ</text>
<text x="997" y="281" class="body">(j,0):  2⁻ʲ/3</text>
<text x="1325" y="310" class="eq">rⱼ</text>
<text x="765" y="347" class="eq">sⱼ₊₁</text>
<text x="997" y="348" class="body">(j,1):  2⁻ʲ⁻¹/3</text>
<path d="M970 280L829 280" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M970 341L829 341" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1210 280L1300 304" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1210 341L1300 311" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="764" y="398" class="body">P₀ on each rⱼ: weights 2/3 and 1/3</text>
<text x="764" y="438" class="body">Q on each sₖ (k ≥ 1): weights 1/2 and 1/2</text>
<text x="764" y="479" class="body">w = 1;  ℓ(j,0) = 4/3;  ℓ(j,1) = 2/3</text>
<text x="764" y="512" class="small">Boundary exception: ℓ(0,0) = 1</text>
<text x="764" y="556" class="body">f_L(sₖ) = 2ᵏ for k &lt; L, else 0;   L ≥ 2</text>
<text x="764" y="592" class="body">α_L(x) = τ(f_L x)/c_L;   c_L = (2L−1)/3</text>
<text x="764" y="637" class="eq">‖α_LP₀ − ℓα_L‖ = 4 / [3(2L−1)]</text>
<text x="764" y="680" class="eq">α_L(|1−ℓ|) = 2(L−1) / [3(2L−1)]</text>
<path d="M1080 700L1080 737" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="764" y="778" class="head">A singular weak-star cluster state</text>
<text x="764" y="819" class="eq">α = αQ,   αP₀ = ℓα,   Qℓ = 1</text>
<text x="764" y="860" class="eq">Original discrepancy: ‖α−αP₀‖ = 1/3</text>
<text x="764" y="897" class="small">The GNS completion leaves this bounded-test norm intact.</text>
<rect x="30" y="982" width="680" height="224" rx="15" class="box"/>
<rect x="738" y="982" width="692" height="224" rx="15" class="box"/>
<text x="52" y="1021" class="head">Scalar ambient density forces zero original cost</text>
<text x="52" y="1060" class="body">k_C = 1 ⇒ ℓ = 1,   α(w) = α(1/w) = 1</text>
<text x="52" y="1101" class="eq">α((w−1)²/w) = 0 ⇒ α(|w−1|) = 0</text>
<text x="52" y="1141" class="body">For Δ_C = τ(|k_C−1|),  r = t/s &gt; 0:</text>
<text x="52" y="1181" class="eq">φ(original cost) ≤ d (√(Δ_C/r) + Δ_C)</text>
<text x="762" y="1021" class="head">Matching physical spectrum is impossible</text>
<text x="762" y="1060" class="body">If k_C has values 4/3 and 2/3, z ≤ c₋ gives:</text>
<text x="762" y="1101" class="eq">(1−r) / [3(R*−r)] ≤ (2/3−r) / [2(R*−r)]</text>
<text x="762" y="1141" class="body">⇒ r/6 ≤ 0, contradicting the actual r &gt; 0</text>
<text x="762" y="1181" class="small">This excludes the specified extension, not other spectra.</text>
<rect x="30" y="1232" width="1400" height="259" rx="15" class="box"/>
<text x="52" y="1270" class="head">Full all-smooth amenability for the hyperfinite diagonal family</text>
<rect x="52" y="1296" width="410" height="160" rx="15" class="box"/>
<rect x="526" y="1296" width="410" height="160" rx="15" class="box"/>
<rect x="1000" y="1296" width="406" height="160" rx="15" class="box"/>
<text x="70" y="1327" class="small">Any smooth U ⊂ V gives cVc = Uc</text>
<text x="70" y="1363" class="body">Stabilize the represented corners</text>
<text x="70" y="1399" class="body">β₀ : P̃ → P fixes physical P</text>
<text x="70" y="1435" class="small">P is II∞; no tracial state is used</text>
<path d="M468 1370L516 1370" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="545" y="1327" class="small">Average the actual cyclic action</text>
<text x="545" y="1363" class="eq">β_L = L⁻¹ Σ a⁻ⁿ β₀ ãⁿ</text>
<text x="545" y="1399" class="body">Error ≤ 2 ‖X‖ / L</text>
<text x="545" y="1435" class="small">A cluster β satisfies βã = aβ</text>
<path d="M942 1370L990 1370" fill="none" stroke="#34566f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1018" y="1327" class="small">F∞ = M₂(β); finite-corner return</text>
<text x="1018" y="1363" class="body">F : V → M,   F(U) ⊂ N</text>
<text x="1018" y="1399" class="eq">E_N F = F E;   φ = τF</text>
<text x="1018" y="1435" class="small">φ is M-central and compatible</text>
<rect x="30" y="1517" width="1400" height="87" rx="15" class="box"/>
<text x="53" y="1550" class="small">Exact boundary: the diagonal family is fully amenable and jointly balanced; the abelian-only deduction still fails.</text>
<text x="53" y="1582" class="small">For other inclusions, the unrestricted joint state, actual marked corners, full residual and generating conclusions remain open.</text>
