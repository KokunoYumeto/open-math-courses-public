<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1260" viewBox="0 0 640 1260" role="img" aria-labelledby="title desc">
<title id="title">Bounded frames preserve a central support</title>
<desc id="desc">A rounded projection yields bounded canonical columns and L2 vectors. The central spectral cut of a finite-stage expectation yields an exact vector Gram matrix. After fixing the stage, bounded approximation and a right inverse square root preserve that same central support. Uniform column errors and finite-stage constants are used in their respective order.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315b70"/></marker></defs>
<rect width="640" height="1260" fill="#f9fcfe"/>
<text x="320" y="36" font-family="Arial, sans-serif" font-size="26" fill="#163c50" text-anchor="middle" font-weight="bold">One support through all normalizations</text>
<text x="320" y="68" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">Aₘ = Nₘ′ ∩ M;  Bₘ = Nₘ′ ∩ N</text>
<rect x="30" y="92" width="580" height="150" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="123" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">1 · Rounded projection in ⟨N, e_R⟩</text>
<text x="320" y="156" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">p = Σᵢ vᵢvᵢ*;   vᵢ* vⱼ = δᵢⱼ e_R z</text>
<text x="320" y="186" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">z ∈ Z(S), z ≠ 0;   Tr(p) = k τ(z)</text>
<text x="320" y="216" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">ξᵢ = vᵢ 1̂ ∈ L²(N);  ‖vᵢ‖ = 1</text>
<line x1="320" y1="248" x2="320" y2="280" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="290" width="580" height="190" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="321" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">2 · Central spectral cut at a finite stage</text>
<text x="320" y="354" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">h = E_Bₘ(z) ∈ Z(Bₘ)</text>
<text x="320" y="384" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">f = 1_[1−δ,1](h) ∈ Z(Bₘ)</text>
<text x="320" y="414" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">r = f h^(−½), inverse only on f</text>
<text x="320" y="444" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">ζᵢ = ξᵢ r;   E_Aₘ(ζᵢ* ζⱼ) = δᵢⱼ f</text>
<text x="320" y="515" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="normal">‖f − z‖₂ ≤ δ⁻¹ ‖h − z‖₂ → 0</text>
<text x="320" y="548" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Columns give errors uniform in m · (53.11), (53.27)</text>
<line x1="320" y1="564" x2="320" y2="596" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="606" width="580" height="115" rx="8" fill="#e5f1e7" stroke="#6b96ad"/>
<text x="320" y="637" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">3 · Choose δ, then m, then FIX m</text>
<text x="320" y="670" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">Control support loss and all unitary energies.</text>
<text x="320" y="700" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">Only now use the finite constant C_Aₘ.</text>
<line x1="320" y1="727" x2="320" y2="760" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="770" width="580" height="183" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="801" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">4 · Bounded row and its right Gram inverse</text>
<text x="320" y="834" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">Y = (y₁,…,yₖ),  yᵢ ∈ Nf</text>
<text x="320" y="864" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">G = (E_Aₘ(yᵢ* yⱼ)) ∈ Mₖ(fBₘf)</text>
<text x="320" y="894" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">‖G − Iₖf‖ &lt; ½;   a = Y G^(−½)</text>
<text x="320" y="924" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">aᵢ ∈ Nf;   E_Aₘ(aᵢ* aⱼ) = δᵢⱼ f</text>
<text x="320" y="990" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="bold">The central projection f stays EXACTLY the same.</text>
<text x="320" y="1023" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Finite-stage coefficient errors now tend to zero.</text>
<line x1="30" y1="1050" x2="610" y2="1050" stroke="#6b96ad"/>
<text x="320" y="1084" font-family="Arial, sans-serif" font-size="23" fill="#713d26" text-anchor="middle" font-weight="bold">Why preserving support matters</text>
<text x="320" y="1119" font-family="Arial, sans-serif" font-size="18" fill="#713d26" text-anchor="middle" font-weight="normal">In M₁₀₀, 1 − E₁₁ has trace 0.99 but is noncentral.</text>
<text x="320" y="1150" font-family="Arial, sans-serif" font-size="18" fill="#713d26" text-anchor="middle" font-weight="normal">A large new support alone does not recover centrality.</text>
<text x="320" y="1194" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Input existence for general nonfactor cores remains separate.</text>
<text x="320" y="1230" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Proof: 53.3–53.5 · Popa, Corollary 4.2.3, pp. 215–216</text>
</svg>
