<svg xmlns="http://www.w3.org/2000/svg" width="540" height="700" viewBox="0 0 540 700" role="img" aria-labelledby="title desc">
<title id="title">An odd fork forces a half multiplicity</title>
<desc id="desc">A hypothetical D7 graph has even vertices Y0, Y1 and Y2 along its long arm and odd vertices W0, W1 and tips U and V. The general D(2n+3) proof forms N-N products A=U fusion conjugate U and B=U fusion conjugate V. The dual tip rules imply their difference Delta has right-fusion eigenvalue minus one for Y=Y1. The even fusion matrix F has determinant det(F+I)=2, forcing Delta=0. Their sum contains each even class once, so A=B would force unit multiplicity one half, which is impossible.</desc>
<rect width="540" height="700" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.heading{font-size:18px;font-weight:bold}.edge{stroke:#426987;stroke-width:2.5}</style>
<text x="24" y="34" class="title" text-anchor="start">An odd fork contradicts fusion integrality</text>
<text x="24" y="65" class="label" text-anchor="start">Hypothetical D₇, n = 2; root Y₀; general proof below</text>
<line x1="50" y1="160" x2="140" y2="160" class="edge"/>
<line x1="140" y1="160" x2="230" y2="160" class="edge"/>
<line x1="230" y1="160" x2="320" y2="160" class="edge"/>
<line x1="320" y1="160" x2="410" y2="160" class="edge"/>
<line x1="410" y1="160" x2="480" y2="95" class="edge"/>
<line x1="410" y1="160" x2="480" y2="225" class="edge"/>
<circle cx="50" cy="160" r="9" fill="#172c45" stroke="#426987" stroke-width="2.5"/>
<text x="50" y="140" class="label" text-anchor="middle">Y₀</text>
<circle cx="140" cy="160" r="9" fill="#fff" stroke="#426987" stroke-width="2.5"/>
<text x="140" y="140" class="label" text-anchor="middle">W₀</text>
<circle cx="230" cy="160" r="9" fill="#172c45" stroke="#426987" stroke-width="2.5"/>
<text x="230" y="140" class="label" text-anchor="middle">Y₁</text>
<circle cx="320" cy="160" r="9" fill="#fff" stroke="#426987" stroke-width="2.5"/>
<text x="320" y="140" class="label" text-anchor="middle">W₁</text>
<circle cx="410" cy="160" r="9" fill="#172c45" stroke="#426987" stroke-width="2.5"/>
<text x="410" y="140" class="label" text-anchor="middle">Y₂</text>
<circle cx="480" cy="95" r="9" fill="#fff" stroke="#426987" stroke-width="2.5"/>
<text x="480" y="75" class="label" text-anchor="middle">U</text>
<circle cx="480" cy="225" r="9" fill="#fff" stroke="#426987" stroke-width="2.5"/>
<text x="480" y="256" class="label" text-anchor="middle">V</text>
<text x="24" y="270" class="small" text-anchor="start">Filled: N–N modules.  Open: N–M modules.</text>
<rect x="24" y="292" width="492" height="97" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="320" class="heading" text-anchor="middle">The dual tips exchange the products</text>
<text x="270" y="349" class="label" text-anchor="middle">A·Y = T + B;   B·Y = T + A</text>
<text x="270" y="374" class="small" text-anchor="middle">A = U ⊗_M Ū;  B = U ⊗_M V̄;  T = Y₁ + ⋯ + Yₙ.</text>
<rect x="24" y="409" width="492" height="97" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="437" class="heading" text-anchor="middle">The even matrix excludes eigenvalue −1</text>
<text x="270" y="466" class="label" text-anchor="middle">Δ = A − B;   Δ·Y = −Δ;   det(F + I) = 2</text>
<text x="270" y="491" class="small" text-anchor="middle">Lemma 28.3: injectivity forces Δ = 0, hence A = B.</text>
<rect x="24" y="526" width="492" height="97" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="554" class="heading" text-anchor="middle">Their sum contains the unit exactly once</text>
<text x="270" y="583" class="label" text-anchor="middle">A + B = Y₀ + Y₁ + ⋯ + Yₙ</text>
<text x="270" y="608" class="small" text-anchor="middle">A = B would give unit multiplicity 1/2: impossible.</text>
<text x="24" y="661" class="small" text-anchor="start">Lemma 28.1 keeps the original and dual roots separate.</text>
<text x="24" y="687" class="small" text-anchor="start">Theorem 28.4 excludes every D₂ₙ₊₃, n ≥ 1.</text>
</svg>
