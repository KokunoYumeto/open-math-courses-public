<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1530" viewBox="0 0 640 1530" role="img" aria-labelledby="title desc">
<title id="title">Supported frame completion and simultaneous pinching</title>
<desc id="desc">Polar completion retains the initial projection q and fills its missing spectral support inside p. Two orthogonal ranges of trace 51 over 100 exceed the trace of the unit. Simultaneous phase displacement removes off-diagonal blocks and reduces the sum of squared L2 errors by three quarters per refinement. The matrix examples and the abstract bounds are labelled separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315b70"/></marker></defs>
<rect width="640" height="1530" fill="#f9fcfe"/>
<text x="320" y="38" font-family="Arial, sans-serif" font-size="25" fill="#163c50" text-anchor="middle" font-weight="bold">Complete the support; pinch the errors</text>
<text x="320" y="71" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Normalized trace · exact hypotheses · squared energies</text>
<rect x="24" y="94" width="592" height="465" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="129" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">1 · Polar completion inside pMq</text>
<text x="320" y="166" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">y = w h½;  h = y*y;  s = support(h) ≤ q</text>
<text x="173" y="204" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Missing initial support</text>
<text x="467" y="204" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Available final support</text>
<text x="173" y="237" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">q − s</text>
<text x="467" y="237" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">p − ww*</text>
<line x1="246" y1="231" x2="380" y2="231" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="268" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">τ(p − ww*) ≥ τ(q − s) · comparison gives w₁</text>
<text x="320" y="310" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">v = w + w₁;  v*v = q;  vv* ≤ p</text>
<text x="320" y="344" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">‖v − y‖₂² = τ((q − h½)²) ≤ ‖h − q‖₂²</text>
<line x1="45" y1="367" x2="595" y2="367" stroke="#6b96ad"/>
<text x="320" y="397" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="bold">Actual M₄ example · Exercise 54.1</text>
<text x="320" y="433" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">q = E₁₁ + E₂₂;   p = E₃₃ + E₄₄;   y = 2E₃₁</text>
<text x="320" y="467" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">w = E₃₁;   w₁ = E₄₂;   v = E₃₁ + E₄₂</text>
<text x="320" y="502" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Initial: E₁₁ → final E₃₃;  E₂₂ → final E₄₄</text>
<text x="320" y="535" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Squared distance ½ ≤ Gram error 5/2 · (54.1)–(54.4)</text>
<rect x="24" y="584" width="592" height="337" rx="8" fill="#fff3ea" stroke="#6b96ad"/>
<text x="320" y="620" font-family="Arial, sans-serif" font-size="22" fill="#713d26" text-anchor="middle" font-weight="bold">2 · Trace capacity cannot be perturbed away</text>
<text x="320" y="657" font-family="Arial, sans-serif" font-size="18" fill="#713d26" text-anchor="middle" font-weight="normal">n orthogonal ranges equivalent to q need n τ(q) ≤ 1.</text>
<rect x="62" y="698" width="500" height="42" fill="#fff" stroke="#713d26"/>
<rect x="62" y="698" width="255" height="42" fill="#719bb3"/>
<rect x="317" y="698" width="255" height="42" fill="#d99c72"/>
<line x1="562" y1="689" x2="562" y2="753" stroke="#713d26" stroke-width="3"/>
<text x="188" y="726" font-family="Arial, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">51/100</text>
<text x="440" y="726" font-family="Arial, sans-serif" font-size="19" fill="#482617" text-anchor="middle" font-weight="bold">51/100</text>
<text x="320" y="778" font-family="Arial, sans-serif" font-size="19" fill="#713d26" text-anchor="middle" font-weight="normal">Unit capacity = 1;  proposed total = 102/100</text>
<text x="320" y="813" font-family="Arial, sans-serif" font-size="18" fill="#713d26" text-anchor="middle" font-weight="normal">In M₁₀₀ ⊗ W, cross-Gram squared error = 2/100</text>
<text x="320" y="847" font-family="Arial, sans-serif" font-size="19" fill="#713d26" text-anchor="middle" font-weight="normal">(1/5)² τ(q) = 51/2500 &gt; 2/100</text>
<text x="320" y="884" font-family="Arial, sans-serif" font-size="18" fill="#713d26" text-anchor="middle" font-weight="normal">Gram input passes; orthogonal output is impossible.</text>
<rect x="24" y="946" width="592" height="443" rx="8" fill="#e5f1e7" stroke="#6b96ad"/>
<text x="320" y="983" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">3 · One partition treats the whole finite tuple</text>
<text x="320" y="1020" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">C = B′ ∩ M;  D = B ∨ C;  E_D(x) = 0 for every target</text>
<text x="320" y="1058" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">E = Σₓ ‖Φ_P(x)‖₂² &gt; 0</text>
<text x="320" y="1092" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Least-norm orbit hull contains the zero tuple.</text>
<text x="320" y="1126" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Choose u with summed squared displacement &gt; E.</text>
<line x1="320" y1="1140" x2="320" y2="1170" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="1201" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">u₀ = Σⱼ λⱼeⱼ;  |λⱼ| = 1;  refine by eⱼpᵢ</text>
<text x="320" y="1235" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Orthogonal blocks: |λᵢ λ̄ⱼ − 1|² ≤ 4</text>
<text x="320" y="1271" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="bold">E &lt; displacement ≤ 4(E − E_new)</text>
<text x="320" y="1306" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">Therefore E_new &lt; (3/4) E · (54.26)–(54.29)</text>
<text x="320" y="1352" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Diagonal B ⊂ M₂: E₁₂,E₂₁ have E = 1 → E_new = 0.</text>
<text x="320" y="1427" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Bars are trace schematics; the matrix examples are exact.</text>
<text x="320" y="1460" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">Proofs: 54.1–54.5 · Popa, Appendix A.1.1 and A.2.1</text>
<text x="320" y="1493" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">Printed pages 244–246, 249–251 · corrected support/capacity</text>
</svg>
