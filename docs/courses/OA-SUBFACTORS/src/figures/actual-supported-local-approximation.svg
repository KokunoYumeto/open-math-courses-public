<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1410" viewBox="0 0 740 1410">
<rect width="740" height="1410" fill="#f7fafc"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#365d75"/></marker></defs>
<text x="370" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#133c53">Transport the actual support and retain the padding</text>
<text x="370" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#133c53">BF → both local forms → the Følner criterion for every core</text>
<rect x="20" y="89" width="700" height="224" rx="12" fill="#eaf3f8" stroke="#9bb8c9"/>
<text x="370" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">1 · Perturb on r = f q, with capacity n τ(r) ≤ 1</text>
<rect x="49" y="149" width="260" height="73" rx="12" fill="#d7eaf3" stroke="#9bb8c9"/>
<rect x="432" y="149" width="260" height="73" rx="12" fill="#b9d9c8" stroke="#9bb8c9"/>
<text x="179" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Input: yᵢ = aᵢ q ∈ N r</text>
<text x="179" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#133c53">τ(r) = t τ(q)</text>
<path d="M314 185L427 185" stroke="#365d75" stroke-width="3" marker-end="url(#arrow)"/>
<text x="562" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Output: vᵢ* vⱼ = δᵢⱼ r</text>
<text x="562" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#133c53">Orthogonal ranges in N</text>
<text x="370" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Input tolerance on r: δ / √t, where t = τ(f) &gt; 0.</text>
<text x="370" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#133c53">The coefficient estimate remains valid for target u ∈ M.</text>
<rect x="20" y="333" width="700" height="330" rx="12" fill="#e8f4ed" stroke="#9bb8c9"/>
<text x="370" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#133c53">2 · A matrix corner covers only the fraction ρ = τ(P)</text>
<text x="370" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">V(s⁰ f P)V* = g   ⊂   s = V(s⁰ f)V*;   h = s − g</text>
<text x="370" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">Exact support sample: n = 2, t = 3/5, τ(q) = 1/20, ρ = 9/10.</text>
<text x="370" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">τ(s⁰) = 1/9;  τ(q⁰) = τ(s⁰ d₁₁) = 1/20.</text>
<rect x="70" y="489" width="540" height="55" rx="0" fill="#88bd9e" stroke="#9bb8c9"/>
<rect x="610" y="489" width="60" height="55" rx="0" fill="#e6b69b" stroke="#9bb8c9"/>
<text x="340" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#133c53">Covered part g: τ(g) = 3/50</text>
<text x="640" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#133c53">h</text>
<text x="70" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">0</text>
<text x="610" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">3/50</text>
<text x="670" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">1/15</text>
<text x="370" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#133c53">τ(s) = 1/15;  τ(h) = 1/150 = (1 − ρ) τ(s).</text>
<text x="370" y="641" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#133c53">Bar coordinates encode reordered scalar trace; small target errors are not asserted.</text>
<rect x="20" y="683" width="700" height="224" rx="12" fill="#fdf0e6" stroke="#9bb8c9"/>
<text x="370" y="718" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">3 · The corner expectation keeps its own unit</text>
<text x="370" y="759" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#133c53">H = s⁰ f;  C = H Aₗ H = s⁰(f Aₗ f);  λ₀ = τ(s⁰).</text>
<text x="370" y="802" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#133c53">E_C(x) = λ₀⁻¹ s⁰ E_Aₗ(x),   x ∈ H M H</text>
<text x="370" y="843" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">Without λ₀⁻¹ the unit H would be sent to λ₀ H.</text>
<text x="370" y="881" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#133c53">Example above: λ₀⁻¹ = 9.  All norms use the inherited trace.</text>
<rect x="20" y="927" width="700" height="366" rx="12" fill="#eeeff9" stroke="#9bb8c9"/>
<text x="370" y="964" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">4 · Forward error bounds and the exact converse</text>
<text x="370" y="1006" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#133c53">‖[u,s]‖₂ / √τ(s) &lt; ε/4 + 2√γ ≤ 3ε/8</text>
<text x="370" y="1045" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#133c53">dist₂(sus, s Ãₗ s) / √τ(s) &lt; ε/8 + 2√γ ≤ ε/4</text>
<text x="370" y="1080" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#133c53">Here 1 − ρ &lt; γ ≤ min(1/4, ε²/256).</text>
<text x="370" y="1120" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#133c53">Converse: p = s v e_R v*;   Tr(p) = τ(s).</text>
<text x="370" y="1158" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">‖u p u* − p‖₂,Tr² = ‖[u,s]‖₂²</text>
<text x="370" y="1192" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#133c53">+ 2(‖sus‖₂² − ‖E_vRv*(sus)‖₂²)</text>
<text x="370" y="1230" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">The left-translated e_R projects onto v L²(R), a right R-module.</text>
<text x="370" y="1267" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">General core → BF remains; larger-R BF₁ is proved in 58.8.</text>
<text x="370" y="1324" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#133c53">Proof: 57.11–57.29, 57.34–57.35; support sample: Exercise 57.3.</text>
<text x="370" y="1355" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#133c53">Theorem source: Sorin Popa, Classification of amenable subfactors of type II, 4.3.1.</text>
<text x="370" y="1385" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#133c53">Original block schematic · reproducible SVG source · CC0 1.0</text>
</svg>
