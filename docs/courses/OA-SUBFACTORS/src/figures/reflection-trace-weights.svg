<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 930" role="img" aria-labelledby="title desc">
<title id="title">Reflection compares two different factor traces</title>
<desc id="desc">A diagonal inclusion has corner traces one quarter and three quarters, local indices one, and total index sixteen thirds. The normalized trace of the opposite factor M prime assigns the reflected projection one quarter, while the tower factor M1 assigns it three quarters.</desc>
<rect width="560" height="930" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#15283b} .small{font-size:17px}.body{font-size:20px}.head{font-size:23px;font-weight:bold}.label{font-size:19px;font-weight:bold}</style>
<text x="280" y="40" class="head" text-anchor="middle">One projection, two trace weights</text>
<rect x="20" y="64" width="520" height="193" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="95" class="label" text-anchor="start">M = M₄ ⊗ R₀</text>
<text x="40" y="126" class="body" text-anchor="start">p = E₁₁ ⊗ 1,   q = 1 − p</text>
<text x="40" y="157" class="body" text-anchor="start">N = {α(x) + β(x) : x ∈ R₀}</text>
<text x="40" y="190" class="label" text-anchor="start">Np = pMp,   Nq = qMq</text>
<text x="40" y="226" class="small" text-anchor="start">Local indices: 1 and 1</text>
<rect x="20" y="279" width="520" height="159" rx="10" fill="#f0f7f0" stroke="#9cb4cd"/>
<text x="40" y="311" class="label" text-anchor="start">Dimension trace on N′</text>
<text x="40" y="347" class="body" text-anchor="start">T_N(p) = 4,     T_N(q) = 4/3</text>
<text x="40" y="383" class="label" text-anchor="start">[M : N] = T_N(1) = 16/3</text>
<text x="40" y="416" class="small" text-anchor="start">ρ_N′(p) = 3/4,    ρ_N′(q) = 1/4</text>
<rect x="20" y="460" width="520" height="190" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="493" class="label" text-anchor="start">Finite reflection: Θ(p) = JpJ = b ∈ B₁</text>
<text x="40" y="528" class="small" text-anchor="start">M′ = JMJ:    ρ_M′(b) = τ_M(p) = 1/4</text>
<rect x="40" y="547" width="480" height="24" fill="#dce6ef"/>
<rect x="40" y="547" width="120" height="24" fill="#246b9b"/>
<text x="40" y="605" class="small" text-anchor="start">M₁ = JN′J:    τ_M₁(b) = ρ_N′(p) = 3/4</text>
<rect x="40" y="623" width="480" height="24" fill="#dce6ef"/>
<rect x="40" y="623" width="360" height="24" fill="#9e593b"/>
<rect x="20" y="672" width="520" height="217" rx="10" fill="#fff5e8" stroke="#9cb4cd"/>
<text x="40" y="709" class="label" text-anchor="start">Extension criteria</text>
<text x="40" y="746" class="small" text-anchor="start">Trace preserving: equality at every finite level.</text>
<text x="40" y="781" class="small" text-anchor="start">Normal: the pulled-back tower state extends</text>
<text x="40" y="809" class="small" text-anchor="start">faithfully and normally to the downward closure.</text>
<text x="40" y="849" class="small" text-anchor="start">For a factor closure, the criteria coincide.</text>
<text x="40" y="914" class="small" text-anchor="start">Theorems 40.1 and 40.3; Proposition 40.2</text>
</svg>
