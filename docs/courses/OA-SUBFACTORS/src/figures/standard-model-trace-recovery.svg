<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc"><title id="title">Finite trace recovery reconstructs the ordinary standard model</title><desc id="desc">A finite skipped-cup equation recovers the downward trace from the marked upward ladder. The recovered trace and the physical opposite trace give different completions. The index-ten PG example displays their exact first-level weights.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#3a607b"/></marker></defs><rect width="1000" height="1120" fill="white"/><g font-family="Arial, DejaVu Sans, sans-serif">
<text x="38" y="43" font-size="29" font-weight="bold" text-anchor="start" fill="#142c42">The marked invariant recovers the downward trace</text>
<text x="38" y="78" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Finite index; every finite stage; no extremality or finite-depth assumption.</text>
<rect x="28" y="104" width="944" height="235" rx="12" fill="#eef5fc" stroke="#9aafbd"/>
<text x="52" y="144" font-size="24" font-weight="bold" text-anchor="start" fill="#142c42">Finite data in A₂K, with dyadic K ≥ k (17.20)–(17.23)</text>
<text x="52" y="188" font-size="24" font-weight="normal" text-anchor="start" fill="#142c42">b ∈ Bₖ ⊂ B_K;    G_K = B₂K ∩ {e₀,…,e_K₋₁}′</text>
<text x="52" y="231" font-size="25" font-weight="bold" text-anchor="start" fill="#142c42">Unique η_K(b) ∈ G_K:     η_K(b) F_K = b F_K</text>
<text x="52" y="274" font-size="25" font-weight="bold" text-anchor="start" fill="#142c42">Recovered trace:     tₖ(b) = σ₂K(η_K(b))</text>
<text x="52" y="314" font-size="22" font-weight="normal" text-anchor="start" fill="#142c42">F₁ = e₁;    F₂ = d e₂ e₁ e₃ e₂;    τ(F_K) = d⁻ᴷ.</text>
<rect x="28" y="362" width="944" height="234" rx="12" fill="#edf7f3" stroke="#9aafbd"/>
<text x="52" y="402" font-size="24" font-weight="bold" text-anchor="start" fill="#142c42">Whole ordinary-core reconstruction (17.25)–(17.27)</text>
<text x="64" y="450" font-size="25" font-weight="bold" text-anchor="start" fill="#142c42">(B_algᵒᵖ, t)</text>
<path d="M270,442 L375,442" stroke="#3a607b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="397" y="450" font-size="26" font-weight="bold" text-anchor="start" fill="#142c42">Rʳᵉᶜ</text>
<path d="M525,442 L630,442" stroke="#3a607b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="650" y="450" font-size="25" font-weight="bold" text-anchor="start" fill="#142c42">ordinary core R</text>
<text x="52" y="491" font-size="22" font-weight="normal" text-anchor="start" fill="#142c42">The smaller row is Cₖ = Bₖ ∩ {e₀}′; the same maps carry S.</text>
<text x="52" y="532" font-size="19" font-weight="normal" text-anchor="start" fill="#142c42">SA.7: strong amenability + separable predual give the core-pair isomorphism to N ⊂ M.</text>
<text x="52" y="573" font-size="22" font-weight="normal" text-anchor="start" fill="#142c42">Compare two recovered models to classify the original proper pairs.</text>
<rect x="28" y="619" width="944" height="406" rx="12" fill="#fff5e9" stroke="#9aafbd"/>
<text x="52" y="659" font-size="24" font-weight="bold" text-anchor="start" fill="#142c42">Both traces stay explicit: the existing actual PG model</text>
<text x="80" y="704" font-size="23" font-weight="bold" text-anchor="start" fill="#142c42">Given upward σ₁ on B₁</text>
<text x="557" y="704" font-size="23" font-weight="bold" text-anchor="start" fill="#142c42">Recovered downward t₁</text>
<rect x="80" y="843.0" width="65" height="75.0" rx="0" fill="#287db1" stroke="#287db1"/>
<text x="112.5" y="833.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#142c42">1/4</text>
<text x="112.5" y="949" font-size="19" font-weight="normal" text-anchor="middle" fill="#142c42">b0</text>
<rect x="180" y="768.0" width="65" height="150.0" rx="0" fill="#287db1" stroke="#287db1"/>
<text x="212.5" y="758.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#142c42">1/2</text>
<text x="212.5" y="949" font-size="19" font-weight="normal" text-anchor="middle" fill="#142c42">b1</text>
<rect x="280" y="843.0" width="65" height="75.0" rx="0" fill="#287db1" stroke="#287db1"/>
<text x="312.5" y="833.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#142c42">1/4</text>
<text x="312.5" y="949" font-size="19" font-weight="normal" text-anchor="middle" fill="#142c42">b2</text>
<path d="M70,918 H365" stroke="#98a8b5" stroke-width="1.5"/>
<rect x="557" y="798.0" width="65" height="120.0" rx="0" fill="#248773" stroke="#248773"/>
<text x="589.5" y="788.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#142c42">2/5</text>
<text x="589.5" y="949" font-size="19" font-weight="normal" text-anchor="middle" fill="#142c42">b0</text>
<rect x="657" y="858.0" width="65" height="60.0" rx="0" fill="#248773" stroke="#248773"/>
<text x="689.5" y="848.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#142c42">1/5</text>
<text x="689.5" y="949" font-size="19" font-weight="normal" text-anchor="middle" fill="#142c42">b1</text>
<rect x="757" y="798.0" width="65" height="120.0" rx="0" fill="#248773" stroke="#248773"/>
<text x="789.5" y="788.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#142c42">2/5</text>
<text x="789.5" y="949" font-size="19" font-weight="normal" text-anchor="middle" fill="#142c42">b2</text>
<path d="M547,918 H842" stroke="#98a8b5" stroke-width="1.5"/>
<text x="52" y="991" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Bar heights = 300 px per trace unit. Both triples sum to 1.</text>
<text x="38" y="1060" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Completing B_alg with σ gives the physical opposite model; (17.26) uses t.</text>
<text x="38" y="1095" font-size="20" font-weight="normal" text-anchor="start" fill="#142c42">Proofs17.8–17.10. Popa (1994), §1.3.5 and Theorem5.1.1, printed226.</text>
</g></svg>
