<svg xmlns="http://www.w3.org/2000/svg" width="740" height="940" viewBox="0 0 740 940">
<rect width="740" height="940" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#355b77"/></marker></defs>
<text x="26" y="38" font-family="Arial, sans-serif" font-size="23" fill="#17324a" font-weight="bold">Rescale the actual cup with the commutant density</text>
<text x="26" y="68" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Finite P ⊂ Q ⊂ R = ⟨Q,e⟩; index d; λ = 1/d. Proof: 63.1–63.5.</text>
<rect x="18" y="91" width="704" height="166" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<rect x="42" y="121" width="166" height="48" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="116" y="152" font-family="Arial, sans-serif" font-size="23" fill="#17324a" font-weight="bold">P</text>
<rect x="276" y="121" width="166" height="48" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="350" y="152" font-family="Arial, sans-serif" font-size="23" fill="#17324a" font-weight="bold">Q</text>
<rect x="526" y="121" width="166" height="48" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="600" y="152" font-family="Arial, sans-serif" font-size="23" fill="#17324a" font-weight="bold">R</text>
<path d="M208,145 L273,145" stroke="#355b77" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M442,145 L523,145" stroke="#355b77" stroke-width="2" marker-end="url(#arrow)"/>
<text x="39" y="202" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">κ ∈ Z(P′ ∩ Q),  ρ(x) = τ_Q(κx),  τ_Q(κ) = 1.</text>
<text x="39" y="237" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">η: P′ ∩ Q → Q′ ∩ R is finite reflection; E_A(e) = λη(κ⁻¹).</text>
<rect x="18" y="277" width="704" height="212" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="310" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">Canonical g = κ¹ᐟ² e κ¹ᐟ² ∈ P′ ∩ R is an actual projection.</text>
<text x="36" y="346" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">E_(Q′∩R)(g) = λ1;       E_Q(g) = λκ;       τ_R(g) = λ.</text>
<text x="36" y="382" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">F(x) = E_P(κ¹ᐟ² x κ¹ᐟ²);    g x g = F(x) g;    ⟨Q,g⟩ = R.</text>
<text x="36" y="418" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">F is faithful normal; its exact scalar / positive index is d.</text>
<text x="36" y="458" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">F preserves the inherited trace precisely when κ = 1.</text>
<rect x="18" y="509" width="704" height="214" rx="8" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="542" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">Weighted-spin example: p = 1/4; q = 3/4; λ = 3/16.</text>
<text x="39" y="579" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="bold">Lower second-site block</text>
<text x="288" y="579" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">τ_Q</text>
<text x="378" y="579" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">ρ</text>
<text x="469" y="579" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">κ</text>
<text x="564" y="579" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">E_Q(g)</text>
<text x="48" y="614" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">P₀</text>
<text x="288" y="614" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1/4</text>
<text x="378" y="614" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">3/4</text>
<text x="469" y="614" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">3</text>
<text x="564" y="614" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">9/16</text>
<text x="48" y="650" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">P₁</text>
<text x="288" y="650" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">3/4</text>
<text x="378" y="650" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1/4</text>
<text x="469" y="650" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1/3</text>
<text x="564" y="650" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1/16</text>
<text x="36" y="694" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">The upper relative expectation is (3/16)1 at both first-site blocks.</text>
<rect x="18" y="743" width="704" height="110" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="36" y="777" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">Every actual tunnel has these modified cups and the same index.</text>
<text x="36" y="811" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">gⱼgⱼ₊₁gⱼ = λgⱼ;  gⱼ₊₁gⱼgⱼ₊₁ = λgⱼ₊₁;  [gⱼ,gₖ] = 0 for |j−k| ≥ 2.</text>
<text x="36" y="838" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">The shifted trace-preserving comparison remains a separate input.</text>
<text x="26" y="891" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Positions are schematic; all operators, domains and coefficients are exact.</text>
<text x="26" y="918" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Human source: Popa, DOI 10.1007/BF02392646, §4.5.1, p. 224.</text>
</svg>