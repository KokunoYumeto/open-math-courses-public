<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="990" viewBox="0 0 1120 990">
<title>All smooth representations and compatible hypertraces under a physical corner</title>
<rect width="1120" height="990" fill="#fafbfc"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315b76"/></marker></defs>
<text x="30" y="43" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="bold" fill="#172d3d">All smooth representations: finite induction and return</text>
<text x="30" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172d3d">0 ≠ p ∈ N;  t = τ(p);  vᵢ = vᵢp;  Σ vᵢvᵢ* = 1;  V = (vᵢ);  q = V*V.</text>
<rect x="30" y="115" width="1040" height="127" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="148" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">The finite matrix identification — Theorem 61.9</text>
<text x="46" y="180" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Θₓ(x) = V*xV : X → q Matᵣ(pXp)q;       Θₓ⁻¹(C) = VCV*.</text>
<text x="46" y="209" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Both maps are normal *-isomorphisms, with units 1 and q.</text>
<text x="46" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Every represented tower level and every smoothness inclusion is retained.</text>
<rect x="30" y="295" width="480" height="169" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Any original smooth square</text>
<text x="46" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">U ⊂ V₀ above N ⊂ M.</text>
<text x="46" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Compress: pUp ⊂ pV₀p.</text>
<text x="46" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Its whole tower is pVⱼp, cups peⱼ.</text>
<text x="46" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Corner amenability supplies Fₚ.</text>
<rect x="590" y="295" width="480" height="169" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="606" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Any corner smooth square</text>
<text x="606" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Uₚ ⊂ Wₚ above pNp ⊂ pMp.</text>
<text x="606" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Induce: q Matᵣ(Uₚ)q ⊂ q Matᵣ(Wₚ)q.</text>
<text x="606" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Its whole tower is q Matᵣ(Wₚ,ⱼ)q.</text>
<text x="606" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Original amenability supplies F̃.</text>
<path d="M270 250 L270 282" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M830 250 L830 282" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="510" width="480" height="157" rx="10" fill="#eef6eb" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Return to the original pair — (61.37)</text>
<text x="46" y="575" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">F(x) = Σᵢ,ⱼ vᵢ Fₚ(vᵢ*xvⱼ) vⱼ*.</text>
<text x="46" y="604" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">F is UCP, fixes M and sends U into N.</text>
<text x="46" y="633" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">EₙF = FE;       hypertrace = τF.</text>
<rect x="590" y="510" width="480" height="157" rx="10" fill="#eef6eb" stroke="#91aabb" stroke-width="2"/>
<text x="606" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Return to the corner pair — (61.39)</text>
<text x="606" y="575" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">W = (pvᵢ);  WW* = p;  a = W*W = Θ(p).</text>
<text x="606" y="604" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Fₚ(b) = W F̃(W*bW) W*.</text>
<text x="606" y="633" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Hypertrace = τₚFₚ;       τₚ = τ/t.</text>
<path d="M270 474 L270 499" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M830 474 L830 499" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="715" width="1040" height="142" rx="10" fill="#f6f1e7" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="748" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Full equivalence — Theorem 61.11</text>
<text x="46" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">N ⊂ M amenable  ⇔  pNp ⊂ pMp amenable  ⇔  every real amplification amenable.</text>
<text x="46" y="809" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">α &gt; 0: choose n ≥ α;  (τ ⊗ Trₙ)(b) = α;  normalized projection trace = α/n.</text>
<text x="46" y="838" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Finite sums preserve arbitrary compatible states; F and Fₚ need not be normal.</text>
<path d="M270 678 L270 704" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M830 678 L830 704" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="30" y="902" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172d3d">Corollary 61.12: strong amenability also retains factoriality of the whole ordinary core.</text>
<text x="30" y="940" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">No extremality, finite depth or ambient separability is imposed. Diagram positions are schematic.</text>
</svg>
