<svg xmlns="http://www.w3.org/2000/svg" width="540" height="630" viewBox="0 0 540 630" role="img" aria-labelledby="title desc">
<title id="title">A cyclic action realizes the rooted D4 graph</title>
<desc id="desc">The root is one of three even leaves, each of Perron value one. Each leaf joins the odd central vertex, of Perron value square root three. Three Fourier projections p0, p1 and p2 form the depth-two algebra C cubed, each with trace one third; p0 is the Jones projection. The sole length-three endpoint has multiplicity three and gives the matrix algebra M3. The graph norm is square root three, index three and depth two.</desc>
<rect width="540" height="630" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.edge{stroke:#426987;stroke-width:3}.leaf{fill:#fff;stroke:#426987;stroke-width:3}.odd{fill:#bcd2e8;stroke:#426987;stroke-width:3}</style>
<text x="24" y="34" class="title" text-anchor="start">Three Fourier blocks give D₄</text>
<text x="24" y="66" class="label" text-anchor="start">Outer cyclic action: Rᴳ ⊂ R ⊂ R ⋊ G,  |G| = 3</text>
<line x1="270" y1="210" x2="95" y2="210" class="edge"/>
<line x1="270" y1="210" x2="405" y2="115" class="edge"/>
<line x1="270" y1="210" x2="405" y2="305" class="edge"/>
<circle cx="270" cy="210" r="12" class="odd"/>
<circle cx="95" cy="210" r="10" fill="#172c45" stroke="#426987" stroke-width="3"/>
<circle cx="405" cy="115" r="10" fill="#fff" stroke="#426987" stroke-width="3"/>
<circle cx="405" cy="305" r="10" fill="#fff" stroke="#426987" stroke-width="3"/>
<text x="95" y="180" class="label" text-anchor="middle">root: μ = 1</text>
<text x="270" y="245" class="label" text-anchor="middle">μ = √3</text>
<text x="405" y="90" class="label" text-anchor="middle">μ = 1</text>
<text x="405" y="338" class="label" text-anchor="middle">μ = 1</text>
<text x="270" y="382" class="label" text-anchor="middle">δ = √3;  index δ² = 3;  depth = 2</text>
<rect x="24" y="410" width="492" height="142" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="439" class="label" text-anchor="middle">A₁ = ℂ³:  p₀, p₁, p₂;  τ(pⱼ) = 1/3</text>
<text x="270" y="472" class="label" text-anchor="middle">p₀ = e_P = (1 + U + U²)/3</text>
<text x="270" y="507" class="label" text-anchor="middle">A₂ = M₃:  three length-three paths</text>
<text x="270" y="536" class="small" text-anchor="middle">Minimal matrix-projection trace at this level: 1/3</text>
<text x="24" y="588" class="small" text-anchor="start">Lemma 26.1 and Theorem 26.2 identify the rooted graph.</text>
<text x="24" y="613" class="small" text-anchor="start">Theorem 26.4: every D₄ pair is a cyclic crossed product.</text>
</svg>
