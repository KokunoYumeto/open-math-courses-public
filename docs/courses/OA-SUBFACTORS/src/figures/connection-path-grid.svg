<svg xmlns="http://www.w3.org/2000/svg" width="540" height="730" viewBox="0 0 540 730" role="img" aria-labelledby="title desc">
<title id="title">Two unitary cell matrices build a path grid</title>
<desc id="desc">An elementary square has a and d on one graph parity, b and c on the other. Fixing a,d gives U with row b and column c. Fixing b,c gives R with row a and column d, the conjugate coefficient times square root mu(a)mu(d) over mu(b)mu(c). The first changes path order; the second proves commuting expectations. Full support makes the square nondegenerate. Moving a normalized vertical cup across a horizontal edge leaves that edge followed by the normalized cup at its endpoint. The factor inclusion has index delta squared, while its graph still requires flatness.</desc>
<rect width="540" height="730" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}</style>
<text x="24" y="33" class="title" text-anchor="start">Two unitary matrices build a path grid</text>
<text x="55" y="85" class="heading" text-anchor="middle">a</text>
<text x="187" y="85" class="heading" text-anchor="middle">b</text>
<text x="55" y="163" class="heading" text-anchor="middle">c</text>
<text x="187" y="163" class="heading" text-anchor="middle">d</text>
<path d="M70 79 H166 M70 157 H166 M55 99 V140 M187 99 V140" stroke="#426987" stroke-width="2" fill="none"/>
<text x="117" y="72" class="small" text-anchor="middle">h</text>
<text x="117" y="183" class="small" text-anchor="middle">h</text>
<text x="36" y="123" class="small" text-anchor="middle">v</text>
<text x="208" y="123" class="small" text-anchor="middle">v</text>
<text x="256" y="87" class="small" text-anchor="start">a,d: one parity</text>
<text x="256" y="117" class="small" text-anchor="start">b,c: the other parity</text>
<text x="256" y="153" class="small" text-anchor="start">Each side is a graph edge.</text>
<rect x="24" y="211" width="492" height="106" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="239" class="heading" text-anchor="middle">Fix a,d: rows b, columns c</text>
<text x="270" y="268" class="label" text-anchor="middle">Uᵃ˒ᵈ_b,c = w(a,b,c,d)</text>
<text x="270" y="292" class="small" text-anchor="middle">The unitary U changes v h to h v.</text>
<rect x="24" y="335" width="492" height="106" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="363" class="heading" text-anchor="middle">Fix b,c: rows a, columns d</text>
<text x="270" y="392" class="label" text-anchor="middle">Rᵇ˒ᶜ_a,d = √[μ(a)μ(d)/μ(b)μ(c)] · w̅</text>
<text x="270" y="416" class="small" text-anchor="middle">The weighted unitary R gives commuting expectations.</text>
<rect x="24" y="459" width="492" height="106" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="487" class="heading" text-anchor="middle">A normalized cup passes through a cell</text>
<text x="270" y="516" class="label" text-anchor="middle">cupₐ followed by (a → d) ↦ (a → d) then cup_d</text>
<text x="270" y="540" class="small" text-anchor="middle">Output coefficient: 1_{c=d} √[μ(b)/(δ μ(d))].</text>
<rect x="24" y="583" width="492" height="112" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="611" class="heading" text-anchor="middle">Full path support gives the actual factor tower</text>
<text x="270" y="640" class="label" text-anchor="middle">Full support ⇒ nondegenerate square;  [M : N] = δ²</text>
<text x="270" y="664" class="small" text-anchor="middle">The principal graph also requires flatness.</text>
<text x="24" y="722" class="small" text-anchor="start">Proposition 32.2, Lemma 32.3 and Theorem 32.4.</text>
</svg>
