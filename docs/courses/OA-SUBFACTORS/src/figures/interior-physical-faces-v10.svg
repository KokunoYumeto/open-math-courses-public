<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1260" viewBox="0 0 1640 1260">
<rect width="1640" height="1260" fill="#f7f9fc"/>
<text x="48" y="66" font-family="Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#152438">Interior density: a physical spectral cut is not an admissible return</text>
<text x="48" y="115" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">Actual index-18 Jones model • full all-smooth amenability • generating product tunnel</text>
<rect x="48" y="145" width="1544" height="158" rx="18" fill="#eaf1fb" stroke="#b8c8dc" stroke-width="3"/>
<text x="76" y="202" font-family="Segoe UI, sans-serif" font-size="37" font-weight="700" fill="#152438">N = N₀ x 1 x F    inside    M = M₀ x Mat₂ x F</text>
<text x="76" y="252" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">Weighted-spin index 9/2 × Bell index 4 = 18.  F is the infinite hyperfinite tensor tail.</text>
<text x="76" y="290" font-family="Segoe UI, sans-serif" font-size="27" font-weight="400" fill="#152438">All-smooth proof: V9.5 + IF.3a (larger matrix leg) + IF.3b (common tail).</text>
<rect x="48" y="330" width="1544" height="250" rx="18" fill="#ffffff" stroke="#b8c8dc" stroke-width="3"/>
<text x="76" y="380" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#152438">Physical commutant C = Mat₂ + Mat₂, central blocks c₊ and c₋</text>
<text x="76" y="431" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#152438">Block</text>
<text x="290" y="431" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#152438">Inherited τ</text>
<text x="600" y="431" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#152438">Normalized dual trace</text>
<text x="1130" y="431" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#152438">k_C density</text>
<line x1="76" y1="451" x2="1558" y2="451" stroke="#637b98" stroke-width="4"/>
<text x="100" y="494" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#152438">c₊</text>
<text x="330" y="494" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#152438">1/3</text>
<text x="770" y="494" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#152438">2/3</text>
<text x="1200" y="494" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#152438">2</text>
<text x="100" y="546" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#152438">c₋</text>
<text x="330" y="546" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#152438">2/3</text>
<text x="770" y="546" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#152438">1/3</text>
<text x="1200" y="546" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#152438">1/2</text>
<rect x="48" y="610" width="748" height="247" rx="18" fill="#edf7f1" stroke="#95bfa8" stroke-width="3"/>
<text x="76" y="661" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#152438">Actual original core</text>
<text x="76" y="712" font-family="Segoe UI, sans-serif" font-size="30" font-weight="400" fill="#152438">R = M,  S = N;   A = N,  B = M</text>
<text x="76" y="763" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">Original E = E_N; both centers are scalar.</text>
<text x="76" y="822" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#205e41">w = ℓ = 1;  original cost a = 0</text>
<rect x="826" y="610" width="766" height="247" rx="18" fill="#f1effb" stroke="#afa0d1" stroke-width="3"/>
<text x="854" y="660" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#152438">The cup projection still lies outside C</text>
<text x="854" y="710" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">Endpoints r = 8 − 3√7, R* = 8 + 3√7</text>
<text x="854" y="757" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">E_C(f):  η₊ = 1/2 − 1/√7</text>
<text x="854" y="800" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">                 η₋ = 1/2 − 5/(4√7)</text>
<text x="854" y="845" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#152438">Both interior;  ||f − E_C(f)||₂² = 3/56</text>
<rect x="48" y="887" width="748" height="193" rx="18" fill="#fff4e9" stroke="#d6b291" stroke-width="3"/>
<text x="76" y="936" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#152438">Condition on c₊, trace t = 1/3</text>
<text x="76" y="987" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">Cost unchanged; original E-defect = 4/3</text>
<text x="76" y="1037" font-family="Segoe UI, sans-serif" font-size="28" font-weight="400" fill="#152438">Actual corner index = 4; M-reducing part = 0</text>
<rect x="826" y="887" width="766" height="193" rx="18" fill="#fff4e9" stroke="#d6b291" stroke-width="3"/>
<text x="854" y="936" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#152438">Condition on c₋, trace t = 2/3</text>
<text x="854" y="987" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">Cost unchanged; original E-defect = 2/3</text>
<text x="854" y="1037" font-family="Segoe UI, sans-serif" font-size="28" font-weight="400" fill="#152438">Actual corner index = 4; M-reducing part = 0</text>
<text x="48" y="1140" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#152438">IF.6: r commutes with M; projection r ≤ c; 0 &lt; τ(c) &lt; 1 implies r = 0.</text>
<text x="48" y="1189" font-family="Segoe UI, sans-serif" font-size="29" font-weight="400" fill="#152438">Norm averages of ucu* converge to τ(c)1; hence r ≤ τ(c)1. Applies also in the bidual.</text>
<text x="48" y="1234" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#152438">x: spatial tensor product; +: direct sum. IF.1–IF.32; Popa (1994), §§3.1–3.2. CC0 schematic.</text>
</svg>