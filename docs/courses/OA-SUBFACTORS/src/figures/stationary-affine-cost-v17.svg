<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1160" viewBox="0 0 1700 1160"><rect width="1700" height="1160" fill="#f7f8fb"/><text x="65" y="78" fill="#17243b" font-family="Arial" font-size="40" font-weight="700">Two stationary probabilities do not force zero likelihood cost</text><text x="65" y="127" fill="#17243b" font-family="Arial" font-size="27" font-weight="400">K = F2((t));  |t| = 1/2;  a(x) = x+1;  T(x) = tx;  beta_g f(x) = f(g^-1 x)</text><rect x="65" y="157" width="1570" height="203" rx="18" fill="#e8f0fc" stroke="#a8b5ca" stroke-width="3"/><text x="95" y="211" fill="#17243b" font-family="Arial" font-size="31" font-weight="700">Exact probability equations  [AC.3–AC.8]</text><text x="95" y="263" fill="#17243b" font-family="Arial" font-size="30" font-weight="400">mu_V = (1/4) mu_U + (1/4) a_*mu_U + (1/2) T_*mu_U</text><text x="95" y="315" fill="#17243b" font-family="Arial" font-size="30" font-weight="400">mu_U = (2/5) mu_V + (2/5) a_*mu_V + (1/5) T^-1_*mu_V</text><text x="80" y="435" fill="#17243b" font-family="Arial" font-size="28" font-weight="700">Region</text><text x="480" y="435" fill="#17243b" font-family="Arial" font-size="28" font-weight="700">mu_U mass</text><text x="755" y="435" fill="#17243b" font-family="Arial" font-size="28" font-weight="700">mu_V mass</text><text x="1025" y="435" fill="#17243b" font-family="Arial" font-size="28" font-weight="700">(R0, R1, R2)</text><text x="1430" y="435" fill="#17243b" font-family="Arial" font-size="28" font-weight="700">D_T</text><rect x="65" y="474" width="1570" height="80" rx="18" fill="#edf7ef" stroke="#a8b5ca" stroke-width="3"/><text x="95" y="521" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">|x| &lt;= 1/2</text><text x="480" y="521" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">3/7</text><text x="755" y="521" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">9/14</text><text x="1025" y="521" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">(1/6, 1/6, 2/3)</text><text x="1430" y="521" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">2</text><rect x="65" y="574" width="1570" height="80" rx="18" fill="#fff1e7" stroke="#a8b5ca" stroke-width="3"/><text x="95" y="621" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">|x| = 1</text><text x="480" y="621" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">3/7</text><text x="755" y="621" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">15/56</text><text x="1025" y="621" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">(2/5, 2/5, 1/5)</text><text x="1430" y="621" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">1/4</text><rect x="65" y="674" width="1570" height="80" rx="18" fill="#fff1e7" stroke="#a8b5ca" stroke-width="3"/><text x="95" y="721" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">|x| &gt; 1</text><text x="480" y="721" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">1/7</text><text x="755" y="721" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">5/56</text><text x="1025" y="721" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">(2/5, 2/5, 1/5)</text><text x="1430" y="721" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">1/4</text><rect x="65" y="800" width="1570" height="223" rx="18" fill="#f0edf9" stroke="#a8b5ca" stroke-width="3"/><text x="95" y="854" fill="#17243b" font-family="Arial" font-size="31" font-weight="700">Every invariant state  [AC.12–AC.18]</text><text x="95" y="903" fill="#17243b" font-family="Arial" font-size="28" font-weight="400">omega(1_O) = 0: arbitrarily many disjoint Laurent-polynomial translates of O.</text><text x="95" y="954" fill="#17243b" font-family="Arial" font-size="30" font-weight="400">omega(log D_T) = -log 4;   sum_i omega(Ri^-1) = 10</text><text x="95" y="1004" fill="#17243b" font-family="Arial" font-size="30" font-weight="700">Reciprocal cost = |5/2-4| + |5/2-4| + |5-2| = 6</text><text x="65" y="1097" fill="#17243b" font-family="Arial" font-size="27" font-weight="700">Exact measurable action; no ordinary-core identification or subfactor counterexample asserted.</text></svg>