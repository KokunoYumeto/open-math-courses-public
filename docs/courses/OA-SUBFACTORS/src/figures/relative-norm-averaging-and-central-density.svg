<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400">
<rect width="1000" height="1400" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;fill:#182738}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.text{font-size:18px}.small{font-size:16px}.blue{fill:#d9e9fa;stroke:#376fa3}.red{fill:#f7d8da;stroke:#a83f47}.green{fill:#d9eee3;stroke:#3e8260}.panel{fill:#fff;stroke:#aab8c9}</style>
<text x="28" y="38" class="title">Relative norm averages → exact central density</text>
<text x="28" y="69" class="small">Finite-index II₁ factors N ⊂ M; all finite expectations preserve the inherited trace τ.</text>
<rect x="24" y="92" width="952" height="268" rx="8" class="panel"/>
<text x="44" y="126" class="head">A. Spectral spike and its smaller-factor cover — Lemma 81.1</text>
<rect x="52" y="156" width="260" height="85" rx="8" class="blue"/>
<text x="66" y="187" class="text">q = 1{|b| &gt; η} in M</text>
<text x="66" y="218" class="text">τ(q) ≤ ‖b‖₂² / η²</text>
<text x="331" y="204" class="title">→</text>
<rect x="375" y="156" width="548" height="85" rx="8" class="green"/>
<text x="391" y="187" class="text">e = 1{Eₙ(q) ≥ θ} in N</text>
<text x="391" y="218" class="text">τ(e) ≤ 1/k;  ‖q(1 − e)‖ ≤ √(dθ)</text>
<text x="44" y="283" class="text">Required input: ‖b‖ ≤ R and ‖b‖₂² ≤ η²θ/k.</text>
<text x="44" y="318" class="text">The spike q need not lie in N. No commutation of q and e is assumed.</text>
<rect x="24" y="382" width="952" height="265" rx="8" class="panel"/>
<text x="44" y="416" class="head">B. Orthogonal images of e spread the covered spike — 81.3 and 81.6</text>
<rect x="60" y="449" width="176" height="69" rx="8" class="blue"/>
<text x="75" y="478" class="text">e1 = u1 e u1*</text>
<text x="75" y="504" class="small">in N; orthogonal</text>
<rect x="274" y="449" width="176" height="69" rx="8" class="blue"/>
<text x="289" y="478" class="text">e2 = u2 e u2*</text>
<text x="289" y="504" class="small">in N; orthogonal</text>
<rect x="488" y="449" width="176" height="69" rx="8" class="blue"/>
<text x="503" y="478" class="text">e3 = u3 e u3*</text>
<text x="503" y="504" class="small">in N; orthogonal</text>
<rect x="702" y="449" width="176" height="69" rx="8" class="blue"/>
<text x="717" y="478" class="text">e4 = u4 e u4*</text>
<text x="717" y="504" class="small">in N; orthogonal</text>
<text x="44" y="561" class="text">Schematic shows k = 4; the proof allows every positive integer k.</text>
<text x="44" y="601" class="text">Final norm ≤ R/k + η + 2R√(dθ).</text>
<text x="504" y="601" class="small">small block + remainder + endpoints</text>
<rect x="24" y="669" width="952" height="280" rx="8" class="panel"/>
<text x="44" y="703" class="head">C. Actual branch means follow the ambient expectation — Theorem 81.4</text>
<rect x="52" y="736" width="248" height="76" rx="8" class="blue"/>
<text x="66" y="764" class="text">g = Σᵢ aᵢ* aᵢ in R</text>
<text x="66" y="793" class="text">common basis; τ(g) = d</text>
<text x="319" y="782" class="title">→</text>
<rect x="366" y="736" width="245" height="76" rx="8" class="green"/>
<text x="381" y="764" class="text">z = E꜀(g), C = N′ ∩ M</text>
<text x="381" y="793" class="text">z ∈ A′ ∩ B</text>
<text x="630" y="782" class="title">→</text>
<rect x="677" y="736" width="246" height="76" rx="8" class="green"/>
<text x="690" y="764" class="text">Ψⱼ(z) = â′ⱼ</text>
<text x="690" y="793" class="text">a′ⱼ = E꜀ₛ(zqⱼ)</text>
<text x="44" y="855" class="text">Ψⱼ(y) = Eₐ(xⱼ y xⱼ) is contractive and N-equivariant.</text>
<text x="44" y="893" class="text">One common finite N-average sends every Hⱼ = Ψⱼ(g) to â′ⱼ in norm.</text>
<text x="44" y="928" class="small">Here Cₛ = Z(S); xⱼ is a canonical lift, not an asserted physical element of M.</text>
<rect x="24" y="971" width="952" height="281" rx="8" class="panel"/>
<text x="44" y="1005" class="head">D. The desired target agrees exactly when the normal densities agree — 81.5</text>
<rect x="52" y="1039" width="360" height="70" rx="8" class="blue"/>
<text x="67" y="1067" class="text">desired aⱼ = E꜀ₛ(gqⱼ)</text>
<text x="67" y="1096" class="text">proved mean a′ⱼ = E꜀ₛ(zqⱼ)</text>
<rect x="450" y="1039" width="474" height="70" rx="8" class="red"/>
<text x="466" y="1067" class="text">inf ‖average(Hⱼ) − âⱼ‖ = ‖a′ⱼ − aⱼ‖</text>
<text x="466" y="1096" class="small">Exact distance, not a claimed counterexample.</text>
<text x="44" y="1153" class="text">All branch gaps vanish ⇔ Eᴅ₀(g) = Eᴅ₀(E꜀(g)).</text>
<text x="44" y="1192" class="text">D₀ = Z(S) ∨ Z(R); general amenability ⇒ this identity remains unproved here.</text>
<text x="28" y="1291" class="small">Rectangles and arrows are schematic; widths do not represent traces or spectral weights.</text>
<text x="28" y="1326" class="small">Proof locators: 81.2–81.6 (spreading), 81.7–81.10 (norm mean), 81.13–81.16 (density).</text>
<text x="28" y="1361" class="small">Human source: S. Popa (1999), relative Dixmier theorem, printed p.743; proof given here.</text>
</svg>
