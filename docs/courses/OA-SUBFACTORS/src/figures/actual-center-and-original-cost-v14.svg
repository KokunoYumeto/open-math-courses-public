<path d="M675,1160 L675,1200" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="675,1200 664.9320636893117,1181.5707662003022 685.0679363106883,1181.5707662003022" fill="#58718a"/>
<path d="M1070,1160 L1700,1160" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="1700,1160 1681.5707662003022,1170.0679363106883 1681.5707662003022,1149.9320636893117" fill="#58718a"/>
<path d="M1700,1160 L1700,1200" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="1700,1200 1689.9320636893117,1181.5707662003022 1710.0679363106883,1181.5707662003022" fill="#58718a"/>
<text x="70" y="1533" font-family="Segoe UI, sans-serif" font-size="27" fill="#182c40" font-weight="400">CC0 schematic. C13.1–C13.24 contain complete proofs. No zero-state or positive universal floor is asserted.</text>
</svg>