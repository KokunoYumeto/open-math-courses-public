<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1580" viewBox="0 0 2100 1580">
<rect width="2100" height="1580" fill="#f5f7fa"/>
<text x="70" y="98" font-family="Segoe UI, sans-serif" font-size="56" fill="#182c40" font-weight="700">Actual center return and original cost</text>
<text x="70" y="146" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Fixed physical parameter λ from WM.22; both canonical traces and P0 retained.</text>
<rect x="70" y="195" width="890" height="255" rx="18" fill="#ffffff" stroke="#58718a" stroke-width="3"/>
<text x="102" y="253" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Actual core centers U = Z(S), V = Z(R)</text>
<text x="102" y="312" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">All final lamp signs are central unitaries.</text>
<text x="102" y="363" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Countable equality tests recover p0, ..., p4.</text>
<text x="102" y="414" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">D0 = U join V = direct sum of p_i U       C13.1–C13.8</text>
<rect x="1130" y="195" width="900" height="255" rx="18" fill="#ffffff" stroke="#58718a" stroke-width="3"/>
<text x="1162" y="253" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Actual coefficient center Z = Z(W)</text>
<text x="1162" y="312" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Normal full-corner maps: ζ_U, ζ_V</text>
<text x="1162" y="363" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">ζ_U ϑ_i(v) = β_i^(-1) ζ_V(v)</text>
<text x="1162" y="414" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Original joint lift: diag(β_i ζ_U(t_i))       C13.10–11</text>
<path d="M960,320 L1130,320" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="1130,320 1111.5707662003022,330.06793631068825 1111.5707662003022,309.93206368931175" fill="#58718a"/>
<rect x="70" y="535" width="890" height="255" rx="18" fill="#eaf4f1" stroke="#3a7b69" stroke-width="3"/>
<text x="102" y="593" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Any H-invariant state ω on actual Z</text>
<text x="102" y="653" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Prescribe Γ(z) = ω(z)1, Γ|P = identity.</text>
<text x="102" y="700" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Finite physical corner → matrix entries → Følner return</text>
<text x="102" y="762" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Γ β_g = α_g Γ; Γ: W → P       C13.12</text>
<rect x="1130" y="535" width="900" height="255" rx="18" fill="#eaf4f1" stroke="#3a7b69" stroke-width="3"/>
<text x="1162" y="593" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Original compatible physical state</text>
<text x="1162" y="653" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">F: B → M,  E_N F = F E_A,  ψ = τ F</text>
<text x="1162" y="704" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">ψ|M = τ; ψ is M-central.</text>
<text x="1162" y="758" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Every compatible ψ gives invariant ω.       C13.13</text>
<path d="M1580,450 L1580,497" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="1580,497 1569.9320636893117,478.57076620030216 1590.0679363106883,478.57076620030216" fill="#58718a"/>
<path d="M1580,497 L515,497" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="515,497 533.4292337996978,486.93206368931175 533.4292337996978,507.06793631068825" fill="#58718a"/>
<path d="M515,497 L515,535" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="515,535 504.93206368931175,516.5707662003022 525.0679363106883,516.5707662003022" fill="#58718a"/>
<path d="M960,660 L1130,660" fill="none" stroke="#3a7b69" stroke-width="6"/>
<polygon points="1130,660 1111.5707662003022,670.0679363106883 1111.5707662003022,649.9320636893117" fill="#3a7b69"/>
<rect x="70" y="875" width="1960" height="242" rx="18" fill="#ffffff" stroke="#58718a" stroke-width="3"/>
<text x="102" y="931" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Exact original quantities: R_i = ζ_V(r_i),  r_i = E_V(p_i)</text>
<text x="102" y="992" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">Discrepancy:  ||α − α P0|| = sum_i ω(|R_i − w_i|)                       C13.17</text>
<text x="102" y="1055" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">Original cost:  ψ(a) = sum_i ω(|R_i^(-1) − 1/w_i|)                       C13.19</text>
<path d="M1580,790 L1580,875" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="1580,875 1569.9320636893117,856.5707662003022 1590.0679363106883,856.5707662003022" fill="#58718a"/>
<rect x="70" y="1200" width="1210" height="272" rx="18" fill="#eaf4f1" stroke="#3a7b69" stroke-width="3"/>
<text x="102" y="1256" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Proved fixed-model bounds</text>
<text x="102" y="1319" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">1/(4λ+1) ≤ ω(R1) ≤ λ/(4+λ)</text>
<text x="102" y="1379" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">0 ≤ ψ(a) ≤ 2(4+λ)(λ²−1) / λ^(3/2)</text>
<text x="102" y="1436" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">C13.20–C13.23; no change of physical inclusion</text>
<rect x="1370" y="1200" width="660" height="272" rx="18" fill="#fff4df" stroke="#b68431" stroke-width="3"/>
<text x="1402" y="1256" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Unproved endpoint</text>
<text x="1402" y="1317" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Can an invariant ω attain</text>
<text x="1402" y="1372" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">ω(R1) = λ/(4+λ) ?</text>
<text x="1402" y="1433" font-family="Segoe UI, sans-serif" font-size="27" fill="#182c40" font-weight="400">Equivalent to original zero cost: C13.24</text>
