<svg xmlns="http://www.w3.org/2000/svg" width="540" height="850" viewBox="0 0 540 850" role="img" aria-labelledby="title desc">
<title id="title">Folding two path roots into a fork</title>
<desc id="desc">The example r=4 folds the reflection of A9, vertices zero through eight, into D6 with chain zero through three and tips plus and minus. The middle vertex four splits into the two reflection characters. General weights are nu_j=mu_j and nu_plus=nu_minus=mu_r/2. The parent starting roots each have trace one half. The fixed grid has an actual hyperfinite factor inclusion of index delta squared. Terminal commutation makes the root-return corner dimension bound an equality, yielding principal graph D_(r+2) and depth r. All assertions refer to Propositions34.1,34.3 and Theorems34.2,34.4.</desc>
<rect width="540" height="850" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}.edge{stroke:#426987;stroke-width:2}</style>
<text x="24" y="32" class="title" text-anchor="start">Two roots fold into one fork</text>
<text x="270" y="66" class="heading" text-anchor="middle">Example r = 4: the parent A₉</text>
<path d="M54 110 H486" class="edge"/>
<circle cx="54" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="54" y="115" class="small" text-anchor="middle">0</text>
<circle cx="108" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="108" y="115" class="small" text-anchor="middle">1</text>
<circle cx="162" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="162" y="115" class="small" text-anchor="middle">2</text>
<circle cx="216" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="216" y="115" class="small" text-anchor="middle">3</text>
<circle cx="270" cy="110" r="13" fill="#fff1cc" stroke="#426987"/>
<text x="270" y="115" class="small" text-anchor="middle">4</text>
<circle cx="324" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="324" y="115" class="small" text-anchor="middle">5</text>
<circle cx="378" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="378" y="115" class="small" text-anchor="middle">6</text>
<circle cx="432" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="432" y="115" class="small" text-anchor="middle">7</text>
<circle cx="486" cy="110" r="13" fill="#e3eef9" stroke="#426987"/>
<text x="486" y="115" class="small" text-anchor="middle">8</text>
<text x="54" y="147" class="small" text-anchor="middle">root L</text>
<text x="486" y="147" class="small" text-anchor="middle">root R</text>
<text x="270" y="177" class="label" text-anchor="middle">σ(j) = 2r − j;  τ(p₀) = τ(p₂ᵣ) = ½</text>
<path d="M264 190 V213 L258 205 M264 213 L270 205" class="edge" fill="none"/>
<text x="270" y="244" class="heading" text-anchor="middle">The fixed graph D₆</text>
<path d="M60 321 H330 L445 278 M330 321 L445 366" class="edge" fill="none"/>
<circle cx="60" cy="321" r="13" fill="#edf3fb" stroke="#426987"/>
<text x="60" y="326" class="small" text-anchor="middle">0</text>
<circle cx="150" cy="321" r="13" fill="#edf3fb" stroke="#426987"/>
<text x="150" y="326" class="small" text-anchor="middle">1</text>
<circle cx="240" cy="321" r="13" fill="#edf3fb" stroke="#426987"/>
<text x="240" y="326" class="small" text-anchor="middle">2</text>
<circle cx="330" cy="321" r="13" fill="#edf3fb" stroke="#426987"/>
<text x="330" y="326" class="small" text-anchor="middle">3</text>
<circle cx="445" cy="278" r="13" fill="#fff1cc" stroke="#426987"/>
<text x="445" y="283" class="small" text-anchor="middle">+</text>
<circle cx="445" cy="366" r="13" fill="#fff1cc" stroke="#426987"/>
<text x="445" y="371" class="small" text-anchor="middle">−</text>
<text x="60" y="359" class="small" text-anchor="middle">root</text>
<text x="175" y="399" class="small" text-anchor="middle">chain weight νⱼ = μⱼ</text>
<text x="420" y="399" class="small" text-anchor="middle">each tip: μᵣ/2</text>
<rect x="24" y="420" width="492" height="110" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="447" class="heading" text-anchor="middle">Middle characters are two rank-one directions</text>
<text x="270" y="474" class="small" text-anchor="middle">ξ± = (ξL ± ξR)/√2;  ρ± = [ξ±, ξ±]</text>
<text x="270" y="498" class="small" text-anchor="middle">Trace of each tip projection: μᵣ/(2δʳ).</text>
<rect x="24" y="547" width="492" height="110" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="574" class="heading" text-anchor="middle">The fixed squares construct the factor pair</text>
<text x="270" y="601" class="small" text-anchor="middle">Fixed pair: N^σ ⊂ M^σ</text>
<text x="270" y="625" class="small" text-anchor="middle">Common Jones cups; index δ²; δ = 2 cos(π/(2r+2)).</text>
<rect x="24" y="674" width="492" height="132" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="701" class="heading" text-anchor="middle">Terminal commutation recovers the graph</text>
<text x="270" y="728" class="small" text-anchor="middle">[ρᵥ, ρₕ] = 0 ⇒ fixed axes commute</text>
<text x="270" y="752" class="small" text-anchor="middle">Root-return q: τ(q) = δ⁻ᵐ⁰; qFₖ₊₁,ₘ₀q ≅ Fₖ₊₁,₀</text>
<text x="270" y="776" class="small" text-anchor="middle">Injective compression + flatness gives equality.</text>
<text x="270" y="834" class="small" text-anchor="middle">Principal graph Dᵣ₊₂; depth r.  Theorems 34.2, 34.4.</text>
</svg>
