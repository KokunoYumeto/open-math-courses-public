<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="990" viewBox="0 0 1260 990">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#122438}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:17px}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#b45309;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1260" height="990" fill="#ffffff"/>
<text x="50" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#122438">Exact support budgets leave an operator-transfer input</text>
<text x="50" y="79" font-family="Arial,sans-serif" font-size="19" fill="#122438">Actual Jones stages; different continuations are allowed on different cells.</text>
<rect x="50" y="112" width="550" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="72" y="145" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Old physical partition p and finite square P0</text>
<text x="72" y="175" font-family="Arial,sans-serif" font-size="19" fill="#122438">sum p_i = 1; lambda_i = tau(p_i)</text>
<text x="72" y="205" font-family="Arial,sans-serif" font-size="19" fill="#122438">b_y = E_P0(y); old error &lt; eps/2</text>
<text x="72" y="228" font-family="Arial,sans-serif" font-size="17" fill="#122438">Available near-cover and residual: 76.4</text>
<rect x="660" y="112" width="550" height="130" rx="14" fill="#eefbf3" stroke="#15803d" stroke-width="2"/>
<text x="682" y="145" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Finite canonical partition g in B_j</text>
<text x="682" y="175" font-family="Arial,sans-serif" font-size="19" fill="#122438">sum g_i = 1; a_i = tau(g_i)</text>
<text x="682" y="205" font-family="Arial,sans-serif" font-size="19" fill="#122438">D = sum |a_i - lambda_i| ≤ C_q^2 delta_j^2</text>
<text x="682" y="228" font-family="Arial,sans-serif" font-size="17" fill="#122438">UFP.2; centers may vary with j</text>
<path d="M600 177 L652 177" stroke="#334155" stroke-width="2.5" fill="none"/>
<rect x="165" y="305" width="930" height="145" rx="14" fill="#eefbf3" stroke="#15803d" stroke-width="2"/>
<text x="188" y="339" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Optimal physical redistribution, then separate actual tunnel placement</text>
<text x="188" y="370" font-family="Arial,sans-serif" font-size="19" fill="#122438">tau(r_i) = a_i; sum r_i = 1; sum ||r_i - p_i||_2^2 = D</text>
<text x="188" y="401" font-family="Arial,sans-serif" font-size="19" fill="#122438">u_i g_i u_i* = r_i; P* = direct sum of full supported A_j^(i) pairs</text>
<text x="188" y="430" font-family="Arial,sans-serif" font-size="17" fill="#122438">UFP.3; E_N E_P* = E_P* E_N = E_Q*; A0 is retained</text>
<path d="M326 242 L326 297" stroke="#334155" stroke-width="2.5" fill="none"/><path d="M936 242 L936 297" stroke="#334155" stroke-width="2.5" fill="none"/>
<rect x="50" y="515" width="550" height="135" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="72" y="549" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Support movement has a proved bound</text>
<text x="72" y="580" font-family="Arial,sans-serif" font-size="19" fill="#122438">||D_r(x) - D_p(x)||_2 &lt;= 2 ||x|| sqrt(D)</text>
<text x="72" y="610" font-family="Arial,sans-serif" font-size="19" fill="#122438">D can be made arbitrarily small.</text>
<text x="72" y="637" font-family="Arial,sans-serif" font-size="17" fill="#122438">UFP.4 / (UFP.8); no number-of-cells factor</text>
<rect x="660" y="515" width="550" height="135" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/>
<text x="682" y="549" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Actual operator-transfer input is still needed</text>
<text x="682" y="580" font-family="Arial,sans-serif" font-size="19" fill="#122438">K^2 = sum_l ||(1 - E_P*) D_r(a_l)||_2^2</text>
<text x="682" y="610" font-family="Arial,sans-serif" font-size="19" fill="#122438">Small D alone does not bound K.</text>
<text x="682" y="637" font-family="Arial,sans-serif" font-size="17" fill="#122438">a_l: trace-orthonormal basis of P0; UFP.4</text>
<path d="M326 450 L326 507" stroke="#334155" stroke-width="2.5" fill="none"/><path d="M936 450 L936 507" stroke="#334155" stroke-width="2.5" fill="none"/>
<rect x="165" y="720" width="930" height="105" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="188" y="754" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Exact target-error certificate</text>
<text x="188" y="784" font-family="Arial,sans-serif" font-size="19" fill="#122438">D &lt; eps^2/(64 R^2), K &lt; eps/(4 R) imply final error &lt; eps</text>
<text x="188" y="812" font-family="Arial,sans-serif" font-size="17" fill="#122438">UFP.4 / (UFP.10)-(UFP.13); R = max(1, max_y ||y||)</text>
<path d="M326 650 L326 712" stroke="#334155" stroke-width="2.5" fill="none"/><path d="M936 650 L936 660 M936 669 L936 679 M936 688 L936 698 M936 707 L936 712" stroke="#b45309" stroke-width="3" fill="none"/>
<rect x="50" y="867" width="1160" height="60" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="72" y="894" font-family="Arial,sans-serif" font-size="17" fill="#122438">Other established sufficient inputs: residual tau(f) in Gamma_plus (FP.2), or cheap actual overlap (FP.5).</text>
<text x="72" y="918" font-family="Arial,sans-serif" font-size="17" fill="#122438">Amenability has not supplied these inputs here. Routine core changes preserve Z(S): UFP.5.</text>
<text x="50" y="956" font-family="Arial,sans-serif" font-size="17" fill="#122438">Schematic only: no shape or area denotes a trace. Popa (1994), pp.209-210,220-222.</text>
<text x="50" y="979" font-family="Arial,sans-serif" font-size="17" fill="#122438">Proof locators UFP.2-UFP.5 are exact; the dashed arrow marks the residual unproved implication.</text>
<polygon points="652,177 643,171 643,183" fill="#334155"/>
<polygon points="326,297 320,288 332,288" fill="#334155"/>
<polygon points="936,297 930,288 942,288" fill="#334155"/>
<polygon points="326,507 320,498 332,498" fill="#334155"/>
<polygon points="936,507 930,498 942,498" fill="#334155"/>
<polygon points="326,712 320,703 332,703" fill="#334155"/>
<polygon points="936,712 930,703 942,703" fill="#b45309"/>
</svg>