<text x="145" y="397" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">τ(pⱼ) = 5/8;   residual cell trace = 1/8</text>
<text x="36" y="421" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Blue: full cells. Gold: residual trace. Border: its containing cell.</text>
<text x="36" y="447" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Trace-coordinate schematic; p − pⱼ is a projection, ||p − pⱼ||₂² ≤ 2⁻ʲ.</text>
