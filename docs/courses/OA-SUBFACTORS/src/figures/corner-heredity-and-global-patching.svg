<text x="209" y="1040" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">f−s</text>
<text x="24" y="1224" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">f−s</text>
<text x="302" y="1068" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Blue: F(S), with zero f–f block</text>
<text x="302" y="1103" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Green: G(s), supported inside f</text>
<text x="302" y="1138" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">White: remaining (f−s)–(f−s) block</text>
<text x="302" y="1180" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">⟨F(S), G(s)⟩₂ = 0</text>
<text x="36" y="1284" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">||Gₛ||₂² = ||sys − a||₂² + ||[fyf,s]||₂² &lt; 2δ²τ(s).</text>
<text x="36" y="1322" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Maximality fills the unit; a finite selection leaves a small trace tail.</text>
<text x="36" y="1358" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Both row and column labels are exact projections; sizes are schematic.</text>
<text x="26" y="1416" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Proof locators: (59.1)–(59.8), (59.13)–(59.18). Reproducible SVG source retained.</text>
<text x="26" y="1447" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Human source: Sorin Popa, DOI 10.1007/BF02392646, §§3.2.4(ii), 4.4.</text>
