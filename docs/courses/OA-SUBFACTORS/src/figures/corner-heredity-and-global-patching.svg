<text x="36" y="516" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">2. Left and right compression give two normalizations</text>
<text x="36" y="548" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">H = L²(M₆); rank(p) = 3; t = 1/2. Operator prototype only.</text>
