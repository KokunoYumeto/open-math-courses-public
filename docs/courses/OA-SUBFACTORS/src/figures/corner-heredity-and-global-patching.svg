<text x="145" y="251" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">τ(pⱼ) = 1/2;   residual cell trace = 1/2</text>
<text x="36" y="291" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">j = 2</text>
