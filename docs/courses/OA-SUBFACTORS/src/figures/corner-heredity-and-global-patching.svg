<text x="334" y="602" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">q = Lₚ ρ(p): 9 of 36 cells</text>
<text x="334" y="639" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">normalized Hilbert trace(q) = 1/4</text>
<text x="334" y="676" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">q e q has eigenvalue 1/2</text>
<text x="334" y="713" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">eₚ = 2 q e q is a projection</text>
<text x="334" y="750" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">ordinary Hilbert trace(eₚ) = 1</text>
<text x="334" y="787" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">e projects onto the identity vector.</text>
<text x="36" y="852" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">General corner: φ₁(q) = t²;  eₚ = t⁻¹ q e q;  canonical Tr(eₚ) = 1.</text>
<text x="36" y="886" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">The green square is qH. Brown diagonal dots support the identity vector.</text>
<text x="36" y="913" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">The finite prototype illustrates the formulas; it is not a proper II₁ pair.</text>
<rect x="18" y="951" width="704" height="432" rx="10" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="987" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">3. A new local block adds an orthogonal error</text>
