<text x="36" y="157" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">t = √2/2.  Filled binary cells are retained at every later level.</text>
<text x="36" y="218" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">j = 1</text>
