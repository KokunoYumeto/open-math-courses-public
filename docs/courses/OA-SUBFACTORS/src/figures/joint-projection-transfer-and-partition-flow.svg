<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<rect width="900" height="1200" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#18364c}.title{font-size:27px;font-weight:bold}.head{font-size:23px;font-weight:bold}.math{font-family:Georgia,serif;font-size:25px}.small{font-size:18px}.edge{stroke:#315e78;stroke-width:2.5;fill:none}</style>
<text x="34" y="42" class="title">Retain the projection in joint central transfer</text>
<text x="34" y="77" class="small">General core estimates and an exact finite matrix example.</text>
<rect x="25" y="99" width="850" height="315" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="136" class="head">1. Different densities have different roles  [70.1–70.6]</text>
<rect x="50" y="159" width="355" height="63" rx="9" fill="#e4eff7" stroke="#7795aa"/>
<text x="65" y="194" class="math">ζ = C_A(p)     smaller dimension</text>
<rect x="445" y="159" width="380" height="63" rx="9" fill="#e4eff7" stroke="#7795aa"/>
<text x="460" y="194" class="math">β = P₀ζ       larger dimension</text>
<rect x="50" y="249" width="355" height="63" rx="9" fill="#e4eff7" stroke="#7795aa"/>
<text x="65" y="284" class="math">γₚ :  τ(γₚt) = Tr(p x g)</text>
<rect x="445" y="249" width="380" height="63" rx="9" fill="#e4eff7" stroke="#7795aa"/>
<text x="460" y="284" class="math">ρₚ = γₚ / (dκ)     joint density</text>
<text x="51" y="350" class="math">ζ ≤ γₚ ≤ b_d ζ       and       ‖ρₚ − β‖₁ ≤ εₚ Tr(p)</text>
<text x="51" y="387" class="small">The estimate does not identify ρₚ with ζ. No joint g → h substitution.</text>
<rect x="25" y="435" width="850" height="300" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="472" class="head">2. Central cuts split basis flow exactly  [70.7–70.14]</text>
<rect x="50" y="496" width="775" height="65" rx="9" fill="#e4eff7" stroke="#7795aa"/>
<text x="65" y="531" class="math">d Tr(p) ℬₚ(Z) = Fₚ(Z) + Λₚ(Z)</text>
<text x="54" y="603" class="math">Fₚ:  sum ‖qᵣ aᵢ qⱼ‖₂² over r ≠ j  — internal mixing</text>
<text x="54" y="649" class="math">Λₚ: sum ‖qᵣ aᵢ (1 − p) zⱼ‖₂²  — leakage</text>
<text x="54" y="697" class="small">Λₚ ≤ sum ‖[p,aᵢ]‖₂². Small scalar boundary controls both terms.</text>
<rect x="25" y="756" width="850" height="330" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="793" class="head">3. Exact example: A = Mat₂ ⊕ Mat₂ ⊂ Mat₄  [70.21]</text>
<text x="50" y="823" class="small">Selected coordinates of p = diag(I₂,e₁₁); Tr = Tr₄/2.</text>
<circle cx="83" cy="900" r="27" fill="#d9eaf5" stroke="#315e78" stroke-width="2"/>
<text x="70" y="908" class="small">1a</text>
<circle cx="255" cy="900" r="27" fill="#d9eaf5" stroke="#315e78" stroke-width="2"/>
<text x="242" y="908" class="small">1b</text>
<circle cx="550" cy="900" r="27" fill="#d9eaf5" stroke="#315e78" stroke-width="2"/>
<text x="537" y="908" class="small">2a</text>
<circle cx="722" cy="900" r="27" fill="#fff" stroke="#315e78" stroke-width="2"/>
<text x="709" y="908" class="small">2b</text>
<path d="M83 873 Q316 807 550 873 M255 927 Q490 985 722 927" class="edge"/>
<text x="240" y="864" class="small">V swaps 1a ↔ 2a</text>
<text x="329" y="984" class="small">V swaps 1b ↔ 2b</text>
<text x="52" y="1030" class="math">c = 3/2;  ζ = (2,1);  β = 3/2;  γₚ = 2ζ</text>
<text x="52" y="1070" class="math">ℬₚ = 1/2;  Fₚ = 1;  Λₚ = 1/2;  dcℬₚ = 3/2</text>
<text x="35" y="1127" class="small">Schematic layout; this matrix model is not an asserted Jones core.</text>
<text x="35" y="1161" class="small">Proof locators 70.1–70.21. Problem: Popa, Theorem 4.2.2, pp. 213–214.</text>
</svg>
