<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400">
<rect width="1000" height="1400" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;fill:#182738}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.text{font-size:17px}.small{font-size:15px}.blue{fill:#d9e9fa;stroke:#376fa3}.red{fill:#f7d8da;stroke:#a83f47}.green{fill:#d9eee3;stroke:#3e8260}.panel{fill:#fff;stroke:#aab8c9}</style>
<text x="28" y="38" class="title">Finite rank capacity → exact remainder</text>
<text x="28" y="66" class="small">Inherited normal trace measures the cuts; canonical ranks certify the enlarged physical remainder.</text>
<rect x="24" y="90" width="952" height="280" rx="8" class="panel"/>
<text x="44" y="123" class="head">A. Two copies of an outer path projection — Example 80.6</text>
<text x="44" y="153" class="text">Even level 4: capacities (2, 3, 1), total ranks (0, 0, 2).</text>
<rect x="60" y="177" width="240" height="70" rx="8" class="blue"/>
<text x="73" y="204" class="text">capacity 2</text>
<text x="73" y="231" class="text">selected ranks 0</text>
<rect x="350" y="177" width="240" height="70" rx="8" class="blue"/>
<text x="363" y="204" class="text">capacity 3</text>
<text x="363" y="231" class="text">selected ranks 0</text>
<rect x="640" y="177" width="240" height="70" rx="8" class="blue"/>
<text x="653" y="204" class="text">capacity 1</text>
<text x="653" y="231" class="text">selected ranks 2</text>
<rect x="818" y="184" width="50" height="56" rx="8" class="red"/>
<text x="830" y="217" class="text">+1</text>
<text x="44" y="284" class="text">Exact loss Δ₂ = 31/81. The red excess is one rank, weighted by 31/81.</text>
<text x="44" y="315" class="text">Even level 6: capacities (5, 9, 5, 1), total ranks (0, 2, 4, 2).</text>
<text x="44" y="344" class="text">Exact loss Δ₃ = 127/729. At level 8 two blocks contribute: Δ₄ = 85/729.</text>
<rect x="24" y="390" width="952" height="245" rx="8" class="panel"/>
<text x="44" y="423" class="head">B. Finite averages converge to the normal central dimension — 80.3–80.8</text>
<rect x="52" y="453" width="262" height="78" rx="8" class="blue"/>
<text x="66" y="480" class="text">block fraction Hⱼℓ / nⱼℓ</text>
<text x="66" y="508" class="text">Dⱼ(x),  x = Σᵢ gᵢ</text>
<rect x="366" y="453" width="262" height="78" rx="8" class="green"/>
<text x="380" y="480" class="text">normal central limit</text>
<text x="380" y="508" class="text">T(x) = Σᵢ T(gᵢ)</text>
<text x="325" y="500" class="title">→</text>
<text x="660" y="481" class="text">Δⱼ decreases</text>
<text x="660" y="511" class="text">to τ((T(x) − 1)₊)</text>
<text x="44" y="568" class="text">If S is a factor and Σᵢ τ(gᵢ) ≤ 1, this limit is zero — Corollary 80.5.</text>
<text x="44" y="599" class="text">Other norm traces may still overbook; they need not extend normally to S.</text>
<rect x="24" y="655" width="952" height="320" rx="8" class="panel"/>
<text x="44" y="688" class="head">C. Physical cuts and canonical certificates — Theorem 80.4</text>
<text x="44" y="718" class="text">Physical supports remain in N; each rᵢ′ lies inside its original rᵢ.</text>
<rect x="54" y="743" width="220" height="84" rx="8" class="blue"/>
<rect x="240" y="743" width="34" height="84" rx="8" class="red"/>
<text x="68" y="775" class="text">retained r₁′</text>
<text x="68" y="803" class="text">old r₁ = r₁′ + d₁</text>
<rect x="307" y="743" width="220" height="84" rx="8" class="blue"/>
<rect x="499" y="743" width="28" height="84" rx="8" class="red"/>
<text x="321" y="775" class="text">retained r₂′</text>
<text x="321" y="803" class="text">old r₂ = r₂′ + d₂</text>
<rect x="574" y="743" width="342" height="84" rx="8" class="green"/>
<text x="590" y="775" class="text">new remainder f* = f + Σᵢ dᵢ</text>
<text x="590" y="803" class="text">total removed trace = Δⱼ</text>
<text x="44" y="865" class="text">In Bⱼ, rearrange the retained ranks into orthogonal qᵢ and q₀ = 1 − Σᵢ qᵢ.</text>
<text x="44" y="896" class="text">Their traces agree: τ(f*) = τ(q₀). Exact placement gives the last whole-tunnel block.</text>
<text x="44" y="929" class="text">Target error ≤ old error + (1 + √2) ‖y‖ √Δⱼ; the A₀ component is lifted exactly.</text>
<rect x="24" y="995" width="952" height="235" rx="8" class="panel"/>
<text x="44" y="1028" class="head">D. Scalar room does not imply central room — Example 80.7</text>
<rect x="52" y="1058" width="370" height="64" rx="8" class="blue"/>
<text x="68" y="1085" class="text">first central component: selected 0</text>
<text x="68" y="1108" class="small">capacity 1, weight α = √2/2</text>
<rect x="456" y="1058" width="468" height="64" rx="8" class="red"/>
<text x="472" y="1085" class="text">second central component: selected 2</text>
<text x="472" y="1108" class="small">capacity 1, weight 1 − α</text>
<text x="44" y="1160" class="text">Positive scalar remainder: 2α − 1. Unavoidable cut cost: Δ∞ = 1 − α.</text>
<text x="44" y="1191" class="text">This fixed-family diagnostic supplies no amenable-subfactor counterexample.</text>
<text x="28" y="1272" class="small">Rectangles show ranks and support relations schematically; widths are not trace proportions.</text>
<text x="28" y="1305" class="small">Proof locators: 80.6 (central limit), 80.9–80.12 (rank cuts), 80.13–80.18 (target errors).</text>
<text x="28" y="1338" class="small">Human source: S. Popa (1994), Theorem 4.4.1(1), printed p.222.</text>
<text x="28" y="1371" class="small">Exact SVG source retained. All coordinates, capacities and inherited weights are specified.</text>
</svg>
