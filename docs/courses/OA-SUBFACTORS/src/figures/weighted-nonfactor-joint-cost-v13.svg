<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1470" viewBox="0 0 1800 1470">
<rect width="1800" height="1470" fill="#f5f7fa"/>
<text x="900" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#17283d">The actual weighted lamplighter core</text>
<text x="900" y="133" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="32" font-weight="400" fill="#455c73">Physical trace, normal dual trace and original joint cost</text>
<rect x="55" y="164" width="780" height="191" rx="18" fill="#ffffff" stroke="#bccbd8" stroke-width="2"/>
<text x="85" y="206" text-anchor="start" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#175e91">ACTUAL ORDINARY TUNNEL</text>
<text x="445" y="271" text-anchor="middle" font-family="Cambria Math, serif" font-size="40" font-weight="400" fill="#17283d">M = L₀ ⊃ N = L₁ ⊃ L₂ ⊃ ···</text>
<text x="445" y="322" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="400" fill="#455c73">Each triple has its defining cup and index d.</text>
<path d="M849,260 L932,260" stroke="#175e91" stroke-width="4"/>
<polygon points="932.00,260.00 919.58,266.46 919.58,253.54" fill="#175e91"/>
<rect x="947" y="164" width="798" height="191" rx="18" fill="#ffffff" stroke="#bccbd8" stroke-width="2"/>
<text x="977" y="206" text-anchor="start" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#175e91">COMPATIBLE FINITE WORD COMMUTANTS</text>
<text x="1346" y="268" text-anchor="middle" font-family="Cambria Math, serif" font-size="37" font-weight="400" fill="#17283d">R = (⋃ Aⱼ)&#x27;&#x27;      S = (⋃ Bⱼ)&#x27;&#x27;</text>
<text x="1346" y="322" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="400" fill="#455c73">Common finite corners retain every old cup.</text>
<rect x="55" y="390" width="1690" height="279" rx="18" fill="#eaf3fa" stroke="#97b9d3" stroke-width="2"/>
<text x="85" y="433" text-anchor="start" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#175e91">FULL FIRST-LABEL CORNERS AND BOTH CENTER MEASURES  •  WM.25–WM.29</text>
<text x="430" y="495" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#17283d">V = Z(R)</text>
<text x="1370" y="495" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#17283d">U = Z(S)</text>
<path d="M630,488 L1170,488" stroke="#175e91" stroke-width="4"/>
<polygon points="1170.00,488.00 1157.58,494.46 1157.58,481.54" fill="#175e91"/>
<text x="900" y="481" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="32" font-weight="400" fill="#175e91">ϑᵢ</text>
<text x="900" y="556" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="34" font-weight="400" fill="#17283d">v pᵢ = ϑᵢ(v) pᵢ     and     pᵢ R pᵢ = S pᵢ</text>
<text x="900" y="604" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="32" font-weight="400" fill="#17283d">rᵢ = E_V(pᵢ) ≥ 1/d     •     τ(pᵢ) = wᵢ</text>
<text x="900" y="648" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#175e91">τ_U(ϑᵢ(v)) = τ_V(rᵢ v) / wᵢ</text>
<rect x="55" y="704" width="1690" height="286" rx="18" fill="#eaf6f1" stroke="#8ebaaa" stroke-width="2"/>
<text x="85" y="747" text-anchor="start" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#187166">RIGHT MULTIPLICATION IN THE RIGHT-S MODULE  •  WM.30–WM.31</text>
<text x="430" y="814" text-anchor="middle" font-family="Cambria Math, serif" font-size="36" font-weight="400" fill="#17283d">ξ ↦ ξ pᵢ</text>
<text x="430" y="864" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="33" font-weight="400" fill="#17283d">range = L²(R) pᵢ</text>
<path d="M691,828 L1004,828" stroke="#187166" stroke-width="4"/>
<polygon points="1004.00,828.00 991.58,834.46 991.58,821.54" fill="#187166"/>
<text x="1340" y="810" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#17283d">S-dimension = ϑᵢ(rᵢ⁻¹)</text>
<text x="1340" y="865" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="34" font-weight="400" fill="#17283d">dual mass = 1 / (d wᵢ)</text>
<text x="900" y="930" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="35" font-weight="700" fill="#187166">k₀ on branch pᵢU  =  ϑᵢ(rᵢ⁻¹) / (d wᵢ)</text>
<text x="900" y="979" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="400" fill="#187166">Σ ϑᵢ(rᵢ⁻¹) = d · 1_U</text>
<rect x="55" y="1008" width="1690" height="284" rx="18" fill="#fff7e7" stroke="#d0b176" stroke-width="2"/>
<text x="85" y="1051" text-anchor="start" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#8a5e13">THE ORIGINAL JOINT OPERATOR  •  WM.32–WM.35</text>
<text x="900" y="1118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#17283d">w = E_D₀(k₀)     ℓ = E_D₀(k_C)</text>
<text x="900" y="1175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="35" font-weight="400" fill="#17283d">P₀(w − ℓ) = (c₀ − c₁)(r₁ − w₁)</text>
<text x="900" y="1237" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="35" font-weight="700" fill="#8a5e13">τ(d Q(|w − ℓ|)) ≥ d(c₀ − c₁)w₁(h₊ + h₋) &gt; 0</text>
<text x="900" y="1281" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="400" fill="#8a5e13">Actual center witness:  τ(z) = h₊ &gt; 0,   τ(p₁z) = −w₁h₋ &lt; 0.</text>
<text x="900" y="1355" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#17283d">The strict bound tests the faithful inherited normal trace.</text>
<text x="900" y="1399" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" font-weight="400" fill="#455c73">An annihilating compatible possibly singular state remains unconstructed here.</text>
<text x="900" y="1443" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#455c73">Human context: Sorin Popa (1994), Definition 3.1.1.  Formulas proved here.  CC0-1.0.</text>
</svg>