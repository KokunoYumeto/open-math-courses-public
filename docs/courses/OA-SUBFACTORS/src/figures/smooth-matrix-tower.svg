<svg xmlns="http://www.w3.org/2000/svg" width="740" height="630" viewBox="0 0 740 630"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs><rect width="740" height="630" fill="white"/>
<text x="26" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17324a" font-weight="bold">One finite matrix model extends the representation</text>
<text x="26" y="72" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">Partial supports are retained: p = diag(fᵢ); λ = 1/d.</text>
<rect x="18" y="94" width="704" height="239" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<rect x="50" y="129" width="145" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="112" y="165" font-family="Arial, sans-serif" font-size="22" fill="#17324a" font-weight="normal">V</text>
<rect x="397" y="129" width="291" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="423" y="165" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">D = p Matₙ(U) p</text>
<line x1="205" y1="151" x2="387" y2="151" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="283" y="138" font-family="Arial, sans-serif" font-size="22" fill="#17324a" font-weight="normal">L</text>
<line x1="387" y1="216" x2="205" y2="216" stroke="#365c78" stroke-width="2" marker-end="url(#a)"/>
<text x="280" y="206" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">E₁</text>
<text x="36" y="258" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">L(v)ᵢⱼ = E(aᵢ* v aⱼ);  E₁(C) = λ Σᵢⱼ aᵢ Cᵢⱼ aⱼ*;  E₁ L = id_V.</text>
<text x="36" y="302" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Both maps are normal; L is faithful; E₁ is CP, unital and faithful.</text>
<rect x="18" y="352" width="704" height="165" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="388" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">e = ηη*,  ηᵢ = E(aᵢ*),  η*η = 1.   e v e = E(v)e.</text>
<text x="36" y="428" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="bold">D = span(V e V);   E₁(v e w) = λ v w.</text>
<text x="36" y="468" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">bᵢ = √d aᵢ e;   E₁(bᵢ* bⱼ) = δᵢⱼ fᵢ;   Σᵢ bᵢ bᵢ* = d 1_D.</text>
<text x="26" y="555" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Iterate the same normal finite construction, with index d at every step.</text>
<text x="26" y="587" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">Exact algebra maps and normalization; positions carry no metric geometry.</text>
<text x="26" y="617" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Proof: 61.2. Human source: Sorin Popa, DOI 10.1007/BF02392646, §2.2.</text>
</svg>