<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img"><title>The actual strongly amenable index-ten original and opposite pairs are not isomorphic</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs>
<rect width="760" height="610" fill="white"/>
<text x="25" y="36" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324a">An unmarked pair map must preserve these weights</text>
<text x="25" y="69" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17324a">The same actual index-ten PG model; both larger algebras are II₁ factors.</text>
<text x="40" y="116" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#17324a">Original: M₋₁ ⊂ M₀</text>
<text x="40" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">C_[0,0] = ℂ³</text>
<line x1="40" y1="383" x2="336" y2="383" stroke="#7990a3"/>
<rect x="56" y="223.0" width="66" height="160.0" fill="#2678b2"/>
<text x="67" y="209.0" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">2/5</text>
<text x="75" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P0</text>
<rect x="151" y="303.0" width="66" height="80.0" fill="#2678b2"/>
<text x="162" y="289.0" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">1/5</text>
<text x="170" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P1</text>
<rect x="246" y="223.0" width="66" height="160.0" fill="#2678b2"/>
<text x="257" y="209.0" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">2/5</text>
<text x="265" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P2</text>
<text x="412" y="116" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#17324a">Opposite: R₂ ⊂ R₁</text>
<text x="412" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">C_[1,1] = ℂ³</text>
<line x1="412" y1="383" x2="708" y2="383" stroke="#7990a3"/>
<rect x="428" y="283.0" width="66" height="100.0" fill="#24856c"/>
<text x="439" y="269.0" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">1/4</text>
<text x="447" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P0</text>
<rect x="523" y="183.0" width="66" height="200.0" fill="#24856c"/>
<text x="534" y="169.0" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">1/2</text>
<text x="542" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P1</text>
<rect x="618" y="283.0" width="66" height="100.0" fill="#24856c"/>
<text x="629" y="269.0" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324a">1/4</text>
<text x="637" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17324a">P2</text>
<rect x="20" y="447" width="720" height="107" rx="8" fill="#fff4e7" stroke="#9eb3c5"/>
<text x="40" y="483" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324a">{1/5, 2/5, 2/5}  ≠  {1/4, 1/4, 1/2}</text>
<text x="40" y="522" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17324a">No permutation of the minimal projections preserves their traces.</text>
<text x="25" y="582" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17324a">Proof 63.9, equations63.37–63.38. Actual model: PG1–PG14; bar scale: 400px/trace unit.</text>
</svg>
