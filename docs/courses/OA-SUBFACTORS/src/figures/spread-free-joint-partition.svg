<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1050" viewBox="0 0 980 1050" role="img" aria-labelledby="title desc">
<title id="title">Joint distance controls logarithmic partitions independently of spread</title>
<desc id="desc">The actual pair weights are w alpha times v gamma. Capped logarithms yield the bound C w times one plus norm kappa times J joint divided by c. A three-atom diagnostic has conditional rare-branch weights one half, arbitrarily large ratio R, and normalized joint error one over10000001.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#182d47}.title{font-size:29px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px}.formula{font-size:23px}.label{font-size:20px;font-weight:600}.box{fill:#edf4ff;stroke:#506b8c;stroke-width:2}.green{fill:#edf8f1;stroke:#527966;stroke-width:2}.orange{fill:#fff5e8;stroke:#956d38;stroke-width:2}.edge{stroke:#416990;stroke-width:3;fill:none}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#416990"/></marker></defs>
<rect width="980" height="1050" fill="#fbfcff"/>

<text x="35" y="46" class="title" text-anchor="start">From actual joint distance to a logarithmic partition</text>
<rect x="30" y="72" width="920" height="235" rx="15" class="box"/>
<text x="52" y="107" class="head" text-anchor="start">Actual centers and asymmetric pair weights</text>
<text x="52" y="145" class="body" text-anchor="start">C = Z(S),  F = Z(R),  D₀ = C ∨ F;   β = P₀ζ</text>
<text x="52" y="181" class="body" text-anchor="start">wα = P₀(qα),  vγ = Pκ(qγ);   pair weight = wα vγ</text>
<text x="52" y="218" class="body" text-anchor="start">Σ wα = Σ vγ = 1;   vγ ≤ ‖κ‖ wγ   [71.18]</text>
<text x="52" y="263" class="formula" text-anchor="start">Jjoint = ‖ζ − β‖₁,τ;   c = τ(ζ) &gt; 0   [71.16]</text>
<rect x="30" y="331" width="920" height="194" rx="15" class="green"/>
<text x="52" y="367" class="head" text-anchor="start">Cap the log separation before taking its mean</text>
<text x="52" y="410" class="formula" text-anchor="start">a πw(a,b) ≤ Cw |a − b|;   Cw = 1 / (1 − e⁻ʷ)   [71.19]</text>
<text x="52" y="449" class="body" text-anchor="start">πw = min(1, |log a − log b| / w) for a,b &gt; 0</text>
<text x="52" y="487" class="body" text-anchor="start">One-zero pair: πw = 1.   Both-zero pair: πw = 0.</text>
<rect x="30" y="549" width="920" height="306" rx="15" class="box"/>
<text x="52" y="585" class="head" text-anchor="start">Finite diagnostic: a rare fiber, with branch weights ½ and ½</text>
<text x="52" y="621" class="body" text-anchor="start">η = 10⁻⁷,  R ≥ 2,  μ = 2η / (R − 1),  K = 256   [71.23]</text>
<rect x="65" y="644" width="255" height="90" rx="15" class="green"/>
<text x="192" y="681" class="label" text-anchor="middle">Background: mass 1 − μ</text>
<text x="192" y="715" class="body" text-anchor="middle">ζ = K;   P₀ζ = K</text>
<rect x="425" y="644" width="200" height="90" rx="15" class="box"/>
<rect x="685" y="644" width="200" height="90" rx="15" class="box"/>
<text x="525" y="680" class="label" text-anchor="middle">Mass μ/2;  ζ = K</text>
<text x="785" y="680" class="label" text-anchor="middle">Mass μ/2;  ζ = KR</text>
<text x="525" y="713" class="small" text-anchor="middle">Branch weight ½</text>
<text x="785" y="713" class="small" text-anchor="middle">Branch weight ½</text>
<path d="M635,660 L674,660" class="edge" marker-end="url(#arrow)"/><path d="M675,704 L635,704" class="edge" marker-end="url(#arrow)"/>
<text x="655" y="761" class="small" text-anchor="middle">Rare fiber: P₀ζ = K(1 + R)/2; each pair weight = ¼</text>
<text x="52" y="807" class="body" text-anchor="start">c = K(1 + η),  Jjoint = Kη,  Jjoint/c = 1/10000001   [71.24]</text>
<text x="52" y="836" class="small" text-anchor="start">Small μ is a fiber mass; no conditional weight tends to zero.</text>
<rect x="30" y="879" width="920" height="143" rx="15" class="orange"/>
<text x="52" y="915" class="head" text-anchor="start">A bound that does not contain W = log R</text>
<text x="52" y="956" class="formula" text-anchor="start">w = log(257/256):  Cw = 257;   B ≤ 514/10000001 &lt; 1/1024</text>
<text x="52" y="991" class="small" text-anchor="start">Finite diagnostic only. Actual projection and coefficient inputs stay separate.</text>
</svg>
