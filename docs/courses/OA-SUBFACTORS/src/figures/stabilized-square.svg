<text x="320" y="455" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172554">Aₖ₊₁ = span(Bₖ₊₁ Aₖ) = span(Aₖ Bₖ₊₁)</text>
