<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1840" viewBox="0 0 2100 1840">
<rect width="2100" height="1840" fill="#f5f7fa"/>
<text x="65" y="83" font-family="Segoe UI, sans-serif" font-size="48" fill="#182c40" font-weight="700">Actual height conditioning fails lamp invariance</text>
<text x="65" y="136" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Same fixed physical λ and inclusion; h(x) = x1+x2+x3. Original normal center traces are used.</text>
<rect x="65" y="180" width="1970" height="435" rx="18" fill="#ffffff" stroke="#58718a" stroke-width="3"/>
<text x="100" y="235" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Condition on E_K: a final lit lamp has height at least K.</text>
<text x="100" y="296" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">Exact normal tails: μ_U(E_K) = p λ^(−K),  μ_V(E_K) = A p λ^(−K)</text>
<text x="100" y="343" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">A = (1+4λ)/(4+λ),  p &gt; 0; E_K ↓ 0 strongly.       T15.7–T15.11</text>
<path d="M160,400 L1920,400" stroke="#b68431" stroke-width="4"/>
<text x="1660" y="382" font-family="Segoe UI, sans-serif" font-size="30" fill="#956617" font-weight="400">First hit: h = K</text>
<path d="M190,535 L720,400" stroke="#3a7b69" stroke-width="6" fill="none"/>
<polygon points="720,400 703.8940483304964,414.98660471286325 698.6871241481067,394.5446060708888" fill="#3a7b69"/>
<path d="M720,400 L1450,548" stroke="#58718a" stroke-width="6" fill="none"/>
<polygon points="1450,548 1428.9824118364422,554.5008451594449 1433.1738760730411,533.8267310194641" fill="#58718a"/>
<text x="105" y="581" font-family="Segoe UI, sans-serif" font-size="34" fill="#3a7b69" font-weight="400">Exact conditional prefix law</text>
<text x="935" y="581" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Original suffix conditioned on a high lamp</text>
<text x="1550" y="477" font-family="Segoe UI, sans-serif" font-size="27" fill="#182c40" font-weight="400">Return to fixed origin</text>
<text x="1550" y="519" font-family="Segoe UI, sans-serif" font-size="27" fill="#182c40" font-weight="400">has probability → 0.</text>
<rect x="65" y="700" width="960" height="350" rx="18" fill="#eaf4f1" stroke="#3a7b69" stroke-width="3"/>
<text x="100" y="755" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Actual singular center state ρ</text>
<text x="100" y="811" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">ρ_K(t) = μ_V(E_K t) / μ_V(E_K)</text>
<text x="100" y="874" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">ρ(R0) = 1/(1+4λ)</text>
<text x="100" y="931" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">ρ(R_i) = λ/(1+4λ),  i = 1,...,4</text>
<text x="100" y="995" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Different from original w_i+; exact T15.13.</text>
<rect x="1115" y="700" width="920" height="350" rx="18" fill="#fff0e9" stroke="#b96d51" stroke-width="3"/>
<text x="1150" y="755" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Finite obstruction to invariance</text>
<text x="1150" y="824" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">ρ(L0) = h_tilde+(λ) &gt; b/2 &gt; 0</text>
<text x="1150" y="888" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">Actual β1 flips L0 to −L0.</text>
<text x="1150" y="950" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Every invariant state must have ω(L0)=0.</text>
<text x="1150" y="1007" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Therefore every height-tail ρ fails.       T15.20</text>
<path d="M1025,875 L1115,875" stroke="#b96d51" stroke-width="6" fill="none"/>
<polygon points="1115,875 1095.6931836384117,885.5473618492924 1095.6931836384117,864.4526381507076" fill="#b96d51"/>
<path d="M770,615 L540,700" stroke="#58718a" stroke-width="6" fill="none"/>
<polygon points="540,700 554.4534430661923,683.4139219966764 561.7659320079549,703.2006567802691" fill="#58718a"/>
<rect x="65" y="1140" width="1970" height="270" rx="18" fill="#edf0f8" stroke="#626c9b" stroke-width="3"/>
<text x="100" y="1199" font-family="Segoe UI, sans-serif" font-size="42" fill="#182c40" font-weight="700">Actual translation logarithmic means</text>
<text x="100" y="1255" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">ℓ_j = ω(log D_(j+1)); all group relations leave a spatial character.</text>
<text x="100" y="1319" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">0 ≤ ℓ_1+ℓ_2+ℓ_3 ≤ 3 log λ.       T15.1–T15.6</text>
<text x="100" y="1375" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Zero sum would give original zero cost. Attainment is still unproved.</text>
<rect x="65" y="1500" width="1970" height="243" rx="18" fill="#ffffff" stroke="#58718a" stroke-width="3"/>
<text x="100" y="1559" font-family="Segoe UI, sans-serif" font-size="42" fill="#182c40" font-weight="700">The original whole Jones ideal is already annihilated</text>
<text x="100" y="1622" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">Every compatible physical state kills norm-closed span(B e_R^M B).</text>
<text x="100" y="1684" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Actual SC.2–SC.3 bounded cuts and finite B/A expansion apply.       E14.12a</text>
<text x="65" y="1807" font-family="Segoe UI, sans-serif" font-size="27" fill="#182c40" font-weight="400">CC0 schematic; no distance or probability is encoded by arrows. Height-tail states are not compatible physical returns.</text>
</svg>