<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img" aria-labelledby="title desc">
<title id="title">A compatible hypertrace gives one finite Følner projection</title>
<desc id="desc">Expectation correction, Powers–Størmer, and a common spectral cutoff; exact two-eigenvalue threshold example.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315b70"/></marker></defs>
<rect width="640" height="1110" fill="#f9fcfe"/>
<text x="320" y="34" font-family="Arial, sans-serif" font-size="24" fill="#163c50" text-anchor="middle" font-weight="bold">One threshold tests every chosen unitary</text>
<text x="320" y="61" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Expected semifinite pair: E : B → A; u₁,…,uₘ ∈ M</text>
<rect x="45" y="83" width="550" height="73" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="112" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">φ is M-central and φ ∘ E = φ</text>
<text x="320" y="138" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">φ may be singular; no normalization of A by M assumed</text>
<line x1="320" y1="156" x2="320" y2="194" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="342" y="180" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="start" font-weight="normal">relative Day argument · 49.4</text>
<rect x="45" y="199" width="550" height="73" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="228" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">b ≥ 0, Tr(b) = 1, b bounded in B</text>
<text x="320" y="254" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">‖E(b) − b‖₁ &lt; δ; ‖uᵢbuᵢ* − b‖₁ &lt; δ</text>
<line x1="320" y1="272" x2="320" y2="310" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="342" y="296" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="start" font-weight="normal">apply E to the density · 49.11</text>
<rect x="45" y="315" width="550" height="73" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="344" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">b₀ = E(b) ∈ A; Tr(b₀) = 1</text>
<text x="320" y="370" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">‖uᵢb₀uᵢ* − b₀‖₁ &lt; 3δ; no equivariance needed</text>
<line x1="320" y1="388" x2="320" y2="426" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="342" y="412" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="start" font-weight="normal">a = √b₀ · Powers–Størmer</text>
<rect x="45" y="431" width="550" height="73" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="460" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">a ∈ A; ‖a‖₂ = 1</text>
<text x="320" y="486" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">‖uᵢauᵢ* − a‖₂² &lt; 3δ</text>
<line x1="320" y1="504" x2="320" y2="542" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="342" y="528" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="start" font-weight="normal">integrate the sum · 49.15–49.17</text>
<rect x="45" y="547" width="550" height="73" rx="9" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="576" font-family="Arial, sans-serif" font-size="22" fill="#163c50" text-anchor="middle" font-weight="bold">pₜ = 1(√t,∞)(a) ∈ A</text>
<text x="320" y="602" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">∫ Tr(pₜ) dt = 1; ∫ Σᵢ defectᵢ² dt &lt; ε²/2</text>
<text x="320" y="649" font-family="Arial, sans-serif" font-size="21" fill="#163c50" text-anchor="middle" font-weight="bold">δ = ε⁴/(48m²) ⇒ one nonzero finite-trace pₜ</text>
<text x="320" y="678" font-family="Arial, sans-serif" font-size="20" fill="#163c50" text-anchor="middle" font-weight="normal">Σᵢ ‖uᵢpₜuᵢ* − pₜ‖₂² &lt; ε² Tr(pₜ)</text>
<line x1="35" y1="701" x2="605" y2="701" stroke="#a8c3d1" stroke-width="1"/>
<text x="320" y="735" font-family="Arial, sans-serif" font-size="23" fill="#163c50" text-anchor="middle" font-weight="bold">Why a prescribed cutoff may fail</text>
<text x="320" y="765" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">a = diag(3/4, 5/4); u swaps the coordinates</text>
<text x="320" y="793" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">‖uau* − a‖₂² = 1/2; integral cutoff defect = 2</text>
<rect x="230.0" y="847" width="240.0" height="109" fill="#e5ba68" opacity="0.35"/>
<line x1="95" y1="956" x2="585" y2="956" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="95" y1="956" x2="95" y2="823" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="69" y="860" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">2</text>
<text x="69" y="959" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">0</text>
<text x="90" y="819" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="start" font-weight="normal">defect²</text>
<line x1="95" y1="956" x2="230.0" y2="956" stroke="#126283" stroke-width="4"/>
<line x1="230.0" y1="847" x2="470.0" y2="847" stroke="#b66e09" stroke-width="4"/>
<line x1="470.0" y1="956" x2="575" y2="956" stroke="#126283" stroke-width="4"/>
<line x1="95" y1="952" x2="95" y2="962" stroke="#315b70" stroke-width="2"/>
<text x="95" y="986" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">0</text>
<line x1="230.0" y1="952" x2="230.0" y2="962" stroke="#315b70" stroke-width="2"/>
<text x="230.0" y="986" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">9/16</text>
<line x1="335" y1="952" x2="335" y2="962" stroke="#315b70" stroke-width="2"/>
<text x="335" y="986" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">1</text>
<line x1="470.0" y1="952" x2="470.0" y2="962" stroke="#315b70" stroke-width="2"/>
<text x="470.0" y="986" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">25/16</text>
<line x1="575" y1="952" x2="575" y2="962" stroke="#315b70" stroke-width="2"/>
<text x="575" y="986" font-family="Arial, sans-serif" font-size="16" fill="#163c50" text-anchor="middle" font-weight="normal">2</text>
<text x="589" y="961" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="start" font-weight="normal">t</text>
<text x="350.0" y="875" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">defect² = 2</text>
<text x="350.0" y="903" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">interval length = 1</text>
<text x="150" y="932" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">pₜ = 1</text>
<text x="520.0" y="932" font-family="Arial, sans-serif" font-size="17" fill="#163c50" text-anchor="middle" font-weight="normal">pₜ = 0</text>
<text x="320" y="1021" font-family="Arial, sans-serif" font-size="19" fill="#163c50" text-anchor="middle" font-weight="normal">At t = 1: orthogonal rank-one projections.</text>
<text x="320" y="1050" font-family="Arial, sans-serif" font-size="18" fill="#163c50" text-anchor="middle" font-weight="normal">Below 9/16: both are 1 and the defect vanishes.</text>
<text x="320" y="1080" font-family="Arial, sans-serif" font-size="15" fill="#163c50" text-anchor="middle" font-weight="normal">Example 49.5 · exact illustrative matrices, not a standard invariant</text>
</svg>
