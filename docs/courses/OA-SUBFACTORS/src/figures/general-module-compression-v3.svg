<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" style="width:100%;max-width:940px;height:auto" role="img" aria-labelledby="gm-compression-title gm-compression-desc">
<title id="gm-compression-title">Algebra compression transports a trace and fixes its normalization on one full standard corner</title>
<desc id="gm-compression-desc">For e nonzero and s equal to tau(e), alpha restricts the commutant from H_I to eH_I. The trace T_I divided by s gives the standard Q corner mass one, forcing the compressed dimension T_I(p)/s, including infinite values.</desc>
<rect x="0" y="0" width="940" height="410" fill="#f8fafc"/>
<rect x="20" y="42" width="385" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<rect x="535" y="42" width="385" height="100" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<rect x="20" y="230" width="385" height="105" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<rect x="535" y="230" width="385" height="105" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="212" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">A_I = End_P(H_I), trace T_I</text>
<text x="212" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">H_I = L²(P) tensor ell²(I), I nonempty</text>
<text x="727" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">A_I e = End_Q(eH_I)</text>
<text x="727" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Q = ePe; S(α(x)) = T_I(x)/s</text>
<line x1="413" y1="91" x2="523" y2="91" stroke="#334155" stroke-width="3"/>
<polygon points="523,91 511,85 511,97" fill="#334155"/>
<text x="468" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">α(x) = xe</text>
<text x="468" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">isomorphism</text>
<line x1="212" y1="152" x2="212" y2="218" stroke="#334155" stroke-width="3"/>
<polygon points="212,218 206,206 218,206" fill="#334155"/>
<text x="230" y="186" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">full corner f</text>
<line x1="727" y1="152" x2="727" y2="218" stroke="#334155" stroke-width="3"/>
<polygon points="727,218 721,206 733,206" fill="#334155"/>
<text x="745" y="186" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">full corner α(f)</text>
<text x="212" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">f = R_e tensor E_(i0,i0)</text>
<text x="212" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">T_I(f) = s = τ(e) &gt; 0</text>
<text x="727" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">eL²(P)e: standard Q-module</text>
<text x="727" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">S(α(f)) = 1</text>
<line x1="413" y1="279" x2="523" y2="279" stroke="#334155" stroke-width="3"/>
<polygon points="523,279 511,273 511,285" fill="#334155"/>
<text x="468" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">divide by s</text>
<text x="470" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">dim_Q(e pH_I) = T_I(p)/s, for every projection p in A_I</text>
<text x="470" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">The standard full corner fixes the trace, at finite or infinite dimension.</text>
</svg>
