<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc">
<title id="title">Finite matrix construction for factor local quantization</title>
<desc id="desc">A MASA partition is converted into equal-trace cells, with a precisely bounded small remainder. A matrix algebra with this diagonal has nearly scalar commutant expectations. Fourier conjugation by independent fourth-root diagonal phases has exact off-diagonal variance divided by the square of its matrix dimension. One finite phase choice treats all targets. A further pinching refinement and summed-error selection produce one local corner.</desc>
<rect width="640" height="1510" fill="#f9fcfe"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315b70"/></marker></defs>
<text x="320" y="39" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#163c50" font-weight="bold">Finite matrices give one local corner</text>
<text x="320" y="72" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#163c50" font-weight="normal">A II₁ factor B inside a finite tracial algebra M</text>
<rect x="24" y="95" width="592" height="400" rx="8" fill="#eaf3f8" stroke="#6b96ad"/>
<text x="320" y="132" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#163c50" font-weight="bold">1 · A diffuse MASA supplies equal-trace cells</text>
<text x="320" y="171" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#163c50" font-weight="normal">Old weights: 1/3, 1/5, 7/15;  choose d = 10.</text>
<text x="320" y="208" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#163c50" font-weight="normal">Good cells: 3, 2, 4; remainder trace = 1/10.</text>
<rect x="50" y="237" width="54" height="40" fill="#719bb3" stroke="#fff"/>
<rect x="104" y="237" width="54" height="40" fill="#719bb3" stroke="#fff"/>
<rect x="158" y="237" width="54" height="40" fill="#719bb3" stroke="#fff"/>
<rect x="212" y="237" width="54" height="40" fill="#8ab18e" stroke="#fff"/>
<rect x="266" y="237" width="54" height="40" fill="#8ab18e" stroke="#fff"/>
<rect x="320" y="237" width="54" height="40" fill="#ad98be" stroke="#fff"/>
<rect x="374" y="237" width="54" height="40" fill="#ad98be" stroke="#fff"/>
<rect x="428" y="237" width="54" height="40" fill="#ad98be" stroke="#fff"/>
<rect x="482" y="237" width="54" height="40" fill="#ad98be" stroke="#fff"/>
<rect x="536" y="237" width="18" height="40" fill="#719bb3" stroke="#fff"/>
<rect x="554" y="237" width="36" height="40" fill="#ad98be" stroke="#fff"/>
<text x="320" y="309" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#163c50" font-weight="normal">Each new cell has trace 1/10; the last combines old leftovers.</text>
<text x="320" y="343" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#163c50" font-weight="normal">Reordered trace coordinates; refinement fails only on r.</text>
<text x="320" y="377" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#163c50" font-weight="bold">Generally τ(r) &lt; m/d for m old cells.</text>
<text x="320" y="413" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#163c50" font-weight="normal">Extend these d equal cells to F = M_d by comparison.</text>
<text x="320" y="449" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#163c50" font-weight="bold">T = F′ ∩ B;  ‖E_T(b) − τ(b)1‖₂ &lt; α</text>
<text x="320" y="478" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#163c50" font-weight="normal">Good-cell error &lt; 2δ; remainder error ≤ ‖b‖ √(m/d).</text>
<line x1="320" y1="502" x2="320" y2="532" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="544" width="592" height="420" rx="8" fill="#e5f1e7" stroke="#6b96ad"/>
<text x="320" y="582" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#163c50" font-weight="bold">2 · Fourier bases with finite independent phases</text>
<text x="320" y="618" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#163c50" font-weight="normal">U = diag(ζ₀,…,ζ_d−1) F_d;  ζⱼ ∈ {1, i, −1, −i}</text>
<text x="320" y="653" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#163c50" font-weight="normal">pᵢ = U eᵢᵢ U*;  Φ(b) = Σᵢ pᵢ b pᵢ</text>
<text x="320" y="691" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#163c50" font-weight="normal">Write b = (bⱼₖ) over A₀ = e₀₀ B e₀₀.</text>
<text x="320" y="725" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#163c50" font-weight="normal">τ₀ = d τ on A₀;  m_b = (1/d) Σⱼ bⱼⱼ</text>
<text x="320" y="766" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#163c50" font-weight="bold">Mean squared noise = (1/d²) Σⱼ≠ₖ ‖bⱼₖ‖₂,τ₀²</text>
<text x="320" y="802" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#163c50" font-weight="bold">≤ ‖b‖₂² / d</text>
<text x="320" y="841" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#163c50" font-weight="normal">Squared scalar error = commutant error² + noise².</text>
<text x="320" y="879" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#163c50" font-weight="normal">Sum over ALL targets before taking the finite phase mean.</text>
<text x="320" y="918" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#163c50" font-weight="normal">One of the 4^d choices makes that summed energy small.</text>
<text x="320" y="946" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#163c50" font-weight="normal">The coefficients bⱼₖ may be noncommuting operators.</text>
<line x1="320" y1="972" x2="320" y2="1002" stroke="#315b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="1014" width="592" height="365" rx="8" fill="#fff3ea" stroke="#6b96ad"/>
<text x="320" y="1052" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#163c50" font-weight="bold">3 · Refine and select one common projection</text>
<text x="320" y="1089" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#163c50" font-weight="normal">C = B′ ∩ M;  D = B ∨ C;  y = E_D(y) + (y − E_D(y))</text>
<text x="320" y="1128" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#163c50" font-weight="normal">Finite products bc approximate E_D(y).</text>
<text x="320" y="1165" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#163c50" font-weight="normal">First partition: product-part error &lt; 3ρ.</text>
<text x="320" y="1200" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#163c50" font-weight="normal">Theorem 54.5 refinement: kernel-part error &lt; ρ.</text>
<text x="320" y="1238" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#163c50" font-weight="bold">ρ = ε/(4√K);  K = number of targets.</text>
<text x="320" y="1276" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#163c50" font-weight="bold">Σᵢ,ᵧ ‖qᵢ y qᵢ − E_C(y)qᵢ‖₂² &lt; ε²</text>
<text x="320" y="1314" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#163c50" font-weight="normal">Choose ONE qᵢ with all-target error &lt; ε² τ(qᵢ).</text>
<text x="320" y="1355" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#163c50" font-weight="normal">Small trace: Theorem 55.7, final small-trace paragraph.</text>
<text x="320" y="1420" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#163c50" font-weight="normal">Nonfactor B: Theorem 56.5, central local quantization.</text>
<text x="320" y="1453" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#163c50" font-weight="normal">Proof: Lemmas 55.2, 55.4 and Theorem 55.7</text>
<text x="320" y="1485" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#163c50" font-weight="normal">Human source: Popa, Appendix A.1.2, pp. 246–248</text>
</svg>
