<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 1320 1080">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#43536a"/></marker></defs>
<title>Actual selected-cell approximate-return obstruction and exact whole-family correction</title>
<desc>The same physical diagonal algebra fixes the central expectation in every corner core. Weyl averaging obstructs every finite unital corner stage. The selected whole-stage family still completes exactly through its five-adic residual trace certificate. Proof locators MR.4–MR.32.</desc>
<rect width="1320" height="1080" fill="#f7f9fc"/>
<text x="40" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#162b45" font-weight="bold">An actual good cell blocks every unital corner-stage return</text>
<text x="40" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">Index 25 lamplighter inclusion · all-smooth amenability · fixed physical targets</text>
<rect x="40" y="112" width="1240" height="252" rx="12" fill="#ffffff" stroke="#cad3df" stroke-width="2"/>
<text x="64" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#162b45" font-weight="bold">1. The first physical commutant fixes the center data in every corner</text>
<rect x="64" y="174" width="216" height="86" rx="12" fill="#e6eefb" stroke="#cad3df" stroke-width="2"/>
<text x="78" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#162b45" font-weight="normal">d0 = p q0</text>
<text x="78" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">physical τp(di) = 1/5</text>
<text x="78" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">dual τp(di) = 1/5</text>
<rect x="304" y="174" width="216" height="86" rx="12" fill="#e6eefb" stroke="#cad3df" stroke-width="2"/>
<text x="318" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#162b45" font-weight="normal">d1 = p q1</text>
<text x="318" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">physical τp(di) = 1/5</text>
<text x="318" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">dual τp(di) = 1/5</text>
<rect x="544" y="174" width="216" height="86" rx="12" fill="#e6eefb" stroke="#cad3df" stroke-width="2"/>
<text x="558" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#162b45" font-weight="normal">d2 = p q2</text>
<text x="558" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">physical τp(di) = 1/5</text>
<text x="558" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">dual τp(di) = 1/5</text>
<rect x="784" y="174" width="216" height="86" rx="12" fill="#e6eefb" stroke="#cad3df" stroke-width="2"/>
<text x="798" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#162b45" font-weight="normal">d3 = p q3</text>
<text x="798" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">physical τp(di) = 1/5</text>
<text x="798" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">dual τp(di) = 1/5</text>
<rect x="1024" y="174" width="216" height="86" rx="12" fill="#e6eefb" stroke="#cad3df" stroke-width="2"/>
<text x="1038" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#162b45" font-weight="normal">d4 = p q4</text>
<text x="1038" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">physical τp(di) = 1/5</text>
<text x="1038" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#162b45" font-weight="normal">dual τp(di) = 1/5</text>
<text x="66" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">Central contraction zT in every ordinary corner core:  E(pA0)(zT) = Σ vi di</text>
<text x="66" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#162b45" font-weight="normal">v0 = h− &gt; 0,  v1 = −h− ;  τp(zT) = h+ ;  ||p z0 − h+ p||²₂,p ≥ 2 h−² / 5</text>
<rect x="40" y="374" width="600" height="238" rx="12" fill="#ffffff" stroke="#cad3df" stroke-width="2"/>
<text x="64" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#162b45" font-weight="bold">2. Exact Weyl average</text>
<text x="64" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">Fp ≅ Mat5, with the same d0,…,d4</text>
<text x="64" y="492" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">W = {SᵃDᵇ : 0 ≤ a,b &lt; 5}</text>
<text x="64" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">mean ||[u,zT]||²₂,p ≥ 4 h−² / 5</text>
<text x="64" y="574" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#162b45" font-weight="normal">Every finite corner stage L: max dist₂,p(u,L) ≥ c</text>
<rect x="680" y="374" width="600" height="238" rx="12" fill="#ffffff" stroke="#cad3df" stroke-width="2"/>
<text x="704" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#162b45" font-weight="bold">3. Actual whole-stage selection</text>
<text x="704" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">76.2–76.3 select p ∈ Nk;  t = τ(p) &gt; 0</text>
<text x="704" y="494" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">G = p (Nh′ ∩ M) p, after the given prefix</text>
<text x="704" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">Polar correction: δ = c/400</text>
<text x="704" y="574" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#162b45" font-weight="normal">Fixed yu = EG(u):  ||u − yu||₂,p &lt; c/4</text>
<line x1="640" y1="490" x2="678" y2="490" stroke="#43536a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="644" width="1240" height="166" rx="12" fill="#fff1ec" stroke="#ddb6a9" stroke-width="2"/>
<text x="64" y="682" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#162b45" font-weight="bold">4. The proposed return fails with its original physical budget</text>
<text x="64" y="724" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">Any ordinary finite corner chain, at any length: max ||yu − EL(yu)||₂ &gt; (3c/4) √t</text>
<text x="64" y="765" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">ε = c √t;  ε0 = ε/8;  old error = 0;  ε0 + max (Σ δi(y)²)½ &gt; 7ε/8 &gt; ε/2</text>
<line x1="340" y1="614" x2="340" y2="642" stroke="#43536a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="980" y1="614" x2="980" y2="642" stroke="#43536a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="842" width="1240" height="173" rx="12" fill="#e9f6f0" stroke="#9bbdac" stroke-width="2"/>
<text x="64" y="880" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#162b45" font-weight="bold">5. The full family still returns exactly in this actual model</text>
<text x="64" y="923" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">Retain p,G and every other good block; choose τ(f) &lt; ε²/16.  Y ⊂ G ⊂ P0.</text>
<text x="64" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#162b45" font-weight="normal">τ(f) ∈ ℤ[1/5] gives a new finite origin for f.  P0 ⊂ P*;  EP*(y) = y.</text>
<text x="64" y="998" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#162b45" font-weight="normal">Both expectation rows, physical/dual trace restrictions and prescribed cup operators are preserved.</text>
<text x="42" y="1049" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#162b45" font-weight="normal">c = h−/√5 &gt; 0.  Norms use τp = τ/t.  Boxes are schematic; no area denotes trace or capacity.</text>
</svg>