<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1000" viewBox="0 0 540 1000" role="img" aria-labelledby="title desc">
<title id="title">One finite branch test proves E6 and E8 flatness</title>
<desc id="desc">E6 is the chain0 to4 with short tip5 at branch2; E8 is the chain0 to6 with short tip7 at branch4. The blue shortest root-to-short-tip paths have lengths3 and5 and define the extra projections rho. Each axis is generated by cups and rho. The compression C=PBP is a partial isometry at every endpoint: E6 sizes1,3,1 and ranks1,0,1; E8 sizes1,5,11,4 and ranks1,0,1,0. The E8 endpoint4 block has rank one and nonzero squared singular value one, while its suffix Wenzl projection has rank two. Hence P commutes with B adjoint P B and both rooted connections are flat. Lemmas38.1–38.2 and Proposition38.3.</desc>
<rect width="540" height="1000" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}</style>
<text x="24" y="33" class="title" text-anchor="start">The exceptional branch test is finite and exact</text>
<text x="270" y="78" class="heading" text-anchor="middle">E₆: k = 3, h = 12, root 0</text>
<path d="M60 125 L165 125" stroke="#287c99" stroke-width="4"/>
<path d="M165 125 L270 125" stroke="#287c99" stroke-width="4"/>
<path d="M270 125 L375 125" stroke="#9baec5" stroke-width="3"/>
<path d="M375 125 L480 125" stroke="#9baec5" stroke-width="3"/>
<path d="M270 125 L270 205" stroke="#287c99" stroke-width="4"/>
<circle cx="60" cy="125" r="8" fill="#287c99"/>
<text x="60" y="108" class="label" text-anchor="middle">0</text>
<circle cx="165" cy="125" r="8" fill="#172c45"/>
<text x="165" y="108" class="label" text-anchor="middle">1</text>
<circle cx="270" cy="125" r="8" fill="#172c45"/>
<text x="270" y="108" class="label" text-anchor="middle">2</text>
<circle cx="375" cy="125" r="8" fill="#172c45"/>
<text x="375" y="108" class="label" text-anchor="middle">3</text>
<circle cx="480" cy="125" r="8" fill="#172c45"/>
<text x="480" y="108" class="label" text-anchor="middle">4</text>
<circle cx="270" cy="205" r="8" fill="#172c45"/>
<text x="289" y="211" class="label" text-anchor="middle">5</text>
<text x="390" y="192" class="label" text-anchor="middle">ξ = (0,1,2,5)</text>
<text x="270" y="249" class="label" text-anchor="middle">Blue path defines ρ = [ξ,ξ].</text>
<text x="270" y="295" class="heading" text-anchor="middle">E₈: k = 5, h = 30, root 0</text>
<path d="M60 342 L130 342" stroke="#287c99" stroke-width="4"/>
<path d="M130 342 L200 342" stroke="#287c99" stroke-width="4"/>
<path d="M200 342 L270 342" stroke="#287c99" stroke-width="4"/>
<path d="M270 342 L340 342" stroke="#287c99" stroke-width="4"/>
<path d="M340 342 L410 342" stroke="#9baec5" stroke-width="3"/>
<path d="M410 342 L480 342" stroke="#9baec5" stroke-width="3"/>
<path d="M340 342 L340 424" stroke="#287c99" stroke-width="4"/>
<circle cx="60" cy="342" r="8" fill="#287c99"/>
<text x="60" y="325" class="label" text-anchor="middle">0</text>
<circle cx="130" cy="342" r="8" fill="#172c45"/>
<text x="130" y="325" class="label" text-anchor="middle">1</text>
<circle cx="200" cy="342" r="8" fill="#172c45"/>
<text x="200" y="325" class="label" text-anchor="middle">2</text>
<circle cx="270" cy="342" r="8" fill="#172c45"/>
<text x="270" y="325" class="label" text-anchor="middle">3</text>
<circle cx="340" cy="342" r="8" fill="#172c45"/>
<text x="340" y="325" class="label" text-anchor="middle">4</text>
<circle cx="410" cy="342" r="8" fill="#172c45"/>
<text x="410" y="325" class="label" text-anchor="middle">5</text>
<circle cx="480" cy="342" r="8" fill="#172c45"/>
<text x="480" y="325" class="label" text-anchor="middle">6</text>
<circle cx="340" cy="424" r="8" fill="#172c45"/>
<text x="359" y="430" class="label" text-anchor="middle">7</text>
<text x="182" y="416" class="label" text-anchor="middle">ξ = (0,1,2,3,4,7)</text>
<rect x="24" y="463" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="492" class="heading" text-anchor="middle">Cups and one branch projection generate each axis</text>
<text x="270" y="521" class="label" text-anchor="middle">Only [ρᵥ,ρₕ] remains to be tested.</text>
<text x="270" y="547" class="label" text-anchor="middle">P = prefix ξ;  Q = B* P B;  C = P B P.</text>
<rect x="24" y="599" width="492" height="167" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="628" class="heading" text-anchor="middle">Every endpoint compression is a partial isometry</text>
<text x="270" y="657" class="label" text-anchor="middle">E₆ endpoints: 0, 2, 4; sizes: 1, 3, 1.</text>
<text x="270" y="683" class="label" text-anchor="middle">Ranks: 1, 0, 1; nonzero squared singular value = 1.</text>
<text x="270" y="709" class="label" text-anchor="middle">E₈ endpoints: 0, 2, 4, 6; sizes: 1, 5, 11, 4.</text>
<text x="270" y="735" class="label" text-anchor="middle">Ranks: 1, 0, 1, 0; nonzero squared singular value = 1.</text>
<rect x="24" y="786" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="815" class="heading" text-anchor="middle">The E₈ eleven-by-eleven block is the essential test</text>
<text x="270" y="844" class="label" text-anchor="middle">C = a b, and ‖a‖²G · ‖b‖²G⁻¹ = 1 exactly.</text>
<text x="270" y="870" class="label" text-anchor="middle">C has rank 1; its suffix Wenzl projection has rank 2.</text>
<text x="270" y="935" class="heading" text-anchor="middle">C* C is a projection ⇒ [P,Q] = 0 ⇒ flat axes.</text>
<text x="270" y="972" class="small" text-anchor="middle">Indices: 2+√3 and 4cos²(π/30); depths: 4 and 6.</text>
</svg>
