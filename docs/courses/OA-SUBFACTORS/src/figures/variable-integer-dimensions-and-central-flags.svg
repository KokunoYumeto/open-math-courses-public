<path d="M125 462 H235" stroke="#316b99" stroke-width="0.7"/>
<path d="M125 434 H235" stroke="#316b99" stroke-width="0.7"/>
<text x="180" y="219" class="math" text-anchor="middle">f = 5</text>
<text x="180" y="579" class="math" text-anchor="middle">floor = 5</text>
<text x="180" y="611" class="small" text-anchor="middle">base mass 1/2</text>
<rect x="375" y="294" width="110" height="252" fill="#e0f3eb" stroke="#267b63" stroke-width="2"/>
