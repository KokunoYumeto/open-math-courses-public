<text x="32" y="43" class="title" text-anchor="start">Round the whole projection, retain a central flag</text>
<text x="32" y="78" class="body" text-anchor="start">Exact three-atom arithmetic; no common support is inferred.</text>
<rect x="24" y="100" width="852" height="540" rx="14" fill="white" stroke="#a9c1d3"/>
<text x="44" y="137" class="head" text-anchor="start">1. Square amplification by 4, then take the floor [73.26]</text>
<text x="50" y="183" class="small" text-anchor="start">Vertical unit = one dimension; fractional caps are removed.</text>
<rect x="125" y="406" width="110" height="140" fill="#e0eff9" stroke="#316b99" stroke-width="2"/>
<path d="M125 518 H235" stroke="#316b99" stroke-width="0.7"/>
