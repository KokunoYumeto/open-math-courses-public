<path d="M375 350 H485" stroke="#267b63" stroke-width="0.7"/>
<path d="M375 322 H485" stroke="#267b63" stroke-width="0.7"/>
<rect x="375" y="284.66666666666663" width="110" height="9.333333333333332" fill="#f9d6d6" stroke="#a05050" stroke-dasharray="3 3"/>
<text x="430" y="219" class="math" text-anchor="middle">f = 28/3</text>
<text x="430" y="579" class="math" text-anchor="middle">floor = 9</text>
<text x="430" y="611" class="small" text-anchor="middle">base mass 1/3</text>
<rect x="625" y="266" width="110" height="280" fill="#fcf0df" stroke="#9b6429" stroke-width="2"/>
<path d="M625 518 H735" stroke="#9b6429" stroke-width="0.7"/>
