<rect x="625" y="254.8" width="110" height="11.200000000000001" fill="#f9d6d6" stroke="#a05050" stroke-dasharray="3 3"/>
<text x="680" y="219" class="math" text-anchor="middle">f = 52/5</text>
<text x="680" y="579" class="math" text-anchor="middle">floor = 10</text>
<text x="680" y="611" class="small" text-anchor="middle">base mass 1/6</text>
<text x="760" y="312" class="small" text-anchor="start">2/5 cap</text>
<text x="510" y="281" class="small" text-anchor="start">1/3 cap</text>
<rect x="24" y="661" width="852" height="224" rx="14" fill="white" stroke="#a9c1d3"/>
<text x="44" y="699" class="head" text-anchor="start">2. Exact loss and nested supports [73.12, 73.26]</text>
<text x="52" y="741" class="math" text-anchor="start">z₁,…,z₅ = (1,1,1);  z₆,…,z₉ = (0,1,1)</text>
<text x="52" y="779" class="math" text-anchor="start">z₁₀ = (0,0,1);   ∑ ν(zᵢ) = 43/6</text>
<text x="52" y="822" class="body" text-anchor="start">Original mass = 661/90; loss = 8/45; relative loss = 16/661</text>
<text x="52" y="862" class="small" text-anchor="start">The retained dimensions 5, 9, 10 have one support and three values.</text>
<rect x="24" y="905" width="852" height="292" rx="14" fill="white" stroke="#a9c1d3"/>
<text x="44" y="943" class="head" text-anchor="start">3. Proved whole-projection and flag consequences</text>
<text x="62" y="986" class="body" text-anchor="start">Global floor + prescription → small perturbation [73.1–73.2]</text>
<path d="M72 1000 V1020" stroke="#316b99" stroke-width="2" marker-end="url(#arrow)"/>
<text x="62" y="1053" class="body" text-anchor="start">Nested columns → bounded finite-stage flag [73.3–73.5]</text>
<path d="M72 1067 V1087" stroke="#947b58" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="62" y="1120" class="body" text-anchor="start">One common support / general local approximation</text>
<text x="62" y="1161" class="small" text-anchor="start">Further implication remains open; dashed arrow is not a theorem.</text>
<text x="32" y="1241" class="small" text-anchor="start">Problem credit: Popa, Theorem 4.2.2, pp. 213–214. Original proofs 73.1–73.5.</text>
<text x="32" y="1280" class="small" text-anchor="start">This diagram shows central arithmetic, not an actual Jones-core example.</text>
