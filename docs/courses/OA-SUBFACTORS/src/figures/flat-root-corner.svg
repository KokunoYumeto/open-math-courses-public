<svg xmlns="http://www.w3.org/2000/svg" width="540" height="700" viewBox="0 0 540 700" role="img" aria-labelledby="title desc">
<title id="title">A returning path bounds the relative commutant</title>
<desc id="desc">Compactness puts N prime intersection M_k inside A_(k+1,m0). A horizontal path xi of even length m0 returning to the root defines projection p with trace delta to minus m0. Compression is injective on the relative commutant because N is a factor. In horizontal-first path order the corner leaves exactly the vertical paths of length k+1 from the root, so its dimension is at most dim A_(k+1,0). Flatness includes that whole algebra in the commutant, forcing equality, the actual rooted principal graph Gamma and index delta squared.</desc>
<rect width="540" height="700" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}</style>
<text x="24" y="33" class="title" text-anchor="start">Flat paths recover the principal graph</text>
<rect x="24" y="56" width="492" height="111" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="84" class="heading" text-anchor="middle">Compactness gives finite location</text>
<text x="270" y="113" class="label" text-anchor="middle">N′ ∩ Mₖ ⊂ Aₖ₊₁,ₘ₀</text>
<text x="270" y="138" class="small" text-anchor="middle">Choose even m₀ with full path support.</text>
<rect x="24" y="185" width="492" height="157" rx="8" fill="#fff8e9" stroke="#b6a070"/>
<text x="270" y="214" class="heading" text-anchor="middle">Horizontal-first order: ξ followed by α</text>
<text x="55" y="258" class="heading" text-anchor="middle">*</text>
<text x="132" y="258" class="heading" text-anchor="middle">⋯</text>
<text x="231" y="258" class="heading" text-anchor="middle">*</text>
<text x="327" y="258" class="heading" text-anchor="middle">⋯</text>
<text x="458" y="258" class="heading" text-anchor="middle">a</text>
<path d="M71 253 H110 M151 253 H208 M254 253 H306 M350 253 H436" stroke="#426987" stroke-width="2"/>
<text x="143" y="282" class="small" text-anchor="middle">ξ: m₀ horizontal steps</text>
<text x="370" y="282" class="small" text-anchor="middle">α: k+1 vertical steps</text>
<text x="270" y="318" class="label" text-anchor="middle">p = [ξ,ξ];  ξ returns to *;  τ(p) = δ⁻ᵐ⁰</text>
<rect x="24" y="360" width="492" height="111" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="388" class="heading" text-anchor="middle">The corner leaves the root-based vertical paths</text>
<text x="270" y="417" class="label" text-anchor="middle">p Aₖ₊₁,ₘ₀ p ≅ Aₖ₊₁,₀</text>
<text x="270" y="442" class="small" text-anchor="middle">Compression x ↦ pxp is injective on N′ ∩ Mₖ.</text>
<rect x="24" y="489" width="492" height="111" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="517" class="heading" text-anchor="middle">Two dimension bounds become equality</text>
<text x="270" y="546" class="label" text-anchor="middle">dim(N′ ∩ Mₖ) ≤ dim Aₖ₊₁,₀</text>
<text x="270" y="571" class="small" text-anchor="middle">Flatness: Aₖ₊₁,₀ ⊂ N′ ∩ Mₖ.</text>
<text x="270" y="634" class="heading" text-anchor="middle">N′ ∩ Mₖ = Aₖ₊₁,₀ in the actual tower.</text>
<text x="270" y="664" class="label" text-anchor="middle">Rooted graph Γ; index δ²; depth r.</text>
<text x="24" y="694" class="small" text-anchor="start">Lemma 33.1 and Theorem 33.2.</text>
</svg>
