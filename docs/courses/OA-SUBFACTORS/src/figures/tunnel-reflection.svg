<svg xmlns="http://www.w3.org/2000/svg" width="500" height="670" viewBox="0 0 500 670" role="img" aria-labelledby="title desc">
<title id="title">The two reflected starting levels</title>
<desc id="desc">A downward relative commutant with endpoint M reflects to M prime intersect M a. The endpoint N reflects to M one prime intersect M a. Their tracial closures are R and S, respectively.</desc>
<rect width="500" height="670" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315c87"/></marker></defs>
<text x="250" y="38" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#15202b">Reflection keeps the starting level</text>
<text x="250" y="73" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#315c87">Θ(x) = Jx*J   ·   a ≥ 1</text>
<text x="120" y="120" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#15202b">Inside M</text>
<text x="380" y="120" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#15202b">Finite tower level</text>
<rect x="20" y="145" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<rect x="280" y="145" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<text x="120" y="190" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">M₋ₐ′ ∩ M</text>
<text x="380" y="190" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">M′ ∩ Mₐ</text>
<path d="M228,181 L272,181" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="290" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<rect x="280" y="290" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<text x="120" y="335" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">M₋ₐ′ ∩ N</text>
<text x="380" y="335" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">M₁′ ∩ Mₐ</text>
<path d="M228,326 L272,326" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M120,282 L120,225" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="147" y="261" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#15202b">⊂</text>
<path d="M380,282 L380,225" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="407" y="261" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#15202b">⊂</text>
<text x="250" y="407" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#15202b">Take the increasing tracial closures</text>
<rect x="20" y="435" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<rect x="280" y="435" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<text x="120" y="480" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">R</text>
<text x="380" y="480" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">M′ ∩ M∞</text>
<path d="M228,471 L272,471" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="558" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<rect x="280" y="558" width="200" height="72" rx="8" fill="#f0f5fa" stroke="#7897b5"/>
<text x="120" y="603" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">S</text>
<text x="380" y="603" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#15202b">M₁′ ∩ M∞</text>
<path d="M228,594 L272,594" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M120,550 L120,515" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="147" y="539" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#15202b">⊂</text>
<path d="M380,550 L380,515" stroke="#315c87" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="407" y="539" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#15202b">⊂</text>
</svg>
