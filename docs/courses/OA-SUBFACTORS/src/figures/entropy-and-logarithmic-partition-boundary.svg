<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110">
<rect width="900" height="1110" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#18364c}.title{font-size:27px;font-weight:bold}.head{font-size:23px;font-weight:bold}.math{font-family:Georgia,serif;font-size:25px}.small{font-size:18px}.edge{stroke:#315e78;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#315e78"/></marker></defs>
<text x="34" y="42" class="title">Weighted stationarity controls a bounded-band boundary</text>
<text x="34" y="77" class="small">Exact finite-partition proof; controlled spread remains required.</text>
<rect x="25" y="99" width="850" height="305" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="136" class="head">1. An exact two-label coupling  [71.1–71.4; Example 71.1]</text>
<circle cx="190" cy="239" r="43" fill="#d9eaf5" stroke="#315e78" stroke-width="2"/>
<text x="163" y="247" class="math">ζ = 2</text>
<circle cx="680" cy="239" r="43" fill="#d9eaf5" stroke="#315e78" stroke-width="2"/>
<text x="653" y="247" class="math">ζ = 1</text>
<path d="M228 213 Q435 150 642 213" class="edge"/>
<path d="M642 265 Q435 330 228 265" class="edge"/>
<path d="M156 214 C95 160 95 316 156 264" class="edge"/>
<path d="M714 264 C785 316 785 160 714 214" class="edge"/>
<text x="356" y="173" class="small">each direction: 1/4</text>
<text x="370" y="334" class="small">each loop: 1/4</text>
<text x="50" y="379" class="small">c = 3/2;  K = 1;  H = 2. Positions and edges are schematic.</text>
<rect x="25" y="424" width="850" height="260" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="461" class="head">2. Entropy and absolute log cost  [71.5–71.12]</text>
<text x="52" y="508" class="math">D(2 | 1) = 2 log 2 − 1;   D(1 | 2) = 1 − log 2</text>
<text x="52" y="558" class="math">D* = (log 2)/4;    J = 3 log 2 / 4</text>
<text x="52" y="610" class="math">a |log(a/b)| ≤ D(a | b) + √(2a D(a | b))</text>
<text x="52" y="654" class="small">Both marginals cancel the inside linear term; no symmetry needed.</text>
<rect x="25" y="704" width="850" height="265" rx="14" fill="white" stroke="#a9bdcc"/>
<text x="47" y="741" class="head">3. Random log cuts and the general estimate  [71.8; 71.13]</text>
<text x="52" y="789" class="math">Width w = 1: separation probability = log 2</text>
<text x="52" y="837" class="math">Exact average normalized boundary = (log 2)/2</text>
<text x="52" y="889" class="math">General: average ℬ ≤ σ + (A + √(2A))/w</text>
<text x="52" y="937" class="math">A = (1 + log(H/K)) σ;   σ = ‖ζ − Tζ‖₁ / c</text>
<text x="35" y="1014" class="small">A fixed band plus sufficiently small stationarity supplies the boundary.</text>
<text x="35" y="1050" class="small">Unrestricted Følner must still supply simultaneous control of the band.</text>
<text x="35" y="1086" class="small">Problem credit: Popa, Theorem 4.2.2, pp. 213–214. Original proof 71.1–71.14.</text>
</svg>
