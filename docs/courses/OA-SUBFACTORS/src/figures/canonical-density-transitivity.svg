<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365b75"/></marker></defs>
<rect width="900" height="1280" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;font-size:19px;fill:#182e43}.title{font-size:29px;font-weight:bold}.head{font-size:22px;font-weight:bold}.math{font-family:Georgia,serif;font-size:23px}.small{font-size:17px}.note{fill:#774914}.arrow{fill:none;stroke:#365b75;stroke-width:2.4;marker-end:url(#arrow)}</style>
<text x="34" y="42" class="title">The full central density is forced by two closures</text>
<text x="34" y="74" class="small">Any finite-index II₁ chain A ⊂ B ⊂ C; no extremality or finite depth.</text>
<rect x="25" y="97" width="850" height="337" rx="14" fill="white" stroke="#b8ccd9"/>
<text x="47" y="132" class="head">1. Both partial closures meet at the middle factor  [66.2]</text>
<rect x="48" y="162" width="340" height="82" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="62" y="191" class="math">X: A–B,  Y: B–C</text>
<text x="62" y="219" class="">F ∈ End₍A–C₎(X ⊠ᴮ Y)</text>
<rect x="497" y="162" width="330" height="82" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="511" y="191" class="math">Pᵧ(F) ∈ End₍A–B₎(X)</text>
<text x="511" y="219" class="">close Y with Rᵧ</text>
<path d="M396,204 L489,204" class="arrow"/>
<text x="405" y="184" class="small">Pᵧ</text>
<rect x="48" y="281" width="340" height="78" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="62" y="310" class="math">Qₓ(F) ∈ End₍B–C₎(Y)</text>
<text x="62" y="338" class="">close X with Sₓ</text>
<rect x="497" y="281" width="330" height="78" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="511" y="310" class="math">V* (1 ⊠ F ⊠ 1) V</text>
<text x="511" y="338" class="">endomorphism of L²(B)</text>
<path d="M218,251 L218,273" class="arrow"/>
<text x="237" y="266" class="small">Qₓ</text>
<path d="M396,320 L489,320" class="arrow"/>
<path d="M662,251 L662,273" class="arrow"/>
<text x="48" y="402" class="math">ℓₓ(PᵧF) = rₓ(PᵧF) = ℓᵧ(QₓF) = rᵧ(QₓF).</text>
<rect x="25" y="456" width="850" height="340" rx="14" fill="white" stroke="#b8ccd9"/>
<text x="47" y="491" class="head">2. Fourth roots balance the duality maps  [66.1, 66.3]</text>
<text x="48" y="531" class="math">κ = κ_(A,B),  ω = κ_(B,C),  ν = κ_(A,C).</text>
<text x="48" y="570" class="math">t = κ¼ ∈ B,   u = ω¼ ∈ B′ ∩ C,   v = tu.</text>
<text x="48" y="609" class="small note">u commutes with B; v ∈ A′ ∩ C is not yet known central.</text>
<rect x="48" y="634" width="779" height="73" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="62" y="663" class="math">τ_C(v²z) = τ_C(νv⁻²z) for every z ∈ A′ ∩ C</text>
<text x="62" y="691" class="">Choose z = v² − νv⁻²; faithfulness gives v⁴ = ν.</text>
<text x="48" y="744" class="math">ν = κω ∈ Z(A′ ∩ C); canonical expectations compose.</text>
<text x="48" y="777" class="small">The input centrality of ν is known from its own two-trace definition.</text>
<rect x="25" y="818" width="850" height="331" rx="14" fill="white" stroke="#b8ccd9"/>
<text x="47" y="853" class="head">3. Actual cups for 65.14 — here i = 1, m = 3  [66.4]</text>
<rect x="48" y="882" width="353" height="82" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="62" y="911" class="math">Lower: M₋₄ ⊂ M₋₂ ⊂ M₀</text>
<text x="62" y="939" class="">g₁ᵇˡᵏ = d r₋₂ r₋₃ r₋₁ r₋₂</text>
<rect x="488" y="882" width="353" height="82" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="502" y="911" class="math">Upper: M₀ ⊂ M₂ ⊂ M₄</text>
<text x="502" y="939" class="">Q₀ = d e₂ e₁ e₃ e₂</text>
<text x="48" y="1002" class="math">E_(M₋₂′ ∩ M₀)(g₁ᵇˡᵏ) = d⁻²1;    rⱼ = κⱼ½ eⱼ κⱼ½.</text>
<text x="48" y="1037" class="small">Finite domain pair: M₋₆′ ∩ M₋₂ ⊂ M₋₆′ ∩ M₀.</text>
<text x="48" y="1070" class="small">Finite target pair: M₂′ ∩ M₆ ⊂ M₀′ ∩ M₆.</text>
<text x="48" y="1112" class="note">No comparison arrow is proved by this density identity.</text>
<text x="34" y="1201" class="small">Complete proof and six solutions: 66.1–66.30; all factor and cup labels are exact.</text>
<text x="34" y="1235" class="small">Human source: Longo–Roberts, A Theory of Dimension, Theorem3.8, arXiv p.15.</text>
<text x="34" y="1264" class="small">Concrete prerequisites:6.5,63.1–63.4; actual normalized blocked word:64.1–64.2.</text>
</svg>
