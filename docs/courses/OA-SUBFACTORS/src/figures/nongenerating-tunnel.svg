<text x="238" y="664" class="small" text-anchor="start" xml:space="preserve">Rank one in M₃ ⊗ M₃</text>
<text x="30" y="728" class="math" text-anchor="start" xml:space="preserve">φ<tspan baseline-shift="sub" font-size="70%">+</tspan>φ<tspan baseline-shift="sub" font-size="70%">−</tspan>(R) ⊂ φ<tspan baseline-shift="sub" font-size="70%">+</tspan>(R) ⊂ R</text>
<text x="30" y="765" class="small" text-anchor="start" xml:space="preserve">Each of the 9 colored entries is 1/3.</text>
<rect class="panel" x="12" y="802" width="536" height="400" rx="10"/>
<text x="30" y="839" class="head" text-anchor="start" xml:space="preserve">3. The first central value already varies</text>
<rect x="50" y="864" width="124" height="64" fill="#fff1df" stroke="#90aebe"/>
<text x="112" y="905" class="math" text-anchor="middle" xml:space="preserve">2/3</text>
<rect x="218" y="864" width="124" height="64" fill="#e9f2f8" stroke="#90aebe"/>
<text x="280" y="905" class="math" text-anchor="middle" xml:space="preserve">1/6</text>
<rect x="386" y="864" width="124" height="64" fill="#e9f2f8" stroke="#90aebe"/>
<text x="448" y="905" class="math" text-anchor="middle" xml:space="preserve">1/6</text>
<text x="30" y="970" class="small" text-anchor="start" xml:space="preserve">z₁ in D₀ = ℂ³; each block has trace 1/3.</text>
<text x="30" y="1013" class="math" text-anchor="start" xml:space="preserve">E(D<tspan baseline-shift="sub" font-size="70%">n−1</tspan>)(z<tspan baseline-shift="sub" font-size="70%">n+1</tspan>) = z<tspan baseline-shift="sub" font-size="70%">n</tspan></text>
<text x="30" y="1055" class="math" text-anchor="start" xml:space="preserve">0 ≤ z<tspan baseline-shift="sub" font-size="70%">n</tspan> ≤ 1        z<tspan baseline-shift="sub" font-size="70%">n</tspan> → z in L<tspan baseline-shift="super" font-size="70%">2</tspan></text>
<text x="30" y="1097" class="math" text-anchor="start" xml:space="preserve">z ∈ Z(C),    τ(z) = 1/3</text>
<text x="30" y="1141" class="math" text-anchor="start" xml:space="preserve">‖z − (1/3)1‖<tspan baseline-shift="sub" font-size="70%">2</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> ≥ 1/18</text>
<text x="30" y="1180" class="small" text-anchor="start" xml:space="preserve">C = closure of the tunnel relative commutants.</text>
<rect class="panel" x="12" y="1216" width="536" height="259" rx="10"/>
<text x="30" y="1254" class="head" text-anchor="start" xml:space="preserve">4. The two infinite-depth tests fail</text>
<text x="30" y="1298" class="math" text-anchor="start" xml:space="preserve">Graph: ‖Γ‖<tspan baseline-shift="super" font-size="70%">2</tspan> = (2√2)<tspan baseline-shift="super" font-size="70%">2</tspan> = 8 &lt; 9</text>
<text x="30" y="1342" class="math" text-anchor="start" xml:space="preserve">Inclusion: [R : φ<tspan baseline-shift="sub" font-size="70%">+</tspan>(R)] = 9</text>
<text x="30" y="1385" class="small" text-anchor="start" xml:space="preserve">Every tunnel has the same traced closure.</text>
<text x="30" y="1423" class="small" text-anchor="start" xml:space="preserve">Its nonscalar center prevents generation.</text>
<text x="280" y="1500" class="small" text-anchor="middle" xml:space="preserve">Proofs 46.1–46.8 · finite truncation of an infinite tree · CC0</text>
