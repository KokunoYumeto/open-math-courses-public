<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc">
<title id="title">One corner determines the trace of the whole algebra</title>
<desc id="desc">For P equal to the three by three matrices and q equal to E11, the partial isometries E1j have orthogonal initial projections Ejj and the same final projection q. Each diagonal entry of a positive matrix is measured in qPq, and their sum is the ordinary matrix trace. The general extension is a net sum over an arbitrary family.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#145778"/></marker></defs>
<rect width="960" height="710" fill="#fbfcff"/>
<text x="40" y="48" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="bold" fill="#172635">One full corner determines the trace</text>
<text x="40" y="87" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">Matrix example: P = M₃(ℂ),  q = E₁₁,  t(cq) = c.</text>
<text x="40" y="126" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">For a ≥ 0, choose vⱼ = E₁ⱼ,  fⱼ = vⱼ* vⱼ = Eⱼⱼ.</text>
<text x="40" y="165" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">The fⱼ are orthogonal and sum to 1; all vⱼ vⱼ* = q.</text>
<rect x="45" y="220" width="280" height="65" rx="10" fill="#e8f1f6" stroke="#9eb8c5"/>
<text x="185" y="261" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">f₁ = E₁₁</text>
<rect x="610" y="220" width="305" height="65" rx="10" fill="#e8f1f6" stroke="#9eb8c5"/>
<text x="762" y="261" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">t(v₁ a v₁*) = a₁₁</text>
<line x1="345" y1="253" x2="590" y2="253" stroke="#145778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="468" y="239" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#172635">v₁ = E₁₁</text>
<rect x="45" y="315" width="280" height="65" rx="10" fill="#e8f1f6" stroke="#9eb8c5"/>
<text x="185" y="356" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">f₂ = E₂₂</text>
<rect x="610" y="315" width="305" height="65" rx="10" fill="#e8f1f6" stroke="#9eb8c5"/>
<text x="762" y="356" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">t(v₂ a v₂*) = a₂₂</text>
<line x1="345" y1="348" x2="590" y2="348" stroke="#145778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="468" y="334" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#172635">v₂ = E₁₂</text>
<rect x="45" y="410" width="280" height="65" rx="10" fill="#e8f1f6" stroke="#9eb8c5"/>
<text x="185" y="451" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">f₃ = E₃₃</text>
<rect x="610" y="410" width="305" height="65" rx="10" fill="#e8f1f6" stroke="#9eb8c5"/>
<text x="762" y="451" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">t(v₃ a v₃*) = a₃₃</text>
<line x1="345" y1="443" x2="590" y2="443" stroke="#145778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="468" y="429" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#172635">v₃ = E₁₃</text>
<text x="480" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">Each vⱼ a vⱼ* = aⱼⱼ q lies in the same corner qPq.</text>
<rect x="30" y="540" width="900" height="98" rx="10" fill="#e8f1f6" stroke="#9eb8c5"/>
<text x="480" y="576" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="bold" fill="#172635">T(a) = a₁₁ + a₂₂ + a₃₃;   T(q) = 1;   T(1) = 3.</text>
<text x="480" y="615" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">General full-corner formula: T(a) = Σⱼ t(vⱼ a vⱼ*).</text>
<text x="480" y="664" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#172635">General sums run over finite subsets of an arbitrary index set (Lemma 1.2a).</text>
<text x="480" y="695" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#172635">Only initial projections are orthogonal; the final projections may overlap.</text>
</svg>
