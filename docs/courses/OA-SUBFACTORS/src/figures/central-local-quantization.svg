<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1580" viewBox="0 0 740 1580" role="img" aria-labelledby="title desc">
<title id="title">Central counts assemble equal-dimensional global cells</title>
<desc id="desc">Two central pieces have old cell dimensions two sevenths and five sevenths, and four fifths and one fifth. At matrix dimension five their count vectors are one and three plus one remainder, and four and one with no remainder. The five globally assembled cells each have center-valued dimension one fifth on both pieces. Central coefficients, finite Fourier variance and summed-error selection produce a common quantized corner.</desc>
<rect width="740" height="1580" fill="#f8fbfd"/>
<text x="370" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#183f51">Central dimensions produce one common corner</text>
<text x="370" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">B need not be a factor; the containing M is finite with trace τ.</text>
<rect x="20" y="93" width="700" height="292" rx="10" fill="#edf3f8" stroke="#8facbc"/>
<text x="370" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#183f51">1 · The old count vector changes across the center</text>
<text x="370" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">Example: B = W ⊕ W, with scalar trace weights 1/3 and 2/3.</text>
<text x="370" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">Left central piece: T(q₁) = 2/7;  T(q₂) = 5/7</text>
<rect x="80" y="214" width="165.7142857142857" height="42" fill="#dfad91" stroke="#ffffff"/>
<rect x="245.7142857142857" y="214" width="414.2857142857143" height="42" fill="#95bdd5" stroke="#ffffff"/>
<text x="162.85714285714286" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">q₁</text>
<text x="452.85714285714283" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">q₂</text>
<text x="370" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">Right central piece: T(q₁) = 4/5;  T(q₂) = 1/5</text>
<rect x="80" y="307" width="464" height="42" fill="#dfad91" stroke="#ffffff"/>
<rect x="544" y="307" width="116" height="42" fill="#95bdd5" stroke="#ffffff"/>
<text x="312" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">q₁</text>
<text x="602" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">q₂</text>
<text x="370" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#183f51">Bars use normalized center-trace coordinates, not physical position.</text>
<rect x="20" y="408" width="700" height="410" rx="10" fill="#e9f3ec" stroke="#8facbc"/>
<text x="370" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#183f51">2 · Cut the center before choosing the five cells</text>
<text x="370" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#183f51">d = 5;  n_l = floor(d T(q_l));  k = d − Σ_l n_l</text>
<text x="370" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">Left: counts (1, 3); k = 1</text>
<rect x="80" y="538" width="116" height="48" fill="#dfad91" stroke="#ffffff"/>
<text x="138" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p0</text>
<rect x="196" y="538" width="116" height="48" fill="#95bdd5" stroke="#ffffff"/>
<text x="254" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p1</text>
<rect x="312" y="538" width="116" height="48" fill="#95bdd5" stroke="#ffffff"/>
<text x="370" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p2</text>
<rect x="428" y="538" width="116" height="48" fill="#95bdd5" stroke="#ffffff"/>
<text x="486" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p3</text>
<rect x="544" y="538" width="49.71428571428571" height="48" fill="#dfad91" stroke="#ffffff"/>
<rect x="593.7142857142857" y="538" width="66.28571428571428" height="48" fill="#95bdd5" stroke="#ffffff"/>
<text x="602" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p4</text>
<text x="370" y="611" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">Last cell combines 3/35 of q₁ and 4/35 of q₂.</text>
<text x="370" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">Right: counts (4, 1); k = 0</text>
<rect x="80" y="667" width="116" height="48" fill="#dfad91" stroke="#ffffff"/>
<text x="138" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p0</text>
<rect x="196" y="667" width="116" height="48" fill="#dfad91" stroke="#ffffff"/>
<text x="254" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p1</text>
<rect x="312" y="667" width="116" height="48" fill="#dfad91" stroke="#ffffff"/>
<text x="370" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p2</text>
<rect x="428" y="667" width="116" height="48" fill="#dfad91" stroke="#ffffff"/>
<text x="486" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p3</text>
<rect x="544" y="667" width="116" height="48" fill="#95bdd5" stroke="#ffffff"/>
<text x="602" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">p4</text>
<text x="370" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#183f51">Assemble cells by column: T(pⱼ) = (1/5, 1/5), τ(pⱼ) = 1/5.</text>
<text x="370" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">For a′ = (2q₁ − q₂)(1 − r), the coefficient lists are</text>
<text x="370" y="807" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">left (2, −1, −1, −1, 0); right (2, 2, 2, 2, −1).</text>
<rect x="20" y="841" width="700" height="315" rx="10" fill="#eff0fa" stroke="#8facbc"/>
<text x="370" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#183f51">3 · Average over a finite Fourier ensemble</text>
<text x="370" y="917" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">Equivalent global cells extend to F = M_d(ℂ) ⊂ B.</text>
<text x="370" y="952" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#183f51">H = F′ ∩ B contains Z(B);  E_H(a′) = T(a′).</text>
<text x="370" y="988" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">‖E_H(b) − T(b)‖₂ &lt; α for the chosen finite family.</text>
<text x="370" y="1023" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">U = diag(ζ₀,…,ζ_d−1) F_d;  ζⱼ ∈ {1, i, −1, −i}</text>
<text x="370" y="1060" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#183f51">Mean ‖Φ_P(b) − E_H(b)‖₂²</text>
<text x="370" y="1093" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#183f51">= d⁻² Σⱼ≠ₖ ‖bⱼₖ‖₂,τ₀² ≤ ‖b‖₂² / d</text>
<text x="370" y="1129" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#183f51">τ₀ = d τ on e₀₀Be₀₀; coefficients may be noncommuting.</text>
<rect x="20" y="1180" width="700" height="324" rx="10" fill="#fff2e8" stroke="#8facbc"/>
<text x="370" y="1219" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#183f51">4 · Sum every target’s error before choosing a cell</text>
<text x="370" y="1256" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">C = B′ ∩ M;  E_C(bc) = T(b)c;  D = B ∨ C</text>
<text x="370" y="1291" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#183f51">Control E_D(y) by central Fourier pinching.</text>
<text x="370" y="1326" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">Remove y − E_D(y) by the common refinement of 54.5.</text>
<text x="370" y="1364" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#183f51">Σᵢ Σ_y ‖qᵢyqᵢ − E_C(y)qᵢ‖₂² &lt; ε² Σᵢ τ(qᵢ)</text>
<text x="370" y="1402" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#183f51">One qᵢ satisfies every relative error bound.</text>
<text x="370" y="1438" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#183f51">Split once more and use the same sum to arrange τ(q) ≤ t₀.</text>
<text x="370" y="1476" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#183f51">The central trace T(b) is retained throughout.</text>
<text x="370" y="1533" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#183f51">Exact example: (56.33)–(56.35). Construction: Lemmas 56.1–56.2.</text>
<text x="370" y="1562" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#183f51">Variance: (56.21)–(56.22). Common corner: Theorem 56.5. Original · CC0.</text>
</svg>
