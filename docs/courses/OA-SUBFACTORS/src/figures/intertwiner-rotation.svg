<svg xmlns="http://www.w3.org/2000/svg" width="540" height="930" viewBox="0 0 540 930" role="img" aria-labelledby="title desc">
<title id="title">Module traces fix the connection rotation</title>
<desc id="desc">An isometric edge map from b to a tensor T bends to a map of squared norm mu(b)/mu(a); multiplying by sqrt(mu(a)/mu(b)) gives its normalized reverse. Two reverse edges contribute sqrt(mu(a)mu(c)/(mu(b)mu(d))). Closing the rotated cell contributes mu(d)/mu(c) times the conjugated coefficient. Their product is sqrt(mu(a)mu(d)/(mu(b)mu(c))) times conjugate w. The exact first rows are G0m=Bm and G1m=Am with vertical tensoring by X equal to the actual inclusion. The projection e0 is the marked rank-one projection in the unit N block of A1, with trace delta^-2. It equals the block identity when X is irreducible; later projections are horizontal cups. Lemmas37.1–37.3, Proposition37.4, Theorem37.5.</desc>
<rect width="540" height="930" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#527397"/></marker></defs>
<text x="24" y="33" class="title" text-anchor="start">A trace calculation fixes the rotated cell</text>
<rect x="24" y="55" width="492" height="118" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="84" class="heading" text-anchor="middle">Bend an isometric edge f: b → a ⊗ T</text>
<text x="270" y="114" class="label" text-anchor="middle">Unnormalized reverse: squared norm μ(b)/μ(a).</text>
<text x="270" y="140" class="label" text-anchor="middle">Normalize by √(μ(a)/μ(b)); reverse twice gives f.</text>
<rect x="24" y="191" width="492" height="118" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="220" class="heading" text-anchor="middle">Two bends and one closure</text>
<text x="270" y="250" class="label" text-anchor="middle">Mate factors: √(μ(a)μ(c)/(μ(b)μ(d)))</text>
<text x="270" y="276" class="label" text-anchor="middle">Closing trace: μ(d)/μ(c) × conjugate(w)</text>
<rect x="24" y="327" width="492" height="118" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="356" class="heading" text-anchor="middle">The exact rotated coefficient</text>
<text x="270" y="386" class="label" text-anchor="middle">R = √(μ(a)μ(d)/(μ(b)μ(c))) × conjugate(w)</text>
<text x="270" y="412" class="label" text-anchor="middle">Both matrices are changes of orthonormal bases.</text>
<rect x="24" y="463" width="492" height="118" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="492" class="heading" text-anchor="middle">Unequal-weight example: S₃ representations</text>
<text x="270" y="522" class="label" text-anchor="middle">Weights (a,b,c,d) = (1,2,2,1),  w = 1.</text>
<text x="270" y="548" class="label" text-anchor="middle">Rotating gives R = 1/2, with full unitarity.</text>
<text x="270" y="620" class="heading" text-anchor="middle">Recover both actual invariant rows</text>
<text x="92" y="667" class="heading" text-anchor="middle">B₀</text>
<text x="270" y="667" class="heading" text-anchor="middle">B₁</text>
<text x="448" y="667" class="heading" text-anchor="middle">B₂</text>
<path d="M119 661 L236 661" stroke="#527397" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M298 661 L414 661" stroke="#527397" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="92" y="753" class="heading" text-anchor="middle">A₀</text>
<text x="270" y="753" class="heading" text-anchor="middle">A₁</text>
<text x="448" y="753" class="heading" text-anchor="middle">A₂</text>
<path d="M119 747 L236 747" stroke="#527397" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M298 747 L414 747" stroke="#527397" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M92 682 L92 725" stroke="#527397" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M270 682 L270 725" stroke="#527397" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M448 682 L448 725" stroke="#527397" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="350" y="710" class="small" text-anchor="middle">1ₓ ⊗ b = b</text>
<text x="270" y="800" class="label" text-anchor="middle">G₀,ₘ = M′ ∩ Mₘ;  G₁,ₘ = N′ ∩ Mₘ</text>
<text x="270" y="830" class="label" text-anchor="middle">e₀: marked rank-one in the unit-N block of A₁.</text>
<text x="270" y="855" class="label" text-anchor="middle">Block identity if X is irreducible; trace δ⁻².</text>
<text x="270" y="885" class="label" text-anchor="middle">For j ≥ 1: eⱼ is a horizontal cup.</text>
<text x="270" y="905" class="small" text-anchor="middle">Keep both unit roots and every marked projection.</text>
</svg>
