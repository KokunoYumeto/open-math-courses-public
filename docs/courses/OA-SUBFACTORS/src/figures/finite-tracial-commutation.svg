<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Finite tracial commutation: bounded vector and commuting actions</title>
<desc id="desc">For a faithful normal tracial state and T commuting with every left action, the vector xi equals the vector of c with norm at most C. Both paths from Omega to the vector of xc agree, proving T equals right multiplication by c.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#145778"/></marker></defs>
<rect width="960" height="650" fill="#fbfcff"/>
<text x="40" y="47" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="bold" fill="#172635">Finite tracial commutation</text>
<text x="40" y="83" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#172635">H = L²(B, τ),  τ faithful and normal,  T ∈ L(B)′,  C = ‖T‖</text>
<rect x="30" y="112" width="900" height="166" rx="12" fill="#e8f1f6"/>
<text x="50" y="146" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#172635">The bounded-vector step (FC2–FC7)</text>
<text x="50" y="182" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">ξ = TΩ;   ‖Lₐξ‖₂ ≤ C‖a‖₂;   |⟨ξ, ŷ⟩| ≤ Cτ(|y|)</text>
<text x="50" y="220" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172635">The weakly compact set K_C = {ĉ : ‖c‖ ≤ C} has the same support bound.</text>
<text x="50" y="254" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#172635">Therefore ξ = ĉ for a unique c ∈ B, with ‖c‖ ≤ C.</text>
<text x="120" y="341" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">Ω = vector of 1</text>
<text x="635" y="341" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">ξ = vector of c</text>
<text x="120" y="498" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">vector of x</text>
<text x="635" y="498" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#172635">vector of xc</text>
<line x1="330" y1="333" x2="610" y2="333" stroke="#145778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="470" y="321" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">T</text>
<line x1="250" y1="362" x2="250" y2="466" stroke="#145778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="208" y="421" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#172635">Lₓ</text>
<line x1="760" y1="362" x2="760" y2="466" stroke="#145778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="799" y="421" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#172635">Lₓ</text>
<line x1="330" y1="489" x2="610" y2="489" stroke="#145778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="470" y="478" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">T</text>
<text x="480" y="554" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#172635">TLₓΩ = LₓTΩ = vector of xc = R_c(vector of x)</text>
<text x="480" y="595" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172635">Density gives T = R_c and L(B)′ = R(B).  Conjugation by J gives R(B)′ = L(B).</text>
<text x="480" y="626" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#172635">The arrows act on the actual tracial Hilbert space; no dimension restriction is assumed.</text>
</svg>
