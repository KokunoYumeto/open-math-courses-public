<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1180" viewBox="0 0 740 1180"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365c78"/></marker></defs><rect width="740" height="1180" fill="white"/>
<text x="26" y="39" font-family="Arial, sans-serif" font-size="26" fill="#17324a" font-weight="bold">Keep the prefix; generate both factors</text>
<text x="26" y="70" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">Exact algebra maps, skipped indices and error bounds</text>
<rect x="18" y="94" width="704" height="322" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="36" y="127" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">1. Full compatibility comes from a finite common basis</text>
<rect x="75" y="163" width="170" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="126" y="198" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">B = ⟨M,e⟩</text>
<rect x="489" y="163" width="170" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="563" y="198" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">M</text>
<rect x="75" y="293" width="170" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="120" y="328" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">Aₖ = ⟨Nₖ,e⟩</text>
<rect x="489" y="293" width="170" height="54" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="559" y="328" font-family="Arial, sans-serif" font-size="21" fill="#17324a" font-weight="normal">Nₖ</text>
<line x1="255" y1="190" x2="479" y2="190" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="359" y="181" font-family="Arial, sans-serif" font-size="22" fill="#17324a" font-weight="normal">Φ</text>
<line x1="255" y1="320" x2="479" y2="320" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="359" y="311" font-family="Arial, sans-serif" font-size="22" fill="#17324a" font-weight="normal">Φ</text>
<line x1="160" y1="226" x2="160" y2="283" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="181" y="259" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">Eₖ</text>
<line x1="574" y1="226" x2="574" y2="283" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="595" y="259" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">E_Nₖ</text>
<text x="36" y="377" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">E_Nₖ Φ = Φ Eₖ.  Φ may be nonnormal; all coefficient sums are finite.</text>
<text x="36" y="400" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">T = Σᵢ aᵢ Eₖ(aᵢ* T), with aᵢ in R. Proof: (60.6)–(60.9).</text>
<rect x="18" y="435" width="704" height="363" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="469" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">2. k = 2: the higher step has index a = d³</text>
<rect x="55" y="500" width="115" height="49" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="67" y="532" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">M = L₋₁</text>
<rect x="230" y="500" width="115" height="49" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="242" y="532" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">N₂ = L₀</text>
<rect x="405" y="500" width="115" height="49" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="417" y="532" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">N₅ = L₁</text>
<rect x="580" y="500" width="115" height="49" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="592" y="532" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">N₈ = L₂</text>
<line x1="179" y1="525" x2="219" y2="525" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="491" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">⊃</text>
<text x="175" y="575" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">index d³</text>
<line x1="354" y1="525" x2="394" y2="525" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="491" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">⊃</text>
<text x="350" y="575" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">index d³</text>
<line x1="529" y1="525" x2="569" y2="525" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530" y="491" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">⊃</text>
<text x="525" y="575" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">index d³</text>
<text x="36" y="616" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">N₅ ⊂ N₂ ⊂ M is a basic triple. Its Jones projection has E_N₂(g) = d⁻³1.</text>
<text x="36" y="650" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">Ordinary prefix retained exactly:</text>
<rect x="55" y="674" width="65" height="45" rx="8" fill="#d9eee5" stroke="#9eb3c5"/>
<text x="74" y="703" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">N₀</text>
<rect x="145" y="674" width="65" height="45" rx="8" fill="#d9eee5" stroke="#9eb3c5"/>
<text x="164" y="703" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">N₁</text>
<rect x="235" y="674" width="65" height="45" rx="8" fill="#d9eee5" stroke="#9eb3c5"/>
<text x="254" y="703" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">N₂</text>
<line x1="125" y1="697" x2="140" y2="697" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="215" y1="697" x2="230" y2="697" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="310" y1="697" x2="491" y2="697" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="331" y="685" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">ordinary continuation</text>
<rect x="505" y="674" width="170" height="45" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="536" y="703" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">last level = U₂</text>
<text x="36" y="755" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">u ∈ N₂ fixes g₀,g₁ and aligns the final N₈ with U₂. Targets stay fixed.</text>
<text x="36" y="781" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">The arrows order algebras; their spacing represents no metric geometry.</text>
<rect x="18" y="817" width="704" height="267" rx="8" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="851" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">3. One nested tunnel for a countable dense sequence</text>
<rect x="38" y="887" width="64" height="34" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="53" y="911" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">i = 1</text>
<text x="122" y="911" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">retain prior prefix; kᵢ ≥ 5; test x₁; error &lt; 1/2</text>
<rect x="38" y="934" width="64" height="34" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="53" y="958" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">i = 2</text>
<text x="122" y="958" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">retain prior prefix; kᵢ ≥ 11; test x₁,x₂; error &lt; 1/4</text>
<rect x="38" y="981" width="64" height="34" rx="8" fill="white" stroke="#9eb3c5"/>
<text x="53" y="1005" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">i = 3</text>
<text x="122" y="1005" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">retain prior prefix; kᵢ ≥ 23; test x₁,x₂,x₃; error &lt; 1/8</text>
<text x="36" y="1044" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">Starting at k₀ = 2: kᵢ ≥ 3·2ⁱ − 1. Actual stages may be later.</text>
<text x="26" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">All i ≥ j approximate xⱼ within 2⁻ⁱ; distance to the final closure is zero.</text>
<text x="26" y="1150" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Human source: Sorin Popa, DOI 10.1007/BF02392646, §§3.2.4(i), 4.4.</text>
</svg>