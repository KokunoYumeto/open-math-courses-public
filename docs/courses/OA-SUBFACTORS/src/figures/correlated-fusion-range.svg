<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1320" role="img" aria-labelledby="title desc">
<title id="title">One shared vector specifies the embedded fusion range</title>
<desc id="desc">For N equal to one tensor Q in M2 tensor Q, index four, the basic construction is M4 tensor Q. The four rank-one coordinate projections resolve the identity. The old M acts by two identical blocks X,X. Independent vectors in the four fusion terms allow independent blocks X1,X2. The conditional expectation averages those two blocks. The witness E11,0 has expectation E11 over two in both blocks, with squared L2 distance one eighth. The bounded matrix coordinates are displayed; Hilbert ranges are their L2 closures with Q coefficients.</desc>
<rect width="560" height="1320" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#15283b}.head{font-size:22px;font-weight:bold}.label{font-size:19px;font-weight:bold}.small{font-size:17px}</style>
<text x="280" y="36" class="head" text-anchor="middle">One shared vector fixes the fusion range</text>
<rect x="20" y="61" width="520" height="155" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="99" class="label" text-anchor="start">N = 1 ⊗ Q ⊂ M = M₂ ⊗ Q;  d = 4,  λ = 1/4</text>
<text x="40" y="137" class="small" text-anchor="start">B = M₄ ⊗ Q;  uᵢⱼ = √2 Eᵢⱼ ⊗ 1</text>
<text x="40" y="174" class="small" text-anchor="start">pᵢⱼ = uᵢⱼ e uᵢⱼ*;  Σ pᵢⱼ = 1</text>
<text x="40" y="199" class="small" text-anchor="start">Basis order:  v₁₁, v₂₁ | v₁₂, v₂₂</text>
<rect x="20" y="238" width="520" height="309" rx="10" fill="#f0f7f0" stroke="#9cb4cd"/>
<text x="40" y="277" class="label" text-anchor="start">Correlated: one ξ in every term</text>
<text x="40" y="316" class="small" text-anchor="start">Sξ = (1/2) Σ (ξuᵢⱼ) ⊠ uᵢⱼ*</text>
<text x="40" y="355" class="small" text-anchor="start">Under V:  Σ ξpᵢⱼ = ξ</text>
<text x="40" y="389" class="small" text-anchor="start">Old bounded matrices:  diag(X,X)</text>
<rect x="60" y="409" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="75" y="431" class="small" text-anchor="middle">a</text>
<rect x="90" y="409" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="105" y="431" class="small" text-anchor="middle">b</text>
<rect x="120" y="409" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="135" y="431" class="small" text-anchor="middle">0</text>
<rect x="150" y="409" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="165" y="431" class="small" text-anchor="middle">0</text>
<rect x="60" y="439" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="75" y="461" class="small" text-anchor="middle">c</text>
<rect x="90" y="439" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="105" y="461" class="small" text-anchor="middle">d</text>
<rect x="120" y="439" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="135" y="461" class="small" text-anchor="middle">0</text>
<rect x="150" y="439" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="165" y="461" class="small" text-anchor="middle">0</text>
<rect x="60" y="469" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="75" y="491" class="small" text-anchor="middle">0</text>
<rect x="90" y="469" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="105" y="491" class="small" text-anchor="middle">0</text>
<rect x="120" y="469" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="135" y="491" class="small" text-anchor="middle">a</text>
<rect x="150" y="469" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="165" y="491" class="small" text-anchor="middle">b</text>
<rect x="60" y="499" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="75" y="521" class="small" text-anchor="middle">0</text>
<rect x="90" y="499" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="105" y="521" class="small" text-anchor="middle">0</text>
<rect x="120" y="499" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="135" y="521" class="small" text-anchor="middle">c</text>
<rect x="150" y="499" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="165" y="521" class="small" text-anchor="middle">d</text>
<text x="224" y="441" class="small" text-anchor="start">The same a,b,c,d in both blocks</text>
<text x="224" y="482" class="small" text-anchor="start">a,b,c,d ∈ Q: four coefficients</text>
<text x="224" y="523" class="small" text-anchor="start">Closed range: L²(M)</text>
<rect x="20" y="568" width="520" height="300" rx="10" fill="#fff5e8" stroke="#9cb4cd"/>
<text x="40" y="607" class="label" text-anchor="start">Independent: a separate ξᵢⱼ in each term</text>
<text x="40" y="646" class="small" text-anchor="start">Under V:  Σ ξᵢⱼpᵢⱼ; bounded matrices diag(X₁,X₂)</text>
<rect x="60" y="679" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
<text x="75" y="701" class="small" text-anchor="middle">a</text>
<rect x="90" y="679" width="30" height="30" fill="#d8ebfa" stroke="#627c94" stroke-width="0.7"/>
