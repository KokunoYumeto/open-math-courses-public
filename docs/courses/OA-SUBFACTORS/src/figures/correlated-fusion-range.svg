<text x="135" y="761" class="small" text-anchor="middle">w</text>
<rect x="150" y="739" width="30" height="30" fill="#ffe4be" stroke="#627c94" stroke-width="0.7"/>
<text x="165" y="761" class="small" text-anchor="middle">x</text>
<rect x="60" y="769" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="75" y="791" class="small" text-anchor="middle">0</text>
<rect x="90" y="769" width="30" height="30" fill="#ffffff" stroke="#627c94" stroke-width="0.7"/>
<text x="105" y="791" class="small" text-anchor="middle">0</text>
<rect x="120" y="769" width="30" height="30" fill="#ffe4be" stroke="#627c94" stroke-width="0.7"/>
<text x="135" y="791" class="small" text-anchor="middle">y</text>
<rect x="150" y="769" width="30" height="30" fill="#ffe4be" stroke="#627c94" stroke-width="0.7"/>
<text x="165" y="791" class="small" text-anchor="middle">z</text>
<text x="224" y="712" class="small" text-anchor="start">a,b,c,d and w,x,y,z ∈ Q</text>
<text x="224" y="751" class="small" text-anchor="start">Two independent blocks</text>
<text x="224" y="790" class="small" text-anchor="start">Eight coefficients; range L²(C)</text>
<text x="40" y="839" class="small" text-anchor="start">The eight entries can vary independently</text>
<text x="280" y="899" class="label" text-anchor="middle">↓  orthogonal projection onto L²(M)</text>
<rect x="20" y="922" width="520" height="126" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="961" class="small" text-anchor="start">diag(X₁,X₂) ↦ diag((X₁+X₂)/2,(X₁+X₂)/2)</text>
<text x="40" y="1002" class="small" text-anchor="start">The old range requires the two blocks to agree</text>
<rect x="20" y="1069" width="520" height="155" rx="10" fill="#f2eefb" stroke="#9cb4cd"/>
<text x="40" y="1108" class="label" text-anchor="start">Witness:  p₁₁ = diag(E₁₁,0) ⊗ 1</text>
<text x="40" y="1147" class="small" text-anchor="start">Projection:  diag(E₁₁/2,E₁₁/2) ⊗ 1</text>
<text x="40" y="1186" class="small" text-anchor="start">Squared L² distance:  1/4 − 1/8 = 1/8 &gt; 0</text>
<text x="40" y="1261" class="small" text-anchor="start">Lemma 6.8; Propositions 6.9 and 6.11; (6.5)–(6.13)</text>
<text x="40" y="1287" class="small" text-anchor="start">Bounded matrices shown; Hilbert ranges are their L² closures</text>
</svg>
