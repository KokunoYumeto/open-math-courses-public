<text x="1124" y="1572" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#16334c">residual</text>
<text x="1124" y="1599" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#16334c">trace 1/27</text>
<text x="1124" y="1626" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#16334c">rank two</text>
<text x="55" y="1680" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#16334c">Connect all 27 equal-trace diagonals by actual partial isometries in the fixed physical D.</text>
<text x="55" y="1711" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#16334c">The 26 colored units retain E_ab ⊗ z. The gray support carries exactly the error E_ab ⊗ (1 − z).</text>
<text x="34" y="1762" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#16334c">GTB.6 obstructs exact selected-block retention. GTB.7 proves controlled retention in this actual example.</text>
<text x="34" y="1794" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#16334c">No universal centered-core construction or full original partition theorem is claimed from this figure.</text>
