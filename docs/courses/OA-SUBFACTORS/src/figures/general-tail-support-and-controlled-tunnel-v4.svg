<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1810" viewBox="0 0 1260 1810">
<rect width="1260" height="1810" fill="#f7f9fc"/>
<text x="34" y="43" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#16334c">Whole supports, actual full corners, and the remaining bridge</text>
<text x="34" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">All areas are schematic. Physical targets Y stay fixed. Proof locators refer to the adjacent note.</text>
<rect x="34" y="102" width="572" height="150" rx="12" fill="#ffffff" stroke="#b3c3d4" stroke-width="2"/>
<rect x="654" y="102" width="572" height="150" rx="12" fill="#ffffff" stroke="#b3c3d4" stroke-width="2"/>
<text x="55" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#16334c">Whole-stage input</text>
<text x="55" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#16334c">F = Nₘ,  p ∈ F′ ∩ N,  t = τ(p),  u = ρ_F(p)</text>
<text x="55" y="200" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#16334c">Fp ⊂ pNp has index Iₚ = dᵐtu</text>
<text x="55" y="233" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">Actual old pair: pAₘp / pBₘp   [OT.2; GTB.4]</text>
<text x="675" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#16334c">Actual skipped Jones triple</text>
<text x="675" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#16334c">T = Nₘ₊₂ₕ ⊂ S = Nₘ₊ₕ ⊂ F</text>
<text x="675" y="200" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#16334c">qₕFqₕ = Tqₕ,  E_S(qₕ) = d⁻ʰ1</text>
<text x="675" y="233" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">qₕ is an actual projection   [14.8; GTB.5]</text>
