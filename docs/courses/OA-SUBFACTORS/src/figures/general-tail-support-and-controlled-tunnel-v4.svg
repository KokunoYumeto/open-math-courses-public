<path d="M 313 272 L 320 282 L 327 272 Z" fill="#286c91"/>
<path d="M 940 252 L 940 282" fill="none" stroke="#286c91" stroke-width="3"/>
<path d="M 933 272 L 940 282 L 947 272 Z" fill="#286c91"/>
<rect x="34" y="285" width="1192" height="194" rx="12" fill="#eaf4fb" stroke="#76a9ca" stroke-width="2"/>
<text x="55" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold" fill="#16334c">Proved full corner: r = pqₕ   [GTB.2]</text>
<text x="55" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#16334c">τ(r) = td⁻ʰ     ρ_T(r) = ud⁻ʰ     support product = tu d⁻²ʰ</text>
<text x="55" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#16334c">[rNr : Tr] = dᵐtu = Iₚ, unchanged;  [rMr : rNr] = d</text>
<text x="55" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#16334c">The old operators r(pAₘp)r are retained in the full supported late cell.</text>
<text x="55" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">Each canonical tower keeps its own cups, expectations and traces, at its own index.</text>
<path d="M 320 479 L 320 510" fill="none" stroke="#286c91" stroke-width="3"/>
<path d="M 313 500 L 320 510 L 327 500 Z" fill="#286c91"/>
<rect x="34" y="514" width="572" height="180" rx="12" fill="#ffffff" stroke="#b3c3d4" stroke-width="2"/>
<rect x="654" y="514" width="572" height="180" rx="12" fill="#fff7e8" stroke="#d5b774" stroke-width="2"/>
<text x="55" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#16334c">Finite actual orthogonal refinement</text>
<text x="55" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#16334c">L = ⌊dʰ⌋ copies inside F; individual continuations</text>
<text x="55" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#16334c">0 ≤ discarded physical mass &lt; td⁻ʰ</text>
<text x="55" y="646" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#16334c">Each new compressed local index is still Iₚ.</text>
<text x="55" y="678" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#16334c">Whole-stage supports persist.   [GTB.3; GTB.10–11]</text>
<text x="675" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" fill="#16334c">Additional actual corner-chain input</text>
<text x="675" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#16334c">pMp ⊃ pNp ⊃ ⋯ ⊃ Sₖ ⊂ G′ ∩ pNp</text>
<text x="675" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#16334c">Requires actual cups, expectations and generation.</text>
<text x="675" y="646" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#16334c">⇔ whole tail p ∈ Tₖ retaining G physically</text>
<text x="675" y="678" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">Numerical index equality is insufficient.   [GTB.4]</text>
<path d="M 940 694 L 940 725" fill="none" stroke="#286c91" stroke-width="3"/>
<path d="M 933 715 L 940 725 L 947 715 Z" fill="#286c91"/>
<rect x="654" y="729" width="572" height="171" rx="12" fill="#e9f6ee" stroke="#82b897" stroke-width="2"/>
<text x="675" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#16334c">Sufficient route to the full finite partition</text>
<text x="675" y="793" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#16334c">Actual corner chains for the finite near-cover</text>
<text x="675" y="826" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">→ tail family → OT.1 → full actual cells summing to1</text>
<text x="675" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">Both expectations, A₀ and strict target error retained.</text>
<text x="675" y="887" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#16334c">Original residual is finitely realized here.   [GTB.5]</text>
<rect x="34" y="729" width="572" height="171" rx="12" fill="#edf0f7" stroke="#b2bdd4" stroke-width="2"/>
<text x="55" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#16334c">Genuine Jones test: d =9, rank-two p</text>
<text x="55" y="793" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#16334c">(t,u) = (2/3,2/3) → (2/27,2/27)</text>
<text x="55" y="826" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#16334c">Iₚ =4 before and after the full-corner cup</text>
<text x="55" y="859" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#16334c">4 ≠9ᵏ for every integer k ≥0.   [GTB.14–19]</text>
<text x="55" y="887" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#16334c">This tests this route; it does not refute the theorem.</text>
<rect x="34" y="938" width="1192" height="168" rx="12" fill="#fff0ee" stroke="#d89188" stroke-width="2"/>
<text x="55" y="971" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#943c32">Remaining unrestricted implication</text>
<text x="55" y="1007" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#943c32">General amenability ⇒ controlled candidates/chains, different cells, or another full finite construction.</text>
<text x="55" y="1042" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#943c32">Exact retention of every selected block can fail at every finite length: GTB.6 below.</text>
<text x="55" y="1077" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#943c32">GTB.8 sufficient budget: ε₀ + √Σδᵢ² &lt; ε/2,  τ(f) &lt; ε²/(16R²). General input remains open.</text>
<text x="34" y="1142" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#16334c">Human source: S. Popa, Acta Mathematica172(1994),1.3.2 p.178 and4.4 pp.220–222. Independent schematic.</text>
<rect x="34" y="1172" width="572" height="252" rx="12" fill="#fff0ee" stroke="#d89188" stroke-width="2"/>
<rect x="654" y="1172" width="572" height="252" rx="12" fill="#e9f6ee" stroke="#82b897" stroke-width="2"/>
<text x="55" y="1205" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#943c32">Same rank-two example, every length</text>
<text x="55" y="1242" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#943c32">pNp = Mat₂ ⊗ F  ⊂  pMp = Mat₃ ⊗ Mat₂ ⊗ F</text>
<text x="55" y="1279" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#943c32">Every actual smaller stage: Mat₃ʲ  [GTB.21]</text>
<text x="55" y="1316" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#943c32">Exact G retention ⇒ unital Mat₂ inside Mat₃ʲ.</text>
<text x="55" y="1353" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#943c32">Two equal integer ranks cannot sum to odd 3ʲ.</text>
<text x="55" y="1391" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#943c32">Full smooth-representation amenability: GTB.6a.</text>
<text x="675" y="1205" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#245a3a">Controlled actual matrix completion</text>
<text x="675" y="1242" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#245a3a">L = 3ʲ,  τ_F(z) = 1 − 1/L,  q = (L − 1)/2</text>
<text x="675" y="1279" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#245a3a">L − 1 old units + equal-trace residual → Mat_L</text>
<text x="675" y="1316" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#245a3a">Rotate the tunnel; fixed targets stay in place.</text>
<text x="675" y="1353" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#245a3a">36 two-leg targets: error² = 1/(6L).</text>
<text x="675" y="1391" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245a3a">At j = 3: error = 1/√162 &lt; 1/10.  [GTB.23–24]</text>
<rect x="34" y="1454" width="1192" height="271" rx="12" fill="#ffffff" stroke="#b3c3d4" stroke-width="2"/>
<text x="55" y="1488" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#16334c">Actual L = 27 completion in Mat₂ ⊗ Mat₂₇  [GTB.7 / Exercise GTB.2]</text>
<text x="55" y="1522" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#16334c">Each colored diagonal has normalized D-trace 1/27 and ordinary rank two.</text>
