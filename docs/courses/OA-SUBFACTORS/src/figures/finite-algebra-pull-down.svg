<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1000" role="img" aria-labelledby="title desc">
<title id="title">Pull-down assembles columns of a matrix</title>
<desc id="desc">For diagonal C2 inside M2, the basic construction is two copies of M2. The Jones projection selects column one in the first block and column two in the second. The Markov coefficient is one half. Pull-down forms the common matrix with column one from X and column two from Y. Taking X=E11 and Y=E12 gives norm square two, attaining the square root two bound.</desc>
<rect width="560" height="1000" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#15283b}.small{font-size:17px}.body{font-size:20px}.head{font-size:23px;font-weight:bold}.label{font-size:19px;font-weight:bold}</style>
<text x="280" y="38" class="head" text-anchor="middle">Pull-down assembles bounded columns</text>
<rect x="20" y="62" width="520" height="151" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="97" class="label" text-anchor="start">A = diagonal C²  ⊂  B = M₂</text>
<text x="40" y="133" class="body" text-anchor="start">B₁ = M₂ ⊕ M₂,     x ∈ B ↦ (x,x)</text>
<text x="40" y="168" class="label" text-anchor="start">e<tspan baseline-shift="sub" font-size="70%">A</tspan> = (E₁₁,E₂₂),    λ = 1/2</text>
<text x="40" y="196" class="small" text-anchor="start">Minimal-projection trace weight: 1/4 in each block</text>
<rect x="20" y="236" width="520" height="208" rx="10" fill="#f0f7f0" stroke="#9cb4cd"/>
<text x="40" y="271" class="label" text-anchor="start">Two basic-construction blocks</text>
<text x="147" y="301" class="label" text-anchor="middle">X</text>
<text x="407" y="301" class="label" text-anchor="middle">Y</text>
<rect x="72" y="318" width="75" height="45" fill="#a8d2e9" stroke="#9cb4cd"/>
<text x="109.5" y="346" class="body" text-anchor="middle">x₁₁</text>
<rect x="147" y="318" width="75" height="45" fill="#e3edf2" stroke="#9cb4cd"/>
<text x="184.5" y="346" class="body" text-anchor="middle">x₁₂</text>
<rect x="72" y="363" width="75" height="45" fill="#a8d2e9" stroke="#9cb4cd"/>
<text x="109.5" y="391" class="body" text-anchor="middle">x₂₁</text>
<rect x="147" y="363" width="75" height="45" fill="#e3edf2" stroke="#9cb4cd"/>
<text x="184.5" y="391" class="body" text-anchor="middle">x₂₂</text>
<rect x="332" y="318" width="75" height="45" fill="#e3edf2" stroke="#9cb4cd"/>
<text x="369.5" y="346" class="body" text-anchor="middle">y₁₁</text>
<rect x="407" y="318" width="75" height="45" fill="#f0c9aa" stroke="#9cb4cd"/>
<text x="444.5" y="346" class="body" text-anchor="middle">y₁₂</text>
<rect x="332" y="363" width="75" height="45" fill="#e3edf2" stroke="#9cb4cd"/>
<text x="369.5" y="391" class="body" text-anchor="middle">y₂₁</text>
<rect x="407" y="363" width="75" height="45" fill="#f0c9aa" stroke="#9cb4cd"/>
<text x="444.5" y="391" class="body" text-anchor="middle">y₂₂</text>
<text x="40" y="428" class="small" text-anchor="start">Block products: XE₁₁ and YE₂₂ retain columns 1 and 2.</text>
<rect x="20" y="468" width="520" height="196" rx="10" fill="#fff5e8" stroke="#9cb4cd"/>
<text x="40" y="504" class="label" text-anchor="start">R(X,Y) = XE₁₁ + YE₂₂</text>
<rect x="205" y="522" width="75" height="45" fill="#a8d2e9" stroke="#9cb4cd"/>
<text x="242.5" y="550" class="body" text-anchor="middle">x₁₁</text>
<rect x="280" y="522" width="75" height="45" fill="#f0c9aa" stroke="#9cb4cd"/>
<text x="317.5" y="550" class="body" text-anchor="middle">y₁₂</text>
<rect x="205" y="567" width="75" height="45" fill="#a8d2e9" stroke="#9cb4cd"/>
<text x="242.5" y="595" class="body" text-anchor="middle">x₂₁</text>
<rect x="280" y="567" width="75" height="45" fill="#f0c9aa" stroke="#9cb4cd"/>
<text x="317.5" y="595" class="body" text-anchor="middle">y₂₂</text>
<text x="40" y="646" class="small" text-anchor="start">R(X,Y)e<tspan baseline-shift="sub" font-size="70%">A</tspan> = (XE₁₁,YE₂₂) = (X,Y)e<tspan baseline-shift="sub" font-size="70%">A</tspan></text>
<rect x="20" y="687" width="520" height="139" rx="10" fill="#f2eefb" stroke="#9cb4cd"/>
<text x="40" y="724" class="label" text-anchor="start">Norm bound attained</text>
<text x="40" y="759" class="small" text-anchor="start">X = E₁₁,   Y = E₁₂,   ‖(X,Y)‖ = 1</text>
<text x="40" y="796" class="small" text-anchor="start">R = E₁₁ + E₁₂,     RR* = 2E₁₁,     ‖R‖ = √2</text>
<rect x="20" y="849" width="520" height="104" rx="10" fill="#edf4fb" stroke="#9cb4cd"/>
<text x="40" y="885" class="label" text-anchor="start">Direct sums retain the same scalar λ = 1/2.</text>
<text x="40" y="920" class="small" text-anchor="start">Original component masses can be 1/3 and 2/3.</text>
<text x="40" y="981" class="small" text-anchor="start">Proposition 8.8 and Exercise 8.5</text>
</svg>
