<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1660" viewBox="0 0 900 1660">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365b75"/></marker></defs>
<rect width="900" height="1660" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;font-size:19px;fill:#182e43}.title{font-size:28px;font-weight:bold}.head{font-size:22px;font-weight:bold}.math{font-family:Georgia,serif;font-size:23px}.small{font-size:17px}.note{fill:#774914}.arrow{fill:none;stroke:#365b75;stroke-width:2.4;marker-end:url(#arrow)}</style>
<text x="34" y="42" class="title">Finite traces do not determine the orbit of a cup</text>
<text x="34" y="75" class="small">Exact finite certificates; their general tower satisfaction remains unproved.</text>
<rect x="25" y="97" width="850" height="285" rx="14" fill="white" stroke="#b8ccd9"/>
<text x="47" y="132" class="head">1. Match all weighted inclusion data  [67.1]</text>
<rect x="48" y="158" width="328" height="106" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="62" y="187" class="math">G = ⊕ᵦ Mat(mᵦ) ⊂ F</text>
<text x="62" y="215" class="">nₐ = Σᵦ mᵦ Lᵦₐ</text>
<text x="62" y="243" class="">minimal weight tₐ</text>
<rect x="519" y="158" width="328" height="106" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="533" y="187" class="math">V = ⊕𝒹 Mat(M𝒹) ⊂ U</text>
<text x="533" y="215" class="">N𝒸 = Σ𝒹 M𝒹 K𝒹𝒸</text>
<text x="533" y="243" class="">minimal weight s𝒸</text>
<path d="M388,208 L507,208" class="arrow"/>
<text x="400" y="186" class="small">α₀, anti</text>
<text x="48" y="304" class="math">nₐ = Nσ(a),  mᵦ = Mπ(b),  Lᵦₐ = Kπ(b),σ(a),  tₐ = sσ(a).</text>
<text x="48" y="344" class="small">All four tests are necessary and sufficient; zero multiplicities count.</text>
<rect x="25" y="403" width="850" height="298" rx="14" fill="white" stroke="#b8ccd9"/>
<text x="47" y="438" class="head">2. Fix the labels, then solve the marked orbit  [67.2–67.3]</text>
<text x="48" y="478" class="math">p = α₀(g),   H = V′ ∩ U,   α = Ad(vw) α₀.</text>
<rect x="48" y="501" width="357" height="82" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="62" y="530" class="math">v ∈ U(V),  w ∈ U(H)</text>
<text x="62" y="558" class="">vw = wv;  α(G) = V</text>
<rect x="479" y="501" width="368" height="82" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="493" y="530" class="math">vwpw* v* = q</text>
<text x="493" y="558" class="">ordinary traces in each U-block</text>
<path d="M418,541 L466,541" class="arrow"/>
<text x="48" y="625" class="math">For block size n, compare every word of length ≤ 2n² − 1.</text>
<text x="48" y="664" class="small">A candidate v passing those moments constructs the required w.</text>
<rect x="25" y="723" width="850" height="496" rx="14" fill="white" stroke="#b8ccd9"/>
<text x="47" y="758" class="head">3. Marginals can agree while the cup image fails  [67.25–67.27]</text>
<text x="48" y="798" class="math">U = Mat₄,  V = diagonal algebra,  H = V,  τ = Tr / 4.</text>
<text x="48" y="836" class="small">Both projections: rank 2, trace 1/2, E_V(p) = E_H(p) = 1/2 · I.</text>
<text x="99" y="877" class="head">p: 2 off-diagonal edges</text>
<path d="M119,910 L322,910" stroke="#365b75" stroke-width="3"/>
<text x="223.5" y="902.0" class="small">1/2</text>
<path d="M119,1052 L322,1052" stroke="#365b75" stroke-width="3"/>
<text x="223.5" y="1044.0" class="small">1/2</text>
<circle cx="119" cy="910" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="114" y="916" class="small">1</text>
<circle cx="119" cy="1052" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="114" y="1058" class="small">2</text>
<circle cx="322" cy="910" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="317" y="916" class="small">3</text>
<circle cx="322" cy="1052" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="317" y="1058" class="small">4</text>
<text x="528" y="877" class="head">q: 4 off-diagonal edges</text>
<path d="M548,910 L751,910" stroke="#365b75" stroke-width="3"/>
<text x="652.5" y="902.0" class="small">3/10</text>
<path d="M548,910 L751,1052" stroke="#365b75" stroke-width="3"/>
<text x="652.5" y="1006.0" class="small">2/5</text>
<path d="M548,1052 L751,910" stroke="#365b75" stroke-width="3"/>
<text x="652.5" y="946.0" class="small">−2/5</text>
<path d="M548,1052 L751,1052" stroke="#365b75" stroke-width="3"/>
<text x="652.5" y="1044.0" class="small">3/10</text>
<circle cx="548" cy="910" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="543" y="916" class="small">1</text>
<circle cx="548" cy="1052" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="543" y="1058" class="small">2</text>
<circle cx="751" cy="910" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="746" y="916" class="small">3</text>
<circle cx="751" cy="1052" r="18" fill="#eaf2f9" stroke="#365b75"/>
<text x="746" y="1058" class="small">4</text>
<text x="48" y="1093" class="small">Diagonal phases preserve magnitudes; permutations preserve edge count.</text>
<text x="48" y="1133" class="math">τ(E₁₁ p E₃₃ p) = 1/16;    τ(E₁₁ q E₃₃ q) = 9/400.</text>
<text x="48" y="1174" class="math">Best squared distance: fixed labels 1/5; all pair maps 1/10.</text>
<rect x="25" y="1241" width="850" height="263" rx="14" fill="white" stroke="#b8ccd9"/>
<text x="47" y="1276" class="head">4. The actual first blocked endpoints  [67.22–67.24]</text>
<rect x="48" y="1305" width="353" height="80" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="62" y="1334" class="math">M₋₆′ ∩ M₋₂ ⊂ M₋₆′ ∩ M₀</text>
<text x="62" y="1362" class="">g₁ᵇˡᵏ = d r₋₂ r₋₃ r₋₁ r₋₂</text>
<rect x="488" y="1305" width="353" height="80" rx="9" fill="#eaf2f9" stroke="#92acbd"/>
<text x="502" y="1334" class="math">M₂′ ∩ M₆ ⊂ M₀′ ∩ M₆</text>
<text x="502" y="1362" class="">q₁ = Q₀ = d e₂ e₁ e₃ e₂</text>
<text x="48" y="1424" class="math">τ(g₁ᵇˡᵏ) = τ(q₁) = d⁻²;   lower cup in M₀, target in M₄.</text>
<text x="48" y="1464" class="note">Needed for general generation: liminfₘ Δₘ,ᵢ = 0 for every fixed i.</text>
<text x="34" y="1553" class="small">Complete finite proofs: 67.1–67.5; six solutions and the exact obstruction.</text>
<text x="34" y="1590" class="small">Human source context: Popa, Classification, §4.5.1, printed pp.223–224.</text>
<text x="34" y="1627" class="small">Analytic theorem:65.1–65.6. Actual canonical blocked cup:66.4.</text>
</svg>
