<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1430" role="img" aria-labelledby="title desc">
<title id="title">A generating weighted-spin Jones tunnel</title>
<desc id="desc">At p=1/4 and q=3/4 balanced blocks generate M, shifted rank-one cups give every tail basic construction, and the specified reflection reverses the first projection weights.</desc>
<rect width="560" height="1430" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs>
<text x="28" y="37" font-family="Arial,sans-serif" font-size="23" fill="#172554" text-anchor="start" font-weight="bold">A generating tunnel; reflection is not normal</text>
<text x="28" y="69" font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="start" font-weight="normal">p = 1/4, q = 3/4,  [M : N] = 16/3</text>
<rect x="16" y="90" width="528" height="370" rx="14" fill="white" stroke="#cbd5e1"/>
<text x="32" y="121" font-family="Arial,sans-serif" font-size="21" fill="#172554" text-anchor="start" font-weight="bold">Balanced blocks: same number of ones</text>
<text x="32" y="150" font-family="Arial,sans-serif" font-size="19" fill="#172554" text-anchor="start" font-weight="normal">Cₙ = ⊕ᵣ M₍ₙ choose r₎    (47.1)</text>
<text x="32" y="202" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">C0</text>
<rect x="94" y="174" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="129.0" y="202" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<text x="32" y="248" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">C1</text>
<rect x="94" y="220" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="129.0" y="248" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<rect x="174" y="220" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="209.0" y="248" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<text x="32" y="294" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">C2</text>
<rect x="94" y="266" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="129.0" y="294" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<rect x="174" y="266" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="209.0" y="294" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">2</text>
<rect x="254" y="266" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="289.0" y="294" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<text x="32" y="340" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">C3</text>
<rect x="94" y="312" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="129.0" y="340" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<rect x="174" y="312" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="209.0" y="340" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">3</text>
<rect x="254" y="312" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="289.0" y="340" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">3</text>
<rect x="334" y="312" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="369.0" y="340" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<text x="32" y="386" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">C4</text>
<rect x="94" y="358" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="129.0" y="386" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<rect x="174" y="358" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="209.0" y="386" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">4</text>
<rect x="254" y="358" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="289.0" y="386" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">6</text>
<rect x="334" y="358" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="369.0" y="386" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">4</text>
<rect x="414" y="358" width="70" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="449.0" y="386" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">1</text>
<text x="32" y="428" font-family="Arial,sans-serif" font-size="19" fill="#172554" text-anchor="start" font-weight="normal">Each old word extends by 0 or 1.</text>
<text x="32" y="451" font-family="Arial,sans-serif" font-size="17" fill="#172554" text-anchor="start" font-weight="normal">Minimal weight: pⁿ⁻ʳqʳ; block mass multiplies it.</text>
<rect x="16" y="480" width="528" height="330" rx="14" fill="white" stroke="#cbd5e1"/>
<text x="32" y="515" font-family="Arial,sans-serif" font-size="21" fill="#172554" text-anchor="start" font-weight="bold">Actual Jones tunnel of tail factors</text>
<text x="32" y="547" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">Nₐ = spins after site a, with balanced words</text>
<rect x="40" y="559" width="128" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="104.0" y="587" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">N₃</text>
<rect x="358" y="559" width="156" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="436.0" y="587" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">N₂</text>
<line x1="183" y1="581" x2="346" y2="581" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="570" font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="middle" font-weight="normal">⊂</text>
<text x="270" y="609" font-family="Arial,sans-serif" font-size="17" fill="#172554" text-anchor="middle" font-weight="normal">f₃ in N₂</text>
<rect x="40" y="612" width="128" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="104.0" y="640" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">N₂</text>
<rect x="358" y="612" width="156" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="436.0" y="640" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">N₁ = N</text>
<line x1="183" y1="634" x2="346" y2="634" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="623" font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="middle" font-weight="normal">⊂</text>
<text x="270" y="662" font-family="Arial,sans-serif" font-size="17" fill="#172554" text-anchor="middle" font-weight="normal">f₂ in N₁</text>
<rect x="40" y="665" width="128" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="104.0" y="693" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">N₁ = N</text>
<rect x="358" y="665" width="156" height="42" rx="7" fill="#e0e7ff" stroke="#818cf8"/>
<text x="436.0" y="693" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="middle" font-weight="normal">N₀ = M</text>
<line x1="183" y1="687" x2="346" y2="687" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="676" font-family="Arial,sans-serif" font-size="22" fill="#172554" text-anchor="middle" font-weight="normal">⊂</text>
<text x="270" y="715" font-family="Arial,sans-serif" font-size="17" fill="#172554" text-anchor="middle" font-weight="normal">f₁ in M</text>
<text x="32" y="755" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start" font-weight="normal">Nₐ₊₁ ⊂ Nₐ ⊂ Nₐ₋₁ = ⟨Nₐ, fₐ⟩</text>
<text x="32" y="783" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">fₐ uses sites a,a+1; every index is 16/3.</text>
<rect x="16" y="830" width="528" height="235" rx="14" fill="white" stroke="#cbd5e1"/>
<text x="32" y="864" font-family="Arial,sans-serif" font-size="21" fill="#172554" text-anchor="start" font-weight="bold">The cup and generating density</text>
<text x="32" y="897" font-family="Arial,sans-serif" font-size="19" fill="#172554" text-anchor="start" font-weight="normal">v = (√3/2)|01⟩ + (1/2)|10⟩,  f = |v⟩⟨v|</text>
<text x="32" y="930" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start" font-weight="normal">f block = [ 3/4  √3/4 ; √3/4  1/4 ]</text>
<text x="32" y="962" font-family="Arial,sans-serif" font-size="19" fill="#172554" text-anchor="start" font-weight="normal">E_N(f) = (3/16)1,  t(f) = 3/16   (47.12)</text>
<text x="32" y="998" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start" font-weight="normal">Nₐ′ ∩ M = Cₐ; closure of ⋃ Cₐ is M.</text>
<text x="32" y="1035" font-family="Arial,sans-serif" font-size="19" fill="#172554" text-anchor="start" font-weight="normal">Inside N: the shifted union generates N.</text>
<rect x="16" y="1085" width="528" height="320" rx="14" fill="white" stroke="#cbd5e1"/>
<text x="32" y="1120" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start" font-weight="bold">The specified reflection cannot extend normally</text>
<text x="32" y="1154" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">P₀ = first-spin zero projection; Θ(P₀) = JP₀J</text>
<text x="32" y="1195" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start" font-weight="normal">t(P₀) = 1/4</text>
<rect x="32" y="1205" width="480" height="24" fill="#e2e8f0" rx="3"/>
<rect x="32" y="1205" width="120" height="24" fill="#2563eb" rx="3"/>
<text x="32" y="1260" font-family="Arial,sans-serif" font-size="20" fill="#172554" text-anchor="start" font-weight="normal">τ_M₁(Θ(P₀)) = 3/4</text>
<rect x="32" y="1270" width="480" height="24" fill="#e2e8f0" rx="3"/>
<rect x="32" y="1270" width="360" height="24" fill="#b45309" rx="3"/>
<text x="32" y="1330" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">A normal extension pulls the tower trace back</text>
<text x="32" y="1357" font-family="Arial,sans-serif" font-size="18" fill="#172554" text-anchor="start" font-weight="normal">to the unique trace on the factor M.</text>
<text x="32" y="1384" font-family="Arial,sans-serif" font-size="19" fill="#172554" text-anchor="start" font-weight="bold">1/4 ≠ 3/4: contradiction.  Theorem 47.5.</text>
</svg>
