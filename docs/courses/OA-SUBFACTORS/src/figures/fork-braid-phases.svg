<svg xmlns="http://www.w3.org/2000/svg" width="540" height="800" viewBox="0 0 540 800" role="img" aria-labelledby="title desc">
<title id="title">Real and imaginary terminal phases</title>
<desc id="desc">At every even endpoint x from zero to two r, the phase b_x=(-1)^(x/2) i^r is real plus or minus one for even r and imaginary plus or minus i for odd r. In the two cup-free root channels, P has diagonal entries one half and off-diagonal minus one half. Q has off-diagonal minus b_x/2 and minus its conjugate/2. Their commutator is i Im(b_x)/2 times diagonal minus one,plus one. Even r gives zero commutator and realizes D_(r+2). Odd r gives norm one half. Exact examples r=4 and r=3 are shown on the complex unit circle. Theorem35.4 and Corollary35.5 prove the family result.</desc>
<rect width="540" height="800" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}</style>
<text x="24" y="32" class="title" text-anchor="start">A phase decides the fork</text>
<rect x="24" y="53" width="492" height="119" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="82" class="heading" text-anchor="middle">Cup-free endpoint channel: x = 0, 2, …, 2r</text>
<text x="270" y="113" class="label" text-anchor="middle">Basis: ξL ψₓ, ξR ψₓ; crossing S is diagonal.</text>
<text x="270" y="138" class="label" text-anchor="middle">bₓ = conj(λₓ) λ₂ᵣ₋ₓ = (−1)^(x/2) iʳ</text>
<text x="140" y="210" class="heading" text-anchor="middle">Even r: real phases</text>
<circle cx="140" cy="312" r="69" fill="none" stroke="#adbacb"/>
<path d="M48 312 H232 M140 225 V399" stroke="#7c9bbd" fill="none"/>
<text x="231" y="337" class="small" text-anchor="middle">Re</text>
<text x="158" y="235" class="small" text-anchor="middle">Im</text>
<text x="400" y="210" class="heading" text-anchor="middle">Odd r: imaginary phases</text>
<circle cx="400" cy="312" r="69" fill="none" stroke="#adbacb"/>
<path d="M308 312 H492 M400 225 V399" stroke="#7c9bbd" fill="none"/>
<text x="491" y="337" class="small" text-anchor="middle">Re</text>
<text x="418" y="235" class="small" text-anchor="middle">Im</text>
<circle cx="71" cy="312" r="6" fill="#276a89"/>
<text x="71" y="293" class="small" text-anchor="middle">−1</text>
<circle cx="209" cy="312" r="6" fill="#276a89"/>
<text x="209" y="293" class="small" text-anchor="middle">+1</text>
<circle cx="400" cy="243" r="6" fill="#276a89"/>
<text x="427" y="258" class="small" text-anchor="middle">+i</text>
<circle cx="400" cy="381" r="6" fill="#276a89"/>
<text x="427" y="385" class="small" text-anchor="middle">−i</text>
<text x="270" y="425" class="small" text-anchor="middle">r = 4: b₀,b₂,b₄,… = +1,−1,+1,…</text>
<text x="270" y="452" class="small" text-anchor="middle">r = 3: b₀,b₂,b₄,… = −i,+i,−i,…</text>
<rect x="24" y="478" width="492" height="119" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="507" class="heading" text-anchor="middle">Two rank-one projections</text>
<text x="270" y="538" class="label" text-anchor="middle">P = ½ [ 1  −1 ; −1  1 ]</text>
<text x="270" y="563" class="label" text-anchor="middle">Qₓ = ½ [ 1  −bₓ ; −conjugate(bₓ)  1 ]</text>
<rect x="24" y="615" width="492" height="119" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="644" class="heading" text-anchor="middle">The exact commutator</text>
<text x="270" y="675" class="label" text-anchor="middle">[P,Qₓ] = ½ i Im(bₓ) diag(−1,+1)</text>
<text x="270" y="700" class="label" text-anchor="middle">Even r: 0.   Odd r: norm ½.</text>
<text x="270" y="755" class="heading" text-anchor="middle">Even r ⇒ actual principal graph Dᵣ₊₂, index δ².</text>
<text x="270" y="778" class="small" text-anchor="middle">Theorem 35.4 and Corollary 35.5.</text>
</svg>
