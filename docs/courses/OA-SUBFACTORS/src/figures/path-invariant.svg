<svg xmlns="http://www.w3.org/2000/svg" width="540" height="490" viewBox="0 0 540 490" role="img" aria-labelledby="title desc">
<title id="title">The two rows for a path principal graph</title>
<desc id="desc">For endpoint-rooted A_l, at level k at least one, A_k is generated by e0 through e_(k-1) and equals path algebra P_(k+1). B_k is the subalgebra generated by e1 through e_(k-1) and equals P_k. The expectation from the upper to the lower row fixes the latter generators and takes e0 to lambda times the identity. Generator descriptions specify the inclusions.</desc>
<rect width="540" height="490" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:21px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}.box{fill:#edf3fb;stroke:#7c9bbd;stroke-width:1.5}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426987"/></marker></defs>
<text x="24" y="34" class="title" text-anchor="start">A path graph fills both rows</text>
<text x="24" y="65" class="label" text-anchor="start">Endpoint root;   k ≥ 1;   λ = δ⁻²</text>
<rect x="24" y="92" width="492" height="109" rx="8" class="box"/>
<text x="270" y="123" class="heading" text-anchor="middle">Aₖ = Pₖ₊₁</text>
<text x="270" y="158" class="label" text-anchor="middle">Generated by e₀, e₁, …, eₖ₋₁</text>
<text x="270" y="185" class="small" text-anchor="middle">Equal dimensions force equality (23.4–5).</text>
<line x1="270" y1="209" x2="270" y2="277" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="246" class="label" text-anchor="start">F</text>
<text x="251" y="229" class="small" text-anchor="end">F(e₀) = λ1</text>
<text x="251" y="257" class="small" text-anchor="end">F(eᵢ) = eᵢ, i ≥ 1</text>
<rect x="24" y="286" width="492" height="109" rx="8" class="box"/>
<text x="270" y="317" class="heading" text-anchor="middle">Bₖ = Pₖ</text>
<text x="270" y="351" class="label" text-anchor="middle">Generated by e₁, …, eₖ₋₁</text>
<text x="270" y="379" class="small" text-anchor="middle">The image of F, by reversed word reduction.</text>
<text x="24" y="433" class="small" text-anchor="start">The lower row is a subalgebra of the upper row.</text>
<text x="24" y="465" class="small" text-anchor="start">Theorems 23.2–23.4 preserve generators and traces.</text>
</svg>
