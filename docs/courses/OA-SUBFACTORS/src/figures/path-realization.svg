<svg xmlns="http://www.w3.org/2000/svg" width="540" height="650" viewBox="0 0 540 650" role="img" aria-labelledby="title desc">
<title id="title">From a generating tail to the full path graph</title>
<desc id="desc">For the discrete A_(r-1) model with r at least four, original generators q_i have sufficiently late commuting tails. Their tunnel is generating. Finite-depth trace-preserving reflection maps q_i to upward Jones projections e_i for i at least one and identifies the entire relative-commutant limit with their closure. Finite tower expectations take the Jones algebra C_m into C_k, so L2 contraction forces B_k equal C_k equal P_k. Self-duality then gives the principal as well as dual graph A_(r-1).</desc>
<rect width="540" height="650" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}.box{fill:#edf3fb;stroke:#7c9bbd;stroke-width:1.5}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426987"/></marker></defs>
<text x="24" y="34" class="title" text-anchor="start">Realize the full path invariant</text>
<text x="24" y="63" class="label" text-anchor="start">δ = 2 cos(π/r),   r ≥ 4;   index δ² &lt; 4</text>
<rect x="24" y="86" width="492" height="105" rx="8" class="box"/>
<text x="270" y="115" class="heading" text-anchor="middle">The tail tunnel generates M</text>
<text x="270" y="144" class="label" text-anchor="middle">qᵢ commutes with M₋ₐ for a ≥ i + 1.</text>
<text x="270" y="172" class="small" text-anchor="middle">Proposition 25.2; each qᵢ lies in a finite commutant.</text>
<line x1="270" y1="198" x2="270" y2="227" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="237" width="492" height="105" rx="8" class="box"/>
<text x="270" y="266" class="heading" text-anchor="middle">Reflection preserves the tower trace</text>
<text x="270" y="295" class="label" text-anchor="middle">qᵢ ↦ eᵢ,  i ≥ 1;   B∞ = {e₁, e₂, …}″</text>
<text x="270" y="323" class="small" text-anchor="middle">Finite depth and (25.7–8); e₀ is a separate projection.</text>
<line x1="270" y1="349" x2="270" y2="378" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="388" width="492" height="105" rx="8" class="box"/>
<text x="270" y="417" class="heading" text-anchor="middle">Finite expectations force equality</text>
<text x="270" y="446" class="label" text-anchor="middle">E_Bₖ(Cₘ) ⊂ Cₖ;   Bₖ = Cₖ = Pₖ</text>
<text x="270" y="474" class="small" text-anchor="middle">Lemma 25.1: density plus L² contraction (25.4).</text>
<line x1="270" y1="500" x2="270" y2="529" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="556" class="label" text-anchor="middle">Both rooted graphs are Aᵣ₋₁, by self-duality.</text>
<text x="270" y="588" class="label" text-anchor="middle">Both invariant rows: Aₖ = Pₖ₊₁,  Bₖ = Pₖ.</text>
<text x="24" y="627" class="small" text-anchor="start">Theorem 25.3 and Corollary 25.4: existence and uniqueness.</text>
</svg>
