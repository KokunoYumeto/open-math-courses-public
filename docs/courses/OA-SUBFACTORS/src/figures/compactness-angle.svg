<svg xmlns="http://www.w3.org/2000/svg" width="540" height="730" viewBox="0 0 540 730" role="img" aria-labelledby="title desc">
<title id="title">A finite angle survives every two-level shift</title>
<desc id="desc">The shift Psi_r sends H0 and H1 to H_2r and H_(2r+1), and fixes their intersection L. Central transfer h_r is uniformly between eta and eta inverse. Squared norm bounds transport the finite angle constant K to K over eta. Martingale adjacency tends to zero, proving the relative commutant is L. The lower planar illustration has theta pi over six, K two; it is an angle schematic, not a commuting square.</desc>
<rect width="540" height="730" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.label{font-size:17px}.small{font-size:16px}</style>
<text x="24" y="33" class="title" text-anchor="start">A finite angle determines the commutant</text>
<rect x="24" y="55" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="83" class="heading" text-anchor="middle">A two-level shift preserves algebra structure</text>
<text x="270" y="113" class="label" text-anchor="middle">Ψᵣ(H₀) = H₂ᵣ;  Ψᵣ(H₁) = H₂ᵣ₊₁;  Ψᵣ(L) = L</text>
<text x="270" y="139" class="small" text-anchor="middle">Hₖ = L²(Pₖ′ ∩ Qₖ);  L = P₁′ ∩ Q₀.</text>
<rect x="24" y="189" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="217" class="heading" text-anchor="middle">The trace can change, with uniform bounds</text>
<text x="270" y="247" class="label" text-anchor="middle">τ(Ψᵣ(x)) = τ(xhᵣ);  η1 ≤ hᵣ ≤ η⁻¹1</text>
<text x="270" y="273" class="small" text-anchor="middle">η‖x‖₂² ≤ ‖Ψᵣ(x)‖₂² ≤ η⁻¹‖x‖₂².</text>
<rect x="24" y="323" width="492" height="116" rx="8" fill="#edf3fb" stroke="#7c9bbd"/>
<text x="270" y="351" class="heading" text-anchor="middle">One finite angle controls every level</text>
<text x="270" y="381" class="label" text-anchor="middle">dist(x₂ᵣ, L) ≤ (K/η) ‖x₂ᵣ − x₂ᵣ₊₁‖₂ → 0</text>
<text x="270" y="407" class="small" text-anchor="middle">xₖ = E_Qₖ(x), for x ∈ N′ ∩ M.</text>
<text x="270" y="474" class="heading" text-anchor="middle">Therefore N′ ∩ M = P₁′ ∩ Q₀.</text>
<rect x="24" y="501" width="492" height="208" rx="8" fill="#fff8e9" stroke="#b6a070"/>
<text x="42" y="528" class="small" text-anchor="start">Planar angle illustration: θ = π/6, K = 2</text>
<path d="M65 655 H325" stroke="#426987" stroke-width="2.5"/>
<path d="M95 655 L320 525.0961894323342" stroke="#488a70" stroke-width="2.5"/>
<path d="M295 655 L245 568.3974596215561" stroke="#a66442" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="295" cy="655" r="4" fill="#426987"/>
<text x="306" y="678" class="small" text-anchor="start">y ∈ H₀</text>
<text x="329" y="649" class="small" text-anchor="start">H₀</text>
<text x="322" y="560" class="small" text-anchor="start">H₁</text>
<text x="82" y="680" class="small" text-anchor="start">L = {0}</text>
<text x="156" y="645" class="small" text-anchor="start">θ</text>
<text x="361" y="601" class="small" text-anchor="start">dist(y,H₁)</text>
<text x="361" y="627" class="small" text-anchor="start">= ‖y‖/2</text>
<text x="42" y="698" class="small" text-anchor="start">For η = 1/2, the transported constant K/η is 4.</text>
<text x="24" y="727" class="small" text-anchor="start">Lemmas 31.1–31.3 and Theorem 31.4.</text>
</svg>
