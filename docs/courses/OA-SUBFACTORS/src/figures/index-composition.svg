<svg xmlns="http://www.w3.org/2000/svg" width="540" height="420" viewBox="0 0 540 420" role="img" aria-labelledby="title desc">
<title id="title">Composing expectations reverses dual order</title>
<desc id="desc">On P contained in N contained in M, the expectations run from M to N by E and then N to P by F. On the reversed commutant inclusion M-prime contained in N-prime contained in P-prime, F-prime goes from P-prime to N-prime and E-prime from N-prime to M-prime. The composite dual is E-prime composed with F-prime and has identity scalar cb.</desc>
<rect width="540" height="420" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#172c45}.title{font-size:20px;font-weight:bold}.algebra{font-size:23px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426987"/></marker></defs>
<text x="24" y="34" class="title" text-anchor="start">Expectations compose; duals reverse</text>
<text x="24" y="64" class="small" text-anchor="start">Assume Idx(E) = c &lt; ∞ and Idx(F) = b &lt; ∞.</text>
<text x="70" y="112" class="algebra" text-anchor="middle">P</text>
<text x="270" y="112" class="algebra" text-anchor="middle">N</text>
<text x="470" y="112" class="algebra" text-anchor="middle">M</text>
<line x1="237" y1="105" x2="104" y2="105" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="95" class="label" text-anchor="middle">F</text>
<line x1="437" y1="105" x2="304" y2="105" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="370" y="95" class="label" text-anchor="middle">E</text>
<text x="270" y="154" class="label" text-anchor="middle">G = F ∘ E</text>
<text x="270" y="184" class="small" text-anchor="middle">Underlying inclusion: P ⊂ N ⊂ M</text>
<line x1="24" y1="208" x2="516" y2="208" stroke="#a4b4c8"/>
<text x="70" y="256" class="algebra" text-anchor="middle">P′</text>
<text x="270" y="256" class="algebra" text-anchor="middle">N′</text>
<text x="470" y="256" class="algebra" text-anchor="middle">M′</text>
<line x1="104" y1="249" x2="237" y2="249" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="238" class="label" text-anchor="middle">F′</text>
<line x1="304" y1="249" x2="437" y2="249" stroke="#426987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="370" y="238" class="label" text-anchor="middle">E′</text>
<text x="270" y="297" class="label" text-anchor="middle">G′ = E′ ∘ F′;   G′(1) = cb1</text>
<text x="270" y="329" class="small" text-anchor="middle">Reversed inclusion: M′ ⊂ N′ ⊂ P′</text>
<text x="24" y="372" class="small" text-anchor="start">Theorem 24.1: all-reference spatial identity (24.4).</text>
<text x="24" y="402" class="small" text-anchor="start">Idx(G) = cb in every faithful normal representation.</text>
</svg>
