<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1190" viewBox="0 0 1120 1190">
<title>Global finite approximation, exact ordinary prefixes and ergodic actual cores</title>
<rect width="1120" height="1190" fill="#fafbfc"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315b76"/></marker></defs>
<text x="30" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="bold" fill="#172d3d">Global approximation, exact prefixes and ergodic cores</text>
<text x="30" y="80" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172d3d">N ⊂ M proper finite index d; original physical trace τ; no ambient separability.</text>
<rect x="30" y="112" width="1040" height="120" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="144" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Original global finite-set condition (G) — equation (61.56)</text>
<text x="46" y="177" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">For every finite Y ⊂ M and ε &gt; 0, some actual ordinary finite tunnel has</text>
<text x="46" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">maxᵧ ‖y − E_(Nₘ′∩M)(y)‖₂,τ &lt; ε.  The tunnel may depend on Y and ε.</text>
<path d="M550 243 L550 272" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="286" width="1040" height="199" rx="10" fill="#eef6eb" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="318" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Two different unitary corrections — Lemma 61.17</text>
<text x="46" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Inside C = Nₘ′ ∩ Qᵢ:  match finite cup central traces, keeping every block weight.</text>
<text x="46" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Pull down to v ∈ C ∩ Nᵢ:  v fixes Nₘ and preserves C and A = Nₘ′ ∩ M.</text>
<text x="46" y="407" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Then u ∈ Nᵢ is small and makes the current ordinary cup exact.</text>
<text x="46" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">‖u − 1‖₂ ≤ B_d(Δᵢ,t);   Δ₀ = t;   Δᵢ₊₁ = Δᵢ + 2B_d(Δᵢ,t).</text>
<text x="46" y="463" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Every fixed finite prefix is exact; its target error tends to zero as t → 0.</text>
<text x="46" y="513" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Q₀ = M; Qᵢ = Nᵢ₋₁ for i ≥ 1.  Physical targets stay fixed throughout.</text>
<path d="M300 528 L300 557" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M820 528 L820 557" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="571" width="500" height="234" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="603" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Countable actual-core construction</text>
<text x="46" y="636" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Aⱼ = Nₘⱼ′ ∩ M; retain all old matrix units.</text>
<text x="46" y="664" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Approximate finite M-unitary averages</text>
<text x="46" y="692" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">inside the next Aⱼ₊₁, after the old prefix.</text>
<text x="46" y="720" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">‖E_Z(R)(x) − τ(x)1‖₂ ≤ 5 · 2⁻ʲ.</text>
<text x="46" y="748" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">R = (⋃ Aⱼ)″ has scalar center.</text>
<text x="46" y="776" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">It is an actual II₁ core: Theorem 61.19.</text>
<rect x="570" y="571" width="500" height="234" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="586" y="603" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Directed all-smooth state construction</text>
<text x="586" y="636" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">For every finite F ⊂ M and η &gt; 0:</text>
<text x="586" y="664" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">φ_F,η|M = τ;     φ_F,η E = φ_F,η.</text>
<text x="586" y="692" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">|φ_F,η(mx − xm)| ≤ 2η ‖x‖ for m ∈ F.</text>
<text x="586" y="720" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Use all finite F, with η decreasing.</text>
<text x="586" y="748" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">A cofinal state cluster may be singular.</text>
<text x="586" y="776" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">The original full M is retained: 61.20.</text>
<path d="M300 817 L300 846" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M820 817 L820 846" stroke="#315b76" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="860" width="1040" height="158" rx="10" fill="#f6f1e7" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="892" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" fill="#172d3d">Full original equivalence — Theorem 61.20</text>
<text x="46" y="925" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Original strong amenability  ⇔  relative amenability to one ergodic actual core</text>
<text x="46" y="953" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">⇔  global finite approximation (G)  ⇔  (G) after every prescribed ordinary prefix.</text>
<text x="46" y="981" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">Popa Theorem 4.1.2(i)–(iii), without separability; forward proofs SA.6 / 60.4 retained.</text>
<text x="30" y="1060" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">The countable core can be proper in nonseparable M; its construction does not generate all M.</text>
<text x="30" y="1100" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172d3d">Only finite cup-generated algebras are matched, with their exact inherited trace weights.</text>
<text x="30" y="1140" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172d3d">The separate physical infinite bicommutant remains unproved here. Positions are schematic.</text>
</svg>
