<style>text{font-family:Arial,sans-serif;fill:#182738}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.text{font-size:18px}.small{font-size:16px}.blue{fill:#d9e9fa;stroke:#376fa3}.gray{fill:#edf0f4;stroke:#7c8795}.green{fill:#d9eee3;stroke:#3e8260}.red{fill:#f7d8da;stroke:#a83f47}.panel{fill:#fff;stroke:#aab8c9}</style>
<text x="28" y="38" class="title">Finite centers → common support → one exact integer</text>
<text x="28" y="69" class="small">Actual core S ⊂ R, N ⊂ M; canonical lift ẑ commutes with every ambient unitary.</text>
<rect x="24" y="92" width="952" height="347" rx="8" class="panel"/>
<text x="44" y="126" class="head">A. Fixed finite-center constants and a uniform profile — 84.2–84.8</text>
<rect x="52" y="160" width="276" height="88" rx="8" class="blue"/>
<text x="67" y="190" class="text">U = Z(S), a = min τ(uᵢ)</text>
<text x="67" y="224" class="text">f = Cₐ(p) / Tr(p) ≤ 1/a</text>
<rect x="362" y="160" width="264" height="88" rx="8" class="blue"/>
<text x="377" y="190" class="text">T = Q(κ P·), κ ≥ 0</text>
<text x="377" y="224" class="text">Qκ = Pκ = 1</text>
<rect x="660" y="160" width="262" height="88" rx="8" class="green"/>
<text x="675" y="190" class="text">‖f − Tf‖₁ ≤ Γp</text>
<text x="675" y="224" class="text">‖f − Pf‖₂² ≤ 2Γp/a</text>
<text x="44" y="292" class="text">Unweighted R₀ = QP = P*P; fixed space W = U ∩ V; gap γ on W⊥.</text>
<text x="44" y="338" class="text">f₀ = Eᴡ(f); ‖f − f₀‖∞ ≤ √(2Γp / (γ a²)).</text>
<text x="44" y="384" class="text">Choose Γp and all ambient unitary tolerances before selecting the projection p.</text>
<text x="44" y="417" class="small">Finite joint algebra: dim(U ∨ V) ≤ dim(U) floor(d).</text>
<rect x="24" y="462" width="952" height="486" rx="8" class="panel"/>
<text x="44" y="496" class="head">B. Exact finite probability diagnostic: two common components — Exercise84.3</text>
<text x="44" y="526" class="small">Eight joint atoms, each weight 1/8. Row atoms: 1/4; component atoms: 1/2.</text>
<rect x="54" y="553" width="430" height="244" rx="8" class="green"/>
<line x1="144" y1="609" x2="393" y2="609" stroke="#3e8260" stroke-width="2"/>
<line x1="144" y1="609" x2="393" y2="735" stroke="#3e8260" stroke-width="2"/>
<line x1="144" y1="735" x2="393" y2="609" stroke="#3e8260" stroke-width="2"/>
<line x1="144" y1="735" x2="393" y2="735" stroke="#3e8260" stroke-width="2"/>
<circle cx="144" cy="609" r="8" fill="#376fa3"/>
<text x="68" y="589" class="small">s1: 2+1/100</text>
<circle cx="144" cy="735" r="8" fill="#376fa3"/>
<text x="68" y="715" class="small">s2: 2−1/100</text>
<circle cx="393" cy="609" r="8" fill="#3e8260"/>
<text x="408" y="615" class="small">r1</text>
<circle cx="393" cy="735" r="8" fill="#3e8260"/>
<text x="408" y="741" class="small">r2</text>
<text x="211" y="672" class="small">four edges</text>
<text x="208" y="698" class="small">weight 1/8</text>
<text x="124" y="778" class="text">selected z, α = 2</text>
<rect x="519" y="553" width="430" height="244" rx="8" class="gray"/>
<line x1="609" y1="609" x2="858" y2="609" stroke="#7c8795" stroke-width="2"/>
<line x1="609" y1="609" x2="858" y2="735" stroke="#7c8795" stroke-width="2"/>
<line x1="609" y1="735" x2="858" y2="609" stroke="#7c8795" stroke-width="2"/>
<line x1="609" y1="735" x2="858" y2="735" stroke="#7c8795" stroke-width="2"/>
<circle cx="609" cy="609" r="8" fill="#376fa3"/>
<text x="533" y="589" class="small">s3: 0</text>
<circle cx="609" cy="735" r="8" fill="#376fa3"/>
<text x="533" y="715" class="small">s4: 0</text>
<circle cx="858" cy="609" r="8" fill="#3e8260"/>
<text x="873" y="615" class="small">r3</text>
<circle cx="858" cy="735" r="8" fill="#3e8260"/>
<text x="873" y="741" class="small">r4</text>
<text x="676" y="672" class="small">four edges</text>
<text x="673" y="698" class="small">weight 1/8</text>
<text x="589" y="778" class="text">other W-atom, value 0</text>
<text x="44" y="839" class="text">f = (2+1/100, 2−1/100, 0, 0); Eᴡ(f) = (2, 2, 0, 0); τ(f) = 1.</text>
<text x="44" y="882" class="text">Here a = 1/4, γ = 1 and ‖f − Eᴡ(f)‖∞ = 1/100.</text>
<text x="44" y="924" class="small">This diagnostic illustrates the common block; no actual Jones-core realization is claimed.</text>
<rect x="24" y="972" width="952" height="307" rx="8" class="panel"/>
<text x="44" y="1006" class="head">C. Actual amplification and exact prescription — 84.10–84.15</text>
<text x="44" y="1036" class="text">q = p ẑ; δᵤ(q) ≤ δᵤ(p)/√a. Delete Mₙ; old dimensions scale by n².</text>
<text x="44" y="1080" class="text">Illustrated numbers: c = 3/5, n = 10, λ = 60, α = 2, η = 1/100.</text>
<text x="44" y="1124" class="text">k = floor(λ(α−η)) = 119. Tr̃(q) = 60; Tr̃(p′) = 119/2; loss = 1/2.</text>
<rect x="95" y="1146" width="714" height="38" rx="0" class="green"/>
<rect x="809" y="1146" width="6" height="38" rx="0" class="red"/>
<text x="104" y="1172" class="text">rounded p′: 119/2</text>
<line x1="812" y1="1184" x2="855" y2="1205" stroke="#a83f47" stroke-width="2"/>
<text x="846" y="1227" class="small">loss 1/2</text>
<text x="44" y="1263" class="text">ℓ = 1/120; δᵤ(p′) ≤ (δᵤ(p)/√a + 2√ℓ) / √(1−ℓ).</text>
<text x="28" y="1320" class="small">Only the final bar widths encode scalar traces; graph positions and other rectangles are schematic.</text>
<text x="28" y="1363" class="small">Proof locators: Lemmas84.1–84.3 and Theorem84.4; full argument retained beside this figure.</text>
<text x="28" y="1406" class="small">Human source: Popa 1994, Theorem4.2.2, printed213–214. Finite-center hypothesis is explicit.</text>
