<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1210" viewBox="0 0 900 1210">
<rect width="900" height="1210" fill="#f5f8fc"/>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#316b99"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173b54}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.math{font-family:Georgia,serif;font-size:23px}.small{font-size:17px}</style>
<text x="32" y="43" class="title" text-anchor="start">A fixed finite branch system for the joint center</text>
<text x="32" y="77" class="body" text-anchor="start">Exact weighted model; the final averaging hypothesis remains open.</text>
<rect x="24" y="100" width="852" height="400" rx="14" fill="white" stroke="#a9c1d3"/>
<text x="44" y="137" class="head" text-anchor="start">1. Five atoms over two base points [72.3, 72.16]</text>
<text x="70" y="181" class="small" text-anchor="start">Base mass: 1/2</text>
<text x="400" y="181" class="body" text-anchor="middle">branch q1</text>
<text x="570" y="181" class="body" text-anchor="middle">branch q2</text>
<text x="740" y="181" class="body" text-anchor="middle">branch q3</text>
<text x="70" y="245" class="body" text-anchor="start">base 0</text>
<text x="70" y="275" class="small" text-anchor="start">conditional weights →</text>
<circle cx="400" cy="245" r="34" fill="#e0eff9" stroke="#316b99" stroke-width="2"/>
<text x="400" y="252" class="math" text-anchor="middle">2/3</text>
<text x="400" y="302" class="small" text-anchor="middle">atom mass 1/3</text>
<circle cx="570" cy="245" r="34" fill="#e0f3eb" stroke="#267b63" stroke-width="2"/>
<text x="570" y="252" class="math" text-anchor="middle">1/3</text>
<text x="570" y="302" class="small" text-anchor="middle">atom mass 1/6</text>
<circle cx="740" cy="245" r="34" fill="none" stroke="#8b9cab" stroke-dasharray="5 5"/>
<text x="740" y="251" class="small" text-anchor="middle">absent</text>
<text x="740" y="302" class="small" text-anchor="middle">support = 0</text>
<text x="70" y="390" class="body" text-anchor="start">base 1</text>
<text x="70" y="420" class="small" text-anchor="start">conditional weights →</text>
<circle cx="400" cy="390" r="34" fill="#e0eff9" stroke="#316b99" stroke-width="2"/>
<text x="400" y="397" class="math" text-anchor="middle">1/3</text>
<text x="400" y="447" class="small" text-anchor="middle">atom mass 1/6</text>
<circle cx="570" cy="390" r="34" fill="#e0f3eb" stroke="#267b63" stroke-width="2"/>
<text x="570" y="397" class="math" text-anchor="middle">1/3</text>
<text x="570" y="447" class="small" text-anchor="middle">atom mass 1/6</text>
<circle cx="740" cy="390" r="34" fill="#fcf0df" stroke="#9b6429" stroke-width="2"/>
<text x="740" y="397" class="math" text-anchor="middle">1/3</text>
<text x="740" y="447" class="small" text-anchor="middle">atom mass 1/6</text>
<text x="44" y="482" class="small" text-anchor="start">s₁ = s₂ = (1,1), s₃ = (0,1);  x ≤ 3 E(x).  Positions are schematic.</text>
<rect x="24" y="530" width="852" height="280" rx="14" fill="white" stroke="#a9c1d3"/>
<text x="44" y="568" class="head" text-anchor="start">2. The full norm is the sum of central norms [72.5, 72.17]</text>
<text x="54" y="615" class="math" text-anchor="start">Branch errors: (2/3, −1/3), (−1/3, 1/3), (0, −1)</text>
<text x="54" y="665" class="body" text-anchor="start">Each central coordinate has base mass 1/2.</text>
<text x="54" y="715" class="math" text-anchor="start">‖γ − 3ζ‖₁ = 1/2 + 1/3 + 1/2 = 4/3</text>
<text x="54" y="766" class="small" text-anchor="start">The norm uses inherited atom masses, never counting measure.</text>
<rect x="24" y="835" width="852" height="275" rx="14" fill="white" stroke="#a9c1d3"/>
<text x="44" y="873" class="head" text-anchor="start">3. A sufficient hypothesis for actual core operators [72.12–72.14]</text>
<text x="54" y="920" class="math" text-anchor="start">Fixed Hⱼ = E_A(xⱼ g xⱼ);  corner mean aⱼ</text>
<text x="54" y="969" class="math" text-anchor="start">N-unitary norm average → âⱼ</text>
<text x="515" y="969" class="small" text-anchor="start">UNPROVED for the actual Hⱼ</text>
<path d="M65 935 V952" fill="none" stroke="#947b58" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M65 986 V1004" fill="none" stroke="#316b99" stroke-width="2" marker-end="url(#arrow)"/>
<text x="54" y="1044" class="body" text-anchor="start">Then finite prior tests control the entire joint L¹ error.</text>
<text x="54" y="1087" class="small" text-anchor="start">Proved implication; finite branch count does not prove the hypothesis.</text>
<text x="32" y="1147" class="small" text-anchor="start">Problem credit: Popa, Theorem 4.2.2, pp. 213–214. Original proofs 72.1–72.5.</text>
<text x="32" y="1178" class="small" text-anchor="start">Finite model above is not asserted to be an actual Jones core.</text>
</svg>
