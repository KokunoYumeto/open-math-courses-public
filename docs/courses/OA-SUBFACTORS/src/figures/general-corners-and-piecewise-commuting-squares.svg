<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1370" viewBox="0 0 900 1370">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#294961"/></marker></defs>
<rect width="900" height="1370" fill="#f7fafc"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="29" fill="#17354b" font-weight="bold">General corners → finite commuting squares</text>
<text x="32" y="77" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Exact corner masses, orthogonal support errors and ambient norm-one projections</text>
<rect x="24" y="104" width="852" height="300" rx="5" fill="white" stroke="#c9d6df"/>
<rect x="24" y="426" width="852" height="442" rx="5" fill="white" stroke="#c9d6df"/>
<rect x="24" y="890" width="852" height="438" rx="5" fill="white" stroke="#c9d6df"/>
<text x="44" y="143" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">1. Two different normalizations; the corner index stays d</text>
<text x="44" y="180" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Illustrative trace t = 3/8;  q = Lₚρ(p);  e = e_R</text>
<rect x="44" y="202" width="389" height="125" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<rect x="457" y="202" width="399" height="125" rx="5" fill="#e7f2ee" stroke="#75a99a"/>
<text x="62" y="238" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="bold">Compatible state: φ₁(q) = t² = 9/64</text>
<text x="62" y="278" font-family="Arial,sans-serif" font-size="22" fill="#17354b" font-weight="normal">ψ = (64/9) φ₁ | qBq</text>
<text x="62" y="309" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">ψ(q) = 1</text>
<text x="475" y="238" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="bold">Jones projection: eₚ = (8/3) qeq</text>
<text x="475" y="278" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">eqe = (3/8)e;  Tr(eₚ) = 1</text>
<text x="475" y="309" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Corner index = dt/t = d</text>
<text x="44" y="365" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">R → pR preserves the normalized trace, including the center (75.6–75.13).</text>
<text x="44" y="390" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">The retained commuting factor supplies trace pairing; R need not be a factor.</text>
<text x="44" y="465" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">2. Account for all orthogonal errors before finite selection</text>
<text x="44" y="504" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">F_S = y − f_Syf_S − b;   G_s is supported entirely in f_S M f_S.</text>
<text x="44" y="543" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">F_S ⟂ G_s;  ‖G_s‖₂² = compression error² + commutator error².</text>
<text x="44" y="582" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">‖F_S‖₂² ≤ 2δ²τ(S).  Maximality gives S = 1 (75.18–75.19).</text>
<text x="44" y="626" font-family="Arial,sans-serif" font-size="21" fill="#17354b" font-weight="normal">Finite selection example: R* = 1, ε = 1/10, δ = 1/40.</text>
<rect x="50" y="653" width="400" height="40" rx="0" fill="#267aab" stroke="none"/>
<rect x="450" y="653" width="399" height="40" rx="0" fill="#389984" stroke="none"/>
<rect x="849" y="653" width="1" height="40" rx="0" fill="#bb4d43" stroke="none"/>
<text x="50" y="723" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Selected supports: 400/800 + 399/800</text>
<text x="520" y="723" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Residual f_I: 1/800 (one red pixel)</text>
<rect x="50" y="750" width="52" height="24" rx="0" fill="#bb4d43" stroke="none"/>
<text x="116" y="770" font-family="Arial,sans-serif" font-size="19" fill="#17354b" font-weight="normal">Residual inset enlarged; this inset is not to scale.</text>
<text x="44" y="811" font-family="Arial,sans-serif" font-size="22" fill="#17354b" font-weight="bold">‖y − b_I‖₂² ≤ 2/1600 + 1/800 = 1/400 &lt; ε² = 1/100.</text>
<text x="44" y="845" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">Exact removal: F − f_I F f_I = y − f_I y f_I − b_I (75.20).</text>
<text x="44" y="929" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">3. Actual domains and codomains of the norm-one projections</text>
<rect x="54" y="949" width="405" height="53" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<text x="72" y="984" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">B(L²M)</text>
<rect x="54" y="1031" width="405" height="53" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<text x="72" y="1066" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">B = ⟨M,e_R⟩ = ρ(R)′</text>
<rect x="54" y="1113" width="405" height="53" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<text x="72" y="1148" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">M</text>
<rect x="54" y="1195" width="405" height="53" rx="5" fill="#eaf2fa" stroke="#8baac7"/>
<text x="72" y="1230" font-family="Arial,sans-serif" font-size="23" fill="#17354b" font-weight="bold">N</text>
<path d="M240 1003L240 1028" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="478" y="1023" font-family="Arial,sans-serif" font-size="17" fill="#17354b" font-weight="normal">Π: cofinal finite-dimensional averaging</text>
<path d="M240 1085L240 1110" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="478" y="1105" font-family="Arial,sans-serif" font-size="17" fill="#17354b" font-weight="normal">Φ: trace-pairing density, τ(xΦ(T)) = φ(LₓT)</text>
<path d="M240 1167L240 1192" fill="none" stroke="#294961" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="478" y="1187" font-family="Arial,sans-serif" font-size="17" fill="#17354b" font-weight="normal">E_N: trace-preserving expectation</text>
<text x="478" y="1241" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="bold">Π_M = ΦΠ;  Π_N = E_NΦΠ</text>
<text x="44" y="1290" font-family="Arial,sans-serif" font-size="20" fill="#17354b" font-weight="normal">All maps ucp; neither composite is asserted normal (75.25–75.28).</text>
<path d="M32 1339H868" stroke="#8c5035" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="32" y="1360" font-family="Arial,sans-serif" font-size="16" fill="#8c5035" font-weight="normal">Whole-stage alignment / generating tunnel: still open. Popa, 3.2.4(ii), 4.4.1; trace/support schematic.</text>
</svg>
