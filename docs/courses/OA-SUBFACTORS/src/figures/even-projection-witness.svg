<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="Five tensor positions, even projections and a noncommuting commutant witness">
<rect width="1000" height="490" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#142b3e} .title{font-size:26px;font-weight:700}.label{font-size:22px}.small{font-size:19px}.math{font-size:25px} .blue{stroke:#236aa1;stroke-width:4}.orange{stroke:#bd5c19;stroke-width:5}</style>
<text x="45" y="44" class="title">Five tensor factors and a commutant witness</text>
<text x="45" y="76" class="small">Each position carries V = C²; eᵢ projects positions i and i+1 onto (|01⟩ − |10⟩)/√2.</text>
<circle cx="100" cy="230" r="25" fill="#eef3f7" stroke="#45657e" stroke-width="2"/>
<text x="100" y="237" text-anchor="middle" class="label">1</text>
<circle cx="290" cy="230" r="25" fill="#eef3f7" stroke="#45657e" stroke-width="2"/>
<text x="290" y="237" text-anchor="middle" class="label">2</text>
<circle cx="480" cy="230" r="25" fill="#eef3f7" stroke="#45657e" stroke-width="2"/>
<text x="480" y="237" text-anchor="middle" class="label">3</text>
<circle cx="670" cy="230" r="25" fill="#eef3f7" stroke="#45657e" stroke-width="2"/>
<text x="670" y="237" text-anchor="middle" class="label">4</text>
<circle cx="860" cy="230" r="25" fill="#eef3f7" stroke="#45657e" stroke-width="2"/>
<text x="860" y="237" text-anchor="middle" class="label">5</text>
<path d="M 100 202 V 140 H 290 V 202" fill="none" class="blue"/>
<text x="195.0" y="127" text-anchor="middle" class="label">e1</text>
<path d="M 290 202 V 188 H 480 V 202" fill="none" class="orange"/>
<text x="385.0" y="175" text-anchor="middle" class="label">e2</text>
<path d="M 480 202 V 140 H 670 V 202" fill="none" class="blue"/>
<text x="575.0" y="127" text-anchor="middle" class="label">e3</text>
<path d="M 670 202 V 188 H 860 V 202" fill="none" class="orange"/>
<text x="765.0" y="175" text-anchor="middle" class="label">e4</text>
<text x="45" y="295" class="math">q = (1 − e₂)(1 − e₄),    X = qe₁q,    Y = qe₃q</text>
<text x="45" y="331" class="small">X and Y commute with e₂ and e₄ because q is orthogonal to both projections.</text>
<text x="45" y="361" class="small">They commute with every later even projection by the distant-commutation relation.</text>
<rect x="45" y="389" width="910" height="62" rx="6" fill="#edf6fb" stroke="#236aa1"/>
<text x="500" y="429" text-anchor="middle" class="math">⟨00001 | [X,Y] | 00100⟩ = 1/32 ≠ 0</text>
<text x="45" y="478" class="small">Exact witness for Theorem 5.2. The abelian even-generator algebra has a noncommutative commutant.</text>
</svg>