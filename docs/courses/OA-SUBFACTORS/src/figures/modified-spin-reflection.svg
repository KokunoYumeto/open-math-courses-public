<svg xmlns="http://www.w3.org/2000/svg" width="740" height="850" viewBox="0 0 740 850"><rect width="740" height="850" fill="white"/>
<text x="26" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17324a" font-weight="bold">Complement the finite words before reflection</text>
<text x="26" y="74" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">p = 1/4, q = 3/4; d = 16/3; λ = 3/16. Exact proof: 62.6.</text>
<rect x="18" y="94" width="704" height="255" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="36" y="128" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">C₃ blocks: sizes 1, 3, 3, 1. Values below are minimal weights.</text>
<text x="42" y="169" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">ones ℓ</text>
<text x="176" y="169" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">0</text>
<text x="307" y="169" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">1</text>
<text x="437" y="169" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">2</text>
<text x="572" y="169" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">3</text>
<text x="42" y="212" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">inherited</text>
<text x="176" y="212" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">1/64</text>
<text x="307" y="212" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">3/64</text>
<text x="437" y="212" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">9/64</text>
<text x="572" y="212" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">27/64</text>
<text x="42" y="254" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">specified θ</text>
<text x="176" y="254" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">27/64</text>
<text x="307" y="254" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">9/64</text>
<text x="437" y="254" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">3/64</text>
<text x="572" y="254" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">1/64</text>
<text x="42" y="297" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">β = θσ</text>
<text x="176" y="297" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">1/64</text>
<text x="307" y="297" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">3/64</text>
<text x="437" y="297" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">9/64</text>
<text x="572" y="297" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">27/64</text>
<text x="36" y="333" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">σ complements every letter: ℓ ↦ 3−ℓ. β is trace preserving.</text>
<rect x="18" y="369" width="704" height="198" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="403" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">The same correction changes the lower cup</text>
<text x="42" y="439" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">Original f: 01,10 block</text>
<text x="402" y="439" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">Modified g: 01,10 block</text>
<text x="55" y="478" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">[ 3/4     √3/4 ]</text>
<text x="417" y="478" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">[ 1/4     √3/4 ]</text>
<text x="55" y="516" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">[ √3/4    1/4  ]</text>
<text x="417" y="516" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="normal">[ √3/4    3/4  ]</text>
<text x="36" y="551" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">σ(gⱼ) = fⱼ;  θ(fⱼ) = eⱼ;  therefore β(gⱼ) = eⱼ.</text>
<rect x="18" y="587" width="704" height="155" rx="8" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="623" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="bold">E_(first-site diagonal)(g) = (3/16)1.</text>
<text x="36" y="661" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">E_N(g) = (9/16)P₀ + (1/16)P₁, on the second site.</text>
<text x="36" y="700" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">g implements F with first-tail-site weights (3/4,1/4).</text>
<text x="36" y="730" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">F preserves the inherited trace only at p = q.</text>
<text x="26" y="781" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">β extends normally from M to M′ ∩ T and sends each tail to Bⱼ.</text>
<text x="26" y="812" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">The modified cup supplies all shifted scalar identities; C₀ = M follows.</text>
<text x="26" y="843" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Sources: course 47 balanced-spin construction; Pimsner–Popa, pp. 83–85.</text>
</svg>