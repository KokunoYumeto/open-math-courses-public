<svg xmlns="http://www.w3.org/2000/svg" width="500" height="640" viewBox="0 0 500 640" role="img" aria-labelledby="title desc">
<title id="title">A4 vertex weights and the first six path levels</title>
<desc id="desc">A four-vertex line rooted at zero, with weights one, phi, phi, one. Below it, a Bratteli diagram displays path counts at levels zero through five. Each node is a matrix block whose size is the displayed count.</desc>
<rect width="500" height="640" fill="white"/>
<text x="250" y="28" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#16324f">A₄ path model: δ = φ, λ = φ⁻²</text>
<text x="250" y="53" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">φ = (1 + √5)/2</text>
<line x1="85" y1="89" x2="195" y2="89" stroke="#315c83" stroke-width="2"/>
<line x1="195" y1="89" x2="305" y2="89" stroke="#315c83" stroke-width="2"/>
<line x1="305" y1="89" x2="415" y2="89" stroke="#315c83" stroke-width="2"/>
<circle cx="85" cy="89" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="85" y="95" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">0</text>
<text x="85" y="125" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">μ = 1</text>
<circle cx="195" cy="89" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="195" y="95" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">1</text>
<text x="195" y="125" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">μ = φ</text>
<circle cx="305" cy="89" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="305" y="95" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">2</text>
<text x="305" y="125" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">μ = φ</text>
<circle cx="415" cy="89" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="415" y="95" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">3</text>
<text x="415" y="125" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">μ = 1</text>
<text x="250" y="155" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#16324f">Each node below represents Mₖ; its label is k.</text>
<text x="250" y="176" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#16324f">Edges record extension by one graph edge.</text>
<line x1="85" y1="222" x2="195" y2="280" stroke="#a6b5c5" stroke-width="2"/>
<line x1="195" y1="280" x2="85" y2="338" stroke="#a6b5c5" stroke-width="2"/>
<line x1="195" y1="280" x2="305" y2="338" stroke="#a6b5c5" stroke-width="2"/>
<line x1="85" y1="338" x2="195" y2="396" stroke="#a6b5c5" stroke-width="2"/>
<line x1="305" y1="338" x2="195" y2="396" stroke="#a6b5c5" stroke-width="2"/>
<line x1="305" y1="338" x2="415" y2="396" stroke="#a6b5c5" stroke-width="2"/>
<line x1="195" y1="396" x2="85" y2="454" stroke="#a6b5c5" stroke-width="2"/>
<line x1="195" y1="396" x2="305" y2="454" stroke="#a6b5c5" stroke-width="2"/>
<line x1="415" y1="396" x2="305" y2="454" stroke="#a6b5c5" stroke-width="2"/>
<line x1="85" y1="454" x2="195" y2="512" stroke="#a6b5c5" stroke-width="2"/>
<line x1="305" y1="454" x2="195" y2="512" stroke="#a6b5c5" stroke-width="2"/>
<line x1="305" y1="454" x2="415" y2="512" stroke="#a6b5c5" stroke-width="2"/>
<text x="18" y="227" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">0</text>
<circle cx="85" cy="222" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="85" y="228" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">1</text>
<text x="18" y="285" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">1</text>
<circle cx="195" cy="280" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="195" y="286" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">1</text>
<text x="18" y="343" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">2</text>
<circle cx="85" cy="338" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="85" y="344" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">1</text>
<circle cx="305" cy="338" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="305" y="344" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">1</text>
<text x="18" y="401" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">3</text>
<circle cx="195" cy="396" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="195" y="402" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">2</text>
<circle cx="415" cy="396" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="415" y="402" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">1</text>
<text x="18" y="459" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">4</text>
<circle cx="85" cy="454" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="85" y="460" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">2</text>
<circle cx="305" cy="454" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="305" y="460" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">3</text>
<text x="18" y="517" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#16324f">5</text>
<circle cx="195" cy="512" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="195" y="518" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">5</text>
<circle cx="415" cy="512" r="18" fill="#e9f2fa" stroke="#315c83" stroke-width="1.5"/>
<text x="415" y="518" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#16324f">3</text>
<text x="20" y="202" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#16324f">n</text>
<text x="250" y="564" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#16324f">Minimal-projection trace at vertex j, level n:</text>
<text x="250" y="588" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#16324f">τ([p,p]) = φ⁻ⁿ μ(j)</text>
<text x="250" y="615" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#16324f">Propositions 9.1–9.2 and Theorem 9.4.</text>
</svg>
