<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1720" viewBox="0 0 2100 1720">
<rect width="2100" height="1720" fill="#f5f7fa"/>
<text x="65" y="91" font-family="Segoe UI, sans-serif" font-size="56" fill="#182c40" font-weight="700">Actual center constraints at fixed λ</text>
<text x="65" y="144" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Original physical τ, E_A, P0 and both canonical traces retained.</text>
<rect x="65" y="190" width="1970" height="310" rx="18" fill="#ffffff" stroke="#58718a" stroke-width="3"/>
<text x="100" y="254" font-family="Segoe UI, sans-serif" font-size="42" fill="#182c40" font-weight="700">Three actual four-label words: phases +, −, +, −</text>
<text x="105" y="316" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">(0, 0, 0, 0) → 1</text>
<text x="770" y="316" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">(1, 0, 1, 0) → z²</text>
<text x="1420" y="316" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">(0, 1, 0, 1) → z^(−2)</text>
<text x="105" y="371" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">probability 1/d²</text>
<text x="770" y="371" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">probability λ²/d²</text>
<text x="1420" y="371" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">probability λ^(−2)/d²</text>
<text x="105" y="448" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">TV(endpoint law, its z² shift) ≤ min(1, 77/sqrt(n) + 3888/n)       E14.1–E14.4</text>
<rect x="65" y="590" width="960" height="248" rx="18" fill="#eaf4f1" stroke="#3a7b69" stroke-width="3"/>
<text x="100" y="652" font-family="Segoe UI, sans-serif" font-size="42" fill="#182c40" font-weight="700">Whole-center action identity</text>
<text x="100" y="715" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">β_(z²)|Z = identity       E14.5</text>
<text x="100" y="771" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Original physical α_(z²) still scales by λ².</text>
<text x="100" y="816" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Only the center action forgets z².</text>
<rect x="1115" y="590" width="920" height="248" rx="18" fill="#eaf4f1" stroke="#3a7b69" stroke-width="3"/>
<text x="1150" y="648" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="700">Original trace-density constraint</text>
<text x="1150" y="711" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">D1 = R1 / (λ R0),  D1 β1(D1) = 1</text>
<text x="1150" y="775" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">ω(log R1) − ω(log R0) = log λ</text>
<text x="1150" y="816" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">Actual two measures retained.       E14.13–15</text>
<path d="M520,500 L520,590" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="520,590 509.4526381507075,570.6931836384118 530.5473618492924,570.6931836384118" fill="#58718a"/>
<path d="M1025,710 L1115,710" fill="none" stroke="#3a7b69" stroke-width="6"/>
<polygon points="1115,710 1095.6931836384117,720.5473618492924 1095.6931836384117,699.4526381507076" fill="#3a7b69"/>
<rect x="65" y="930" width="1970" height="225" rx="18" fill="#edf0f8" stroke="#626c9b" stroke-width="3"/>
<text x="100" y="989" font-family="Segoe UI, sans-serif" font-size="42" fill="#182c40" font-weight="700">All actual invariant center states are purely singular</text>
<text x="100" y="1042" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">Finite lamp probabilities are 2^(−|F|); F_L ↑ 1 strongly but ω(F_L) = 0 for every L.</text>
<text x="100" y="1097" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">F_L: all sites outside [−L,L] on one actual lattice line are unlit.       E14.10–12</text>
<text x="100" y="1140" font-family="Segoe UI, sans-serif" font-size="30" fill="#182c40" font-weight="400">No normal positive functional lies below ω; all compatible returns kill J_e.       E14.12a</text>
<path d="M520,838 L520,930" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="520,930 509.4526381507075,910.6931836384118 530.5473618492924,910.6931836384118" fill="#58718a"/>
<rect x="65" y="1260" width="1970" height="340" rx="18" fill="#ffffff" stroke="#58718a" stroke-width="3"/>
<text x="100" y="1320" font-family="Segoe UI, sans-serif" font-size="42" fill="#182c40" font-weight="700">Proved exclusion at the lower root; upper root still unproved</text>
<path d="M185,1430 L1870,1430" stroke="#58718a" stroke-width="7"/>
<rect x="185" y="1408" width="295" height="44" fill="#d98b84"/>
<circle cx="1870" cy="1430" r="12" fill="white" stroke="#b68431" stroke-width="4"/>
<text x="100" y="1379" font-family="Segoe UI, sans-serif" font-size="34" fill="#914f49" font-weight="400">Excluded interval</text>
<text x="1550" y="1379" font-family="Segoe UI, sans-serif" font-size="34" fill="#956617" font-weight="400">Zero-cost endpoint?</text>
<text x="100" y="1515" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">1/(4λ+1)</text>
<text x="440" y="1515" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">+ δ</text>
<text x="1630" y="1515" font-family="Segoe UI, sans-serif" font-size="38" fill="#182c40" font-weight="400">λ/(4+λ)</text>
<text x="100" y="1569" font-family="Segoe UI, sans-serif" font-size="34" fill="#182c40" font-weight="400">δ = (log λ)²/(16d^5); actual R_i ≥ 1/d       E14.18a</text>
<path d="M1600,838 L2070,838" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="2070,838 2050.693183638412,848.5473618492924 2050.693183638412,827.4526381507076" fill="#58718a"/>
<path d="M2070,838 L2070,1203" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="2070,1203 2059.4526381507076,1183.6931836384117 2080.5473618492924,1183.6931836384117" fill="#58718a"/>
<path d="M2070,1203 L1620,1203" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="1620,1203 1639.3068163615883,1192.4526381507076 1639.3068163615883,1213.5473618492924" fill="#58718a"/>
<path d="M1620,1203 L1620,1260" fill="none" stroke="#58718a" stroke-width="6"/>
<polygon points="1620,1260 1609.4526381507076,1240.6931836384117 1630.5473618492924,1240.6931836384117" fill="#58718a"/>
<text x="65" y="1667" font-family="Segoe UI, sans-serif" font-size="27" fill="#182c40" font-weight="400">CC0 exact-label schematic. Endpoint strip encodes no metric. No upper-endpoint attainment or separation is proved.</text>
</svg>