<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="990" viewBox="0 0 1120 990">
<rect width="1120" height="990" fill="#fafbfc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315b76"/></marker></defs>
<text x="30" y="43" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#172d3d" font-weight="bold">Physical amplification preserves both separately traced models</text>
<text x="30" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">0 ≠ p ∈ N;   t = τ(p);   τᵖ = τ/t on pTp.   No ambient separability is assumed.</text>
<rect x="30" y="120" width="1020" height="132" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">The actual corner tower and its marked finite rows</text>
<text x="46" y="188" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">pNp ⊂ pMp ⊂ pM₁p ⊂ ⋯;     e_jᵖ = pe_j;     each index is d = [M:N].</text>
<text x="46" y="217" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">φ(b) = pb;   φ⁻¹(c) = Σ v_r c v_r*;   v_r ∈ N,   v_r = v_rp,   Σ v_rv_r* = 1.</text>
<text x="46" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">τᵖ(pb) = τ(b) for every b in the relevant relative commutant.</text>
<rect x="30" y="315" width="480" height="209" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="349" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">Ordinary standard model</text>
<text x="46" y="383" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">Both finite rows and every marked cup</text>
<text x="46" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">determine the recovered downward trace ρ.</text>
<text x="46" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">ρ_kᵖ(pc) = ρ_k(c), by the finite mirror.</text>
<text x="46" y="470" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">Theorem 17.9 extends the comparison</text>
<text x="46" y="499" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">normally to both ordinary-core endpoints.</text>
<rect x="570" y="315" width="480" height="209" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="586" y="349" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">Actual physical opposite model</text>
<text x="586" y="383" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">B_i = M_i′ ∩ T,  for every i ≥ −1.</text>
<text x="586" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">B_iᵖ = (pM_i p)′ ∩ pTp = pB_i.</text>
<text x="586" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">The map φ_i(b) = pb preserves σ.</text>
<text x="586" y="470" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">e_jᵖ = pe_j;  h_jᵖ = ph_j;  q_jᵖ = pq_j.</text>
<text x="586" y="499" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">Canonical trace: dτ maps to dτᵖ.</text>
<path d="M250 260 L250 303" fill="none" stroke="#315b76" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M810 260 L810 303" fill="none" stroke="#315b76" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="578" width="1020" height="130" rx="10" fill="#eaf3f8" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">Every positive real amplification α</text>
<text x="46" y="646" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">Choose integer n ≥ α and p ∈ N ⊗ Mat_n with (τ ⊗ Tr_n)(p) = α.</text>
<text x="46" y="675" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">The normalized projection trace is (τ ⊗ tr_n)(p) = α/n.</text>
<text x="46" y="704" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">First amplify the physical tower by Mat_n, then apply the exact corner maps.</text>
<rect x="30" y="758" width="1020" height="151" rx="10" fill="#fff0e9" stroke="#91aabb" stroke-width="2"/>
<text x="46" y="792" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172d3d" font-weight="bold">Physical bicommutant equality transfers in both directions</text>
<text x="46" y="826" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">D = (M′ ∩ T)′ ∩ T contains M;     (B₀ᵖ)′ ∩ pTp = pDp.</text>
<text x="46" y="855" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">If pDp = pMp, then x = Σ v_r(v_r* x v_s)v_s* ∈ M for every x ∈ D.</text>
<text x="46" y="884" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#172d3d" font-weight="normal">This is amplification invariance of the equality, not a proof that D = M.</text>
<text x="32" y="951" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#172d3d" font-weight="normal">Theorems 17.11–17.12; Corollary 17.13. The two trace systems are not identified.</text>
<text x="32" y="980" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#172d3d" font-weight="normal">No old negative tunnel is silently compressed. Boxes and arrows are schematic; widths encode no trace masses.</text>
</svg>
