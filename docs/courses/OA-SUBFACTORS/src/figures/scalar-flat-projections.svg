<svg xmlns="http://www.w3.org/2000/svg" width="740" height="680" viewBox="0 0 740 680"><rect width="740" height="680" fill="white"/>
<text x="26" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17324a" font-weight="bold">A scalar relative expectation has a precise budget</text>
<text x="26" y="72" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">N ⊂ M; A = N′ ∩ M; d = [M:N]; λ = 1/d. Proof: 62.1.</text>
<rect x="18" y="94" width="704" height="186" rx="8" fill="#eff5fb" stroke="#9eb3c5"/>
<text x="36" y="128" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">Minimal fᵢ ∈ A:  tᵢ = τ(fᵢ),  δᵢ = [fᵢMfᵢ:Nfᵢ].</text>
<text x="36" y="167" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">rᵢ = δᵢ/(d tᵢ),  Σrᵢ = 1; choose sᵢ ∈ N with τ(sᵢ) = rᵢ.</text>
<text x="36" y="207" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">qᵢ ≤ fᵢsᵢ,  τ(qᵢ) = λ;  vᵢⱼ are their matrix units.</text>
<text x="36" y="250" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="normal">z = Σ√(tᵢtⱼ) vᵢⱼ is rank one in this finite matrix corner.</text>
<rect x="18" y="300" width="704" height="176" rx="8" fill="#eef8f4" stroke="#9eb3c5"/>
<text x="36" y="334" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="bold">An actual nonextremal example: t₁ = 1/4, t₂ = 3/4; δ₁ = δ₂ = 1.</text>
<text x="45" y="373" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">i</text>
<text x="140" y="373" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">tᵢ</text>
<text x="260" y="373" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">rᵢ</text>
<text x="390" y="373" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">tᵢ²/δᵢ</text>
<text x="540" y="373" font-family="Arial, sans-serif" font-size="18" fill="#17324a" font-weight="bold">τ(qᵢ)</text>
<text x="45" y="412" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1</text>
<text x="140" y="412" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1/4</text>
<text x="260" y="412" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">3/4</text>
<text x="390" y="412" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1/16</text>
<text x="540" y="412" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">3/16</text>
<text x="45" y="450" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">2</text>
<text x="140" y="450" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">3/4</text>
<text x="260" y="450" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">1/4</text>
<text x="390" y="450" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">9/16</text>
<text x="540" y="450" font-family="Arial, sans-serif" font-size="19" fill="#17324a" font-weight="normal">3/16</text>
<rect x="18" y="496" width="704" height="107" rx="8" fill="#fff7ea" stroke="#9eb3c5"/>
<text x="36" y="534" font-family="Arial, sans-serif" font-size="20" fill="#17324a" font-weight="bold">E_A(z) = (3/16)1;   E_N(z) = (1/16)s₁ + (9/16)s₂.</text>
<text x="36" y="576" font-family="Arial, sans-serif" font-size="17" fill="#17324a" font-weight="normal">τ(z) = 3/16. The two expectation targets have different coefficients.</text>
<text x="26" y="638" font-family="Arial, sans-serif" font-size="16" fill="#17324a" font-weight="normal">The general construction and all off-diagonal identities are proved in 62.1.</text>
<text x="26" y="668" font-family="Arial, sans-serif" font-size="15" fill="#17324a" font-weight="normal">Human source: Pimsner–Popa, DOI 10.24033/asens.1504, pp. 83–84.</text>
</svg>