<text x="36" y="48" class="title">A prescribed test can average unequal entries</text>
<text x="36" y="85" class="label">A = diagonal algebra of B = M₃;  B₁ = M₃ ⊕ M₃ ⊕ M₃</text>
<text x="36" y="121" class="small">Basic-trace weights: u = (1/18, 1/6, 1/9); Jones projection: (E₁₁, E₂₂, E₃₃)</text>
<text x="36" y="167" class="label">E_B(e_A)</text>
<rect x="260" y="260.0" width="180" height="30.0" fill="#277f8e"/>
<path d="M260 290h180" stroke="#192d38" stroke-width="2"/>
<text x="327" y="246.0" class="label">1/6</text>
<text x="318" y="321" class="label">E₁₁</text>
<rect x="470" y="200.0" width="180" height="90.0" fill="#277f8e"/>
<path d="M470 290h180" stroke="#192d38" stroke-width="2"/>
<text x="537" y="186.0" class="label">1/2</text>
<text x="528" y="321" class="label">E₂₂</text>
<rect x="680" y="230.0" width="180" height="60.0" fill="#277f8e"/>
<path d="M680 290h180" stroke="#192d38" stroke-width="2"/>
<text x="747" y="216.0" class="label">1/3</text>
<text x="738" y="321" class="label">E₃₃</text>
<text x="36" y="426" class="label">E_P(e_A)</text>
<rect x="260" y="465.0" width="180" height="60.0" fill="#b37439"/>
<path d="M260 525h180" stroke="#192d38" stroke-width="2"/>
<text x="327" y="451.0" class="label">1/3</text>
<text x="318" y="556" class="label">E₁₁</text>
<rect x="470" y="465.0" width="180" height="60.0" fill="#b37439"/>
<path d="M470 525h180" stroke="#192d38" stroke-width="2"/>
<text x="537" y="451.0" class="label">1/3</text>
<text x="528" y="556" class="label">E₂₂</text>
<rect x="680" y="465.0" width="180" height="60.0" fill="#b37439"/>
<path d="M680 525h180" stroke="#192d38" stroke-width="2"/>
<text x="747" y="451.0" class="label">1/3</text>
<text x="738" y="556" class="label">E₃₃</text>
<path d="M260 571v9h390v-9 M680 571v9h180v-9" fill="none" stroke="#192d38" stroke-width="2"/>
<text x="346" y="609" class="small">P cell: E₁₁ + E₂₂</text>
<text x="717" y="609" class="small">P cell: E₃₃</text>
<text x="36" y="351" class="label">First two entries average: (1/6 + 1/2)/2 = 1/3. Third entry stays 1/3.</text>
<text x="36" y="387" class="small">Equal widths encode trace 1/3; heights encode expectation values.</text>
<text x="36" y="644" class="small">Definition 8.10 · Lemma 8.7 · full solution in Exercise 8.7 · original reproducible figure</text>
