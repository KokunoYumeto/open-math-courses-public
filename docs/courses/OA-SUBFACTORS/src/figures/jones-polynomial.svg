<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1590" viewBox="0 0 560 1590" role="img" aria-labelledby="title desc">
<title id="title">From a crossing to the Jones polynomial</title>
<desc id="desc">The northeast to southwest overstrand is positive when both strands point down. Its A smoothing is vertical. Closing a new strand multiplies the bracket by delta, while closing a cup cap contributes no new circle. All eight trefoil states and the exact operator trace normalization are displayed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#17466b"/></marker></defs>
<rect width="560" height="1590" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;font-size:20px;fill:#142b3e;white-space:pre}.head{font-size:25px;font-weight:bold}.math{font-family:Georgia,serif;font-size:23px}.small{font-size:18px}.line{fill:none;stroke:#17466b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#f4f8fb;stroke:#b8cddd;stroke-width:1.5}</style>
<text x="280" y="37" class="head" text-anchor="middle" xml:space="preserve">From a crossing to a polynomial</text>
<rect class="panel" x="12" y="57" width="536" height="270" rx="12"/>
<text x="30" y="93" class="head" text-anchor="start" xml:space="preserve">1. Fix the crossing and its two channels</text>
<path class="line" d="M70.0 136.0 L98 164"/>
<path class="line" d="M116 182 L144.0 210.0" marker-end="url(#arrow)"/>
<path class="line" d="M144.0 136.0 L70.0 210.0" marker-end="url(#arrow)"/>
<path class="line" d="M250 138 L250 208"/>
<path class="line" d="M320 138 L320 208"/>
<path class="line" d="M417 138 Q452 176 487 138"/>
<path class="line" d="M417 208 Q452 170 487 208"/>
<text x="107" y="238" class="math" text-anchor="middle" xml:space="preserve">positive B</text>
<text x="285" y="238" class="math" text-anchor="middle" xml:space="preserve">A · I</text>
<text x="452" y="238" class="math" text-anchor="middle" xml:space="preserve">A<tspan baseline-shift="super" font-size="70%">−1</tspan> · U</text>
<text x="30" y="280" class="math" text-anchor="start" xml:space="preserve">B = A I + A<tspan baseline-shift="super" font-size="70%">−1</tspan> U</text>
<text x="30" y="309" class="math" text-anchor="start" xml:space="preserve">δ = −A<tspan baseline-shift="super" font-size="70%">2</tspan> − A<tspan baseline-shift="super" font-size="70%">−2</tspan>       U<tspan baseline-shift="super" font-size="70%">2</tspan> = δ U</text>
<rect class="panel" x="12" y="341" width="536" height="325" rx="12"/>
<text x="30" y="378" class="head" text-anchor="start" xml:space="preserve">2. Close the added strand</text>
<path class="line" d="M77 425 L77 495"/>
<path class="line" d="M147 425 L147 495"/>
<path class="line" d="M147 425 C227 399 227 521 147 495"/>
<path class="line" d="M330 425 Q365 463 400 425"/>
<path class="line" d="M330 495 Q365 457 400 495"/>
<path class="line" d="M400 425 C480 399 480 521 400 495"/>
<text x="113" y="532" class="math" text-anchor="middle" xml:space="preserve">I gives δ · I</text>
<text x="370" y="532" class="math" text-anchor="middle" xml:space="preserve">U gives I</text>
<text x="30" y="580" class="math" text-anchor="start" xml:space="preserve">C<tspan baseline-shift="sub" font-size="70%">n+1</tspan>(x) = δ C<tspan baseline-shift="sub" font-size="70%">n</tspan>(x)</text>
<text x="30" y="613" class="math" text-anchor="start" xml:space="preserve">C<tspan baseline-shift="sub" font-size="70%">n+1</tspan>(x U<tspan baseline-shift="sub" font-size="70%">n</tspan>) = C<tspan baseline-shift="sub" font-size="70%">n</tspan>(x)</text>
<text x="30" y="645" class="math" text-anchor="start" xml:space="preserve">Positive curl: Aδ + A<tspan baseline-shift="super" font-size="70%">−1</tspan> = −A<tspan baseline-shift="super" font-size="70%">3</tspan></text>
<rect class="panel" x="12" y="680" width="536" height="585" rx="12"/>
<text x="30" y="718" class="head" text-anchor="start" xml:space="preserve">3. Close the positive three-crossing braid</text>
<path class="line" d="M92.0 753.0 L118 779"/>
<path class="line" d="M136 797 L162.0 823.0"/>
<path class="line" d="M162.0 753.0 L92.0 823.0"/>
<path class="line" d="M92.0 823.0 L118 849"/>
<path class="line" d="M136 867 L162.0 893.0"/>
<path class="line" d="M162.0 823.0 L92.0 893.0"/>
<path class="line" d="M92.0 893.0 L118 919"/>
<path class="line" d="M136 937 L162.0 963.0"/>
<path class="line" d="M162.0 893.0 L92.0 963.0"/>
<path class="line" d="M92 753 C28 710 28 1003 92 963"/>
<path class="line" d="M162 753 C217 710 217 1003 162 963"/>
<text x="127" y="1009" class="math" text-anchor="middle" xml:space="preserve">σ<tspan baseline-shift="sub" font-size="70%">1</tspan><tspan baseline-shift="super" font-size="70%">3</tspan>, writhe 3</text>
<text x="259" y="768" class="small" text-anchor="start" xml:space="preserve">state</text>
<text x="352" y="768" class="small" text-anchor="start" xml:space="preserve">circles</text>
<text x="441" y="768" class="small" text-anchor="start" xml:space="preserve">weight</text>
<text x="263" y="807" class="math" text-anchor="start" xml:space="preserve">III</text>
<text x="380" y="807" class="math" text-anchor="middle" xml:space="preserve">2</text>
<text x="474" y="807" class="math" text-anchor="middle" xml:space="preserve">A<tspan baseline-shift="super" font-size="70%">3</tspan>δ</text>
<text x="263" y="837" class="math" text-anchor="start" xml:space="preserve">IIU</text>
<text x="380" y="837" class="math" text-anchor="middle" xml:space="preserve">1</text>
<text x="474" y="837" class="math" text-anchor="middle" xml:space="preserve">A</text>
<text x="263" y="867" class="math" text-anchor="start" xml:space="preserve">IUI</text>
<text x="380" y="867" class="math" text-anchor="middle" xml:space="preserve">1</text>
<text x="474" y="867" class="math" text-anchor="middle" xml:space="preserve">A</text>
<text x="263" y="897" class="math" text-anchor="start" xml:space="preserve">UII</text>
<text x="380" y="897" class="math" text-anchor="middle" xml:space="preserve">1</text>
<text x="474" y="897" class="math" text-anchor="middle" xml:space="preserve">A</text>
<text x="263" y="927" class="math" text-anchor="start" xml:space="preserve">IUU</text>
<text x="380" y="927" class="math" text-anchor="middle" xml:space="preserve">2</text>
<text x="474" y="927" class="math" text-anchor="middle" xml:space="preserve">A<tspan baseline-shift="super" font-size="70%">−1</tspan>δ</text>
<text x="263" y="957" class="math" text-anchor="start" xml:space="preserve">UIU</text>
<text x="380" y="957" class="math" text-anchor="middle" xml:space="preserve">2</text>
<text x="474" y="957" class="math" text-anchor="middle" xml:space="preserve">A<tspan baseline-shift="super" font-size="70%">−1</tspan>δ</text>
<text x="263" y="987" class="math" text-anchor="start" xml:space="preserve">UUI</text>
<text x="380" y="987" class="math" text-anchor="middle" xml:space="preserve">2</text>
<text x="474" y="987" class="math" text-anchor="middle" xml:space="preserve">A<tspan baseline-shift="super" font-size="70%">−1</tspan>δ</text>
<text x="263" y="1017" class="math" text-anchor="start" xml:space="preserve">UUU</text>
<text x="380" y="1017" class="math" text-anchor="middle" xml:space="preserve">3</text>
<text x="474" y="1017" class="math" text-anchor="middle" xml:space="preserve">A<tspan baseline-shift="super" font-size="70%">−3</tspan>δ<tspan baseline-shift="super" font-size="70%">2</tspan></text>
<text x="30" y="1081" class="math" text-anchor="start" xml:space="preserve">All 8 states: A<tspan baseline-shift="super" font-size="70%">3</tspan>δ + 3A + 3A<tspan baseline-shift="super" font-size="70%">−1</tspan>δ + A<tspan baseline-shift="super" font-size="70%">−3</tspan>δ<tspan baseline-shift="super" font-size="70%">2</tspan></text>
<text x="30" y="1119" class="math" text-anchor="start" xml:space="preserve">Bracket = −A<tspan baseline-shift="super" font-size="70%">5</tspan> − A<tspan baseline-shift="super" font-size="70%">−3</tspan> + A<tspan baseline-shift="super" font-size="70%">−7</tspan></text>
<text x="30" y="1157" class="math" text-anchor="start" xml:space="preserve">Multiply by (−A<tspan baseline-shift="super" font-size="70%">3</tspan>)<tspan baseline-shift="super" font-size="70%">−3</tspan> = −A<tspan baseline-shift="super" font-size="70%">−9</tspan></text>
<text x="30" y="1195" class="math" text-anchor="start" xml:space="preserve">F(A) = A<tspan baseline-shift="super" font-size="70%">−4</tspan> + A<tspan baseline-shift="super" font-size="70%">−12</tspan> − A<tspan baseline-shift="super" font-size="70%">−16</tspan></text>
<text x="30" y="1235" class="math" text-anchor="start" xml:space="preserve">t = A<tspan baseline-shift="super" font-size="70%">−4</tspan>       V(t) = t + t<tspan baseline-shift="super" font-size="70%">3</tspan> − t<tspan baseline-shift="super" font-size="70%">4</tspan></text>
<rect class="panel" x="12" y="1279" width="536" height="279" rx="12"/>
<text x="30" y="1318" class="head" text-anchor="start" xml:space="preserve">4. The exact operator trace conversion</text>
<text x="30" y="1360" class="math" text-anchor="start" xml:space="preserve">δ<tspan baseline-shift="sub" font-size="70%">0</tspan> = √d = −A<tspan baseline-shift="sub" font-size="70%">0</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> − A<tspan baseline-shift="sub" font-size="70%">0</tspan><tspan baseline-shift="super" font-size="70%">−2</tspan></text>
<text x="30" y="1400" class="math" text-anchor="start" xml:space="preserve">g<tspan baseline-shift="sub" font-size="70%">i</tspan> = A<tspan baseline-shift="sub" font-size="70%">0</tspan> · 1 + A<tspan baseline-shift="sub" font-size="70%">0</tspan><tspan baseline-shift="super" font-size="70%">−1</tspan> δ<tspan baseline-shift="sub" font-size="70%">0</tspan> e<tspan baseline-shift="sub" font-size="70%">i−1</tspan></text>
<text x="30" y="1444" class="math" text-anchor="start" xml:space="preserve">V(A<tspan baseline-shift="sub" font-size="70%">0</tspan><tspan baseline-shift="super" font-size="70%">−4</tspan>) = (−A<tspan baseline-shift="sub" font-size="70%">0</tspan><tspan baseline-shift="super" font-size="70%">3</tspan>)<tspan baseline-shift="super" font-size="70%">−w</tspan> δ<tspan baseline-shift="sub" font-size="70%">0</tspan><tspan baseline-shift="super" font-size="70%">n−1</tspan> τ(g<tspan baseline-shift="sub" font-size="70%">β</tspan>)</text>
<text x="30" y="1487" class="" text-anchor="start" xml:space="preserve">n strands; w is the signed crossing sum.</text>
<text x="30" y="1523" class="small" text-anchor="start" xml:space="preserve">Trace gives an evaluation of the polynomial.</text>
<text x="280" y="1582" class="small" text-anchor="middle" xml:space="preserve">Proofs: 45.1–45.4; trefoil: 45.5. Original figure · CC0</text>
</svg>
