<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1030" viewBox="0 0 1260 1030">
<rect width="1260" height="1030" fill="#ffffff"/>
<text x="44" y="48" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#122438">Tail cuts retain operators; whole supports change the compressed index</text>
<text x="44" y="80" font-family="Arial,sans-serif" font-size="19" fill="#122438">Exact actual objects and proof locators. The original general finite partition remains unresolved.</text>
<rect x="44" y="115" width="560" height="170" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Stronger actual tail-family input: OT.1</text>
<text x="65" y="183" font-family="Arial,sans-serif" font-size="19" fill="#122438">p_i in Q_i = N_mi^(i); P_i = p_i A_mi^(i) p_i</text>
<text x="65" y="215" font-family="Arial,sans-serif" font-size="19" fill="#122438">old error &lt; eps/2; tau(f) &lt; eps^2/(16 R^2)</text>
<text x="65" y="247" font-family="Arial,sans-serif" font-size="18" fill="#122438">Popa4.4 pp.220-221 uses this tail membership.</text>
<text x="65" y="274" font-family="Arial,sans-serif" font-size="17" fill="#122438">Unrestricted amenability has not supplied it here.</text>
<rect x="657" y="115" width="560" height="170" rx="13" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="678" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Available general whole support: OT.2</text>
<text x="678" y="183" font-family="Arial,sans-serif" font-size="19" fill="#122438">p in B_m = Q' cap N; Q = N_m; D = d^m</text>
<text x="678" y="215" font-family="Arial,sans-serif" font-size="19" fill="#122438">Qp is an actual II1 factor inside pNp.</text>
<text x="678" y="247" font-family="Arial,sans-serif" font-size="18" fill="#122438">(Qp)' cap pMp = p A_m p: old operators retained.</text>
<text x="678" y="274" font-family="Arial,sans-serif" font-size="17" fill="#122438">This is the membership supplied by general76.2.</text>
<path d="M324 285 L324 334" stroke="#334155" stroke-width="2.5" fill="none"/><polygon points="324,334 318,324 330,324" fill="#334155"/>
<path d="M937 285 L937 334" stroke="#334155" stroke-width="2.5" fill="none"/><polygon points="937,334 931,324 943,324" fill="#334155"/>
<rect x="44" y="345" width="560" height="193" rx="13" fill="#eefbf3" stroke="#15803d" stroke-width="2"/>
<text x="65" y="380" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Finite cups give exact compatible budgets</text>
<text x="65" y="412" font-family="Arial,sans-serif" font-size="19" fill="#122438">sum c_i = 1; 0 &lt; a_i &lt; tau(p_i) for good cells</text>
<text x="65" y="444" font-family="Arial,sans-serif" font-size="19" fill="#122438">Choose r_i ≤ p_i inside Q_i with tau(r_i) = a_i.</text>
<text x="65" y="476" font-family="Arial,sans-serif" font-size="19" fill="#122438">u_i in Q_i fixes A_mi^(i), and places a copied cup.</text>
<text x="65" y="508" font-family="Arial,sans-serif" font-size="17" fill="#122438">r_i enters actual B_(mi+J+1); residual trace is a_0.</text>
<text x="65" y="530" font-family="Arial,sans-serif" font-size="17" fill="#122438">OT.3-OT.8: no near-identity unitary assumption</text>
<rect x="657" y="345" width="560" height="193" rx="13" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="678" y="380" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">The literal corner-tunnel match is blocked</text>
<text x="678" y="412" font-family="Arial,sans-serif" font-size="19" fill="#122438">[pNp : Qp] = D tau(p) rho_Q(p) &lt; D</text>
<text x="678" y="444" font-family="Arial,sans-serif" font-size="19" fill="#122438">B_m cap Q = C1; a proper p is outside every later tail.</text>
<text x="678" y="476" font-family="Arial,sans-serif" font-size="19" fill="#122438">Later compressed index = d^(m+l) tau(p) rho_Q(p).</text>
<text x="678" y="508" font-family="Arial,sans-serif" font-size="17" fill="#122438">A depth shift needs tau(p) rho_Q(p) = d^(-a).</text>
<text x="678" y="530" font-family="Arial,sans-serif" font-size="17" fill="#122438">OT.13-OT.16: necessary, not sufficient</text>
<path d="M324 538 L324 589" stroke="#334155" stroke-width="2.5" fill="none"/><polygon points="324,589 318,579 330,579" fill="#334155"/>
<path d="M937 538 L937 589" stroke="#334155" stroke-width="2.5" fill="none"/><polygon points="937,589 931,579 943,579" fill="#334155"/>
<rect x="44" y="601" width="560" height="151" rx="13" fill="#eefbf3" stroke="#15803d" stroke-width="2"/>
<text x="65" y="636" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Exact finite whole pairs; fixed physical y</text>
<text x="65" y="668" font-family="Arial,sans-serif" font-size="19" fill="#122438">c_y = sum r_i b_y r_i in P*; b_y = E_P0(y)</text>
<text x="65" y="700" font-family="Arial,sans-serif" font-size="19" fill="#122438">error &lt; eps/2 + eps/(2 sqrt(2)) &lt; eps</text>
<text x="65" y="731" font-family="Arial,sans-serif" font-size="17" fill="#122438">OT.9-OT.10; both expectation orders are exact.</text>
<rect x="657" y="601" width="560" height="151" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="678" y="636" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Actual tensor Jones example</text>
<text x="678" y="665" font-family="Arial,sans-serif" font-size="17" fill="#122438">Q = 1 tensor 1 tensor R; N = M_2 tensor 1 tensor R</text>
<text x="678" y="690" font-family="Arial,sans-serif" font-size="17" fill="#122438">M = M_2 tensor M_2 tensor R; d = 4</text>
<text x="678" y="715" font-family="Arial,sans-serif" font-size="18" fill="#122438">tau(p) = rho_Q(p) = 1/2; local index = 1</text>
<text x="678" y="741" font-family="Arial,sans-serif" font-size="15" fill="#122438">OT.17-18: constructed operators; no theorem counterexample.</text>
<path d="M937 752 L937 763 M937 774 L937 785 M937 796 L937 807" stroke="#b45309" stroke-width="3" fill="none"/><polygon points="937,817 931,807 943,807" fill="#b45309"/>
<rect x="44" y="830" width="1173" height="112" rx="13" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="65" y="865" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#122438">Original unrestricted implication still required</text>
<text x="65" y="897" font-family="Arial,sans-serif" font-size="19" fill="#122438">General amenability → actual finite operator transfer, exact residual certificate, or cheap actual overlap.</text>
<text x="65" y="927" font-family="Arial,sans-serif" font-size="18" fill="#122438">No common stage, prefix or generating theorem is inferred from these individual-cell results.</text>
<text x="44" y="977" font-family="Arial,sans-serif" font-size="17" fill="#122438">All positions and areas are schematic; no trace geometry is inferred. Exact proof locators OT.1-OT.18.</text>
<text x="44" y="1007" font-family="Arial,sans-serif" font-size="17" fill="#122438">Sources: Popa(1994), pp.220-222; TakesakiIII XIX.2.6-2.8, pp.422-423. Dashed arrow marks the open input.</text>
</svg>