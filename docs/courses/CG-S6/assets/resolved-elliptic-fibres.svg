<svg xmlns="http://www.w3.org/2000/svg" width="620" height="850" viewBox="0 0 620 850" role="img" aria-labelledby="title desc">
<title id="title">Resolved elliptic fibres with every multiplicity</title>
<desc id="desc">The affine E6 intersection graph has multiplicities one two three two one on one chain and two one on the remaining arm. The visible section meets E2 plus and the zero section meets C. Type III has two multiplicity-one components of intersection two.</desc>
<rect width="620" height="850" fill="#fcfaf5"/>
<text x="310" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#213844">The resolved fibre over t = 0</text>
<text x="310" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#213844">Numbers inside nodes are fibre multiplicities.</text>
<path d="M110 148L210 215" fill="none" stroke="#315e73" stroke-width="3"/>
<path d="M210 215L310 282" fill="none" stroke="#315e73" stroke-width="3"/>
<path d="M310 282L410 215" fill="none" stroke="#315e73" stroke-width="3"/>
<path d="M410 215L510 148" fill="none" stroke="#315e73" stroke-width="3"/>
<path d="M310 282L310 394" fill="none" stroke="#315e73" stroke-width="3"/>
<path d="M310 394L310 506" fill="none" stroke="#315e73" stroke-width="3"/>
<circle cx="310" cy="282" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="290" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">3</text>
<text x="388" y="290" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">F₂</text>
<circle cx="210" cy="215" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="210" y="223" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">2</text>
<text x="210" y="180" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">E₁</text>
<circle cx="110" cy="148" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="110" y="156" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">1</text>
<text x="110" y="113" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">C</text>
<circle cx="410" cy="215" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="410" y="223" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">2</text>
<text x="410" y="180" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">F₁</text>
<circle cx="510" cy="148" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="510" y="156" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">1</text>
<text x="510" y="113" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">E₂,−</text>
<circle cx="310" cy="394" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">2</text>
<text x="388" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">F₃</text>
<circle cx="310" cy="506" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="514" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">1</text>
<text x="388" y="514" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">E₂,+</text>
<text x="90" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#213844">O meets C</text>
<text x="250" y="566" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">P* meets E₂,+</text>
<text x="310" y="607" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#213844">Every curve has square −2; every edge counts 1.</text>
<text x="310" y="655" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">The resolved fibre over t = 1</text>
<path d="M190 719L430 719" fill="none" stroke="#315e73" stroke-width="3"/>
<path d="M190 727L430 727" fill="none" stroke="#315e73" stroke-width="3"/>
<circle cx="190" cy="723" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<circle cx="430" cy="723" r="23" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="190" y="731" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">1</text>
<text x="430" y="731" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">1</text>
<text x="190" y="775" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">identity / O</text>
<text x="430" y="775" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">D / P*</text>
<text x="310" y="816" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">Both squares are −2; intersection is 2.</text>
</svg>
