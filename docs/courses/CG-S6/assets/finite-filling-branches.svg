<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="438" viewBox="0 0 1040 438" role="img" aria-labelledby="title description">
<title id="title">Every local branch of the actual ramified base change</title>
<desc id="description">The three branches for order three and the four branches for order four. Every branch has coordinates z one, z two, u. The branch charts are disjoint in the normalization, while the entire original central torus is connected.</desc>
<rect width="1040" height="438" rx="18" fill="#f3f6f3"/>
<g fill="#15343b" font-family="Georgia,serif" text-anchor="middle">
<text x="520" y="35" font-size="23">All branches of sᵐ − uᵐ = 0, with the original phases</text>
<text x="265" y="80" font-size="22">m₁ = 3 · ζ₁ = e⁻²πⁱ⁄³</text>
<text x="775" y="80" font-size="22">m₂ = 4 · ζ₂ = −i</text>
<g fill="white" stroke="#547978" stroke-width="1.5">
<rect x="70" y="103" width="390" height="47" rx="6"/>
<rect x="70" y="165" width="390" height="47" rx="6"/>
<rect x="70" y="227" width="390" height="47" rx="6"/>
<rect x="580" y="103" width="390" height="47" rx="6"/>
<rect x="580" y="165" width="390" height="47" rx="6"/>
<rect x="580" y="227" width="390" height="47" rx="6"/>
<rect x="580" y="289" width="390" height="47" rx="6"/>
</g>
<g font-size="21">
<text x="265" y="133">a = 0:  s = u</text>
<text x="265" y="195">a = 1:  s = e²πⁱ⁄³ u</text>
<text x="265" y="257">a = 2:  s = e⁴πⁱ⁄³ u</text>
<text x="775" y="133">a = 0:  s = u</text>
<text x="775" y="195">a = 1:  s = i u</text>
<text x="775" y="257">a = 2:  s = −u</text>
<text x="775" y="319">a = 3:  s = −i u</text>
</g>
<text x="265" y="316" font-size="18">u = ζⱼᵃs on the lifted chart GⱼᵃU</text>
<text x="520" y="378" font-size="19">Each box is a separate (z₁, z₂, u) chart in the normalization.</text>
<text x="520" y="411" font-size="18">Theorem 4.1: these local charts glue to the connected original central torus Tⱼ.</text>
</g>
</svg>
