<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1020" viewBox="0 0 620 1020" role="img" aria-labelledby="title desc">
<title id="title">The complete fundamental group through the actual attachments</title>
<desc id="desc">The middle group is the lattice semidirect a free group. The cusp kills its two torus cycles and its meridian; their normal closure leaves two commuting generators. The first finite filling imposes x cubed equals c; the second imposes x fourth equals x cubed, giving the trivial group.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315e73"/></marker></defs>
<rect width="620" height="1020" fill="#fcfaf5"/>
<text x="310" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#213844">The full group through each attachment</text>
<rect x="28" y="62" width="564" height="129" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="98" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">Middle family J</text>
<text x="310" y="137" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#213844">Λ ⋊ F(ρ₁, ρ₂)</text>
<text x="310" y="173" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">ρⱼ t(λ) ρⱼ⁻¹ = t(Aⱼλ)</text>
<text x="310" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Attach the cusp N₀</text>
<text x="310" y="265" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">Kill t(ŵ), t(δ̂) and a₀;  ρ₁ρ₂a₀ = 1.</text>
<text x="310" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#213844">A₁ŵ = û − ŵ forces û into the normal closure.</text>
<path d="M310 315V345" stroke="#315e73" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="357" width="564" height="113" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="394" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#213844">ℤ² generated by c and x</text>
<text x="310" y="431" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#213844">c = t(γ̂) is central;  x = ρ₁, y = ρ₂ = x⁻¹.</text>
<text x="310" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Attach the order-three filling N₁</text>
<text x="310" y="546" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">ρ₁³ = t(v₁), with γ(v₁) = +1:  x³ = c.</text>
<path d="M310 560V590" stroke="#315e73" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="602" width="564" height="91" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="640" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#213844">ℤ generated by x</text>
<text x="310" y="675" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">The relation replaces c by x³.</text>
<text x="310" y="733" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Attach the order-four filling N₂</text>
<text x="310" y="769" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#213844">ρ₂⁴ = t(v₂), with γ(v₂) = −1:  y⁴ = c⁻¹.</text>
<text x="310" y="804" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">Since y = x⁻¹,  x⁴ = c = x³.</text>
<path d="M310 817V848" stroke="#315e73" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="860" width="564" height="89" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="896" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#213844">x = 1, c = 1, y = 1</text>
<text x="310" y="933" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#213844">π₁(X) = 1</text>
<text x="310" y="991" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">All maps come from the specified based overlaps.</text>
</svg>
