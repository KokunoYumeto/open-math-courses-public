<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1080" viewBox="0 0 620 1080" role="img" aria-labelledby="title desc">
<title id="title">The complete family remembers the parity of a period shift</title>
<desc id="desc">The middle periods identify every integer shift. The order-four filling retains the shift modulo two. The complete objects are therefore parametrized by c modulo twice the integers, with w equal to exp minus pi i c. The two different values w and minus w have the same middle reference parameter lambda zero times w squared. Their finite classes differ.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315e73"/></marker></defs>
<rect width="620" height="1080" fill="#fcfaf5"/>
<text x="310" y="38" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Which period shifts identify the whole object?</text>
<rect x="28" y="65" width="564" height="120" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="103" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Middle family: every integer shift n</text>
<text x="310" y="145" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">Π<tspan baseline-shift="sub" font-size="70%">c+n</tspan> = Π<tspan baseline-shift="sub" font-size="70%">c</tspan>(I + nE),  E = δ̂ ⊗ γ,  E² = 0</text>
<path d="M310 197L310 233" stroke="#315e73" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="248" width="564" height="173" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="285" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#213844">Retain the actual finite equations</text>
<text x="310" y="326" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Nⱼℓⱼ = −(1 − a)vⱼ − nεⱼδ̂</text>
<text x="310" y="365" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">Order three: a = +1</text>
<text x="310" y="402" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">Order four: n must be even</text>
<path d="M310 433L310 469" stroke="#315e73" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="484" width="564" height="124" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="525" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#213844">Full threefold: c′ − c ∈ 2ℤ</text>
<text x="310" y="567" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">All even shifts extend over the original cusp.</text>
<text x="310" y="640" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">w = exp(−πic) parametrizes the full objects.</text>
<rect x="47" y="683" width="222" height="114" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<rect x="351" y="683" width="222" height="114" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="158" y="723" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#213844">w</text>
<text x="462" y="723" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#213844">−w</text>
<text x="158" y="761" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">X<tspan baseline-shift="sub" font-size="70%">c</tspan></text>
<text x="462" y="761" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">X<tspan baseline-shift="sub" font-size="70%">c+1</tspan></text>
<text x="310" y="829" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Different order-two finite classes</text>
<path d="M158 849L272 930" stroke="#315e73" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M462 849L348 930" stroke="#315e73" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="124" y="944" width="372" height="93" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="979" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Same middle parameter</text>
<text x="310" y="1016" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#213844">u<tspan baseline-shift="sub" font-size="70%">ref</tspan> = λ₀w²,  λ₀ ≠ 0</text>
<text x="310" y="1064" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#213844">Exact quotient maps: Sections 5–8 and Exercise 9.3.</text>
</svg>
