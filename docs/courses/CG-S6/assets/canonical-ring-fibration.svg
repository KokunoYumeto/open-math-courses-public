<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1020" viewBox="0 0 620 1020" role="img" aria-labelledby="title desc">
<title id="title">Recovering the original fibration from the anticanonical ring</title>
<desc id="desc">The finite characters give evaluation orders zero and two. The canonical line is O of minus two S2. Its anticanonical ring has generators u of degree one and v of degree two. The degree-two pencil is the original map f followed by beta, with full fibre divisors W, 3 S1 and 4 S2.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315e73"/></marker></defs>
<rect width="620" height="1020" fill="#fcfaf5"/>
<text x="310" y="38" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">The original fibres inside the graded ring</text>
<rect x="28" y="64" width="564" height="160" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="102" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">Base covers: t₁ = s₁³, t₂ = s₂⁴</text>
<text x="165" y="142" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">m₁ = 3, a₁ = 2</text>
<text x="455" y="142" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">m₂ = 4, a₂ = 1</text>
<text x="310" y="180" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">Evaluation order kⱼ = mⱼ − 1 − aⱼ</text>
<text x="165" y="210" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">k₁ = 0</text>
<text x="455" y="210" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">k₂ = 2</text>
<path d="M310 234V267" stroke="#315e73" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="280" width="564" height="125" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="317" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">Hodge line: 𝔎 ≅ O<tspan baseline-shift="sub" font-size="70%">B</tspan>(p₀)</text>
<text x="310" y="354" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">div(ev) = 2S₂;  fibre at p₂ = 4S₂</text>
<text x="310" y="388" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#213844">ω<tspan baseline-shift="sub" font-size="70%">X</tspan> ≅ O<tspan baseline-shift="sub" font-size="70%">X</tspan>(−2S₂)</text>
<path d="M310 417V451" stroke="#315e73" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="464" width="564" height="161" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="504" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#213844">R(X, −K<tspan baseline-shift="sub" font-size="70%">X</tspan>) = ℂ[u, v]</text>
<text x="310" y="544" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#213844">deg u = 1,   deg v = 2</text>
<text x="310" y="582" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">Degree m: uᵐ⁻²ʲvʲ,  0 ≤ j ≤ ⌊m/2⌋</text>
<text x="310" y="610" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">div(u) = 2S₂;  u² pulls back σp₂</text>
<path d="M310 637V670" stroke="#315e73" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="683" width="564" height="154" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="724" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">x ↦ [u(x)² : v(x)] = β(f(x))</text>
<text x="310" y="764" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">β(t) = [t − 1 : A + B(t − 1)]</text>
<text x="310" y="806" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">A ≠ 0;  β is a base isomorphism.</text>
<text x="310" y="885" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#213844">Original scheme-theoretic fibres</text>
<text x="115" y="930" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">p₀ = ∞</text>
<text x="310" y="930" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">p₁ = 0</text>
<text x="505" y="930" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">p₂ = 1</text>
<text x="115" y="970" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#213844">W</text>
<text x="310" y="970" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#213844">3S₁</text>
<text x="505" y="970" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#213844">4S₂</text>
<text x="310" y="1005" xml:space="preserve" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#213844">Exact maps and coefficients: Sections 2–7.</text>
</svg>
