<svg xmlns="http://www.w3.org/2000/svg" width="620" height="920" viewBox="0 0 620 920" role="img" aria-labelledby="title desc">
<title id="title">The six boundary curves and their exact identifications</title>
<desc id="desc">The top fan retains all six integral ray coordinates. Below is the schematic boundary hexagon: opposite edges are paired, and its vertices form two alternating triple-point classes. The three gluing units are written below.</desc>
<rect width="620" height="920" fill="#fcfaf5"/>
<text x="310" y="38" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#213844">The fan of E₀ = Bl₃ ℙ²</text>
<path d="M310 185L404 185" fill="none" stroke="#315e73" stroke-width="3"/>
<text x="443.48" y="193.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#315e73">(1, 0)</text>
<path d="M310 185L310 91" fill="none" stroke="#a34f36" stroke-width="3"/>
<text x="310.0" y="75.5" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#a34f36">(0, 1)</text>
<path d="M310 185L216 91" fill="none" stroke="#487352" stroke-width="3"/>
<text x="176.52" y="75.5" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#487352">(−1, 1)</text>
<path d="M310 185L216 185" fill="none" stroke="#315e73" stroke-width="3"/>
<text x="176.52" y="193.0" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#315e73">(−1, 0)</text>
<path d="M310 185L310 279" fill="none" stroke="#a34f36" stroke-width="3"/>
<text x="310.0" y="310.5" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#a34f36">(0, −1)</text>
<path d="M310 185L404 279" fill="none" stroke="#487352" stroke-width="3"/>
<text x="443.48" y="310.5" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#487352">(1, −1)</text>
<circle cx="310" cy="185" r="4" fill="#213844" stroke="#213844" stroke-width="2"/>
<text x="310" y="333" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">Adjacent rays have determinant 1.</text>
<text x="310" y="369" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Boundary incidence on the normalization</text>
<path d="M424.3153532995459 449.0L310.0 383.0" fill="none" stroke="#315e73" stroke-width="5"/>
<text x="390.0207473096821" y="384.4" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#315e73">e₁</text>
<path d="M310.0 383.0L195.68464670045412 448.99999999999994" fill="none" stroke="#a34f36" stroke-width="5"/>
<text x="229.97925269031788" y="384.4" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#a34f36">e₂</text>
<path d="M195.68464670045412 448.99999999999994L195.6846467004541 581.0" fill="none" stroke="#487352" stroke-width="5"/>
<text x="149.95850538063576" y="523.0" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#487352">e₂−e₁</text>
<path d="M195.6846467004541 581.0L310.0 647.0" fill="none" stroke="#315e73" stroke-width="5"/>
<text x="229.97925269031788" y="661.6" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#315e73">−e₁</text>
<path d="M310.0 647.0L424.3153532995459 581.0" fill="none" stroke="#a34f36" stroke-width="5"/>
<text x="390.0207473096821" y="661.6" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#a34f36">−e₂</text>
<path d="M424.3153532995459 581.0L424.3153532995459 449.0" fill="none" stroke="#487352" stroke-width="5"/>
<text x="470.04149461936424" y="523.0" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#487352">e₁−e₂</text>
<circle cx="424.3153532995459" cy="449.0" r="9" fill="#213844" stroke="#213844" stroke-width="2"/>
<circle cx="310.0" cy="383.0" r="9" fill="#fcfaf5" stroke="#213844" stroke-width="2"/>
<circle cx="195.68464670045412" cy="448.99999999999994" r="9" fill="#213844" stroke="#213844" stroke-width="2"/>
<circle cx="195.6846467004541" cy="581.0" r="9" fill="#fcfaf5" stroke="#213844" stroke-width="2"/>
<circle cx="310.0" cy="647.0" r="9" fill="#213844" stroke="#213844" stroke-width="2"/>
<circle cx="424.3153532995459" cy="581.0" r="9" fill="#fcfaf5" stroke="#213844" stroke-width="2"/>
<text x="310" y="682" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#213844">Opposite edges are identified; each has square −1.</text>
<text x="310" y="716" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">● / ○ mark the two triple-point classes.</text>
<text x="310" y="758" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">Exact multipliers in the same edge character</text>
<text x="310" y="800" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#315e73">e₁: exp(−2πiμ₀)</text>
<text x="310" y="842" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#a34f36">e₂: exp(12πiμ₀)</text>
<text x="310" y="884" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#487352">e₁−e₂: exp(−2πi(7μ₀+b₀))</text>
</svg>
