<svg xmlns="http://www.w3.org/2000/svg" width="620" height="830" viewBox="0 0 620 830" role="img" aria-labelledby="title desc">
<title id="title">Every period in the line-bundle quotient</title>
<desc id="desc">First divide by three periods, then by the signed first period. The exact contraction factor is exponential of two pi D.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315e73"/></marker></defs>
<rect width="620" height="830" fill="#fcfaf5"/>
<text x="310" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#213844">The four original periods</text>
<rect x="24" y="64" width="572" height="107" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="99" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">ℂ² with coordinates (ξ, η)</text>
<text x="310" y="143" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#213844">Π = ((6μ, τ, 1, 0), (β, μ, 0, 1))</text>
<path d="M310 215V242" stroke="#315e73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="310" y="203" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">(ξ, η) ↦ (ξ, exp(2πiη))</text>
<rect x="24" y="253" width="572" height="172" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="288" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">Lμ× over Eτ = ℂ / (ℤ + τℤ)</text>
<text x="310" y="324" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">(ξ, W) ∼ (ξ + 1, W)</text>
<text x="310" y="362" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">(ξ, W) ∼ (ξ + τ, exp(2πiμ)W)</text>
<text x="310" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">Lμ = O([μ] − [0])</text>
<path d="M310 501V519" stroke="#315e73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="310" y="460" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">A⁻¹(ξ, W) = (ξ − 6μ, exp(−2πiβ)W)</text>
<text x="310" y="493" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#213844">covers translation by −6[μ]</text>
<rect x="24" y="532" width="572" height="97" rx="12" fill="#eef4f3" stroke="#315e73" stroke-width="2"/>
<text x="310" y="567" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#213844">Lμ× / ⟨A⁻¹⟩  ≅  ℂ² / ΠΛ</text>
<text x="310" y="602" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">Every column of Π is retained.</text>
<rect x="24" y="653" width="572" height="148" rx="12" fill="#f5eee0" stroke="#977446" stroke-width="2"/>
<text x="310" y="688" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">N(A⁻¹x) / N(x) = exp(2πD)</text>
<text x="310" y="729" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#213844">D = Im β − 6(Im μ)² / Im τ</text>
<text x="310" y="768" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#213844">D &lt; 0 gives the contracting direction.</text>
</svg>
