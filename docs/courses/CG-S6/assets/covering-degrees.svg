<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title description">
<title id="title">The finite central surfaces and their covering degrees</title>
<desc id="description">In the order-three case, the product torus covers T1 with cyclic kernel of order three, then T1 covers S1 with degree three. The composite has degree nine and group C3 times C3. In the order-four case, the product torus covers T2 with cyclic kernel of order two, then T2 covers S2 with degree four. The composite has degree eight and group C2 times C4. The diagram depicts maps, not embeddings or surface shapes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#235365" stroke-width="1.6"/></marker></defs>
<rect width="1080" height="430" rx="18" fill="#f4f6f3"/>
<g font-family="Georgia,serif" fill="#142b36">
<text x="40" y="44" font-size="25">The covering degree keeps both finite factors</text>
<g text-anchor="middle" font-size="27">
<text x="165" y="127">E₁ × F₁</text><text x="525" y="127">T₁</text><text x="905" y="127">S₁</text>
<text x="165" y="307">E₂ × F₂</text><text x="525" y="307">T₂</text><text x="905" y="307">S₂</text>
</g>
<g stroke="#235365" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
<path d="M255,116 H458"/><path d="M588,116 H825"/>
<path d="M255,296 H458"/><path d="M588,296 H825"/>
<path d="M190,144 Q525,237 881,144"/><path d="M190,324 Q525,417 881,324"/>
</g>
<g text-anchor="middle" font-size="20">
<text x="355" y="92">kernel C₃ · degree 3</text><text x="708" y="92">group C₃ · degree 3</text>
<text x="525" y="208">C₃ × C₃ · degree 9</text>
<text x="355" y="272">kernel C₂ · degree 2</text><text x="708" y="272">group C₄ · degree 4</text>
<text x="525" y="388">C₂ × C₄ · degree 8</text>
</g>
<path d="M40,230 H1040" stroke="#bdc9ca"/>
</g></svg>
