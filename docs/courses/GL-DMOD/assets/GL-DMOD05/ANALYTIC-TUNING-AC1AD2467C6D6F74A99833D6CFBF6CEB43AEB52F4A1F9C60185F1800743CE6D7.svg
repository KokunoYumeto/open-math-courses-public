<svg xmlns="http://www.w3.org/2000/svg" width="430" height="820" viewBox="0 0 430 820" role="img" aria-labelledby="title desc">
<title id="title">Two-step analytic going-up calculation</title>
<desc id="desc">The ideal (x squared, x y cubed, y to the fourth), with marking two, restricts to y to the fourth on x equals zero. The first blow-up gives (u squared, y squared), which is not derivative-balanced. Its transported original derivative ideal is (u, y squared), whose square is contained in the transform. A second blow-up gives the unit ideal on both charts.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="430" height="820" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172554" font-size="16">
<text x="22" y="32" font-size="20" font-weight="bold">Going up: keep the original derivatives</text>
<text x="22" y="59">Complex surface; marking b = 2 throughout</text>
<rect x="20" y="80" width="390" height="114" rx="9" fill="#dbeafe" stroke="#2563eb"/>
<text x="35" y="107" font-weight="bold">Before blowing up</text>
<text x="35" y="134">A = (x², xy³, y⁴),   DA = (x, y³)</text>
<text x="35" y="160">(DA)² ⊂ A;  H: x = 0;  A|H = (y⁴)</text>
<text x="35" y="183" font-size="14">Centre: the origin, a closed smooth point.</text>
<path d="M215 198V246" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="223" font-size="14">x = uy; divide by y²</text>
<rect x="20" y="258" width="390" height="181" rx="9" fill="#fff7ed" stroke="#c2410c"/>
<text x="35" y="285" font-weight="bold">First controlled transform</text>
<text x="35" y="313">A₁ = (u², y²),   DA₁ = (u, y)</text>
<text x="35" y="341" fill="#9a3412">uy ∈ (DA₁)², but uy ∉ A₁</text>
<text x="35" y="369">Transported original DA:  (u, y²)</text>
<text x="35" y="397">(u, y²)² ⊂ A₁ still holds.</text>
<text x="35" y="425">H₁: u = 0;  A₁|H₁ = (y²)</text>
<path d="M215 444V495" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="468" font-size="14">Blow up the origin again.</text>
<rect x="20" y="510" width="390" height="128" rx="9" fill="#dcfce7" stroke="#15803d"/>
<text x="35" y="537" font-weight="bold">Second controlled transform: both charts</text>
<text x="35" y="566">u = vy:   A₂ = (v², 1) = O</text>
<text x="35" y="595">y = wu:  A₂ = (1, w²) = O</text>
<text x="35" y="623">On the strict H₂: the ideal is also O.</text>
<text x="24" y="676" font-weight="bold">What the example proves</text>
<text x="24" y="704">Balance can fail after a permissible step.</text>
<text x="24" y="732">Going-up uses the transported derivative ideal,</text>
<text x="24" y="756">not an assumed balance of the new ideal.</text>
<text x="24" y="790" font-size="13">Equations (6.83)–(6.85); exact chart calculation, not a plot.</text>
</g></svg>
