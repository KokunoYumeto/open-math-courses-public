<svg xmlns="http://www.w3.org/2000/svg" width="430" height="890" viewBox="0 0 430 890" role="img" aria-labelledby="title desc">
<title id="title">Analytic contact choices and their blow-up chart</title>
<desc id="desc">Exact real slices of complex curves. The map (x,y) to (x-y squared,y) takes x=0 to x=-y squared. In the y chart x=yu, it lifts to (u,y) to (u-y,y), taking u=0 to u=-y and preserving the origin and the exceptional divisor y=0.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#344054"/></marker></defs>
<rect width="430" height="890" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172b4d" text-anchor="middle">
<text x="215" y="27" font-size="19" font-weight="bold">Different contact choices, same centre</text>
<text x="215" y="49" font-size="14">Real slices; the proof concerns holomorphic germs</text>
<rect x="14" y="70" width="402" height="345" rx="12" fill="#f5f8fc" stroke="#c8d3e0"/>
<text x="215" y="96" font-size="18" font-weight="bold">Before blowing up: (x, y)</text>
<path d="M75,225 H363 M260,335 V117" stroke="#8e9aa9" fill="none" marker-end="url(#arrow)"/>
<text x="363" y="245" font-size="15">x</text><text x="279" y="122" font-size="15">y</text>
<path d="M260,315 V135" stroke="#1267b1" stroke-width="3"/>
<path d="M110,315 Q410,225 110,135" stroke="#984aba" stroke-width="3" fill="none"/>
<circle cx="260" cy="225" r="5" fill="#172b4d"/>
<text x="278" y="219" font-size="13">0</text>
<text x="303" y="295" font-size="15" fill="#1267b1">H₁: x = 0</text>
<text x="100" y="122" font-size="15" fill="#984aba">H₂: x = −y²</text>
<path d="M258,162 H189" stroke="#344054" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="225" y="151" font-size="13">φ</text>
<text x="215" y="365" font-size="17">J = (x, y²)²;  T = (x, y²)</text>
<text x="215" y="391" font-size="16">φ(x, y) = (x − y², y)</text>
<path d="M215,421 V446" stroke="#344054" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="14" y="456" width="402" height="347" rx="12" fill="#f5f8fc" stroke="#c8d3e0"/>
<text x="215" y="483" font-size="18" font-weight="bold">The y-chart: x = yu</text>
<path d="M62,615 H367 M215,720 V513" stroke="#8e9aa9" fill="none" marker-end="url(#arrow)"/>
<text x="373" y="634" font-size="15">u</text><text x="232" y="514" font-size="15">y</text>
<path d="M215,705 V525" stroke="#1267b1" stroke-width="3"/>
<path d="M350,705 L80,525" stroke="#984aba" stroke-width="3"/>
<path d="M72,615 H359" stroke="#ad6500" stroke-width="3" stroke-dasharray="8 5"/>
<circle cx="215" cy="615" r="6" fill="#172b4d"/>
<text x="272" y="537" font-size="15" fill="#1267b1">H₁′: u = 0</text>
<text x="113" y="511" font-size="15" fill="#984aba">H₂′: u = −y</text>
<text x="323" y="599" font-size="14" fill="#ad6500">E: y = 0</text>
<path d="M211,560 H139" stroke="#344054" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="175" y="550" font-size="13">φ′</text>
<text x="215" y="753" font-size="17">J′ = (u, y)²;  T′ = (u, y)</text>
<text x="215" y="779" font-size="16">φ′(u, y) = (u − y, y)</text>
<text x="215" y="834" font-size="15">The centre is the origin in both descriptions.</text>
<text x="215" y="858" font-size="14">Equations (6.68)–(6.69) retain the</text>
<text x="215" y="877" font-size="14">exceptional direction in every dimension.</text>
</g></svg>
