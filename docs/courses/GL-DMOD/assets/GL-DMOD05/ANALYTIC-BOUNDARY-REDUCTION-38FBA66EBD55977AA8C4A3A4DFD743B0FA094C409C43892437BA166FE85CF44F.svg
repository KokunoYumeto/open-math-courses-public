<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1010" viewBox="0 0 430 1010" role="img" aria-labelledby="title desc">
<title id="title">Finite marked boundary reduction and an infinite wrong choice</title>
<desc id="desc">For the ideal x cubed y cubed with marking two, the first phase blows up the two Cartier divisor centres, retaining their changed coefficients and labels. The point blow-up then gives ideal u in the chart x equals u y and ideal v in the chart y equals v x. Repeated point blow-ups before divisor reduction can instead generate the coefficients four, five, seven, ten and beyond. Theorem 6.19 and example 6.96 supply the proof.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176e72" stroke-width="1.5"/></marker></defs>
<rect width="430" height="1010" rx="12" fill="#f8f7ef"/>
<g font-family="Georgia,serif" fill="#153341">
<text x="22" y="34" font-size="22" font-weight="bold">Why the divisor phase comes first</text>
<text x="22" y="62" font-size="18">Marking m = 2 throughout. Near 0 in C².</text>
<rect x="20" y="84" width="390" height="104" rx="8" fill="#e8f1ee" stroke="#176e72"/>
<text x="36" y="113" font-size="21">I = (x³y³)</text>
<text x="36" y="141" font-size="18">E¹ : x = 0, coefficient 3</text>
<text x="36" y="166" font-size="18">E² : y = 0, coefficient 3</text>
<path d="M215 191 V236" stroke="#176e72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="234" y="213" font-size="17">Cartier centre E¹</text>
<text x="234" y="235" font-size="17">divide by x²</text>
<rect x="20" y="249" width="390" height="92" rx="8" fill="#e8f1ee" stroke="#176e72"/>
<text x="36" y="279" font-size="21">I₁ = (xy³)</text>
<text x="36" y="305" font-size="18">E² : 3; new E³ : x = 0, coefficient 1</text>
<text x="36" y="328" font-size="17">Old E¹ is empty. The surface is unchanged.</text>
<path d="M215 344 V389" stroke="#176e72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="234" y="366" font-size="17">Cartier centre E²</text>
<text x="234" y="388" font-size="17">divide by y²</text>
<rect x="20" y="402" width="390" height="90" rx="8" fill="#e8f1ee" stroke="#176e72"/>
<text x="36" y="431" font-size="21">I₂ = (xy)</text>
<text x="36" y="458" font-size="18">E³ : 1; new E⁴ : y = 0, coefficient 1</text>
<text x="36" y="481" font-size="17">Old E² is empty. Both coefficients &lt; 2.</text>
<path d="M215 495 V544" stroke="#176e72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="234" y="517" font-size="17">Point centre E³ ∩ E⁴</text>
<text x="234" y="539" font-size="17">value 1 + 1 = 2</text>
<rect x="20" y="557" width="390" height="123" rx="8" fill="#e8f1ee" stroke="#176e72"/>
<text x="36" y="586" font-size="19">Chart x = uy:  y⁻²(xy) = u</text>
<text x="36" y="616" font-size="19">Chart y = vx:  x⁻²(xy) = v</text>
<text x="36" y="646" font-size="18">Order ≤ 1 in both charts. Finished.</text>
<text x="36" y="670" font-size="17">New exceptional E⁵ has coefficient 0.</text>
<path d="M22 705 H408" stroke="#9faeae"/>
<text x="22" y="737" font-size="20" font-weight="bold">A permissible but infinite choice</text>
<text x="22" y="766" font-size="18">Skip the Cartier steps; blow up adjacent</text>
<text x="22" y="791" font-size="18">curve intersections again and again:</text>
<text x="35" y="825" font-size="21">(3,3) → (3,4) → (4,5) → (5,7) → …</text>
<text x="22" y="858" font-size="18">The new coefficient is a + b − 2.</text>
<text x="22" y="885" font-size="18">Subtracting 2 gives positive Fibonacci</text>
<text x="22" y="910" font-size="18">recurrence: this chain never terminates.</text>
<path d="M22 931 H408" stroke="#9faeae"/>
<text x="22" y="956" font-size="16">Proof: Theorem 6.19, formulas (6.91)–(6.96).</text>
<text x="22" y="980" font-size="15">Exact chart calculation, not a geometric scale drawing.</text>
</g></svg>
