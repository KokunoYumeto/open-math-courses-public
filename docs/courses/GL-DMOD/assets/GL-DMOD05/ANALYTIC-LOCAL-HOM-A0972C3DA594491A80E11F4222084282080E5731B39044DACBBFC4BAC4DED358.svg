<svg xmlns="http://www.w3.org/2000/svg" width="430" height="850" viewBox="0 0 430 850" role="img" aria-labelledby="title desc">
<title id="title">Finite local Hom for holonomic analytic germs</title>
<desc id="desc">A proof schematic, not a geometric plot. Positive characteristic multiplicities give finite length. A connected smooth support piece approaches the original point and carries the determinant-twisted supported connection. A horizontal endomorphism has a constant characteristic polynomial, forcing every endomorphism of a simple germ to be scalar. Composition series then bound the dimension of Hom.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#476078"/></marker></defs>
<rect width="430" height="850" rx="18" fill="#f6f8fc"/>
<g font-family="sans-serif" text-anchor="middle" fill="#152d45"><text x="215" y="37" font-size="23" font-weight="bold">From a germ to finite Hom</text><text x="215" y="67" font-size="18">Lemmas 6.7–6.8 · Theorem 6.9</text></g>
<g fill="white" stroke="#7994aa" stroke-width="1.5"><rect x="20" y="90" width="390" height="100" rx="12"/><rect x="20" y="230" width="390" height="145" rx="12"/><rect x="20" y="415" width="390" height="100" rx="12"/><rect x="20" y="555" width="390" height="110" rx="12"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#152d45" font-size="20"><text x="215" y="122">Positive characteristic multiplicities</text><text x="215" y="150">bound strict chains:</text><text x="215" y="178" font-weight="bold">finite length</text><text x="215" y="262">Connected support piece W</text><text x="215" y="290">with x in its closure</text><text x="215" y="322">Finite-rank connection on W</text><text x="215" y="351" font-size="18">Keep the determinant conormal twist</text><text x="215" y="445">Horizontal endomorphism on W</text><text x="215" y="473">has a constant</text><text x="215" y="501">characteristic polynomial</text><text x="215" y="586">For a simple germ, End = C</text><text x="215" y="616" font-size="18">A nonscalar map would be invertible</text><text x="215" y="644" font-size="18">near x: contradiction on W</text></g>
<g stroke="#476078" stroke-width="2.5" marker-end="url(#arrow)"><path d="M215 195V221"/><path d="M215 380V406"/><path d="M215 520V546"/><path d="M215 670V696"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#152d45"><text x="215" y="730" font-size="23" font-weight="bold">dim Hom(M, N) ≤</text><text x="215" y="762" font-size="23" font-weight="bold">length(M) · length(N)</text><text x="215" y="801" font-size="18">No algebraicity or</text><text x="215" y="829" font-size="18">regular-singularity assumption</text></g>
</svg>
