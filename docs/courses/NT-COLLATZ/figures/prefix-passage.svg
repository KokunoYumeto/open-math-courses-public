<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" role="img" aria-labelledby="t d">
<title id="t">Equal totals do not determine prefix excursions</title>
<desc id="d">The word 3,3,3,1,1,1 has deviations 0,1,2,3,2,1,0 and reaches the excluded boundary 3. The word 3,1,3,1,3,1 has deviations 0,1,0,1,0,1,0 and remains in the strict strip.</desc>
<rect width="440" height="500" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#183046">
<text x="220" y="34" text-anchor="middle" font-size="20">Same total, different earlier paths</text>
<rect x="70" y="110" width="300" height="216" fill="#edf5f5"/>
<path d="M70 326 H370" stroke="#a03f35" stroke-dasharray="7 5"/>
<text x="57" y="331" text-anchor="end" font-size="15">-3</text>
<path d="M70 290 H370" stroke="#c7d5df"/>
<text x="57" y="295" text-anchor="end" font-size="15">-2</text>
<path d="M70 254 H370" stroke="#c7d5df"/>
<text x="57" y="259" text-anchor="end" font-size="15">-1</text>
<path d="M70 218 H370" stroke="#c7d5df"/>
<text x="57" y="223" text-anchor="end" font-size="15">0</text>
<path d="M70 182 H370" stroke="#c7d5df"/>
<text x="57" y="187" text-anchor="end" font-size="15">1</text>
<path d="M70 146 H370" stroke="#c7d5df"/>
<text x="57" y="151" text-anchor="end" font-size="15">2</text>
<path d="M70 110 H370" stroke="#a03f35" stroke-dasharray="7 5"/>
<text x="57" y="115" text-anchor="end" font-size="15">3</text>
<text x="70" y="352" text-anchor="middle" font-size="15">0</text>
<text x="120" y="352" text-anchor="middle" font-size="15">1</text>
<text x="170" y="352" text-anchor="middle" font-size="15">2</text>
<text x="220" y="352" text-anchor="middle" font-size="15">3</text>
<text x="270" y="352" text-anchor="middle" font-size="15">4</text>
<text x="320" y="352" text-anchor="middle" font-size="15">5</text>
<text x="370" y="352" text-anchor="middle" font-size="15">6</text>
<polyline points="70,218 120,182 170,146 220,110 270,146 320,182 370,218" fill="none" stroke="#a64532" stroke-width="3.5"/>
<circle cx="70" cy="218" r="4" fill="#a64532"/>
<circle cx="120" cy="182" r="4" fill="#a64532"/>
<circle cx="170" cy="146" r="4" fill="#a64532"/>
<circle cx="220" cy="110" r="4" fill="#a64532"/>
<circle cx="270" cy="146" r="4" fill="#a64532"/>
<circle cx="320" cy="182" r="4" fill="#a64532"/>
<circle cx="370" cy="218" r="4" fill="#a64532"/>
<polyline points="70,218 120,182 170,218 220,182 270,218 320,182 370,218" fill="none" stroke="#126d8a" stroke-width="3.5" stroke-dasharray="6 4"/>
<circle cx="70" cy="218" r="4" fill="#126d8a"/>
<circle cx="120" cy="182" r="4" fill="#126d8a"/>
<circle cx="170" cy="218" r="4" fill="#126d8a"/>
<circle cx="220" cy="182" r="4" fill="#126d8a"/>
<circle cx="270" cy="218" r="4" fill="#126d8a"/>
<circle cx="320" cy="182" r="4" fill="#126d8a"/>
<circle cx="370" cy="218" r="4" fill="#126d8a"/>
<circle cx="220" cy="110" r="10" fill="none" stroke="#a64532" stroke-width="2"/>
<text x="220" y="86" text-anchor="middle" font-size="16">Boundary reached at k = 3</text>
<text x="220" y="380" text-anchor="middle" font-size="17">Prefix length k</text>
<text x="24" y="218" transform="rotate(-90 24 218)" text-anchor="middle" font-size="16">Valuation sum minus 2k</text>
<text x="80" y="412" fill="#a64532" font-size="17">3, 3, 3, 1, 1, 1</text>
<text x="80" y="440" fill="#126d8a" font-size="17">3, 1, 3, 1, 3, 1</text>
<text x="220" y="478" text-anchor="middle" font-size="16">Both dashed boundaries are excluded.</text>
</g></svg>
