<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Uniform lifting preserves the total and coarse residue masses</title>
<desc id="desc">At total three, the joint law puts mass one eighth at residues two and four modulo nine. Lifting from modulo three puts mass one twenty-fourth at residues one, two, four, five, seven and eight. Both panels have total mass one quarter.</desc>
<rect width="1000" height="390" fill="white"/>
<g font-family="sans-serif" fill="#172033">
<text x="260" y="35" font-size="20" text-anchor="middle">Original joint masses at S₂ = 3</text>
<line x1="65" x2="430" y1="295.0" y2="295.0" stroke="#d9e1eb"/>
<text x="58" y="300.0" font-size="14" text-anchor="end">0</text>
<line x1="65" x2="430" y1="228.33333333333334" y2="228.33333333333334" stroke="#d9e1eb"/>
<text x="58" y="233.33333333333334" font-size="14" text-anchor="end">1/24</text>
<line x1="65" x2="430" y1="161.66666666666669" y2="161.66666666666669" stroke="#d9e1eb"/>
<text x="58" y="166.66666666666669" font-size="14" text-anchor="end">1/12</text>
<line x1="65" x2="430" y1="95.0" y2="95.0" stroke="#d9e1eb"/>
<text x="58" y="100.0" font-size="14" text-anchor="end">1/8</text>
<text x="70" y="318" font-size="15" text-anchor="middle">0</text>
<text x="111" y="318" font-size="15" text-anchor="middle">1</text>
<rect x="141" y="95.0" width="22" height="200.0" fill="#b45309"/>
<text x="152" y="85.0" font-size="14" text-anchor="middle">1/8</text>
<text x="152" y="318" font-size="15" text-anchor="middle">2</text>
<text x="193" y="318" font-size="15" text-anchor="middle">3</text>
<rect x="223" y="95.0" width="22" height="200.0" fill="#1d4ed8"/>
<text x="234" y="85.0" font-size="14" text-anchor="middle">1/8</text>
<text x="234" y="318" font-size="15" text-anchor="middle">4</text>
<text x="275" y="318" font-size="15" text-anchor="middle">5</text>
<text x="316" y="318" font-size="15" text-anchor="middle">6</text>
<text x="357" y="318" font-size="15" text-anchor="middle">7</text>
<text x="398" y="318" font-size="15" text-anchor="middle">8</text>
<text x="240" y="344" font-size="16" text-anchor="middle">Offset residue modulo 9</text>
<text x="760" y="35" font-size="20" text-anchor="middle">Uniform lift from residues modulo 3</text>
<line x1="565" x2="930" y1="295.0" y2="295.0" stroke="#d9e1eb"/>
<text x="558" y="300.0" font-size="14" text-anchor="end">0</text>
<line x1="565" x2="930" y1="228.33333333333334" y2="228.33333333333334" stroke="#d9e1eb"/>
<text x="558" y="233.33333333333334" font-size="14" text-anchor="end">1/24</text>
<line x1="565" x2="930" y1="161.66666666666669" y2="161.66666666666669" stroke="#d9e1eb"/>
<text x="558" y="166.66666666666669" font-size="14" text-anchor="end">1/12</text>
<line x1="565" x2="930" y1="95.0" y2="95.0" stroke="#d9e1eb"/>
<text x="558" y="100.0" font-size="14" text-anchor="end">1/8</text>
<text x="570" y="318" font-size="15" text-anchor="middle">0</text>
<rect x="600" y="228.33333333333334" width="22" height="66.66666666666666" fill="#1d4ed8"/>
<text x="611" y="218.33333333333334" font-size="14" text-anchor="middle">1/24</text>
<text x="611" y="318" font-size="15" text-anchor="middle">1</text>
<rect x="641" y="228.33333333333334" width="22" height="66.66666666666666" fill="#b45309"/>
<text x="652" y="218.33333333333334" font-size="14" text-anchor="middle">1/24</text>
<text x="652" y="318" font-size="15" text-anchor="middle">2</text>
<text x="693" y="318" font-size="15" text-anchor="middle">3</text>
<rect x="723" y="228.33333333333334" width="22" height="66.66666666666666" fill="#1d4ed8"/>
<text x="734" y="218.33333333333334" font-size="14" text-anchor="middle">1/24</text>
<text x="734" y="318" font-size="15" text-anchor="middle">4</text>
<rect x="764" y="228.33333333333334" width="22" height="66.66666666666666" fill="#b45309"/>
<text x="775" y="218.33333333333334" font-size="14" text-anchor="middle">1/24</text>
<text x="775" y="318" font-size="15" text-anchor="middle">5</text>
<text x="816" y="318" font-size="15" text-anchor="middle">6</text>
<rect x="846" y="228.33333333333334" width="22" height="66.66666666666666" fill="#1d4ed8"/>
<text x="857" y="218.33333333333334" font-size="14" text-anchor="middle">1/24</text>
<text x="857" y="318" font-size="15" text-anchor="middle">7</text>
<rect x="887" y="228.33333333333334" width="22" height="66.66666666666666" fill="#b45309"/>
<text x="898" y="218.33333333333334" font-size="14" text-anchor="middle">1/24</text>
<text x="898" y="318" font-size="15" text-anchor="middle">8</text>
<text x="740" y="344" font-size="16" text-anchor="middle">Offset residue modulo 9</text>
<text x="500" y="378" font-size="16" text-anchor="middle">Blue: residue 1 modulo 3 · Ochre: residue 2 modulo 3 · Total mass in each panel: 1/4</text>
</g></svg>
