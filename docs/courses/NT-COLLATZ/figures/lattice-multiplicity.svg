<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590" role="img" aria-labelledby="title desc">
<title id="title">Strict integer levels and their cumulative counting error</title>
<desc id="desc">For A=40 and Delta=2/5, levels minus two through two have populations2,3,2,3,2. Their cumulative errors from mean5/2 alternate between minus1/2 and zero.</desc>
<rect width="920" height="590" fill="#fbfaf7"/><g font-family="Georgia,serif" fill="#152b39">
<text x="35" y="38" font-size="24">Unequal populations, bounded cumulative error</text>
<text x="35" y="71" font-size="18">d(ν) = floor(40 − 2ν/5) + 1.  Retain |d| &lt; 3.</text>
<text x="35" y="112" font-size="18">Level d</text>
<text x="255" y="112" font-size="21" text-anchor="middle">-2</text>
<rect x="214" y="134" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="255" y="157" font-size="18" text-anchor="middle">ν = 106</text>
<rect x="214" y="172" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="255" y="195" font-size="18" text-anchor="middle">ν = 107</text>
<text x="255" y="284" text-anchor="middle" font-size="21">2</text>
<text x="390" y="112" font-size="21" text-anchor="middle">-1</text>
<rect x="349" y="134" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="390" y="157" font-size="18" text-anchor="middle">ν = 103</text>
<rect x="349" y="172" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="390" y="195" font-size="18" text-anchor="middle">ν = 104</text>
<rect x="349" y="210" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="390" y="233" font-size="18" text-anchor="middle">ν = 105</text>
<text x="390" y="284" text-anchor="middle" font-size="21">3</text>
<text x="525" y="112" font-size="21" text-anchor="middle">0</text>
<rect x="484" y="134" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="525" y="157" font-size="18" text-anchor="middle">ν = 101</text>
<rect x="484" y="172" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="525" y="195" font-size="18" text-anchor="middle">ν = 102</text>
<text x="525" y="284" text-anchor="middle" font-size="21">2</text>
<text x="660" y="112" font-size="21" text-anchor="middle">1</text>
<rect x="619" y="134" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="660" y="157" font-size="18" text-anchor="middle">ν = 98</text>
<rect x="619" y="172" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="660" y="195" font-size="18" text-anchor="middle">ν = 99</text>
<rect x="619" y="210" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="660" y="233" font-size="18" text-anchor="middle">ν = 100</text>
<text x="660" y="284" text-anchor="middle" font-size="21">3</text>
<text x="795" y="112" font-size="21" text-anchor="middle">2</text>
<rect x="754" y="134" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="795" y="157" font-size="18" text-anchor="middle">ν = 96</text>
<rect x="754" y="172" width="82" height="31" rx="5" fill="#d8ebe8" stroke="#16736b"/>
<text x="795" y="195" font-size="18" text-anchor="middle">ν = 97</text>
<text x="795" y="284" text-anchor="middle" font-size="21">2</text>
<text x="35" y="157" font-size="18">Integer times</text>
<text x="35" y="284" font-size="18">Population a(d)</text>
<text x="35" y="330" font-size="18">Cumulative sum of a(d) − 5/2, starting at d = −2</text>
<line x1="210" y1="385" x2="840" y2="385" stroke="#b8c5cb"/>
<text x="173" y="391" font-size="18" text-anchor="end">0</text>
<line x1="210" y1="445" x2="840" y2="445" stroke="#b8c5cb"/>
<text x="173" y="451" font-size="18" text-anchor="end">−1/2</text>
<line x1="210" y1="505" x2="840" y2="505" stroke="#b8c5cb"/>
<text x="173" y="511" font-size="18" text-anchor="end">−1</text>
<circle cx="255" cy="445.0" r="6" fill="#204d81"/>
<text x="255" y="533" text-anchor="middle" font-size="18">-2</text>
<circle cx="390" cy="385.0" r="6" fill="#204d81"/>
<text x="390" y="533" text-anchor="middle" font-size="18">-1</text>
<circle cx="525" cy="445.0" r="6" fill="#204d81"/>
<text x="525" y="533" text-anchor="middle" font-size="18">0</text>
<circle cx="660" cy="385.0" r="6" fill="#204d81"/>
<text x="660" y="533" text-anchor="middle" font-size="18">1</text>
<circle cx="795" cy="445.0" r="6" fill="#204d81"/>
<text x="795" y="533" text-anchor="middle" font-size="18">2</text>
<polyline points="255,445.0 390,385.0 525,445.0 660,385.0 795,445.0" fill="none" stroke="#204d81" stroke-width="2"/>
<text x="35" y="568" font-size="17">Each prefix error has absolute value ≤ 1; no error accumulates with the number of levels.</text>
</g></svg>
