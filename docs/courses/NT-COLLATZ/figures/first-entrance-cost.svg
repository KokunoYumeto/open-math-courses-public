<svg xmlns="http://www.w3.org/2000/svg" width="820" height="565" viewBox="0 0 820 565" role="img" aria-labelledby="title desc">
<title id="title">Distinct states before the first entrance</title>
<desc id="desc">The actual odd orbit 7,11,17,13,5,1 first reaches at most two at its fifth return. Its previous five states are distinct. Sorting only to bound the sum gives 5,7,11,13,17, at least 3,5,7,9,11 respectively.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#25645f"/></marker></defs>
<rect width="820" height="565" rx="16" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#183147">
<text x="30" y="42" font-size="23" font-weight="bold">First entrance controls an accumulated cost</text>
<text x="30" y="77" font-size="18">Actual odd-return orbit, with target H = 2</text>
<path d="M105 135H185" stroke="#25645f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M235 135H315" stroke="#25645f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M365 135H445" stroke="#25645f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M495 135H575" stroke="#25645f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625 135H705" stroke="#25645f" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="80" cy="135" r="23" fill="#dfede9"/><text x="80" y="142" text-anchor="middle" font-size="21">7</text>
<circle cx="210" cy="135" r="23" fill="#dfede9"/><text x="210" y="142" text-anchor="middle" font-size="21">11</text>
<circle cx="340" cy="135" r="23" fill="#dfede9"/><text x="340" y="142" text-anchor="middle" font-size="21">17</text>
<circle cx="470" cy="135" r="23" fill="#dfede9"/><text x="470" y="142" text-anchor="middle" font-size="21">13</text>
<circle cx="600" cy="135" r="23" fill="#dfede9"/><text x="600" y="142" text-anchor="middle" font-size="21">5</text>
<circle cx="730" cy="135" r="23" fill="#ecddea"/><text x="730" y="142" text-anchor="middle" font-size="21">1</text>
<text x="30" y="197" font-size="18">The five states before entrance are distinct, but not monotone.</text>
<rect x="25" y="229" width="770" height="188" rx="10" fill="#e4efed"/>
<text x="45" y="261" font-size="18" font-weight="bold">Reorder only for the reciprocal sum</text>
<text x="125" y="304" text-anchor="middle" font-size="22">5</text><text x="125" y="341" text-anchor="middle" font-size="21">≥</text><text x="125" y="378" text-anchor="middle" font-size="22">3</text>
<text x="255" y="304" text-anchor="middle" font-size="22">7</text><text x="255" y="341" text-anchor="middle" font-size="21">≥</text><text x="255" y="378" text-anchor="middle" font-size="22">5</text>
<text x="385" y="304" text-anchor="middle" font-size="22">11</text><text x="385" y="341" text-anchor="middle" font-size="21">≥</text><text x="385" y="378" text-anchor="middle" font-size="22">7</text>
<text x="515" y="304" text-anchor="middle" font-size="22">13</text><text x="515" y="341" text-anchor="middle" font-size="21">≥</text><text x="515" y="378" text-anchor="middle" font-size="22">9</text>
<text x="645" y="304" text-anchor="middle" font-size="22">17</text><text x="645" y="341" text-anchor="middle" font-size="21">≥</text><text x="645" y="378" text-anchor="middle" font-size="22">11</text>
<text x="45" y="402" font-size="16">Lower row: the five smallest odd integers strictly above H.</text>
<text x="30" y="460" font-size="19">Σ 1/Mᵢ ≤ 1/3 + 1/5 + 1/7 + 1/9 + 1/11</text>
<text x="30" y="499" font-size="18">An integral bounds this sum logarithmically in the number of returns.</text>
<text x="30" y="533" font-size="17">This is a bound on an orbit cost, not a change to the trajectory.</text>
</g></svg>