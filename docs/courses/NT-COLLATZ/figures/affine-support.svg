<svg xmlns="http://www.w3.org/2000/svg" width="840" height="530" viewBox="0 0 840 530" role="img" aria-labelledby="title desc">
<title id="title">Changing a weight and changing the support</title>
<desc id="desc">The true source is 9 and the offset-free comparison point is 28/3. The three exact bands are [9,10), [37/4,12), and [9,28/3). Their selectors respectively include both points, only the comparison point, and only the actual source. Each band contains a positive odd integer.</desc>
<rect width="840" height="530" fill="#faf9f6"/>
<g font-family="Georgia,serif" fill="#172b3a">
<text x="30" y="36" font-size="24">One return: (3 × 9 + 1) / 4 = 7</text>
<text x="30" y="66" font-size="18">Actual N = 9; comparison N⁰ = 28/3; relative defect α = 1/28.</text>

<text x="30" y="100" font-size="20">[9, 10)</text>
<line x1="150" x2="710" y1="135" y2="135" stroke="#93a0aa" stroke-width="2"/>
<line x1="190.0" x2="350.0" y1="135" y2="135" stroke="#b9d7df" stroke-width="16"/>
<circle cx="190.0" cy="135" r="7" fill="#38768a"/>
<circle cx="350.0" cy="135" r="7" fill="#faf9f6" stroke="#38768a" stroke-width="3"/>
<line x1="190.0" x2="190.0" y1="118" y2="148" stroke="#254e70" stroke-width="2"/>
<circle cx="190.0" cy="118" r="5" fill="#254e70" stroke="#254e70" stroke-width="2"/>
<text x="182.0" y="171" text-anchor="end" font-size="17" fill="#254e70">N = 9</text>
<line x1="243.33333333333334" x2="243.33333333333334" y1="118" y2="148" stroke="#9b4a24" stroke-width="2"/>
<circle cx="243.33333333333334" cy="118" r="5" fill="#9b4a24" stroke="#9b4a24" stroke-width="2"/>
<text x="251.33333333333334" y="171" text-anchor="start" font-size="17" fill="#9b4a24">N⁰ = 28/3</text>
<text x="30" y="204" font-size="18">Both included: only the reciprocal weight changes.</text>
<text x="30" y="230" font-size="20">[37/4, 12)</text>
<line x1="150" x2="710" y1="265" y2="265" stroke="#93a0aa" stroke-width="2"/>
<line x1="230.0" x2="670.0" y1="265" y2="265" stroke="#b9d7df" stroke-width="16"/>
<circle cx="230.0" cy="265" r="7" fill="#38768a"/>
<circle cx="670.0" cy="265" r="7" fill="#faf9f6" stroke="#38768a" stroke-width="3"/>
<line x1="190.0" x2="190.0" y1="248" y2="278" stroke="#254e70" stroke-width="2"/>
<circle cx="190.0" cy="248" r="5" fill="#faf9f6" stroke="#254e70" stroke-width="2"/>
<text x="182.0" y="301" text-anchor="end" font-size="17" fill="#254e70">N = 9</text>
<line x1="243.33333333333334" x2="243.33333333333334" y1="248" y2="278" stroke="#9b4a24" stroke-width="2"/>
<circle cx="243.33333333333334" cy="248" r="5" fill="#9b4a24" stroke="#9b4a24" stroke-width="2"/>
<text x="251.33333333333334" y="301" text-anchor="start" font-size="17" fill="#9b4a24">N⁰ = 28/3</text>
<text x="30" y="334" font-size="18">Comparison only: the source lies below the lower boundary.</text>
<text x="30" y="360" font-size="20">[9, 28/3)</text>
<line x1="150" x2="710" y1="395" y2="395" stroke="#93a0aa" stroke-width="2"/>
<line x1="190.0" x2="243.33333333333334" y1="395" y2="395" stroke="#b9d7df" stroke-width="16"/>
<circle cx="190.0" cy="395" r="7" fill="#38768a"/>
<circle cx="243.33333333333334" cy="395" r="7" fill="#faf9f6" stroke="#38768a" stroke-width="3"/>
<line x1="190.0" x2="190.0" y1="378" y2="408" stroke="#254e70" stroke-width="2"/>
<circle cx="190.0" cy="378" r="5" fill="#254e70" stroke="#254e70" stroke-width="2"/>
<text x="182.0" y="431" text-anchor="end" font-size="17" fill="#254e70">N = 9</text>
<line x1="243.33333333333334" x2="243.33333333333334" y1="378" y2="408" stroke="#9b4a24" stroke-width="2"/>
<circle cx="243.33333333333334" cy="378" r="5" fill="#faf9f6" stroke="#9b4a24" stroke-width="2"/>
<text x="251.33333333333334" y="431" text-anchor="start" font-size="17" fill="#9b4a24">N⁰ = 28/3</text>
<text x="30" y="464" font-size="18">Actual only: the comparison point is at the excluded upper end.</text>
<text x="30" y="511" font-size="16">Filled band endpoint: included. Open band endpoint: excluded. Points use the same convention.</text></g></svg>
