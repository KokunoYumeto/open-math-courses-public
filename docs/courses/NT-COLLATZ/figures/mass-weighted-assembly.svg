<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img" aria-labelledby="title desc">
<title id="title">Summing errors against actual mass</title>
<desc id="desc">Three time slices have actual masses one fifth, three tenths, and one half. At relative coefficient one tenth and absolute remainder one hundredth per time, the absorbed errors are one thirtieth, two forty-fifths, and one fifteenth. Their sum is thirteen ninetieths.</desc>
<rect width="440" height="460" fill="#f5f8fa"/>
<g font-family="Arial, sans-serif" fill="#172c38">
<text x="24" y="32" font-size="20" font-weight="bold">Errors follow their actual masses</text>
<text x="24" y="59" font-size="15">Relative coefficient 1/10; remainder 1/100 per time</text>
<text x="24" y="96" font-size="17">Time 1: actual mass 1/5</text>
<rect x="24" y="108" width="106.66666666666667" height="32" fill="#276e87"/>
<rect x="130.66666666666669" y="108" width="53.333333333333336" height="32" fill="#a85917"/>
<text x="77.33333333333334" y="130" text-anchor="middle" fill="white" font-size="15">1/45</text>
<text x="157.33333333333334" y="130" text-anchor="middle" fill="white" font-size="15">1/90</text>
<text x="24" y="162" font-size="16">Total error = 1/30</text>
<text x="24" y="194" font-size="17">Time 2: actual mass 3/10</text>
<rect x="24" y="206" width="160.0" height="32" fill="#276e87"/>
<rect x="184.0" y="206" width="53.333333333333336" height="32" fill="#a85917"/>
<text x="104.0" y="228" text-anchor="middle" fill="white" font-size="15">1/30</text>
<text x="210.66666666666666" y="228" text-anchor="middle" fill="white" font-size="15">1/90</text>
<text x="24" y="260" font-size="16">Total error = 2/45</text>
<text x="24" y="292" font-size="17">Time 3: actual mass 1/2</text>
<rect x="24" y="304" width="266.6666666666667" height="32" fill="#276e87"/>
<rect x="290.6666666666667" y="304" width="53.333333333333336" height="32" fill="#a85917"/>
<text x="157.33333333333334" y="326" text-anchor="middle" fill="white" font-size="15">1/18</text>
<text x="317.33333333333337" y="326" text-anchor="middle" fill="white" font-size="15">1/90</text>
<text x="24" y="358" font-size="16">Total error = 1/15</text>
<rect x="24" y="373" width="14" height="14" fill="#276e87"/>
<text x="47" y="385" font-size="15">Relative part: actual mass / 9</text>
<rect x="24" y="399" width="14" height="14" fill="#a85917"/>
<text x="47" y="411" font-size="15">Absolute part: 1/90 at each time</text>
<text x="24" y="443" font-size="18" font-weight="bold">Sum = 1/9 + 1/30 = 13/90</text>
</g></svg>
