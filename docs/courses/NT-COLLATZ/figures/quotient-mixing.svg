<svg xmlns="http://www.w3.org/2000/svg" width="840" height="510" viewBox="0 0 840 510" role="img" aria-labelledby="title desc">
  <title id="title">Averaging within residue classes modulo three</title>
  <desc id="desc">On nine states, the original distribution has mass one quarter at zero, one, three and four. Reduction modulo three gives class masses one half, one half and zero. Uniform lifting gives each of zero, three, six, one, four and seven mass one sixth; the other states have mass zero.</desc>
  <rect width="840" height="510" rx="14" fill="#f8fafc"/>
  <g font-family="Georgia,serif" fill="#17243b" text-anchor="middle">
    <text x="420" y="36" font-size="23">Keep each class mass; average inside the class</text>
    <text x="145" y="75" font-size="18">Residue 0</text>
    <text x="420" y="75" font-size="18">Residue 1</text>
    <text x="695" y="75" font-size="18">Residue 2</text>
  </g>
  <g stroke="#cbd5e1" fill="#ffffff">
    <rect x="20" y="90" width="250" height="350" rx="8"/>
    <rect x="295" y="90" width="250" height="350" rx="8"/>
    <rect x="570" y="90" width="250" height="350" rx="8"/>
  </g>
  <g font-family="Georgia,serif" font-size="17" fill="#17243b" text-anchor="middle">
    <text x="67" y="123">State</text><text x="140" y="123">μ</text><text x="220" y="123">Pμ</text>
    <text x="342" y="123">State</text><text x="415" y="123">μ</text><text x="495" y="123">Pμ</text>
    <text x="617" y="123">State</text><text x="690" y="123">μ</text><text x="770" y="123">Pμ</text>
  </g>
  <g stroke="#e2e8f0"><path d="M35 140H255 M310 140H530 M585 140H805"/></g>
  <g font-family="Georgia,serif" font-size="20" text-anchor="middle">
    <g fill="#17243b"><text x="67" y="184">0</text><text x="67" y="239">3</text><text x="67" y="294">6</text><text x="342" y="184">1</text><text x="342" y="239">4</text><text x="342" y="294">7</text><text x="617" y="184">2</text><text x="617" y="239">5</text><text x="617" y="294">8</text></g>
    <g fill="#8b3a0c"><text x="140" y="184">1/4</text><text x="140" y="239">1/4</text><text x="140" y="294">0</text><text x="415" y="184">1/4</text><text x="415" y="239">1/4</text><text x="415" y="294">0</text></g>
    <g fill="#126357"><text x="220" y="184">1/6</text><text x="220" y="239">1/6</text><text x="220" y="294">1/6</text><text x="495" y="184">1/6</text><text x="495" y="239">1/6</text><text x="495" y="294">1/6</text></g>
    <g fill="#526174"><text x="690" y="184">0</text><text x="690" y="239">0</text><text x="690" y="294">0</text><text x="770" y="184">0</text><text x="770" y="239">0</text><text x="770" y="294">0</text></g>
  </g>
  <g stroke="#cbd5e1"><path d="M35 320H255 M310 320H530 M585 320H805"/></g>
  <g font-family="Georgia,serif" fill="#17243b" text-anchor="middle">
    <text x="145" y="356" font-size="18">Rμ(0) = 1/2</text>
    <text x="420" y="356" font-size="18">Rμ(1) = 1/2</text>
    <text x="695" y="356" font-size="18">Rμ(2) = 0</text>
    <text x="145" y="391" font-size="16">U: 1/2 ÷ 3 = 1/6</text>
    <text x="420" y="391" font-size="16">U: 1/2 ÷ 3 = 1/6</text>
    <text x="695" y="391" font-size="16">U: 0 ÷ 3 = 0</text>
    <text x="420" y="477" font-size="18">P = U R. The class masses need not be equal.</text>
  </g>
</svg>
