<svg xmlns="http://www.w3.org/2000/svg" width="850" height="440" viewBox="0 0 850 440" role="img" aria-labelledby="title desc">
<title id="title">A successor enters only after the strict phase threshold</title>
<desc id="desc">Intervals (1/4,7/4), (1/2,2) and (3/4,9/4). The first integer is one. Integer two is excluded in the first two intervals and included in the third.</desc>
<rect width="850" height="440" fill="#fbfaf7"/>
<g font-family="Georgia,serif" fill="#152b39">
<text x="35" y="36" font-size="23">A band of length 3/2 in integer-level coordinates</text>
<text x="35" y="65" font-size="17">Threshold θ = 1/2. Both interval endpoints are strict.</text>
<text x="35" y="144" font-size="21">x = 1/4</text>
<line x1="290" y1="138" x2="758.0" y2="138" stroke="#b9c4ca" stroke-width="2"/>
<line x1="335.0" y1="138" x2="605.0" y2="138" stroke="#16736b" stroke-width="6"/>
<line x1="290" y1="126" x2="290" y2="150" stroke="#536774"/>
<text x="285" y="176" font-size="17">0</text>
<line x1="470" y1="126" x2="470" y2="150" stroke="#536774"/>
<text x="465" y="176" font-size="17">1</text>
<line x1="650" y1="126" x2="650" y2="150" stroke="#536774"/>
<text x="645" y="176" font-size="17">2</text>
<circle cx="335.0" cy="138" r="7" fill="#fbfaf7" stroke="#16736b" stroke-width="3"/>
<circle cx="605.0" cy="138" r="7" fill="#fbfaf7" stroke="#16736b" stroke-width="3"/>
<circle cx="470" cy="138" r="7" fill="#204d81"/>
<text x="290" y="111" font-size="17">Only the first level</text>
<text x="35" y="252" font-size="21">x = 1/2</text>
<line x1="290" y1="246" x2="758.0" y2="246" stroke="#b9c4ca" stroke-width="2"/>
<line x1="380.0" y1="246" x2="650.0" y2="246" stroke="#16736b" stroke-width="6"/>
<line x1="290" y1="234" x2="290" y2="258" stroke="#536774"/>
<text x="285" y="284" font-size="17">0</text>
<line x1="470" y1="234" x2="470" y2="258" stroke="#536774"/>
<text x="465" y="284" font-size="17">1</text>
<line x1="650" y1="234" x2="650" y2="258" stroke="#536774"/>
<text x="645" y="284" font-size="17">2</text>
<circle cx="380.0" cy="246" r="7" fill="#fbfaf7" stroke="#16736b" stroke-width="3"/>
<circle cx="650.0" cy="246" r="7" fill="#fbfaf7" stroke="#16736b" stroke-width="3"/>
<circle cx="470" cy="246" r="7" fill="#204d81"/>
<text x="290" y="219" font-size="17">Successor at endpoint: excluded</text>
<text x="35" y="360" font-size="21">x = 3/4</text>
<line x1="290" y1="354" x2="758.0" y2="354" stroke="#b9c4ca" stroke-width="2"/>
<line x1="425.0" y1="354" x2="695.0" y2="354" stroke="#16736b" stroke-width="6"/>
<line x1="290" y1="342" x2="290" y2="366" stroke="#536774"/>
<text x="285" y="392" font-size="17">0</text>
<line x1="470" y1="342" x2="470" y2="366" stroke="#536774"/>
<text x="465" y="392" font-size="17">1</text>
<line x1="650" y1="342" x2="650" y2="366" stroke="#536774"/>
<text x="645" y="392" font-size="17">2</text>
<circle cx="425.0" cy="354" r="7" fill="#fbfaf7" stroke="#16736b" stroke-width="3"/>
<circle cx="695.0" cy="354" r="7" fill="#fbfaf7" stroke="#16736b" stroke-width="3"/>
<circle cx="470" cy="354" r="7" fill="#204d81"/>
<circle cx="650" cy="354" r="7" fill="#204d81"/>
<text x="290" y="327" font-size="17">Both levels admitted</text>
<text x="35" y="421" font-size="16">Integer one carries q₀; integer two, when admitted, carries its own weight q₁.</text>
</g></svg>
