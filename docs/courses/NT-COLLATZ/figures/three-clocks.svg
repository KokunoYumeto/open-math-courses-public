<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Three clocks for the Collatz orbit beginning at 3</title>
  <desc id="desc">Each row has its own time scale. Ordinary states: 3,10,5,16,8,4,2,1 at times 0 to 7. Shortcut states: 3,5,8,4,2,1 at times 0 to 5. Syracuse states: 3,5,1 at times 0 to 2. Odd states have double circles.</desc>
  <rect width="1000" height="390" fill="#fff"/>
  <style>text{font-family:Georgia,serif;fill:#182c3a} .row{font-size:24px} .number{font-size:24px;text-anchor:middle} .time{font-family:Arial,sans-serif;font-size:17px;text-anchor:middle;fill:#465664} .track{stroke:#8998a4;stroke-width:2} .point{fill:#fff;stroke:#536574;stroke-width:2} .odd{fill:#e7f1f2;stroke:#146372;stroke-width:3}</style>
  <text x="35" y="34" font-size="21">Same odd visits, different elapsed times</text>
  <text class="row" x="35" y="98">Ordinary C</text>
  <line class="track" x1="240" y1="90" x2="940" y2="90"/>
  <g class="point"><circle cx="340" cy="90" r="28"/><circle cx="540" cy="90" r="28"/><circle cx="640" cy="90" r="28"/><circle cx="740" cy="90" r="28"/><circle cx="840" cy="90" r="28"/></g>
  <g class="odd"><circle cx="240" cy="90" r="28"/><circle cx="440" cy="90" r="28"/><circle cx="940" cy="90" r="28"/><circle cx="240" cy="90" r="33" fill="none"/><circle cx="440" cy="90" r="33" fill="none"/><circle cx="940" cy="90" r="33" fill="none"/></g>
  <g class="number"><text x="240" y="98">3</text><text x="340" y="98">10</text><text x="440" y="98">5</text><text x="540" y="98">16</text><text x="640" y="98">8</text><text x="740" y="98">4</text><text x="840" y="98">2</text><text x="940" y="98">1</text></g>
  <g class="time"><text x="240" y="140">t = 0</text><text x="340" y="140">1</text><text x="440" y="140">2</text><text x="540" y="140">3</text><text x="640" y="140">4</text><text x="740" y="140">5</text><text x="840" y="140">6</text><text x="940" y="140">7</text></g>
  <text class="row" x="35" y="208">Shortcut T</text>
  <line class="track" x1="240" y1="200" x2="940" y2="200"/>
  <g class="point"><circle cx="520" cy="200" r="28"/><circle cx="660" cy="200" r="28"/><circle cx="800" cy="200" r="28"/></g>
  <g class="odd"><circle cx="240" cy="200" r="28"/><circle cx="380" cy="200" r="28"/><circle cx="940" cy="200" r="28"/><circle cx="240" cy="200" r="33" fill="none"/><circle cx="380" cy="200" r="33" fill="none"/><circle cx="940" cy="200" r="33" fill="none"/></g>
  <g class="number"><text x="240" y="208">3</text><text x="380" y="208">5</text><text x="520" y="208">8</text><text x="660" y="208">4</text><text x="800" y="208">2</text><text x="940" y="208">1</text></g>
  <g class="time"><text x="240" y="250">t = 0</text><text x="380" y="250">1</text><text x="520" y="250">2</text><text x="660" y="250">3</text><text x="800" y="250">4</text><text x="940" y="250">5</text></g>
  <text class="row" x="35" y="318">Syracuse S</text>
  <line class="track" x1="240" y1="310" x2="940" y2="310"/>
  <g class="odd"><circle cx="240" cy="310" r="28"/><circle cx="590" cy="310" r="28"/><circle cx="940" cy="310" r="28"/><circle cx="240" cy="310" r="33" fill="none"/><circle cx="590" cy="310" r="33" fill="none"/><circle cx="940" cy="310" r="33" fill="none"/></g>
  <g class="number"><text x="240" y="318">3</text><text x="590" y="318">5</text><text x="940" y="318">1</text></g>
  <g class="time"><text x="240" y="360">j = 0</text><text x="590" y="360">1</text><text x="940" y="360">2</text></g>
</svg>
