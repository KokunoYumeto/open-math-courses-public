<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" role="img" aria-labelledby="title desc">
<title id="title">A rotation block paired with a rational grid</title>
<desc id="desc">Five points for square root of two and the seven-fifths grid, both starting at one tenth. The interval from 0.32 to 0.52 contains one grid point and two actual points. Index three crosses the lower boundary.</desc>
<rect width="880" height="352" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#142d3a">
<text x="36" y="34" font-size="22">One boundary crossing in a complete five-point block</text>
<text x="36" y="61" font-size="15">α = √2, p/q = 7/5, u = 1/10; pairs retain their orbit index i</text>
<rect x="305.0" y="93" width="150.0" height="163" fill="#e4effb"/>
<line x1="305.0" x2="305.0" y1="90" y2="261" stroke="#265d99" stroke-dasharray="5 4"/>
<text x="305.0" y="281" text-anchor="middle" font-size="15">0.32</text>
<line x1="455.0" x2="455.0" y1="90" y2="261" stroke="#265d99" stroke-dasharray="5 4"/>
<text x="455.0" y="281" text-anchor="middle" font-size="15">0.52</text>
<line x1="65" x2="815" y1="124" y2="124" stroke="#88969e"/>
<line x1="65" x2="815" y1="225" y2="225" stroke="#88969e"/>
<line x1="140.000" y1="124" x2="140.000" y2="225" stroke="#486877" stroke-width="2"/>
<circle cx="140.000" cy="124" r="5" fill="#486877"/>
<text x="140.000" y="110" text-anchor="middle" font-size="15">i=0</text>
<circle cx="140.000" cy="225" r="5" fill="#486877"/>
<text x="140.000" y="211" text-anchor="middle" font-size="15">i=0</text>
<line x1="440.000" y1="124" x2="450.660" y2="225" stroke="#486877" stroke-width="2"/>
<circle cx="440.000" cy="124" r="5" fill="#486877"/>
<text x="440.000" y="110" text-anchor="middle" font-size="15">i=1</text>
<circle cx="450.660" cy="225" r="5" fill="#486877"/>
<text x="450.660" y="211" text-anchor="middle" font-size="15">i=1</text>
<line x1="740.000" y1="124" x2="761.320" y2="225" stroke="#486877" stroke-width="2"/>
<circle cx="740.000" cy="124" r="5" fill="#486877"/>
<text x="740.000" y="110" text-anchor="middle" font-size="15">i=2</text>
<circle cx="761.320" cy="225" r="5" fill="#486877"/>
<text x="761.320" y="211" text-anchor="middle" font-size="15">i=2</text>
<line x1="290.000" y1="124" x2="321.981" y2="225" stroke="#b04b1e" stroke-width="2"/>
<circle cx="290.000" cy="124" r="5" fill="#b04b1e"/>
<text x="290.000" y="110" text-anchor="middle" font-size="15">i=3</text>
<circle cx="321.981" cy="225" r="5" fill="#b04b1e"/>
<text x="321.981" y="211" text-anchor="middle" font-size="15">i=3</text>
<line x1="590.000" y1="124" x2="632.641" y2="225" stroke="#486877" stroke-width="2"/>
<circle cx="590.000" cy="124" r="5" fill="#486877"/>
<text x="590.000" y="110" text-anchor="middle" font-size="15">i=4</text>
<circle cx="632.641" cy="225" r="5" fill="#486877"/>
<text x="632.641" y="211" text-anchor="middle" font-size="15">i=4</text>
<text x="36" y="91" font-size="16">Rational grid</text>
<text x="36" y="198" font-size="16">Actual rotation</text>
<text x="36" y="319" font-size="16">[0.32, 0.52): one grid point, two actual points. Only i=3 changes membership.</text>
</g></svg>
