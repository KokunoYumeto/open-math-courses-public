<svg xmlns="http://www.w3.org/2000/svg" width="450" height="570" viewBox="0 0 450 570" role="img" aria-labelledby="title desc">
<title id="title">The fixed affine allowance</title>
<desc id="desc">Equation 20: exact affine coordinates transfer a maximal parity barrier to both sides of the integer orbit envelope.</desc>
<rect width="450" height="570" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#426273"/></marker></defs>
<rect x="14" y="36" width="422" height="106" rx="10" fill="#eef5f8" stroke="#426273"/>
<text x="225" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold">Parity deviation</text>
<text x="225" y="91" text-anchor="middle" font-family="Georgia,serif" font-size="17">n ∈ I<tspan baseline-shift="sub" font-size="12">M</tspan>, 0 ≤ k ≤ M</text>
<text x="225" y="117" text-anchor="middle" font-family="Georgia,serif" font-size="17">|d<tspan baseline-shift="sub" font-size="12">k</tspan>| ≤ h</text>
<path d="M225,144 L225,165" stroke="#426273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="14" y="168" width="422" height="106" rx="10" fill="#eef5f8" stroke="#426273"/>
<text x="225" y="194" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold">Exact affine coordinates</text>
<text x="225" y="223" text-anchor="middle" font-family="Georgia,serif" font-size="17">Tᵏ(n)/(ρᵏn) = 3<tspan baseline-shift="super" font-size="12">dₖ</tspan>(1 + Q<tspan baseline-shift="sub" font-size="12">k</tspan>/n)</text>
<text x="225" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="17">0 ≤ Q<tspan baseline-shift="sub" font-size="12">k</tspan>/n ≤ 1/6</text>
<path d="M225,276 L225,297" stroke="#426273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="14" y="300" width="422" height="106" rx="10" fill="#eef5f8" stroke="#426273"/>
<text x="225" y="326" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold">Both sides of the envelope</text>
<text x="225" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="17">3⁻ʰ ≤ Tᵏ(n)/(ρᵏn) ≤ (7/6)3ʰ</text>
<text x="225" y="381" text-anchor="middle" font-family="Georgia,serif" font-size="17">β = log₂(7/6),  h = (ηM − β)/λ</text>
<path d="M225,408 L225,429" stroke="#426273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="14" y="432" width="422" height="106" rx="10" fill="#eef5f8" stroke="#426273"/>
<text x="225" y="458" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold">A retained integer trajectory</text>
<text x="225" y="487" text-anchor="middle" font-family="Georgia,serif" font-size="17">n<tspan baseline-shift="super" font-size="12">−η</tspan> ≤ Tᵏ(n)/(ρᵏn) ≤ n<tspan baseline-shift="super" font-size="12">η</tspan></text>
<text x="225" y="513" text-anchor="middle" font-family="Georgia,serif" font-size="17">ηM ≥ β; every prefix is included</text>
</svg>
