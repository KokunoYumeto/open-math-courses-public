<svg xmlns="http://www.w3.org/2000/svg" width="440" height="790" viewBox="0 0 440 790" role="img" aria-labelledby="title desc">
<title id="title">Three estimates for one surviving word</title>
<desc id="desc">For m=16 the exact word split has lengths 4,8,4. Two independent necessary outer conditions each supply an inverse square root. A conditional endpoint bound for the middle supplies the third. The resulting bound is for each terminal bin, then summed with exponential weights.</desc>
<rect width="440" height="790" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#183a46}.head{font-size:20px;font-weight:bold}.body{font-size:16px}.small{font-size:15px}.math{font-size:19px}.label{font-size:17px;font-weight:bold}</style>
<text x="20" y="32" class="head">One word, three separate estimates</text>
<text x="20" y="60" class="body">Example: m = 16, a = 4, b = 8.</text>
<rect x="20" y="78" width="100" height="46" fill="#dceeea" stroke="#56727e"/>
<text x="70.0" y="107" class="label" text-anchor="middle">first 4</text>
<rect x="120" y="78" width="200" height="46" fill="#e7edf8" stroke="#56727e"/>
<text x="220.0" y="107" class="label" text-anchor="middle">middle 8</text>
<rect x="320" y="78" width="100" height="46" fill="#dceeea" stroke="#56727e"/>
<text x="370.0" y="107" class="label" text-anchor="middle">last 4</text>
<text x="20" y="155" class="body">Fix a terminal bin: Zₘ + B ∈ [q, q + 1).</text>
<rect x="18" y="175" width="404" height="130" rx="8" fill="#eff7f3" stroke="#b9cbd1"/>
<text x="34" y="204" class="label">First outer block</text>
<text x="34" y="233" class="body">Every prefix has Zⱼ &gt; −B.</text>
<text x="34" y="264" class="math">Probability ≤ 2(B + 1) / √(va)</text>
<text x="34" y="289" class="small">Only these first a letters are used.</text>
<rect x="18" y="325" width="404" height="153" rx="8" fill="#eff7f3" stroke="#b9cbd1"/>
<text x="34" y="354" class="label">Last outer block, read backwards</text>
<text x="34" y="383" class="body">Negate its increments, not its bits.</text>
<text x="34" y="410" class="body">Zₘ₋ⱼ − Zₘ &gt; −(q + 1)</text>
<text x="34" y="441" class="math">Probability ≤ 2(q + 2) / √(va)</text>
<text x="34" y="465" class="small">These letters are disjoint from the first.</text>
<rect x="18" y="498" width="404" height="131" rx="8" fill="#f0f3fa" stroke="#b9cbd1"/>
<text x="34" y="527" class="label">Middle block, with both ends fixed</text>
<text x="34" y="556" class="body">A unit bin contains at most one atom.</text>
<text x="34" y="587" class="math">Conditional probability ≤ Cₚ / √b</text>
<text x="34" y="614" class="small">This bound is uniform in the fixed ends.</text>
<text x="20" y="662" class="body">Multiply the two outer probabilities.</text>
<text x="20" y="687" class="body">Then apply the conditional middle bound.</text>
<text x="220" y="724" class="math" text-anchor="middle">4Cₚ(B + 1)(q + 2) / (va√b)</text>
<text x="20" y="759" class="body">Finally sum bins with weights e⁻ᶿᑫ.</text>
</svg>
