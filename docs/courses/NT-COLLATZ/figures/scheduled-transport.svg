<svg xmlns="http://www.w3.org/2000/svg" width="440" height="614" viewBox="0 0 440 614" role="img" aria-labelledby="title desc">
<title id="title">Equal landing laws, different travel times</title>
<desc id="desc">Countdown map D(n)=max(n-1,1). Inputs 3 and 100 both first land at 3, taking 0 and 97 steps. Both then take two more steps to reach 1. With a first-leg budget of 2 the second input fails the schedule.</desc>
<rect width="440" height="614" rx="10" fill="#f4f8fa"/>
<g font-family="system-ui,sans-serif" fill="#172c38">
<text x="22" y="34" font-size="21" font-weight="650">Same landing. Different times.</text>
<text x="22" y="66" font-size="18">Countdown D(n) = max(n − 1, 1)</text>
<text x="22" y="93" font-size="16">An example map, not the Collatz map</text>
<rect x="16" y="116" width="408" height="187" rx="8" fill="#fff" stroke="#b7cbd5"/>
<text x="32" y="145" font-size="19" font-weight="650">Start 3 · first threshold 3</text>
<text x="32" y="177" font-size="19">3 → 3: 0 steps</text>
<text x="32" y="207" font-size="19">3 → 2 → 1: 2 more steps</text>
<text x="32" y="239" font-size="19" font-weight="650">Total time to 1: 2 steps</text>
<text x="32" y="275" font-size="17" fill="#16645a">Meets the first-leg budget of 2</text>
<rect x="16" y="320" width="408" height="187" rx="8" fill="#fff" stroke="#b7cbd5"/>
<text x="32" y="349" font-size="19" font-weight="650">Start 100 · first threshold 3</text>
<text x="32" y="381" font-size="19">100 → 3: 97 steps</text>
<text x="32" y="411" font-size="19">3 → 2 → 1: 2 more steps</text>
<text x="32" y="443" font-size="19" font-weight="650">Total time to 1: 99 steps</text>
<text x="32" y="479" font-size="17" fill="#9d4327">Misses the first-leg budget of 2</text>
<text x="22" y="550" font-size="18">Both landing laws are the point mass at 3.</text>
<text x="22" y="579" font-size="18">Their event distance is exactly zero.</text>
</g></svg>
