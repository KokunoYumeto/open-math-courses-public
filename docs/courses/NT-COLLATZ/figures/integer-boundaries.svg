<svg xmlns="http://www.w3.org/2000/svg" width="440" height="625" viewBox="0 0 440 625" role="img" aria-labelledby="title desc">
<title id="title">Exact affine shifts and separated boundary intervals</title>
<desc id="desc">The true start11 lies in10 through11, while104/9 does not. Four exact dyadic-triadic boundary intervals for M400 and R2 appear on a common endpoint axis.</desc>
<rect width="440" height="625" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#14354b;font-size:14px}.small{font-size:12px}.line{stroke:#536d7d;stroke-width:1}</style>
<text x="220" y="27" text-anchor="middle">Dropping an offset can move a boundary point</text>
<text x="220" y="51" text-anchor="middle">Word (1,2); endpoint M = 13</text>
<rect x="55.0" y="91" width="160.0" height="32" fill="#daf0e8"/>
<line x1="55.0" y1="118" x2="375.0" y2="118" stroke="#536d7d" stroke-width="1"/>
<line x1="55.0" y1="113" x2="55.0" y2="126" stroke="#536d7d" stroke-width="1"/>
<text x="55.0" y="146" text-anchor="middle">10</text>
<line x1="215.0" y1="113" x2="215.0" y2="126" stroke="#536d7d" stroke-width="1"/>
<text x="215.0" y="146" text-anchor="middle">11</text>
<line x1="375.0" y1="113" x2="375.0" y2="126" stroke="#536d7d" stroke-width="1"/>
<text x="375.0" y="146" text-anchor="middle">12</text>
<circle cx="215.0" cy="118" r="4" fill="#087c70"/>
<line x1="215.0" y1="82" x2="215.0" y2="110" stroke="#087c70" stroke-width="1"/>
<circle cx="303.8888888888889" cy="118" r="4" fill="#b85411"/>
<line x1="303.8888888888889" y1="82" x2="303.8888888888889" y2="110" stroke="#b85411" stroke-width="1"/>
<text x="209.0" y="78" text-anchor="end">N = 11</text>
<text x="303.8888888888889" y="78" text-anchor="middle">N⁰ = 104/9</text>
<text x="220" y="177" text-anchor="middle">Closed window [10,11]; shift = 5/9</text>
<text x="220" y="204" text-anchor="middle">11 → 17 → 13 is the actual odd-return path</text>
<line x1="25" y1="231" x2="415" y2="231" stroke="#c8d7df" stroke-width="1"/>
<text x="220" y="260" text-anchor="middle">Separated intervals in the endpoint coordinate v</text>
<text x="220" y="284" text-anchor="middle">R = 2, M = 400 &gt; 4 · 3⁴ = 324</text>
<line x1="55" y1="342" x2="410" y2="342" stroke="#d9e2e8" stroke-width="1"/>
<line x1="65.41333333333333" y1="342" x2="66.83333333333333" y2="342" stroke="#087c70" stroke-width="6"/>
<line x1="65.41333333333333" y1="335" x2="65.41333333333333" y2="349" stroke="#087c70" stroke-width="1"/>
<line x1="66.83333333333333" y1="335" x2="66.83333333333333" y2="349" stroke="#087c70" stroke-width="1"/>
<text x="55" y="323" text-anchor="start" class="small">(r,s) = (1,1)     [794/3, 800/3]</text>
<line x1="55" y1="407" x2="410" y2="407" stroke="#d9e2e8" stroke-width="1"/>
<line x1="124.26444444444444" y1="407" x2="129.94444444444446" y2="407" stroke="#087c70" stroke-width="6"/>
<line x1="124.26444444444444" y1="400" x2="124.26444444444444" y2="414" stroke="#087c70" stroke-width="1"/>
<line x1="129.94444444444446" y1="400" x2="129.94444444444446" y2="414" stroke="#087c70" stroke-width="1"/>
<text x="55" y="388" text-anchor="start" class="small">(r,s) = (2,3)     [3128/9, 3200/9]</text>
<line x1="55" y1="472" x2="410" y2="472" stroke="#d9e2e8" stroke-width="1"/>
<line x1="253.32666666666665" y1="472" x2="256.16666666666663" y2="472" stroke="#087c70" stroke-width="6"/>
<line x1="253.32666666666665" y1="465" x2="253.32666666666665" y2="479" stroke="#087c70" stroke-width="1"/>
<line x1="256.16666666666663" y1="465" x2="256.16666666666663" y2="479" stroke="#087c70" stroke-width="1"/>
<text x="55" y="453" text-anchor="start" class="small">(r,s) = (1,2)     [1588/3, 1600/3]</text>
<line x1="55" y1="537" x2="410" y2="537" stroke="#d9e2e8" stroke-width="1"/>
<line x1="371.02888888888884" y1="537" x2="382.38888888888886" y2="537" stroke="#087c70" stroke-width="6"/>
<line x1="371.02888888888884" y1="530" x2="371.02888888888884" y2="544" stroke="#087c70" stroke-width="1"/>
<line x1="382.38888888888886" y1="530" x2="382.38888888888886" y2="544" stroke="#087c70" stroke-width="1"/>
<text x="55" y="518" text-anchor="start" class="small">(r,s) = (2,4)     [6256/9, 6400/9]</text>
<line x1="55" y1="562" x2="410" y2="562" stroke="#536d7d" stroke-width="1"/>
<line x1="55.0" y1="558" x2="55.0" y2="567" stroke="#536d7d" stroke-width="1"/>
<text x="55.0" y="584" text-anchor="middle" class="small">250</text>
<line x1="232.5" y1="558" x2="232.5" y2="567" stroke="#536d7d" stroke-width="1"/>
<text x="232.5" y="584" text-anchor="middle" class="small">500</text>
<line x1="410.0" y1="558" x2="410.0" y2="567" stroke="#536d7d" stroke-width="1"/>
<text x="410.0" y="584" text-anchor="middle" class="small">750</text>
<text x="220" y="614" text-anchor="middle" class="small">Common linear scale; exact rational endpoints shown</text>
</svg>
