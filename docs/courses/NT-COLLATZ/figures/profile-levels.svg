<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">The mass of a unimodal sequence as horizontal interval layers</title>
<desc id="desc">Weights one, two, three, two, one divided by nine. Each of the three horizontal layers has height one ninth and respective lengths five, three, one. Their total mass is one and their maximum height is one third.</desc>
<rect width="760" height="360" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#17324d" font-size="18">
<text x="30" y="35" font-size="23" text-anchor="start">A profile is a stack of interval layers</text>
<rect x="90" y="222" width="325" height="60" fill="#c6def1" stroke="#fff" stroke-width="2"/>
<rect x="155" y="162" width="195" height="60" fill="#8db7db" stroke="#fff" stroke-width="2"/>
<rect x="220" y="102" width="65" height="60" fill="#4d83b3" stroke="#fff" stroke-width="2"/>
<path d="M 90 282 v -60 h 65 v 60" fill="none" stroke="#17324d" stroke-width="1.5"/>
<text x="122.5" y="307" font-size="18" text-anchor="middle">1</text>
<text x="122.5" y="212" font-size="17" text-anchor="middle">1/9</text>
<path d="M 155 282 v -120 h 65 v 120" fill="none" stroke="#17324d" stroke-width="1.5"/>
<text x="187.5" y="307" font-size="18" text-anchor="middle">2</text>
<text x="187.5" y="152" font-size="17" text-anchor="middle">2/9</text>
<path d="M 220 282 v -180 h 65 v 180" fill="none" stroke="#17324d" stroke-width="1.5"/>
<text x="252.5" y="307" font-size="18" text-anchor="middle">3</text>
<text x="252.5" y="92" font-size="17" text-anchor="middle">3/9</text>
<path d="M 285 282 v -120 h 65 v 120" fill="none" stroke="#17324d" stroke-width="1.5"/>
<text x="317.5" y="307" font-size="18" text-anchor="middle">4</text>
<text x="317.5" y="152" font-size="17" text-anchor="middle">2/9</text>
<path d="M 350 282 v -60 h 65 v 60" fill="none" stroke="#17324d" stroke-width="1.5"/>
<text x="382.5" y="307" font-size="18" text-anchor="middle">5</text>
<text x="382.5" y="212" font-size="17" text-anchor="middle">1/9</text>
<path d="M 77 75 V 282 H 430" stroke="#17324d" fill="none"/>
<text x="27" y="90" font-size="19" text-anchor="start">w(n)</text>
<text x="69" y="288" font-size="16" text-anchor="end">0</text>
<text x="69" y="228" font-size="16" text-anchor="end">1/9</text>
<text x="69" y="168" font-size="16" text-anchor="end">2/9</text>
<text x="69" y="108" font-size="16" text-anchor="end">1/3</text>
<text x="422" y="307" font-size="19" text-anchor="start">n</text>
<text x="478" y="110" font-size="18" text-anchor="start">0 ≤ t &lt; 1/9: length 5</text>
<text x="478" y="150" font-size="18" text-anchor="start">1/9 ≤ t &lt; 2/9: length 3</text>
<text x="478" y="190" font-size="18" text-anchor="start">2/9 ≤ t &lt; 1/3: length 1</text>
<text x="478" y="243" font-size="18" text-anchor="start">Mass = (5 + 3 + 1)/9 = 1</text>
<text x="478" y="279" font-size="18" text-anchor="start">Maximum = 3/9 = 1/3</text>
<text x="30" y="337" font-size="16" text-anchor="start">Strict superlevel sets {n : w(n) &gt; t}; endpoint heights do not affect the integrals.</text>
</g></svg>
