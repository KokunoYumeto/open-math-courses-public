<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Physical rectangle and compatible holonomies</title><desc id="desc">Two successive dyadic rectangle grids and their edge-composition projection. The holonomy map sends continuous connections into the compatible space, whose constructed probability gives its image a Borel null set. Lengths are schematic; all constants and domains are printed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#256773"/></marker></defs>
<rect width="1200" height="780" fill="#f4f7f5"/><g font-family="Arial,sans-serif" fill="#193d46">
<text x="38" y="48" font-size="28" font-weight="bold">Physical rectangle and compatible holonomies</text><text x="38" y="88" font-size="20">SU(2); κ(X,Y) = −tr(XY); L₁,L₂,g₂ &gt; 0; every boundary link is integrated.</text><text x="175" y="142" font-size="24">Grid Γ₁</text><path d="M90.0 180 V380 M90 180.0 H390" stroke="#26776e" stroke-width="2"/><path d="M240.0 180 V380 M90 280.0 H390" stroke="#26776e" stroke-width="2"/><path d="M390.0 180 V380 M90 380.0 H390" stroke="#26776e" stroke-width="2"/><text x="222" y="418" font-size="22">L₁</text><text x="50" y="288" font-size="22">L₂</text><text x="90" y="460" font-size="20">Face area = L₁L₂/4</text><text x="845" y="142" font-size="24">Grid Γ₂</text><path d="M760.0 180 V380 M760 180.0 H1060" stroke="#26776e" stroke-width="2"/><path d="M835.0 180 V380 M760 230.0 H1060" stroke="#26776e" stroke-width="2"/><path d="M910.0 180 V380 M760 280.0 H1060" stroke="#26776e" stroke-width="2"/><path d="M985.0 180 V380 M760 330.0 H1060" stroke="#26776e" stroke-width="2"/><path d="M1060.0 180 V380 M760 380.0 H1060" stroke="#26776e" stroke-width="2"/><text x="892" y="418" font-size="22">L₁</text><text x="720" y="288" font-size="22">L₂</text><text x="760" y="460" font-size="20">Face area = L₁L₂/16</text><path d="M726 265 H432" stroke="#256773" stroke-width="3" marker-end="url(#arrow)"/><text x="476" y="235" font-size="22">π₁: compose edges</text><text x="458" y="309" font-size="20">U = U₂U₁</text><text x="422" y="349" font-size="20">(π₁)∗ μ₂ = μ₁</text><rect x="40" y="500" width="1120" height="211" rx="12" fill="white" stroke="#a4bdbe"/><text x="65" y="540" font-size="22">t_f = g₂²|f|/4; chord integration adds the two original face times.</text><text x="65" y="582" font-size="22">Continuous connections A</text><path d="M425 575 H735" stroke="#256773" stroke-width="2" marker-end="url(#arrow)"/><text x="523" y="562" font-size="19">Hol(A)</text><text x="766" y="582" font-size="22">Compatible space X∞</text><text x="65" y="628" font-size="20">The smooth image is dense and lies in E = {W_m / a_m → 0}, with μ∞(E) = 0.</text><text x="65" y="674" font-size="20">Exact loop law: E[tr(H∂R)/2] = exp(−3g₂² area(R)/8).</text><text x="38" y="754" font-size="18">Schematic physical lengths; exact maps: GP.1–GP.13 and DP.16–DP.19. No arbitrary-path extension.</text></g></svg>