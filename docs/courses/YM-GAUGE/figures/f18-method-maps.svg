<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">The maps connecting course constructions</title><desc id="desc">Five rows give precise source and target objects, their mathematical maps, and proof locators: classical evolution, Gaussian projection, graph composition, reflection quotient and spectral measure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#256773"/></marker></defs>
<rect width="1200" height="780" fill="#f4f7f5"/><g font-family="Arial,sans-serif" fill="#193d46">
<text x="38" y="48" font-size="28" font-weight="bold">Follow the mathematical map</text><text x="38" y="88" font-size="20">Each row has its own stated model and domain; these rows are not one commuting diagram.</text><rect x="38" y="120" width="1124" height="102" rx="9" fill="white" stroke="#a4bdbe"/><text x="60" y="156" font-size="22">Constrained Cauchy data</text><text x="772" y="156" font-size="22">Classical connection</text><path d="M426 155 H736" stroke="#256773" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="142" font-size="18">evolution</text><text x="60" y="198" font-size="18">Unit 9: energy, gauge and propagation estimates</text><rect x="38" y="238" width="1124" height="102" rx="9" fill="white" stroke="#a4bdbe"/><text x="60" y="274" font-size="22">Finite joint measure</text><text x="772" y="274" font-size="22">Marginal probability</text><path d="M426 273 H736" stroke="#256773" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="260" font-size="18">projection / integration</text><text x="60" y="316" font-size="18">F18.4–F18.6: determinant, sources and full partition</text><rect x="38" y="356" width="1124" height="102" rx="9" fill="white" stroke="#a4bdbe"/><text x="60" y="392" font-size="22">Fine graph probability</text><text x="772" y="392" font-size="22">Coarse graph probability</text><path d="M426 391 H736" stroke="#256773" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="378" font-size="18">edge composition</text><text x="60" y="434" font-size="18">GP.5–GP.11: exact heat convolution and compatible limit</text><rect x="38" y="474" width="1124" height="102" rx="9" fill="white" stroke="#a4bdbe"/><text x="60" y="510" font-size="22">Euclidean correlations</text><text x="772" y="510" font-size="22">Physical Hilbert space</text><path d="M426 509 H736" stroke="#256773" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="496" font-size="18">reflection quotient</text><text x="60" y="552" font-size="18">Unit 17: proved free-field quotient and reconstruction</text><rect x="38" y="592" width="1124" height="102" rx="9" fill="white" stroke="#a4bdbe"/><text x="60" y="628" font-size="22">Observable vector ψ</text><text x="772" y="628" font-size="22">ρψ and its correlation</text><path d="M426 627 H736" stroke="#256773" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="614" font-size="18">spectral measure</text><text x="60" y="670" font-size="18">Unit 16 and F18.21: support of the actual vector</text><text x="38" y="753" font-size="19">A claim transfers through the displayed map with its hypotheses, observables and constants intact.</text></g></svg>