<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2640" viewBox="0 0 720 2640" role="img" aria-labelledby="title desc">
<title id="title">Three blow-ups of the cusp y² − x³: total multiplicities</title>
<desc id="desc">Four vertically stacked affine-coordinate panels. The first shows tangency of u=v² to u=0. The second shows three concurrent lines a=0, b=0 and a=b. The last two show the two charts of the third blow-up, where the exceptional multiplicity is six and at most two branches meet transversely. The q=1 and w=1 intersections are the same point. The q=0 and w=0 old-divisor directions are different; neither is falsely included in the other affine chart.</desc>
<metadata>Original programme figure and generator: CC0 1.0. Human framework reference: Edward Bierstone and Pierre D. Milman, Canonical desingularization in characteristic zero by blowing up the maximum strata of a local invariant; author manuscript, 25 November 1996. The displayed cusp chart computations are independently expressed. Proof locator: #keeping-the-whole-function-through-a-resolution, PF8–PF10. This example does not prove a general resolution theorem.</metadata>
<style>text{font-family:Arial,"Segoe UI",sans-serif;font-style:normal;fill:#172b3d}.label{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}a text{text-decoration:underline} .grid{stroke:#e1e8ed;stroke-width:1}.axis{stroke:#a8b6c0;stroke-width:1.5;stroke-dasharray:5 5}</style>
<rect width="720" height="2640" fill="#fff"/>
<text x="32" y="48" font-size="35" text-anchor="start" style="fill:#172b3d" font-weight="700">Three blow-ups of y² − x³</text>
<text x="32" y="84" font-size="24" text-anchor="start" style="fill:#4c6171">Keeping the total function and its multiplicities</text>
<line x1="34" y1="118" x2="72" y2="118" stroke="#146aa5" stroke-width="4.5"/>
<text x="82" y="126" font-size="23" text-anchor="start" style="fill:#146aa5">exceptional divisors</text>
<line x1="374" y1="118" x2="412" y2="118" stroke="#bf4d16" stroke-width="4.5"/>
<text x="422" y="126" font-size="23" text-anchor="start" style="fill:#bf4d16">weak zero curve</text>
<text x="32" y="158" font-size="23" text-anchor="start" style="fill:#4c6171">Numbers in parentheses are total multiplicities.</text>
<rect x="24" y="184" width="672" height="500" rx="16" fill="#fafcfd" stroke="#cad8e1" stroke-width="1.5"/>
<text x="44" y="219" font-size="26" text-anchor="start" style="fill:#172b3d" font-weight="700">A · First blow-up: tangency remains</text>
<text x="44" y="254" font-size="24" text-anchor="start" style="fill:#4c6171">x=u, y=uv</text>
<text x="44" y="295" font-size="30" text-anchor="start" style="fill:#172b3d" font-weight="600">f ∘ π₁ = u²(v² − u)</text>
<rect x="60" y="324" width="600" height="270" fill="#fff" stroke="#d8e2e9"/>
<line x1="160" y1="324" x2="160" y2="594" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="360" y1="324" x2="360" y2="594" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="560" y1="324" x2="560" y2="594" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="549" x2="660" y2="549" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="459" x2="660" y2="459" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="369" x2="660" y2="369" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="459" x2="660" y2="459" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<line x1="160" y1="324" x2="160" y2="594" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<text x="652" y="488" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">u</text>
<text x="147" y="349" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">v</text>
<line x1="160" y1="324" x2="160" y2="594" stroke="#146aa5" stroke-width="4.5"/>
<path d="M 610,594 Q -290,459 610,324" fill="none" stroke="#bf4d16" stroke-width="4.5"/>
<text x="178" y="359" font-size="25" text-anchor="start" style="fill:#146aa5" class="label">E₁: u=0 (2)</text>
<text x="390" y="388" font-size="25" text-anchor="start" style="fill:#bf4d16" class="label">C₁: u=v² (1)</text>
<circle cx="160" cy="459" r="8" fill="white" stroke="#172b3d" stroke-width="2.5"/>
<text x="44" y="630" font-size="24" text-anchor="start" style="fill:#172b3d">Blow up the marked point (u,v)=(0,0).</text>
<text x="44" y="665" font-size="24" text-anchor="start" style="fill:#4c6171">The smooth weak curve is tangent to E₁.</text>
<rect x="24" y="708" width="672" height="500" rx="16" fill="#fafcfd" stroke="#cad8e1" stroke-width="1.5"/>
<text x="44" y="743" font-size="26" text-anchor="start" style="fill:#172b3d" font-weight="700">B · Second blow-up: three lines meet</text>
<text x="44" y="778" font-size="24" text-anchor="start" style="fill:#4c6171">u=ab, v=a</text>
<text x="44" y="819" font-size="30" text-anchor="start" style="fill:#172b3d" font-weight="600">f ∘ π₂ = a³b²(a − b)</text>
<rect x="60" y="848" width="600" height="270" fill="#fff" stroke="#d8e2e9"/>
<line x1="160" y1="848" x2="160" y2="1118" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="360" y1="848" x2="360" y2="1118" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="560" y1="848" x2="560" y2="1118" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="1073" x2="660" y2="1073" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="983" x2="660" y2="983" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="893" x2="660" y2="893" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="983" x2="660" y2="983" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<line x1="360" y1="848" x2="360" y2="1118" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<text x="652" y="1012" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">a</text>
<text x="347" y="873" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">b</text>
<line x1="360" y1="848" x2="360" y2="1118" stroke="#146aa5" stroke-width="4.5"/>
<line x1="60" y1="983" x2="660" y2="983" stroke="#146aa5" stroke-width="4.5"/>
<line x1="60" y1="1118" x2="660" y2="848" stroke="#bf4d16" stroke-width="4.5"/>
<text x="380" y="881" font-size="25" text-anchor="start" style="fill:#146aa5" class="label">E₂: a=0 (3)</text>
<text x="389" y="1025" font-size="25" text-anchor="start" style="fill:#146aa5" class="label">E₁′: b=0 (2)</text>
<text x="80" y="891" font-size="25" text-anchor="start" style="fill:#bf4d16" class="label">C₂: a=b (1)</text>
<circle cx="360" cy="983" r="8" fill="white" stroke="#172b3d" stroke-width="2.5"/>
<text x="44" y="1154" font-size="24" text-anchor="start" style="fill:#172b3d">Blow up the marked point (a,b)=(0,0).</text>
<text x="44" y="1189" font-size="24" text-anchor="start" style="fill:#4c6171">Three branches on a surface are not SNC.</text>
<rect x="24" y="1232" width="672" height="500" rx="16" fill="#fafcfd" stroke="#cad8e1" stroke-width="1.5"/>
<text x="44" y="1267" font-size="26" text-anchor="start" style="fill:#172b3d" font-weight="700">C · Third blow-up: the (p,q)-chart</text>
<text x="44" y="1302" font-size="24" text-anchor="start" style="fill:#4c6171">a=p, b=pq</text>
<text x="44" y="1343" font-size="30" text-anchor="start" style="fill:#172b3d" font-weight="600">f ∘ π₃ = p⁶q²(1 − q)</text>
<rect x="60" y="1372" width="600" height="270" fill="#fff" stroke="#d8e2e9"/>
<line x1="160" y1="1372" x2="160" y2="1642" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="360" y1="1372" x2="360" y2="1642" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="560" y1="1372" x2="560" y2="1642" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="1574.5" x2="660" y2="1574.5" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="1439.5" x2="660" y2="1439.5" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="1574.5" x2="660" y2="1574.5" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<line x1="360" y1="1372" x2="360" y2="1642" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<text x="652" y="1603.5" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">p</text>
<text x="347" y="1397" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">q</text>
<line x1="360" y1="1372" x2="360" y2="1642" stroke="#146aa5" stroke-width="4.5"/>
<line x1="60" y1="1574.5" x2="660" y2="1574.5" stroke="#146aa5" stroke-width="4.5"/>
<line x1="60" y1="1439.5" x2="660" y2="1439.5" stroke="#bf4d16" stroke-width="4.5"/>
<text x="78" y="1404" font-size="25" text-anchor="start" style="fill:#146aa5" class="label">E₃: p=0 (6)</text>
<text x="436" y="1622" font-size="25" text-anchor="start" style="fill:#146aa5" class="label">E₁″: q=0 (2)</text>
<text x="447" y="1428" font-size="25" text-anchor="start" style="fill:#bf4d16" class="label">C₃: q=1 (1)</text>
<circle cx="360" cy="1574.5" r="5" fill="white" stroke="#172b3d" stroke-width="2.5"/>
<circle cx="360" cy="1439.5" r="5" fill="white" stroke="#172b3d" stroke-width="2.5"/>
<text x="44" y="1678" font-size="24" text-anchor="start" style="fill:#172b3d">E₁″ and C₃ meet E₃ transversely.</text>
<text x="44" y="1713" font-size="24" text-anchor="start" style="fill:#4c6171">The E₂′ direction is in the other chart.</text>
<rect x="24" y="1756" width="672" height="500" rx="16" fill="#fafcfd" stroke="#cad8e1" stroke-width="1.5"/>
<text x="44" y="1791" font-size="26" text-anchor="start" style="fill:#172b3d" font-weight="700">D · Third blow-up: the (t,w)-chart</text>
<text x="44" y="1826" font-size="24" text-anchor="start" style="fill:#4c6171">b=t, a=tw</text>
<text x="44" y="1867" font-size="30" text-anchor="start" style="fill:#172b3d" font-weight="600">f ∘ π₃ = t⁶w³(w − 1)</text>
<rect x="60" y="1896" width="600" height="270" fill="#fff" stroke="#d8e2e9"/>
<line x1="160" y1="1896" x2="160" y2="2166" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="360" y1="1896" x2="360" y2="2166" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="560" y1="1896" x2="560" y2="2166" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="2098.5" x2="660" y2="2098.5" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="1963.5" x2="660" y2="1963.5" stroke="#e1e8ed" stroke-width="1" class="grid"/>
<line x1="60" y1="2098.5" x2="660" y2="2098.5" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<line x1="360" y1="1896" x2="360" y2="2166" stroke="#a8b6c0" stroke-width="1.5" class="axis"/>
<text x="652" y="2127.5" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">t</text>
<text x="347" y="1921" font-size="25" text-anchor="end" style="fill:#4c6171" class="label">w</text>
<line x1="360" y1="1896" x2="360" y2="2166" stroke="#146aa5" stroke-width="4.5"/>
<line x1="60" y1="2098.5" x2="660" y2="2098.5" stroke="#146aa5" stroke-width="4.5"/>
<line x1="60" y1="1963.5" x2="660" y2="1963.5" stroke="#bf4d16" stroke-width="4.5"/>
<text x="78" y="1928" font-size="25" text-anchor="start" style="fill:#146aa5" class="label">E₃: t=0 (6)</text>
<text x="431" y="2146" font-size="25" text-anchor="start" style="fill:#146aa5" class="label">E₂′: w=0 (3)</text>
<text x="442" y="1952" font-size="25" text-anchor="start" style="fill:#bf4d16" class="label">C₃: w=1 (1)</text>
<circle cx="360" cy="2098.5" r="5" fill="white" stroke="#172b3d" stroke-width="2.5"/>
<circle cx="360" cy="1963.5" r="5" fill="white" stroke="#172b3d" stroke-width="2.5"/>
<text x="44" y="2202" font-size="24" text-anchor="start" style="fill:#172b3d">E₂′ and C₃ meet E₃ transversely.</text>
<text x="44" y="2237" font-size="24" text-anchor="start" style="fill:#4c6171">The E₁″ direction is in the other chart.</text>
<text x="32" y="2301" font-size="25" text-anchor="start" style="fill:#172b3d" font-weight="600">Overlap: q ≠ 0, w ≠ 0;  t=pq, w=1/q.</text>
<text x="32" y="2340" font-size="24" text-anchor="start" style="fill:#172b3d">The q=1 and w=1 crossings are the same point.</text>
<text x="32" y="2377" font-size="24" text-anchor="start" style="fill:#172b3d">The q=0 and w=0 directions are distinct.</text>
<text x="32" y="2414" font-size="25" text-anchor="start" style="fill:#172b3d" font-weight="600">New multiplicity: 6 = 1 + 2 + 3.</text>
<text x="32" y="2449" font-size="24" text-anchor="start" style="fill:#4c6171">Weak order + both old divisor multiplicities.</text>
