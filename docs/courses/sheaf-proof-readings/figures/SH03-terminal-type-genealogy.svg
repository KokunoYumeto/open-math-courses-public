<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1480" viewBox="0 0 720 1480" role="img" aria-labelledby="title desc">
<title id="title">A finite genealogy of terminal component types</title>
<desc id="desc">Exact marked monomial x squared y squared z squared, mark three. Blow up x equals y equals zero. The old type 110 is selected; types 101 and 011 survive with appended zero. Three new types 1001,0101,0011 have new exceptional bit one. The maximum terminal weight over the origin fibre falls from six to five. This is one monomial transition, not a full resolution invariant for the function.</desc>
<metadata>Original programme figure and generator: CC0. Proof locator: SH03/subanalytic-sets-and-limiting-tangent-directions.md, Component types survive restriction without splitting into new types; TN12a--TN14. Framework comparison: Bierstone--Milman, author manuscript 25 November 1996, pp.39--40; explicit example computed here.</metadata>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#385b83"/></marker></defs>
<rect width="720" height="1480" fill="#ffffff"/>
<g font-family="Arial,DejaVu Sans,sans-serif" fill="#16283e">
<text x="32" y="48" font-size="31" font-weight="bold" text-anchor="start">A finite genealogy of component types</text>
<text x="32" y="89" font-size="27" font-weight="normal" text-anchor="start">One exact terminal-monomial transition</text>
<rect x="24" y="118" width="672" height="302" rx="16" fill="#f4f7fb" stroke="#b7c7d8" stroke-width="2"/>
<text x="46" y="159" font-size="29" font-weight="bold" text-anchor="start">1. Before the blow-up</text>
<text x="46" y="207" font-size="33" font-weight="normal" text-anchor="start">(x² y² z², 3)  on  ℝ³</text>
<text x="46" y="253" font-size="27" font-weight="normal" text-anchor="start">H₁: x = 0   H₂: y = 0   H₃: z = 0</text>
<text x="46" y="299" font-size="27" font-weight="normal" text-anchor="start">Minimal components: 110, 101, 011</text>
<text x="46" y="343" font-size="28" font-weight="bold" text-anchor="start" fill="#8a3e1f">Select 110: C = {x = y = 0}.</text>
<text x="46" y="389" font-size="26" font-weight="normal" text-anchor="start">Over a = (0,0,0): each type has bound 6.</text>
<rect x="24" y="445" width="672" height="403" rx="16" fill="#f4f7fb" stroke="#b7c7d8" stroke-width="2"/>
<text x="46" y="489" font-size="29" font-weight="bold" text-anchor="start">2. Both projective charts</text>
<text x="46" y="536" font-size="29" font-weight="normal" text-anchor="start">x = u,  y = uv,  z = z</text>
<text x="46" y="580" font-size="28" font-weight="normal" text-anchor="start">Controlled monomial: u v² z²   (mark 3)</text>
<text x="46" y="624" font-size="27" font-weight="normal" text-anchor="start">Types: 0101, 0011, 0110</text>
<path d="M46 646 H674" stroke="#b7c7d8" stroke-width="2"/>
<text x="46" y="691" font-size="29" font-weight="normal" text-anchor="start">y = t,  x = tw,  z = z</text>
<text x="46" y="735" font-size="28" font-weight="normal" text-anchor="start">Controlled monomial: t w² z²   (mark 3)</text>
<text x="46" y="779" font-size="27" font-weight="normal" text-anchor="start">Types: 1001, 0011, 1010</text>
<text x="46" y="823" font-size="25" font-weight="normal" text-anchor="start">New label H₄ = E; new exponent 2+2−3 = 1.</text>
<rect x="24" y="873" width="672" height="487" rx="16" fill="#f4f7fb" stroke="#b7c7d8" stroke-width="2"/>
<text x="46" y="917" font-size="28" font-weight="bold" text-anchor="start">3. Types over the compact origin fibre</text>
<text x="46" y="960" font-size="27" font-weight="normal" text-anchor="start">Old types survive with new bit 0:</text>
<text x="46" y="1003" font-size="28" font-weight="bold" text-anchor="start">101 → 1010   |   011 → 0110</text>
<text x="46" y="1045" font-size="27" font-weight="normal" text-anchor="start">Their current bounds are 5.</text>
<rect x="227" y="1072" width="266" height="68" rx="16" fill="#fff0e5" stroke="#bb7348" stroke-width="2"/>
<text x="360" y="1117" font-size="26" font-weight="bold" text-anchor="middle">selected 110; rank 6</text>
<path d="M360 1140 L135 1190" fill="none" stroke="#385b83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M360 1140 L360 1190" fill="none" stroke="#385b83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M360 1140 L585 1190" fill="none" stroke="#385b83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="46" y="1197" width="178" height="94" rx="16" fill="#e9f4f2" stroke="#599086" stroke-width="2"/>
<text x="135" y="1236" font-size="31" font-weight="bold" text-anchor="middle">1001</text>
<text x="135" y="1275" font-size="26" font-weight="normal" text-anchor="middle">rank 5</text>
<rect x="271" y="1197" width="178" height="94" rx="16" fill="#e9f4f2" stroke="#599086" stroke-width="2"/>
<text x="360" y="1236" font-size="31" font-weight="bold" text-anchor="middle">0101</text>
<text x="360" y="1275" font-size="26" font-weight="normal" text-anchor="middle">rank 5</text>
<rect x="496" y="1197" width="178" height="94" rx="16" fill="#e9f4f2" stroke="#599086" stroke-width="2"/>
<text x="585" y="1236" font-size="31" font-weight="bold" text-anchor="middle">0011</text>
<text x="585" y="1275" font-size="26" font-weight="normal" text-anchor="middle">rank 5</text>
<text x="46" y="1335" font-size="27" font-weight="normal" text-anchor="start">New bit 1 distinguishes every new type.</text>
<text x="32" y="1407" font-size="26" font-weight="normal" text-anchor="start">Bits record containment of a whole component.</text>
<text x="32" y="1445" font-size="24" font-weight="normal" text-anchor="start">One monomial step; no full-function invariant is claimed.</text>
</g></svg>
