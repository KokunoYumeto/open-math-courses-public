<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">Prescribed curvature values reached along one horizontal axis</title>
<desc id="desc">The origin o=(0,0) and sample points p1=(1,0), p2=(2,0), p3=(3,0) lie on the x axis. Outer support discs have radius one fifth; inner discs have radius one tenth. The potential annihilates the axis tangent. At each sample point its x-y curvature equals the assigned Lie algebra basis element. The containing coordinate ball is not drawn.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e4c"/></marker></defs>
<rect width="900" height="310" rx="12" fill="#faf8e9"/>
<g stroke="#21746b" stroke-width="1.8">
<circle cx="310" cy="142" r="42" fill="#def0df" stroke-dasharray="5 4"/><circle cx="310" cy="142" r="21" fill="#bcdac6"/>
<circle cx="520" cy="142" r="42" fill="#def0df" stroke-dasharray="5 4"/><circle cx="520" cy="142" r="21" fill="#bcdac6"/>
<circle cx="730" cy="142" r="42" fill="#def0df" stroke-dasharray="5 4"/><circle cx="730" cy="142" r="21" fill="#bcdac6"/>
</g>
<g stroke="#244e4c" stroke-width="2" marker-end="url(#arrow)"><path d="M60 142H840"/><path d="M100 211V53"/></g>
<path d="M100 142H730" stroke="#185c50" stroke-width="4"/>
<g fill="#153e37"><circle cx="100" cy="142" r="5"/><circle cx="310" cy="142" r="5"/><circle cx="520" cy="142" r="5"/><circle cx="730" cy="142" r="5"/></g>
<g fill="#183e38" font-family="Georgia, serif" font-size="21" text-anchor="middle">
<text x="100" y="235">o = (0, 0)</text><text x="310" y="211">p₁ = (1, 0)</text><text x="520" y="211">p₂ = (2, 0)</text><text x="730" y="211">p₃ = (3, 0)</text>
<text x="310" y="78">F(∂ₓ, ∂ᵧ) = X₁</text><text x="520" y="78">F(∂ₓ, ∂ᵧ) = X₂</text><text x="730" y="78">F(∂ₓ, ∂ᵧ) = X₃</text>
<text x="860" y="149">x</text><text x="100" y="34">y</text>
</g>
<text x="450" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#254e47">A(∂ₓ) = 0: transport from o to each sample has constant group coordinate.</text>
<text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52645b">Inner discs: χⱼ = 1. Support lies inside each dashed disc. The enclosing coordinate ball is not shown.</text>
</svg>
