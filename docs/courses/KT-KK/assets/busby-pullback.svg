<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">The Busby pullback square</title>
<desc id="desc">The top left corner is E tau, pairs (m,a) with q B of m equal to tau of a. Its two coordinate projections lead to M(B) at top right and A at bottom left. The quotient map q B and Busby invariant tau lead to Q(B) at bottom right. The ideal B consists of pairs (b,0).</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28435f"/></marker></defs>
<rect width="760" height="350" rx="16" fill="#f7fafc"/>
<g font-family="Georgia,serif" text-anchor="middle" fill="#152b43">
<text x="180" y="60" font-size="28">E<tspan dy="6" font-size="17">τ</tspan></text>
<text x="180" y="87" font-size="19">{(m,a): q<tspan dy="5" font-size="13">B</tspan><tspan dy="-5">(m)=τ(a)}</tspan></text>
<text x="615" y="65" font-size="28">M(B)</text>
<text x="180" y="245" font-size="28">A</text>
<text x="615" y="245" font-size="28">Q(B)</text>
<text x="402" y="43" font-size="21">(m,a) ↦ m</text>
<text x="90" y="153" font-size="21">(m,a) ↦ a</text>
<text x="655" y="153" font-size="23">q<tspan dy="5" font-size="15">B</tspan></text>
<text x="402" y="213" font-size="24">τ</text>
<text x="380" y="317" font-size="22">The ideal B is {(b,0): b ∈ B}.</text>
</g>
<g fill="none" stroke="#28435f" stroke-width="2.5">
<path d="M350 74H557"/><path d="M180 100V207"/><path d="M615 100V207"/><path d="M214 236H557"/>
</g>
<g fill="#28435f"><path d="M557 74L547 69L547 79Z"/><path d="M180 207L175 197L185 197Z"/><path d="M615 207L610 197L620 197Z"/><path d="M557 236L547 231L547 241Z"/></g>
</svg>
