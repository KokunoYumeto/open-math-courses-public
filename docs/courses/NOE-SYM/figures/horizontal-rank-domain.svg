<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-labelledby="title description">
<title id="title">One finite domain detects every horizontal invariant direction</title>
<desc id="description">A finite family of invariants I1 through Is attains the maximum horizontal rank s, which is at most n. Its horizontal differentials are already defined at level ell. All higher equation jets above the same domain Omega retain this basis of the horizontal invariant span, with each invariant evaluated wherever it is defined. The arrows between the jet levels are truncations.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9" fill="#285575"/></marker></defs>
<rect width="720" height="410" fill="white"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#172b40">
 <text x="360" y="35" text-anchor="middle" font-size="24">A finite family attains the maximum s ≤ n</text>
 <text x="360" y="75" text-anchor="middle" font-size="23">order(I¹, …, Iˢ) ≤ ℓ − 1</text>
 <g fill="#edf4fb" stroke="#285575" stroke-width="2">
  <rect x="20" y="112" width="185" height="80" rx="8"/>
  <rect x="268" y="112" width="185" height="80" rx="8"/>
  <rect x="516" y="112" width="185" height="80" rx="8"/>
 </g>
 <text x="112" y="160" text-anchor="middle" font-size="30">E<tspan baseline-shift="super" font-size="20">k+1</tspan><tspan baseline-shift="sub" font-size="20">Ω</tspan></text>
 <text x="360" y="160" text-anchor="middle" font-size="30">E<tspan baseline-shift="super" font-size="20">k</tspan><tspan baseline-shift="sub" font-size="20">Ω</tspan></text>
 <text x="608" y="160" text-anchor="middle" font-size="29">Ω ⊂ E<tspan baseline-shift="super" font-size="20">ℓ</tspan></text>
 <path d="M217 153H254" fill="none" stroke="#285575" stroke-width="2.5" marker-end="url(#arrow)"/>
 <path d="M465 153H502" fill="none" stroke="#285575" stroke-width="2.5" marker-end="url(#arrow)"/>
 <text x="360" y="231" text-anchor="middle" font-size="23">E<tspan baseline-shift="super" font-size="16">k</tspan><tspan baseline-shift="sub" font-size="16">Ω</tspan> = π<tspan baseline-shift="sub" font-size="16">k,ℓ</tspan>⁻¹(Ω),  k ≥ ℓ</text>
 <rect x="20" y="257" width="681" height="135" rx="8" fill="#f4f8f5" stroke="#9cbaa9"/>
 <text x="360" y="294" text-anchor="middle" font-size="25">rank(d<tspan baseline-shift="sub" font-size="17">H</tspan>I¹, …, d<tspan baseline-shift="sub" font-size="17">H</tspan>Iˢ) = s</text>
 <text x="360" y="337" text-anchor="middle" font-size="25">d<tspan baseline-shift="sub" font-size="17">H</tspan>F ∈ span(d<tspan baseline-shift="sub" font-size="17">H</tspan>I¹, …, d<tspan baseline-shift="sub" font-size="17">H</tspan>Iˢ)</text>
 <text x="360" y="373" text-anchor="middle" font-size="21">for every finite-order rational invariant F</text>
</g>
</svg>
