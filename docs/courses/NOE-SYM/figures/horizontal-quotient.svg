<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="title desc">
<title id="title">Horizontal directions modulo the common invariant annihilator</title>
<desc id="desc">Evaluation on independent invariant differentials identifies H_z modulo N_z with F to the power s. For u_y=0, at q=u_xx=1 the horizontal vectors D_x and D_x+D_y differ by D_y, which kills every invariant. Invariant differentiation is q inverse D_x and p_{j+1}=q times the invariant derivative of p_j.</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9" fill="context-stroke"/></marker>
</defs>
<rect width="720" height="540" fill="#fff"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#172b40">
 <text x="360" y="34" text-anchor="middle" font-size="24">Evaluation on invariant differentials</text>
 <rect x="24" y="74" width="194" height="83" rx="8" fill="#edf4fb" stroke="#234c72" stroke-width="2"/>
 <text x="121" y="125" text-anchor="middle" font-size="30">H<tspan baseline-shift="sub" font-size="20">z</tspan> / N<tspan baseline-shift="sub" font-size="20">z</tspan></text>
 <path d="M236 117H493" stroke="#234c72" stroke-width="2.5" marker-end="url(#arrow)"/>
 <text x="365" y="93" text-anchor="middle" font-size="23">[v] ↦ (vI¹, …, vIˢ)</text>
 <text x="365" y="150" text-anchor="middle" font-size="20">isomorphism</text>
 <rect x="513" y="74" width="182" height="83" rx="8" fill="#edf4fb" stroke="#234c72" stroke-width="2"/>
 <text x="604" y="125" text-anchor="middle" font-size="32">F<tspan baseline-shift="super" font-size="22">s</tspan></text>
 <text x="360" y="204" text-anchor="middle" font-size="23">N<tspan baseline-shift="sub" font-size="16">z</tspan> = { v : vF = 0 for every invariant F }</text>
 <rect x="18" y="240" width="684" height="282" rx="8" fill="#fafbfd" stroke="#b5c3d1"/>
 <text x="360" y="275" text-anchor="middle" font-size="25">u<tspan baseline-shift="sub" font-size="17">y</tspan> = 0,   q = u<tspan baseline-shift="sub" font-size="17">xx</tspan> = 1</text>
 <g fill="none" stroke-linecap="round" marker-end="url(#arrow)">
  <path d="M94 460H325" stroke="#9aa9b8" stroke-width="1.5"/>
  <path d="M100 466V297" stroke="#9aa9b8" stroke-width="1.5"/>
  <path d="M100 460H250" stroke="#16805e" stroke-width="3"/>
  <path d="M100 460L250 310" stroke="#2469b3" stroke-width="3"/>
  <path d="M250 460V310" stroke="#8846a7" stroke-width="2.5" stroke-dasharray="7 6"/>
 </g>
 <text x="74" y="313" text-anchor="end" font-size="22">D<tspan baseline-shift="sub" font-size="15">y</tspan></text>
 <text x="176" y="491" text-anchor="middle" font-size="23" fill="#12694d">D<tspan baseline-shift="sub" font-size="16">x</tspan></text>
 <text x="148" y="354" text-anchor="middle" font-size="22" fill="#205c9e" transform="rotate(-45 148 354)">D<tspan baseline-shift="sub" font-size="15">x</tspan> + D<tspan baseline-shift="sub" font-size="15">y</tspan></text>
 <text x="270" y="390" font-size="22" fill="#794095">D<tspan baseline-shift="sub" font-size="15">y</tspan></text>
 <text x="388" y="342" font-size="24">[D<tspan baseline-shift="sub" font-size="16">x</tspan>] = [D<tspan baseline-shift="sub" font-size="16">x</tspan> + D<tspan baseline-shift="sub" font-size="16">y</tspan>]</text>
 <text x="388" y="402" font-size="27">∇ = q⁻¹ D<tspan baseline-shift="sub" font-size="18">x</tspan></text>
 <text x="388" y="466" font-size="25">p<tspan baseline-shift="sub" font-size="17">j+1</tspan> = q ∇p<tspan baseline-shift="sub" font-size="17">j</tspan></text>
</g>
</svg>
