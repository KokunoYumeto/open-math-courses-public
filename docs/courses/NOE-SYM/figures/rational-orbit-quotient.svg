<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="title description">
<title id="title">A geometric quotient for a fixed algebraic action</title>
<desc id="description">The action from G times U to U and the projection to U have the same composite to the quotient Y. The quotient's geometric fibres are full group orbits. Its regular functions are exactly the invariant regular functions, and k(Y) equals the invariant rational field k(X) to the power G.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9" fill="#285575"/></marker></defs>
<rect width="720" height="560" fill="white"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#172b40">
 <text x="360" y="32" text-anchor="middle" font-size="24">A quotient for one fixed algebraic action</text>
 <g fill="#edf4fb" stroke="#285575" stroke-width="2">
  <rect x="28" y="65" width="180" height="65" rx="8"/>
  <rect x="510" y="65" width="180" height="65" rx="8"/>
  <rect x="28" y="260" width="180" height="65" rx="8"/>
  <rect x="510" y="260" width="180" height="65" rx="8"/>
 </g>
 <text x="118" y="108" text-anchor="middle" font-size="30">G × U</text>
 <text x="600" y="108" text-anchor="middle" font-size="30">U</text>
 <text x="118" y="303" text-anchor="middle" font-size="30">U</text>
 <text x="600" y="303" text-anchor="middle" font-size="30">Y</text>
 <g fill="none" stroke="#285575" stroke-width="2.5" marker-end="url(#arrow)">
  <path d="M224 98H491"/>
  <path d="M224 293H491"/>
  <path d="M118 145V241"/>
  <path d="M600 145V241"/>
 </g>
 <text x="360" y="79" text-anchor="middle" font-size="25">a</text>
 <text x="360" y="276" text-anchor="middle" font-size="25">q</text>
 <text x="74" y="202" text-anchor="middle" font-size="24">pr<tspan baseline-shift="sub" font-size="16">2</tspan></text>
 <text x="633" y="202" text-anchor="middle" font-size="25">q</text>
 <text x="360" y="205" text-anchor="middle" font-size="27">q(gx) = q(x)</text>
 <rect x="28" y="352" width="662" height="188" rx="8" fill="#f4f8f5" stroke="#9cbaa9"/>
 <text x="360" y="393" text-anchor="middle" font-size="27">O<tspan baseline-shift="sub" font-size="18">Y</tspan> = (q<tspan baseline-shift="sub" font-size="18">∗</tspan>O<tspan baseline-shift="sub" font-size="18">U</tspan>)<tspan baseline-shift="super" font-size="18">G</tspan></text>
 <text x="360" y="445" text-anchor="middle" font-size="27">k(Y) = k(X)<tspan baseline-shift="super" font-size="18">G</tspan></text>
 <text x="360" y="496" text-anchor="middle" font-size="26">q⁻¹(y)(L) = G(L) · x</text>
 <text x="360" y="526" text-anchor="middle" font-size="20">L algebraically closed</text>
</g>
</svg>
