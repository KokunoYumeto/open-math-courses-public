<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="950" viewBox="0 0 1320 950" role="img" aria-labelledby="title desc">
<title id="title">Three coordinates prove joint generation</title>
<desc id="desc">The two random-operator copies act on y and z. Changing the measured base from x to y by the inverse square root of the modulus exposes the common commutant on the remaining x coordinate. Its equality to the containing algebra commutant proves joint generation. A separate tensor flip exchanges the copies.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12" fill="#205667"/></marker></defs>
<rect width="1320" height="950" fill="#f8fafb"/>
<style>text{font-family:Arial,sans-serif;fill:#182b35}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:20px}.coord{font-size:32px;font-weight:700}.line{stroke:#205667;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="45" y="57" class="title">Three coordinates prove joint generation</text>
<text x="45" y="93" class="small">Principal standard Borel relation · faithful proper orbit measures · σ-finite transverse measure</text>
<rect x="45" y="125" width="570" height="245" rx="16" fill="#fff" stroke="#9bb4be" stroke-width="2"/>
<rect x="705" y="125" width="570" height="245" rx="16" fill="#fff" stroke="#9bb4be" stroke-width="2"/>
<text x="70" y="165" class="head">Original tensor field K</text>
<text x="730" y="165" class="head">After the unitary change C</text>
<text x="70" y="207" class="body">measure: μ(dx) ρₓ(dy) ρₓ(dz)</text>
<text x="730" y="207" class="body">measure: μ(dy) ρᵧ(dz) ρᵧ(dx)</text>
<rect x="100" y="233" width="130" height="63" rx="16" fill="#cce8ed" stroke="#9bb4be" stroke-width="2"/>
<text x="148" y="277" class="coord">y</text>
<rect x="270" y="233" width="130" height="63" rx="16" fill="#e5dcec" stroke="#9bb4be" stroke-width="2"/>
<text x="318" y="277" class="coord">z</text>
<rect x="440" y="233" width="130" height="63" rx="16" fill="#fff0c9" stroke="#9bb4be" stroke-width="2"/>
<text x="488" y="277" class="coord">x</text>
<rect x="755" y="233" width="130" height="63" rx="16" fill="#cce8ed" stroke="#9bb4be" stroke-width="2"/>
<text x="803" y="277" class="coord">y</text>
<rect x="925" y="233" width="130" height="63" rx="16" fill="#e5dcec" stroke="#9bb4be" stroke-width="2"/>
<text x="973" y="277" class="coord">z</text>
<rect x="1095" y="233" width="130" height="63" rx="16" fill="#fff0c9" stroke="#9bb4be" stroke-width="2"/>
<text x="1143" y="277" class="coord">x</text>
<text x="100" y="332" class="small">P acts here</text>
<text x="270" y="332" class="small">Q acts here</text>
<text x="440" y="332" class="small">old base</text>
<text x="755" y="332" class="small">new base</text>
<text x="925" y="332" class="small">Q acts here</text>
<text x="1095" y="332" class="small">remaining fibre</text>
<path d="M625,250 L694,250" class="line"/>
<text x="53" y="407" class="body">δ(y,x) = dmᵣ/dmₛ,    (Cξ)(y,z,x) = δ(y,x)⁻¹ᐟ² ξ(y,z,x)</text>
<text x="53" y="441" class="small">The P-kernel becomes b(y,y′) δ(y′,y)¹ᐟ²; its density is independent of x.</text>
<rect x="45" y="472" width="1230" height="210" rx="16" fill="#eef5f7" stroke="#9bb4be" stroke-width="2"/>
<text x="70" y="511" class="head">An operator commuting with P and Q</text>
<text x="70" y="552" class="body">1. Pair-coordinate multiplications ⇒ a decomposable field Aᵧ,𝓏 acting on x.</text>
<text x="70" y="592" class="body">2. Q-kernel tests ⇒ Aᵧ,𝓏 = Bᵧ, independent of z.</text>
<text x="70" y="632" class="body">3. P-kernel tests ⇒ Bᵧ = Bᵧ′ along measured arrows, after equivariant correction.</text>
<rect x="45" y="712" width="590" height="143" rx="16" fill="#fff" stroke="#9bb4be" stroke-width="2"/>
<rect x="675" y="712" width="600" height="143" rx="16" fill="#fff" stroke="#9bb4be" stroke-width="2"/>
<text x="70" y="750" class="head">The common commutant</text>
<text x="70" y="789" class="body">C (P ∨ Q)′ C* = C E′ C*</text>
<text x="70" y="827" class="small">Taking commutants gives P ∨ Q = E.</text>
<text x="700" y="750" class="head">The internal flip is a separate step</text>
<text x="700" y="789" class="body">Σ exchanges y and z in the original K.</text>
<text x="700" y="827" class="small">For H ≅ H ⊗ H,  S = W* Σ W lies in M.</text>
<text x="45" y="892" class="small">Proof locators: Lemma 2.1, Theorems 3.1 and 4.1. This is a coordinate schematic, not a geometric embedding.</text>
<text x="45" y="926" class="small">Connes: supplied PDF 35, Corollary 11. Programme prerequisites and complete proof are credited in the lesson.</text>
</svg>
