<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680">
<title>Modular rank-one averaging in positive and log spectral coordinates</title>
<desc>Exact coordinate and normalization diagram. The unitary Q includes the square root Jacobian. Ordinary time produces a factor 2 pi; normalized time removes it. No source artwork is reproduced.</desc>
<rect width="1120" height="680" fill="white"/>
<g font-family="Arial,sans-serif" fill="#18394a">
<text x="36" y="43" font-size="28" font-weight="bold">A spectral coordinate change and a separate time normalization</text>
<text x="36" y="79" font-size="19">T = multiplication by λ = eʳ. The modular action is A ↦ Tⁱᵗ A T⁻ⁱᵗ.</text>
<rect x="36" y="116" width="486" height="240" rx="12" fill="#eff6f8" stroke="#7aa8bd"/>
<rect x="598" y="116" width="486" height="240" rx="12" fill="#eff6f8" stroke="#7aa8bd"/>
<text x="55" y="149" font-size="23" font-weight="bold">Positive spectral coordinate</text>
<text x="55" y="188" font-size="22">λ ∈ (0, ∞); Hilbert measure dλ</text>
<text x="55" y="226" font-size="22">ξ(λ) = λ⁻¹ᐟ² 1<tspan baseline-shift="sub" font-size="15">[1,e]</tspan>(λ); ‖ξ‖ = 1</text>
<text x="55" y="271" font-size="21">λ |ξ(λ)|² = 1<tspan baseline-shift="sub" font-size="15">[1,e]</tspan>(λ)</text>
<text x="55" y="317" font-size="19">The Jacobian cannot be dropped.</text>
<text x="617" y="149" font-size="23" font-weight="bold">Log spectral coordinate</text>
<text x="617" y="188" font-size="22">r ∈ ℝ; Hilbert measure dr</text>
<text x="617" y="226" font-size="22">(Qξ)(r) = eʳᐟ² ξ(eʳ) = 1<tspan baseline-shift="sub" font-size="15">[0,1]</tspan>(r)</text>
<text x="617" y="271" font-size="21">dλ = eʳ dr; Q is unitary</text>
<text x="617" y="317" font-size="19">Proof: Proposition 2.1; equation (2.5).</text>
<path d="M 527 222 H 589" stroke="#456b7d" stroke-width="3"/>
<path d="M 589 222 l -12 -7 v 14 z" fill="#456b7d"/>
<text x="548" y="207" font-size="22">Q</text>
<rect x="36" y="389" width="1048" height="157" rx="12" fill="#eef5ed" stroke="#79a77a"/>
<text x="55" y="425" font-size="23" font-weight="bold">The same rank-one operator, two time measures</text>
<text x="55" y="466" font-size="22">∫ Tⁱᵗ |ξ⟩⟨ξ| T⁻ⁱᵗ dt = 2π M<tspan baseline-shift="sub" font-size="15">1[1,e]</tspan></text>
<text x="55" y="507" font-size="22">∫ Tⁱᵗ |ξ⟩⟨ξ| T⁻ⁱᵗ dt/(2π) = M<tspan baseline-shift="sub" font-size="15">1[1,e]</tspan></text>
<text x="36" y="586" font-size="19">Raw time multiplies the interval projection by 2π; changing spectral coordinates preserves it.</text>
<text x="36" y="620" font-size="19">Section 3, equations (3.1)–(3.2); Exercises 5.1–5.2.</text>
<text x="36" y="654" font-size="17">Exact symbolic diagram. Connes Lemma 10(b); Claude-WR Lemma 8.6. Original artwork.</text>
</g></svg>
