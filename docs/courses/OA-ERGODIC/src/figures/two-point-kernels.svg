<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
<title id="title">Two-point relation kernels and modular coordinates</title>
<desc id="desc">Rows are orbit points a,b; source columns a,b have masses one quarter and three quarters. The algebra applies the same matrix to each column. Moving source a to b multiplies by one over square root of three. The modular multiplier matrix is one, one third, three, one.</desc>
<rect width="1040" height="600" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:26px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}.value{font-size:26px}.formula{font-size:23px}.sub{font-size:17px}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#156b80"/></marker></defs>
<text x="35" y="42" class="title" text-anchor="start">One orbit, two base points</text>
<text x="35" y="80" class="label" text-anchor="start">X = {a, b}; μ(a) = 1/4, μ(b) = 3/4</text>
<text x="35" y="128" class="label" text-anchor="start">Kernel vector ξ(y, x)</text>
<text x="165" y="170" class="small" text-anchor="middle">source a</text>
<text x="325" y="170" class="small" text-anchor="middle">source b</text>
<text x="48" y="246" class="value" text-anchor="start">a</text>
<rect x="90" y="192" width="150" height="82" rx="5" fill="#e3f1f4" stroke="#8ea1a9"/>
<text x="165" y="241" class="formula" text-anchor="middle">ξ(a,a)</text>
<rect x="250" y="192" width="150" height="82" rx="5" fill="#f8ebd7" stroke="#8ea1a9"/>
<text x="325" y="241" class="formula" text-anchor="middle">ξ(a,b)</text>
<text x="48" y="338" class="value" text-anchor="start">b</text>
<rect x="90" y="284" width="150" height="82" rx="5" fill="#e3f1f4" stroke="#8ea1a9"/>
<text x="165" y="333" class="formula" text-anchor="middle">ξ(b,a)</text>
<rect x="250" y="284" width="150" height="82" rx="5" fill="#f8ebd7" stroke="#8ea1a9"/>
<text x="325" y="333" class="formula" text-anchor="middle">ξ(b,b)</text>
<text x="10" y="260" class="small" text-anchor="start">y</text>
<text x="245" y="405" class="small" text-anchor="middle">x</text>
<text x="165" y="392" class="sub" text-anchor="middle">weight 1/4</text>
<text x="325" y="392" class="sub" text-anchor="middle">weight 3/4</text>
<path d="M165 432 C165 487,325 487,325 432" fill="none" stroke="#156b80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="245" y="506" class="small" text-anchor="middle">Wθ: column a → column b</text>
<text x="245" y="535" class="small" text-anchor="middle">θ(a) = b; scalar = 1/√3</text>
<line x1="458" y1="112" x2="458" y2="555" stroke="#ccd5da"/>
<text x="510" y="130" class="label" text-anchor="start">An orbit operator: ξ ↦ Tξ</text>
<text x="510" y="165" class="small" text-anchor="start">The same 2 × 2 matrix T acts on both columns.</text>
<text x="510" y="216" class="label" text-anchor="start">Modular multiplier δ(y,x) = μ(y)/μ(x)</text>
<text x="682" y="259" class="small" text-anchor="middle">x = a</text>
<text x="848" y="259" class="small" text-anchor="middle">x = b</text>
<text x="540" y="326" class="small" text-anchor="start">y = a</text>
<rect x="607" y="279" width="150" height="67" rx="5" fill="#e3f1f4" stroke="#8ea1a9"/>
<text x="682" y="322" class="value" text-anchor="middle">1</text>
<rect x="773" y="279" width="150" height="67" rx="5" fill="#f8ebd7" stroke="#8ea1a9"/>
<text x="848" y="322" class="value" text-anchor="middle">1/3</text>
<text x="540" y="403" class="small" text-anchor="start">y = b</text>
<rect x="607" y="356" width="150" height="67" rx="5" fill="#e3f1f4" stroke="#8ea1a9"/>
<text x="682" y="399" class="value" text-anchor="middle">3</text>
<rect x="773" y="356" width="150" height="67" rx="5" fill="#f8ebd7" stroke="#8ea1a9"/>
<text x="848" y="399" class="value" text-anchor="middle">1</text>
<text x="510" y="465" class="small" text-anchor="start">Δ multiplies each ξ(y,x) by this δ(y,x).</text>
<text x="510" y="501" class="small" text-anchor="start">Jξ(y,x) = √δ(y,x) · conjugate[ξ(x,y)]</text>
<text x="510" y="537" class="sub" text-anchor="start">H-norm² = Σy |ξ(y,a)|²/4 + 3Σy |ξ(y,b)|²/4</text>
<text x="35" y="585" class="sub" text-anchor="start">Example 5.2 · Theorem 3.1 (modular data) · Theorem 4.1 (orbit fields)</text>
</svg>
