<svg xmlns="http://www.w3.org/2000/svg" width="500" height="930" viewBox="0 0 500 930" role="img" aria-labelledby="title desc">
<title id="title">Counting modulus with infinite isotropy</title>
<desc id="desc">The groupoid has arrows (n,y,x) for integer n and two objects a,b of masses two and seven. Three parallel arrows from a to b represent infinitely many integer labels. Each has source-counting mass two, range-counting mass seven and modulus seven halves. The principal relation counts its endpoint pair once. Both unweighted endpoint pushforwards assign infinite mass to that pair, and to every other pair, so they are not sigma-finite. The density is computed using the common countable endpoint kernel, not those pushforwards.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#172c3b;font-size:18px}.head{font-weight:bold;font-size:22px}.small{font-size:16px}.math{font-family:Georgia,serif;font-size:20px}.card{fill:#f1f7fb;stroke:#abc7d9;stroke-width:1.4}.good{fill:#eef8ef;stroke:#8ab596;stroke-width:1.4}.bad{fill:#fff4e7;stroke:#d7ac75;stroke-width:1.4}.arrow{stroke:#356787;stroke-width:2;fill:none;marker-end:url(#tip)}</style><marker id="tip" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#356787"/></marker></defs>
<rect width="500" height="930" fill="white"/>
<text x="24" y="35" class="head">Counting with infinitely many arrow labels</text>
<text x="24" y="69" class="math">γₙ = (n, b, a) : a → b, n ∈ ℤ</text>
<rect x="20" y="91" width="460" height="244" rx="12" class="card"/>
<circle cx="82" cy="218" r="27" fill="#d9eaf4" stroke="#356787"/><circle cx="414" cy="218" r="27" fill="#d9eaf4" stroke="#356787"/>
<text x="76" y="224" class="math">a</text><text x="407" y="224" class="math">b</text>
<path d="M105 200 Q248 128 391 200" class="arrow"/>
<path d="M110 218 H385" class="arrow"/>
<path d="M105 236 Q248 308 391 236" class="arrow"/>
<text x="235" y="159" class="math">γ₋₁</text><text x="235" y="210" class="math">γ₀</text><text x="235" y="290" class="math">γ₁</text>
<text x="37" y="130" class="small">Three representatives of infinitely many arrows</text>
<text x="43" y="317" class="small">μ(a) = 2</text><text x="375" y="317" class="small">μ(b) = 7</text>
<rect x="20" y="353" width="460" height="143" rx="12" class="good"/>
<text x="36" y="387" class="head">Individual arrow masses are finite</text>
<text x="36" y="421" class="math">νₛ({γₙ}) = 2; νᵣ({γₙ}) = 7</text>
<text x="36" y="455" class="math">δ(γₙ) = 7/2 for every n ∈ ℤ</text>
<text x="36" y="481" class="small">Both arrow measures are sigma-finite.</text>
<rect x="20" y="514" width="460" height="147" rx="12" class="card"/>
<text x="36" y="548" class="head">Count the endpoint pair just once</text>
<text x="36" y="582" class="math">p(γₙ) = (b, a)</text>
<text x="36" y="615" class="math">ν̄ₛ({(b,a)}) = 2; ν̄ᵣ({(b,a)}) = 7</text>
<text x="36" y="645" class="small">The principal counting ratio is still 7/2.</text>
<rect x="20" y="679" width="460" height="224" rx="12" class="bad"/>
<text x="36" y="713" class="head">The unweighted pushforward is different</text>
<text x="36" y="749" class="math">(p<tspan baseline-shift="sub" font-size="14">∗</tspan>νₛ)({(b,a)}) = Σₙ 2 = ∞</text>
<text x="36" y="784" class="math">(p<tspan baseline-shift="sub" font-size="14">∗</tspan>νᵣ)({(b,a)}) = Σₙ 7 = ∞</text>
<text x="36" y="817" class="small">Every endpoint pair has infinite mass.</text>
<text x="36" y="846" class="small">These pushforwards are not sigma-finite.</text>
<text x="36" y="879" class="small">Use the common counting kernel over the relation.</text>
</svg>
