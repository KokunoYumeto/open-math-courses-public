<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="790" viewBox="0 0 1160 790">
<rect width="1160" height="790" fill="#f6faf9"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3e7179"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" fill="#193d49">
<text x="580" y="45" font-size="29" text-anchor="middle">Connecting arrows transport the stabilizer field</text>
<text x="580" y="82" font-size="21" text-anchor="middle">S₃ acts on X = {1,2,3}; permutation products apply the rightmost factor first.</text>
<rect x="35" y="119" width="250" height="160" rx="10" fill="#e2eeed"/>
<text x="160" y="155" font-size="23" text-anchor="middle">unit 1</text>
<text x="160" y="192" font-size="25" text-anchor="middle">H₁ = {e,(23)}</text>
<circle cx="160" cy="240" r="12" fill="white" stroke="#3e7179" stroke-width="2"/>
<rect x="455" y="119" width="250" height="160" rx="10" fill="#e2eeed"/>
<text x="580" y="155" font-size="23" text-anchor="middle">unit 2</text>
<text x="580" y="192" font-size="25" text-anchor="middle">H₂ = {e,(13)}</text>
<circle cx="580" cy="240" r="12" fill="white" stroke="#3e7179" stroke-width="2"/>
<rect x="875" y="119" width="250" height="160" rx="10" fill="#e2eeed"/>
<text x="1000" y="155" font-size="23" text-anchor="middle">unit 3</text>
<text x="1000" y="192" font-size="25" text-anchor="middle">H₃ = {e,(12)}</text>
<circle cx="1000" cy="240" r="12" fill="white" stroke="#3e7179" stroke-width="2"/>
<line x1="180" y1="240" x2="560" y2="240" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="370" y="218" font-size="22" text-anchor="middle">c(2,1) = (12)</text>
<line x1="600" y1="240" x2="980" y2="240" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="790" y="218" font-size="22" text-anchor="middle">c(3,2) = (123)</text>
<path d="M160,261 L160,340 L1000,340 L1000,261" fill="none" stroke="#3e7179" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="580" y="328" font-size="23" text-anchor="middle">c(3,1) = (13) = c(3,2)c(2,1)</text>
<text x="580" y="402" font-size="25" text-anchor="middle">Original arrows: g = (123): 1 → 2, then l = (23): 2 → 3</text>
<text x="580" y="448" font-size="25" text-anchor="middle">Range loops: h = (13) ∈ H₂,  k = (12) ∈ H₃</text>
<text x="580" y="494" font-size="25" text-anchor="middle">Transport first: λ₃,₂(h) = (123)(13)(132) = (12)</text>
<text x="580" y="540" font-size="24" text-anchor="middle">Split product: k λ₃,₂(h) = e.   Original label: lg = c(3,1) = (13).</text>
<rect x="70" y="575" width="1020" height="128" rx="10" fill="#e2eeed"/>
<text x="580" y="612" font-size="23" text-anchor="middle">18 labelled arrows; 9 endpoint pairs; two labels above each pair.</text>
<text x="580" y="651" font-size="23" text-anchor="middle">Full finite algebra: M₃(ℂ) ⊕ M₃(ℂ).   Principal relation algebra: M₃(ℂ).</text>
<text x="580" y="686" font-size="22" text-anchor="middle">The global kernel is trivial. Every point stabilizer has order two.</text>
<text x="580" y="742" font-size="20" text-anchor="middle">Proof: Theorem 2.1, Proposition 5.1 and equations (5.1)–(5.3).</text>
<text x="580" y="772" font-size="18" text-anchor="middle">Human source: Takesaki III, XIII.3.32–3.33. Exact finite example; no schematic geometry.</text>
</g>
</svg>
