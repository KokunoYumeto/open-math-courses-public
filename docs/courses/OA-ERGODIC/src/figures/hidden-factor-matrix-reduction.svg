<svg xmlns="http://www.w3.org/2000/svg" width="480" height="3536" viewBox="0 0 480 3536" role="img" aria-labelledby="title desc" style="display:block;width:100%;max-width:480px;height:auto">
  <title id="title">Exact matrix reduction and failure of every finite ambient compression</title>
  <desc id="desc">Conditional on the full Connes pair in M=B(ell squared N) spatial tensor N, where N=L(F infinity) for the free group on countably many generators: P=sigma(M), Q=SPS, P and Q are mutual relative commutants, their join is M, and S is an internal self-adjoint involution. The commuting matrix positions p=e11 and q=f11 give r=pq nonzero with infinite ambient trace. R=rMr contains normal unital copies A=(pPp)q and B=p(qQq) of N, with A prime intersect R=B, B prime intersect R=A, A join B=R, and internal s=rSr satisfying s squared=r and sAs=B. The explicit unitary U from ell squared N tensor ell squared N tensor rH to H sends delta i tensor delta k tensor xi to e i1 f k1 xi. It gives the actual matrix placements of P and Q, M as B(ell squared N squared) spatial tensor R, and U star S U=F tensor s. The converse requires an actual normal stable ambient isomorphism Theta onto M. For every nonzero finite ambient projection h below r, h fails to commute with each of A and B. For either D=A or B, the positive compression defect equals h x star (r minus h) x h=((r minus h)xh) star ((r minus h)xh). Thus neither compression into hRh is a homomorphism. Complete proofs: Theorem 5H.1 and Proposition 5H.2. Human-source target: Connes, Corollary 11, author-hosted PDF 44–45. The unrestricted existential source question remains unresolved.</desc>
  <metadata>Original mathematical diagram source: CC0. Native SVG only; no external image, font, script or sampled geometry. This diagram records conditional results and does not claim nonexistence of a full source pair.</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#466577"/>
    </marker>
    <style>
      .body { font-family:Arial,Helvetica,sans-serif; font-size:22px; fill:#203849; }
      .math { font-family:Cambria,"Times New Roman",serif; font-size:24px; fill:#142f43; }
      .heading { font-family:Arial,Helvetica,sans-serif; font-size:23px; font-weight:700; fill:#17394a; }
      .title { font-family:Arial,Helvetica,sans-serif; font-size:24px; font-weight:700; fill:#17394a; }
      .strong { font-weight:700; }
      .panel { stroke-width:1.5; }
      .connector { fill:none; stroke:#466577; stroke-width:2.5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="480" height="3536" fill="#f8fafb"/>
  <g id="matrix-reduction">
    <text x="22" y="42" class="title">Matrix coordinates, finite copies,</text>
    <text x="22" y="73" class="title">and an infinite-trace corner</text>
    <text x="22" y="111" class="body">An exact conditional reduction</text>

    <rect x="16" y="139" width="448" height="321" rx="12" fill="#eaf1f7" stroke="#7195aa" class="panel"/>
    <text x="38" y="177" class="heading">1 · Full hypothetical source pair</text>
    <text x="38" y="218" class="math">M = B(L) ⊗ N,  L = ℓ²(ℕ)</text>
    <text x="38" y="253" class="math">N = L(F∞),  T = Tr ⊗ τ<tspan baseline-shift="sub" font-size="18">N</tspan></text>
    <text x="38" y="288" class="body">σ : M → M normal and unital</text>
    <text x="38" y="323" class="math">S ∈ M,  S = S*,  S² = 1</text>
    <text x="38" y="358" class="math">P = σ(M),  Q = SPS</text>
    <text x="38" y="393" class="math">P′ ∩ M = Q,  Q′ ∩ M = P</text>
    <text x="38" y="428" class="math">[P,Q] = 0,  P ∨ Q = M</text>
    <path d="M240 468 L240 491" class="connector"/>

    <rect x="16" y="507" width="448" height="414" rx="12" fill="#eef6ef" stroke="#7b9a80" class="panel"/>
    <text x="38" y="545" class="heading">2 · The simultaneous corner</text>
    <text x="38" y="581" class="math">eᵢⱼ = σ(Eᵢⱼ ⊗ 1),  fᵢⱼ = SeᵢⱼS</text>
    <text x="38" y="617" class="math">p = e₁₁,  q = f₁₁,  r = pq ≠ 0</text>
    <text x="38" y="653" class="math strong">T(r) = ∞,  SrS = r</text>
    <text x="38" y="689" class="math">R = rMr,  1<tspan baseline-shift="sub" font-size="18">R</tspan> = r</text>
    <text x="38" y="725" class="math">A = (pPp)q ≅ N</text>
    <text x="38" y="761" class="math">B = p(qQq) ≅ N</text>
    <text x="38" y="798" class="body">A,B embed normally and unitally.</text>
    <text x="38" y="832" class="body">p,q are finite in their own copies.</text>
    <text x="38" y="864" class="body">T(r) = ∞ in the ambient factor M.</text>
    <text x="38" y="900" class="body">Trace input: Theorem 5C.4.</text>
    <path d="M240 929 L240 952" class="connector"/>

    <rect x="16" y="968" width="448" height="271" rx="12" fill="#eef6ef" stroke="#7b9a80" class="panel"/>
    <text x="38" y="1006" class="heading">3 · All reduced clauses</text>
    <text x="38" y="1045" class="math">[A,B] = 0,  A ∨ B = R</text>
    <text x="38" y="1082" class="math">A′ ∩ R = B,  B′ ∩ R = A</text>
    <text x="38" y="1119" class="math">s = rSr ∈ R,  s = s*,  s² = r</text>
    <text x="38" y="1156" class="math">sAs = B</text>
    <text x="38" y="1193" class="body">R is a type II∞ factor.</text>
    <path d="M240 1247 L240 1270" class="connector"/>

    <rect x="16" y="1286" width="448" height="581" rx="12" fill="#eaf1f7" stroke="#7195aa" class="panel"/>
    <text x="38" y="1324" class="heading">4 · The explicit matrix unitary</text>
    <text x="38" y="1361" class="body">H is a faithful normal M-space.</text>
    <text x="38" y="1396" class="math">U : L ⊗ L ⊗ rH → H</text>
    <text x="38" y="1431" class="math">U(δᵢ ⊗ δₖ ⊗ ξ) = eᵢ₁fₖ₁ξ</text>
    <text x="38" y="1466" class="math">ξ ∈ rH,  i,k ∈ ℕ;  uᵢₖ = eᵢ₁fₖ₁</text>
    <text x="38" y="1501" class="math">uᵢₖ* uⱼₗ = δᵢⱼ δₖₗ r</text>
    <text x="38" y="1536" class="math">Σᵢ,ₖ uᵢₖuᵢₖ* = 1 strongly</text>
    <line x1="38" y1="1555" x2="442" y2="1555" stroke="#bbccd6"/>
    <text x="38" y="1590" class="math">U*MU = B(L) ⊗ B(L) ⊗ R</text>
    <text x="38" y="1625" class="math">≅ B(ℓ²(ℕ²)) ⊗ R</text>
    <text x="38" y="1660" class="math">U*PU = B(L) ⊗ 1 ⊗ A</text>
    <text x="38" y="1695" class="math">U*QU = 1 ⊗ B(L) ⊗ B</text>
    <text x="38" y="1730" class="math">U*SU = F ⊗ s</text>
    <text x="38" y="1765" class="math">F(δᵢ ⊗ δₖ) = δₖ ⊗ δᵢ</text>
    <text x="38" y="1803" class="body">Every ⊗ in this figure is spatial.</text>
    <text x="38" y="1838" class="body">Theorem 5H.1 · matrix reconstruction</text>

    <rect x="16" y="1890" width="448" height="262" rx="12" fill="#f3edf6" stroke="#9e88ae" class="panel"/>
    <text x="38" y="1928" class="heading">5 · Converse: the ambient class</text>
    <text x="38" y="1967" class="math">Θ : B(L) ⊗ B(L) ⊗ R → M</text>
    <text x="38" y="2003" class="body">Require a normal onto isomorphism.</text>
    <text x="38" y="2038" class="body">Θ transports this pair and F ⊗ s</text>
    <text x="38" y="2073" class="body">back to every full source clause.</text>
    <text x="38" y="2108" class="body">Type II labels alone do not give Θ.</text>
  </g>

  <g id="finite-compression">
    <text x="22" y="2214" class="title">Finite ambient compression</text>
    <text x="22" y="2250" class="body">Proposition 5H.2 · every finite h ≤ r</text>
    <rect x="16" y="2270" width="448" height="299" rx="12" fill="#fff4df" stroke="#ab9155" class="panel"/>
    <text x="38" y="2308" class="heading">Every nonzero finite projection</text>
    <text x="38" y="2345" class="math">h ∈ Proj(R),  0 ≠ h ≤ r,  T(h) &lt; ∞</text>
    <text x="38" y="2382" class="body">Each nonzero projection z in A or B</text>
    <text x="38" y="2417" class="math">has T(z) = ∞.</text>
    <text x="38" y="2453" class="body">Relative commutants therefore force</text>
    <text x="38" y="2488" class="math strong">[h,A] ≠ 0 and [h,B] ≠ 0.</text>
    <text x="38" y="2525" class="body">This holds for every such h.</text>
    <path d="M240 2577 L240 2600" class="connector"/>

    <rect x="16" y="2616" width="448" height="404" rx="12" fill="#fff4df" stroke="#ab9155" class="panel"/>
    <text x="38" y="2654" class="heading">The exact positive defect</text>
    <text x="38" y="2691" class="math">D = A or B,  cₕ : D → hRh</text>
    <text x="38" y="2726" class="math">cₕ(x) = hxh  (x ∈ D)</text>
    <text x="38" y="2761" class="math">cₕ(x*x) − cₕ(x)*cₕ(x)</text>
    <text x="38" y="2796" class="math">= h x*(r − h)x h</text>
    <text x="38" y="2831" class="math">= ((r − h)xh)*((r − h)xh) ≥ 0</text>
    <text x="38" y="2868" class="body">Multiplicativity would force</text>
    <text x="38" y="2903" class="math">(r − h)xh = 0 for all x ∈ D.</text>
    <text x="38" y="2938" class="body">Using x* then gives hx = xh.</text>
    <text x="38" y="2974" class="body">For each copy some defect is nonzero.</text>

    <rect x="16" y="3044" width="448" height="183" rx="12" fill="#fcebee" stroke="#aa7884" class="panel"/>
    <text x="38" y="3082" class="heading">Neither copy compresses</text>
    <text x="38" y="3115" class="heading">as a homomorphism.</text>
    <text x="38" y="3154" class="math">A → hRh,  a ↦ hah</text>
    <text x="38" y="3191" class="math">B → hRh,  b ↦ hbh</text>
  </g>

  <g id="caption">
    <text x="22" y="3268" class="body">Complete proofs: Theorem 5H.1 and</text>
    <text x="22" y="3300" class="body">Proposition 5H.2.</text>
    <text x="22" y="3340" class="body">Human-source target: Connes,</text>
    <text x="22" y="3372" class="body">Corollary 11; author PDF 44–45.</text>
    <text x="22" y="3412" class="body">F∞: countably many free generators.</text>
    <text x="22" y="3452" class="heading">Original existence question:</text>
    <text x="22" y="3486" class="heading">unresolved.</text>
  </g>
</svg>
