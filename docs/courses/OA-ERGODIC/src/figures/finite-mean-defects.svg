<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">Exact errors of finite-class averaging</title><desc id="desc">Two points of masses one quarter and three quarters, diagonal finite relation and partial map zero to one. A single plus-minus-one arrow function gives defects zero minus two and minus two zero, with integral norms three halves and one half.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#176c91"/></marker></defs>
<rect width="1120" height="900" fill="#f5f8fb"/>
<g font-family="Arial, sans-serif" fill="#172b3a">
<text x="48" y="58" font-size="30" font-weight="bold">Finite averaging: source and range give different errors</text>
<text x="48" y="96" font-size="20">R = X × X,  X = {0, 1},  S = {(0, 0), (1, 1)}</text>
<rect x="36" y="124" width="1048" height="204" rx="16" fill="white" stroke="#bacbd6"/>
<circle cx="220" cy="207" r="39" fill="#e6f2fa" stroke="#176c91" stroke-width="2"/><text x="212" y="216" font-size="27">0</text>
<circle cx="856" cy="207" r="39" fill="#fff1db" stroke="#b7771a" stroke-width="2"/><text x="848" y="216" font-size="27">1</text>
<path d="M274 207H798" stroke="#176c91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="452" y="179" font-size="24">θ : {0} → {1}</text>
<text x="136" y="278" font-size="23">μ({0}) = 1/4</text><text x="772" y="278" font-size="23">μ({1}) = 3/4</text>
<text x="394" y="304" font-size="20">jθ(1) = 1/3,   δ(1,0) = 3</text>
<rect x="36" y="349" width="1048" height="223" rx="16" fill="white" stroke="#bacbd6"/>
<text x="62" y="386" font-size="24" font-weight="bold">One common witness: fS = 2·1S − 1</text>
<text x="62" y="422" font-size="20">Rows: range z.  Columns: source x.</text>
<text x="96" y="462" font-size="22">z \ x</text><text x="231" y="462" font-size="22">0</text><text x="317" y="462" font-size="22">1</text>
<text x="119" y="506" font-size="24">0</text><text x="224" y="506" font-size="24">+1</text><text x="309" y="506" font-size="24">−1</text>
<text x="119" y="548" font-size="24">1</text><text x="224" y="548" font-size="24">−1</text><text x="309" y="548" font-size="24">+1</text>
<text x="494" y="438" font-size="22">QS reads the diagonal, so QS fS = 1.</text>
<text x="494" y="480" font-size="22">Dθ,S = QS Lθ − Lθ QS</text>
<text x="494" y="522" font-size="22">Dθ,S : L∞(R, νr) → L¹(X, μ)</text>
<rect x="36" y="594" width="510" height="199" rx="16" fill="#e6f2fa" stroke="#90b6ca"/>
<rect x="565" y="594" width="519" height="199" rx="16" fill="#fff1db" stroke="#d7b77f"/>
<text x="61" y="635" font-size="23" font-weight="bold">Forward: θ</text><text x="590" y="635" font-size="23" font-weight="bold">Backward: θ⁻¹</text>
<text x="61" y="677" font-size="23">Dθ,S fS = (0, −2)</text><text x="590" y="677" font-size="23">Dθ⁻¹,S fS = (−2, 0)</text>
<text x="61" y="720" font-size="23">qθ(S) = μ({1}) = 3/4</text><text x="590" y="720" font-size="23">pθ(S) = μ({0}) = 1/4</text>
<text x="61" y="763" font-size="23" font-weight="bold">‖Dθ,S‖∞→1 = 2qθ = 3/2</text><text x="590" y="763" font-size="23" font-weight="bold">‖Dθ⁻¹,S‖∞→1 = 2pθ = 1/2</text>
<text x="48" y="832" font-size="20">Exact model and proof: Proposition 2.3 · Theorem 6.6 · Exercise 7.11</text>
<text x="48" y="867" font-size="18">Measured amenability and finite-relation method: Connes–Feldman–Weiss (1981), §§5–6.</text>
</g></svg>
