<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540">
<title>Weighted finite relation tiles and tail intersections</title>
<desc>Exact four-point cycle with masses one, two, three, six over twelve. The tile zero, one has boundary source mass two thirds and range mass one third. A proof schematic then records disjoint predecessor columns and increasing tail intersections.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1440" height="1540" fill="#f7fafc"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#14253b;font-size:26px}.title{font-size:36px;font-weight:700}.head{font-size:30px;font-weight:700}.small{font-size:23px}.math{font-size:29px}.node{font-size:29px;font-weight:700}.muted{fill:#536579}</style>
<text x="60" y="66" class="title">Weighted finite tiles and increasing finite relations</text>
<text x="60" y="110" class="small muted">Exact example and proof schematic • arrows are source → range</text>
<rect x="45" y="145" width="1350" height="425" rx="18" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/>
<text x="75" y="193" class="head">1. Unequal masses change the boundary measure</text>
<rect x="118" y="224" width="449" height="126" rx="18" fill="#e5f5ee" stroke="#398466" stroke-width="2"/>
<text x="302" y="253" class="small">F = {0, 1}</text>
<circle cx="165" cy="289" r="29" fill="#fff" stroke="#52708e" stroke-width="2"/>
<text x="165" y="299" text-anchor="middle" class="node">0</text>
<text x="60" y="298" class="small">1/12</text>
<circle cx="520" cy="289" r="29" fill="#fff" stroke="#52708e" stroke-width="2"/>
<text x="520" y="299" text-anchor="middle" class="node">1</text>
<text x="600" y="298" class="small">2/12</text>
<circle cx="520" cy="472" r="29" fill="#fff" stroke="#52708e" stroke-width="2"/>
<text x="520" y="482" text-anchor="middle" class="node">2</text>
<text x="600" y="481" class="small">3/12</text>
<circle cx="165" cy="472" r="29" fill="#fff" stroke="#52708e" stroke-width="2"/>
<text x="165" y="482" text-anchor="middle" class="node">3</text>
<text x="60" y="481" class="small">6/12</text>
<path d="M200 289 L480 289" stroke="#398466" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M520 325 L520 433" stroke="#bd3b4a" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M480 472 L205 472" stroke="#8a9bad" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M165 435 L165 326" stroke="#bd3b4a" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
<text x="211" y="424" class="small">θ: 0 → 1 → 2 → 3 → 0</text>
<text x="720" y="254" class="math">Boundary E = {(2, 1), (0, 3)}</text>
<text x="720" y="310" class="math">source points: 1, 3</text>
<text x="720" y="354" class="math">νₛ(E) = (2 + 6)/12 = 2/3</text>
<text x="720" y="410" class="math">range points: 2, 0</text>
<text x="720" y="454" class="math">νᵣ(E) = (3 + 1)/12 = 1/3</text>
<text x="720" y="513" class="math">Inversion: νᵣ(E) = νₛ(E⁻¹)</text>
<rect x="45" y="595" width="1350" height="485" rx="18" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/>
<text x="75" y="645" class="head">2. Pack the tile and its boundary predecessors together</text>
<text x="75" y="687" class="small">General columns: Lₓ ∩ Lₓ′ = ∅ for distinct selected base points x, x′</text>
<rect x="130" y="716" width="365" height="235" rx="18" fill="#eef3fa" stroke="#8095ae" stroke-width="2"/>
<text x="150" y="755" class="math">Lₓ</text>
<rect x="158" y="775" width="309" height="65" rx="18" fill="#e5f5ee" stroke="#398466" stroke-width="2"/>
<text x="179" y="816" class="math">tile Fₓ</text>
<text x="157" y="916" class="small">predecessors θᵢ⁻¹(Fₓ)</text>
<path d="M414 879 L414 846" stroke="#52708e" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="640" y="716" width="365" height="235" rx="18" fill="#eef3fa" stroke="#8095ae" stroke-width="2"/>
<text x="660" y="755" class="math">Lₓ′</text>
<rect x="668" y="775" width="309" height="65" rx="18" fill="#e5f5ee" stroke="#398466" stroke-width="2"/>
<text x="689" y="816" class="math">tile Fₓ′</text>
<text x="667" y="916" class="small">predecessors θᵢ⁻¹(Fₓ′)</text>
<path d="M924 879 L924 846" stroke="#52708e" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1050" y="792" class="small">θᵢy in Fₓ</text>
<text x="1050" y="838" class="small">⇒ y in Lₓ</text>
<text x="1050" y="898" class="small">Cross-tile edges</text>
<text x="1050" y="935" class="small">would overlap L’s.</text>
<text x="100" y="1005" class="math">μ(Y) = ∫<tspan baseline-shift="sub" font-size="20">B</tspan> (Σ<tspan baseline-shift="sub" font-size="20">y∈Fₓ</tspan> δ(y, x)) dμ(x) &gt; 0</text>
<text x="100" y="1051" class="small">Boundary mass &lt; η μ(Y) • injective projections give these exact weights</text>
<rect x="45" y="1105" width="1350" height="365" rx="18" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/>
<text x="75" y="1156" class="head">3. Intersect the tails; finite classes survive</text>
<text x="100" y="1210" class="math">Independent finite approximants Sₖ: νₛ(Kₖ ∖ Sₖ) &lt; 2⁻ᵏ</text>
<text x="100" y="1263" class="math">Rₙ = ⋂ₖ≥ₙ Sₖ     ⇒     Rₙ ⊂ Rₙ₊₁ and |[x]Rₙ| ≤ |[x]Sₙ|</text>
<text x="100" y="1316" class="math">For n ≥ m: νₛ(Kₘ ∖ Rₙ) ≤ Σₖ≥ₙ 2⁻ᵏ = 2¹⁻ⁿ → 0</text>
<text x="100" y="1370" class="small">Remove the null exceptional sources and their countable orbit saturation.</text>
<text x="100" y="1422" class="math">On the remaining invariant conull space: R = ⋃ₙ Rₙ.</text>
<text x="60" y="1510" class="small">Proof: Lemma 4.1, Corollary 4.2, Theorem 6.1, Exercise 7.6 • Takesaki XIII.4.11–4.14; CFW</text>
</svg>
