<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">Spectral necessity and modular transfer</title>
<desc id="desc">A finite measure with square integrable Fourier transform has a square integrable density, proved by Gaussian smoothing. Bounded positive orbit averages are supported in the absolutely continuous spectral subspace. A supplied modular bridge transfers integrability, and the proper diagonal model supplies strictly positive cutoffs that exhaust the identity.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L10 6L1 11" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="900" rx="18" fill="#f7fafc"/>
<g font-family="Arial, sans-serif" fill="#153047">
<text x="35" y="43" font-size="29" font-weight="bold">From Fourier smoothing to the whole spectral measure</text>
<text x="35" y="77" font-size="20">Lemma 2.1 and Theorem 3.1 • ordinary time dt • spectral measure ds</text>
<rect x="35" y="111" width="300" height="148" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="185" y="142" text-anchor="middle" font-size="22" font-weight="bold">Finite measure η</text>
<text x="185" y="180" text-anchor="middle" font-size="22">η̂ ∈ L²(dt)</text>
<text x="185" y="220" text-anchor="middle" font-size="20">gε = η ∗ kε</text>
<path d="M341 184H390" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="401" y="111" width="317" height="148" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="560" y="142" text-anchor="middle" font-size="22" font-weight="bold">Gaussian multiplier</text>
<text x="560" y="180" text-anchor="middle" font-size="22">ĝε(t) = η̂(t)e<tspan dy="-8" font-size="16">−εt²/2</tspan></text>
<text x="560" y="220" text-anchor="middle" font-size="20">gε is Cauchy in L²(ds)</text>
<path d="M724 184H762" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="770" y="111" width="315" height="148" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="927" y="142" text-anchor="middle" font-size="22" font-weight="bold">Actual density</text>
<text x="927" y="180" text-anchor="middle" font-size="22">η = g ds, g ∈ L¹ ∩ L²</text>
<text x="927" y="220" text-anchor="middle" font-size="20">‖η̂‖²₂ = 2π ‖g‖²₂</text>
<rect x="35" y="290" width="1050" height="143" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="60" y="324" font-size="22" font-weight="bold">Whole-fibre support test • Lemma 2.2 and Theorem 3.1</text>
<text x="60" y="362" font-size="21">Aα(B) bounded ⇒ s(B)H ⊂ Hac. Exhausting supports force Hac = H.</text>
<text x="60" y="399" font-size="20">Conversely qI,j = 1I ej, all bounded rational intervals I: Aα(Pa) ≤ 2π1, supports join 1.</text>
<path d="M35 458H1085" stroke="#cbd5e1" stroke-width="2"/>
<text x="35" y="498" font-size="29" font-weight="bold">Both exhaustions in the modular transfer</text>
<rect x="35" y="529" width="385" height="190" rx="13" fill="white" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
<text x="227" y="561" text-anchor="middle" font-size="22" font-weight="bold">Supplied bridge (4.1)</text>
<text x="227" y="597" text-anchor="middle" font-size="21">N ⊂ P, E : P₊ → N̂₊</text>
<text x="227" y="633" text-anchor="middle" font-size="21">ψ = φ ∘ E</text>
<text x="227" y="668" text-anchor="middle" font-size="21">σψ|N = σφ, Eσψ = σφE</text>
<text x="227" y="700" text-anchor="middle" font-size="18">Generic B1 owner proof remains open</text>
<path d="M425 620H481" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="495" y="529" width="590" height="190" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="790" y="561" text-anchor="middle" font-size="22" font-weight="bold">Proposition 4.1</text>
<text x="790" y="597" text-anchor="middle" font-size="21">yj ↑ 1, Yj = Aσψ(yj) bounded; xi ∈ Pψ, xi ↑ 1</text>
<text x="790" y="633" text-anchor="middle" font-size="21">zi,j = E(xᵢ¹ᐟ² yj xᵢ¹ᐟ²), Aσφ(zi,j) ≤ ‖Yj‖ E(xi)</text>
<text x="790" y="668" text-anchor="middle" font-size="20">yj ↑ 1 + normality ⇒ pE(xi)p = 0</text>
<text x="790" y="700" text-anchor="middle" font-size="20">faithfulness + xi ↑ 1 ⇒ p = 0 ⇒ support join 1</text>
<text x="35" y="758" font-size="22" font-weight="bold">Proper diagonal construction • Lemma 5.1 and Corollary 5.2</text>
<text x="35" y="799" font-size="21">κ ∗ f₀ = 1 ⇒ 0 &lt; g ≤ 1 and 0 &lt; κ ∗ g ≤ 1 ⇒ h = g/(κ ∗ g) &gt; 0, κ ∗ h = 1</text>
<text x="35" y="839" font-size="21">hk = min(kh, 1) ↑ 1; xk = M(hk) ∈ Pψ; Eκ(xk) = M(κ ∗ hk) ≤ k1</text>
<text x="35" y="880" font-size="18">Proof locators (2.1)–(5.5). Claude-WR: R4, Lemma 8.2, Proposition 8.3, Theorem 8.4.</text>
</g></svg>
