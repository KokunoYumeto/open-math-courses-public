<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="710" viewBox="0 0 1160 710" role="img" aria-labelledby="title desc">
<title id="title">Haar essential values repair the uniform source quantifier</title>
<desc id="desc">For real translations the original section is minus one at zero and plus one elsewhere. Every fixed translation has at most two null exceptional sources, but every source admits a translation where the identity fails. The sample arrow two to zero has parameter minus two. The repaired section is plus one everywhere, giving a uniform identity for all translations and sources.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#487779"/></marker></defs>
<rect width="1160" height="710" fill="#f7faf9"/>
<text x="580" y="44" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#21464e">From a null set for each translation to one null source set</text>
<text x="580" y="82" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">X = ℝ with Gaussian measure; Tₜx = x + t; U(t,x) = identity.</text>
<rect x="45" y="112" width="510" height="355" rx="15" fill="#f3e8dd" stroke="#91b5ae"/>
<text x="300" y="151" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">Original point version</text>
<circle cx="150" cy="242" r="28" fill="white" stroke="#487779" stroke-width="2"/>
<text x="150" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">2</text>
<circle cx="450" cy="242" r="28" fill="white" stroke="#487779" stroke-width="2"/>
<text x="450" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">0</text>
<path d="M183 242 H417" fill="none" stroke="#487779" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="209" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">t = −2</text>
<text x="150" y="306" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#21464e">f(2) = 1</text>
<text x="450" y="306" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#934b21">f(0) = −1</text>
<text x="300" y="354" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#21464e">Each fixed t: at most the null set {0,−t}.</text>
<text x="300" y="393" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#21464e">All failures together have source set ℝ.</text>
<text x="300" y="431" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#21464e">x ≠ 0: use t = −x; x = 0: use t ≠ 0.</text>
<rect x="605" y="112" width="510" height="355" rx="15" fill="#e5efeb" stroke="#91b5ae"/>
<text x="860" y="151" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">Repaired point version</text>
<circle cx="710" cy="242" r="28" fill="white" stroke="#487779" stroke-width="2"/>
<text x="710" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">2</text>
<circle cx="1010" cy="242" r="28" fill="white" stroke="#487779" stroke-width="2"/>
<text x="1010" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">0</text>
<path d="M743 242 H977" fill="none" stroke="#487779" stroke-width="3" marker-end="url(#arrow)"/>
<text x="860" y="209" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">t = −2</text>
<text x="710" y="306" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#21464e">F(2) = 1</text>
<text x="1010" y="306" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#21464e">F(0) = 1</text>
<text x="860" y="354" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#21464e">For every x, f(x+t) = 1 for Haar-a.e. t.</text>
<text x="860" y="393" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#21464e">Essential value: F(x) = 1 everywhere.</text>
<text x="860" y="431" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#21464e">F(x+t) = F(x) for all t and all x.</text>
<text x="580" y="518" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#21464e">The general repair uses the essential value of U(g,x)⁻¹ f(Tgx).</text>
<text x="580" y="557" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#21464e">Right Haar translations preserve null sets; the probability density need not be invariant.</text>
<text x="580" y="601" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#21464e">A null change of representative can affect every source. The cohomology class is preserved.</text>
<text x="580" y="651" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">Proof: Theorem 1.2, (1.3)–(1.7), Example 1.3 and Theorem 7.1.</text>
<text x="580" y="686" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">Human source: Takesaki III, XIII §3, Exercise 7(c).</text>
</svg>
