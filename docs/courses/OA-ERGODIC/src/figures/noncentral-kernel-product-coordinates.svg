<svg xmlns="http://www.w3.org/2000/svg" width="500" height="940" viewBox="0 0 500 940" role="img" aria-labelledby="title desc">
<title id="title">Noncentral kernel, two product coordinates</title>
<desc id="desc">The two-coset action of S3 has kernel A3. Crossing transport t conjugates r to its inverse. Literal range-fibre coordinates use a twisted product. Identifying both fibres with the fibre at a gives ordinary product coordinates.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#296487" stroke-width="1.2"/></marker></defs>
<rect width="500" height="940" fill="white"/>
<g font-family="Arial, sans-serif" fill="#163b51">
<text x="24" y="35" font-size="23" font-weight="bold">Noncentral kernel, product coordinates</text>
<text x="24" y="67" font-size="18">G = S₃, H = A₃ = ⟨r⟩, r³ = e</text>
<text x="24" y="94" font-size="18">t² = e, trt⁻¹ = r⁻¹</text>
<rect x="20" y="115" width="460" height="213" rx="12" fill="#f1f7fb" stroke="#9cc0d7"/>
<circle cx="100" cy="210" r="29" fill="#d9ebf7" stroke="#296487"/><circle cx="400" cy="210" r="29" fill="#d9ebf7" stroke="#296487"/>
<text x="94" y="217" font-family="Georgia, serif" font-size="23">a</text><text x="394" y="217" font-family="Georgia, serif" font-size="23">b</text>
<path d="M130 210H368" stroke="#296487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="194" font-size="20">t</text>
<text x="44" y="151" font-size="16">The two cosets; equal positive object masses</text>
<text x="55" y="270" font-size="18">s<tspan baseline-shift='sub' font-size='14'>a</tspan> = e</text><text x="355" y="270" font-size="18">s<tspan baseline-shift='sub' font-size='14'>b</tspan> = t</text>
<text x="44" y="302" font-size="16">At both objects: isotropy H of order three</text>
<rect x="20" y="348" width="460" height="200" rx="12" fill="#fff5e9" stroke="#d99648"/>
<text x="37" y="380" font-size="20" font-weight="bold">Literal range-fibre coordinates</text>
<text x="37" y="415" font-size="18">g = h c(y,x),  c(y,x) = s<tspan baseline-shift='sub' font-size='14'>y</tspan> s<tspan baseline-shift='sub' font-size='14'>x</tspan>⁻¹</text>
<text x="37" y="451" font-size="18">Traverse r at a, then t from a to b.</text>
<text x="37" y="486" font-size="20">Product label: tr; kernel coordinate: r⁻¹</text>
<text x="37" y="523" font-size="16">The crossing transport must conjugate r.</text>
<rect x="20" y="568" width="460" height="200" rx="12" fill="#eef8f1" stroke="#80b48e"/>
<text x="37" y="600" font-size="20" font-weight="bold">One reference isotropy fibre at a</text>
<text x="37" y="637" font-size="20">D(g,x) = (s<tspan baseline-shift='sub' font-size='14'>y</tspan>⁻¹ g s<tspan baseline-shift='sub' font-size='14'>x</tspan>, y, x)</text>
<text x="37" y="675" font-size="18">Kernel label unchanged at range a;</text>
<text x="37" y="704" font-size="18">kernel label inverted at range b.</text>
<text x="37" y="743" font-size="18">For the same product: t⁻¹(tr)e = r.</text>
<rect x="20" y="788" width="460" height="130" rx="12" fill="#f1f7fb" stroke="#9cc0d7"/>
<text x="37" y="820" font-size="19" font-weight="bold">The root transports cancel</text>
<text x="37" y="856" font-size="19">(s<tspan baseline-shift='sub' font-size='14'>z</tspan>⁻¹ l s<tspan baseline-shift='sub' font-size='14'>y</tspan>)(s<tspan baseline-shift='sub' font-size='14'>y</tspan>⁻¹ g s<tspan baseline-shift='sub' font-size='14'>x</tspan>) = s<tspan baseline-shift='sub' font-size='14'>z</tspan>⁻¹ lg s<tspan baseline-shift='sub' font-size='14'>x</tspan></text>
<text x="37" y="892" font-size="16">Finite example: no global-root claim for all relations.</text>
</g></svg>
