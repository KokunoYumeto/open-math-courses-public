<svg xmlns="http://www.w3.org/2000/svg" width="440" height="890" viewBox="0 0 440 890" role="img" aria-labelledby="title desc">
<title id="title">Two binary Fourier sectors give the entire operator algebra</title>
<desc id="desc">For every faithful proper transverse function, the pushforward arrow measure has uniform half weights on the binary label. The Fourier transform with one-half coefficients turns convolution into two independent kernel products. Rank-one kernels generate both full operator blocks, whose centre has two nonzero sector projections. This is a function-class and Hilbert-space identification, not a point-space Borel isomorphism.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31566d"/></marker></defs>
<style>text{font:15px Arial,Helvetica,sans-serif;fill:#19374a}.title{font-size:20px;font-weight:bold}.head{font-size:16px;font-weight:bold}.eq{font-size:18px}.box{fill:#f4f8fb;stroke:#6d91a6;stroke-width:1.4}.note{fill:#fff8ed;stroke:#bc8d42;stroke-width:1.4}.arrow{stroke:#31566d;stroke-width:1.7;marker-end:url(#a)}</style>
<rect width="440" height="890" fill="white"/><text x="22" y="31" class="title">The full algebra has two sectors</text><text x="22" y="55">Proposition 6.3 · every faithful proper κ</text>
<rect x="20" y="77" width="400" height="113" rx="8" class="box"/><text x="36" y="104" class="head">The measured arrow coordinates</text><text x="36" y="133" class="eq">j(y,x) = (y,x,d(y,x))</text><text x="36" y="161">j_*(m) = (β ⊗ β) ⊗ u₂;  u₂({0}) = u₂({1}) = ½</text><text x="36" y="181">K = L²(X,β) ≠ 0;  β is sigma-finite.</text>
<path d="M220 192V216" class="arrow"/><rect x="20" y="226" width="400" height="110" rx="8" class="box"/><text x="36" y="253" class="head">The exact normalized Fourier transform</text><text x="36" y="282" class="eq">F₊ = (F₀ + F₁)/2,  F₋ = (F₀ − F₁)/2</text><text x="36" y="309">(|F₀|² + |F₁|²)/2 = |F₊|² + |F₋|²</text><text x="36" y="329">No square-root rescaling is needed.</text>
<path d="M220 338V362" class="arrow"/><rect x="20" y="372" width="400" height="110" rx="8" class="box"/><text x="36" y="399" class="head">Convolution separates the kernel products</text><text x="36" y="428" class="eq">(F ★ G)±(y,x) = ∫ F±(y,z)G±(z,x) dβ(z)</text><text x="36" y="457">λ(F) = (T(F₊) ⊗ 1) ⊕ (T(F₋) ⊗ 1)</text><text x="36" y="475">Each identity acts on the source-coordinate leg.</text>
<path d="M220 484V508" class="arrow"/><rect x="20" y="518" width="400" height="110" rx="8" class="box"/><text x="36" y="545" class="head">Rank-one kernels generate both full blocks</text><text x="36" y="574">h(y)g(x)* isolates the plus sector.</text><text x="36" y="599">(−1)ᵈ h(y)g(x)* isolates the minus sector.</text><text x="36" y="621">Bounded finite-measure supports give dense ranks.</text>
<path d="M220 630V654" class="arrow"/><rect x="20" y="664" width="400" height="91" rx="8" class="box"/><text x="36" y="693" class="eq">W(κ) ≅ B(K) ⊕ B(K)</text><text x="36" y="723" class="eq">Z(W(κ)) ≅ ℂ²;  (1,0) and (0,1) ≠ 0</text><text x="36" y="745">No faithful proper κ gives a factor.</text>
<rect x="20" y="778" width="400" height="90" rx="8" class="note"/><text x="36" y="805" class="head">Keep the measurable distinction</text><text x="36" y="831">The coordinates identify function classes and L².</text><text x="36" y="855">They do not give a Borel point-space isomorphism.</text>
</svg>
