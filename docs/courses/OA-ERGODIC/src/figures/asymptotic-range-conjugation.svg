<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">Constant cohomology change conjugates the asymptotic range</title>
<desc id="desc">In S3 times Z, the range contains identity and transposition12. Conjugation by g equal to the three-cycle123 changes it to identity and transposition13. The parity cocycle attains both values on every positive reduction; infinity is absent.</desc>
<rect width="1160" height="650" fill="#f7faf9"/>
<text x="580" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#21464e">A constant coordinate change can move the asymptotic range</text>
<text x="580" y="82" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#21464e">H = S₃ × ℤ; g = ((123),0). Every permutation below has integer coordinate 0.</text>
<rect x="70" y="115" width="440" height="280" rx="15" fill="#e5efeb" stroke="#91b5ae"/>
<text x="290" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">r∞(ρ) = {e, ((12),0)}</text>
<circle cx="165" cy="240" r="26" fill="white" stroke="#487779" stroke-width="2"/>
<text x="165" y="249" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">1</text>
<circle cx="290" cy="240" r="26" fill="white" stroke="#487779" stroke-width="2"/>
<text x="290" y="249" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">2</text>
<circle cx="415" cy="240" r="26" fill="white" stroke="#487779" stroke-width="2"/>
<text x="415" y="249" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">3</text>
<path d="M165 209 Q227.5 172 290 209 M280 197 L290 209 L275 212" fill="none" stroke="#975124" stroke-width="3"/>
<path d="M290 271 Q227.5 312 165 271 M175 283 L165 271 L180 268" fill="none" stroke="#975124" stroke-width="3"/>
<text x="290" y="355" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#21464e">e fixes all points; the other element swaps the pair.</text>
<rect x="650" y="115" width="440" height="280" rx="15" fill="#e5efeb" stroke="#91b5ae"/>
<text x="870" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">r∞(ρ′) = {e, ((13),0)}</text>
<circle cx="745" cy="240" r="26" fill="white" stroke="#487779" stroke-width="2"/>
<text x="745" y="249" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">1</text>
<circle cx="870" cy="240" r="26" fill="white" stroke="#487779" stroke-width="2"/>
<text x="870" y="249" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">2</text>
<circle cx="995" cy="240" r="26" fill="white" stroke="#487779" stroke-width="2"/>
<text x="995" y="249" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">3</text>
<path d="M745 209 Q870.0 172 995 209 M985 197 L995 209 L980 212" fill="none" stroke="#975124" stroke-width="3"/>
<path d="M995 271 Q870.0 312 745 271 M755 283 L745 271 L760 268" fill="none" stroke="#975124" stroke-width="3"/>
<text x="870" y="355" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#21464e">e fixes all points; the other element swaps the pair.</text>
<path d="M528 249 H631 M620 240 L631 249 L620 258" stroke="#487779" stroke-width="3" fill="none"/>
<text x="580" y="219" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#21464e">h ↦ g⁻¹hg</text>
<text x="580" y="442" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#21464e">ρ(Tⁿx,x) = ((12),0) raised to the Bernoulli parity α(n,x)</text>
<text x="580" y="484" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#21464e">Every positive E: μ{x ∈ E : Tⁿx ∈ E, α(n,x)=1} → ½ μ(E)² &gt; 0</text>
<text x="580" y="528" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">Finite image ⇒ ∞ is absent. The two sets differ at a noncentral point.</text>
<text x="580" y="575" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">Proof: Lemma 2.1 and Propositions 1.1 / 2.2; exact counterexample (3.2).</text>
<text x="580" y="611" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">Takesaki III, XIII §3 Exercise 9: unrestricted equality fails for this target.</text>
</svg>
