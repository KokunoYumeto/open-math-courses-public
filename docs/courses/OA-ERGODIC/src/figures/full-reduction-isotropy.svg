<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="570" viewBox="0 0 1060 570" role="img" aria-labelledby="title desc">
<title id="title">A full reduction retains isotropy</title><desc id="desc">In the groupoid with arrows (y,k,x) on two units, transport of the arrow (0,k,1) along f one equals the loop (0,k,0). The reduction keeps the group label k, whereas the derived endpoint relation forgets it.</desc>
<rect width="1060" height="570" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17647a"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#183440">
<line x1="580" y1="113" x2="580" y2="383" stroke="#c6d8dd"/>
<text x="32" y="40" font-size="26" font-weight="bold">A full reduction retains isotropy</text><text x="32" y="73" font-size="19" >Example 0.5: arrows (y,k,x),  k ∈ K; full subset Y = {0}</text><text x="32" y="124" font-size="20" font-weight="bold">Original groupoid, units {0,1}</text><circle cx="135" cy="246" r="27" fill="#edf4f6" stroke="#8eaeb8"/><text x="135" y="254" font-size="23" text-anchor="middle">1</text><circle cx="459" cy="246" r="27" fill="#edf4f6" stroke="#8eaeb8"/><text x="459" y="254" font-size="23" text-anchor="middle">0</text><path d="M170 246 L424 246" fill="none" stroke="#17647a" stroke-width="2.8" marker-end="url(#arrow)"/><text x="297" y="218" font-size="21" text-anchor="middle">γ = (0,k,1)</text><path d="M145 278 C230 366 370 366 449 278" fill="none" stroke="#17647a" stroke-width="2.8" marker-end="url(#arrow)"/><text x="297" y="375" font-size="19" text-anchor="middle">f₁ = (0,e,1)</text><text x="32" y="169" font-size="17" >γ and f₁ have the same endpoints,</text><text x="32" y="191" font-size="17" >but their group labels may differ.</text><text x="617" y="124" font-size="20" font-weight="bold">Reduction, one unit {0}</text><circle cx="829" cy="264" r="27" fill="#edf4f6" stroke="#8eaeb8"/><text x="829" y="272" font-size="23" text-anchor="middle">0</text><path d="M807 244 C696 134 962 134 851 244" fill="none" stroke="#17647a" stroke-width="2.8" marker-end="url(#arrow)"/><text x="829" y="161" font-size="21" text-anchor="middle">ρ(γ) = (0,k,0)</text><text x="829" y="328" font-size="20" text-anchor="middle">Isotropy group remains K</text><text x="829" y="362" font-size="18" text-anchor="middle">The label k is retained.</text><text x="32" y="428" font-size="22" >f₀ = unit at 0;  ρ(γ) = f₀ γ f₁⁻¹ = (0,k,0)</text><rect x="32" y="451" width="996" height="62" rx="8" fill="#f2f6f7"/><text x="48" y="477" font-size="18" >Endpoint quotient: (y,k,x) ↦ (y,x). It forgets isotropy labels.</text><text x="48" y="502" font-size="18" >Full reduction and endpoint quotient have different effects on K.</text><text x="32" y="548" font-size="15" >Proof: Theorem 0.2 and Proposition 0.4; source: Takesaki III, XIII.3.3–3.6.</text></g></svg>