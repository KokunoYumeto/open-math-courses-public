<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc">
<title id="title">A positive compact set creates a compact identity neighborhood</title>
<desc id="desc">The faithful weighted regular representation maps an analytic Borel group into a Polish unitary group. Analytic compact inner approximation produces a positive compact set C. Its overlap coefficient places an open identity neighborhood inside the compact set C C inverse. The lower plot gives the exact Lebesgue translation coefficient max of zero and two minus absolute t, with threshold one and neighborhood minus one to one.</desc>
<rect width="1100" height="810" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#20313a} .title{font-size:28px;font-weight:bold}.head{font-size:22px;font-weight:bold}.label{font-size:20px}.small{font-size:18px}.axis{stroke:#526872;stroke-width:2}.arrow{stroke:#28627a;stroke-width:3;fill:none;marker-end:url(#tip)}</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28627a"/></marker></defs>
<text x="45" y="48" class="title">From a measurable group to a compact neighborhood</text>
<rect x="45" y="78" width="370" height="110" rx="10" fill="#edf5f7" stroke="#9bbbc6"/>
<text x="65" y="110" class="head">Analytic Borel group G</text>
<text x="65" y="142" class="label">nonzero σ-finite quasi-invariant ν</text>
<text x="65" y="170" class="label">equivalent probability μ</text>
<rect x="570" y="78" width="480" height="110" rx="10" fill="#edf5f7" stroke="#9bbbc6"/>
<text x="590" y="110" class="head">Faithful unitary image H = U(G)</text>
<text x="590" y="142" class="label">U on the separable Hilbert space L²(G, μ)</text>
<text x="590" y="170" class="label">ambient unitary group is Polish</text>
<path d="M 425 130 L 558 130" class="arrow"/>
<text x="445" y="112" class="small">Borel U</text>
<rect x="45" y="245" width="440" height="128" rx="10" fill="#edf5f7" stroke="#9bbbc6"/>
<text x="65" y="280" class="head">Compact K ⊂ H of positive measure</text>
<text x="65" y="314" class="label">C = U⁻¹(K),   μ(C) &gt; 0</text>
<text x="65" y="347" class="label">analytic compact inner approximation</text>
<path d="M 805 193 L 805 215 L 268 215 L 268 235" class="arrow"/>
<rect x="570" y="245" width="480" height="128" rx="10" fill="#edf5f7" stroke="#9bbbc6"/>
<text x="590" y="280" class="head">a(g) = ⟨U(g)1_C, 1_C⟩</text>
<text x="590" y="314" class="label">W = {a &gt; μ(C)/2} ⊂ C C⁻¹</text>
<text x="590" y="347" class="label">e ∈ W open,  closure(W) compact</text>
<path d="M 495 310 L 558 310" class="arrow"/>
<text x="45" y="426" class="head">Exact Haar model: G = ℝ,  C = [−1, 1],  m(C) = 2</text>
<rect x="395.0" y="478" width="340.0" height="224" fill="#e3f3ed"/>
<path d="M 140 702 L 990 702 M 565.0 710 L 565.0 470" class="axis"/>
<path d="M 140.0 600.1818181818182 L 990.0 600.1818181818182" stroke="#ab6340" stroke-width="2" stroke-dasharray="8 6"/>
<polyline points="140.0,702.0 225.0,702.0 565.0,498.3636363636364 905.0,702.0 990.0,702.0" stroke="#28627a" stroke-width="4" fill="none"/>
<path d="M 225.0 702 L 225.0 709" class="axis"/>
<text x="215.0" y="732" class="small">-2</text>
<path d="M 395.0 702 L 395.0 709" class="axis"/>
<text x="385.0" y="732" class="small">-1</text>
<path d="M 565.0 702 L 565.0 709" class="axis"/>
<text x="555.0" y="732" class="small">0</text>
<path d="M 735.0 702 L 735.0 709" class="axis"/>
<text x="725.0" y="732" class="small">1</text>
<path d="M 905.0 702 L 905.0 709" class="axis"/>
<text x="895.0" y="732" class="small">2</text>
<text x="45" y="607.1818181818182" class="small">1</text>
<text x="45" y="505.3636363636364" class="small">2</text>
<text x="825" y="588.1818181818182" class="small">threshold 1</text>
<text x="660" y="520" class="label">a(t) = (2 − |t|)₊</text>
<text x="520" y="675" class="label">W = (−1, 1)</text>
<path d="M 225.0 760 L 905.0 760" stroke="#526872" stroke-width="3"/>
<text x="398" y="793" class="label">C − C = [−2, 2] compact</text>
</svg>
