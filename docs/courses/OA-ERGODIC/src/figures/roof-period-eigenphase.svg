<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="title desc">
<title id="title">Roof changes, positive lengths, periods and phase</title>
<desc id="desc">Four panels. A small section change preserves positive roof height. The exact axis for a=1,b=square root of 2 distinguishes their dense additive group from the positive semigroup. A periodic circle of period square root of 2 minus 1 has a group-valued roof but no roof with those two lengths. A nonzero eigenphase gives a constant roof 2 pi over omega. Circle angles and section-change positions are schematic; the exact equations label their meaning.</desc>
<rect width="1440" height="1140" fill="#f6faf9"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#387380"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" fill="#183e49">
<rect x="30" y="100" width="675" height="470" rx="16" fill="white" stroke="#a1bac0"/>
<rect x="735" y="100" width="675" height="470" rx="16" fill="white" stroke="#a1bac0"/>
<rect x="30" y="600" width="675" height="470" rx="16" fill="white" stroke="#a1bac0"/>
<rect x="735" y="600" width="675" height="470" rx="16" fill="white" stroke="#a1bac0"/>
<text x="720" y="52" font-size="32" text-anchor="middle">Return times, periods and a nonzero phase</text>
<text x="368" y="145" font-size="25" text-anchor="middle">1. Move the section by a small cochain</text>
<line x1="90" y1="250" x2="640" y2="250" stroke="#387380" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="170" cy="250" r="7" fill="#387380"/>
<circle cx="560" cy="250" r="7" fill="#387380"/>
<text x="170" y="220" font-size="23" text-anchor="middle">z</text>
<text x="560" y="220" font-size="23" text-anchor="middle">Sz</text>
<text x="365" y="285" font-size="23" text-anchor="middle">old gap r ≥ δ</text>
<line x1="90" y1="355" x2="640" y2="355" stroke="#387380" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="190" cy="355" r="7" fill="#b06b37"/>
<circle cx="542" cy="355" r="7" fill="#b06b37"/>
<line x1="170" y1="260" x2="190" y2="341" stroke="#387380" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<line x1="560" y1="260" x2="542" y2="341" stroke="#387380" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="205" y="385" font-size="21" text-anchor="middle">T_c(z) z</text>
<text x="552" y="385" font-size="21" text-anchor="middle">T_c(Sz) Sz</text>
<text x="368" y="433" font-size="26" text-anchor="middle">r′ = r + c(Sz) − c(z)</text>
<text x="368" y="478" font-size="25" text-anchor="middle">|c| &lt; δ/4  ⇒  r′ &gt; δ/2</text>
<text x="368" y="527" font-size="20" text-anchor="middle">Positions schematic. Proof: Theorem 3.1.</text>
<text x="1072" y="145" font-size="25" text-anchor="middle">2. Group elements are not positive tilings</text>
<line x1="800" y1="315" x2="1370" y2="315" stroke="#387380" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="800" cy="315" r="7" fill="#387380"/>
<text x="800" y="355" font-size="22" text-anchor="middle">0</text>
<circle cx="870.4163056034262" cy="315" r="7" fill="#b06b37"/>
<text x="870.4163056034262" y="270" font-size="22" text-anchor="middle">√2 − 1</text>
<circle cx="970" cy="315" r="7" fill="#387380"/>
<text x="970" y="355" font-size="22" text-anchor="middle">1</text>
<circle cx="1040.4163056034263" cy="315" r="7" fill="#387380"/>
<text x="1040.4163056034263" y="270" font-size="22" text-anchor="middle">√2</text>
<circle cx="1140" cy="315" r="7" fill="#387380"/>
<text x="1140" y="355" font-size="22" text-anchor="middle">2</text>
<circle cx="1210.416305603426" cy="315" r="7" fill="#387380"/>
<text x="1210.416305603426" y="270" font-size="22" text-anchor="middle">1 + √2</text>
<circle cx="1280.8326112068523" cy="315" r="7" fill="#387380"/>
<text x="1280.8326112068523" y="355" font-size="22" text-anchor="middle">2√2</text>
<text x="1072" y="425" font-size="24" text-anchor="middle">H = ℤ + √2ℤ is dense.</text>
<text x="1072" y="467" font-size="23" text-anchor="middle">m + n√2 ≥ 1 for m,n ≥ 0, m+n &gt; 0</text>
<text x="1072" y="517" font-size="20" text-anchor="middle">Exact axis values. Proof: (4.1).</text>
<text x="368" y="645" font-size="23" text-anchor="middle">3. A periodic obstruction survives null changes</text>
<circle cx="368" cy="800" r="100" fill="#e9f1f3" stroke="#387380" stroke-width="3"/>
<circle cx="468" cy="800" r="7" fill="#b06b37"/>
<text x="368" y="795" font-size="26" text-anchor="middle">P = √2 − 1</text>
<text x="368" y="830" font-size="20" text-anchor="middle">unit-speed circle</text>
<line x1="368" y1="700" x2="433" y2="700" stroke="#387380" stroke-width="3" marker-end="url(#arrow)"/>
<text x="368" y="949" font-size="23" text-anchor="middle">P ∈ H, so the constant roof P works.</text>
<text x="368" y="994" font-size="23" text-anchor="middle">P &lt; 1, so no {1, √2}-roof works.</text>
<text x="368" y="1043" font-size="20" text-anchor="middle">Circle geometry schematic. Proposition 5.2.</text>
<text x="1072" y="645" font-size="24" text-anchor="middle">4. A nonzero eigenphase gives a constant roof</text>
<circle cx="1072" cy="800" r="100" fill="#e9f1f3" stroke="#387380" stroke-width="3"/>
<circle cx="1172" cy="800" r="7" fill="#b06b37"/>
<text x="1202" y="806" font-size="21" text-anchor="start">v = 1</text>
<circle cx="1072.0" cy="700.0" r="5" fill="#387380"/>
<text x="1072.0" y="683.0" font-size="20" text-anchor="middle">π/2</text>
<circle cx="972.0" cy="800.0" r="5" fill="#387380"/>
<text x="947.0" y="806.0" font-size="20" text-anchor="middle">π</text>
<circle cx="1072.0" cy="900.0" r="5" fill="#387380"/>
<text x="1072.0" y="931.0" font-size="20" text-anchor="middle">3π/2</text>
<text x="1072" y="792" font-size="25" text-anchor="middle">v(T_t x)</text>
<text x="1072" y="825" font-size="23" text-anchor="middle">= e^(iωt) v(x)</text>
<text x="1072" y="966" font-size="25" text-anchor="middle">ω &gt; 0,    r = 2π/ω</text>
<text x="1072" y="1006" font-size="24" text-anchor="middle">Z = {v = 1},    S = T_r on Z</text>
<text x="1072" y="1043" font-size="20" text-anchor="middle">Phase circle schematic. Theorem 6.1.</text>
<text x="720" y="1110" font-size="20" text-anchor="middle">Source question: Takesaki III, XIII §3 Exercise 1. Original illustration; exact bounds are proved in the lesson.</text>
</g>
</svg>
