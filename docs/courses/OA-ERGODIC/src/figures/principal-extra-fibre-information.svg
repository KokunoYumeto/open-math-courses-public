<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Extra fibre information in a principal measurable groupoid</title>
<desc id="desc">Unique pair arrows have trivial isotropy. Their enlarged measurable structure records a binary label of probability one half, independent of all Borel source events. Averaging its diagonal unitary representation preserves diagonal matrix units and kills off-diagonal ones, yielding a nonscalar centre.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#315986"/></marker></defs>
<rect width="960" height="760" fill="#faf9f5"/>
<g font-family="Arial, sans-serif" fill="#17283b">
<text x="40" y="44" font-size="25" font-weight="700">One orbit, trivial isotropy, extra fibre information</text>
<text x="40" y="73" font-size="17">Exact counterexample: Sections 1–6; every ν-fibre measure has total mass 1.</text>
<rect x="35" y="97" width="420" height="230" rx="12" fill="#eaf1f8" stroke="#9db3cc"/>
<text x="55" y="126" font-size="19" font-weight="700">Underlying pair groupoid</text>
<circle cx="110" cy="245" r="20" fill="#315986"/><circle cx="245" cy="174" r="20" fill="#315986"/><circle cx="385" cy="245" r="20" fill="#315986"/>
<path d="M130 233 L222 186 M267 186 L363 233 M134 252 L359 252" fill="none" stroke="#315986" stroke-width="3" marker-end="url(#arrow)"/>
<g fill="white" text-anchor="middle" font-size="18"><text x="110" y="251">x</text><text x="245" y="180">y</text><text x="385" y="251">z</text></g>
<text x="57" y="300" font-size="17">d(z,x) = d(z,y) ⊕ d(y,x); isotropy = {1}</text>
<rect x="485" y="97" width="440" height="230" rx="12" fill="#eaf5ed" stroke="#99bba2"/>
<text x="505" y="126" font-size="19" font-weight="700">Measurable structure</text>
<text x="505" y="163" font-size="18">Units: ordinary Borel sets on X = [0,1]</text>
<text x="505" y="198" font-size="18">Arrows: product Borel sets and {d = 1}</text>
<text x="505" y="233" font-size="18">Range fibre: σ(Borel sets, A)</text>
<text x="505" y="269" font-size="18">ρ(B ∩ A) = ρ(B ∩ Aᶜ) = ℓ(B)/2</text>
<text x="505" y="302" font-size="16">A is not Borel; the source map misses this event.</text>
<rect x="35" y="352" width="890" height="156" rx="12" fill="white" stroke="#b8b8ad"/>
<text x="55" y="384" font-size="19" font-weight="700">Exact averaging in Hₓ = ℂ², U(y,x) = diag(1, (−1)ᵈ)</text>
<text x="55" y="424" font-size="19">E₁₁ ↦ E₁₁</text><text x="255" y="424" font-size="19">E₂₂ ↦ E₂₂</text>
<text x="485" y="424" font-size="19">E₁₂ ↦ 0</text><text x="705" y="424" font-size="19">E₂₁ ↦ 0</text>
<text x="55" y="472" font-size="18">Off-diagonal average:  ∫ (−1)ᵈ h(x) dνʸ = (1/2 − 1/2) ∫ h dℓ = 0</text>
<path d="M480 511 L480 541" stroke="#315986" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="551" width="890" height="164" rx="12" fill="#f8eee5" stroke="#c6a989"/>
<text x="55" y="587" font-size="23" font-weight="700">EndΛ(H) = Z(EndΛ(H)) = ℂ ⊕ ℂ</text>
<text x="55" y="625" font-size="19">diag(1,0) is central and nonscalar. Invariant scalar fields are only ℂ1.</text>
<text x="55" y="660" font-size="18">Ergodic finite transverse measure; full fibre commutant is B(ℂ²).</text>
<text x="55" y="693" font-size="16">Theorem 4.1, Proposition 5.1 and Corollary 8 comparison in Section 6.</text>
<text x="40" y="743" font-size="15">Measured events are shown here. There remains exactly one arrow for each ordered pair.</text>
</g></svg>
