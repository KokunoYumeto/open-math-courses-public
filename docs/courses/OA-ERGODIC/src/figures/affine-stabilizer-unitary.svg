<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">A stabilizer moves group labels while preserving orbit position</title>
<desc id="desc">For the affine action and source x equal to one half, right multiplication by the stabilizer h(x) equal to (2, minus one half) sends (3, minus1) to (6, minus five halves). Both group labels send the source to z equal to one half. The line d equals one half minus c divided by2 shows the same orbit position. The Haar density c to power minus2, coordinate Jacobian2 and squared multiplier one half make the map unitary.</desc>
<rect width="1040" height="570" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:26px;font-weight:bold}.label{font-size:22px}.small{font-size:19px}.tick{font-size:17px}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176a80"/></marker></defs>
<text x="35" y="43" class="title" text-anchor="start">A stabilizer moves labels, but keeps the orbit position</text>
<text x="35" y="82" class="label" text-anchor="start">Source x = 1/2 · stabilizer h(x) = (2, −1/2) · h(x)x = x</text>
<path d="M165 400 L165 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="165" y="421" class="tick" text-anchor="middle">1</text>
<path d="M230 400 L230 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="230" y="421" class="tick" text-anchor="middle">2</text>
<path d="M295 400 L295 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="295" y="421" class="tick" text-anchor="middle">3</text>
<path d="M360 400 L360 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="360" y="421" class="tick" text-anchor="middle">4</text>
<path d="M425 400 L425 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="425" y="421" class="tick" text-anchor="middle">5</text>
<path d="M490 400 L490 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="490" y="421" class="tick" text-anchor="middle">6</text>
<path d="M555 400 L555 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="555" y="421" class="tick" text-anchor="middle">7</text>
<path d="M100 400 L594.0 400" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="85" y="405" class="tick" text-anchor="end">-3</text>
<path d="M100 340 L594.0 340" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="85" y="345" class="tick" text-anchor="end">-2</text>
<path d="M100 280 L594.0 280" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="85" y="285" class="tick" text-anchor="end">-1</text>
<path d="M100 220 L594.0 220" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="85" y="225" class="tick" text-anchor="end">0</text>
<path d="M100 160 L594.0 160" stroke="#e1e7e9" stroke-width="1" fill="none"/>
<text x="85" y="165" class="tick" text-anchor="end">1</text>
<path d="M100 400 L100 148.0" stroke="#176a80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="83" y="140" class="label" text-anchor="middle">d</text>
<path d="M100 220 L594.0 220" stroke="#176a80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="610" y="226" class="small" text-anchor="start">c &gt; 0</text>
<path d="M126.0 202.0 L581.0 412.0" stroke="#a5bbc4" stroke-width="2" fill="none"/>
<circle cx="295" cy="280" r="7" fill="#176a80"/>
<circle cx="490" cy="370.0" r="7" fill="#bb641f"/>
<path d="M295 280 L490 370.0" stroke="#176a80" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="265" y="264" class="small" text-anchor="start">s = (3, −1)</text>
<text x="455" y="403" class="small" text-anchor="start">s h(x) = (6, −5/2)</text>
<text x="210" y="449" class="small" text-anchor="start">d = z − cx · z = 1/2</text>
<text x="680" y="155" class="label" text-anchor="start">Same orbit position</text>
<text x="680" y="195" class="small" text-anchor="start">3(1/2) − 1 = 1/2</text>
<text x="680" y="230" class="small" text-anchor="start">6(1/2) − 5/2 = 1/2</text>
<text x="680" y="292" class="label" text-anchor="start">Right-translation unitary</text>
<text x="680" y="328" class="small" text-anchor="start">Tξ(c,d,x) = (1/√2)</text>
<text x="805" y="356" class="small" text-anchor="middle">× ξ(2c,d−cx,x)</text>
<text x="680" y="391" class="small" text-anchor="start">Haar density: c⁻² dc dd</text>
<text x="680" y="427" class="small" text-anchor="start">Norm factor:</text>
<text x="680" y="458" class="small" text-anchor="start">(1/2) × (1/2) × 4 = 1</text>
<text x="35" y="505" class="small" text-anchor="start">T commutes with orbit multipliers, left translation, and source multiplication</text>
<text x="35" y="545" class="small" text-anchor="start">Theorem 3.2 · Exercise 6.7 · Takesaki III, Chapter XIII, Theorem 1.5</text>
</svg>
