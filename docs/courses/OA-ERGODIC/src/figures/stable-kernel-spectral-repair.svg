<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">Stable-kernel spectral coordinates and a null diagonal</title>
<desc id="desc">Two unitary arrows compose from spectral coordinate t plus c1 plus c2 through t plus c1 to t. In the example of a pair groupoid, horizontal orbits saturate the null diagonal to the entire unit square, while positive kernel access to the diagonal has zero mass on every orbit.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="900" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172554">
<text x="40" y="45" font-size="27" font-weight="700">The stable kernel keeps every spectral shift</text>
<text x="40" y="78" font-size="19">cᵢ = log δ(γᵢ)     •     Tᵧ Uγ = e⁻ᶜ⁽γ⁾ Uγ Tₓ     •     ordinary spectral measure dt</text>
<g fill="#e0f2fe" stroke="#0284c7" stroke-width="2">
<rect x="45" y="125" width="270" height="88" rx="12"/>
<rect x="425" y="125" width="270" height="88" rx="12"/>
<rect x="805" y="125" width="270" height="88" rx="12"/>
</g>
<g text-anchor="middle" font-size="24"><text x="180" y="163">L(x₂, t + c₁ + c₂)</text><text x="560" y="163">L(x₁, t + c₁)</text><text x="940" y="163">L(y₁, t)</text></g>
<g text-anchor="middle" font-size="17" fill="#475569"><text x="180" y="195">source of the product</text><text x="560" y="195">shared middle fibre</text><text x="940" y="195">range of the product</text></g>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M315 170H419"/><path d="M695 170H799"/><path d="M180 217V270H940V219"/></g>
<g text-anchor="middle" font-size="19"><text x="370" y="115">V(γ₂, t + c₁)</text><text x="750" y="115">V(γ₁, t)</text><text x="560" y="305">V(γ₁γ₂, t) = V(γ₁, t) V(γ₂, t + c₁)</text></g>
<text x="40" y="343" font-size="18">Equations (2.1), (3.2), (4.1): each source and range coordinate is part of the proof.</text>
<path d="M40 369H1080" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="414" font-size="27" font-weight="700">A null diagonal can meet every orbit in a positive rectangle</text>
<text x="40" y="447" font-size="19">Example 5.1: X = [0,1], κʸ = dx, δ = 1; a stable orbit has fixed t.</text>
<rect x="100" y="495" width="370" height="300" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<g stroke="#93c5fd" stroke-width="1.5"><path d="M100 555H470M100 615H470M100 675H470M100 735H470"/></g>
<path d="M100 795L470 495" stroke="#be123c" stroke-width="4"/>
<path d="M100 648H470" stroke="#0369a1" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="281.3" cy="648" r="7" fill="#be123c" stroke="white" stroke-width="2"/>
<g stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M85 812H495"/><path d="M85 812V478"/></g>
<g font-size="18"><text x="70" y="830">0</text><text x="462" y="835">1</text><text x="55" y="503">1</text><text x="492" y="836">x</text><text x="59" y="480">t</text></g>
<text x="118" y="529" font-size="18" fill="#be123c">D = {(x,t): t = x}</text>
<text x="111" y="640" font-size="17" fill="#0369a1">horizontal stable orbit</text>
<g font-size="21">
<text x="545" y="518" font-weight="700">Product measure</text><text x="545" y="551">(dx ⊗ dt)(D) = 0</text>
<text x="545" y="605" font-weight="700">Ordinary orbit saturation</text><text x="545" y="638">sat(D) = [0,1] × [0,1]</text><text x="545" y="668">(dx ⊗ dt)(sat(D)) = 1</text>
<text x="545" y="720" font-weight="700">Positive kernel access</text><text x="545" y="753">κʸ{x: (x,t) ∈ D} = dx({t}) = 0</text><text x="545" y="783">[D]κ′ = ∅ at every unit</text>
</g>
<text x="40" y="865" font-size="18">Repair: choose L(x,t) = ℂ and V(y,x,t) = 1 everywhere; the Hilbert integrals are unchanged.</text>
</g></svg>
