<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Joint spectral charts on the original base</title>
<desc id="desc">The product measures eta j have jointly measurable densities h j relative to mu times dr. Multiplication by their square roots gives an onto chart with coordinate fibres where h j is positive. The variable multiplicity example has dimension two on the triangle zero less than r less than x, and dimension one outside. A covariant operator maps spectral coordinate r to r plus c.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#27596b"/></marker></defs>
<rect width="1120" height="760" fill="#f7f8f5"/>
<g font-family="Georgia,serif" fill="#20313c">
<text x="40" y="48" font-size="28" font-weight="bold">One measurable chart, retaining the original base</text>
<text x="40" y="80" font-size="18">Theorem 2.1: absolutely continuous self-adjoint fields on a standard σ-finite base</text>
<g fill="white" stroke="#b4c8cb" stroke-width="2"><rect x="40" y="110" width="310" height="174" rx="12"/><rect x="405" y="110" width="310" height="174" rx="12"/><rect x="770" y="110" width="310" height="174" rx="12"/></g>
<text x="60" y="145" font-size="21" font-weight="bold">Recover x and r together</text>
<text x="60" y="178" font-size="20">C = {M_q, P_b : b ∈ ℚ}″</text>
<text x="60" y="211" font-size="20">Φ(z) = (x(z), r(z))</text>
<text x="60" y="247" font-size="17">η_j = Φ_*ν_j; cyclic pullback is onto</text>
<text x="425" y="145" font-size="21" font-weight="bold">Take a product density</text>
<text x="425" y="178" font-size="20">η_j ≪ μ ⊗ dr</text>
<text x="425" y="211" font-size="20">dη_j = h_j(x,r) dμ(x) dr</text>
<text x="425" y="247" font-size="17">Kernel proof (2.4)–(2.6); no fibre choice</text>
<text x="790" y="145" font-size="21" font-weight="bold">Keep positive coordinates</text>
<text x="790" y="178" font-size="20">K_(x,r) = span{e_j : h_j &gt; 0}</text>
<text x="790" y="211" font-size="20">(f_j) ↦ Σ_j √h_j f_j e_j</text>
<text x="790" y="247" font-size="17">Norm identity and onto proof (2.7)–(2.8)</text>
<g stroke="#27596b" stroke-width="2.5" marker-end="url(#arrow)"><path d="M357 196H397"/><path d="M722 196H762"/></g>
<text x="40" y="322" font-size="21">DC-10 returns W_x to the same Y; rational cuts determine all spectral domains (2.10).</text>
<text x="40" y="352" font-size="18">Theorem 3.1: an intertwiner becomes a joint field b(x,r), with ess sup_r ‖b(x,r)‖ = ‖B_x‖.</text>
<path d="M40 378H1080" stroke="#c5d3d4"/>
<text x="40" y="416" font-size="23" font-weight="bold">Exact variable multiplicity — Example 4.2</text>
<g transform="translate(94 664)">
<rect x="0" y="-198" width="350" height="198" fill="#e8f0f2"/>
<path d="M0 0H350V-198Z" fill="#b9d8ca"/>
<g stroke="#20313c" stroke-width="2" marker-end="url(#arrow)"><path d="M-12 0H386"/><path d="M0 14V-222"/></g>
<path d="M350 0V-198M0-198H350" fill="none" stroke="#8a9da0" stroke-dasharray="5 5"/>
<text x="393" y="7" font-size="21">x</text><text x="-8" y="-231" font-size="21">r</text>
<text x="-23" y="22" font-size="18">0</text><text x="344" y="25" font-size="18">1</text><text x="-23" y="-191" font-size="18">1</text>
<text x="140" y="-56" font-size="21">dim K = 2</text><text x="22" y="-153" font-size="21">dim K = 1</text>
<text x="227" y="-163" font-size="17" transform="rotate(-29 227 -163)">r = x</text>
</g>
<text x="570" y="461" font-size="20">H_x = L²(ℝ, e^{−|r−x|} dr) ⊕ L²([0,x],dr)</text>
<text x="570" y="496" font-size="20">W_x(f,g) = e^{−|r−x|/2}f e₁ + g e₂</text>
<text x="570" y="531" font-size="18">Multiplicity two on 0 ≤ r ≤ x; endpoints are null.</text>
<text x="570" y="572" font-size="21" font-weight="bold">Covariant spectral shift — Corollary 4.1</text>
<text x="587" y="619" font-size="21">K_(x,r)</text><text x="875" y="619" font-size="21">K̃_(x,r+c)</text>
<path d="M716 610H856" stroke="#27596b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="751" y="598" font-size="18">b(x,r)</text>
<text x="570" y="658" font-size="19">(Bξ)(t) = b(x,t−c) ξ(t−c); dr has no Jacobian.</text>
<text x="40" y="727" font-size="17">Sources: Takesaki I, IV.8; Connes' integrable centralizer application. Proofs and exact scope in the accompanying lesson.</text>
</g></svg>
