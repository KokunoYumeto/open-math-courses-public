<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730" role="img" aria-labelledby="title desc">
<title id="title">A five-point rotation splits as a groupoid but not as a group</title>
<desc id="desc">Integer generator arrows traverse zero through four and return to zero. The coherent lift from i to j is j minus i. Four generator arrows have kernel label zero; the wrap from four to zero has kernel label five. The whole cycle is the nonidentity isotropy loop five with identity endpoint pair.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#487779"/></marker><marker id="carry" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a15624"/></marker></defs>
<rect width="1160" height="730" fill="#f7faf9"/>
<text x="580" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#21464e">The kernel survives the endpoint quotient</text>
<text x="580" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">G = ℤ; H = 5ℤ; K = ℤ / 5ℤ. Source i is traversed before range j.</text>
<text x="580" y="125" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#21464e">Coherent lift c(j,i) = j − i; kernel coordinate h = m − c(j,i).</text>
<circle cx="130" cy="235" r="29" fill="white" stroke="#487779" stroke-width="2"/>
<text x="130" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#21464e">0</text>
<text x="130" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">rᵢ = 0</text>
<path d="M163 235 H314" stroke="#487779" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="240" y="188" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">m = 1</text>
<text x="240" y="213" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#21464e">c = 1; h = 0</text>
<circle cx="350" cy="235" r="29" fill="white" stroke="#487779" stroke-width="2"/>
<text x="350" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#21464e">1</text>
<text x="350" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">rᵢ = 1</text>
<path d="M383 235 H534" stroke="#487779" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="460" y="188" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">m = 1</text>
<text x="460" y="213" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#21464e">c = 1; h = 0</text>
<circle cx="570" cy="235" r="29" fill="white" stroke="#487779" stroke-width="2"/>
<text x="570" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#21464e">2</text>
<text x="570" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">rᵢ = 2</text>
<path d="M603 235 H754" stroke="#487779" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="680" y="188" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">m = 1</text>
<text x="680" y="213" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#21464e">c = 1; h = 0</text>
<circle cx="790" cy="235" r="29" fill="white" stroke="#487779" stroke-width="2"/>
<text x="790" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#21464e">3</text>
<text x="790" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">rᵢ = 3</text>
<path d="M823 235 H974" stroke="#487779" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="900" y="188" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">m = 1</text>
<text x="900" y="213" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#21464e">c = 1; h = 0</text>
<circle cx="1010" cy="235" r="29" fill="white" stroke="#487779" stroke-width="2"/>
<text x="1010" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#21464e">4</text>
<text x="1010" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">rᵢ = 4</text>
<path d="M1010 267 V342 Q1010 368 984 368 H156 Q130 368 130 342 V267" stroke="#a15624" stroke-width="3" fill="none" marker-end="url(#carry)"/>
<text x="580" y="409" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#934b21">Wrap 4 → 0: m = 1; c(0,4) = −4; h = 1 − (−4) = 5.</text>
<rect x="65" y="453" width="1030" height="180" rx="14" fill="#e5efeb" stroke="#91b5ae"/>
<text x="580" y="491" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#21464e">All five arrows compose to (m,i) = (5,0).</text>
<text x="580" y="533" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">In 5ℤ × R: (5,0,0). The endpoint pair (0,0) is a unit; the loop label 5 remains.</text>
<text x="580" y="575" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#21464e">ℤ has no nonzero torsion; 5ℤ × (ℤ / 5ℤ) has an element of order 5.</text>
<text x="580" y="610" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">The groupoid product therefore does not imply a group product.</text>
<text x="580" y="675" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">Proof: Theorem 2.1, (2.5)–(2.9), and the exact five-point coordinates (3.1).</text>
<text x="580" y="707" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">Human source: Takesaki III, XIII §3, Exercise 8(a)–(b).</text>
</svg>
