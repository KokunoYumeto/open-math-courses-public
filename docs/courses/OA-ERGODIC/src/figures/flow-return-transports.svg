<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="750" viewBox="0 0 1160 750">
<rect width="1160" height="750" fill="#f6faf9"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3e7179"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" fill="#193d49">
<text x="580" y="45" font-size="29" text-anchor="middle" fill="#193d49">A flow arrow factors through its return section</text>
<text x="580" y="82" font-size="21" text-anchor="middle" fill="#193d49">Half-open fibres; r ≥ δ &gt; 0; signed return index n ∈ ℤ.</text>
<rect x="194" y="172" width="125" height="346" rx="8" fill="#e2eeed"/><rect x="841" y="172" width="125" height="346" rx="8" fill="#e2eeed"/>
<text x="256" y="150" font-size="22" text-anchor="middle" fill="#193d49">fibre over z</text>
<text x="904" y="150" font-size="22" text-anchor="middle" fill="#193d49">fibre over y = Sⁿz</text>
<circle cx="256" cy="270" r="12" fill="white" stroke="#3e7179" stroke-width="2"/>
<text x="256" y="247" font-size="22" text-anchor="middle" fill="#193d49">x = (z,u)</text>
<circle cx="256" cy="496" r="12" fill="white" stroke="#3e7179" stroke-width="2"/>
<text x="256" y="532" font-size="22" text-anchor="middle" fill="#193d49">(z,0)</text>
<circle cx="904" cy="270" r="12" fill="white" stroke="#3e7179" stroke-width="2"/>
<text x="904" y="247" font-size="22" text-anchor="middle" fill="#193d49">Tₜx = (y,v)</text>
<circle cx="904" cy="496" r="12" fill="white" stroke="#3e7179" stroke-width="2"/>
<text x="904" y="532" font-size="22" text-anchor="middle" fill="#193d49">(y,0)</text>
<line x1="276" y1="270" x2="878" y2="270" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="580" y="239" font-size="22" text-anchor="middle" fill="#193d49">direct arrow: time t</text>
<line x1="256" y1="289" x2="256" y2="477" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="175" y="371" font-size="22" text-anchor="end" fill="#193d49">time −u</text>
<text x="175" y="405" font-size="22" text-anchor="end" fill="#193d49">a(z,u)⁻¹</text>
<line x1="276" y1="496" x2="878" y2="496" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="580" y="454" font-size="24" text-anchor="middle" fill="#193d49">return time Rₙ(z)</text>
<text x="580" y="483" font-size="20" text-anchor="middle" fill="#193d49">c(y,z), or corrected b(y,z)</text>
<line x1="904" y1="477" x2="904" y2="289" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="985" y="371" font-size="22" text-anchor="start" fill="#193d49">time v</text>
<text x="985" y="405" font-size="22" text-anchor="start" fill="#193d49">a(y,v)</text>
<text x="580" y="562" font-size="28" text-anchor="middle" fill="#193d49">t = Rₙ(z) + v − u</text>
<text x="580" y="606" font-size="25" text-anchor="middle" fill="#193d49">Value: a(y,v) · b(y,z) · a(z,u)⁻¹</text>
<text x="580" y="643" font-size="20" text-anchor="middle" fill="#193d49">The rightmost transport is used first. Middle factors cancel under composition.</text>
<text x="580" y="681" font-size="18" text-anchor="middle" fill="#193d49">Schematic heights; no constant roof or invariant measure is assumed.</text>
<text x="580" y="711" font-size="17" text-anchor="middle" fill="#193d49">Proof: Lemma 2.1, Theorem 3.1. Sources: Takesaki III XIII.3.29/3.34; II XII.3.2.</text>
</g>
</svg>
