<text x="62" y="626" class="label">The isotropy line has ν-measure 0; restriction gives no nonzero measure.</text>
<text x="62" y="666" class="label">First use the equivalent probability:  dμ(h, z) = ¼ exp(−|h| − |z|) dh dz.</text>
<text x="62" y="706" class="label">Then ρ = a_*μ is a quasi-invariant probability; the unweighted pushforward is not σ-finite.</text>
<text x="40" y="775" class="small">Theorem 5.2 and Example 6.4; source context: Connes Prop. 15 and the full programme section theorem.</text>
