<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="title desc">
<title id="title">A range-fibre probability supplies an isotropy probability</title>
<desc id="desc">Fix target zero in the real groupoid with arrows (x,h,z), source z and additive h composition. The range fibre is the h,z plane with Lebesgue measure, while its isotropy line z equals zero has plane measure zero. The section t(z) is (0,0,z). The marked arrow (0,1.4,0.9) has isotropy coordinate 1.4. Weighting the plane by one quarter exp of minus absolute h minus absolute z makes a probability. Its h marginal is one half exp of minus absolute h. The graph samples this analytic density at intervals of 0.025 on minus three to three; all measures are defined on the full spaces.</desc>
<rect width="1100" height="790" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#23343d}.title{font-size:28px;font-weight:bold}.head{font-size:23px;font-weight:bold}.label{font-size:20px}.small{font-size:18px}.axis{stroke:#637983;stroke-width:2}.arrow{fill:none;stroke:#346c82;stroke-width:3;marker-end:url(#tip)}</style>
