<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1050" viewBox="0 0 440 1050" role="img" aria-labelledby="title desc">
<title id="title">Finite class sizes: refining matrix fields and releasing a scalar tail</title>
<desc id="desc">In Corollary 3.2, a matrix T on a base cell C is repeated on C intersect E and C minus E. A scalar lambda on components of size greater than m becomes lambda times the identity matrix on each new component of size m plus one, and remains lambda on the remaining tail. These are unital inclusions with a strongly dense increasing union.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#176b8b" stroke-width="1.7"/></marker></defs>
<rect width="440" height="1050" fill="#fff"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#142e3b" text-anchor="middle">
<text x="220" y="34" font-size="23" font-weight="bold">Finite classes, unbounded sizes</text>
<text x="220" y="62" font-size="17">Corollary 3.2 · the inclusion Qₘ ⊂ Qₘ₊₁</text>
<rect x="20" y="88" width="400" height="325" rx="12" fill="#edf6fa" stroke="#176b8b"/>
<text x="220" y="120" font-size="20" font-weight="bold">Old size n ≤ m: refine the base</text>
<rect x="95" y="143" width="250" height="83" rx="8" fill="#fff" stroke="#176b8b"/>
<text x="220" y="173" font-size="20">Cell C: matrix T ∈ Mₙ</text>
<text x="220" y="203" font-size="17">Trace: ν(C) Trₙ(T) / n</text>
<path d="M220 232V258" fill="none" stroke="#176b8b" stroke-width="2"/>
<path d="M220 258H120V279" fill="none" stroke="#176b8b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M220 258H320V279" fill="none" stroke="#176b8b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="38" y="285" width="170" height="85" rx="8" fill="#fff" stroke="#176b8b"/>
<rect x="232" y="285" width="170" height="85" rx="8" fill="#fff" stroke="#176b8b"/>
<text x="123" y="316" font-size="19">C ∩ Eₘ₊₁</text><text x="123" y="347" font-size="22">same T</text>
<text x="317" y="316" font-size="19">C ∖ Eₘ₊₁</text><text x="317" y="347" font-size="22">same T</text>
<text x="220" y="395" font-size="17">The two cell measures add to ν(C).</text>
<rect x="20" y="441" width="400" height="447" rx="12" fill="#f4f0fa" stroke="#725499"/>
<text x="220" y="475" font-size="20" font-weight="bold">Old tail: release the next size</text>
<rect x="65" y="496" width="310" height="75" rx="8" fill="#fff" stroke="#725499"/>
<text x="220" y="526" font-size="20">One scalar λ on p₍ₙ &gt; ₘ₎</text>
<text x="220" y="552" font-size="17">All components with n &gt; m</text>
<path d="M220 578V604" fill="none" stroke="#176b8b" stroke-width="2"/>
<path d="M220 604H120V629" fill="none" stroke="#176b8b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M220 604H320V629" fill="none" stroke="#176b8b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="636" width="180" height="170" rx="8" fill="#fff" stroke="#725499"/>
<text x="126" y="666" font-size="19" font-weight="bold">New size m + 1</text>
<text x="126" y="697" font-size="18">Each cell D in Bₘ₊₁</text>
<text x="126" y="736" font-size="24">λ Iₘ₊₁</text>
<text x="126" y="775" font-size="17">Same λ on every D</text>
<rect x="236" y="636" width="168" height="170" rx="8" fill="#fff" stroke="#725499"/>
<text x="320" y="666" font-size="19" font-weight="bold">Remaining tail</text>
<text x="320" y="697" font-size="18">n &gt; m + 1</text>
<text x="320" y="736" font-size="24">λ</text>
<text x="320" y="775" font-size="17">One scalar</text>
<text x="220" y="841" font-size="18">Zero-measure cells are omitted.</text>
<text x="220" y="868" font-size="18">A zero tail contributes no summand.</text>
<rect x="20" y="914" width="400" height="111" rx="12" fill="#eef7ef" stroke="#44754b"/>
<text x="220" y="946" font-size="20">Every Qₘ is finite dimensional and unital.</text>
<text x="220" y="977" font-size="19">Its increasing union is strongly dense.</text>
<text x="220" y="1006" font-size="17">No uniform bound on class sizes is used.</text>
</g></svg>
