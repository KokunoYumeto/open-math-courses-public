<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="title desc">
<title id="title">Diagonal reductions detect the Connes spectrum</title>
<desc id="desc">Exact inclusions of projection families Z(N) subset A subset N give Gamma subset D subset Gamma. The lower branches distinguish the semifinite density-band exclusion of zero from the type III zero spectrum in every nonzero corner.</desc>
<rect width="1160" height="780" fill="#f7faf9"/>
<text x="580" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#20464d">Diagonal reductions detect every essential frequency</text>
<text x="580" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20464d">α = σᵠ,   N = Mᵅ,   A is the relation diagonal</text>
<text x="580" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20464d">Z(N) ⊆ A ⊆ N</text>
<rect x="70" y="149" width="1020" height="82" rx="12" fill="#e7f1ed" stroke="#9bbdb2"/>
<text x="580" y="182" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20464d">Γ(α): intersect Sp(αᵖ) over all nonzero fixed projections p ∈ N</text>
<text x="580" y="212" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#20464d">Every diagonal projection is fixed.</text>
<text x="580" y="259" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20464d">⊆</text>
<rect x="70" y="276" width="1020" height="82" rx="12" fill="#edf1f8" stroke="#9bbdb2"/>
<text x="580" y="309" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20464d">D: intersect Sp(α¹ᴮ) over all B with μ(B) &gt; 0</text>
<text x="580" y="339" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#20464d">Every central fixed projection is diagonal, since A is maximal abelian.</text>
<text x="580" y="386" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20464d">⊆</text>
<rect x="70" y="403" width="1020" height="82" rx="12" fill="#e7f1ed" stroke="#9bbdb2"/>
<text x="580" y="436" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20464d">Γ(α): intersect Sp(αᶻ) over all nonzero central fixed projections z</text>
<text x="580" y="466" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#20464d">The exact central-corner theorem gives the same Γ(α).</text>
<text x="580" y="529" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20464d">Therefore D = Γ(α), and exp D = r∞ ∩ (0, ∞).</text>
<text x="580" y="566" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#20464d">Zero requires the additional argument for an ergodic relation factor.</text>
<rect x="70" y="590" width="495" height="157" rx="12" fill="#e0eee8" stroke="#afbdc0"/>
<text x="317.5" y="621" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20464d">Semifinite</text>
<text x="317.5" y="658" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#20464d">Equivalent invariant ν; write μ = qν.</text>
<text x="317.5" y="689" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#20464d">On a ≤ q &lt; 2a, the ratios lie in [1/2, 2].</text>
<text x="317.5" y="720" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#20464d">One positive reduction excludes 0.</text>
<rect x="595" y="590" width="495" height="157" rx="12" fill="#ece8f3" stroke="#afbdc0"/>
<text x="842.5" y="621" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20464d">Type III</text>
<text x="842.5" y="658" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#20464d">Every nonzero measured corner is type III.</text>
<text x="842.5" y="689" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#20464d">0 ∈ S(eMe) ⊆ Sp(Δᴮ).</text>
<text x="842.5" y="720" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#20464d">Every positive reduction includes 0.</text>
</svg>
