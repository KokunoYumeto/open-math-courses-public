<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1480" viewBox="0 0 1440 1480">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#31596a"/></marker></defs>
<rect width="1440" height="1480" fill="#f7f8f5"/>
<style>text{font-family:Arial,sans-serif;fill:#183b49}.title{font-size:38px;font-weight:700}.head{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px}.math{font-size:28px;font-family:Georgia,serif}.warn{fill:#963b35}.box{fill:white;stroke:#bed0d6;stroke-width:2}.line{stroke:#31596a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="52" y="65" class="title">Free centres and the sign retained by isotropy</text>
<text x="52" y="109" class="small">Exact example above; proof mechanisms below. Arrow products traverse the right factor first.</text>
<rect x="42" y="146" width="1356" height="535" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="193" class="head">1. Faithful centre action, positive stabilizer corner</text>
<text x="73" y="234" class="math">Γ = ℤ × S₄;  H = {e, (12), (34), (12)(34)};  X = {0,1}<tspan baseline-shift="super" font-size="18">ℤ</tspan> × S₄/H</text>
<text x="73" y="277" class="body">Six cosets; diffuse fair Bernoulli base; faithful and ergodic, with μ(E) = 1/6.</text>
<rect x="80" y="307" width="490" height="197" rx="18" fill="#edf5ef" stroke="#bed0d6" stroke-width="2"/>
<text x="108" y="345" class="math">E = Y × {H}</text>
<circle cx="315" cy="413" r="25" fill="#447f7c"/>
<path d="M293,400 C205,296 197,496 291,429" class="line"/>
<path d="M337,400 C425,296 433,496 339,429" class="line"/>
<text x="103" y="400" class="small">a = (12)</text>
<text x="379" y="400" class="small">b = (34)</text>
<text x="108" y="480" class="small">a and b fix each point of E and commute.</text>
<text x="622" y="346" class="small">P = diag(1, −1);  Q swaps the two basis vectors.</text>
<text x="622" y="392" class="math">P² = Q² = 1;   PQ = −QP</text>
<text x="622" y="438" class="math">Ad(P) Ad(Q) = Ad(Q) Ad(P)</text>
<text x="622" y="484" class="small">PQP*Q* = −1  persists under all scalar phases.</text>
<text x="73" y="549" class="body">If a unitary perturbation trivialized these fibres, uₐ = λP and uᵦ = ηQ.</text>
<text x="73" y="593" class="math warn">uₐ αₐ(uᵦ) = −ληPQ     but     uᵦ αᵦ(uₐ) = +ληPQ</text>
<text x="73" y="637" class="small">The cocycle law for ab = ba would force equality. Theorem 2.3 allows arbitrary θ.</text>
<rect x="42" y="711" width="1356" height="333" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="757" class="head">2. A free centre lets finite transports remove the scalar defect</text>
<text x="73" y="800" class="body">Each principal arrow (y,x) has one group label; the relation is hyperfinite.</text>
<rect x="84" y="833" width="356" height="93" rx="18" fill="#edf4f8" stroke="#bed0d6" stroke-width="2"/>
<rect x="541" y="833" width="356" height="93" rx="18" fill="#edf5ef" stroke="#bed0d6" stroke-width="2"/>
<rect x="998" y="833" width="320" height="93" rx="18" fill="#edf4f8" stroke="#bed0d6" stroke-width="2"/>
<text x="112" y="870" class="math">b(y,x) = Ad v(y,x)</text>
<text x="112" y="909" class="small">v may have scalar defects.</text>
<path d="M450,879 L525,879" class="line"/>
<text x="568" y="870" class="small">w(z,y)w(y,x) = w(z,x)</text>
<text x="568" y="909" class="small">Compatible finite-class lifts</text>
<path d="M907,879 L982,879" class="line"/>
<text x="1025" y="870" class="small">u<tspan baseline-shift="sub" font-size="18">g</tspan>(y) = w(y,T<tspan baseline-shift="sub" font-size="18">g</tspan><tspan baseline-shift="super" font-size="18">−1</tspan>y)*</text>
<text x="1025" y="909" class="small">Ad(u<tspan baseline-shift="sub" font-size="18">g</tspan>) α<tspan baseline-shift="sub" font-size="18">g</tspan> = β<tspan baseline-shift="sub" font-size="18">g</tspan></text>
<text x="73" y="980" class="math">u<tspan baseline-shift="sub" font-size="18">g</tspan> α<tspan baseline-shift="sub" font-size="18">g</tspan>(u<tspan baseline-shift="sub" font-size="18">h</tspan>) = W<tspan baseline-shift="sub" font-size="18">g</tspan>* W<tspan baseline-shift="sub" font-size="18">g</tspan> β<tspan baseline-shift="sub" font-size="18">g</tspan>(W<tspan baseline-shift="sub" font-size="18">h</tspan>*) W<tspan baseline-shift="sub" font-size="18">g</tspan>* = W<tspan baseline-shift="sub" font-size="18">gh</tspan>* = u<tspan baseline-shift="sub" font-size="18">gh</tspan></text>
<text x="73" y="1018" class="small">Theorem 3.1: no base conjugacy, no invariant-measure assumption, atomic bases included.</text>
<rect x="42" y="1074" width="1356" height="343" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1122" class="head">3. Exact refinement makes the finite matrix algebras increase</text>
<text x="73" y="1169" class="body">Old cell indices a,b; new quotient index i. The maps retain each old transport.</text>
<text x="73" y="1224" class="math">e<tspan baseline-shift="sub" font-size="18">ab</tspan><tspan baseline-shift="super" font-size="18">(n)</tspan> = Σ<tspan baseline-shift="sub" font-size="18">i</tspan> e<tspan baseline-shift="sub" font-size="18">(a,i),(b,i)</tspan><tspan baseline-shift="super" font-size="18">(n+1)</tspan>      ⇒      D<tspan baseline-shift="sub" font-size="18">n</tspan> ⊂ D<tspan baseline-shift="sub" font-size="18">n+1</tspan></text>
<text x="73" y="1276" class="body">Cell partitions recover the diagonal; restricted group maps converge strongly to each V.</text>
<text x="73" y="1327" class="math">A ⋊ Γ ≅ M(ℛ,μ) = (⋃<tspan baseline-shift="sub" font-size="18">n</tspan> D<tspan baseline-shift="sub" font-size="18">n</tspan>)″,     D<tspan baseline-shift="sub" font-size="18">n</tspan> ≅ M<tspan baseline-shift="sub" font-size="18">qₙ</tspan>(ℂ),  qₙ = 2<tspan baseline-shift="super" font-size="18">mₙ</tspan></text>
<text x="73" y="1373" class="small">Theorem 4.1: free, ergodic, diffuse, amenable; valid for unequal cell masses and type III.</text>
<text x="52" y="1455" class="small">Human source: Takesaki III, XIII §4, Exercises 1–3, p.79. Original counterexample and illustration.</text>
</svg>
