<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1340" viewBox="0 0 440 1340" role="img" aria-labelledby="title desc" style="display:block;width:100%;max-width:440px;height:auto">
<title id="title">Sharp finite-compression defects</title>
<desc id="desc">For a faithful normal semifinite trace T_R on R and a unital von Neumann subalgebra D, absence of nonzero finite-trace projections in D prime intersect R is equivalent to overlap infimum zero for every nonzero finite-trace projection h, and to compression-defect norm supremum one. Fix t=T_R(h). The compact convex ultraweak closure of the D-unitary orbit of h has a unique minimizer of T_R(k squared), which is zero. A normal finite-corner functional yields an actual unitary with overlap less than epsilon t. The defect delta_h(u)=h minus h u star h u h is positive at most h, its norm exceeds one minus epsilon, and the squared trace displacement exceeds 2t times one minus epsilon. The exact suprema are one and 2t, with no general assertion of attainment. Apply to D=A and to D=B using the full relative commutants and infinite-trace projection condition of the coefficient corner. Proposition5H.3 proves the result; the original Connes existence problem remains open.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365a6e"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#183746}.head{font-weight:700;font-size:21px}.math{font-family:Cambria,serif;font-size:22px}.box{fill:#f3f8fb;stroke:#54798e;stroke-width:1.5}.arrow{stroke:#365a6e;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="20" y="32" class="head">Every finite-trace corner</text>
<text x="20" y="64" class="math">0 ≠ h = h² = h*,  t = T_R(h) &lt; ∞</text>
<rect x="14" y="88" width="412" height="265" rx="9" class="box"/>
<text x="30" y="120" class="head">Exact hypothesis</text>
<text x="30" y="153">D is unital in R.</text>
<text x="30" y="184">D′ ∩ R has no nonzero</text>
<text x="30" y="214">finite-trace projection.</text>
<text x="30" y="253" class="math">K_h = closureᵘʷ conv{u*hu}</text>
<text x="30" y="286">Unique minimum of T_R(k²):</text>
<text x="30" y="325" class="math">k ∈ D′ ∩ R  ⇒  k = 0</text>
<line x1="220" y1="356" x2="220" y2="389" class="arrow"/>
<rect x="14" y="400" width="412" height="260" rx="9" class="box"/>
<text x="30" y="434" class="head">An actual unitary for each ε</text>
<text x="30" y="471">Use the normal functional</text>
<text x="30" y="505" class="math">x ↦ T_R(hxh).</text>
<text x="30" y="544">For every 0 &lt; ε &lt; 1, some u ∈ U(D)</text>
<text x="30" y="577">has overlap</text>
<text x="30" y="619" class="math">0 ≤ T_R(hu*huh) &lt; εt.</text>
<line x1="220" y1="663" x2="220" y2="696" class="arrow"/>
<rect x="14" y="707" width="412" height="341" rx="9" class="box"/>
<text x="30" y="742" class="head">Sharp constants</text>
<text x="30" y="781" class="math">δ_h(u) = h − hu*huh</text>
<text x="30" y="818" class="math">0 ≤ δ_h(u) ≤ h</text>
<text x="30" y="860" class="math">sup ‖δ_h(u)‖ = 1</text>
<text x="30" y="901" class="math">sup ‖(r − h)uh‖ = 1</text>
<text x="30" y="942" class="math">sup ‖h − u*hu‖²₂ = 2t</text>
<text x="30" y="988">Suprema run over u ∈ U(D).</text>
<text x="30" y="1020">Attainment is not assumed.</text>
<line x1="220" y1="1051" x2="220" y2="1084" class="arrow"/>
<rect x="14" y="1095" width="412" height="223" rx="9" class="box"/>
<text x="30" y="1130" class="head">Coefficient application</text>
<text x="30" y="1167">Apply separately to D = A and B.</text>
<text x="30" y="1203">Use (5H.6), (5H.19), (5H.20).</text>
<text x="30" y="1239">Complete proof: Proposition 5H.3.</text>
<text x="30" y="1275">Connes Corollary 11 stays open.</text>
</svg>
