<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1660" viewBox="0 0 1500 1660" role="img" aria-labelledby="title desc">
<title id="title">Semidirect-product transport and distinct unit and pair groupoids</title>
<desc id="desc">Four panels. Base arrows delta from y to x and gamma from x to z; semidirect arrows carry u to T_delta v to T_gamma w. Source coordinates transport h1 back by delta inverse before multiplication. Cocycle conjugacy transports b by theta1 inverse and has source alpha. On two points the unit groupoid has two arrows and the pair groupoid four. A separable compact product group has coordinate characters at uniform distance2 with disjoint radius-one-half balls. Locations, ball outlines and arrow lengths are schematic.</desc>
<rect width="1500" height="1660" fill="#f7fafb"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#347485"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" fill="#173f4b">
<rect x="30" y="90" width="1440" height="355" rx="16" fill="white" stroke="#a6c0c7"/>
<rect x="30" y="465" width="1440" height="385" rx="16" fill="white" stroke="#a6c0c7"/>
<rect x="30" y="875" width="1440" height="405" rx="16" fill="white" stroke="#a6c0c7"/>
<rect x="30" y="1300" width="1440" height="275" rx="16" fill="white" stroke="#a6c0c7"/>
<text x="750" y="52" font-size="33" text-anchor="middle">Transport before multiplying: keep the source</text>
<text x="750" y="132" font-size="28" text-anchor="middle">1. A groupoid acts on a groupoid</text>
<circle cx="230" cy="200" r="8" fill="#b77238"/>
<text x="230" y="235" font-size="25" text-anchor="middle">y</text>
<circle cx="750" cy="200" r="8" fill="#b77238"/>
<text x="750" y="235" font-size="25" text-anchor="middle">x</text>
<circle cx="1270" cy="200" r="8" fill="#b77238"/>
<text x="1270" y="235" font-size="25" text-anchor="middle">z</text>
<line x1="252" y1="200" x2="720" y2="200" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="772" y1="200" x2="1240" y2="200" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="490" y="184" font-size="25" text-anchor="middle">δ : y → x</text>
<text x="1010" y="184" font-size="25" text-anchor="middle">γ : x → z</text>
<circle cx="230" cy="300" r="8" fill="#b77238"/>
<text x="230" y="335" font-size="25" text-anchor="middle">u</text>
<circle cx="750" cy="300" r="8" fill="#b77238"/>
<text x="750" y="335" font-size="25" text-anchor="middle">T_δ v</text>
<circle cx="1270" cy="300" r="8" fill="#b77238"/>
<text x="1270" y="335" font-size="25" text-anchor="middle">T_γ w</text>
<line x1="252" y1="300" x2="720" y2="300" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="772" y1="300" x2="1240" y2="300" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="490" y="281" font-size="24" text-anchor="middle">(δ, h₂),   h₂ : u → v</text>
<text x="1010" y="281" font-size="24" text-anchor="middle">(γ, h₁),   h₁ : T_δ v → w</text>
<text x="750" y="384" font-size="27" text-anchor="middle">(γ, h₁)(δ, h₂) = (γδ, T_(δ⁻¹)(h₁) h₂)</text>
<text x="750" y="421" font-size="21" text-anchor="middle">The transported second coordinate lies in H_y. Theorem3.1, (3.2)–(3.7).</text>
<text x="750" y="510" font-size="28" text-anchor="middle">2. Cocycle conjugacy uses the same convention</text>
<circle cx="230" cy="590" r="8" fill="#b77238"/>
<text x="230" y="628" font-size="25" text-anchor="middle">α</text>
<circle cx="750" cy="590" r="8" fill="#b77238"/>
<text x="750" y="628" font-size="25" text-anchor="middle">β</text>
<circle cx="1270" cy="590" r="8" fill="#b77238"/>
<text x="1270" y="628" font-size="25" text-anchor="middle">ρ</text>
<line x1="252" y1="590" x2="720" y2="590" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="772" y1="590" x2="1240" y2="590" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="490" y="569" font-size="25" text-anchor="middle">q₁ = (θ₁, a, α)</text>
<text x="1010" y="569" font-size="25" text-anchor="middle">q₂ = (θ₂, b, β)</text>
<text x="750" y="675" font-size="27" text-anchor="middle">β = θ₁ αᵃ θ₁⁻¹,     ρ = θ₂ βᵇ θ₂⁻¹</text>
<text x="750" y="721" font-size="29" text-anchor="middle">q₂ q₁ = (θ₂θ₁, θ₁⁻¹(b) a, α)</text>
<text x="750" y="768" font-size="26" text-anchor="middle">s(q₁) = α,     r(q₁) = β</text>
<text x="750" y="816" font-size="21" text-anchor="middle">The printed conjugated source conflicts with composability. Theorem4.1; Exercise6.3.</text>
<text x="750" y="920" font-size="28" text-anchor="middle">3. The same object set can carry different groupoids</text>
<text x="385" y="969" font-size="25" text-anchor="middle">Unit groupoid on X = {0,1}</text>
<text x="1100" y="969" font-size="25" text-anchor="middle">Pair groupoid on X = {0,1}</text>
<circle cx="220" cy="1070" r="8" fill="#b77238"/>
<path d="M210,1067 C153,990 287,990 232,1065" fill="none" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="220" y="1109" font-size="25" text-anchor="middle">0</text>
<circle cx="550" cy="1070" r="8" fill="#b77238"/>
<path d="M540,1067 C483,990 617,990 562,1065" fill="none" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="550" y="1109" font-size="25" text-anchor="middle">1</text>
<circle cx="925" cy="1070" r="8" fill="#b77238"/>
<path d="M915,1067 C858,990 992,990 937,1065" fill="none" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="925" y="1109" font-size="25" text-anchor="middle">0</text>
<circle cx="1275" cy="1070" r="8" fill="#b77238"/>
<path d="M1265,1067 C1208,990 1342,990 1287,1065" fill="none" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1275" y="1109" font-size="25" text-anchor="middle">1</text>
<line x1="947" y1="1060" x2="1245" y2="1060" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1253" y1="1085" x2="955" y2="1085" stroke="#347485" stroke-width="3" marker-end="url(#arrow)"/>
<text x="385" y="1165" font-size="26" text-anchor="middle">L = {e}: 2 arrows</text>
<text x="1100" y="1165" font-size="26" text-anchor="middle">L = {e}: 4 arrows</text>
<text x="385" y="1207" font-size="23" text-anchor="middle">L = ℤ/2 swapping X: 4 arrows</text>
<text x="1100" y="1207" font-size="23" text-anchor="middle">L = ℤ/2 swapping X: 8 arrows</text>
<text x="750" y="1254" font-size="21" text-anchor="middle">Transformation isotropy is L_x; pair-product isotropy is L. (5.1)–(5.3); Exercise6.6.</text>
<text x="750" y="1342" font-size="27" text-anchor="middle">4. A countable dense set does not make the cocycle space Polish</text>
<text x="385" y="1404" font-size="25" text-anchor="middle">G = {−1,1}^ℝ: separable and compact</text>
<text x="385" y="1455" font-size="26" text-anchor="middle">aᵗ(g) = g(t) I₂,    t ∈ ℝ</text>
<text x="385" y="1513" font-size="20" text-anchor="middle">Example2.3: every finite sign pattern occurs.</text>
<ellipse cx="915" cy="1445" rx="95" ry="52" fill="#eaf2f4" stroke="#347485" stroke-width="2"/>
<text x="915" y="1452" font-size="26" text-anchor="middle">aᵗ</text>
<ellipse cx="1250" cy="1445" rx="95" ry="52" fill="#eaf2f4" stroke="#347485" stroke-width="2"/>
<text x="1250" y="1452" font-size="26" text-anchor="middle">aᵘ</text>
<text x="1082" y="1384" font-size="23" text-anchor="middle">t ≠ u: sup_G ‖aᵗ − aᵘ‖ = 2</text>
<text x="1082" y="1534" font-size="21" text-anchor="middle">Radius-½ balls are disjoint; uncountably many.</text>
<text x="750" y="1620" font-size="20" text-anchor="middle">Takesaki III, XIII §3 Exercises3–6. Exact formulas, distances and counts; schematic positions.</text>
</g>
</svg>
