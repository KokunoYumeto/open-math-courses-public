<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc">
<title id="title">Measurable choice becomes a compatible groupoid lift</title>
<desc id="desc">The homomorphism sigma from R to H lifts p from R to the derived principal groupoid D, so Q composed with sigma equals p. On each finite class the root transports a x from u(t) to u(x) and a y from u(t) to u(y) give sigma(y,x)=a y a x inverse. The inverse root transport is composed first; products at later stages preserve earlier transports exactly.</desc>
<rect width="1040" height="530" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:26px;font-weight:bold}.label{font-size:23px}.small{font-size:18px}.node{font-size:25px}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176a80"/></marker></defs>
<text x="35" y="42" class="title" text-anchor="start">Measurable arrow choices can be made coherent</text>
<text x="35" y="79" class="label" text-anchor="start">Standard Borel target · countably presented measured hyperfinite source</text>
<line x1="520" y1="115" x2="520" y2="440" stroke="#ccd5da"/>
<text x="35" y="123" class="label" text-anchor="start">The lift commutes with Q = (r,s)</text>
<text x="90" y="195" class="node" text-anchor="middle">R</text>
<text x="420" y="195" class="node" text-anchor="middle">D</text>
<text x="90" y="360" class="node" text-anchor="middle">R</text>
<text x="420" y="360" class="node" text-anchor="middle">H</text>
<path d="M120 188 L388 188" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="253" y="172" class="label" text-anchor="middle">p</text>
<path d="M120 350 L388 350" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="253" y="332" class="label" text-anchor="middle">σ</text>
<path d="M90 319 L90 215" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="67" y="270" class="small" text-anchor="middle">id</text>
<path d="M420 319 L420 215" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="452" y="270" class="small" text-anchor="middle">Q</text>
<text x="260" y="412" class="label" text-anchor="middle">Qσ = p</text>
<text x="555" y="123" class="label" text-anchor="start">On a finite class: use one root t</text>
<text x="790" y="183" class="node" text-anchor="middle">u(t)</text>
<text x="612" y="347" class="node" text-anchor="middle">u(x)</text>
<text x="958" y="347" class="node" text-anchor="middle">u(y)</text>
<path d="M772 201 L632 310" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="675" y="246" class="label" text-anchor="middle">aₓ</text>
<path d="M813 201 L938 310" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="898" y="246" class="label" text-anchor="middle">aᵧ</text>
<path d="M664 339 L906 339" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="788" y="321" class="small" text-anchor="middle">σ(y,x)</text>
<text x="790" y="410" class="label" text-anchor="middle">σ(y,x) = aᵧ aₓ⁻¹</text>
<text x="35" y="473" class="label" text-anchor="start">First select arrows; then finite-stage products impose exact composition.</text>
<text x="35" y="512" class="small" text-anchor="start">Theorems 1.1 and 1.3 · Takesaki III, Chapter XIII, Corollary 3.25</text>
</svg>
