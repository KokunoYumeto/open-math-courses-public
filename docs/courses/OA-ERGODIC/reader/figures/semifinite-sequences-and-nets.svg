<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1125" viewBox="0 0 440 1125" role="img" aria-labelledby="title desc" style="display:block;width:100%;max-width:440px;height:auto">
<title id="title">Sequences, nets and the one-half norm gap</title>
<desc id="desc">On K=ell squared of Z for the uncountable Borel space Z=[0,1], bounded Borel functions act diagonally. Every weak or strong operator limit of a sequence of these fields is still Borel, since coordinate tests give a pointwise sequential limit. A uniformly bounded pointwise convergent sequence converges strongly. The net of finite-coordinate Borel truncations, indexed by all finite subsets of Z, converges strongly to any bounded diagonal function, including a non-Borel indicator. The exact operator norm distance of a non-Borel indicator from the Borel diagonal algebra is one half, attained by the constant one-half function. Proofs: Theorem3.2, Proposition3.3 and Corollary3.4. These are relations between operator algebras, not a drawing of a non-Borel subset.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#183746}.head{font-size:21px;font-weight:700}.math{font-family:Cambria,serif;font-size:22px}.box{fill:#f3f8fb;stroke:#54798e;stroke-width:1.5}.arrow{stroke:#365a6e;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365a6e"/></marker></defs>
<text x="20" y="32" class="head">One Hilbert space, three comparisons</text>
<text x="20" y="68" class="math">K = ℓ²(Z),  Z = [0,1] Borel</text>
<rect x="14" y="93" width="412" height="267" rx="9" class="box"/>
<text x="30" y="128" class="head">Sequences keep Borel measurability</text>
<text x="30" y="166" class="math">M_bₙ → T weakly or strongly</text>
<text x="30" y="204" class="math">⇒ b(z) = lim bₙ(z) is Borel</text>
<text x="30" y="242" class="math">⇒ T = M_b belongs to B_b(Z).</text>
<text x="30" y="281">Uniformly bounded pointwise</text>
<text x="30" y="313">convergence also gives strong</text>
<text x="30" y="343">convergence. Proposition 3.3.</text>
<line x1="220" y1="364" x2="220" y2="397" class="arrow"/>
<rect x="14" y="407" width="412" height="267" rx="9" class="box"/>
<text x="30" y="443" class="head">Nets over the finite subsets</text>
<text x="30" y="482" class="math">F ⊂ Z finite, ordered by inclusion</text>
<text x="30" y="522" class="math">M_(b 1_F) → M_b strongly</text>
<text x="30" y="560">for every bounded b, including 1_S</text>
<text x="30" y="594">when S is non-Borel.</text>
<text x="30" y="636">The strong closure is all ℓ∞(Z).</text>
<line x1="220" y1="678" x2="220" y2="711" class="arrow"/>
<rect x="14" y="721" width="412" height="267" rx="9" class="box"/>
<text x="30" y="757" class="head">A sharp operator norm distance</text>
<text x="30" y="798">For non-Borel S:</text>
<text x="30" y="840" class="math">inf_b∈B_b(Z) ‖M_1S − M_b‖ = 1/2</text>
<text x="30" y="879">Best approximation: M_(1/2).</text>
<text x="30" y="920">Error &lt; 1/2 would make</text>
<text x="30" y="957" class="math">S = {Re b &gt; 1/2} Borel.</text>
<text x="20" y="1033">Proofs: Theorem 3.2, Proposition 3.3,</text>
<text x="20" y="1066">Corollary 3.4. No metric embedding</text>
<text x="20" y="1099">or pictured non-Borel set is asserted.</text>
</svg>
