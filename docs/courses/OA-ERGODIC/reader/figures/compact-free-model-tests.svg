<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1700" viewBox="0 0 1440 1700">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#31596a"/></marker></defs>
<rect width="1440" height="1700" fill="#f7f8f5"/>
<style>text{font-family:Arial,sans-serif;fill:#183b49}.title{font-size:38px;font-weight:bold}.head{font-size:29px;font-weight:bold}.body{font-size:25px}.small{font-size:22px}.math{font-family:Georgia,serif;font-size:28px}.line{stroke:#31596a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="52" y="62" class="title">Compact tests and an invariant free Polish model</text>
<text x="52" y="106" class="body">Individual null fixed sets, uniform separation, and countable compact tests.</text>
<rect x="42" y="142" width="1356" height="410" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="190" class="head">1. A prescribed vector is fixed by a reflection of determinant −1</text>
<path d="M196.0,390 L586.0,390 M365,429.0 L365,221.0" stroke="#b5c5cc" stroke-width="2"/>
<path d="M267.5,438.75 L560,292.5" stroke="#548b70" stroke-width="4"/>
<path d="M365,390 L495,325" class="line"/>
<path d="M365,390 L300,260" class="line"/>
<text x="495" y="365" class="small">x = (2,1)</text>
<text x="190" y="244" class="small">√5 u = (−1,2)</text>
<text x="690" y="265" class="math">u = (−1,2) / √5</text>
<text x="690" y="315" class="math">R = I − 2uuᵀ =</text>
<text x="1034" y="315" class="math">[ 3/5   4/5 ]</text>
<text x="1034" y="353" class="math">[ 4/5  −3/5 ]</text>
<text x="690" y="402" class="math">Rx = x;   RᵀR = I;   det R = −1</text>
<text x="73" y="475" class="body">Fix(R) is the line spanned by x: area zero. Every vector has such a reflection.</text>
<text x="73" y="521" class="small">K = {q ∈ O(n): det q = −1} is compact; ⋃ Fix(q) = ℝⁿ for n &gt; 1. Proposition 1.1.</text>
<rect x="42" y="583" width="1356" height="278" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="631" class="head">2. Uniform separation in a concrete translation action</text>
<text x="73" y="674" class="math">G = ℝ acts by translation; K = [2,3]; U = (−2/5,2/5).</text>
<path d="M75,733 L1255,733" stroke="#b5c5cc" stroke-width="3"/>
<path d="M88,733 L312,733" stroke="#548b70" stroke-width="14"/>
<path d="M648,733 L1152,733" stroke="#c59348" stroke-width="14"/>
<text x="64" y="777" class="small">−2/5</text>
<text x="288" y="777" class="small">2/5</text>
<text x="624" y="777" class="small">8/5</text>
<text x="1128" y="777" class="small">17/5</text>
<text x="172" y="721" class="math">U</text>
<text x="821" y="721" class="math">KU</text>
<text x="73" y="824" class="small">KU = (8/5,17/5), hence KU ∩ U = ∅. Lemma 2.2 gives the general compact argument.</text>
<rect x="42" y="891" width="1356" height="422" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="939" class="head">3. Compact conjugate tests give a pointwise invariant free Gδ</text>
<text x="73" y="987" class="math">K<tspan baseline-shift="sub" font-size="18">n</tspan> ↑ G ∖ {e};   L<tspan baseline-shift="sub" font-size="18">m</tspan> ↑ G;   C<tspan baseline-shift="sub" font-size="18">m,n</tspan> = {gkg<tspan baseline-shift="super" font-size="18">−1</tspan>: g ∈ L<tspan baseline-shift="sub" font-size="18">m</tspan>, k ∈ K<tspan baseline-shift="sub" font-size="18">n</tspan>}</text>
<text x="73" y="1036" class="body">Each C is compact and avoids e. Its fixed-pair projection is closed and null.</text>
<rect x="88" y="1063" width="512" height="89" rx="12" fill="#edf5ef" stroke="#bed0d6"/>
<rect x="735" y="1063" width="557" height="89" rx="12" fill="#edf4f8" stroke="#bed0d6"/>
<text x="112" y="1101" class="small">Γ(C<tspan baseline-shift="sub" font-size="18">m,n</tspan>) is open, conull and dense.</text>
<text x="112" y="1138" class="small">Full support supplies density.</text>
<path d="M614,1107 L717,1107" class="line"/>
<text x="760" y="1101" class="math">Γ<tspan baseline-shift="sub" font-size="18">0</tspan> = ⋂<tspan baseline-shift="sub" font-size="18">n,m</tspan> Γ(C<tspan baseline-shift="sub" font-size="18">m,n</tspan>)</text>
<text x="760" y="1138" class="small">Countable intersection: conull Gδ.</text>
<text x="73" y="1202" class="body">All conjugating parameters occur: left multiplication permutes their index set.</text>
<text x="73" y="1250" class="body">Γ₀ is invariant and every point is free. A complete Gδ metric makes it Polish.</text>
<text x="73" y="1292" class="small">Theorems 3.3 and (3.6): normal measured restriction recovers the original action.</text>
<rect x="42" y="1343" width="1356" height="284" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1391" class="head">4. The density argument works for an arbitrary subgroup H</text>
<text x="73" y="1439" class="small">Invariant density class → fixed by J = closure(H) → exact Haar-averaged representative</text>
<text x="73" y="1486" class="small">H-ergodicity → density is a finite positive constant. Proposition 4.1 and Lemma 4.2.</text>
<text x="73" y="1534" class="small">Both measures are sigma-finite. The ambient group and the closed J are sigma-compact.</text>
<text x="73" y="1582" class="small">The measure that is ∞ on every positive set is excluded; it is not sigma-finite.</text>
<text x="52" y="1673" class="small">Human source: Takesaki III, XIII.1, Lemma 1.8 and Exercises 4–6, pp.8,11–12.</text>
</svg>
