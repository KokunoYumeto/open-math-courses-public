<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="570" viewBox="0 0 1060 570" role="img" aria-labelledby="title desc">
<title id="title">From a partial bijection to Borel involutions</title>
<desc id="desc">The partial shift from zero to one to two to three splits into the swaps zero with one and two with three, and the swap one with two. Each restriction has disjoint domain and range.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#17647a"/></marker></defs>
<rect width="1060" height="570" fill="white"/>
<g font-family="Arial, sans-serif" fill="#183440">
<text x="32" y="40" font-size="26" font-weight="bold">From a partial map to involutions</text>
<text x="32" y="72" font-size="18">Exact finite sample of Theorem 1.3, equation (1.1)</text>
<line x1="715" y1="105" x2="715" y2="478" stroke="#c6d8dd"/>
<text x="32" y="112" font-size="19" font-weight="bold">Partial bijection θ</text><circle cx="92" cy="153" r="24" fill="#edf4f6" stroke="#8eaeb8"/><text x="92" y="160" font-size="22" text-anchor="middle">0</text><circle cx="268" cy="153" r="24" fill="#edf4f6" stroke="#8eaeb8"/><text x="268" y="160" font-size="22" text-anchor="middle">1</text><circle cx="444" cy="153" r="24" fill="#edf4f6" stroke="#8eaeb8"/><text x="444" y="160" font-size="22" text-anchor="middle">2</text><circle cx="620" cy="153" r="24" fill="#edf4f6" stroke="#8eaeb8"/><text x="620" y="160" font-size="22" text-anchor="middle">3</text><line x1="123" y1="153" x2="237" y2="153" stroke="#17647a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="299" y1="153" x2="413" y2="153" stroke="#17647a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="475" y1="153" x2="589" y2="153" stroke="#17647a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="202" font-size="17" >D = {0,1,2},  E = {1,2,3}: the sets overlap</text><text x="32" y="253" font-size="19" font-weight="bold">First restriction: D₀ = {0,2}, E₀ = {1,3}</text><circle cx="92" cy="292" r="24" fill="#dcecf0" stroke="#8eaeb8"/><text x="92" y="299" font-size="22" text-anchor="middle">0</text><circle cx="268" cy="292" r="24" fill="#f9efd5" stroke="#8eaeb8"/><text x="268" y="299" font-size="22" text-anchor="middle">1</text><circle cx="444" cy="292" r="24" fill="#dcecf0" stroke="#8eaeb8"/><text x="444" y="299" font-size="22" text-anchor="middle">2</text><circle cx="620" cy="292" r="24" fill="#f9efd5" stroke="#8eaeb8"/><text x="620" y="299" font-size="22" text-anchor="middle">3</text><line x1="123" y1="292" x2="237" y2="292" stroke="#17647a" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="475" y1="292" x2="589" y2="292" stroke="#17647a" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="342" font-size="17" >σ₀ = (0 1)(2 3),  σ₀² = identity</text><text x="32" y="393" font-size="19" font-weight="bold">Second restriction: D₁ = {1}, E₁ = {2}</text><circle cx="92" cy="432" r="24" fill="#f5f6f7" stroke="#8eaeb8"/><text x="92" y="439" font-size="22" text-anchor="middle">0</text><circle cx="268" cy="432" r="24" fill="#dcecf0" stroke="#8eaeb8"/><text x="268" y="439" font-size="22" text-anchor="middle">1</text><circle cx="444" cy="432" r="24" fill="#f9efd5" stroke="#8eaeb8"/><text x="444" y="439" font-size="22" text-anchor="middle">2</text><circle cx="620" cy="432" r="24" fill="#f5f6f7" stroke="#8eaeb8"/><text x="620" y="439" font-size="22" text-anchor="middle">3</text><line x1="299" y1="432" x2="413" y2="432" stroke="#17647a" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="32" y="482" font-size="17" >σ₁ = (1 2); it fixes 0 and 3</text><text x="744" y="142" font-size="19" font-weight="bold">Why the construction works</text><text x="744" y="184" font-size="17" >Each source piece is disjoint</text><text x="744" y="210" font-size="17" >from its own image.</text><text x="744" y="255" font-size="17" >Swap that piece with its image;</text><text x="744" y="281" font-size="17" >fix every other point.</text><text x="744" y="326" font-size="17" >Every original arrow survives</text><text x="744" y="352" font-size="17" >in a global Borel involution.</text><text x="744" y="397" font-size="17" >Generated orbits are exactly</text><text x="744" y="423" font-size="17" >the original relation classes.</text><text x="32" y="537" font-size="15" >Proof: Orbits, stabilizers, and relation algebras, Theorem 1.3; source: Takesaki III, XIII.3.8.</text></g></svg>