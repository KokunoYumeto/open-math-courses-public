<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">Orbit pairs in one orbit and in two separate orbits</title>
<desc id="desc">Exact cyclic three-point translation models. Rows are target y, columns source x. One orbit has every pair in the relation. Two equal-mass orbits have two three-by-three blocks, with relation mass one half for the product probability.</desc>
