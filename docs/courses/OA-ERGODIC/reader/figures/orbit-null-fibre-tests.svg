<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1780" viewBox="0 0 1440 1780">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#31596a"/></marker></defs>
<rect width="1440" height="1780" fill="#f7f8f5"/>
<style>text{font-family:Arial,sans-serif;fill:#183b49}.title{font-size:37px;font-weight:bold}.head{font-size:28px;font-weight:bold}.body{font-size:25px}.small{font-size:22px}.math{font-family:Georgia,serif;font-size:27px}.line{stroke:#31596a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="52" y="62" class="title">Orbit representations: correct Haar powers and null fibres</text>
<text x="52" y="105" class="body">An everywhere-free original action can collapse a null orbit in its compact spectrum.</text>
<rect x="42" y="142" width="1356" height="420" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="189" class="head">1. Positive affine group: right multiplication by t = (2,0)</text>
<text x="73" y="236" class="math">(a,b)(c,d) = (ac,ad+b); dm = a⁻² da db; Δ(a,b) = a⁻¹</text>
<path d="M150,470 L630,470 M200,490 L200,318" stroke="#b5c5cc" stroke-width="2"/>
<path d="M200,465 L200,475" stroke="#31596a"/>
<text x="194" y="501" class="small">1</text>
<path d="M320,465 L320,475" stroke="#31596a"/>
<text x="314" y="501" class="small">2</text>
<path d="M440,465 L440,475" stroke="#31596a"/>
<text x="434" y="501" class="small">3</text>
<path d="M560,465 L560,475" stroke="#31596a"/>
<text x="554" y="501" class="small">4</text>
<text x="632" y="478" class="small">a</text>
<text x="174" y="325" class="small">b</text>
<text x="177" y="357" class="small">1</text>
<rect x="200" y="350" width="120" height="120" fill="#edf5ef" stroke="#548b70" stroke-width="3"/>
<rect x="320" y="350" width="240" height="120" fill="#fff2dc" stroke="#c59348" stroke-width="3"/>
<text x="215" y="387" class="math">A</text>
<text x="371" y="387" class="math">At</text>
<text x="207" y="428" class="small">m = 1/2</text>
<text x="369" y="428" class="small">m = 1/4</text>
<text x="73" y="539" class="small">A = [1,2] × [0,1]; At = [2,4] × [0,1].</text>
<text x="740" y="290" class="body">Set image: Haar factor 1/2.</text>
<text x="740" y="334" class="body">Pullback norm²: factor 2.</text>
<text x="740" y="384" class="math">Correct v: (1/2) · 2 = 1.</text>
<text x="740" y="428" class="math">Printed v: 2 · 2 = 4.</text>
<text x="740" y="477" class="math">ξ = √2 1<tspan baseline-shift="sub" font-size="18">A</tspan> ⊗ η, with ‖η‖ = 1.</text>
<text x="740" y="523" class="math">Correct J: ‖Jξ‖² = 1; printed: 2.</text>
<rect x="42" y="590" width="1356" height="420" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="637" class="head">2. The original action is free on both components</text>
<text x="73" y="683" class="math">X = Y<tspan baseline-shift="sub" font-size="18">ap</tspan> ⊔ ℤ, where Y = {0,1}<tspan baseline-shift="super" font-size="18">ℤ</tspan> carries fair Bernoulli probability.</text>
<rect x="88" y="717" width="515" height="100" rx="12" fill="#edf5ef" stroke="#bed0d6"/>
<text x="111" y="755" class="math">Yₐₚ: aperiodic sequences</text>
<text x="111" y="796" class="small">Conull; free shift; ergodic probability.</text>
<rect x="758" y="717" width="547" height="100" rx="12" fill="#edf5ef" stroke="#bed0d6"/>
<text x="782" y="755" class="math">ψ(x) = x on Yₐₚ</text>
<text x="782" y="796" class="small">Its free character orbit is preserved.</text>
<path d="M622,767 L738,767" class="line"/>
<rect x="88" y="843" width="515" height="100" rx="12" fill="#fff2dc" stroke="#bed0d6"/>
<text x="111" y="881" class="math">ℤ: k ↦ k+n, a free orbit</text>
<text x="111" y="922" class="small">Every point and the entire orbit are null.</text>
<path d="M622,893 L738,893" class="line"/>
<rect x="758" y="843" width="547" height="100" rx="12" fill="#fff2dc" stroke="#bed0d6"/>
<text x="782" y="881" class="math">ψ(k) = y* = (...,0,0,0,...)</text>
<text x="782" y="922" class="small">One fixed character in the compact Y.</text>
<text x="73" y="984" class="small">ψ is exactly equivariant. B = {F ∘ ψ : F ∈ C(Y)} is separable and weakly dense.</text>
<rect x="42" y="1038" width="1356" height="400" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1085" class="head">3. The null fibre has a proper commuting projection</text>
<text x="73" y="1133" class="math">π<tspan baseline-shift="sub" font-size="18">k</tspan>(F ∘ ψ) = F(y*) I;  u<tspan baseline-shift="sub" font-size="18">k</tspan>(n) is the bilateral shift on ℓ²(ℤ).</text>
<text x="73" y="1182" class="math">Fourier: δ<tspan baseline-shift="sub" font-size="18">j</tspan> ↦ z<tspan baseline-shift="super" font-size="18">j</tspan>; shifts become multiplication by z<tspan baseline-shift="super" font-size="18">n</tspan>.</text>
<text x="73" y="1231" class="math">Q = ℱ⁻¹ M<tspan baseline-shift="sub" font-size="18">1H</tspan> ℱ,  H = {z ∈ 𝕋 : Re z &gt; 0}.</text>
<text x="73" y="1280" class="math">Q² = Q = Q*;  ⟨Qδ<tspan baseline-shift="sub" font-size="18">0</tspan>,δ<tspan baseline-shift="sub" font-size="18">0</tspan>⟩ = 1/2.</text>
<text x="73" y="1329" class="body">Q is neither 0 nor I, and commutes with both families.</text>
<circle cx="1180" cy="1270" r="84" fill="none" stroke="#b5c5cc" stroke-width="3"/>
<path d="M1180,1186 A84,84 0 0 1 1180,1354" fill="none" stroke="#548b70" stroke-width="8"/>
<circle cx="1180" cy="1186" r="6" fill="white" stroke="#548b70" stroke-width="3"/>
<circle cx="1180" cy="1354" r="6" fill="white" stroke="#548b70" stroke-width="3"/>
<text x="1197" y="1180" class="small">i</text>
<text x="1277" y="1277" class="small">1</text>
<text x="1197" y="1388" class="small">−i</text>
<text x="73" y="1396" class="small">Conull free fibres are irreducible; the null fibres do not alter the direct integral.</text>
<rect x="42" y="1466" width="1356" height="239" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1513" class="head">4. Almost-everywhere irreducibility proves the global diagonal theorem</text>
<rect x="88" y="1544" width="345" height="67" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="108" y="1587" class="math">T ∈ M′ ∩ N<tspan baseline-shift="sub" font-size="18">A</tspan>′</text>
<rect x="552" y="1544" width="384" height="67" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="572" y="1587" class="math">Tₓ = a(x) I a.e.</text>
<rect x="1060" y="1544" width="244" height="67" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="1080" y="1587" class="math">T = Nₐ</text>
<path d="M450,1578 L530,1578 M951,1578 L1038,1578" class="line"/>
<text x="73" y="1650" class="small">N<tspan baseline-shift="sub" font-size="18">A</tspan> is maximal abelian in M′. The standard JMJ = M′ transfers this to π(A) in M.</text>
<text x="73" y="1687" class="small">No evaluation of the entire L∞ algebra on every original point is asserted.</text>
<text x="52" y="1748" class="small">Proofs: Examples 1.2 and 4.2, Proposition 4.1, Theorems 5.1–5.2. Takesaki III, XIII.1, Ex.7.</text>
</svg>
