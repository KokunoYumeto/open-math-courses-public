<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1900" viewBox="0 0 1440 1900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#31596a"/></marker></defs>
<rect width="1440" height="1900" fill="#f7f8f5"/>
<style>text{font-family:Arial,sans-serif;fill:#183b49}.title{font-size:36px;font-weight:bold}.head{font-size:27px;font-weight:bold}.body{font-size:25px}.small{font-size:22px}.math{font-family:Georgia,serif;font-size:27px}.line{stroke:#31596a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="52" y="62" class="title">Borel carriers: compact extraction and measurable freeness</text>
<text x="52" y="106" class="body">The two conclusions have different measure-theoretic inputs.</text>
<rect x="42" y="142" width="1356" height="302" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="190" class="head">1. The complete regularity route</text>
<rect x="88" y="222" width="560" height="99" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="108" y="260" class="math">Every open set is σ-compact</text>
<text x="108" y="296" class="math">Finite Borel μ; compact exhaustion</text>
<path d="M672,272 L730,272" class="line"/>
<rect x="755" y="222" width="557" height="99" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="775" y="260" class="math">Borel closed/open sandwiches</text>
<text x="775" y="296" class="math">Compact inner approximation</text>
<text x="88" y="369" class="body">A countable base supplies this route. Local compactness alone does not.</text>
<text x="88" y="414" class="small">Then μ(E)&gt;0 gives compact L⊂E with μ(L)&gt;0; one-element separation applies.</text>
<rect x="42" y="472" width="1356" height="550" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="520" class="head">2. The source measurable conclusion needs no Radon assumption</text>
<text x="88" y="566" class="body">Separable locally compact G; finite Borel μ; ergodic and full support.</text>
<text x="88" y="608" class="body">Jointly continuous pointwise free action on locally compact Hausdorff X.</text>
<rect x="88" y="642" width="560" height="107" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="108" y="680" class="math">V open, C=cl(V) compact, μ(V)&gt;0</text>
<text x="108" y="716" class="math">GV invariant ⇒ conull</text>
<path d="M672,696 L730,696" class="line"/>
<rect x="755" y="642" width="557" height="107" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="775" y="680" class="math">G=⋃Gₙ, each Gₙ compact</text>
<text x="775" y="716" class="math">S=GC=⋃GₙC invariant, conull</text>
<rect x="88" y="786" width="560" height="107" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="108" y="824" class="math">μ(E∩Cₙ)&gt;0 ⇒ support point x₀</text>
<text x="108" y="860" class="math">Finite compact cover proof</text>
<path d="M672,840 L730,840" class="line"/>
<rect x="755" y="786" width="557" height="107" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="775" y="824" class="math">x₀∉Kx₀ ⇒ KU₀∩U₀=∅</text>
<text x="775" y="860" class="math">F=E∩Cₙ∩U₀, μ(F)&gt;0</text>
<text x="88" y="944" class="body">K is any compact subset of G\{e}. One common F works for every k∈K.</text>
<text x="88" y="989" class="small">The point x₀ may lie outside E; F is Borel, and compactness of F is not claimed.</text>
<rect x="42" y="1050" width="1356" height="413" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1098" class="head">3. Exact real translations: K=[−3,−2]∪[2,3], U=(−2/5,2/5)</text>
<rect x="210.0" y="1195" width="270.0" height="24" fill="#548b70"/>
<circle cx="210.0" cy="1207" r="6" fill="white" stroke="#548b70" stroke-width="2"/>
<circle cx="480.0" cy="1207" r="6" fill="white" stroke="#548b70" stroke-width="2"/>
<text x="210.0" y="1179" class="math">K U: (−17/5,−8/5)</text>
<rect x="960.0" y="1195" width="270.0" height="24" fill="#548b70"/>
<circle cx="960.0" cy="1207" r="6" fill="white" stroke="#548b70" stroke-width="2"/>
<circle cx="1230.0" cy="1207" r="6" fill="white" stroke="#548b70" stroke-width="2"/>
<text x="960.0" y="1179" class="math">(8/5,17/5)</text>
<rect x="660.0" y="1263" width="120.0" height="24" fill="#c59348"/>
<circle cx="660.0" cy="1275" r="6" fill="white" stroke="#c59348" stroke-width="2"/>
<circle cx="780.0" cy="1275" r="6" fill="white" stroke="#c59348" stroke-width="2"/>
<text x="660.0" y="1247" class="math">U</text>
<path d="M210.0,1313 L210.0,1323" stroke="#31596a"/>
<text x="190.0" y="1358" class="small">−17/5</text>
<path d="M480.0,1313 L480.0,1323" stroke="#31596a"/>
<text x="460.0" y="1358" class="small">−8/5</text>
<path d="M660.0,1313 L660.0,1323" stroke="#31596a"/>
<text x="640.0" y="1358" class="small">−2/5</text>
<path d="M720.0,1313 L720.0,1323" stroke="#31596a"/>
<text x="700.0" y="1358" class="small">0</text>
<path d="M780.0,1313 L780.0,1323" stroke="#31596a"/>
<text x="760.0" y="1358" class="small">2/5</text>
<path d="M960.0,1313 L960.0,1323" stroke="#31596a"/>
<text x="940.0" y="1358" class="small">8/5</text>
<path d="M1230.0,1313 L1230.0,1323" stroke="#31596a"/>
<text x="1210.0" y="1358" class="small">17/5</text>
<text x="88" y="1407" class="math">dμ=(1/2)e^(−|x|)dx; F=[−1/3,1/3]⊂U; μ(F)=1−e^(−1/3)&gt;0.</text>
<text x="88" y="1444" class="small">Shared coordinate x(r)=720+150r. Exact nearest gap: 8/5−2/5=6/5.</text>
<rect x="42" y="1491" width="1356" height="335" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1539" class="head">4. The boundary: a finite Borel measure need not be Radon</text>
<rect x="88" y="1573" width="560" height="107" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="108" y="1611" class="math">Y=[0,ω₁), closed unbounded clubs</text>
<text x="108" y="1647" class="math">ν(Y)=1; every compact C is bounded</text>
<path d="M672,1627 L730,1627" class="line"/>
<rect x="755" y="1573" width="557" height="107" rx="10" fill="#fff2dc" stroke="#bed0d6"/>
<text x="775" y="1611" class="math">ν(C)=0 for every compact C</text>
<text x="775" y="1647" class="math">No positive compact extraction</text>
<text x="88" y="1730" class="body">Ordinal diagram is logical, not a real-coordinate model or finite sample.</text>
<text x="88" y="1776" class="small">This example is not separable and lacks full support; source part (c) is unaffected.</text>
<text x="52" y="1866" class="small">Proofs: Theorems1.2/2.1/3.2, Lemmas2.2/3.1, Examples4.1/4.2. TTIII XIII.1 Ex.5.</text>
</svg>
