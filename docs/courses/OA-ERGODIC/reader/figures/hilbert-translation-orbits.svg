<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1060" viewBox="0 0 500 1060" role="img" aria-labelledby="title desc">
<title id="title">Hilbert translations in coordinate topology</title>
<desc id="desc">The additive norm group ell squared acts on real sequences with product topology. Moving unit vectors converge coordinatewise but retain norm one. Closed finite-sum orbit pieces show meagreness. Norm balls witness both closure conditions. The unscaled binary cube gives eventual equality and zero mass to every orbit, while the geometrically scaled cube lies in the zero orbit.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#182738;font-size:18px}.head{font-weight:bold;font-size:22px}.small{font-size:16px}.math{font-family:Georgia,serif;font-size:20px}.card{fill:#f1f6fa;stroke:#b5c8d8;stroke-width:1.4}.green{fill:#edf7ef;stroke:#8bb797;stroke-width:1.4}.orange{fill:#fff5e8;stroke:#d6b07a;stroke-width:1.4}.line{stroke:#326483;stroke-width:2;fill:none}</style></defs>
<rect width="500" height="1060" fill="white"/>
<text x="24" y="34" class="head">One translation action, two topologies</text>
<text x="24" y="65" class="math">G = ℓ²(ℕ, ℝ), norm topology</text>
<text x="24" y="94" class="math">X = ℝ^ℕ, coordinate topology</text>
<text x="24" y="123" class="math">h · x = x + h; orbit = x + ℓ²</text>
<rect x="20" y="145" width="460" height="202" rx="12" class="card"/>
<text x="36" y="177" class="head">The moving unit vector</text>
<path d="M49 227 H447" class="line"/>
<path d="M87 227 V203 M168 227 V203 M249 227 V203 M330 227 V203 M411 227 V203" class="line"/>
<circle cx="87" cy="203" r="5" fill="#326483"/><circle cx="168" cy="203" r="5" fill="#326483"/><circle cx="249" cy="203" r="5" fill="#326483"/><circle cx="330" cy="203" r="5" fill="#326483"/>
<text x="77" y="252" class="small">e₁</text><text x="158" y="252" class="small">e₂</text><text x="239" y="252" class="small">e₃</text><text x="320" y="252" class="small">e₄</text><text x="402" y="252" class="small">…</text>
<text x="36" y="286" class="math">eₙ → 0 in X, but ‖eₙ‖₂ = 1</text>
<text x="36" y="317" class="small">Schematic coordinate positions; no norm limit.</text>
<rect x="20" y="365" width="460" height="170" rx="12" class="card"/>
<text x="36" y="399" class="head">Dense orbits are small in themselves</text>
<text x="36" y="432" class="math">Kₘ = {u : Σⱼ≤ₖ uⱼ² ≤ m² for every k}</text>
<text x="36" y="464">x + ℓ² = ⋃ₘ (x + Kₘ)</text>
<text x="36" y="493" class="small">Each piece is closed, with empty relative interior.</text>
<text x="36" y="518" class="small">All orbits: dense, proper, Fσ, meagre in themselves.</text>
<rect x="20" y="553" width="460" height="170" rx="12" class="green"/>
<text x="36" y="587" class="head">C and D still hold</text>
<text x="36" y="619" class="math">B₂(0, R) ⊂ N; 0 &lt; r &lt; R; M = B₂(0, r)</text>
<text x="36" y="652" class="math">C: clₓ(Mx) = x + {u : ‖u‖₂ ≤ r} ⊂ Nx</text>
<text x="36" y="684" class="math">D: ⋂ₙ clₓ(MQₙ) ⊂ Nx</text>
<text x="36" y="709" class="small">Finite-coordinate bounds; no compact norm ball.</text>
<rect x="20" y="741" width="460" height="162" rx="12" class="orange"/>
<text x="36" y="774" class="head">The unscaled binary cube</text>
<text x="36" y="806" class="math">f(a) = (aₙ); aₙ ∈ {0, 1}</text>
<text x="36" y="839" class="math">f(a) − f(b) ∈ ℓ² ⇔ a E₀ b</text>
<text x="36" y="871" class="small">Binary probability is ergodic; every orbit has mass 0.</text>
<text x="36" y="892" class="small">No quasi-invariance is claimed.</text>
<rect x="20" y="921" width="460" height="117" rx="12" class="green"/>
<text x="36" y="954" class="head">The scaled cube gives the other case</text>
<text x="36" y="986" class="math">f꜀(a) = (2⁻ⁿaₙ) ∈ ℓ²; Σₙ 4⁻ⁿ = 1/3</text>
<text x="36" y="1018" class="small">Atomless and ergodic, with mass 1 on the zero orbit.</text>
</svg>
