<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1340" width="1440" height="1340" role="img" aria-labelledby="title desc"><title id="title">Semifinite measures: the Borel-field obstruction and the orbit-normalization obstruction</title><desc id="desc">Top: bounded Borel fields on the uncountable unit space embed in all diagonal operators on ell two, with strict strong closure. Bottom: the tail relation with atomless fibres cannot split into zero-integral and proper pieces, by the auxiliary Bernoulli probability argument.</desc><rect x="0" y="0" width="1440" height="1340" fill="#f6f8fa" /><text x="46" y="53" font-family="Arial, sans-serif" font-size="32" fill="#243746" font-weight="bold"><tspan x="46" dy="0">Two semifinite measures; two failed general conclusions</tspan></text><text x="46" y="92" font-family="Arial, sans-serif" font-size="22" fill="#536979" font-weight="normal"><tspan x="46" dy="0">Exact proof mechanisms — finite drawings represent infinite spaces</tspan></text><rect x="34" y="120" width="1372" height="526" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="60" y="164" font-family="Arial, sans-serif" font-size="27" fill="#243746" font-weight="bold"><tspan x="60" dy="0">A. Unit groupoid Z = [0,1], Borel sets, counting transverse measure</tspan></text><text x="60" y="204" font-family="Arial, sans-serif" font-size="22" fill="#243746" font-weight="normal"><tspan x="60" dy="0">Semifinite and sequentially normal; no countable finite-value faithful cover (Theorem 2.1)</tspan></text><rect x="62" y="230" width="545" height="114" rx="14" fill="#e9f2f6" stroke="#cad5df" stroke-width="2" /><text x="86" y="267" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="86" dy="0">EndΛ(ℂ) = bounded Borel functions b</tspan><tspan x="86" dy="34">ν(b) = M_b on K = ℓ²(Z); norm = sup |b|</tspan></text><line x1="610" y1="286" x2="740" y2="286" stroke="#286b8b" stroke-width="3" /><polygon points="740,286 727.0,280.0 727.0,292.0" fill="#286b8b" /><text x="623" y="268" font-family="Arial, sans-serif" font-size="18" fill="#243746" font-weight="normal"><tspan x="623" dy="0">isometry</tspan></text><rect x="746" y="230" width="627" height="114" rx="14" fill="#eef4e7" stroke="#cad5df" stroke-width="2" /><text x="772" y="267" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="772" dy="0">W(ν)′ = D = {M_h : h ∈ ℓ∞(Z)}</tspan><tspan x="772" dy="34">All bounded functions h; D′ = D</tspan></text><text x="64" y="384" font-family="Arial, sans-serif" font-size="24" fill="#243746" font-weight="bold"><tspan x="64" dy="0">Choose a non-Borel S ⊂ Z. Let finite F ⊂ S increase by inclusion.</tspan></text><rect x="64" y="407" width="1307" height="145" rx="14" fill="#fbf4e7" stroke="#cad5df" stroke-width="2" /><circle cx="100" cy="444" r="8" fill="#286b8b" stroke="#286b8b" stroke-width="2" /><circle cx="147" cy="444" r="8" fill="#ffffff" stroke="#286b8b" stroke-width="2" /><circle cx="194" cy="444" r="8" fill="#286b8b" stroke="#286b8b" stroke-width="2" /><circle cx="241" cy="444" r="8" fill="#286b8b" stroke="#286b8b" stroke-width="2" /><circle cx="288" cy="444" r="8" fill="#ffffff" stroke="#286b8b" stroke-width="2" /><circle cx="335" cy="444" r="8" fill="#ffffff" stroke="#286b8b" stroke-width="2" /><circle cx="382" cy="444" r="8" fill="#286b8b" stroke="#286b8b" stroke-width="2" /><circle cx="429" cy="444" r="8" fill="#ffffff" stroke="#286b8b" stroke-width="2" /><text x="81" y="491" font-family="Arial, sans-serif" font-size="20" fill="#243746" font-weight="normal"><tspan x="81" dy="0">Finite coordinates are schematic.</tspan><tspan x="81" dy="30">P_F = M_1F is a Borel-field operator.</tspan></text><line x1="507" y1="457" x2="628" y2="457" stroke="#286b8b" stroke-width="3" /><polygon points="628,457 615.0,451.0 615.0,463.0" fill="#286b8b" /><text x="519" y="438" font-family="Arial, sans-serif" font-size="19" fill="#243746" font-weight="bold"><tspan x="519" dy="0">NET</tspan></text><text x="656" y="443" font-family="Arial, sans-serif" font-size="22" fill="#243746" font-weight="normal"><tspan x="656" dy="0">P_F → P_S strongly; P_S ∈ D</tspan><tspan x="656" dy="33">P_S has no Borel-field representative.</tspan><tspan x="656" dy="33">No least upper bound in the Borel algebra.</tspan></text><text x="64" y="590" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="64" dy="0">General bound: ‖(M_h − M_h1F)ξ‖² ≤ ‖h‖∞² Σz∉F |ξ(z)|² → 0.</tspan></text><text x="64" y="624" font-family="Arial, sans-serif" font-size="20" fill="#536979" font-weight="normal"><tspan x="64" dy="0">Theorems 2.2, 3.2; Equations (2.4), (3.5)–(3.7). Strong closure enlarges the field algebra.</tspan></text><rect x="34" y="670" width="1372" height="626" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="60" y="715" font-family="Arial, sans-serif" font-size="27" fill="#243746" font-weight="bold"><tspan x="60" dy="0">B. Tail relation on C = {0,1}ᴺ, Γ = ⊕ᴺ ℤ/2, X = C × [0,1]</tspan></text><text x="60" y="754" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="60" dy="0">Original κ(f) = Σx ∫ f(x,u) du is not σ-finite (Sections 4–5).</tspan></text><rect x="62" y="778" width="505" height="241" rx="14" fill="#e9f2f6" stroke="#cad5df" stroke-width="2" /><text x="83" y="813" font-family="Arial, sans-serif" font-size="21" fill="#243746" font-weight="normal"><tspan x="83" dy="0">Suppose X = W₀ ⊔ W₂, invariant Borel.</tspan><tspan x="83" dy="32">I(W₀) = 0 ⇒ du((W₀)x) = 0 for every x.</tspan></text><line x1="105" y1="891" x2="105" y2="954" stroke="#a0b5c3" stroke-width="3" /><circle cx="105" cy="920" r="7" fill="#286b8b" /><line x1="196" y1="891" x2="196" y2="954" stroke="#a0b5c3" stroke-width="3" /><circle cx="196" cy="920" r="7" fill="#286b8b" /><line x1="287" y1="891" x2="287" y2="954" stroke="#a0b5c3" stroke-width="3" /><circle cx="287" cy="920" r="7" fill="#286b8b" /><line x1="378" y1="891" x2="378" y2="954" stroke="#a0b5c3" stroke-width="3" /><circle cx="378" cy="920" r="7" fill="#286b8b" /><line x1="469" y1="891" x2="469" y2="954" stroke="#a0b5c3" stroke-width="3" /><circle cx="469" cy="920" r="7" fill="#286b8b" /><text x="86" y="988" font-family="Arial, sans-serif" font-size="19" fill="#536979" font-weight="normal"><tspan x="86" dy="0">Drawn orbit points are a finite schematic.</tspan></text><line x1="573" y1="884" x2="681" y2="884" stroke="#286b8b" stroke-width="3" /><polygon points="681,884 668.0,878.0 668.0,890.0" fill="#286b8b" /><text x="588" y="858" font-family="Arial, sans-serif" font-size="19" fill="#243746" font-weight="normal"><tspan x="588" dy="0">finite</tspan></text><text x="582" y="912" font-family="Arial, sans-serif" font-size="19" fill="#243746" font-weight="normal"><tspan x="582" dy="0">Tonelli</tspan></text><rect x="687" y="778" width="686" height="241" rx="14" fill="#eef4e7" stroke="#cad5df" stroke-width="2" /><text x="711" y="813" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="711" dy="0">Auxiliary β = fair Bernoulli probability on C</tspan><tspan x="711" dy="34">β is Γ-invariant; (β ⊗ du)(W₂) = 1.</tspan><tspan x="711" dy="34">For some u: E = {x : (x,u) ∈ W₂},</tspan><tspan x="711" dy="34">E invariant Borel; 0 &lt; β(E) ≤ 1.</tspan><tspan x="711" dy="34">If ν*g₂ = 1_W₂, set φ(x) = g₂(x,u).</tspan></text><rect x="62" y="1045" width="1311" height="148" rx="14" fill="#fbf4e7" stroke="#cad5df" stroke-width="2" /><text x="83" y="1080" font-family="Arial, sans-serif" font-size="24" fill="#243746" font-weight="bold"><tspan x="83" dy="0">Σh∈Γ φ(hx) = 1 on E; a = ∫E φ dβ ∈ [0, β(E)].</tspan><tspan x="83" dy="36">0 &lt; β(E) = Σh∈Γ ∫E φ(hx) dβ = Σh∈Γ a.</tspan><tspan x="83" dy="36">Γ is countably infinite: the last sum is 0 or +∞. Contradiction.</tspan></text><text x="65" y="1234" font-family="Arial, sans-serif" font-size="21" fill="#243746" font-weight="normal"><tspan x="65" dy="0">Theorem 5.1, Equations (5.5)–(5.10). The auxiliary finite product justifies Tonelli.</tspan></text><text x="65" y="1270" font-family="Arial, sans-serif" font-size="19" fill="#536979" font-weight="normal"><tspan x="65" dy="0">Antecedents: Claude-RO Example 7.6; Claude-MGT Example 6.13. Source claims: Connes PDF 17, 31–32.</tspan></text></svg>
