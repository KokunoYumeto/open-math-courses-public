<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
<title id="title">Continuous probability kernels transfer a subgroup mean</title>
<desc id="desc">The probability tau_g on H has density chi(h inverse g). Left subgroup translation transports tau_g to tau_ag and intertwines the averaging map. An affine group example uses a inverse times p(b over a), normalized against dt on the translation subgroup.</desc>
<rect width="1160" height="760" fill="#f7faf9"/>
<text x="580" y="47" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#21464e">Averaging transfers the ambient mean to a closed subgroup</text>
<text x="580" y="86" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#21464e">H is closed in G; q(g) = Hg. No quotient measure or Borel section is assumed.</text>
<rect x="65" y="120" width="475" height="170" rx="13" fill="#e0eee8" stroke="#91b5ae"/>
<rect x="620" y="120" width="475" height="170" rx="13" fill="#e0eee8" stroke="#91b5ae"/>
<text x="302" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">Probability on H at g</text>
<text x="302" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#21464e">dτg(h) = χ(h⁻¹g) dh</text>
<text x="302" y="246" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#21464e">∫H χ(h⁻¹g) dh = 1</text>
<text x="857" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">Probability on H at ag</text>
<text x="857" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#21464e">τag = a*τg</text>
<text x="857" y="246" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#21464e">a ∈ H; use h = ak and left Haar measure</text>
<path d="M550 205 H605 M594 196 L605 205 L594 214" stroke="#426d70" stroke-width="3" fill="none"/>
<text x="578" y="174" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">a*</text>
<rect x="140" y="324" width="880" height="105" rx="13" fill="#e8eef6" stroke="#91b5ae"/>
<text x="580" y="365" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#21464e">Tf(g) = ∫H f(h) dτg(h)</text>
<text x="580" y="401" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#21464e">T(Laf) = La(Tf);     mH(f) = M(Tf)</text>
<text x="580" y="473" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">Positive + unital + equivariant: mH is a left invariant mean on UC(H).</text>
<rect x="65" y="510" width="1030" height="211" rx="13" fill="#f2ece1" stroke="#91b5ae"/>
<text x="580" y="548" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#21464e">Affine coordinates: G = {(a,b): a &gt; 0}, H = {(1,t)}</text>
<text x="580" y="586" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#21464e">Ambient Haar: a⁻² da db.     Subgroup Haar: dt.</text>
<text x="580" y="624" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#21464e">χ(a,b) = a⁻¹ p(b/a),      ∫ℝ p(u) du = 1</text>
<text x="580" y="662" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#21464e">(1,t)⁻¹(a,b) = (a,b−t);     ∫ℝ a⁻¹p((b−t)/a) dt = 1</text>
<text x="580" y="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#21464e">The factor a⁻¹ normalizes the subgroup probability, not a quotient disintegration.</text>
</svg>
