<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">A principal groupoid with a hidden free-group factor</title>
<desc id="desc">A single pair arrow has a measurable relative group label. Every branch has Lebesgue mass, giving a regular group coordinate, a type II infinity random-operator factor, and a controlled unitary in the extra relative commutant of the canonical tensor copies. The diagram is a schematic of measured events, not a drawing of nonmeasurable partition subsets.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28647a"/></marker>
 <style>
 text{font-family:Georgia,"Times New Roman",serif;fill:#183340}
 .title{font-family:Arial,sans-serif;font-size:28px;font-weight:700}
 .head{font-family:Arial,sans-serif;font-size:21px;font-weight:700}
 .body{font-size:21px}
 .math{font-size:24px}
 .small{font-size:18px}
 .panel{fill:#f7fafb;stroke:#b2c8d2;stroke-width:2}
 .line{stroke:#28647a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
 .box{fill:#e7f2f3;stroke:#28647a;stroke-width:1.6}
 .warn{fill:#fff5e6;stroke:#ceaa66;stroke-width:1.6}
 </style>
</defs>
<rect width="1200" height="1080" fill="white"/>
<text x="35" y="45" class="title">Principal arrows, hidden group coordinate, extra commutant</text>
<text x="35" y="76" class="small">Exact proof diagram for Γ = F₂ = ⟨a,b⟩. Branch boxes are measured events, not intervals.</text>

<rect x="30" y="100" width="555" height="240" rx="10" class="panel"/>
<text x="50" y="132" class="head">1. One arrow between each endpoint pair</text>
<circle cx="100" cy="215" r="25" class="box"/><text x="93" y="223" class="math">x</text>
<circle cx="300" cy="215" r="25" class="box"/><text x="293" y="223" class="math">y</text>
<circle cx="510" cy="215" r="25" class="box"/><text x="503" y="223" class="math">z</text>
<path d="M128 215H269" class="line"/><path d="M329 215H479" class="line"/>
<text x="158" y="192" class="body">d(y,x) = g</text><text x="360" y="192" class="body">d(z,y) = k</text>
<path d="M100 245Q300 294 510 245" class="line"/>
<text x="216" y="309" class="body">d(z,x) = kg</text>
<text x="50" y="165" class="small">d(y,x) = a(y)a(x)⁻¹; isotropy is {e}.  [§2]</text>

<rect x="605" y="100" width="565" height="240" rx="10" class="panel"/>
<text x="625" y="132" class="head">2. A range fibre has all relative labels</text>
<rect x="625" y="166" width="155" height="64" rx="6" class="box"/>
<rect x="800" y="166" width="155" height="64" rx="6" class="box"/>
<rect x="975" y="166" width="155" height="64" rx="6" class="box"/>
<text x="649" y="194" class="body">d = e</text><text x="824" y="194" class="body">d = a</text><text x="999" y="194" class="body">d = b, …</text>
<text x="646" y="218" class="small">source mass ℓ(B)</text><text x="821" y="218" class="small">source mass ℓ(B)</text><text x="996" y="218" class="small">source mass ℓ(B)</text>
<text x="625" y="263" class="body">νʸ{s ∈ B, d ∈ F} = |F|ℓ(B), F finite</text>
<text x="625" y="293" class="body">νʸ(Gʸ) = ∞; Λ(ν) = 1; Λ<tspan baseline-shift="sub" font-size="15">ν</tspan> = ℓ</text>
<text x="625" y="320" class="small">Uniform translated properness: |F|.  [§§2–3]</text>

<rect x="30" y="360" width="1140" height="190" rx="10" class="panel"/>
<text x="50" y="392" class="head">3. The full random-operator calculation</text>
<text x="50" y="431" class="math">Hʸ ≅ K ⊗ ℓ²(Γ), K = L²([0,1],ℓ);   U(γ) = 1 ⊗ λ<tspan baseline-shift="sub" font-size="16">d(γ)</tspan></text>
<text x="50" y="469" class="math">End<tspan baseline-shift="sub" font-size="16">Λ</tspan>(H) = B(K) ⊗̄ R<tspan baseline-shift="sub" font-size="16">Γ</tspan>,   R<tspan baseline-shift="sub" font-size="16">Γ</tspan> = {λ<tspan baseline-shift="sub" font-size="16">g</tspan> : g ∈ Γ}′</text>
<text x="50" y="505" class="body">R<tspan baseline-shift="sub" font-size="15">F₂</tspan> has scalar centre and faithful finite trace; B(K) gives proper infinity.</text>
<text x="50" y="533" class="small">Countable total coefficient family, bound 1; type II∞ factor.  [Theorem 4.1, Lemma 4.2, Corollary 4.3]</text>

<rect x="30" y="570" width="1140" height="328" rx="10" class="panel"/>
<text x="50" y="603" class="head">4. Canonical tensor copies leave a controlled translation outside them</text>
<text x="50" y="640" class="body">E = End<tspan baseline-shift="sub" font-size="15">Λ</tspan>(H ⊗ H);   P = M ⊗ 1;   Q = 1 ⊗ M;   ΣPΣ = Q;   Σ² = 1</text>
<text x="50" y="677" class="math">W<tspan baseline-shift="sub" font-size="16">a</tspan>(δ<tspan baseline-shift="sub" font-size="16">g</tspan> ⊗ δ<tspan baseline-shift="sub" font-size="16">k</tspan>) = δ<tspan baseline-shift="sub" font-size="16">kak⁻¹g</tspan> ⊗ δ<tspan baseline-shift="sub" font-size="16">k</tspan></text>
<text x="50" y="711" class="body">‖W<tspan baseline-shift="sub" font-size="15">a</tspan>‖ = 1; diagonal covariance keeps W<tspan baseline-shift="sub" font-size="15">a</tspan> in E; it commutes with P.</text>
<rect x="50" y="735" width="1080" height="82" rx="6" class="warn"/>
<text x="70" y="766" class="body">(λ<tspan baseline-shift="sub" font-size="15">b</tspan> ⊗ 1)W<tspan baseline-shift="sub" font-size="15">a</tspan>(δ<tspan baseline-shift="sub" font-size="15">e</tspan> ⊗ δ<tspan baseline-shift="sub" font-size="15">e</tspan>) = δ<tspan baseline-shift="sub" font-size="15">ba</tspan> ⊗ δ<tspan baseline-shift="sub" font-size="15">e</tspan></text>
<text x="70" y="800" class="body">W<tspan baseline-shift="sub" font-size="15">a</tspan>(λ<tspan baseline-shift="sub" font-size="15">b</tspan> ⊗ 1)(δ<tspan baseline-shift="sub" font-size="15">e</tspan> ⊗ δ<tspan baseline-shift="sub" font-size="15">e</tspan>) = δ<tspan baseline-shift="sub" font-size="15">ab</tspan> ⊗ δ<tspan baseline-shift="sub" font-size="15">e</tspan>     (ba ≠ ab)</text>
<text x="50" y="855" class="math">W<tspan baseline-shift="sub" font-size="16">a</tspan> ∈ P′ ∩ E,   W<tspan baseline-shift="sub" font-size="16">a</tspan> ∉ Q,   W<tspan baseline-shift="sub" font-size="16">a</tspan> ∉ P ∨ Q</text>
<text x="50" y="882" class="small">Each canonical copy commutes with separate λ<tspan baseline-shift="sub" font-size="13">b</tspan>; W<tspan baseline-shift="sub" font-size="13">a</tspan> does not.  [Proposition 5.1, equation (5.5)]</text>

<rect x="30" y="918" width="1140" height="126" rx="10" class="warn"/>
<text x="50" y="951" class="head">Scope: a failure of this tensor construction, with the existential question open</text>
<text x="50" y="982" class="body">The arrow sigma-field is countably generated and separated, but is not standard Borel.</text>
<text x="50" y="1012" class="body">The positive standard Borel theorem survives; a different pair in M is not excluded.</text>
<text x="35" y="1067" class="small">Sources: owned full partition and factor proofs; Connes, Cor. 11, author PDF 44–45; Claude-SQ actual §8 boundary.</text>
</svg>
