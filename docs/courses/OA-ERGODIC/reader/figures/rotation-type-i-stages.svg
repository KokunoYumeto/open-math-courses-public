<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1370" viewBox="0 0 1480 1370" role="img" aria-labelledby="title desc">
<title id="title">Irrational rotation and increasing type I operator stages</title>
<desc id="desc">The first panel numerically samples T to the j applied to 1 for theta square root of two minus one and j zero through five. The remaining class boxes, inclusions and arrow positions are schematic. Exact formulas distinguish all-diagonal type I stages, balanced ordinary matrix stages and the tracial L2 norm error of a restricted orbit unitary.</desc>
<rect width="1480" height="1370" fill="#f7fafb"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#347485"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif" fill="#173f4b">
<text x="740" y="50" font-size="33" text-anchor="middle">From finite orbit classes to type I subalgebras</text>
<rect x="30" y="85" width="1420" height="405" rx="16" fill="white" stroke="#a6c0c7"/>
<text x="740" y="130" font-size="28" text-anchor="middle">1. The Weyl sign determines the free circle rotation</text>
<circle cx="325" cy="312" r="140" fill="#eaf2f4" stroke="#347485" stroke-width="2"/>
<circle cx="465.0" cy="312.0" r="7" fill="#b77238"/>
<text x="494.0" y="320.0" font-size="23" text-anchor="middle">0</text>
<circle cx="204.8497340063655" cy="383.8603756019886" r="7" fill="#b77238"/>
<text x="179.96146462196978" y="406.7457391195434" font-size="23" text-anchor="middle">1</text>
<circle cx="391.2298059763018" cy="188.65652510026555" r="7" fill="#b77238"/>
<text x="404.94883721425003" y="171.1068052996063" font-size="23" text-anchor="middle">2</text>
<circle cx="331.47128306849925" cy="451.8503575091868" r="7" fill="#b77238"/>
<text x="332.8117631326884" y="488.81936013608976" font-size="23" text-anchor="middle">3</text>
<circle cx="247.66267428083682" cy="195.29979412782484" r="7" fill="#b77238"/>
<text x="231.64279966758158" y="179.12618005430284" font-size="23" text-anchor="middle">4</text>
<circle cx="451.27300630855495" cy="372.4576535915813" r="7" fill="#b77238"/>
<text x="477.4295576153271" y="392.9810246926945" font-size="23" text-anchor="middle">5</text>
<text x="900" y="210" font-size="28" text-anchor="middle">u = V(b),  v = U(a),  θ = ab/(2π)</text>
<text x="900" y="265" font-size="28" text-anchor="middle">vuv* = eⁱᵃᵇ u;  T(z) = e⁻ⁱᵃᵇ z</text>
<text x="900" y="322" font-size="24" text-anchor="middle">Sample: θ = √2 − 1,  points Tʲ(1),  j = 0,…,5</text>
<text x="900" y="378" font-size="21" text-anchor="middle">Angles −2πjθ are exact; plotted coordinates are numerical.</text>
<text x="900" y="435" font-size="21" text-anchor="middle">Theorems2.1/4.1; no finite orbit or equal spacing asserted.</text>
<rect x="30" y="515" width="1420" height="440" rx="16" fill="white" stroke="#a6c0c7"/>
<text x="740" y="560" font-size="28" text-anchor="middle">2. Finite classes retain a measurable matrix centre</text>
<rect x="110" y="600" width="255" height="112" rx="16" fill="white" stroke="#a6c0c7"/>
<text x="237.5" y="630" font-size="17" text-anchor="middle">One schematic 2-point Fₙ-class</text>
<circle cx="160.0" cy="671" r="7" fill="#b77238"/>
<circle cx="315.0" cy="671" r="7" fill="#b77238"/>
<rect x="430" y="600" width="305" height="112" rx="16" fill="white" stroke="#a6c0c7"/>
<text x="582.5" y="630" font-size="17" text-anchor="middle">One schematic 3-point Fₙ-class</text>
<circle cx="480.0" cy="671" r="7" fill="#b77238"/>
<circle cx="582.5" cy="671" r="7" fill="#b77238"/>
<circle cx="685.0" cy="671" r="7" fill="#b77238"/>
<text x="1080" y="636" font-size="27" text-anchor="middle">Nₙ ≅ ∏_{q≥1} L∞(B_q,ν_q) ⊗ M_q</text>
<text x="1080" y="690" font-size="23" text-anchor="middle">Fibre: ℂ^q ⊗ ℓ²([b]_R); action: M_q ⊗ 1</text>
<text x="740" y="765" font-size="24" text-anchor="middle">All diagonal functions belong to every Nₙ.  The multiplicity counts the larger R-class.</text>
<text x="740" y="824" font-size="29" text-anchor="middle">Fₙ ⊂ Fₙ₊₁  ⇒  Nₙ ⊂ Nₙ₊₁;   (⋃Nₙ)″ = M(R)</text>
<text x="740" y="888" font-size="23" text-anchor="middle">Balanced refinements additionally give ordinary matrix stages Aₙ ↪ Aₙ ⊗ 1.</text>
<text x="740" y="929" font-size="20" text-anchor="middle">Proposition3.1, equations(3.3)–(3.4); Corollary5.1 supplies compatibility.</text>
<rect x="30" y="980" width="1420" height="305" rx="16" fill="white" stroke="#a6c0c7"/>
<text x="740" y="1025" font-size="28" text-anchor="middle">3. Keep the arrows whose sources are already captured</text>
<circle cx="185" cy="1100" r="7" fill="#b77238"/>
<text x="185" y="1140" font-size="25" text-anchor="middle">x</text>
<circle cx="550" cy="1100" r="7" fill="#b77238"/>
<text x="550" y="1140" font-size="25" text-anchor="middle">Tx</text>
<line x1="207" y1="1100" x2="519" y2="1100" stroke="#347485" stroke-width="3" marker-end="url(#arr)"/>
<text x="360" y="1081" font-size="27" text-anchor="middle">v 1Dₙ</text>
<text x="1020" y="1090" font-size="27" text-anchor="middle">Dₙ = {x : (Tx,x) ∈ Fₙ}</text>
<text x="1020" y="1143" font-size="29" text-anchor="middle">‖v − v1Dₙ‖₂² = μ(Dₙᶜ) → 0</text>
<text x="740" y="1210" font-size="24" text-anchor="middle">If μ(Dₙᶜ) &gt; 0, the operator-norm error is 1.  Strong convergence still holds.</text>
<text x="740" y="1261" font-size="20" text-anchor="middle">Theorem4.1 and Exercise6.6. Arrow length and class-box positions are schematic.</text>
<text x="740" y="1333" font-size="20" text-anchor="middle">Takesaki III, XIII.3 Exercise2; Takesaki II, XI.2 Exercise5. Exact sign, norms and inclusions.</text>
</g>
</svg>
