<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Closed path orbits and the full range unitary</title>
<desc id="desc">The measured orbit a_x U(N_x) is repaired as a closed-set field Q(x). A path p_x is selected. Its exact translated comparison has unique right constant k(h,x) in U(N_x). The ancillary map beta(h,x) transports k to w(h,x) in U(N_Thx). Scalar phases are retained. This is a schematic of Theorem 4.1.</desc>
<rect width="1440" height="1000" fill="#f6faf9"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3e7179"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" fill="#193d49">
<text x="720" y="50" font-size="31" text-anchor="middle">A closed orbit yields a strict unitary in the range factor</text>
<text x="720" y="91" font-size="25" text-anchor="middle">Ambient path space: P = L⁰(Qᵤ, U(H_d));   source group: U(Nₓ)</text>
<rect x="55.0" y="155.0" width="380" height="100" rx="12" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="245" y="213" font-size="25" text-anchor="middle">Q₀(x) = aₓ U(Nₓ)</text>
<rect x="600.0" y="155.0" width="290" height="100" rx="12" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="745" y="213" font-size="25" text-anchor="middle">Q(x), equivariant</text>
<rect x="1055.0" y="155.0" width="300" height="100" rx="12" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="1205" y="213" font-size="25" text-anchor="middle">pₓ ∈ Q(x)</text>
<line x1="445" y1="205" x2="590" y2="205" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="515" y="172" font-size="21" text-anchor="middle">Haar repair</text>
<line x1="900" y1="205" x2="1045" y2="205" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="972" y="172" font-size="21" text-anchor="middle">Borel selector</text>
<text x="720" y="307" font-size="25" text-anchor="middle">Q(x) is an attained transported orbit; Q = Q₀ almost everywhere.</text>
<text x="720" y="353" font-size="24" text-anchor="middle">The selected path is pₓ = aₓ wherever aₓ ∈ Q(x).</text>
<rect x="90.0" y="415.0" width="1260" height="130" rx="12" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="720" y="488" font-size="25" text-anchor="middle">β(h,x)⁻¹_* p_Thx = R_h pₓ · k(h,x)⁻¹</text>
<line x1="1205" y1="262" x2="1205" y2="405" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="575" font-size="24" text-anchor="middle">R_h p(t) = p(th);   the subscript * means pointwise action on paths.</text>
<text x="720" y="620" font-size="25" text-anchor="middle">Closed constant-orbit coordinates give exactly one k(h,x) ∈ U(Nₓ).</text>
<rect x="100.0" y="705.0" width="440" height="100" rx="12" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="320" y="763" font-size="25" text-anchor="middle">k(h,x) ∈ U(Nₓ)</text>
<rect x="870.0" y="705.0" width="480" height="100" rx="12" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="1110" y="763" font-size="25" text-anchor="middle">w(h,x) ∈ U(N_Thx)</text>
<line x1="550" y1="755" x2="855" y2="755" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="705" y="721" font-size="26" text-anchor="middle">β(h,x)</text>
<text x="720" y="857" font-size="27" text-anchor="middle">w(h,x) = β(h,x)(k(h,x));   scalar phases are retained.</text>
<text x="720" y="918" font-size="21" text-anchor="middle">Proof: Theorem 4.1, equations (4.6)–(4.10). Schematic; no numerical path samples.</text>
<text x="720" y="960" font-size="21" text-anchor="middle">Human source: Takesaki III, XIII.3.30(iii), formula (7).</text>
</g>
</svg>
