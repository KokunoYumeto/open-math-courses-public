<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" role="img" aria-labelledby="title desc">
<title id="title">Variable factor-field conjugacy with a range unitary</title>
<desc id="desc">The upper arrow is A(g,x) from M_x to M_Tgx. Vertical arrows are theta_x and theta_Tgx. The lower path is B(g,Fx) followed by Ad(w(g,x)), both targeting N_FTgx. The base equality is F(Tgx)=Sg(Fx).</desc>
<rect width="1160" height="740" fill="#f6faf9"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3e7179"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" fill="#193d49">
<text x="580" y="46" font-size="28" text-anchor="middle">Fibre conjugacy has a source map and a range unitary</text>
<text x="580" y="88" font-size="24" text-anchor="middle">Base equality: F(Tg x) = Sg(F(x))</text>
<rect x="105" y="148" width="270" height="84" rx="10" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="240" y="198" font-size="28" text-anchor="middle">Mₓ</text>
<rect x="765" y="148" width="270" height="84" rx="10" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="900" y="198" font-size="28" text-anchor="middle">M_Tg x</text>
<rect x="105" y="383" width="270" height="84" rx="10" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="240" y="433" font-size="28" text-anchor="middle">N_F(x)</text>
<rect x="765" y="383" width="270" height="84" rx="10" fill="#e2eeed" stroke="#7c9b9e"/>
<text x="900" y="433" font-size="28" text-anchor="middle">N_F(Tg x)</text>
<line x1="382" y1="190" x2="754" y2="190" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="570" y="169" font-size="23" text-anchor="middle">A(g,x): Mₓ → M_Tg x</text>
<line x1="240" y1="243" x2="240" y2="374" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="125" y="315" font-size="27" text-anchor="middle">θₓ</text>
<line x1="900" y1="243" x2="900" y2="374" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1020" y="315" font-size="27" text-anchor="middle">θ_Tg x</text>
<line x1="382" y1="425" x2="754" y2="425" stroke="#3e7179" stroke-width="3" marker-end="url(#arrow)"/>
<text x="570" y="385" font-size="22" text-anchor="middle">B(g,F(x)), then Ad(w(g,x))</text>
<text x="580" y="525" font-size="27" text-anchor="middle">θ_Tg x A(g,x) θₓ⁻¹ = Ad(w(g,x)) B(g,F(x))</text>
<text x="580" y="571" font-size="24" text-anchor="middle">w(g,x) ∈ U(N_F(Tg x));   w(g,x) = u_g(F(Tg x))</text>
<text x="580" y="617" font-size="22" text-anchor="middle">Density factors act on Hilbert vectors and cancel on algebra elements.</text>
<text x="580" y="675" font-size="19" text-anchor="middle">Proof: Theorem 1.1 and Proposition 2.2, equations (1.4), (2.4)–(2.6).</text>
<text x="580" y="713" font-size="18" text-anchor="middle">Human sources: Takesaki III, XIII.3.30; Takesaki II, X.3.12. Fixed-parameter measured formula.</text>
</g>
</svg>
