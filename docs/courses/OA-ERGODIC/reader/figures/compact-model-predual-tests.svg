<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
<title id="title">Countable smoothing through finite predual tests</title>
<desc id="desc">For each unit-ball element a_j, finite normal-functional tests determine V_j,k and its normalized Haar bump. Bounds one over k and two times the approximation error give ultraweak convergence. A countable dense set of group labels then gives a separable invariant C-star algebra and a compact metrizable spectrum.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#356087"/></marker></defs>
<rect width="1280" height="1000" fill="#f5f8fc"/>
<text x="40" y="53" font-family="Arial, sans-serif" font-size="31" fill="#16324f" font-weight="bold">Countable smoothing at the full group scope</text>
<text x="40" y="90" font-family="Arial, sans-serif" font-size="23" fill="#16324f" font-weight="normal">G: separable locally compact Hausdorff  |  A: abelian, separable predual</text>
<text x="40" y="125" font-family="Arial, sans-serif" font-size="21" fill="#16324f" font-weight="normal">Proof schematic • Lemma 3.1, equations (3.3)–(3.6)</text>
<rect x="35" y="150" width="1210" height="280" rx="14" fill="#ffffff" stroke="#b7c7d8" stroke-width="2"/>
<text x="58" y="190" font-family="Arial, sans-serif" font-size="25" fill="#16324f" font-weight="bold">1. Fix j and k. Only the first k tests determine the neighborhood.</text>
<text x="58" y="230" font-family="Arial, sans-serif" font-size="25" fill="#16324f" font-weight="normal">Choose Vⱼ,ₖ so |ψℓ(αₛ(aⱼ) − aⱼ)| &lt; 1/k for s ∈ Vⱼ,ₖ and ℓ ≤ k.</text>
<rect x="90" y="253" width="100" height="58" rx="14" fill="#e3edf9" stroke="#b7c7d8" stroke-width="2"/>
<text x="117" y="291" font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="normal">ψ₁</text>
<rect x="230" y="253" width="100" height="58" rx="14" fill="#e3edf9" stroke="#b7c7d8" stroke-width="2"/>
<text x="257" y="291" font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="normal">ψ₂</text>
<rect x="370" y="253" width="100" height="58" rx="14" fill="#e3edf9" stroke="#b7c7d8" stroke-width="2"/>
<text x="397" y="291" font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="normal">ψ₃</text>
<rect x="570" y="253" width="100" height="58" rx="14" fill="#e3edf9" stroke="#b7c7d8" stroke-width="2"/>
<text x="597" y="291" font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="normal">…</text>
<rect x="735" y="253" width="100" height="58" rx="14" fill="#e3edf9" stroke="#b7c7d8" stroke-width="2"/>
<text x="762" y="291" font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="normal">ψₖ</text>
<line x1="850" y1="282" x2="1030" y2="282" stroke="#356087" stroke-width="3" marker-end="url(#arrow)"/>
<text x="910" y="259" font-family="Arial, sans-serif" font-size="20" fill="#16324f" font-weight="normal">finite tests</text>
<rect x="1050" y="252" width="155" height="60" rx="14" fill="#e4f2ed" stroke="#b7c7d8" stroke-width="2"/>
<text x="1064" y="292" font-family="Arial, sans-serif" font-size="23" fill="#16324f" font-weight="normal">Vⱼ,ₖ ⊂ G</text>
<text x="58" y="350" font-family="Arial, sans-serif" font-size="24" fill="#16324f" font-weight="normal">Choose fⱼ,ₖ ≥ 0, continuous with compact support in Vⱼ,ₖ;  ∫ fⱼ,ₖ(s) ds = 1.</text>
<text x="58" y="395" font-family="Arial, sans-serif" font-size="25" fill="#16324f" font-weight="normal">Set uⱼ,ₖ = ∫ fⱼ,ₖ(s) αₛ(aⱼ) ds.  Then ‖uⱼ,ₖ‖ ≤ 1.</text>
<line x1="640" y1="433" x2="640" y2="465" stroke="#356087" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="480" width="1210" height="205" rx="14" fill="#ffffff" stroke="#b7c7d8" stroke-width="2"/>
<text x="58" y="520" font-family="Arial, sans-serif" font-size="25" fill="#16324f" font-weight="bold">2. The finite bounds imply convergence for every normal functional.</text>
<text x="58" y="563" font-family="Arial, sans-serif" font-size="27" fill="#16324f" font-weight="normal">|ψℓ(uⱼ,ₖ − aⱼ)| ≤ 1/k  (ℓ ≤ k)</text>
<text x="58" y="607" font-family="Arial, sans-serif" font-size="27" fill="#16324f" font-weight="normal">|ψ(uⱼ,ₖ − aⱼ)| ≤ 2‖ψ − ψℓ‖ + 1/k  (k ≥ ℓ, ‖ψ‖ ≤ 1)</text>
<text x="58" y="650" font-family="Arial, sans-serif" font-size="24" fill="#16324f" font-weight="normal">Choose ℓ first; then let k → ∞.  Thus uⱼ,ₖ → aⱼ ultraweakly for each j.</text>
<line x1="640" y1="688" x2="640" y2="720" stroke="#356087" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="735" width="1210" height="185" rx="14" fill="#eaf4ef" stroke="#b7c7d8" stroke-width="2"/>
<text x="58" y="777" font-family="Arial, sans-serif" font-size="25" fill="#16324f" font-weight="bold">3. Countable group labels give the invariant compact model.</text>
<text x="58" y="820" font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="normal">D ⊂ G countable dense;   B = C*(1, αd(uⱼ,ₖ) : d ∈ D, j,k ≥ 1).</text>
<text x="58" y="862" font-family="Arial, sans-serif" font-size="25" fill="#16324f" font-weight="normal">B separable and α-invariant;   B″ = A;   Ω = Spec(B) compact metrizable.</text>
<text x="58" y="898" font-family="Arial, sans-serif" font-size="22" fill="#16324f" font-weight="normal">Norm continuity of each smoothed orbit proves invariance of B.</text>
<text x="40" y="963" font-family="Arial, sans-serif" font-size="22" fill="#16324f" font-weight="normal">Vⱼ,ₖ need not shrink in G. Countability comes from the predual and D.</text>
</svg>
