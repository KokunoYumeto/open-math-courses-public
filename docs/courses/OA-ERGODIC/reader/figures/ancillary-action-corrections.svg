<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="535" viewBox="0 0 1040 535" role="img" aria-labelledby="title desc">
<title id="title">Two corrections remove the fibre action</title>
<desc id="desc">An automorphism cocycle b is gauged to an inner automorphism cocycle c by f. The map c from the relation R lifts through Ad to a unitary homomorphism w. The initially selected unitaries v have a scalar defect omega; w differs from v by a scalar and composes exactly. Evaluating w on the group arrow gives a unitary cocycle for the simple centre lifting.</desc>
<rect width="1040" height="535" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:26px;font-weight:bold}.label{font-size:22px}.small{font-size:19px}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176a80"/></marker></defs>
<text x="35" y="43" class="title" text-anchor="start">Two corrections remove the fibre action</text>
<text x="35" y="81" class="label" text-anchor="start">Free countable action · hyperfinite orbit relation · dense inner automorphisms</text>
<text x="35" y="133" class="label" text-anchor="start">1. Change fibre coordinates</text>
<text x="72" y="187" class="label" text-anchor="start">b(y,x) ∈ Aut(N)</text>
<path d="M300 180 L570 180" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<text x="430" y="166" class="small" text-anchor="middle">gauge by f</text>
<text x="615" y="187" class="label" text-anchor="start">c(y,x) ∈ Int(N)</text>
<text x="35" y="228" class="small" text-anchor="start">c(y,x) = f(y)⁻¹ b(y,x) f(x) · c(z,y)c(y,x) = c(z,x)</text>
<path d="M35 250 L1005 250" stroke="#d2dde1"/>
<text x="35" y="290" class="label" text-anchor="start">2. Lift coherently through Ad</text>
<text x="120" y="357" class="label" text-anchor="start">R</text>
<text x="570" y="357" class="label" text-anchor="start">Int(N)</text>
<text x="570" y="438" class="label" text-anchor="start">U(N)</text>
<path d="M160 348 L535 348" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<text x="350" y="330" class="label" text-anchor="middle">c</text>
<path d="M163 365 L535 424" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<text x="344" y="424" class="label" text-anchor="middle">w</text>
<path d="M603 403 L603 370" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<text x="623" y="392" class="small" text-anchor="start">Ad</text>
<text x="738" y="353" class="small" text-anchor="start">Ad w = c</text>
<text x="738" y="389" class="small" text-anchor="start">w(z,y)w(y,x) = w(z,x)</text>
<text x="35" y="485" class="label" text-anchor="start">u_g(y) = w(y, T_g⁻¹y) · u_gh = u_g β_g(u_h)</text>
<text x="35" y="521" class="small" text-anchor="start">Theorem 4.1 · Takesaki III, Chapter XIII, Corollary 3.35 (countable case)</text>
</svg>
