<svg xmlns="http://www.w3.org/2000/svg" width="980" height="740" viewBox="0 0 980 740" role="img" aria-labelledby="title desc">
<title id="title">Cancellation of the Haar and base-measure densities</title>
<desc id="desc">At a fixed group element s, the reciprocal of the affiliated diagonal density changes the pushforward derivative to the Haar modular factor. Equations 3.4 and 4.4 to 4.5.</desc>
<rect width="980" height="740" fill="#f8faf9"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#2f6b73"/></marker></defs>
<text x="490" y="43" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#183e47">A fixed s: the two densities cancel</text>
<rect x="60" y="90" width="860" height="112" rx="14" fill="white" stroke="#88a9ad" stroke-width="2"/>
<text x="490" y="121" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#375961">Dual modular action</text>
<text x="490" y="168" text-anchor="middle" font-family="Cambria,Georgia,serif" font-size="30" fill="#162b31">σₜ(λₛ) = π((ΔG(s) / jₛ)ⁱᵗ) λₛ</text>
<path d="M490 208 V236" stroke="#2f6b73" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="244" width="860" height="112" rx="14" fill="white" stroke="#88a9ad" stroke-width="2"/>
<text x="490" y="275" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#375961">Diagonal implementation</text>
<text x="490" y="322" text-anchor="middle" font-family="Cambria,Georgia,serif" font-size="30" fill="#162b31">h / (h ∘ s⁻¹) = ΔG(s) / jₛ</text>
<path d="M490 362 V390" stroke="#2f6b73" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="398" width="860" height="112" rx="14" fill="white" stroke="#88a9ad" stroke-width="2"/>
<text x="490" y="429" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#375961">Change of base measure</text>
<text x="490" y="476" text-anchor="middle" font-family="Cambria,Georgia,serif" font-size="30" fill="#162b31">dν = h⁻¹ dμ</text>
<path d="M490 516 V544" stroke="#2f6b73" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="552" width="860" height="112" rx="14" fill="white" stroke="#88a9ad" stroke-width="2"/>
<text x="490" y="583" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#375961">New pushforward density</text>
<text x="490" y="630" text-anchor="middle" font-family="Cambria,Georgia,serif" font-size="30" fill="#162b31">jₛ(ν) = jₛ · h / (h ∘ s⁻¹) = ΔG(s)</text>
<text x="490" y="710" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#375961">s*ν = ΔG(s)ν   ⇔   ν(sE) = ΔG(s)⁻¹ν(E)</text>
</svg>
