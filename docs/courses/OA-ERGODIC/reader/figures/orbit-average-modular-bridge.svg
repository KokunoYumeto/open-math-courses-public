<rect x="255" y="727" width="200" height="12" rx="4" fill="#528998"/>
<text x="178" y="805" class="small">−(n+1)</text><text x="244" y="805" class="small">−n</text><text x="349" y="805" class="small">0</text><text x="445" y="805" class="small">n</text><text x="505" y="805" class="small">n+1</text>
<text x="630" y="765" class="body">Both operators are bounded here.</text>
<text x="630" y="801" class="body">Smooth fₖ → pₙ ⇒ Spₙ = Tpₙ.</text>
