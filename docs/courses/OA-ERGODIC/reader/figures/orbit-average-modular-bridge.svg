<rect x="650" y="115" width="500" height="132" rx="12" class="box"/>
<text x="675" y="153" class="head">Extended average Eν(B) ∈ M̂₊</text>
<text x="675" y="188" class="body">Finite spectral part + infinite projection</text>
<text x="675" y="223" class="small">Left invariance proves full equivariance (2.2).</text>
<path d="M300 248 V288" class="flow"/><path d="M900 248 V288" class="flow"/>
<rect x="50" y="290" width="500" height="115" rx="12" class="box"/>
<text x="75" y="330" class="eq">B ↦ Tⁱᵗ B T⁻ⁱᵗ</text>
<text x="75" y="367" class="body">The two δ(γ)ⁱᵗ phases cancel.</text>
<path d="M552 347 H647" class="flow"/>
<rect x="650" y="290" width="500" height="115" rx="12" class="box"/>
<text x="675" y="330" class="eq">Eν(B) ↦ Tⁱᵗ Eν(B) T⁻ⁱᵗ</text>
<text x="675" y="367" class="body">Equals σᵗφ on M by the spatial formula.</text>
<text x="408" y="434" class="small">Direct covariance: Lemma 2.3</text>
<path d="M900 407 V455 H603 V485" class="flow"/>
<rect x="200" y="487" width="800" height="114" rx="12" class="box"/>
<text x="225" y="526" class="head">Φ = φT ∘ Eν = τS is invariant under Ad Tⁱᵗ</text>
<text x="225" y="564" class="body">Trace-density uniqueness ⇒ S and T strongly commute.</text>
<path d="M600 603 V637" class="flow"/>
<rect x="50" y="640" width="1100" height="230" rx="12" class="box"/>
<text x="75" y="678" class="head">pₙ = 1[−n,n](log T) reduces both densities</text>
<text x="75" y="716" class="body">Smooth ψₙ = 1 on [−n,n]: the coefficient identity bounds S½pₙ (3.2).</text>
