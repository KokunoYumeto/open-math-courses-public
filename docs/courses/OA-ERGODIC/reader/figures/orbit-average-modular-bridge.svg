<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc">
<title id="title">From the full orbit average to the modular bridge</title>
<desc id="desc">A proof dependency diagram. Extended orbit averaging is equivariant and gives an invariant scalar weight. Trace-density uniqueness makes its density S commute with T. Smooth cutoffs bound S on the nested logarithmic spectral corners minus n to n. Equality there and exhaustion identify S with T. This yields scalar composition, modular restriction and covariance, then the specified spectral and centralizer application.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#285968"/></marker><style>text{font-family:Arial,sans-serif;fill:#173b46} .title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.box{fill:#f1f7f7;stroke:#719ba5;stroke-width:2}.flow{stroke:#285968;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.eq{font-size:24px;font-family:Georgia,serif}</style></defs>
