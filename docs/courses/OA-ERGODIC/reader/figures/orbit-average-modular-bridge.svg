<text x="75" y="153" class="head">Positive fields B ∈ P</text>
<text x="75" y="188" class="body">Integrate Uγ Bₛγ Uγ* against νʸ</text>
<text x="75" y="223" class="small">Proper finite covers define increasing forms.</text>
