<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" role="img" aria-labelledby="title desc">
<title id="title">Square integrability and the normal centralizer correspondence</title>
<desc id="desc">Bounded-average cutoffs produce spectral coefficient bounds, bounded truncations and integrated sections total at every retained stable unit. Genuine stable intertwiners and original centralizer operators correspond through the spectral chart J, with source coordinate s plus c and range coordinate s.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="870" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172554">
<text x="35" y="43" font-size="27" font-weight="700">A countable coefficient family on every retained stable unit</text>
<text x="35" y="78" font-size="19">Lemmas 2.1–3.2 • ordinary modular time dτ • logarithmic spectral measure ds</text>
<g fill="#e0f2fe" stroke="#0284c7" stroke-width="2"><rect x="35" y="115" width="315" height="160" rx="12"/><rect x="402" y="115" width="315" height="160" rx="12"/><rect x="770" y="115" width="315" height="160" rx="12"/></g>
<g font-size="20" text-anchor="middle">
<text x="192" y="151" font-weight="700">Exhausting averages</text><text x="192" y="186">0 ≤ yₙ ↑ 1, E(yₙ) bounded</text><text x="192" y="220">Bₙ = √yₙ, qⁿᵏ = J(Bₙξᵏ)</text><text x="192" y="252" font-size="17">totality in each Hilbert integral</text>
<text x="559" y="151" font-weight="700">Spectral coefficients</text><text x="559" y="186">2π ∫ I′(qⁿᵏ, ζ(s)) ds ≤ D‖ζ‖²</text><text x="559" y="220">I′(qⁿᵏ, β) ≤ D‖β‖²/(2π)</text><text x="559" y="252" font-size="17">ηʲ = bounded truncations</text>
<text x="927" y="151" font-weight="700">Integrated repair</text><text x="927" y="186">ψᶠʲ = ∫ f(α)Vα ηʲₛ₍α₎ dκ′</text><text x="927" y="220">coefficient bound ≤ Mₐ² Cⱼ</text><text x="927" y="252" font-size="17">countable, total at every unit</text>
</g>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M350 195H396"/><path d="M717 195H764"/></g>
<text x="35" y="320" font-size="19">Retain S₀ = S \ [Z]κ′. Positive kernel access is null; it need not contain every point of Z.</text>
<text x="35" y="352" font-size="19">Faithfulness and the countable L¹-total tests make the integrated values total even at those points.</text>
