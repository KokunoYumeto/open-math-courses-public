<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1020" viewBox="0 0 500 1020" role="img" aria-labelledby="title desc">
<title id="title">A nonunimodular type II-infinity product action</title><desc id="desc">The positive affine group times the real line acts on the affine group times the two-dimensional torus. An irrational torus slope gives free ergodic null orbits. The reciprocal affine density cancels the Haar modular factor, giving a type II-infinity crossed product.</desc>
<style>text{font-family:Arial,sans-serif;fill:#173449;font-size:18px}.title{font-size:23px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:16px}.card{fill:#f0f6f8;stroke:#abc3cf;stroke-width:1.2}.arrow{stroke:#246879;stroke-width:2.5;fill:none;marker-end:url(#tip)}</style>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#246879"/></marker></defs><rect width="500" height="1020" fill="white"/>
<text x="24" y="35" class="title">A nonunimodular type II∞ factor</text>
<rect x="20" y="57" width="460" height="179" rx="10" class="card"/>
<text x="35" y="88" class="head">Group and action</text><text x="35" y="117">G = Aff⁺(R) × R;   θ irrational</text><text x="35" y="147">(c,d,t) · (a,b,z₁,z₂) =</text><text x="35" y="176">(ca, cb+d, exp(2πit)z₁,</text><text x="151" y="204">exp(2πiθt)z₂)</text>
<rect x="20" y="252" width="460" height="174" rx="10" class="card"/>
<text x="35" y="285" class="head">Point and orbit tests</text><text x="35" y="315">Free: c=1, d=0, t∈Z, θt∈Z ⇒ t=0</text><text x="35" y="345">Ergodic: affine translation + Fourier test</text><text x="35" y="375">Orbit = Aff⁺(R) × one torus-flow orbit</text><text x="35" y="405">Every orbit is Borel and µ-null.</text>
<rect x="20" y="444" width="460" height="208" rx="10" class="card"/>
<text x="35" y="477" class="head">The two modular factors</text><text x="35" y="508">dµ = a⁻² da db dm(T²);   µ invariant</text><text x="35" y="539">Haar modular factor: ΔG(c,d,t) = 1/c</text><text x="35" y="570">h(x) = 1/a;   h(s⁻¹x) = c/a</text><text x="35" y="601">h(x) / h(s⁻¹x) = 1/c</text><text x="35" y="632" class="small">No boundedness of h or h⁻¹ is assumed.</text>
<path d="M250 660 L250 687" class="arrow"/>
<rect x="20" y="700" width="460" height="119" rx="10" class="card"/>
<text x="35" y="732" class="head">Change the base measure</text><text x="35" y="763">dν = h⁻¹ dµ = a⁻¹ da db dm(T²)</text><text x="35" y="795">Pushforward s_*ν = (1/c)ν: cancellation</text>
<path d="M250 827 L250 854" class="arrow"/>
<rect x="20" y="867" width="460" height="112" rx="10" fill="#e8f3ee" stroke="#8fb7a2"/>
<text x="35" y="899" class="head">Type II∞ by the full type criterion</text><text x="35" y="930">Twisted ν, no conull orbit, G nondiscrete</text><text x="35" y="960" class="small">Rational θ: the twist survives, the factor fails.</text>
<text x="24" y="1007" class="small">Example 5.5 · Exercise 6.8 · Theorem 5.1</text>
</svg>
