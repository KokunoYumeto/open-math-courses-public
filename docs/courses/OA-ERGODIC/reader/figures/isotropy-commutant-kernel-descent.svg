<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
  <title id="title">From invariant kernels to the isotropy commutant</title>
  <desc id="desc">A symbolic proof diagram for one fixed unit of a standard Borel groupoid. The full regular commutant theorem and amplification identify invariant Schur kernels. Completed-probability descent produces global Borel arrow functions. Proper truncations and a single countable algebra yield strong approximation. A positive injective sum recovers the identity from averaged products. Weak linear density passes through the regular embedding to the full commutant corner. No jointly measurable field of Haar measures is asserted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#375a6b"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#20343e;font-size:21px} .title{font-size:32px;font-weight:700} .head{font-size:23px;font-weight:700} .small{font-size:18px} .formula{font-family:Georgia,serif;font-size:25px} .box{fill:#f0f6f8;stroke:#91b0bd;stroke-width:2} .warm{fill:#fff7e9;stroke:#c8aa72;stroke-width:2} .final{fill:#eaf5ee;stroke:#78a58a;stroke-width:2} .line{fill:none;stroke:#375a6b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="1220" fill="#fff"/>
  <text x="48" y="48" class="title">From invariant kernels to the isotropy commutant</text>
  <text x="48" y="83">Standard Borel groupoid · faithful proper ν · fix a unit y</text>
  <rect x="48" y="108" width="530" height="148" rx="12" class="box"/>
  <text x="70" y="144" class="head">1. Full regular commutant</text>
  <text x="70" y="181" class="formula">S = J M<tspan baseline-shift="sub" font-size="17">Δ</tspan><tspan baseline-shift="super" font-size="17">1/2</tspan> ,   J L<tspan baseline-shift="sub" font-size="17">h</tspan> J = P<tspan baseline-shift="sub" font-size="17">h</tspan></text>
  <text x="70" y="213" class="formula">L(K)′ = P(K)″</text>
  <text x="70" y="241" class="small">Proposition 1.1; exact MF-01–06 prerequisite</text>
  <rect x="620" y="108" width="532" height="148" rx="12" class="box"/>
  <text x="642" y="144" class="head">2. Multiplicity and Schur kernels</text>
  <text x="642" y="180" class="formula">(L(K) ⊗ 1<tspan baseline-shift="sub" font-size="17">E</tspan>)′ = P(K)″ ⊗̄ B(E)</text>
  <text x="642" y="215">b = v(x⁻¹x′) a(z) c(z′)*</text>
  <text x="642" y="242" class="small">Weak linear density; Theorem 2.1</text>
  <path d="M580 183 H613" class="line"/>
  <path d="M886 258 V292" class="line"/>
  <rect x="48" y="300" width="1104" height="118" rx="12" class="box"/>
  <text x="70" y="336" class="head">3. Fixed-fibre coordinates and the difference map</text>
  <text x="70" y="372" class="formula">Φ : K × F → Y₀ ⊂ G<tspan baseline-shift="super" font-size="17">y</tspan> ,   ν<tspan baseline-shift="super" font-size="17">y</tspan>|<tspan baseline-shift="sub" font-size="17">Y₀</tspan> = Φ<tspan baseline-shift="sub" font-size="17">*</tspan>(m ⊗ κ)</text>
  <text x="70" y="402" class="small">d(γ, γ′) = γ⁻¹γ′; its fibres are exactly simultaneous isotropy orbits. (4.1), Lemma 4.1</text>
  <path d="M600 420 V452" class="line"/>
  <rect x="48" y="460" width="530" height="154" rx="12" class="warm"/>
  <text x="70" y="496" class="head">4. Completed-probability descent</text>
  <text x="70" y="532">ω ∼ ν<tspan baseline-shift="super" font-size="15">y</tspan>,   η = d<tspan baseline-shift="sub" font-size="15">*</tspan>(ω ⊗ ω)</text>
  <text x="70" y="564">Completed section → Borel version f</text>
  <text x="70" y="595" class="small">b = f ∘ d almost everywhere; Lemma 4.1</text>
  <rect x="620" y="460" width="532" height="154" rx="12" class="warm"/>
  <text x="642" y="496" class="head">5. Proper masks give bounded kernels</text>
  <text x="642" y="532" class="formula">f<tspan baseline-shift="sub" font-size="17">n</tspan> = f 1<tspan baseline-shift="sub" font-size="17">Bₙ</tspan> 1<tspan baseline-shift="sub" font-size="17">{|f| ≤ n}</tspan> ,   q(f<tspan baseline-shift="sub" font-size="17">n</tspan>) ≤ n C<tspan baseline-shift="sub" font-size="17">n</tspan></text>
  <text x="642" y="565">|f<tspan baseline-shift="sub" font-size="15">n</tspan> ∘ d| ≤ |b|;   R<tspan baseline-shift="sub" font-size="15">fₙ</tspan><tspan baseline-shift="super" font-size="15">y</tspan> → T<tspan baseline-shift="sub" font-size="15">b</tspan> strongly</text>
  <text x="642" y="595" class="small">Schur dominated convergence; Proposition 4.2</text>
  <path d="M580 541 H613" class="line"/>
  <path d="M886 616 V647" class="line"/>
  <rect x="48" y="656" width="1104" height="148" rx="12" class="box"/>
  <text x="70" y="692" class="head">6. One countable algebra works at every unit</text>
  <text x="70" y="728">D contains 1<tspan baseline-shift="sub" font-size="15">C ∩ Bₙ</tspan> and is closed under rational sums, convolution, inversion and conjugation.</text>
  <text x="70" y="761" class="formula">W<tspan baseline-shift="sub" font-size="17">y</tspan> = {R<tspan baseline-shift="sub" font-size="17">d</tspan><tspan baseline-shift="super" font-size="17">y</tspan> : d ∈ D}″ = L<tspan baseline-shift="super" font-size="17">ν</tspan>(G<tspan baseline-shift="sub" font-size="17">y</tspan><tspan baseline-shift="super" font-size="17">y</tspan>)′</text>
  <text x="70" y="790" class="small">Sequences may depend on y; D is fixed globally. Lemma 3.1 and Proposition 4.2</text>
  <path d="M600 806 V838" class="line"/>
  <rect x="48" y="846" width="1104" height="144" rx="12" class="final"/>
  <text x="70" y="882" class="head">7. Averaged products recover the entire commutant</text>
  <text x="70" y="918" class="formula">θ<tspan baseline-shift="sub" font-size="17">ν</tspan>(f, g) = T<tspan baseline-shift="sub" font-size="17">f</tspan>* T<tspan baseline-shift="sub" font-size="17">g</tspan> ;   ker t = 0 ;   e<tspan baseline-shift="sub" font-size="17">n</tspan> = t(t + 1/n)⁻¹ → 1 strongly</text>
  <text x="70" y="950">The positive sum t lies in the closed ideal of pair products.</text>
  <text x="70" y="977" class="small">Their weak linear span is W<tspan baseline-shift="sub" font-size="13">y</tspan>. Equation (5.5), Theorem 5.1</text>
  <path d="M600 992 V1024" class="line"/>
  <rect x="48" y="1032" width="1104" height="124" rx="12" class="final"/>
  <text x="70" y="1068" class="head">8. Regular embedding and the exact corner</text>
  <text x="70" y="1104" class="formula">V : H → ℓ² ⊗ H⁰ ,   p = VV* ;   U(G<tspan baseline-shift="sub" font-size="17">y</tspan><tspan baseline-shift="super" font-size="17">y</tspan>)′ ≅ p N<tspan baseline-shift="sub" font-size="17">y</tspan> p</text>
  <text x="70" y="1140" class="small">D<tspan baseline-shift="sub" font-size="13">U</tspan> = V*(eᵢ ⊗ D); weak linear density survives compression. Equation (6.2), Theorem 6.1</text>
  <text x="48" y="1190" class="small">Symbolic proof diagram. Haar coordinates are chosen only at fixed y; no joint Haar field is needed.</text>
</svg>
