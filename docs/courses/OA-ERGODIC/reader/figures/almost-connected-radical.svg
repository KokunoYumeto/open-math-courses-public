<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1580" width="1440" height="1580" role="img" aria-labelledby="title desc"><title id="title">Amenability of an almost-connected group is equivalent to compactness of its radical quotient</title><desc id="desc">Proof schematic. A compact radical quotient gives amenability by extension. A noncompact semisimple radical quotient has a noncompact connected component, a connected semisimple Lie quotient, and a closed subgroup locally isomorphic to SL2R. Explicit projective integer matrices give a discrete free subgroup, which lifts through all quotients. The product R times infinitely many SO3 factors is an amenable non-Lie example.</desc><rect x="0" y="0" width="1440" height="1580" fill="#f6f8fa" /><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" fill="#243746" font-weight="bold"><tspan x="42" dy="0">The radical separates the amenable part from the obstruction</tspan></text><text x="42" y="90" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="42" dy="0">G locally compact Hausdorff; G/G° compact; R = rad G closed, connected, solvable</tspan></text><rect x="32" y="118" width="1376" height="212" rx="14" fill="#eef4e7" stroke="#cad5df" stroke-width="2" /><text x="57" y="160" font-family="Arial, sans-serif" font-size="27" fill="#243746" font-weight="bold"><tspan x="57" dy="0">Compact quotient ⇒ amenability (Theorem 4.2)</tspan></text><rect x="58" y="185" width="420" height="112" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="78" y="221" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="78" dy="0">R solvable ⇒ R amenable.</tspan><tspan x="78" dy="33">G/R compact ⇒ Haar mean.</tspan></text><line x1="491" y1="240" x2="658" y2="240" stroke="#286b8b" stroke-width="3" /><polygon points="658,240 645.0,234.0 645.0,246.0" fill="#286b8b" /><text x="510" y="211" font-family="Arial, sans-serif" font-size="20" fill="#243746" font-weight="normal"><tspan x="510" dy="0">extension</tspan></text><rect x="676" y="185" width="698" height="112" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="698" y="222" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="698" dy="0">G amenable; closed subgroups amenable.</tspan><tspan x="698" dy="33">No closed discrete topological copy of F₂.</tspan></text><rect x="32" y="352" width="1376" height="567" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="58" y="396" font-family="Arial, sans-serif" font-size="27" fill="#243746" font-weight="bold"><tspan x="58" dy="0">Noncompact quotient ⇒ a closed discrete F₂ (Proposition 4.1)</tspan></text><rect x="60" y="421" width="606" height="106" rx="14" fill="#e9f2f6" stroke="#cad5df" stroke-width="2" /><text x="82" y="459" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="82" dy="0">S = G/R semisimple and almost connected.</tspan><tspan x="82" dy="33">S° noncompact (compact-extension test).</tspan></text><line x1="678" y1="474" x2="744" y2="474" stroke="#286b8b" stroke-width="3" /><polygon points="744,474 731.0,468.0 731.0,480.0" fill="#286b8b" /><rect x="761" y="421" width="613" height="106" rx="14" fill="#e9f2f6" stroke="#cad5df" stroke-width="2" /><text x="783" y="459" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="783" dy="0">L = S°/K, K compact normal.</tspan><tspan x="783" dy="33">L connected, semisimple, noncompact Lie.</tspan></text><text x="65" y="568" font-family="Arial, sans-serif" font-size="22" fill="#243746" font-weight="normal"><tspan x="65" dy="0">G → S is a quotient. S° ↪ S is closed. S° → L is a quotient (S2, S3; Lemma 2.1).</tspan></text><rect x="60" y="600" width="606" height="112" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="82" y="638" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="82" dy="0">H ↪ L closed, connected, locally SL₂(ℝ).</tspan><tspan x="82" dy="33">Structural input S4 (Rickert 5.11).</tspan></text><line x1="1057" y1="527" x2="1057" y2="580" stroke="#286b8b" stroke-width="3" /><line x1="1057" y1="580" x2="363" y2="580" stroke="#286b8b" stroke-width="3" /><line x1="363" y1="580" x2="363" y2="600" stroke="#286b8b" stroke-width="3" /><polygon points="363,600 369.0,587.0 357.0,587.0" fill="#286b8b" /><text x="1074" y="590" font-family="Arial, sans-serif" font-size="19" fill="#243746" font-weight="normal"><tspan x="1074" dy="0">S4</tspan></text><rect x="761" y="600" width="613" height="112" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="783" y="638" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="783" dy="0">H → H/Z(H) ≅ PSL₂(ℝ).</tspan><tspan x="783" dy="33">Projective A,B generate discrete F₂.</tspan></text><line x1="679" y1="655" x2="744" y2="655" stroke="#286b8b" stroke-width="3" /><polygon points="744,655 731.0,649.0 731.0,661.0" fill="#286b8b" /><text x="680" y="628" font-family="Arial, sans-serif" font-size="17" fill="#243746" font-weight="normal"><tspan x="680" dy="0">quotient</tspan></text><text x="65" y="756" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="bold"><tspan x="65" dy="0">LIFTING CHAIN: F₂ ⊂ PSL₂(ℝ) lifts to H, then lies in L, lifts to S°, then to G.</tspan></text><text x="65" y="802" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="65" dy="0">Each lift uses arbitrary generator lifts and has discrete subgroup topology.</tspan><tspan x="65" dy="33">Every discrete subgroup is closed (Lemmas 2.2, 2.3; Corollary 3.2).</tspan></text><text x="65" y="877" font-family="Arial, sans-serif" font-size="25" fill="#243746" font-weight="bold"><tspan x="65" dy="0">A closed discrete F₂ forbids amenability of G by the closed-subgroup theorem.</tspan></text><rect x="32" y="942" width="1376" height="301" rx="14" fill="#ffffff" stroke="#cad5df" stroke-width="2" /><text x="58" y="986" font-family="Arial, sans-serif" font-size="27" fill="#243746" font-weight="bold"><tspan x="58" dy="0">Exact projective calculation (Proposition 3.1)</tspan></text><text x="63" y="1028" font-family="Arial, sans-serif" font-size="24" fill="#243746" font-weight="normal"><tspan x="63" dy="0">A = [1  3; 0  1],  B = [1  0; 3  1]; determinant 1, integer entries.</tspan><tspan x="63" dy="35">X = {|x| &gt; 1} ∪ {∞}; Y = {|x| &lt; 1}; test point 1 ∉ X ∪ Y.</tspan></text><rect x="60" y="1090" width="606" height="106" rx="14" fill="#eef4e7" stroke="#cad5df" stroke-width="2" /><text x="82" y="1127" font-family="Arial, sans-serif" font-size="23" fill="#243746" font-weight="normal"><tspan x="82" dy="0">Aⁿx = x + 3n; AⁿY ⊂ X.</tspan><tspan x="82" dy="33">For x ∈ Y: |x + 3n| &gt; 2, n ≠ 0.</tspan></text><rect x="761" y="1090" width="613" height="106" rx="14" fill="#e9f2f6" stroke="#cad5df" stroke-width="2" /><text x="783" y="1127" font-family="Arial, sans-serif" font-size="22" fill="#243746" font-weight="normal"><tspan x="783" dy="0">Bⁿx = x/(3nx + 1); BⁿX ⊂ Y.</tspan><tspan x="783" dy="32">|Bⁿx| ≤ |x|/(3|x| − 1) &lt; 1; ∞ ↦ 1/(3n).</tspan></text><line x1="679" y1="1144" x2="744" y2="1144" stroke="#286b8b" stroke-width="3" /><polygon points="744,1144 731.0,1138.0 731.0,1150.0" fill="#286b8b" /><text x="65" y="1221" font-family="Arial, sans-serif" font-size="22" fill="#243746" font-weight="normal"><tspan x="65" dy="0">A reduced alternating block word moves 1 into X or Y. Integer entries ensure discreteness.</tspan></text><rect x="32" y="1265" width="1376" height="261" rx="14" fill="#eef4e7" stroke="#cad5df" stroke-width="2" /><text x="58" y="1309" font-family="Arial, sans-serif" font-size="27" fill="#243746" font-weight="bold"><tspan x="58" dy="0">Full locally compact scope: an amenable group that is not Lie</tspan></text><text x="63" y="1352" font-family="Arial, sans-serif" font-size="24" fill="#243746" font-weight="normal"><tspan x="63" dy="0">G = ℝ × ∏j≥1 SO(3); connected and locally compact.</tspan><tspan x="63" dy="35">rad G = ℝ × {e}; G/rad G = ∏j≥1 SO(3) compact ⇒ G amenable.</tspan><tspan x="63" dy="35">Every identity neighborhood contains an untouched SO(3) coordinate subgroup.</tspan><tspan x="63" dy="35">Lie groups have a neighborhood containing no nontrivial subgroup ⇒ G is not Lie.</tspan></text><text x="63" y="1500" font-family="Arial, sans-serif" font-size="21" fill="#536979" font-weight="normal"><tspan x="63" dy="0">Exact radical and topology proofs: Example 5.2; complete Exercise 6.6 solution.</tspan></text><text x="42" y="1560" font-family="Arial, sans-serif" font-size="20" fill="#536979" font-weight="normal"><tspan x="42" dy="0">Proof schematic, not a geometric model of all groups. Takesaki III XIII.4.4 p64; Rickert 3.4, 5.9–5.14.</tspan></text></svg>
