<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1100" viewBox="0 0 500 1100" role="img" aria-labelledby="title desc">
<title id="title">Compact stabilizer selection by nested dyadic cells</title><desc id="desc">The real translation actions on circles of periods one and square root of two have stabilizer intersections with C=[1,2] equal to {1,2} and {square root of two}. Four exact dyadic cells are shown on the same time scale. Filled dots are genuine fixing times. Hollow orange dots are chosen rational left endpoints on the second component, which are not fixing times. The nested compact intersections force their limit to be square root of two.</desc>
<rect width="500" height="1100" fill="white"/>
<text x="250" y="34" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#183949" font-weight="bold">Choosing a fixing time</text>
<text x="250" y="63" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">Two translation circles · C = [1,2]</text>
<rect x="20" y="82" width="460" height="390" rx="12" fill="#edf6fa" stroke="#176d8d"/>
<text x="250" y="115" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#183949" font-weight="bold">Circle ℝ/ℤ</text>
<text x="250" y="148" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">True fibre F<tspan baseline-shift="sub" font-size="14">ω</tspan> = {1,2}</text>
<path d="M85 190H445" stroke="#516772" stroke-width="1.4"/>
<text x="85.0" y="174" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">1</text>
<text x="445.0" y="174" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">2</text>
<circle cx="85.000000" cy="190" r="5" fill="#176d8d" stroke="#176d8d" stroke-width="2"/>
<circle cx="445.000000" cy="190" r="5" fill="#176d8d" stroke="#176d8d" stroke-width="2"/>
<path d="M85.000000 200V406" stroke="#176d8d" stroke-dasharray="4 4" stroke-width="1.2"/>
<path d="M85.000000 245H265.000000" stroke="#176d8d" stroke-width="7" stroke-linecap="round"/>
<circle cx="85.000000" cy="245" r="5" fill="#176d8d" stroke="#176d8d" stroke-width="2"/>
<text x="46" y="250" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=1</text>
<text x="275" y="270" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#176d8d">[1, 3/2]</text>
<path d="M85.000000 296H175.000000" stroke="#176d8d" stroke-width="7" stroke-linecap="round"/>
<circle cx="85.000000" cy="296" r="5" fill="#176d8d" stroke="#176d8d" stroke-width="2"/>
<text x="46" y="301" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=2</text>
<text x="275" y="321" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#176d8d">[1, 5/4]</text>
<path d="M85.000000 347H130.000000" stroke="#176d8d" stroke-width="7" stroke-linecap="round"/>
<circle cx="85.000000" cy="347" r="5" fill="#176d8d" stroke="#176d8d" stroke-width="2"/>
<text x="46" y="352" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=3</text>
<text x="275" y="372" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#176d8d">[1, 9/8]</text>
<path d="M85.000000 398H107.500000" stroke="#176d8d" stroke-width="7" stroke-linecap="round"/>
<circle cx="85.000000" cy="398" r="5" fill="#176d8d" stroke="#176d8d" stroke-width="2"/>
<text x="46" y="403" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=4</text>
<text x="275" y="423" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#176d8d">[1, 17/16]</text>
<text x="250" y="452" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">Every chosen endpoint is the fixing time 1.</text>
<rect x="20" y="512" width="460" height="450" rx="12" fill="#fff5ec" stroke="#af5b23"/>
<text x="250" y="545" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#183949" font-weight="bold">Circle ℝ/(√2 ℤ)</text>
<text x="250" y="578" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">True fibre F<tspan baseline-shift="sub" font-size="14">ω</tspan> = {√2}</text>
<path d="M85 620H445" stroke="#516772" stroke-width="1.4"/>
<text x="85.0" y="604" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">1</text>
<text x="445.0" y="604" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">2</text>
<text x="234.1168824543142" y="604" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">√2</text>
<circle cx="234.116882" cy="620" r="5" fill="#176d8d" stroke="#176d8d" stroke-width="2"/>
<path d="M234.116882 630V853" stroke="#176d8d" stroke-dasharray="4 4" stroke-width="1.2"/>
<path d="M85.000000 680H265.000000" stroke="#af5b23" stroke-width="7" stroke-linecap="round"/>
<circle cx="85.000000" cy="680" r="5" fill="white" stroke="#af5b23" stroke-width="2"/>
<text x="46" y="685" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=1</text>
<text x="275" y="705" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#af5b23">[1, 3/2]</text>
<path d="M175.000000 735H265.000000" stroke="#af5b23" stroke-width="7" stroke-linecap="round"/>
<circle cx="175.000000" cy="735" r="5" fill="white" stroke="#af5b23" stroke-width="2"/>
<text x="46" y="740" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=2</text>
<text x="275" y="760" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#af5b23">[5/4, 3/2]</text>
<path d="M220.000000 790H265.000000" stroke="#af5b23" stroke-width="7" stroke-linecap="round"/>
<circle cx="220.000000" cy="790" r="5" fill="white" stroke="#af5b23" stroke-width="2"/>
<text x="46" y="795" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=3</text>
<text x="275" y="815" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#af5b23">[11/8, 3/2]</text>
<path d="M220.000000 845H242.500000" stroke="#af5b23" stroke-width="7" stroke-linecap="round"/>
<circle cx="220.000000" cy="845" r="5" fill="white" stroke="#af5b23" stroke-width="2"/>
<text x="46" y="850" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">n=4</text>
<text x="275" y="870" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#af5b23">[11/8, 23/16]</text>
<text x="250" y="910" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">The rational endpoints are not fixing times.</text>
<text x="250" y="943" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">Their distance to √2 is less than 2⁻ⁿ.</text>
<text x="250" y="1004" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#176d8d">Filled point: a true compact-fibre element</text>
<text x="250" y="1034" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#af5b23">Hollow point: a chosen finite approximation</text>
<text x="250" y="1071" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#183949">Proposition 3.2a · Exercise 6.12</text>
</svg>
