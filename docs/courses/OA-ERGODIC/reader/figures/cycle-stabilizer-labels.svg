<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">The five-cycle forgets or retains stabilizer labels</title>
<desc id="desc">Integer labels n equal5k plus j have residue j from0 to4 and stabilizer label k. Moving by one increments j, and the wrap from4 to0 increments k. The relation representation discards k and gives M5. The regular crossed product retains the bilateral shift S in k, has U to power5 equal1 tensor S, and gives M5 tensor L infinity of the circle.</desc>
<rect width="1040" height="570" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:25px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}.cell{font-size:23px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176a80"/></marker></defs>
<text x="32" y="42" class="title" text-anchor="start">A five-cycle: orbit points and stabilizer labels</text>
<text x="32" y="79" class="label" text-anchor="start">n = 5k + j · residue j ∈ {0,1,2,3,4} · stabilizer subgroup 5ℤ</text>
<text x="140" y="132" class="small" text-anchor="middle">j = 0</text>
<text x="228" y="132" class="small" text-anchor="middle">j = 1</text>
<text x="316" y="132" class="small" text-anchor="middle">j = 2</text>
<text x="404" y="132" class="small" text-anchor="middle">j = 3</text>
<text x="492" y="132" class="small" text-anchor="middle">j = 4</text>
<text x="27" y="186" class="small" text-anchor="start">k = -1</text>
<rect x="109" y="152" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="140" y="186" class="cell" text-anchor="middle">-5</text>
<path d="M173 178 L193 178" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="197" y="152" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="228" y="186" class="cell" text-anchor="middle">-4</text>
<path d="M261 178 L281 178" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="285" y="152" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="316" y="186" class="cell" text-anchor="middle">-3</text>
<path d="M349 178 L369 178" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="373" y="152" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="404" y="186" class="cell" text-anchor="middle">-2</text>
<path d="M437 178 L457 178" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="461" y="152" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="492" y="186" class="cell" text-anchor="middle">-1</text>
<path d="M525 178 C565 178 565 227 523 227 L98 227 C76 227 76 275 107 275" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="27" y="283" class="small" text-anchor="start">k = 0</text>
<rect x="109" y="249" width="62" height="51" rx="6" fill="#e6f1f4" stroke="#9bb2bb"/>
<text x="140" y="283" class="cell" text-anchor="middle">0</text>
<path d="M173 275 L193 275" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="197" y="249" width="62" height="51" rx="6" fill="#e6f1f4" stroke="#9bb2bb"/>
<text x="228" y="283" class="cell" text-anchor="middle">1</text>
<path d="M261 275 L281 275" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="285" y="249" width="62" height="51" rx="6" fill="#e6f1f4" stroke="#9bb2bb"/>
<text x="316" y="283" class="cell" text-anchor="middle">2</text>
<path d="M349 275 L369 275" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="373" y="249" width="62" height="51" rx="6" fill="#e6f1f4" stroke="#9bb2bb"/>
<text x="404" y="283" class="cell" text-anchor="middle">3</text>
<path d="M437 275 L457 275" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="461" y="249" width="62" height="51" rx="6" fill="#e6f1f4" stroke="#9bb2bb"/>
<text x="492" y="283" class="cell" text-anchor="middle">4</text>
