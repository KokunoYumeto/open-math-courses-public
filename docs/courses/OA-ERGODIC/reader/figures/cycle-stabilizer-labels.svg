<text x="27" y="380" class="small" text-anchor="start">k = 1</text>
<rect x="109" y="346" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="140" y="380" class="cell" text-anchor="middle">5</text>
<path d="M173 372 L193 372" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="197" y="346" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="228" y="380" class="cell" text-anchor="middle">6</text>
<path d="M261 372 L281 372" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="285" y="346" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="316" y="380" class="cell" text-anchor="middle">7</text>
<path d="M349 372 L369 372" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="373" y="346" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="404" y="380" class="cell" text-anchor="middle">8</text>
<path d="M437 372 L457 372" stroke="#176a80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="461" y="346" width="62" height="51" rx="6" fill="#f4f6f7" stroke="#9bb2bb"/>
<text x="492" y="380" class="cell" text-anchor="middle">9</text>
<text x="113" y="453" class="small" text-anchor="start">U: j → j+1; at j=4, (k,4) → (k+1,0)</text>
<path d="M620 115 L620 473" stroke="#d4dfe3" stroke-width="2"/>
<text x="665" y="153" class="label" text-anchor="start">Forget k: relation algebra</text>
<text x="665" y="192" class="label" text-anchor="start">Five orbit points → M₅</text>
<text x="665" y="229" class="small" text-anchor="start">The cyclic permutation has U⁵ = 1</text>
<text x="665" y="297" class="label" text-anchor="start">Retain k: regular crossed product</text>
<text x="665" y="337" class="label" text-anchor="start">Sδₖ = δₖ₊₁; U⁵ = 1 ⊗ S</text>
<text x="665" y="375" class="small" text-anchor="start">Fourier: δₖ → zᵏ, S → M_z</text>
<text x="665" y="417" class="label" text-anchor="start">M₅ ⊗ L∞(𝕋): diffuse centre</text>
<text x="32" y="506" class="small" text-anchor="start">The residue records orbit position; k records repeated group labels at that position</text>
<text x="32" y="547" class="small" text-anchor="start">Proposition 5.2 · Example 5.6 · Takesaki III, XIII.1.7(ii) and XIII.2.10(iii)</text>
</svg>
