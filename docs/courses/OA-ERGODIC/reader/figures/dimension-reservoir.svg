<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">A dimension reservoir forces countable additivity</title>
<desc id="desc">Assume decreasing sets E n with null intersection have dimensions r n decreasing to a greater than c greater than zero. The next source chunk has dimension r n minus r n plus one. The available target has dimension r n minus c, larger by r n plus one minus c, at least a minus c greater than zero. Disjoint embeddings of all source chunks into E one minus C compress E one and omit the positive set C, contradicting finiteness. Rectangle widths are schematic, not probability masses.</desc>
<rect width="1040" height="620" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:26px;font-weight:bold}.label{font-size:22px}.small{font-size:18px}.formula{font-size:25px}.note{font-size:17px}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176a80"/></marker></defs>
<text x="35" y="43" class="title" text-anchor="start">Finite orbit matching ⇒ countably additive dimension</text>
<text x="35" y="81" class="label" text-anchor="start">Contradictory hypothesis: Eₙ ↓ ∅ mod null sets; rₙ = d(Eₙ) ↓ a &gt; c &gt; 0</text>
<text x="35" y="135" class="label" text-anchor="start">At step n: next source chunk</text>
<text x="560" y="135" class="label" text-anchor="start">At step n: available target</text>
<rect x="35" y="160" width="405" height="100" rx="6" fill="#e3f1f4" stroke="#80949d" stroke-width="1.5"/>
<rect x="560" y="160" width="445" height="100" rx="6" fill="#e3f1f4" stroke="#80949d" stroke-width="1.5"/>
<text x="237" y="201" class="formula" text-anchor="middle">Eₙ ∖ Eₙ₊₁</text>
<text x="237" y="238" class="label" text-anchor="middle">dimension rₙ − rₙ₊₁</text>
<text x="782" y="201" class="formula" text-anchor="middle">Unused part of E₁ ∖ C</text>
<text x="782" y="238" class="label" text-anchor="middle">dimension rₙ − c</text>
<path d="M452 207 L542 207" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="520" y="302" class="formula" text-anchor="middle">Target − source = rₙ₊₁ − c ≥ a − c &gt; 0</text>
<text x="520" y="334" class="small" text-anchor="middle">Strict dimension comparison supplies each orbit embedding.</text>
<text x="35" y="389" class="label" text-anchor="start">After all steps: the source chunks cover E₁ modulo null sets</text>
<rect x="35" y="408" width="140" height="60" rx="6" fill="#e3f1f4" stroke="#80949d" stroke-width="1.5"/>
<text x="105.0" y="447" class="label" text-anchor="middle">E₁ ∖ E₂</text>
<rect x="183" y="408" width="140" height="60" rx="6" fill="#e3f1f4" stroke="#80949d" stroke-width="1.5"/>
<text x="253.0" y="447" class="label" text-anchor="middle">E₂ ∖ E₃</text>
<rect x="331" y="408" width="140" height="60" rx="6" fill="#e3f1f4" stroke="#80949d" stroke-width="1.5"/>
<text x="401.0" y="447" class="label" text-anchor="middle">E₃ ∖ E₄</text>
<rect x="479" y="408" width="72" height="60" rx="6" fill="#e3f1f4" stroke="#80949d" stroke-width="1.5"/>
<text x="515.0" y="447" class="label" text-anchor="middle">…</text>
<path d="M565 438 L634 438" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="648" y="408" width="237" height="60" rx="6" fill="#e3f1f4" stroke="#80949d" stroke-width="1.5"/>
<text x="766" y="446" class="small" text-anchor="middle">Range of the union</text>
<rect x="897" y="408" width="108" height="60" rx="6" fill="#f8dfcc" stroke="#80949d" stroke-width="1.5"/>
<text x="951" y="446" class="small" text-anchor="middle">C: d = c</text>
<text x="35" y="510" class="label" text-anchor="start">E₁ embeds into itself with positive C omitted.</text>
<text x="35" y="545" class="label" text-anchor="start">This contradicts finite orbit matching; therefore d(Eₙ) → 0.</text>
<text x="35" y="589" class="note" text-anchor="start">Theorem 2.3 · equations (2.4)–(2.5) · dimensions shown schematically, not μ-masses</text>
</svg>
