<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
  <title id="title">Repairing an almost homomorphism on a measured groupoid</title>
  <desc id="desc">A proof pipeline constructs a canonical wide subgroupoid H from point-mass defect distributions, a full good reduction on X0, and a saturated conull set Y by positive kernel access. A commuting arrow diagram shows transports from arbitrary units x,y in Y to good units zx,zy in Z, compressing an arrow gamma to ay gamma ax inverse. Schematic positions do not encode measures or distances.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#205c70"/></marker></defs>
  <rect width="1120" height="820" fill="#f6f7f4"/>
  <g font-family="Arial, sans-serif" fill="#24363e">
    <text x="48" y="49" font-size="28" font-weight="700">From almost every pair to every pair on a saturated reduction</text>
    <text x="48" y="80" font-size="18">Theorem 1.1 • faithful proper kernel • inversion-equivalent arrow measure</text>
    <g fill="#fff" stroke="#cad8dc" stroke-width="2">
      <rect x="48" y="113" width="308" height="159" rx="12"/>
      <rect x="405" y="113" width="308" height="159" rx="12"/>
      <rect x="762" y="113" width="310" height="159" rx="12"/>
    </g>
    <g stroke="#205c70" stroke-width="3" marker-end="url(#arrow)"><path d="M 365 191 H 392"/><path d="M 722 191 H 749"/></g>
    <text x="68" y="145" font-size="22" font-weight="700">1. Canonical subgroupoid</text>
    <text x="68" y="178" font-size="18">Dγ(η) = π(γη) π(η)⁻¹</text>
    <text x="68" y="207" font-size="18">H: its fibre law is a point mass</text>
    <text x="68" y="237" font-size="17">c is strict on H • Proposition 3.1</text>
    <text x="425" y="145" font-size="22" font-weight="700">2. Full good reduction</text>
    <text x="425" y="178" font-size="18">X₀: κˣ(G ∖ H) = 0</text>
    <text x="425" y="207" font-size="18">All arrows between X₀ lie in H</text>
    <text x="425" y="237" font-size="17">X₀ conull • Lemma 3.2</text>
    <text x="782" y="145" font-size="22" font-weight="700">3. Positive kernel access</text>
    <text x="782" y="178" font-size="18">Y: κʸ(s⁻¹X₀) &gt; 0</text>
    <text x="782" y="207" font-size="18">Y saturated and conull</text>
    <text x="782" y="237" font-size="17">Z = X₀ ∩ Y • equation (4.1)</text>
    <rect x="48" y="301" width="1024" height="437" rx="16" fill="#fff" stroke="#cad8dc" stroke-width="2"/>
    <text x="74" y="336" font-size="21" font-weight="700">Borel transports into the good reduction Z • Lemma 2.2</text>
    <g stroke="#205c70" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M 193 402 H 926"/>
      <path d="M 175 425 V 589"/>
      <path d="M 945 425 V 589"/>
      <path d="M 193 612 H 926"/>
    </g>
    <g stroke="#205c70" stroke-width="3">
      <circle cx="175" cy="402" r="15" fill="#e6edf0"/><circle cx="945" cy="402" r="15" fill="#e6edf0"/>
      <circle cx="175" cy="612" r="15" fill="#bfe0cd"/><circle cx="945" cy="612" r="15" fill="#bfe0cd"/>
    </g>
    <text x="155" y="382" font-size="23">x ∈ Y</text><text x="920" y="382" font-size="23">y ∈ Y</text>
    <text x="523" y="390" font-size="23">γ: x → y</text>
    <text x="74" y="509" font-size="22">aₓ</text><text x="974" y="509" font-size="22">aᵧ</text>
    <text x="206" y="492" font-size="18">aₓ: x → zₓ</text><text x="745" y="492" font-size="18">aᵧ: y → zᵧ</text>
    <text x="144" y="649" font-size="23">zₓ ∈ Z</text><text x="913" y="649" font-size="23">zᵧ ∈ Z</text>
    <text x="399" y="595" font-size="23">θ(γ) = aᵧ γ aₓ⁻¹ ∈ H</text>
    <text x="346" y="654" font-size="22" font-weight="700">π′(γ) = c(θ(γ)) • equation (4.2)</text>
    <text x="74" y="701" font-size="18">For a composable pair: the adjacent aₓ⁻¹aₓ cancel, so θ(γη) = θ(γ)θ(η).</text>
    <text x="48" y="773" font-size="18">On Z choose a_z = e_z. Almost every arrow has both endpoints in Z, so π′ = c = π almost everywhere.</text>
    <text x="48" y="803" font-size="16">Schematic only. Proof locators: Proposition 3.1, Lemma 3.2, equations (4.1)–(4.3). Classical theorem: Ramsay (1971).</text>
  </g>
</svg>
