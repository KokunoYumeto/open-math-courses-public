<text x="184" y="443" class="matrix" text-anchor="middle">d</text>
<text x="318" y="443" class="matrix" text-anchor="middle">d + e</text>
<text x="459" y="443" class="matrix" text-anchor="middle">47/15</text>
<text x="584" y="149" class="head">h₁(y,x) = b(y) − b(x)</text>
<text x="584" y="182" class="small">Rows: range y. Columns: source x.</text>
