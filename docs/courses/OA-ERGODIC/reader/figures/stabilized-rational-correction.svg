<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">A finite correction with exactly fixed rational errors</title>
<desc id="desc">Four units, two old pairs, then one new class. Cochain f becomes g by the same addition e on units two and three. The full discrepancy matrix is rational and retains all eight old arrows exactly.</desc>
<rect width="1120" height="690" fill="#f6f8f8"/>
<style>text{font-family:Arial,sans-serif;fill:#203741} .title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.label{font-size:20px}.small{font-size:18px}.matrix{font-size:24px}.note{font-size:19px}</style>
<text x="36" y="47" class="title">Preserve the old errors while moving the cochain</text>
<text x="36" y="81" class="small">G = (R,+),   H = Q,   closure(H) = R;   arrow (y,x) goes from x to y.</text>
<rect x="28" y="113" width="516" height="384" rx="13" fill="white" stroke="#b8c8cf"/>
