<text x="1017" y="446" class="matrix" text-anchor="middle">0</text>
<text x="38" y="537" class="note">d = √2 − 7/5,   e = √3 − 26/15,   q(y,x) = aᵧ − aₓ,</text>
<text x="38" y="569" class="note">a = (0, √2, √3, √3 + √2).   On the old pairs: q = h₀ + f(y) − f(x).</text>
<text x="38" y="601" class="note">On all sixteen new arrows: q = h₁ + g(y) − g(x);   h₁|F₀ = h₀ exactly.</text>
<text x="38" y="634" class="note">0 &lt; d &lt; 1/50;   −1/750 &lt; e &lt; 0;   |g(x) − f(x)| &lt; 1/500.</text>
<text x="38" y="666" class="small">Example 5.2 · Lemma 5.1 · Takesaki III, XIII.3.27–3.28 (PDF 68–71)</text>
