<text x="62" y="319" class="matrix" text-anchor="middle">1</text>
<text x="184" y="319" class="matrix" text-anchor="middle">d</text>
<text x="318" y="319" class="matrix" text-anchor="middle">d</text>
<text x="459" y="319" class="matrix" text-anchor="middle">7/5</text>
<rect x="43" y="350" width="485" height="49" rx="5" fill="#f1eddf"/>
<text x="62" y="381" class="matrix" text-anchor="middle">2</text>
<text x="184" y="381" class="matrix" text-anchor="middle">0</text>
<text x="318" y="381" class="matrix" text-anchor="middle">e</text>
<text x="459" y="381" class="matrix" text-anchor="middle">26/15</text>
<rect x="43" y="412" width="485" height="49" rx="5" fill="#f1eddf"/>
