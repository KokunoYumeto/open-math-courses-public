<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="465" viewBox="0 0 1040 465" role="img" aria-labelledby="title desc">
<title id="title">Natural positivity and pointwise positivity are different</title>
<desc id="desc">For two equally weighted points a,b, the coboundary from b(a)=1 and b(b)=i multiplies kernel entries by the matrix one, minus i, i, one. The all-ones matrix goes to the positive semidefinite matrix one, minus i, i, one. Both have eigenvalues zero and two and lie in the natural cone. Only the all-ones matrix has pointwise nonnegative entries.</desc>
<rect width="1040" height="465" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:26px;font-weight:bold}.label{font-size:21px}.entry{font-size:30px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176a80"/></marker></defs>
<text x="35" y="42" class="title" text-anchor="start">A phase preserves the natural cone, but fails pointwise positivity</text>
<text x="35" y="82" class="label" text-anchor="start">X = {a, b}; μ(a) = μ(b) = 1/2; b(a) = 1, b(b) = i</text>
<text x="172" y="130" class="small" text-anchor="middle">x = a</text>
<text x="302" y="130" class="small" text-anchor="middle">x = b</text>
<text x="86" y="192" class="label" text-anchor="middle">a</text>
<rect x="110" y="148" width="122" height="68" rx="5" fill="#e3f1f4" stroke="#80949d"/>
<text x="171" y="194" class="entry" text-anchor="middle">1</text>
<rect x="240" y="148" width="122" height="68" rx="5" fill="#e3f1f4" stroke="#80949d"/>
<text x="301" y="194" class="entry" text-anchor="middle">1</text>
<text x="86" y="267" class="label" text-anchor="middle">b</text>
<rect x="110" y="223" width="122" height="68" rx="5" fill="#e3f1f4" stroke="#80949d"/>
<text x="171" y="269" class="entry" text-anchor="middle">1</text>
<rect x="240" y="223" width="122" height="68" rx="5" fill="#e3f1f4" stroke="#80949d"/>
<text x="301" y="269" class="entry" text-anchor="middle">1</text>
<text x="236" y="326" class="label" text-anchor="middle">P: yes · eigenvalues 0, 2</text>
<text x="236" y="361" class="label" text-anchor="middle">C: yes</text>
<text x="752" y="130" class="small" text-anchor="middle">x = a</text>
<text x="882" y="130" class="small" text-anchor="middle">x = b</text>
<text x="666" y="192" class="label" text-anchor="middle">a</text>
<rect x="690" y="148" width="122" height="68" rx="5" fill="#e3f1f4" stroke="#80949d"/>
<text x="751" y="194" class="entry" text-anchor="middle">1</text>
<rect x="820" y="148" width="122" height="68" rx="5" fill="#f8dfcc" stroke="#80949d"/>
<text x="881" y="194" class="entry" text-anchor="middle">−i</text>
<text x="666" y="267" class="label" text-anchor="middle">b</text>
<rect x="690" y="223" width="122" height="68" rx="5" fill="#f8dfcc" stroke="#80949d"/>
<text x="751" y="269" class="entry" text-anchor="middle">i</text>
<rect x="820" y="223" width="122" height="68" rx="5" fill="#e3f1f4" stroke="#80949d"/>
<text x="881" y="269" class="entry" text-anchor="middle">1</text>
<text x="816" y="326" class="label" text-anchor="middle">P: yes · eigenvalues 0, 2</text>
<text x="816" y="361" class="label" text-anchor="middle">C: no</text>
<path d="M398 219 L650 219" fill="none" stroke="#176a80" stroke-width="3" marker-end="url(#arrow)"/>
<text x="522" y="173" class="small" text-anchor="middle">Uc: multiply each entry</text>
<text x="522" y="197" class="small" text-anchor="middle">by c(y,x) = b(y) conjugate[b(x)]</text>
<text x="35" y="410" class="label" text-anchor="start">P = positive semidefinite matrices; C = nonnegative real kernel entries</text>
<text x="35" y="446" class="small" text-anchor="start">Lemma 5.2 · equation (5.7) · Takesaki III, Chapter XIII, Proposition 2.22</text>
