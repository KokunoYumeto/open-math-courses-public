<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-labelledby="title desc">
<title id="title">Odometer relation and product-kernel groupoid means</title>
<desc id="desc">An eight-residue odometer quotient, the endpoint map from labelled arrows, and the invariant-mean test for any countable kernel group.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#385c6c"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#223642} .title{font-size:30px;font-weight:700}.heading{font-size:25px;font-weight:600}.body{font-size:21px}.small{font-size:19px}.mono{font-family:Consolas,monospace;font-size:22px}.accent{fill:#116a69}.warn{fill:#913b40}</style>
<rect width="1200" height="1520" fill="#faf9f5"/>
<text x="38" y="52" class="title" text-anchor="start">Odometer orbits and their labelled groupoid</text>
<text x="38" y="86" class="small" text-anchor="start">Example 6.4 · Proposition 6.5 · Exercises 7.9–7.10</text>
<rect x="32" y="112" width="1136" height="338" rx="12" fill="#eef5f6" stroke="#c5d5da"/>
<text x="58" y="150" class="heading" text-anchor="start">1. Prefix residues: a finite quotient of an infinite action</text>
<text x="58" y="183" class="body" text-anchor="start">X = {0,1}^N with fair probability; T adds one; the first digit is least significant.</text>
<rect x="64" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="121" y="238" class="body" text-anchor="middle">0</text>
<text x="121" y="268" class="mono" text-anchor="middle">000</text>
<path d="M180 249L197 249" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="200" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="257" y="238" class="body" text-anchor="middle">1</text>
<text x="257" y="268" class="mono" text-anchor="middle">100</text>
<path d="M316 249L333 249" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="336" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="393" y="238" class="body" text-anchor="middle">2</text>
<text x="393" y="268" class="mono" text-anchor="middle">010</text>
<path d="M452 249L469 249" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="472" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="529" y="238" class="body" text-anchor="middle">3</text>
<text x="529" y="268" class="mono" text-anchor="middle">110</text>
<path d="M588 249L605 249" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="608" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="665" y="238" class="body" text-anchor="middle">4</text>
<text x="665" y="268" class="mono" text-anchor="middle">001</text>
<path d="M724 249L741 249" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="744" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="801" y="238" class="body" text-anchor="middle">5</text>
<text x="801" y="268" class="mono" text-anchor="middle">101</text>
<path d="M860 249L877 249" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="880" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="937" y="238" class="body" text-anchor="middle">6</text>
<text x="937" y="268" class="mono" text-anchor="middle">011</text>
<path d="M996 249L1013 249" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1016" y="210" width="114" height="78" rx="7" fill="#fff" stroke="#8aacb7"/>
<text x="1073" y="238" class="body" text-anchor="middle">7</text>
<text x="1073" y="268" class="mono" text-anchor="middle">111</text>
<path d="M1073 290V325H121V290" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="596" y="354" class="body" text-anchor="middle">q₃(Tx) = q₃(x) + 1 mod 8; every prefix cylinder has probability 1/8.</text>
<text x="58" y="390" class="body" text-anchor="start">T⁸ fixes q₃(x), while q₄(T⁸x) = q₄(x) + 8 mod 16.</text>
<text x="58" y="426" class="body" text-anchor="start">Thus T⁸x ≠ x. More generally, Tⁿx = x forces 2ᵏ | n for every k, hence n = 0.</text>
<rect x="32" y="474" width="1136" height="444" rx="12" fill="#fff" stroke="#c5d5da"/>
<text x="58" y="514" class="heading" text-anchor="start">2. The endpoint map forgets the kernel label</text>
<rect x="62" y="540" width="496" height="233" rx="12" fill="#f3edf5" stroke="#ceb6d3"/>
<rect x="646" y="540" width="490" height="233" rx="12" fill="#eaf4ed" stroke="#afd0b9"/>
<text x="83" y="575" class="body" text-anchor="start">Transformation groupoid G = (Z × H) ⋉ X</text>
<text x="83" y="608" class="small" text-anchor="start">An arrow is (n,h,x): source x, range Tⁿx.</text>
<path d="M165 690L455 690" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="160" y="725" class="body" text-anchor="middle">x</text>
<text x="470" y="725" class="body" text-anchor="middle">Tⁿx</text>
<text x="308" y="678" class="body" text-anchor="middle">(n,h,x)</text>
<path d="M152 689C96 650 106 620 164 645C208 627 216 654 177 683" fill="none" stroke="#87608e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="165" y="635" class="small" text-anchor="middle">(0,h,x)</text>
<text x="84" y="755" class="small" text-anchor="start">Isotropy at x is exactly {0} × H.</text>
<path d="M561 672L638 672" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="599" y="646" class="heading" text-anchor="middle">π</text>
<text x="667" y="575" class="body" text-anchor="start">Principal relation R = {(Tⁿx,x)}</text>
<text x="667" y="608" class="small" text-anchor="start">The endpoint exponent n is unique.</text>
<path d="M726 690L1047 690" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="721" y="725" class="body" text-anchor="middle">x</text>
<text x="1065" y="725" class="body" text-anchor="middle">Tⁿx</text>
<text x="886" y="674" class="body" text-anchor="middle">one endpoint arrow</text>
<text x="667" y="755" class="small" text-anchor="start">Above it lie |H| distinct labelled arrows.</text>
<text x="60" y="809" class="body" text-anchor="start">On the conull X*: Rₖ fixes the tail after k; each class has exactly 2ᵏ points.</text>
<text x="60" y="847" class="body" text-anchor="start">R = ⋃ₖ Rₖ, so R has the finite-class mean for every choice of H.</text>
<text x="60" y="885" class="small" text-anchor="start">Biased digits (p,1−p): spill sources have mass (1−p)ᵏ; spill ranges have mass pᵏ.</text>
<rect x="32" y="942" width="1136" height="464" rx="12" fill="#fff" stroke="#c5d5da"/>
<text x="58" y="982" class="heading" text-anchor="start">3. Kernel mean obstruction and the complete replacement criterion</text>
<text x="58" y="1008" class="small" text-anchor="start">If a groupoid mean P_G exists, these maps produce a group mean:</text>
<rect x="58" y="1015" width="214" height="105" rx="8" fill="#f3f6f7" stroke="#bacbd2"/>
<rect x="348" y="1015" width="214" height="105" rx="8" fill="#f3f6f7" stroke="#bacbd2"/>
<rect x="638" y="1015" width="214" height="105" rx="8" fill="#f3f6f7" stroke="#bacbd2"/>
<rect x="928" y="1015" width="214" height="105" rx="8" fill="#f3f6f7" stroke="#bacbd2"/>
<text x="165" y="1052" class="heading" text-anchor="middle">ℓ∞(H)</text>
<text x="165" y="1089" class="body" text-anchor="middle">f(h)</text>
<text x="455" y="1052" class="heading" text-anchor="middle">L∞(G)</text>
<text x="455" y="1089" class="small" text-anchor="middle">Φf(n,h,x) = f(h)</text>
<text x="745" y="1052" class="heading" text-anchor="middle">L∞(X)</text>
<text x="745" y="1089" class="body" text-anchor="middle">P_G(Φf)</text>
<text x="1035" y="1052" class="heading" text-anchor="middle">C</text>
<text x="1035" y="1089" class="small" text-anchor="middle">m(f) = ∫ P_G(Φf) dμ</text>
<path d="M276 1072L340 1072" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="310.0" y="1037" class="small" text-anchor="middle">Φ</text>
<path d="M566 1072L630 1072" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="600.0" y="1037" class="small" text-anchor="middle">P_G</text>
<path d="M856 1072L920 1072" fill="none" stroke="#385c6c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="890.0" y="1037" class="small" text-anchor="middle">∫ dμ</text>
<text x="59" y="1160" class="body" text-anchor="start">Isotropy bisections fix the units and send h to a⁻¹h. Equivariance gives m(Lₐf)=m(f).</text>
<text x="59" y="1202" class="body" text-anchor="start">Every displayed map is positive and unital. Hence m would be a group mean on H.</text>
<text x="59" y="1245" class="body" text-anchor="start">H = F₂: the reduced-word argument excludes m, so G is nonamenable.</text>
<text x="59" y="1287" class="heading" text-anchor="start">Any countable H: G has an invariant mean ⇔ H is amenable.</text>
<text x="59" y="1328" class="body" text-anchor="start">For amenable H, finite Reiter probabilities on Z × H give measurable averages Qᵢ.</text>
<text x="59" y="1367" class="small" text-anchor="start">A pointwise weak-star cluster point is a module mean equivariant for every bisection.</text>
<text x="38" y="1450" class="small" text-anchor="start">Exact proof locators: (6.4)–(6.10), Proposition 6.5 and Exercise 7.9.</text>
<text x="38" y="1486" class="small" text-anchor="start">Definition: Takesaki III, XIII.4.8. Group obstruction: discrete mean lesson, Example 4.4.</text>
</svg>
