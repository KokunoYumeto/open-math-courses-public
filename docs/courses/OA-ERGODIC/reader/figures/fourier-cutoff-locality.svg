<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1840" viewBox="0 0 1440 1840">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#31596a"/></marker></defs>
<rect width="1440" height="1840" fill="#f7f8f5"/>
<style>text{font-family:Arial,sans-serif;fill:#183b49}.title{font-size:37px;font-weight:bold}.head{font-size:28px;font-weight:bold}.body{font-size:25px}.small{font-size:22px}.math{font-family:Georgia,serif;font-size:27px}.line{stroke:#31596a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="52" y="62" class="title">Fourier cutoffs: enlarge the wandering set, then localize</text>
<text x="52" y="105" class="body">Exact real coordinates above; logical proof maps below. The full group theorem is not discrete.</text>
<rect x="42" y="142" width="1356" height="428" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="189" class="head">1. A Fourier coefficient with a neighborhood plateau</text>
<text x="73" y="236" class="math">C = [39/40,49/40], V = [−1/40,1/40], C+V = [19/20,5/4]</text>
<path d="M170,460 L1240,460 M200,480 L200,285" stroke="#b5c5cc" stroke-width="2"/>
<path d="M200.0,470 L1200.0,470" stroke="#a9b8be" stroke-width="8"/>
<path d="M262.50000000000006,460 L387.4999999999999,315 L1012.5000000000001,315 L1137.4999999999998,460 Z" fill="#edf5ef" stroke="#548b70" stroke-width="4"/>
<path d="M449.99999999999994,285 L449.99999999999994,462" stroke="#c59348" stroke-width="2" stroke-dasharray="7,7"/>
<text x="391.99999999999994" y="277" class="small">K = {1}</text>
<path d="M949.9999999999999,285 L949.9999999999999,462" stroke="#c59348" stroke-width="2" stroke-dasharray="7,7"/>
<text x="891.9999999999999" y="277" class="small">r = 6/5</text>
<text x="169" y="325" class="small">1</text>
<text x="169" y="460" class="small">0</text>
<path d="M262.50000000000006,456 L262.50000000000006,485" stroke="#31596a"/>
<text x="233.50000000000006" y="511" class="small">37/40</text>
<path d="M387.4999999999999,456 L387.4999999999999,485" stroke="#31596a"/>
<text x="358.4999999999999" y="511" class="small">39/40</text>
<path d="M1012.5000000000001,456 L1012.5000000000001,485" stroke="#31596a"/>
<text x="983.5000000000001" y="511" class="small">49/40</text>
<path d="M1137.4999999999998,456 L1137.4999999999998,485" stroke="#31596a"/>
<text x="1108.4999999999998" y="511" class="small">51/40</text>
<text x="73" y="549" class="small">Horizontal scale is exact. L = [9/10,13/10]; supp φ ⊂ int L; ∫φ = 3/10.</text>
<rect x="42" y="598" width="1356" height="434" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="646" class="head">2. K-wandering does not imply L-wandering</text>
<text x="73" y="688" class="math">E = [0,1/20] ∪ [6/5,5/4]; K = {1}; r = 6/5 ∈ L.</text>
<text x="88" y="758" class="math">E</text>
<path d="M220,750 L1295,750" stroke="#c7d3d7" stroke-width="2"/>
<rect x="220" y="740" width="21.5" height="20" fill="#548b70"/>
<rect x="736.0" y="740" width="21.500000000000018" height="20" fill="#548b70"/>
<text x="88" y="824" class="math">E+1</text>
<path d="M220,816 L1295,816" stroke="#c7d3d7" stroke-width="2"/>
<rect x="650" y="806" width="21.500000000000018" height="20" fill="#c59348"/>
<rect x="1166.0" y="806" width="21.499999999999922" height="20" fill="#c59348"/>
<text x="88" y="890" class="math">E+r</text>
<path d="M220,882 L1295,882" stroke="#c7d3d7" stroke-width="2"/>
<rect x="736.0" y="872" width="21.500000000000018" height="20" fill="#548b70"/>
<rect x="1252.0" y="872" width="21.500000000000114" height="20" fill="#548b70"/>
<path d="M736.0,763 L736.0,869 M757.5,763 L757.5,869" stroke="#548b70" stroke-width="2" stroke-dasharray="5,5"/>
<path d="M220,916 L220,927" stroke="#31596a"/>
<text x="208" y="953" class="small">0</text>
<path d="M650,916 L650,927" stroke="#31596a"/>
<text x="638" y="953" class="small">1</text>
<path d="M736.0,916 L736.0,927" stroke="#31596a"/>
<text x="724.0" y="953" class="small">6/5</text>
<path d="M1252.0,916 L1252.0,927" stroke="#31596a"/>
<text x="1240.0" y="953" class="small">12/5</text>
<text x="73" y="990" class="math">E ∩ (E+1) = ∅; E ∩ (E+r) = [6/5,5/4]; qT<tspan baseline-shift="sub" font-size="18">φ</tspan>(u<tspan baseline-shift="sub" font-size="18">r</tspan>)q ≠ 0.</text>
<text x="73" y="1019" class="small">The positive overlap has measure 1/20. The proof instead uses projections wandering on all of L.</text>
<rect x="42" y="1060" width="1356" height="375" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1107" class="head">3. Full compact freeness supplies the correct annihilating family</text>
<text x="73" y="1154" class="math">x ∈ P<tspan baseline-shift="sub" font-size="18">δ</tspan>(K), φ = 1 near K, supp φ ⊂ L ⊂ G∖{e}.</text>
<rect x="88" y="1185" width="500" height="65" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="108" y="1227" class="math">T<tspan baseline-shift="sub" font-size="18">φ</tspan>x = x</text>
<rect x="750" y="1185" width="552" height="65" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="770" y="1227" class="math">q ∈ ℰ<tspan baseline-shift="sub" font-size="18">L</tspan> ⇒ qT<tspan baseline-shift="sub" font-size="18">φ</tspan>(M)q = 0</text>
<path d="M610,1217 L730,1217" class="line"/>
<text x="73" y="1290" class="math">x ∈ A′: qxq = qx = 0. Compact freeness: ⋁ℰ<tspan baseline-shift="sub" font-size="18">L</tspan> = 1. Hence x = 0.</text>
<text x="73" y="1340" class="small">Normal slicing and compression extend the generator calculation to the whole algebra.</text>
<text x="73" y="1388" class="math">qT<tspan baseline-shift="sub" font-size="18">φ</tspan>(a u<tspan baseline-shift="sub" font-size="18">s</tspan>)q = φ(s) a qα<tspan baseline-shift="sub" font-size="18">s</tspan>(q)u<tspan baseline-shift="sub" font-size="18">s</tspan> = 0  (s ∈ L or φ(s) = 0).</text>
<rect x="42" y="1470" width="1356" height="308" rx="18" fill="white" stroke="#bed0d6" stroke-width="2"/>
<text x="73" y="1517" class="head">4. Identity support and the fixed coaction identify the diagonal</text>
<rect x="88" y="1544" width="344" height="76" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="106" y="1592" class="math">b<tspan baseline-shift="sub" font-size="18">ω</tspan> ∈ VN(G)</text>
<rect x="554" y="1544" width="383" height="76" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="572" y="1592" class="math">support {e} ⇒ scalar</text>
<rect x="1060" y="1544" width="243" height="76" rx="10" fill="#edf4f8" stroke="#bed0d6"/>
<text x="1078" y="1592" class="math">δ(x) = x⊗1</text>
<path d="M450,1582 L530,1582" class="line"/>
<path d="M952,1582 L1038,1582" class="line"/>
<text x="73" y="1663" class="body">Disjoint Haar supports ⇒ multiplier; commuting right translations ⇒ constant.</text>
<text x="73" y="1710" class="body">Fixed W-slices and right transport ⇒ h(s,z) = a(sz), so x = π(a) ∈ A.</text>
<text x="73" y="1757" class="small">Proof locators: Example 3.2; Proposition 3.1; Lemma 4.1; Propositions 4.2 and 5.1.</text>
<text x="52" y="1815" class="small">Sources: Takesaki III, XIII.1, Ex.8, p14; Takesaki II, VII.3, pp68–69 and X.2, Ex.11, p278.</text>
</svg>
