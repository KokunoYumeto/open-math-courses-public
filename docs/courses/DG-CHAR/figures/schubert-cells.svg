<rect x="24" y="140" width="348" height="258" fill="#ffffff" stroke="#c4cec7" stroke-width="2"/>
<text x="42" y="182" font-family="Arial, sans-serif" font-size="29" fill="#203d3b">1,2   |   dimension 0</text>
<rect x="60" y="216" width="62" height="62" fill="#f7f7ef" stroke="#203d3b" stroke-width="2"/>
<rect x="122" y="216" width="62" height="62" fill="#f7f7ef" stroke="#203d3b" stroke-width="2"/>
<rect x="60" y="278" width="62" height="62" fill="#f7f7ef" stroke="#203d3b" stroke-width="2"/>
