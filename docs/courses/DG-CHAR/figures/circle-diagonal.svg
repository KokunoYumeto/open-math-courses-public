<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1040" viewBox="0 0 940 1040">
<title>The circle diagonal in the product torus</title>
<desc>A unit square with opposite sides identified. Its diagonal represents theta1 equals theta2 modulo one. Tangent and normal arrows are one fifth of (1,1) and (-1,1). All four vertices represent the same diagonal point. The positive dual class is a2 minus a1.</desc>
<rect width="940" height="1040" fill="#f7f7ef"/>
<text x="38" y="66" font-family="Arial, sans-serif" font-size="42" fill="#203d3b">The circle diagonal in S¹ × S¹</text>
<text x="38" y="116" font-family="Arial, sans-serif" font-size="30" fill="#203d3b">Unit periods; identify each pair of opposite sides.</text>
<line x1="150" y1="820" x2="790" y2="820" stroke="#8b9692" stroke-width="4"/>
<line x1="790" y1="820" x2="790" y2="180" stroke="#8b9692" stroke-width="4"/>
<line x1="790" y1="180" x2="150" y2="180" stroke="#8b9692" stroke-width="4"/>
<line x1="150" y1="180" x2="150" y2="820" stroke="#8b9692" stroke-width="4"/>
<line x1="233.2" y1="820" x2="329.20000000000005" y2="820" stroke="#8b9692" stroke-width="4"/>
<polygon points="329.20000000000005,820 311.20000000000005,828.0 311.20000000000005,812.0" fill="#8b9692"/>
<line x1="233.2" y1="180" x2="329.20000000000005" y2="180" stroke="#8b9692" stroke-width="4"/>
<polygon points="329.20000000000005,180 311.20000000000005,188.0 311.20000000000005,172.0" fill="#8b9692"/>
<line x1="150" y1="736.8" x2="150" y2="640.8" stroke="#8b9692" stroke-width="4"/>
<polygon points="150,640.8 158.0,658.8 142.0,658.8" fill="#8b9692"/>
<line x1="790" y1="736.8" x2="790" y2="640.8" stroke="#8b9692" stroke-width="4"/>
<polygon points="790,640.8 798.0,658.8 782.0,658.8" fill="#8b9692"/>
<line x1="150" y1="820" x2="790" y2="180" stroke="#147fa6" stroke-width="7"/>
<circle cx="150" cy="820" r="7" fill="#147fa6"/>
<circle cx="790" cy="820" r="7" fill="#147fa6"/>
<circle cx="150" cy="180" r="7" fill="#147fa6"/>
<circle cx="790" cy="180" r="7" fill="#147fa6"/>
<line x1="470.0" y1="500.0" x2="598.0" y2="372.0" stroke="#237044" stroke-width="7"/>
<polygon points="598.0,372.0 590.9289321881346,390.3847763108502 579.6152236891497,379.0710678118655" fill="#237044"/>
<line x1="470.0" y1="500.0" x2="342.0" y2="372.0" stroke="#b55920" stroke-width="7"/>
<polygon points="342.0,372.0 360.3847763108502,379.0710678118655 349.0710678118655,390.3847763108502" fill="#b55920"/>
<text x="622" y="410" font-family="Arial, sans-serif" font-size="30" fill="#237044">tangent (1, 1)</text>
<text x="170" y="330" font-family="Arial, sans-serif" font-size="30" fill="#b55920">normal (−1, 1)</text>
<text x="488" y="685" font-family="Arial, sans-serif" font-size="30" fill="#147fa6">θ1 = θ2 mod 1</text>
<text x="440" y="868" font-family="Arial, sans-serif" font-size="34" fill="#203d3b">θ1</text>
<text x="97" y="512" font-family="Arial, sans-serif" font-size="34" fill="#203d3b">θ2</text>
<text x="121" y="854" font-family="Arial, sans-serif" font-size="28" fill="#203d3b">0</text>
<text x="789" y="854" font-family="Arial, sans-serif" font-size="28" fill="#203d3b">1</text>
<text x="114" y="186" font-family="Arial, sans-serif" font-size="28" fill="#203d3b">1</text>
<text x="38" y="930" font-family="Arial, sans-serif" font-size="30" fill="#203d3b">All four corners are one point in the quotient.</text>
<text x="38" y="979" font-family="Arial, sans-serif" font-size="30" fill="#203d3b">Dual class: U = a2 − a1.   On the diagonal: Δ*U = 0.</text>
<text x="38" y="1021" font-family="Arial, sans-serif" font-size="27" fill="#203d3b">Arrow scale 1/5; det[tangent, normal] = 2 &gt; 0.</text>
</svg>