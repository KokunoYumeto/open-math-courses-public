<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1350" viewBox="0 0 1280 1350">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="36" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The full joint spectrum and its two norming sets</text>
<text x="640" y="100" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K/C quadratic; T=A⊗_C K; E and Eσ are compact and disjoint.  SP1–SP2.</text>
<text x="640" y="160" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">A clopen separation is equivalent to affineness.  SP4.</text>
<rect x="70" y="205" width="540" height="200" rx="16" fill="#ecf7f1" stroke="#11643c" stroke-width="3"/>
<rect x="670" y="205" width="540" height="200" rx="16" fill="#fff2e7" stroke="#a65316" stroke-width="3"/>
<circle cx="170" cy="275" r="13" fill="#11643c"/>
<circle cx="280" cy="335" r="13" fill="#11643c"/>
<circle cx="460" cy="285" r="13" fill="#11643c"/>
<circle cx="780" cy="275" r="13" fill="#a65316"/>
<circle cx="900" cy="335" r="13" fill="#a65316"/>
<circle cx="1090" cy="285" r="13" fill="#a65316"/>
<text x="640" y="445" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">E lies in the e=0 side; Eσ lies in the e=1 side.</text>
<text x="640" y="500" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">The norming identity forces σ(e)=1−e; JC1 gives X_R affine.</text>
<rect x="70" y="565" width="1140" height="220" rx="16" fill="#f3f6fb" stroke="#74879f" stroke-width="3"/>
<text x="640" y="610" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The projection p:M(T)→M(A) has fibres of size at most two.  SP5.</text>
<text x="640" y="675" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If M(A) is totally disconnected, so is M(T).</text>
<text x="640" y="740" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">Compactness then gives the clopen separation above.  SP6.</text>
<text x="640" y="850" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Necessary configuration if a nonaffine field-overlap datum exists.  SP7.</text>
<rect x="120" y="900" width="1040" height="130" rx="16" fill="#f5f2fa" stroke="#80648f" stroke-width="3"/>
<path d="M210 965 L1070 965" stroke="#80648f" stroke-width="5"/>
<circle cx="290" cy="965" r="13" fill="#11643c"/>
<circle cx="990" cy="965" r="13" fill="#a65316"/>
<text x="640" y="1085" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">One connected component of M(T) would meet E and Eσ.</text>
<text x="640" y="1140" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Its image in M(A) would be connected and contain more than one point.</text>
<text x="640" y="1220" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The lower panel is conditional; it does not construct a counterexample.</text>
<text x="640" y="1290" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Schematic only: no identification M(T)=E∪Eσ or geometric shape is assumed.</text>
</svg>
