<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A finite norming boundary forces a product of valued fields</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Complete power norm on A; dense field C; ‖cᵐx‖=2⁻ᵐ‖x‖, c∈C*.  FB1.</text>
<rect x="60" y="170.0" width="1160" height="240" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="200" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Finite boundary: ‖x‖=maxᵢ αᵢ(x); all αᵢ(c)=1/2.  FB2.</text>
<text x="640" y="280" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Scale unequal values: αᵢ(cᵐuⁿ)&gt;1&gt;αⱼ(cᵐuⁿ).  FB4.</text>
<text x="640" y="360" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Induction gives zᵢ: αᵢ(zᵢ)&gt;1, αⱼ(zᵢ)&lt;1 for j≠i.  FB5–FB6.</text>
<rect x="60" y="510.0" width="1160" height="280" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="550" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">hᵢ,ₙ=zᵢⁿ/(1+zᵢⁿ) → the i-th coordinate idempotent.  FB7.</text>
<text x="640" y="635" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">C is dense in the entire finite product ∏ᵢ completion(C,αᵢ).</text>
<text x="640" y="720" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">A ≅ ∏ᵢ Fᵢ isometrically; M(A) consists exactly of the factor norms.  FB3.</text>
<rect x="60" y="890.0" width="1160" height="280" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="930" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Any separated power norm M≤‖·‖ has M(eᵢ)=1.</text>
<text x="640" y="1010" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">M(ueᵢ)·M(u⁻¹eᵢ)≥1 and both upper bounds force equality.</text>
<text x="640" y="1090" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Thus M=‖·‖. Both component completions in SC5 equal A.  FB8.</text>
<text x="640" y="1150" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">D₁=D₂=M(A)≠∅, contradicting SC6.</text>
<rect x="60" y="1260.0" width="1160" height="220" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1295" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A Noetherian ring of definition gives a finite boundary.</text>
<text x="640" y="1360" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Dine, Theorem3.16/Cor3.17; rescale at cᴺ as in FB9.</text>
<text x="640" y="1430" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">Hence no SC input has one; an actual input needs an infinite boundary.</text>
<text x="640" y="1550" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Infinite boundaries and the full original raw-fibre assertion remain unresolved.</text>
</svg>
