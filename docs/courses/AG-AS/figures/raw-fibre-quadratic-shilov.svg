<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1760" viewBox="0 0 1280 1760">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Quadratic coefficients locate the exact Shilov boundary</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T=A⊗_C K; σ²=1; Y=M(T) → Z=M(A). The fibres are σ-orbits.</text>
<rect x="60" y="175.0" width="1160" height="250" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="210" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For t∈T: s=t+σt, n=t·σt ∈A.</text>
<text x="640" y="290" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Largest root size = max(|s|, sqrt(|n|)), in every characteristic.  QH1.</text>
<text x="640" y="375" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Thus ‖t‖_T=max(‖s‖_A, sqrt(‖n‖_A)).  QH2.</text>
<rect x="60" y="505.0" width="1160" height="290" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="550" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p⁻¹(∂A) is closed and norming ⇒ ∂T⊆p⁻¹(∂A).</text>
<text x="640" y="630" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p(∂T) norms A; ∂T is σ-invariant and contains the whole orbit fibre.</text>
<text x="640" y="720" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">∂T=p⁻¹(∂A).  QH3.</text>
<text x="640" y="775" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">No Noetherian, finite-boundary or Tate-unit hypothesis is used.</text>
<rect x="60" y="900.0" width="1160" height="220" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="930" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">D=p(E) is a closed norming subset of Z, so ∂A⊆D.</text>
<text x="640" y="1005" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If ∂A=Z, then D=Z and Y=E ⊔ σE: the target is affine.  QH4.</text>
<text x="640" y="1080" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">Any nonaffine exact datum therefore requires a proper fixed boundary.</text>
<rect x="60" y="1205.0" width="1160" height="330" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1240" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For the original minimal nonaffine norm, put E₀=E∩∂T.</text>
<text x="640" y="1320" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">N∂(x)=max_{β∈E₀}β(x); the fixed and joint norms stay the same.</text>
<text x="640" y="1400" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The new datum stays nonaffine; minimality gives N∂=N*.  QH5–QH7.</text>
<text x="640" y="1480" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">∂B=E₀ ≅ ∂A;  ∂T=∂B ⊔ σ(∂B).  QH8.</text>
<text x="640" y="1620" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">This does NOT identify E=M(B) with ∂B; a proper subset can norm B.</text>
<text x="640" y="1690" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">No actual counterexample or proof of the full raw-fibre assertion is supplied.</text>
</svg>
