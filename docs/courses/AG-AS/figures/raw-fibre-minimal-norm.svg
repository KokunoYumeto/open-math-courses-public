<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="44" font-family="Cambria,serif" font-size="36" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A minimal nonaffine norm has zero conductor</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Suppose a nonaffine quadratic field-overlap datum exists.</text>
<text x="640" y="165" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Keep K, σ, a and its whole chart norm N₀.  Q={q≠0 : σ(q)=q⁻¹}.</text>
<rect x="60" y="225.0" width="1160" height="230" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="255" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">P: power-multiplicative nonarchimedean norms N≤N₀; N(1)=1.</text>
<text x="640" y="330" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">N(aᵐx)=2⁻ᵐN(x) for m∈Z;  N(q)≥1 for every q∈Q.</text>
<text x="640" y="405" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">R_N={x:N(x)≤1} is eligible, CIC and nonaffine.  MN2–MN4.</text>
<rect x="60" y="530.0" width="1160" height="270" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="555" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For a nonempty pointwise chain, put N∞(x)=infᵢ Nᵢ(x).</text>
<text x="640" y="625" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If x≠0:  N∞(x)≥1/N₀(x⁻¹)&gt;0.  MN5.</text>
<text x="640" y="695" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">One chain member approximates both x and y; MN6 proves the norm laws.</text>
<text x="640" y="765" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">N∞∈P.  Reversed-order Zorn gives a minimal N*∈P.  MN7.</text>
<text x="640" y="865" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Minimal does not mean least or unique.</text>
<rect x="60" y="930.0" width="1160" height="310" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="955" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For N*:  π*:T*=A*⊗_C K→B*,  J*=ker π*,  I*=Tr(J*).</text>
<text x="640" y="1025" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">UF1–UF12 give another admissible norm Ñ≤N* on the same K.</text>
<text x="640" y="1095" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Minimality gives Ñ=N*. The map B*→(B*/I*)ᵘ is isometric.</text>
<text x="640" y="1165" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">It kills I*, so I*=0; KG2 then gives J*=0.  MN8–MN9.</text>
<text x="640" y="1300" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The resulting exact nonaffine datum has injective dense π*.</text>
<text x="640" y="1370" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">After FG: K is finitely generated and countable; FE8 makes π* nonclosed.</text>
<text x="640" y="1470" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Existence remains conditional: no actual counterexample is constructed.</text>
<text x="640" y="1555" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The zero-conductor case, nonfield overlaps and the full raw bound remain unresolved.</text>
</svg>
