<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1970" viewBox="0 0 1280 1970">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every separated Nagata-family involution target is affine</text>
<text x="640" y="100" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">k algebraically closed; w(k×)=G≠R,  α&gt;0 outside G; L=k(x).  NG1–NG3.</text>
<text x="640" y="150" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">v_λ: Gauss in x, weightλ∈[α,2α]; v_e: Gauss in x+e, weight2α.</text>
<text x="640" y="200" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R=⋂V(v_λ)∩⋂V(v_e), α&lt;w(e)&lt;2α; σ fixes k, σ²=1, σ≠1.</text>
<rect x="60" y="245.0" width="1160" height="210" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="280" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Affine case: σ(x)=b−x.  NG6.</text>
<text x="640" y="345" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">w(b)&lt;α  ⇒  q=x/(b−x),  v(q)≥α−w(b)&gt;0.</text>
<text x="640" y="410" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">w(b)≥α  ⇒  invariant Gauss valuation v_α contains R and σ(R).</text>
<text x="640" y="520" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Pole case: y=x−p,  σ(y)=d/y,  d≠0,  h=w(d).  NG8.</text>
<rect x="60" y="575.0" width="1160" height="280" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="610" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If w(p)≥α, every defining valuation has α≤v(y)≤2α.</text>
<text x="640" y="675" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">h&lt;2α  ⇒  q=y²/d,  v(q)≥2α−h&gt;0.</text>
<text x="640" y="735" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">h&gt;4α  ⇒  q=d/y²,  v(q)≥h−4α&gt;0.</text>
<text x="640" y="795" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">2α&lt;h&lt;4α  ⇒  ν=h/2∈G;  invariant centered Gauss v_(p,ν).</text>
<text x="640" y="900" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">NG7 proves R⊂V_(p,ν) by matching each finite list of roots and poles.</text>
<text x="640" y="945" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Neither endpoint h=2α nor h=4α lies in G.</text>
<rect x="60" y="1010.0" width="1160" height="370" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1055" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If s=w(p)&lt;α, every defining valuation has v(y)=s.</text>
<text x="640" y="1120" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">h≠2s  ⇒  q=y²/d or its inverse;  v(q)=|2s−h|&gt;0.</text>
<text x="640" y="1185" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">h=2s:  b=p−d/p;  σ(x)=b−(d/p²)x/(1−x/p).  NG10.</text>
<text x="640" y="1250" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">w(b)&lt;α  ⇒  q=x/σ(x),  v(q)≥α−w(b)&gt;0.</text>
<text x="640" y="1315" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">w(b)≥α  ⇒  invariant v_α contains both chart rings.</text>
<text x="640" y="1440" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Orange: a proper common valuation ⇒ Rσ(R)≠L; the graph is not closed.</text>
<text x="640" y="1500" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">Green: σ(q)=q⁻¹ and inf v(q)&gt;0 ⇒ R[1/q]=L and affine target.</text>
<rect x="60" y="1585.0" width="1160" height="200" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1620" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Exact fixed-field approximants, with no division by2.  NG4–NG5.</text>
<text x="640" y="1685" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">eₙ=qⁿ/(1+qⁿ),  cₙ=b(1−eₙ)+σ(b)eₙ;  σ(cₙ)=cₙ.</text>
<text x="640" y="1750" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For b≠σ(b), v(b−cₙ)≥nε+m_(b−σ(b)); if b=σ(b), cₙ=b.</text>
<text x="640" y="1860" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">This treats the specified Nagata family and involutions fixing k.</text>
<text x="640" y="1915" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Arbitrary CIC Goldman charts and the full raw-fibre bound remain unproved.</text>
</svg>
