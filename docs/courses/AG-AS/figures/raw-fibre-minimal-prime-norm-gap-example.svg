<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1840" viewBox="0 0 1280 1840">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="46" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Minimal primes can lose a quotient norming point</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">F complete nonarchimedean; 0&lt;r&lt;1.  All norms below are exact.</text>
<rect x="60" y="155.0" width="1160" height="260" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="190" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B=F⟨r⁻¹T,X⟩ → D=F⟨r⁻¹T⟩ ← C=F⟨T,Y⟩</text>
<text x="640" y="255" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Left map: X=0.  Right map: Y=0, then radius restriction.  MG1.</text>
<text x="640" y="320" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A=B ×ᴰ C;  N(b,c)=max(‖b‖ᴮ,‖c‖ᶜ).</text>
<text x="640" y="380" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">P=ker(A→B) and Q=ker(A→C) are closed MINIMAL primes.  MG2.</text>
<rect x="60" y="445.0" width="1160" height="240" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="475" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">E=A/P={b∈B : b(T,0)∈F⟨T⟩}, a complete uniform domain.</text>
<text x="640" y="540" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">q(b)=max(‖b‖ᴮ, ‖b(T,0)‖₁).  The infimum is attained.  MG3.</text>
<text x="640" y="605" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Old norming set Δ={βᴮ,βᶜ};   Δ∩Zᴾ={βᴮ}.</text>
<text x="640" y="665" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The quotient needs β₀(b)=‖b(T,0)‖₁; it has β₀(T)=1.  MG4.</text>
<rect x="60" y="722.5" width="1160" height="405" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="755" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Exact values for r=1/2: q(Tⁿ)=1 and βᴮ(Tⁿ)=2⁻ⁿ</text>
<polyline points="215,792 215,1050 1100,1050" fill="none" stroke="#718096" stroke-width="2"/>
<text x="215.0" y="1080" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">0</text>
<text x="359.16666666666663" y="1080" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1</text>
<text x="503.3333333333333" y="1080" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">2</text>
<text x="647.5" y="1080" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">3</text>
<text x="791.6666666666666" y="1080" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">4</text>
<text x="935.8333333333334" y="1080" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">5</text>
<text x="1080.0" y="1080" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">6</text>
<polyline points="215,800 1080,800" fill="none" stroke="#20559d" stroke-width="4"/>
<polyline points="215.0,800 359.16666666666663,925.0 503.3333333333333,987.5 647.5,1018.75 791.6666666666666,1034.375 935.8333333333334,1042.1875 1080.0,1046.09375" fill="none" stroke="#b75117" stroke-width="4"/>
<text x="1030" y="828" font-family="Cambria,serif" font-size="24" fill="#20559d" text-anchor="middle" dominant-baseline="central">q(Tⁿ)=1</text>
<text x="700" y="1000" font-family="Cambria,serif" font-size="24" fill="#b75117" text-anchor="middle" dominant-baseline="central">βᴮ(Tⁿ)=2⁻ⁿ</text>
<text x="160" y="800" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1</text>
<text x="160" y="1050" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">0</text>
<text x="1135" y="1115" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">n</text>
<rect x="60" y="1160.0" width="1160" height="230" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1195" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">a=(X,0), ann(a)=P;  q(Tⁿ)/N(aTⁿ)=r⁻ⁿ → ∞.</text>
<text x="640" y="1260" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">a(1+T+⋯+Tᵐ) → (X/(1−T),0) ∉ aA.  MG5.</text>
<text x="640" y="1320" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Thus aA is not closed.  The perfect variant has the same gap.  MG6.</text>
<rect x="60" y="1420.0" width="1160" height="230" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1450" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Sufficient comparison: N̄(x+P) ≤ K₀N(ax) for every x.  MG7.</text>
<text x="640" y="1515" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Apply it to xⁿ and take nth roots: ρᴬ/ᴾ(x)=max(Δ∩Zᴾ)|x|.  MG8.</text>
<text x="640" y="1580" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">In IC minimal split data, every nonzero minimal annihilator prime</text>
<text x="640" y="1630" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">must violate that estimate for every K₀&gt;0.</text>
<text x="640" y="1725" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">This example has NO dense subfield: its units are not dense near (0,Y).</text>
<text x="640" y="1790" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">It refutes a general comparison lemma, not the raw-fibre cohomology claim.</text>
</svg>
