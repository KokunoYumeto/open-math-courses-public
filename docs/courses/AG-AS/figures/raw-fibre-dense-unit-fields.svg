<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1760" viewBox="0 0 1280 1760">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Dense units construct the arithmetic field data</text>
<text x="640" y="108" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Complete ultrametric A; a characteristic-zero field F⊆A; A× dense.</text>
<rect x="60" y="170.0" width="1160" height="210" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="204" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">At P′(a₀)∈A×, a small-ball contraction gives an open image.  DU2–DU3.</text>
<text x="640" y="278" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Induction on degree: {a : P(a)∈A×} is open and dense.  DU1.</text>
<text x="640" y="350" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For countable F, nested balls meet every nonzero polynomial condition.  DU4.</text>
<rect x="60" y="425.0" width="1160" height="220" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="455" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For separable A, choose a₁,a₂,... in a countable basis of open sets.</text>
<text x="640" y="535" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">They are algebraically independent over the prescribed countable L.</text>
<text x="640" y="610" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">L/k quadratic ⇒ C=k(a₁,a₂,...) dense; K=L(a₁,a₂,...), [K:C]=2.  DU5.</text>
<rect x="60" y="705.0" width="1160" height="250" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="735" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Analytic input: separable uniform Q₅-algebra A with dense units;</text>
<text x="640" y="810" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">N=max(M₁,M₂); both Mᵢ faithful power norms; D₁∩D₂=∅.  DU6.</text>
<text x="640" y="885" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Q(i)⊂Q₅; k=Q, L=Q(i); κ=log(2)/log(5) makes |5|^κ=1/2.</text>
<text x="640" y="930" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Conjugation is algebraic on K; no continuous extension to A is used.</text>
<rect x="60" y="1005.0" width="1160" height="240" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1035" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">N_K(y)=max(M₁(y)^κ, M₂(σy)^κ), R={N_K≤1}.  DU7.</text>
<text x="640" y="1110" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The split construction gives the closed mixed graph and a raw-one quotient.</text>
<text x="640" y="1185" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">δ=dist((i,−i),diag A)&gt;0; 2⁻ᵐ&lt;δ ⇒ [5⁻ᵐ i]≠0 in H¹(O_X).  DU8.</text>
<rect x="60" y="1315.0" width="1160" height="230" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1345" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Separable uniform Q₅ A: dense units + finite norming boundary</text>
<text x="640" y="1420" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">⇒ A is an isometric finite product of complete valued fields.  DU9.</text>
<text x="640" y="1495" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A Noetherian ring of definition supplies such a finite boundary.</text>
<text x="640" y="1600" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Any analytic input in DU6 therefore needs an infinite boundary.</text>
<text x="640" y="1685" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">No analytic input satisfying DU6 has been constructed here.</text>
</svg>
