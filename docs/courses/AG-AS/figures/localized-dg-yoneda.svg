<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="1350" viewBox="0 0 2250 1350">
<title>Derived Hom with its endomorphism action</title>
<desc>The localization triangle removes modules built from acyclic representables. Evaluating its unit at K keeps the right End dg K action. Its cohomology gives derived morphisms in every degree.</desc>
<rect width="2250" height="1350" fill="#f7fafc"/>
<text x="1125" y="65" font-family="Cambria, serif" font-size="55" fill="#17334d" text-anchor="middle" dominant-baseline="central">Derived Hom with its endomorphism action</text>
<rect x="45" y="140" width="2160" height="330" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="1125" y="215" font-family="Cambria, serif" font-size="51" fill="#17334d" text-anchor="middle" dominant-baseline="central">B_X   →   h_X   →   Lh_X   →   B_X[1]</text>
<text x="1125" y="310" font-family="Cambria, serif" font-size="42" fill="#17334d" text-anchor="middle" dominant-baseline="central">h_X(T) = Hom_dg(T, X)</text>
<text x="580" y="400" font-family="Cambria, serif" font-size="34" fill="#17334d" text-anchor="middle" dominant-baseline="central">B_X: cells h_N[s], with N acyclic</text>
<text x="1670" y="400" font-family="Cambria, serif" font-size="34" fill="#17334d" text-anchor="middle" dominant-baseline="central">(Lh_X)(N) is acyclic for every acyclic N</text>
<rect x="45" y="530" width="2160" height="370" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="495" y="615" font-family="Cambria, serif" font-size="48" fill="#17334d" text-anchor="middle" dominant-baseline="central">h_X</text>
<text x="1635" y="615" font-family="Cambria, serif" font-size="48" fill="#17334d" text-anchor="middle" dominant-baseline="central">Lh_X</text>
<line x1="650" y1="615" x2="1480" y2="615" stroke="#345b78" stroke-width="5"/><polygon points="1480,615 1458.0,605.0 1458.0,625.0" fill="#345b78"/>
<text x="1070" y="573" font-family="Cambria, serif" font-size="32" fill="#17334d" text-anchor="middle" dominant-baseline="central">η_X</text>
<text x="495" y="820" font-family="Cambria, serif" font-size="47" fill="#17334d" text-anchor="middle" dominant-baseline="central">Hom_dg(K, X)</text>
<text x="1635" y="820" font-family="Cambria, serif" font-size="47" fill="#17334d" text-anchor="middle" dominant-baseline="central">G_K(X) = (Lh_X)(K)</text>
<line x1="495" y1="660" x2="495" y2="765" stroke="#345b78" stroke-width="5"/><polygon points="495,765 505.0,743.0 485.0,743.0" fill="#345b78"/>
<line x1="1635" y1="660" x2="1635" y2="765" stroke="#345b78" stroke-width="5"/><polygon points="1635,765 1645.0,743.0 1625.0,743.0" fill="#345b78"/>
<text x="300" y="710" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">ev_K</text>
<text x="1840" y="710" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">ev_K</text>
<line x1="810" y1="820" x2="1235" y2="820" stroke="#345b78" stroke-width="5"/><polygon points="1235,820 1213.0,810.0 1213.0,830.0" fill="#345b78"/>
<text x="1025" y="865" font-family="Cambria, serif" font-size="31" fill="#17334d" text-anchor="middle" dominant-baseline="central">E-linear</text>
<rect x="45" y="960" width="2160" height="320" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="1125" y="1025" font-family="Cambria, serif" font-size="38" fill="#17334d" text-anchor="middle" dominant-baseline="central">E = End_dg(K);   m · e = m ∘ e on representables</text>
<text x="1125" y="1120" font-family="Cambria, serif" font-size="44" fill="#17334d" text-anchor="middle" dominant-baseline="central">Hⁿ(G_K X) ≅ Hom_D(A)(K, X[n]),   for every integer n</text>
<text x="1125" y="1215" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">UG_K ≅ RHom(K, −) when the ordinary right derived functor exists</text>
</svg>
