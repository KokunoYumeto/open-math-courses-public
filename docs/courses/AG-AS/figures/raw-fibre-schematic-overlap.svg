<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The schematic overlap determines affineness</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Y = U ∪ V, with both charts affine and W = U ∩ V quasi-compact.</text>
<rect x="75.0" y="160.0" width="1130" height="190" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="200" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Y₀ = schematic closure of W in Y</text>
<text x="640" y="260" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Z₁ is supported on Y ∖ V;  Z₂ is supported on Y ∖ U.</text>
<text x="640" y="315" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Each Zᵢ is a closed subscheme contained in one affine chart.</text>
<path d="M640,375 L640,435" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,435 630,417 650,417" fill="#165fa1"/>
<text x="640" y="480" font-family="Cambria,serif" font-size="42" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Y₀ ⨿ Z₁ ⨿ Z₂  →  Y</text>
<text x="640" y="540" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Finite and surjective: every point is in the overlap or one complement.</text>
<text x="640" y="605" font-family="Cambria,serif" font-size="42" fill="#11643c" text-anchor="middle" dominant-baseline="central">Y₀ affine  ⇔  Y affine</text>
<text x="640" y="665" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Finite surjective descent in one direction; closed immersion in the other.</text>
<path d="M65,710 L1215,710" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="765" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Principal overlap B = A[1/a]:</text>
<text x="640" y="825" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T = ker(A → B) = {x : aᴺx = 0 for some N}</text>
<text x="640" y="885" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The chart of Y₀ is Spec(A/T), and A/T → B is injective.</text>
<text x="640" y="945" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The overlap B is unchanged; the image quotient removes the kernel.</text>
<text x="640" y="1010" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">The reciprocal criterion therefore applies to the image ring A/T.</text>
<text x="640" y="1080" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Exact proof: (SO1)–(SO7). Closure: Tag 01RA; affine descent: Tags 05YU, 07VT.</text>
</svg>
