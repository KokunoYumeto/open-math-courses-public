<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1930" viewBox="0 0 1280 1930">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="50" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Closed image does not require polynomial uniformity</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">All fields and norms below use the actual 5-adic absolute value.</text>
<rect x="70" y="170.0" width="1140" height="240" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="200" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Finite Galois tower:  Q₅ ⊂ L₁ ⊂ L₂ ⊂ …,  ⋃Lₙ=Q₅ᵃˡᵍ.  UV4.</text>
<text x="640" y="260" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Primitive bₙ∈Lₙ;  δₙ = least distance to another Q₅-conjugate.</text>
<text x="640" y="320" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Start |b₁−1|&lt;1/5; for n≥2, |bₙ−bₙ₋₁|&lt;min(5⁻ⁿ,δ₁/5,…,δₙ₋₁/5). UV5.</text>
<text x="640" y="380" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Then |z−bₙ|≤δₙ/5&lt;δₙ puts every Lₙ in the completed Q₅(z).</text>
<text x="640" y="475" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">Limit z:  |z−1|₅&lt;1,  z transcendental over Q₅,  closure(Q(z))=C₅.  UV6.</text>
<rect x="70" y="540.0" width="1140" height="240" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="570" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K=Q(z),  σ(z)=−z,  C=Q(z²),  R={x∈K : |x|₅≤1}.</text>
<text x="640" y="630" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R is CIC and non-Noetherian;  R[1/5]=K and value group = Q.</text>
<text x="640" y="690" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">q=(z−1)/(z+1):  |q|₅&lt;1,  σ(q)=q⁻¹,  R[1/q]=K.</text>
<text x="640" y="750" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Hence Rσ(R)=K; the exact separated field chart has affine target.</text>
<text x="640" y="855" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">A=B=C₅,  T=C₅×C₅;  π is a coordinate projection.  UV7.</text>
<text x="640" y="920" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The fields are dense; π has closed image and is an open surjection.</text>
<rect x="70" y="990.0" width="1140" height="270" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1035" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For ANY nonconstant f∈K[X], choose a root b∈C₅ and xⱼ∈K→b.</text>
<text x="640" y="1100" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">If |b|₅≤1:  xⱼ∈R eventually,  f(xⱼ)→0; (U)(ii) fails.</text>
<text x="640" y="1165" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">If |b|₅&gt;1:  |xⱼ|₅=|b|₅,  f(xⱼ)/xⱼᵈ→0; (U)(iii) fails.</text>
<text x="640" y="1225" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A root at zero is tested directly at zero.  Necessary conditions UV8.</text>
<text x="640" y="1340" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">This refutes universal polynomial (U) even on the exact FG class.</text>
<text x="640" y="1410" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">It refutes neither closed image nor the raw-fibre vanishing theorem.</text>
<rect x="70" y="1505.0" width="1140" height="250" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1545" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Also K′=Q(u), τ(u)=u⁻¹; wₙ(f)=v₅(f(5ⁿz))/n, w∞=ord_(u=0).</text>
<text x="640" y="1605" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">wₙ(f)=m+c_f/n → m;  D=V(w∞)∩⋂V(wₙ),  D[1/u]=K′. UV9–UV10.</text>
<text x="640" y="1665" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Every wₙ has completion C₅; infinitely many distinct wₙ fail (U).</text>
<text x="640" y="1725" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">No finite deletion restores (U). The reciprocal cofinal u still gives an affine target.</text>
<text x="640" y="1850" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The general raw topological-fibre bound is unproved here.</text>
</svg>
