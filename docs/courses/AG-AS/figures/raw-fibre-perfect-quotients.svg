<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1700" viewBox="0 0 1280 1700">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="48" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Perfect norms and collapse under maximal quotients</text>
<text x="640" y="108" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A is complete and perfect in characteristic p; N is a separated power norm.</text>
<rect x="60" y="155.0" width="1160" height="220" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="190" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">I is proper, CLOSED and RADICAL; q(x̄)=inf{i∈I} N(x+i).</text>
<text x="640" y="265" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every i∈I is jᵖ with j∈I, so q(x̄ᵖ)=q(x̄)ᵖ.</text>
<text x="640" y="340" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Integer division pʳ=nk+s forces q(x̄ⁿ)=q(x̄)ⁿ.  PQ1–PQ2.</text>
<rect x="60" y="420.0" width="1160" height="180" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="450" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A common homogeneous unit a has 0&lt;|a|=τ&lt;1.</text>
<text x="640" y="510" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Fp(a)ᵖᵉʳᶠ embeds as a valued field and acts homogeneously.</text>
<text x="640" y="570" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Its completion F has value group containing τ^(Z[1/p]), hence dense.  PQ3.</text>
<rect x="60" y="655.0" width="1160" height="230" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="685" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For every algebraic maximal ideal m: A/m is a uniform Banach FIELD over F.</text>
<text x="640" y="760" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Kedlaya Theorem 3.7 gives its multiplicative norm; PQ4 identifies it with q.</text>
<text x="640" y="835" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">There is exactly one bounded point βₘ over this quotient.</text>
<rect x="60" y="925.0" width="1160" height="250" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="960" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Now suppose GP1: N=max(M₁,M₂), faithful Mⱼ, and D₁∩D₂=∅.</text>
<text x="640" y="1035" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">mBⱼ≠Bⱼ  ⇔  βₘ∈Dⱼ.  Thus mB₁=B₁ OR mB₂=B₂.  PQ5.</text>
<text x="640" y="1110" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">At least one completed quotient is ZERO at every maximal m.</text>
<text x="640" y="1160" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A maximal-field reduction cannot keep both nonzero sides.</text>
<rect x="60" y="1230.0" width="1160" height="280" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1265" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Ordinary tensor: H=B₁⊗_A B₂≠0.  PQ6.</text>
<text x="640" y="1335" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For every minimal prime ideal P of A, H has a prime contracting to P.</text>
<text x="640" y="1405" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every such P is nonmaximal: an algebraic prime chain P⊊m remains.</text>
<text x="640" y="1475" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Separated completed projective tensor: HBan=0.  PQ7.</text>
<text x="640" y="1570" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">These are distinct tensor constructions; no actual GP input is exhibited.</text>
<text x="640" y="1630" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The original general raw-fibre cohomology assertion remains open.</text>
</svg>
