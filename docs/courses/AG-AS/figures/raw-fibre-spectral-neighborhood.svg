<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1570" viewBox="0 0 1280 1570">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="36" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The compact norming set and its split neighborhood</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Y=M(T), Z=M(A), D=p(E); E∩Eσ=∅; M(B)=S.  SN1.</text>
<rect x="60" y="155.0" width="1160" height="220" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p identifies Z with the quotient of Y by σ.  SN2.</text>
<text x="640" y="260" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">E ≅ D ≅ Eσ, and p⁻¹(D)=E ⨿ Eσ.  SN3.</text>
<text x="640" y="330" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The set D is compact and norms every element of A.</text>
<rect x="60" y="430.0" width="1160" height="210" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="470" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">There is an open V containing D with</text>
<text x="640" y="535" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p⁻¹(V)=O_V ⨿ σ(O_V), each summand homeomorphic to V.  SN4.</text>
<text x="640" y="600" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The topological statement alone does not supply a global algebra splitting.</text>
<rect x="60" y="690.0" width="1160" height="230" rx="14" fill="#edf7f1" stroke="#73aa89" stroke-width="2"/>
<text x="640" y="725" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">A∩B×=A×: limits of inverses from the dense field stay in A.  SN5.</text>
<text x="640" y="790" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If one generalized rational domain W contains all of D, then W=Z.  SN6.</text>
<text x="640" y="855" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">X_R affine  ⇔  D=Z  ⇔  ∃ one such W with D⊆W⊆V.  SN7.</text>
<text x="640" y="1020" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">An actual eligible affine example has an interval in its fixed spectrum.  SN8–SN9.</text>
<rect x="60" y="1070.0" width="1160" height="330" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1115" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K=Q(u), σ(u)=1/u, v_λ(Σ b_i uⁱ)=min_i(v₂(b_i)+iλ), λ∈[1,2].</text>
<text x="640" y="1175" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R=⋂ V_(v_λ), R[1/2]=K, Rσ(R)=K; q=u is reciprocal and cofinal.</text>
<text x="640" y="1235" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The target is affine, so A≅B. The interval λ↦2^(−v_λ) embeds in M(A).</text>
<text x="640" y="1300" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">λ=1: |u|=1/2              λ=3/2: |u|=2^(−3/2)              λ=2: |u|=1/4</text>
<text x="640" y="1360" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">No equality of this interval with the whole spectrum is assumed.</text>
<text x="640" y="1470" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Connectedness alone is not a counterexample; a joint component must cross E and Eσ.</text>
<text x="640" y="1530" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">All claims concern the exact quadratic field-overlap datum; the full raw bound remains open.</text>
</svg>
