<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1480" viewBox="0 0 1280 1480">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A norm section and two affine charts</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T is an integral separated Noetherian curve.</text>
<text x="640" y="170" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T = T_a ∪ T_b, both opens affine;  D = Z(b) ⊂ T_a.</text>
<text x="640" y="225" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">deg(a) = d, deg(b) = e, N = rd − 1 &gt; 0;  M = H^(eN).</text>
<rect x="55.0" y="295.0" width="550" height="360" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<rect x="675.0" y="295.0" width="550" height="360" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="330" y="335" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Outside D: field fibres</text>
<text x="330" y="405" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B_x is a field of degree n ≥ 2.</text>
<text x="330" y="465" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1 and z are independent; b(x) ≠ 0.</text>
<text x="330" y="525" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">v(x) = a(x)^(er) + b(x) z(x) ≠ 0.</text>
<text x="330" y="595" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Hence v(x) is a unit.</text>
<text x="950" y="335" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">On D: the scalar term</text>
<text x="950" y="405" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">b(x) = 0 and a(x) ≠ 0.</text>
<text x="950" y="465" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The order B_x has rank n.</text>
<text x="950" y="525" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">v(x) = a(x)^(er) · 1.</text>
<text x="950" y="595" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">This is a unit even on a singular fibre.</text>
<path d="M330,680 L330,760" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="330,760 320,742 340,742" fill="#165fa1"/>
<path d="M950,680 L950,760" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="950,760 940,742 960,742" fill="#165fa1"/>
<rect x="80.0" y="775.0" width="1120" height="190" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="815" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">t = Norm_B(v) ∈ Γ(T, H^(nerd))</text>
<text x="640" y="875" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">t is nonzero at every point of T.</text>
<text x="640" y="930" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Its determinant polynomial lies in the homogeneous ideal (a,b).</text>
<path d="M640,990 L640,1060" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,1060 630,1042 650,1042" fill="#165fa1"/>
<text x="640" y="1110" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">D₊(t) ⊂ D₊(a) ∪ D₊(b) = T ⊂ Proj Γ*(T,H)</text>
<text x="640" y="1185" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Nonvanishing gives the reverse inclusion:  T = D₊(t).</text>
<text x="640" y="1255" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">The whole curve is a standard affine open.</text>
<path d="M65,1310 L1215,1310" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1360" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The ideal membership is essential: triviality of an ample power alone</text>
<text x="640" y="1400" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">would imply only quasi-affineness. Exact construction: (NCN1)–(NCN6).</text>
<text x="640" y="1450" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">No normality, residue-field transfer or division by the rank is used.</text>
</svg>
