<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1650" viewBox="0 0 1280 1650">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="50" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Finite etale and closed base do not force closed image</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">k = F₃((s)),  r = |s| = 1/2;   A = k⟨z⟩,   A_r = k⟨z/s⟩.</text>
<text x="640" y="175" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For f = Σ zⁿ:  coefficient sizes are 1, but weighted sizes are rⁿ.</text>
<path d="M130,470 L560,470" stroke="#596579" stroke-width="2"/>
<path d="M130,470 L130,260" stroke="#596579" stroke-width="2"/>
<path d="M155,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="155" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">0</text>
<path d="M207,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="207" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1</text>
<path d="M259,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="259" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M311,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="311" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M363,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="363" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">4</text>
<path d="M415,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="415" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">5</text>
<path d="M467,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="467" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">6</text>
<path d="M519,470 V280" stroke="#165fa1" stroke-width="15"/>
<text x="519" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">7</text>
<text x="345" y="240" font-family="Cambria,serif" font-size="26" fill="#165fa1" text-anchor="middle" dominant-baseline="central">coefficient sizes</text>
<text x="345" y="550" font-family="Cambria,serif" font-size="24" fill="#165fa1" text-anchor="middle" dominant-baseline="central">|aₙ| = 1: coefficients do not tend to zero</text>
<path d="M720,470 L1150,470" stroke="#596579" stroke-width="2"/>
<path d="M720,470 L720,260" stroke="#596579" stroke-width="2"/>
<path d="M745,470 V280" stroke="#11643c" stroke-width="15"/>
<text x="745" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">0</text>
<path d="M797,470 V375.0" stroke="#11643c" stroke-width="15"/>
<text x="797" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1</text>
<path d="M849,470 V422.5" stroke="#11643c" stroke-width="15"/>
<text x="849" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M901,470 V446.25" stroke="#11643c" stroke-width="15"/>
<text x="901" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M953,470 V458.125" stroke="#11643c" stroke-width="15"/>
<text x="953" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">4</text>
<path d="M1005,470 V464.0625" stroke="#11643c" stroke-width="15"/>
<text x="1005" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">5</text>
<path d="M1057,470 V467.03125" stroke="#11643c" stroke-width="15"/>
<text x="1057" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">6</text>
<path d="M1109,470 V468.515625" stroke="#11643c" stroke-width="15"/>
<text x="1109" y="500" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">7</text>
<text x="935" y="240" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">weighted sizes</text>
<text x="935" y="550" font-family="Cambria,serif" font-size="24" fill="#11643c" text-anchor="middle" dominant-baseline="central">|aₙ|rⁿ = 2⁻ⁿ → 0</text>
<text x="640" y="615" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Therefore f∉A,  f∈A_r;  f_N = Σ_{n≤N}zⁿ tends to f only in A_r.</text>
<rect x="65" y="672.5" width="1150" height="225" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="705" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">T=A×A is finite etale of rank 2 over diagonal A;  B=A×A_r.</text>
<text x="640" y="765" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">π(a,b)=(a,ι(b));   σ(a,b)=(b,a);   ι:A→A_r is coefficient identity.</text>
<text x="640" y="825" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A is closed isometrically in T and B; π is injective, dense, not onto.</text>
<text x="640" y="875" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">‖t‖_T = max(‖π(t)‖_B, ‖π(σt)‖_B).  NC1–NC2.</text>
<text x="640" y="965" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">As n→∞, let m=⌊n/2⌋, t=(0,s⁻ᵐ zⁿ):  ‖π(t)‖_B=rⁿ⁻ᵐ→0,</text>
<text x="640" y="1020" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">while ‖t‖_T = ‖π(σt)‖_B = r⁻ᵐ→∞.  NC3.</text>
<text x="640" y="1095" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Even T ≅ A ⊗_{F₃((s²))} k: a separable quadratic field base change.  NC4.</text>
<path d="M65,1160 L1215,1160" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1220" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The essential missing hypothesis: there is no dense field in A or T.</text>
<text x="640" y="1280" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If ‖g−z‖_1&lt;1, then reduction(g)=z. An inverse would give z h̄=1,</text>
<text x="640" y="1330" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">impossible in F₃[z]. Thus this open ball contains no units.</text>
<rect x="65" y="1405.0" width="1150" height="190" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="1435" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">This refutes the structural Banach-ring closed-image inference.</text>
<text x="640" y="1500" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">It is not an eligible Goldman field chart and gives no algebraic-space counterexample.</text>
<text x="640" y="1565" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Closed image with the actual dense quadratic field is still required.</text>
</svg>
