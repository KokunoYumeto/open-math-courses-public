<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1250" viewBox="0 0 1280 1250">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Quadratic atlases: the direct cohomology obstruction</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">U = Spec A,  V = Spec B,  C = B^σ;  V → Spec C is a finite étale torsor.</text>
<text x="640" y="175" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">F is given by M and a σ-semilinear involution T on P = B ⊗_A M.</text>
<rect x="75.0" y="225.0" width="1130" height="210" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="270" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Normalized atlas cochains (QE1)</text>
<text x="640" y="335" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">M  →  P  →  P  →  P  →  P  →  ···</text>
<text x="640" y="395" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Maps:  (T−1)ι,     1+T,     T−1,     1+T,     ···</text>
<path d="M640,460 L640,510" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,510 630,492 650,492" fill="#165fa1"/>
<text x="640" y="550" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Replace the initial M by P: the torsor Amitsur complex.</text>
<text x="640" y="610" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Faithful-flat exactness gives</text>
<text x="640" y="670" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">ker(1+T) = im(T−1),     ker(T−1) = im(1+T).</text>
<text x="640" y="730" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">In characteristic two the two operators agree; exactness still holds.</text>
<rect x="75.0" y="780.0" width="1130" height="200" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="825" font-family="Cambria,serif" font-size="42" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">H¹(X,F) = P / (ι(M) + P^T)</text>
<text x="640" y="885" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">H⁰(X,F) = {m ∈ M : ι(m) ∈ P^T};     H^q(X,F) = 0 for q ≥ 2.</text>
<text x="640" y="945" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The quotient is additive, with scalars from Γ(X,O_X).</text>
<path d="M65,1020 L1215,1020" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1070" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For O_X:  Γ(X,O_X) = A ×_B C,     H¹(X,O_X) = B/(ρ(A)+C).</text>
<text x="640" y="1130" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The unresolved condition is P = ι(M) + P^T for every descended-module datum.</text>
<text x="640" y="1200" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Exact proof: (QE1)–(QE5). No division by two or global normal basis is used.</text>
</svg>
