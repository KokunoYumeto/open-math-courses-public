<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1570" viewBox="0 0 1280 1570">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="50" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A reciprocal parameter gives finite invariant approximations</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B = D[1/r],   r ∈ Jac(D),   σ(r) = r⁻¹,   C = B^σ.   JR1–JR4.</text>
<rect x="65" y="155" width="1150" height="230" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">t = r + r⁻¹,   c₀ = 0,   cₖ₊₁ = (t − cₖ)⁻¹ ∈ C</text>
<text x="640" y="255" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">eₖ = cₖ − r ∈ r^(2k+1)D</text>
<text x="640" y="315" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">eₖ₊₁ = r²eₖ / (1 − reₖ);   the denominator is a unit in D.</text>
<text x="640" y="355" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Finite induction; no division by 2 and no completeness assumption.</text>
<text x="640" y="435" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B = C ⊕ Cr.  Write x = u + vr, and clear r^m v into D.</text>
<rect x="65" y="480" width="1150" height="145" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="520" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">2k + 1 − m ≥ n   ⇒   x − (u + vcₖ) = −veₖ ∈ rⁿD</text>
<text x="640" y="580" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B = rⁿD + C for every n   ⇒   X affine.  Exhaustive criterion PW6.</text>
<path d="M65,680 L1215,680" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="730" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">An affine example whose valuation family is not Zariski compact</text>
<text x="640" y="785" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K = Q(u),  vλ(2) = 1,  vλ(u) = λ ∈ [1,2],  D = ⋂ Vλ.</text>
<text x="640" y="835" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">σ(u) = u⁻¹;  D[1/2] = D[1/u] = K;  D σ(D) = K.</text>
<text x="640" y="885" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">The reciprocal parameter u proves affineness by JR1–JR4.</text>
<text x="640" y="945" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Zariski open cover of the entire normalized family S:</text>
<text x="640" y="990" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">U₀: v(u) ≤ 1.     Uₙ: v(u) ≥ 1 + 1/n  (n ≥ 1).</text>
<path d="M270,1045 L1130,1045" fill="none" stroke="#596579" stroke-width="3"/>
<path d="M270,1035 L270,1055" fill="none" stroke="#596579" stroke-width="3"/>
<text x="270" y="1080" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1</text>
<path d="M485.0,1035 L485.0,1055" fill="none" stroke="#596579" stroke-width="3"/>
<text x="485.0" y="1080" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1.25</text>
<path d="M700.0,1035 L700.0,1055" fill="none" stroke="#596579" stroke-width="3"/>
<text x="700.0" y="1080" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1.5</text>
<path d="M1130,1035 L1130,1055" fill="none" stroke="#596579" stroke-width="3"/>
<text x="1130" y="1080" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">2</text>
<text x="1190" y="1045" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">λ</text>
<text x="170" y="1130" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="end" dominant-baseline="central">U₀</text>
<circle cx="270" cy="1130" r="6" fill="#165fa1"/>
<text x="170" y="1190" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="end" dominant-baseline="central">U1</text>
<path d="M1130.0,1190 L1130,1190" fill="none" stroke="#165fa1" stroke-width="8"/>
<circle cx="1130.0" cy="1190" r="6" fill="#165fa1"/>
<circle cx="1130" cy="1190" r="6" fill="#165fa1"/>
<text x="170" y="1250" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="end" dominant-baseline="central">U2</text>
<path d="M700.0,1250 L1130,1250" fill="none" stroke="#165fa1" stroke-width="8"/>
<circle cx="700.0" cy="1250" r="6" fill="#165fa1"/>
<circle cx="1130" cy="1250" r="6" fill="#165fa1"/>
<text x="170" y="1310" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="end" dominant-baseline="central">U3</text>
<path d="M556.6666666666666,1310 L1130,1310" fill="none" stroke="#165fa1" stroke-width="8"/>
<circle cx="556.6666666666666" cy="1310" r="6" fill="#165fa1"/>
<circle cx="1130" cy="1310" r="6" fill="#165fa1"/>
<text x="170" y="1370" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="end" dominant-baseline="central">U4</text>
<path d="M485.0,1370 L1130,1370" fill="none" stroke="#165fa1" stroke-width="8"/>
<circle cx="485.0" cy="1370" r="6" fill="#165fa1"/>
<circle cx="1130" cy="1370" r="6" fill="#165fa1"/>
<path d="M377.5,1110 L377.5,1405" fill="none" stroke="#9a3f00" stroke-width="3"/>
<text x="640" y="1445" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">For M = 4, λ = 1 + 1/(2M) = 1.125 misses U₀, U₁, …, U₄.</text>
<text x="640" y="1490" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The same construction misses any finite subfamily: take its largest index M.</text>
<text x="640" y="1535" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">S is pointwise compact by CI7; its Zariski cover has no finite subcover.</text>
</svg>
