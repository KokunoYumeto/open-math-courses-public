<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1720" viewBox="0 0 1280 1720">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="36" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The projection kernel is the closed conductor</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T=A⊗_C K, π:T→B; J=ker π; Tr=1+σ.  KG1.</text>
<rect x="60" y="165.0" width="1160" height="230" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="200" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Tr:J≅I is an isometry; I is a closed ideal of both A and B.  KG2–KG5.</text>
<text x="640" y="275" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">IT=J⊕σ(J), a closed sum;  J σ(J)=0.</text>
<text x="640" y="350" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">I={c∈A : cB⊆A}={c∈A : cθ_B∈A}.  KG6.</text>
<text x="640" y="445" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">For the exact field-overlap target:  X_R affine ⇔ I=A.  KG7.</text>
<rect x="60" y="530.0" width="1160" height="270" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="560" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If I is proper: A′=A/I, B′=B/I, T′=T/IT=A′⊗_C K.  KG8.</text>
<text x="640" y="630" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A′⊆B′ is closed isometric; T′→B′ is injective with dense image.</text>
<text x="640" y="700" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">‖t′‖=max(‖π′t′‖, ‖π′σ(t′)‖).  KG9.</text>
<text x="640" y="765" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">These quotients are complete; uniformity is an additional question.</text>
<text x="640" y="875" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">An explicit uniformity counterexample without dense fields.  KG11–KG13.</text>
<rect x="60" y="940.0" width="1160" height="470" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="985" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">F=F₃((s)), L=F₉((s))=F(i), i²=−1; B₀=L⟨x⟩.</text>
<text x="640" y="1050" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A₀=F⟨x⟩+i x²F⟨x⟩; I₀=x²B₀ is its closed conductor.</text>
<text x="640" y="1115" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T₀=A₀⊗_F L ≅ {(h₁,h₂)∈B₀² : h₁≡h₂ mod x²}.</text>
<text x="640" y="1180" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A₀, B₀ and T₀ are uniform; T₀/A₀ is finite étale of rank2.</text>
<text x="640" y="1245" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A₀/I₀ ≅ F[ε]/(ε²),  B₀/I₀ ≅ T₀/I₀T₀ ≅ L[ε]/(ε²).</text>
<text x="640" y="1310" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">‖ε‖=1, ε²=0; the conductor quotients are not uniform.</text>
<text x="640" y="1380" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">‖x−c‖≥1 for every constant c∈L: the dense-field hypotheses fail.</text>
<text x="640" y="1510" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The actual conductor quotient is proved; no closed-image conclusion follows here.</text>
<text x="640" y="1585" font-family="Cambria,serif" font-size="24" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Uniformization must preserve a nonaffine witness before it can settle the original claim.</text>
<text x="640" y="1660" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The full raw-fibre theorem, including non-field overlaps and all raw bounds, remains open.</text>
</svg>
