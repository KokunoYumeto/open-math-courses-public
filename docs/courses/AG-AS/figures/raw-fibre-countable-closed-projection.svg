<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1510" viewBox="0 0 1280 1510">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="50" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Countable overlap fields: closed image is the exact test</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K countable, C=K^σ; completions A⊂B and T ≅ A ⊗_C K.</text>
<text x="640" y="180" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Assume the dense projection π: T → B has closed image, hence is onto.</text>
<rect x="60.0" y="245.0" width="550" height="350" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<rect x="670.0" y="245.0" width="550" height="350" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="335" y="285" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">If T were discrete</text>
<text x="335" y="350" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Dense K then equals T.</text>
<text x="335" y="410" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Onto π would make B countable.</text>
<text x="335" y="470" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">But B is complete, and aⁿ → 0, aⁿ ≠ 0.</text>
<text x="335" y="530" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Baire excludes countable B.</text>
<text x="945" y="285" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Therefore T is nondiscrete</text>
<text x="945" y="350" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Choose x∈K× with ‖x‖&lt;1.</text>
<text x="945" y="410" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">c=xσ(x)∈C×, ‖c‖≤‖x‖²&lt;1.</text>
<text x="945" y="470" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">c is a topologically nilpotent unit in A.</text>
<text x="945" y="530" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">This is FE7, in every characteristic.</text>
<text x="640" y="670" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">FE6: the explicit Baire and series argument makes π open.</text>
<text x="640" y="735" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">FE4: an open surjection forces the directional idempotent and affineness.</text>
<rect x="65.0" y="797.5" width="1150" height="145" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="830" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">X_R affine ⇔ π onto ⇔ π(T) closed in B.  FE8.</text>
<text x="640" y="905" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The converse follows from the isometric product T ≅ B × B.</text>
<text x="640" y="1010" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">FG: every nonaffine quadratic field-overlap target restricts to such a</text>
<text x="640" y="1060" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">countable CIC chart over a field finitely generated over its prime field.</text>
<text x="640" y="1130" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Thus universal closed image on this countable class is an exhaustive</text>
<text x="640" y="1180" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">test for the entire quadratic field-overlap class.</text>
<rect x="65.0" y="1285.0" width="1150" height="170" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="1315" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Remaining: prove closed image for these specific maps, or construct</text>
<text x="640" y="1370" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">an eligible nonaffine datum. Closed image is not assumed automatic.</text>
<text x="640" y="1425" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">General non-field overlaps and all larger raw bounds are still required.</text>
</svg>
