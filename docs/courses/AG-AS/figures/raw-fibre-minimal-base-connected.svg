<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1760" viewBox="0 0 1280 1760">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="36" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A minimal datum has connected fixed spectrum</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Suppose the minimal nonaffine datum of MN1–MN9 exists.</text>
<text x="640" y="175" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A⊆B is closed isometric; T=A⊗_C K —π→ B is injective and dense.</text>
<rect x="60" y="240.0" width="1160" height="250" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="270" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A nontrivial fixed idempotent would give component norms Nᵢ≤N*.</text>
<text x="640" y="340" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">At least one component stays nonaffine; minimality makes its projection isometric.</text>
<text x="640" y="410" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">That projection kills the other idempotent: a contradiction.  CB1–CB3.</text>
<text x="640" y="475" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Therefore M(A) is connected and has at least two points.</text>
<rect x="60" y="565.0" width="1160" height="190" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="585" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The finite étale rank2 alternative over connected A.  CB4–CB5.</text>
<text x="640" y="655" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Either T is connected, or T≅A×A isometrically with the maximum norm.</text>
<text x="640" y="725" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">In the split case σ exchanges the factors.</text>
<rect x="60" y="835.0" width="1160" height="360" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="870" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Split case: b₁=π(f), b₂=1−b₁; Bᵢ=bᵢB; φᵢ:A→Bᵢ.</text>
<text x="640" y="945" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Both φᵢ are injective and dense. A fixed Tate unit c∈C exists.</text>
<text x="640" y="1020" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If φ₁ were onto, open mapping would make its inverse continuous.</text>
<text x="640" y="1095" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Choose β₂∈M(B₂); γ=β₂∘φ₂∘φ₁⁻¹ is continuous on B₁.</text>
<text x="640" y="1170" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Powers of c prove γ≤1 on the entire unit ball of B₁.  CB7.</text>
<rect x="60" y="1260.0" width="1160" height="230" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1295" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The induced absolute value w on K satisfies w(R),w(σR)≤1.</text>
<text x="640" y="1365" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">But 0&lt;w(c)&lt;1. Its proper valuation ring would contain RσR=K.</text>
<text x="640" y="1440" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">Contradiction: both φᵢ have proper dense nonclosed image.  CB8–CB9.</text>
<text x="640" y="1550" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The connected-T case and the split case with two nonclosed maps remain unresolved.</text>
<text x="640" y="1630" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">No actual counterexample or universal affineness is concluded.</text>
<text x="640" y="1710" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Nonfield overlaps and the full raw topological-fibre bound remain open.</text>
</svg>
