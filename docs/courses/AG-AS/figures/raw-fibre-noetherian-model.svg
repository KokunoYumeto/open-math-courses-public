<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="65" font-family="Cambria,serif" font-size="48" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Rational configurations on a scheme model</text>
<text x="600" y="130" font-family="Cambria,serif" font-size="32" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T is integral, separated and Noetherian, with dim T ≥ 2.</text>
<text x="600" y="185" font-family="Cambria,serif" font-size="32" fill="#172b4d" text-anchor="middle" dominant-baseline="central">W_N parametrizes N distinct geometric lifts of the atlas.</text>
<rect x="55.0" y="260.0" width="450" height="160" rx="18" stroke="#b7c9da" stroke-width="3" fill="none"/>
<rect x="55.0" y="590.0" width="450" height="160" rx="18" stroke="#b7c9da" stroke-width="3" fill="none"/>
<rect x="55.0" y="925.0" width="450" height="170" rx="18" stroke="#b7c9da" stroke-width="3" fill="none"/>
<rect x="695.0" y="260.0" width="450" height="160" rx="18" stroke="#b7c9da" stroke-width="3" fill="none"/>
<rect x="695.0" y="590.0" width="450" height="160" rx="18" stroke="#b7c9da" stroke-width="3" fill="none"/>
<rect x="695.0" y="925.0" width="450" height="170" rx="18" stroke="#b7c9da" stroke-width="3" fill="none"/>
<text x="280" y="315" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">W_N ×_T V</text>
<text x="280" y="375" font-family="Cambria,serif" font-size="32" fill="#11643c" text-anchor="middle" dominant-baseline="central">rational point w</text>
<text x="920" y="315" font-family="Cambria,serif" font-size="32" fill="#172b4d" text-anchor="middle" dominant-baseline="central">W_N restricted to T1</text>
<text x="920" y="375" font-family="Cambria,serif" font-size="32" fill="#172b4d" text-anchor="middle" dominant-baseline="central">configuration above t</text>
<text x="280" y="645" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">V = p^-1(T1)</text>
<text x="280" y="710" font-family="Cambria,serif" font-size="32" fill="#11643c" text-anchor="middle" dominant-baseline="central">image point y</text>
<text x="920" y="645" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T1</text>
<text x="920" y="710" font-family="Cambria,serif" font-size="32" fill="#11643c" text-anchor="middle" dominant-baseline="central">image point t</text>
<text x="280" y="990" font-family="Cambria,serif" font-size="48" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Y</text>
<text x="280" y="1055" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Noetherian integral scheme</text>
<text x="920" y="990" font-family="Cambria,serif" font-size="48" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T</text>
<text x="920" y="1055" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Noetherian algebraic space</text>
<path d="M280,435 L280,575" fill="none" stroke="#165fa1" stroke-width="4"/>
<polygon points="280,575 270,557 290,557" fill="#165fa1"/>
<text x="355" y="505" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">étale</text>
<path d="M280,765 L280,910" fill="none" stroke="#11643c" stroke-width="4"/>
<polygon points="280,910 270,892 290,892" fill="#11643c"/>
<text x="385" y="840" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">open inclusion</text>
<path d="M920,435 L920,575" fill="none" stroke="#165fa1" stroke-width="4"/>
<polygon points="920,575 910,557 930,557" fill="#165fa1"/>
<text x="995" y="505" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">étale</text>
<path d="M920,765 L920,910" fill="none" stroke="#11643c" stroke-width="4"/>
<polygon points="920,910 910,892 930,892" fill="#11643c"/>
<text x="1025" y="840" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">open inclusion</text>
<path d="M525,340 L675,340" fill="none" stroke="#165fa1" stroke-width="4"/>
<polygon points="675,340 657,330 657,350" fill="#165fa1"/>
<text x="600" y="295" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">isomorphism</text>
<path d="M525,670 L675,670" fill="none" stroke="#11643c" stroke-width="4"/>
<polygon points="675,670 657,660 657,680" fill="#11643c"/>
<text x="600" y="625" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">isomorphism</text>
<path d="M525,1010 L675,1010" fill="none" stroke="#165fa1" stroke-width="4"/>
<polygon points="675,1010 657,1000 657,1020" fill="#165fa1"/>
<text x="600" y="965" font-family="Cambria,serif" font-size="32" fill="#165fa1" text-anchor="middle" dominant-baseline="central">p</text>
<path d="M60,1140 L1140,1140" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="600" y="1200" font-family="Cambria,serif" font-size="32" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p is proper, surjective and birational; dim Y ≥ 2.</text>
<text x="600" y="1265" font-family="Cambria,serif" font-size="32" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The scheme rational-lift lemma gives w over y in V.</text>
<text x="600" y="1330" font-family="Cambria,serif" font-size="40" fill="#11643c" text-anchor="middle" dominant-baseline="central">On V ≅ T1:   κ(w) = κ(y) = κ(t).</text>
<text x="600" y="1400" font-family="Cambria,serif" font-size="32" fill="#172b4d" text-anchor="middle" dominant-baseline="central">N distinct rational coordinates give N distinct raw points.</text>
<text x="600" y="1460" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">For N &gt; d this contradicts the original raw-fibre bound.</text>
</svg>
