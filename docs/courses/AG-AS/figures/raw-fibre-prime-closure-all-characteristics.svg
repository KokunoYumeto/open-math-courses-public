<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1840" viewBox="0 0 1280 1840">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Idempotents through ideal closures in every characteristic</text>
<text x="640" y="108" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A is complete, commutative and nonarchimedean; I is proper; J=closure(I).</text>
<rect x="60" y="160.0" width="1160" height="280" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">All maximal ideals are closed ⇒ J/I⊂Jac(A/I).  IC1.</text>
<text x="640" y="265" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For f̄ idempotent mod J: t=f²−f∈J; d=2f−1; d²=1+4t.</text>
<text x="640" y="335" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">d is invertible MODULO I. Choose g with v=gd−1∈I.</text>
<text x="640" y="405" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Neither d nor g is asserted invertible in A.</text>
<rect x="60" y="495.0" width="1160" height="280" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="530" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">FIRST fix g and G=N(g)&gt;0; choose ρ&gt;0 with Gρ&lt;1.</text>
<text x="640" y="600" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">THEN choose b∈I with r=t−b and G N(r)≤ρ.</text>
<text x="640" y="670" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Φ(w)=−g(r+w²) preserves N(w)≤ρ; Lipschitz constant≤Gρ&lt;1.</text>
<text x="640" y="740" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The fixed point w lies in closed J.  IC2.</text>
<rect x="60" y="825.0" width="1160" height="280" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="860" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">e=f+w:  e²−e=b−v(r+w²)∈I, and e+J=f̄.  IC3.</text>
<text x="640" y="935" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The error is in the ORIGINAL ideal I, not merely of seminorm zero.</text>
<text x="640" y="1010" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Idem(A/I) ≅ Idem(A/J); uniqueness uses J/I⊂Jac(A/I).  IC4.</text>
<text x="640" y="1080" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For prime P: A/closure(P) is connected, without claiming it is a domain.</text>
<rect x="60" y="1160.0" width="1160" height="260" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1195" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Now P is minimal in SC data; J=closure(P); H=(A/J)ᵘ≠0.</text>
<text x="640" y="1265" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Vᵢ=(Bᵢ/closure(PBᵢ))ᵘ≠0; UF2 keeps H connected.</text>
<text x="640" y="1335" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Use SPECTRAL quotient norms; literal quotient norms need not be uniform.</text>
<text x="640" y="1395" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">q′=max(q₁,q₂)≤q; equality is the stated norming condition.  IC5–IC6.</text>
<rect x="60" y="1460.0" width="1160" height="230" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1490" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">IF q′=q: the same-field quotient chart remains nonaffine.  IC7.</text>
<text x="640" y="1560" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">With the SAME original fixed c and minimal N*: equality forces P=0.</text>
<text x="640" y="1635" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">P≠0 minimal ⇒ some s∈C has q(s)&gt;max(q₁(s),q₂(s)).  IC8.</text>
<text x="640" y="1730" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">No general norm equality or domain reduction is proved.</text>
<text x="640" y="1795" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The original full raw-fibre cohomology assertion remains open.</text>
</svg>
