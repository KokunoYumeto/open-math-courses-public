<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1450" viewBox="0 0 1280 1450">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every module class has a structure-sheaf witness</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">X^# = Spec_X(O_X ⋉ F),    U^# = Spec(A ⋉ M),    M = Γ(U,f*F).</text>
<text x="640" y="165" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The second summands have square zero.</text>
<rect x="65" y="205.0" width="1150" height="330" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="300" y="265" font-family="Cambria,serif" font-size="42" fill="#165fa1" text-anchor="middle" dominant-baseline="central">U^#</text>
<text x="980" y="265" font-family="Cambria,serif" font-size="42" fill="#165fa1" text-anchor="middle" dominant-baseline="central">X^#</text>
<path d="M370,265 L900,265" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="900,265 882,255 882,275" fill="#165fa1"/>
<text x="640" y="230" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">surjective étale</text>
<path d="M300,310 L300,430" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="300,430 290,412 310,412" fill="#165fa1"/>
<path d="M980,310 L980,430" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="980,430 970,412 990,412" fill="#165fa1"/>
<text x="640" y="360" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">cartesian square</text>
<text x="640" y="405" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">vertical maps induce homeomorphisms</text>
<text x="300" y="480" font-family="Cambria,serif" font-size="42" fill="#165fa1" text-anchor="middle" dominant-baseline="central">U</text>
<text x="980" y="480" font-family="Cambria,serif" font-size="42" fill="#165fa1" text-anchor="middle" dominant-baseline="central">X</text>
<path d="M370,480 L900,480" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="900,480 882,470 882,490" fill="#165fa1"/>
<text x="640" y="450" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">original atlas f</text>
<text x="640" y="585" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Raw fibre sizes and geometric fibre sizes are unchanged.</text>
<rect x="65" y="640.0" width="1150" height="210" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="685" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">π_*O_X^# = O_X ⊕ F as modules</text>
<text x="640" y="750" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">H^q(X^#,O_X^#) = H^q(X,O_X) ⊕ H^q(X,F)</text>
<text x="640" y="810" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Each nonzero ξ maps to the nonzero class (0,ξ), in every degree.</text>
<rect x="65" y="910.0" width="1150" height="260" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="955" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Quadratic data:  A^# = A ⋉ M,  B^# = B ⋉ P,  σ^# = (σ,T).</text>
<text x="640" y="1010" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">(B^#)^σ^# = C ⋉ P^T</text>
<text x="640" y="1070" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">B^# / (ρ^#(A^#)+(B^#)^σ^#)</text>
<text x="640" y="1130" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">= B/(ρ(A)+C)  ⊕  P/(ι(M)+P^T)</text>
<path d="M65,1220 L1215,1220" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1270" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The universal scalar test includes all eligible spaces and their thickenings.</text>
<text x="640" y="1330" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Testing O_X on one fixed target does not test every quasi-coherent F.</text>
<text x="640" y="1400" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Exact proof: (SZ1)–(SZ8). Universal vanishing remains unproved.</text>
</svg>
