<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1880" viewBox="0 0 1280 1880">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="48" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Connected prime closures expose the quotient-norm gap</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Characteristic p; A is complete and commutative; P is prime; J=closure(P).</text>
<rect x="60" y="160.0" width="1160" height="260" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Lift an idempotent f̄ in A/J; choose b∈P with N(r)&lt;1, r=fᵖ−f−b.</text>
<text x="640" y="265" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">d=Σ r^(pⁿ) lies in J; dᵖ−d=−r; e=f+d has eᵖ−e=b∈P.</text>
<text x="640" y="335" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A/P is a domain ⇒ e mod P is c∈Fp ⇒ f̄ is0 or1.  PC1–PC2.</text>
<text x="640" y="395" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A/J is connected. Perfectness is not needed for this step.</text>
<rect x="60" y="475.0" width="1160" height="250" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="505" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Now A is perfect and N is a power norm: J is radical.</text>
<text x="640" y="575" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">H=A/J is complete, uniform and connected, with literal quotient norm q.  PC3.</text>
<text x="640" y="645" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For SC field data and minimal P: Vᵢ=Bᵢ/closure(PBᵢ) is nonzero and uniform.</text>
<text x="640" y="705" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">qᵢ(h)=‖image of h in Vᵢ‖ may have a kernel on H.  PC4.</text>
<rect x="60" y="775.0" width="1160" height="220" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="810" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">q′=max(q₁,q₂)≤q.</text>
<text x="640" y="885" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">q′=q ⇔ (D₁∪D₂)∩ZP is norming on ZP=M(H).  PC5.</text>
<text x="640" y="960" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">This norming equality is a hypothesis in the next implication.</text>
<rect x="60" y="1055.0" width="1160" height="250" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1085" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">ASSUME q′=q.  On the same field K: N_P(y)=max(q₁(y),q₂(σy)).</text>
<text x="640" y="1155" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The new chart contains the old chart; its mixed ring remains K.  PC6.</text>
<text x="640" y="1225" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">H embeds as a closed isometric diagonal in V₁×V₂.</text>
<text x="640" y="1285" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A twisted root outside that diagonal gives a new nonzero H¹ class.  PC7.</text>
<text x="640" y="1340" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Connectedness excludes an interpolating idempotent; separate qᵢ need not be faithful.</text>
<rect x="60" y="1400.0" width="1160" height="260" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1435" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If the old N* is MN-minimal on the SAME K with the SAME fixed parameter c:</text>
<text x="640" y="1505" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">N_P≤N* and nonaffineness ⇒ N_P=N* ⇒ A→H is isometric ⇒ J=P=0.</text>
<text x="640" y="1580" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Hence P≠0 minimal ⇒ some h satisfies q(h)&gt;max(q₁(h),q₂(h)).  PC8.</text>
<text x="640" y="1640" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A putative minimal counterexample has domain A or these strict quotient gaps.</text>
<text x="640" y="1730" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">No general quotient-norm equality or domain reduction is proved.</text>
<text x="640" y="1800" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The full raw-fibre cohomology assertion remains open.</text>
</svg>
