<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="1370" viewBox="0 0 2250 1370">
<rect width="100%" height="100%" fill="white"/>
<text x="1125" y="75" fill="#172b4d" font-family="Cambria,serif" font-size="54" text-anchor="middle" dominant-baseline="central">One raw lift, two geometric lifts</text>
<text x="1125" y="145" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">V = R[[x]] + y R((x))[[y]],    with the lexicographic rank-two valuation</text>
<text x="1125" y="205" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">Spec V[i]  →  Spec V is finite étale of degree 2;  i² = −1.</text>
<text x="420" y="290" fill="#172b4d" font-family="Cambria,serif" font-size="42" text-anchor="middle" dominant-baseline="central">Spec V</text>
<text x="1380" y="290" fill="#172b4d" font-family="Cambria,serif" font-size="42" text-anchor="middle" dominant-baseline="central">Spec V[i]</text>
<text x="1950" y="280" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">Geometric fibre</text>
<text x="1950" y="327" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">over each base point</text>
<circle cx="420" cy="410" r="12" fill="#165fa1"/>
<text x="420" y="459" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">(0)</text>
<text x="420" y="505" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">Residue field: K = R((x))((y))</text>
<circle cx="1380" cy="410" r="12" fill="#165fa1"/>
<text x="1380" y="459" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">q(0)</text>
<text x="1380" y="505" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">Residue field: K(i)</text>
<path d="M1270,410 L640,410" stroke="#165fa1" stroke-width="4" fill="none"/>
<polygon points="640,410 658,400 658,420" fill="#165fa1"/>
<text x="950" y="374" fill="#165fa1" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">one raw point</text>
<circle cx="1900" cy="410" r="12" fill="#9c4c09"/>
<circle cx="2010" cy="410" r="12" fill="#9c4c09"/>
<text x="1955" y="468" fill="#9c4c09" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">two distinct points</text>
<circle cx="420" cy="645" r="12" fill="#165fa1"/>
<text x="420" y="694" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">P = y R((x))[[y]]</text>
<text x="420" y="740" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">Residue field: R((x))</text>
<circle cx="1380" cy="645" r="12" fill="#165fa1"/>
<text x="1380" y="694" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">q(P)</text>
<text x="1380" y="740" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">Residue field: R((x))(i)</text>
<path d="M1270,645 L640,645" stroke="#165fa1" stroke-width="4" fill="none"/>
<polygon points="640,645 658,635 658,655" fill="#165fa1"/>
<text x="950" y="609" fill="#165fa1" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">one raw point</text>
<circle cx="1900" cy="645" r="12" fill="#9c4c09"/>
<circle cx="2010" cy="645" r="12" fill="#9c4c09"/>
<text x="1955" y="703" fill="#9c4c09" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">two distinct points</text>
<circle cx="420" cy="880" r="12" fill="#165fa1"/>
<text x="420" y="929" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">m = xV</text>
<text x="420" y="975" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">Residue field: R</text>
<circle cx="1380" cy="880" r="12" fill="#165fa1"/>
<text x="1380" y="929" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">q(m)</text>
<text x="1380" y="975" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">Residue field: C</text>
<path d="M1270,880 L640,880" stroke="#165fa1" stroke-width="4" fill="none"/>
<polygon points="640,880 658,870 658,890" fill="#165fa1"/>
<text x="950" y="844" fill="#165fa1" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">one raw point</text>
<circle cx="1900" cy="880" r="12" fill="#9c4c09"/>
<circle cx="2010" cy="880" r="12" fill="#9c4c09"/>
<text x="1955" y="938" fill="#9c4c09" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">two distinct points</text>
<path d="M420,530 L420,607" stroke="#4a5568" stroke-width="4" fill="none"/>
<polygon points="420,607 410,589 430,589" fill="#4a5568"/>
<path d="M420,765 L420,842" stroke="#4a5568" stroke-width="4" fill="none"/>
<polygon points="420,842 410,824 430,824" fill="#4a5568"/>
<path d="M1380,530 L1380,607" stroke="#4a5568" stroke-width="4" fill="none"/>
<polygon points="1380,607 1370,589 1390,589" fill="#4a5568"/>
<path d="M1380,765 L1380,842" stroke="#4a5568" stroke-width="4" fill="none"/>
<polygon points="1380,842 1370,824 1390,824" fill="#4a5568"/>
<text x="100" y="650" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="start" dominant-baseline="central">Specialization</text>
<path d="M100,1020 L2150,1020" stroke="#cbd5e0" stroke-width="2" fill="none"/>
<text x="1125" y="1080" fill="#172b4d" font-family="Cambria,serif" font-size="36" text-anchor="middle" dominant-baseline="central">The principal prime m = (x) has height 2: the Noetherian height argument fails.</text>
<text x="1125" y="1140" fill="#172b4d" font-family="Cambria,serif" font-size="32" text-anchor="middle" dominant-baseline="central">Every displayed residue field on the left is orderable; none contains i.</text>
<text x="1125" y="1200" fill="#172b4d" font-family="Cambria,serif" font-size="32" text-anchor="middle" dominant-baseline="central">Both Spec V and its punctured spectrum D(x) = Spec R((x))[[y]] are affine.</text>
<text x="1125" y="1270" fill="#165fa1" font-family="Cambria,serif" font-size="32" text-anchor="middle" dominant-baseline="central">Thus H^q(F) = 0 for q &gt; 0 and every quasi-coherent F on either target.</text>
<text x="1125" y="1320" fill="#4a5568" font-family="Cambria,serif" font-size="28" text-anchor="middle" dominant-baseline="central">This example obstructs a proof reduction; it is not a counterexample to cohomological vanishing.</text>
</svg>
