<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Compact Gauss families have full Shilov boundary</text>
<text x="640" y="100" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">L=F(Tᵢ); F has a nontrivial absolute value; S⊂Rᴵ is nonempty and compact.</text>
<rect x="60" y="145" width="1160" height="200" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="185" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For every monomial term m of P: |m/P|w≤1 on S.</text>
<text x="640" y="245" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Bounded α gives α(m)≤α(P); the triangle bound gives equality with the maximum.</text>
<text x="640" y="305" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Thus α(P)=max α(m): every bounded seminorm on the completion A is Gauss.</text>
<text x="640" y="395" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Finite-coordinate rational tents exclude every weight outside S.  GG3–GG5.</text>
<text x="640" y="440" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Example: S=([−2,−1]∪[1,2])×[−1/2,1/2]; v=(0,0) is outside S.</text>
<rect x="260" y="570.0" width="190" height="160.0" fill="#d7e9fa" stroke="#547ca0" stroke-width="2"/>
<rect x="830" y="570.0" width="190" height="160.0" fill="#d7e9fa" stroke="#547ca0" stroke-width="2"/>
<polyline points="140,650 1140,650" fill="none" stroke="#44566b" stroke-width="2"/>
<polyline points="640,510 640,790" fill="none" stroke="#44566b" stroke-width="2"/>
<polyline points="260,643 260,657" fill="none" stroke="#44566b" stroke-width="2"/>
<text x="260" y="767" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">-2</text>
<polyline points="450,643 450,657" fill="none" stroke="#44566b" stroke-width="2"/>
<text x="450" y="767" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">-1</text>
<polyline points="830,643 830,657" fill="none" stroke="#44566b" stroke-width="2"/>
<text x="830" y="767" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">1</text>
<polyline points="1020,643 1020,657" fill="none" stroke="#44566b" stroke-width="2"/>
<text x="1020" y="767" font-family="Cambria,serif" font-size="22" fill="#172b4d" text-anchor="middle" dominant-baseline="central">2</text>
<text x="355.0" y="555" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">S₁</text>
<text x="925.0" y="555" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">S₂</text>
<circle cx="640" cy="650" r="7" fill="#a1371a"/>
<text x="675" y="690" font-family="Cambria,serif" font-size="28" fill="#a1371a" text-anchor="middle" dominant-baseline="central">v</text>
<text x="1140" y="612" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">w₁</text>
<text x="675" y="502" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">w₂</text>
<text x="640" y="818" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">h=T₁⁴T₂⁴ / ((T₁⁴+1)²(T₂⁴+1)²)</text>
<text x="640" y="867" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">log|h|w=−4(|w₁|+|w₂|);  |h|v=1,  N(h)=exp(−4).</text>
<text x="640" y="930" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Slice w₂=0: the tent strictly separates v from this compact family.</text>
<rect x="260" y="1010" width="190" height="184" fill="#edf5fc" stroke="#d5e2ed" stroke-width="2"/>
<rect x="830" y="1010" width="190" height="184" fill="#edf5fc" stroke="#d5e2ed" stroke-width="2"/>
<polyline points="140,1010 1140,1010" fill="none" stroke="#44566b" stroke-width="2"/>
<polyline points="640,1212.4 640,1003.1" fill="none" stroke="#44566b" stroke-width="2"/>
<polyline points="184.0,1230.8 640,1010 1096.0,1230.8" fill="none" stroke="#a1371a" stroke-width="4"/>
<polyline points="150,1102 1130,1102" fill="none" stroke="#547ca0" stroke-width="2"/>
<text x="1005" y="1073" font-family="Cambria,serif" font-size="24" fill="#416b8f" text-anchor="middle" dominant-baseline="central">maximum on S: −4</text>
<text x="680" y="975" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">log|h|</text>
<text x="640" y="1248" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For every proper closed D⊂S, a finite projection and a rational tent detect S\D.</text>
<text x="640" y="1307" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Therefore M(A)=∂A=S, even for infinitely many variables and an infinite boundary.</text>
<rect x="60" y="1350" width="1160" height="160" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="1387" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">In characteristic p, perfecting the dense field preserves this full boundary.</text>
<text x="640" y="1446" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For an exact quadratic field-overlap datum with this fixed norm: X is affine.  GG7.</text>
<text x="640" y="1565" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Arbitrary valuation families and the general raw-fibre assertion remain open.</text>
</svg>
