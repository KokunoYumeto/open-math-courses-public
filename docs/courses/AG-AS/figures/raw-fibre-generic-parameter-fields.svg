<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1960" viewBox="0 0 1280 1960">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="46" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Generic parameters give the split criterion in every characteristic</text>
<text x="640" y="108" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A separable complete uniform ring: a Q-algebra in char0, perfect in char p.</text>
<rect x="60" y="165.0" width="1160" height="230" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Input: dense units; N=max(M₁,M₂); faithful norms; D₁∩D₂=∅.  GP1.</text>
<text x="640" y="270" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">An actual unit c₀ satisfies Mⱼ(c₀x)=τ Mⱼ(x), 0&lt;τ&lt;1.</text>
<text x="640" y="345" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Polynomial unit values are dense over Q or a perfect field.  GP2.</text>
<rect x="60" y="445.0" width="1160" height="230" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="475" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Choose generic a with N(a−c₀)&lt;τ; u=c₀⁻¹a lies in1+small elements.</text>
<text x="640" y="550" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">u and u⁻¹ have norm≤1 for both norms ⇒ u acts isometrically.</text>
<text x="640" y="625" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Thus a is transcendental and keeps EXACT homogeneity τ.  GP3.</text>
<rect x="60" y="715.0" width="1160" height="250" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="745" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Char≠2: θ²=1+aⁿ near1, with n prime to p when p&gt;0.</text>
<text x="640" y="820" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Char2: θ=Σ a^(2ʳ), so θ²−θ=a and σθ=θ+1.  GP4.</text>
<text x="640" y="895" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Baire constructs dense C and an embedded K/C of degree2, with a∈C.  GP5.</text>
<text x="640" y="940" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Normalize τ to1/2; SC gives a raw-one target and a conditional H¹ class.  GP6.</text>
<rect x="60" y="1030.0" width="1160" height="240" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1055" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Converse: retain c, a scalar obstruction and a root-approximation sequence.</text>
<text x="640" y="1130" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The resulting COUNTABLE exact field datum stays nonaffine and split.  GP7.</text>
<text x="640" y="1205" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">In char p, perfect the field/chart; Y∞→Y₀ is integral and surjective.</text>
<text x="640" y="1250" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Affineness is equivalent; survival of the old H¹ class is not asserted.  GP8–GP9.</text>
<rect x="60" y="1340.0" width="1160" height="250" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1368" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Minimize using the SAME fixed parameter c of value1/2.</text>
<text x="640" y="1443" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Split root + inverse discriminant persist through the map of completions.</text>
<text x="640" y="1518" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Zero conductor gives faithful norm factors; the mixed graph separates D₁,D₂.</text>
<text x="640" y="1570" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The fixed completion is connected, separable, and perfect in char p.  GP10.</text>
<text x="640" y="1680" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">Existence of the analytic input ⇔ existence of a split nonaffine field datum.</text>
<text x="640" y="1750" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Its Shilov boundary must be infinite and proper; no input is exhibited.</text>
<text x="640" y="1845" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The general connected-joint, nonfield and higher-bound assertions remain open.</text>
</svg>
