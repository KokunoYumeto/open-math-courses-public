<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1320" viewBox="0 0 1280 1320">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A finite witness for every nonzero quadratic obstruction</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">P = B ⊗_A M,  T² = 1 semilinearly,  C = B^σ;  ι : M → P.</text>
<rect x="70" y="160.0" width="1140" height="150" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Begin with [p] ≠ 0 in H¹(X,F) = P / (ι(M) + P^T).</text>
<text x="640" y="260" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">P₀ = Bp + BT(p) is finite over B and stable under T.</text>
<path d="M640,330 L640,380" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,380 630,362 650,362" fill="#165fa1"/>
<rect x="70" y="400.0" width="1140" height="170" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="435" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">M′ = {m ∈ M : ι(m) ∈ P₀}</text>
<text x="640" y="490" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Flat open restriction gives B ⊗_A M′ ≅ P₀.</text>
<text x="640" y="540" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Choose finitely many elements of M′ whose restrictions generate P₀.</text>
<path d="M640,590 L640,640" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,640 630,622 650,622" fill="#165fa1"/>
<rect x="70" y="660.0" width="1140" height="170" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="695" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Their finite A-span M₀ satisfies B ⊗_A M₀ ≅ P₀.</text>
<text x="640" y="750" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">T|P₀ descends to a finite-type subsheaf F₀ ⊂ F.</text>
<text x="640" y="800" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Faithfully flat descent also makes N₀ = P₀^T finite over C.</text>
<path d="M640,850 L640,900" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,900 630,882 650,882" fill="#165fa1"/>
<rect x="70" y="920.0" width="1140" height="190" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="955" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">[p] ∈ P₀ / (ι(M₀) + P₀^T) = H¹(X,F₀)</text>
<text x="640" y="1015" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Its image is the original nonzero class, so this finite witness is nonzero.</text>
<text x="640" y="1075" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">No finite presentation, freeness or Noetherian hypothesis is required.</text>
<path d="M70,1155 L1210,1155" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1200" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">All such finite-type subsheaves form a directed union equal to F.</text>
<text x="640" y="1265" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Proof: (FW1)–(FW8). Universal vanishing in (QE5) remains unproved.</text>
</svg>
