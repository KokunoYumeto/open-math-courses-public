<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1450" viewBox="0 0 1280 1450">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Field overlaps: complete integral closure of the chart</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K = A_a,   D = image(A → K),   C = K^σ;   D σ(D) = K.</text>
<rect x="65" y="160.0" width="1150" height="180" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">A → D ⊆ N = integral closure of D in K</text>
<text x="640" y="255" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">X_A affine  ⇔  X_D affine  ⇔  X_N affine</text>
<text x="640" y="310" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Schematic overlap, then integral surjective descent; CI1–CI2.</text>
<path d="M640,365 L640,415" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,415 630,397 650,397" fill="#165fa1"/>
<rect x="65" y="435.0" width="1150" height="190" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="470" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">R = complete integral closure of N in K</text>
<text x="640" y="530" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">aR ⊆ N ⊆ R,    a^(n+1)R ⊆ a^nN ⊆ a^nR</text>
<text x="640" y="590" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For x ∈ R, some (ax)^m ∈ N; normality gives ax ∈ N.  CI3–CI4.</text>
<path d="M640,650 L640,700" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,700 630,682 650,682" fill="#165fa1"/>
<rect x="65" y="720.0" width="1150" height="190" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="755" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The two chart topologies agree; density of C is equivalent.</text>
<text x="640" y="815" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">X_A affine  ⇔  X_R affine</text>
<text x="640" y="875" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R is a proper completely integrally closed Goldman domain.  CI5.</text>
<text x="640" y="960" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R = intersection of all rank-one valuation rings V containing N.  CI6.</text>
<rect x="65" y="1015.0" width="1150" height="150" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="1050" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Normalize v(a)=1.  The family S is compact for pointwise convergence.</text>
<text x="640" y="1110" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Exact test:  ∀ b∈K, n≥0  ∃ c∈C  ∀ v∈S:  v(b−c)≥n.  CI7.</text>
<path d="M65,1210 L1215,1210" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1255" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The reduction preserves affineness and universal H¹ vanishing.</text>
<text x="640" y="1300" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Individual sheaf cohomology groups and witness exponents may change.</text>
<text x="640" y="1355" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Pointwise compactness supplies no simultaneous-approximation theorem.</text>
<text x="640" y="1405" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">CI7 is an equivalence; universal density remains unproved.</text>
</svg>
