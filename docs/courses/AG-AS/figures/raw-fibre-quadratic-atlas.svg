<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1300" viewBox="0 0 1280 1300">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Quadratic raw-size-one atlases: an exact normal form</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">f : U = Spec A → X is étale and onto; X is qc and separated.</text>
<text x="640" y="170" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Raw fibres: one point. Geometric fibres: at most two points.</text>
<rect x="75.0" y="225.0" width="1130" height="210" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="270" font-family="Cambria,serif" font-size="42" fill="#165fa1" text-anchor="middle" dominant-baseline="central">R = U ×ₓ U = Δ(U) ⨿ Γτ(V)</text>
<text x="640" y="335" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R ∖ Δ(U) is affine; each projection is an open immersion.</text>
<text x="640" y="395" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">V is affine open in U; τ² = 1 and Γτ is closed in U × U.</text>
<path d="M640,460 L640,510" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,510 630,492 650,492" fill="#165fa1"/>
<text x="640" y="550" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">τ fixes every raw point of V and no geometric point.</text>
<text x="640" y="610" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The converse data recover exactly the same class of atlases.</text>
<rect x="75.0" y="665.0" width="1130" height="200" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="710" font-family="Cambria,serif" font-size="42" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Y = U₁ ∪ᵥ,τ U₂  →  X = Y/(Z/2)</text>
<text x="640" y="770" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The chart exchange is free; π : Y → X is finite étale of rank two.</text>
<text x="640" y="830" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">X affine  ⇔  Y affine</text>
<path d="M640,890 L640,935" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,935 630,917 650,917" fill="#165fa1"/>
<text x="640" y="980" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">H¹(Y,E) = C_M / (ι_M(M) + α(ι_N(N)))</text>
<text x="640" y="1040" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">C_M = B ⊗_(A,ρ) M;  α : B ⊗_(A,σρ) N ≅ C_M.</text>
<text x="640" y="1100" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">H¹(X,π_*E) is this same quotient; every QC sheaf E is included.</text>
<path d="M65,1140 L1215,1140" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1190" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">No principal-open, injective-localization or global quadratic-generator assumption.</text>
<text x="640" y="1250" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Exact reduction: (QN1)–(QN9). It does not assert that the obstruction vanishes.</text>
</svg>
