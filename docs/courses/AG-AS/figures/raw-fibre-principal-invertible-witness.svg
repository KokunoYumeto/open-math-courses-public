<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1370" viewBox="0 0 1280 1370">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Principal overlaps: an exhaustive line-bundle test</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B = A_a,  r = ρ(a),  s = σ(r),  C = B^σ;  n ≥ 0.</text>
<rect x="65" y="160.0" width="1150" height="180" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="195" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">L_n = L_1^⊗n,    T_n(t) = (s/r)^n σ(t)</text>
<text x="640" y="255" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">H¹(X,L_n) = Q_n = B / (r^n ρ(A) + C)</text>
<text x="640" y="310" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The chart module is A; its invariant module is r^(−n) C.</text>
<path d="M640,365 L640,415" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,415 630,397 650,397" fill="#165fa1"/>
<rect x="65" y="435.0" width="1150" height="190" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="470" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For arbitrary F:  P = B ⊗_A M,   N = P^T,   B ⊗_C N ≅ P.</text>
<text x="640" y="530" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Write p = Σ b_j v_j with v_j ∈ N.</text>
<text x="640" y="590" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">One exponent n clears every v_j:   r^n v_j = ι(m_j).</text>
<path d="M640,650 L640,700" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,700 630,682 650,682" fill="#165fa1"/>
<rect x="65" y="720.0" width="1150" height="190" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="755" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">φ_j : L_n → F,    1 ↦ m_j on the chart</text>
<text x="640" y="815" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Q_n → H¹(X,F),    [b] ↦ [b v_j]</text>
<text x="640" y="875" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The maps descend by T(r^n t v_j) = r^n T_n(t) v_j.</text>
<text x="640" y="955" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every class is a finite sum of these images; a nonzero sum has a nonzero term.</text>
<rect x="65" y="1005.0" width="1150" height="150" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="640" y="1040" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">X affine  ⇔  H¹(X,F)=0 for every quasi-coherent F</text>
<text x="640" y="1100" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">⇔  Q_n=0 for every n≥0  ⇔  B = r^n ρ(A) + C for every n≥0</text>
<path d="M65,1200 L1215,1200" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1245" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A field overlap is automatically principal: the test is density of K^σ in K.</text>
<text x="640" y="1290" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Neighborhoods at zero are ρ(a)^n ρ(A); no Hausdorff assumption is used.</text>
<text x="640" y="1340" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Proof: (PW1)–(PW7). Universal passing of the scalar test remains unproved.</text>
</svg>
