<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1690" viewBox="0 0 1280 1690">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="50" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Quadratic field charts: completion and a state alternative</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R ⊊ K = R[1/a],  R completely integrally closed,  Rσ(R) = K.</text>
<rect x="65" y="150.0" width="1150" height="200" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="185" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">C = K^σ;   A = completed C;   B = chart completion of K.</text>
<text x="640" y="245" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">T = joint completion ≅ A ⊗_C K: finite etale of rank 2.  FE1–FE2.</text>
<text x="640" y="310" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A is closed in B and T.  The map π: T → B is continuous with dense image.</text>
<text x="640" y="400" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">‖t‖ = max(|π(t)|_B, |π(σt)|_B).  FE3.</text>
<text x="640" y="465" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">Assume π is an OPEN SURJECTION.</text>
<rect x="65" y="515.0" width="1150" height="300" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="550" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">J = ker π.   If J + σJ were proper, set Q = T / closure(J + σJ).</text>
<text x="640" y="610" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Openness gives continuous factor maps B → Q in both directions.</text>
<text x="640" y="670" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">aᴺR is uniformly small in B ⇒ q(R) and q(σR) are bounded in Q.</text>
<text x="640" y="730" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Every x∈K is Σ rᵢσ(sᵢ) ⇒ ‖q(x)‖_Q ≤ M₁M₂.  FE5.</text>
<text x="640" y="790" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">But q(aⁿ) → 0 and q(a⁻ⁿ) stays bounded: 1 = q(aⁿ)q(a⁻ⁿ), impossible.</text>
<text x="640" y="875" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">Therefore J + σJ = T,   T ≅ B × B,   e ↦ (0,1).</text>
<text x="640" y="935" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">e² = e,  σ(e) = 1−e,  |e|_S = 0 ⇒ X_R affine.  JC1, FE4.</text>
<path d="M65,995 H1215" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1050" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Exact criterion:  X_R affine ⇔ A = B ⇔ π is an open surjection.</text>
<text x="640" y="1110" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If A has a topologically nilpotent unit: closed image ⇒ open surjection.</text>
<text x="640" y="1160" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Baire and geometric-series lifting prove this conditional implication.  FE6.</text>
<path d="M65,1210 H1215" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1265" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A competing exact certificate for nonaffineness.  PS1.</text>
<text x="640" y="1325" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">fₓ(v) = v(x) − v(σx),   Λ(1)=1,   Λ(g)≥0 for g≥0,   Λ(fₓ)=0.</text>
<text x="640" y="1380" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Ordered extension constructs Λ exactly when no reciprocal uniform gauge exists.</text>
<text x="640" y="1430" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A point evaluation is excluded; a general positive functional is not a valuation.</text>
<rect x="65" y="1480.0" width="1150" height="170" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="1515" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Remaining: prove π open and onto, or construct an eligible nonaffine datum.</text>
<text x="640" y="1570" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Neither closed image nor a topologically nilpotent unit in A is assumed automatic.</text>
<text x="640" y="1625" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The full raw bound also requires non-field overlaps and higher degrees.</text>
</svg>
