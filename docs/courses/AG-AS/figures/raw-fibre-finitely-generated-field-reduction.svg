<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1460" viewBox="0 0 1280 1460">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="50" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Field-overlap counterexamples reduce to countable charts</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">After CI: R is proper and completely integrally closed; K = R[1/a].</text>
<rect x="65" y="152.5" width="1150" height="185" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="185" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Closed graph:  1/a = Σ dᵢ σ(eᵢ),   dᵢ,eᵢ ∈ R.  FG1–FG3.</text>
<text x="640" y="245" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Nonzero witness:  b ∉ aⁿR + C,   C = K^σ.  FG2.</text>
<text x="640" y="305" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Choose θ with σ(θ) ≠ θ; retain a, b and every identity coefficient.</text>
<path d="M640,355 L640,405" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,405 630,389 650,389" fill="#165fa1"/>
<rect x="65" y="427.5" width="1150" height="185" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="460" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">K₀ = k(a, b, θ, dᵢ, eᵢ, all their conjugates).  FG4.</text>
<text x="640" y="520" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">R₀ = R ∩ K₀,   C₀ = K₀^σ;   R₀[1/a] = K₀.</text>
<text x="640" y="580" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R₀ remains proper and completely integrally closed; R₀ σ(R₀) = K₀.</text>
<path d="M640,630 L640,680" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="640,680 630,664 650,664" fill="#165fa1"/>
<rect x="65" y="702.5" width="1150" height="195" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="735" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The converse QN construction gives an actual separated target X₀.</text>
<text x="640" y="795" font-family="Cambria,serif" font-size="34" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">0 ≠ [b] ∈ K₀ / (aⁿR₀ + C₀) = H¹(X₀, L₀,ₙ).  FG5.</text>
<text x="640" y="855" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The same scalar and exponent survive; raw size 1, geometric size ≤ 2.</text>
<text x="640" y="950" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K₀ and R₀ are countable; the entire normalized S₀ is compact metrizable</text>
<text x="640" y="995" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">for pointwise convergence.  No Zariski compactness follows.  FG6.</text>
<path d="M65,1050 L1215,1050" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1110" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The finite identity also supplies norm-one elements qᵢ = eᵢ/σ(eᵢ).</text>
<text x="640" y="1170" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">For every v ∈ S, some i has v(qᵢ) ≥ 1.  FG7.</text>
<text x="640" y="1230" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">One q positive at every v would give a cofinal Jacobson gauge and affineness.</text>
<rect x="65" y="1285.0" width="1150" height="130" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="1320" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Remaining step: combine the finite positivity cover using the field hypotheses.</text>
<text x="640" y="1375" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">No such uniform combination, or actual counterexample, is asserted here.</text>
</svg>
