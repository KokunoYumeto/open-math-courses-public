<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1240" viewBox="0 0 1280 1240">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Reciprocal parameters force affineness</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">First adjoin i finitely; write A for A[i] in the two new charts Y′.</text>
<text x="640" y="165" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B = A[1/a],  σ(a) = a⁻¹;  c = 1+i,  c σ(c) = 2.</text>
<text x="640" y="220" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A σ-fixed prime cannot contain a−c: that would give 1 = 2.</text>
<text x="640" y="280" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">u = 1/(a−c),     v = a/(1−σ(c)a) = σ(u)</text>
<rect x="55.0" y="330.0" width="550" height="310" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<rect x="675.0" y="330.0" width="550" height="310" rx="18" fill="none" stroke="#b7c9da" stroke-width="3"/>
<text x="330" y="375" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">First chart: Spec A</text>
<text x="330" y="440" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">u is a unit on this whole chart.</text>
<text x="330" y="505" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">D(v) = D(a) = Spec B.</text>
<text x="330" y="575" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Outside the overlap: v = 0.</text>
<text x="950" y="375" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Second chart: Spec σ(A)</text>
<text x="950" y="440" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">v is a unit on this whole chart.</text>
<text x="950" y="505" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">D(u) = D(σ(a)) = Spec B.</text>
<text x="950" y="575" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Outside the overlap: u = 0.</text>
<path d="M330,665 L330,725" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="330,725 320,707 340,707" fill="#165fa1"/>
<path d="M950,665 L950,725" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="950,725 940,707 960,707" fill="#165fa1"/>
<text x="640" y="770" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">u,v ∈ R = A ∩ σ(A),     1 = −cu − σ(c)v − uv.</text>
<text x="640" y="835" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The identity makes D(u),D(v) cover Spec R.</text>
<text x="640" y="895" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R_u = A,     R_v = σ(A),     R_uv = B.</text>
<text x="640" y="960" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">The standard affine charts glue to Y′ = Spec R.</text>
<path d="M65,1015 L1215,1015" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1065" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Finite surjections Y′ → Y → X descend affineness.</text>
<text x="640" y="1120" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Thus B/(A + b σ(A)) = 0 for every overlap unit b.</text>
<text x="640" y="1180" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Exact construction: (RP1)–(RP4). No Noetherian hypothesis or dimension bound is used.</text>
</svg>
