<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A raw-size-one affine atlas with no global linear trace</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">D=Z_(5), L=Q(i), λ=2+i, μ=2−i, A=D[i,1/μ].  FT1.</text>
<rect x="60" y="160.0" width="1160" height="220" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="200" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Spec A → Spec D: affine, surjective, étale, finitely presented.</text>
<text x="640" y="265" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Generic fibre: Spec Q(i) → Spec Q; one raw point, geometric size2.</text>
<text x="640" y="330" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Closed fibre: Spec F₅ → Spec F₅; one raw point, geometric size1.</text>
<text x="640" y="430" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The finite closure D[i] also has the prime (μ); inverting μ removes it.</text>
<text x="640" y="485" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The rank drops2→1: this atlas is not finite.  FT3.</text>
<rect x="60" y="550.0" width="1160" height="270" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="590" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every Q-linear functional on L is Tr(c·−), c∈L.</text>
<text x="640" y="655" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Tr(c μ⁻ⁿ)=c μ⁻ⁿ+σ(c) λ⁻ⁿ; σ(i)=−i.  FT4.</text>
<text x="640" y="720" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">For c≠0 and n large: v₅(Tr(c μ⁻ⁿ))=v_λ(σ(c))−n&lt;0.</text>
<text x="640" y="780" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Thus Hom_D(A,D)=0; in particular D→A has no linear retraction.  FT2.</text>
<text x="640" y="870" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For the generic trace: Tr(μ⁻¹)=4/5, Tr(μ⁻²)=6/25, Tr(μ⁻³)=4/125.</text>
<rect x="60" y="930.0" width="1160" height="220" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="965" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">Affineness is consistent with a different, exact mechanism.  FT6–FT7.</text>
<text x="640" y="1025" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A⊗_D A ≅ A×L; choose r_N≡3 mod5, r_N²+1≡0 mod5ᴺ.</text>
<text x="640" y="1085" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">v_λ(i−r_N)≥N; subtracting (a+b r_N)/5ᴺ gives L=A+Q.</text>
<text x="640" y="1220" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">The target is affine. This is not a counterexample to raw-fibre vanishing.</text>
</svg>
