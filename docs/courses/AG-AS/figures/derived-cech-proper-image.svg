<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="1350" viewBox="0 0 2250 1350">
<title>Finite derived descent for proper direct image</title>
<desc>A derived base-change square preserves Tor. A finite affine cover gives the uniform bound d=n−1. Truncation at r=q−d gives precisely the information needed for sections in degrees at least q.</desc>
<rect width="2250" height="1350" fill="#f7fafc"/>
<text x="1125" y="65" font-family="Cambria, serif" font-size="55" fill="#17334d" text-anchor="middle" dominant-baseline="central">Finite derived descent for proper direct image</text>
<rect x="45" y="135" width="2160" height="365" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="430" y="210" font-family="Cambria, serif" font-size="49" fill="#17334d" text-anchor="middle" dominant-baseline="central">Y_A</text>
<text x="1060" y="210" font-family="Cambria, serif" font-size="49" fill="#17334d" text-anchor="middle" dominant-baseline="central">Y_λ</text>
<line x1="535" y1="210" x2="950" y2="210" stroke="#345b78" stroke-width="5"/><polygon points="950,210 928.0,200.0 928.0,220.0" fill="#345b78"/>
<text x="430" y="425" font-family="Cambria, serif" font-size="42" fill="#17334d" text-anchor="middle" dominant-baseline="central">Spec A</text>
<text x="1060" y="425" font-family="Cambria, serif" font-size="42" fill="#17334d" text-anchor="middle" dominant-baseline="central">Spec A_λ</text>
<line x1="570" y1="425" x2="910" y2="425" stroke="#345b78" stroke-width="5"/><polygon points="910,425 888.0,415.0 888.0,435.0" fill="#345b78"/>
<line x1="430" y1="255" x2="430" y2="365" stroke="#345b78" stroke-width="5"/><polygon points="430,365 440.0,343.0 420.0,343.0" fill="#345b78"/>
<line x1="1060" y1="255" x2="1060" y2="365" stroke="#345b78" stroke-width="5"/><polygon points="1060,365 1070.0,343.0 1050.0,343.0" fill="#345b78"/>
<text x="1720" y="220" font-family="Cambria, serif" font-size="32" fill="#17334d" text-anchor="middle" dominant-baseline="central">Y_A = Y_λ ×ᴿ_{Spec A_λ} Spec A</text>
<text x="1720" y="315" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">The square is derived Cartesian.</text>
<text x="1720" y="405" font-family="Cambria, serif" font-size="36" fill="#17334d" text-anchor="middle" dominant-baseline="central">All Tor groups are retained.</text>
<rect x="45" y="545" width="2160" height="245" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="1125" y="610" font-family="Cambria, serif" font-size="42" fill="#17334d" text-anchor="middle" dominant-baseline="central">U₁, …, Uₙ: affine cover with affine intersections;   d = n − 1</text>
<text x="1125" y="700" font-family="Cambria, serif" font-size="43" fill="#17334d" text-anchor="middle" dominant-baseline="central">RΓ is a finite Čech totalization;   F ≤ a  ⇒  RΓF ≤ a + d</text>
<rect x="45" y="830" width="2160" height="235" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="1125" y="890" font-family="Cambria, serif" font-size="46" fill="#17334d" text-anchor="middle" dominant-baseline="central">Choose r = q − d;   τ[≥r] Lp* N_λ ≅ τ[≥r] N</text>
<text x="1125" y="985" font-family="Cambria, serif" font-size="43" fill="#17334d" text-anchor="middle" dominant-baseline="central">Discarded fibre:   F ≤ r − 1  ⇒  RΓF ≤ q − 1</text>
<rect x="45" y="1110" width="2160" height="180" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="1125" y="1170" font-family="Cambria, serif" font-size="41" fill="#17334d" text-anchor="middle" dominant-baseline="central">τ[≥q] RΓ(Y_A, N) ≅ τ[≥q] (RΓ(Y_λ, N_λ) ⊗ᴸ_Aλ A)</text>
<text x="1125" y="1245" font-family="Cambria, serif" font-size="34" fill="#17334d" text-anchor="middle" dominant-baseline="central">N_λ is bounded coherent at a Noetherian stage; q is arbitrary.</text>
</svg>
