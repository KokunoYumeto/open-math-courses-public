<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">One Gauss family, two different limits</text>
<text x="640" y="120" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K=Q(u),  t=u/2;  R=⋂{V(v_λ): 1≤λ≤2},  v_λ(2)=1.</text>
<rect x="115.0" y="165.0" width="1050" height="140" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="205" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For each fixed f≠0 and all sufficiently small ε&gt;0:</text>
<text x="640" y="265" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">v_(1+ε)(f) = m + dε,  m=v_1(f),  d=ord_t(reduction(2^(−m)f)).</text>
<path d="M380,320 L380,350" stroke="#165fa1" stroke-width="3"/><path d="M380,350 l-10,-15 h20 z" fill="#165fa1"/>
<path d="M900,320 L900,350" stroke="#165fa1" stroke-width="3"/><path d="M900,350 l-10,-15 h20 z" fill="#165fa1"/>
<text x="380" y="385" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">pointwise real values</text>
<text x="900" y="385" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">patch membership coordinates</text>
<path d="M380,415 L380,440" stroke="#165fa1" stroke-width="3"/><path d="M380,440 l-10,-15 h20 z" fill="#165fa1"/>
<path d="M900,415 L900,440" stroke="#165fa1" stroke-width="3"/><path d="M900,440 l-10,-15 h20 z" fill="#165fa1"/>
<rect x="70.0" y="460.0" width="560" height="220" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<rect x="650.0" y="460.0" width="560" height="220" rx="12" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="350" y="495" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">m+dε → m = v_1(f)</text>
<text x="350" y="555" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Limit: the rank-one ring V(v_1).</text>
<text x="350" y="615" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">v_1(t)=0;  t and t⁻¹ both belong.</text>
<text x="930" y="495" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">eventual sign = sign_lex(m,d)</text>
<text x="930" y="555" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Limit: the rank-two ring V(w).</text>
<text x="930" y="615" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">w(2)=(1,0),  w(t)=(0,1).</text>
<text x="640" y="750" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The rings differ:  t⁻¹∈V(v_1) but t⁻¹∉V(w).  RZ2–RZ4.</text>
<text x="640" y="825" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R is CIC, but this overring is not:  w(2t⁻ⁿ)=(1,−n)&gt;0 for every n≥0.</text>
<text x="640" y="890" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The full proper valuation family is patch compact and includes V(w).  RZ1.</text>
<text x="640" y="955" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">At λ=√2 the value group Z+√2 Z has no least positive element.</text>
<text x="640" y="1015" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Thus there is no common uniformizer for the entire family.</text>
<text x="640" y="1090" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">This is an eligible affine example; it refutes neither approximation nor vanishing.</text>
<text x="640" y="1160" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Compactness and cross-family independence still require the exact uniformity check.</text>
</svg>
