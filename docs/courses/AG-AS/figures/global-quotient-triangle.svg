<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="1350" viewBox="0 0 2250 1350">
<title>A locally cyclic sheaf without a global quasi-coherent quotient source</title>
<desc>Three affine lines x=0, y=0 and x+y=1 form a closed triangle with three pairwise vertices and no triple vertex. The opens omitting one line are connected, have pairwise intersections, and no triple overlap. The gluing factors 1,1,2 give no nonzero global germ sections.</desc>
<rect width="2250" height="1350" fill="#f7fafc"/>
<text x="1125" y="65" font-family="Cambria, serif" font-size="48" fill="#17334d" text-anchor="middle" dominant-baseline="central">Local cyclicity does not give a global quasi-coherent quotient</text>
<rect x="50" y="140" width="1050" height="945" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<rect x="1150" y="140" width="1050" height="945" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="575" y="205" font-family="Cambria, serif" font-size="38" fill="#17334d" text-anchor="middle" dominant-baseline="central">X = Spec Q[x,y];  Z = V(xy(x+y−1))</text>
<line x1="300" y1="325" x2="300" y2="1070" stroke="#8b3a3a" stroke-width="5"/>
<line x1="165" y1="950" x2="980" y2="950" stroke="#2d6b54" stroke-width="5"/>
<line x1="175" y1="325" x2="925" y2="1075" stroke="#365f9c" stroke-width="5"/>
<circle cx="300" cy="950" r="9" fill="#17334d"/>
<circle cx="300" cy="450" r="9" fill="#17334d"/>
<circle cx="800" cy="950" r="9" fill="#17334d"/>
<text x="400" y="425" font-family="Cambria, serif" font-size="34" fill="#17334d" text-anchor="middle" dominant-baseline="central">(0,1)</text>
<text x="400" y="995" font-family="Cambria, serif" font-size="34" fill="#17334d" text-anchor="middle" dominant-baseline="central">(0,0)</text>
<text x="825" y="900" font-family="Cambria, serif" font-size="34" fill="#17334d" text-anchor="middle" dominant-baseline="central">(1,0)</text>
<text x="190" y="680" font-family="Cambria, serif" font-size="32" fill="#17334d" text-anchor="middle" dominant-baseline="central">L₁: x=0</text>
<text x="940" y="990" font-family="Cambria, serif" font-size="32" fill="#17334d" text-anchor="middle" dominant-baseline="central">L₂: y=0</text>
<text x="650" y="590" font-family="Cambria, serif" font-size="34" fill="#17334d" text-anchor="middle" dominant-baseline="central">L₃: x+y=1</text>
<text x="575" y="1025" font-family="Cambria, serif" font-size="29" fill="#17334d" text-anchor="middle" dominant-baseline="central">Schematic of three affine components</text>
<text x="1675" y="205" font-family="Cambria, serif" font-size="39" fill="#17334d" text-anchor="middle" dominant-baseline="central">Uⱼ = Z minus Lⱼ;  A = i⁻¹ O_X</text>
<text x="1675" y="255" font-family="Cambria, serif" font-size="28" fill="#17334d" text-anchor="middle" dominant-baseline="central">A is the ambient germ sheaf, not O_Z.</text>
<line x1="1390" y1="360" x2="1990" y2="360" stroke="#345b78" stroke-width="5"/>
<line x1="1990" y1="360" x2="1690" y2="780" stroke="#345b78" stroke-width="5"/>
<line x1="1390" y1="360" x2="1690" y2="780" stroke="#345b78" stroke-width="5"/>
<circle cx="1390" cy="360" r="12" fill="#17334d"/>
<circle cx="1990" cy="360" r="12" fill="#17334d"/>
<circle cx="1690" cy="780" r="12" fill="#17334d"/>
<text x="1390" y="300" font-family="Cambria, serif" font-size="42" fill="#17334d" text-anchor="middle" dominant-baseline="central">U₁</text>
<text x="1990" y="300" font-family="Cambria, serif" font-size="42" fill="#17334d" text-anchor="middle" dominant-baseline="central">U₂</text>
<text x="1690" y="845" font-family="Cambria, serif" font-size="42" fill="#17334d" text-anchor="middle" dominant-baseline="central">U₃</text>
<text x="1690" y="325" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">s₁ = s₂</text>
<text x="1950" y="585" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">s₂ = s₃</text>
<text x="1440" y="585" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">s₁ = 2s₃</text>
<text x="1675" y="935" font-family="Cambria, serif" font-size="32" fill="#17334d" text-anchor="middle" dominant-baseline="central">Pair overlaps nonempty; triple overlap empty.</text>
<text x="1675" y="1010" font-family="Cambria, serif" font-size="29" fill="#17334d" text-anchor="middle" dominant-baseline="central">Each connected Uⱼ has germ sections injecting into K.</text>
<text x="1675" y="1050" font-family="Cambria, serif" font-size="28" fill="#17334d" text-anchor="middle" dominant-baseline="central">K = Q(x,y)</text>
<rect x="50" y="1130" width="2150" height="170" rx="22" fill="white" stroke="#bed0de" stroke-width="3"/>
<text x="1125" y="1185" font-family="Cambria, serif" font-size="43" fill="#17334d" text-anchor="middle" dominant-baseline="central">F = i_*L is locally cyclic;  Γ(X,F) = 0;  F ≠ 0.</text>
<text x="1125" y="1255" font-family="Cambria, serif" font-size="35" fill="#17334d" text-anchor="middle" dominant-baseline="central">Every quasi-coherent Q on affine X is globally generated ⇒ Hom(Q,F) = 0.</text>
</svg>
