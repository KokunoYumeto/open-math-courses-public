<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1870" viewBox="0 0 1280 1870">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="45" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Fixed normalization and a conditional split construction</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">No concrete analytic input package has been constructed.</text>
<rect x="60" y="180.0" width="1160" height="220" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="205" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Nondiscrete T gives a fixed cofinal c∈C*: ε≤v(c)≤M.</text>
<text x="640" y="280" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Replace v by v/v(c): the same R and equivalent completion topologies.</text>
<text x="640" y="355" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">Then N(cᵐy)=2⁻ᵐN(y); H¹(X,O_X)=0 ⇔ X affine.  SC1–SC4.</text>
<rect x="60" y="480.0" width="1160" height="340" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="515" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Required input: complete uniform A, dense field C, embedded quadratic K/C.</text>
<text x="640" y="585" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">M₁,M₂ separated; ‖u‖_A=max(M₁u,M₂u); common homogeneous c.</text>
<text x="640" y="655" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Bᵢ=completion(A,Mᵢ); φᵢ:A→Bᵢ injective and dense.</text>
<text x="640" y="725" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Dᵢ=image M(Bᵢ) in M(A);  D₁∩D₂=∅.  SC5–SC6.</text>
<text x="640" y="790" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">All spectrum points have the same value1/2 on c.</text>
<rect x="60" y="910.0" width="1160" height="300" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="950" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">On K: N(y)=max(M₁(y),M₂(σy)); R={y:N(y)≤1}.</text>
<text x="640" y="1020" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Fixed completion A; joint T=A×A; chart B=B₁×B₂.</text>
<text x="640" y="1090" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K→B sends y to (φ₁(y),φ₂(σy)); π(u,v)=(φ₁u,φ₂v).</text>
<text x="640" y="1160" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The diagonal A⊆B is closed isometric; π is injective and dense.</text>
<rect x="60" y="1270.0" width="1160" height="220" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1300" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If RσR≠K, a rank1 valuation over that proper Goldman ring exists.</text>
<text x="640" y="1370" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Its two conjugate spectrum points would force D₁∩D₂≠∅.</text>
<text x="640" y="1445" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">Thus RσR=K: the conditional target is separated.  SC10.</text>
<text x="640" y="1570" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">θ_B∉diagonal A; δ=dist(θ_B,A)&gt;0. If 2⁻ⁿ&lt;δ, then</text>
<text x="640" y="1640" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">0≠[c⁻ⁿθ]∈K/(R+C)=H¹(X,O_X).  SC11.</text>
<text x="640" y="1735" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every split minimal counterdatum gives this input package.  SC12.</text>
<text x="640" y="1810" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">An actual example or impossibility proof, and the other original cases, remain open.</text>
</svg>
