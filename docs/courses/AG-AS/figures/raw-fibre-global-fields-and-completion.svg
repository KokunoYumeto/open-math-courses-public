<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1690" viewBox="0 0 1280 1690">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="50" font-family="Cambria,serif" font-size="40" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Low-dimensional fields: vanishing and finite normalization</text>
<text x="640" y="110" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">char 0: K algebraic over Q.     char p: trdeg_Fp K ≤ 1.  GF1.</text>
<rect x="65" y="137.5" width="1150" height="235" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="190" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A hypothetical nonzero PW class restricts by FG to a global field K₀.</text>
<text x="640" y="250" font-family="Cambria,serif" font-size="28" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Finite normalization D over Z or Fp[a]: the trace-lattice bound GF2.</text>
<text x="640" y="310" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The inseparable function-field case is bounded by Dₛ^(1/q).</text>
<text x="640" y="350" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">D lies in the CIC chart R₀; each rank-one overring is some DVR D_p.</text>
<text x="640" y="420" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Only finitely many primes p have positive value on a.</text>
<circle cx="640" cy="480" r="7" fill="#165fa1"/>
<text x="700" y="480" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">η</text>
<path d="M640,490 L360,565" fill="none" stroke="#596579" stroke-width="3"/>
<circle cx="360" cy="575" r="7" fill="#165fa1"/>
<text x="360" y="620" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p₁</text>
<path d="M640,490 L640,565" fill="none" stroke="#596579" stroke-width="3"/>
<circle cx="640" cy="575" r="7" fill="#165fa1"/>
<text x="640" y="620" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p₂</text>
<path d="M640,490 L920,565" fill="none" stroke="#596579" stroke-width="3"/>
<circle cx="920" cy="575" r="7" fill="#165fa1"/>
<text x="920" y="620" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">p₃</text>
<text x="640" y="680" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Schematic case |P|=3; the proof permits every finite nonempty P.</text>
<rect x="65" y="720.0" width="1150" height="170" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="755" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">R₀ = ⋂_{p∈P} D_p = D localized away from ⋃_{p∈P} p.  GF3.</text>
<text x="640" y="815" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R₀ is Noetherian.  The existing Noetherian raw-one theorem kills the class.</text>
<text x="640" y="865" font-family="Cambria,serif" font-size="28" fill="#11643c" text-anchor="middle" dominant-baseline="central">Therefore the original target is affine, even for infinite algebraic K.</text>
<path d="M65,950 L1215,950" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="1005" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">In arbitrary fields: an exact directional splitting criterion</text>
<text x="640" y="1065" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Joint norm:  ‖x‖ = max(|x|_S, |σ(x)|_S);  let T be its completion.</text>
<text x="640" y="1120" font-family="Cambria,serif" font-size="30" fill="#165fa1" text-anchor="middle" dominant-baseline="central">A reciprocal q with inf_S v(q) &gt; 0 gives hₘ = qᵐ/(1+qᵐ).</text>
<rect x="65" y="1162.5" width="1150" height="175" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="1190" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">|hₘ|_S → 0,      |σ(hₘ) − 1|_S → 0: jointly Cauchy.</text>
<text x="640" y="1250" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">Limit e:  e²=e,   σ(e)=1−e,   |e|_S=0.</text>
<text x="640" y="1310" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Conversely, a jointly close h∈K gives the positive gauge h/σ(h).  JC1.</text>
<text x="640" y="1415" font-family="Cambria,serif" font-size="34" fill="#11643c" text-anchor="middle" dominant-baseline="central">Affineness  ⇔  this directional idempotent exists in T.</text>
<text x="640" y="1475" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The completion is a ring; no field or full product decomposition is assumed.</text>
<rect x="65" y="1522.5" width="1150" height="135" rx="15" fill="#f5f9fd" stroke="#b7c9da" stroke-width="2"/>
<text x="640" y="1555" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Remaining: force the directional idempotent from the algebraic graph condition.</text>
<text x="640" y="1615" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Higher-dimensional fields, non-field overlaps and the full raw bound remain open.</text>
</svg>
