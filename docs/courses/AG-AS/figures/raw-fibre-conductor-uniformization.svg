<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1570" viewBox="0 0 1280 1570">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="43" font-family="Cambria,serif" font-size="36" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The conductor reduction preserves nonaffineness</text>
<text x="640" y="105" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Suppose the exact quadratic field-overlap target X_R is nonaffine.</text>
<rect x="60" y="155.0" width="1160" height="230" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="190" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">I=Tr(ker π) is proper; A′=A/I, B′=B/I, T′=T/IT.</text>
<text x="640" y="265" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">T′=A′⊗_C K  —π′→  B′: injective and dense.  KG8–KG9.</text>
<text x="640" y="345" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The quotient norms are complete; uniformity is not assumed.</text>
<text x="640" y="435" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">ρ_H(h)=lim ‖hⁿ‖¹⁄ⁿ; Hᵘ is the separated spectral completion.  UF1.</text>
<rect x="60" y="500.0" width="1160" height="270" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="530" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Tᵘ=Aᵘ⊗_C K  —πᵤ→  Bᵘ; σ remains isometric.  UF5–UF7.</text>
<text x="640" y="605" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">‖z‖=max(‖πᵤz‖,‖πᵤσz‖);  C and K remain embedded and dense.</text>
<text x="640" y="680" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Rᵘ={x∈K : ρ_B′(x)≤1},  R⊆Rᵘ⊊K,  Rᵘ[1/a]=K.</text>
<text x="640" y="745" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Rᵘ is CIC, Rᵘσ(Rᵘ)=K; its whole valuation norm is ρ_B′.  UF8–UF10.</text>
<text x="640" y="835" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Idempotents lift uniquely through H→Hᵘ.  UF2–UF4.</text>
<rect x="60" y="900.0" width="1160" height="340" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="930" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If X_(Rᵘ) were affine, JC1 would give eᵤ≠0 with πᵤ(eᵤ)=0.</text>
<text x="640" y="1000" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Lift eᵤ to an idempotent e∈T′.</text>
<text x="640" y="1070" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">π′(e) is an idempotent of spectral radius0, hence π′(e)=0.</text>
<text x="640" y="1140" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Injectivity of π′ gives e=0, contradicting eᵤ≠0.</text>
<text x="640" y="1210" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Therefore X_(Rᵘ) is nonaffine.  UF11.</text>
<text x="640" y="1320" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">M(Tᵘ)≅{γ∈M(T) : γ(IT)=0}; proper if ker π≠0.  UF12.</text>
<text x="640" y="1400" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">πᵤ may have a new kernel. No iteration or termination is asserted.</text>
<text x="640" y="1480" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The zero-conductor case, nonfield overlaps and the full raw bound remain unresolved.</text>
</svg>
