<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="48" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Birational flatness has a finite Tor obstruction</text>
<text x="640" y="108" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B ⊆ S ⊆ K=Frac(B); for x=a/b∈S, put I=(bB:a).</text>
<rect x="60" y="180.0" width="1160" height="240" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="214" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">0 → B/I  —×a→  B/bB  → B/(a,b) → 0.  FL2.</text>
<text x="640" y="292" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">After tensoring with S, the first map is zero because a=bx.</text>
<text x="640" y="370" font-family="Cambria,serif" font-size="30" fill="#11643c" text-anchor="middle" dominant-baseline="central">Flatness would make it injective: IS=S.</text>
<rect x="60" y="485.0" width="1160" height="250" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="516" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If IS=S, write 1=Σrᵢsᵢ; then x=Σ(rᵢx)sᵢ.</text>
<text x="640" y="594" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">For x∈J, all rᵢx belong to J∩B; thus J=(J∩B)S.</text>
<text x="640" y="680" font-family="Cambria,serif" font-size="24" fill="#172b4d" text-anchor="middle" dominant-baseline="central">B Noetherian + S flat ⇒ all S-ideals are finitely generated ⇒ S Noetherian.  FL1.</text>
<rect x="60" y="815.0" width="1160" height="230" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="854" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">If J≠(J∩B)S, choose x∈J outside that extended ideal.</text>
<text x="640" y="930" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Then IS is proper and Tor₁ᴮ(B/(a,b),S) ↠ S/IS ≠ 0.  FL3.</text>
<text x="640" y="1006" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">A cyclic module with two defining relations detects the failure.</text>
<rect x="60" y="1120.0" width="1160" height="340" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1160" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">K=Q(z), v(2)=1, v(z)=sqrt(2), R={v≥0}, σ(z)=1/z.</text>
<text x="640" y="1240" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">R is non-Noetherian; R[1/2]=K and (z/2)σ(z)=1/2.  FL4–FL5.</text>
<text x="640" y="1320" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The raw-one quotient is affine by the explicit fixed-field approximation.  FL6.</text>
<text x="640" y="1400" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Tor₁ over Z[z] of (F₂,R) = R/2R ≠ 0; cycle (−z/2,1).  FL7–FL8.</text>
<text x="640" y="1540" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">This obstructs flat coefficient models; it is not a cohomology counterexample.</text>
</svg>
