<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="55" font-family="Cambria,serif" font-size="42" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Surjective Noetherian models need not exist</text>
<text x="640" y="115" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">V = R[[x]] + y R((x))[[y]], with lexicographic value group Z².</text>
<text x="640" y="170" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Assume x and y descend and Spec V → T is surjective.</text>
<text x="310" y="245" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">All points of Spec V</text>
<text x="960" y="245" font-family="Cambria,serif" font-size="34" fill="#165fa1" text-anchor="middle" dominant-baseline="central">Their distinct images in T</text>
<text x="310" y="330" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">(0)</text>
<text x="960" y="330" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">q₀</text>
<text x="960" y="378" font-family="Cambria,serif" font-size="26" fill="#596579" text-anchor="middle" dominant-baseline="central">x ≠ 0, y ≠ 0</text>
<path d="M560,330 L790,330" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="790,330 772,320 772,340" fill="#165fa1"/>
<text x="310" y="500" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">P = y R((x))[[y]]</text>
<text x="960" y="500" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">q₁</text>
<text x="960" y="548" font-family="Cambria,serif" font-size="26" fill="#596579" text-anchor="middle" dominant-baseline="central">x ≠ 0, y = 0</text>
<path d="M560,500 L790,500" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="790,500 772,490 772,510" fill="#165fa1"/>
<text x="310" y="670" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">m = xV</text>
<text x="960" y="670" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">q₂</text>
<text x="960" y="718" font-family="Cambria,serif" font-size="26" fill="#596579" text-anchor="middle" dominant-baseline="central">x = 0, y = 0</text>
<path d="M560,670 L790,670" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="790,670 772,660 772,680" fill="#165fa1"/>
<path d="M310,370 L310,450" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="310,450 300,432 320,432" fill="#165fa1"/>
<path d="M310,540 L310,620" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="310,620 300,602 320,602" fill="#165fa1"/>
<path d="M1005,330 L1140,330" fill="none" stroke="#165fa1" stroke-width="3"/>
<path d="M1140,330 L1140,500" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="1140,500 1130,482 1150,482" fill="#165fa1"/>
<path d="M1140,500 L1005,500" fill="none" stroke="#165fa1" stroke-width="3"/>
<path d="M1005,500 L1140,500" fill="none" stroke="#165fa1" stroke-width="3"/>
<path d="M1140,500 L1140,670" fill="none" stroke="#165fa1" stroke-width="3"/>
<polygon points="1140,670 1130,652 1150,652" fill="#165fa1"/>
<path d="M1140,670 L1005,670" fill="none" stroke="#165fa1" stroke-width="3"/>
<path d="M70,755 L1210,755" fill="none" stroke="#cbd5e0" stroke-width="2"/>
<text x="640" y="810" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Surjectivity: |T| has at most three points.</text>
<text x="640" y="870" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Descent of x,y: q₀ specializes strictly to q₁, then q₂.</text>
<text x="640" y="935" font-family="Cambria,serif" font-size="30" fill="#96342f" text-anchor="middle" dominant-baseline="central">A Noetherian affine étale chart would have finite spectrum</text>
<text x="640" y="980" font-family="Cambria,serif" font-size="30" fill="#96342f" text-anchor="middle" dominant-baseline="central">and a prime chain of length two — impossible by (SM3)–(SM4).</text>
<text x="640" y="1040" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">Spec V itself is affine; this is not a cohomological counterexample.</text>
</svg>
