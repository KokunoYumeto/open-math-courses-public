<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="46" font-family="Cambria,serif" font-size="34" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Raw fibre bounds need not descend to Noetherian models</text>
<text x="640" y="108" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">k finite; [l:k]=n≥2; V=k[[x]] + y k((x))[[y]].  RM1.</text>
<rect x="60" y="180.0" width="1160" height="220" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="210" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Spec(V) has the strict specialization chain (0) → P → m.</text>
<text x="640" y="288" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Residue fields at (0), P, m:  k((x))((y));  k((x));  k.</text>
<text x="640" y="366" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Here P=y k((x))[[y]] and m=xV.</text>
<rect x="60" y="445.0" width="1160" height="250" rx="14" fill="#f3faf4" stroke="#9db8a1" stroke-width="2"/>
<text x="640" y="478" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">U=Spec(V⊗ₖl) → X=Spec(V) is finite étale, rank n.</text>
<text x="640" y="556" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Every residue algebra is a FIELD: l((x))((y)), l((x)), or l.  RM2.</text>
<text x="640" y="640" font-family="Cambria,serif" font-size="26" fill="#11643c" text-anchor="middle" dominant-baseline="central">Every raw fibre has ONE point; every geometric fibre has n.  RM3.</text>
<rect x="60" y="750.0" width="1160" height="250" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="782" font-family="Cambria,serif" font-size="28" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Suppose the cover and the functions x,y descend to T.  RM4.</text>
<text x="640" y="860" font-family="Cambria,serif" font-size="30" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Their vanishing distinguishes t₀ → t₁ → t₂ strictly.</text>
<text x="640" y="942" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Z=closure{t₀}, reduced: integral Noetherian, dimension ≥2.  RM5.</text>
<rect x="60" y="1060.0" width="1160" height="260" rx="14" fill="#fff7ef" stroke="#c19774" stroke-width="2"/>
<text x="640" y="1090" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">The geometric degree at t₂ is n; its n-coordinate configuration is nonempty.</text>
<text x="640" y="1170" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">A rational configuration on the scheme model gives n distinct raw lifts.  RM6.</text>
<text x="640" y="1250" font-family="Cambria,serif" font-size="28" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">Thus some z∈Z has at least n raw lifts, and z∉g(X).  RM7.</text>
<text x="640" y="1300" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Neither flatness nor surjectivity of g is assumed.</text>
<rect x="60" y="1365.0" width="1160" height="190" rx="14" fill="#f4f8fc" stroke="#abbfd4" stroke-width="2"/>
<text x="640" y="1400" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">Noetherian B⊆V containing k,x,y ⇒ constant cover has raw maximum n.  RM8.</text>
<text x="640" y="1470" font-family="Cambria,serif" font-size="26" fill="#172b4d" text-anchor="middle" dominant-baseline="central">All sufficiently late finite-type coefficient stages therefore have that count.</text>
<text x="640" y="1530" font-family="Cambria,serif" font-size="26" fill="#9a3f00" text-anchor="middle" dominant-baseline="central">The actual target X is affine: this is not a cohomology counterexample.</text>
</svg>
