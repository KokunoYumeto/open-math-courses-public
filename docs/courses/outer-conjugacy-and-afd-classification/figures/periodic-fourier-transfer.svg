<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1000" viewBox="0 0 620 1000" role="img" aria-labelledby="title desc">
<title id="title">Extracting a transfer function from a periodic cocycle</title>
<desc id="desc">Remove the circuit phase. Fourier averaging of the resulting circle representation gives a nonzero eigenvector of constant modulus. Multiplying its conjugate by the coordinate character cancels the eigenfrequency and gives the transfer unitary.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#24465d" stroke-width="1.5"/></marker></defs>
<rect width="620" height="1000" fill="#f8fafb"/>
<g font-family="Georgia,serif" fill="#172c3c" text-anchor="middle">
<text x="310" y="46" font-size="29" font-weight="bold">From circuit phase to transfer</text>
<text x="310" y="83" font-size="24">L &gt; 0, P = 2π/L; normalized Haar measure</text>
<g fill="#e5f0f5" stroke="#587a8e" stroke-width="1.5">
<rect x="30" y="108" width="560" height="130" rx="12"/><rect x="30" y="278" width="560" height="128" rx="12"/>
<rect x="30" y="446" width="560" height="138" rx="12"/><rect x="30" y="624" width="560" height="128" rx="12"/>
<rect x="30" y="792" width="560" height="150" rx="12"/>
</g>
<text x="310" y="145" font-size="25">1. Read one circuit and normalize</text>
<text x="310" y="184" font-size="28">b<tspan baseline-shift="sub" font-size="18">L</tspan> = e<tspan baseline-shift="super" font-size="18">−iLt</tspan>, 0 ≤ t &lt; P</text>
<text x="310" y="219" font-size="26">c<tspan baseline-shift="sub" font-size="18">r</tspan> = e<tspan baseline-shift="super" font-size="18">itr</tspan>b<tspan baseline-shift="sub" font-size="18">r</tspan>, c<tspan baseline-shift="sub" font-size="18">L</tspan> = 1</text>
<text x="310" y="315" font-size="25">2. Form a unitary circle representation</text>
<text x="310" y="354" font-size="27">T<tspan baseline-shift="sub" font-size="18">r</tspan>ξ(x) = c<tspan baseline-shift="sub" font-size="18">r</tspan>(x) ξ(x − r)</text>
<text x="310" y="388" font-size="24">The cocycle law gives T<tspan baseline-shift="sub" font-size="17">r+s</tspan> = T<tspan baseline-shift="sub" font-size="17">r</tspan>T<tspan baseline-shift="sub" font-size="17">s</tspan>.</text>
<text x="310" y="483" font-size="25">3. Select a nonzero Fourier projection</text>
<text x="310" y="524" font-size="25">Q<tspan baseline-shift="sub" font-size="18">n</tspan> = ∫ e<tspan baseline-shift="super" font-size="18">inPr</tspan>T<tspan baseline-shift="sub" font-size="18">r</tspan> dr/L</text>
<text x="310" y="560" font-size="24">Fejér averages tend strongly to the identity.</text>
<text x="310" y="662" font-size="25">4. Normalize an eigenvector in its range</text>
<text x="310" y="701" font-size="27">T<tspan baseline-shift="sub" font-size="18">r</tspan>ξ = e<tspan baseline-shift="super" font-size="18">−inPr</tspan>ξ</text>
<text x="310" y="735" font-size="24">Translation invariance of |ξ| gives |ξ| = 1.</text>
<text x="310" y="830" font-size="25">5. Cancel its eigenfrequency</text>
<text x="310" y="870" font-size="27">a(x) = ξ(x)* e<tspan baseline-shift="super" font-size="18">inPx</tspan></text>
<text x="310" y="912" font-size="28">b<tspan baseline-shift="sub" font-size="18">r</tspan> = e<tspan baseline-shift="super" font-size="18">−itr</tspan> a* ϑ<tspan baseline-shift="sub" font-size="18">r</tspan>(a)</text>
<text x="310" y="978" font-size="22">Exact construction: Theorem 1.1 and (1.A1)–(1.A7)</text>
</g>
<g stroke="#24465d" stroke-width="2" marker-end="url(#arrow)"><path d="M310 240V273"/><path d="M310 408V441"/><path d="M310 586V619"/><path d="M310 754V787"/></g>
</svg>
