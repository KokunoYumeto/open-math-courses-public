<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" role="img" aria-labelledby="title desc">
<title id="title">Compatible refinement through a reference cell</title>
<desc id="desc">The map from Z(v,t) to Z(u,s) is U(u,0) composed with V(s,t) composed with U(0,v). The three derivative factors multiply. When s equals t the old map U(u,v) is retained.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#174e66"/></marker></defs>
<rect width="500" height="620" fill="#faf9f5"/>
<g fill="#e5f1f2" stroke="#174e66" stroke-width="2"><rect x="30" y="100" width="130" height="70" rx="8"/><rect x="340" y="100" width="130" height="70" rx="8"/><rect x="30" y="420" width="130" height="70" rx="8"/><rect x="340" y="420" width="130" height="70" rx="8"/></g>
<g stroke="#174e66" stroke-width="3" marker-end="url(#arrow)"><path d="M170 135H330"/><path d="M95 180V235"/><path d="M95 350V410"/><path d="M170 455H330"/><path d="M405 410V350"/><path d="M405 235V180"/></g>
<g font-family="Georgia,serif" fill="#153846" font-size="25" text-anchor="middle"><text x="95" y="143">Z(v,t)</text><text x="405" y="143">Z(u,s)</text><text x="95" y="463">B(t)</text><text x="405" y="463">B(s)</text><text x="250" y="67">W((u,s),(v,t))</text><text x="250" y="520">V(s,t)</text><text x="250" y="555">degree λ^(|s|−|t|)</text><text x="95" y="270">U(0,v)</text><text x="95" y="305">λ^(−|v|)</text><text x="405" y="270">U(u,0)</text><text x="405" y="305">λ^|u|</text></g>
<text x="250" y="600" font-family="Georgia,serif" font-size="23" text-anchor="middle" fill="#153846">s = t retains U(u,v) on Z(v,s)</text>
</svg>
