<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">A measurable phase sequence and the return tower</title>
  <desc id="desc">Countable tests select one fixed phase and a measurable unitary field. A height n tower produces a central sequence with nonzero phase displacement and vanishing return error. Central triviality forces almost every fibre action to be inner; measurable selection gives a unitary in the full coefficient algebra.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#245b80"/></marker></defs>
  <rect width="640" height="900" rx="18" fill="#f8fafb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#142e40">
    <text x="320" y="36" font-size="27" font-weight="bold">Variable fibres, one phase</text>
    <text x="320" y="61" font-size="17">Assume a positive non-centrally-trivial fibre set</text>
    <g fill="#e4f0f6" stroke="#245b80" stroke-width="2">
      <rect x="35" y="72" width="570" height="140" rx="12"/>
      <rect x="35" y="270" width="570" height="140" rx="12"/>
      <rect x="35" y="468" width="570" height="156" rx="12"/>
      <rect x="35" y="692" width="570" height="164" rx="12"/>
    </g>
    <text x="320" y="111" font-size="25" font-weight="bold">Countable tests · (6.A4)</text>
    <text x="320" y="151" font-size="24">A fixed y ≠ 1 on a conull set</text>
    <text x="320" y="189" font-size="23">First successful index jₘ(x)</text>
    <path d="M320 218 V259" stroke="#245b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="320" y="310" font-size="25" font-weight="bold">A whole unitary field · (6.A6–8)</text>
    <text x="320" y="350" font-size="25">bₘ(x) = vⱼₘ₍ₓ₎</text>
    <text x="320" y="389" font-size="23">Central in N; a(bₘ) − ybₘ → 0</text>
    <path d="M320 416 V457" stroke="#245b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="320" y="508" font-size="25" font-weight="bold">Return tower · (6.B3–8)</text>
    <text x="320" y="548" font-size="23">Squared sharp size ≥ 2(1 − 1/n)</text>
    <text x="320" y="586" font-size="23">Return error ≤ (2 + √2)/√n</text>
    <text x="320" y="613" font-size="18">Two endpoints; no endpoint disjointness needed</text>
    <path d="M320 630 V681" stroke="#245b80" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="367" y="637" width="214" height="35" rx="6" fill="#f8fafb"/>
    <text x="474" y="661" font-size="18">Phase contradicts Ct(M)</text>
    <text x="320" y="732" font-size="25" font-weight="bold">Inner fibres and one implementer</text>
    <text x="320" y="772" font-size="23">aₓ is inner almost everywhere</text>
    <text x="320" y="810" font-size="23">Measurable v ∈ U(N); a = Ad(v)</text>
    <text x="320" y="839" font-size="18">Semifinite theorem and selection · (6.C1–2)</text>
  </g>
</svg>
