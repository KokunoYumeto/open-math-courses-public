<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-labelledby="title desc">
  <title id="title">Matching a centralizer corner by a partial orbit map</title>
  <desc id="desc">The partial orbit unitary v maps Nc onto Ne. The composite w star alpha(v) maps alpha(Nc) first to alpha(Ne), then onto Nc. All arrows identify whole coefficient corners.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#245b80"/></marker>
  </defs>
  <rect width="640" height="940" rx="18" fill="#f8fafb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#142e40">
    <text x="320" y="52" font-size="28" font-weight="bold">Partial orbit map</text>
    <g fill="#e4f0f6" stroke="#245b80" stroke-width="2">
      <rect x="30" y="106" width="210" height="96" rx="12"/>
      <rect x="400" y="106" width="210" height="96" rx="12"/>
    </g>
    <text x="135" y="147" font-size="32">Nc</text>
    <text x="135" y="183" font-size="23">unit: c</text>
    <text x="505" y="147" font-size="32">Ne</text>
    <text x="505" y="183" font-size="23">unit: e</text>
    <path d="M245 154 H392" fill="none" stroke="#245b80" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="320" y="130" font-size="25">Ad(v)</text>
    <text x="320" y="270" font-size="28" font-weight="bold">Matched corner</text>
    <g fill="#e4f0f6" stroke="#245b80" stroke-width="2">
      <rect x="200" y="310" width="240" height="96" rx="12"/>
      <rect x="200" y="500" width="240" height="96" rx="12"/>
      <rect x="200" y="690" width="240" height="96" rx="12"/>
    </g>
    <text x="320" y="351" font-size="32">α(Nc)</text>
    <text x="320" y="387" font-size="23">unit: α(c)</text>
    <text x="320" y="541" font-size="32">α(Ne)</text>
    <text x="320" y="577" font-size="23">unit: α(e)</text>
    <text x="320" y="731" font-size="32">Nc</text>
    <text x="320" y="767" font-size="23">unit: c</text>
    <path d="M320 412 V492" fill="none" stroke="#245b80" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M320 602 V682" fill="none" stroke="#245b80" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="415" y="460" font-size="25">Ad(α(v))</text>
    <text x="410" y="650" font-size="25">Ad(w*)</text>
    <path d="M192 358 H110 V738 H192" fill="none" stroke="#245b80" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="44" y="522" width="132" height="48" rx="8" fill="#f8fafb"/>
    <text x="110" y="555" font-size="26">Ad(u)</text>
    <text x="320" y="852" font-size="29">u = w* α(v)</text>
    <text x="320" y="896" font-size="25">u*u = α(c)     uu* = c</text>
  </g>
</svg>
