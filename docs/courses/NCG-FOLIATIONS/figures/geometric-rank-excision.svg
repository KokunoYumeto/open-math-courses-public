<text x="48" y="1422" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">A ↔ (1+2i)/√5;  B ↔ (1+2j)/√5.  Γ = ⟨A,B⟩ is free and dense in SO(3).</text>
<text x="48" y="1452" font-size="18" fill="#16745d" font-weight="400" text-anchor="start" class="">Actual arrows (x,t) → (Ax,t) or (Bx,t) preserve t and the exact warped metric.</text>
