<text x="60" y="1534" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">F</text>
<text x="88" y="1534" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">Dependence and limits</text>
<text x="847" y="1534" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KE.22–KE.24</text>
<text x="48" y="1563" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">A proved cpc route gives the actual ideal/cone KK inverse at separable hypotheses.</text>
<text x="48" y="1592" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">No formal jet closure is globalized; no final scalar normal/physical cycle is inferred.</text>
