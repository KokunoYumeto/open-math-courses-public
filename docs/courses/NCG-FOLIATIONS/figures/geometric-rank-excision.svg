<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1700" viewBox="0 0 900 1700" role="img" aria-labelledby="title desc">
<title id="title">Geometric cpc sections at rank restrictions</title>
<desc id="desc">Figure 11BS.1. Three sufficient geometric cpc providers with their real inputs: actual whole-source-fibre retraction and support, a genuine proper global H action with compact K averaging and C0 tails, and an actual product with a passive interval and full B-valued interpolation. The singular incomplete S2 example uses the exact K, bumps, rank3/4 and nonunit rotation arrows preserving t. Explicit A and B use the elementary quaternion proof in Section 11BS, KEF.1-KEF.4. No universal cpc or final scalar-cycle conclusion is inferred.</desc>
<metadata>Original expression CC0-1.0. Installed fonts and external software retain their actual terms.</metadata>
<style>text{font-family:Arial,Helvetica,sans-serif;} .math{font-family:"Cambria Math",Georgia,serif;}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#153046"/></marker></defs>
<rect width="900" height="1700" fill="#fff"/>
<text x="28" y="43" font-size="30" fill="#153046" font-weight="700" text-anchor="start" class="">Geometric cpc sections at rank restrictions</text>
<text x="28" y="74" font-size="18" fill="#516777" font-weight="400" text-anchor="start" class="">Three conditional providers; a singular incomplete layer with actual nonunit arrows</text>
<rect x="28" y="100" width="844" height="92" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="117" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="137" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">A</text>
<text x="88" y="137" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">Start with the actual reduced extension</text>
<text x="847" y="137" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">IX.1–IX.12; KE.1–KE.2</text>
<text x="48" y="168" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="">0 → I → A → Q → 0 is exact; norm exactness alone supplies no cpc section.</text>
<rect x="28" y="210" width="844" height="240" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="227" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="247" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">B</text>
<text x="88" y="247" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">Route 1: a whole-source-fibre retraction</text>
<text x="847" y="247" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KE.3–KE.8</text>
<text x="48" y="276" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="">Supply an actual functor R:G|W → G|F, ρ:W → F, with R|F = identity.</text>
<text x="48" y="305" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">Every R<tspan baseline-shift="sub" font-size="12.24">x</tspan> is a bijection on the entire source fibre, including original isotropy.</text>
<text x="48" y="334" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">0 ≤ χ ≤ 1, χ|F = 1; compact inverse images after both endpoint cutoffs ≥ δ.</text>
<text x="48" y="373" font-size="22" fill="#153046" font-weight="400" text-anchor="start" class="math">λ<tspan baseline-shift="sub" font-size="15.84">x</tspan>(σ(f)) = D<tspan baseline-shift="sub" font-size="15.84">x</tspan> V<tspan baseline-shift="sub" font-size="15.84">x</tspan>* λ<tspan baseline-shift="sub" font-size="15.84">ρ(x)</tspan>(f) V<tspan baseline-shift="sub" font-size="15.84">x</tspan> D<tspan baseline-shift="sub" font-size="15.84">x</tspan>,   D<tspan baseline-shift="sub" font-size="15.84">x</tspan> δ<tspan baseline-shift="sub" font-size="15.84">h</tspan> = √χ(rh) δ<tspan baseline-shift="sub" font-size="15.84">h</tspan>.</text>
<text x="48" y="407" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">Whole regular matrices give cpc at every size; tapers give I-norm error ≤ 2√δ ‖f‖<tspan baseline-shift="sub" font-size="12.24">I</tspan>.</text>
<text x="48" y="436" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">The actual retraction and support condition are inputs; compact-word injection is insufficient.</text>
<rect x="28" y="468" width="844" height="276" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="485" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="505" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">C</text>
<text x="88" y="505" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">Route 2: a supplied proper global H action</text>
<text x="847" y="505" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KE.9–KE.14</text>
<text x="48" y="534" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="">A genuine smooth proper global Lie-isometry action H on the original manifold T.</text>
<text x="48" y="563" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">Compact stabilizers K<tspan baseline-shift="sub" font-size="12.24">j</tspan>, original normal slices, and a locally finite quotient partition.</text>
<text x="48" y="594" font-size="21" fill="#153046" font-weight="400" text-anchor="start" class="math">S<tspan baseline-shift="sub" font-size="15.12">j</tspan><tspan baseline-shift="super" font-size="15.12">K</tspan> = ∫<tspan baseline-shift="sub" font-size="15.12">K<tspan baseline-shift="sub" font-size="15.12">j</tspan></tspan> α<tspan baseline-shift="sub" font-size="15.12">k</tspan> S<tspan baseline-shift="sub" font-size="15.12">j</tspan>⁰ α<tspan baseline-shift="sub" font-size="15.12">k⁻¹</tspan> dk;    average over compact K<tspan baseline-shift="sub" font-size="15.12">j</tspan> only.</text>
<text x="48" y="628" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">Compact slice cutoffs φ<tspan baseline-shift="sub" font-size="12.24">j</tspan> → induction L<tspan baseline-shift="sub" font-size="12.24">j</tspan> → positive quotient sum S = Σ<tspan baseline-shift="sub" font-size="12.24">j</tspan> w<tspan baseline-shift="sub" font-size="12.24">jL</tspan><tspan baseline-shift="sub" font-size="12.24">j</tspan>.</text>
<text x="48" y="657" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="">Proper transporter compactness + local finiteness prove S(C₀(F)) ⊂ C₀(T).</text>
<text x="48" y="694" font-size="22" fill="#153046" font-weight="400" text-anchor="start" class="math">λ<tspan baseline-shift="sub" font-size="15.84">x</tspan>(Ŝ(q)) = ∫<tspan baseline-shift="sub" font-size="15.84">F</tspan> λ<tspan baseline-shift="sub" font-size="15.84">z</tspan>(q) dμ<tspan baseline-shift="sub" font-size="15.84">x</tspan>(z),   μ<tspan baseline-shift="sub" font-size="15.84">x</tspan>(F) ≤ 1,   μ<tspan baseline-shift="sub" font-size="15.84">x</tspan> = δ<tspan baseline-shift="sub" font-size="15.84">x</tspan> on F.</text>
<text x="48" y="724" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">Use the actual germ-faithful Γ subgroup and the whole ℓ²(Γ) basis; isotropy retained.</text>
<rect x="28" y="762" width="844" height="234" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="779" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="799" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">D</text>
<text x="88" y="799" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">Route 3: an actual passive interval parameter</text>
<text x="847" y="799" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KE.15–KE.17</text>
<text x="48" y="828" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">G = ℋ × J, J = (−2,2);  B = Cᵣ*(ℋ);  A = C₀(J,B),  Q = C₀(K,B).</text>
<text x="48" y="864" font-size="22" fill="#153046" font-weight="400" text-anchor="start" class="math">(Eb)(t) = (c−t)/(c−a) b(a) + (t−a)/(c−a) b(c),   a &lt; t &lt; c.</text>
<text x="48" y="897" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="">Outer gaps taper to zero: (t+2)/(c+2)b(c), or (2−t)/(2−a)b(a).</text>
<text x="48" y="928" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">Retain b on K; convex B-valued endpoint evaluations are cpc at every matrix size.</text>
<text x="48" y="958" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">Accumulating-gap continuity and C₀ tails are proved; no nuclearity of B is assumed.</text>
<text x="48" y="986" font-size="16" fill="#16745d" font-weight="400" text-anchor="start" class="">This probability interpolation need not come from a neighbourhood retraction.</text>
<rect x="28" y="1014" width="844" height="465" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="1031" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="1051" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">E</text>
<text x="88" y="1051" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">An exact singular layer with nonunit rotations</text>
<text x="847" y="1051" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KE.18–KE.21; KEF.1–4</text>
<text x="48" y="1080" font-size="21" fill="#153046" font-weight="400" text-anchor="start" class="math">K = {0} ∪ ⋃<tspan baseline-shift="sub" font-size="15.12">n≥1</tspan>[a<tspan baseline-shift="sub" font-size="15.12">n</tspan>,c<tspan baseline-shift="sub" font-size="15.12">n</tspan>],   a<tspan baseline-shift="sub" font-size="15.12">n</tspan> = 2<tspan baseline-shift="super" font-size="15.12">-n</tspan>,   c<tspan baseline-shift="sub" font-size="15.12">n</tspan> = (5/4)2<tspan baseline-shift="super" font-size="15.12">-n</tspan>.</text>
<text x="48" y="1113" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="math">u<tspan baseline-shift="sub" font-size="12.96">n</tspan>(t) = 2<tspan baseline-shift="super" font-size="12.96">-n</tspan> exp(−1/((t−a<tspan baseline-shift="sub" font-size="12.96">n</tspan>)(c<tspan baseline-shift="sub" font-size="12.96">n</tspan>−t))) on (a<tspan baseline-shift="sub" font-size="12.96">n</tspan>,c<tspan baseline-shift="sub" font-size="12.96">n</tspan>), zero elsewhere.</text>
<text x="48" y="1146" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">u = Σ<tspan baseline-shift="sub" font-size="13.68">n</tspan> u<tspan baseline-shift="sub" font-size="13.68">n</tspan>;   g = dt² + e<tspan baseline-shift="super" font-size="13.68">2u(t)</tspan>g<tspan baseline-shift="sub" font-size="13.68">S²</tspan> on S² × (−2,2), with original round g<tspan baseline-shift="sub" font-size="13.68">S²</tspan>.</text>
<text x="48" y="1179" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">k = 3 on F = S² × K;  k = 4 outside F.  Both omitted ends are at finite distance.</text>
