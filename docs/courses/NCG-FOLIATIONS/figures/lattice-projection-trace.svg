<text x="45" y="60" class="title">Lattice densities become a projection trace</text>
<text x="45" y="110" class="math">dⱼ = 1 / area(ℂ / Γⱼ),   cⱼ = πdⱼ,   a = c₁ − c₂ &gt; 0</text>
<rect x="35" y="145" width="1530" height="125" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<text x="60" y="187" class="heading">Measured action groupoid</text>
<text x="60" y="226" class="math">V = (ℂ / Γ₁) × (ℂ / Γ₂),   r(v,t) = v,   s(v,t) = v + t,   t ∈ ℂ</text>
<text x="860" y="187" class="heading">Normalization and stabilizers</text>
<text x="860" y="226" class="math">μ(V) = 1;  Haar fibre measure dA;  Γ₁ ∩ Γ₂ retained</text>
<rect x="35" y="310" width="740" height="260" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<rect x="825" y="310" width="740" height="260" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<text x="60" y="355" class="heading">Meromorphic field Wᵥ</text>
<text x="60" y="398" class="math">Poles: −z₁ + Γ₁;  zeros: −z₂ + Γ₂</text>
<text x="60" y="440" class="math">‖φ‖² = ∫ |φ(t)|² dist(z₁+t,Γ₁)²</text>
<text x="205" y="474" class="math">/ dist(z₂+t,Γ₂)² dA(t)</text>
<text x="60" y="530" class="small">Distinct translated lattices at almost every v.</text>
<text x="850" y="355" class="heading">Holomorphic field Hᵥ</text>
<text x="850" y="398" class="math">E = pr₁*L₁ ⊗ (pr₂*L₂)*</text>
<text x="850" y="440" class="math">u(t) = φ(t) F₁(z₁+t) / F₂(z₂+t)</text>
<text x="850" y="477" class="math">Squared metric: exp(−c₁|z₁+t|² + c₂|z₂+t|²)</text>
<text x="850" y="507" class="small">‖u‖² = ∫ |u(t)|² × squared metric dA(t)</text>
<text x="850" y="530" class="small">Bounded invertible equivariant map (12).</text>
