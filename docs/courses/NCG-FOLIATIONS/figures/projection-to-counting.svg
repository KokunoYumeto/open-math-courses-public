<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#285a83"/></marker></defs>
<rect width="1600" height="1510" fill="#f8fafc"/>
<text x="55" y="64" font-family="Arial, DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#20374b">A kernel field represented by a counting transversal</text>
<text x="55" y="108" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#20374b">Positive leaf dimension • compact V • Λ locally finite • nontrivial holonomy negligible</text>
<rect x="55" y="145" width="715" height="265" rx="15" fill="#eaf2fa" stroke="#cad6e2" stroke-width="2"/>
<rect x="800" y="145" width="745" height="265" rx="15" fill="#f0ecf9" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="188" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#20374b">Plaque frame: density and trace are retained</text>
<text x="82" y="235" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#20374b">ψ_(i,u,n) = χᵢ ρᵢ⁻¹ᐟ² eₙ;   Σ χᵢ² = 1</text>
<text x="82" y="282" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#20374b">J*J = 1 by plaque Parseval.</text>
<text x="82" y="330" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">τ_count(JKJ*) = τ_Λ(K), for every K ≥ 0.</text>
<text x="82" y="375" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">The proper normalization is Σ νᵢ*fᵢ = 1.</text>
<text x="827" y="188" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#20374b">Diagonal projections have the same centre trace</text>
<text x="827" y="235" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Finite class of n points: rank k ↔ first k points.</text>
<text x="827" y="282" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">Infinite class part: conditional probabilities atomless.</text>
<text x="827" y="330" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#20374b">u(x) = F(c(x),j(x)) is conditionally uniform.</text>
<text x="827" y="375" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">q = 1_{u ≤ d(c)} has tr_Z(q) = d(c).</text>
<rect x="55" y="440" width="1490" height="268" rx="15" fill="#ffffff" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="485" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">The field maps, with their actual domains</text>
<rect x="90" y="520" width="375" height="92" rx="15" fill="#eaf2fa" stroke="#cad6e2" stroke-width="2"/>
<rect x="610" y="520" width="375" height="92" rx="15" fill="#e9f5ed" stroke="#cad6e2" stroke-width="2"/>
<rect x="1130" y="520" width="375" height="92" rx="15" fill="#fff3d7" stroke="#cad6e2" stroke-width="2"/>
<text x="115" y="557" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">P L²(L,B)</text>
<text x="115" y="591" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#20374b">projection range on a leaf</text>
<text x="635" y="557" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#20374b">ℓ²(D ∩ ((L ∩ N) × ℕ))</text>
<text x="635" y="591" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">D ⊂ N × ℕ is Borel</text>
<text x="1155" y="557" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">ℓ²(L ∩ B_P)</text>
<text x="1155" y="591" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">B_P = b(D) ⊂ V</text>
<path d="M475 566 L594 566" fill="none" stroke="#285a83" stroke-width="3" marker-end="url(#a)"/>
<text x="489" y="546" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#20374b">v*J</text>
<path d="M997 566 L1114 566" fill="none" stroke="#285a83" stroke-width="3" marker-end="url(#a)"/>
<text x="1020" y="546" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#20374b">count b</text>
<text x="82" y="657" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#20374b">v*v = 1_D;   vv* = JPJ*;   Λ(B_P) = τ_count(1_D) = τ_Λ(P).</text>
<text x="82" y="692" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#20374b">v belongs to the stabilized random-operator algebra; all identities hold off a saturated null set.</text>
<rect x="55" y="740" width="1490" height="410" rx="15" fill="#e9f5ed" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="785" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">Multiplicity labels become distinct points inside disjoint leaf balls</text>
<text x="82" y="830" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">r(x) = min(ρ₀/2, d(x)/4);   b(x,n) = exp_x(r(x) 2^(−n−1) v(x)), n ≥ 0.</text>
<text x="82" y="869" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">Displayed geodesic section: two centres at distance a; both shown radii are a/4.</text>
<rect x="165" y="945" width="400" height="76" rx="25" fill="#c3e4ce"/>
<rect x="965" y="945" width="400" height="76" rx="25" fill="#c3e4ce"/>
<path d="M115 983 L1410 983" fill="none" stroke="#285a83" stroke-width="3" marker-end="url(#a)"/>
<circle cx="365" cy="983" r="7" fill="#285a83"/>
<text x="357" y="1050" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">x</text>
<circle cx="465.0" cy="983" r="5" fill="#438e65"/>
<circle cx="415.0" cy="983" r="5" fill="#438e65"/>
<circle cx="390.0" cy="983" r="5" fill="#438e65"/>
<circle cx="377.5" cy="983" r="5" fill="#438e65"/>
<circle cx="371.25" cy="983" r="5" fill="#438e65"/>
<circle cx="368.125" cy="983" r="5" fill="#438e65"/>
<text x="250" y="925" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">radius = a/4</text>
<circle cx="1165" cy="983" r="7" fill="#285a83"/>
<text x="1157" y="1050" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">y</text>
<circle cx="1265.0" cy="983" r="5" fill="#438e65"/>
<circle cx="1215.0" cy="983" r="5" fill="#438e65"/>
<circle cx="1190.0" cy="983" r="5" fill="#438e65"/>
<circle cx="1177.5" cy="983" r="5" fill="#438e65"/>
<circle cx="1171.25" cy="983" r="5" fill="#438e65"/>
<circle cx="1168.125" cy="983" r="5" fill="#438e65"/>
<text x="1050" y="925" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">radius = a/4</text>
<path d="M365 969 L1165 969" fill="none" stroke="#6e8599" stroke-width="1"/>
<text x="695" y="940" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#20374b">distance a</text>
<text x="82" y="1092" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">Different centres have disjoint balls; at each centre, the labelled points converge to that centre.</text>
<text x="82" y="1131" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#20374b">Such accumulation is allowed: a Borel transversal is only required to meet each leaf countably.</text>
<rect x="55" y="1180" width="1490" height="158" rx="15" fill="#fff3d7" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="1223" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">Scope matters</text>
<text x="82" y="1264" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#20374b">F = 0: use multiplicity presentations for general kernels; ordinary harmonic counts still work.</text>
<text x="82" y="1307" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Holonomy present: the projection trace persists; a universal equivariant lifted-counting model fails.</text>
<text x="55" y="1382" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#20374b">Full arguments: Lemmas 1.3 and 1.5, Proposition 1.4, Theorem 1.6; scope examples 1.7–1.8; Corollary 1.9.</text>
<text x="55" y="1422" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#20374b">Exercises 21–22 check finite/infinite conditional traces, injectivity, accumulation and the genus-cover index.</text>
<text x="55" y="1460" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#20374b">Human background: Connes, Sur la théorie non commutative de l’intégration and A survey of foliations and operator algebras.</text>
<text x="55" y="1495" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#20374b">Original diagram and editable source • CC0</text>
</svg>
