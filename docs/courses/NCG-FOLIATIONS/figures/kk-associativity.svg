<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#f4f7fb"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#446b94"/></marker></defs>
<text x="55" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="bold" fill="#20334d">Associativity retains two positive contributions</text>
<text x="55" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">The compact error from the first product is removed after the final tensor, by the separator.</text>
<rect x="50" y="150" width="1500" height="185" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">Exact tensor module; no factor is interchanged</text>
<text x="80" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">E = E₁ ⊗̂<tspan baseline-shift="sub" font-size="70%">D₁</tspan> (E₂ ⊗̂<tspan baseline-shift="sub" font-size="70%">D₂</tspan> E₃) ≅ (E₁ ⊗̂<tspan baseline-shift="sub" font-size="70%">D₁</tspan> E₂) ⊗̂<tspan baseline-shift="sub" font-size="70%">D₂</tspan> E₃.</text>
<text x="80" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">S = F₁ ⊗̂ 1 ⊗̂ 1;   T = F₁₂ ⊗̂ 1;   H = TF + FT;   J = 𝒦(E).</text>
<rect x="50" y="365" width="710" height="250" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="365" width="740" height="250" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">First product: positive modulo 𝒦(E₁₂)</text>
<text x="80" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">φ₁₂(a)[F₁₂,F₁⊗̂1]φ₁₂(a)* = Pₐ + Kₐ</text>
<text x="80" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Pₐ ≥ 0;  Kₐ ∈ 𝒦(E₁₂).</text>
<text x="80" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Kₐ ⊗̂ 1 need not be compact on E.</text>
<text x="840" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">One separator controls both compact ideals</text>
<text x="840" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">A₁ = C*(J, 𝒦(E₁₂)⊗̂1, 𝒦(E₁)⊗̂1⊗̂1)</text>
<text x="840" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">M A₁ ⊂ J;  N H₋ ∈ J;  M+N=1.</text>
<text x="840" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">M and N commute with φ(A), S, T, F mod J.</text>
<path d="M420 615 L420 660" stroke="#446b94" stroke-width="3" marker-end="url(#arr)" fill="none"/>
<path d="M1180 615 L1180 660" stroke="#446b94" stroke-width="3" marker-end="url(#arr)" fill="none"/>
<rect x="50" y="675" width="1500" height="220" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">The new operator is F′ = M¹/² S + N¹/² F, symmetrized by fourth powers.</text>
<text x="80" y="779" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">φ(a)[T,F′]φ(a)* ≡ M¹/⁴ (Pₐ ⊗̂ 1) M¹/⁴ + N¹/⁴ φ(a)H₊φ(a)* N¹/⁴ ≥ 0 mod J.</text>
<text x="80" y="831" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">The M term stays positive; its Kₐ error lies in J. The N term loses only the negative part H₋.</text>
<text x="55" y="943" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="normal" fill="#20334d">Proof: K-theory of the leaf space, Lemma0.8, Theorem0.9 and (100)–(101). All brackets here are anticommutators.</text>
<text x="55" y="987" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">Human background: Blackadar, §18.6. Original editable diagram: GPT-6.1 Sol (OpenAI), CC0.</text>
<text x="55" y="1025" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="normal" fill="#20334d">Scope: separable graded algebras; countably generated modules; bounded self-adjoint odd representatives.</text>
</svg>
