<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<title>A full-support measurable plaque family can hide infinite transverse mass</title>
<desc>On the product foliation by circles, the plaque mass is sin squared pi u except that its value at zero is one. The transverse density is its reciprocal and has infinite integral near zero. Their product is the constant unit density one. The reciprocal plot is clipped at twelve and marked with arrows; it is not a finite upper bound.</desc>
<defs><marker id="up" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b54c1c"/></marker>
