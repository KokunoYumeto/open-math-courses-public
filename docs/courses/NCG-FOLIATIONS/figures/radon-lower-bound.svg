<rect width="1500" height="1000" fill="#f6f8fc"/>
<text x="45" y="60" class="title">Full support controls positivity, but it supplies no uniform lower bound</text>
<text x="45" y="110">V = (R/Z)ₜ × (R/Z)ᵤ,   leaves are t-circles,   δ = 1,   all coordinate lengths are 1</text>

