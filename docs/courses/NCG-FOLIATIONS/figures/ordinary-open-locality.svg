<text x="960" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#243951">Finite radial distance to the boundary: the metric is incomplete.</text>
<rect x="40" y="815" width="1720" height="375" rx="15" fill="white" stroke="#c7d4df" stroke-width="2"/>
<text x="70" y="869" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243951">3. Local compactness removes the inside–outside coupling</text>
<text x="80" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243951">H = PH ⊕ (1 − P)H;    P = multiplication by 1_U</text>
<text x="80" y="980" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243951">F can mix the two summands.  For a ∈ C_c(U), choose χ = 1 near supp(a).</text>
<text x="80" y="1033" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243951">aF(1 − P) = a[χ, F](1 − P) ∈ K</text>
<text x="910" y="1033" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243951">(1 − P)Fa = (1 − P)[F, χ]a ∈ K</text>
<text x="80" y="1086" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243951">Block homotopy → PFP on PH → interior phase with the same principal symbol</text>
<text x="80" y="1140" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243951">[e_Φ] ⊗ a_π = a_(f ∘ pr_N)^ambient;  the full orientation contraction follows separately.</text>
<text x="45" y="1245" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243951">Lemmas 7.14–7.15, equations 274–282; Exercises 56–57, equations 283–285.</text>
<text x="45" y="1282" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#243951">Exact annulus and sampled compression curve (−1 ≤ v ≤ 1). Original: GPT-6.1 Sol (OpenAI), CC0.</text>
