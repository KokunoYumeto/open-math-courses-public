<text x="612" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#a74736">Φ(0, 1/(4√3))</text>
<text x="701" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#a74736">(9/8, 0)</text>
<text x="78" y="716" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243951">U: 3/4 &lt; |z| &lt; 5/4</text>
<text x="78" y="756" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243951">Dashed boundary circles are excluded.  One unit = 200 px.</text>
<text x="940" y="204" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243951">2. Infinite v compresses to a finite normal disk</text>
<text x="960" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243951">w(v) = v / √(1 + 16v²)</text>
<text x="960" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243951">Φ(θ, v) = (1 + w(v)) (cos θ, sin θ)</text>
