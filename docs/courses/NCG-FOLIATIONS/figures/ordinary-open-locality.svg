<text x="45" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243951">An open normal tube retains the ambient analytical class</text>
<text x="45" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243951">Exact example: S¹ → point, u(θ) = (cos θ, sin θ), signed outward normal v, ρ = 1/4.</text>
