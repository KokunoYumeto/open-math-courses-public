<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1730" viewBox="0 0 1760 1730">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#47677f"/></marker></defs>
<rect width="1760" height="1730" fill="#f3f7fb"/>
<text x="48" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#20334d">The full holonomy factorization: germs, modules and one interval cycle</text>
<text x="48" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">M compact (dimension d); τ=TV/F (rank q); A=Cᵣ*(G); n even; k=n−d+q=p+2t≥1.</text>
<rect x="40" y="140" width="1680" height="345" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">1. One common shrink turns germs into a Hausdorff neighbourhood</text>
<text x="70" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">D = ⨿ₐ Vₐ × Bε</text>
<text x="720" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">H = D / R</text>
<path d="M440,237 L675,237" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="495" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">quotient</text>
<text x="1100" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">M → H → M;  pι=1</text>
<text x="70" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">(x,v)ₐ R (x,w)ᵦ  ⇔  w=Fᵦₐ(x,v), with both vectors in Bε ⊂ ℝ^q.</text>
<text x="70" y="361" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Exact triple identities ⇒ no extra chain identifications.  R closed + quotient open ⇒ H Hausdorff.</text>
<text x="70" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Original transverse coordinate y=hₐ(x)+v: plaques dy=0; normal transition DHᵦₐ; bundle f*τ.</text>
<text x="70" y="459" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Kᵦₐ(x,y) are actual holonomy arrows; K𝒸ᵦKᵦₐ=K𝒸ₐ on the same shrink.</text>
<rect x="40" y="515" width="1680" height="325" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">2. The Euclidean normal disk gives an actual étale replacement</text>
<text x="95" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#20334d">M</text>
<text x="650" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#20334d">Nⱼ ⊂ p*νⱼ</text>
<text x="1270" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#20334d">V/F × ℝⁿ</text>
<path d="M170,615 L580,615" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="335" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">kⱼ</text>
<path d="M930,615 L1210,615" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="1054" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">gⱼ</text>
<text x="70" y="684" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">kⱼ(x)=(ι(x),0);  normal Eⱼ=νⱼ⊕f*τ, with the full specified spin-c module.</text>
<text x="70" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Transverse map: (x,y,η) ↦ (y,j(x)+η); derivative blocks Idᑫ and dΦⱼ are invertible.</text>
<text x="70" y="799" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Target arrow on overlaps: (Kᵦₐ(x,y), j(x)+η).  Its Euclidean coordinate is identical at both ends.</text>
<rect x="40" y="870" width="1680" height="370" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="918" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">3. For étale g:N→V/F, retain every lift in the completed module</text>
<text x="80" y="985" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#20334d">P_g</text>
<text x="730" y="985" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#20334d">N</text>
<text x="1420" y="985" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#20334d">V</text>
<path d="M190,974 L660,974" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="410" y="955" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">b</text>
<path d="M180,1008 Q820,1060 1410,1008" fill="none" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="795" y="1069" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">a: local diffeomorphism</text>
<text x="70" y="1120" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">E_g ⊗πₓ L²(Gₓ) ≅ ℓ²(a⁻¹(x)); distinct germs remain distinct counting lifts.</text>
<text x="70" y="1172" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Normalized short-plaque vectors give θξ,ξ = multiplication by |σ|² on E_g.</text>
<text x="70" y="1220" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">With ℝⁿ over I: E_𝒈 ⊗evₛ Dₙ ≅ E_gₛ, an onto isometry over the whole C(I,Dₙ).</text>
<rect x="40" y="1270" width="1680" height="340" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="1318" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">4. One product proves homotopy; ordered stabilization cancels</text>
<text x="70" y="1380" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Dₙ=A⊗C₀(ℝⁿ);  𝔣ⱼ=contractₖ→ₚ(kⱼ! gⱼ!⁽ᵏ⁾) Aₙ  ∈ KK(C(M),A⊗Cₚ).</text>
<text x="70" y="1439" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Vertical sprays keep s fixed; one normalized tube and the full normal module vary over I×M.</text>
<text x="70" y="1495" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">𝔉 ∈ KK(C(M),C(I,A⊗Cₚ)); its exact endpoints are 𝔣ⱼ₀ and 𝔣ⱼ₁.</text>
<text x="70" y="1551" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">E_g×1 ≅ E_g ⊗ C₀(ℝ²a); adjacent B₂a A₂a=1 ⇒ 𝔣₍ⱼ,₀₎=𝔣ⱼ, with Cₚ retained first.</text>
<text x="48" y="1654" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Lemmas 6.0l–n, Theorem 6.0o, Exercises 42–43.  Diagrams show exact maps, not a geometric projection.</text>
<text x="48" y="1700" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">G may be non-Hausdorff.  Module compactness does not imply Hilbert-space compactness after regular tensoring.</text>
</svg>
