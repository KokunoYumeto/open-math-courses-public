<text x="847" y="137" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="" >IX.2–IX.5</text>
<text x="48" y="162" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="" >Fixed compact symmetric arrow test C;  K = s(C) ∪ r(C).</text>
<text x="48" y="185" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="" >Every C-word w = gₙ⋯g₁ has one common normal-ball radius ε.</text>
