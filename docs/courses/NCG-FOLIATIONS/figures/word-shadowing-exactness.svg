<text x="78" y="351" font-size="16" fill="#16745d" font-weight="400" text-anchor="start" class="" >x₀,…,xₙ ∈ closed invariant F; the green badge marks membership only.</text>
<text x="48" y="378" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math" >d(yₖ,xₖ) ≤ d(y₀,x₀) &lt; δ &lt; ε/2, for every k and every length n.</text>
<text x="48" y="404" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="" >Dashed segments: short normal geodesics; solid arrows: the same original maps.</text>
<text x="48" y="428" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math" >[u]ᵧ₀ = [v]ᵧ₀  ⇔  [u]ₓ₀ = [v]ₓ₀  by connected-ball uniqueness.</text>
<text x="48" y="451" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="" >Distinct original isotropy germs remain distinct. The original metric may be incomplete.</text>
<rect x="28" y="472" width="844" height="218" rx="12" fill="#f7fafc" stroke="#d4e0e7" />
<rect x="46" y="489" width="28" height="28" rx="7" fill="#153046" stroke="none" />
<text x="60" y="509" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="" >B</text>
<text x="88" y="509" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="" >Every source-fibre component</text>
<text x="847" y="509" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="" >IX.5–IX.8</text>
<rect x="48" y="530" width="345" height="55" rx="9" fill="#fff5e9" stroke="#e7c69e" />
<text x="65" y="553" font-size="19" fill="#a8590e" font-weight="400" text-anchor="start" class="math" >h : s(h) → y₀ is arbitrary</text>
<text x="65" y="576" font-size="16" fill="#a8590e" font-weight="400" text-anchor="start" class="" >Its domain is never extended.</text>
<line x1="406" y1="557" x2="449" y2="557" stroke="#153046" stroke-width="2" marker-end="url(#ink-arrow)"/>
<rect x="464" y="530" width="384" height="55" rx="9" fill="#eaf0f8" stroke="#bdd0e3" />
<text x="479" y="553" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math" >R(h′) = h′h⁻¹ ∈ W ⊂ Wᵧ₀(C)</text>
<text x="479" y="576" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="" >Exact onto basis right translation.</text>
<text x="48" y="612" font-size="22" fill="#153046" font-weight="400" text-anchor="start" class="math" >V : ℓ²(W) ↪ ℓ²((G|F)ₓ₀),     e<tspan baseline-shift="sub" font-size="15.84">[w]ᵧ₀</tspan> ↦ e<tspan baseline-shift="sub" font-size="15.84">[w]ₓ₀</tspan></text>
<text x="48" y="640" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math" >Aᵧ₀ = P<tspan baseline-shift="sub" font-size="14.4">W</tspan> λᵧ₀(f) P<tspan baseline-shift="sub" font-size="14.4">W</tspan>;   compare with V* λₓ₀(f) V.</text>
<text x="48" y="664" font-size="16" fill="#153046" font-weight="400" text-anchor="start" class="" >0 ≤ D ≤ 1:  D e<tspan baseline-shift="sub" font-size="11.52">w</tspan> = b(rw)e<tspan baseline-shift="sub" font-size="11.52">w</tspan>.  VDV* carries the same original weights;</text>
<text x="48" y="687" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="" >zero off the image. No cutoff re-evaluation or cutoff modulus is used.</text>
<rect x="28" y="708" width="844" height="215" rx="12" fill="#f7fafc" stroke="#d4e0e7" />
<rect x="46" y="725" width="28" height="28" rx="7" fill="#153046" stroke="none" />
<text x="60" y="745" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="" >C</text>
<text x="88" y="745" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="" >Extra shadow edges and the full matrix bound</text>
<text x="847" y="745" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="" >IX.6–IX.7</text>
<text x="48" y="771" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="math" >For each i:  p = r(w),  p′ = r(Jw),  d(p,p′) ≤ δ.</text>
<text x="48" y="798" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="" >aᵢ(p) ≠ 0:  a shadow i-edge Jw → Jv forces the original i-edge w → v.</text>
<text x="48" y="824" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="" >aᵢ(p) = 0:  any extra shadow coefficient is ≤ ω(δ) in absolute value.</text>
<text x="48" y="847" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="" >Use the continuous zero extension; do not invent an absent original arrow.</text>
<text x="48" y="873" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="" >Each i has ≤ 1 entry per row and column in each compressed matrix.</text>
<text x="48" y="902" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math" >E = Aᵧ₀ − V*λₓ₀(f)V:  row sums, column sums, and ‖E‖ ≤ 2mω(δ).</text>
<text x="48" y="920" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="" >Absolute sums on the entire infinite component; the last bound is the Schur estimate.</text>
<rect x="28" y="941" width="844" height="145" rx="12" fill="#f7fafc" stroke="#d4e0e7" />
<rect x="46" y="958" width="28" height="28" rx="7" fill="#153046" stroke="none" />
<text x="60" y="978" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="" >D</text>
<text x="88" y="978" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="" >The actual ideal and exact quotient norm</text>
<text x="847" y="978" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="" >IX.8–IX.10</text>
<text x="48" y="1005" font-size="16" fill="#153046" font-weight="400" text-anchor="start" class="" >Choose 2mω(δ) &lt; η; take the supremum over every component of every fibre.</text>
<text x="48" y="1028" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math" >‖bfb‖ᵣ ≤ ‖f|F‖ᵣ + η;   I<tspan baseline-shift="sub" font-size="14.4">U</tspan> = Cᵣ*(G|U),   f − bfb ∈ I<tspan baseline-shift="sub" font-size="14.4">U</tspan>.</text>
<rect x="48" y="1048" width="800" height="30" rx="6" fill="#e4f2ed" stroke="none" />
<text x="448" y="1070" font-size="23" fill="#16745d" font-weight="700" text-anchor="middle" class="math" >‖f + I<tspan baseline-shift="sub" font-size="16.56">U</tspan>‖ = ‖f|F‖ᵣ   (f|F = f|<tspan baseline-shift="sub" font-size="16.56">G|F</tspan>)</text>
<rect x="28" y="1104" width="844" height="192" rx="12" fill="#f7fafc" stroke="#d4e0e7" />
<rect x="46" y="1121" width="28" height="28" rx="7" fill="#153046" stroke="none" />
<text x="60" y="1141" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="" >E</text>
<text x="88" y="1141" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="" >The original finite Killing-rank sequence</text>
<text x="847" y="1141" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="" >IX.1, IX.11–IX.12</text>
<text x="48" y="1164" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math" >Uⱼ = {x : k(x) ≥ j},  Sⱼ = Uⱼ ∖ Uⱼ₊₁,  Q = q(q+1)/2;  0 ≤ j ≤ Q.</text>
<text x="450" y="1201" font-size="22" fill="#16745d" font-weight="600" text-anchor="middle" class="math" >0 → Cᵣ*(G|Uⱼ₊₁) → Cᵣ*(G|Uⱼ) → Cᵣ*(G|Sⱼ) → 0</text>
<text x="48" y="1230" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="" >These are the actual reductions with their original reduced norms.</text>
<text x="48" y="1256" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="" >Closed strata need not be manifolds; the original incomplete metric is preserved.</text>
<text x="48" y="1282" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="" >Norm exactness supplies no scalar graph class, physical phase, disk pairing or KK compatibility.</text>
<text x="28" y="1320" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="" >Figure 11BQ.1. Schematic geometry; exact proof locators: IX.2–IX.5 (balls and injection),</text>
<text x="28" y="1340" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="" >IX.6–IX.8 (cosets, coefficients and weights), IX.7–IX.12 (Schur bound, quotient and rank).</text>
<text x="28" y="1360" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="" >Connes: historical graph-normal question. Brix–Carlsen–Sims: inner-exactness terminology only.</text>
