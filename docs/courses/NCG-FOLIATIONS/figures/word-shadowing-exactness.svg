<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
<title id="title">Actual compact-word shadowing and reduced rank exactness</title>
<desc id="desc">Schematic geometry with exact proof content: one compact C and one actual normal-ball radius for every word length (IX.2-IX.5); arbitrary coset right translation and unchanged cutoff weights (IX.6-IX.8 and Section 11BQ); full infinite-matrix Schur estimate, exact quotient and rank restriction (IX.7-IX.12). Dashed comparisons are original short normal geodesics, not holonomy arrows. The complete mathematical argument remains in the accompanying source report and canonical Section 11BQ.</desc>
<metadata>Original schematic expression CC0-1.0. No external images, font bytes, glyph outlines or software bundles.</metadata>
