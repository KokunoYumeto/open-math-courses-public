<rect width="1800" height="1500" fill="#f3f7fb"/>
<text x="40" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#223b53">The full transverse normal family: exact kernels and orientation transport</text>
<text x="40" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#223b53">Lemma 7.23, equations 324–329 · p = rank F, t = rank τ, n even, q = n − p</text>
