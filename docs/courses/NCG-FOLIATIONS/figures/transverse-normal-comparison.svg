<circle cx="1370" cy="380" r="6" fill="#00796b"/>
<text x="1240" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#00796b">Kernel vector (−1, 1)</text>
<text x="1240" y="686" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="normal" fill="#223b53">The other F and ν directions remain in the kernel.</text>
<rect x="35" y="785" width="1735" height="260" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="834" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#223b53">The complete zero-section map (327)</text>
<text x="65" y="890" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#223b53">χ⁻¹(v) = (η, t);     Lₛ(v, k) = (k − s Ht, v);     dim ker dₜᵣₐₙₛ hₛ = n</text>
<text x="65" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#223b53">e₁ L₁(v, k) = du(k) − du(Ht) + η = J(v, k)</text>
<text x="65" y="994" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#223b53">The minus sign comes from the actual graph quotient χ(η,t) = η − du(Ht).</text>
<rect x="35" y="1080" width="1735" height="285" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#223b53">Full orientation transport (325, 328–329)</text>
<text x="65" y="1182" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#223b53">(D_N ⊗ M_F)^β ≅ J*D_n;     right coefficient order after β: C_p, C_q</text>
<text x="65" y="1233" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#223b53">Exact reference at zero → global frame → positive polar correction → R(w, λv) ∈ SO(n)</text>
<text x="65" y="1283" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#223b53">The spin lift starts at 1; grading, every generator, inner products and z⁻¹z = 1 are retained.</text>
<text x="65" y="1335" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#223b53">A line twist is evaluated as the full H* ⊗ H pair, including two-torsion and rank-zero parity.</text>
<text x="40" y="1418" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="bold" fill="#223b53">Lemma 7.23 gives the full geometry; Lemma 7.24 and Theorem 7.25 supply the interval cycle and both endpoints.</text>
<text x="40" y="1468" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#223b53">Equations 324–329; Exercise 64, equation 355 · Classical cocycle context: Connes–Skandalis, Section 4 · CC0.</text>
</svg>
