<text x="60" y="686" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="normal" fill="#223b53">The other F and ν directions remain in the kernel.</text>
<rect x="625" y="150" width="555" height="590" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="650" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#223b53">s = 1/2:  h + s t = 0</text>
<text x="650" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#223b53">One horizontal/normal transverse pair</text>
