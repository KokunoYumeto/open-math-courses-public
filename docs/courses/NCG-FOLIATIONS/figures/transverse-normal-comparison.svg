<text x="1679" y="621" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#223b53">h</text>
<text x="1591" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#223b53">t</text>
