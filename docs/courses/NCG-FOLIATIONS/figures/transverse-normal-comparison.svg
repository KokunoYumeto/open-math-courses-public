<text x="60" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#223b53">s = 0:  h + s t = 0</text>
<text x="60" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#223b53">One horizontal/normal transverse pair</text>
