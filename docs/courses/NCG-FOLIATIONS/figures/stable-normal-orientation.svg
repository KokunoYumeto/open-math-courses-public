<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1690" viewBox="0 0 1700 1690">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#56768e"/></marker></defs>
<rect width="1700" height="1690" fill="#f4f7fb"/>
<text x="50" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#20334d">Prescribed stable orientation → one coherent normal family</text>
<text x="50" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">M compact; W=TM (rank d); T=f*τ (rank q); j:M↪ℝⁿ, n even; E=νⱼ⊕T (rank k=n−d+q≥1).</text>
<rect x="45" y="140" width="1610" height="380" rx="15" fill="white" stroke="#c9d5e3" stroke-width="2"/>
<text x="75" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">1. Keep the exact bundle order and the chosen spin-c structure</text>
<text x="110" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#20334d">E ⊕ Q = (νⱼ, T, W, W)</text>
<text x="970" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#20334d">L ⊕ ℝⁿ = (W, T, ℝⁿ)</text>
<path d="M645,238 L925,238" stroke="#56768e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="732" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">ρⱼ</text>
<text x="75" y="309" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">ρⱼ(η,t,u,v) = (u,t,Jⱼ(v,η));     Jⱼ(v,η)=dj(Gⱼ⁻¹ᐟ²v)+η;     ⟨dju,djv⟩=g(Gⱼu,v).</text>
<text x="75" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Q=W⊕W uses the canonical complex spinor S_Q=Λ*Wℂ; it works for nonorientable W.</text>
<text x="75" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">ε_Q(u,v)=e(u)+ι(u)+i(e(v)−ι(v));     ε_Q(u,v)²=|u|²+|v|².</text>
<text x="75" y="474" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Its complex orientation is interleaved (u₁,v₁,…,u_d,v_d): block-order sign (−1)ᵈ⁽ᵈ⁻¹⁾ᐟ².</text>
<rect x="45" y="550" width="1610" height="385" rx="15" fill="white" stroke="#c9d5e3" stroke-width="2"/>
<text x="75" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">2. Cancel full finite modules through both actual evaluation maps</text>
<text x="75" y="658" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">Pⱼ = ρⱼ*(M_L ⊗ Cₙ) : A_E ⊗ A_Q  →  C_k ⊗ C₂d</text>
<text x="75" y="720" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">M_E = (A_E ⊗ S_Q*) ⊗ Pⱼ ⊗ (C_k ⊗ S_d) : A_E → C_k</text>
<text x="75" y="778" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">S_Q : A_Q → ℂ;    S_d=Λ*ℂᵈ : C₂d → ℂ;    M_Q=S_Q⊗S_d*.</text>
<text x="75" y="833" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Recovery: M_E ⊗ M_Q ≅ Pⱼ.  The maps use ξ⊗η* ↦ θξ,η and ξ*⊗η ↦ ⟨ξ,η⟩.</text>
<text x="75" y="889" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">A_V=Cl⁺(V); tensors are graded over M.  Flip: ξ⊗η ↦ (−1)^(|ξ||η|) η⊗ξ.</text>
<rect x="45" y="965" width="790" height="360" rx="15" fill="white" stroke="#c9d5e3" stroke-width="2"/>
<rect x="865" y="965" width="790" height="360" rx="15" fill="white" stroke="#c9d5e3" stroke-width="2"/>
<text x="75" y="1013" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">3. Full family and even stabilization</text>
<text x="75" y="1071" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">j_θ=(cosθ u₀, sinθ u₁), 0≤θ≤π/2.</text>
<text x="75" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">ρ, P and M_E vary smoothly over I×M.</text>
<text x="75" y="1181" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">j′=(j,0); reorder (ν,R²a,T) → (ν,T,R²a).</text>
<text x="75" y="1236" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">M_E′ ≅ M_E ⊗ C₂a;  new block follows E.</text>
<text x="75" y="1287" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">After contraction: i′! = i!B₂a;  i′!A₂a=i!.</text>
<text x="895" y="1013" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">4. Retain the whole line twist</text>
<text x="895" y="1071" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">M_L ↦ M_L⊗H  ⇒  M_E ↦ M_E⊗H.</text>
<text x="895" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">D_E ⊗ det Wℂ ≅ D_L.</text>
<text x="895" y="1181" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">The determinant changes by H².</text>
<text x="895" y="1236" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">If H²≅1, the determinant can stay fixed</text>
<text x="895" y="1287" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">while the module changes (Exercise 40).</text>
<rect x="45" y="1355" width="1610" height="225" rx="15" fill="white" stroke="#c9d5e3" stroke-width="2"/>
<text x="75" y="1402" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">The ordinary graph comparison now has its specified normal family</text>
<text x="75" y="1461" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#20334d">I_θ=(f,j_θ);    νⱼ⊕f*TY ≅ ν_{I},  (η,t) ↦ [(t,η)].</text>
<text x="75" y="1518" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Lemma 6.0g supplies the actual interval cycle; even Bott inverses cancel the stabilizing blocks.</text>
<text x="50" y="1635" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Full proof: Lemmas 6.0g–h, Propositions/Corollaries 6.0i–k, equations (161)–(180), Exercises 40–41.</text>
<text x="50" y="1673" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">Classical Clifford/spinor context: van Suijlekom, Chapter 4.  The full cancellation/family comparison is proved in the lesson.</text>
</svg>
