<text x="42" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#253b52">The full Thom inverse retains its grading, generator sign and conjugate phase</text>
<text x="42" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#253b52">Lemma 7.16 · Theorem 7.17 · Exercises 58–59 · equations (286)–(297) · T = Λ* Cʳ</text>
