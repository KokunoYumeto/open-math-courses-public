<text x="65" y="1043" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">5. The analytical identity is proved on the full fibre L² module</text>
<text x="80" y="1102" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#253b52">Tᵣ(α_E) = a_E with finite orientation module D_E</text>
<text x="80" y="1154" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#253b52">Finite evaluation → exact graded unitary → compact rectangular connection errors → bounded phase.</text>
<text x="80" y="1205" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#253b52">The graph-normal comparison still needs full prescribed stable recovery; determinant equality is insufficient.</text>
