<text x="920" y="667" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">4. Full real-frame and line transitions</text>
<text x="930" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">Original prescribed module: z s</text>
