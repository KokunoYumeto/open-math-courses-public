<text x="65" y="204" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">1. The ordered left coefficient algebra</text>
<text x="75" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#253b52">Old block, then external block:</text>
<text x="75" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#253b52">(A₁, …, Aᵣ, B₁, …, Bᵣ)</text>
<text x="75" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#253b52">Aᵢ = aᵢ ⊗ I;    Bᵢ = Γ ⊗ L_tᵢ</text>
<text x="75" y="430" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#253b52">aᵢ = eᵢ + ιᵢ;    bᵢ = i(eᵢ − ιᵢ)</text>
<text x="75" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#253b52">p = ∏ᵢ [(I − iAᵢBᵢ) / 2];   range = ψ Cᵣ</text>
<text x="75" y="548" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#253b52">ψ is even;    (bᵢ ⊗ I)ψ = −ψ tᵢ.</text>
<text x="920" y="204" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">2. The two signs in the actual contraction</text>
<text x="930" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#253b52">kᵣ = r(r − 1) / 2 mod 2</text>
<text x="930" y="322" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#253b52">Block volume on ψ: (−1)^kᵣ</text>
<text x="930" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#253b52">Morita corner vector: parity kᵣ</text>
<text x="930" y="440" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#253b52">Remaining right module: Π^kᵣ Cᵣ</text>
<text x="930" y="498" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#253b52">Contracted physical bᵢ: (−1)^(kᵣ+1) L_tᵢ</text>
<text x="930" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#253b52">Corner sign −1 × tensor sign (−1)^kᵣ.</text>
