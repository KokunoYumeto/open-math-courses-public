<text x="930" y="835" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">Transferred inverse module: z⁻¹ ρ_t(s)</text>
<text x="930" y="889" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Twist H → exact dual H*; even spin words remain.</text>
<text x="930" y="932" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Two-torsion lines survive even when H² is trivial.</text>
