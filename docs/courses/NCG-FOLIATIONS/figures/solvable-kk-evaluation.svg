<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450">
<rect width="1600" height="1450" fill="#f4f7fb"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#3a6289"/></marker></defs>
<text x="55" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#20334d">Solvable deformation: every evaluation has both KK inverses</text>
<text x="55" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Separable coefficients; point-norm continuous real actions; fixed ordered Clifford contractions.</text>
<rect x="50" y="150" width="1500" height="460" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">One inductive step: an actual equivariant evaluation and its crossed map</text>
<rect x="135" y="235" width="450" height="100" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="945" y="235" width="450" height="100" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="135" y="465" width="450" height="100" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="945" y="465" width="450" height="100" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="170" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">I: preceding interval algebra</text>
<text x="980" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">I ⋊ R: next interval algebra</text>
<text x="170" y="523" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">C: fibre at v</text>
<text x="980" y="523" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">C ⋊ R: next fibre</text>
<path d="M605,285 L920,285" fill="none" stroke="#3a6289" stroke-width="3" marker-end="url(#a)"/>
<text x="675" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">t<tspan baseline-shift="sub" font-size="70%">I</tspan> ∈ KK₁</text>
<path d="M605,515 L920,515" fill="none" stroke="#3a6289" stroke-width="3" marker-end="url(#a)"/>
<text x="675" y="496" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">t<tspan baseline-shift="sub" font-size="70%">C</tspan> ∈ KK₁</text>
<path d="M355,351 L355,449" fill="none" stroke="#3a6289" stroke-width="3" marker-end="url(#a)"/>
<text x="385" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#20334d">e</text>
<path d="M1170,351 L1170,449" fill="none" stroke="#3a6289" stroke-width="3" marker-end="url(#a)"/>
<text x="1200" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#20334d">e<tspan baseline-shift="sub" font-size="70%">R</tspan></text>
<text x="575" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">t<tspan baseline-shift="sub" font-size="70%">I</tspan>[e<tspan baseline-shift="sub" font-size="70%">R</tspan>] = [e]t<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
<rect x="50" y="640" width="1500" height="210" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="685" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">The inverse is an ordinary KK product</text>
<text x="80" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#20334d">[e<tspan baseline-shift="sub" font-size="70%">R</tspan>] = d<tspan baseline-shift="sub" font-size="70%">I</tspan>[e]t<tspan baseline-shift="sub" font-size="70%">C</tspan>;      x = d<tspan baseline-shift="sub" font-size="70%">C</tspan> c t<tspan baseline-shift="sub" font-size="70%">I</tspan>.</text>
<text x="80" y="798" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">c ∈ KK(C,I) inverts [e]; c need not come from an equivariant homomorphism.</text>
<rect x="50" y="880" width="1500" height="210" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="925" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Both products, with no exchange of graded factors</text>
<text x="80" y="980" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#20334d">[e<tspan baseline-shift="sub" font-size="70%">R</tspan>]x = d<tspan baseline-shift="sub" font-size="70%">I</tspan>[e](t<tspan baseline-shift="sub" font-size="70%">C</tspan>d<tspan baseline-shift="sub" font-size="70%">C</tspan>)c t<tspan baseline-shift="sub" font-size="70%">I</tspan> = d<tspan baseline-shift="sub" font-size="70%">I</tspan>t<tspan baseline-shift="sub" font-size="70%">I</tspan> = 1<tspan baseline-shift="sub" font-size="70%">I⋊R</tspan>.</text>
<text x="80" y="1038" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#20334d">x[e<tspan baseline-shift="sub" font-size="70%">R</tspan>] = d<tspan baseline-shift="sub" font-size="70%">C</tspan>c(t<tspan baseline-shift="sub" font-size="70%">I</tspan>d<tspan baseline-shift="sub" font-size="70%">I</tspan>)[e]t<tspan baseline-shift="sub" font-size="70%">C</tspan> = d<tspan baseline-shift="sub" font-size="70%">C</tspan>t<tspan baseline-shift="sub" font-size="70%">C</tspan> = 1<tspan baseline-shift="sub" font-size="70%">C⋊R</tspan>.</text>
<rect x="50" y="1120" width="1500" height="230" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="1167" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Start with interval contraction; retain the ordered real-factor products</text>
<text x="80" y="1222" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#20334d">[q<tspan baseline-shift="sub" font-size="70%">v</tspan>] = D<tspan baseline-shift="sub" font-size="70%">I</tspan>[e<tspan baseline-shift="sub" font-size="70%">v</tspan>]Θ<tspan baseline-shift="sub" font-size="70%">v</tspan>;      [q<tspan baseline-shift="sub" font-size="70%">v</tspan>]⁻¹ = D<tspan baseline-shift="sub" font-size="70%">v</tspan>[c<tspan baseline-shift="sub" font-size="70%">v</tspan>]Θ<tspan baseline-shift="sub" font-size="70%">I</tspan>.</text>
<text x="80" y="1279" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#20334d">The analytic deformation class is 𝓘<tspan baseline-shift="sub" font-size="70%">H</tspan> = [q₀]⁻¹[q₁] = D₀Θ₁.</text>
<text x="80" y="1324" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Geometric leaf-map and assembly comparisons require their separate proofs.</text>
<text x="55" y="1410" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Corollary 8.14a and Exercise 33. Exact algebraic proof diagram; all arrows retain their domains.</text>
</svg>
