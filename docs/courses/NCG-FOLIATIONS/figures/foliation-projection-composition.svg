<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1740" viewBox="0 0 1760 1740">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#47677f"/></marker></defs>
<rect width="1760" height="1740" fill="#f3f7fb"/>
<text x="48" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#20334d">Projection and composition retain the entire orientation module</text>
<text x="48" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">h:L→M,  f:M→V/F;  L,M compact;  l=dim L, m=dim M, q=rank τ;  r,n even.</text>
<rect x="40" y="140" width="1680" height="325" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">1. Projection is a norm-one transport on the whole tube</text>
<text x="90" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#20334d">π*i*E ⊗ ℋν</text>
<text x="1000" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#20334d">τ*E ⊗ ℋν</text>
<path d="M480,238 L940,238" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="665" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">Tₓ,ᵥ ⊗ 1</text>
<text x="70" y="313" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Tₓ,ᵥ transports along t↦τ(x,tv); it preserves support, both actions and Fν.</text>
<text x="70" y="366" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Cylinder: q(v)=v/√(1+v²);  Tθ,ᵥ=exp(−i sinθ q(v));  |Tθ,ᵥ|=1 for every v∈ℝ.</text>
<text x="70" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">u_L(i*E) i! = i! u_X(E)⁽ᵏ⁾.  The full normal line twist stays in ℋν.</text>
<rect x="40" y="495" width="1680" height="390" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">2. Compose embeddings before the completed étale correspondence</text>
<text x="82" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#20334d">L</text>
<text x="395" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#20334d">M × ℝ^r</text>
<text x="850" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#20334d">Nⱼ × ℝ^r</text>
<text x="1320" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">V/F × ℝⁿ⁺ʳ</text>
<path d="M125,603 L360,603" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="213" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">I_h</text>
<path d="M592,603 L813,603" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="637" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">kⱼ × 1</text>
<path d="M1075,603 L1284,603" stroke="#47677f" stroke-width="3" marker-end="url(#arr)"/>
<text x="1119" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">gⱼ × 1</text>
<text x="70" y="680" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">K=(kⱼh,u);  J=(jh,u);  (gⱼ×1)K=(fh,J), an actual arrow-cocycle equality.</text>
<text x="70" y="740" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">ν_K ≅ E_h ⊕ h*E_f;  E_h=ν_u⊕h*TM,  E_f=νⱼ⊕f*τ;  order E_h then h*E_f.</text>
<text x="70" y="800" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">P_g×1=P_g×ℝ^r;  ℰ_g×1 ≅ ℰ_g ⊗ C₀(ℝ^r), preserving every holonomy lift.</text>
<text x="70" y="852" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Variable-radius tubes handle the noncompact middle M×ℝ^r by one interval cycle.</text>
<rect x="40" y="915" width="1680" height="385" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="963" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">3. Exact normal transport and finite cancellation give the induced orientation</text>
<text x="70" y="1023" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">T=(fh)*τ, U=TL;  [(t,z)] ↦ (η,t−d⊥(fh)v);  v=(dJ*dJ)⁻¹dJ*z, η=z−dJv.</text>
<text x="70" y="1083" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">ℳ_E = ℳ_Eh ⊗ h*ℳ_Ef;  χ:E→ν_J⊕T;  positive metric transport precedes the Clifford map.</text>
<text x="70" y="1143" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">ℳ_EJ ⊗ ℳ_(U⊕U)  ↔  ℳ_(U⊕T) ⊗ Cₙ₊ᵣ;  both finite evaluations are onto even isometries.</text>
<text x="70" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Line twists: (H,D) ↦ H ⊗ h*D.  Cancel the new r inverse, then the old n inverse.</text>
<text x="70" y="1263" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">h! # f! = (fh)! ∈ KK(C(L),A ⊗ Cₚ),  p=q−l mod 2;  # includes the fixed parity contraction.</text>
<rect x="40" y="1330" width="1680" height="300" rx="15" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="1378" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">4. Two odd maps can leave the odd rank-zero line</text>
<text x="70" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">At θ=0: t=(0,1), ν=(1,0).  Ordered normal (a,b,t,ν) maps to (e₃,e₄,e₂,e₁).</text>
<text x="70" y="1498" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">det χ=−1 ⇒ finite Clifford cancellation leaves Πℂ ⇒ h! # f!=−1 in KK(ℂ,ℂ).</text>
<text x="70" y="1558" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Replacing ν by −ν gives det χ=+1 and the even scalar unit +1.  Both virtual ranks are zero.</text>
<text x="48" y="1675" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Lemmas 6.0p–v, Theorems 6.0s/6.0w, Exercises 44–45.  Exact map/module diagrams; no geometric projection.</text>
<text x="48" y="1717" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Classical Thom/open-extension construction: Carey–Wang, Section 4.  Full KK and grading arguments are proved here.</text>
</svg>
