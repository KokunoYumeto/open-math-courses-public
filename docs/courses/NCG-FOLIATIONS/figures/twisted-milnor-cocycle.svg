<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45677f" /></marker></defs>
<rect width="1800" height="1380" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="bold" fill="#243d54">Numerable actual arrows on an explicit Milnor candidate</text>
<text x="40" y="113" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">U1–U4: actual cocycle and full normal twist; M1–M5 now classify eligible parameter bases.</text>
<rect x="35" y="150" width="1730" height="465" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">U1. Normalize an indexed tuple with a common source</text>
<circle cx="340" cy="373" r="9" fill="#00796b" />
<circle cx="830" cy="281" r="9" fill="#00796b" />
<circle cx="830" cy="463" r="9" fill="#00796b" />
<text x="290" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">x</text>
<text x="855" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">uᵢ</text>
<text x="855" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">uⱼ</text>
<path d="M362,367 L807,287" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="564" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">gᵢ</text>
<path d="M362,381 L807,456" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="563" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">gⱼ</text>
<path d="M830,303 L830,440" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="856" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">cⱼᵢ = gⱼ gᵢ⁻¹</text>
<rect x="1170" y="257" width="535" height="120" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1195" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">gᵢ gᵢ⁻¹ = 1_uᵢ</text>
<text x="1195" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">normalized source uᵢ</text>
<rect x="1170" y="402" width="535" height="120" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1195" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">gⱼ gᵢ⁻¹: uᵢ → uⱼ</text>
<text x="1195" y="496" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">actual transition arrow</text>
<text x="65" y="575" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">cₖⱼ cⱼᵢ = cₖᵢ;  normal fibres glue by D cⱼᵢ. All holonomy branches are retained.</text>
<rect x="35" y="650" width="1730" height="305" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">U2. A globally locally finite partition on the candidate</text>
<text x="65" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#00796b">m = maxᵢ tᵢ &gt; 0;   λᵢ = (tᵢ − m/2)₊ / Σⱼ(tⱼ − m/2)₊.</text>
<text x="65" y="821" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">Σᵢ λᵢ = 1;   supp λᵢ ⊂ Oᵢ = {tᵢ &gt; 0}. The closed supports are locally finite.</text>
<text x="65" y="882" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Exact sample: t = (2/5, 7/20, 1/4),  m/2 = 1/5,  λ = (1/2, 3/8, 1/8).</text>
<text x="65" y="928" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The full proof uses m &gt; m₀/2 and Σᵢ∉I₀ tᵢ &lt; m₀/8 near a finite-support point.</text>
<rect x="35" y="990" width="1730" height="220" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1047" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">U3–U4. Whole parameter cocycle and its exact pulled bundle</text>
<text x="65" y="1102" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Φ_f(x) = [(ρ_a(x), f_a,a₀(x))_a];   Φ_f* E_M = f*τ by the actual derivative transitions.</text>
<text x="65" y="1158" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">A positive locally finite metric retains the full Clifford bundle; no spin-c choice is imposed.</text>
<text x="40" y="1267" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part U; Exercises 68–79. Full classifying route: V, Q and D.</text>
<text x="40" y="1312" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The full construction and compact-test comparison are proved in Theorem 6.2, parts T–I.</text>
<text x="40" y="1355" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Human context: Connes (1982), §11 p35; Moerdijk (1991), actual cocycles and classifying spaces.</text>
</svg>