<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850">
<rect width="1080" height="850" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#183345">
<text x="540" y="40" font-size="26" fill="#183345" text-anchor="middle">Nonisometric K-orientation: positive class and exact phase limit</text>
<rect x="35" y="70" width="1010" height="210" rx="12" fill="#edf6f1" stroke="#35634c"/>
<text x="60" y="103" font-size="23" fill="#183345" text-anchor="start">Original q = 1: circle suspension h(theta) = theta + sin(theta)/2</text>
<text x="60" y="139" font-size="20" fill="#183345" text-anchor="start">Fixed-point derivative 3/2: invariant metric would require m(0) = 9m(0)/4.</text>
<text x="60" y="177" font-size="20" fill="#183345" text-anchor="start">Coherent derivative lift retains the full inverse line and actual fixed-point isotropy.</text>
<text x="60" y="215" font-size="20" fill="#183345" text-anchor="start">Negative Fourier phase: compact kernel cancellation; actual reduced norm; disk +1.</text>
<text x="60" y="253" font-size="20" fill="#183345" text-anchor="start">Full suspension graph: completed creation connections preserve the inverse normal symbol.</text>
<rect x="35" y="305" width="1010" height="410" rx="12" fill="#f0f4fa" stroke="#365578"/>
<text x="60" y="342" font-size="23" fill="#183345" text-anchor="start">Original q = 2: psi(theta,y) = (h(theta),y)</text>
<text x="60" y="383" font-size="21" fill="#183345" text-anchor="start">At the fixed circle: Dpsi = diag(3/2, 1).</text>
<text x="60" y="424" font-size="20" fill="#183345" text-anchor="start">The usual flat Dirac phase fails compact covariance.</text>
<text x="60" y="464" font-size="20" fill="#183345" text-anchor="start">One pointwise unitary for all normalized directions</text>
<text x="60" y="495" font-size="20" fill="#183345" text-anchor="start">would require Dpsi = lambda O (conformality).</text>
<text x="60" y="543" font-size="20" fill="#a15b20" text-anchor="start">Source direction: (1,1)/sqrt(2)</text>
<text x="60" y="580" font-size="20" fill="#216982" text-anchor="start">Range direction: (3,2)/sqrt(13)</text>
<text x="60" y="620" font-size="20" fill="#69479b" text-anchor="start">Exact gap: sqrt(2 - 10/sqrt(26))</text>
<text x="60" y="660" font-size="18" fill="#183345" text-anchor="start">This excludes the tested phase; another graph class remains possible.</text>
<path d="M735 650 L1020 650 M735 650 L735 375" stroke="#a7b1bb"/>
<path d="M735 650 L918.84776311 466.15223689" stroke="#a15b20" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M735 650 L951.33307653 505.77794898" stroke="#216982" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M918.84776311 466.15223689 L951.33307653 505.77794898" stroke="#69479b" stroke-width="3" stroke-dasharray="5 4"/>
<text x="875" y="408" font-size="18" fill="#183345" text-anchor="middle">Exact symbol vectors</text>
<rect x="35" y="740" width="1010" height="80" rx="12" fill="#fff4e6" stroke="#ad7941"/>
<text x="60" y="774" font-size="20" fill="#183345" text-anchor="start">NRA.1–NRA.10 and AP.1–AP.12: original degrees, actual arrows and exact signs retained.</text>
<text x="60" y="804" font-size="19" fill="#183345" text-anchor="start">General metric-bundle routes still need reduced descent and the original disk comparison.</text>
</g></svg>
