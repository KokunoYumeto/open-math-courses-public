<text x="48" y="241" font-size="21" fill="#153046" font-weight="400" text-anchor="start" class="math">o(x<tspan baseline-shift="sub" font-size="15.12">I</tspan>) = 0  ⇔  ∃ x<tspan baseline-shift="sub" font-size="15.12">A</tspan> ∈ KK<tspan baseline-shift="super" font-size="15.12">q</tspan>(Aᵣ, ℂ):  iᵣ<tspan baseline-shift="super" font-size="15.12">*</tspan>x<tspan baseline-shift="sub" font-size="15.12">A</tspan> = x<tspan baseline-shift="sub" font-size="15.12">I</tspan>.</text>
