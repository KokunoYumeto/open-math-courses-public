<title id="title">Scalar extension across actual rank jumps</title>
<desc id="desc">Figure 11BR.1. Schematic of the exact scalar boundary criterion, the literal q=4 shared tautological projection and weighted original normal domain, and the q=3 one-auxiliary scalar countertest. Proof: Section 11BR, SE.1-SE.35, with full-homotopy scalar and simultaneous-suspension proof locators. The boundary classes hat_s+/- retain their torus coefficients. Local disk +1 does not erase the quotient-unit obstruction -1; the original untwisted class is not refuted.</desc>
<metadata>Original expression CC0-1.0. Installed fonts and external software retain their actual terms.</metadata>
