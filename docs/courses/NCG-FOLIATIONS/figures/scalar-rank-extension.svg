<text x="48" y="566" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">H<tspan baseline-shift="sub" font-size="13.68">M</tspan> = L²(T, M ⊗ S<tspan baseline-shift="sub" font-size="13.68">inv</tspan>, dvol<tspan baseline-shift="sub" font-size="13.68">g</tspan>) = e<tspan baseline-shift="sub" font-size="13.68">A</tspan>L²(T, S<tspan baseline-shift="sub" font-size="13.68">inv</tspan>, dvol<tspan baseline-shift="sub" font-size="13.68">g</tspan>)².</text>
<text x="48" y="595" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">R = (16 − ‖w‖²)<tspan baseline-shift="super" font-size="13.68">-1</tspan>;    α = (1 + |dR|<tspan baseline-shift="sub" font-size="13.68">g</tspan>²)<tspan baseline-shift="super" font-size="13.68">-1/2</tspan>;    D<tspan baseline-shift="sub" font-size="13.68">M</tspan><tspan baseline-shift="super" font-size="13.68">α</tspan> = α<tspan baseline-shift="super" font-size="13.68">1/2</tspan>N<tspan baseline-shift="sub" font-size="13.68">M</tspan>α<tspan baseline-shift="super" font-size="13.68">1/2</tspan>.</text>
<text x="48" y="625" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">Dom D<tspan baseline-shift="sub" font-size="13.68">M</tspan><tspan baseline-shift="super" font-size="13.68">α</tspan> = {u ∈ H<tspan baseline-shift="sub" font-size="13.68">M</tspan>: u ∈ H¹<tspan baseline-shift="sub" font-size="13.68">loc</tspan>, D<tspan baseline-shift="sub" font-size="13.68">M</tspan><tspan baseline-shift="super" font-size="13.68">α</tspan>u ∈ L² distributionally}.</text>
