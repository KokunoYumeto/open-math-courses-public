<text x="48" y="1103" font-size="16" fill="#153046" font-weight="400" text-anchor="start" class="">One auxiliary sees (a,b); the left basis is scaled by √2, so its (c,d) labels act trivially.</text>
<text x="48" y="1135" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math">D̂<tspan baseline-shift="super" font-size="14.4">+</tspan> = −i/(2π) ∂<tspan baseline-shift="sub" font-size="14.4">θ₁</tspan> + 1/(2π) ∂<tspan baseline-shift="sub" font-size="14.4">θ₂</tspan>;   full periodic domain H¹(X̂).</text>
