<text x="1252" y="1216" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">12</text>
<text x="80" y="1120" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">uₙ</text>
<text x="80" y="1162" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">k*uₙ</text>
<text x="1640" y="1188" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">t</text>
<text x="80" y="1256" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">uₙ(t)=u(t−6n);  ‖k*uₙ−k*uₘ‖₂=√2‖v‖₂&gt;0 for n≠m.  No norm-convergent subsequence.</text>
<text x="48" y="1330" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Theorem7.1, Lemma7.2, Corollary7.3; equations240–246; solved Exercises48–49, equations247–248.</text>
<text x="48" y="1376" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">The last panel shows exact support intervals [6n−1,6n+1] and [6n−2,6n+2], for n=0,1,2.</text>
