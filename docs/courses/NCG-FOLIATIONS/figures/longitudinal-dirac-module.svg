<text x="965" y="287" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Rank-one scalar coefficient of c⁺(ξ).</text>
<rect x="40" y="608" width="1720" height="327" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">2. Even leaf rank: the full orientation line cancels</text>
<text x="80" y="728" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Change by H:  ΘF,H(a) = ΘF(a·[H])</text>
<text x="980" y="728" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">ℓ!F;H = [H]·ℓ!F</text>
<path d="M800,712 L930,712" fill="none" stroke="#49677e" stroke-width="3" marker-end="url(#arr)"/>
<text x="80" y="792" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">For a fixed symbol s,  ΘF,H⁻¹(s) = [H*]·ΘF⁻¹(s).  The product retains H* ⊗ H = 1.</text>
<text x="80" y="855" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">Rank zero: Θ(a)=a·[H], ℓ!=[H], and Ind(s)=s·[H*]·[H]=s.</text>
<text x="80" y="904" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Even leaf rank: Indₐₙ(s) = ΘF⁻¹(s)·ℓ!ₐₙ for every elliptic relative symbol class.</text>
<rect x="40" y="965" width="1720" height="317" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="1016" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">3. Module compactness can have infinite ordinary rank on a cover</text>
<text x="80" y="1070" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">k,u supported in [−1,1]; ‖u‖₂=1; v=k*u≠0 is supported in [−2,2].</text>
