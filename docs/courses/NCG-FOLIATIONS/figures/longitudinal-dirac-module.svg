<rect width="1800" height="1420" fill="#f3f7fb"/>
<text x="48" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#20334d">The longitudinal Dirac cycle retains its whole module</text>
<text x="48" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">V compact; G = Hol(V,F); A = Cᵣ*(G); full Spinᶜ structure; ordered positive Clifford algebra Cₚ.</text>
<rect x="40" y="138" width="1720" height="440" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">1. The Clifford symbol becomes a module cycle</text>
<text x="80" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Transitions [s,z] act by zs</text>
<text x="80" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#20334d">ℰ = e(A ⊗̂ Cₚ)ᴺ</text>
<text x="80" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">𝒦(ℰ) = e M_N(A ⊗̂ Cₚ) e</text>
<text x="80" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">P odd and self-adjoint</text>
<text x="80" y="468" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">P²−1 and [P,f] belong to 𝒦(ℰ)</text>
<text x="80" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">No global tangent frame or transverse measure.</text>
<text x="1030" y="239" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">b(ξ) = c⁺(ξ) / √(1+|ξ|²)</text>
