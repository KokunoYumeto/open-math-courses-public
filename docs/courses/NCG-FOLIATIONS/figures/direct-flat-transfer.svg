<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2563eb"/></marker></defs><rect width="760" height="1000" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="30" y="38" font-size="24" fill="#172554" text-anchor="start">Incomplete flat holonomy: actual domains and direct transfer</text><text x="30" y="65" font-size="16" fill="#475569" text-anchor="start">Theorem 11BN.1 · IHT.8–IHT.26 · Exercises 294–296</text><rect x="26" y="88" width="708" height="326" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="117" font-size="19" fill="#172554" text-anchor="start">A. Two deleted points; three separate leaves at height zero</text><line x1="160" y1="158" x2="160" y2="353" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/><text x="160" y="150" font-size="15" fill="#172554" text-anchor="middle">T_L: x = −1</text><line x1="350" y1="158" x2="350" y2="353" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/><text x="350" y="150" font-size="15" fill="#172554" text-anchor="middle">T_M: x = 1</text><line x1="540" y1="158" x2="540" y2="353" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/><text x="540" y="150" font-size="15" fill="#172554" text-anchor="middle">T_R: x = 3</text><line x1="107.75" y1="200.0" x2="592.25" y2="200.0" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="205.0" font-size="14" fill="#172554" text-anchor="start">y = 1/2</text><circle cx="160" cy="200.0" r="5" fill="#2563eb"/><circle cx="350" cy="200.0" r="5" fill="#2563eb"/><circle cx="540" cy="200.0" r="5" fill="#2563eb"/><line x1="107.75" y1="260.0" x2="592.25" y2="260.0" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="265.0" font-size="14" fill="#172554" text-anchor="start">y = 1/4</text><circle cx="160" cy="260.0" r="5" fill="#2563eb"/><circle cx="350" cy="260.0" r="5" fill="#2563eb"/><circle cx="540" cy="260.0" r="5" fill="#2563eb"/><line x1="168" y1="200" x2="341" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><line x1="358" y1="200" x2="531" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="184" font-size="18" fill="#172554" text-anchor="middle">h</text><text x="445" y="184" font-size="18" fill="#172554" text-anchor="middle">g</text><line x1="107.75" y1="320" x2="245" y2="320" stroke="#334155" stroke-width="3"/><line x1="265" y1="320" x2="435" y2="320" stroke="#334155" stroke-width="3"/><line x1="455" y1="320" x2="592.25" y2="320" stroke="#334155" stroke-width="3"/><text x="52" y="325" font-size="14" fill="#172554" text-anchor="start">y = 0</text><line x1="249" y1="314" x2="261" y2="326" stroke="#dc2626" stroke-width="3"/><line x1="249" y1="326" x2="261" y2="314" stroke="#dc2626" stroke-width="3"/><text x="255" y="350" font-size="14" fill="#b91c1c" text-anchor="middle">(0,0) removed</text><line x1="439" y1="314" x2="451" y2="326" stroke="#dc2626" stroke-width="3"/><line x1="439" y1="326" x2="451" y2="314" stroke="#dc2626" stroke-width="3"/><text x="445" y="350" font-size="14" fill="#b91c1c" text-anchor="middle">(2,0) removed</text><text x="45" y="385" font-size="15" fill="#172554" text-anchor="start">Only positive-height cross arrows are shown. There is no zero-height cross arrow.</text><rect x="26" y="434" width="708" height="180" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="465" font-size="18" fill="#172554" text-anchor="start">B. A radius feature is shadowed; the relative cost detects the increment</text><text x="45" y="496" font-size="20" fill="#172554" text-anchor="start">ρ(h) = ρ(gh) = |y|       ⇒       kρ(gh,h) = 0</text><text x="45" y="530" font-size="18" fill="#1d4ed8" text-anchor="start">k(gh,h) = 1 + y⁻² for every nonunit g, independently of h</text><text x="45" y="562" font-size="17" fill="#172554" text-anchor="start">y = 1/2: cost 5        y = 1/4: cost 17        y → 0: cost → ∞</text><text x="45" y="593" font-size="16" fill="#172554" text-anchor="start">Low cost ≤ R forces |y| ≥ (R−1)⁻¹ᐟ² when R &gt; 1.</text><rect x="26" y="635" width="708" height="314" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="666" font-size="18" fill="#172554" text-anchor="start">C. The even auxiliary leaves the original disk and normal degree intact</text><rect x="52" y="711" width="100" height="52" rx="12" fill="white" stroke="#cbd5e1"/><text x="102.0" y="743" font-size="18" fill="#172554" text-anchor="middle">A_r(G)</text><rect x="222" y="711" width="210" height="52" rx="12" fill="white" stroke="#cbd5e1"/><text x="327.0" y="743" font-size="18" fill="#172554" text-anchor="middle">A_m(G) ⊗ B</text><rect x="500" y="711" width="108" height="52" rx="12" fill="white" stroke="#cbd5e1"/><text x="554.0" y="743" font-size="18" fill="#172554" text-anchor="middle">A_m(G)</text><line x1="153" y1="737" x2="214" y2="737" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="183" y="704" font-size="19" fill="#172554" text-anchor="middle">Δ_r</text><line x1="433" y1="737" x2="492" y2="737" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="704" font-size="17" fill="#172554" text-anchor="middle">1 ⊠ κ</text><text x="52" y="793" font-size="18" fill="#172554" text-anchor="start">Δ_r(f) = Σδ fδ ⊗ λδ</text><text x="52" y="821" font-size="16" fill="#172554" text-anchor="start">fδ retains its actual domain; B = C*r(Γ), and κ has unit index +1.</text><text x="52" y="853" font-size="19" fill="#1d4ed8" text-anchor="start">Original disk: b_U[j_U][i_r] Θ = b_U[j_U][i_m]</text><text x="52" y="883" font-size="17" fill="#172554" text-anchor="start">Then x_r = Θ ⊗ x_N has degree q and original Bott pairing +1.</text><text x="52" y="914" font-size="15" fill="#172554" text-anchor="start">Full inverse Spin-c coefficient and ordered right Clifford block are retained.</text><text x="30" y="979" font-size="14" fill="#475569" text-anchor="start">Exact coordinate/type schematic · original CC0 expression · no global action asserted</text></g></svg>