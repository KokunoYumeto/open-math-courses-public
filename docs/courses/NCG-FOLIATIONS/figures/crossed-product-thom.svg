<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1660" viewBox="0 0 1600 1660">
<rect width="1600" height="1660" fill="#f4f7fb"/>
<text x="60" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="45" fill="#20334d" font-weight="bold">Crossed products and the real Thom map</text>
<text x="60" y="111" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">Exact kernel, Haar and Fourier conventions; complete proofs accompany the diagram.</text>
<rect x="50" y="145" width="730" height="347" rx="16" fill="#fff" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="145" width="740" height="347" rx="16" fill="#fff" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">A. Full = reduced, for every real action</text>
<text x="78" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">(WTv)(t) = (2T)⁻¹ᐟ² 1[−T,T](t) U−t v</text>
<text x="78" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Π(b)WT = WTρ(b)</text>
<text x="78" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">‖λsWT − WTUs‖² = min(2, |s|/T)</text>
<text x="78" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Integrate the defect against ‖f(s)‖;</text>
<text x="78" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">compact support makes it tend to zero.</text>
<text x="78" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">ℤ: squared defect = min(2, 2|k|/(2N+1)).</text>
<text x="78" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Lemma 8.3.  Exactness and stability: Lemma 8.4.</text>
<text x="838" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">B. Double crossed product = B ⊗ K</text>
<text x="838" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">VqUs = eⁱqs UsVq;  dual phase is positive.</text>
<text x="838" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">b ↦ Mα−t(b),   Us ↦ λs,   Vq ↦ Meⁱqt</text>
<text x="838" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">Kf(t,r) = α−t( ∫ f(t−r,q) eⁱqr dq )</text>
<text x="838" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">This kernel uses the order UsVq.</text>
<text x="838" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">Double dual: αv ⊗ Ad λ−v</text>
<text x="838" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Untwist jF(t)=α−t(F(t)); then use kernels.</text>
<text x="838" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Lemmas 8.5–8.6; no added 2π kernel factor.</text>
<rect x="50" y="522" width="730" height="477" rx="16" fill="#fff" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="522" width="740" height="477" rx="16" fill="#fff" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">C. Wiener–Hopf defect at one</text>
<text x="78" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">u(t) = e⁻ᵗᐟ² 1t&gt;0,   ‖u‖₂ = 1</text>
<text x="78" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">E(t,r) = u(t)u(r): rank-one projection</text>
<text x="78" y="699" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">F(t,r) = e⁻⁽ᵗ⁻ʳ⁾ᐟ² 1t&gt;r&gt;0</text>
<text x="78" y="742" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">S = 1−F;   S*S = 1,   SS* = 1−E</text>
<text x="78" y="784" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Fε and Eε are unitary dilations.</text>
<text x="78" y="826" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">‖Fε‖ = 2 for every ε; Fε does not vanish.</text>
<text x="78" y="869" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">ωε(b) = Sε μ(b) Sε*</text>
<text x="78" y="909" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">ψε(b) = b ⊗ Eε in the untwisted ideal</text>
<text x="78" y="952" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">μ ε = ωε+ψε → μ in point norm</text>
<text x="78" y="986" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Theorem 8.7; bounds (36)–(37); Exercise 9.</text>
<text x="838" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">D. Boundary isomorphism and its sign</text>
<text x="838" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">0 → B⊗K → Wα → B ⋊α ℝ → 0</text>
<text x="838" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">με,* = μ* + ψ*,   but με,* = μ*</text>
<text x="838" y="699" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">⇒ ideal map is zero ⇒ index is onto</text>
<text x="838" y="742" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Duality + suspension + contractible cone</text>
<text x="838" y="784" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">⇒ K*(Wα)=0 ⇒ both boundaries are isos.</text>
<text x="838" y="826" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">Physical Fourier sign:  exp(−ipt).</text>
<text x="838" y="869" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">u+(p)=(p−i/2)/(p+i/2): winding +1</text>
<text x="838" y="909" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">∂[u+] = +[E];  ∂⁻¹(1)=[u+]</text>
<text x="838" y="952" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Natural analytic Thom; geometric comparison remains.</text>
<text x="838" y="986" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Theorem 8.7 and Corollary 8.10.</text>
<rect x="50" y="1029" width="730" height="401" rx="16" fill="#fff" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="1029" width="740" height="401" rx="16" fill="#fff" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="1076" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">E. Solvable induction keeps Haar factors</text>
<text x="78" y="1120" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">H=N ⋊θ ℝ;  dH=mt⁻¹ dn dt</text>
<text x="78" y="1162" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">mt=|det dθt|;   n=θt(k)</text>
<text x="78" y="1205" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">mt⁻¹ dn dt = dk dt</text>
<text x="78" y="1248" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">βt f(n)=mt⁻¹ αt(f(θ−t n))</text>
<text x="78" y="1290" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">(Zξ)(t,k)=ξ(θt k,t): exactly unitary</text>
<text x="78" y="1333" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Kj(B) ≅ Kj+d(B ⋊ H) by ordered induction</text>
<text x="78" y="1373" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Full and reduced norms agree at every stage.</text>
<text x="78" y="1414" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Lemma 8.8, Corollary 8.9; no assembly claim.</text>
<text x="838" y="1076" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">F. Minimal crossed products are simple</text>
<text x="838" y="1120" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">X compact metric; φ topologically free</text>
<text x="838" y="1162" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">E(Σ fkUk)=f0 is positive and faithful.</text>
<text x="838" y="1205" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Choose W disjoint from finitely many φkW;</text>
<text x="838" y="1248" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">h supported in W: hph=h E(p) h</text>
<text x="838" y="1290" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">‖q(a)‖ ≥ ‖E(a)‖ − 3δ</text>
<text x="838" y="1333" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">⇒ every nonzero ideal meets C(X).</text>
<text x="838" y="1373" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Minimality ⇒ simple; τν=ν∘E is faithful.</text>
<text x="838" y="1414" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Proposition 9.2, Theorem 9.3; trace range: 9.4–9.6.</text>
<text x="60" y="1480" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Objects and maps: K-theory of the leaf space, Lemmas 8.3–8.8, Corollaries 8.9–8.10,</text>
<text x="60" y="1520" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Proposition 9.2 and Theorem 9.3. B is separable; the real action is pointwise norm continuous.</text>
<text x="60" y="1561" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Source: Blackadar, K-Theory for Operator Algebras, Section 10.9, printed pp. 79–83 / PDF pp. 93–97.</text>
<text x="60" y="1602" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Original proof diagram: GPT-6.1 Sol (OpenAI), CC0. Exact formulas; schematic logical arrows.</text>
<text x="60" y="1640" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">The suspension trace proof is separate (9.4–9.6); general KK/assembly comparisons remain.</text>
</svg>
