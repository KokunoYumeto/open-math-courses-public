<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1770" viewBox="0 0 1800 1770">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45677f" /></marker></defs>
<rect width="1800" height="1770" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="bold" fill="#243d54">The actual arrow join compared with the fat holonomy nerve</text>
<text x="40" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">V1–V6: fixed colors, barycentric face cardinalities, backward arrows and full normal transport.</text>
<rect x="35" y="150" width="1730" height="255" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">Two explicit maps, with a whole homotopy on the fat nerve</text>
<text x="100" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="bold" fill="#243d54">B_M H</text>
<text x="1450" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="bold" fill="#243d54">B_f H</text>
<path d="M400,253 L1390,253" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="700" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">v: order retained colors</text>
<path d="M1390,331 L400,331" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="620" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">d: color of a face I is |I| − 1</text>
<text x="65" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">Exact one-arrow sample: x₀ —g→ x₁ with weights (2/5, 3/5)</text>
<rect x="35" y="493" width="1730" height="375" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<circle cx="200" cy="588" r="12" fill="#00796b" />
<text x="172" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₀</text>
<text x="151" y="640" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">2/5</text>
<circle cx="1530" cy="588" r="12" fill="#00796b" />
<text x="1502" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₁</text>
<text x="1481" y="640" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">3/5</text>
<path d="M240,588 L1490,588" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="850" y="568" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">g</text>
<text x="65" y="710" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">Barycentric flag {1} ⊂ {0,1}: u₀ = 1/5; u₁ = 4/5.</text>
<text x="65" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">d columns from common source x₀: (color 0, g, 1/5), (color 1, 1ₓ₀, 4/5).</text>
<text x="65" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">v d chain: x₁ —g⁻¹→ x₀, with weights (1/5, 4/5). The actual inverse is retained.</text>
<rect x="35" y="903" width="1730" height="365" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="961" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">Whole homotopy at s = 1/2: concatenate the old and new strings</text>
<circle cx="170" cy="1059" r="12" fill="#00796b" />
<text x="142" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₀</text>
<text x="121" y="1111" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">1/5</text>
<circle cx="650" cy="1059" r="12" fill="#00796b" />
<text x="622" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₁</text>
<text x="601" y="1111" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">3/10</text>
<circle cx="1130" cy="1059" r="12" fill="#00796b" />
<text x="1102" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₁</text>
<text x="1081" y="1111" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">1/10</text>
<circle cx="1610" cy="1059" r="12" fill="#00796b" />
<text x="1582" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₀</text>
<text x="1561" y="1111" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">2/5</text>
<path d="M210,1059 L610,1059" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="386.0" y="1040" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">g</text>
<path d="M690,1059 L1090,1059" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="866.0" y="1040" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">1ₓ₁</text>
<path d="M1170,1059 L1570,1059" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="1346.0" y="1040" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">g⁻¹</text>
<text x="65" y="1195" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">All weights sum to 1. At s = 0 or 1 the zero block is deleted by fat faces.</text>
<text x="65" y="1245" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">General formula: old weights (1−s)t_a; new weights s u_j; arrows h_b h_a⁻¹.</text>
<rect x="35" y="1303" width="1730" height="260" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1361" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">The full groupoid and the full normal bundle stay in the comparison</text>
<text x="65" y="1418" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">B_M H → B_f H ← B_f G′ → B_f G: the first map is weakly equivalent.</text>
<text x="65" y="1470" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">G′ uses labelled boxes and every actual G arrow; both fat atlas maps have whole inverses.</text>
<text x="65" y="1525" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">New-to-old normal comparison is D(g_i g_a⁻¹), never just an endpoint identification.</text>
<text x="40" y="1630" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part V; Exercises 68–79. Full classifying route: V, Q and D.</text>
<text x="40" y="1680" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Repeated unit vertices are kept until their weights vanish; no thin degeneracy assertion is used.</text>
<text x="40" y="1730" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">The countable CW replacement and full cohomology construction are supplied separately in Q1–Q6 and D1–D4.</text>
</svg>