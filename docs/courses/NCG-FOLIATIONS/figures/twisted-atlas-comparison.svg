<path d="M1340,375 L1340,427" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<rect x="65" y="450" width="320" height="120" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="90" y="494" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">(U, x₀)</text>
<text x="90" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">t₀ λ_U(x₀)</text>
