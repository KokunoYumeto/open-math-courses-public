<text x="540" y="494" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">(V, x₀)</text>
<text x="540" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">t₀ λ_V(x₀)</text>
<rect x="965" y="450" width="320" height="120" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="990" y="494" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">(U, x₁)</text>
<text x="990" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">t₁ λ_U(x₁)</text>
