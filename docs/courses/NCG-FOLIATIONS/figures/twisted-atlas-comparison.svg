<text x="248" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₀</text>
<text x="248" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">weight t₀</text>
<rect x="1130" y="245" width="420" height="115" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1158" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">x₁</text>
<text x="1158" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">weight t₁</text>
