<text x="1311" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">1_x₁</text>
<text x="65" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Two active chart labels are shown. The proof permits all locally finite labels and any simplex dimension.</text>
<rect x="35" y="675" width="1730" height="310" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">(399)–(400). Both full homotopies use the same nonnegative weights</text>
<text x="65" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="normal" fill="#243d54">At vertex i: old weight (1 − s)tᵢ;  new chart-U weight s tᵢ λ_U(xᵢ),  0 ≤ s ≤ 1.</text>
<text x="65" y="849" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Σ_U λ_U(xᵢ) = 1;  total weight = 1. Zero-weight vertices disappear by face relations.</text>
<text x="65" y="910" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#00796b">QS ≃ 1_‖N(H)‖;  SQ ≃ 1_‖N(H′)‖. All identity and holonomy arrows keep their derivatives.</text>
<text x="65" y="957" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">No partition of unity on the possibly non-Hausdorff arrow space is used.</text>
<text x="40" y="1039" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part A; Exercises 68–79. Full classifying route: V, Q and D.</text>
<text x="40" y="1088" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The full construction and compact-test comparison are proved in Theorem 6.2, parts T–I.</text>
<text x="40" y="1132" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Human context: Connes (1982), §11 p35; Moerdijk (1991), classifying spaces of foliations.</text>
</svg>