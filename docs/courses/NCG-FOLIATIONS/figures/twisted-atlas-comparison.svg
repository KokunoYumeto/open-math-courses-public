<rect width="1800" height="1160" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="bold" fill="#243d54">A proved atlas comparison by weighted splitting of vertices</text>
<text x="40" y="113" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">A1–A3: H′ has labelled objects and every actual H arrow; the partition is chosen on objects T.</text>
<rect x="35" y="150" width="1730" height="490" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="204" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">Original fat simplex: two vertices shown</text>
