<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2010" viewBox="0 0 1800 2010">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45677f" /></marker></defs>
<rect width="1800" height="2010" fill="#f3f7fb" />
<text x="40" y="64" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="bold" fill="#243d54">A full Clifford-valued continuous parameter family</text>
<text x="40" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">X locally compact, Hausdorff, second countable · actual holonomy arrows · no orientation of E needed</text>
<rect x="35" y="155" width="1730" height="550" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="bold" fill="#243d54">C2–C3. The whole transverse correspondence</text>
<text x="65" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="normal" fill="#243d54">A = Cᵣ*(G);  E = f*τ;  Pₓ = C₀(X, Cl⁺(E)ᵒᵖ);  W = Cl⁺(E) ≅ ΛEℂ.</text>
<rect x="65" y="310" width="465" height="135" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="90" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">Pₓ</text>
<text x="90" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">graded-right Clifford source</text>
<rect x="670" y="310" width="465" height="135" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="695" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">C₀(E)</text>
<text x="695" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">ordinary normal functions</text>
<rect x="1275" y="310" width="465" height="135" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1300" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">C₀(X, A)</text>
<text x="1300" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">whole parameter algebra</text>
<path d="M539,374 L652,374" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="541" y="338" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">b̃_E</text>
<path d="M1144,374 L1257,374" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="1155" y="338" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">L_f</text>
<text x="65" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">Cl⁺(E) ⊗̂ Cl⁺(E)ᵒᵖ = End(W);  both finite Morita evaluations are onto.</text>
<text x="65" y="565" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="normal" fill="#243d54">k_f ∈ KKₓ(Pₓ, C₀(X, A));  χ_f(η) = k_f τ_C₀(X)(η) ∈ KKₓʲ(Pₓ, C₀(X)).</text>
<text x="65" y="624" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">Compact coefficient action and product operators are proved on the completed whole module.</text>
<text x="65" y="676" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#00796b">The parameter is the same on both anchors. Distinct holonomy lifts remain distinct.</text>
<rect x="35" y="740" width="1730" height="535" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="794" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="bold" fill="#243d54">C4. Exact Clifford commutation and the correct operator topology</text>
<text x="65" y="851" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="normal" fill="#243d54">Rᵢ² = −1;  Rᵢ* = −Rᵢ;  R_I = Rᵢ₁⋯Rᵢₖ;  the source opposite is graded.</text>
<text x="65" y="913" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="bold" fill="#00796b">a_E(F) = 2⁻ᑫ Σ_I (−1)^|I| R_I F R_I*.</text>
<text x="65" y="975" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="normal" fill="#243d54">Commuting averaging involutions give exact graded commutation with every Rᵢ.</text>
<text x="65" y="1037" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="normal" fill="#243d54">Orthogonal word changes cancel in the sum; the average is independent of a frame.</text>
<text x="65" y="1099" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">a_E(F) − F is compact after each compact base cutoff; the straight line is a homotopy.</text>
<path d="M65,1140 L1735,1140" fill="none" stroke="#c7d5e0" stroke-width="3" />
<text x="65" y="1190" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">F and F* vary strongly; localized compact defects vary in compact-operator norm.</text>
<text x="65" y="1242" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">Whole stabilized module fields give this topology before taking a parameter fibre.</text>
<rect x="35" y="1310" width="1730" height="550" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1364" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="bold" fill="#243d54">Exercise 68. Pointwise compactness alone is insufficient</text>
<path d="M130,1460 L130,1745" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M120,1730 L795,1730" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M130,1480 L780,1480" fill="none" stroke="#c7d5e0" stroke-width="3" stroke-dasharray="7 8" />
<text x="81" y="1490" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">1</text>
<text x="81" y="1740" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">0</text>
<circle cx="780.0" cy="1480" r="8" fill="#b34e45" />
<circle cx="455.0" cy="1480" r="8" fill="#b34e45" />
<circle cx="346.66666666666663" cy="1480" r="8" fill="#b34e45" />
<circle cx="292.5" cy="1480" r="8" fill="#b34e45" />
<circle cx="238.33333333333331" cy="1480" r="8" fill="#b34e45" />
<circle cx="211.25" cy="1480" r="8" fill="#b34e45" />
<circle cx="170.625" cy="1480" r="8" fill="#b34e45" />
<circle cx="150.3125" cy="1480" r="8" fill="#b34e45" />
<circle cx="130" cy="1730" r="10" fill="#00796b" />
<text x="122" y="1779" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">0</text>
<text x="772" y="1779" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">1</text>
<text x="427.0" y="1779" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">1/2</text>
<text x="130" y="1436" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">‖T(s)‖</text>
<text x="822" y="1740" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="normal" fill="#243d54">s</text>
<text x="880" y="1454" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">S = {0} ∪ {1/n : n ≥ 1}.</text>
<text x="880" y="1511" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="normal" fill="#243d54">T(0) = 0;   T(1/n) = Pₙ on ℓ²(ℕ).</text>
<text x="880" y="1568" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="normal" fill="#243d54">Pₙ projects onto the nth unit vector.</text>
<text x="880" y="1633" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">T is *-strongly continuous and bounded.</text>
<text x="880" y="1690" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#b34e45">Every T(s) is compact;  ‖Pₙ − 0‖ = 1.</text>
<text x="880" y="1747" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">T ∉ K(C(S, ℓ²));  F² − 1 = −T for F = 1 − T.</text>
<text x="65" y="1830" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Red points are exact samples at 1/n; the dashed line is a guide, not an interpolation.</text>
<text x="40" y="1920" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part C; Exercises 68–79. Full classifying route: V, Q and D.</text>
<text x="40" y="1970" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Human source context: Connes (1982), §11 p35; Emerson–Meyer (2009), §3.2. Original diagram.</text>
</svg>