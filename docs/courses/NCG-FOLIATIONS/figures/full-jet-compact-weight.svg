<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1860" viewBox="0 0 900 1860">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#31596d"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#182f3c">
<text x="450" y="42" text-anchor="middle" font-size="26">Whole Killing-jet compact weighting</text>
<text x="450" y="72" text-anchor="middle" font-size="17">Section 11BV: exact modules, domains, bounds and limited obstruction</text>
<rect x="50" y="100" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="128" text-anchor="middle" font-size="21">Original full Killing-jet module E_K</text>
<text x="450" y="155" text-anchor="middle" font-size="17">Hermitian closure of actual localized jets</text>
<text x="450" y="182" text-anchor="middle" font-size="17">Fibre V_x; arbitrary k(x), including zero</text>
<text x="450" y="209" text-anchor="middle" font-size="17">Original q, metric and germ domains retained</text>
<path d="M450 233 L450 253" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="256" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="284" text-anchor="middle" font-size="21">Compact positive weight (KWC.2, KWC.10)</text>
<text x="450" y="311" text-anchor="middle" font-size="17">h = sum 2^-n theta_xn,xn; 0 &lt;= h &lt;= 1</text>
<text x="450" y="338" text-anchor="middle" font-size="17">||epsilon(h+epsilon)^-1 x_n||^2 &lt;= 2^n epsilon/4</text>
<text x="450" y="365" text-anchor="middle" font-size="17">Extend by dense module generators, in module norm</text>
<path d="M450 389 L450 409" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="412" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="440" text-anchor="middle" font-size="21">Exact inverse domains (KWC.3, KWC.14-KWC.16)</text>
<text x="450" y="467" text-anchor="middle" font-size="17">D = h^-1; Dom D = Ran h; Dom D^2 = Ran h^2</text>
<text x="450" y="494" text-anchor="middle" font-size="17">(D +/- i)^-1 = h(1 +/- ih)^-1, onto Dom D</text>
<text x="450" y="521" text-anchor="middle" font-size="17">(1+D^2)^-1 = h^2(1+h^2)^-1; compact</text>
<path d="M450 545 L450 565" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="568" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="596" text-anchor="middle" font-size="21">Central balanced tensor power E_r (KWC.17-KWC.19)</text>
<text x="450" y="623" text-anchor="middle" font-size="17">Commuting h_i act on the original r coordinates</text>
<text x="450" y="650" text-anchor="middle" font-size="17">A single coordinate compact need not be compact</text>
<text x="450" y="677" text-anchor="middle" font-size="17">Products of factor compacts are tensor rank ones</text>
<path d="M450 701 L450 721" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="724" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="752" text-anchor="middle" font-size="21">Harmonic inverse (KWC.20-KWC.27)</text>
<text x="450" y="779" text-anchor="middle" font-size="17">b_r(a) = (sum_i 1/a_i)^-1 in the positive cube</text>
<text x="450" y="806" text-anchor="middle" font-size="17">Zero on every coordinate-zero face; b_r &lt;= min a_i</text>
<text x="450" y="833" text-anchor="middle" font-size="17">Cutoff polynomial limits prove compactness; ||b_r|| &lt;= 1/r</text>
<path d="M450 857 L450 877" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="880" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="908" text-anchor="middle" font-size="21">Completed tensor domain (KWC.28-KWC.30)</text>
<text x="450" y="935" text-anchor="middle" font-size="17">Cutoff ratios converge with their adjoints to T_i</text>
<text x="450" y="962" text-anchor="middle" font-size="17">h_i T_i = b_r; sum_i T_i = 1</text>
<text x="450" y="989" text-anchor="middle" font-size="17">Dom b_r^-1 = intersection Dom h_i^-1; exact sum</text>
<path d="M450 1013 L450 1033" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="1036" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="1064" text-anchor="middle" font-size="21">Full Fock and square domains (KWC.6, KWC.34)</text>
<text x="450" y="1091" text-anchor="middle" font-size="17">Vacuum E_0 = C_0(T), D_0 = 0; D_r = b_r^-1</text>
<text x="450" y="1118" text-anchor="middle" font-size="17">Weighted positive inner-product series converge in norm</text>
<text x="450" y="1145" text-anchor="middle" font-size="17">Exact adjoint; both resolvents and square inverse onto</text>
<path d="M450 1169 L450 1189" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="1192" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="1220" text-anchor="middle" font-size="21">Localized compactness (KWC.37-KWC.40)</text>
<text x="450" y="1247" text-anchor="middle" font-size="17">Every positive-degree inverse block is module compact</text>
<text x="450" y="1274" text-anchor="middle" font-size="17">Localized vacuum f is one rank-one operator</text>
<text x="450" y="1301" text-anchor="middle" font-size="17">Square-inverse tail &lt;= ||f|| / (1+(R+1)^2)</text>
<path d="M450 1325 L450 1345" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="1348" width="800" height="132" rx="12" fill="#edf5f9" stroke="#31596d"/>
<text x="450" y="1376" text-anchor="middle" font-size="21">Actual rank-boundary repair</text>
<text x="450" y="1403" text-anchor="middle" font-size="17">Compact disappearing W block tends to zero</text>
<text x="450" y="1430" text-anchor="middle" font-size="17">Whole-module repair, beyond a selected W-only weight</text>
<text x="450" y="1457" text-anchor="middle" font-size="17">No fibre-compactness shortcut</text>
<path d="M450 1481 L450 1501" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="1504" width="800" height="132" rx="12" fill="#fff0e8" stroke="#31596d"/>
<text x="450" y="1532" text-anchor="middle" font-size="21">Exact invariance counterexample (KWC.41-KWC.43)</text>
<text x="450" y="1559" text-anchor="middle" font-size="17">Actual rational translations on the upper flat end</text>
<text x="450" y="1586" text-anchor="middle" font-size="17">Invariant W block is constant; compact boundary limit is zero</text>
<text x="450" y="1613" text-anchor="middle" font-size="17">Positivity then excludes dense range</text>
<path d="M450 1637 L450 1657" stroke="#31596d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="1660" width="800" height="132" rx="12" fill="#fff0e8" stroke="#31596d"/>
<text x="450" y="1688" text-anchor="middle" font-size="21">Original graph problem remains</text>
<text x="450" y="1715" text-anchor="middle" font-size="17">Exact invariant weighting alone is obstructed</text>
<text x="450" y="1742" text-anchor="middle" font-size="17">Compact phase covariance errors are not excluded</text>
<text x="450" y="1769" text-anchor="middle" font-size="17">No index-one auxiliary or reduced graph class is inferred</text>
<text x="450" y="1841" text-anchor="middle" font-size="16">Original mathematical expression CC0-1.0; tensor arity r and normal degree q are distinct.</text>
</g></svg>
