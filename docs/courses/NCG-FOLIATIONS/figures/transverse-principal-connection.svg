<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#45677f"/></marker></defs>
<rect width="1800" height="1450" fill="#f3f7fb"/>
<text x="40" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="bold" fill="#243d54">One interval cycle proves the prescribed transverse comparison</text>
<text x="40" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Actual holonomy cocycles · full right Cₙ module · native product order · all lifts and sheets retained</text>
<rect x="35" y="150" width="1730" height="245" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="199" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">The whole module, before endpoint evaluation</text>
<text x="65" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">P → I × N is right principal for G × I;   a : P → I × V has fibre dimension n.</text>
<text x="65" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#243d54">E is the completed full half-density module over C(I,A) ⊗ Cₙ;   K(E) = K(𝒫) ⊗ Cₙ.</text>
<text x="65" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Q = Jχ* diag(clip(Rᵢ)) Jχ is one adjointable contraction; localized interval defects are compact.</text>
<rect x="35" y="450" width="730" height="290" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<rect x="1035" y="450" width="730" height="290" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">Zero endpoint</text>
<text x="65" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#00796b">Rₙ[E₀, Q₀] = d_N · ℓᵃⁿ</text>
<text x="65" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Full physical bundle: (D_N ⊗ M_F)^β</text>
<text x="65" y="677" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Native right target: C_p, C_q;  p + q = n even.</text>
<text x="1065" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">Étale endpoint</text>
<text x="1065" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#00796b">Rₙ[E₁, Q₁] = g! · Aₙ</text>
<text x="1065" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">E₁ ≅ E_g ⊗ (A ⊗ L²(Rⁿ) ⊗ Dₙ)</text>
<text x="1065" y="677" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">Counting all sheets + Euclidean integration = Fubini.</text>
<path d="M790,585 L1010,585" stroke="#45677f" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="800" y="539" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">one interval</text>
<text x="800" y="634" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">same class</text>
<rect x="35" y="785" width="1730" height="300" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="834" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">The bounded connection is an operator-compact statement</text>
<text x="65" y="891" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Cξ = Q₁Tξ − TξFₙ;   Cξ κ_R is a negative-order mixed kernel, hence a rectangular compact.</text>
<text x="65" y="946" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">‖Cξ(1 − κ_R)‖ ≤ Cₙ ‖ξ‖ |S|¹ᐟ² supₜ∈S ‖Kₙ(t − ·)(1 − κ_R)‖₂ → 0.</text>
<text x="65" y="998" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">The heat-kernel L² tail bound is uniform over every regular representation and every sheet.</text>
<text x="65" y="1048" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Separated mixed kernels are limits of actual module rank-one maps, also when A is nonunital.</text>
<rect x="35" y="1120" width="1730" height="220" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="1170" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">Cancel using the two proved native Thom inverse products</text>
<text x="65" y="1230" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#00796b">b_N · d_N = 1  ⇒  ℓᵃⁿ = b_N · g! · Aₙ = ℓᵍᵉᵒᵐ  in KKᵖ(C(V),A).</text>
<text x="65" y="1293" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">The full prescribed line and grading remain on both sides; odd arbitrary-symbol action is a further step.</text>
<text x="40" y="1386" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">Proof: Lemma 7.24 and Theorem 7.25, equations 330–354; Exercise 65, equation 356.</text>
<text x="40" y="1431" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#243d54">Classical longitudinal context: Connes–Skandalis · Original diagram: GPT-6.1 Sol (OpenAI), CC0.</text>
</svg>
