<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430">
<rect width="1600" height="1430" fill="#f4f7fb"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#3a6289"/></marker></defs>
<text x="55" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="bold" fill="#20334d">A Dirac cycle over the whole solvable deformation</text>
<text x="55" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Ordered global frame; separable coefficients; negative physical Fourier phase.</text>
<rect x="50" y="150" width="1500" height="305" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">1. Construct the regular operator and prove joint algebra membership</text>
<text x="80" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">W(t) = exp(itD): strict unitary multipliers from uniform finite propagation.</text>
<text x="80" y="301" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">R₊ = −i ∫₀∞ e⁻ᵗ W(t) dt = (D+i)⁻¹;  R₋ = R₊*.  Full module domains.</text>
<text x="80" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">(D±i)Q± = 1−S±;  Q±, S± ∈ A⁰<tspan baseline-shift="sub" font-size="70%">I</tspan> ⊗ C<tspan baseline-shift="sub" font-size="70%">d</tspan>  ⇒  R± = Q± + R±S± ∈ A⁰<tspan baseline-shift="sub" font-size="70%">I</tspan> ⊗ C<tspan baseline-shift="sub" font-size="70%">d</tspan>.</text>
<text x="80" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Hence f(D) ∈ A⁰<tspan baseline-shift="sub" font-size="70%">I</tspan> ⊗ C<tspan baseline-shift="sub" font-size="70%">d</tspan> for every f ∈ C₀(R).  Lemma 8.15a.</text>
<rect x="50" y="485" width="1500" height="240" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">2. Localize the compact defects in the coefficient algebra</text>
<text x="80" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">φ(a)f(D), f(D)φ(a) ∈ Aᴮ<tspan baseline-shift="sub" font-size="70%">I</tspan> ⊗ C<tspan baseline-shift="sub" font-size="70%">d</tspan> = K(E<tspan baseline-shift="sub" font-size="70%">I</tspan>).  F = D(1+D²)⁻¹ᐟ².</text>
<text x="80" y="637" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">[D,φ(a)] = i Σ φ(vδ<tspan baseline-shift="sub" font-size="70%">i</tspan>a)ε<tspan baseline-shift="sub" font-size="70%">i</tspan>;  the resolvent commutator has an integrable norm bound.</text>
<text x="80" y="691" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">This gives T<tspan baseline-shift="sub" font-size="70%">D</tspan> ∈ KK<tspan baseline-shift="sub" font-size="70%">d</tspan>(C(I,B), Aᴮ<tspan baseline-shift="sub" font-size="70%">I</tspan>).  Lemma 8.15b.</text>
<rect x="50" y="755" width="1500" height="230" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="803" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">3. Compare physical Bott and native iteration at v = 0</text>
<text x="80" y="856" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">D₀ = p·ε;  F₀ = (p·ε)/√(1+|p|²).  Every creation-map error vanishes at infinity.</text>
<text x="80" y="909" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">{F<tspan baseline-shift="sub" font-size="70%">m</tspan>, F<tspan baseline-shift="sub" font-size="70%">m+1</tspan>} = 2|x|² / (√(1+|x|²) √(1+|x|²+y²)) ≥ 0.</text>
<text x="80" y="957" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Native odd-pair reduction: T<tspan baseline-shift="sub" font-size="70%">D</tspan>[q₀] = s<tspan baseline-shift="sub" font-size="70%">d</tspan> [e₀]Θ₀;  s<tspan baseline-shift="sub" font-size="70%">d</tspan> = (−1)<tspan baseline-shift="super" font-size="70%">⌊d/2⌋</tspan>.</text>
<rect x="50" y="1015" width="1500" height="325" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">4. Cancel the already proved inverse of evaluation at zero</text>
<text x="80" y="1116" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">T<tspan baseline-shift="sub" font-size="70%">D</tspan>[q₀] = s<tspan baseline-shift="sub" font-size="70%">d</tspan> Θ<tspan baseline-shift="sub" font-size="70%">I</tspan>[q₀]  ⇒  T<tspan baseline-shift="sub" font-size="70%">D</tspan> = s<tspan baseline-shift="sub" font-size="70%">d</tspan> Θ<tspan baseline-shift="sub" font-size="70%">I</tspan>.  Corollary 8.14a.</text>
<text x="80" y="1171" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">At v = 1: [ι_B]T<tspan baseline-shift="sub" font-size="70%">D</tspan>[q₁] = s<tspan baseline-shift="sub" font-size="70%">d</tspan> Θ₁;  ι_B(b)(v) = b.</text>
<text x="80" y="1226" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">The homogeneous spin connection is a bounded Clifford perturbation.</text>
<text x="80" y="1282" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">This identifies the framed longitudinal Dirac class.  Theorem 8.15d.</text>
<text x="55" y="1390" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Full proofs: Lemmas 8.15a–c, Theorem 8.15d, Exercises 34–35. Geometry: Sections 6–7; assembly scope: STATUS.</text>
</svg>
