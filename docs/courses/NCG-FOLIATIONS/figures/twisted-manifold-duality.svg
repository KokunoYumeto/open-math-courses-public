<text x="96" y="864" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">-3</text>
<text x="390" y="864" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">0</text>
<text x="684" y="864" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">3</text>
<text x="480" y="674" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">π⁻¹/⁴</text>
<text x="705" y="844" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">v</text>
<text x="805" y="701" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">Rank-one plotted sample:</text>
<text x="805" y="753" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#00796b">π⁻¹/⁴ exp(−v²/2) · e₀</text>
<text x="805" y="815" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Normalized in L²(R); even exterior vacuum.</text>
<rect x="35" y="925" width="1730" height="400" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="984" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">G5. Clifford-algebra product: its ground module has the identity source action</text>
<text x="65" y="1042" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">T_Q = −iL∂ + iΓ ⊗ r(v);  Sᵢ = LᵢΓ ⊗ rᵢ;  rᵢ² = −1.</text>
<text x="65" y="1103" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">Ω = 2⁻ᵈ/² Σ_I (−1)^{|I|(|I|+1)/2} e_I ⊗ r_I;   SᵢΩ = −Ω.</text>
<text x="65" y="1166" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#00796b">(Rᵢ ⊗ 1)Ω = Ω rᵢ;   ⟨Ω, Ω⟩ = 1;   ground space = Gaussian · ΩQ.</text>
<text x="65" y="1230" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Rank 1: Ω = (e₀ ⊗ 1 − e₁ ⊗ r)/√2;  both source actions give (e₀ ⊗ r + e₁ ⊗ 1)/√2.</text>
<text x="65" y="1286" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">A module rank or scalar index alone cannot identify this full Clifford action.</text>
<text x="40" y="1390" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">The whole tube operator family has compact resolvents by confinement and local ellipticity; both products are checked.</text>
<text x="40" y="1445" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part G; Exercises 68–79. Original figure and independently supplied argument.</text>
<text x="40" y="1500" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Actual module coefficients, grading, normal transport and the ordered positive right C₁ in odd degree are retained.</text>
<text x="40" y="1560" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The full construction and compact-test comparison are proved in Theorem 6.2, parts T–I.</text>
<text x="40" y="1605" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">Classical context: Connes–Skandalis (1984), §3.7–3.11. The full proof here is independent.</text>
</svg>