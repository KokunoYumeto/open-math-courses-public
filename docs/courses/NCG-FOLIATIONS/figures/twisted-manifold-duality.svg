<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1630" viewBox="0 0 1800 1630">
<rect width="1800" height="1630" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="bold" fill="#243d54">Both manifold KK triangles retain their actual Gaussian modules</text>
<text x="40" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">G1–G5: C = C(M); Q = C(M, Cl⁺(TM)ᵒᵖ). No orientation or spin-c structure on M is assumed.</text>
<rect x="35" y="150" width="1730" height="305" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">The actual duality cycles and two typed products</text>
<text x="65" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">Θ ∈ KK(ℂ, C(M) ⊗ Q);   ev ∈ KK(Q ⊗ C(M), ℂ). Both cycles are even.</text>
<text x="65" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#00796b">(Θ ⊗ 1_C(M)) (1_C(M) ⊗ ev) = 1_C(M)</text>
<text x="65" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#00796b">(1_Q ⊗ Θ) (ev ⊗ 1_Q) = 1_Q</text>
<rect x="35" y="490" width="1730" height="400" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="548" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">G4. Function-algebra product: its whole ground space is an even line</text>
<text x="65" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">T_C = −i(L∂ + Rv);  T_C² = −Δ + |v|² + Σᵢ(2Nᵢ − 1).</text>
<path d="M95,824 L710,824" fill="none" stroke="#45677f" stroke-width="3" />
