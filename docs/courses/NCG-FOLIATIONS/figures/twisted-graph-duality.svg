<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1970" viewBox="0 0 1800 1970">
<rect width="1800" height="1970" fill="#f3f7fb" />
<text x="40" y="63" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="bold" fill="#243d54">An entire graph comparison for every smooth foliation cocycle</text>
<text x="40" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">I1–I4: diagonal coevaluation makes the combined tangent/normal tube étale without requiring df to be onto.</text>
<rect x="35" y="153" width="1730" height="360" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">I1. The relative whole duality uses both actual manifold triangles</text>
<text x="65" y="276" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">D_M(x) = Θ_M (x ⊗ 1_P);   I_M(a) = forget(a) (d_M ⊗ 1_D).</text>
<text x="65" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#00796b">I_M D_M = 1;  D_M I_M = 1, with the full negative Clifford source action.</text>
<text x="65" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">The field moves along x_t = exp_y(tw) on one diagonal disk; its whole product homotopy retains the bundle path.</text>
<text x="65" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">G5’s complete Gaussian module ΩP, with RΩ = Ωr, proves the relative Clifford identity.</text>
<rect x="35" y="548" width="1730" height="565" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">(463)–(464). Actual arrows and a uniformly invertible transverse shear</text>
<text x="65" y="667" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Φ_t = (g_E(x_t, T_t^E c), z_t, y);  every arrow is pulled from g_E, with the same z_t and y.</text>
<text x="65" y="728" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">Zero section: (w,η,e) ↦ (e + t d_trans f(w),  J(w,η));  the e block is the identity.</text>
<text x="65" y="787" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Exact sample: f(eⁱθ) = eⁱˢⁱⁿθ,  α = cos θ;  t = 1/2;  η = 0 and e = 0 in these projected sections.</text>
<path d="M200,925 L495,925" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M340,1015 L340,820" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M222,984.0 L458,866.0" fill="none" stroke="#00796b" stroke-width="5" />
<text x="472" y="959" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">w</text>
<text x="357" y="827" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">z</text>
<text x="208" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">θ = 0; α = 1</text>
<path d="M760,925 L1055,925" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M900,1015 L900,820" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M782,925.0 L1018,925.0" fill="none" stroke="#00796b" stroke-width="5" />
<text x="1032" y="959" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">w</text>
<text x="917" y="827" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">z</text>
<text x="768" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">θ = π/2; α = 0</text>
<path d="M1320,925 L1615,925" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M1460,1015 L1460,820" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M1342,866.0 L1578,984.0" fill="none" stroke="#00796b" stroke-width="5" />
<text x="1592" y="959" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">w</text>
<text x="1477" y="827" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">z</text>
<text x="1328" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">θ = π; α = −1</text>
<text x="65" y="1100" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Shown line: z = (cos θ) w/2. Full derivative in (w,η,e) has determinant 1, including at α = 0.</text>
<rect x="35" y="1148" width="1730" height="365" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1207" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">(459)–(460), (461). The complete finite recovery retains every physical generator</text>
<text x="65" y="1270" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">S_N ⊗ S_QW ≅ ρ*(S ⊗ C_n);  ρ(η,e,u,v) = (u,e,J(v,η)).</text>
<text x="65" y="1335" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">C_i = (A_i − iB_i)/2;  Π = ∏ᵢ(1 − iA_iB_i)/2;  Π C_I* C_J Π = δ_IJ Π.</text>
<text x="65" y="1401" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#00796b">Σ_I C_I Π C_I* = 1;  all Clifford actions and inner products are recovered, then cancelled.</text>
<text x="65" y="1465" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">The actual right-block reducers retain the final odd generator. A two-torsion line H stays as H.</text>
<rect x="35" y="1548" width="1730" height="230" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1606" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">(465)–(466). Whole classes first; the integral test is their consequence</text>
<text x="65" y="1669" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#00796b">D_M(f_!^geom) = R_m(a_f);  f_!^geom = R_m(y_f) ∈ KK^{q−d}(C(M),A).</text>
<text x="65" y="1733" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">R_(j,m)(u[B] cap_S(χ_f(η))) = u[B] f_!^geom · η;  degree j + q − d mod 2.</text>
<text x="40" y="1837" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Proof: Theorem 6.2, part I; Exercises 68–79. Original figure and independently supplied argument.</text>
<text x="40" y="1892" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Original figure and complete argument. Classical context: Connes (1982), page 35; Connes–Skandalis (1984), §3.</text>
<text x="40" y="1941" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">The full analytic-to-geometric map and its integral compact tests are proved in Theorem 6.2.</text>
</svg>