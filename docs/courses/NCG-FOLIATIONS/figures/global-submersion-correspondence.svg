<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#49677e"/></marker></defs>
<rect width="1800" height="1300" fill="#f3f7fb"/>
<text x="45" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#20334d">The analytic product uses the full holonomy correspondence</text>
<text x="45" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">f : W → V is a compact surjective submersion.  K = ker df.  The orientation order is K, then f*F.</text>
<rect x="40" y="155" width="835" height="650" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<rect x="915" y="155" width="845" height="650" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">1. Modules and the actual inclusion</text>
<rect x="90" y="270" width="255" height="100" rx="16" fill="#e9f2fa" stroke="#cad6e4" stroke-width="2"/>
<text x="120" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">H = Hol(W, F_W)</text>
<text x="120" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">full path holonomy</text>
<rect x="560" y="270" width="260" height="100" rx="16" fill="#e9f2fa" stroke="#cad6e4" stroke-width="2"/>
<text x="590" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">R = f*G</text>
<text x="590" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">all pullback arrows</text>
<path d="M355,320 L548,320" fill="none" stroke="#49677e" stroke-width="3" marker-end="url(#arr)"/>
<text x="383" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="bold" fill="#20334d">j : open</text>
<text x="110" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">P_f = { (w, γ) : f(w) = r(γ) }</text>
<text x="110" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">right anchor s(γ);   (w, γ) γ′ = (w, γγ′)</text>
<text x="110" y="525" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">K(P_f) = C*r(R)</text>
<text x="110" y="575" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">C*r(H) acts by compact operators through j.</text>
<text x="110" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">E_f ⊗ regular G module = spinor P_f module</text>
<text x="110" y="680" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">S_K ⊗ f*S_F = S_(F_W)</text>
<text x="110" y="732" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Both central spin-c phases remain in this tensor.</text>
<text x="945" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">2. Two fibre components change the algebra</text>
<text x="960" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">V = circle, F = TV;   W = V ⊔ V;   f = id ⊔ id</text>
<text x="1065" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">source component 1</text>
<text x="1380" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">source component 2</text>
<rect x="1060" y="335" width="290" height="130" rx="16" fill="#d8f1e5" stroke="#cad6e4" stroke-width="2"/>
<text x="1123" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">K(L²(V))</text>
<text x="1120" y="428" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="bold" fill="#20334d">H and R</text>
<rect x="1375" y="335" width="290" height="130" rx="16" fill="#f9e7cf" stroke="#cad6e4" stroke-width="2"/>
<text x="1438" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">K(L²(V))</text>
<text x="1435" y="428" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="bold" fill="#20334d">R only</text>
<rect x="1060" y="490" width="290" height="130" rx="16" fill="#f9e7cf" stroke="#cad6e4" stroke-width="2"/>
<text x="1123" y="539" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">K(L²(V))</text>
<text x="1120" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="bold" fill="#20334d">R only</text>
<rect x="1375" y="490" width="290" height="130" rx="16" fill="#d8f1e5" stroke="#cad6e4" stroke-width="2"/>
<text x="1438" y="539" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">K(L²(V))</text>
<text x="1435" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="bold" fill="#20334d">H and R</text>
<text x="947" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">range 1</text>
<text x="947" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">range 2</text>
<text x="960" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">H: two diagonal blocks.   R: all four blocks.</text>
<text x="960" y="737" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">The compact inclusion is not a Morita equivalence.</text>
<rect x="40" y="845" width="1720" height="370" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="902" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">3. The axis, the shear and the density correction</text>
<text x="85" y="961" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">q(ξ, η) = (ε_K(ξ) ⊗ 1 + 1 ⊗ ε_F(η)) / √(|ξ|² + |η|²)</text>
<text x="85" y="1011" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">horizontal frequency: η = η₀ + Bᵗξ</text>
<text x="85" y="1060" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">q(0, η) = 1 ⊗ ε_F(η) / |η|</text>
<text x="85" y="1110" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">positive odd bracket: 2|ξ| / √(|ξ|² + |η|²) ≥ 0</text>
<text x="1040" y="961" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">vertical density a(y) dx;  lift ∂y</text>
<text x="1040" y="1011" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">k = a′(y) / a(y)</text>
<text x="1040" y="1062" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">∇ᴱ_y = ∂y + a′(y) / (2a(y))</text>
<text x="1040" y="1113" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Each inner-product argument gets k/2.</text>
<text x="85" y="1173" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">These are exact identities.  The block diagram records arrow components, not a numerical approximation.</text>
<text x="45" y="1263" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">Lemmas 7.7–7.9; Theorem 7.10; Exercises 51–53.  Original diagram: GPT-6.1 Sol (OpenAI), CC0.</text>
</svg>
