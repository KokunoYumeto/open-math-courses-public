<text x="1260" y="589" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">Each finite entry is</text>
<text x="1260" y="629" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#243d54">a module creation νa.</text>
<text x="1260" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#00796b">θν,aₘ → (a ↦ νa)</text>
<text x="1260" y="729" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">also for nonunital A.</text>
<text x="885" y="858" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="normal" fill="#243d54">Support bound only; individual shifted entries can be zero.</text>
