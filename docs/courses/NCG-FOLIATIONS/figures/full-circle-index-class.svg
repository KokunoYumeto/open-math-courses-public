<rect width="1800" height="1650" fill="#f3f7fb"/>
<text x="40" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="bold" fill="#243d54">A circle product in the full K₀ class</text>
<text x="40" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Whole holonomy modules · compact Fourier-band creations · positive operator quotient · no measure required</text>
<rect x="35" y="150" width="1730" height="240" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">The actual common module, after the even circle Morita equivalence</text>
<text x="65" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">E ⊗ (L²(S¹) ⊕ L²(S¹)) is a Hilbert A-module; A = Cᵣ*(G), with every holonomy lift retained.</text>
<text x="65" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">T = (S ⊗ 1) √Z + (Γ₁ ⊗ S₂) √(1 − Z);   Q = (T + T*) / 2.</text>
<text x="65" y="361" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">H₁ ≥ 1 is the regular longitudinal Laplacian plus one; H₂ eₖ = (1 + k²)eₖ.</text>
<rect x="35" y="425" width="790" height="465" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<rect x="855" y="425" width="910" height="465" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243d54">The exact circle isometry Q₀</text>
<text x="65" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#243d54">Q₀ eₖ = eₖ₊₁ for k ≥ 0;   Q₀ eₖ = eₖ for k &lt; 0.</text>
