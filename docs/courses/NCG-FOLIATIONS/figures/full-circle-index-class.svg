<text x="660" y="1391" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#243d54">Cutoff K</text>
<text x="925" y="1050" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#243d54">‖Cξᵀ (1 − ΠK)‖ ≤ 2 Cξ / √(1 + (K + 1)²)</text>
<text x="925" y="1110" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">Cξ = ‖H₁¹ᐟ² ξ‖; K is a nonnegative integer.</text>
<text x="925" y="1168" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#243d54">Curve: interpolation through exact integer samples.</text>
<text x="925" y="1226" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#243d54">Q − T is a global module compact.</text>
<text x="925" y="1285" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#243d54">A bare lifted compact κ ⊗ 1 need not be compact.</text>
<text x="925" y="1342" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#243d54">(κ ⊗ 1) √Z is compact by the same Fourier tails.</text>
<rect x="35" y="1470" width="1730" height="105" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2"/>
<text x="65" y="1512" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#00796b">{S ⊗ 1,Q} ≡ 2 √Z ≥ 0 mod K;   [Q] = xₛ · (−1A) = −xₛ in K₀(A).</text>
<text x="65" y="1550" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#243d54">xₛ = [E,1,S] = IndA(s). The plot and bands corroborate the written compactness proof.</text>
