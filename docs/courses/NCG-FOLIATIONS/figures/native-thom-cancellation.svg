<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#425e76"/></marker></defs>
<rect width="1800" height="1440" fill="#f4f7fb"/>
<text x="42" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#253b52">Native ordered cancellation proves the ordinary submersion equality</text>
<text x="42" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Lemmas 7.20–7.21 · Theorem 7.22 · equations (313)–(321) · Exercises 62–63, (322)–(323)</text>
<rect x="35" y="145" width="1730" height="290" rx="14" fill="white" stroke="#c8d5e1" stroke-width="2"/>
<text x="65" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">1. Both raw inverse products are retained</text>
<text x="80" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">x : A → B ⊗ C_r;     y : B ⊗ C_r → A;     xy = 1_A;     yx = 1_(B ⊗ C_r)</text>
<text x="80" y="309" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">b = R_r(x);     d = R_r(T_r(y));     b · d = 1_A;     d · b = 1_B</text>
<text x="80" y="361" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Odd rank: j = m_B⁻¹ τ(y′);   j · x′ = 1_B.  The ordinary inverse of j and injective τ give x′ · j = 1_A.</text>
<text x="80" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Every finite map keeps actions, full grading and inner products; the dot is the native parity product.</text>
<rect x="35" y="465" width="1730" height="310" rx="14" fill="white" stroke="#c8d5e1" stroke-width="2"/>
<text x="65" y="518" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">2. The second-cycle coefficient is first in the native final list</text>
<text x="80" y="577" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">Full product target: (C_r, C_q),   where q + r = n is even.</text>
<text x="80" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#253b52">Odd / odd: (C_2a, C_1^r, C_2b, C_1^q) → (C_2a, C_2b, C_1^r, C_1^q)</text>
<text x="80" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Move one odd generator across 2b generators: an even spin unitary implements the complete move.</text>
<text x="80" y="739" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Reduce by Σ_a ⊗ Σ_b ⊗ Σ_1.  The final pair is (second odd, first odd), with the grading of (104).</text>
<rect x="35" y="805" width="810" height="330" rx="14" fill="white" stroke="#c8d5e1" stroke-width="2"/>
<rect x="880" y="805" width="885" height="330" rx="14" fill="white" stroke="#c8d5e1" stroke-width="2"/>
<text x="65" y="858" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">3. Calibrate the geometric ambient inverse</text>
<text x="75" y="915" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#253b52">D_n = Π^kₙ C_n,    c_D = (−1)^(k_n+1) L_e</text>
<text x="75" y="970" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">W_n(c) = χ_n^(k_n+1) c</text>
<text x="75" y="1019" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">n = 2: reversed grading, physical +, W = 1</text>
<text x="75" y="1064" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">n = 4: regular grading, physical −, W = χ_4</text>
<text x="75" y="1109" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#253b52">A_n = (−1)^kₙ × canonical positive Dirac class</text>
<text x="910" y="858" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">4. Cancel on the actual whole graph tube</text>
<text x="920" y="915" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#253b52">d_N · a_f = [e_Φ] A_n</text>
<text x="920" y="970" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#253b52">b_N · d_N = 1_W</text>
<path d="M1330,987 L1330,1018" stroke="#425e76" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="920" y="1062" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#253b52">a_f = b_N [e_Φ] A_n = f_!^geom</text>
<text x="920" y="1110" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#253b52">Both parities; full given orientation and line retained.</text>
<rect x="35" y="1165" width="1730" height="175" rx="14" fill="white" stroke="#c8d5e1" stroke-width="2"/>
<text x="65" y="1218" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">The equality uses full modules and bounded products, not only numerical indices.</text>
<text x="80" y="1271" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Exact Fubini unitary, compact creation connections, positive operator quotient and global polar spin lift.</text>
<text x="80" y="1317" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#253b52">Scope: compact ordinary submersions. Remaining: prescribed transverse-normal comparison and odd all-symbol action.</text>
<text x="42" y="1394" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#253b52">Original proof diagram: GPT-6.1 Sol (OpenAI), CC0. All module lists, gradings, signs and proof locators are exact.</text>
</svg>
