<text x="45" y="60" class="title">Why the Hodge heat supertrace leaves the Euler form</text>
<text x="45" y="108" class="math">Oriented leaf dimension p = 2ℓ;  Δ = ∇*∇ + Q on the exterior algebra Λ*F*</text>
<rect x="35" y="145" width="745" height="300" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<text x="60" y="191" class="heading">Two Clifford actions</text>
<text x="60" y="237" class="math">cᵢ = εᵢ − ιᵢ;   ĉᵢ = εᵢ + ιᵢ</text>
<text x="60" y="283" class="math">Basis words: cᵢ₁⋯cᵢₐ ĉⱼ₁⋯ĉⱼᵦ</text>
<text x="60" y="328" class="math">Degree = a + b;   total degree at most 2p</text>
<text x="60" y="373" class="small">Str vanishes unless all 2p generators occur.</text>
<text x="60" y="418" class="accent">Only the full word survives</text>
<rect x="820" y="145" width="745" height="300" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<text x="845" y="191" class="heading">Transport coefficients</text>
<text x="845" y="237" class="math">k(t;x,x) ~ (4πt)^(−p/2) Σₙ tⁿ Uₙ(x,x)</text>
<text x="845" y="283" class="math">degree(Uₙ) ≤ 4n;   q = ¼ Σₐ,ᵦ Ωₐᵦ(ξ) ηₐηᵦ</text>
<text x="845" y="328" class="math">degree-4n symbol of Uₙ(x,x) = (−q)ⁿ / n!</text>
<text x="845" y="373" class="small">If n &lt; ℓ, then 4n &lt; 2p: Str Uₙ = 0.</text>
<text x="845" y="418" class="accent">First surviving term: n = ℓ</text>
<rect x="35" y="480" width="1530" height="230" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<text x="60" y="526" class="heading">The normalization in dimension four</text>
<text x="65" y="577" class="heading">n</text>
<text x="265" y="577" class="heading">degree bound</text>
<text x="640" y="577" class="heading">supertrace</text>
<text x="1050" y="577" class="heading">reason</text>
<path d="M60,591 L1540,591" fill="none" stroke="#c6d3e4" stroke-width="2"/>
<text x="65" y="627" class="math">0</text>
<text x="265" y="627" class="math">0</text>
<text x="640" y="627" class="math">0</text>
<text x="1050" y="627" class="small">full degree 8 missing</text>
<text x="65" y="663" class="math">1</text>
<text x="265" y="663" class="math">4</text>
<text x="640" y="663" class="math">0</text>
<text x="1050" y="663" class="small">full degree 8 missing</text>
<text x="65" y="699" class="math">2</text>
<text x="265" y="699" class="math">8</text>
<text x="640" y="699" class="math">4 K₁K₂</text>
<text x="1050" y="699" class="small">top symbol and full-word sign</text>
<rect x="35" y="745" width="745" height="230" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<text x="60" y="791" class="heading">General surviving density</text>
<text x="60" y="838" class="math">Str Uℓ = 2^ℓ Pf(Ω) / α</text>
<text x="60" y="884" class="math">(4π)^(−ℓ) × 2^ℓ = (2π)^(−ℓ)</text>
<text x="60" y="930" class="accent">Str k(t;x,x) α = Pf(Ω / 2π) + O(t)</text>
<rect x="820" y="745" width="745" height="230" rx="12" fill="white" stroke="#c6d3e4" stroke-width="2"/>
<text x="845" y="791" class="heading">Unit-round S² × S²</text>
<text x="845" y="838" class="math">K₁ = K₂ = 1;   Ω₁₂ = α₁,  Ω₃₄ = α₂</text>
<text x="845" y="884" class="math">Euler density = α₁ ∧ α₂ / (4π²)</text>
<text x="845" y="930" class="accent">Integral = 4;   harmonic ranks (1,0,2,0,1)</text>
<text x="45" y="1017" class="small">Proof: The index theorem for measured foliations, Lemma 6.17, Theorem 6.18 and Exercise 12.</text>
<text x="45" y="1051" class="small">Euler-class identification: Lemma 6.19; measured pairing: Corollary 6.20.</text>
