<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1930" viewBox="0 0 1800 1930">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45677f" /></marker></defs>
<rect width="1800" height="1930" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="bold" fill="#243d54">A whole classifying model, normal transport and twisted cocycle</text>
<text x="40" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Q1–Q6 and D1–D4: countable nerve charts, a locally compact CW telescope, one full module.</text>
<rect x="35" y="150" width="1730" height="285" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">The verified weak-equivalence route keeps the actual nerve</text>
<text x="65" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Zₘ,ₙ = ⨿ V₀ ∩ … ∩ Vₘ, with Vᵢ charts in Nₙ(H); all face images are retained.</text>
<text x="65" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">Countable CW K → double fat chart resolution → B_f H → B_M H</text>
<text x="65" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">X = Tel(finite K stages) → K is a full homotopy equivalence; proper height has compact slabs.</text>
<rect x="35" y="470" width="1730" height="300" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">The full normal bundle is pulled along one entire map</text>
<text x="65" y="590" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">F_X = d k p : X → B_M H;   E_X = F_X* E_M;   f_X = F_X* c.</text>
<text x="65" y="651" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Actual arrows and their normal derivatives give the cocycle, its Clifford bundle and its metric.</text>
<text x="65" y="717" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#00796b">K^{j,τ}(BG) = KK_Xʲ(C₀(X, Cl⁺(E_X)ᵒᵖ), C₀(X)); j ∈ Z/2.</text>
<rect x="35" y="805" width="1730" height="515" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="863" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">D1 bundle transport: even an equal endpoint projector can carry a sign</text>
<path d="M165,1045 L435,1045" fill="none" stroke="#bcc9d4" stroke-width="3" />
<path d="M300,910 L300,1180" fill="none" stroke="#bcc9d4" stroke-width="3" />
<path d="M195,1045 L405,1045" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M300,1045 L405,1045" fill="none" stroke="#00796b" stroke-width="3" marker-end="url(#arr)" />
<text x="240" y="1214" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">t = 0</text>
<path d="M765,1045 L1035,1045" fill="none" stroke="#bcc9d4" stroke-width="3" />
<path d="M900,910 L900,1180" fill="none" stroke="#bcc9d4" stroke-width="3" />
<path d="M900,940 L900,1150" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M900,1045 L900,940" fill="none" stroke="#00796b" stroke-width="3" marker-end="url(#arr)" />
<text x="840" y="1214" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">t = 1/2</text>
<path d="M1365,1045 L1635,1045" fill="none" stroke="#bcc9d4" stroke-width="3" />
<path d="M1500,910 L1500,1180" fill="none" stroke="#bcc9d4" stroke-width="3" />
<path d="M1395,1045 L1605,1045" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M1500,1045 L1395,1045" fill="none" stroke="#00796b" stroke-width="3" marker-end="url(#arr)" />
<text x="1440" y="1214" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">t = 1</text>
<text x="65" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">P(t) projects onto (cos πt, sin πt).   [P′,P] = πJ; V(t) is rotation by πt.</text>
<text x="65" y="1274" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">P(0) = P(1), but V(1) on that line is −1. The specified normal comparison is retained.</text>
<rect x="35" y="1355" width="1730" height="340" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1413" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">D4 one analytic product on the whole X</text>
<text x="65" y="1476" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#00796b">χ(η) = k_(f_X) · τ_(C₀(X))(η),   η ∈ KKʲ(C*r(G), C).</text>
<text x="65" y="1535" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">Fields: *-strong bounded operators; norm-continuous localized compact defects.</text>
<text x="65" y="1591" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Whole model homotopies identify full groups and χ; positive right C₁ stays in odd degree.</text>
<text x="65" y="1647" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Every class lives on one full X. No inverse limit of compact restrictions defines this group.</text>
<text x="40" y="1755" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part Q/D; Exercises 68–79. Full classifying route: V, Q and D.</text>
<text x="40" y="1810" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">The line directions are exact; the nerve and telescope descriptions are schematics, without a chosen metric.</text>
<text x="40" y="1865" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The full construction and compact-test comparison are proved in Theorem 6.2, parts T–I.</text>
</svg>