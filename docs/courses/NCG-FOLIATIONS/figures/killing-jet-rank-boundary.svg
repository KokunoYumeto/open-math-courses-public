<text x="450" y="482" font-size="17" fill="#16745d" font-weight="400" text-anchor="middle" class="">F: rank 3 on closed [−1,1]</text>
<text x="727.5" y="482" font-size="17" fill="#176cb6" font-weight="400" text-anchor="middle" class="">U: rank 6</text>
