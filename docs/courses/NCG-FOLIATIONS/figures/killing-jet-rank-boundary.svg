<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1700" viewBox="0 0 900 1700" role="img" aria-labelledby="title desc">
<title id="title">Killing jets and compactness at a rank boundary</title>
<desc id="desc">Figure 11BT.1. The real ambient jet bundle, its Hermitian complexification, original germ transport and exact closed quotient norm are followed by the actual unit warped-torus rank3/6 decomposition. All module-compact W blocks vanish at t=1, whereas fP_W has norm and distance 1 from the module compacts and the complete-domain number-operator degree-one inverse retains 1/2. A proper lambda multiplier with its whole ideal-supported domain repairs W compactness only. Proof: Section 11BT, KJ.1-KJ.8, Section 11BT.7 and KJC.1-KJC.9. No auxiliary index, general covariance or reduced scalar class is inferred.</desc>
<metadata>Original expression CC0-1.0. Installed fonts and external software retain their actual terms.</metadata>
<style>text{font-family:Arial,Helvetica,sans-serif;} .math{font-family:"Cambria Math",Georgia,serif;}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#153046"/></marker></defs>
<rect width="900" height="1700" fill="#fff"/>
<text x="28" y="43" font-size="29" fill="#153046" font-weight="700" text-anchor="start" class="">Killing jets and compactness at a rank boundary</text>
<text x="28" y="74" font-size="18" fill="#516777" font-weight="400" text-anchor="start" class="">The real germs, their complex Hilbert module, an exact failure, and a W-block repair</text>
<rect x="28" y="100" width="844" height="220" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="117" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="137" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">A</text>
<text x="88" y="137" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">Actual real jets and their Hermitian complexification</text>
<text x="847" y="137" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KJ.1–KJ.8</text>
<text x="48" y="168" font-size="22" fill="#153046" font-weight="400" text-anchor="start" class="math">J<tspan baseline-shift="sub" font-size="15.84">ℝ</tspan> = TT ⊕ so(TT),    J = J<tspan baseline-shift="sub" font-size="15.84">ℝ</tspan> ⊗<tspan baseline-shift="sub" font-size="15.84">ℝ</tspan> ℂ,    rank<tspan baseline-shift="sub" font-size="15.84">ℂ</tspan> J = Q = q(q+1)/2.</text>
<text x="48" y="201" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">E<tspan baseline-shift="sub" font-size="13.68">K</tspan> = closure of f jX in Γ₀(J);  f jX is a jet section, not j(fX).</text>
<text x="48" y="236" font-size="21" fill="#153046" font-weight="400" text-anchor="start" class="math">(v,A) ↦ (dg v, dg A dg<tspan baseline-shift="super" font-size="15.12">-1</tspan>) on actual germ domains; extend complex linearly.</text>
<text x="48" y="271" font-size="21" fill="#153046" font-weight="400" text-anchor="start" class="math">‖s + E<tspan baseline-shift="sub" font-size="15.12">K</tspan> C₀(U)‖ = sup<tspan baseline-shift="sub" font-size="15.12">x∈F</tspan> ‖s(x)‖;  fibres retain ambient Killing germs.</text>
<text x="48" y="303" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">F may be singular. The exact quotient is a module restriction, not a new tangent bundle.</text>
<rect x="28" y="338" width="844" height="300" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="355" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="375" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">B</text>
<text x="88" y="375" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">The exact q = 3 warped unit example</text>
<text x="847" y="375" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">11BT.7; SE.23–SE.24</text>
<text x="48" y="405" font-size="22" fill="#153046" font-weight="400" text-anchor="start" class="math">T = (ℝ/ℤ)² × (−2,2),    g = dt² + e<tspan baseline-shift="super" font-size="15.84">2u(t)</tspan>(dx² + dy²).</text>
<text x="48" y="438" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="math">u(t) = ε e<tspan baseline-shift="super" font-size="12.96">-1/(1−t²)</tspan> for |t| &lt; 1, zero otherwise; ε &gt; 0. Ends ±2 are omitted.</text>
<rect x="80" y="456" width="185" height="38" rx="0" fill="#eaf0f8" stroke="none"/>
