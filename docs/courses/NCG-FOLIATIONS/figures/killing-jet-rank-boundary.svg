<text x="265" y="523" font-size="17" fill="#516777" font-weight="400" text-anchor="middle" class="">−1</text>
<circle cx="635" cy="456" r="4" fill="#16745d" stroke="#16745d" stroke-width="2"/>
<text x="635" y="523" font-size="17" fill="#516777" font-weight="400" text-anchor="middle" class="">1</text>
<circle cx="820" cy="456" r="4" fill="#fff" stroke="#176cb6" stroke-width="2"/>
<text x="820" y="523" font-size="17" fill="#516777" font-weight="400" text-anchor="middle" class="">2</text>
<text x="48" y="558" font-size="23" fill="#153046" font-weight="400" text-anchor="start" class="math">E<tspan baseline-shift="sub" font-size="16.56">K</tspan> = Γ₀(L) ⊕ Γ₀(U,W|<tspan baseline-shift="sub" font-size="16.56">U</tspan>),     J = L ⊕ W;  complex ranks 3 and 3.</text>
<text x="48" y="590" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="">W sections extend by zero at F; the inclusion E<tspan baseline-shift="sub" font-size="12.96">K</tspan> ↪ Γ₀(J) has no adjoint.</text>
<text x="48" y="621" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math">Exact jet norm in L: (1+2H²)(|v₁|²+|v₂|²)+2|c|²,  H = u′.</text>
<rect x="28" y="656" width="844" height="345" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="673" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="693" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">C</text>
<text x="88" y="693" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">All module compacts lose the disappearing W block</text>
<text x="847" y="693" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KJC.1–KJC.6</text>
<text x="48" y="723" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="math">x₀ = (x,y,1),  x<tspan baseline-shift="sub" font-size="12.96">n</tspan> = (x,y,1+1/n), n ≥ 2;  0 ≤ f ≤ 1 and f = 1 near x₀.</text>
<text x="48" y="757" font-size="22" fill="#16745d" font-weight="400" text-anchor="start" class="math">For EVERY K ∈ 𝒦(E<tspan baseline-shift="sub" font-size="15.84">K</tspan>):   ‖(P<tspan baseline-shift="sub" font-size="15.84">W</tspan> K P<tspan baseline-shift="sub" font-size="15.84">W</tspan>)<tspan baseline-shift="sub" font-size="15.84">x<tspan baseline-shift="sub" font-size="15.84">n</tspan></tspan>‖ → 0.</text>
<rect x="48" y="777" width="390" height="63" rx="10" fill="#e4f2ed" stroke="#bad9ce"/>
<rect x="458" y="777" width="390" height="63" rx="10" fill="#fbeceb" stroke="#e4bdb9"/>
<text x="243" y="798" font-size="20" fill="#16745d" font-weight="700" text-anchor="middle" class="">Module-compact W block</text>
<text x="243" y="830" font-size="20" fill="#16745d" font-weight="400" text-anchor="middle" class="">limit norm 0</text>
<text x="653" y="798" font-size="20" fill="#a83d35" font-weight="700" text-anchor="middle" class="">Actual fP<tspan baseline-shift="sub" font-size="14.4">W</tspan> at x<tspan baseline-shift="sub" font-size="14.4">n</tspan></text>
<text x="653" y="830" font-size="20" fill="#a83d35" font-weight="400" text-anchor="middle" class="">norm 1; distance to 𝒦 is 1</text>
<text x="48" y="872" font-size="20" fill="#153046" font-weight="400" text-anchor="start" class="math">Fock module ℱ = ⊕<tspan baseline-shift="sub" font-size="14.4">r≥0</tspan> E<tspan baseline-shift="sub" font-size="14.4">K</tspan><tspan baseline-shift="super" font-size="14.4">⊗r</tspan>,  N(ξ<tspan baseline-shift="sub" font-size="14.4">r</tspan>) = (rξ<tspan baseline-shift="sub" font-size="14.4">r</tspan>);  degree 0 is C₀(T).</text>
<text x="48" y="907" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">Dom N:  Σ<tspan baseline-shift="sub" font-size="13.68">r</tspan> r²⟨ξ<tspan baseline-shift="sub" font-size="13.68">r</tspan>,ξ<tspan baseline-shift="sub" font-size="13.68">r</tspan>⟩ converges in C₀(T) norm, not merely pointwise.</text>
<text x="48" y="939" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="math">Every complete fibre (1+N<tspan baseline-shift="sub" font-size="12.96">x</tspan>²)<tspan baseline-shift="super" font-size="12.96">-1</tspan> is compact; all tensor multiplicities are finite.</text>
<text x="48" y="978" font-size="23" fill="#a83d35" font-weight="400" text-anchor="start" class="math">ι₁* f(1+N²)<tspan baseline-shift="super" font-size="16.56">-1</tspan> ι₁ = (f/2) 1<tspan baseline-shift="sub" font-size="16.56">E<tspan baseline-shift="sub" font-size="16.56">K</tspan></tspan>;  its W norm stays 1/2.</text>
<rect x="28" y="1019" width="844" height="349" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="1036" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="1056" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">D</text>
<text x="88" y="1056" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">A proper multiplier repairs this W compactness only</text>
<text x="847" y="1056" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">KJC.7–KJC.9</text>
<text x="48" y="1090" font-size="25" fill="#153046" font-weight="400" text-anchor="start" class="math">λ(t) = 1 + (t²−1)<tspan baseline-shift="super" font-size="18">-2</tspan> + (4−t²)<tspan baseline-shift="super" font-size="18">-2</tspan>,    t ∈ (−2,−1) ∪ (1,2).</text>
<text x="48" y="1128" font-size="21" fill="#153046" font-weight="400" text-anchor="start" class="math">Dom M_λ = {s ∈ E<tspan baseline-shift="sub" font-size="15.12">W</tspan>: λs ∈ E<tspan baseline-shift="sub" font-size="15.12">W</tspan>};  the whole weighted vanishing domain.</text>
<text x="48" y="1160" font-size="19" fill="#153046" font-weight="400" text-anchor="start" class="math">(λ ± i)<tspan baseline-shift="super" font-size="13.68">-1</tspan> ∈ C₀(U); actual resolvents are compact on the full E<tspan baseline-shift="sub" font-size="13.68">W</tspan> module.</text>
<rect x="80" y="1190" width="185" height="26" rx="0" fill="#e4f2ed" stroke="none"/>
<rect x="265" y="1190" width="370" height="26" rx="0" fill="#edf1f4" stroke="none"/>
<rect x="635" y="1190" width="185" height="26" rx="0" fill="#e4f2ed" stroke="none"/>
<text x="172.5" y="1209" font-size="16" fill="#16745d" font-weight="400" text-anchor="middle" class="">λ → ∞ at both ends</text>
<text x="450" y="1209" font-size="16" fill="#516777" font-weight="400" text-anchor="middle" class="">F: no W fibre</text>
<text x="727.5" y="1209" font-size="16" fill="#16745d" font-weight="400" text-anchor="middle" class="">λ → ∞ at both ends</text>
<circle cx="80" cy="1190" r="4" fill="#fff" stroke="#16745d" stroke-width="2"/>
<text x="80" y="1242" font-size="17" fill="#516777" font-weight="400" text-anchor="middle" class="">−2</text>
<circle cx="265" cy="1190" r="4" fill="#fff" stroke="#16745d" stroke-width="2"/>
<text x="265" y="1242" font-size="17" fill="#516777" font-weight="400" text-anchor="middle" class="">−1</text>
