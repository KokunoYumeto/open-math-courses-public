<text x="635" y="1242" font-size="17" fill="#516777" font-weight="400" text-anchor="middle" class="">1</text>
<circle cx="820" cy="1190" r="4" fill="#fff" stroke="#16745d" stroke-width="2"/>
<text x="820" y="1242" font-size="17" fill="#516777" font-weight="400" text-anchor="middle" class="">2</text>
<text x="48" y="1281" font-size="24" fill="#16745d" font-weight="400" text-anchor="start" class="math">f(1+M_λ²)<tspan baseline-shift="super" font-size="17.28">-1</tspan> = M<tspan baseline-shift="sub" font-size="17.28">f|U/(1+λ²)</tspan> ∈ 𝒦(E<tspan baseline-shift="sub" font-size="17.28">W</tspan>).</text>
<text x="48" y="1314" font-size="18" fill="#153046" font-weight="400" text-anchor="start" class="">The coefficient lies in C₀(U); every W boundary block tends uniformly to zero.</text>
<text x="48" y="1344" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">All four endpoints remain absent from U. No metric completion or ambient projection is added.</text>
<rect x="28" y="1386" width="844" height="206" rx="12" fill="#f7fafc" stroke="#d4e0e7"/>
<rect x="46" y="1403" width="28" height="28" rx="7" fill="#153046" stroke="none"/>
<text x="60" y="1423" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" class="">E</text>
<text x="88" y="1423" font-size="20" fill="#153046" font-weight="700" text-anchor="start" class="">What the module and the weight do not supply</text>
<text x="847" y="1423" font-size="15" fill="#516777" font-weight="400" text-anchor="end" class="">Section 11BT.6</text>
<text x="48" y="1453" font-size="17" fill="#153046" font-weight="400" text-anchor="start" class="">An ambient adjoint would give a continuous projection trace k(x), impossible at 3/6.</text>
<text x="48" y="1482" font-size="16" fill="#153046" font-weight="400" text-anchor="start" class="">The selected L/W coordinate splitting is the unit example; arbitrary nonunit arrows may mix it.</text>
<text x="48" y="1511" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">No auxiliary index, general covariance, reduced representation or final scalar cycle is inferred.</text>
<text x="48" y="1540" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">The original normal degree q, full inverse Spin-c coefficient, right Cl₃ and disk stay prescribed.</text>
<text x="48" y="1569" font-size="16" fill="#516777" font-weight="400" text-anchor="start" class="">The weight proves genuine compactness on E<tspan baseline-shift="sub" font-size="11.52">W</tspan> only; further operator coherence is separate.</text>
<text x="28" y="1620" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="">Figure 11BT.1. Real germs and complex jet module: KJ.1–KJ.8; rank boundary: Section 11BT.7.</text>
<text x="28" y="1644" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="">Disappearing compact blocks, full Fock domain and exact constants: KJC.1–KJC.6; weight: KJC.7–KJC.9.</text>
<text x="28" y="1668" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="">Distance to module compacts: ‖fP<tspan baseline-shift="sub" font-size="10.8">W</tspan>‖<tspan baseline-shift="sub" font-size="10.8">ess</tspan> = 1; ‖f(1+N²)<tspan baseline-shift="super" font-size="10.8">-1</tspan>‖<tspan baseline-shift="sub" font-size="10.8">ess</tspan> = 1/2 (KJC.2–KJC.6).</text>
<text x="28" y="1692" font-size="15" fill="#516777" font-weight="400" text-anchor="start" class="">Original expression CC0 1.0. The complete arguments remain in Section 11BT; no fibrewise shortcut is used.</text>
