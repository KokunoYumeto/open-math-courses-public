<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800">
<rect width="1600" height="1800" fill="#f4f7fb"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#446b94"/></marker></defs>
<text x="55" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="39" fill="#20334d" font-weight="bold">The actual Thom map and uniform horocycle averages</text>
<text x="55" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Exact deformation maps and group coordinates; the trace can vanish on a nonzero K-group.</text>
<rect x="50" y="145" width="1500" height="310" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">A. Naturality identifies the analytic maps before any trace is applied</text>
<text x="140" y="249" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">Kⱼ(B)</text>
<text x="905" y="249" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">Kⱼ₊d(B ⋊ H)</text>
<path d="M320 239 L850 239" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="395" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">ΦH = ev₁ ev₀⁻¹ ( · ⊠ bord )</text>
<path d="M210 264 L210 338" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="240" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">· ⊠ bord</text>
<path d="M1040 338 L1040 267" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="1070" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">ev₁</text>
<text x="125" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Kⱼ₊d(B ⊗ C₀(𝔥*))</text>
<path d="M525 360 L850 360" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="610" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">ev₀⁻¹</text>
<text x="905" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Kⱼ₊d(𝔄H(B))</text>
<text x="80" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Fixed orientation ⇒ same ΦH; orientation reversal ⇒ −ΦH. Corollary 8.24, eqs. (80)–(82).</text>
<rect x="50" y="485" width="1500" height="245" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">B. A fixed vector sees only the small middle unipotent</text>
<text x="80" y="584" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Ūₙ U_{(λ−1)/n} Ū_{−n/λ} = [ λ , 0 ; (λ−1)/n , λ⁻¹ ] → diag(λ,λ⁻¹),   λ&gt;0.</text>
<text x="80" y="631" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">Upper-unipotent fixed ⇒ positive-diagonal fixed ⇒ lower-unipotent fixed ⇒ L-fixed.</text>
<text x="80" y="684" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">For L²₀(X,m), every weak limit of π(at) has U-fixed range; that range is zero. Lemma 8.25.</text>
<rect x="50" y="760" width="1500" height="555" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">C. Actual Gauss coordinates: g=Ūv ar Us;   at g a−t=Ūv/T ar UTs</text>
<text x="80" y="852" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">T=eᵗ; Haar=eʳ dv dr ds; kε=e⁻ʳ φε(v,r)h(s). Conjugation has Jacobian 1.</text>
<text x="80" y="897" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Section r=0; bounding support boxes for ε=1/4, T=4. Both axes use the same scales.</text>
<path d="M160 1085 L370 1085" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<path d="M180 1187 L180 973" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="362" y="1121" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">s</text>
<text x="145" y="969" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">v</text>
<path d="M795 1085 L1465 1085" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<path d="M815 1187 L815 973" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="1457" y="1121" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">s</text>
<text x="780" y="969" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">v</text>
<rect x="180" y="1005.0" width="150" height="160.0" fill="#b74a3d" fill-opacity=".25" stroke="#b74a3d" stroke-width="3"/>
<rect x="815" y="1065.0" width="600" height="40.0" fill="#168274" fill-opacity=".25" stroke="#168274" stroke-width="3"/>
<text x="128" y="995.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">1/4</text>
<text x="115" y="1190.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">−1/4</text>
<text x="170" y="1121" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">0</text>
<text x="325" y="1121" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">1</text>
<text x="739" y="1050.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">1/16</text>
<text x="730" y="1159.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">−1/16</text>
<text x="805" y="1121" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">0</text>
<text x="1410" y="1121" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">4</text>
<path d="M408 1041 L685 1041" fill="none" stroke="#446b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="424" y="1017" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">(s,v) ↦ (4s,v/4)</text>
<text x="150" y="1220" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Before: width 1, height 1/2.</text>
<text x="820" y="1220" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">After: width 4, height 1/8.</text>
<text x="80" y="1268" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Equal coordinate area 1/2. Smooth h, φε lie inside these boxes; no probability density is drawn.</text>
<rect x="50" y="1345" width="730" height="270" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="1345" width="740" height="270" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="1391" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="bold">D. Compactness controls the moving centre</text>
<text x="80" y="1440" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">y=a−t x;   {hy : y∈X} compact in L².</text>
<text x="80" y="1487" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Finite ε-net + mixing ⇒ uniform thickened average.</text>
<text x="80" y="1534" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">First T→∞, then ε→0, then h→1[0,1] in L¹.</text>
<text x="80" y="1583" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Uniform orbit averages ⇒ unique probability m.</text>
<text x="840" y="1391" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="bold">E. Closed forms have zero Haar-current pairing</text>
<text x="840" y="1440" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">[A,N]=N;   [A#,N#]=−N#.</text>
<text x="840" y="1487" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">0=∫ dω(A#,N#) dm=∫ω(N#) dm.</text>
<text x="840" y="1534" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">τ*(K₀(C(X)⋊U ℝ))={0}, yet K₀≠0.</text>
<text x="840" y="1583" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">A ball-supported odd Bott class detects K¹(X)≠0.</text>
<text x="55" y="1660" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Scope: L=SL(2,ℝ), Γ discrete cocompact, X=L/Γ; U lower unipotent. Theorem 8.26; Corollary 8.27.</text>
<text x="55" y="1707" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">Human source: Connes, freely accessible survey, Theorem 5 and Section 12; complete proofs in this lesson.</text>
<text x="55" y="1753" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#20334d" font-weight="normal">Original reproducible SVG/PNG: GPT-6.1 Sol (OpenAI), CC0. Full proofs and Exercises 22–25 accompany it.</text>
</svg>
