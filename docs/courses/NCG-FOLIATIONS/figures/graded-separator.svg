<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390">
<rect width="1600" height="1390" fill="#f4f7fb"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#446b94"/></marker></defs>
<text x="55" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="bold" fill="#20334d">A graded separator gives an actual product operator</text>
<text x="55" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">Construction: compact creation-map errors and positive quotient conditions are checked explicitly.</text>
<rect x="50" y="150" width="1500" height="365" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">A. The approximation looks one step ahead</text>
<text x="80" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">εₙ=2⁻ⁿ;  bₙ=(vₙ−vₙ₋₁)¹/²;  w∈Z∪X₂;  Z⊂J and X₂⊂A₂ are compact total sets.</text>
<text x="115" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#20334d">Approximation term</text>
<text x="585" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#20334d">Terms it controls</text>
<text x="1120" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="bold" fill="#20334d">Norm bound</text>
<path d="M90 315 L1470 315" stroke="#446b94" stroke-width="3" fill="none"/>
<text x="115" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">vₙ₋₁</text>
<text x="585" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">u₁w,…,uₙw</text>
<text x="1120" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">4εₙ²</text>
<text x="115" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">vₙ</text>
<text x="585" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">u₁w,…,uₙ₊₁w</text>
<text x="1120" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">εₙ²</text>
<text x="80" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">⇒ ‖bₙ²uₙw‖≤5εₙ²  ⇒  ‖bₙuₙbₙw‖≤(√5+1)εₙ.  Eqs. (90)–(92).</text>
<rect x="50" y="545" width="730" height="325" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="545" width="740" height="325" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="591" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">B. A strict sum; compact errors are norm sums</text>
<text x="80" y="646" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">N=∑bₙuₙbₙ;  0≤∑ᵢ₌₁ᵏ bᵢuᵢbᵢ≤vₖ≤1.</text>
<text x="80" y="697" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">For z∈J: the summable tails give strict convergence.</text>
<text x="80" y="748" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">M=1−N;  MA₁⊂J;  NA₂⊂J;  [M,Δ]⊂J.</text>
<text x="80" y="819" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="normal" fill="#20334d">M and N are even positive multipliers, not necessarily in J.</text>
<text x="840" y="591" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">C. The module embedding has two dense ranges</text>
<text x="840" y="646" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">T eᵢ=2⁻ⁱηᵢ ⊕ 4⁻ⁱeᵢ;  every η recurs infinitely often.</text>
<text x="840" y="697" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">T(2ʲeⱼd) → ηd ⊕ 0;   T*(0⊕4ⁱeᵢd)=eᵢd.</text>
<text x="840" y="748" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">Polar isometry ⇒ E₁ is an even projection range P.</text>
<text x="840" y="819" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">G=P(1 ⊗̂ F₂)P, with the exact graded tensor sign.</text>
<rect x="50" y="900" width="730" height="280" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="900" width="740" height="280" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="947" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="bold" fill="#20334d">D. Creation maps identify the actual tensor module</text>
<text x="110" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">E₂</text>
<text x="570" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">E₁ ⊗̂ E₂</text>
<text x="580" y="1048" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="normal" fill="#20334d">balanced over D</text>
<path d="M200 1007 L540 1007" stroke="#446b94" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="295" y="988" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Tξ</text>
<text x="80" y="1080" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">G Tξ − (−1)⁽|ξ|⁾ Tξ F₂ is compact; adjoint error too.</text>
<text x="80" y="1137" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">Zero connection ⇔ compact products with 𝒦(E₁)⊗̂1.</text>
<text x="840" y="947" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#20334d">E. The separator balances the two operators</text>
<text x="840" y="1010" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">F=M¹/²(F₁⊗̂1)+N¹/²G.</text>
<text x="840" y="1072" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Localized Kasparov defects lie in J=𝒦(E).</text>
<text x="840" y="1137" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="normal" fill="#20334d">φ(a)[F₁⊗̂1,F]φ(a)* ≡ 2φ(a)M¹/²φ(a)* ≥0 mod J.</text>
<text x="55" y="1230" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">Scope: separable graded algebras, countably generated modules, normalized self-adjoint odd F₁,F₂.</text>
<text x="55" y="1273" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="normal" fill="#20334d">Proof: K-theory of the leaf space, §0, (90)–(101). Uniqueness, homotopy and associativity are proved there.</text>
<text x="55" y="1316" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="normal" fill="#20334d">Human background: Blackadar, §§12.4,14.6,17.2.7,18.3–18.6; Connes–Skandalis, Appendix A.</text>
<text x="55" y="1360" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="normal" fill="#20334d">Original editable diagram: GPT-6.1 Sol (OpenAI), CC0.</text>
</svg>
