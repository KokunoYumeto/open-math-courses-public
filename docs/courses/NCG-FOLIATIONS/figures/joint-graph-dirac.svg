<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2563eb"/></marker></defs><rect width="760" height="1000" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="30" y="38" font-size="25" fill="#172554" text-anchor="start">Joint Dirac and its actual graph phase</text><text x="30" y="66" font-size="16" fill="#475569" text-anchor="start">Theorem 11BO.1 · DJ.1–DJ.33 · Exercises 297–299</text><rect x="26" y="88" width="708" height="202" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="119" font-size="19" fill="#172554" text-anchor="start">A. One positive speed weights both leading operators</text><text x="45" y="157" font-size="23" fill="#1d4ed8" text-anchor="start">A = α¹ᐟ² (Dκ ⊗ 1 + Γκ ⊗ Ninv) α¹ᐟ²</text><text x="45" y="188" font-size="16" fill="#172554" text-anchor="start">Dκ: compact resolvent; index +1; every label preserves its domain.</text><text x="45" y="220" font-size="16" fill="#172554" text-anchor="start">Local graph norm controls H¹ in all q normal directions and Dκ.</text><text x="45" y="251" font-size="16" fill="#172554" text-anchor="start">Finite Dκ² windows + Rellich give ordinary scalar local compacts.</text><text x="45" y="274" font-size="15" fill="#172554" text-anchor="start">The full inverse Spin-c line and final right Clq factor remain.</text><rect x="26" y="308" width="708" height="238" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="340" font-size="18" fill="#172554" text-anchor="start">B. Actual multiplication, agreeing domains, full graph carrier</text><rect x="45" y="364" width="175" height="47" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="132.5" y="394" font-size="17" fill="#172554" text-anchor="middle">Transfer tensor</text><rect x="295" y="364" width="170" height="47" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="380.0" y="394" font-size="17" fill="#172554" text-anchor="middle">Original T</text><rect x="540" y="364" width="172" height="47" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="626.0" y="394" font-size="17" fill="#172554" text-anchor="middle">Graph E_Z</text><line x1="225" y1="388" x2="288" y2="388" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><line x1="470" y1="388" x2="533" y2="388" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="249" y="434" font-size="20" fill="#172554" text-anchor="middle">Ω</text><text x="503" y="434" font-size="20" fill="#172554" text-anchor="middle">W</text><text x="45" y="466" font-size="20" fill="#172554" text-anchor="start">D_i = Σj φj V_ij Dκ V_ij⁻¹ = Dκ + K_i</text><text x="45" y="498" font-size="16" fill="#172554" text-anchor="start">D_i = V_il D_l V_il⁻¹, including the complete graph domains.</text><text x="45" y="527" font-size="18" fill="#1d4ed8" text-anchor="start">Fgraph = P (1 ⊗ F_A₀) P on the entire induced range.</text><rect x="26" y="564" width="708" height="187" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="596" font-size="18" fill="#172554" text-anchor="start">C. The physical normal phase is tested on actual columns</text><text x="45" y="633" font-size="21" fill="#1d4ed8" text-anchor="start">e⁻ⁱᵗᶠ F_A₀ eⁱᵗᶠ v → Γκ i C(df) / |df| · v</text><text x="45" y="665" font-size="16" fill="#172554" text-anchor="start">First prove this on the compact joint core; extend by L² density.</text><text x="45" y="694" font-size="16" fill="#172554" text-anchor="start">Compact creation errors vanish on the oscillating packets.</text><text x="45" y="726" font-size="17" fill="#172554" text-anchor="start">Original positive disk: b_U = b_V[j_VU]; scalar Bott pairing +1.</text><rect x="26" y="769" width="708" height="177" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="801" font-size="18" fill="#172554" text-anchor="start">D. Bounded compression does not imply domain preservation</text><text x="45" y="833" font-size="18" fill="#172554" text-anchor="start">Two copies of (0,1): α₁ = x²(1−x)², α₂ = x(1−x).</text><text x="45" y="864" font-size="16" fill="#172554" text-anchor="start">x_n = λ_n⁻¹ᐟ³; coefficient x_n²; bump width comparable to x_n.</text><text x="45" y="895" font-size="16" fill="#172554" text-anchor="start">Auxiliary norm: copy 1 ≍ x_n; copy 2 ≍ 1 (not square summable).</text><text x="45" y="925" font-size="16" fill="#172554" text-anchor="start">P(u₁,0) = (u₁/2,u₁/2) fails the second completed domain.</text><text x="30" y="976" font-size="14" fill="#475569" text-anchor="start">Exact operator/type schematic; ≍ denotes uniform two-sided estimates. CC0.</text></g></svg>