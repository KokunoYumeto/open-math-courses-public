<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1530" viewBox="0 0 1800 1530">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45677f" /></marker></defs>
<rect width="1800" height="1530" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="bold" fill="#243d54">Full Milnor classification by finite local avoidance of indices</text>
<text x="40" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">X locally compact, Hausdorff, second countable; actual arrow equivalences; all homotopies on X × I.</text>
<rect x="35" y="150" width="1730" height="325" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">M2–M3. Two choices meet at the same auxiliary whole map</text>
<rect x="65" y="247" width="310" height="112" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="90" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">Φ₀</text>
<text x="90" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">old partition αᵢ</text>
<rect x="745" y="247" width="310" height="112" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="770" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">Φ_*</text>
<text x="770" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">ρⱼ at color νⱼ</text>
<rect x="1425" y="247" width="310" height="112" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1450" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">Φ₁</text>
<text x="1450" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">old partition βᵢ</text>
<path d="M395,303 L725,303" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<path d="M1405,303 L1075,303" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="446" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243d54">H⁰_s</text>
<text x="1174" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243d54">H¹_s</text>
<text x="65" y="409" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#00796b">Iⱼ is finite;  νⱼ &gt; max(Iⱼ ∪ {ν₀,…,νⱼ₋₁} ∪ {−1}).</text>
<text x="65" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Weights (1 − s)αᵢ and sρⱼ sum to 1; every column uses the combined actual cocycle.</text>
<rect x="35" y="510" width="1730" height="380" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="564" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">Exercise 72. Every old index is used somewhere; local avoidance still works</text>
<text x="65" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">X = ℕ;  αᵢ(n) = βᵢ(n) = δᵢₙ;  Wⱼ = {j};  Iⱼ = {j};  choose νⱼ = 2j + 1.</text>
<rect x="65" y="658" width="780" height="170" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<rect x="915" y="658" width="790" height="170" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="90" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">At point j = 2</text>
<text x="90" y="759" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">old color 2;  auxiliary color 5</text>
<text x="90" y="805" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">ρ₂(2) = 1: the two colors are distinct.</text>
<text x="940" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">At point n = 5</text>
<text x="940" y="759" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">old color 5;  auxiliary color ν₅ = 11</text>
<text x="940" y="805" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">ρ₂(5) = 0: color 5 has no collision.</text>
<text x="65" y="870" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The global index set is unbounded. The proof constructs one whole homotopy on all of X.</text>
<rect x="35" y="925" width="1730" height="385" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="982" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">M4–M5. Recover every map by a global cutoff homotopy</text>
<text x="65" y="1042" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="normal" fill="#243d54">tᵢ(s) = (1 − s)tᵢ + sλᵢ,  0 ≤ s ≤ 1;  retain the same actual arrow columns.</text>
<text x="65" y="1099" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">Classifying the pulled cocycle gives RF;  the whole cutoff homotopy gives RF ≃ F.</text>
<text x="65" y="1165" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="bold" fill="#00796b">[X, B_M H] ≅ Coc_H(X)</text>
<text x="65" y="1224" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Full homotopy classes ↔ actual numerable cocycles modulo equivalence and concordance.</text>
<text x="65" y="1273" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Naturality includes nonproper continuous maps and the complete pulled normal twist.</text>
<text x="40" y="1370" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part M; Exercises 68–79. Full classifying route: V, Q and D.</text>
<text x="40" y="1418" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The full construction and compact-test comparison are proved in Theorem 6.2, parts T–I.</text>
<text x="40" y="1470" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Human context: Connes (1982), §11 p35; Moerdijk (1991), actual cocycles and classifying spaces.</text>
</svg>