<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#285a83"/></marker></defs>
<rect width="1600" height="1280" fill="#f8fafc"/>
<text x="60" y="68" font-family="Arial, DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#20374b">An elliptic symbol and its measured characteristic value</text>
<text x="60" y="112" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Proof schematic • Theorems 6.33–6.34 • No spin-c assumption in the rational reduction</text>
<rect x="55" y="140" width="1490" height="110" rx="16" fill="#eaf2fa" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="183" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">V compact • F oriented • Λ invariant and locally finite • π: F* → V</text>
<text x="82" y="226" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">Cotangent fibres use the dual positive basis; ch = tr exp(iR / (2π)).</text>
<rect x="55" y="280" width="1490" height="178" rx="16" fill="#ffffff" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="320" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#20374b">Even rank p = 2ℓ: the global exterior Clifford module</text>
<text x="82" y="364" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#20374b">B = Λ•F* ⊗ C, graded by Γ = i^ℓ c₁⋯c₂ℓ, not by exterior-degree parity.</text>
<text x="82" y="408" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">T_B: K⁰(V) ⊗ Q → K⁰_c(F*) ⊗ Q is an isomorphism; local multiplicity = 2^ℓ.</text>
<text x="82" y="443" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#20374b">For α = [σ], choose n &gt; 0 and virtual W with nα − T_B[W] torsion.</text>
<path d="M400 464 L400 500" stroke="#285a83" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<path d="M1200 464 L1200 500" stroke="#285a83" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<rect x="55" y="515" width="720" height="218" rx="16" fill="#e9f5ed" stroke="#cad6e2" stroke-width="2"/>
<rect x="825" y="515" width="720" height="218" rx="16" fill="#f0ecf9" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="558" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#20374b">Measured analytic index</text>
<text x="82" y="604" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#20374b">n Ind_Λ(D) = Ind_Λ(D_B,W)</text>
<text x="82" y="653" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#20374b">= C_Λ(Â(F) C_F ch(W))</text>
<text x="82" y="704" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Heat coefficient + symbol-class invariance</text>
<text x="852" y="558" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#20374b">Oriented fibre character</text>
<text x="852" y="604" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#20374b">n π_! ch(α)</text>
<text x="852" y="653" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#20374b">= (−1)^ℓ Â(F)^−1 C_F ch(W)</text>
<text x="852" y="704" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Gaussian relative-symbol calculation</text>
<text x="70" y="776" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#20374b">C_F = 2^ℓ det½ cosh(Ω / (4πi));  Td(F ⊗ C) = Â(F)².</text>
<path d="M400 790 L400 812" stroke="#285a83" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<path d="M1200 790 L1200 812" stroke="#285a83" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<rect x="55" y="820" width="1490" height="145" rx="16" fill="#eaf2fa" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="863" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">The two values agree after the cotangent sign and Todd factor:</text>
<text x="82" y="914" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#20374b">Ind_Λ(D) = (−1)^ℓ C_Λ( π_! [ ch(α) · π*Td(TV ⊗ C) ] ).</text>
<text x="82" y="949" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">Torsion contributes zero to both real-valued maps; divide by n.</text>
<rect x="55" y="995" width="1490" height="195" rx="16" fill="#fff3d7" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="1037" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">Odd rank: the differential-symbol symmetry is essential</text>
<text x="82" y="1080" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">σ(−ξ) = (−1)^m σ(ξ) ⇒ a*α = α, while π_!a*ch(α) = −π_!ch(α).</text>
<text x="82" y="1122" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">Thus ch(α) = 0, α is torsion, and Ind_Λ(D) = 0 for differential D.</text>
<text x="82" y="1166" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Scope check: on S¹, P₊M_(e^it)P₊ + P₋ is pseudodifferential and has index −1.</text>
<text x="60" y="1230" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#20374b">Full proofs: Lemma 6.31, Proposition 6.32, Theorem 6.33, Corollary 6.34; counterexample: Exercise 19.</text>
<text x="60" y="1264" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#20374b">Background: Connes (1979); Blackadar, stable Bott and exactness; Quillen, superconnections. Original schematic • CC0.</text>
</svg>
