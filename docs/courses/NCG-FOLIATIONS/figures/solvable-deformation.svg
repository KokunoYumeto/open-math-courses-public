<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1680" viewBox="0 0 1600 1680">
<rect width="1600" height="1680" fill="#f4f7fb"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#466b94"/></marker></defs>
<text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="42" fill="#20334d" font-weight="bold">Solvable deformation: the source dimension stays fixed</text>
<text x="60" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">A finite-mass obstruction, exact Haar factors, and a full analytic symbol comparison.</text>
<rect x="50" y="145" width="735" height="435" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="815" y="145" width="735" height="435" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="bold">A. Compact current detects the modular trace</text>
<text x="78" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">V compact, nonempty; action locally free.</text>
<text x="78" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">[X#,Y#] = −[X,Y]#;  E = X₁#∧…∧Xd#</text>
<text x="78" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">λ(E)=1;  0 &lt; μ(V)=C(λ) &lt; ∞</text>
<text x="78" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">Closedness ⇒ 0 = tr(ad X) μ(V)</text>
<text x="78" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">ΔH(exp tX)=exp(−t tr(ad X)) ⇒ ΔH=1</text>
<text x="78" y="468" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Conversely: solvable averaging gives invariant μ.</text>
<text x="78" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Unimodularity makes its tangent current closed.</text>
<text x="78" y="553" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Lemma 8.11 and Proposition 8.12; eqs. (50)–(51).</text>
<text x="843" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="bold">B. Noncompact affine counterexample</text>
<text x="843" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">H: (n,t)(n′,t′)=(n+eᵗn′,t+t′)</text>
<text x="843" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">V=H; free left action, exactly one leaf.</text>
<text x="843" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Point transversal: mass one; ΔH(n,t)=e⁻ᵗ.</text>
<text x="843" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">N#=∂n;  T#=n∂n+∂t;  tr(ad T)=1</text>
<text x="843" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">C integrates dn∧dt on compact test forms.</text>
<text x="843" y="468" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">C(λ)=∞; λ is not a compact test.</text>
<text x="843" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">∫(T#f+f) dn dt=0 for compactly supported f.</text>
<text x="843" y="553" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Example 8.13; no unimodularity inference here.</text>
<rect x="50" y="610" width="735" height="480" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="815" y="610" width="735" height="480" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="bold">C. Ordered coordinates give a smooth family</text>
<text x="78" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">H=N⋊θℝ;  ΦN:ℝᵈ⁻¹→N, inverse ΨN</text>
<text x="78" y="752" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">q *ᵥ q′ = v⁻¹ΨN(ΦN(vq)ΦN(vq′))</text>
<text x="78" y="799" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">θᵥt(q)=v⁻¹ΨN(θvt(ΦN(vq)))</text>
<text x="78" y="846" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">At v=0: q+q′, identity; H₀=ℝᵈ.</text>
<text x="78" y="893" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Γᵥ(q,t)=ΦN(vq) expH(vtX₀)</text>
<text x="78" y="940" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">Group bracket v[ , ]; action fields vX#.</text>
<text x="78" y="984" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">F(v)/v = ∫₀¹ ∂vF(rv)dr: smooth at zero.</text>
<text x="78" y="1028" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Source fibre is Hᵥ, still dimension d at zero.</text>
<text x="78" y="1070" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Theorem 8.14; eqs. (53)–(54).</text>
<text x="843" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="bold">D. Haar normalization and the exact algebra</text>
<text x="843" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">mᵥ(t)=exp(vt tr(ad X₀|n))</text>
<text x="843" y="752" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">dμᵥ=mᵥ(t)⁻¹ hN(vq) dq dt</text>
<text x="843" y="799" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">ΔHᵥ=ΔNᵥ / mᵥ; normal modulus retained.</text>
<text x="843" y="846" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">βt f=mᵥ(t)⁻¹ αexp(vtX₀)(f∘θᵥ−t)</text>
<text x="843" y="893" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">𝔄H(B)=𝔄N(B) ⋊β ℝ; central v∈[0,1].</text>
<text x="843" y="940" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="normal">v&gt;0: original kernel = v⁻ᵈ fᵥ∘Γᵥ⁻¹</text>
<text x="843" y="984" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">At v=0: B ⊗ C₀(h*), negative Fourier phase.</text>
<text x="843" y="1028" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">evᵥ,* is invertible by natural real Thom induction.</text>
<text x="843" y="1070" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Theorem 8.14; eqs. (55)–(58), both K-degrees.</text>
<rect x="50" y="1120" width="1500" height="380" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="1166" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#20334d" font-weight="bold">E. Uniform source-fibre calculus identifies the actual index</text>
<text x="78" y="1213" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Fixed source charts, finite overlap and Fourier–Schur estimates work at v=0.</text>
<text x="78" y="1257" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Negative order → 𝔄H(C(V)); quotient norm equals the principal-symbol norm.</text>
<text x="78" y="1301" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">One symbol triple gives I∈K₀(𝔄H(C(V))); the explicit index matrix evaluates naturally.</text>
<text x="118" y="1370" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="bold">[B₀,B₁,a] ∈ K⁰c(V×h*)</text>
<text x="660" y="1370" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="bold">I ∈ K₀(𝔄H)</text>
<text x="1100" y="1370" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#20334d" font-weight="bold">Inda(a) ∈ K₀(A)</text>
<path d="M640 1388 L270 1388" fill="none" stroke="#466b94" stroke-width="3" marker-end="url(#arr)"/>
<path d="M865 1388 L1240 1388" fill="none" stroke="#466b94" stroke-width="3" marker-end="url(#arr)"/>
<text x="382" y="1432" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">ev₀,*  (Fourier clutching)</text>
<text x="958" y="1432" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">ev₁,*  (actual foliation)</text>
<text x="78" y="1477" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Inda = ev₁,* ev₀,*⁻¹; graph G=V⋊H required. Lemma 8.15 and Theorem 8.16.</text>
<text x="60" y="1548" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">For compact V: Todd(Fℂ)=1; measured sign εd=(−1)ᵈ⁽ᵈ⁺¹⁾/². Bott covers every symbol class.</text>
<text x="60" y="1586" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Corollary 8.17 proves the compact trace image. Lemma 8.18–Theorem 8.23 give its relative extension.</text>
<text x="60" y="1624" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Human sources: Connes, Connes–Thom and Blackadar; full proofs and Exercises 14–17 accompany the figure.</text>
<text x="60" y="1662" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Original SVG/PNG: GPT-6.1 Sol (OpenAI), CC0. Exact maps; no assembly equality asserted.</text>
