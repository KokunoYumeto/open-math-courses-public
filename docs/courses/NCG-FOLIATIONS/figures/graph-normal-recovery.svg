<text x="915" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">Vertical recovery: M_K ⊗ M_QH ≅ Ψ* M_L</text>
<text x="915" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#253b52">Rotate (t, b_H) → (b_H, −t).</text>
<text x="915" y="478" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#253b52">χ(η, t) = η − du(Ht) ∈ N = (du K)⊥</text>
<text x="915" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">Endpoint: P_(π/2) ≅ P_K ⊗ M_QH</text>
<text x="915" y="591" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">Evaluate both H-double factors; retain the K double.</text>
<text x="915" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#253b52">Right blocks: (C_r, C_2p, C_n) → (C_r, C_n, C_2p)</text>
<rect x="35" y="725" width="1730" height="355" rx="14" fill="white" stroke="#c8d5e1" stroke-width="2"/>
<text x="65" y="778" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">3. The complete finite ambient intertwiner retains all parities</text>
<text x="80" y="835" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">After the right target flip:  (D_N ⊗ M_K)^β ≅ Π^h C_n</text>
<text x="80" y="894" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#253b52">U : Π^kₙ C_n → Π^h C_n;    U(c) = ω_K ω_N^kᵣ c</text>
<text x="80" y="944" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#253b52">k_j = j(j − 1)/2 mod 2;   |ω_K ω_N^kᵣ| = k_n + h;   U is even between these gradings.</text>
<text x="80" y="1000" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="bold" fill="#253b52">r = 3, q = 1: h = 0, U even word.       r = 1, q = 3: h = 1, U odd word but even map.</text>
<text x="80" y="1050" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#253b52">Normal inverse phase z⁻¹ × vertical phase z = 1; the whole ambient spin lift remains.</text>
<rect x="35" y="1110" width="1730" height="230" rx="14" fill="white" stroke="#c8d5e1" stroke-width="2"/>
<text x="65" y="1163" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#253b52">4. The identification reaches the whole noncompact tube</text>
<text x="80" y="1221" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#253b52">Vertical derivative → positive polar factor R(w,v) → radial path R(w,sv) → global even spin lift.</text>
<text x="80" y="1271" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#253b52">The spin ODE starts at 1; the exact density unitary and bounded interior phase retain this full orientation.</text>
<text x="80" y="1315" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#253b52">Remaining ordinary KK step: native coefficient product reductions and the two typed Thom cancellations.</text>
