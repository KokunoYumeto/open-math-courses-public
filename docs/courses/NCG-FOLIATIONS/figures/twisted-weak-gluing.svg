<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1680" viewBox="0 0 1800 1680">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45677f" /></marker></defs>
<rect width="1800" height="1680" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="bold" fill="#243d54">Weak gluing proved by finite parameter diagrams</text>
<text x="40" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">W1–W4: relative CW fillings, double cylinders, levelwise-weak fat realization and open-cover augmentation.</text>
<rect x="35" y="150" width="1730" height="460" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">W2. Weak equivalences on each span object induce a weak cylinder comparison</text>
<rect x="65" y="240" width="400" height="105" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="245" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">A</text>
<rect x="65" y="445" width="400" height="105" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="236" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">A′</text>
<rect x="695" y="240" width="400" height="105" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="875" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">C</text>
<rect x="695" y="445" width="400" height="105" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="866" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">C′</text>
<rect x="1335" y="240" width="400" height="105" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1515" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">B</text>
<rect x="1335" y="445" width="400" height="105" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1506" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#243d54">B′</text>
<path d="M675,291 L485,291" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<path d="M1115,291 L1315,291" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<path d="M675,496 L485,496" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<path d="M1115,496 L1315,496" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<path d="M265,362 L265,427" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="290" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">F_A</text>
<path d="M895,362 L895,427" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="920" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">F_C</text>
<path d="M1535,362 L1535,427" fill="none" stroke="#45677f" stroke-width="3" marker-end="url(#arr)" />
<text x="1560" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">F_B</text>
<text x="65" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">P(A, C, B) → P(A′, C′, B′) is weakly equivalent; target spaces need no CW structure.</text>
<rect x="35" y="645" width="1730" height="405" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">The actual two-open-cover decomposition of a double cylinder</text>
<rect x="65" y="735" width="320" height="85" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="203" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#243d54">A</text>
<rect x="395" y="735" width="1000" height="85" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="831" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#243d54">C × I</text>
<rect x="1415" y="735" width="320" height="85" rx="14" fill="#eef5fa" stroke="#c7d5e0" stroke-width="2" />
<text x="1555" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="bold" fill="#243d54">B</text>
<path d="M385,777 L395,777" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M1395,777 L1415,777" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M395,825 L395,842" fill="none" stroke="#45677f" stroke-width="3" />
<text x="380" y="876" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">0</text>
<path d="M728.3333333333333,825 L728.3333333333333,842" fill="none" stroke="#45677f" stroke-width="3" />
<text x="713.3333333333333" y="876" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">1/3</text>
<path d="M1061.6666666666665,825 L1061.6666666666665,842" fill="none" stroke="#45677f" stroke-width="3" />
<text x="1046.6666666666665" y="876" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">2/3</text>
<path d="M1395,825 L1395,842" fill="none" stroke="#45677f" stroke-width="3" />
<text x="1380" y="876" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">1</text>
<path d="M65,911 L1061.6666666666665,911" fill="none" stroke="#45677f" stroke-width="3" />
<text x="65" y="947" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#243d54">U_A = {height &lt; 2/3}</text>
<path d="M728.3333333333333,982 L1735,982" fill="none" stroke="#00796b" stroke-width="3" />
<text x="1080" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#00796b">U_B = {height &gt; 1/3}</text>
<circle cx="1061.6666666666665" cy="911" r="7" fill="white" stroke="#45677f" stroke-width="3" />
<circle cx="728.3333333333333" cy="982" r="7" fill="white" stroke="#00796b" stroke-width="3" />
<text x="750" y="946" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">U_A ∩ U_B = C × (1/3, 2/3)</text>
<rect x="35" y="1085" width="1730" height="375" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1142" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">W1–W2. Exact finite source pieces and compatible relative lifts</text>
<text x="65" y="1202" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">K_A = {r ≥ 1/3};  K_B = {r ≤ 2/3};  K_C = K_A ∩ K_B;  K_A ∪ K_B = K.</text>
<text x="65" y="1257" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Choose piecewise linear r with |r − p_A| &lt; 1/12. On K_C both partitions are ≥ 1/4.</text>
<text x="65" y="1312" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">Lift c on K_C first; lift a and b relative to that exact intersection and the boundary.</text>
<text x="65" y="1373" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#00796b">W3: levelwise weak maps of T1 semisimplicial spaces give a full fat weak equivalence.</text>
<text x="65" y="1427" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Compact sphere and disk images have bounded fat dimension; no inverse-limit step is used.</text>
<text x="40" y="1523" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#243d54">Proof: Theorem 6.2, part W; Exercises 68–79. Full classifying route: V, Q and D.</text>
<text x="40" y="1571" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The cylinder drawing shows heights and maps, not a metric on A, B or C.</text>
<text x="40" y="1620" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Q4 proves the actual chart-resolution augmentation on the complete holonomy nerve.</text>
</svg>