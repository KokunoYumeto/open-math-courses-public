<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440">
<rect width="1600" height="1440" fill="#f4f7fb"/>
<text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="44" fill="#20334d" font-weight="bold">A suspension band fixes the projection trace</text>
<text x="60" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">Exact Morita module, symbol-index deformation and the corrected minimal-flow conclusion.</text>
<rect x="50" y="145" width="730" height="490" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="145" width="740" height="490" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#20334d" font-weight="bold">A. Unfold the unit-time band</text>
<rect x="115" y="220" width="600" height="70" fill="#e4edf9" stroke="#829ec2" stroke-width="2"/>
<path d="M115 295 v18 M715 295 v18" stroke="#20334d" stroke-width="2"/>
<text x="101" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">t = 0</text>
<text x="663" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">t = 1</text>
<text x="210" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">0 &lt; t &lt; 1; length exactly one</text>
<text x="78" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Seam: [x,1] = [φ(x),0]</text>
<text x="78" y="429" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">F(t+1) = α−1(F(t));  αk f = f∘φ−k</text>
<text x="78" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Dense vectors: ξ(t+m) = U−m ξ(t)</text>
<text x="78" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">E = L²(0,1) ⊗ B;  B = C(X) ⋊ ℤ</text>
<text x="78" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Unfold η(t,j) to ζ(t+j): exact isometry.</text>
<text x="78" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Lemma 9.4; completed vectors need no point values.</text>
<text x="838" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#20334d" font-weight="bold">B. Compact kernels preserve trace scale</text>
<text x="838" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Ka(t,u) = Σm a(t−u−m,t) U−m</text>
<text x="838" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">AY ≅ K(E) ≅ K(L²(0,1)) ⊗ B</text>
<text x="838" y="332" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">Both inner products satisfy</text>
<text x="838" y="369" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">⟨ξ,η⟩A ζ = ξ⟨η,ζ⟩B.</text>
<text x="838" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">ν(X)=1; leaf density is dt.</text>
<text x="838" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">τY(a) = ∫₀¹ ∫X a(0,t)(x) dν(x) dt</text>
<text x="838" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">‖g‖₂=1 ⇒ τY(θg,g ⊗ 1B)=1</text>
<text x="838" y="553" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">τY = Tr ⊗ τν; no circle-volume factor.</text>
<text x="838" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Lemma 9.4; finite corners and lower semicontinuity.</text>
<rect x="50" y="665" width="730" height="535" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="810" y="665" width="740" height="535" rx="16" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="78" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">C. A symbol index covers every K-class</text>
<text x="78" y="759" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">v∈[0,1]; βs b(v)=αvs(b(v))</text>
<text x="78" y="806" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">D = −i d/dt; Us = exp(−isD)</text>
<text x="78" y="853" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">χ(p) = ½(1+p/√(1+p²))</text>
<text x="78" y="900" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="normal">P(w)=wχ(D)+1−χ(D)</text>
<text x="78" y="947" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Modulo A: χ²=χ, [χ,w]=0; P is unitary.</text>
<text x="78" y="991" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">v=0: endpoint pair (1,w) gives J0 iso.</text>
<text x="78" y="1037" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">ev0 and ev1 induce K-isomorphisms.</text>
<text x="78" y="1083" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">J1 = ev1,* ev0,*⁻¹ J0: onto (indeed iso).</text>
<text x="78" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">At v=1: symbol is 1 on p&lt;0, w on p&gt;0.</text>
<text x="78" y="1175" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Proposition 9.5; strict integral, norm commutator.</text>
<text x="838" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#20334d" font-weight="bold">D. Integral character + faithful trace</text>
<text x="838" y="759" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">X connected, dim X&gt;0, H¹(X;ℤ)=0.</text>
<text x="838" y="806" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#20334d" font-weight="normal">φ minimal ⇒ aperiodic; ν has full support.</text>
<text x="838" y="853" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">H¹(Y;ℤ)=ℤ[dt];  ⟨dt,Cν⟩=1.</text>
<text x="838" y="900" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">π! ch₁(σ) = π! c₁(σ) is integral.</text>
<text x="838" y="947" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Leaf rank one: Todd=1; cotangent sign −1.</text>
<text x="838" y="991" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#20334d" font-weight="normal">All K0(B) classes are symbol indices.</text>
<text x="838" y="1037" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#20334d" font-weight="normal">Therefore τν,*(K0(B)) = ℤ.</text>
<text x="838" y="1083" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">0≤τν(e)≤1 ⇒ e=0 or 1 by faithfulness.</text>
<text x="838" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Idempotents reduce to their range projections.</text>
<text x="838" y="1175" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Theorem 9.6; disconnected / point cases explicit.</text>
<text x="60" y="1253" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#20334d" font-weight="normal">Hypotheses: X compact metric and φ a homeomorphism for the module. The measured trace and</text>
<text x="60" y="1290" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">symbol-index panels use a smooth aperiodic suspension; panel D uses the stated minimality and cohomology.</text>
<text x="60" y="1327" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#20334d" font-weight="normal">Proofs: K-theory of the leaf space, Lemma 9.4, Proposition 9.5, Theorem 9.6 and Exercises 11–13.</text>
<text x="60" y="1364" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Human sources: Connes, Connes–Thom and Blackadar; exact locators and full arguments accompany the figure.</text>
<text x="60" y="1403" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#20334d" font-weight="normal">Original SVG/PNG: GPT-6.1 Sol (OpenAI), CC0. Coordinates exact; arrows show proved maps, not general assembly.</text>
</svg>
