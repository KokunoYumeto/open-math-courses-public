<text x="70" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">1. A separating boundary gives a global real phase</text>
<text x="90" y="243" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">Θ = 0 inside Q</text>
<text x="590" y="243" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#20334d">Θ(v) = π(1 + v / √(1 + v²))</text>
<text x="1290" y="243" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">Θ = 2π outside Q</text>
