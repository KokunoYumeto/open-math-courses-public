<text x="110" y="479" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">0</text>
<text x="105" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">2π</text>
