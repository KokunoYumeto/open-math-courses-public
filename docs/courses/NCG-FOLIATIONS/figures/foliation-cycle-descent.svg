<text x="48" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#20334d">Why the wrong-way class descends to geometric cycles</text>
<text x="48" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Compact smooth sources; full specified Spinᶜ structures; exact normal order and line twists.</text>
