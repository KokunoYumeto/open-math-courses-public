<text x="70" y="567" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">U = eⁱΘ;  Uₜ = eⁱᵗΘ in C(D), 0≤t≤1;  ‖Uₜ−Uₜ′‖ ≤ 2π|t−t′|.  Thus i!(1)=0.</text>
<rect x="40" y="620" width="1680" height="365" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">2. Reflect the collar and glue the entire principal structure</text>
<text x="110" y="742" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">First copy: frame bₐ, transition gₐᵦ</text>
<text x="1035" y="742" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Second copy: bₐR₀, κ(gₐᵦ)</text>
<path d="M645,731 L990,731" fill="none" stroke="#49677e" stroke-width="3" marker-end="url(#arr)"/>
<text x="693" y="713" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">n ↦ −n</text>
<text x="70" y="799" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">R₀ = diag(−1,1,…,1);  κ([s,z]) = [e₁ s e₁,z];  e₁²=1;  k=dim Q+q≥1.</text>
<text x="70" y="853" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Adapted collar transitions stabilize e₁:  κ(gₐᵦ)=gₐᵦ.  The identity glues the full lifts.</text>
<text x="70" y="908" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">The scalar phase z and its line H are retained.  Equality of determinant lines alone would lose H.</text>
<text x="70" y="961" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Actual cocycle, bundle and orientation extend to the compact double D; the boundary class vanishes.</text>
<rect x="40" y="1015" width="1680" height="490" rx="16" fill="white" stroke="#cad6e4" stroke-width="2"/>
<text x="70" y="1065" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#20334d">3. The north Thom class identifies the whole fibre Bott bundle</text>
<text x="100" y="1139" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">North hemisphere: π*S⁺</text>
<text x="1045" y="1139" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">South hemisphere: π*S⁻</text>
<path d="M615,1126 L995,1126" fill="none" stroke="#49677e" stroke-width="3" marker-end="url(#arr)"/>
<text x="686" y="1107" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#20334d">c⁺(w), |w|=1</text>
<text x="70" y="1200" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">b_W is this clutch bundle;  n!(1) = [b_W] − [π*S⁻];  n! # π! = 1 in KK.</text>
<text x="70" y="1260" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">Disc bordism gives π!(1)=0.  Projection and the north section then give π!([b_W])=1.</text>
<text x="70" y="1320" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">A twist H in b_W is cancelled by H* in π!.  Inverses remove the last normal block first.</text>
<text x="70" y="1380" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">Rank zero: b₀=(H,0) on M₊ ⊔ M₋;  projection modules H* and ΠH* give the difference.</text>
<text x="70" y="1443" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">(fπ)!([π*E ⊗ b_W]) = f!([E]).  Bordism, direct sum and sphere modification all descend.</text>
<text x="48" y="1554" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Lemmas6.0x–z/6.0aa/6.0ac; Theorems6.0ab/6.0ad/6.0ae; equations216–235; Exercises46–47.</text>
<text x="48" y="1600" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Phase plot samples v∈[−4,4]; dashed lines show its exact limits.  Other panels are exact module diagrams.</text>
</svg>
