<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1720" viewBox="0 0 1800 1720">
<rect width="1800" height="1720" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="bold" fill="#243d54">The full orientation cap needs its source reflection</text>
<text x="40" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">(442)–(448): L = TM ⊕ f*τ; A_L = Cl⁺(L); P_L = A_Lᵒᵖ; the prescribed full module is S.</text>
<rect x="35" y="150" width="1730" height="330" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">H1. Ordered finite cap: γ_L(c(v)) = −c(v)</text>
<text x="65" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Z = ΛL_C;  z : A_L ⊗ P_L → C(M);  S^γ has the same line, metric and right C_m.</text>
<text x="65" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">t_S = z⁻¹ (S^γ ⊗ 1_P_L) β  :  C(M) → P_TM ⊗ P_f*τ ⊗ C_m</text>
<text x="65" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">β is the actual graded right transport; the positive C_m stays last. m = dim M + rank f*τ.</text>
<text x="65" y="455" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Both Morita evaluations are full. A line H passes through as H; its square does not determine it.</text>
<rect x="35" y="515" width="1730" height="465" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="575" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">H2–H4. Exact rank-one finite sample: c* = c, c² = 1</text>
<text x="90" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">U(bar e_I ⊗ e_J)</text>
<text x="700" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">J = 0</text>
<text x="1150" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">J = 1</text>
<path d="M70,671 L1660,671" fill="none" stroke="#45677f" stroke-width="3" />
<text x="90" y="733" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">I = 0</text>
<text x="700" y="733" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="normal" fill="#243d54">1/√2</text>
<text x="1150" y="733" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="normal" fill="#243d54">c/√2</text>
<text x="90" y="817" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#243d54">I = 1</text>
<text x="700" y="817" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="normal" fill="#243d54">−c/√2</text>
<text x="1150" y="817" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="normal" fill="#243d54">1/√2</text>
<text x="65" y="895" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#00796b">U((−1)^I bar e_I ⊗ L e_J) = c U(bar e_I ⊗ e_J);  ζ = √2(bar e₀ ⊗ e₀), ⟨ζ,ζ⟩ = 1.</text>
<text x="65" y="951" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Omitting γ gives the negative physical generator in rank 1. Full balances fix the sign.</text>
<rect x="35" y="1015" width="1730" height="365" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1075" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">(446)–(448). First retain the full KK test class; then take its index</text>
<text x="65" y="1141" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#00796b">y_f = cap_S(k_f) ∈ KK(C(M), A ⊗ C_m);  cap_S(χ_f(η)) = y_f · η.</text>
<text x="65" y="1205" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">For odd η the final order is C₁ from η, then C_m from the cap. Reduce only by the fixed reducers.</text>
<text x="65" y="1269" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">With test bundle B: u[B]cap_S(χ_f(η)) = u[B]y_f · η; degree j + q − d mod 2.</text>
<text x="65" y="1333" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">All torsion, scalar transitions, grading and specified normal comparison paths are retained.</text>
<text x="40" y="1442" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">Proved native calibrations: every point-source test; every ordinary compact manifold → point (H4).</text>
<path d="M65,1503 L395,1503" fill="none" stroke="#9b6b21" stroke-width="3" stroke-dasharray="9 7" />
<text x="425" y="1514" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#805315">The full construction and compact-test comparison are proved in Theorem 6.2, parts T–I.</text>
<text x="40" y="1583" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">Proof: Theorem 6.2, part H; Exercises 68–79. Original figure and independently supplied argument.</text>
<text x="40" y="1641" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Full duality context: Connes–Skandalis (1984), §3.7–3.11. No external proof is adopted here.</text>
<text x="40" y="1687" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">Exact finite checks corroborate the algebra; Theorem 6.2 supplies the entire graph comparison.</text>
</svg>