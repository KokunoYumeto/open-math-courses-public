<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <title>Twofold holonomy and the obstruction to a counting realization</title>
  <desc>Coordinate fundamental rectangles show the flat torus cover of area one and its quotient leaf of area one half. The deck translation exchanges the two lifts of a transversal point but fixes harmonic constants. Their ordinary dimensions differ; the atomic measured dimension of constants is one half.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#23324b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#23324b;font-size:24px}.title{font-size:36px;font-weight:700}.heading{font-size:27px;font-weight:700}.small{font-size:22px}.blue{fill:#216eaf}.orange{fill:#b54c1c}.bold{font-weight:700}.line{stroke:#23324b;stroke-width:3;fill:none}</style>
  </defs>
  <rect width="1500" height="900" fill="#f6f8fc"/>
  <text x="45" y="60" class="title">Twofold holonomy: harmonic constants and counting have different dimensions</text>
  <text x="45" y="105">V = (T² × T¹)/⟨g⟩,   g(x,y,u) = (x + 1/2, y, −u),   coordinates modulo 1</text>
  <rect x="35" y="140" width="695" height="655" rx="14" fill="white" stroke="#c7d2e3"/>
  <rect x="760" y="140" width="705" height="655" rx="14" fill="white" stroke="#c7d2e3"/>
  <text x="60" y="185" class="heading">The central leaf and its holonomy cover</text>
  <text x="90" y="225">Cover: T², flat area 1</text>
  <rect x="115" y="260" width="240" height="185" fill="#d6eafa" stroke="#23324b" stroke-width="3"/>
  <rect x="355" y="260" width="240" height="185" fill="#ffdfcf" stroke="#23324b" stroke-width="3"/>
  <text x="95" y="258" class="small">y=1</text><text x="62" y="450" class="small">y=0</text>
  <text x="106" y="480" class="small">x=0</text><text x="323" y="480" class="small">x=1/2</text><text x="565" y="480" class="small">x=1</text>
  <circle cx="217" cy="370" r="9" fill="#216eaf"/><circle cx="457" cy="370" r="9" fill="#b54c1c"/>
  <path d="M232 370 L441 370" class="line" marker-end="url(#arrow)"/>
  <text x="235" y="332" class="small">deck map τ: x ↦ x+1/2</text>
  <path d="M355 492 L355 540" class="line" marker-end="url(#arrow)"/>
  <text x="380" y="525">projection of degree 2</text>
  <rect x="115" y="550" width="240" height="185" fill="#d6eafa" stroke="#23324b" stroke-width="3"/>
  <circle cx="217" cy="660" r="9" fill="#216eaf"/>
  <text x="380" y="605">L₀ = T²/⟨τ⟩</text>
  <text x="380" y="646">flat area 1/2</text>
  <text x="380" y="687">holonomy: u ↦ −u</text>
  <text x="75" y="764" class="small">Coordinate rectangles; opposite edges identified.</text>
  <text x="787" y="185" class="heading">The obstruction</text>
  <text x="790" y="242" class="bold">Harmonic zero-forms on the cover</text>
  <text x="810" y="290">Constant functions: C</text>
  <text x="810" y="335">τ acts as the identity</text>
  <text x="810" y="379" class="bold blue">Ordinary dimension: 1</text>
  <line x1="790" y1="410" x2="1435" y2="410" stroke="#c7d2e3"/>
  <text x="790" y="452" class="bold">Counting the lifts of one transversal point</text>
  <text x="810" y="496">Two lifts: C²</text>
  <text x="810" y="538">τ exchanges the two coordinates</text>
  <text x="810" y="581" class="bold orange">Ordinary dimension: 2</text>
  <line x1="790" y1="612" x2="1435" y2="612" stroke="#c7d2e3"/>
  <text x="790" y="657" class="bold">No unitary can identify these spaces.</text>
  <text x="790" y="704">n points give 2n lifts; infinitely many give ∞.</text>
  <text x="790" y="751">Measured dimension uses a trace instead.</text>
  <text x="45" y="837" class="bold">Atomic transverse mass 1:  dimΛ(constants) = area(L₀)/area(T²) = 1/2</text>
  <text x="45" y="877">Measured Betti dimensions (β₀, β₁, β₂) = (1/2, 1, 1/2); alternating sum 0.  Proof: Example 1.1.</text>
</svg>
