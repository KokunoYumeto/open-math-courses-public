<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740">
<rect width="1800" height="1740" fill="#f3f7fb" />
<text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="bold" fill="#243d54">An arbitrary localized odd Fredholm cycle gives an actual extension</text>
<text x="40" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">(449)–(454): stable semisplit extensions and KK¹(A,ℂ), with one whole homotopy in both directions.</text>
<rect x="35" y="150" width="1730" height="350" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">E1. No global square-defect assumption is added for a nonunital source</text>
<text x="65" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">s = √(1 − F²);  sφ(a), φ(a)s are compact by the localized Calkin relations.</text>
<text x="65" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" fill="#243d54">F_t = [[F, ts], [ts, −F]];  π = diag(φ,0);  F₁² = 1;  P = (1 + F₁)/2.</text>
<text x="65" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">σ(a) = Pπ(a)P;  τ(a) = qσ(a);  σ(ab) − σ(a)σ(b) = Pπ(a)(1−P)π(b)P.</text>
<text x="65" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#00796b">The defect is compact, so τ is a Busby homomorphism and σ is its cpc lift.</text>
<rect x="35" y="535" width="1730" height="450" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="595" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#243d54">Exact finite sample: F = 3/5, s = 4/5</text>
<text x="65" y="658" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">F₁ = (1/5)[[3,4],[4,−3]]</text>
<text x="65" y="719" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">P = (1/5)[[4,2],[2,1]]</text>
<text x="65" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#00796b">+1 line: (2,1)/√5</text>
<text x="65" y="840" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#243d54">−1 line: (−1,2)/√5</text>
<text x="65" y="919" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Finite normalization only;</text>
<text x="65" y="960" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">the full inverse proof is E2–E3.</text>
<path d="M935,823 L1505,823" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M1170,933 L1170,613" fill="none" stroke="#45677f" stroke-width="3" />
<path d="M957.5,929.25 L1552.5,631.75" fill="none" stroke="#00796b" stroke-width="3" />
<path d="M1076.5,636.0 L1238.0,959.0" fill="none" stroke="#8d4e7d" stroke-width="3" />
<circle cx="1510" cy="653" r="8" fill="#00796b" />
<text x="1483" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="bold" fill="#243d54">(2,1)</text>
<text x="1460" y="862" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">x</text>
<text x="1192" y="603" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#243d54">y</text>
<text x="1302" y="939" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Euclidean axes; exact lines.</text>
<rect x="35" y="1020" width="1730" height="370" rx="14" fill="white" stroke="#c7d5e0" stroke-width="2" />
<text x="65" y="1080" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="bold" fill="#243d54">E2–E3. Actual inverse dilation and both inverse identifications</text>
<text x="65" y="1145" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="normal" fill="#243d54">σ(a) = V*π(a)V;  V*V = 1;  P = VV*;  inverse Fredholm operator = 2P − 1.</text>
<text x="65" y="1211" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="bold" fill="#00796b">C_a = (1−P)π(a)V;  C_a*C_a = σ(a*a) − σ(a*)σ(a) ∈ K(H).</text>
<text x="65" y="1276" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">Hence C_a is compact. Minimal dilation inner products give the full onto cycle unitary.</text>
<text x="65" y="1340" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#243d54">Lift changes and cycle homotopies are built over C(I); adding split extensions is degenerate.</text>
<text x="40" y="1451" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="#243d54">Ext_h⁻¹(A,K) ≅ KK¹(A,ℂ);  Ext_h⁻¹(SA,K) ≅ KK⁰(A,ℂ) by both proved suspension products.</text>
<text x="40" y="1515" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#243d54">The extension convention retains every class and torsion, with the ordered positive right C₁.</text>
<text x="40" y="1578" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#243d54">Proof: Theorem 6.2, part E; Exercises 68–79. Original figure and independently supplied argument.</text>
<text x="40" y="1640" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">The full source convention, graph-normal class equality and integral compact tests are proved in Theorem 6.2.</text>
<text x="40" y="1697" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#243d54">Source context: Connes (1982), native page 35, §11 Remark. Semisplit stable homotopies are specified explicitly.</text>
</svg>