<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#285a83"/></marker></defs>
<rect width="1600" height="1220" fill="#f8fafc"/>
<text x="55" y="63" font-family="Arial, DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#20374b">From odd leaf dimension to the full symbol formula</text>
<text x="55" y="106" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">Joint frequency control, a circle kernel, and the oriented character sign</text>
<rect x="55" y="140" width="710" height="510" rx="14" fill="#ffffff" stroke="#cad6e2" stroke-width="2"/>
<rect x="795" y="140" width="750" height="510" rx="14" fill="#eaf2fa" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="182" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">A cotangent section: r = |ξ| ≥ 0</text>
<text x="82" y="220" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#20374b">Same scale for r and η; the origin is excluded.</text>
<polygon points="160.000,420.000 218.207,266.000 600.000,266.000 600.000,574.000 218.207,574.000" fill="#e7edf4"/>
<polygon points="160.000,420.000 248.912,266.000 600.000,266.000 600.000,574.000 248.912,574.000" fill="#dcf0e4"/>
<path d="M160 420 L218.20652884342098 266" fill="none" stroke="#9eafbf" stroke-width="2"/>
<path d="M160 420 L218.20652884342098 574" fill="none" stroke="#9eafbf" stroke-width="2"/>
<path d="M160 420 L248.91194145520237 266" fill="none" stroke="#438e65" stroke-width="2"/>
<path d="M160 420 L248.91194145520237 574" fill="none" stroke="#438e65" stroke-width="2"/>
<path d="M160 586 L160 254" fill="none" stroke="#285a83" stroke-width="3" marker-end="url(#a)"/>
<path d="M140 420 L630 420" fill="none" stroke="#285a83" stroke-width="3" marker-end="url(#a)"/>
<text x="117" y="246" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">η</text>
<text x="636" y="430" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">r</text>
<circle cx="160" cy="420" r="6" fill="#ffffff" stroke="#285a83" stroke-width="2"/>
<text x="260" y="352" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#306445">χ = 1: |η| ≤ √3 r</text>
<text x="284" y="543" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#20374b">support: |η| &lt; √7 r</text>
<text x="82" y="611" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#20374b">Example δ = 1/8; χ(z) = 0 for z ≤ δ.</text>
<text x="823" y="183" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">Each factor vanishes at its own axis</text>
<text x="823" y="231" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#20374b">H = H₁ ⊗ 1 + 1 ⊗ H₂;   Z = H₁H⁻¹</text>
<text x="823" y="278" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#20374b">σ(Z) = r² / (r² + η²)</text>
<text x="823" y="327" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#20374b">T = (B₁ ⊗ 1) √Z + (Γ₁ ⊗ B₂) √(1 − Z)</text>
<text x="823" y="378" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">First weight: r / √(r² + η²); zero at r = 0.</text>
<text x="823" y="425" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Circle weight: |η| / √(r² + η²); zero at η = 0.</text>
<text x="823" y="477" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#20374b">Cone cutoff → joint calculus → norm limit</text>
<text x="823" y="529" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#20374b">‖B₁(1 − χδ(Z))√Z‖ ≤ ‖B₁‖√(2δ)</text>
<text x="823" y="579" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Anticommuting symbol summands give s² = 1.</text>
<text x="823" y="620" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">The continuous joint symbol remains invertible.</text>
<rect x="55" y="680" width="710" height="212" rx="14" fill="#e9f5ed" stroke="#cad6e2" stroke-width="2"/>
<rect x="795" y="680" width="750" height="212" rx="14" fill="#f0ecf9" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="724" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">The circle exchanges the kernel parity</text>
<text x="82" y="771" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">ker Q = 0;   ker Q* = C·1, in the odd line.</text>
<text x="82" y="816" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">ker A⁺ = ker P* ⊗ C·1; ker A⁻ = ker P ⊗ C·1.</text>
<text x="82" y="862" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#20374b">Ind_product(α ⊠ κ) = −Ind_Λ(α)</text>
<text x="823" y="724" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">The character has positive circle winding</text>
<text x="823" y="771" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#20374b">ch κ = χ′(η) dt ∧ dη / (2π);  π_!ch κ = dt / (2π).</text>
<text x="823" y="816" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#20374b">Move dt past p vertical ξ-differentials:</text>
<text x="823" y="862" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#20374b">π_!ch(α ⊠ κ) = (−1)^p π_!ch(α) ∧ dt / (2π)</text>
<rect x="55" y="925" width="1490" height="165" rx="14" fill="#eaf2fa" stroke="#cad6e2" stroke-width="2"/>
<text x="82" y="968" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#20374b">For odd p, the product has even rank p + 1. Apply its proved formula:</text>
<text x="82" y="1017" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#20374b">−Ind_Λ(α) = ε_(p+1)(−1)^p C_Λ(π_!ch(α) Td(F ⊗ C)),</text>
<text x="82" y="1062" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#20374b">where ε_r = (−1)^[r(r+1)/2] and ε_(p+1)(−1)^p = −ε_p. Divide by −1.</text>
<text x="55" y="1135" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#20374b">Full proofs: Lemma 6.35, Proposition 6.36 and Theorem 6.37. Two-circle numerical sign check: Exercise 20.</text>
<text x="55" y="1174" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#20374b">Measured trace normalization: τ_product = τ_Λ ⊗ Tr; the circle constant projection has diagonal 1/(2π).</text>
<text x="55" y="1205" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#20374b">Human background: Connes, measured index formula; Blackadar, relative K-theory and Bott. Original schematic • CC0.</text>
</svg>
