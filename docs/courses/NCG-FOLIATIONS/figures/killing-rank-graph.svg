<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2563eb"/></marker></defs><rect width="760" height="1000" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="30" y="38" font-size="24" fill="#172554" text-anchor="start">Curved incomplete geometry and its graph class</text><text x="30" y="65" font-size="16" fill="#475569" text-anchor="start">Theorem 11BP.1 · NK.3–NK.16 · Exercises 300–302</text><rect x="26" y="88" width="708" height="214" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="119" font-size="19" fill="#172554" text-anchor="start">A. Actual compact words, uniform radius, polynomial count</text><text x="45" y="155" font-size="16" fill="#172554" text-anchor="start">Fixed compact arrow test C → one radius ε at every word endpoint.</text><text x="45" y="188" font-size="16" fill="#172554" text-anchor="start">Compact normal frames → buffered central plaques → finite states.</text><text x="45" y="224" font-size="22" fill="#1d4ed8" text-anchor="start">B_n = M(2n+2)^E       ||fⁿ||I ≤ √B_n ||f||rⁿ</text><text x="45" y="258" font-size="16" fill="#172554" text-anchor="start">Nth roots: the entire neutral full norm equals the reduced norm.</text><text x="45" y="283" font-size="15" fill="#172554" text-anchor="start">Distinct original arrows and isotropy remain distinct frame endpoints.</text><rect x="26" y="321" width="708" height="363" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="353" font-size="19" fill="#172554" text-anchor="start">B. A curved, incomplete periodic coordinate strip</text><text x="45" y="386" font-size="18" fill="#172554" text-anchor="start">g = dt² + exp(2t²) dθ²    K = −2−4t²    shift θ by 2π/√2</text><line x1="160" y1="594" x2="570" y2="594" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5"/><line x1="160" y1="434" x2="570" y2="434" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5"/><line x1="160" y1="594" x2="160" y2="434" stroke="#94a3b8" stroke-width="2"/><line x1="570" y1="594" x2="570" y2="434" stroke="#94a3b8" stroke-width="2"/><text x="90" y="439" font-size="15" fill="#172554" text-anchor="start">t = 1</text><text x="90" y="599" font-size="15" fill="#172554" text-anchor="start">t = 0</text><line x1="160" y1="474.0" x2="570" y2="474.0" stroke="#cbd5e1" stroke-width="2"/><line x1="192.8" y1="474.0" x2="482.71378028648445" y2="474.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="479.0" font-size="14" fill="#172554" text-anchor="start">t = 3/4</text><text x="589" y="479.0" font-size="16" fill="#172554" text-anchor="start">K = -17/4</text><line x1="160" y1="514.0" x2="570" y2="514.0" stroke="#cbd5e1" stroke-width="2"/><line x1="192.8" y1="514.0" x2="482.71378028648445" y2="514.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="519.0" font-size="14" fill="#172554" text-anchor="start">t = 1/2</text><text x="589" y="519.0" font-size="16" fill="#172554" text-anchor="start">K = -3</text><line x1="160" y1="554.0" x2="570" y2="554.0" stroke="#cbd5e1" stroke-width="2"/><line x1="192.8" y1="554.0" x2="482.71378028648445" y2="554.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="559.0" font-size="14" fill="#172554" text-anchor="start">t = 1/4</text><text x="589" y="559.0" font-size="16" fill="#172554" text-anchor="start">K = -9/4</text><text x="160" y="621" font-size="15" fill="#172554" text-anchor="middle">0</text><text x="570" y="621" font-size="15" fill="#172554" text-anchor="middle">1</text><text x="365" y="621" font-size="15" fill="#172554" text-anchor="middle">θ / (2π); angular edges identified</text><text x="45" y="650" font-size="16" fill="#172554" text-anchor="start">Both red t-ends are omitted and have finite radial distance.</text><text x="45" y="674" font-size="17" fill="#1d4ed8" text-anchor="start">Killing rank j = 1 (∂θ); original normal degree q = 2.</text><rect x="26" y="704" width="708" height="243" rx="12" fill="white" stroke="#cbd5e1"/><text x="45" y="737" font-size="18" fill="#172554" text-anchor="start">C. The labels supply the actual reduced graph construction</text><text x="45" y="778" font-size="18" fill="#172554" text-anchor="start">(M_g, i−l) → discrete diagonal → actual Čech multiplication</text><text x="45" y="815" font-size="21" fill="#1d4ed8" text-anchor="start">Joint q-normal Dirac → full graph P(1 ⊗ F_A₀)P</text><text x="45" y="851" font-size="16" fill="#172554" text-anchor="start">Finite orthogonal rank blocks retain all scalar compact defects.</text><text x="45" y="887" font-size="18" fill="#172554" text-anchor="start">Original disk: b_U = b_V[j_VU]; original Bott pairing +1.</text><text x="45" y="922" font-size="15" fill="#172554" text-anchor="start">The full inverse Spin-c line and final right Cl_q remain unchanged.</text><text x="30" y="978" font-size="13" fill="#475569" text-anchor="start">Exact coordinates and type schematic; strip is not a Euclidean metric embedding. CC0.</text></g></svg>