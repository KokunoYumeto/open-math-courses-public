<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430">
<rect width="1600" height="1430" fill="#f4f7fb"/>
<text x="55" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="bold" fill="#20334d">The real KK Thom inverse: the Fourier signs determine it</text>
<text x="55" y="111" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Separable A; pointwise continuous real action α; C = A ⋊α ℝ; h(z) = z / √(1+z²).</text>
<rect x="50" y="150" width="730" height="280" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="815" y="150" width="735" height="280" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Positive cotangent class</text>
<text x="80" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">U<tspan baseline-shift="sub" font-size="70%">s</tspan> = exp(−isp);  s(p) = p / √(1+p²).</text>
<text x="80" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">exp(πi(s(p)+1)) ≃ u₊(p) = (p−ia)/(p+ia).</text>
<text x="80" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">a &gt; 0; winding(u₊) = +1.</text>
<text x="80" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">Ordered Clifford reduction: e₁ ↦ σₓ, e₂ ↦ σᵧ.</text>
<text x="845" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">The scalar dual product has index −1</text>
<text x="845" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">D<tspan baseline-shift="sub" font-size="70%">p</tspan> = −i∂<tspan baseline-shift="sub" font-size="70%">p</tspan>;  P = 1<tspan baseline-shift="sub" font-size="70%">Dₚ ≥ 0</tspan>.</text>
<text x="845" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="normal" fill="#20334d">ℱ<tspan baseline-shift="sub" font-size="70%">p</tspan>g(η) = (2π)⁻¹/² ∫ exp(−iηp)g(p) dp.</text>
<text x="845" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">P becomes 1<tspan baseline-shift="sub" font-size="70%">η ≥ 0</tspan>;  Pu₊P becomes S<tspan baseline-shift="sub" font-size="70%">a</tspan>.</text>
<text x="845" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">ℱ<tspan baseline-shift="sub" font-size="70%">p</tspan> ℱ<tspan baseline-shift="sub" font-size="70%">t</tspan> ξ(η) = ξ(−η); hence η = −t.</text>
<rect x="50" y="460" width="1500" height="230" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">Exact half-line operator and its one-dimensional cokernel</text>
<text x="80" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">(S<tspan baseline-shift="sub" font-size="70%">a</tspan>f)(η) = f(η) − 2a ∫₀<tspan baseline-shift="super" font-size="70%">η</tspan> exp(−a(η−r))f(r) dr,   η ≥ 0.</text>
<text x="80" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">S<tspan baseline-shift="sub" font-size="70%">a</tspan>*S<tspan baseline-shift="sub" font-size="70%">a</tspan> = 1;   S<tspan baseline-shift="sub" font-size="70%">a</tspan>S<tspan baseline-shift="sub" font-size="70%">a</tspan>* = 1−E<tspan baseline-shift="sub" font-size="70%">a</tspan>;   E<tspan baseline-shift="sub" font-size="70%">a</tspan>(η,r) = 2a exp(−a(η+r)).</text>
<text x="80" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">E<tspan baseline-shift="sub" font-size="70%">a</tspan> is rank one: ∫₀<tspan baseline-shift="super" font-size="70%">∞</tspan> 2a exp(−2aη) dη = 1.  Thus Index(S<tspan baseline-shift="sub" font-size="70%">a</tspan>) = −1.</text>
<rect x="50" y="720" width="730" height="280" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="815" y="720" width="735" height="280" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">Physical regular module L²(ℝ<tspan baseline-shift="sub" font-size="70%">t</tspan>) ⊗ A</text>
<text x="80" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">π(a)ξ(t) = α<tspan baseline-shift="sub" font-size="70%">−t</tspan>(a)ξ(t);  U<tspan baseline-shift="sub" font-size="70%">s</tspan>ξ(t)=ξ(t−s).</text>
<text x="80" y="867" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Dual phase: V<tspan baseline-shift="sub" font-size="70%">q</tspan>ξ(t) = exp(iqt)ξ(t).</text>
<text x="80" y="918" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">V<tspan baseline-shift="sub" font-size="70%">q</tspan>=exp(−iqD̂) gives D̂ = −t.</text>
<text x="80" y="968" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">The negative dual cycle has operator h(t).</text>
<text x="845" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">The actual Wiener–Hopf inverse</text>
<text x="845" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">P₊ = 1<tspan baseline-shift="sub" font-size="70%">t ≥ 0</tspan>;  h(t) ≡ 2P₊−1 locally mod 𝒦.</text>
<text x="845" y="867" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">d<tspan baseline-shift="sub" font-size="70%">α</tspan> = −t<tspan baseline-shift="sub" font-size="70%">α̂</tspan> ⊗̂ m<tspan baseline-shift="sub" font-size="70%">A</tspan>;  m<tspan baseline-shift="sub" font-size="70%">A</tspan> is even Takai Morita.</text>
<text x="845" y="918" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">t<tspan baseline-shift="sub" font-size="70%">α</tspan> ⊗̂<tspan baseline-shift="sub" font-size="70%">C</tspan> d<tspan baseline-shift="sub" font-size="70%">α</tspan> = 1<tspan baseline-shift="sub" font-size="70%">A</tspan>;   d<tspan baseline-shift="sub" font-size="70%">α</tspan> ⊗̂<tspan baseline-shift="sub" font-size="70%">A</tspan> t<tspan baseline-shift="sub" font-size="70%">α</tspan> = 1<tspan baseline-shift="sub" font-size="70%">C</tspan>.</text>
<text x="845" y="968" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">Both are identities of KK classes.</text>
<rect x="50" y="1030" width="1500" height="245" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="1076" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">The boundary comparison is checked in both K degrees</text>
<text x="80" y="1130" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">K₁(C) → K₀(A):  the index of P₊π(u)P₊ is the positive index boundary.</text>
<text x="80" y="1185" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">K₀(C) → K₁(A):  [exp(2πi pP₊p)] = [exp(2πi P₊pP₊)] by a relative matrix path.</text>
<text x="80" y="1237" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">p lies over C⁺; subtract its scalar reference p₀. The reference exponentials equal 1.</text>
<text x="55" y="1320" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">Proof: K-theory of the leaf space, Lemmas 0.13, 0.16–0.17; Theorems 0.14, 0.18–0.19; Proposition 0.15.</text>
<text x="55" y="1362" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">Human background: Blackadar, §§18.10,19.3. Original exact algebraic diagram: GPT-6.1 Sol (OpenAI), CC0.</text>
<text x="55" y="1403" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="normal" fill="#20334d">Analytic scope only: geometric wrong-way, full longitudinal index and assembly comparisons are further theorems.</text>
</svg>
