<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300">
<rect width="1600" height="1300" fill="#f4f7fb"/>
<text x="55" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#20334d">The holonomy commutant: isolate plaques, then retain the deck group</text>
<text x="55" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">L is an intrinsic leaf; Γ is its countable holonomy group; Gₓ → L is the holonomy covering.</text>
<rect x="50" y="155" width="1500" height="220" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">A measurable section separates the two Hilbert-space factors</text>
<text x="80" y="255" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="normal" fill="#20334d">Every arrow is σ(y)g:     L²(Gₓ) ≅ L²(L) ⊗ ℓ²(Γ).</text>
<text x="80" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">Deck translation:  R<tspan baseline-shift="sub" font-size="70%">h</tspan> = 1 ⊗ ρ<tspan baseline-shift="sub" font-size="70%">h</tspan>;     ρ<tspan baseline-shift="sub" font-size="70%">h</tspan>δ<tspan baseline-shift="sub" font-size="70%">g</tspan> = δ<tspan baseline-shift="sub" font-size="70%">gh⁻¹</tspan>.</text>
<text x="80" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="normal" fill="#20334d">The density on L lifts identically to every covering sheet.</text>
<rect x="50" y="405" width="730" height="300" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<rect x="815" y="405" width="735" height="300" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Transverse localization</text>
<text x="80" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">0 ≤ bₙ ≤ 1;  bₙ(t₀)=1;  supp(bₙ) ↓ {t₀}.</text>
<text x="80" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">The leaf can return at t ≠ t₀.</text>
<text x="80" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">A common Schur bound gives a weak limit.</text>
<text x="80" y="663" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">The branch kernel belongs to πₓ(A)″.</text>
<text x="845" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="bold" fill="#20334d">The sheet labels determine the branch</text>
<text x="845" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Output k, input l:   σᵢ(y)kl⁻¹σⱼ(z)⁻¹.</text>
<text x="845" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Chosen branch g:   kl⁻¹ = g,  l = g⁻¹k.</text>
<text x="845" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">The localized operator is θ<tspan baseline-shift="sub" font-size="70%">u,v</tspan> ⊗ λ<tspan baseline-shift="sub" font-size="70%">g</tspan>.</text>
<text x="845" y="663" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Left translation:  λ<tspan baseline-shift="sub" font-size="70%">g</tspan>δ<tspan baseline-shift="sub" font-size="70%">h</tspan> = δ<tspan baseline-shift="sub" font-size="70%">gh</tspan>.</text>
<rect x="50" y="735" width="1500" height="230" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">From localized kernels to the full commutant</text>
<text x="80" y="833" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Plaque projections and a Borel partition give every rank-one θ<tspan baseline-shift="sub" font-size="70%">u,v</tspan> ⊗ λ<tspan baseline-shift="sub" font-size="70%">g</tspan> in πₓ(A)″.</text>
<text x="80" y="885" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="normal" fill="#20334d">Commuting with θ<tspan baseline-shift="sub" font-size="70%">u,v</tspan> ⊗ 1 forces T = 1 ⊗ T₀; then T₀ commutes with every λ<tspan baseline-shift="sub" font-size="70%">g</tspan>.</text>
<text x="80" y="937" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="normal" fill="#20334d">The coordinate convolution calculation proves λ(Γ)′ = ρ(Γ)″.</text>
<rect x="50" y="995" width="1500" height="225" rx="15" fill="white" stroke="#c7d4e3" stroke-width="2"/>
<text x="80" y="1041" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="bold" fill="#20334d">Exact conclusion, including recurrent and nonclosed leaves</text>
<text x="80" y="1095" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="normal" fill="#20334d">πₓ(A)′ = {Rₕ : h ∈ Γ}″.    The representation is irreducible exactly when Γ = {e}.</text>
<text x="80" y="1150" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Weak closure is used; norm membership of arbitrary leaf-supported rank-one maps is not asserted.</text>
<text x="55" y="1270" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="normal" fill="#20334d">Theorem 5.2 and Exercise 6.  Algebraic proof schematic; no geometry or scale is represented.</text>
</svg>
