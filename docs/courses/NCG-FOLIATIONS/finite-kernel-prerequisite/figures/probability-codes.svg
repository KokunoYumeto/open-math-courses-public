<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660">
<rect width="1500" height="660" fill="white"/>
<title>Consistent binary cylinder masses and the Borel support condition</title>
<desc>Root mass1 splits into two masses1/2 and then four masses1/4. Fair Bernoulli probability gives the dense countable eventually-zero subset mass0, while codes of probabilities on that subset require mass1.</desc>
<text x="52" y="61" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="36" fill="#1f2937">Borel probabilities: consistency and support</text>
<text x="52" y="116" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">K.P1: a parent equals its two children</text>
<line x1="742" y1="92" x2="742" y2="570" stroke="#d8dde5" stroke-width="2"/>
<line x1="350" y1="194" x2="210" y2="274" stroke="#526783" stroke-width="3"/>
<line x1="400" y1="194" x2="540" y2="274" stroke="#526783" stroke-width="3"/>
<line x1="185" y1="329" x2="115" y2="414" stroke="#526783" stroke-width="3"/>
<line x1="235" y1="329" x2="290" y2="414" stroke="#526783" stroke-width="3"/>
<line x1="515" y1="329" x2="460" y2="414" stroke="#526783" stroke-width="3"/>
<line x1="565" y1="329" x2="635" y2="414" stroke="#526783" stroke-width="3"/>
<circle cx="375" cy="170" r="32" fill="#e5efff" stroke="#345785" stroke-width="3"/>
<text x="375" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">1</text>
<text x="375" y="233" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#1f2937">C</text>
<circle cx="210" cy="305" r="32" fill="#e5efff" stroke="#345785" stroke-width="3"/>
<text x="210" y="313" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">1/2</text>
<text x="210" y="368" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#1f2937">[0]</text>
<circle cx="540" cy="305" r="32" fill="#e5efff" stroke="#345785" stroke-width="3"/>
<text x="540" y="313" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">1/2</text>
<text x="540" y="368" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#1f2937">[1]</text>
<circle cx="115" cy="445" r="32" fill="#e5efff" stroke="#345785" stroke-width="3"/>
<text x="115" y="453" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">1/4</text>
<text x="115" y="508" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#1f2937">[00]</text>
<circle cx="290" cy="445" r="32" fill="#e5efff" stroke="#345785" stroke-width="3"/>
<text x="290" y="453" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">1/4</text>
<text x="290" y="508" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#1f2937">[01]</text>
<circle cx="460" cy="445" r="32" fill="#e5efff" stroke="#345785" stroke-width="3"/>
<text x="460" y="453" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">1/4</text>
<text x="460" y="508" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#1f2937">[10]</text>
<circle cx="635" cy="445" r="32" fill="#e5efff" stroke="#345785" stroke-width="3"/>
<text x="635" y="453" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">1/4</text>
<text x="635" y="508" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#1f2937">[11]</text>
<text x="375" y="576" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1f2937">1 = 1/2 + 1/2;   1/2 = 1/4 + 1/4</text>
<text x="792" y="122" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">K.P4: probabilities on a Borel subset X</text>
<text x="812" y="195" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#345785">Code condition: mass(X) = 1</text>
<text x="812" y="281" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#1f2937">X0 = eventually-zero sequences</text>
<text x="812" y="336" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#1f2937">X0 is countable and Borel.</text>
<text x="812" y="382" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1f2937">Append zeros: X0 meets every cylinder.</text>
<text x="812" y="448" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#923131">Fair Bernoulli mass(X0) = 0</text>
<text x="812" y="510" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1f2937">Finite-level consistency does not imply</text>
<text x="812" y="544" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1f2937">concentration on X0.</text>
<text x="52" y="634" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1f2937">Exact cylinder masses; existence, uniqueness and Borel evaluation: Theorem K.4A.</text>
</svg>
