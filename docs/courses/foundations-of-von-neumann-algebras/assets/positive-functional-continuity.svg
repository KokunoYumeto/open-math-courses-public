<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" role="img" aria-labelledby="title desc">
  <title id="title">Descent of a bounded functional through the sum map</title>
  <desc id="desc">S maps X direct-sum X onto the underlying real Banach space A. T maps the same domain to the complex numbers. Because the kernel of S is contained in the kernel of T, T equals L composed with S. The open mapping estimate bounds L. Complex linearity of L is checked separately in Theorem 4.4b.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#29485e"/></marker></defs>
  <rect width="420" height="350" rx="14" fill="#f5f8fa"/>
  <g font-family="Georgia, serif" font-size="23" text-anchor="middle" fill="#172c3b">
    <text x="210" y="44">X ⊕₁ X</text>
    <text x="85" y="245">A<tspan font-size="14" dy="5">ℝ</tspan></text>
    <text x="337" y="245">ℂ</text>
  </g>
  <g stroke="#29485e" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M 176 63 L 89 211"/>
    <path d="M 244 63 L 334 211"/>
    <path d="M 119 238 L 303 238"/>
  </g>
  <g font-family="Georgia, serif" font-size="17" text-anchor="middle" fill="#172c3b">
    <text x="65" y="130">S(u,v)</text><text x="65" y="152">= u + iv</text>
    <text x="351" y="115">T(u,v)</text><text x="351" y="139">= Φ(u) + iΦ(v)</text>
    <text x="210" y="223">L</text>
    <text x="210" y="287">ker S ⊆ ker T</text>
    <text x="210" y="314">|L(a)| ≤ C ‖a‖</text>
  </g>
</svg>
