<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Scalar centering before direct-sum assembly</title><desc id="desc">For n from one to four the formal implementer n times the identity plus diag(1,-1) has norm n+1. Subtracting the scalar n leaves norm one. All coordinates give the same derivation of norm two. The infinite uncentered family is not a multiplier.</desc>
<rect width="1040" height="500" fill="#fafbfe"/>
<g font-family="sans-serif" fill="#17233b">
<text x="40" y="40" font-size="24" font-weight="700">Scalar choices must be made before assembly</text>
<text x="40" y="72" font-size="18">A = c₀(ℕ, M₂(ℂ))      d = diag(1, −1)      δ(a)ₙ = i[d, aₙ]</text>
<rect x="40" y="104" width="440" height="310" rx="10" fill="#fff" stroke="#c6cddd"/>
<rect x="560" y="104" width="440" height="310" rx="10" fill="#fff" stroke="#c6cddd"/>
<text x="60" y="135" font-size="19" font-weight="700">Formal choices hₙ = n1₂ + d</text>
<text x="580" y="135" font-size="19" font-weight="700">Centered choices kₙ = d</text>
<g stroke="#516078" fill="none" stroke-width="1.5"><path d="M90 165V350H440"/><path d="M610 165V350H960"/></g>
<g font-size="14" text-anchor="end"><text x="80" y="355">0</text><text x="80" y="320">1</text><text x="80" y="285">2</text><text x="80" y="250">3</text><text x="80" y="215">4</text><text x="80" y="180">5</text><text x="600" y="355">0</text><text x="600" y="320">1</text><text x="600" y="285">2</text><text x="600" y="250">3</text><text x="600" y="215">4</text><text x="600" y="180">5</text></g>
<g fill="#bd5839"><rect x="124" y="280" width="42" height="70"/><rect x="204" y="245" width="42" height="105"/><rect x="284" y="210" width="42" height="140"/><rect x="364" y="175" width="42" height="175"/></g>
<g fill="#237b74"><rect x="644" y="315" width="42" height="35"/><rect x="724" y="315" width="42" height="35"/><rect x="804" y="315" width="42" height="35"/><rect x="884" y="315" width="42" height="35"/></g>
<g font-size="16" text-anchor="middle"><text x="145" y="373">1</text><text x="225" y="373">2</text><text x="305" y="373">3</text><text x="385" y="373">4</text><text x="665" y="373">1</text><text x="745" y="373">2</text><text x="825" y="373">3</text><text x="905" y="373">4</text></g>
<text x="420" y="397" font-size="16">n</text><text x="940" y="397" font-size="16">n</text>
<text x="100" y="165" font-size="15">‖hₙ‖</text><text x="620" y="165" font-size="15">‖kₙ‖</text>
<path d="M490 250H548M537 243L549 250L537 257" fill="none" stroke="#17233b" stroke-width="2"/>
<text x="520" y="225" font-size="15" text-anchor="middle">−n1₂</text>
<text x="60" y="447" font-size="18" fill="#97442c">supₙ ‖hₙ‖ = ∞: no multiplier family</text>
<text x="580" y="447" font-size="18" fill="#17665f">supₙ ‖kₙ‖ = 1: a multiplier of A</text>
<text x="40" y="480" font-size="17">The scalar offsets have zero commutator.  ‖δ‖ = 2, witnessed by one coordinate E₁₂.</text>
</g></svg>

