<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="500" viewBox="0 0 1020 500" role="img" aria-labelledby="title desc">
<title id="title">Four scalar summands in a faithful degenerate regular model</title>
<desc id="desc">For M=C and the trivial action of the two-element group, rho(z)=diag(z,0). The regular Hilbert space has four dimensions. In the ordered eigenbasis, the coefficient support P has values 1,1,0,0 and lambda_g has values 1,-1,1,-1. The four nonzero rank-one projections E_1,+, E_1,-, E_0,+, E_0,- split the generated algebra as C to the fourth power. Its supported part is C squared. Exact proof RS19-RS22.</desc>
<rect width="1020" height="500" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#182635">
<text x="28" y="34" font-size="22" font-weight="bold">Coefficient support separates two group-algebra blocks</text>
<text x="28" y="62" font-size="16">M = C, G = {e,g}, g² = e, trivial action; ρ(z) = diag(z,0).</text>
<text x="342" y="104" text-anchor="middle" font-size="18">λ_g eigenvalue +1</text>
<text x="664" y="104" text-anchor="middle" font-size="18">λ_g eigenvalue −1</text>
<rect x="205" y="120" width="274" height="112" rx="9" fill="#e8f3fa" stroke="#25658d" stroke-width="2"/>
<rect x="527" y="120" width="274" height="112" rx="9" fill="#e8f3fa" stroke="#25658d" stroke-width="2"/>
<rect x="205" y="266" width="274" height="112" rx="9" fill="#fff0e6" stroke="#ae521b" stroke-width="2"/>
<rect x="527" y="266" width="274" height="112" rx="9" fill="#fff0e6" stroke="#ae521b" stroke-width="2"/>
<text x="28" y="157" font-size="18" font-weight="bold">P = 1</text>
<text x="28" y="183" font-size="15">Coefficient support</text>
<text x="28" y="302" font-size="18" font-weight="bold">P = 0</text>
<text x="28" y="328" font-size="15">Zero coefficients</text>
<text x="342" y="153" text-anchor="middle" font-size="19">E₁,₊ = P(1 + λ_g)/2</text>
<text x="664" y="153" text-anchor="middle" font-size="19">E₁,₋ = P(1 − λ_g)/2</text>
<text x="342" y="185" text-anchor="middle" font-size="16">eigenvector (1,1,0,0)/√2</text>
<text x="664" y="185" text-anchor="middle" font-size="16">eigenvector (1,−1,0,0)/√2</text>
<text x="342" y="213" text-anchor="middle" font-size="17">scalar value a + b</text>
<text x="664" y="213" text-anchor="middle" font-size="17">scalar value a − b</text>
<text x="342" y="298" text-anchor="middle" font-size="19">E₀,₊ = (1−P)(1 + λ_g)/2</text>
<text x="664" y="298" text-anchor="middle" font-size="19">E₀,₋ = (1−P)(1 − λ_g)/2</text>
<text x="342" y="330" text-anchor="middle" font-size="16">eigenvector (0,0,1,1)/√2</text>
<text x="664" y="330" text-anchor="middle" font-size="16">eigenvector (0,0,1,−1)/√2</text>
<text x="342" y="359" text-anchor="middle" font-size="17">scalar value c + d</text>
<text x="664" y="359" text-anchor="middle" font-size="17">scalar value c − d</text>
<text x="838" y="169" font-size="18" fill="#25658d">usual regular</text>
<text x="838" y="195" font-size="18" fill="#25658d">algebra C²</text>
<text x="838" y="313" font-size="18" fill="#ae521b">additional</text>
<text x="838" y="339" font-size="18" fill="#ae521b">group algebra C²</text>
<text x="28" y="424" font-size="18">Every cell has rank one. The four projections are orthogonal and sum to the identity.</text>
<text x="28" y="454" font-size="18">Entire generated algebra: C⁴. Compression by P: C². Proof: RS19–RS22.</text>
<text x="28" y="483" font-size="14">Basis before diagonalization: (δ_e⊗e₁, δ_g⊗e₁, δ_e⊗e₂, δ_g⊗e₂).</text>
</g></svg>
