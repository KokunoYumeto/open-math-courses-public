<text x="28" y="32" font-size="21" font-weight="bold">A small rotation survives unbounded amplification</text>
<text x="28" y="58" font-size="15">Aut(M) in u-topology × M in sigma-strong*: the bound in AT9 matters.</text>
<text x="28" y="90" font-size="17" font-weight="bold">Rotation plane, n = 4</text>
<text x="500" y="90" font-size="17" font-weight="bold">Exact values at integer n</text>
