<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Small rotations acting on an unbounded convergent net</title>
<desc id="desc">ATU11–ATU15. Left: unit vectors drawn at scale 130, with rotation angle 1/4 radian. Right: integer samples n=1,...,20 of 2 sin(1/(2n)) and n squared sin squared(1/n), with line segments between samples. The finite-set and positive-functional indices ensure sigma-strong-star convergence of the positive inputs despite norm n squared.</desc>
