<text x="28" y="318" font-size="15">Uη = (−sin(1/4), cos(1/4))</text>
<text x="28" y="343" font-size="15">x = n² |η⟩⟨η|,   α = Ad U</text>
<text x="28" y="369" font-size="15">ω₀(α(x)) = n² sin²(1/n) → 1</text>
