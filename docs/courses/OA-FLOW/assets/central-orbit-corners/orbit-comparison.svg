<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">From a central orbit to a full-size corner</title>
<desc id="desc">Three displayed terms represent a countable partition f n of the identity. The partial isometry a n sends f n into e, and v n sends that range into an orthogonal copy inside e. The sum w has initial projection one and final projection at most e. The displayed formula V turns it into equivalence with e.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#276079"/></marker></defs>
<rect width="1080" height="620" fill="#fbfcfe"/>
<g font-family="Arial, sans-serif" fill="#142d40">
<text x="44" y="48" font-size="27" font-weight="bold">A central orbit determines the full corner</text>
<text x="44" y="80" font-size="18">M is the type III crossed product N by θ.   0 ≠ e ∈ Z(N); no sigma-finiteness assumption.</text>
<text x="44" y="122" font-size="21" font-weight="bold">Disjoint central partition of 1</text>
<text x="638" y="122" font-size="21" font-weight="bold">Orthogonal ranges inside e</text>
<rect x="44" y="143" width="355" height="238" rx="12" fill="#e8f3f8" stroke="#276079" stroke-width="2"/>
<rect x="625" y="143" width="405" height="238" rx="12" fill="#edf5ed" stroke="#35654c" stroke-width="2"/>
<text x="66" y="170" font-size="17">fₙ ≤ θ(qₙ)(e),   ∑ fₙ = 1 strongly</text>
<text x="647" y="170" font-size="17">wₙwₙ* ≤ vₙvₙ* ≤ e</text>
<g fill="#c2dfed" stroke="#276079">
<rect x="68" y="188" width="100" height="48" rx="6"/><rect x="68" y="247" width="100" height="48" rx="6"/><rect x="68" y="306" width="100" height="48" rx="6"/>
</g>
<g fill="#c9e4cd" stroke="#35654c">
<rect x="818" y="188" width="185" height="48" rx="6"/><rect x="818" y="247" width="185" height="48" rx="6"/><rect x="818" y="306" width="185" height="48" rx="6"/>
</g>
<g font-size="22" text-anchor="middle">
<text x="118" y="220">f₀</text><text x="118" y="279">f₁</text><text x="118" y="338">f₂</text>
<text x="911" y="220">w₀w₀*</text><text x="911" y="279">w₁w₁*</text><text x="911" y="338">w₂w₂*</text>
</g>
<g fill="none" stroke="#276079" stroke-width="2.4" >
<path d="M181 212 H803"/><path d="M181 271 H803"/><path d="M181 330 H803"/>
</g>
<g fill="#276079"><path d="M803 212 L792 206 L792 218 Z"/><path d="M803 271 L792 265 L792 277 Z"/><path d="M803 330 L792 324 L792 336 Z"/></g>
<g font-size="18">
<rect x="406" y="192" width="211" height="32" fill="#fbfcfe"/><text x="420" y="214">w₀ = v₀u(q₀)*f₀</text>
<rect x="406" y="251" width="211" height="32" fill="#fbfcfe"/><text x="420" y="273">w₁ = v₁u(q₁)*f₁</text>
<rect x="406" y="310" width="211" height="32" fill="#fbfcfe"/><text x="420" y="332">w₂ = v₂u(q₂)*f₂</text>
</g>
<text x="185" y="363" font-size="25">⋮</text><text x="770" y="363" font-size="25">⋮</text>
<text x="44" y="416" font-size="20">Countable strong-star sum:  w = ∑ wₙ,    w*w = 1,    ww* ≤ e.</text>
<rect x="44" y="438" width="986" height="119" rx="12" fill="#fff4d9" stroke="#ad842e"/>
<text x="65" y="468" font-size="19">d = 1 − e,    A = ∑ₖ≥₀ wᵏd(w*)ᵏ,    wAw* = A − d.</text>
<text x="65" y="501" font-size="23" font-weight="bold">V = wA + (1 − A)     ⇒     V*V = 1,   VV* = e.</text>
<text x="65" y="533" font-size="20">M ≅ eMe by x ↦ VxV*, with normal inverse y ↦ V*yV.</text>
<text x="44" y="590" font-size="16">Schematic: three of countably many terms. Exact proof: CDEC.9.a–g and CDEC.10.a–g. Original SVG: CC0.</text>
</g></svg>
