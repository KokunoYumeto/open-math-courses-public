<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="title desc">
<title id="title">Amenable normal-subgroup regular product: actual sites, compatible primitive, and finite-pattern exhaustion</title>
<desc id="desc">Three proof panels for equations A10, A13, A28 to A34, and A38 to A41. Site pairs are independent coordinates for n not equal to e outside finite flip support. The compatible cocycle primitive uses multiplication by b. Four sheets illustrate an exact matrix-unit inclusion; general finite patterns give increasing unital finite-dimensional algebras.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#425569"/></marker></defs>
<rect width="1440" height="1090" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#172b43">
<text x="40" y="48" font-size="32" fill="#172b43" font-weight="bold" text-anchor="start">The actual regular product is AFD when N is amenable</text>
<text x="40" y="82" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">Countable G arbitrary  •  I = G × ℕ  •  every compatible (λ, μ)  •  proof locators below</text>
<rect x="28" y="105" width="1384" height="279" rx="12" fill="#eef5fc" stroke="#c7d2e0" stroke-width="2"/>
<text x="52" y="144" font-size="27" fill="#172b43" font-weight="bold" text-anchor="start">1  Diagonal + finite-support flips; a free amenable action</text>
<text x="52" y="183" font-size="25" fill="#172b43" font-weight="normal" text-anchor="start">X = {0,1}ᴵ with fair p;  F = ⊕ᴵ ℤ/2;  Γ = F ⋊ N</text>
<text x="52" y="217" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">(f,n) · x = f + n · x;  (f,n)(k,m) = (f + n·k, nm)</text>
<text x="52" y="254" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">u₍f,n₎ = s_f L_n;   μ̃((f,n),(k,m)) = μ(n,m)</text>
<text x="52" y="290" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">Trace: τμ(d u₍f,n₎) = 1₍f=0,n=e₎ ∫ d dp</text>
<text x="52" y="338" font-size="22" fill="#172b43" font-weight="normal" text-anchor="start">Amenable Γ ⇒ R = ⋃ Hₖ on one invariant conull E.  [A10–A23; §5]</text>
<text x="917" y="177" font-size="21" fill="#172b43" font-weight="bold" text-anchor="start">n ≠ e; j outside flipped levels</text>
<rect x="935" y="201" width="126" height="33" rx="6" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<rect x="1166" y="201" width="196" height="33" rx="6" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="998" y="225" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">(e,j₁)</text>
<text x="1264" y="225" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">(n⁻¹,j₁)</text>
<line x1="1073" y1="218" x2="1153" y2="218" stroke="#425569" stroke-width="2.5"/>
<text x="1112" y="211" font-size="18" fill="#172b43" font-weight="normal" text-anchor="middle">=</text>
<rect x="935" y="244" width="126" height="33" rx="6" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<rect x="1166" y="244" width="196" height="33" rx="6" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="998" y="268" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">(e,j₂)</text>
<text x="1264" y="268" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">(n⁻¹,j₂)</text>
<line x1="1073" y1="261" x2="1153" y2="261" stroke="#425569" stroke-width="2.5"/>
<text x="1112" y="254" font-size="18" fill="#172b43" font-weight="normal" text-anchor="middle">=</text>
<rect x="935" y="287" width="126" height="33" rx="6" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<rect x="1166" y="287" width="196" height="33" rx="6" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="998" y="311" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">(e,j₃)</text>
<text x="1264" y="311" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">(n⁻¹,j₃)</text>
<line x1="1073" y1="304" x2="1153" y2="304" stroke="#425569" stroke-width="2.5"/>
<text x="1112" y="297" font-size="18" fill="#172b43" font-weight="normal" text-anchor="middle">=</text>
<text x="917" y="354" font-size="18" fill="#172b43" font-weight="normal" text-anchor="start">r independent equalities: p ≤ 2⁻ʳ → 0  [A13]</text>
<rect x="28" y="404" width="1384" height="309" rx="12" fill="#f3f0fc" stroke="#c7d2e0" stroke-width="2"/>
<text x="52" y="444" font-size="27" fill="#172b43" font-weight="bold" text-anchor="start">2  Compatible finite-stage primitives remove the scalar twist</text>
<rect x="54" y="474" width="335" height="126" rx="12" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="72" y="507" font-size="24" fill="#172b43" font-weight="bold" text-anchor="start">On Hₖ: δbₖ = ω</text>
<text x="72" y="543" font-size="22" fill="#172b43" font-weight="normal" text-anchor="start">On Hₖ₊₁: δcₖ₊₁ = ω</text>
<text x="72" y="578" font-size="20" fill="#172b43" font-weight="normal" text-anchor="start">cₖ₊₁(y,x) = ω(y,x,rₖ₊₁(x))</text>
<rect x="463" y="474" width="428" height="126" rx="12" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="484" y="507" font-size="23" fill="#172b43" font-weight="bold" text-anchor="start">On Hₖ: dₖ = bₖ / cₖ₊₁</text>
<text x="484" y="542" font-size="22" fill="#172b43" font-weight="normal" text-anchor="start">dₖ(y,x) = aₖ(y) / aₖ(x)</text>
<text x="484" y="578" font-size="22" fill="#172b43" font-weight="normal" text-anchor="start">aₖ(y) = dₖ(y,rₖ(y))</text>
<rect x="965" y="474" width="421" height="126" rx="12" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="985" y="507" font-size="22" fill="#172b43" font-weight="bold" text-anchor="start">bₖ₊₁(y,x) = cₖ₊₁(y,x)</text>
<text x="1050" y="540" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">× aₖ(y) / aₖ(x)</text>
<text x="985" y="578" font-size="22" fill="#172b43" font-weight="normal" text-anchor="start">bₖ₊₁|Hₖ = bₖ  ⇒  b = ⋃ bₖ</text>
<line x1="401" y1="534" x2="448" y2="534" stroke="#425569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="903" y1="534" x2="950" y2="534" stroke="#425569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="55" y="641" font-size="25" fill="#172b43" font-weight="normal" text-anchor="start">ω(z,y,x) = b(z,y)b(y,x)/b(z,x);   (Bξ)(y,x) = b(y,x)ξ(y,x)</text>
<text x="55" y="682" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">B Λω(a) B* = Λ₁(a b);   BUₕωB* = Mᵦₕ Vₕ.  Exact trace preserved.  [A28–A34]</text>
<rect x="28" y="734" width="1384" height="287" rx="12" fill="#eff8f3" stroke="#c7d2e0" stroke-width="2"/>
<text x="52" y="774" font-size="27" fill="#172b43" font-weight="bold" text-anchor="start">3  Finite patterns give nested finite-dimensional algebras</text>
<text x="53" y="814" font-size="21" fill="#172b43" font-weight="normal" text-anchor="start">Exact example: H₁ pairs; H₂ four sheets</text>
<rect x="91" y="836" width="70" height="55" rx="8" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="126" y="872" font-size="25" fill="#172b43" font-weight="bold" text-anchor="middle">0</text>
<rect x="204" y="836" width="70" height="55" rx="8" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="239" y="872" font-size="25" fill="#172b43" font-weight="bold" text-anchor="middle">1</text>
<rect x="317" y="836" width="70" height="55" rx="8" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="352" y="872" font-size="25" fill="#172b43" font-weight="bold" text-anchor="middle">2</text>
<rect x="430" y="836" width="70" height="55" rx="8" fill="white" stroke="#c7d2e0" stroke-width="2"/>
<text x="465" y="872" font-size="25" fill="#172b43" font-weight="bold" text-anchor="middle">3</text>
<line x1="75" y1="907" x2="276" y2="907" stroke="#425569" stroke-width="2.5"/>
<line x1="301" y1="907" x2="502" y2="907" stroke="#425569" stroke-width="2.5"/>
<text x="174" y="934" font-size="20" fill="#172b43" font-weight="normal" text-anchor="middle">{0,1}</text>
<text x="400" y="934" font-size="20" fill="#172b43" font-weight="normal" text-anchor="middle">{2,3}</text>
<text x="72" y="982" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">e₀₁(old) = E₀₁ + E₂₃  inside M₄</text>
<line x1="546" y1="881" x2="605" y2="881" stroke="#425569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="635" y="815" font-size="23" fill="#172b43" font-weight="bold" text-anchor="start">At stage k, class size d ≤ Kₖ:</text>
<text x="635" y="853" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">record finitely many diagonal memberships,</text>
<text x="635" y="887" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">generator targets, and every old matrix-unit map.</text>
<text x="635" y="928" font-size="25" fill="#172b43" font-weight="bold" text-anchor="start">Aₖ = ⊕₍d, finite patterns C₎ M_d;   Aₖ₋₁ ⊂ Aₖ</text>
<text x="635" y="975" font-size="23" fill="#172b43" font-weight="normal" text-anchor="start">Vₕ 1Dₕ,ₖ → Vₕ strongly;   Q = (⋃ Aₖ)″.  [A38–A41]</text>
<text x="40" y="1048" font-size="16" fill="#172b43" font-weight="normal" text-anchor="start">Original proof schematic. Finite example is exact; it does not model every orbit.</text>
<text x="40" y="1068" font-size="16" fill="#172b43" font-weight="normal" text-anchor="start">Human source question: Takesaki III, XVII.3 Exercise 5; relation input: current OA-ERGODIC Corollary 6.2.</text>
<text x="40" y="1086" font-size="16" fill="#172b43" font-weight="normal" text-anchor="start">No classification or general crossed-product AFD theorem is used.</text>
