<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">The reverse implication for the regular multiplier domain</title>
<desc id="desc">Uniform normal orbit estimates bound compact averages in L1. Compact continuous pairings recover the original multiplier. Clipped phase tests then bound every compact integral of its absolute value and hence its full L1 norm.</desc>
<metadata>Original diagram: GPT-6 Astra (OpenAI), Ultra, 17 October 2026. CC0-1.0 to the extent of rights held. Mathematical proof: OA-FLOW-L115, RD7–RD17. This SVG is the editable figure source.</metadata>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#375d76" /></marker>
 <style>text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#173248}.title{font-size:29px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.formula{font-size:21px}.small{font-size:16px}.arrow{stroke:#375d76;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1500" height="620" fill="#f8fbfd" />
<text x="55" y="53" class="title" font-family="Arial" fill="#173248" font-size="29" font-weight="bold">From bounded orbit coefficients to an integrable multiplier</text>
<text x="55" y="86" class="body" font-family="Arial" fill="#173248" font-size="18">G arbitrary LCA;  ρₛ = Ad Rₛ;  x = Mₕ ∈ pρ;  Q = qρ(Mₕ) &lt; ∞</text>
<g>
 <rect x="55" y="120" width="430" height="220" rx="14" fill="#eaf3f9" stroke="#88acc3" />
 <text x="77" y="155" class="heading" font-family="Arial" fill="#173248" font-size="21" font-weight="bold">1. A uniform coefficient bound</text>
 <text x="77" y="191" class="body" font-family="Arial" fill="#173248" font-size="18">kᵤ ≥ 0, compact support in U, ∫kᵤ = 1</text>
 <text x="77" y="225" class="formula" font-family="Arial" fill="#173248" font-size="21">ξᵤ = √kᵤ,   ‖ξᵤ‖₂ = 1</text>
 <text x="77" y="260" class="formula" font-family="Arial" fill="#173248" font-size="21">cᵤ(s) = ∫ kᵤ(r) h(s+r) dr</text>
 <text x="77" y="298" class="formula" font-family="Arial" fill="#173248" font-size="21">‖cᵤ‖₁ ≤ Q  for every U</text>
 <text x="77" y="324" class="small" font-family="Arial" fill="#173248" font-size="16">Normal vector tests — RD7–RD10</text>
</g>
<path d="M493 230 H525" class="arrow" stroke="#375d76" stroke-width="3" fill="none" />
<g>
 <rect x="535" y="120" width="430" height="220" rx="14" fill="#eef5ec" stroke="#8eac86" />
 <text x="557" y="155" class="heading" font-family="Arial" fill="#173248" font-size="21" font-weight="bold">2. Recover each compact test</text>
 <text x="557" y="191" class="body" font-family="Arial" fill="#173248" font-size="18">For every f ∈ Cc(G):</text>
 <text x="557" y="225" class="formula" font-family="Arial" fill="#173248" font-size="21">∫ f cᵤ = ∫ h (kᵤ ∗ f)</text>
 <text x="557" y="260" class="formula" font-family="Arial" fill="#173248" font-size="21">‖kᵤ ∗ f − f‖₁ → 0</text>
 <text x="557" y="298" class="formula" font-family="Arial" fill="#173248" font-size="21">|∫ f h| ≤ Q ‖f‖∞</text>
 <text x="557" y="324" class="small" font-family="Arial" fill="#173248" font-size="16">Haar translation and Fubini — RD11–RD13</text>
</g>
<path d="M973 230 H1005" class="arrow" stroke="#375d76" stroke-width="3" fill="none" />
<g>
 <rect x="1015" y="120" width="430" height="220" rx="14" fill="#fff3e4" stroke="#c7a36c" />
 <text x="1037" y="155" class="heading" font-family="Arial" fill="#173248" font-size="21" font-weight="bold">3. Compact phase tests</text>
 <text x="1037" y="191" class="body" font-family="Arial" fill="#173248" font-size="18">gₖ = 1ₖ h̄/|h|  (0 when h = 0)</text>
 <text x="1037" y="225" class="formula" font-family="Arial" fill="#173248" font-size="21">fₙ ∈ Cc(G),   ‖fₙ‖∞ ≤ 1</text>
 <text x="1037" y="260" class="formula" font-family="Arial" fill="#173248" font-size="21">‖fₙ − gₖ‖₁ → 0</text>
 <text x="1037" y="298" class="formula" font-family="Arial" fill="#173248" font-size="21">∫ₖ |h| ≤ Q  (all compact K)</text>
 <text x="1037" y="324" class="small" font-family="Arial" fill="#173248" font-size="16">Radial clipping — RD14–RD16</text>
</g>
<path d="M1230 349 V384 H750 V410" class="arrow" stroke="#375d76" stroke-width="3" fill="none" />
<rect x="280" y="420" width="940" height="95" rx="14" fill="#173248" />
<text x="750" y="459" text-anchor="middle" font-family="Arial" fill="white" font-size="25">‖h‖₁ = supₖ ∫ₖ |h| ≤ qρ(Mₕ)</text>
<text x="750" y="493" text-anchor="middle" font-family="Arial" fill="white" font-size="19">Compact inner regularity proves the reverse inclusion — RD17</text>
<text x="55" y="565" class="body" font-family="Arial" fill="#173248" font-size="18">Neighborhoods U form a net. The sequence fₙ approximates one compact phase test in L¹.</text>
<text x="55" y="595" class="small" font-family="Arial" fill="#173248" font-size="16">Full domain equality:  Mₕ ∈ pρ  ⇔  h ∈ L¹(G), for h ∈ L∞(G).  Proof: RD3–RD17.</text>
<polygon points="525,230 515,224 515,236" fill="#375d76" /><polygon points="1005,230 995,224 995,236" fill="#375d76" /><polygon points="750,410 744,400 756,400" fill="#375d76" /></svg>
