<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">One and two Weyl copies on the same integer Hilbert space</title>
<desc id="desc">Finite windows of infinite integer bases. The first system has one coordinate for each group label and its averaged dual projection has rank one. The second system interlaces two copies: label n and multiplicity a map to physical coordinate 2n+a. Its averaged dual projection has rank two, the blue column n zero. The orange even-coordinate row is a minimal commutant projection with infinite-dimensional range. All rows continue in both directions.</desc>
<rect width="1200" height="750" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#516880"/></marker></defs>
<text x="38" y="44" font-family="Arial,sans-serif" font-size="27" fill="#172b45" font-weight="700" text-anchor="start">One and two Weyl copies on the same integer Hilbert space</text>
<rect x="28" y="70" width="1144" height="195" rx="12" fill="white" stroke="#dbe4ee" />
<rect x="28" y="280" width="1144" height="345" rx="12" fill="white" stroke="#dbe4ee" />
<text x="48" y="105" font-family="Arial,sans-serif" font-size="23" fill="#172b45" font-weight="700" text-anchor="start">One copy: translation by 1 shifts one physical coordinate</text>
<text x="48" y="315" font-family="Arial,sans-serif" font-size="23" fill="#172b45" font-weight="700" text-anchor="start">Two copies: R(δₙ ⊗ eₐ) = δ₂ₙ₊ₐ</text>
