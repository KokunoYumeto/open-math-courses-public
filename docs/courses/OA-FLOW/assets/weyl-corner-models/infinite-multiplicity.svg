<text x="580" y="202" font-family="Arial,sans-serif" font-size="18" fill="#172b45" font-weight="400" text-anchor="middle">δ0</text>
<text x="580" y="240" font-family="Arial,sans-serif" font-size="20" fill="#172b45" font-weight="400" text-anchor="middle">1</text>
