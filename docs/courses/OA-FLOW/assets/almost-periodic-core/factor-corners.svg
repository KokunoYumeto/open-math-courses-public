<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="500" viewBox="0 0 1060 500" role="img" aria-labelledby="title desc">
<title id="title">Linked Fourier corners and an infinite projection</title>
<desc id="desc">For a factorial state centralizer, every Fourier corner is a factor and a nonzero eigenoperator links each corner to the identity coordinate. Thus a central operator has the same scalar in every corner. A trace-increasing sequence of Fourier projections contains orthogonal equivalent projections. Their unilateral shift omits the first projection and proves infiniteness.</desc>
<rect width="1060" height="500" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#162c40">
<text x="32" y="40" font-size="25" font-weight="bold">From a factorial centralizer to a type II∞ discrete core</text>
<text x="32" y="70" font-size="17">Exact algebraic relations from MIV Section 18; box sizes do not represent trace values.</text>
<rect x="32" y="92" width="996" height="152" rx="12" fill="#fff" stroke="#b2c3d0"/>
<text x="52" y="123" font-size="21" font-weight="bold">Every Fourier corner is linked</text>
<rect x="60" y="144" width="185" height="66" rx="8" fill="#dcecf5"/>
<rect x="551" y="144" width="185" height="66" rx="8" fill="#dcecf5"/>
<text x="152" y="184" font-size="22" text-anchor="middle">corner 1: F</text>
<text x="644" y="184" font-size="22" text-anchor="middle">corner γ: F</text>
<path d="M260 177H534" stroke="#38536d" stroke-width="2.5"/><path d="M524 171L536 177L524 183Z" fill="#38536d"/>
<text x="397" y="161" font-size="17" text-anchor="middle">nonzero (γ, 1) matrix entry</text>
<text x="397" y="204" font-size="17" text-anchor="middle">modular eigenvalue γ⁻¹</text>
<text x="770" y="168" font-size="18">Central scalars agree.</text>
<text x="770" y="198" font-size="21" font-weight="bold">Z(N) = ℂ1</text>
<rect x="32" y="264" width="996" height="202" rx="12" fill="#fff" stroke="#b2c3d0"/>
<text x="52" y="298" font-size="21" font-weight="bold">The trace comparison supplies an actual infinite projection</text>
<text x="52" y="328" font-size="18">Choose a &gt; 1 in Γ. Each qₙ lies in Fourier corner aⁿ and is equivalent to p₁.</text>
<g font-size="23" text-anchor="middle">
<rect x="68" y="351" width="130" height="60" rx="7" fill="#f6e0d2" stroke="#c89d7c"/><text x="133" y="390">q₁</text>
<rect x="314" y="351" width="130" height="60" rx="7" fill="#e4efdf" stroke="#9eb395"/><text x="379" y="390">q₂</text>
<rect x="560" y="351" width="130" height="60" rx="7" fill="#e4efdf" stroke="#9eb395"/><text x="625" y="390">q₃</text>
<text x="857" y="390">⋯</text>
</g>
<path d="M210 381H299M456 381H545M702 381H813" fill="none" stroke="#38536d" stroke-width="2.5"/>
<path d="M289 375L301 381L289 387ZM535 375L547 381L535 387ZM803 375L815 381L803 387Z" fill="#38536d"/>
<text x="52" y="444" font-size="19">q = Σ qₙ,       w*w = q,       ww* = q − q₁ &lt; q.</text>
</g></svg>
