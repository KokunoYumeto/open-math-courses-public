<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>Finite block ratios survive positive corners</title>
<desc>Prefix replacement changes word v to u with the same tail z. Grouping disjoint blocks gives a domain of measure at least c. Restricting to a positive corner removes at most eta times one plus inverse a times the cylinder measure.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#274b70" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="680" fill="#fafcfe"/>
<g font-family="Arial, sans-serif" fill="#172c40">
<text x="44" y="48" font-size="27" font-weight="bold">Finite words → positive corners → intrinsic modular spectrum</text>
<text x="44" y="82" font-size="18">Countable products with strictly positive finite-matrix densities; 0 &lt; r &lt; 1</text>
<rect x="44" y="114" width="1112" height="178" rx="12" fill="#edf4fb" stroke="#bed0df"/>
<text x="66" y="147" font-size="20" font-weight="bold">An exact tail-preserving map</text>
<rect x="86" y="171" width="200" height="64" rx="8" fill="#d5e7f7" stroke="#477da7"/>
<text x="131" y="211" font-size="25">x = (v, z)</text>
<path d="M305 203 H533" stroke="#274b70" stroke-width="2"/>
<path d="M521 197 L533 203 L521 209" fill="none" stroke="#274b70" stroke-width="2"/>
<text x="331" y="187" font-size="18">T: replace v by u</text>
<rect x="555" y="171" width="200" height="64" rx="8" fill="#d6eee7" stroke="#40856e"/>
<text x="600" y="211" font-size="25">y = (u, z)</text>
<text x="806" y="194" font-size="20">δ(y,x) = p(u) / p(v)</text>
<text x="806" y="226" font-size="18">μ(TE) = δ(y,x) μ(E)</text>
<text x="87" y="267" font-size="18">Same tail z • word multiplicities retained • source-counting measure on the relation</text>
<rect x="44" y="317" width="532" height="231" rx="12" fill="#eef5fc" stroke="#bed0df"/>
<text x="65" y="351" font-size="21" font-weight="bold">1. Group far-out disjoint blocks</text>
<text x="65" y="388" font-size="19">Flip the first block in U ∪ V, when it lies in U.</text>
<text x="65" y="424" font-size="21">a ≤ derivative ≤ b &lt; 1</text>
<text x="65" y="462" font-size="21">μ(E) ≥ c = (1 − exp(−1)) / (1 + b)</text>
<text x="65" y="505" font-size="18">The lower bound is independent of the prefix.</text>
<rect x="600" y="317" width="556" height="231" rx="12" fill="#eef7f2" stroke="#b8d4c5"/>
<text x="621" y="351" font-size="21" font-weight="bold">2. Keep both endpoints inside B</text>
<text x="621" y="388" font-size="19">Choose C with μ(C ∖ B) &lt; η μ(C).</text>
<text x="621" y="424" font-size="21">Remaining mass ≥ [c − η(1 + 1/a)] μ(C)</text>
<text x="621" y="462" font-size="21">η &lt; c / (1 + 1/a) makes it positive.</text>
<text x="621" y="505" font-size="18">Every positive corner detects ratios near r.</text>
<path d="M600 562 V594" stroke="#274b70" stroke-width="2"/>
<path d="M594 582 L600 594 L606 582" fill="none" stroke="#274b70" stroke-width="2"/>
<text x="192" y="631" font-size="23" font-weight="bold">Diagonal-corner spectral intersection: r belongs to S₊(M)</text>
<text x="44" y="663" font-size="16">Proof: (MIV23.e), (MIV24.c), (MIV25.d)–(MIV25.f). Diagram of maps and bounds; no probability scale.</text>
</g></svg>

