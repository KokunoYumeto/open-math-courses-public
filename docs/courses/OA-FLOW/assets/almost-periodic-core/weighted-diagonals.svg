<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
<title id="title">Weighted Fourier diagonals and the two recovered corners</title>
<desc id="desc">A matrix entry in row gamma and column delta has modular eigenvalue delta divided by gamma. The Tomita norm identity balances the diagonal trace weights. The first crossed product has centralizer corner; the second crossing recovers the full original algebra. In a two by two example, both minimal projections have trace two to the n divided by three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38536d"/></marker></defs>
<rect width="1120" height="600" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#152c40">
<text x="36" y="43" font-size="25" font-weight="bold">Almost-periodic modular action: the trace and recovery</text>
<text x="36" y="73" font-size="17">Exact identities from MIV Sections 14–17; sums mean suprema of finite subsums.</text>
<rect x="36" y="98" width="510" height="246" rx="12" fill="#fff" stroke="#b2c3d0"/>
<text x="58" y="130" font-size="20" font-weight="bold">One Fourier matrix entry</text>
<rect x="64" y="153" width="144" height="68" rx="8" fill="#dcecf5"/>
<rect x="366" y="153" width="144" height="68" rx="8" fill="#e5efe0"/>
<text x="136" y="180" font-size="19" text-anchor="middle">column δ</text>
<text x="136" y="205" font-size="16" text-anchor="middle">input vector</text>
<text x="438" y="180" font-size="19" text-anchor="middle">row γ</text>
<text x="438" y="205" font-size="16" text-anchor="middle">output vector</text>
<path d="M218 187H356" stroke="#38536d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M346 181L357 187L346 193Z" fill="#38536d"/>
<text x="287" y="170" font-size="16" text-anchor="middle">eigenvalue δ/γ</text>
<text x="58" y="255" font-size="20">φ(aa*) = (δ/γ) φ(a*a)</text>
<text x="58" y="287" font-size="20" font-weight="bold">γ φ(aa*) = δ φ(a*a)</text>
<text x="58" y="319" font-size="16">Summing all entries proves τ(AA*) = τ(A*A).</text>
<rect x="574" y="98" width="510" height="246" rx="12" fill="#fff" stroke="#b2c3d0"/>
<text x="596" y="130" font-size="20" font-weight="bold">The matrix-state check</text>
<text x="596" y="163" font-size="18">State density D = diag(2/3, 1/3)</text>
<text x="596" y="200" font-size="18">A*A:   Fourier weight 2ⁿ,   state value 1/3</text>
<text x="596" y="233" font-size="18">AA*:   Fourier weight 2ⁿ⁻¹,   state value 2/3</text>
<text x="596" y="275" font-size="21" font-weight="bold">Both trace values are 2ⁿ / 3.</text>
<text x="596" y="312" font-size="17">The unweighted values 1/3 and 2/3 differ.</text>
<rect x="36" y="370" width="1048" height="195" rx="12" fill="#fff" stroke="#b2c3d0"/>
<text x="58" y="405" font-size="20" font-weight="bold">The same projection, two different corners</text>
<text x="78" y="453" font-size="22">N = M ⋊ K</text>
<text x="468" y="453" font-size="22">P = N ⋊ Γ</text>
<text x="850" y="453" font-size="22">M ⊗ B(L²K)</text>
<path d="M230 447H437M636 447H817" fill="none" stroke="#38536d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M427 441L438 447L427 453ZM807 441L818 447L807 453Z" fill="#38536d"/>
<text x="321" y="433" font-size="16" text-anchor="middle">dual action θ</text>
<text x="724" y="433" font-size="16" text-anchor="middle">normal isomorphism Φ</text>
<text x="78" y="496" font-size="20">p₁Np₁ ≅ M<tspan baseline-shift="sub" font-size="13">φ</tspan></text>
<text x="468" y="496" font-size="20">j(p₁)Pj(p₁) ≅ M</text>
<text x="850" y="496" font-size="18">Φ(j(p₁)) = 1 ⊗ p₁</text>
<text x="58" y="539" font-size="18">Diagonal γ has trace weight γ.</text>
<text x="468" y="539" font-size="18">Dual shift γ → γ/η; trace scaling η⁻¹.</text>
</g></svg>
