<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
<rect width="1200" height="1000" fill="#f7f9fc"/>
<g font-family="Arial, sans-serif" fill="#152a46">
<text x="48" y="55" font-size="29" font-weight="700">A homogeneous periodic state: keep the center</text>
<text x="48" y="92" font-size="20">P is the least period;  λ = exp(−2π/P) ∈ (0,1);  F = Mφ.</text>
<rect x="48" y="125" width="1104" height="225" rx="15" fill="#e7f0fc" stroke="#315e96" stroke-width="2"/>
<text x="78" y="164" font-size="23" font-weight="700">1. The finite linking algebra L₁ ⊂ M₂(M)</text>
<text x="88" y="213" font-size="28">[ F    X₁ ]</text><text x="88" y="253" font-size="28">[ X₁*   F ]</text>
<text x="365" y="210" font-size="22">χ([a  x; y*  b]) = (τ(a) + λτ(b))/(1 + λ)</text>
<text x="365" y="253" font-size="22">T(p) = 1/(1 + λ) · 1;   T(q) = λ/(1 + λ) · 1</text>
<text x="78" y="310" font-size="21">Homogeneity + naturality make these center-valued traces scalar.   (MIV33.e–h)</text>
<path d="M600 350 V391" stroke="#315e96" stroke-width="4"/><path d="M590 381 L600 395 L610 381" fill="none" stroke="#315e96" stroke-width="4"/>
<rect x="48" y="403" width="1104" height="195" rx="15" fill="#e5f4ee" stroke="#28745e" stroke-width="2"/>
<text x="78" y="442" font-size="23" font-weight="700">2. Compare q ≼ p, then read the upper-right entry</text>
<text x="78" y="485" font-size="24">s ∈ X₁,  s*s = 1,  e = ss*,  T_F(e) = λ1</text>
<text x="78" y="529" font-size="22">ρ(a) = sas* : F → eFe;    M = W*(F,s)</text>
<text x="78" y="568" font-size="21">F is finite with no abelian projection.  Its center need not be scalar.   (MIV34.a–c)</text>
<path d="M600 598 V639" stroke="#28745e" stroke-width="4"/><path d="M590 629 L600 643 L610 629" fill="none" stroke="#28745e" stroke-width="4"/>
<rect x="48" y="651" width="1104" height="150" rx="15" fill="#fff3dd" stroke="#b17924" stroke-width="2"/>
<text x="78" y="690" font-size="23" font-weight="700">3. The center and every homogeneous partial isometry</text>
<text x="78" y="730" font-size="22">ρ(z) = β(z)e;   Z(M) = Z(F)^β;   τβ = τ</text>
<text x="78" y="770" font-size="21">v ∈ Xₙ, v*v = p, vv* = q   ⇔   T_F(q) = λⁿ βⁿ(T_F(p))   (MIV34.h)</text>
<rect x="48" y="833" width="1104" height="126" rx="15" fill="#ece9f8" stroke="#6c5791" stroke-width="2"/>
<text x="78" y="870" font-size="23" font-weight="700">4. Recover the entire algebra and state</text>
<text x="78" y="908" font-size="21">A trace-preserving coefficient map and its corner intertwiner preserve every word moment.</text>
<text x="78" y="940" font-size="21">The resulting onto GNS unitary gives the normal isomorphism.   (MIV35.a–f)</text>
</g></svg>
