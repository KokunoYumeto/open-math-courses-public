<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030">
<rect width="1200" height="1030" fill="#f7f9fc"/>
<g font-family="Arial, sans-serif" fill="#172b44">
<text x="48" y="54" font-size="29" font-weight="700">Two periodic states: retain the corner mass</text>
<text x="48" y="92" font-size="21">Same factor M; factorial centralizers; least period P; λ = exp(−2π/P).</text>
<rect x="48" y="126" width="1104" height="183" rx="14" fill="#e7effb" stroke="#315f96" stroke-width="2"/>
<text x="78" y="164" font-size="23" font-weight="700">1. The normalized derivative chooses one scalar</text>
<text x="78" y="210" font-size="25">v_P = (Dψ : Dφ)_P = a^(−iP),       λ &lt; a ≤ 1</text>
<text x="78" y="254" font-size="22">χ = φ ⊕ aψ has period P on M₂(M). Its centralizer Q is a finite factor.</text>
<text x="78" y="286" font-size="19">The actual scalar cocycle fixes a; equality of modular groups alone does not.   (DDP40–41)</text>
<path d="M600 309 V348" stroke="#315f96" stroke-width="4"/><path d="M590 338 L600 352 L610 338" fill="none" stroke="#315f96" stroke-width="4"/>
<rect x="48" y="361" width="1104" height="207" rx="14" fill="#e5f4ee" stroke="#28745e" stroke-width="2"/>
<text x="78" y="399" font-size="23" font-weight="700">2. Compare the two diagonal projections inside Q</text>
<text x="78" y="443" font-size="24">T_Q(e₁₁) = 1/(1+a),       T_Q(e₂₂) = a/(1+a)</text>
<text x="78" y="485" font-size="24">e₂₂ ≼ e₁₁   ⇒   V = u e₁₂ ∈ Q,   u*u = 1,   p = uu* ∈ Mφ</text>
<text x="78" y="530" font-size="23">φ(uxu*) = a ψ(x),      φ(p) = a.     (DDP42–43)</text>
<path d="M600 568 V607" stroke="#28745e" stroke-width="4"/><path d="M590 597 L600 611 L610 597" fill="none" stroke="#28745e" stroke-width="4"/>
<rect x="48" y="620" width="1104" height="174" rx="14" fill="#fff2dc" stroke="#ad7423" stroke-width="2"/>
<text x="78" y="659" font-size="23" font-weight="700">3. Unitary classes of states on the fixed factor</text>
<text x="78" y="703" font-size="23">ψ_q ~ ψ_p    ⇔    τ(q)/τ(p) ∈ λ^ℤ.     (DDP47)</text>
<text x="78" y="744" font-size="22">Every class has one representative b ∈ (λ,1].  The endpoint λ represents 1.</text>
<text x="78" y="775" font-size="19">Dyadic projection sums prove that every b occurs. These are trace values, not Hilbert dimensions.</text>
<rect x="48" y="828" width="1104" height="158" rx="14" fill="#eee9f8" stroke="#6c5791" stroke-width="2"/>
<text x="78" y="866" font-size="23" font-weight="700">4. Isomorphism of the underlying factors</text>
<text x="78" y="906" font-size="22">J : F₂ → pF₁p,   τ₁J = aτ₂,   Jρ₂ = Ad(w) ρ_p J</text>
<text x="78" y="943" font-size="21">The exact corner supports give M₂ ≅ pM₁p ≅ M₁.   (DDP52–55)</text>
<text x="78" y="974" font-size="19">This criterion retains p and the partial isometry w; it is distinct from unitary state equivalence.</text>
</g></svg>
