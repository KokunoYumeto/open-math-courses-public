<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">A full abelian corner and central assembly of derivations</title>
<desc id="desc">The local construction corrects a star derivation to fix a full abelian projection, differentiates Ap, and produces a selfadjoint multiplier of norm at most four times the derivation norm. Central positive weights then assemble uniformly bounded local implementers with no increase in their common bound. Formula locators refer to the accompanying lesson proofs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#456577"/></marker></defs>
<rect width="1040" height="610" fill="#f5f8fa"/>
<g font-family="Arial, sans-serif" fill="#173443">
<text x="36" y="38" font-size="25" font-weight="700">From a full abelian corner to an implementing multiplier</text>
<text x="36" y="66" font-size="16">A may be nonunital. The local projection belongs to M(A); C = ‖d‖.</text>
<text x="42" y="100" font-size="18" font-weight="700">Local construction · FC6–FC15</text>
<text x="554" y="100" font-size="18" font-weight="700">Central assembly · GL1–GL7</text>
<g fill="#ffffff" stroke="#9eb7c4" stroke-width="1.4">
<rect x="36" y="116" width="464" height="112" rx="10"/>
<rect x="36" y="264" width="464" height="112" rx="10"/>
<rect x="36" y="412" width="464" height="134" rx="10"/>
<rect x="548" y="116" width="456" height="112" rx="10"/>
<rect x="548" y="264" width="456" height="112" rx="10"/>
<rect x="548" y="412" width="456" height="134" rx="10"/>
</g>
<g font-size="17">
<text x="56" y="143" font-weight="700">Fix the projection</text>
<text x="56" y="170">w = [d̃(p), p],   d₀ = d − [w, ·]</text>
<text x="56" y="197">d̃₀(p) = 0,   ‖w‖ ≤ C,   ‖d₀‖ ≤ 3C</text>
<text x="56" y="291" font-weight="700">Differentiate E = Ap</text>
<text x="56" y="318">pAp commutative ⇒ d₀ vanishes on pAp</text>
<text x="56" y="345">T(x) = d₀(x),   T* = −T,   ‖T‖ ≤ 3C</text>
<text x="56" y="439" font-weight="700">Recover the multiplier</text>
<text x="56" y="466">p full ⇒ A ≅ K(E); T defines t ∈ M(A)</text>
<text x="56" y="493">k = −i(w + t) = k*,   d = i[k, ·]</text>
<text x="56" y="524" font-size="21" font-weight="700" fill="#086879">‖k‖ ≤ 4C</text>
<text x="568" y="143" font-weight="700">Explicit central partition</text>
<text x="568" y="170">hᵢ ≥ 0 central,   hᵢA ⊆ Iᵢ</text>
<text x="568" y="197">Finite sums Hꜰ ≤ 1 converge strictly to 1</text>
<text x="568" y="291" font-weight="700">Uniform local implementations</text>
<text x="568" y="318">d|Iᵢ = i[kᵢ, ·],   kᵢ = kᵢ*,   ‖kᵢ‖ ≤ K</text>
<text x="568" y="345">Weighted extensions Bᵢ defined in GL3</text>
<text x="568" y="439" font-weight="700">Take the strict limit</text>
<text x="568" y="466">k = strict lim ∑ Bᵢ,   k = k*</text>
<text x="568" y="493">i[k, a] = d(a) for every a ∈ A</text>
<text x="568" y="524" font-size="21" font-weight="700" fill="#086879">‖k‖ ≤ K</text>
</g>
<g stroke="#456577" stroke-width="2.2" marker-end="url(#arrow)"><path d="M268 232V256"/><path d="M268 380V404"/><path d="M776 232V256"/><path d="M776 380V404"/></g>
<text x="36" y="577" font-size="16">The local theorem supplies K = 4‖d‖ when every ideal in the central cover has a full abelian corner.</text>
</g>
</svg>

