    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start" x="470.4011" y="77.224668" transform="rotate(-0 470.4011 77.224668)">Exact mechanism of Lemma 7</text>
   </g>
   <g id="text_22">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 119.916223)">α-band [a,b]  ⊆  Φ-band [a,b]</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 135.955075)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 151.993926)">Disjoint interval filters have product zero.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 168.032778)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 184.07163)">A smooth off-diagonal joint filter is a finite</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 200.110481)">sum of rectangle pieces; their separated</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 216.149333)">Fourier series converge in time-domain L¹.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 232.188184)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 248.227036)">Γₜ = αₜ Φ₋ₜ has frequency λ − μ.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 264.265887)">Every filter away from zero vanishes.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 280.304739)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(470.4011 296.34359)">Γ has only the zero band, so D − E = 0.</text>
   </g>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(183.635937 405.682187)">The shaded strip illustrates supp H ⊆ [1,2]; boxes are sample localization pieces, not the full cover.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #334155" transform="translate(195.557812 416.88)">Axes are filter coordinates. Proof: L35 Lemma 7, (20)–(21). Free ancestry: Olesen, pp.556–559.</text>
  </g>
