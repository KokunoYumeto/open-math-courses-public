<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#f7f9fc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516379"/></marker></defs>
<text x="44" y="53" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#152a43">Canonical transport from countable cone tests</text>
<text x="44" y="91" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#152a43">At each x: Wₓ : Hₓ → Kₓ.  The construction makes every frame image measurable.</text>
<rect x="44" y="125" width="425" height="188" rx="12" fill="white" stroke="#b6c7da" stroke-width="2"/>
<text x="64" y="161" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#152a43">1  Supplied measurable sections</text>
<text x="64" y="197" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">bℓ ∈ (Mₓ)₁,  dℓ = θₓ(bℓ) ∈ (Nₓ)₁</text>
<text x="64" y="227" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">pⱼ ∈ Pₓ,  qₖ ∈ Qₓ,  both cone lists dense</text>
<text x="64" y="257" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Wₓ exists pointwise by canonical comparison</text>
<text x="64" y="287" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Its measurability is to be proved.</text>
<rect x="507" y="125" width="425" height="188" rx="12" fill="white" stroke="#b6c7da" stroke-width="2"/>
<text x="527" y="161" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#152a43">2  Countable coefficient residual</text>
<text x="527" y="197" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Dⱼₖ = supℓ |⟨dℓqₖ,qₖ⟩ − ⟨bℓpⱼ,pⱼ⟩|</text>
<text x="527" y="227" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Dⱼₖ = ‖ω(qₖ) − ω(Wₓpⱼ)‖</text>
<text x="527" y="257" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Each coefficient, then Dⱼₖ, is measurable.</text>
<text x="527" y="287" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">The full norm uses a countable dense ball.</text>
<rect x="970" y="125" width="425" height="188" rx="12" fill="white" stroke="#b6c7da" stroke-width="2"/>
<text x="990" y="161" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#152a43">3  Least index and cone error</text>
<text x="990" y="197" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Choose the least k with Dⱼₖ &lt; ε².</text>
<text x="990" y="227" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">The level sets of this choice are measurable.</text>
<text x="990" y="257" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">CR6:  ‖qₖ − Wₓpⱼ‖² ≤ Dⱼₖ &lt; ε²</text>
<text x="990" y="287" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Let ε ↓ 0 to obtain measurable Wₓpⱼ.</text>
<path d="M473 218 L502 218" stroke="#516379" stroke-width="2.5" fill="none"/>
<polygon points="502,218 494,213 494,223" fill="#516379"/>
<path d="M936 218 L965 218" stroke="#516379" stroke-width="2.5" fill="none"/>
<polygon points="965,218 957,213 957,223" fill="#516379"/>
<rect x="44" y="366" width="650" height="182" rx="12" fill="white" stroke="#b6c7da" stroke-width="2"/>
<text x="64" y="402" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#152a43">4  Approximate a source Hilbert-frame vector</text>
<text x="64" y="438" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">aₜ = Σⱼ rₜⱼ pⱼ,  with rational complex coefficients</text>
<text x="64" y="468" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Choose the least t with ‖aₜ − eᵢ‖ &lt; 2⁻ᵐ.</text>
<text x="64" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">CR1 makes these finite combinations dense in Hₓ.</text>
<text x="64" y="528" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Put Rₜ = Σⱼ |rₜⱼ|  and  ε = 2⁻ᵐ / (1 + Rₜ).</text>
<rect x="745" y="366" width="650" height="182" rx="12" fill="white" stroke="#b6c7da" stroke-width="2"/>
<text x="765" y="402" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#152a43">5  Assemble a target frame approximation</text>
<text x="765" y="438" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">For each term j, choose q(kⱼ) with D(j,kⱼ) &lt; ε².</text>
<text x="765" y="468" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">hᵢ,ₘ = Σⱼ rₜⱼ q(kⱼ), pasted over the t-levels.</text>
<text x="765" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">‖hᵢ,ₘ − Wₓeᵢ‖ &lt; Rₜ ε + 2⁻ᵐ &lt; 2¹⁻ᵐ.</text>
<text x="765" y="528" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#152a43">Limits on the frame give measurable Wₓ and Wₓ*.</text>
<path d="M1165 319 L1165 360" stroke="#516379" stroke-width="2.5" fill="none"/>
<polygon points="1165,360 1160,352 1170,352" fill="#516379"/>
<path d="M700 454 L739 454" stroke="#516379" stroke-width="2.5" fill="none"/>
<polygon points="739,454 731,449 731,459" fill="#516379"/>
<text x="44" y="609" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#152a43">The two error contributions</text>
<text x="44" y="643" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#152a43">Example: m = 3, Rₜ = 3, ε = 1/32.  The triangle bound is 7/32, strictly below 1/4.</text>
<rect x="150" y="679" width="360" height="42" fill="#1b8a83"/><rect x="510" y="679" width="480" height="42" fill="#487bc0"/>
<line x1="1110" y1="669" x2="1110" y2="731" stroke="#b04031" stroke-width="3" stroke-dasharray="7,5"/>
<text x="206" y="707" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">cone: 3/32</text>
<text x="656" y="707" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">source: 1/8</text>
<text x="959" y="757" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#152a43">7/32</text>
<text x="1085" y="757" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#b04031">1/4</text>
<text x="44" y="816" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#152a43">Exact proof: OA-FLOW-MSF, (MSF.D1)–(MSF.D11).  Bars show bounds, not measured errors.</text>
<text x="44" y="851" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#152a43">The supremum is countable; finite coefficient tests alone need not decide a least-index inequality.</text>
</svg>
