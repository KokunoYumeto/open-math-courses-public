<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">A normal orbit functional forces one homogeneous space</title>
<desc id="desc">The top chain proves that each orbit map is proper, its stabilizer compact and its orbit closed. The middle chain extends a dominated orbit functional normally and annihilates the ideal off the orbit. Ergodicity forces the ideal to vanish. The lower chain extends multiplication normally and identifies the full Haar multiplier algebra without countability assumptions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247e94"/></marker></defs>
<rect width="1600" height="1140" fill="#f5f8fc"/>
<text x="800" y="56" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="bold" text-anchor="middle">One proper orbit, then the complete normal algebra</text>
<text x="800" y="96" fill="#536e88" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="normal" text-anchor="middle">Arbitrary locally compact G; arbitrary nonzero abelian M; ergodic and integrable</text>
<rect x="45" y="145" width="450" height="180" rx="16" fill="#e8f2f7" stroke="#9bb2c6" stroke-width="2"/>
<text x="270.0" y="185" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Finite orbit integrals</text>
<text x="270.0" y="225" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">u(s) = h(s⁻¹y), h ≥ 0 compact</text>
<text x="270.0" y="259" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">∫ u(s) ds ≤ τ(h) &lt; ∞</text>
<text x="270.0" y="293" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">Right uniform continuity ⇒ u ∈ C₀(G)</text>
<rect x="575" y="145" width="440" height="180" rx="16" fill="#e8f2f7" stroke="#9bb2c6" stroke-width="2"/>
<text x="795.0" y="185" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Proper orbit map</text>
<text x="795.0" y="225" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">pᵧ : G → X, s ↦ sy</text>
<text x="795.0" y="259" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">pᵧ⁻¹(K) is compact for compact K</text>
<text x="795.0" y="293" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">EO13–EO15</text>
<rect x="1095" y="145" width="460" height="180" rx="16" fill="#e8f2f7" stroke="#9bb2c6" stroke-width="2"/>
<text x="1325.0" y="185" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Compact stabilizer; closed orbit</text>
<text x="1325.0" y="225" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">Hᵧ = pᵧ⁻¹({y}) is compact</text>
<text x="1325.0" y="259" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">Gy is closed in X</text>
<text x="1325.0" y="293" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">No countable covering is used</text>
<path d="M501,233 L567,233" fill="none" stroke="#247e94" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1022,233 L1087,233" fill="none" stroke="#247e94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="390" width="690" height="195" rx="16" fill="#e5f2ed" stroke="#9bb2c6" stroke-width="2"/>
<text x="390.0" y="430" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" text-anchor="middle">A finite normal witness</text>
<text x="390.0" y="470" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">ρᵧ,ₕ(a) = ∫ h(s⁻¹y) a(s⁻¹y) ds</text>
<text x="390.0" y="504" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">0 ≤ ρᵧ,ₕ ≤ μₕ,     μₕ(x) = τ(hx)</text>
<text x="390.0" y="538" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Domination ⇒ a nonzero normal extension to M</text>
<text x="390.0" y="572" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">EO16–EO17</text>
<rect x="830" y="390" width="725" height="195" rx="16" fill="#e5f2ed" stroke="#9bb2c6" stroke-width="2"/>
<text x="1192.5" y="430" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" text-anchor="middle">The ideal off the closed orbit</text>
<text x="1192.5" y="470" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">J = {a ∈ C₀(X) : a|Gy = 0};  I = closureᵘʷ(J) = eM</text>
<text x="1192.5" y="504" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">I is invariant and the normal witness annihilates I</text>
<text x="1192.5" y="538" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Ergodicity: e = 0 or 1; nonzero witness excludes 1</text>
<text x="1192.5" y="572" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Hence J = 0 and X = Gy ≅ G/Hᵧ</text>
<path d="M743,482 L822,482" fill="none" stroke="#247e94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="665" width="450" height="225" rx="16" fill="#e8f2f7" stroke="#9bb2c6" stroke-width="2"/>
<text x="270.0" y="705" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Every multiplication coefficient</text>
<text x="270.0" y="745" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">On L²(X,ν): a ↦ multiplication by a</text>
<text x="270.0" y="779" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">|f|² gives ρᵧ,|f|² for f ∈ C꜀(X)</text>
<text x="270.0" y="813" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">L² approximation + polarization</text>
<text x="270.0" y="847" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">give normal coefficients for all vectors</text>
<text x="270.0" y="881" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">EO20–EO21</text>
<rect x="575" y="665" width="440" height="225" rx="16" fill="#e8f2f7" stroke="#9bb2c6" stroke-width="2"/>
<text x="795.0" y="705" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">The faithful normal extension</text>
<text x="795.0" y="745" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">T : M → B(L²(X,ν))</text>
<text x="795.0" y="779" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">T is multiplicative and equivariant</text>
<text x="795.0" y="813" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">Its invariant kernel is zero</text>
<text x="795.0" y="847" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">T(M) = C₀(X)″</text>
<text x="795.0" y="881" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">EO21–EO24</text>
<rect x="1095" y="665" width="460" height="225" rx="16" fill="#e8f2f7" stroke="#9bb2c6" stroke-width="2"/>
<text x="1325.0" y="705" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">The full Haar algebra</text>
<text x="1325.0" y="745" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">ν = Δ⁻¹ mG/H; identical local null sets</text>
<text x="1325.0" y="779" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">C₀(G/H)″ = ∏ⱼ L∞(Xⱼ)</text>
<text x="1325.0" y="813" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">Xⱼ are open σ-compact pieces</text>
<text x="1325.0" y="847" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">The bounded product may be uncountable</text>
<text x="1325.0" y="881" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">EO25–EO26</text>
<path d="M501,776 L567,776" fill="none" stroke="#247e94" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1022,776 L1087,776" fill="none" stroke="#247e94" stroke-width="3" marker-end="url(#arrow)"/>
<text x="800" y="956" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Why a global probability cannot be assumed</text>
<text x="800" y="998" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="normal" text-anchor="middle">Uncountable discrete G acting on ℓ∞(G): integrable and ergodic, H = {e}.</text>
<text x="800" y="1034" fill="#173650" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="normal" text-anchor="middle">Every normal state has countable support, so none is faithful. The proof still applies.</text>
<text x="800" y="1094" fill="#536e88" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" text-anchor="middle">Proof locators: OA-FLOW-EOR, EO13–EO26. This is a proof diagram, not a geometric embedding.</text>
</svg>
