<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Range projections control transported weights</title>
<desc id="desc">Exact schematic for CI7a-CI7b. For phi(x)=Tr(diag(1,2)x), u=e21 carries the first coordinate ray to the second and pulls back mass two; v=e11 carries the first ray to itself and pulls back mass one. The initial projection of u equals the final projection of v, but the transported weights are not subequivalent. Correct range projections e22 and e11 are incomparable in the diagonal centralizer. Original OA-FLOW vector source, CC0-1.0.</desc>
<rect width="960" height="430" rx="16" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#243346">
<text x="40" y="43" font-size="25" font-weight="bold">The same ray can carry different weight</text>
<text x="40" y="76" font-size="18">φ(x) = Tr(diag(1, 2)x)    ·    centralizer: diagonal matrices</text>
<text x="60" y="119" font-size="15" fill="#536477">INITIAL RAY</text>
<text x="400" y="119" font-size="15" fill="#536477">RANGE RAY</text>
<text x="690" y="119" font-size="15" fill="#536477">TRANSPORTED WEIGHT</text>
<rect x="40" y="135" width="160" height="66" rx="10" fill="#e3edf9" stroke="#2563aa"/>
<rect x="385" y="135" width="170" height="66" rx="10" fill="#f9ecd2" stroke="#b77916"/>
<text x="120" y="175" font-size="23" text-anchor="middle">ℂe₁</text>
<text x="470" y="175" font-size="23" text-anchor="middle">ℂe₂</text>
<path d="M215 169H365" fill="none" stroke="#34465b" stroke-width="2.5"/>
<path d="M354 162L368 169L354 176Z" fill="#34465b"/>
<text x="290" y="155" font-size="19" text-anchor="middle">u = e₂₁</text>
<text x="690" y="164" font-size="22" font-weight="bold" fill="#986510">φᵤ(x) = 2x₁₁</text>
<text x="690" y="189" font-size="16">support e₁₁, mass 2</text>
<rect x="40" y="231" width="160" height="66" rx="10" fill="#e3edf9" stroke="#2563aa"/>
<rect x="385" y="231" width="170" height="66" rx="10" fill="#e3edf9" stroke="#2563aa"/>
<text x="120" y="271" font-size="23" text-anchor="middle">ℂe₁</text>
<text x="470" y="271" font-size="23" text-anchor="middle">ℂe₁</text>
<path d="M215 265H365" fill="none" stroke="#34465b" stroke-width="2.5"/>
<path d="M354 258L368 265L354 272Z" fill="#34465b"/>
<text x="290" y="251" font-size="19" text-anchor="middle">v = e₁₁</text>
<text x="690" y="260" font-size="22" font-weight="bold" fill="#2563aa">φᵥ(x) = x₁₁</text>
<text x="690" y="285" font-size="16">support e₁₁, mass 1</text>
<path d="M40 321H920" stroke="#ccd5df"/>
<text x="40" y="353" font-size="20">u*u = vv* = e₁₁, but φᵤ is not a transported centralizer cut of φᵥ.</text>
<text x="40" y="385" font-size="17">Compare both ranges: uu* = e₂₂ and vv* = e₁₁ are incomparable.</text>
<text x="40" y="411" font-size="13" fill="#536477">Exact coordinate-ray schematic · Proof: CGF Section 2, CI7a–CI7b · Original vector source, CC0</text>
</g></svg>
