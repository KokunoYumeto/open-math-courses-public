<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Assembling a prescribed global carrier</title><desc id="desc">A faithful normal state selects countably many carrier projections covering a. Disjoint central cuts c_j produce supported weights chi_j. Partial isometries t_j move their supports to orthogonal corners e_j of M. The sum psi has carrier a. The first three pieces and ellipsis are schematic; areas do not encode weights.</desc>
<rect width="1100" height="650" rx="20" fill="#f7f9fc"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#172c42">
<text x="40" y="47" font-size="27" font-weight="bold">From a central cover to one weight</text>
<text x="40" y="80" font-size="17">Exact maps: (CI10a)-(CI11).  The target a is sigma-finite in A = Z(Q).</text>
<rect x="40" y="109" width="1020" height="154" rx="12" fill="#ffffff" stroke="#9baabe"/>
<text x="60" y="140" font-size="19" font-weight="bold">A faithful state selects a countable cover; successive differences make it disjoint.</text>
<rect x="70" y="158" width="225" height="49" rx="7" fill="#daeafa"/><rect x="310" y="158" width="225" height="49" rx="7" fill="#dceee8"/><rect x="550" y="158" width="225" height="49" rx="7" fill="#f9e6cb"/><rect x="790" y="158" width="235" height="49" rx="7" fill="#e8e3f4"/>
<text x="182" y="190" text-anchor="middle" font-size="22">c₁</text><text x="422" y="190" text-anchor="middle" font-size="22">c₂</text><text x="662" y="190" text-anchor="middle" font-size="22">c₃</text><text x="907" y="190" text-anchor="middle" font-size="22">…</text>
<text x="550" y="239" text-anchor="middle" font-size="19">c_j = a p_M(φ_j) ∏_{k&lt;j}(1 − p_M(φ_k)),    ∨_j c_j = a</text>
<rect x="40" y="315" width="300" height="190" rx="12" fill="#daeafa" stroke="#6b98bc"/>
<rect x="400" y="315" width="300" height="190" rx="12" fill="#dceee8" stroke="#709e8c"/>
<rect x="760" y="315" width="300" height="190" rx="12" fill="#f9e6cb" stroke="#b49466"/>
<text x="62" y="348" font-size="21" font-weight="bold">1. Cut centrally</text><text x="62" y="386" font-size="19">h_j ↔ c_j d_{φ_j}</text><text x="62" y="420" font-size="19">χ_j = (φ_j)_{h_j}</text><text x="62" y="461" font-size="19">p_M(χ_j) = c_j</text>
<text x="422" y="348" font-size="21" font-weight="bold">2. Move supports</text><text x="422" y="386" font-size="19">t_j = r_j v_j*</text><text x="422" y="420" font-size="19">η_j(x) = χ_j(t_j x t_j*)</text><text x="422" y="461" font-size="19">s(η_j) = e_j,   η_j ∼ χ_j</text>
<text x="782" y="348" font-size="21" font-weight="bold">3. Sum on M</text><text x="782" y="386" font-size="19">e_i e_j = 0  (i ≠ j)</text><text x="782" y="420" font-size="19">ψ = Σ_j η_j</text><text x="782" y="461" font-size="19">s(ψ) = Σ_j e_j</text>
<path d="M346 409H388" stroke="#38566e" stroke-width="3" fill="none"/><path d="M388 409l-11 -7v14z" fill="#38566e"/>
<path d="M706 409H748" stroke="#38566e" stroke-width="3" fill="none"/><path d="M748 409l-11 -7v14z" fill="#38566e"/>
<path d="M550 268V301" stroke="#38566e" stroke-width="3" fill="none"/><path d="M550 301l-7 -11h14z" fill="#38566e"/>
<rect x="40" y="534" width="1020" height="65" rx="12" fill="#172c42"/>
<text x="550" y="575" text-anchor="middle" font-size="25" fill="#ffffff">p_M(ψ) = ∨_j p_M(η_j) = ∨_j c_j = a</text>
<text x="40" y="629" font-size="16">Schematic pieces; no areas encode masses. For a = 0, take ψ = 0. Original editable drawing: CC0.</text>
</g></svg>
