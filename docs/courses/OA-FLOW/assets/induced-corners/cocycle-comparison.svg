<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="1280" height="900" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="54" y="60" font-size="29" font-weight="bold">Cocycles and first returns</text>
<text x="54" y="105" font-size="23">β = Ad(v) ∘ α</text><text x="620" y="105" font-size="23">βₑ = Ad(vₑ) ∘ αₑ</text>
<text x="54" y="145" font-size="18" fill="#475569">N has the hypotheses of IC1; e is a nonzero central projection.</text>
<rect x="54" y="205" width="440" height="120" rx="14" fill="#dbeafe" stroke="#2563eb"/>
<rect x="786" y="205" width="440" height="120" rx="14" fill="#dbeafe" stroke="#2563eb"/>
<text x="274" y="255" text-anchor="middle" font-size="26">e(N ⋊β ℤ)e</text>
<text x="274" y="294" text-anchor="middle" font-size="18">corner of the original crossed product</text>
<text x="1006" y="255" text-anchor="middle" font-size="26">e(N ⋊α ℤ)e</text>
<text x="1006" y="294" text-anchor="middle" font-size="18">corner of the original crossed product</text>
<path d="M510 263 H768" stroke="#334155" stroke-width="3"/>
<text x="640" y="239" text-anchor="middle" font-size="22">Ψᵥ restricted to e</text>
<text x="640" y="302" text-anchor="middle" font-size="18">normal, onto, invertible</text>
<rect x="54" y="458" width="440" height="125" rx="14" fill="#dcfce7" stroke="#16a34a"/>
<rect x="786" y="458" width="440" height="125" rx="14" fill="#dcfce7" stroke="#16a34a"/>
<text x="274" y="509" text-anchor="middle" font-size="26">Ne ⋊βₑ ℤ</text>
<text x="274" y="548" text-anchor="middle" font-size="18">regular induced crossed product</text>
<text x="1006" y="509" text-anchor="middle" font-size="26">Ne ⋊αₑ ℤ</text>
<text x="1006" y="548" text-anchor="middle" font-size="18">regular induced crossed product</text>
<path d="M274 443 V343 M1006 443 V343" stroke="#334155" stroke-width="3"/>
<text x="293" y="399" font-size="21">Kₑ for β</text>
<text x="1025" y="399" font-size="21">Kₑ for α</text>
<path d="M510 519 H768" stroke="#334155" stroke-width="3"/>
<text x="640" y="493" text-anchor="middle" font-size="24">Ψᵥₑ</text>
<text x="640" y="555" text-anchor="middle" font-size="19">uβₑ ↦ vₑuαₑ</text>
<rect x="54" y="635" width="1172" height="203" rx="14" fill="#fff" stroke="#94a3b8"/>
<text x="80" y="680" font-size="25">vₑ = Σₙ≥₁ vₙ αⁿ(eₙ)</text><text x="700" y="680" font-size="25">vₑ*vₑ = vₑvₑ* = e</text>
<text x="80" y="722" font-size="20">Each summand has initial and final support αⁿ(eₙ).</text>
<text x="80" y="759" font-size="20">These arrival projections are central, orthogonal, and sum to e.</text>
<text x="80" y="796" font-size="20">The one-step unitary v is replaced by its n-step product on each return piece.</text>
<text x="54" y="875" font-size="17" fill="#475569">Exact maps: IC62, IC68–70. The diagram shows algebras and maps; box sizes carry no trace information.</text>
<g fill="#334155"><path d="M768 263 L752 255 L752 271 Z"/><path d="M768 519 L752 511 L752 527 Z"/><path d="M274 343 L266 359 L282 359 Z"/><path d="M1006 343 L998 359 L1014 359 Z"/></g></g></svg>
