<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
<title id="title">An irrational compatible pair obstructs every AFD II1 realization</title>
<desc id="desc">Exact integer translation area, weighted finite-algebra Hilbert-Schmidt vectors, parabolic dynamics on the real projective line, and a finite-dimensional determinant contradiction. The ambient group is Gamma times C2 and the proper normal subgroup is Gamma. Positive amenable and arbitrary-subgroup trivial-class boundaries are preserved.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b53"/></marker></defs>
<rect width="1440" height="1440" fill="#ffffff"/>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#172b4d}.title{font-size:32px;font-weight:700}.section{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:16px}.formula{font-size:20px;font-weight:600}.red{fill:#a52835}.blue{fill:#1765a5}.green{fill:#176348}</style>
<text x="30" y="50" class="title" text-anchor="start">A compatible pair with no AFD II₁ realization</text>
<text x="30" y="84" class="formula" text-anchor="start">Γ = ℤ² ⋊ SL₂(ℤ),   G = Γ × C₂,   N = Γ × {e};   θ = √2.</text>
<rect x="30" y="110" width="675" height="400" rx="12" fill="#f6f8fb" stroke="#b8c7d6" stroke-width="1.5"/>
<rect x="735" y="110" width="675" height="400" rx="12" fill="#f6f8fb" stroke="#b8c7d6" stroke-width="1.5"/>
<text x="50" y="149" class="section" text-anchor="start">1. The exact multiplier and translation phase</text>
<text x="50" y="181" class="formula" text-anchor="start">μ((v,A),(w,B)) = exp(πi√2 · ω(v,Aw))</text>
<text x="50" y="208" class="body" text-anchor="start">ω(v,w) = v₁w₂ − v₂w₁.   Proof: NNR1–8.</text>
<text x="50" y="240" class="formula" text-anchor="start">λ(n,(g,c)) = μ(g,g⁻¹ng)/μ(n,g).</text>
<polygon points="95,432 210,432 210,317 95,317" fill="#daeaf7" stroke="#8aa8c1"/>
<circle cx="95" cy="432" r="5" fill="#243b53"/>
<circle cx="95" cy="317" r="5" fill="#243b53"/>
<circle cx="210" cy="432" r="5" fill="#243b53"/>
<circle cx="210" cy="317" r="5" fill="#243b53"/>
<line x1="95" y1="432" x2="210" y2="432" stroke="#1765a5" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="95" y1="432" x2="95" y2="317" stroke="#176348" stroke-width="3" marker-end="url(#arrow)"/>
<text x="79" y="461" class="small" text-anchor="start">(0,0)</text>
<text x="200" y="461" class="small" text-anchor="start">(1,0)</text>
<text x="57" y="303" class="small" text-anchor="start">(0,1)</text>
<text x="190" y="303" class="small" text-anchor="start">(1,1)</text>
<text x="147" y="416" class="small blue" text-anchor="start">a = e₁</text>
<text x="115" y="376" class="small green" text-anchor="start">b = e₂</text>
<text x="300" y="285" class="formula" text-anchor="start">ω(e₁,e₂) = 1</text>
<text x="300" y="327" class="formula red" text-anchor="start">UV = qVU</text>
<text x="300" y="360" class="formula red" text-anchor="start">q = exp(2πi√2)</text>
<text x="300" y="403" class="body red" text-anchor="start">qᵈ ≠ 1 for every integer d ≥ 1.</text>
<text x="300" y="437" class="body" text-anchor="start">The ratio survives every gauge.</text>
<text x="50" y="489" class="small" text-anchor="start">The shaded unit square records the actual lattice area; no numerical phase approximation.</text>
<text x="755" y="149" class="section" text-anchor="start">2. AFD gives weighted HS unit vectors</text>
<text x="755" y="181" class="body" text-anchor="start">Example: F = M₂ ⊕ M₃,   (t₁,t₂) = (1/3,2/3).</text>
<text x="755" y="208" class="small" text-anchor="start">Pⱼ projects onto L²(Fpⱼ), of dimension dⱼ².</text>
<rect x="775" y="232" width="43" height="43" rx="2" fill="#dcecf7" stroke="#8fb4d0" stroke-width="1.5"/>
<rect x="820" y="232" width="43" height="43" rx="2" fill="#dcecf7" stroke="#8fb4d0" stroke-width="1.5"/>
<rect x="775" y="277" width="43" height="43" rx="2" fill="#dcecf7" stroke="#8fb4d0" stroke-width="1.5"/>
<rect x="820" y="277" width="43" height="43" rx="2" fill="#dcecf7" stroke="#8fb4d0" stroke-width="1.5"/>
<rect x="1035" y="232" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1067" y="232" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1099" y="232" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1035" y="264" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1067" y="264" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1099" y="264" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1035" y="296" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1067" y="296" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<rect x="1099" y="296" width="30" height="30" rx="2" fill="#dcefe2" stroke="#9abbab" stroke-width="1.5"/>
<text x="755" y="351" class="body blue" text-anchor="start">rank P₁ = 4</text>
<text x="1008" y="351" class="body green" text-anchor="start">rank P₂ = 9</text>
<text x="755" y="384" class="formula" text-anchor="start">D_F = √(1/12) P₁ + √(2/27) P₂</text>
<text x="755" y="417" class="formula" text-anchor="start">‖D_F‖²_HS = 4/12 + 18/27 = 1</text>
<text x="755" y="450" class="formula" text-anchor="start">‖LᵤD_F − D_FLᵤ‖_HS ≤ 2‖u − y_F‖₂ → 0</text>
<text x="755" y="489" class="small" text-anchor="start">General weights: √tⱼ/dⱼ. The displayed two-block model is an example, not every F.</text>
<rect x="30" y="530" width="675" height="460" rx="12" fill="#f6f8fb" stroke="#b8c7d6" stroke-width="1.5"/>
<rect x="735" y="530" width="675" height="460" rx="12" fill="#f6f8fb" stroke="#b8c7d6" stroke-width="1.5"/>
<text x="50" y="569" class="section" text-anchor="start">3. Relative rigidity proved on the dual torus</text>
<text x="50" y="602" class="body" text-anchor="start">Assume no nonzero T-fixed vector. Then νₙ({0}) = 0.</text>
<text x="50" y="632" class="body" text-anchor="start">Almost invariance ⇒ mass near 0 tends to 1.</text>
<text x="50" y="661" class="body" text-anchor="start">Directions ⇒ an SL₂(ℤ)-invariant probability η on RP¹.</text>
<text x="50" y="689" class="formula" text-anchor="start">That probability is impossible.   Proof: NNR14–21.</text>
<line x1="90" y1="768" x2="557" y2="768" stroke="#243b53" stroke-width="2.2"/>
<line x1="140" y1="761" x2="140" y2="775" stroke="#243b53" stroke-width="2.2"/>
<text x="140" y="800" class="body" text-anchor="middle">0</text>
<line x1="275" y1="761" x2="275" y2="775" stroke="#243b53" stroke-width="2.2"/>
<text x="275" y="800" class="body" text-anchor="middle">1</text>
<line x1="410" y1="761" x2="410" y2="775" stroke="#243b53" stroke-width="2.2"/>
<text x="410" y="800" class="body" text-anchor="middle">2</text>
<line x1="150" y1="742" x2="261" y2="742" stroke="#243b53" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="285" y1="742" x2="396" y2="742" stroke="#243b53" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="260" y="713" class="formula" text-anchor="middle">T₀: r ↦ r+1</text>
<circle cx="588" cy="835" r="6" fill="#243b53"/>
<text x="588" y="867" class="body" text-anchor="middle">∞ = ℝ(1,0)</text>
<path d="M 598 833 C 644 795 646 875 597 847" fill="none" stroke="#1765a5" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="534" y="905" class="small blue" text-anchor="start">T₀ fixes ∞</text>
<path d="M 580 829 C 511 846 401 844 279 780" fill="none" stroke="#176348" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300" y="837" class="body green" text-anchor="start">L₀ sends ∞ to 1</text>
<text x="50" y="936" class="formula red" text-anchor="start">T₀-invariance forces η = δ∞, which is not L₀-invariant.</text>
<text x="50" y="969" class="small" text-anchor="start">Chart r=x/y; ∞ is the omitted line. T₀=[1 1;0 1], L₀=[1 0;1 1].</text>
<text x="755" y="569" class="section" text-anchor="start">4. Rigidity forces the forbidden finite dimension</text>
<rect x="765" y="598" width="615" height="57" rx="12" fill="#edf3fb" stroke="#b8c7d6" stroke-width="1.5"/>
<text x="785" y="635" class="formula" text-anchor="start">Πg(S) = Lᵤg S Lᵤg*; scalar phases cancel.</text>
<line x1="1070" y1="659" x2="1070" y2="683" stroke="#243b53" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="765" y="690" width="615" height="58" rx="12" fill="#edf3fb" stroke="#b8c7d6" stroke-width="1.5"/>
<text x="785" y="727" class="formula" text-anchor="start">D_F almost invariant ⇒ S ≠ 0 fixed by T = ℤ².</text>
<line x1="1070" y1="751" x2="1070" y2="775" stroke="#243b53" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="765" y="782" width="615" height="58" rx="12" fill="#edf3fb" stroke="#b8c7d6" stroke-width="1.5"/>
<text x="785" y="819" class="formula" text-anchor="start">S*S compact ⇒ T-invariant eigenspace E, 0 &lt; d &lt; ∞.</text>
<line x1="1070" y1="843" x2="1070" y2="867" stroke="#243b53" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="765" y="874" width="615" height="72" rx="12" fill="#fff1f1" stroke="#d29da4" stroke-width="1.5"/>
<text x="785" y="904" class="formula red" text-anchor="start">U_E V_E = q V_E U_E ⇒ qᵈ = 1 by determinants.</text>
<text x="785" y="932" class="formula red" text-anchor="start">But qᵈ = exp(2πid√2) ≠ 1. Contradiction.</text>
<text x="755" y="973" class="small" text-anchor="start">No faithful group representation or regular trace on N is assumed. NNR10–23.</text>
<rect x="30" y="1010" width="1380" height="332" rx="12" fill="#ffffff" stroke="#b8c7d6" stroke-width="1.5"/>
<text x="50" y="1049" class="section" text-anchor="start">What is disproved, and what survives</text>
<line x1="480" y1="1074" x2="480" y2="1315" stroke="#c4ced8" stroke-width="1.5"/>
<line x1="944" y1="1074" x2="944" y2="1315" stroke="#c4ced8" stroke-width="1.5"/>
<text x="50" y="1102" class="formula red" text-anchor="start">This explicit irrational class</text>
<text x="50" y="1140" class="body" text-anchor="start">Proper nonamenable N is allowed.</text>
<text x="50" y="1173" class="body red" text-anchor="start">Every AFD II₁ realization fails.</text>
<text x="50" y="1206" class="body" text-anchor="start">This excludes all possible recipes,</text>
<text x="50" y="1239" class="body" text-anchor="start">not only the regular product.</text>
<text x="50" y="1297" class="body" text-anchor="start">Theorem 3; no type-III claim.</text>
<text x="505" y="1102" class="formula green" text-anchor="start">Amenable N: every compatible pair</text>
<text x="505" y="1140" class="body" text-anchor="start">G may be any countable group.</text>
<text x="505" y="1173" class="body" text-anchor="start">Finite N: TRP Section 9.</text>
<text x="505" y="1206" class="body" text-anchor="start">Infinite amenable N: ARP.</text>
<text x="505" y="1239" class="body" text-anchor="start">Same regular product, exact kernel</text>
<text x="505" y="1272" class="body" text-anchor="start">and original characteristic phases.</text>
<text x="970" y="1102" class="formula green" text-anchor="start">Arbitrary N: the trivial class</text>
<text x="970" y="1140" class="body" text-anchor="start">Q = G/N; outer Bernoulli β on R.</text>
<text x="970" y="1173" class="body" text-anchor="start">αg = βgN;  N(α) = N.</text>
<text x="970" y="1206" class="body" text-anchor="start">Implementers uₙ = 1 ⇒ λ = μ = 1.</text>
<text x="970" y="1239" class="body" text-anchor="start">Thus nonamenability alone is</text>
<text x="970" y="1272" class="body" text-anchor="start">not an obstruction. Section 7.</text>
<text x="30" y="1375" class="small" text-anchor="start">Question: Takesaki III, XVII.3 Exercise 5, pp.293–294. Relative-rigidity background: Cornulier, Theorem 3.2; Breuillard, III.</text>
<text x="30" y="1404" class="small" text-anchor="start">Complete argument: accompanying lesson. This theorem does not characterize all nonamenable classes.</text>
</svg>
