<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="585" viewBox="0 0 1040 585" role="img" aria-labelledby="title desc">
  <title id="title">The normal translation tensor model and its two traces</title>
  <desc id="desc">Phi sends a tensor f to a times f of Q, from the fixed algebra B spatially tensored with L infinity of the real line onto N. It intertwines translation f(r+s) with theta s. The invariant trace has density one in r, and the given scaled trace has density exp(r).</desc>
  <rect width="1040" height="585" fill="white"/>
  <g fill="#18314e" font-family="Arial, sans-serif">
    <text x="44" y="45" font-size="27" font-weight="bold">A full normal isomorphism, with the trace normalization</text>
    <text x="44" y="79" font-size="18">B = Nᶿ carries a faithful normal semifinite trace ρ. The center and predual are unrestricted.</text>
    <rect x="110" y="123" width="290" height="62" rx="8" fill="#e5f0f6" stroke="#294c67" stroke-width="2"/>
    <rect x="702" y="123" width="204" height="62" rx="8" fill="#fff1dc" stroke="#9a561c" stroke-width="2"/>
    <rect x="110" y="307" width="290" height="62" rx="8" fill="#e5f0f6" stroke="#294c67" stroke-width="2"/>
    <rect x="702" y="307" width="204" height="62" rx="8" fill="#fff1dc" stroke="#9a561c" stroke-width="2"/>
    <text x="151" y="163" font-size="25">B ⊗ L∞(R, dr)</text>
    <text x="794" y="163" font-size="27">N</text>
    <text x="151" y="347" font-size="25">B ⊗ L∞(R, dr)</text>
    <text x="794" y="347" font-size="27">N</text>
    <path d="M422 154 H681 M422 338 H681" fill="none" stroke="#294c67" stroke-width="2.5"/>
    <path d="M690 154 L674 147 L674 161 Z M690 338 L674 331 L674 345 Z" fill="#294c67"/>
    <text x="457" y="134" font-size="20">Φ(a ⊗ f) = a f(Q)</text>
    <text x="542" y="325" font-size="24">Φ</text>
    <path d="M254 198 V290 M804 198 V290" fill="none" stroke="#294c67" stroke-width="2.5"/>
    <path d="M254 299 L247 283 L261 283 Z M804 299 L797 283 L811 283 Z" fill="#294c67"/>
    <text x="119" y="236" font-size="21">id ⊗ Tₛ</text>
    <text x="70" y="266" font-size="17">Tₛ f(r) = f(r + s)</text>
    <text x="830" y="250" font-size="24">θₛ</text>
    <text x="400" y="226" font-size="19">Q = −log h is central</text>
    <text x="410" y="258" font-size="19">θₛ(Q) = Q + s1</text>
    <rect x="44" y="402" width="952" height="112" rx="8" fill="#f3f5f8"/>
    <text x="66" y="436" font-size="20">Invariant trace:   Ψ ∘ Φ = ρ ⊗ dr,     where Ψ = ρ ∘ E = τₕ.</text>
    <text x="66" y="470" font-size="20">Given scaled trace:   τ ∘ Φ = ρ ⊗ eʳ dr,     so τ ∘ θₛ = e⁻ˢ τ.</text>
    <text x="66" y="500" font-size="17">Both equalities hold on the entire positive cone, including infinite values.</text>
    <text x="44" y="545" font-size="15">The arrows commute at every real time. Construction and complete trace formulas: TM3–TM15 in the lesson.</text>
    <text x="44" y="570" font-size="15">The symbol ⊗ denotes the spatial von Neumann tensor product.</text>
  </g>
</svg>
