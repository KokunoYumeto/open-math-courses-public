<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc">
<title id="title">Discontinuous density and inverse translation conventions</title>
<desc id="desc">Beta is one on the negative half line and two otherwise. For translation by one, the pullback density is two on minus one inclusive to zero exclusive. The pushforward density is one half on zero inclusive to one exclusive. Both are one elsewhere.</desc>
<rect width="1160" height="700" fill="#f8fafc"/>
<text x="32" y="43" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#172033">A jump in the quotient density</text>
<text x="32" y="77" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172033">Exact model: G/H = ℝ,   dμ(t) = β(t) dt,   T(t) = t + 1</text>
<rect x="24" y="101" width="1112" height="168" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="42" y="129" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#172033">The quotient density β</text>
<path d="M70.55000000000001,230 H599.45 M335,230 V151.25" fill="none" stroke="#64748b"/>
<path d="M89,226 V234" stroke="#64748b"/>
<text x="89" y="252" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">-2</text>
<path d="M212,226 V234" stroke="#64748b"/>
<text x="212" y="252" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">-1</text>
<path d="M335,226 V234" stroke="#64748b"/>
<text x="335" y="252" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">0</text>
<path d="M458,226 V234" stroke="#64748b"/>
<text x="458" y="252" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">1</text>
<path d="M581,226 V234" stroke="#64748b"/>
<text x="581" y="252" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">2</text>
<text x="611.75" y="235" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#172033">t</text>
<text x="48.40999999999997" y="217.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">½</text>
<text x="48.40999999999997" y="200" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">1</text>
<text x="48.40999999999997" y="165" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">2</text>
<path d="M89,195 H335" fill="none" stroke="#0f766e" stroke-width="4"/>
<path d="M335,160 H581" fill="none" stroke="#0f766e" stroke-width="4"/>
<circle cx="335" cy="195" r="5" fill="white" stroke="#0f766e" stroke-width="2"/>
<circle cx="335" cy="160" r="5" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
<text x="678" y="152" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">β(t) = 1 for t &lt; 0;  β(t) = 2 for t ≥ 0</text>
<text x="678" y="184" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Upstairs: φ(a,t) = a β(t)</text>
<text x="678" y="216" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Downstairs: dμ(t) = β(t) dt</text>
<rect x="24" y="280" width="1112" height="168" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="42" y="308" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Pullback on sets: E ↦ μ(T E)</text>
<path d="M70.55000000000001,409 H599.45 M335,409 V330.25" fill="none" stroke="#64748b"/>
<path d="M89,405 V413" stroke="#64748b"/>
<text x="89" y="431" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">-2</text>
<path d="M212,405 V413" stroke="#64748b"/>
<text x="212" y="431" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">-1</text>
<path d="M335,405 V413" stroke="#64748b"/>
<text x="335" y="431" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">0</text>
<path d="M458,405 V413" stroke="#64748b"/>
<text x="458" y="431" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">1</text>
<path d="M581,405 V413" stroke="#64748b"/>
<text x="581" y="431" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">2</text>
<text x="611.75" y="414" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#172033">t</text>
<text x="48.40999999999997" y="396.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">½</text>
<text x="48.40999999999997" y="379" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">1</text>
<text x="48.40999999999997" y="344" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">2</text>
<path d="M89,374 H212" fill="none" stroke="#b45309" stroke-width="4"/>
<path d="M212,339 H335" fill="none" stroke="#b45309" stroke-width="4"/>
<path d="M335,374 H581" fill="none" stroke="#b45309" stroke-width="4"/>
<circle cx="212" cy="374" r="5" fill="white" stroke="#b45309" stroke-width="2"/>
<circle cx="212" cy="339" r="5" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<circle cx="335" cy="339" r="5" fill="white" stroke="#b45309" stroke-width="2"/>
<circle cx="335" cy="374" r="5" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<text x="678" y="331" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">d(μ ∘ T) / dμ (t) = β(t + 1) / β(t)</text>
<text x="678" y="363" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Value 2 on [−1, 0)</text>
<text x="678" y="395" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Value 1 everywhere else</text>
<rect x="24" y="459" width="1112" height="168" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="42" y="487" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#172033">Pushforward: E ↦ μ(T⁻¹ E)</text>
<path d="M70.55000000000001,588 H599.45 M335,588 V509.25" fill="none" stroke="#64748b"/>
<path d="M89,584 V592" stroke="#64748b"/>
<text x="89" y="610" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">-2</text>
<path d="M212,584 V592" stroke="#64748b"/>
<text x="212" y="610" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">-1</text>
<path d="M335,584 V592" stroke="#64748b"/>
<text x="335" y="610" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">0</text>
<path d="M458,584 V592" stroke="#64748b"/>
<text x="458" y="610" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">1</text>
<path d="M581,584 V592" stroke="#64748b"/>
<text x="581" y="610" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172033">2</text>
<text x="611.75" y="593" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#172033">t</text>
<text x="48.40999999999997" y="575.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">½</text>
<text x="48.40999999999997" y="558" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">1</text>
<text x="48.40999999999997" y="523" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#172033">2</text>
<path d="M89,553 H335" fill="none" stroke="#7c3aed" stroke-width="4"/>
<path d="M335,570.5 H458" fill="none" stroke="#7c3aed" stroke-width="4"/>
<path d="M458,553 H581" fill="none" stroke="#7c3aed" stroke-width="4"/>
<circle cx="335" cy="553" r="5" fill="white" stroke="#7c3aed" stroke-width="2"/>
<circle cx="335" cy="570.5" r="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<circle cx="458" cy="570.5" r="5" fill="white" stroke="#7c3aed" stroke-width="2"/>
<circle cx="458" cy="553" r="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="678" y="510" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">d(T* μ) / dμ (t) = β(t − 1) / β(t)</text>
<text x="678" y="542" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Value ½ on [0, 1)</text>
<text x="678" y="574" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#172033">Value 1 everywhere else</text>
<text x="32" y="657" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172033">Filled endpoints are included. Horizontal pieces continue beyond the displayed window.</text>
<text x="32" y="682" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#172033">Proof: OA-FLOW-L43, QM2–QM10. Translation changes both the argument and the density ratio.</text>
</svg>
