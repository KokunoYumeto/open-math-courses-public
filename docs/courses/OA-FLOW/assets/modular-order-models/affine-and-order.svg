<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Affine Haar masses and exact modular coefficient order</title>
<desc id="desc">Upper panel: the affine group with Haar density a^-2 da db. For g=(2,0), rectangles Eg^-1, E and Eg have a intervals [1/2,1], [1,2] and [2,4], and b interval [0,1]. Their Haar masses are 1,1/2,1/4. The action on 1_E has support Eg^-1. Lower panel: exact Hadamard example; the correct left-coefficient product is [[0,1],[-1,0]], the reversed product is diag(-i,i), and the difference has norm sqrt(2). Proofs MO18 and MO22-MO26.</desc>
<rect width="1100" height="700" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#182635">
<text x="28" y="34" font-size="22" font-weight="bold">Haar normalization and coefficient order</text>
<text x="28" y="64" font-size="16">Affine group: (a,b)(a′,b′) = (aa′, b + ab′), dm = a⁻² da db, g = (2,0).</text>
<text x="28" y="100" font-size="18" font-weight="bold">Three rectangles with different Haar masses</text>
<path d="M75 280H805 M75 280V130" fill="none" stroke="#718494" stroke-width="1.5"/>
<text x="56" y="132" font-size="15">b</text><text x="813" y="285" font-size="15">a</text>
<rect x="160" y="160" width="85" height="120" fill="#fff0df" stroke="#aa5719" stroke-width="2"/>
<rect x="245" y="160" width="170" height="120" fill="#e8f3fa" stroke="#25658d" stroke-width="2"/>
<rect x="415" y="160" width="340" height="120" fill="#edf3e9" stroke="#427439" stroke-width="2"/>
<text x="202.5" y="194" text-anchor="middle" font-size="18">Eg⁻¹</text>
<text x="202.5" y="225" text-anchor="middle" font-size="17">mass 1</text>
<text x="330" y="194" text-anchor="middle" font-size="18">E</text>
<text x="330" y="225" text-anchor="middle" font-size="17">mass 1/2</text>
<text x="585" y="194" text-anchor="middle" font-size="18">Eg</text>
<text x="585" y="225" text-anchor="middle" font-size="17">mass 1/4</text>
<text x="55" y="165" font-size="14">1</text><text x="59" y="299" font-size="14">0</text>
<text x="160" y="301" text-anchor="middle" font-size="14">1/2</text>
<text x="245" y="301" text-anchor="middle" font-size="14">1</text>
<text x="415" y="301" text-anchor="middle" font-size="14">2</text>
<text x="755" y="301" text-anchor="middle" font-size="14">4</text>
<text x="842" y="175" font-size="16">α_g 1_E = 1_Eg⁻¹</text>
<text x="842" y="207" font-size="16">φ ∘ α_g = 2φ</text>
<text x="842" y="239" font-size="16">δ(g) = 1/2</text>
<text x="28" y="337" font-size="16">Right-translation model: Haar phase 2⁻ⁱʳ × weight coefficient 2ⁱʳ = 1.</text>
<text x="28" y="364" font-size="15">The labeled masses use a⁻² da db. Euclidean rectangle area is not Haar mass.</text>
<path d="M28 386H1072" stroke="#b9c6cf"/>
<text x="28" y="422" font-size="18" font-weight="bold">Hadamard action: the left coefficient has a reversed time law</text>
<text x="28" y="450" font-size="16">D = diag(1,4), H = (1/√2)[1  1; 1 −1], τ = π/(2 log 4).</text>
<rect x="28" y="474" width="510" height="143" rx="8" fill="#e8f3fa" stroke="#25658d"/>
<rect x="562" y="474" width="510" height="143" rx="8" fill="#fff0df" stroke="#aa5719"/>
<text x="283" y="505" text-anchor="middle" font-size="18">σ_τ(ℓ_τ) ℓ_τ = ℓ_2τ</text>
<text x="817" y="505" text-anchor="middle" font-size="18">ℓ_τ σ_τ(ℓ_τ)</text>
<text x="260" y="551" text-anchor="middle" font-size="23">0</text><text x="308" y="551" text-anchor="middle" font-size="23">1</text>
<text x="260" y="587" text-anchor="middle" font-size="23">−1</text><text x="308" y="587" text-anchor="middle" font-size="23">0</text>
<path d="M237 525H227V598H237 M331 525H341V598H331" fill="none" stroke="#182635" stroke-width="2"/>
<text x="794" y="551" text-anchor="middle" font-size="23">−i</text><text x="842" y="551" text-anchor="middle" font-size="23">0</text>
<text x="794" y="587" text-anchor="middle" font-size="23">0</text><text x="842" y="587" text-anchor="middle" font-size="23">i</text>
<path d="M771 525H761V598H771 M865 525H875V598H865" fill="none" stroke="#182635" stroke-width="2"/>
<text x="28" y="651" font-size="18">Exact difference E = [i  1; −1 −i], E*E = 2I, so ‖E‖ = √2.</text>
<text x="28" y="682" font-size="14">Affine normalization: MO9, MO15–MO18. Matrix identities and the exact error: MO22–MO26.</text>
</g></svg>
