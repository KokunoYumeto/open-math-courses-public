<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" role="img" aria-labelledby="title desc">
<title id="title">One commutator, two different multiplier algebras</title>
<desc id="desc">The projection P onto the even basis vectors implements i[P,a] in M(K)=B(H), but is outside A=K plus scalar identity and its multiplier algebra. The flow on A is inner exactly at integer multiples of two pi.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39556b"/></marker></defs>
<rect width="1060" height="560" rx="18" fill="#f7fafc"/>
<g font-family="Arial, sans-serif" fill="#173447">
<text x="40" y="45" font-size="27" font-weight="bold">The same commutator on K and on K + ℂI</text>
<text x="40" y="77" font-size="18">H = ℓ²(ℕ),   P projects onto the even basis vectors,   d(a) = i[P,a]</text>
<rect x="40" y="108" width="460" height="180" rx="12" fill="#e4f3ed" stroke="#378566" stroke-width="2"/>
<text x="64" y="142" font-size="23" font-weight="bold">Compact ideal K</text>
<text x="64" y="179" font-size="22">M(K) = B(H),   P ∈ M(K)</text>
<text x="64" y="218" font-size="21">d is multiplier-inner on K.</text>
<text x="64" y="254" font-size="18">Every Uₜ = I + (eⁱᵗ − 1)P lies in M(K).</text>
<rect x="560" y="108" width="460" height="180" rx="12" fill="#fff0e4" stroke="#b06c37" stroke-width="2"/>
<text x="584" y="142" font-size="23" font-weight="bold">Unitization A = K + ℂI</text>
<text x="584" y="179" font-size="22">M(A) = A,   P ∉ A</text>
<text x="584" y="218" font-size="21">d is outer on A;   ‖d‖ = 1.</text>
<text x="584" y="254" font-size="18">Ad(Uₜ) is inner exactly when t ∈ 2πℤ.</text>
<path d="M505 199H550" stroke="#39556b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="333" font-size="22" font-weight="bold">Why scalar correction cannot put P in A</text>
<text x="40" y="365" font-size="18">For every compact k, ‖keₙ‖ → 0. If P = k + λI, its two tails would force:</text>
<rect x="40" y="389" width="460" height="82" rx="10" fill="#e7edf7"/>
<text x="64" y="420" font-size="20">Odd basis vectors:   Pe₂ₙ₋₁ = 0</text>
<text x="64" y="450" font-size="20">‖ke₂ₙ₋₁‖ = |λ| → 0,   so λ = 0.</text>
<rect x="560" y="389" width="460" height="82" rx="10" fill="#e7edf7"/>
<text x="584" y="420" font-size="20">Even basis vectors:   Pe₂ₙ = e₂ₙ</text>
<text x="584" y="450" font-size="20">‖ke₂ₙ‖ = |1 − λ| → 0,   so λ = 1.</text>
<text x="40" y="515" font-size="18">Proofs: KU2, KU8, KU11, KU14–KU18 in Lesson 137.</text>
<text x="40" y="543" font-size="16">The operator-norm continuous flow preserves both algebras; the allowed implementers differ.</text>
</g></svg>
