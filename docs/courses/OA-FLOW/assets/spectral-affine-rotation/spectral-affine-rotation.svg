<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Spectral transport and the tracial fixed mode</title>
<desc id="desc">Function arguments and base points move in inverse directions. In a five-by-five window of integer Fourier indices, the two irrational conjugation tests intersect only at the origin.</desc>
<rect width="1200" height="690" fill="#f8fafc"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:17px}.tiny{font-size:15px}</style>
<text x="42" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033" text-anchor="start">Spectral transport and the tracial fixed mode</text>
<text x="42" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Exact formulas: Propositions 2 and 6, Theorems 4 and 7</text>
<rect x="30" y="112" width="565" height="500" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="615" y="112" width="555" height="500" rx="14" fill="white" stroke="#cbd5e1"/>
<text x="54" y="149" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="start">A. Scalar argument and point motion</text>
<text x="54" y="191" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Rotation: z(t) = exp(−2πit)</text>
<text x="70" y="231" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Function:   f(t) ↦ f(t − θ)</text>
<text x="70" y="266" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Base point: t ↦ t + θ</text>
<text x="70" y="302" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">u v u* = exp(2πiθ) v</text>
<line x1="54" y1="329" x2="570" y2="329" stroke="#cbd5e1"/>
<text x="54" y="366" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Affine: (a,b)(c,d) = (ac,b + ad)</text>
<text x="70" y="407" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Function:   f(p) ↦ f(ap)</text>
<text x="70" y="442" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Base point: p ↦ p/a</text>
<text x="70" y="482" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Fibre arrow H(x) → H(x/a):</text>
<text x="90" y="520" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">exp(ibx/a) Cₐ(x/a)</text>
<text x="70" y="569" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Global norm factor: √jₐ(p)</text>
<text x="639" y="149" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="start">B. Both conjugations fix only 1</text>
<text x="639" y="185" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Basis vector: uᵐvⁿ    •    θ irrational</text>
<line x1="759" y1="382" x2="1045" y2="382" stroke="#64748b" stroke-width="1.5"/>
<line x1="895" y1="518" x2="895" y2="231" stroke="#64748b" stroke-width="1.5"/>
<text x="1059" y="389" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">m</text>
<text x="904" y="231" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">n</text>
<circle cx="787" cy="490" r="6" fill="#cbd5e1"/>
<circle cx="787" cy="436" r="6" fill="#cbd5e1"/>
<circle cx="787" cy="382" r="6" fill="#c2410c"/>
<circle cx="787" cy="328" r="6" fill="#cbd5e1"/>
<circle cx="787" cy="274" r="6" fill="#cbd5e1"/>
<text x="787" y="411" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">-2</text>
<text x="878" y="495" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="end">-2</text>
<circle cx="841" cy="490" r="6" fill="#cbd5e1"/>
<circle cx="841" cy="436" r="6" fill="#cbd5e1"/>
<circle cx="841" cy="382" r="6" fill="#c2410c"/>
<circle cx="841" cy="328" r="6" fill="#cbd5e1"/>
<circle cx="841" cy="274" r="6" fill="#cbd5e1"/>
<text x="841" y="411" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">-1</text>
<text x="878" y="441" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="end">-1</text>
<circle cx="895" cy="490" r="6" fill="#0f766e"/>
<circle cx="895" cy="436" r="6" fill="#0f766e"/>
<circle cx="895" cy="382" r="10" fill="#7c3aed"/>
<circle cx="895" cy="328" r="6" fill="#0f766e"/>
<circle cx="895" cy="274" r="6" fill="#0f766e"/>
<circle cx="949" cy="490" r="6" fill="#cbd5e1"/>
<circle cx="949" cy="436" r="6" fill="#cbd5e1"/>
<circle cx="949" cy="382" r="6" fill="#c2410c"/>
<circle cx="949" cy="328" r="6" fill="#cbd5e1"/>
<circle cx="949" cy="274" r="6" fill="#cbd5e1"/>
<text x="949" y="411" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">1</text>
<text x="878" y="333" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="end">1</text>
<circle cx="1003" cy="490" r="6" fill="#cbd5e1"/>
<circle cx="1003" cy="436" r="6" fill="#cbd5e1"/>
<circle cx="1003" cy="382" r="6" fill="#c2410c"/>
<circle cx="1003" cy="328" r="6" fill="#cbd5e1"/>
<circle cx="1003" cy="274" r="6" fill="#cbd5e1"/>
<text x="1003" y="411" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">2</text>
<text x="878" y="279" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="end">2</text>
<text x="910" y="409" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#172033" text-anchor="start">0</text>
<text x="641" y="548" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Ad u: eigenvalue qⁿ = 1 exactly when n = 0</text>
<text x="641" y="577" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Ad v: eigenvalue q⁻ᵐ = 1 exactly when m = 0</text>
<text x="42" y="650" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#172033" text-anchor="start">The dots show −2 ≤ m,n ≤ 2. The proof applies to every (m,n) ∈ ℤ².</text>
</svg>
