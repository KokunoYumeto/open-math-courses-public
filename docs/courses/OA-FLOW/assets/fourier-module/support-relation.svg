<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="title desc">
<title id="title">A singleton frequency becomes a diagonal coefficient</title>
<desc id="desc">Exact permutation matrices on the cyclic group of order five. Left: u_2 has a one precisely when r equals q plus two modulo five. Right: u_2 u_2 star is the identity. All other entries are zero.</desc>
