<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">One suspension, two return sections</title>
  <desc id="desc">The unit roof over an irrational rotation is divided at height one half. The two-level return map first changes level and then rotates the base. The coordinate map v equals u plus j over two preserves time. The two-level base has a minus-one eigenfunction; the original rotation does not.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#243c5a"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#a44c10"/></marker>
  </defs>
  <rect width="1100" height="660" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#18314e">
    <text x="48" y="45" font-size="27" font-weight="bold">One flow, different return maps</text>
    <text x="48" y="77" font-size="18">A(x) = x + α on the circle, with α irrational. Vertical motion has speed one.</text>
    <text x="96" y="124" font-size="21" font-weight="bold">One return level: B₁ = A</text>
    <text x="638" y="124" font-size="21" font-weight="bold">Two return levels: B₂</text>
    <rect x="96" y="160" width="300" height="280" rx="3" fill="#edf3f8" stroke="#243c5a" stroke-width="2"/>
    <path d="M96 300 H396" stroke="#a44c10" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M96 440 H396" stroke="#243c5a" stroke-width="5"/>
    <text x="53" y="447" font-size="18">0</text><text x="43" y="307" font-size="18">1/2</text><text x="53" y="167" font-size="18">1</text>
    <text x="112" y="188" font-size="17">top identified with (Ax, 0)</text>
    <path d="M246 407 V211" stroke="#243c5a" stroke-width="3"/>
    <path d="M246 204 L239 219 L253 219 Z" fill="#243c5a"/>
    <text x="263" y="365" font-size="18">v</text>
    <text x="112" y="470" font-size="18">Section: v = 0; return time 1</text>
    <rect x="638" y="160" width="300" height="140" fill="#fff2dc" stroke="#243c5a" stroke-width="2"/>
    <rect x="638" y="300" width="300" height="140" fill="#e2f0f3" stroke="#243c5a" stroke-width="2"/>
    <path d="M638 300 H938 M638 440 H938" stroke="#a44c10" stroke-width="5"/>
    <text x="657" y="190" font-size="18">j = 1,  v = u + 1/2</text>
    <text x="657" y="333" font-size="18">j = 0,  v = u</text>
    <text x="657" y="221" font-size="17">0 ≤ u &lt; 1/2</text>
    <text x="657" y="364" font-size="17">0 ≤ u &lt; 1/2</text>
    <path d="M885 412 V251" stroke="#a44c10" stroke-width="3"/>
    <path d="M885 244 L878 259 L892 259 Z" fill="#a44c10"/>
    <path d="M940 165 H994 V437 H941" fill="none" stroke="#243c5a" stroke-width="2.5"/>
    <path d="M935 437 L950 430 L950 444 Z" fill="#243c5a"/>
    <text x="1017" y="337" transform="rotate(-90 1017 337)" font-size="18">top return: x → Ax</text>
    <text x="647" y="470" font-size="18">Sections: v = 0, 1/2; return time 1/2</text>
    <path d="M620 300 H421" stroke="#243c5a" stroke-width="2.5"/>
    <path d="M414 300 L429 293 L429 307 Z" fill="#243c5a"/>
    <text x="465" y="266" font-size="21" font-weight="bold">Ξ₂</text>
    <text x="437" y="334" font-size="18">v = u + j/2</text>
    <text x="425" y="364" font-size="16">same time parameter</text>
    <rect x="48" y="508" width="1004" height="112" rx="8" fill="#f3f5f8"/>
    <text x="70" y="540" font-size="18">Middle return: B₂(x, 0) = (x, 1). Top return: B₂(x, 1) = (Ax, 0).</text>
    <text x="70" y="571" font-size="18">h(x, j) = (−1)ʲ satisfies h ∘ B₂ = −h. The irrational rotation has no −1 eigenvalue.</text>
    <text x="70" y="602" font-size="18" font-weight="bold">The suspensions are conjugate; their return transformations are not.</text>
    <text x="48" y="644" font-size="14">Exact heights; schematic circle width. Full proof and probability normalization: NU1–NU11 in the lesson.</text>
  </g>
</svg>
