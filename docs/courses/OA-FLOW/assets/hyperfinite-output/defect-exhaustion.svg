<polyline points="636.0,194.0 694.0,210.25 752.0,226.5 810.0,242.75 868.0,259.0 926.0,275.25 984.0,291.5 1042.0,307.75 1100.0,324.0" fill="none" stroke="#ba5e15" stroke-width="3"/>
<circle cx="636.0" cy="194.0" r="3.5" fill="#ba5e15"/>
