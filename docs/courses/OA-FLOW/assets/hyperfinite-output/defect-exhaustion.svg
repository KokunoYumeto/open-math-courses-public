<text font-family="Arial,sans-serif" fill="#18253a" x="599" y="512" font-size="14">trace: 3^(-n)</text>
<line x1="754" y1="507" x2="772" y2="507" stroke="#ba5e15" stroke-width="3"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="779" y="512" font-size="14">Hilbert: 3^(-n/2)</text>
<line x1="977" y1="507" x2="995" y2="507" stroke="#734b98" stroke-width="3"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="1002" y="512" font-size="14">map norm: 1</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="34" y="563" font-size="16">HADT6 is attained at x = 1: the Hilbert error tends to zero while the tail-map norm remains one.</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="34" y="587" font-size="14">This geometric rate belongs to the displayed example. General defect matching gives r_n ↓ 0 without a fixed rate.</text>
</svg>
