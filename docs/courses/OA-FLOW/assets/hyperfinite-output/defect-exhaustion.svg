<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
<title id="title">Finite residuals: small trace does not force small operator norm</title>
<desc id="desc">For interval projections h_n on (0,3 to the minus n], the trace equals 3 to the minus n, the trace Hilbert norm equals 3 to the minus n over two, and the operator and tail-map norms stay one. Left: residual intervals for n zero through four. Right: exact values at n zero through eight on a base-three logarithmic vertical axis.</desc>
<rect width="1160" height="600" fill="#f5f7fb"/>

<text font-family="Arial,sans-serif" fill="#18253a" x="34" y="43" font-size="25" font-weight="bold">Finite residuals in a diffuse algebra</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="34" y="72" font-size="16">h_n = 1_(0, 3^(-n)]   ·   B_n(x) = h_n x   ·   normalized Lebesgue trace</text>
<rect x="24" y="95" width="510" height="435" rx="12" fill="white"/>
<rect x="550" y="95" width="586" height="435" rx="12" fill="white"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="130" font-size="20" font-weight="bold">The remaining interval</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="158" font-size="14">Each step removes two thirds of the remaining mass.</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="574" y="130" font-size="20" font-weight="bold">Three different sizes</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="574" y="158" font-size="14">Exact values at integer stages; base-three logarithmic axis.</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="211" font-size="16">n = 0</text>
<line x1="113" y1="205" x2="383" y2="205" stroke="#dce5f0" stroke-width="18"/>
<line x1="113" y1="205" x2="383.00000000" y2="205" stroke="#156d9b" stroke-width="18"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="401" y="211" font-size="16">1</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="267" font-size="16">n = 1</text>
<line x1="113" y1="261" x2="383" y2="261" stroke="#dce5f0" stroke-width="18"/>
<line x1="113" y1="261" x2="203.00000000" y2="261" stroke="#156d9b" stroke-width="18"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="401" y="267" font-size="16">1/3</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="323" font-size="16">n = 2</text>
<line x1="113" y1="317" x2="383" y2="317" stroke="#dce5f0" stroke-width="18"/>
<line x1="113" y1="317" x2="143.00000000" y2="317" stroke="#156d9b" stroke-width="18"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="401" y="323" font-size="16">1/9</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="379" font-size="16">n = 3</text>
<line x1="113" y1="373" x2="383" y2="373" stroke="#dce5f0" stroke-width="18"/>
<line x1="113" y1="373" x2="123.00000000" y2="373" stroke="#156d9b" stroke-width="18"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="401" y="379" font-size="16">1/27</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="435" font-size="16">n = 4</text>
<line x1="113" y1="429" x2="383" y2="429" stroke="#dce5f0" stroke-width="18"/>
<line x1="113" y1="429" x2="116.33333333" y2="429" stroke="#156d9b" stroke-width="18"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="401" y="435" font-size="16">1/81</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="112" y="476" font-size="14">0</text><text font-family="Arial,sans-serif" fill="#18253a" x="378" y="476" font-size="14">1</text>
<text font-family="Arial,sans-serif" fill="#18253a" x="44" y="506" font-size="14">Trace = length. Every nonzero projection still has norm 1.</text>
<line x1="636" y1="194.0" x2="1100" y2="194.0" stroke="#d4dce7" stroke-width="1"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="624" y="199.0" text-anchor="end" font-size="14">1</text>
