<text font-family="Arial,sans-serif" fill="#18253a" x="868.0" y="478" text-anchor="middle" font-size="14">4</text>
<line x1="926.0" y1="194" x2="926.0" y2="454" stroke="#d4dce7" stroke-width="1"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="926.0" y="478" text-anchor="middle" font-size="14">5</text>
<line x1="984.0" y1="194" x2="984.0" y2="454" stroke="#d4dce7" stroke-width="1"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="984.0" y="478" text-anchor="middle" font-size="14">6</text>
<line x1="1042.0" y1="194" x2="1042.0" y2="454" stroke="#d4dce7" stroke-width="1"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="1042.0" y="478" text-anchor="middle" font-size="14">7</text>
<line x1="1100.0" y1="194" x2="1100.0" y2="454" stroke="#d4dce7" stroke-width="1"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="1100.0" y="478" text-anchor="middle" font-size="14">8</text>
<polyline points="636.0,194.0 694.0,226.5 752.0,259.0 810.0,291.5 868.0,324.0 926.0,356.5 984.0,389.0 1042.0,421.5 1100.0,454.0" fill="none" stroke="#156d9b" stroke-width="3"/>
