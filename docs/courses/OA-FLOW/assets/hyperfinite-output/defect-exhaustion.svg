<text font-family="Arial,sans-serif" fill="#18253a" x="624" y="264.0" text-anchor="end" font-size="14">3^(-2)</text>
<line x1="636" y1="324.0" x2="1100" y2="324.0" stroke="#d4dce7" stroke-width="1"/>
<text font-family="Arial,sans-serif" fill="#18253a" x="624" y="329.0" text-anchor="end" font-size="14">3^(-4)</text>
