<text x="574" y="147" font-size="21" font-weight="600">b2</text>
<line x1="574" y1="174" x2="574" y2="224" stroke="#334155" stroke-width="2" marker-start="url(#ha-arrow)" marker-end="url(#ha-arrow)"/>
