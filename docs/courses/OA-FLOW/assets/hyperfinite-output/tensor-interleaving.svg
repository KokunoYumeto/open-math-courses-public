<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="ha-fig-title ha-fig-desc">
<title id="ha-fig-title">Odd and even tensor positions give the absorption and its inverse</title>
<desc id="ha-fig-desc">A six-position window of the exact bijection j(1,n)=2n-1 and j(2,n)=2n. Blue entries come from the first copy of R and orange entries from the second. Each double arrow is reversible. The full normal map and inverse follow from the trace Hilbert unitary in HA18 and HA19.</desc>
<defs><marker id="ha-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
