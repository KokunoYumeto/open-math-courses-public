<g font-family="Segoe UI, sans-serif" fill="#0f172a" text-anchor="middle">
<text x="540" y="34" font-size="23" font-weight="600">R tensor R to R: an exact relabeling of tensor positions</text>
<text x="540" y="64" font-size="17">First copy: j(1,n)=2n-1     |     Second copy: j(2,n)=2n</text>
<text x="16" y="132" font-size="15" text-anchor="start">Source</text>
<text x="16" y="263" font-size="15" text-anchor="start">Target</text>
<rect x="86" y="94" width="112" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="142" y="120" font-size="16">(1, 1)</text>
<text x="142" y="147" font-size="21" font-weight="600">a1</text>
