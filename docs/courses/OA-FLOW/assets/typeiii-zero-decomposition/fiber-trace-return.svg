<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">The Jacobian in a suspension return</title>
<desc id="desc">Two schematic roof columns over omega and T omega. A short-strip point of height u maps to the same height after time r(omega). The fiber map is alpha omega. The image-measure Jacobian multiplies the target fiber trace, giving exp(-r(omega)) times the source trace. The full chosen trace at height u is exp(-u) times the coefficient trace.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176c83"/></marker></defs>
<rect width="1040" height="620" fill="#fafbf8"/>
<g font-family="Arial, sans-serif" fill="#172c35">
<text x="40" y="43" font-size="27" font-weight="bold">A coherent return, with its exact trace factor</text>
<text x="40" y="76" font-size="18">One invariant conull base; the chosen field is defined at every height.</text>
<rect x="100" y="180" width="280" height="210" fill="#e4eff2" stroke="#557c88" stroke-width="2"/>
<rect x="660" y="135" width="280" height="255" fill="#e4eff2" stroke="#557c88" stroke-width="2"/>
<rect x="100" y="318" width="280" height="72" fill="#d8eac9"/>
<rect x="660" y="318" width="280" height="72" fill="#d8eac9"/>
<path d="M100 318H380 M660 318H940" fill="none" stroke="#55814c" stroke-width="2" stroke-dasharray="7 5"/>
<text x="114" y="168" font-size="21">roof r(ω)</text>
<text x="674" y="123" font-size="21">roof r(Tω)</text>
<text x="112" y="309" font-size="18">d ≤ δ</text>
<text x="672" y="309" font-size="18">d ≤ δ</text>
<text x="73" y="397" font-size="17">0</text>
<text x="946" y="397" font-size="17">0</text>
<circle cx="240" cy="354" r="7" fill="#176c83"/>
<circle cx="800" cy="354" r="7" fill="#176c83"/>
<path d="M253 354H786" fill="none" stroke="#176c83" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="787,354 775,348 775,360" fill="#176c83"/>
<text x="397" y="333" font-size="22">time r(ω), map α_ω</text>
<text x="148" y="378" font-size="18">(u, ω), 0 ≤ u &lt; d</text>
<text x="719" y="378" font-size="18">(u, Tω)</text>
<text x="168" y="418" font-size="20">source fiber N_ω</text>
<text x="706" y="418" font-size="20">target fiber N_Tω</text>
<text x="402" y="219" font-size="19">S_r(ω)(u, ω) = (u, Tω)</text>
<text x="405" y="250" font-size="17">Exactly one roof crossing</text>
<rect x="40" y="444" width="960" height="133" rx="10" fill="#ffffff" stroke="#aac3c9"/>
<text x="62" y="478" font-size="23">J_T(ω) τ_Tω ∘ α_ω = exp(-r(ω)) τ_ω</text>
<text x="62" y="512" font-size="22">Chosen height trace: τ̂_(u,ω) = exp(-u) τ_ω</text>
<text x="62" y="547" font-size="18">J_T is defined by μ(T E) = ∫_E J_T dμ.  Equalities hold on the whole positive cone.</text>
<text x="40" y="603" font-size="16">Schematic heights. Exact statements and proofs: ZDC-FT12, ZDC-FT16 and ZDC-FT17.</text>
</g>
</svg>

