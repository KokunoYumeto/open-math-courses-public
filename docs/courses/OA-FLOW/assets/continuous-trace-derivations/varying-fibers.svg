<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" role="img" aria-labelledby="title desc">
<title id="title">A continuous-trace algebra with changing fiber dimension</title>
<desc id="desc">For continuous two by two matrix functions whose value at zero is diag(lambda,zero), the irreducible fiber is the complex numbers at zero and M2 at every positive parameter. The constant first-coordinate projection is full and has rank one in every fiber. Both compressed fibers are the complex numbers.</desc>
<rect width="1060" height="580" fill="#f5f8fa"/>
<g font-family="Arial, sans-serif" fill="#183747">
<text x="32" y="38" font-size="25" font-weight="700">One full corner across different fiber dimensions</text>
<text x="32" y="71" font-size="19">A = {a ∈ C([0,1], M₂(ℂ)) : a(0) = diag(λ, 0) for some λ ∈ ℂ}</text>
<g fill="white" stroke="#9cb5c3" stroke-width="1.5">
<rect x="35" y="103" width="460" height="236" rx="12"/>
<rect x="565" y="103" width="460" height="236" rx="12"/>
<rect x="35" y="389" width="460" height="75" rx="12"/>
<rect x="565" y="389" width="460" height="75" rx="12"/>
</g>
<text x="57" y="137" font-size="20" font-weight="700">At t = 0</text>
<text x="587" y="137" font-size="20" font-weight="700">At every 0 &lt; t ≤ 1</text>
<text x="57" y="172" font-size="19">H₀ = ℂ,     π₀(A) = ℂ</text>
<text x="587" y="172" font-size="19">Hₜ = ℂ²,     πₜ(A) = M₂(ℂ)</text>
<g stroke-width="2.5">
<circle cx="265" cy="223" r="22" fill="#16859b" stroke="#086679"/>
<circle cx="735" cy="223" r="22" fill="#16859b" stroke="#086679"/>
<circle cx="865" cy="223" r="22" fill="#e7edf0" stroke="#708e9d"/>
</g>
<g fill="white" font-size="18" font-weight="700" text-anchor="middle">
<text x="265" y="230">1</text><text x="735" y="230">e₁</text>
</g>
<text x="865" y="230" font-size="18" text-anchor="middle">e₂</text>
<text x="57" y="284" font-size="19">π₀(p) = 1</text>
<text x="587" y="284" font-size="19">πₜ(p) = diag(1, 0)</text>
<text x="57" y="315" font-size="17">The selected range has dimension 1.</text>
<text x="587" y="315" font-size="17">The selected range still has dimension 1.</text>
<g stroke="#436575" stroke-width="2.3"><path d="M265 343V379"/><path d="M795 343V379"/></g>
<g fill="#436575"><path d="M258 372L265 384L272 372Z"/><path d="M788 372L795 384L802 372Z"/></g>
<text x="57" y="422" font-size="19" font-weight="700">Compressed fiber: ℂ</text>
<text x="587" y="422" font-size="19" font-weight="700">Compressed fiber: ℂ</text>
<text x="57" y="448" font-size="17">The corner keeps the scalar λ.</text>
<text x="587" y="448" font-size="17">The corner keeps the (1,1) entry.</text>
<text x="35" y="506" font-size="20" font-weight="700" fill="#086679">p = E₁₁ is full;  pAp ≅ C([0,1]).</text>
<text x="35" y="539" font-size="17">Fullness is proved by the four matrix entries and their factorization in CT24.</text>
<text x="35" y="563" font-size="17">The circles depict fiber dimensions, not a fixed trivialization of the whole field. See CT23–CT24.</text>
</g>
</svg>

