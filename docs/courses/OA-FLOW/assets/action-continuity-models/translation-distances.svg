<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Translations: continuity depends on the norm being tested</title>
<desc id="desc">The left panel shows the half-line projection and its translate by one half on the real coordinate window minus one to one and a half. The right panel plots, for minus one to one, the operator-map norm distance two and the projection norm distance one away from zero, each equal to zero at zero. The continuous blue fixed-vector distance is the square root of absolute t divided by two, using the unit vector one over square root two times the indicator of minus one to one. Its two branches are parametrized by t equal to plus or minus two y squared.</desc>
<rect width="1200" height="650" fill="#f8fafc" />
<text x="42" y="45" class="title" font-family="Arial,sans-serif" fill="#172b45" font-size="27" font-weight="700">Translations: continuity depends on the norm being tested</text>
<rect x="28" y="72" width="532" height="492" rx="12" fill="white" stroke="#dbe4ee" />
<rect x="580" y="72" width="592" height="492" rx="12" fill="white" stroke="#dbe4ee" />
<text x="48" y="105" class="panel" font-family="Arial,sans-serif" fill="#172b45" font-size="21" font-weight="700">A half-line and its translate</text>
<text x="68" y="144" class="label" fill="#087f5b" font-family="Arial,sans-serif" font-size="19" font-weight="700">p(r) = 1 for r ≥ 0</text>
<line x1="90" y1="244" x2="520" y2="244" class="axis" stroke="#52657b" stroke-width="1.5" />
<line x1="258" y1="159" x2="258" y2="254" class="grid" stroke="#dbe4ee" stroke-width="1" />
<path d="M90 244 H258 V164 H510" class="curve" stroke="#087f5b" fill="none" stroke-width="4" stroke-linejoin="round" />
<circle cx="258" cy="244" r="5" fill="white" stroke="#087f5b" stroke-width="2" />
<circle cx="258" cy="164" r="5" fill="#087f5b" />
<text x="63" y="250" font-family="Arial,sans-serif" fill="#172b45" font-size="18">0</text><text x="63" y="170" font-family="Arial,sans-serif" fill="#172b45" font-size="18">1</text>
<text x="80" y="270" font-family="Arial,sans-serif" fill="#172b45" font-size="18">−1</text><text x="252" y="270" font-family="Arial,sans-serif" fill="#172b45" font-size="18">0</text><text x="488" y="270" font-family="Arial,sans-serif" fill="#172b45" font-size="18">1.5</text>
<text x="68" y="307" class="label" font-family="Arial,sans-serif" fill="#172b45" font-size="19" font-weight="700">α₁/₂(p)(r) = 1 for r ≥ 1/2</text>
<rect x="258" y="327" width="84" height="80" fill="#fff0cf" />
<line x1="90" y1="407" x2="520" y2="407" class="axis" stroke="#52657b" stroke-width="1.5" />
<line x1="258" y1="322" x2="258" y2="417" class="grid" stroke="#dbe4ee" stroke-width="1" />
<path d="M90 407 H342 V327 H510" class="curve" stroke="#9a6700" fill="none" stroke-width="4" stroke-linejoin="round" />
<circle cx="342" cy="407" r="5" fill="white" stroke="#9a6700" stroke-width="2" />
<circle cx="342" cy="327" r="5" fill="#9a6700" />
<text x="63" y="413" font-family="Arial,sans-serif" fill="#172b45" font-size="18">0</text><text x="63" y="333" font-family="Arial,sans-serif" fill="#172b45" font-size="18">1</text>
<text x="80" y="435" font-family="Arial,sans-serif" fill="#172b45" font-size="18">−1</text><text x="252" y="435" font-family="Arial,sans-serif" fill="#172b45" font-size="18">0</text><text x="325" y="435" font-family="Arial,sans-serif" fill="#172b45" font-size="18">1/2</text><text x="488" y="435" font-family="Arial,sans-serif" fill="#172b45" font-size="18">1.5</text>
<text x="48" y="478" font-family="Arial,sans-serif" fill="#172b45" font-size="18">The projections differ on [0, 1/2).</text>
<text x="48" y="508" font-family="Arial,sans-serif" fill="#172b45" font-size="18">Their distance is 1, however short the interval.</text>
<text x="48" y="539" class="small" font-family="Arial,sans-serif" fill="#172b45" font-size="16">Changing values at endpoints does not change L∞.</text>
<text x="604" y="105" class="panel" font-family="Arial,sans-serif" fill="#172b45" font-size="21" font-weight="700">Three distances along the same orbit</text>
<line x1="685" y1="140" x2="1120" y2="140" class="grid" stroke="#dbe4ee" stroke-width="1" />
<line x1="685" y1="290" x2="1120" y2="290" class="grid" stroke="#dbe4ee" stroke-width="1" />
<line x1="720" y1="130" x2="720" y2="445" class="grid" stroke="#dbe4ee" stroke-width="1" />
<line x1="1120" y1="130" x2="1120" y2="445" class="grid" stroke="#dbe4ee" stroke-width="1" />
<line x1="700" y1="440" x2="1138" y2="440" class="axis" stroke="#52657b" stroke-width="1.5" />
<line x1="920" y1="128" x2="920" y2="453" class="axis" stroke="#52657b" stroke-width="1.5" />
<path d="M720 140 H1120" class="curve" stroke="#7c3aed" fill="none" stroke-width="4" stroke-linejoin="round" />
<path d="M720 290 H1120" class="curve" stroke="#c46a07" fill="none" stroke-width="4" stroke-linejoin="round" />

<path d="M920 440 Q920 386.966991411009 1120 333.933982822018 M920 440 Q920 386.966991411009 720 333.933982822018" class="curve" stroke="#1768b5" fill="none" stroke-width="4" stroke-linejoin="round" />
<circle cx="920" cy="140" r="7" fill="white" stroke="#7c3aed" stroke-width="3" />
<circle cx="920" cy="290" r="7" fill="white" stroke="#c46a07" stroke-width="3" />
<circle cx="920" cy="440" r="5" fill="#172b45" />
<text x="682" y="146" font-family="Arial,sans-serif" fill="#172b45" font-size="18">2</text><text x="682" y="296" font-family="Arial,sans-serif" fill="#172b45" font-size="18">1</text><text x="682" y="446" font-family="Arial,sans-serif" fill="#172b45" font-size="18">0</text>
<text x="709" y="468" font-family="Arial,sans-serif" fill="#172b45" font-size="18">−1</text><text x="914" y="468" font-family="Arial,sans-serif" fill="#172b45" font-size="18">0</text><text x="1114" y="468" font-family="Arial,sans-serif" fill="#172b45" font-size="18">1</text><text x="1140" y="445" font-family="Arial,sans-serif" fill="#172b45" font-size="18">t</text>
<text x="736" y="173" font-family="Arial,sans-serif" fill="#7c3aed" font-size="18">‖αₜ − id‖ = 2 for t ≠ 0</text>
<text x="736" y="275" font-family="Arial,sans-serif" fill="#a95605" font-size="18">‖αₜ(p) − p‖ = 1 for t ≠ 0</text>
<text x="736" y="225" font-family="Arial,sans-serif" fill="#1768b5" font-size="18">‖(αₜ(p) − p)ξ‖ = √(|t|/2)</text>
<text x="604" y="507" font-family="Arial,sans-serif" fill="#172b45" font-size="18">ξ = 1/√2 · 1_[−1,1] is one fixed unit vector.</text>
<text x="604" y="538" class="small" font-family="Arial,sans-serif" fill="#172b45" font-size="16">All three distances equal zero at t = 0.</text>
<text x="42" y="601" class="label" font-family="Arial,sans-serif" fill="#172b45" font-size="19" font-weight="700">AM10–AM13: the proof tests every L² vector; the blue curve illustrates one.</text>
<text x="42" y="630" class="small" font-family="Arial,sans-serif" fill="#172b45" font-size="16">The fixed-vector distance tends to zero while both operator-norm distances jump at the identity.</text>
</svg>
