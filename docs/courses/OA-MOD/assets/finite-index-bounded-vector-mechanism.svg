<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="710" viewBox="0 0 1160 710" role="img" aria-labelledby="title desc">
<title id="title">Finite index recovers bounded elements from bounded module tests</title>
<desc id="desc">A vector x in L2 of M with bounded right N tests defines xe in the basic construction B. At finite index d, the coefficient recovery map d F applied to xe returns x in M with norm at most square root d times the test norm. A right module unitary with n full coordinates and one projection coordinate yields a partial orthonormal basis.</desc>
<rect width="1160" height="710" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#162d43">
<text x="44" y="53" font-size="28" font-weight="bold">Bounded module tests become bounded algebra elements</text>
<text x="44" y="88" font-size="19">N ⊂ M are II₁ factors · e projects L²(M) onto L²(N) · B = R(N)′</text>
<rect x="40" y="122" width="330" height="194" rx="13" fill="#e5eefb" stroke="#4f739c"/>
<text x="60" y="157" font-size="18" font-weight="bold">TEST THE SMALLER ALGEBRA</text>
<text x="60" y="203" font-size="27">x ∈ L²(M)</text>
<text x="60" y="243" font-size="20">C = sup ‖xy‖₂ &lt; ∞</text>
<text x="60" y="275" font-size="18">y ∈ N, ‖y‖₂ ≤ 1</text>
<text x="60" y="300" font-size="15">Dense-domain extension · FBV-02</text>
<path d="M378 217h22m-9-9 9 9-9 9" fill="none" stroke="#4f739c" stroke-width="3"/>
<rect x="410" y="122" width="330" height="194" rx="13" fill="#e3f3eb" stroke="#44876d"/>
<text x="430" y="157" font-size="18" font-weight="bold">THE FULL OPERATOR</text>
<text x="430" y="203" font-size="27">X = xe ∈ B</text>
<text x="430" y="243" font-size="20">Xe = X,   ‖X‖ = C</text>
<text x="430" y="275" font-size="18">eH ⊂ D(Lₓ),   Lₓe = X</text>
<text x="430" y="300" font-size="15">Closed graph domains · FBV-02</text>
<path d="M748 217h22m-9-9 9 9-9 9" fill="none" stroke="#44876d" stroke-width="3"/>
<rect x="780" y="122" width="340" height="194" rx="13" fill="#f2e8f9" stroke="#8c61a2"/>
<text x="800" y="157" font-size="18" font-weight="bold">RECOVER THE COEFFICIENT</text>
<text x="800" y="203" font-size="27">x = d F(X) ∈ M</text>
<text x="800" y="243" font-size="23">‖x‖ ≤ √d ‖X‖</text>
<text x="800" y="275" font-size="18">Requires d = [M:N] &lt; ∞</text>
<text x="800" y="300" font-size="15">Positive expectation bound · FBV-03</text>
<rect x="40" y="355" width="1080" height="206" rx="13" fill="#eef2f6" stroke="#708493"/>
<text x="62" y="391" font-size="20" font-weight="bold">FINITE RIGHT-MODULE COORDINATES</text>
<text x="62" y="436" font-size="24">d = n + s,   0 ≤ s &lt; 1,   τ(p) = s</text>
<text x="62" y="477" font-size="25">L²(M) ≅ L²(N) ⊕ ⋯ ⊕ L²(N) ⊕ pL²(N)</text>
<text x="62" y="516" font-size="20">n full coordinates · aᵢ = U*εᵢ ∈ M · x = Σᵢ aᵢ E(aᵢ*x)</text>
<text x="62" y="544" font-size="16">Right coefficients lie in pᵢN. A zero final projection contributes no coordinate. · FBV-05</text>
<rect x="40" y="590" width="1080" height="77" rx="13" fill="#fff2d8" stroke="#a8863b"/>
<text x="62" y="622" font-size="20">Same index: Idx(E) = [M:N], including ∞. · FBV-06</text>
<text x="62" y="651" font-size="17">At infinite index, xe can be bounded while x is unbounded. · FBV-07</text>
<text x="44" y="694" font-size="14">F is the normalized expectation B → M. Given index d; no claim that every real d occurs. Original figure · CC0-1.0.</text>
</g>
</svg>
