<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490">
<rect width="1000" height="490" rx="12" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif" fill="#123247">
<text x="30" y="35" font-size="24" font-weight="bold">Recover a matrix from two basic-construction columns</text>
<text x="30" y="66" font-size="19">N = diagonal matrices ⊂ M₂;  B = M₂ ⊕ M₂;  λ = 1/2</text>
<rect x="30" y="99" width="260" height="166" rx="8" fill="#e2edff" stroke="#6894d6"/>
<text x="50" y="130" font-size="21">Z₁ = E₁₁</text>
<text x="100" y="177" font-size="27" font-family="monospace">[1  0]</text>
<text x="100" y="215" font-size="27" font-family="monospace">[0  0]</text>
<text x="50" y="246" font-size="18">Keep the first column</text>
<rect x="320" y="99" width="260" height="166" rx="8" fill="#dcf5eb" stroke="#55a28c"/>
<text x="340" y="130" font-size="21">Z₂ = E₁₂</text>
<text x="390" y="177" font-size="27" font-family="monospace">[0  1]</text>
<text x="390" y="215" font-size="27" font-family="monospace">[0  0]</text>
<text x="340" y="246" font-size="18">Keep the second column</text>
<path d="M600 178 H655 L645 171 M655 178 L645 185" fill="none" stroke="#2868a8" stroke-width="3"/>
<rect x="680" y="99" width="290" height="166" rx="8" fill="#fff0cf" stroke="#d6a64b"/>
<text x="700" y="130" font-size="21">R(Z₁,Z₂) = Z₁E₁₁ + Z₂E₂₂</text>
<text x="770" y="177" font-size="27" font-family="monospace">[1  1]</text>
<text x="770" y="215" font-size="27" font-family="monospace">[0  0]</text>
<text x="700" y="246" font-size="18">Its norm is √2 = λ⁻¹ᐟ²</text>
<text x="30" y="302" font-size="21" font-weight="bold">Input norm: max(‖Z₁‖, ‖Z₂‖) = 1.  The recovery bound is attained.</text>
<text x="30" y="345" font-size="19">A trace α tr₂ ⊕ (1−α) tr₂ extends tr₂ on M for every 0 &lt; α &lt; 1.</text>
<text x="30" y="377" font-size="19">But Fα(e) = diag(α, 1−α) is scalar only at α = 1/2.</text>
<text x="30" y="409" font-size="19">The center of B is present throughout the general recovery proof.</text>
<text x="30" y="451" font-size="16">Proofs: MCR-02–04 and MCR-07. Source comparison: Takesaki III, XIX.2, pp.433–435.</text>
<text x="30" y="477" font-size="16">The selected columns form an actual 2 × 2 matrix. Earlier example: matrix Markov calculus, Figure 8.1.</text>
</g></svg>
