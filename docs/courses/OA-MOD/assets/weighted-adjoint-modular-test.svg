<svg xmlns="http://www.w3.org/2000/svg" width="940" height="570" viewBox="0 0 940 570" role="img" aria-labelledby="title desc">
<title id="title">Two state-weighted adjoints of the same dephasing map</title>
<desc id="desc">For k=I/2+X/4 and h=I/2, the symmetric adjoint R has reverse vector states with coordinates (1/2,0,plus or minus square-root-three over two). They are drawn on the exact X-Z unit circle. R sends Y to zero; the GNS adjoint G sends the self-adjoint Y to minus i Z over two and is not positive.</desc>
<!-- Exact geometry: centre (235,300), radius 160. State coordinates
     (1/2, ±sqrt(3)/2) map to (315, 300 ∓ 80 sqrt(3)).
     Decimal SVG coordinates below are display samples of these exact points. -->
<rect x="1" y="1" width="938" height="568" rx="14" fill="#f7fafc" stroke="#afc4d3"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#143c52">
<text x="26" y="37" font-size="25" font-weight="600">A positive reverse map depends on the state pairing</text>
<text x="26" y="70" font-size="20">T keeps diagonal entries; k = I/2 + X/4; h = diag(k) = I/2</text>
<rect x="22" y="95" width="423" height="443" rx="12" fill="white" stroke="#b4c9d7"/>
<text x="42" y="126" font-size="21" font-weight="600">The two reverse vector states</text>
<circle cx="235" cy="300" r="160" fill="#f0f7f5" stroke="#8da9a4" stroke-width="2"/>
<path d="M55 300H421 M235 480V139" stroke="#526c7a" stroke-width="1.5"/>
<path d="M421 300l-9 -5v10z M235 139l-5 9h10z" fill="#526c7a"/>
<text x="413" y="324" font-size="19">X</text>
<text x="247" y="150" font-size="19">Z</text>
<text x="219" y="322" font-size="17">0</text>
<text x="396" y="290" font-size="17">1</text>
<text x="216" y="470" font-size="17">−1</text>
<path d="M235 300L315 161.43593539449 M235 300L315 438.56406460551" stroke="#007b70" stroke-width="2.5"/>
<path d="M315 161.43593539449V438.56406460551" stroke="#007b70" stroke-dasharray="6 5"/>
<circle cx="315" cy="161.43593539449" r="6" fill="#007b70"/>
<circle cx="315" cy="438.56406460551" r="6" fill="#007b70"/>
<text x="323" y="180" font-size="19">η₊</text>
<text x="323" y="432" font-size="19">η₋</text>
<text x="324" y="322" font-size="17">1/2</text>
<text x="43" y="503" font-size="19">(X, Y, Z) = (1/2, 0, ±√3/2)</text>
<text x="43" y="526" font-size="17">Unit circle in the Y = 0 plane; WAD.19.</text>
<rect x="465" y="95" width="452" height="204" rx="12" fill="#eaf6f0" stroke="#70ab8e"/>
<text x="485" y="128" font-size="22" font-weight="600">Symmetric Hilbert pairing</text>
<text x="485" y="164" font-size="20">R(y) = diag(η₊*yη₊, η₋*yη₋)</text>
<text x="485" y="201" font-size="20">R(I) = I     R(Y) = 0</text>
<text x="485" y="238" font-size="20">Unital, completely positive, state preserving.</text>
<text x="485" y="275" font-size="18">Two vector-state tests give the diagonal output.</text>
<rect x="465" y="318" width="452" height="220" rx="12" fill="#fff2e9" stroke="#cc916d"/>
<text x="485" y="352" font-size="22" font-weight="600">Ordinary GNS Hilbert pairing</text>
<text x="485" y="391" font-size="20">G(y) = 2 T(yk)</text>
<text x="485" y="429" font-size="20">G(Y) = −iZ/2</text>
<text x="485" y="468" font-size="20">Y is self-adjoint; G(Y) is not.</text>
<text x="485" y="505" font-size="18">G is positive exactly when T respects both</text>
<text x="485" y="528" font-size="18">modular groups; WAD-04 proves the criterion.</text>
</g>
</svg>
