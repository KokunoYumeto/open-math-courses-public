<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Tail amalgam and the residual estimate</title>
<desc id="desc">The tail group C n embeds in Sigma n and Delta n. Their amalgam is T epsilon Gamma. A two-piece cover of the complement gives A zero at least K. Three disjoint conjugates give B zero at most K. Combining their mass differences gives the constant one hundred.</desc>
<rect width="900" height="660" rx="16" fill="#f7fafc"/>
<g font-family="Georgia, serif" fill="#182a38" text-anchor="middle">
<text x="450" y="38" font-size="25">Tail subgroups and two detecting conjugations</text>
<text x="450" y="78" font-size="23">T<tspan baseline-shift="sub" font-size="70%">ε</tspan>(Γ) = Σₙ ∗<tspan baseline-shift="sub" font-size="70%">Cₙ</tspan> Δₙ</text>
<rect x="95" y="107" width="230" height="62" rx="9" fill="#dcebf5" stroke="#456b83"/>
<rect x="575" y="107" width="230" height="62" rx="9" fill="#dcebf5" stroke="#456b83"/>
<text x="210" y="146" font-size="23">a = t₁ ∈ Σₙ</text>
<text x="690" y="146" font-size="23">b = tₙ₊₁ ∈ Δₙ</text>
<text x="450" y="215" font-size="22">Cₙ = ⊕<tspan baseline-shift="sub" font-size="70%">i ≥ n</tspan> Γᵢ</text>
<path d="M380 195 L300 167 M520 195 L600 167" stroke="#456b83" stroke-width="2.5" fill="none"/>
<text x="450" y="250" font-size="18">a commutes with Cₙ; no nonzero power of b lies in Cₙ</text>
<path d="M40 275 H860" stroke="#becbd3"/>
<text x="236" y="309" font-size="21">X = F ∪ aFa⁻¹</text>
<ellipse cx="190" cy="375" rx="100" ry="47" fill="#a7d4c5" fill-opacity="0.75" stroke="#286351" stroke-width="2"/>
<ellipse cx="278" cy="375" rx="100" ry="47" fill="#b8cde9" fill-opacity="0.75" stroke="#456b83" stroke-width="2"/>
<text x="150" y="382" font-size="22">F</text>
<text x="313" y="382" font-size="22">aFa⁻¹</text>
<text x="236" y="458" font-size="20">A₀ = ν(F) + ν(aFa⁻¹) ≥ K</text>
<text x="660" y="309" font-size="21">Three disjoint subsets of X</text>
<rect x="480" y="343" width="105" height="64" rx="12" fill="#d8e5f4" stroke="#456b83" stroke-width="2"/>
<rect x="609" y="343" width="105" height="64" rx="12" fill="#d8e5f4" stroke="#456b83" stroke-width="2"/>
<rect x="738" y="343" width="105" height="64" rx="12" fill="#d8e5f4" stroke="#456b83" stroke-width="2"/>
<text x="532" y="383" font-size="21">b⁻¹Fb</text>
<text x="661" y="383" font-size="21">F</text>
<text x="790" y="383" font-size="21">bFb⁻¹</text>
<text x="660" y="458" font-size="19">B₀ = ν(b⁻¹Fb) + ν(F) + ν(bFb⁻¹) ≤ K</text>
<path d="M40 483 H860" stroke="#becbd3"/>
<text x="450" y="518" font-size="19">X = G ∖ Λ, K = ν(X), δ<tspan baseline-shift="sub" font-size="70%">g</tspan> = ‖U<tspan baseline-shift="sub" font-size="70%">g</tspan>ξ − ξ‖</text>
<text x="450" y="557" font-size="24">K ≤ 3A₀ − 2B₀ ≤ 2√K (3δ<tspan baseline-shift="sub" font-size="70%">a</tspan> + 4δ<tspan baseline-shift="sub" font-size="70%">b</tspan>)</text>
<text x="450" y="598" font-size="25" fill="#225846">K ≤ 100 (δ<tspan baseline-shift="sub" font-size="70%">a</tspan>² + δ<tspan baseline-shift="sub" font-size="70%">b</tspan>²)</text>
<text x="450" y="635" font-size="16">RSG-03 and RSG-06. Shapes show set relations, not measures or proportions.</text>
</g></svg>
