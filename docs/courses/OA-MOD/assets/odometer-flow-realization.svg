<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">Odometer carries and the invariant flow coordinate</title>
<desc id="desc">The lifted skew odometer replaces omega by F minus a of omega and t by t plus a. Their combined coordinate F t of omega is unchanged. Vertical translation of t by s induces F s on that coordinate. Permutations eliminate x and the dense b subgroup eliminates r.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#255d7c"/></marker></defs>
<rect width="1120" height="690" rx="18" fill="#f8fafb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#17334a">
<text x="40" y="48" font-size="27" font-weight="600">The coordinate that survives the lift</text>
<text x="40" y="81" font-size="18">Point maps · a = a(x), b = b(x) · Sections 5–6</text>
<rect x="40" y="118" width="400" height="100" rx="10" fill="#e4eef4"/>
<rect x="680" y="118" width="400" height="100" rx="10" fill="#e4eef4"/>
<text x="65" y="160" font-size="23">(x, ω, r, t)</text>
<text x="65" y="194" font-size="17">measure: P × μ × e⁻ʳ dr × e⁻ᵗ dt</text>
<text x="702" y="158" font-size="21">(Tx, F₋ₐω, r + log ρ(−a,ω) + b, t+a)</text>
<text x="702" y="194" font-size="17">Jacobian: eᵃ · e⁻ᵃ = 1</text>
<path d="M452 169 H667" stroke="#255d7c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="512" y="150" font-size="20">lift Ŝ</text>
<path d="M238 229 V292" stroke="#255d7c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M880 229 V292" stroke="#255d7c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="256" y="269" font-size="20">Π</text><text x="899" y="269" font-size="20">Π</text>
<rect x="40" y="307" width="400" height="68" rx="10" fill="#dff0e9"/>
<rect x="680" y="307" width="400" height="68" rx="10" fill="#dff0e9"/>
<text x="168" y="350" font-size="24">z = Fₜω</text>
<text x="721" y="350" font-size="23">Fₜ₊ₐ F₋ₐω = Fₜω = z</text>
<path d="M452 341 H667" stroke="#255d7c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="519" y="325" font-size="18">identity</text>
<rect x="40" y="411" width="1040" height="93" rx="10" fill="#edf0f3"/>
<text x="60" y="444" font-size="19">Entire invariant algebra: {g(Fₜω) : g ∈ L∞(Ω, μ)}</text>
<text x="60" y="478" font-size="17">Finite permutations eliminate x; dense b-translations eliminate r; W(ω,t)=(Fₜω,t) eliminates t.</text>
<rect x="40" y="540" width="400" height="66" rx="10" fill="#e4eef4"/>
<rect x="680" y="540" width="400" height="66" rx="10" fill="#dff0e9"/>
<text x="66" y="582" font-size="23">Vₛ: (x,ω,r,t) ↦ (x,ω,r,t+s)</text>
<text x="704" y="582" font-size="23">ΠVₛ = FₛΠ: z ↦ Fₛz</text>
<path d="M452 573 H667" stroke="#255d7c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="477" y="557" font-size="18">induced point flow</text>
<text x="40" y="650" font-size="18">The opposite sign Fₐ in the skew map would instead yield the reversed flow F₋ₛ.</text>
</g>
</svg>
