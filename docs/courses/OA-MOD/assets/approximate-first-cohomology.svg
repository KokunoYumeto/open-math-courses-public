<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Finite tower correction with exact unitary representatives</title>
<desc id="desc">The correcting quotient unitary is assembled from coefficients on orthogonal tower levels. Compressed logarithms give unitary representatives. The diagram labels the fourteen internal target cells and nine remaining cells of the cyclic example with twenty-three coordinates. The resulting functional bound retains the norm of each positive functional.</desc>
<rect width="1400" height="900" rx="18" fill="#f3f7fa"/><g font-family="Arial, sans-serif" fill="#17364a">
<text x="55" y="60" font-size="33" font-weight="bold">Correcting finite cocycle data</text>
<rect x="50" y="95" width="625" height="150" rx="12" fill="#e3edf7" stroke="#7892a6"/>
<text x="75" y="136" font-size="26" font-weight="bold">Orthogonal centralizing levels</text>
<text x="75" y="180" font-size="26">W = Σ u<tspan baseline-shift="sub" font-size="18">s</tspan> E<tspan baseline-shift="sub" font-size="18">i,s</tspan> + E<tspan baseline-shift="sub" font-size="18">0</tspan> ∈ B</text>
<text x="75" y="220" font-size="22">The constant coefficients commute with every level.</text>
<rect x="725" y="95" width="625" height="150" rx="12" fill="#e8e3f5" stroke="#7892a6"/>
<text x="750" y="136" font-size="26" font-weight="bold">Exact coordinate unitaries · (2.3)</text>
<text x="750" y="180" font-size="26">H<tspan baseline-shift="sub" font-size="18">k</tspan> = Σ e<tspan baseline-shift="sub" font-size="18">a,k</tspan> h<tspan baseline-shift="sub" font-size="18">a</tspan> e<tspan baseline-shift="sub" font-size="18">a,k</tspan> ,  w<tspan baseline-shift="sub" font-size="18">k</tspan> = exp(iH<tspan baseline-shift="sub" font-size="18">k</tspan>)</text>
<text x="750" y="220" font-size="22">‖H<tspan baseline-shift="sub" font-size="16">k</tspan>‖ ≤ π;  [w] = W in the multiplier quotient.</text>
<path d="M360 255 L360 285 L700 285 L700 315 M1035 255 L1035 285 L700 285 M688 301 L700 315 L712 301" fill="none" stroke="#385e76" stroke-width="3"/>
<text x="55" y="355" font-size="25" font-weight="bold">Intersection cells: translated input level × output level · (3.3)–(3.6)</text>
<rect x="70" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="93.5" y="435" text-anchor="middle" font-size="22">0</text><rect x="124" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="147.5" y="435" text-anchor="middle" font-size="22">1</text><rect x="178" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="201.5" y="435" text-anchor="middle" font-size="22">2</text><rect x="232" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="255.5" y="435" text-anchor="middle" font-size="22">3</text><rect x="286" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="309.5" y="435" text-anchor="middle" font-size="22">4</text><rect x="340" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="363.5" y="435" text-anchor="middle" font-size="22">5</text><rect x="394" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="417.5" y="435" text-anchor="middle" font-size="22">6</text><rect x="448" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="471.5" y="435" text-anchor="middle" font-size="22">7</text><rect x="502" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="525.5" y="435" text-anchor="middle" font-size="22">8</text><rect x="556" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="579.5" y="435" text-anchor="middle" font-size="22">9</text><rect x="610" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="633.5" y="435" text-anchor="middle" font-size="22">10</text><rect x="664" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="687.5" y="435" text-anchor="middle" font-size="22">11</text><rect x="718" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="741.5" y="435" text-anchor="middle" font-size="22">12</text><rect x="772" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="795.5" y="435" text-anchor="middle" font-size="22">13</text><rect x="826" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="849.5" y="435" text-anchor="middle" font-size="22">14</text><rect x="880" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="903.5" y="435" text-anchor="middle" font-size="22">15</text><rect x="934" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="957.5" y="435" text-anchor="middle" font-size="22">16</text><rect x="988" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="1011.5" y="435" text-anchor="middle" font-size="22">17</text><rect x="1042" y="400" width="47" height="56" fill="#b9dfcc" stroke="#557284"/><text x="1065.5" y="435" text-anchor="middle" font-size="22">18</text><rect x="1096" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="1119.5" y="435" text-anchor="middle" font-size="22">19</text><rect x="1150" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="1173.5" y="435" text-anchor="middle" font-size="22">20</text><rect x="1204" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="1227.5" y="435" text-anchor="middle" font-size="22">21</text><rect x="1258" y="400" width="47" height="56" fill="#f4c6a7" stroke="#557284"/><text x="1281.5" y="435" text-anchor="middle" font-size="22">22</text>
<text x="70" y="495" font-size="23">Target labels t in Z/23Z; translation g = 1</text>
<rect x="70" y="525" width="30" height="26" fill="#b9dfcc"/><text x="115" y="548" font-size="23">14 internal cells: prescribed cocycle defects</text>
<rect x="70" y="565" width="30" height="26" fill="#f4c6a7"/><text x="115" y="588" font-size="23">9 other cells: norm at most 2; b = 6/23 + 3/23 = 9/23</text>
<rect x="50" y="630" width="1300" height="205" rx="12" fill="#fff" stroke="#7892a6"/>
<text x="75" y="673" font-size="26" font-weight="bold">General bounds · (3.9), (4.5)–(4.6)</text>
<text x="75" y="719" font-size="26">limsup ‖X<tspan baseline-shift="sub" font-size="18">g,k</tspan> φ‖, limsup ‖φ X<tspan baseline-shift="sub" font-size="18">g,k</tspan>‖ ≤ √[r<tspan baseline-shift="sub" font-size="18">φ</tspan>(2η + 4r<tspan baseline-shift="sub" font-size="18">φ</tspan>b<tspan baseline-shift="sub" font-size="18">g</tspan>)]</text>
<text x="75" y="763" font-size="24">r<tspan baseline-shift="sub" font-size="17">φ</tspan> = φ(1);  b<tspan baseline-shift="sub" font-size="17">g</tspan> = d + B<tspan baseline-shift="sub" font-size="17">g</tspan> &lt; 2ρ;  limsup ‖[w<tspan baseline-shift="sub" font-size="17">k</tspan>, ψ]‖ ≤ Lη</text>
<text x="75" y="805" font-size="23">Choose ρ and η by (4.3)–(4.4), then one coordinate for all finite tests.</text>
<text x="55" y="873" font-size="20">The colored row is the exact finite example (7.3); the estimates below it hold under the stated tower hypotheses.</text>
</g></svg>