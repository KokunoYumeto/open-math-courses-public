<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">A centralizer unitary detects nonscalar mass in a tensor tail</title>
<desc id="desc">A centered element a is projected to b in the tensor tail using the product-state weights. A unitary in the tail centralizer displaces b by at least one half its state norm. Two approximation errors and one half-norm error give the lower bound one half the norm of a minus five halves epsilon. Ordinary and ultrafilter sequences use different depth selections.</desc>
<rect width="1100" height="540" fill="#fafaf4"/>
<g font-family="Georgia, serif" fill="#12343b">
<text x="28" y="39" font-size="24" font-weight="bold">Detect nonscalar mass without replacing the product state by a trace</text>
<text x="28" y="72" font-size="17">Lemma 2.2 · Proposition 3.1 · Theorems 4.1 and 5.1 · all norms below are ‖ · ‖φ,#</text>
</g>
<g fill="#ffffff" stroke="#23765b" stroke-width="2">
<rect x="28" y="104" width="288" height="164" rx="9"/>
<rect x="398" y="104" width="304" height="164" rx="9"/>
<rect x="784" y="104" width="288" height="164" rx="9"/>
<rect x="28" y="376" width="492" height="116" rx="9"/>
<rect x="580" y="376" width="492" height="116" rx="9"/>
</g>
<g font-family="Georgia, serif" fill="#12343b" font-size="18">
<text x="48" y="137" font-weight="bold">Centered element</text>
<text x="48" y="176">a ∈ M,   φ(a) = 0</text>
<text x="48" y="212">Dᵣ = first r matrix legs</text>
<text x="48" y="246">Nᵣ = Dᵣ′ ∩ M is the tail</text>
<text x="418" y="137" font-weight="bold">Weighted tail projection</text>
<text x="418" y="176">b = Tᵣ(a) ∈ Nᵣ,   φ(b) = 0</text>
<text x="418" y="212">Tᵣ = φhead ⊗ idtail</text>
<text x="418" y="246">‖a − b‖ ≤ ε</text>
<text x="804" y="137" font-weight="bold">Centralizer displacement</text>
<text x="804" y="176">u ∈ U((Nᵣ)φ)</text>
<text x="804" y="212">‖b − ubu*‖ ≥ ½‖b‖</text>
<text x="804" y="246">φ(uxu*) = φ(x)</text>
<text x="28" y="311" font-size="23" font-weight="bold">‖[a,u]‖ = ‖a − uau*‖ ≥ ½‖a‖ − ⁵⁄₂ ε</text>
<text x="28" y="344">The loss is ε + ε from the two substitutions, plus ε/2 from ‖b‖ ≥ ‖a‖ − ε.</text>
<text x="48" y="409" font-weight="bold">Ordinary sequences</text>
<text x="48" y="442">Choose k(r) increasing and ε = 2⁻ʳ.</text>
<text x="48" y="474">Set v at k(r) to uᵣ; set it to 1 elsewhere.</text>
<text x="600" y="409" font-weight="bold">A specified free ultrafilter ω</text>
<text x="600" y="442">Choose nested Bᵣ ∈ ω and depth r(n) →ω ∞.</text>
<text x="600" y="474">Use ε = 1/r(n); no countable intersection.</text>
<text x="28" y="523" font-size="16">Tail centralizer membership proves predual centralizing and preserves the nontracial state norm.</text>
</g>
