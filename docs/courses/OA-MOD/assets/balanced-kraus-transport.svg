<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">Balanced Kraus completion and exact coupling energy</title>
<desc id="desc">For second marginal diag five fourths and three fourths, the largest scalar is four fifths. Two defects are filled by e21 and e22 divided by square root five. The resulting depolarizing map has coupling energy two for the traceless diagonal unitary: one unit of squared reconstruction error and one unit of Schwarz defect.</desc>
<rect width="1120" height="780" rx="18" fill="#f6f8fc"/>
<g font-family="Arial,sans-serif" fill="#132238">
<text x="38" y="47" font-size="28" font-weight="700">Fill both marginals. Track the exact energy.</text>
<text x="38" y="80" font-size="18">Explicit matrix transport, maximal scalar scaling and the depolarizing completion.</text>
<rect x="28" y="104" width="520" height="578" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="50" y="142" font-size="21" font-weight="700">Positive-defect transport</text>
<text x="50" y="177" font-size="19">c′ = diag(5/4, 3/4), t = 1/‖c′‖ = 4/5</text>
<text x="50" y="208" font-size="18">h = (1/5) I₂; k = diag(0, 2/5)</text>
<text x="86" y="251" font-size="17">input</text><text x="413" y="251" font-size="17">output</text>
<circle cx="109" cy="295" r="31" fill="#dbeafe"/><circle cx="109" cy="392" r="31" fill="#dbeafe"/>
<circle cx="440" cy="295" r="31" fill="#f1f5f9" stroke="#cbd5e1"/><circle cx="440" cy="392" r="31" fill="#d1fae5"/>
<g font-size="18" text-anchor="middle">
<text x="109" y="301">1/5</text><text x="109" y="398">1/5</text><text x="440" y="301">0</text><text x="440" y="398">2/5</text>
</g>
<path d="M143 301 L401 381 M390 371 L401 381 L387 383 M145 397 H401 M389 387 L401 397 L389 407" fill="none" stroke="#047857" stroke-width="3"/>
<text x="214" y="309" font-size="18">a₁ = e₂₁/√5</text><text x="216" y="430" font-size="18">a₂ = e₂₂/√5</text>
<text x="50" y="477" font-size="17">Each input: 4/5 + 1/5 = 1</text>
<rect x="50" y="488" width="360" height="18" fill="#2563eb"/><rect x="338" y="488" width="72" height="18" fill="#10b981"/>
<text x="50" y="534" font-size="17">Output 1: 1 + 0 = 1</text><rect x="50" y="545" width="360" height="18" fill="#2563eb"/>
<text x="50" y="591" font-size="17">Output 2: 3/5 + 2/5 = 1</text>
<rect x="50" y="602" width="360" height="18" fill="#2563eb"/><rect x="266" y="602" width="144" height="18" fill="#10b981"/>
<rect x="50" y="644" width="17" height="17" fill="#2563eb"/><text x="75" y="658" font-size="15">scaled original</text>
<rect x="248" y="644" width="17" height="17" fill="#10b981"/><text x="273" y="658" font-size="15">added tail</text>
<rect x="568" y="104" width="524" height="578" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="591" y="142" font-size="21" font-weight="700">The completed map and its energy</text>
<text x="591" y="178" font-size="18">Initial map: Ψ₀(x) = (5x₁₁ + 3x₂₂) I₂/8</text>
<text x="591" y="212" font-size="18">Completed map: Φ(x) = τ₂(x) I₂</text>
<text x="591" y="246" font-size="18">For u = v = diag(1, −1), Φ(v) = 0</text>
<text x="591" y="297" font-size="20" font-weight="700">Coupling energy = error² + Schwarz defect</text>
<rect x="591" y="324" width="236" height="75" rx="6" fill="#dbeafe"/>
<rect x="827" y="324" width="236" height="75" rx="6" fill="#ffedd5"/>
<g text-anchor="middle" font-size="19">
<text x="709" y="354">‖u − Φ(v)‖₂²</text><text x="709" y="383">1</text>
<text x="945" y="354">1 − ‖Φ(v)‖₂²</text><text x="945" y="383">1</text>
</g>
<text x="591" y="441" font-size="20">Σᵢ ‖aᵢu − vaᵢ‖₂² = 2</text>
<text x="591" y="479" font-size="18">The coefficient two in E ≤ 2‖u − Φ(v)‖₂</text>
<text x="591" y="507" font-size="18">is attained by this example.</text>
<text x="591" y="554" font-size="19" font-weight="700">Composition retains the square-root budget</text>
<text x="591" y="589" font-size="19">cⱼᵢ = bⱼaᵢ</text>
<text x="591" y="625" font-size="19">√E_c(u,w) ≤ √E_a(u,v) + √E_b(v,w)</text>
<text x="591" y="658" font-size="16" fill="#475569">Exact identities and proof: BKC-06.</text>
<text x="38" y="719" font-size="17">Transport: BKC-01–02. Full normal completion and cb error bound: BKC-03–05.</text>
<text x="38" y="750" font-size="16" fill="#475569">Human source: M. Takesaki, Theory of Operator Algebras III, XVI.1.17–1.18 and p. 227.</text>
</g></svg>
