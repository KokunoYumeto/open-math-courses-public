<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Weighted matrix matching and the complement obstruction</title>
<desc id="desc">Center-valued trace equality yields quotient equivalence, exact partial isometry lifts, and matching unitaries whose opposite weights cancel. The counterexample has a four-dimensional commutant for P and an infinite-dimensional commutant for Q.</desc>
<rect width="1120" height="680" rx="18" fill="#f7fafc"/>
<g font-family="Arial, sans-serif" fill="#152d42">
<text x="38" y="48" font-size="27" font-weight="bold">Match selected matrix blocks</text>
<text x="38" y="80" font-size="18">0 &lt; λ &lt; 1   ·   p₁ = 1/(1 + λ)   ·   M has separable predual</text>
<g fill="#e6f2fa" stroke="#326c94" stroke-width="2">
<rect x="38" y="108" width="308" height="108" rx="10"/>
<rect x="406" y="108" width="308" height="108" rx="10"/>
<rect x="774" y="108" width="308" height="108" rx="10"/>
</g>
<g font-size="21" text-anchor="middle">
<text x="192" y="146">T(E) = T(F) = p₁ · 1</text><text x="192" y="181" font-size="17">full center-valued trace · §2</text>
<text x="560" y="146">W*W = E,  WW* = F</text><text x="560" y="181" font-size="17">equivalence in Mω · §2</text>
<text x="928" y="143">wₙ*wₙ = e₁₁(n)</text><text x="928" y="170">wₙwₙ* = f₁₁(n)</text><text x="928" y="199" font-size="17">exact lifts · §3</text>
</g>
<path d="M354 162 H393 m-11 -7 11 7 -11 7 M722 162 H761 m-11 -7 11 7 -11 7" fill="none" stroke="#326c94" stroke-width="3"/>
<rect x="38" y="237" width="1044" height="105" rx="10" fill="#e8f3ed" stroke="#398166" stroke-width="2"/>
<text x="62" y="276" font-size="23">uₙ = Σⱼ fⱼ₁(n) wₙ e₁ⱼ(n)     ⇒     uₙ eₐᵦ(n) uₙ* = fₐᵦ(n)</text>
<text x="62" y="312" font-size="18">Opposite weights cancel (§3). Preserve earlier blocks and control both inverses (§§4–5).</text>
<text x="38" y="394" font-size="27" font-weight="bold">Whole tensor factors retain a complement obstruction</text>
<text x="38" y="428" font-size="20">M = A ⊗ B ⊗ M₂(ℂ), with A ≅ B ≅ A ⊗ B ≅ Rλ (stationary Powers products)</text>
<g fill="#fff3e5" stroke="#b87930" stroke-width="2">
<rect x="38" y="451" width="500" height="138" rx="10"/><rect x="558" y="451" width="524" height="138" rx="10"/>
</g>
<text x="60" y="490" font-size="23">P = A ⊗ B ⊗ 1</text><text x="60" y="527" font-size="22">P′ ∩ M ≅ M₂(ℂ)</text><text x="60" y="564" font-size="19">complex dimension 4</text>
<text x="580" y="490" font-size="23">Q = A ⊗ 1 ⊗ 1</text><text x="580" y="527" font-size="22">Q′ ∩ M ≅ B ⊗ M₂(ℂ)</text><text x="580" y="564" font-size="19">infinite dimensional</text>
<text x="38" y="627" font-size="21" font-weight="bold">No automorphism sends P to Q: it would have to send their commutants to each other.</text>
<text x="38" y="657" font-size="16">Proof: WMC §7. Source comparison: Takesaki III, XVIII.4, Lemma 4.30 and Corollary 4.31, pp. 400–402.</text>
</g>
</svg>
