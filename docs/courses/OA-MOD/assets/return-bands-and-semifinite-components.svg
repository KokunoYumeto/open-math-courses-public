<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">Return-band coordinates and the two measure derivatives</title>
<desc id="desc">Two vertical bands of length epsilon start at s n and s n plus one. The displayed gap between their starts is three epsilon as an illustrative roof value. Collapsing each band produces the integer sheet n or n plus one. The forward shift covers T and scales measure by exp minus r at b. The backward shift covers inverse T and scales by exp r at inverse T b.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#285e82" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="580" rx="16" fill="#f6f9fc"/>
<g font-family="Arial, sans-serif" fill="#17354b">
<text x="30" y="38" font-size="24" font-weight="bold">Collapse vertical bands, retain the return measure</text>
<text x="30" y="68" font-size="17">The drawing uses r(b) = 3ε; the construction allows every finite roof r ≥ 2ε.</text>
<path d="M75 440 V105" fill="none" stroke="#285e82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="110" font-size="21">t</text>
<g fill="#dcefe4" stroke="#54866d" stroke-width="2">
<rect x="100" y="160" width="215" height="60"/>
<rect x="100" y="340" width="215" height="60"/>
</g>
<g font-size="19"><text x="110" y="184">sₙ₊₁ + v</text><text x="110" y="364">sₙ + v</text></g>
<g font-size="17"><text x="110" y="207">0 ≤ v &lt; ε</text><text x="110" y="387">0 ≤ v &lt; ε</text></g>
<path d="M86 220 H320 M86 400 H320" stroke="#54866d" stroke-width="2"/>
<g font-size="18"><text x="105" y="242">sₙ₊₁ = sₙ + r(b)</text><text x="105" y="423">sₙ</text></g>
<path d="M332 395 V225" stroke="#285e82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="345" y="304" font-size="18">r(b)</text>
<path d="M315 190 H445 M315 370 H445" stroke="#285e82" stroke-width="2" marker-end="url(#arrow)"/>
<g fill="#fff" stroke="#90abc1" stroke-width="2">
<rect x="453" y="154" width="155" height="72" rx="9"/>
<rect x="453" y="334" width="155" height="72" rx="9"/>
</g>
<g text-anchor="middle" font-size="20"><text x="530" y="181">(x, n+1)</text><text x="530" y="361">(x, n)</text></g>
<g text-anchor="middle" font-size="17"><text x="530" y="208">base: Tb</text><text x="530" y="388">base: b</text></g>
<text x="370" y="143" font-size="17">collapse v</text>
<line x1="640" y1="110" x2="640" y2="452" stroke="#b7c9d8"/>
<text x="669" y="133" font-size="21" font-weight="bold">Forward-image Jacobians</text>
<text x="669" y="169" font-size="18">a₊: (x,n) ↦ (x,n+1)</text>
<text x="669" y="202" font-size="18">base b ↦ Tb</text>
<text x="669" y="235" font-size="21">J(a₊)(x,n) = exp(−r(b))</text>
<line x1="669" y1="258" x2="1060" y2="258" stroke="#b7c9d8"/>
<text x="669" y="292" font-size="18">a₋: (x,n) ↦ (x,n−1)</text>
<text x="669" y="325" font-size="18">base b ↦ T⁻¹b</text>
<text x="669" y="358" font-size="21">J(a₋)(x,n) = exp(r(T⁻¹b))</text>
<text x="669" y="407" font-size="17">Both maps commute with G.</text>
<text x="669" y="435" font-size="17">The base coordinate is G-invariant.</text>
<line x1="30" y1="468" x2="1070" y2="468" stroke="#b7c9d8"/>
<text x="35" y="504" font-size="21">Band mass:  dλ(x,n) = (1 − exp(−ε)) exp(−sₙ(x)) dμ(x).</text>
<text x="35" y="542" font-size="20">Conditional law:  J_T(b) λ_Tb(a₊C) = exp(−r(b)) λ_b(C).   [RBC.33]</text>
</g></svg>
