<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Two parity limits and their common cocycle</title>
<desc id="desc">Two alternating sequences of cocycle actions are corrected on each parity. Summable forward and inverse functional tests give automorphism limits. Two coefficient module tests give unitary limits. Their quotient intertwines section maps, and the core correction yields the coefficient identity needed for reconstruction on the entire group.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#49697f"/></marker></defs>
<rect width="1400" height="1000" rx="18" fill="#f3f7fa"/>
<g font-family="Arial, sans-serif" fill="#17364a">
<text x="50" y="60" font-size="34" font-weight="bold">Two limits, one exact cocycle conjugacy</text>
<text x="50" y="101" font-size="22">Aligned inputs of Section 1 · εₙ = 2⁻ⁿ · corrections use only already known data</text>
<rect x="50" y="135" width="1300" height="255" rx="12" fill="#fff" stroke="#7892a6"/>
<text x="75" y="177" font-size="25" font-weight="bold">Alternating approximation · (6.3)–(6.6)</text>
<g font-size="27" text-anchor="middle">
<text x="155" y="233">α = X⁰</text><text x="510" y="233">X²</text><text x="865" y="233">X⁴</text><text x="1210" y="233">…</text>
<text x="155" y="326">β = X⁻¹</text><text x="510" y="326">X¹</text><text x="865" y="326">X³</text><text x="1210" y="326">…</text>
</g>
<g fill="none" stroke="#49697f" stroke-width="3" marker-end="url(#arrow)">
<path d="M235 223 H450"/><path d="M565 223 H805"/><path d="M925 223 H1160"/>
<path d="M235 316 H450"/><path d="M565 316 H805"/><path d="M925 316 H1160"/>
</g>
<g fill="none" stroke="#ad8058" stroke-dasharray="7 6" stroke-width="2"><path d="M238 237 L454 298"/><path d="M510 290 L510 245"/><path d="M565 237 L805 298"/><path d="M865 290 L865 245"/><path d="M925 237 L1155 298"/></g>
<text x="75" y="366" font-size="21">Solid: a correction within one parity. Dashed: adjacent actions and coefficients become close.</text>
<rect x="50" y="425" width="625" height="220" rx="12" fill="#e3edf7" stroke="#7892a6"/>
<text x="75" y="466" font-size="25" font-weight="bold">Automorphisms and inverses · (7.1)</text>
<text x="75" y="512" font-size="24">‖ψ ∘ θₙ − ψ ∘ θₙ₋₂‖ &lt; εₙ</text>
<text x="75" y="553" font-size="24">‖ψ ∘ θₙ⁻¹ − ψ ∘ θₙ₋₂⁻¹‖ &lt; εₙ</text>
<text x="75" y="605" font-size="25">θ₂ₖ → θ⁰,  θ₂ₖ₊₁ → θ¹   in the u-topology</text>
<rect x="725" y="425" width="625" height="220" rx="12" fill="#e4f0e9" stroke="#7892a6"/>
<text x="750" y="466" font-size="25" font-weight="bold">Unitary coefficients · (7.3)</text>
<text x="750" y="512" font-size="24">pφ(x) = ‖xφ‖ + ‖φx‖</text>
<text x="750" y="553" font-size="24">pφ(bₙ,ₚ − bₙ₋₂,ₚ) &lt; 6εₙ</text>
<text x="750" y="605" font-size="25">b₂ₖ,ₚ → b⁰ₚ,  b₂ₖ₊₁,ₚ → b¹ₚ   strongly-star</text>
<path d="M360 655 V683 H700 V710 M1035 655 V683 H700" fill="none" stroke="#49697f" stroke-width="3"/>
<rect x="50" y="720" width="1300" height="215" rx="12" fill="#ede8f5" stroke="#7892a6"/>
<text x="75" y="761" font-size="25" font-weight="bold">The coefficient identity retains the core correction · (8.4)–(11.8)</text>
<text x="75" y="805" font-size="25">Kᵢ(m) = θ̃ⁱ(Tₘ)Tₘ* ∈ M;   Uₙ = K₁(n)K₀(n)*;   Uₛ₍ₚ₎ = (b¹ₚ)*b⁰ₚ</text>
<text x="75" y="849" font-size="24">C⁰(p,q) = C¹(p,q) gives the section coefficient identity with both cocycles.</text>
<text x="75" y="893" font-size="24">Normal and mixed identities extend U to G.  Θ = (θ¹)⁻¹θ⁰ is approximately inner.</text>
<text x="50" y="973" font-size="20">The arrows are an induction schematic; the convergence and coefficient formulas are proved in Sections 4–11.</text>
</g></svg>