<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Two bracketings and relative cocycle cancellation</title>
<desc id="desc">The left bracketing ends with the subgroup product a n, the right with b d, and both equal kappa. Each route retains its own subgroup cocycle. In a comparison with identical mixed and subgroup coefficients these form the same coefficient K, which can be cancelled on the right.</desc>
<rect width="1200" height="620" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif" fill="#142b42">
<text x="50" y="53" font-size="29" font-weight="bold">A quotient section retains a subgroup defect</text>
<text x="50" y="90" font-size="23">s(p)s(q) = s(pq)m(p,q)     ·     m(p,q) belongs to N</text>
<rect x="45" y="125" width="530" height="225" rx="12" fill="#e0edf8" stroke="#44779e"/>
<rect x="625" y="125" width="530" height="225" rx="12" fill="#e4f1e9" stroke="#42805c"/>
<text x="70" y="163" font-size="25" font-weight="bold">(Lₛ₍ₚ₎ Lₛ₍q₎) Lₛ₍ᵣ₎</text>
<text x="70" y="204" font-size="21">Move the first subgroup lift past Lₛ₍ᵣ₎.</text>
<text x="70" y="242" font-size="22">a = m(pq,r)</text>
<text x="70" y="278" font-size="22">n = s(r)⁻¹m(p,q)s(r)</text>
<text x="70" y="320" font-size="22" font-weight="bold">Retain w(a,n) before Lκ.</text>
<text x="650" y="163" font-size="25" font-weight="bold">Lₛ₍ₚ₎ (Lₛ₍q₎ Lₛ₍ᵣ₎)</text>
<text x="650" y="204" font-size="21">Multiply the second pair first.</text>
<text x="650" y="242" font-size="22">b = m(p,qr)</text>
<text x="650" y="278" font-size="22">d = m(q,r)</text>
<text x="650" y="320" font-size="22" font-weight="bold">Retain w(b,d) before Lκ.</text>
<path d="M310 353 L310 380 L600 380 M890 353 L890 380 L600 380 L600 402" stroke="#314f6d" stroke-width="3" fill="none"/>
<text x="600" y="437" text-anchor="middle" font-size="25" font-weight="bold">a n = b d = κ  ·  Equation (3.2)</text>
<text x="600" y="477" text-anchor="middle" font-size="22">The ordered coefficients agree; neither subgroup factor is discarded.</text>
<rect x="85" y="505" width="1030" height="78" rx="12" fill="#fff" stroke="#6b8299"/>
<text x="600" y="537" text-anchor="middle" font-size="22">Relative comparison:  z(p,q)z(pq,r) K = φₚ(z(q,r))z(p,qr) K</text>
<text x="600" y="568" text-anchor="middle" font-size="21">Same mixed and subgroup coefficients  ⇒  multiply by K*  ·  Section 6</text>
</g></svg>
