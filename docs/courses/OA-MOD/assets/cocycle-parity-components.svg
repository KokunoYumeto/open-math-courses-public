<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Four ergodic components of the discrete cocycle kernel</title>
<desc id="desc">For H generated by 2 and 3 and S generated by 4 and 9, a kernel arrow changes both exponent coordinates by even integers. The four cosets S, 2S, 3S and 6S give exactly four ergodic components.</desc>
<rect width="920" height="500" fill="#f8f8f3"/>
<g font-family="Arial, sans-serif" fill="#153c3b">
<text x="32" y="42" font-size="25" font-weight="bold">Exact degrees preserve exponent parity</text>
<text x="32" y="76" font-size="20">h = 2ᵃ3ᵇ,   δ = 2²ᵐ3²ⁿ,   k = h / δ</text>
<text x="32" y="108" font-size="20">(a, b) → (a − 2m, b − 2n)</text>
<g stroke="#397d77" stroke-width="2">
<rect x="32" y="140" width="410" height="132" rx="12" fill="#e2eeea"/>
<rect x="478" y="140" width="410" height="132" rx="12" fill="#e2eeea"/>
<rect x="32" y="294" width="410" height="132" rx="12" fill="#e2eeea"/>
<rect x="478" y="294" width="410" height="132" rx="12" fill="#e2eeea"/>
</g>
<g font-size="28" font-weight="bold">
<text x="56" y="179">X × S</text><text x="502" y="179">X × 2S</text>
<text x="56" y="333">X × 3S</text><text x="502" y="333">X × 6S</text>
</g>
<g font-size="20">
<text x="56" y="215">a even, b even</text><text x="502" y="215">a odd, b even</text>
<text x="56" y="369">a even, b odd</text><text x="502" y="369">a odd, b odd</text>
<text x="56" y="250">Representative sheet: h = 1</text><text x="502" y="250">Representative sheet: h = 2</text>
<text x="56" y="404">Representative sheet: h = 3</text><text x="502" y="404">Representative sheet: h = 6</text>
</g>
<text x="32" y="467" font-size="19">H = ⟨2, 3⟩,   S = ⟨4, 9⟩. Each box contains infinitely many sheets.</text>
</g>
</svg>
