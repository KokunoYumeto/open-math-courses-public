<path d="M402 340H112 M972 340H682" fill="none"/>
<path d="M112 340l13 -7v14z M682 340l13 -7v14z"/>
</g>
<g fill="#2463a6"><circle cx="153" cy="340" r="7"/><circle cx="323" cy="340" r="7"/><circle cx="791" cy="340" r="7"/></g>
<path d="M153 324 Q238 230 323 324" fill="none" stroke="#178457" stroke-width="3"/>
<path d="M323 324l-12 -5 10 -7z" fill="#178457"/>
<text x="192" y="255" font-size="18" fill="#126640">τ₀: +1/2</text>
<text x="131" y="370" font-size="18">A</text><text x="318" y="370" font-size="18">B</text>
<text x="767" y="370" font-size="18">[A] = [B]</text>
<text x="185" y="409" font-size="20" fill="#2463a6">period L</text>
<text x="757" y="409" font-size="20" fill="#2463a6">period L/2</text>
<path d="M466 298H609" stroke="#334e68" stroke-width="3"/><path d="M609 298l-13 -7v14z" fill="#334e68"/>
<text x="474" y="272" font-size="18">quotient by τ₀</text>
<text x="75" y="467" font-size="17">0</text><text x="249" y="467" font-size="17">1/2</text><text x="419" y="467" font-size="17">1</text>
<text x="646" y="467" font-size="17">0</text><text x="982" y="467" font-size="17">1/2</text>
<text x="181" y="493" font-size="18">horizontal coordinate x/L</text>
<text x="690" y="493" font-size="18">x/L modulo 1/2</text>
<text x="50" y="164" font-size="17">1</text><text x="50" y="442" font-size="17">0</text>
<text x="621" y="164" font-size="17">1</text><text x="621" y="442" font-size="17">0</text>
<text x="85" y="529" font-size="19">Vertical coordinate: arg(z)/(2π). Every height remains a different central value.</text>
<rect x="48" y="558" width="984" height="142" rx="10" fill="#ffffff" stroke="#b5c4d4"/>
<text x="72" y="589" font-size="20" font-weight="700">General rational-time calculation (Sections 7–9)</text>
<text x="72" y="621" font-size="19">|⟨τ₀⟩| = d; its action on Y = w^a z^q has order e; the central coordinate is Yᵉ.</text>
<text x="72" y="653" font-size="19">Each orbit is divided by a subgroup of order d/e:   qL → qeL/d.</text>
<text x="72" y="683" font-size="19">The entire algebra is L∞(circle) ⊗ R with subtype λ raised to the power qe/d.</text>
<text x="48" y="731" font-size="15">Coordinate diagram; no metric claim. Exact maps: CPR (7.2), (8.2); period: (8.5); algebra splitting: (9.8).</text>
</g></svg>
