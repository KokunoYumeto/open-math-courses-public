<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 750" role="img" aria-labelledby="title desc">
<title id="title">A finite torus quotient shortens a flow circle and preserves its transverse center</title>
<desc id="desc">Fundamental squares for s divided by L equal to one half, delta equal to one and modular time zero. Horizontal flow moves left. A half translation identifies two points in the first square. In the quotient each horizontal flow circle has period L divided by two. The vertical circle coordinate, and hence the diffuse center, survives. The general component period is q e L divided by d.</desc>
<rect width="1080" height="750" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#142b43">
<text x="48" y="49" font-size="28" font-weight="700">The central circle survives the finite quotient</text>
<text x="48" y="82" font-size="19">Exact example: s/L = 1/2, δ = 1, t = 0. Opposite edges are identified.</text>
<text x="85" y="130" font-size="22" font-weight="700">Before the quotient</text>
<text x="655" y="130" font-size="22" font-weight="700">After the quotient</text>
<rect x="85" y="158" width="340" height="280" fill="#e9f0f7" stroke="#334e68" stroke-width="2"/>
<rect x="655" y="158" width="340" height="280" fill="#edf7f1" stroke="#334e68" stroke-width="2"/>
<g stroke="#7690a8" stroke-width="1" stroke-dasharray="5 5">
<path d="M255 158V438 M85 298H425 M655 298H995"/>
</g>
