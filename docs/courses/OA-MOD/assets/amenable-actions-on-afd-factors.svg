<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" role="img" aria-labelledby="title desc">
 <title id="title">Cocycle conjugacy of amenable actions on AFD factors</title>
 <desc id="desc">For a fixed separable-predual AFD factor and countable discrete amenable group, retain the core-inner subgroup, module and full characteristic class. Types II and III use the characteristic-class intertwining theorem; type I uses scalar projective multipliers. Flow-coordinate changes lift in types II infinity and III; scalar representatives are fixed in type I and type II one.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#385b73"/></marker></defs>
 <rect width="1060" height="700" fill="#f7fafc"/>
 <g font-family="Arial, sans-serif" fill="#172b3a">
 <text x="530" y="38" font-size="25" text-anchor="middle">From the full invariant to a genuine cocycle</text>
 <text x="530" y="66" font-size="17" text-anchor="middle">Fixed separable-predual AFD factor M · countable discrete amenable group G</text>
 <rect x="60" y="91" width="940" height="98" rx="12" fill="#e5f0f6" stroke="#385b73"/>
 <text x="530" y="120" font-size="21" text-anchor="middle">I(α) = (N, B, [λ, μ])</text>
 <text x="530" y="148" font-size="17" text-anchor="middle">N = core-inner kernel · B = action on the core center</text>
 <text x="530" y="174" font-size="17" text-anchor="middle">λ retains G × ℝ; μ retains multiplication on the marked subgroup N</text>
 <path d="M295,189 V225 M790,189 V225" fill="none" stroke="#385b73" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="40" y="234" width="510" height="194" rx="12" fill="#fff" stroke="#385b73"/>
 <text x="295" y="266" font-size="22" text-anchor="middle">Types II and III · Sections 4–7</text>
 <text x="65" y="301" font-size="18">• Core-inner = centrally trivial</text>
 <text x="65" y="330" font-size="18">• Equal modules ⇒ approximate-inner differences</text>
 <text x="65" y="359" font-size="18">• M absorbs R ⇒ Mω is finite of type II</text>
 <text x="65" y="388" font-size="18">• G/N is amenable</text>
 <text x="295" y="415" font-size="17" text-anchor="middle">NCA07: exact subgroup alignment + intertwining</text>
 <rect x="580" y="234" width="440" height="194" rx="12" fill="#fff" stroke="#385b73"/>
 <text x="800" y="266" font-size="22" text-anchor="middle">Type I · Section 8</text>
 <text x="605" y="301" font-size="18">αg = Ad(ug), βg = Ad(vg)</text>
 <text x="605" y="330" font-size="18">Full class equality ⇒ scalar cochain</text>
 <text x="605" y="359" font-size="18">Rescale so both multipliers agree</text>
 <text x="605" y="388" font-size="18">wg = vg ug* is a genuine 1-cocycle</text>
 <text x="800" y="415" font-size="17" text-anchor="middle">Direct matrix-unit and projective proof</text>
 <path d="M295,428 V455 H530 V471 M800,428 V455 H530" fill="none" stroke="#385b73" stroke-width="2"/>
 <path d="M530,461 V477" fill="none" stroke="#385b73" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="60" y="485" width="940" height="87" rx="12" fill="#e5f2e9" stroke="#3e6a4e"/>
 <text x="530" y="515" font-size="21" text-anchor="middle">Equal fixed-coordinate data ⇒ strong cocycle conjugacy</text>
 <text x="530" y="548" font-size="19" text-anchor="middle">a = γαγ⁻¹,   βg = Ad(wg) ag,   wg ag(wh) = wgh</text>
 <rect x="60" y="592" width="940" height="84" rx="12" fill="#fff" stroke="#385b73"/>
 <text x="530" y="620" font-size="20" text-anchor="middle">Flow-coordinate orbits · Section 9</text>
 <text x="530" y="647" font-size="17" text-anchor="middle">II∞ and III: lift the flow symmetry, then compare fixed-coordinate data</text>
 <text x="530" y="669" font-size="17" text-anchor="middle">I and II₁: scalar representatives are fixed by every flow symmetry</text>
 </g>
</svg>
