<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Operator models and their predual matrix norms</title>
<desc id="desc">Normal cpc maps S from M to operator-norm matrices and T back to M induce the reverse cpc maps T star from M predual to the Banach dual of matrices and S star back. The middle dual norm is trace norm. On two positive coordinate tests an operator-norm replacement has maximal error at least one half, sharply. Trace-norm diagonal models factor the identity exactly.</desc>
<rect x="1" y="1" width="898" height="518" rx="14" fill="#f6f9fc" stroke="#a4b9c8"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24516e"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#17384d">
<text x="28" y="37" font-size="23" font-weight="bold">Dualizing reverses the maps and changes the middle norm</text>
<g fill="white" stroke="#819ead"><rect x="38" y="68" width="170" height="70" rx="7"/><rect x="330" y="68" width="240" height="70" rx="7"/><rect x="692" y="68" width="170" height="70" rx="7"/><rect x="38" y="213" width="170" height="70" rx="7"/><rect x="330" y="213" width="240" height="70" rx="7"/><rect x="692" y="213" width="170" height="70" rx="7"/></g>
<g text-anchor="middle" font-size="21"><text x="123" y="111">M</text><text x="450" y="99">Mₙ, operator norm</text><text x="450" y="124" font-size="17">‖X‖∞</text><text x="777" y="111">M</text><text x="123" y="255">M*</text><text x="450" y="243">Mₙ*, trace norm</text><text x="450" y="269" font-size="17">‖D‖₁ = Tr |D|</text><text x="777" y="255">M*</text></g>
<g stroke="#24516e" stroke-width="2.3" marker-end="url(#arrow)"><path d="M218 106H318"/><path d="M580 106H680"/><path d="M318 250H218"/><path d="M680 250H580"/></g>
<g text-anchor="middle" font-size="19"><text x="267" y="92">S</text><text x="632" y="92">T</text><text x="267" y="236">S*</text><text x="632" y="236">T*</text></g>
<text x="450" y="177" text-anchor="middle" font-size="18">Normal cpc maps above; cpc maps in the dual matrix orders below</text>
<text x="450" y="314" text-anchor="middle" font-size="16">* on maps denotes the preadjoint; M* denotes the predual.</text>
<rect x="28" y="337" width="412" height="153" rx="8" fill="#fff2ed" stroke="#bd755a"/>
<rect x="460" y="337" width="412" height="153" rx="8" fill="#edf8f0" stroke="#5e9471"/>
<text x="46" y="366" font-size="20" font-weight="bold">Operator-norm substitution</text>
<text x="46" y="396" font-size="17">0 ≤ U(eᵢ) ≤ I; v = V(I); v₁ + v₂ ≤ 1</text>
<text x="46" y="425" font-size="17">Both errors &lt; 1/2 force both vᵢ &gt; 1/2.</text>
<text x="46" y="465" font-size="19">maxᵢ ‖VU(eᵢ) − eᵢ‖₁ ≥ 1/2 (sharp)</text>
<text x="478" y="366" font-size="20" font-weight="bold">Correct trace-norm middle</text>
<text x="478" y="396" font-size="17">ℓ¹₂ → M₂* → ℓ¹₂ by diagonal maps</text>
<text x="478" y="425" font-size="17">Exact composite = id; ‖I₂‖₁ = 2</text>
<text x="478" y="465" font-size="19">No one-unit mass budget is imposed.</text>
</g></svg>
