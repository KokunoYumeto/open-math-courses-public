<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Small-corner repair and orthogonal residuals</title><desc id="desc">First choose the external finite-rank model and fix its dimension and operator bounds. Then shrink the internal repair parameter. In the maximality step, old residual blocks touch f and new residual blocks lie in its orthogonal complement. Their squared trace norms add.</desc>
<rect width="1120" height="650" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#142b49">
<text x="34" y="43" font-size="27" font-weight="bold">From an external finite-rank model to internal approximation</text>
<rect x="34" y="68" width="310" height="112" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="54" y="101" font-size="21">1. Choose a, then the model q</text><text x="54" y="132" font-size="18">m, B and x₁,…,xₘ are now fixed</text><text x="54" y="160" font-size="17">q acts on L²(M, τ)</text>
<path d="M352 123 H409 M397 115 L409 123 L397 131" stroke="#2563eb" stroke-width="3" fill="none"/>
<rect x="420" y="68" width="305" height="112" rx="10" fill="#d1fae5" stroke="#047857"/>
<text x="440" y="101" font-size="21">2. Decrease b with m, B fixed</text><text x="440" y="132" font-size="18">Dₘ(b), dₘ(b) → 0</text><text x="440" y="160" font-size="17">repair Gram relations inside M</text>
<path d="M733 123 H790 M778 115 L790 123 L778 131" stroke="#047857" stroke-width="3" fill="none"/>
<rect x="800" y="68" width="285" height="112" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="820" y="101" font-size="21">3. Select one support s</text><text x="820" y="132" font-size="17">small coefficient error</text><text x="820" y="160" font-size="17">and small commutator error</text>
<text x="34" y="222" font-size="24" font-weight="bold">Maximality: errors add over disjoint matrix blocks</text>
<text x="34" y="251" font-size="18">Sections 06–07 · f is the old support; g is new; r = 1 − f − g.</text>
<g stroke="#64748b" stroke-width="1">
<rect x="80" y="305" width="105" height="78" fill="#bfdbfe"/><rect x="185" y="305" width="105" height="78" fill="#bfdbfe"/><rect x="290" y="305" width="105" height="78" fill="#bfdbfe"/>
<rect x="80" y="383" width="105" height="78" fill="#bfdbfe"/><rect x="185" y="383" width="105" height="78" fill="#a7f3d0"/><rect x="290" y="383" width="105" height="78" fill="#a7f3d0"/>
<rect x="80" y="461" width="105" height="78" fill="#bfdbfe"/><rect x="185" y="461" width="105" height="78" fill="#a7f3d0"/><rect x="290" y="461" width="105" height="78" fill="#e2e8f0"/>
</g>
<g font-size="23" text-anchor="middle">
<text x="132" y="290">f</text><text x="237" y="290">g</text><text x="342" y="290">r</text>
<text x="54" y="352">f</text><text x="54" y="430">g</text><text x="54" y="508">r</text>
<text x="132" y="352">R</text><text x="237" y="352">R</text><text x="342" y="352">R</text>
<text x="132" y="430">R</text><text x="237" y="430">S</text><text x="342" y="430">S</text>
<text x="132" y="508">R</text><text x="237" y="508">S</text><text x="342" y="508">0</text>
</g>
<text x="448" y="321" font-size="21" fill="#1d4ed8">R: old residual, touching f</text>
<text x="448" y="357" font-size="21" fill="#047857">S: new residual in (1 − f)M(1 − f)</text>
<text x="448" y="401" font-size="23">⟨R, S⟩₂ = 0</text>
<text x="448" y="443" font-size="23">‖R + S‖₂² = ‖R‖₂² + ‖S‖₂²</text>
<text x="448" y="485" font-size="21">≤ ε² τ(f) + (ε²/2) τ(g) ≤ ε² τ(f + g)</text>
<text x="448" y="524" font-size="18">If f ≠ 1, the new nonzero g contradicts maximality.</text>
<text x="34" y="584" font-size="18">The colored cells show support positions, not scalar entries or a claim that f, g and r have equal trace.</text>
<text x="34" y="616" font-size="18">The gg residual is gxg − E_B(gxg). The gray rr block contributes zero to the extension error.</text>
</g></svg>
