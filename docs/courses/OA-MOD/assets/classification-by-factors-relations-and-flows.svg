<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="title desc">
<title id="title">Classification by factors, relations and flows</title>
<desc id="desc">The isomorphism classes of ergodic AF principal measured relations and separable AFD factors are in bijection. Their associated flow and flow of weights agree. All semifinite classes have the real translation flow, so their type labels must be retained. Type III lambda has circle length minus log lambda, type III one has the one-point flow, and type III zero has a properly ergodic flow. These arrows classify objects and do not identify automorphism groups.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#246b79"/></marker></defs>
<rect width="1120" height="730" fill="#fafbf9"/>
<g font-family="Arial, sans-serif" fill="#15333d">
<text x="560" y="44" text-anchor="middle" font-size="28" font-weight="bold">One dictionary of classification classes</text>
<text x="560" y="74" text-anchor="middle" font-size="17">Standard measured relations · separable preduals · time-preserving flow conjugacy</text>
<rect x="45" y="112" width="370" height="103" rx="12" fill="#e4f1ee" stroke="#246b79" stroke-width="2"/>
<text x="230" y="151" text-anchor="middle" font-size="23">Ergodic AF principal relations</text>
<text x="230" y="184" text-anchor="middle" font-size="18">modulo measure-class orbit equivalence</text>
<rect x="705" y="112" width="370" height="103" rx="12" fill="#e4f1ee" stroke="#246b79" stroke-width="2"/>
<text x="890" y="151" text-anchor="middle" font-size="23">AFD factors</text>
<text x="890" y="184" text-anchor="middle" font-size="18">modulo normal star isomorphism</text>
<path d="M425 163H695" stroke="#246b79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="560" y="132" text-anchor="middle" font-size="20">R ↦ M(R)</text>
<text x="560" y="194" text-anchor="middle" font-size="17">bijection of classes (§8)</text>
<path d="M230 225L400 315" stroke="#246b79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M890 225L720 315" stroke="#246b79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="216" y="281" text-anchor="middle" font-size="19">associated flow</text>
<text x="902" y="281" text-anchor="middle" font-size="19">flow of weights</text>
<rect x="350" y="316" width="420" height="68" rx="12" fill="#eef0f8" stroke="#57618b" stroke-width="2"/>
<text x="560" y="345" text-anchor="middle" font-size="22">The same flow conjugacy class</text>
<text x="560" y="371" text-anchor="middle" font-size="17">full core identification (§2)</text>
<rect x="70" y="417" width="980" height="229" rx="10" fill="white" stroke="#c4d0d2"/>
<path d="M70 463H1050M70 506H1050M70 549H1050M70 592H1050M550 417V646" stroke="#c4d0d2"/>
<text x="95" y="447" font-size="20" font-weight="bold">Factor / relation parameter</text>
<text x="575" y="447" font-size="20" font-weight="bold">Its flow</text>
<text x="95" y="492" font-size="20">Iₙ (n = 1, 2, …, ∞), II₁, II∞</text>
<text x="575" y="492" font-size="20">Translation on ℝ — retain the type label</text>
<text x="95" y="535" font-size="20">IIIλ, 0 &lt; λ &lt; 1</text>
<text x="575" y="535" font-size="20">Circle of length −log λ (§3)</text>
<text x="95" y="578" font-size="20">III₁</text>
<text x="575" y="578" font-size="20">One point</text>
<text x="95" y="621" font-size="20">III₀, with flow F</text>
<text x="575" y="621" font-size="20">Properly ergodic F; every F occurs (§4)</text>
<text x="560" y="685" text-anchor="middle" font-size="19">Inner automorphisms induce the identity on the flow (§9).</text>
<text x="560" y="713" text-anchor="middle" font-size="17">A classification of objects does not retain all their automorphisms.</text>
</g></svg>
