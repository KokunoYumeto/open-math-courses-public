<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Coherent inner implementers on a finite return class</title>
<desc id="desc">Three consecutive points y, Ty and T squared y lie in one finite class. A unitary chosen at y is transported along the two internal edges. At the next point the root changes, and only there can compatibility fail. The target boundary projection decreases to zero. Normal predual tests and Fourier coefficient density give convergence on the whole crossed product.</desc>
<rect width="1120" height="650" fill="#f7f9fc"/>
<g font-family="Georgia,serif" fill="#153148">
<text x="40" y="48" font-size="28">One choice per finite class; exact transport inside it</text>
<text x="40" y="82" font-size="18">An example class contains y, Ty and T²y. General classes may have gaps.</text>
<rect x="40" y="115" width="735" height="230" rx="14" fill="#e3f0ec" stroke="#4b7c68"/>
<rect x="840" y="115" width="240" height="230" rx="14" fill="#f8e9e3" stroke="#a96d55"/>
<text x="65" y="148" font-size="19">Same root qₙ = y</text>
<text x="860" y="148" font-size="19">A different root</text>
<g fill="#fff" stroke="#3d6d5c" stroke-width="2">
<circle cx="135" cy="205" r="29"/><circle cx="390" cy="205" r="29"/><circle cx="665" cy="205" r="29"/>
</g>
<circle cx="960" cy="205" r="29" fill="#fff" stroke="#a96d55" stroke-width="2"/>
<g text-anchor="middle" font-size="21">
<text x="135" y="212">y</text><text x="390" y="212">Ty</text><text x="665" y="212">T²y</text><text x="960" y="212">T³y</text>
</g>
<path d="M172 205 H350 M338 197 L350 205 L338 213 M430 205 H625 M613 197 L625 205 L613 213" fill="none" stroke="#3d6d5c" stroke-width="2.5"/>
<path d="M705 205 H920" stroke="#a75237" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M908 197 L920 205 L908 213" fill="none" stroke="#a75237" stroke-width="2.5"/>
<g text-anchor="middle" font-size="18">
<text x="135" y="267">wₙ(y) = v</text>
<text x="390" y="267">wₙ(Ty) = ρᵧ(v)</text>
<text x="665" y="267">wₙ(T²y) = ρ<tspan baseline-shift="sub" font-size="13">Ty</tspan><tspan baseline-shift="baseline"> ρᵧ(v)</tspan></text>
<text x="960" y="267">New local choice</text>
<text x="408" y="316">θ(wₙ) = wₙ on the two internal target points</text>
<text x="960" y="316">Possible error</text>
</g>
<rect x="40" y="380" width="1040" height="100" rx="12" fill="#fff" stroke="#a5b6c2"/>
<text x="65" y="415" font-size="21">Bₙ = {b : (T⁻¹b, b) ∉ Rₙ},  eₙ = 1<tspan baseline-shift="sub" font-size="15">Bₙ</tspan><tspan baseline-shift="baseline"> ↓ 0</tspan></text>
<text x="65" y="453" font-size="20">θ(wₙ) − wₙ is supported on eₙ;  ‖θ(wₙ) − wₙ‖<tspan baseline-shift="sub" font-size="14">φ,#</tspan><tspan baseline-shift="super" font-size="14">2</tspan> ≤ 8 φ(eₙ) → 0.</text>
<rect x="40" y="510" width="1040" height="105" rx="12" fill="#fff" stroke="#a5b6c2"/>
<text x="65" y="546" font-size="20">Finite predual tests at every point of a class are satisfied by the one root choice.</text>
<text x="65" y="582" font-size="20">Ad(wₙ) → a on N; Fourier coefficient functionals give Ad(wₙ) → γ on M.</text>
</g>
</svg>
