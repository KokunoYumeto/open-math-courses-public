<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="710" viewBox="0 0 1180 710" role="img" aria-labelledby="title desc">
<title id="title">A continuous section of the module map</title>
<desc id="desc">For a flow automorphism B, its target-coordinate density r_B corrects the coefficient action by b at time minus log r_B. This lift preserves the integral trace, commutes with the scaling action, and fixes the crossed-product unitaries. Its canonical extension is beta_B tensor identity, so its module is B. Transport to the given factor uses conjugation by the actual induced flow map kappa. All arrows are continuous homomorphisms.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#276675"/></marker></defs>
<rect width="1180" height="710" fill="#fafbf9"/>
<g font-family="Arial, sans-serif" fill="#17323b">
<text x="590" y="44" text-anchor="middle" font-size="28" font-weight="bold">Lift every flow automorphism coherently</text>
<text x="590" y="76" text-anchor="middle" font-size="18">One trace-scaling flow bᵤ, with τ₀ bᵤ = e⁻ᵘ τ₀, supplies every correction</text>
<rect x="35" y="115" width="260" height="103" rx="11" fill="#e5f2ee" stroke="#276675" stroke-width="2"/>
<text x="165" y="153" text-anchor="middle" font-size="23">B ∈ Autθ(C)</text>
<text x="165" y="186" text-anchor="middle" font-size="17">B commutes with the flow</text>
<rect x="460" y="115" width="260" height="103" rx="11" fill="#e5f2ee" stroke="#276675" stroke-width="2"/>
<text x="590" y="153" text-anchor="middle" font-size="23">βB ∈ Aut(N)</text>
<text x="590" y="186" text-anchor="middle" font-size="17">preserves τ; commutes with δ</text>
<rect x="885" y="115" width="260" height="103" rx="11" fill="#e5f2ee" stroke="#276675" stroke-width="2"/>
<text x="1015" y="153" text-anchor="middle" font-size="23">αB ∈ Aut(P)</text>
<text x="1015" y="186" text-anchor="middle" font-size="17">fixes every λ(t)</text>
<path d="M305 165H450M730 165H875" fill="none" stroke="#276675" stroke-width="3" marker-end="url(#arrow)"/>
<text x="377" y="139" text-anchor="middle" font-size="17">density correction</text>
<text x="803" y="139" text-anchor="middle" font-size="17">cross by δ</text>
<rect x="75" y="258" width="1030" height="108" rx="10" fill="white" stroke="#c2cfd1"/>
<text x="590" y="290" text-anchor="middle" font-size="21">rB = d(B*μ)/dμ at the target point x</text>
<text x="590" y="322" text-anchor="middle" font-size="22">βB(A)(x) = b−log rB(x)( A(B⁻¹x) )</text>
<text x="590" y="350" text-anchor="middle" font-size="18">rBD(x) = rB(x) rD(B⁻¹x)  ⇒  βB βD = βBD  (§§2–3)</text>
<path d="M1015 228V398H730" fill="none" stroke="#276675" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="460" y="383" width="260" height="100" rx="11" fill="#edf0f8" stroke="#596587" stroke-width="2"/>
<text x="590" y="417" text-anchor="middle" font-size="23">Core extension</text>
<text x="590" y="450" text-anchor="middle" font-size="21">βB ⊗ id</text>
<text x="894" y="428" text-anchor="middle" font-size="17">invariant dual weight</text>
<text x="894" y="454" text-anchor="middle" font-size="17">and full double duality (§7)</text>
<path d="M450 434H305" fill="none" stroke="#276675" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="383" width="260" height="100" rx="11" fill="#edf0f8" stroke="#596587" stroke-width="2"/>
<text x="165" y="418" text-anchor="middle" font-size="23">Module on the center</text>
<text x="165" y="451" text-anchor="middle" font-size="23">B</text>
<text x="377" y="420" text-anchor="middle" font-size="17">restrict to C ⊗ 1</text>
<rect x="75" y="525" width="1030" height="147" rx="10" fill="#fff6e6" stroke="#c49b56"/>
<text x="590" y="560" text-anchor="middle" font-size="22" font-weight="bold">Transport to the prescribed factor M</text>
<text x="590" y="598" text-anchor="middle" font-size="23">s(B) = T α(κ⁻¹Bκ) T⁻¹     ⇒     mod(s(B)) = B</text>
<text x="590" y="633" text-anchor="middle" font-size="18">T : P → M is a fixed normal isomorphism; κ is its actual map on the flow.</text>
<text x="590" y="659" text-anchor="middle" font-size="18">The section is a continuous homomorphism (§§4–5, 8), with exact multiplication.</text>
<text x="590" y="697" text-anchor="middle" font-size="17">The construction permits arbitrary nonsingular B; preserving the chosen μ is not required.</text>
</g></svg>
