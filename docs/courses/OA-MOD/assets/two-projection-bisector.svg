<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
<title id="title">Two projections in original and bisector coordinates</title>
<desc id="desc">At theta equal to pi over three, the first pair has angles zero and sixty degrees; the rotated coordinates have angles minus and plus thirty degrees. Each two by two matrix acts with arbitrary multiplicity K; both projections vanish on the separate common kernel H zero.</desc>
<rect width="1080" height="540" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#162338">
<text x="40" y="43" font-size="25" font-weight="bold">The pair on its joint support: zH ≅ K ⊕ K</text>
<text x="40" y="74" font-size="18">Illustrated scalar case: θ = π/3, c = 1/2, s = √3/2</text>
<rect x="30" y="98" width="490" height="320" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="540" y="98" width="510" height="320" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="52" y="130" font-size="21" font-weight="bold">Original coordinates</text>
<text x="562" y="130" font-size="21" font-weight="bold">Bisector coordinates</text>
<g stroke="#cbd5e1" stroke-width="1.5">
<path d="M90 325 H465 M150 375 V160"/>
<path d="M605 275 H1000 M715 370 V158"/>
</g>
<g fill="none" stroke-width="5" stroke-linecap="round">
<path d="M150 325 L340 325" stroke="#2166ac"/>
<path d="M150 325 L245 160.455173" stroke="#b74472"/>
<path d="M715 275 L879.544827 370" stroke="#2166ac"/>
<path d="M715 275 L879.544827 180" stroke="#b74472"/>
</g>
<g fill="none" stroke="#68778b" stroke-width="2">
<path d="M196 325 A46 46 0 0 0 173 285.162831"/>
<path d="M754.837169 298 A46 46 0 0 0 754.837169 252"/>
</g>
<text x="210" y="304" font-size="19">θ</text>
<text x="773" y="271" font-size="18">θ/2</text>
<text x="773" y="297" font-size="18">θ/2</text>
<g font-size="19">
<text x="350" y="332" fill="#2166ac">e: (1, 0)</text>
<text x="257" y="175" fill="#b74472">f: (c, s)</text>
<text x="894" y="372" fill="#2166ac">e: (a, −b)</text>
<text x="894" y="184" fill="#b74472">f: (a, b)</text>
</g>
<text x="52" y="399" font-size="17">e = E₁₁,   f = (c, s)(c, s)ᵀ</text>
<text x="562" y="399" font-size="17">a = √((1+c)/2),   b = √((1−c)/2)</text>
<rect x="30" y="437" width="1020" height="78" rx="10" fill="#eaf0f7" stroke="#cbd5e1"/>
<text x="50" y="466" font-size="19">Every scalar matrix is tensored with 1<tspan baseline-shift="sub" font-size="14">K</tspan>.  The common kernel H₀ is separate: e|H₀ = f|H₀ = 0.</text>
<text x="50" y="495" font-size="18">Generated algebra: M₂ with identity z; adjoining 1<tspan baseline-shift="sub" font-size="13">H</tspan> adds a scalar summand exactly when H₀ ≠ 0.</text>
</g>
</svg>
