<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">Transferring a normal finite matrix model</title>
<desc id="desc">Compress M to a support corner pMp, apply its normal preserving expectation onto a separable subalgebra N, and record in M n. Reconstruct in N and include into pMp and M. The positive-functional error is at most delta plus twice the square root of psi of one times psi of one minus p.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#294a64"/></marker></defs>
<rect width="1000" height="570" rx="18" fill="#f7fafc"/>
<text x="40" y="43" font-family="sans-serif" font-size="25" font-weight="700" fill="#18394e">Normal models on arbitrary von Neumann algebras</text>
<text x="40" y="75" font-family="sans-serif" font-size="17" fill="#405569">The faithful state is used inside the support corner.</text>
<g fill="#fff" stroke="#416b87" stroke-width="2">
<rect x="40" y="145" width="155" height="76" rx="10"/>
<rect x="280" y="145" width="155" height="76" rx="10"/>
<rect x="520" y="145" width="155" height="76" rx="10"/>
<rect x="780" y="145" width="175" height="76" rx="10"/>
<rect x="40" y="320" width="155" height="76" rx="10"/>
<rect x="280" y="320" width="155" height="76" rx="10"/>
<rect x="520" y="320" width="155" height="76" rx="10"/>
<rect x="780" y="320" width="175" height="76" rx="10"/>
</g>
<g font-family="serif" font-size="30" text-anchor="middle" fill="#18394e">
<text x="117" y="192">M</text><text x="357" y="192">pMp</text><text x="597" y="192">N</text><text x="867" y="192">Mₙ(ℂ)</text>
<text x="117" y="367">M</text><text x="357" y="367">pMp</text><text x="597" y="367">N</text><text x="867" y="367">Mₙ(ℂ)</text>
</g>
<g stroke="#294a64" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
<path d="M197 183H274"/><path d="M437 183H514"/><path d="M677 183H774"/>
<path d="M867 223V313"/>
<path d="M778 358H681"/><path d="M518 358H441"/><path d="M278 358H201"/>
</g>
<g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#294a64">
<text x="237" y="121">x ↦ pxp</text><text x="477" y="121">E</text><text x="727" y="121">S</text>
<text x="477" y="252">preserving</text><text x="597" y="281">separable predual</text>
<text x="727" y="302">T</text><text x="477" y="302">include</text><text x="237" y="302">include</text>
<text x="886" y="270" text-anchor="start">identity</text>
</g>
<rect x="40" y="430" width="915" height="100" rx="10" fill="#e6eff5"/>
<text x="62" y="461" font-family="sans-serif" font-size="18" fill="#18394e">For ψ ≥ 0, retaining ψ restricted to pMp, and inner norm error &lt; δ:</text>
<text x="62" y="495" font-family="serif" font-size="25" fill="#18394e">‖ψΘ − ψ‖ &lt; δ + 2√(ψ(1)ψ(1−p))</text>
<text x="975" y="552" text-anchor="end" font-family="sans-serif" font-size="15" fill="#405569">SMH.34–40 · all arrows normal and completely positive · 0 ≤ Θ(1) ≤ p</text>
</svg>
