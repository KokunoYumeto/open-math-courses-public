<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Full-group matching of one matrix array and growing finite corners</title>
<desc id="desc">A partial orbit map from Z i to phi Z i goes through Z 1 and phi Z 1. Combining these maps matches every matrix unit exactly. On infinite measure, increasing corners include both within-sheet and between-sheet arrows, and their approximation converges on dense trace L2 vectors.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#285e82" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="510" rx="16" fill="#f6f9fc"/>
<g font-family="Arial, sans-serif" fill="#17354b">
<text x="35" y="43" font-size="24" font-weight="bold">Exact matching on a finite array</text>
<text x="35" y="73" font-size="18">Every arrow below stays inside the measured relation R.</text>
<g fill="#fff" stroke="#90abc1" stroke-width="2">
<rect x="42" y="120" width="155" height="64" rx="10"/>
<rect x="320" y="120" width="155" height="64" rx="10"/>
<rect x="603" y="120" width="155" height="64" rx="10"/>
<rect x="900" y="120" width="155" height="64" rx="10"/>
</g>
<g text-anchor="middle" font-size="23"><text x="119" y="160">Zᵢ</text><text x="397" y="160">Z₁</text><text x="680" y="160">φZ₁</text><text x="977" y="160">φZᵢ</text></g>
<g fill="none" stroke="#285e82" stroke-width="2.5" marker-end="url(#arrow)"><path d="M197 153 H310"/><path d="M475 153 H593"/><path d="M758 153 H890"/></g>
<g text-anchor="middle" font-size="20"><text x="254" y="132">U₁ᵢ</text><text x="534" y="132">v₁</text><text x="824" y="129">φUᵢ₁φ⁻¹</text></g>
<text x="45" y="219" font-size="20">Disjoint union over i:  v = Σᵢ α(eᵢ₁) v₁ e₁ᵢ = Vθ,    v eₖₗ v* = α(eₖₗ).</text>
<line x1="35" y1="245" x2="1065" y2="245" stroke="#b7c9d8"/>
<text x="35" y="281" font-size="24" font-weight="bold">Increasing finite corners at infinite measure</text>
<g fill="#e5f1e8" stroke="#58816b" stroke-width="2">
<rect x="42" y="315" width="150" height="75" rx="8"/>
<rect x="293" y="315" width="240" height="75" rx="8"/>
<rect x="635" y="315" width="330" height="75" rx="8"/>
</g>
<g text-anchor="middle" font-size="21"><text x="117" y="346">E₁ = X₁</text><text x="413" y="346">E₂ = X₁ ∪ X₂</text><text x="800" y="346">E₃ = X₁ ∪ X₂ ∪ X₃</text></g>
<g text-anchor="middle" font-size="17"><text x="117" y="374">p₁ M p₁</text><text x="413" y="374">p₂ M p₂</text><text x="800" y="374">p₃ M p₃</text></g>
<g font-size="30" text-anchor="middle"><text x="241" y="361">⊂</text><text x="581" y="361">⊂</text><text x="1017" y="361">⋯</text></g>
<text x="45" y="430" font-size="20">Each corner contains all arrows with both endpoints in Eₙ.</text>
<text x="45" y="464" font-size="20">Dense L² tests + the error bound (FGN.13) give convergence in the u-topology.</text>
</g></svg>
