<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Return-cocycle comparison over a common suspension base</title>
<desc id="desc">Both models have measure nu times lambda zero and return multiplier exp minus r divided by the base Jacobian. A transfer f in the closure of the full group compares their return maps up to a full-group element h. Type III orbit matching then absorbs the complete integer relation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#24648a"/></marker></defs>
<rect width="1200" height="730" rx="16" fill="#f5f9fc"/>
<g font-family="Arial, sans-serif" fill="#15364b">
<text x="32" y="40" font-size="25" font-weight="bold">Compare returns while retaining the whole orbit relation</text>
<rect x="32" y="62" width="1136" height="96" rx="10" fill="#e4f2e8"/>
<text x="54" y="96" font-size="21">Both product models: (B × Y₀, ν ⊗ λ₀), with vertical relation {b} × R₀.</text>
<text x="54" y="132" font-size="22">c(ρ₁(b)) = c(ρ₂(b)) = exp(−r(b)) / J_T(b).   [OEC.27]</text>
<rect x="50" y="198" width="395" height="89" rx="10" fill="white" stroke="#789db5" stroke-width="2"/>
<rect x="748" y="198" width="402" height="89" rx="10" fill="white" stroke="#789db5" stroke-width="2"/>
<text x="247" y="232" text-anchor="middle" font-size="20">Model 1: starting point</text>
<text x="247" y="265" text-anchor="middle" font-size="24">(b, y)</text>
<text x="949" y="232" text-anchor="middle" font-size="20">First return</text>
<text x="949" y="265" text-anchor="middle" font-size="24">(Tb, ρ₁(b)y)</text>
<path d="M450,244 L735,244" fill="none" stroke="#24648a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="592" y="226" text-anchor="middle" font-size="22">a₁</text>
<path d="M247,294 L247,390" fill="none" stroke="#24648a" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M949,294 L949,390" fill="none" stroke="#24648a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="266" y="344" font-size="20">W at b</text>
<text x="965" y="344" font-size="20">W at Tb</text>
<rect x="50" y="402" width="395" height="89" rx="10" fill="white" stroke="#789db5" stroke-width="2"/>
<rect x="748" y="402" width="402" height="89" rx="10" fill="white" stroke="#789db5" stroke-width="2"/>
<text x="247" y="436" text-anchor="middle" font-size="20">Transferred starting point</text>
<text x="247" y="469" text-anchor="middle" font-size="24">(b, f(b)y)</text>
<text x="949" y="436" text-anchor="middle" font-size="20">Transferred first return</text>
<text x="949" y="469" text-anchor="middle" font-size="23">(Tb, f(Tb)ρ₁(b)y)</text>
<path d="M450,448 L735,448" fill="none" stroke="#24648a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="592" y="421" text-anchor="middle" font-size="20">a₂ followed by h_b⁻¹</text>
<text x="592" y="479" text-anchor="middle" font-size="18">h_b acts in the target fibre</text>
<text x="50" y="532" font-size="21">ρ₂(b) = h_b f(Tb)ρ₁(b)f(b)⁻¹, with f(b) ∈ closure([R₀]) and h_b ∈ [R₀].</text>
<text x="50" y="566" font-size="20">The h_b step stays within one vertical orbit; W preserves the entire vertical relation.</text>
<line x1="32" y1="590" x2="1168" y2="590" stroke="#bfd1dc"/>
<text x="50" y="625" font-size="22" font-weight="bold">Stable orbit equivalence → orbit equivalence</text>
<text x="50" y="660" font-size="21">R₁ × Iℤ ≅ R₂ × Iℤ, and A_R(x,n) = v_n(x) identifies R × Iℤ with R in type III.</text>
<text x="50" y="695" font-size="19">Each v_n maps X onto a different positive partition member along R. [OEC.36–38]</text>
</g></svg>
