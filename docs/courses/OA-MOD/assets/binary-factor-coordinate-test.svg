<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
<title id="title">Binary coordinates and the single-factor interval</title>
<desc id="desc">At the third coordinate, bit one gives V tilde at depth two and bit zero excludes it. In the negative induction, the interval from index three to four is a single factor N. Inside the interval from one to six, reorder this distinguished copy first; the other four copies and Q form Q prime.</desc>
<rect width="1000" height="780" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#14243b">
<text x="40" y="44" font-size="27" font-weight="bold">Each bit has an intrinsic test</text>
<text x="40" y="76" font-size="19">BCF-09: coordinate k corresponds to depth k − 1.</text>
<rect x="36" y="100" width="928" height="235" rx="14" fill="white" stroke="#cbd5e1"/>
<text x="62" y="142" font-size="21">Binary sequence</text>
<text x="465" y="142" font-size="21">Its tracial ultrapower</text>
<text x="64" y="202" font-size="28">α = (1, 0,</text>
<rect x="184" y="169" width="45" height="48" rx="7" fill="#d1fae5" stroke="#15803d"/>
<text x="198" y="202" font-size="28" fill="#166534">1</text>
<text x="236" y="202" font-size="28">, …)</text>
<path d="M315 192 H420 M408 184 L420 192 L408 200" stroke="#15803d" stroke-width="3" fill="none"/>
<text x="465" y="200" font-size="23" fill="#166534">has Ṽ at depth 2</text>
<text x="64" y="269" font-size="28">β = (1, 0,</text>
<rect x="184" y="236" width="45" height="48" rx="7" fill="#fee2e2" stroke="#b91c1c"/>
<text x="198" y="269" font-size="28" fill="#991b1b">0</text>
<text x="236" y="269" font-size="28">, …)</text>
<path d="M315 259 H420 M408 251 L420 259 L408 267" stroke="#b91c1c" stroke-width="3" fill="none"/>
<text x="465" y="267" font-size="23" fill="#991b1b">does not have Ṽ at depth 2</text>
<text x="64" y="313" font-size="18">Later coordinates may be arbitrary. These two factors cannot be isomorphic.</text>
<text x="40" y="384" font-size="27" font-weight="bold">Why adjacent indices matter in the negative induction</text>
<text x="40" y="416" font-size="19">BCF-08: one coordinate with (n₁, n₂, n₃, n₄) = (1, 3, 4, 6).</text>
<rect x="36" y="438" width="928" height="306" rx="14" fill="white" stroke="#cbd5e1"/>
<text x="62" y="472" font-size="18">The right endpoint has copies at indices 1, 2, 3, 4, 5, together with Q.</text>
<g font-size="22" text-anchor="middle">
<rect x="70" y="492" width="116" height="62" rx="6" fill="#e2e8f0"/><text x="128" y="532">N (1)</text>
<text x="206" y="532">⊗</text>
<rect x="226" y="492" width="116" height="62" rx="6" fill="#e2e8f0"/><text x="284" y="532">N (2)</text>
<text x="362" y="532">⊗</text>
<rect x="382" y="492" width="116" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="440" y="532" fill="#1e40af">N (3)</text>
<text x="518" y="532">⊗</text>
<rect x="538" y="492" width="116" height="62" rx="6" fill="#e2e8f0"/><text x="596" y="532">N (4)</text>
<text x="674" y="532">⊗</text>
<rect x="694" y="492" width="116" height="62" rx="6" fill="#e2e8f0"/><text x="752" y="532">N (5)</text>
<text x="830" y="532">⊗</text>
<rect x="850" y="492" width="70" height="62" rx="6" fill="#e2e8f0"/><text x="885" y="532">Q</text>
</g>
<text x="62" y="589" font-size="19" fill="#1e40af">The left endpoint is exactly the highlighted copy: [3, 4) contains one index.</text>
<path d="M440 605 V631 M432 619 L440 631 L448 619" stroke="#334155" stroke-width="3" fill="none"/>
<text x="62" y="671" font-size="23">After reordering:</text>
<text x="265" y="671" font-size="23" fill="#1e40af">N (3)</text>
<text x="345" y="671" font-size="23">⊗ [ N (1) ⊗ N (2) ⊗ N (4) ⊗ N (5) ⊗ Q ]</text>
<path d="M386 684 V693 H897 V684" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="640" y="725" font-size="20" text-anchor="middle">Q′: the remaining finite tracial algebra</text>
</g>
</svg>
