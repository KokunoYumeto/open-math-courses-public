<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
<title>Centralizer partitions: preserve the corner hypothesis, reduce the error</title>
<desc>For N in the centralizer of a faithful normal state, set C equal to the relative commutant and Q equal to N joined with C. Zero Q-expectation survives compression. A moving unitary and its spectral partition reduce the squared pinching norm by at most three quarters. Refinements control a finite family. If C is contained in N, this yields abelian approximation with three explicit error budgets; factor partitions can be balanced.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#365771" stroke-width="1.7"/></marker></defs>
<rect width="1120" height="760" rx="16" fill="#f3f7fa"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#18344a">
<text x="34" y="43" font-size="27" font-weight="700">Finite partitions that preserve the state</text>
<text x="34" y="75" font-size="20">N ⊂ Mφ,   C = N′ ∩ M,   Q = N ∨ C,   φ faithful and normal</text>
<g stroke="#adbfce" stroke-width="2" fill="white">
<rect x="34" y="103" width="300" height="139" rx="11"/>
<rect x="405" y="103" width="310" height="139" rx="11"/>
<rect x="786" y="103" width="300" height="139" rx="11"/>
</g>
<g font-size="20">
<text x="54" y="136" font-weight="700">Zero expectation</text>
<text x="54" y="172">E<tspan baseline-shift="sub" font-size="15">Q</tspan>(x) = 0,   x ≠ 0</text>
<text x="54" y="212">⇒ E<tspan baseline-shift="sub" font-size="15">C</tspan>(x) = 0</text>
<text x="425" y="136" font-weight="700">A moving unitary in N</text>
<text x="425" y="174">‖uxu* − x‖φ &gt; ‖x‖φ</text>
<text x="425" y="212">finite spectral partition (pⱼ)</text>
<text x="806" y="136" font-weight="700">Pinching contracts</text>
<text x="806" y="174">‖Σ pⱼxpⱼ‖φ² ≤ ¾ ‖x‖φ²</text>
<text x="806" y="212">CPI04–05</text>
</g>
<g stroke="#365771" stroke-width="2.5" fill="none" marker-end="url(#a)">
<path d="M344 173 H395"/><path d="M725 173 H776"/><path d="M938 252 V293"/>
</g>
<rect x="34" y="304" width="1052" height="131" rx="11" fill="#e7eef7" stroke="#a5b9cf" stroke-width="2"/>
<text x="55" y="339" font-size="22" font-weight="700">The corner identity makes the next round valid</text>
<text x="55" y="377" font-size="21">eQe = eNe ∨ ((eNe)′ ∩ eMe),     E<tspan baseline-shift="sub" font-size="16">eQe</tspan>(exe) = eE<tspan baseline-shift="sub" font-size="16">Q</tspan>(x)e = 0</text>
<text x="55" y="412" font-size="20">l rounds: squared error ≤ (¾)ˡ ‖x‖φ².  Later refinements preserve earlier bounds.</text>
<g stroke="#365771" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M560 445 V485"/></g>
<rect x="34" y="499" width="1052" height="213" rx="11" fill="#e5f2e9" stroke="#a4c5af" stroke-width="2"/>
<text x="55" y="535" font-size="23" font-weight="700">If C ⊂ N: approximate the abelian expectation</text>
<text x="55" y="572" font-size="20">x = E<tspan baseline-shift="sub" font-size="15">N</tspan>(x) + (x − E<tspan baseline-shift="sub" font-size="15">N</tspan>(x)) = y + z</text>
<text x="55" y="608" font-size="20">MASA refinement: ‖D<tspan baseline-shift="sub" font-size="15">A</tspan>(y)‖φ &lt; ε/3;     pinching: ‖D<tspan baseline-shift="sub" font-size="15">A</tspan>(z)‖φ &lt; ε/3.</text>
<text x="55" y="646" font-size="20">Factor case: rational perturbation costs &lt; ε/3; equal-trace refinement costs no more.</text>
<text x="55" y="683" font-size="22" font-weight="700">D<tspan baseline-shift="sub" font-size="16">A</tspan> = E<tspan baseline-shift="sub" font-size="16">A′∩M</tspan> − E<tspan baseline-shift="sub" font-size="16">A</tspan>,     ‖D<tspan baseline-shift="sub" font-size="16">A</tspan>(x)‖φ &lt; ε.</text>
<text x="34" y="741" font-size="17">Proofs: CPI01–02 (expectations and limits), CPI03 (corners), CPI04–05 (reduction), CPI06 (approximation).</text>
</g>
</svg>
