</g>
<rect x="30" y="403" width="1060" height="275" rx="12" fill="#e7f1f3" stroke="#99b7ce"/>
<text x="50" y="436" font-size="21" font-weight="bold">4. Compare the corners inside P = {diag(Uₖ, Vₖ)}′ ∩ M₂(Q)</text>
<g stroke="#006a70" stroke-width="2" fill="#fff">
<rect x="65" y="467" width="220" height="125" rx="10"/>
