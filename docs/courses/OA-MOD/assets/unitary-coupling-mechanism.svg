<text x="400" y="823">t</text><text x="231" y="732">min(t, 2), r = 4</text></g>
<text x="495" y="743" font-size="21" font-weight="bold">Lift W to actual unitaries wₘ.</text>
<text x="495" y="778" font-size="19">All finite-tuple intertwining errors tend to zero along ω.</text>
<text x="495" y="813" font-size="18">UCF-06: the resulting threshold depends only on n and ε.</text>
