<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860">
<title>From balanced couplings to one unitary</title><desc>Finite four-phase sampling gives squared marginal error below 6/r. Clipping bounds norms by square-root-r and squared marginal error by 12/r without increasing energy. For fixed r, a tracial ultraproduct gives exact intertwiners. Normalized matrix corners have squared errors at most 6/r. Central tests give difference at most 2 square-root of 6/r, so comparison yields a unitary.</desc>
<rect width="1120" height="860" rx="14" fill="#f5f7fa"/>
<g font-family="Arial,sans-serif" fill="#172c43">
<text x="35" y="43" font-size="27" font-weight="bold">A balanced family becomes one unitary</text>
<text x="35" y="72" font-size="17">Finite phase averages → bounded operators → exact intertwiners → central comparison</text>
<g stroke="#99b7ce" fill="#fff" stroke-width="2">
<rect x="30" y="102" width="326" height="260" rx="12"/>
<rect x="397" y="102" width="326" height="260" rx="12"/>
<rect x="764" y="102" width="326" height="260" rx="12"/>
</g>
<g font-size="21" font-weight="bold">
<text x="48" y="134">1. Finite sampling</text>
<text x="415" y="134">2. Spectral clipping</text>
<text x="782" y="134">3. Fix r, then take ω</text>
</g>
<g font-size="18">
<text x="48" y="171">sᵢ ∈ {1, −1, i, −i}</text>
<text x="48" y="203">B = Σ sᵢ aᵢ</text>
<text x="48" y="235">r independent samples / √r</text>
<text x="48" y="278" fill="#006a70">Both squared errors &lt; 6/r</text>
<text x="48" y="311">Total energy &lt; 3nδ</text>
<text x="48" y="340" font-size="15">UCF-01: centered variance ≤ 1</text>
<text x="415" y="171">cⱼ = polar(bⱼ) min(|bⱼ|, √r)</text>
<text x="415" y="203">‖cⱼ‖ ≤ √r</text>
<text x="415" y="278" fill="#006a70">Both squared errors &lt; 12/r</text>
<text x="415" y="311">Energy does not increase</text>
<text x="415" y="340" font-size="15">UCF-02: trace-Hilbert contraction</text>
<text x="782" y="171">δₘ → 0,   ‖cⱼ(m)‖ ≤ √r</text>
<text x="782" y="203">Cⱼ = [cⱼ(m)] ∈ Q</text>
<text x="782" y="246" fill="#006a70">CⱼUₖ = VₖCⱼ</text>
<text x="782" y="278">Both squared errors ≤ 12/r</text>
<text x="782" y="311">Exact intertwining</text>
<text x="782" y="340" font-size="15">UCF-04–06: bounded classes</text>
</g>
<g stroke="#006a70" stroke-width="3" fill="none">
