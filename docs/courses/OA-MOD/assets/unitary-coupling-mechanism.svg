</g>
<g font-size="20" text-anchor="middle">
<text x="175" y="498">e = E₁₁</text><text x="175" y="534">Σ Dⱼ*Dⱼ ≈ e</text>
<text x="175" y="568" font-size="17">squared error ≤ 6/r</text>
<text x="670" y="498">f = E₂₂</text><text x="670" y="534">Σ DⱼDⱼ* ≈ f</text>
<text x="670" y="568" font-size="17">squared error ≤ 6/r</text>
<text x="420" y="493" font-size="18">Dⱼ has lower-left entry Cⱼ</text>
<text x="420" y="567" font-size="17">σ = ½(τ on each diagonal)</text>
</g>
<path d="M298 530h244m-12-9 12 9-12 9" stroke="#006a70" stroke-width="3" fill="none"/>
<g font-size="18"><text x="805" y="495">For every central z ∈ P:</text>
<text x="805" y="529">σ(z ΣDⱼ*Dⱼ)</text><text x="805" y="561">= σ(z ΣDⱼDⱼ*)</text></g>
<text x="65" y="627" font-size="22" fill="#006a70">|σ(ze) − σ(zf)| ≤ 2√(6/r) ‖z‖₂ → 0 as r → ∞</text>
<text x="65" y="657" font-size="18">UCF-03 and UCF-05: e ∼ f in P ⇒ W unitary in Q and WUₖ = VₖW.</text>
