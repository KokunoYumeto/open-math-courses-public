<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">Corner reconstruction and central descent</title><desc id="desc">Two proof routes. A full finite corner reconstructs a sigma-finite type II infinity algebra using countably many matrix units. Measurable finite matrix candidates prove local approximation for finite algebras, followed by exact central containment.</desc>
<rect width="1120" height="490" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172b4d">
<text x="35" y="42" font-size="26" font-weight="bold">Two constructions in the first injective-to-AFD proof</text>
<text x="35" y="79" font-size="18">Semifinite reconstruction · Sections 01, 03–04, 06</text>
<rect x="35" y="100" width="260" height="98" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="54" y="133" font-size="21">eMe,  e finite, c(e) = 1</text><text x="54" y="163" font-size="17">injectivity passes to the corner</text>
<path d="M300 149 H361 M349 141 L361 149 L349 157" fill="none" stroke="#2563eb" stroke-width="3"/>
<rect x="370" y="100" width="325" height="98" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="390" y="133" font-size="20">Σ pₙ = 1,  pₙ ∼ e</text><text x="390" y="163" font-size="17">W(ξ ⊗ δₙ) = uₙξ is onto</text>
<path d="M701 149 H762 M750 141 L762 149 L750 157" fill="none" stroke="#2563eb" stroke-width="3"/>
<rect x="770" y="100" width="315" height="98" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="790" y="133" font-size="20">M ≅ eMe ⊗ B(ℓ²)</text><text x="790" y="163" font-size="17">the same center; countable indices</text>
<text x="35" y="242" font-size="18">Finite central descent · Section 05</text>
<rect x="35" y="265" width="260" height="112" rx="10" fill="#d1fae5" stroke="#047857"/>
<text x="54" y="299" font-size="19">Countable matrix tests</text><text x="54" y="328" font-size="17">first qualifying candidate</text><text x="54" y="354" font-size="16">gives measurable central pieces</text>
<path d="M300 321 H361 M349 313 L361 321 L349 329" fill="none" stroke="#047857" stroke-width="3"/>
<rect x="370" y="265" width="325" height="112" rx="10" fill="#d1fae5" stroke="#047857"/>
<text x="390" y="299" font-size="20">Repair, then retain finitely many</text><text x="390" y="328" font-size="17">τ(1 − q) &lt; ε²/4</text><text x="390" y="354" font-size="17">squared total error &lt; ε²</text>
<path d="M701 321 H762 M750 313 L762 321 L750 329" fill="none" stroke="#047857" stroke-width="3"/>
<rect x="770" y="265" width="315" height="112" rx="10" fill="#d1fae5" stroke="#047857"/>
<text x="790" y="299" font-size="20">Dₙ = Aₙ Zₙ increasing</text><text x="790" y="328" font-size="17">exact retention of old matrices</text><text x="790" y="354" font-size="17">M ≅ Z(M) ⊗ R</text>
<text x="35" y="426" font-size="18">The arrows are proved constructions. Fiberwise isomorphisms alone do not perform the assembly.</text>
<text x="35" y="456" font-size="17">Spatial tensor products throughout. Finite central descent assumes separable predual.</text>
</g></svg>
