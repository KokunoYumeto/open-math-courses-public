<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Countable data inside a separable modular subalgebra</title>
<desc id="desc">A faithful normal state permits a countable modular orbit construction. The resulting subalgebra has separable predual and a preserving expectation. Specified functionals and symmetries are retained. Increasing families converge sigma strongly star on the algebra and in norm on the predual; a sequence exhausting separable preduals forces the ambient predual to be separable.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326875"/></marker></defs>
<rect width="1120" height="650" rx="14" fill="#f7fafb"/>
<g font-family="Arial, sans-serif" fill="#183247">
<text x="32" y="43" font-size="27" font-weight="700">Small modular subalgebras, exact normal tests</text>
<text x="32" y="75" font-size="19">M has a faithful normal state φ. The ambient predual need not be separable.</text>
<rect x="30" y="103" width="314" height="180" rx="12" fill="#e8efff" stroke="#7e9bbd"/>
<text x="48" y="133" font-size="19" font-weight="700">COUNTABLE INPUT</text>
<text x="48" y="166" font-size="19">Elements S ⊂ M</text>
<text x="48" y="197" font-size="19">Normal functionals ψ₁, ψ₂, …</text>
<text x="48" y="228" font-size="19">Approximation coefficients</text>
<text x="48" y="263" font-size="17">ψ ≈ Σ cₖ φ(bₖ* · aₖ)   ·   SMH-01</text>
<rect x="401" y="103" width="313" height="180" rx="12" fill="#e5f4ef" stroke="#74aa95"/>
<text x="419" y="133" font-size="19" font-weight="700">ADD MODULAR ORBITS</text>
<text x="419" y="166" font-size="19">σ<tspan baseline-shift="sub" font-size="14">q</tspan>(a), σ<tspan baseline-shift="sub" font-size="14">q</tspan>(b), σ<tspan baseline-shift="sub" font-size="14">q</tspan>(x), q ∈ ℚ</text>
<text x="419" y="197" font-size="19">N = W*(all these elements, 1)</text>
<text x="419" y="228" font-size="19">N<tspan baseline-shift="sub" font-size="14">*</tspan> is separable; σ<tspan baseline-shift="sub" font-size="14">t</tspan>(N) = N</text>
<text x="419" y="263" font-size="17">Faithful state + GNS   ·   SMH-02</text>
<rect x="770" y="103" width="320" height="180" rx="12" fill="#f1eafa" stroke="#ae89c7"/>
<text x="788" y="133" font-size="19" font-weight="700">PRESERVING EXPECTATION</text>
<text x="788" y="169" font-size="24">E : M → N,   φE = φ</text>
<text x="788" y="204" font-size="22">ψⱼE = ψⱼ,   ‖ψⱼ|N‖ = ‖ψⱼ‖</text>
<text x="788" y="236" font-size="19">N<tspan baseline-shift="sub" font-size="14">*</tspan> → M<tspan baseline-shift="sub" font-size="14">*</tspan> : η ↦ ηE is isometric</text>
<text x="788" y="263" font-size="17">Bimodularity + norm limits · SMH-03</text>
<path d="M 350 190 H 391" stroke="#326875" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M 720 190 H 760" stroke="#326875" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="313" width="1060" height="100" rx="12" fill="#edf2f6" stroke="#8ea3b4"/>
<text x="49" y="343" font-size="19" font-weight="700">COUNTABLY MANY SYMMETRIES CAN BE KEPT TOO</text>
<text x="49" y="374" font-size="20">Close the input under words in αⱼ, αⱼ⁻¹ and σ<tspan baseline-shift="sub" font-size="14">q</tspan>. If φαⱼ = φ, uniqueness gives Eαⱼ = αⱼE.</text>
<text x="49" y="399" font-size="17">No commutation of the symmetries is needed. · SMH-04</text>
<rect x="30" y="440" width="1060" height="117" rx="12" fill="#fff4d9" stroke="#c69b40"/>
<text x="49" y="470" font-size="19" font-weight="700">INCREASING EXPECTED SUBALGEBRAS GENERATING M</text>
<text x="49" y="502" font-size="21">EᵢEⱼ = EⱼEᵢ = Eᵢ for i ≤ j.     Eᵢ(x) → x sigma-strong*.     ‖ψEᵢ − ψ‖ → 0.</text>
<text x="49" y="536" font-size="18">Operator convergence uses GNS projections; predual norm convergence uses coefficients. · SMH-05–06</text>
<text x="33" y="588" font-size="18">Boundary: countable generation alone does not imply separable predual. · SMH-07</text>
<text x="33" y="615" font-size="18">A generating sequence of separable expected subalgebras would force M<tspan baseline-shift="sub" font-size="14">*</tspan> to be separable.</text>
<text x="33" y="641" font-size="14">Here N<tspan baseline-shift="sub" font-size="14">*</tspan> and M<tspan baseline-shift="sub" font-size="14">*</tspan> denote preduals. Original reproducible diagram · CC0-1.0</text>
</g></svg>
