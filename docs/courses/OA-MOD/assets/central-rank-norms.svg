<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
  <title id="title">Trace size and operator norm of a rank correction</title>
  <desc id="desc">The four groups of diagonal coordinates have multiplicities 255, 1, 1, 255. The coefficients of h are 1, one half, one half, 0; f has coefficients 1, 1, 1, 0; g has coefficients 1, 1, 0, 0. The difference f minus g is one rank-one diagonal of M512, tensored with the identity: trace one over 512, trace two-norm one over square root 512, operator norm one. Column widths are schematic.</desc>
  <rect width="640" height="450" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033" font-size="22">
    <text x="24" y="38" font-size="25" font-weight="bold">A small trace does not mean a small norm</text>
    <text x="24" y="70" font-size="18">First-factor diagonals in M₅₁₂ ⊗ 1; grouped columns</text>
    <text x="115" y="108">1–255</text><text x="280" y="108">256</text><text x="385" y="108">257</text><text x="485" y="108">258–512</text>
    <text x="27" y="152" font-style="italic">h</text><text x="27" y="208" font-style="italic">f</text><text x="27" y="264" font-style="italic">g</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5">
    <rect x="85" y="122" width="170" height="43" fill="#b6dce6"/><rect x="265" y="122" width="95" height="43" fill="#e4d2a8"/><rect x="370" y="122" width="95" height="43" fill="#e4d2a8"/><rect x="475" y="122" width="140" height="43" fill="#e8edf2"/>
    <rect x="85" y="178" width="170" height="43" fill="#b6dce6"/><rect x="265" y="178" width="95" height="43" fill="#b6dce6"/><rect x="370" y="178" width="95" height="43" fill="#f2b9b6"/><rect x="475" y="178" width="140" height="43" fill="#e8edf2"/>
    <rect x="85" y="234" width="170" height="43" fill="#b6dce6"/><rect x="265" y="234" width="95" height="43" fill="#b6dce6"/><rect x="370" y="234" width="95" height="43" fill="#e8edf2"/><rect x="475" y="234" width="140" height="43" fill="#e8edf2"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" font-size="24" text-anchor="middle">
    <text x="170" y="152">1</text><text x="312" y="152">½</text><text x="417" y="152">½</text><text x="545" y="152">0</text>
    <text x="170" y="208">1</text><text x="312" y="208">1</text><text x="417" y="208">1</text><text x="545" y="208">0</text>
    <text x="170" y="264">1</text><text x="312" y="264">1</text><text x="417" y="264">0</text><text x="545" y="264">0</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" font-size="21">
    <text x="25" y="316">Spectral rounding: rank(f) = 257</text>
    <text x="25" y="348">Rank adjustment: rank(g) = 256</text>
    <text x="25" y="385" fill="#9d2424">Red block: τ(f − g) = 1/512,  ‖f − g‖ = 1</text>
    <text x="25" y="420">‖f − g‖₂ = 1/√512    ·    Proof: SMA.15–18</text>
  </g>
</svg>
