<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Interleaving residual nets</title>
<desc id="desc">Eight nested subalgebras give a chain of relative commutants. An algebra C with property P between the two inner commutants is also between the two outer commutants.</desc>
<rect width="1000" height="470" rx="16" fill="#f7fafc"/>
<g font-family="Georgia,serif" fill="#182a38" text-anchor="middle">
<text x="500" y="42" font-size="26">Two residual nets give the same depth condition</text>
<text x="500" y="88" font-size="20">Cofinal choices give this inclusion order</text>
<text x="80" y="139" font-size="25">B<tspan baseline-shift="sub" font-size="70%">j4</tspan></text>
<text x="140" y="139" font-size="23">⊆</text>
<text x="200" y="139" font-size="25">A<tspan baseline-shift="sub" font-size="70%">i4</tspan></text>
<text x="260" y="139" font-size="23">⊆</text>
<text x="320" y="139" font-size="25">A<tspan baseline-shift="sub" font-size="70%">i3</tspan></text>
<text x="380" y="139" font-size="23">⊆</text>
<text x="440" y="139" font-size="25">B<tspan baseline-shift="sub" font-size="70%">j3</tspan></text>
<text x="500" y="139" font-size="23">⊆</text>
<text x="560" y="139" font-size="25">B<tspan baseline-shift="sub" font-size="70%">j2</tspan></text>
<text x="620" y="139" font-size="23">⊆</text>
<text x="680" y="139" font-size="25">A<tspan baseline-shift="sub" font-size="70%">i2</tspan></text>
<text x="740" y="139" font-size="23">⊆</text>
<text x="800" y="139" font-size="25">A<tspan baseline-shift="sub" font-size="70%">i1</tspan></text>
<text x="860" y="139" font-size="23">⊆</text>
<text x="920" y="139" font-size="25">B<tspan baseline-shift="sub" font-size="70%">j1</tspan></text>
<path d="M35 179 H965" stroke="#b8c7d1"/>
<text x="500" y="220" font-size="20">The relative commutants then enclose the same intermediate algebra</text>
<rect x="17" y="260" width="166" height="72" rx="10" fill="#dcebf5" stroke="#456b83"/>
<text x="100" y="304" font-size="23">B<tspan baseline-shift="sub" font-size="70%">j3</tspan>′ ∩ B<tspan baseline-shift="sub" font-size="70%">j2</tspan></text>
<text x="200" y="304" font-size="23">⊆</text>
<rect x="217" y="260" width="166" height="72" rx="10" fill="#dcebf5" stroke="#456b83"/>
<text x="300" y="304" font-size="23">A<tspan baseline-shift="sub" font-size="70%">i3</tspan>′ ∩ A<tspan baseline-shift="sub" font-size="70%">i2</tspan></text>
<text x="400" y="304" font-size="23">⊆</text>
<rect x="417" y="260" width="166" height="72" rx="10" fill="#e7dff4" stroke="#456b83"/>
<text x="500" y="304" font-size="18">C has property ℙ</text>
<text x="600" y="304" font-size="23">⊆</text>
<rect x="617" y="260" width="166" height="72" rx="10" fill="#dcebf5" stroke="#456b83"/>
<text x="700" y="304" font-size="23">A<tspan baseline-shift="sub" font-size="70%">i4</tspan>′ ∩ A<tspan baseline-shift="sub" font-size="70%">i1</tspan></text>
<text x="800" y="304" font-size="23">⊆</text>
<rect x="817" y="260" width="166" height="72" rx="10" fill="#dcebf5" stroke="#456b83"/>
<text x="900" y="304" font-size="23">B<tspan baseline-shift="sub" font-size="70%">j4</tspan>′ ∩ B<tspan baseline-shift="sub" font-size="70%">j1</tspan></text>
<text x="500" y="386" font-size="21">C is between the inner pair and therefore between the outer pair.</text>
<text x="500" y="431" font-size="17">RUP-07, equations (RUP.21)–(RUP.22). Equal algebras at different indices are permitted.</text>
</g></svg>
