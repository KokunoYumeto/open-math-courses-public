<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
<title id="title">Root-edge exception and the trace of a projection difference</title>
<desc id="desc">Left multiplication by a sends the edge from a inverse to the root to the edge from the root to a. The modified representation sends the nonroot vertex a inverse to a. For S equal E minus F, T equal one minus E minus F pairs the t and minus t eigenspaces for zero less than absolute t less than one. Endpoint multiplicities give the integer trace.</desc>
<rect width="1040" height="390" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172554">
<text x="34" y="38" font-size="23" font-weight="bold">The missing root</text><text x="568" y="38" font-size="23" font-weight="bold">The integer trace</text>
<path d="M520 24V360" stroke="#cbd5e1"/>
<path d="M80 126H258M258 126H436" stroke="#cbd5e1" stroke-width="5"/>
<path d="M80 126H258" stroke="#2563eb" stroke-width="6"/><path d="M258 126H436" stroke="#d97706" stroke-width="6"/>
<circle cx="80" cy="126" r="8" fill="#2563eb"/><circle cx="258" cy="126" r="9" fill="white" stroke="#334155" stroke-width="3"/><circle cx="436" cy="126" r="8" fill="#d97706"/>
<text x="64" y="164" font-size="23">a⁻¹</text><text x="251" y="164" font-size="23">e</text><text x="430" y="164" font-size="23">a</text>
<path d="M165 90Q260 44 354 90" fill="none" stroke="#334155" stroke-width="2"/><path d="M342 79L354 90L337 91" fill="none" stroke="#334155" stroke-width="2"/>
<text x="217" y="71" font-size="18">left × a</text>
<text x="54" y="222" font-size="21">π(a)δ</text><text x="108" y="228" font-size="14">a⁻¹</text><text x="133" y="222" font-size="21"> = δ</text><text x="178" y="228" font-size="14">a</text>
<text x="54" y="260" font-size="20">π₀(1) = 1 − p</text><text x="182" y="266" font-size="14">e</text>
<text x="54" y="300" font-size="18">One root coordinate survives:</text><text x="54" y="332" font-size="21">Tr(λ(x) − π₀(x)) = τ(x)</text>
<path d="M586 138H985" stroke="#94a3b8" stroke-width="2"/>
<g fill="#2563eb"><circle cx="704" cy="138" r="8"/><circle cx="868" cy="138" r="8"/></g><circle cx="586" cy="138" r="8" fill="#d97706"/><circle cx="985" cy="138" r="8" fill="#d97706"/>
<text x="574" y="173" font-size="21">−1</text><text x="690" y="173" font-size="21">−t</text><text x="861" y="173" font-size="21">t</text><text x="979" y="173" font-size="21">1</text>
<path d="M710 105Q786 57 862 105" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M716 93L710 105L724 104M850 104L862 105L856 93" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="716" y="73" font-size="18">T = 1 − E − F</text>
<text x="570" y="222" font-size="20">ST = −TS,   S² + T² = 1</text>
<text x="570" y="260" font-size="18">Equal multiplicities for ±t, 0 &lt; |t| &lt; 1</text>
<text x="570" y="300" font-size="18">Only the endpoints contribute:</text><text x="570" y="332" font-size="20">Tr(S) = dim ker(S − 1) − dim ker(S + 1)</text>
</g></svg>
