<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">Support corners and hypercentral tests</title><desc id="desc">A two by two corner decomposition of the ambient von Neumann algebra. Multipliers have zero off-diagonal corners. The support corner is the ultraproduct. For a fixed algebra the canonical state on its relative commutant has centralizer F. For separable predual, the commutant of F inside A is its bicentralizer.</desc>
<rect width="1080" height="650" rx="18" fill="#f5f7fb"/>
<g font-family="Arial, sans-serif" fill="#15243a">
<text x="42" y="48" font-size="28" font-weight="700">From a support corner to a hypercentral test</text>
<text x="42" y="82" font-size="18">Sections 01–06: faithful normal states; no predual separability required</text>
<rect x="45" y="112" width="515" height="247" rx="10" fill="white" stroke="#aebbd0" stroke-width="2"/>
<path d="M300 112V359 M45 235H560" stroke="#aebbd0" stroke-width="2"/>
<rect x="47" y="114" width="251" height="119" fill="#d8eee7"/>
<text x="78" y="158" font-size="24" font-weight="700">pRp ≅ Q</text>
<text x="78" y="192" font-size="18">The ultraproduct</text>
<text x="78" y="218" font-size="17">faithful corner state</text>
<text x="325" y="163" font-size="22">pR(1−p)</text>
<text x="325" y="199" font-size="17">left null, modulo I</text>
<text x="78" y="283" font-size="22">(1−p)Rp</text>
<text x="78" y="318" font-size="17">right null, modulo I</text>
<text x="325" y="283" font-size="22">(1−p)R(1−p)</text>
<text x="325" y="318" font-size="17">two-sided null sequences</text>
<text x="600" y="143" font-size="22" font-weight="700">Multiplier criterion · §04</text>
<text x="600" y="179" font-size="21">âp = pâ</text>
<text x="600" y="211" font-size="18">Both off-diagonal corners vanish.</text>
<text x="600" y="263" font-size="22" font-weight="700">Norm transfer · §05</text>
<text x="600" y="299" font-size="18">The functional f satisfies f(T) = f(pTp).</text>
<text x="600" y="331" font-size="18">Compression preserves its entire norm.</text>
<path d="M44 390H1036" stroke="#bbc6d4"/>
<text x="42" y="426" font-size="21" font-weight="700">A = M′ ∩ M<tspan baseline-shift="super" font-size="15">ω</tspan>  ·  ψ = φ<tspan baseline-shift="super" font-size="15">ω</tspan>|A  ·  F = M<tspan baseline-shift="sub" font-size="15">ω</tspan></text>
<text x="42" y="455" font-size="16">One fixed algebra M; ω is the given free ultrafilter.</text>
<rect x="44" y="480" width="440" height="79" rx="9" fill="#d8eee7"/>
<text x="67" y="513" font-size="21" font-weight="700">Centralizer identity · §06</text>
<text x="67" y="544" font-size="23">A<tspan baseline-shift="sub" font-size="16">ψ</tspan> = F</text>
<rect x="510" y="480" width="525" height="79" rx="9" fill="#e3e9f7"/>
<text x="532" y="513" font-size="21" font-weight="700">Bicentralizer identity · §07</text>
<text x="532" y="544" font-size="23">F′ ∩ A = B(A,ψ)  (M<tspan baseline-shift="sub" font-size="15">*</tspan> separable)</text>
<text x="44" y="599" font-size="20">Additional assertion needed for the hypercentral equality:</text>
<text x="44" y="628" font-size="22" font-weight="700">B(A,ψ) ⊆ A<tspan baseline-shift="sub" font-size="16">ψ</tspan>   ⇔   B(A,ψ) = Z(F)</text>
</g></svg>
