<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640" role="img" aria-labelledby="title desc">
<title id="title">A spectral cut with a trace budget</title>
<desc id="desc">For A equal to E of f, the spectral region above a has trace at most tau of A squared divided by a squared. The intersection q of f with the remaining spectral projection p has trace at least tau of f minus that bound, and E of q is at most a times the identity. Widths are schematic.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43556a"/></marker></defs>
<rect width="520" height="640" rx="18" fill="#f5f8fc"/>
<g font-family="Georgia,serif" fill="#182a40">
<text x="24" y="39" font-size="24">A spectral cut with a trace budget</text>
<text x="24" y="75" font-size="21">A = E(f),   a &gt; 0;   widths are schematic.</text>
<rect x="24" y="100" width="472" height="100" rx="8" fill="#d4ebe3" stroke="#30745d" stroke-width="2"/>
<text x="44" y="140" font-size="26">p = 1 − s((A − a1)₊)</text>
<text x="44" y="178" font-size="25">0 ≤ Ap ≤ ap</text>
<rect x="24" y="220" width="472" height="130" rx="8" fill="#f7e2cb" stroke="#b27635" stroke-width="2"/>
<text x="44" y="260" font-size="26">r = 1 − p,    A² ≥ a²r</text>
<text x="44" y="304" font-size="26">τ(r) ≤ τ(A²) / a²</text>
<path d="M260 355V386" stroke="#43556a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="396" width="472" height="182" rx="8" fill="#fff" stroke="#607995" stroke-width="2"/>
<text x="44" y="433" font-size="26">q = f ∧ p</text>
<text x="44" y="473" font-size="25">τ(q) ≥ τ(f) − τ(A²) / a²</text>
<text x="44" y="514" font-size="25">0 ≤ E(q) ≤ ap ≤ a1</text>
<text x="44" y="554" font-size="23">q ≠ 0 when τ(A²) &lt; a²τ(f)</text>
<text x="24" y="607" font-size="20">SEP-01–02: f and p need not commute.</text>
</g></svg>
