<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Cyclic towers retain a witness while making its covariance error vanish</title>
<desc id="desc">A trace-independent cyclic tower combines N translates of a unitary into a unitary Z N. Its covariance error is supported on the wraparound level of trace one over N and is at most two over square root N. Trace independence retains the average squared commutator or automorphism displacement. A fixed-coordinate diagonal gives an invariant unitary with that nonzero displacement.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="1280" height="760" fill="white"/>
<g font-family="Segoe UI, DejaVu Sans, sans-serif" fill="#0f172a">
<text x="44" y="48" font-size="27" font-weight="600">A tower makes the action error small and retains the witness</text>
<text x="44" y="82" font-size="19">γ(Eⱼ) = Eⱼ₊₁,  Σ Eⱼ = 1,  τ(EⱼA) = τ(A)/N for the chosen algebra P.</text>
<g font-size="21" text-anchor="middle">
<rect x="80" y="122" width="205" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="182" y="158">E₀U</text><text x="182" y="190" font-size="17">level 0</text>
<rect x="383" y="122" width="205" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="485" y="158">E₁γ(U)</text><text x="485" y="190" font-size="17">level 1</text>
<rect x="686" y="122" width="205" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="788" y="158">···</text><text x="788" y="190" font-size="17">intermediate levels</text>
<rect x="989" y="122" width="205" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="1091" y="158">E<tspan baseline-shift="sub" font-size="14">N−1</tspan>γ<tspan baseline-shift="super" font-size="14">N−1</tspan>(U)</text><text x="1091" y="190" font-size="17">last level</text>
</g>
<g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M285 165 L373 165"/><path d="M588 165 L676 165"/><path d="M891 165 L979 165"/>
<path d="M1091 214 L1091 251 L182 251 L182 222"/>
</g>
<text x="390" y="282" font-size="19">Only the wraparound term remains after cancellation.</text>
<rect x="195" y="307" width="890" height="97" rx="10" fill="#f0fdf4" stroke="#86efac"/>
<text x="220" y="342" font-size="23">Z<tspan baseline-shift="sub" font-size="15">N</tspan> = Σⱼ Eⱼγʲ(U) is unitary;   γ(Z<tspan baseline-shift="sub" font-size="15">N</tspan>) − Z<tspan baseline-shift="sub" font-size="15">N</tspan> = E₀(γ<tspan baseline-shift="super" font-size="15">N</tspan>(U) − U).</text>
<text x="220" y="379" font-size="23">τ(E₀) = 1/N gives ‖γ(Z<tspan baseline-shift="sub" font-size="15">N</tspan>) − Z<tspan baseline-shift="sub" font-size="15">N</tspan>‖₂ ≤ 2/√N.</text>
<rect x="44" y="447" width="567" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="66" y="482" font-size="22" font-weight="600">Irreducibility: Section FCA-03</text>
<text x="66" y="521" font-size="20">Tensor flips make every translated commutator</text>
<text x="66" y="554" font-size="20">have square norm 2‖X − τ(X)1‖₂².</text>
<text x="66" y="588" font-size="20">Their tower average has that same square norm.</text>
<rect x="659" y="447" width="577" height="160" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="681" y="482" font-size="22" font-weight="600">All elements: Section FCA-07</text>
<text x="681" y="521" font-size="20">Choose U displaced by every γ⁻ʲη′γʲ.</text>
<text x="681" y="554" font-size="20">Since η′ fixes Eⱼ, trace independence gives</text>
<text x="681" y="588" font-size="20">‖η′(Z<tspan baseline-shift="sub" font-size="15">N</tspan>) − Z<tspan baseline-shift="sub" font-size="15">N</tspan>‖₂² &gt; 1.</text>
<path d="M460 404 L460 437" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M820 404 L820 437" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="44" y="658" font-size="23" font-weight="600">Diagonalize the unitary representatives while retaining the original coordinate.</text>
<text x="44" y="697" font-size="21">The limit lies in Q = F<tspan baseline-shift="super" font-size="14">γ</tspan> and retains the nonzero witness: each asserted fixation gives a contradiction.</text>
<text x="44" y="734" font-size="16" fill="#475569">Exact identities: FCA.8, FCA.13–15 and FCA.25–26.</text>
</g></svg>
