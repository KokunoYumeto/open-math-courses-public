<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Modular time and the center of the approximately inner quotient</title>
  <desc id="desc">For the separable AFD factor of type III lambda, I is the inner group and K its closure. The module quotient Aut(M)/K is the circle of period L, whereas the modular-time circle of period T is the center of K/I and of Out(M). Finite tensor implementers prove approximate innerness of modular automorphisms.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#23667b"/></marker>
  </defs>
  <rect width="1200" height="760" rx="12" fill="#fafcfb"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#153e50" text-anchor="middle">
    <text x="600" y="43" font-size="27" font-weight="700">Two circles in different places</text>
    <text x="600" y="76" font-size="19">0 &lt; λ &lt; 1; L = −log λ; T = 2π/L; I = Inn(M); K = closure of I</text>
    <rect x="65" y="108" width="1070" height="128" rx="9" fill="#eef0fa" stroke="#5b70a5" stroke-width="2"/>
    <text x="600" y="142" font-size="23" font-weight="700">The module quotient</text>
    <text x="600" y="179" font-size="28">Aut(M) / K ≅ ℝ / Lℤ</text>
    <text x="600" y="214" font-size="19">An automorphism belongs to K exactly when its module is zero. (§1)</text>
    <rect x="65" y="276" width="485" height="150" rx="9" fill="#e7f3ee" stroke="#387a69" stroke-width="2"/>
    <text x="307" y="311" font-size="22" font-weight="700">Finite tensor implementers</text>
    <text x="307" y="350" font-size="23">uₙ(t) = (h<tspan baseline-shift="super" font-size="16">it</tspan>)<tspan baseline-shift="super" font-size="16">⊗n</tspan> ⊗ 1</text>
    <text x="307" y="388" font-size="19">Ad uₙ(t) → σ<tspan baseline-shift="sub" font-size="15">t</tspan> in point-predual norm (§2)</text>
    <line x1="566" y1="351" x2="643" y2="351" stroke="#23667b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="660" y="276" width="475" height="150" rx="9" fill="#e7f3ee" stroke="#387a69" stroke-width="2"/>
    <text x="897" y="313" font-size="22" font-weight="700">Central triviality lies in K</text>
    <text x="897" y="353" font-size="24">Ct(M) = I · {σ<tspan baseline-shift="sub" font-size="16">t</tspan> : t ∈ ℝ}</text>
    <text x="897" y="391" font-size="19">Hence Ct(M) ⊂ K. (§4)</text>
    <line x1="897" y1="438" x2="897" y2="478" stroke="#23667b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="65" y="494" width="1070" height="172" rx="9" fill="#fff5e6" stroke="#ba8b41" stroke-width="2"/>
    <text x="600" y="530" font-size="23" font-weight="700">The modular-time circle inside the outer group</text>
    <text x="600" y="572" font-size="28">Z(K/I) = Z(Out(M)) = q(Ct(M)) ≅ ℝ / Tℤ</text>
    <text x="600" y="613" font-size="22">[t] ↦ q(σ<tspan baseline-shift="sub" font-size="16">t</tspan>); kernel on ℝ is Tℤ. (§4)</text>
    <text x="600" y="646" font-size="19">The outer centralizer theorem gives C<tspan baseline-shift="sub" font-size="14">Out(M)</tspan>(K/I) = q(Ct(M)).</text>
    <text x="600" y="710" font-size="22">Exact inverse image: q<tspan baseline-shift="super" font-size="15">−1</tspan>(Z(K/I)) = Ct(M).</text>
    <text x="600" y="741" font-size="17">The center identification is algebraic; no Hausdorff quotient topology is asserted.</text>
  </g>
</svg>
