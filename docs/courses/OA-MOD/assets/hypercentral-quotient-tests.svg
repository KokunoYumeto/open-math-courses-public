<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Two hypercentral tests and their exact quotient images</title>
<desc id="desc">The operator-input hypercentral set maps onto the relative commutant of F in A. Its intersection with the centralizing sequences maps onto the center of F. A faithful normal tracial state makes A equal F and both rows equal. The general equality is not asserted.</desc>
<rect width="1200" height="710" rx="16" fill="#f5f8fc"/>
<g font-family="Georgia,serif" fill="#153449">
<text x="45" y="55" font-size="28">Keep the two input conditions visible</text>
<text x="45" y="92" font-size="21">Let q: Nω → Nω / Iω be the quotient map.</text>
<text x="45" y="126" font-size="21">Precisely: A = M′ ∩ (Nω / Iω),   F = Cω / Iω</text>
<rect x="45" y="166" width="490" height="165" rx="12" fill="#e6f0fc" stroke="#345b9d" stroke-width="2"/>
<text x="67" y="204" font-size="23">Operator-input hypercentral sequences</text>
<text x="67" y="244" font-size="21">x ∈ Sω and [x, Cω] ⊂ Iω</text>
<text x="67" y="285" font-size="20">Null-sequence tests force x ∈ Nω.</text>
<path d="M555 245H667" fill="none" stroke="#345b9d" stroke-width="3"/>
<path d="M667 245l-13 -7v14z" fill="#345b9d"/>
<text x="580" y="222" font-size="22">q</text>
<rect x="685" y="166" width="465" height="165" rx="12" fill="#e6f0fc" stroke="#345b9d" stroke-width="2"/>
<text x="710" y="223" font-size="28">F′ ∩ A</text>
<text x="710" y="265" font-size="21">Commutes with M and with F</text>
<text x="710" y="301" font-size="20">inside the multiplier quotient</text>
<path d="M285 385V346M918 385V346" fill="none" stroke="#66818e" stroke-width="3"/>
<path d="M285 346l-7 13h14zM918 346l-7 13h14z" fill="#66818e"/>
<text x="300" y="372" font-size="19">inclusion</text><text x="933" y="372" font-size="19">inclusion</text>
<rect x="45" y="400" width="490" height="130" rx="12" fill="#e5f4ec" stroke="#337c64" stroke-width="2"/>
<text x="67" y="440" font-size="23">Also require x ∈ Cω</text>
<text x="67" y="483" font-size="21">The predual-input convention</text>
<path d="M555 464H667" fill="none" stroke="#337c64" stroke-width="3"/>
<path d="M667 464l-13 -7v14z" fill="#337c64"/>
<text x="580" y="444" font-size="22">q</text>
<rect x="685" y="400" width="465" height="130" rx="12" fill="#e5f4ec" stroke="#337c64" stroke-width="2"/>
<text x="710" y="444" font-size="28">Z(F) = F′ ∩ F</text>
<text x="710" y="485" font-size="21">Commutes with F and belongs to F</text>
<path d="M45 563H1150" stroke="#bbc9cf"/>
<text x="45" y="604" font-size="23">Finite tracial case: A = F, so the two rows agree.</text>
<text x="45" y="644" font-size="20">General case: F′ ∩ A = Z(F) is the remaining equality to establish.</text>
<text x="45" y="680" font-size="18">Exact quotient identities: NHC.7–NHC.10. Tracial equivalence: NHC.11–NHC.12.</text>
</g></svg>
