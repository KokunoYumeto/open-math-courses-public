<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1090" viewBox="0 0 960 1090" role="img" aria-labelledby="title desc">
<title id="title">The trees with arm lengths 3,3,1 and 4,2,1 have different unfoldings</title>
<desc id="desc">The extra branch is attached at v3 in T and at v4 in E8. The T unfolding has four vertices at level four and three at level five; E8 has three and four. Nodes at the same level represent endpoints, not numbers of paths.</desc>
