<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
<title id="title">Rational records preserve averages and attenuate coherence</title>
<desc id="desc">For multiplicities one, two and three, the six-dimensional record has layers of sizes three, two and one. The matrix unit e23 appears in two shared layers and returns with coefficient two over square root six. The sharp squared-error to commutator ratio is five sixths.</desc>
<rect width="1120" height="750" rx="20" fill="#f6f8fc"/>
<g font-family="Arial, sans-serif" fill="#132238">
<text x="42" y="50" font-size="28" font-weight="700">Exact state averages. Measurable coherence loss.</text>
<text x="42" y="82" font-size="18">m = 3 · p = (1, 2, 3) · q = 6 · h = diag(1/2, 1, 3/2)</text>
<rect x="32" y="108" width="1056" height="284" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="54" y="144" font-size="20" font-weight="700">The recording map R : M₃ → M₆</text>
<text x="54" y="174" font-size="17">Input state weights</text>
<g font-size="18" text-anchor="middle">
<rect x="54" y="192" width="82" height="78" rx="8" fill="#dbeafe"/><text x="95" y="221">1</text><text x="95" y="251">1/6</text>
<rect x="145" y="192" width="82" height="78" rx="8" fill="#d1fae5"/><text x="186" y="221">2</text><text x="186" y="251">1/3</text>
<rect x="236" y="192" width="82" height="78" rx="8" fill="#ffedd5"/><text x="277" y="221">3</text><text x="277" y="251">1/2</text>
</g>
<path d="M340 232 H408 M398 222 L408 232 L398 242" fill="none" stroke="#334155" stroke-width="3"/>
<text x="437" y="174" font-size="17">Record layers · each coordinate has trace weight 1/6</text>
<g font-size="19" text-anchor="middle">
<rect x="437" y="192" width="175" height="78" rx="8" fill="#eef2ff" stroke="#c7d2fe"/><text x="525" y="221">1, 2, 3</text><text x="525" y="251">layer r = 1</text>
<rect x="628" y="192" width="175" height="78" rx="8" fill="#eef2ff" stroke="#c7d2fe"/><text x="716" y="221">2, 3</text><text x="716" y="251">layer r = 2</text>
<rect x="819" y="192" width="175" height="78" rx="8" fill="#eef2ff" stroke="#c7d2fe"/><text x="906" y="221">3</text><text x="906" y="251">layer r = 3</text>
</g>
<text x="54" y="312" font-size="19">R(x) = x ⊕ x restricted to coordinates (2, 3) ⊕ x₃₃</text>
<text x="54" y="346" font-size="19">τ₆(R(x)) = φ(x)                 φ(L(y)) = τ₆(y)</text>
<text x="54" y="374" font-size="16" fill="#475569">Both recording R and return L are unital and completely positive. Proof: RSR-01–02.</text>
<rect x="32" y="410" width="510" height="258" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="54" y="446" font-size="20" font-weight="700">What returns: Φ = LR</text>
<text x="54" y="478" font-size="18">Φ(eᵢⱼ) = cᵢⱼ eᵢⱼ; diagonal entries are fixed.</text>
<path d="M111 502 H101 V620 H111 M445 502 H455 V620 H445" fill="none" stroke="#334155" stroke-width="2"/>
<g font-size="21" text-anchor="middle">
<text x="166" y="529">1</text><text x="280" y="529">1/√2</text><text x="394" y="529">1/√3</text>
<text x="166" y="567">1/√2</text><text x="280" y="567">1</text><text x="394" y="567" fill="#047857" font-weight="700">√(2/3)</text>
<text x="166" y="605">1/√3</text><text x="280" y="605" fill="#047857" font-weight="700">√(2/3)</text><text x="394" y="605">1</text>
</g>
<text x="54" y="648" font-size="16" fill="#475569">Shared layers / √(pᵢpⱼ). Proof: RSR-02, RSR-05.</text>
<rect x="560" y="410" width="528" height="258" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="582" y="446" font-size="20" font-weight="700">The extremizing coherence e₂₃</text>
<text x="582" y="483" font-size="19">2 shared layers → 2/√6 = √(2/3)</text>
<text x="582" y="521" font-size="19">Best squared-error ratio: β(h) = 5/6</text>
<text x="582" y="551" font-size="17">Error norm: symmetric state norm (RSR.2).</text>
<text x="582" y="578" font-size="17">Denominator: ‖[h¹ᐟ², x]‖²₂,τ₃.</text>
<text x="582" y="614" font-size="19">Φₜ(e₂₃) = (2/3)ᵗᐟ² e₂₃</text>
<text x="582" y="648" font-size="16" fill="#475569">Sharp bound and continuous decay: RSR-03–05.</text>
<text x="42" y="704" font-size="17">Original construction and exact calculations: RSR-01–08.</text>
<text x="42" y="733" font-size="16" fill="#475569">Human source: M. Takesaki, Theory of Operator Algebras III, XVI.1.12–1.13 (pp. 216–220).</text>
</g></svg>
