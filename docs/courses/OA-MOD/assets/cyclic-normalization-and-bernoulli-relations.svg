<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Cyclic normalization and the exact binary array</title>
<desc id="desc">A bounded diagonal density normalizes the given relation. For lambda equal to one half, the binary length-two cells have exact probabilities four ninths, two ninths, two ninths, and one ninth. Their widths are proportional to these masses. Matrix maps have range-over-source derivatives one half, one, and one half.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#36586b"/></marker></defs>
<rect width="1440" height="760" rx="18" fill="#f3f7fa"/>
<g font-family="Arial,sans-serif" fill="#17364a">
<text x="50" y="65" font-size="34" font-weight="bold">Keep the relation; normalize its measure</text>
<rect x="50" y="105" width="1340" height="155" rx="12" fill="#e2edf7" stroke="#7892a6"/>
<text x="75" y="148" font-size="25">A = L∞(X, μ₀) ⊂ Mψ,    k ∈ Z(Mψ) ⊂ A,    λ ≤ k ≤ 1</text>
<text x="75" y="193" font-size="26">dν = (k / ∫k dμ₀) dμ₀,    δν(y,x) = k(y) δμ₀(y,x) / k(x)</text>
<text x="75" y="235" font-size="23">The modular period T = 2π / |log λ| gives δν ∈ {λⁿ : n ∈ ℤ}.  Sections 2–3 prove the exact degrees.</text>
<text x="50" y="318" font-size="28" font-weight="bold">Exact example: λ = 1/2, p = (2/3, 1/3)</text>
<text x="50" y="355" font-size="22">Length-two cell widths equal 1296 times their probabilities.</text>
<rect x="72" y="390" width="576" height="108" fill="#d1e6f4" stroke="#34566c" stroke-width="2"/>
<rect x="648" y="390" width="288" height="108" fill="#dcebd9" stroke="#34566c" stroke-width="2"/>
<rect x="936" y="390" width="288" height="108" fill="#e8ddf4" stroke="#34566c" stroke-width="2"/>
<rect x="1224" y="390" width="144" height="108" fill="#f6e1c9" stroke="#34566c" stroke-width="2"/>
<g text-anchor="middle" font-size="26"><text x="360" y="433">00</text><text x="360" y="477">4/9</text>
<text x="792" y="433">01</text><text x="792" y="477">2/9</text>
<text x="1080" y="433">10</text><text x="1080" y="477">2/9</text>
<text x="1296" y="433">11</text><text x="1296" y="477">1/9</text></g>
<g fill="none" stroke="#36586b" stroke-width="3" marker-end="url(#a)">
<path d="M360 513 V565 H792 V513"/><path d="M792 580 V630 H1080 V513"/><path d="M1080 645 V687 H1296 V513"/></g>
<g font-size="22"><text x="490" y="550">derivative 1/2</text><text x="865" y="615">derivative 1</text><text x="1115" y="672">derivative 1/2</text></g>
<text x="50" y="735" font-size="22">Uab Ubc = Uac; the composite 00 → 11 has derivative (1/2) × 1 × (1/2) = 1/4.</text>
</g></svg>