<rect x="845" y="165" width="170" height="62" rx="6"/>
</g>
<g font-family="Georgia, serif" fill="#12343b" text-anchor="middle" font-size="17">
<text x="125" y="190">Bπ</text><text x="125" y="213">mass b</text>
<text x="125" y="374">e₂(Bπ)</text><text x="125" y="397">mass (q₂/q₀)b</text>
<text x="397" y="190">e₁(Bπ)</text><text x="397" y="213">mass (q₁/q₀)b</text>
<text x="660" y="190">Bπ</text><text x="660" y="213">mass b</text>
<text x="660" y="374">e₂(Bπ)</text><text x="660" y="397">mass (q₂/q₀)b</text>
<text x="930" y="190">e₁(Bπ)</text><text x="930" y="213">mass (q₁/q₀)b</text>
</g>
