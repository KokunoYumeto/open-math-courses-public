<g font-family="Georgia, serif" font-size="16" fill="#12343b">
<text x="95" y="272">e₂ ∈ S</text><text x="95" y="300">degree q₂/q₀</text>
<text x="228" y="159">e₁</text><text x="239" y="251">may leave R</text>
<text x="630" y="272">v₂ = e₂</text><text x="630" y="300">unchanged</text>
<text x="767" y="159">v₁ = t{1}</text><text x="769" y="251">degree q₁/q₀</text>
<text x="775" y="288">e₂ t{1}⁻¹</text><text x="775" y="314">degree q₂/q₁</text>
<text x="45" y="432" fill="#347750">existing block {0, 2}</text>
<text x="580" y="432" fill="#347750">same block, same maps</text>
<text x="30" y="480">Each box is a measurable set, not a point or an area proportional to its mass.</text>
<text x="30" y="512">Connector cancellation preserves every S-arrow: vⱼvₖ⁻¹ = eⱼeₖ⁻¹ within each block of π.</text>
