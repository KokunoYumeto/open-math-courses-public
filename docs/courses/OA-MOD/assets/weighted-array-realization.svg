<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">Relative realization of a weighted array</title>
<desc id="desc">On a base piece B pi, the existing subrelation groups sheets zero and two together and leaves sheet one separate. Replace the external connector from zero to one by an orbit matching with the same degree. Retain the zero-to-two map. Composing them gives all orbit maps and preserves the original subrelation and all cell masses.</desc>
<rect width="1040" height="540" fill="#fafaf4"/>
<g font-family="Georgia, serif" fill="#12343b">
<text x="30" y="38" font-size="24" font-weight="bold">Keep the cells and existing blocks; replace the connector</text>
<text x="30" y="72" font-size="17">Theorem 3.1 · π = {{0, 2}, {1}} · b = μ(Bπ) · q₀ + q₁ + q₂ = 1</text>
<text x="50" y="118" font-size="20" font-weight="bold">External measured array E</text>
<text x="585" y="118" font-size="20" font-weight="bold">Realized orbit array A ⊂ R</text>
</g>
<g fill="#edf7ef" stroke="#347750" stroke-width="2">
<rect x="22" y="139" width="205" height="301" rx="14"/>
<rect x="557" y="139" width="205" height="301" rx="14"/>
</g>
