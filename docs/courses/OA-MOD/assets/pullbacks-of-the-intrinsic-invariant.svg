<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
<title id="title">The intrinsic extension pulled back to an integer action</title>
<desc id="desc">The fiber product E alpha consists of pairs v,n with q(v)=alpha to the n. Its quotient H is a subgroup of the integers. H gives the asymptotic period p, the action on the central circle gives the module s, and a lift D of positive p yields modular time t and obstruction delta. When H is zero, only the module remains.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#43616e" stroke-width="1.3"/></marker></defs>
<rect width="1080" height="610" rx="18" fill="#f7fafb"/>
<g font-family="Georgia,serif" fill="#183440" text-anchor="middle">
<text x="540" y="43" font-size="27">One pullback, four parameters</text>
<text x="540" y="73" font-family="Arial,sans-serif" font-size="16">M = Rλ   ·   L = −log λ   ·   T = 2π/L   ·   G = ℤ × ℝ</text>
<rect x="65" y="103" width="950" height="237" rx="12" fill="white" stroke="#b9cdd5"/>
<text x="325" y="144" font-size="25">Eα = {(v,n) : q(v) = αⁿ}</text>
<text x="805" y="144" font-size="25">E</text>
<text x="325" y="265" font-size="25">H ⊂ ℤ</text>
<text x="805" y="265" font-size="25">N = Cnt(M)</text>
<g stroke="#43616e" stroke-width="2" marker-end="url(#arrow)">
<path d="M550 137 H765"/><path d="M420 257 H695"/>
<path d="M325 166 V224"/><path d="M805 166 V224"/>
</g>
<text x="650" y="121" font-size="17">(v,n) ↦ v</text>
<text x="553" y="242" font-size="17">n ↦ αⁿ</text>
<text x="360" y="202" font-size="17">n</text><text x="829" y="202" font-size="17">q</text>
<text x="540" y="310" font-family="Arial,sans-serif" font-size="17">Both vertical kernels are A = U(Z(C)); the quotient keeps the integer n.</text>
<g fill="#eaf3f6" stroke="#b9cdd5"><rect x="35" y="365" width="240" height="140" rx="10"/><rect x="290" y="365" width="240" height="140" rx="10"/><rect x="545" y="365" width="240" height="140" rx="10"/><rect x="800" y="365" width="245" height="140" rx="10"/></g>
<text x="155" y="398" font-size="23">Return subgroup</text><text x="155" y="439" font-size="22">H = pℤ</text><text x="155" y="478" font-size="17">p &gt; 0; H = {0} means p = 0</text>
<text x="410" y="398" font-size="23">Module</text><text x="410" y="439" font-size="20">α̃(W) = exp(iTs) W</text><text x="410" y="478" font-size="17">[s] ∈ ℝ/Lℤ; W = exp(iTx)</text>
<text x="665" y="398" font-size="23">Return time</text><text x="665" y="439" font-size="20">Fᵣ(D) = exp(−irt) D</text><text x="665" y="478" font-size="17">0 ≤ t &lt; T</text>
<text x="923" y="398" font-size="23">Obstruction</text><text x="923" y="439" font-size="22">α̃(D) = δD</text><text x="923" y="478" font-size="17">δᵖ = 1; p[s] = 0</text>
<text x="540" y="544" font-size="21">For p &gt; 0: ω(pk,pj) = 1,   ℓ(pk,(m,r)) = δᵏᵐ exp(−ikrt)</text>
<text x="540" y="581" font-family="Arial,sans-serif" font-size="16">D lifts p and has the stated real-flow normalization. For p = 0, the coefficient action remains.</text>
</g></svg>
