<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Centre coefficients, the extended action and change of implementing lifts</title>
<desc id="desc">The kernel A is the unitary group of the centre. The extension K_mu maps to N. The action of x=(g,t) on its kernel is rho_x and on its quotient is conjugation by g. Two ways of computing lambda agree by flow commutation. Changing lifts by z_n gives the equivariant map from the primed extension to the unprimed one.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385e7a"/></marker></defs>
<rect width="1120" height="640" rx="18" fill="#f6f8fa"/>
<g font-family="Georgia,serif" fill="#172f41">
<text x="40" y="48" font-size="28">The coefficients move with the action</text>
<text x="40" y="79" font-size="18">Q a von Neumann algebra · C = Z(Q) · A = U(C) · E = G × R · x = (g,t)</text>
<rect x="30" y="105" width="1060" height="205" rx="12" fill="white" stroke="#bfccd5"/>
<text x="52" y="138" font-size="22">1. The exact extension and its E-action</text>
<g font-size="24">
<text x="90" y="195">A</text><text x="460" y="195">K<tspan baseline-shift="sub" font-size="16">μ</tspan></text><text x="976" y="195">N</text>
</g>
<g stroke="#385e7a" stroke-width="2" marker-end="url(#arr)"><path d="M145 187H415"/><path d="M535 187H930"/></g>
<g font-size="18">
<text x="210" y="175">z ↦ (z,e)</text><text x="675" y="175">(z,n) ↦ n</text>
<text x="65" y="245">z ↦ ρ<tspan baseline-shift="sub" font-size="12">x</tspan>(z)</text>
<text x="335" y="245">(z,n) ↦ (ρ<tspan baseline-shift="sub" font-size="12">x</tspan>(z) λ(gng⁻¹,x), gng⁻¹)</text>
<text x="945" y="245">n ↦ gng⁻¹</text>
<text x="52" y="286">Product: (z,m)(w,n) = (zw μ(m,n), mn)                 Equations (CCI3)–(CCI5)</text>
</g>
<rect x="30" y="330" width="1060" height="125" rx="12" fill="#eaf2f7" stroke="#bfccd5"/>
<text x="52" y="365" font-size="22">2. Commuting the group action with the flow</text>
<text x="70" y="409" font-size="23">θ<tspan baseline-shift="sub" font-size="15">t</tspan>(λ<tspan baseline-shift="sub" font-size="15">g</tspan>(n)) c<tspan baseline-shift="sub" font-size="15">t</tspan>(n) = a<tspan baseline-shift="sub" font-size="15">g</tspan>(c<tspan baseline-shift="sub" font-size="15">t</tspan>(g⁻¹ng)) λ<tspan baseline-shift="sub" font-size="15">g</tspan>(n) = λ(n,(g,t))</text>
<text x="915" y="438" font-size="17">(CCI8)–(CCI9)</text>
<rect x="30" y="475" width="1060" height="135" rx="12" fill="white" stroke="#bfccd5"/>
<text x="52" y="510" font-size="22">3. A new choice U′<tspan baseline-shift="sub" font-size="15">n</tspan> = z<tspan baseline-shift="sub" font-size="15">n</tspan> U<tspan baseline-shift="sub" font-size="15">n</tspan> changes coordinates, not the extension</text>
<text x="105" y="561" font-size="24">K<tspan baseline-shift="sub" font-size="16">μ′</tspan></text>
<path d="M190 553H625" stroke="#385e7a" stroke-width="2" marker-end="url(#arr)"/>
<text x="280" y="542" font-size="20">F<tspan baseline-shift="sub" font-size="14">z</tspan>(w,n) = (wz<tspan baseline-shift="sub" font-size="14">n</tspan>,n)</text>
<text x="665" y="561" font-size="24">K<tspan baseline-shift="sub" font-size="16">μ</tspan></text>
<text x="790" y="559" font-size="20">F<tspan baseline-shift="sub" font-size="13">z</tspan> T′<tspan baseline-shift="sub" font-size="13">x</tspan> = T<tspan baseline-shift="sub" font-size="13">x</tspan> F<tspan baseline-shift="sub" font-size="13">z</tspan></text>
<text x="52" y="591" font-size="17">Identity on A and N; arrow orientation and phase are fixed by (CCI6)–(CCI7).</text>
</g></svg>
