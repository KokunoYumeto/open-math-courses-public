<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Binary prefixes choose distant tensor coordinates</title>
<desc id="desc">For s equal to 0000 followed by zeros and t equal to 0010 followed by zeros, the chosen tensor positions at n equal to one, two, three and four are 2,4,8,16 and 2,4,9,18. Starting at n equal to three the positions differ permanently. The corresponding trace-zero diagonal unitaries have trace inner product zero and distance square root two.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="640" rx="18" fill="#f8fafc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#14243b">
<text x="48" y="60" font-size="29" font-weight="600">One binary word, one sequence of tensor positions</text>
<text x="48" y="100" font-size="22">jₙ(s) = 2ⁿ + the integer represented by the first n bits</text>
<rect x="638" y="130" width="490" height="300" rx="15" fill="#e8f4ef"/>
<text x="666" y="162" font-size="19" fill="#17634b">Different prefixes give different positions for every n ≥ 3</text>
<g font-size="21" text-anchor="middle" fill="#475569"><text x="336" y="195">n = 1</text><text x="524" y="195">n = 2</text><text x="740" y="195">n = 3</text><text x="956" y="195">n = 4</text></g>
<text x="48" y="254" font-size="23" fill="#185ea4">s = 0000…</text><text x="48" y="354" font-size="23" fill="#8b4b9f">t = 0010…</text>
<g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M390 246H464M578 246H680M794 246H896M1010 246H1085"/><path d="M390 346H464M578 346H680M794 346H896M1010 346H1085"/></g>
<g fill="#dbeafe" stroke="#185ea4" stroke-width="2"><rect x="282" y="216" width="108" height="60" rx="10"/><rect x="470" y="216" width="108" height="60" rx="10"/><rect x="686" y="216" width="108" height="60" rx="10"/><rect x="902" y="216" width="108" height="60" rx="10"/></g>
<g fill="#f3e8f6" stroke="#8b4b9f" stroke-width="2"><rect x="282" y="316" width="108" height="60" rx="10"/><rect x="470" y="316" width="108" height="60" rx="10"/><rect x="686" y="316" width="108" height="60" rx="10"/><rect x="902" y="316" width="108" height="60" rx="10"/></g>
<g font-size="26" text-anchor="middle"><text x="336" y="255">2</text><text x="524" y="255">4</text><text x="740" y="255">8</text><text x="956" y="255">16</text><text x="336" y="355">2</text><text x="524" y="355">4</text><text x="740" y="355">9</text><text x="956" y="355">18</text></g>
<text x="48" y="416" font-size="21">Place z = diag(1, −1) at the selected position; all other tensor entries are 1.</text>
<path d="M48 450H1152" stroke="#cbd5e1"/>
<text x="48" y="492" font-size="23" font-weight="600">For n ≥ 3: separate tensor legs, exact product-trace identities</text>
<text x="48" y="536" font-size="23">τ(uₙˢuₙᵗ) = τ(z)τ(z) = 0</text><text x="653" y="536" font-size="23">‖uₙˢ − uₙᵗ‖₂² = 1 + 1 = 2</text>
<text x="48" y="590" font-size="20" fill="#475569">Every free ultrafilter contains {n ≥ 3}. These identities persist in Rω. Proof: UCS.7–UCS.12.</text>
</g></svg>
