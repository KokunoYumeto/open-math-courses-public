<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" role="img" aria-labelledby="title desc">
  <title id="title">Compact displacement and equivariant measure transfer</title>
  <desc id="desc">A compact set K of normal states assigns the projection F prime n mass less than epsilon. A small unitary rotation g sends every state in K to mass greater than epsilon. An equivariant continuous map Phi sends a proposed quasi-invariant probability on U(M) to a probability on normal states, where uncountably many disjoint positive-measure translates give a contradiction.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#263b53"/></marker></defs>
  <rect width="460" height="650" rx="14" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#162c43" font-size="17">
    <text x="24" y="34" font-size="20" font-weight="bold">A small rotation separates K from gK</text>
    <text x="24" y="64">g = cos(θ)1 + i sin(θ)rₙ</text>
    <text x="24" y="91">‖g − 1‖ = 2 sin(θ/2)</text>
    <rect x="24" y="112" width="177" height="94" rx="10" fill="#e6f2f8" stroke="#277391"/>
    <rect x="259" y="112" width="177" height="94" rx="10" fill="#eef2dc" stroke="#637a30"/>
    <text x="40" y="140" font-weight="bold">ω ∈ K</text>
    <text x="40" y="171">ω(F′ₙ) &lt; ε</text>
    <text x="275" y="140" font-weight="bold">g · ω ∈ gK</text>
    <text x="275" y="171">(g · ω)(F′ₙ) &gt; ε</text>
    <path d="M207 157 H251" stroke="#263b53" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="24" y="236">F′ₙ = rₙFrₙ;  ω(F) &gt; 1 − ε on K.</text>
    <text x="24" y="264">Choose 0 &lt; ε &lt; sin²(θ)/16.</text>
    <text x="24" y="292">The same observable separates both sets.</text>
    <path d="M24 315 H436" stroke="#bac7d0"/>
    <text x="24" y="346" font-size="20" font-weight="bold">Transfer to a separable state space</text>
    <rect x="24" y="369" width="177" height="112" rx="10" fill="#e6f2f8" stroke="#277391"/>
    <rect x="259" y="369" width="177" height="112" rx="10" fill="#eef2dc" stroke="#637a30"/>
    <text x="40" y="398" font-weight="bold">U(M), strong</text>
    <text x="40" y="431">u</text>
    <text x="40" y="461">ρ(g)u</text>
    <text x="275" y="398" font-weight="bold">X, predual norm</text>
    <text x="275" y="431">Φ(u)</text>
    <text x="275" y="461">g · Φ(u)</text>
    <path d="M207 425 H251" stroke="#263b53" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M207 455 H251" stroke="#263b53" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="24" y="513">Φ(u)(A) = ⟨(A ⊗ 1)Juξ, Juξ⟩</text>
    <text x="24" y="543">‖Φ(u) − Φ(v)‖ ≤ 2‖(u − v)ξ‖</text>
    <text x="24" y="575">ν = Φ∗π inherits quasi-invariance.</text>
    <text x="24" y="606">Disjoint positive-measure translates in X</text>
    <text x="24" y="631">contradict finiteness of ν.</text>
  </g>
</svg>
