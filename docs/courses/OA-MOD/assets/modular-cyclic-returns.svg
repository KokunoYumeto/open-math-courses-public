<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="750" viewBox="0 0 1160 750" role="img" aria-labelledby="title desc">
<title id="title">Comparing modular returns through the discrete core</title>
<desc id="desc">Two normalized automorphisms yield commuting actions of the integer plane on the same hyperfinite semifinite factor. Their finite return kernel is generated by (p, minus q); in the no-return case it is zero. Matching characteristic coefficients and trace multipliers give one genuine comparison cocycle. Its two generator coefficients reconstruct a normal outer conjugacy of the crossed products.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176c77"/></marker></defs>
<rect width="1160" height="750" fill="#f7f7ee"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#12313c">
<text x="30" y="47" font-size="30" font-weight="bold">Keep both generators until the normal conjugacy is built</text>
<text x="30" y="83" font-size="20">ηᵢ denotes the normalized automorphism, untwisted first when p &gt; 0.</text>
<rect x="30" y="115" width="510" height="220" rx="12" fill="#fff" stroke="#176c77" stroke-width="2"/>
<rect x="610" y="115" width="520" height="220" rx="12" fill="#fff" stroke="#176c77" stroke-width="2"/>
<rect x="30" y="410" width="510" height="230" rx="12" fill="#fff" stroke="#176c77" stroke-width="2"/>
<rect x="610" y="410" width="520" height="230" rx="12" fill="#fff" stroke="#176c77" stroke-width="2"/>
<text x="50" y="151" font-size="24" font-weight="bold">1. One discrete decomposition</text>
<text x="50" y="192" font-size="23">P = Q ⋊θ ℤ,     Q ≅ R∞</text>
<text x="50" y="230" font-size="23">ηᵢ(U) = U,     βᵢθ = θβᵢ</text>
<text x="50" y="268" font-size="23">τβᵢ = e⁻ˢτ,     τθ = e⁻ᴸτ</text>
<text x="50" y="307" font-size="19">Section 2: normalizations on the same Q</text>
<text x="630" y="151" font-size="24" font-weight="bold">2. The action and its exact kernel</text>
<text x="630" y="192" font-size="23">G = ℤ²,     Aᵢ(m,n) = βᵢᵐθⁿ</text>
<text x="630" y="230" font-size="23">p &gt; 0:  H = ℤ(p,−q),   ps = qL</text>
<text x="630" y="268" font-size="23">p = 0:  H = {0}</text>
<text x="630" y="307" font-size="19">Sections 2–3, 6: inner = core-inner = Ct kernel</text>
<text x="50" y="447" font-size="24" font-weight="bold">3. Characteristic comparison</text>
<text x="50" y="486" font-size="22">p &gt; 0:  T<tspan baseline-shift="sub" font-size="15">ℓ</tspan> = v<tspan baseline-shift="sub" font-size="15">i</tspan><tspan baseline-shift="super" font-size="15">ℓ</tspan>,   μ = 1,   dᵣ = 1</text>
<text x="50" y="523" font-size="22">λ((m,n),r;ℓ) = δ<tspan baseline-shift="super" font-size="15">mℓ</tspan></text>
<text x="50" y="560" font-size="22">p = 0:  trivial subgroup data</text>
<text x="50" y="596" font-size="18">Same trace multipliers; type II Qω; amenable G/H</text>
<text x="50" y="621" font-size="18">Section 4 / 6 checks every NCA07 hypothesis.</text>
<text x="630" y="447" font-size="24" font-weight="bold">4. Reconstruct the crossed product</text>
<text x="630" y="486" font-size="22">F(x) = Θ(x),     F(U) = Wₑ*U</text>
<text x="630" y="523" font-size="22">Wᵦ Bᵦ(Wₑ) = Wₑ Bₑ(Wᵦ)</text>
<text x="630" y="560" font-size="24" font-weight="bold">η₂ = Ad(Wᵦ) F η₁ F⁻¹</text>
<text x="630" y="596" font-size="18">b = (1,0), e = (0,1), B = Θ A¹ Θ⁻¹</text>
<text x="630" y="621" font-size="18">Section 5: normal inverse and generator checks</text>
<path d="M550 225H599" fill="none" stroke="#176c77" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M870 345V370H285V399" fill="none" stroke="#176c77" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M550 525H599" fill="none" stroke="#176c77" stroke-width="3" marker-end="url(#arrow)"/>
<text x="30" y="688" font-size="20">For p &gt; 0, restore modular time t/p using the Connes cocycle: equations (5.7)–(5.8).</text>
<text x="30" y="722" font-size="19">Proof locators: MRC02–06; NCA07 and AC07. Source target: Takesaki III, XVIII.1.13.</text>
</g>
