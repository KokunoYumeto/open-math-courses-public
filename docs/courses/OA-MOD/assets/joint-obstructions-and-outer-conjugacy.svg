<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">One implementer, two coefficients, one shared change</title>
<desc id="desc">For an ergodic irrational torus flow and its half-translation B, two type III zero automorphisms have period two and identical separate obstruction classes. Their joint classes and scalar outer phases differ. The same central unitary must change the discrete coefficient and the flow cocycle together.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#276575"/></marker></defs>
<rect width="1200" height="780" fill="#fbfcfa"/>
<g font-family="Arial, sans-serif" fill="#163d4a" text-anchor="middle">
<text x="600" y="39" font-size="26" font-weight="bold">One implementer, two coefficients, one shared change</text>
<text x="600" y="71" font-size="19">bᵖ = Ad u;  b(u) = v u;  θₜ(u) = cₜ u  (§§3–4)</text>
<rect x="100" y="98" width="1000" height="98" rx="10" fill="#e9f3ef" stroke="#276575" stroke-width="2"/>
<text x="600" y="133" font-size="22">u ↦ z u  gives  (v, cₜ) ↦ (z*B(z) v, z*θₜ(z) cₜ)</text>
<text x="600" y="170" font-size="19">The same z belongs in both coordinates. Joint classes classify: §§6–7.</text>
<text x="600" y="237" font-size="22" font-weight="bold">An explicit pair on the same AFD type III₀ factor (§§8–9)</text>
<text x="600" y="271" font-size="19">Fₜ(x,y) = (x+t, y+√2 t) on T²;  S(x,y) = (x+½,y);  Bf = f ∘ S⁻¹</text>
<rect x="65" y="302" width="470" height="147" rx="10" fill="#edf0fa" stroke="#596c99" stroke-width="2"/>
<rect x="665" y="302" width="470" height="147" rx="10" fill="#edf0fa" stroke="#596c99" stroke-width="2"/>
<text x="300" y="339" font-size="23" font-weight="bold">α₊ = γ₊ ⊗ s(B)</text>
<text x="900" y="339" font-size="23" font-weight="bold">α₋ = γ₋ ⊗ s(B)</text>
<text x="300" y="379" font-size="21">pₐ = pₒ = 2;  (v, cₜ) = (1, 1)</text>
<text x="900" y="379" font-size="21">pₐ = pₒ = 2;  (v, cₜ) = (−1, 1)</text>
<text x="300" y="419" font-size="21">Scalar outer phase: +1</text>
<text x="900" y="419" font-size="21">Scalar outer phase: −1</text>
<path d="M300,454 L300,485 L522,485 L522,514" fill="none" stroke="#276575" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M900,454 L900,485 L678,485 L678,514" fill="none" stroke="#276575" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="522" width="840" height="91" rx="10" fill="#fff5e5" stroke="#ae7a30"/>
<text x="600" y="555" font-size="22" font-weight="bold">Separate classes coincide: (B, 2, [1], [1])</text>
<text x="600" y="591" font-size="19">z(x,y) = exp(2πix) gives z*B(z) = −1, but z*θₜ(z) = exp(−2πit).</text>
<rect x="100" y="641" width="1000" height="100" rx="10" fill="#e9f3ef" stroke="#276575"/>
<text x="600" y="674" font-size="22" font-weight="bold">Joint classes remain distinct</text>
<text x="600" y="707" font-size="19">Keeping cₜ = 1 requires θₜ(z) = z. Ergodicity makes z scalar, so z*B(z) = 1.</text>
<text x="600" y="765" font-size="16">The scalar phases are invariant under every outer conjugacy; α₊ and α₋ are not outer conjugate.</text>
</g></svg>
