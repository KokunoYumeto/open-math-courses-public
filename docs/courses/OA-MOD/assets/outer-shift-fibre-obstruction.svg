<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc">
<title id="title">The outer-shift obstruction and the field conjugacy</title><desc id="desc">Tail matrices are asymptotically central but move by square root of two in trace norm under the shift. At fibres j minus k and j, the shift action sigma to k is conjugated to the identity by sigma to k minus j and sigma to minus j.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#205b77"/></marker></defs>
<rect width="360" height="650" rx="14" fill="#f5f8fa"/><g font-family="Arial,sans-serif" fill="#172b3a" text-anchor="middle">
<text x="180" y="35" font-size="21" font-weight="bold">An outer shift needs</text><text x="180" y="61" font-size="21" font-weight="bold">a field conjugacy</text>
<rect x="18" y="82" width="324" height="151" rx="10" fill="#fff" stroke="#cbd7de"/>
<text x="180" y="113" font-size="19">σ(xⱼ) = xⱼ₊₁</text><text x="180" y="146" font-size="19">‖σ(xⱼ) − xⱼ‖₂ = √2</text>
<text x="180" y="179" font-size="18">‖uxⱼ − xⱼu‖₂ → 0</text><text x="180" y="211" font-size="17">for every fixed u ∈ N</text>
<text x="180" y="270" font-size="19" font-weight="bold">The same fibres, new coordinates</text>
<g font-size="20"><text x="70" y="327">N at j−k</text><text x="290" y="327">N at j</text><text x="70" y="497">N at j−k</text><text x="290" y="497">N at j</text></g>
<g stroke="#205b77" stroke-width="2" marker-end="url(#a)"><path d="M115 343H245"/><path d="M115 478H245"/><path d="M70 351V456"/><path d="M290 351V456"/></g>
<text x="180" y="332" font-size="20">σᵏ</text><text x="180" y="467" font-size="20">id</text>
<text x="29" y="412" font-size="18" transform="rotate(-90 29 412)">σ^(k−j)</text><text x="332" y="412" font-size="18" transform="rotate(90 332 412)">σ^(−j)</text>
<text x="180" y="548" font-size="19">σ⁻ʲ σᵏ σʲ⁻ᵏ = id</text>
<text x="180" y="586" font-size="18">θ αₖ θ⁻¹ = βₖ</text><text x="180" y="617" font-size="16">Vertical maps need not be inner.</text>
</g></svg>