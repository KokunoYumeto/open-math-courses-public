<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">The exact finite matrix coefficient d over d plus one</title>
<desc id="desc">For V of X Y equal to the first diagonal entry of their product, norm V is one. The d tests X j equal e one j and Y j equal e j one each have value one. Their square sums are identity, d p, d p, identity, with p equal e one one. Any four states imply d is at most C times d plus one. Normalized trace for phi one and psi two, and the first coordinate state for phi two and psi one, attain C equals d over d plus one for every pair of matrices.</desc>
<rect x="1" y="1" width="898" height="538" rx="14" fill="#f5f8fc" stroke="#a4b9c8"/>
<g font-family="Arial,sans-serif" fill="#16384d">
<text x="28" y="38" font-size="24" font-weight="bold">An exact optimum already visible in finite matrices</text>
<text x="28" y="72" font-size="20">V_d(X,Y) = (XY)₁₁, ‖V_d‖ = 1, p = e₁₁; dimension d ≥ 1</text>
<rect x="26" y="96" width="848" height="115" rx="8" fill="#fff" stroke="#8fa9b8"/>
<g font-size="20" text-anchor="middle">
<text x="168" y="128">Xⱼ = e₁ⱼ</text><text x="450" y="128">Yⱼ = eⱼ₁</text><text x="729" y="128">V_d(Xⱼ,Yⱼ) = 1</text>
<text x="168" y="170">Σ Xⱼ*Xⱼ = I_d</text><text x="450" y="170">Σ Yⱼ*Yⱼ = d p</text>
<text x="168" y="197">Σ XⱼXⱼ* = d p</text><text x="450" y="197">Σ YⱼYⱼ* = I_d</text>
<text x="729" y="174">j = 1, …, d</text>
</g>
<rect x="26" y="230" width="405" height="165" rx="8" fill="#fff2e9" stroke="#b68056"/>
<rect x="451" y="230" width="423" height="165" rx="8" fill="#eaf6ef" stroke="#65987b"/>
<text x="44" y="259" font-size="21" font-weight="bold">Lower bound: every four states</text>
<text x="44" y="292" font-size="18">Each state has 0 ≤ φ(p) ≤ 1.</text>
<text x="44" y="323" font-size="18">Sum the tests; apply Cauchy–Schwarz.</text>
<text x="44" y="367" font-size="23">d ≤ C(d + 1)</text>
<text x="469" y="259" font-size="21" font-weight="bold">Attainment: explicit four states</text>
<text x="469" y="291" font-size="18">φ₁ = ψ₂ = tr_d; φ₂ = ψ₁ = ω</text>
<text x="469" y="321" font-size="17">tr_d(Z) = Tr(Z)/d; ω(Z) = Z₁₁</text>
<text x="469" y="367" font-size="23">min C = d/(d + 1)</text>
<text x="28" y="432" font-size="18">Exact integer-dimension samples of the proved minimum:</text>
<g text-anchor="middle" font-size="20">
<text x="95" y="467">d = 1</text><text x="245" y="467">d = 2</text><text x="395" y="467">d = 3</text><text x="545" y="467">d = 9</text><text x="715" y="467">d → ∞</text>
<text x="95" y="502">1/2</text><text x="245" y="502">2/3</text><text x="395" y="502">3/4</text><text x="545" y="502">9/10</text><text x="715" y="502">1</text>
</g>
</g></svg>
