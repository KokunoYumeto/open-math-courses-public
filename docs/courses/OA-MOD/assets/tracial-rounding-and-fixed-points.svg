<rect x="568" y="366" width="522" height="342" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="592" y="401" font-size="21" font-weight="700">An exact example on M₂</text>
<text x="592" y="440" font-size="19">P(x) = τ₂(x) I₂</text>
<text x="592" y="475" font-size="19">T = (9/10) id + (1/10) P; S = T</text>
<text x="592" y="510" font-size="19">u = diag(1, −1), ‖u‖₂ = 1</text>
<text x="592" y="545" font-size="19">E(u) = (81/100) u, while F(u) = 0</text>
<rect x="592" y="567" width="472" height="94" rx="10" fill="#fff7ed"/>
<text x="610" y="601" font-size="20">One-step error: ‖E(u) − u‖₂ = 19/100</text>
<text x="610" y="640" font-size="20">Limit error: ‖F(u) − u‖₂ = 1</text>
<text x="592" y="688" font-size="16" fill="#475569">Exact proof: TRU-07. Curve: numerical samples.</text>
<text x="38" y="738" font-size="16">The finite-model lemmas do not by this iteration alone give nearby finite-dimensional subalgebras.</text>
<text x="38" y="762" font-size="15" fill="#475569">Human source: M. Takesaki, Theory of Operator Algebras III, XVI.1.14–1.16 (pp. 220–223).</text>
