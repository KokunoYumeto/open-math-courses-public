<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">Trace-adjoint finite models and the cost of iteration</title>
<desc id="desc">Two ucp maps preserve both traces, and S is the trace adjoint of T. Their composite E equals T T adjoint on the trace Hilbert space. In a depolarizing matrix example with alpha nine tenths, E multiplies a traceless unitary by eighty-one hundredths. Iteration converges to zero on that direction although the original target is the unitary.</desc>
<rect width="1120" height="770" rx="18" fill="#f6f8fc"/>
<g font-family="Arial,sans-serif" fill="#132238">
<text x="38" y="48" font-size="27" font-weight="700">Trace-preserving models: what the limit keeps</text>
<text x="38" y="80" font-size="18">TRU-01–06 prove the maps, improved errors and conditional-expectation limit.</text>
<rect x="30" y="104" width="1060" height="240" rx="14" fill="#fff" stroke="#cbd5e1"/>
<rect x="66" y="145" width="260" height="100" rx="12" fill="#dbeafe"/>
<rect x="794" y="145" width="260" height="100" rx="12" fill="#d1fae5"/>
<g text-anchor="middle"><text x="196" y="186" font-size="25">M, τ</text><text x="196" y="220" font-size="18">original finite algebra</text>
<text x="924" y="186" font-size="25">M_q, τ_q</text><text x="924" y="220" font-size="18">finite matrix record</text></g>
<path d="M350 163 H768 M758 153 L768 163 L758 173 M768 227 H350 M360 217 L350 227 L360 237" fill="none" stroke="#334155" stroke-width="3"/>
<text x="560" y="148" font-size="21" text-anchor="middle">S = trace adjoint of T</text>
<text x="560" y="215" font-size="21" text-anchor="middle">T</text>
<text x="66" y="285" font-size="20">τ_q S = τ</text><text x="380" y="285" font-size="20">τ T = τ_q</text><text x="670" y="285" font-size="20">E = TS = TT* on L²(M, τ)</text>
<text x="66" y="320" font-size="17" fill="#475569">E is a positive Hilbert-space contraction. Its powers tend to a finite-dimensional expectation F.</text>
<rect x="30" y="366" width="518" height="342" rx="14" fill="#fff" stroke="#cbd5e1"/>
