<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc">
<title id="title">Two convergence arguments leading to exact coefficient correction</title>
<desc id="desc">On the left, automorphism convergence lifts continuously to the core and common characteristic phases give mixed coefficient equality. On the right, an exact coordinate composition formula proves predual centrality of the quotient defect. These results give a semiliftable cocycle action on the central sequence algebra. Type II and quotient amenability then give a correcting cochain, followed by reconstruction and simultaneous finite-test approximation.</desc>
<rect width="1400" height="870" rx="20" fill="#f3f7fa"/>
<g font-family="Arial, sans-serif" fill="#17364a">
<text x="55" y="60" font-size="32" font-weight="bold">From automorphism approximation to coefficient approximation</text>
<rect x="50" y="100" width="625" height="120" rx="12" fill="#e4edf7" stroke="#7892a6"/>
<text x="78" y="139" font-size="25" font-weight="bold">Core continuity · Sections 1 and 3</text>
<text x="78" y="179" font-size="24">Ad(uₖ) β<tspan baseline-shift="sub" font-size="17">g</tspan> → α<tspan baseline-shift="sub" font-size="17">g</tspan> in the u-topology</text>
<rect x="725" y="100" width="625" height="120" rx="12" fill="#e3f0e7" stroke="#7892a6"/>
<text x="753" y="139" font-size="25" font-weight="bold">Coordinate composition · Section 5</text>
<text x="753" y="179" font-size="24">Ad(zₖ(p,q)) → id in the u-topology</text>
<path d="M360 227 L360 272 M348 258 L360 272 L372 258 M1035 227 L1035 272 M1023 258 L1035 272 L1047 258" fill="none" stroke="#385e76" stroke-width="3"/>
<rect x="50" y="282" width="625" height="140" rx="12" fill="#fff" stroke="#7892a6"/>
<text x="78" y="320" font-size="24">Continuous core extensions + common λ</text>
<text x="78" y="358" font-size="24">uₖ* δ<tspan baseline-shift="super" font-size="17">α</tspan>(g,n) σ<tspan baseline-shift="sub" font-size="17">n</tspan>(uₖ) → δ<tspan baseline-shift="super" font-size="17">β</tspan>(g,n)</text>
<text x="78" y="395" font-size="21">Strong* convergence ⇒ exact mixed equalities in B</text>
<rect x="725" y="282" width="625" height="140" rx="12" fill="#fff" stroke="#7892a6"/>
<text x="753" y="320" font-size="24">‖[zₖ(p,q), ψ]‖ → 0 for every ψ ∈ M<tspan baseline-shift="sub" font-size="17">*</tspan></text>
<text x="753" y="358" font-size="24">z(p,q) belongs to F = M<tspan baseline-shift="sub" font-size="17">ω</tspan></text>
<text x="753" y="395" font-size="21">Membership uses the defining predual norm tests.</text>
<path d="M360 430 L360 466 L700 466 M1035 430 L1035 466 L700 466 L700 495 M688 481 L700 495 L712 481" fill="none" stroke="#385e76" stroke-width="3"/>
<rect x="210" y="505" width="980" height="112" rx="12" fill="#e9e5f6" stroke="#7892a6"/>
<text x="240" y="544" font-size="25" font-weight="bold">A semiliftable cocycle action (ϱ, z) on F · Section 6</text>
<text x="240" y="584" font-size="23">Subgroup action trivial on F; the subgroup cocycle w is retained.</text>
