<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Interior matrix columns and the cohomology boundary</title>
<desc id="desc">For seven integer labels from minus three through three and two successive translations by one, five interior input labels remain in the set after both translations. Their output labels minus one through three are exact columns. The other two output columns support the entire possible defect.</desc>
<rect width="1200" height="590" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif" fill="#18364b">
<text x="50" y="52" font-size="29" font-weight="bold">Exact interior columns, controlled boundary</text>
<text x="50" y="92" font-size="23">S = {−3, −2, −1, 0, 1, 2, 3}     g = h = 1     d = 7</text>
<text x="50" y="143" font-size="22">Input label s</text>
<rect x="300" y="115" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="349" y="151" text-anchor="middle" font-size="25">-3</text><rect x="415" y="115" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="464" y="151" text-anchor="middle" font-size="25">-2</text><rect x="530" y="115" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="579" y="151" text-anchor="middle" font-size="25">-1</text><rect x="645" y="115" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="694" y="151" text-anchor="middle" font-size="25">0</text><rect x="760" y="115" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="809" y="151" text-anchor="middle" font-size="25">1</text><rect x="875" y="115" width="98" height="56" rx="8" fill="#f8dfd3" stroke="#708995"/><text x="924" y="151" text-anchor="middle" font-size="25">2</text><rect x="990" y="115" width="98" height="56" rx="8" fill="#f8dfd3" stroke="#708995"/><text x="1039" y="151" text-anchor="middle" font-size="25">3</text><text x="300" y="205" font-size="21">Interior: s, s + 1 and s + 2 all belong to S.</text>
<path d="M550 223 L550 265 M538 250 L550 265 L562 250" stroke="#365b73" stroke-width="3" fill="none"/>
<text x="585" y="249" font-size="22">The cocycle identity cancels each interior coefficient.</text>
<text x="50" y="314" font-size="22">Output column</text>
<rect x="300" y="285" width="98" height="56" rx="8" fill="#f8dfd3" stroke="#708995"/><text x="349" y="321" text-anchor="middle" font-size="25">-3</text><rect x="415" y="285" width="98" height="56" rx="8" fill="#f8dfd3" stroke="#708995"/><text x="464" y="321" text-anchor="middle" font-size="25">-2</text><rect x="530" y="285" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="579" y="321" text-anchor="middle" font-size="25">-1</text><rect x="645" y="285" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="694" y="321" text-anchor="middle" font-size="25">0</text><rect x="760" y="285" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="809" y="321" text-anchor="middle" font-size="25">1</text><rect x="875" y="285" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="924" y="321" text-anchor="middle" font-size="25">2</text><rect x="990" y="285" width="98" height="56" rx="8" fill="#d9eddf" stroke="#708995"/><text x="1039" y="321" text-anchor="middle" font-size="25">3</text><text x="300" y="378" font-size="21">Cyclic extensions: output columns −1 through 3 are fixed by D.</text>
<rect x="50" y="410" width="1100" height="132" rx="12" fill="#fff" stroke="#708995"/>
<text x="80" y="449" font-size="24">D P = P     ·     D − 1 = (1 − P)(D − 1)(1 − P)</text>
<text x="80" y="490" font-size="24">L¹ error ≤ 2b/d = 4/7     ·     L² error ≤ 2√(b/d) = 2√(2/7)</text>
<text x="80" y="524" font-size="20">Here b = 2. These are proved upper bounds; the actual defect can be smaller.</text>
<text x="50" y="574" font-size="19">Proof: Sections 3–4, equations (3.3)–(4.3). The figure uses a cyclic permutation extension.</text>
</g></svg>