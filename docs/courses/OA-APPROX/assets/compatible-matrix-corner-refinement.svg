<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">One first-corner algebra controls all rows of a compatible matrix refinement</title>
<desc id="desc">An old full matrix factor F_n of size d has first-corner identity e=e_11. A full dyadic matrix algebra G in eNe propagates to every row using E_(i,s),(j,t)=e_i1 f_st e_1j. The new diagonal refines the old diagonal. Ambient GNS gaps sum d diagonal errors with factor one over d; trace approximation sums d squared entries with the same factor. Every entry error is therefore divided by square root d.</desc>
<rect width="600" height="850" fill="#fafaf7"/>
<g font-family="Georgia,serif" font-size="26" fill="#202730">
<text x="30" y="44" font-family="Segoe UI,sans-serif" font-weight="600">Propagate the same corner</text>
<text x="30" y="87">F<tspan baseline-shift="sub" font-size="18">n</tspan> ≅ M<tspan baseline-shift="sub" font-size="18">d</tspan>,   e = e<tspan baseline-shift="sub" font-size="18">11</tspan>,   φ<tspan baseline-shift="sub" font-size="18">e</tspan> = dφ</text>
<rect x="25" y="118" width="550" height="115" rx="10" fill="#e6eef5" stroke="#3e678a" stroke-width="2"/>
<text x="45" y="160">Choose G ⊂ eNe, with units f<tspan baseline-shift="sub" font-size="18">st</tspan></text>
<text x="45" y="204">E<tspan baseline-shift="sub" font-size="18">(i,s),(j,t)</tspan> = e<tspan baseline-shift="sub" font-size="18">i1</tspan> f<tspan baseline-shift="sub" font-size="18">st</tspan> e<tspan baseline-shift="sub" font-size="18">1j</tspan></text>
<path d="M300 242 V272 M290 262 L300 272 L310 262" fill="none" stroke="#3e678a" stroke-width="3"/>
<rect x="25" y="292" width="550" height="115" rx="10" fill="#e6eef5" stroke="#3e678a" stroke-width="2"/>
<text x="45" y="334">F<tspan baseline-shift="sub" font-size="18">n+1</tspan> ≅ F<tspan baseline-shift="sub" font-size="18">n</tspan> ⊗ M<tspan baseline-shift="sub" font-size="18">k</tspan></text>
<text x="45" y="378">A<tspan baseline-shift="sub" font-size="18">n+1</tspan> = A<tspan baseline-shift="sub" font-size="18">n</tspan> ⊗ D<tspan baseline-shift="sub" font-size="18">k</tspan></text>
<rect x="25" y="439" width="550" height="126" rx="10" fill="#e0eee8" stroke="#477a68" stroke-width="2"/>
<text x="45" y="481">Ambient GNS gap: d diagonal terms</text>
<text x="45" y="526">gap² = (1/d) Σ<tspan baseline-shift="sub" font-size="18">i</tspan> corner-gap<tspan baseline-shift="sub" font-size="18">i</tspan>²</text>
<rect x="25" y="592" width="550" height="128" rx="10" fill="#e0eee8" stroke="#477a68" stroke-width="2"/>
<text x="45" y="634">Trace error: d² matrix entries</text>
<text x="45" y="680">error<tspan baseline-shift="sub" font-size="18">ik</tspan> &lt; α/√d gives total² &lt; α²</text>
<text x="30" y="773" font-family="Segoe UI,sans-serif" font-size="23">Full operator corners; arbitrary ambient type.</text>
<text x="30" y="815" font-family="Segoe UI,sans-serif" font-size="23">Theorem 2.1, equations (8), (9), (12), (MC1).</text>
</g></svg>
