<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1040" viewBox="0 0 560 1040" role="img" aria-labelledby="title description">
<title id="title">Positive functional norm and essential cyclic vector</title>
<desc id="description">A positive functional f of norm r and any positive contractive two-sided approximate identity e_i satisfy f(e_i) tending to r. Cauchy–Schwarz gives the lower bound. A norm-preserving Hahn–Banach extension to the forced unitization has value r at its unit and is positive. Its GNS vector has squared distance at most r minus f(e_i) from pi(e_i) xi and is cyclic for the original algebra. Essential vector states then norm self-adjoint elements and detect order.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#285d6b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17323c}.heading{font-size:23px;font-weight:bold}.body{font-size:21px}.small{font-size:18px}.math{font-family:Georgia,serif;font-size:23px}.box{fill:#f5fbfb;stroke:#587c85;stroke-width:1.5}.flow{stroke:#285d6b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="560" height="1040" fill="white"/>
<text x="280" y="35" text-anchor="middle" class="heading">From scalar order to a cyclic vector</text>
<text x="280" y="64" text-anchor="middle" class="body">f ≥ 0,   r = ‖f‖; arbitrary C∗-algebra A</text>
<rect x="20" y="89" width="520" height="133" rx="12" class="box"/>
<text x="38" y="119" class="heading">PCY01–PCY02 · Exact norm limit</text>
<text x="38" y="153" class="math">|f(eᵢa)|² ≤ f(eᵢ) r ‖a‖²</text>
<text x="38" y="187" class="math">eᵢa → a,   0 ≤ f(eᵢ) ≤ r ⇒ f(eᵢ) → r</text>
<text x="38" y="213" class="small">No monotonicity or countability assumption.</text>
<path d="M280 225V251" class="flow"/>
<rect x="20" y="264" width="520" height="150" rx="12" class="box"/>
<text x="38" y="294" class="heading">PCY03 · Positive forced-unit extension</text>
<text x="38" y="328" class="math">|F(1)| ≤ r,   |F(1) − 2r| ≤ r</text>
<text x="38" y="362" class="math">⇒ F(1) = ‖F‖ = r ⇒ F ≥ 0</text>
<text x="38" y="396" class="math">F(a + λ1) = f(a) + λr</text>
<path d="M280 417V443" class="flow"/>
<rect x="20" y="456" width="520" height="134" rx="12" class="box"/>
<text x="38" y="486" class="heading">PCY03 · GNS vector in the original space</text>
<text x="38" y="520" class="math">‖ξ − π(eᵢ)ξ‖² ≤ r − f(eᵢ) → 0</text>
<text x="38" y="554" class="math">‖ξ‖² = r,   closure(π(A)ξ) = H<tspan baseline-shift="sub" font-size="16">f</tspan></text>
<text x="38" y="581" class="small">Restriction to A is cyclic and nondegenerate.</text>
<path d="M280 593V619" class="flow"/>
<rect x="20" y="632" width="520" height="154" rx="12" class="box"/>
<text x="38" y="662" class="heading">PCY04 · Essential vector states</text>
<text x="38" y="696" class="math">s<tspan baseline-shift="sub" font-size="16">η</tspan>(a) = ⟨η, ρ(a)η⟩,   ‖η‖ = 1</text>
<text x="38" y="730" class="math">s<tspan baseline-shift="sub" font-size="16">η</tspan>(eᵢ) → 1 ⇒ ‖s<tspan baseline-shift="sub" font-size="16">η</tspan>‖ = 1</text>
<text x="38" y="764" class="body">Self-adjoint norm and order are detected.</text>
<text x="280" y="827" text-anchor="middle" class="heading">Inputs to the universal state representation</text>
<text x="280" y="860" text-anchor="middle" class="body">Every positive f/r is a state when r &gt; 0.</text>
<text x="280" y="894" text-anchor="middle" class="body">The original bidual proof handles all states.</text>
<text x="280" y="928" text-anchor="middle" class="small">For f = 0 use the zero vector and zero Hilbert space.</text>
<text x="280" y="958" text-anchor="middle" class="small">Proofs: PCY01–PCY04; inputs: CF, MG, F09, ODF02, NJ03.</text>
<text x="280" y="986" text-anchor="middle" class="small">Comparison: Blackadar2017, II.6.4.1–3, printed p114.</text>
<text x="280" y="1016" text-anchor="middle" class="small">Original proof diagram · CC0-1.0</text>
</svg>
