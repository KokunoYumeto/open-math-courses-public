<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1300" viewBox="0 0 560 1300" role="img" aria-labelledby="title desc">
 <title id="title">Finite matrix tests determine the spatial tensor bound</title>
 <desc id="desc">A proof diagram for TN01 through TN06. Approximate a positive functional on the finite matrix algebra over the forced unitization by vector functionals of a faithful representation. Its Gram mass tends to the squared norm of the original finite tensor vector. This proves that every spatial action satisfies the norm from a faithful pair. Commuting actions define the maximal norm. The character and its section give the split unitization sequence.</desc>
 <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246c82"/></marker>
  <style>text{font-family:Arial,sans-serif;fill:#142c37}.title{font-size:26px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.box{stroke:#4c8091;stroke-width:2;rx:16;fill:#f1f8fa}.arrow{stroke:#246c82;stroke-width:3;marker-end:url(#arrow)}</style>
 </defs>
 <rect width="560" height="1300" fill="#fff"/>
 <text x="24" y="40" class="title">A finite vector controls the norm</text>
 <text x="24" y="70" class="small">Exact proof mechanism: TN01–TN06</text>
 <rect x="20" y="92" width="520" height="164" class="box"/>
 <text x="40" y="124" class="heading">1. Encode the vector (TN03)</text>
 <text x="40" y="161" class="body">ζ = Σᵢ uᵢ ⊗ vᵢ ∈ K ⊗ H,    i = 1,…,m</text>
 <text x="40" y="197" class="small">F([aᵢⱼ]) = Σᵢⱼ ⟨uᵢ, σ†(aᵢⱼ)uⱼ⟩</text>
 <text x="40" y="233" class="body">F ≥ 0 on Mₘ(A†),   ‖F‖ = Σᵢ ‖uᵢ‖²</text>
 <path d="M280 264V294" class="arrow"/>
 <rect x="20" y="307" width="520" height="167" class="box"/>
 <text x="40" y="339" class="heading">2. Replace its finite coefficients</text>
 <text x="40" y="376" class="body">π̂ = π† ⊕ χ is faithful and unital.</text>
 <text x="40" y="412" class="body">Fₖ → F weak* by TN02.</text>
 <text x="40" y="448" class="small">ξₖℓᵢ = (xₖℓᵢ,cₖℓᵢ),   ηₖℓ = Σᵢ xₖℓᵢ ⊗ vᵢ</text>
 <path d="M280 482V512" class="arrow"/>
 <rect x="20" y="525" width="520" height="204" class="box"/>
 <text x="40" y="557" class="heading">3. Keep the Gram mass</text>
 <text x="40" y="595" class="body">Σℓ ‖ηₖℓ‖² ≤ Mₖ → ‖ζ‖²</text>
 <text x="40" y="631" class="small">χ vanishes on A; its extra mass is discarded.</text>
 <text x="40" y="670" class="body">Test t = z* z and take the limit:</text>
 <text x="40" y="706" class="small">‖(σ ⊗ τ)(z)ζ‖² ≤ ‖ζ‖² ‖(π ⊗ τ)(z)‖²</text>
 <path d="M280 737V767" class="arrow"/>
 <rect x="20" y="780" width="520" height="140" class="box"/>
 <text x="40" y="812" class="heading">4. Replace both factors (TN03)</text>
 <text x="40" y="851" class="body">π,ρ faithful; σ,τ arbitrary:</text>
 <text x="40" y="889" class="body">‖(σ ⊗ τ)(z)‖ ≤ ‖(π ⊗ ρ)(z)‖ = ‖z‖ₘᵢₙ</text>
 <rect x="20" y="949" width="520" height="132" class="box"/>
 <text x="40" y="981" class="heading">5. All commuting actions (TN04)</text>
 <text x="40" y="1018" class="body">‖z‖ₘₐₓ = sup ‖Σᵢ π(aᵢ)σ(bᵢ)‖</text>
 <text x="40" y="1055" class="body">A ⊗ₘₐₓ B → A ⊗ₘᵢₙ B is surjective.</text>
 <rect x="20" y="1110" width="520" height="122" class="box"/>
 <text x="40" y="1142" class="heading">6. Split unitization (TN06)</text>
 <text x="40" y="1178" class="small">0 → A ⊗<tspan baseline-shift="sub" font-size="14">ν</tspan> B → A† ⊗<tspan baseline-shift="sub" font-size="14">ν</tspan> B → B → 0</text>
 <text x="40" y="1213" class="small">ν = min or max;   section b ↦ 1 ⊗ b</text>
 <text x="24" y="1262" class="small">Schematic of exact maps and bounds, at arbitrary cardinality.</text>
 <text x="24" y="1289" class="small">Proof: TN01–TN06. Tensor context: Olesen §1.5, pp.31–34.</text>
</svg>
