<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1090" viewBox="0 0 660 1090" role="img" aria-labelledby="title desc">
<title id="title">The dyadic diagonal perturbation and its exact Hilbert–Schmidt budget</title>
<desc id="desc">An increment vector belongs to its parent spectral interval. The starting vectors and all increments have a total squared error at most three M squared times two to the minus N. Choosing a starting level independently on each cyclic component yields an arbitrarily small Hilbert–Schmidt self-adjoint perturbation.</desc>
<rect width="660" height="1090" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#18293a;font-size:21px}.title{font-size:25px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:19px}.panel{fill:white;stroke:#91a6b7;stroke-width:1.5}.band{stroke:#246d94;stroke-width:2}</style>
<text x="28" y="37" class="title">A diagonal basis with controlled square error</text>
<text x="28" y="72" class="small">Bounded h = h*; separable K; M &gt; ‖h‖</text>
<rect x="22" y="91" width="616" height="331" rx="12" class="panel"/>
<text x="42" y="126" class="label">1. A new vector stays in the parent interval</text>
<rect x="42" y="146" width="574" height="42" fill="#dbeafe" class="band"/>
<text x="268" y="175">parent</text>
<rect x="42" y="205" width="287" height="42" fill="#dcfce7" class="band"/><rect x="329" y="205" width="287" height="42" fill="#fef3c7" class="band"/>
<text x="145" y="234">left child</text>
<text x="426" y="234">right child</text>
<text x="42" y="277" class="small">l, r: normalized nonzero child projections of x</text>
<text x="42" y="312">Conditional weights: μL = 1/4, μR = 3/4</text>
<text x="42" y="348">p = (l + √3 r)/2;   e = (√3 l − r)/2</text>
<text x="42" y="383">‖p‖ = ‖e‖ = 1;   ⟨p,e⟩ = 0</text>
<text x="42" y="409" class="small">A zero child gives no new increment vector.</text>
<rect x="22" y="443" width="616" height="324" rx="12" class="panel"/>
<text x="42" y="478" class="label">2. Count vectors and use the parent half-width</text>
<text x="42" y="519">Start at level N: at most 2ᴺ vectors</text>
<text x="42" y="556">Each error ≤ M 2⁻ᴺ; subtotal ≤ M² 2⁻ᴺ</text>
<text x="42" y="597">Increment n &gt; N: at most 2ⁿ⁻¹ vectors</text>
<text x="42" y="634">Each error ≤ M 2⁻⁽ⁿ⁻¹⁾</text>
<text x="42" y="675">All increments: subtotal ≤ 2 M² 2⁻ᴺ</text>
<text x="42" y="716">Σₑ ‖(h − λₑ)e‖² ≤ 3 M² 2⁻ᴺ</text>
<text x="42" y="750" class="small">λₑ is the midpoint of the supporting interval.</text>
<rect x="22" y="788" width="616" height="250" rx="12" class="panel"/>
<text x="42" y="823" class="label">3. Assemble the reducing cyclic components</text>
<text x="42" y="864">On component j, choose Nⱼ with</text>
<text x="42" y="903">3 M² 2⁻ᴺʲ &lt; ε² 2⁻ʲ⁻¹</text>
<text x="42" y="942">d e = λₑ e;   k = d − h = k*</text>
<text x="42" y="981">‖k‖²HS = Σₑ ‖(d − h)e‖² &lt; ε²</text>
<text x="42" y="1018" class="small">h + k = d has an orthonormal eigenbasis.</text>
<text x="28" y="1070" class="small">Bogoliubov Sections 6.3–6.5 · original diagram, CC0</text>
</svg>
