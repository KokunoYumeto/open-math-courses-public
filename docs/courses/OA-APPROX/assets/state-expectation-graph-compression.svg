<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1060" viewBox="0 0 600 1060" role="img" aria-labelledby="title desc">
<title id="title">Full graph reduction makes the faithful-state compression an expectation</title>
<desc id="desc">For a unital modular invariant subalgebra B, its closed GNS subspace H_B has projection q. Real-parameter shifted Gaussian integrals give Delta to power r times f_n(Delta)b Omega inside B Omega. The minus one half shift proves J invariance. Two graph limits identify the entire smaller Tomita operator and adjoint. The commutant theorem then puts q x q in the smaller represented algebra and yields the state-preserving normal expectation.</desc>
<rect width="600" height="1060" fill="#fafaf7"/>
<g font-family="Georgia,serif" font-size="25" fill="#202730">
<text x="30" y="44" font-family="Segoe UI,sans-serif" font-weight="600">Reduce the entire GNS graph</text>
<text x="30" y="86">B ⊂ M,   α<tspan baseline-shift="sub" font-size="18">t</tspan>(B) = B</text>
<text x="30" y="128">H<tspan baseline-shift="sub" font-size="18">B</tspan> = closure(BΩ),   q = P<tspan baseline-shift="sub" font-size="18">H_B</tspan></text>
<rect x="25" y="154" width="550" height="154" rx="10" fill="#e6eef5" stroke="#3e678a" stroke-width="2"/>
<text x="45" y="194">Real-parameter Gaussian integral</text>
<text x="45" y="236">b<tspan baseline-shift="sub" font-size="18">n,r</tspan>Ω = Δ<tspan baseline-shift="super" font-size="18">r</tspan> f<tspan baseline-shift="sub" font-size="18">n</tspan>(Δ)bΩ ∈ BΩ</text>
<text x="45" y="278">r = −1/2 gives JH<tspan baseline-shift="sub" font-size="18">B</tspan> = H<tspan baseline-shift="sub" font-size="18">B</tspan></text>
<path d="M300 316 V346 M290 336 L300 346 L310 336" fill="none" stroke="#3e678a" stroke-width="3"/>
<rect x="25" y="366" width="550" height="154" rx="10" fill="#e6eef5" stroke="#3e678a" stroke-width="2"/>
<text x="45" y="406">First limit: j → ∞ at fixed n</text>
<text x="45" y="448">Second limit: f<tspan baseline-shift="sub" font-size="18">n</tspan>(Δ)ξ → ξ in graph norm</text>
<text x="45" y="490">D(S<tspan baseline-shift="sub" font-size="18">B</tspan>) = H<tspan baseline-shift="sub" font-size="18">B</tspan> ∩ D(S)</text>
<path d="M300 530 V560 M290 550 L300 560 L310 550" fill="none" stroke="#3e678a" stroke-width="3"/>
<rect x="25" y="580" width="550" height="118" rx="10" fill="#e0eee8" stroke="#477a68" stroke-width="2"/>
<text x="45" y="622">J<tspan baseline-shift="sub" font-size="18">B</tspan> = J|<tspan baseline-shift="sub" font-size="18">H_B</tspan>,   Δ<tspan baseline-shift="sub" font-size="18">B</tspan> = Δ|<tspan baseline-shift="sub" font-size="18">H_B</tspan></text>
<text x="45" y="669">Full adjoint domain also restricts</text>
<path d="M300 708 V738 M290 728 L300 738 L310 728" fill="none" stroke="#477a68" stroke-width="3"/>
<rect x="25" y="758" width="550" height="142" rx="10" fill="#e0eee8" stroke="#477a68" stroke-width="2"/>
<text x="45" y="800">qxq commutes with J<tspan baseline-shift="sub" font-size="18">B</tspan>π<tspan baseline-shift="sub" font-size="18">B</tspan>(B)J<tspan baseline-shift="sub" font-size="18">B</tspan></text>
<text x="45" y="844">π<tspan baseline-shift="sub" font-size="18">B</tspan>(E<tspan baseline-shift="sub" font-size="18">B</tspan>(x)) = qxq|<tspan baseline-shift="sub" font-size="18">H_B</tspan></text>
<text x="45" y="886">E<tspan baseline-shift="sub" font-size="18">B</tspan>(x)Ω = qxΩ,   φE<tspan baseline-shift="sub" font-size="18">B</tspan> = φ</text>
<text x="30" y="951" font-family="Segoe UI,sans-serif" font-size="23">All bounded increasing nets prove normality.</text>
<text x="30" y="993" font-family="Segoe UI,sans-serif" font-size="23">Faithful normal states; arbitrary Hilbert spaces.</text>
<text x="30" y="1030" font-family="Segoe UI,sans-serif" font-size="21">Exact proofs: SE2–SE5; full domains in (SE7)–(SE8).</text>
</g></svg>
