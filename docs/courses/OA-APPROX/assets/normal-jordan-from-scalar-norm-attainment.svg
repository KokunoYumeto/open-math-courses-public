<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1170" viewBox="0 0 560 1170" role="img" aria-labelledby="title description">
<title id="title">Normal Jordan decomposition from a norming contraction</title>
<desc id="description">For a nonzero hermitian normal functional f, write c for its norm. The concrete predual makes the self-adjoint operator unit ball compact, giving h with f(h)=c. Scalar calculus gives the unitary v=h+i square root of one minus h squared. The functional g(x)=f(vx) is positive normal and annihilates one minus h squared. Rational cutoffs of the positive part of h converge strongly to a range projection p. Orthogonal corner compression gives the unique positive normal parts with sum of norms c.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#285d6b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17323c}.heading{font-size:23px;font-weight:bold}.body{font-size:21px}.small{font-size:18px}.math{font-family:Georgia,serif;font-size:23px}.box{fill:#f5fbfb;stroke:#587c85;stroke-width:1.5}.flow{stroke:#285d6b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="560" height="1170" fill="white"/>
<text x="280" y="35" text-anchor="middle" class="heading">Normal Jordan decomposition</text>
<text x="280" y="64" text-anchor="middle" class="body">f = f*, normal; c = ‖f‖ &gt; 0</text>
<rect x="20" y="89" width="520" height="129" rx="12" class="box"/>
<text x="38" y="119" class="heading">NJ01–NJ02 · Concrete duality</text>
<text x="38" y="151" class="math">M = (M<tspan baseline-shift="sub" font-size="16">∗</tspan>)<tspan baseline-shift="super" font-size="16">∗</tspan> ⇒ compact operator ball</text>
<text x="38" y="183" class="math">h = h*,   ‖h‖ ≤ 1,   f(h) = c</text>
<text x="38" y="208" class="small">Arbitrary H; no faithful normal state needed.</text>
<path d="M280 221V248" class="flow"/>
<rect x="20" y="261" width="520" height="145" rx="12" class="box"/>
<text x="38" y="291" class="heading">NJ03–NJ04 · Scalar unitary rotation</text>
<text x="38" y="324" class="math">s = (1 − h²)¹ᐟ²,   v = h + i s</text>
<text x="38" y="357" class="math">v*v = vv* = 1,   f(v) = c</text>
<text x="38" y="390" class="math">g(x) = f(vx),   g ≥ 0,   ‖g‖ = c</text>
<path d="M280 409V436" class="flow"/>
<rect x="20" y="449" width="520" height="127" rx="12" class="box"/>
<text x="38" y="479" class="heading">NJ04 · Vanishing scalar defect</text>
<text x="38" y="511" class="math">g(1 − h²) = 0</text>
<text x="38" y="545" class="math">f(x) = g(hx) = g(xh)</text>
<text x="38" y="568" class="small">Cauchy–Schwarz removes the s coefficients.</text>
<path d="M280 579V606" class="flow"/>
<rect x="20" y="619" width="520" height="145" rx="12" class="box"/>
<text x="38" y="649" class="heading">NJ05 · Rational range projection</text>
<text x="38" y="682" class="math">k = h₊,   pₙ = k(k + 1/n)⁻¹ → p</text>
<text x="38" y="715" class="body">Strong limit; p projects onto closure(ran k).</text>
<text x="38" y="748" class="math">q = 1 − p,   w = p − q,   w² = 1</text>
<path d="M280 767V794" class="flow"/>
<rect x="20" y="807" width="520" height="156" rx="12" class="box"/>
<text x="38" y="837" class="heading">NJ05 · Orthogonal corner compression</text>
<text x="38" y="870" class="math">f₊(x) = g(pxp),   f₋(x) = g(qxq)</text>
<text x="38" y="903" class="math">f = f₊ − f₋,   ‖f₊‖ + ‖f₋‖ = c</text>
<text x="38" y="935" class="body">Both parts are positive and normal.</text>
<text x="38" y="955" class="small">Exact bound: 0 ≤ (h − w)² ≤ 1 − h².</text>
<text x="280" y="998" text-anchor="middle" class="heading">NJ06 · Norm equality forces uniqueness</text>
<text x="280" y="1031" text-anchor="middle" class="math">f = r − t,   ‖r‖ + ‖t‖ = c</text>
<text x="280" y="1063" text-anchor="middle" class="math">⇒ r(q) = t(p) = 0 ⇒ r = f₊, t = f₋</text>
<text x="280" y="1093" text-anchor="middle" class="small">For f = 0 both positive parts are zero.</text>
<text x="280" y="1120" text-anchor="middle" class="small">Proofs: NJ01–NJ06; inputs: CF1–10, CP01–06.</text>
<text x="280" y="1143" text-anchor="middle" class="small">Comparison: Peterson2015, Theorem3.11.3, pp79–80.</text>
<text x="280" y="1163" text-anchor="middle" class="small">Original proof diagram · CC0-1.0</text>
</svg>
