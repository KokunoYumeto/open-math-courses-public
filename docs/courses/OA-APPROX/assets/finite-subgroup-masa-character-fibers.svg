<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
  <title id="title">Finite subgroup character fibers for S3 and H generated by (12)</title>
  <desc id="desc">A two by two grid of left and right character signs. Each diagonal fiber has one subgroup vector and one off-subgroup vector, so its commutant is M2 of C. Each off-diagonal fiber has one off-subgroup vector, so its commutant is C. The subgroup projection has rank two and is not central because an intertwiner can interchange the two vectors in either diagonal fiber.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
  </defs>
  <rect width="640" height="680" rx="16" fill="#fff"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#172b3a" text-anchor="middle">
    <text x="320" y="39" font-size="29" font-weight="bold">S₃ with H = ⟨(12)⟩</text>
    <text x="320" y="73" font-size="23">Finite-group comparison: q = 2, n = 1</text>
    <text x="320" y="110" font-size="24">ψ(s)</text>
    <text x="202" y="140" font-size="27">+</text><text x="472" y="140" font-size="27">−</text>
    <text x="22" y="319" font-size="25">χ(s)</text>
    <text x="57" y="242" font-size="27">+</text><text x="57" y="432" font-size="27">−</text>
    <rect x="80" y="155" width="245" height="170" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="350" y="155" width="245" height="170" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="80" y="345" width="245" height="170" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="350" y="345" width="245" height="170" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="202" y="185" font-size="24">dimension 2</text><text x="472" y="185" font-size="24">dimension 1</text>
    <text x="202" y="375" font-size="24">dimension 1</text><text x="472" y="375" font-size="24">dimension 2</text>
    <circle cx="145" cy="220" r="14" fill="#b45309"/><circle cx="260" cy="220" r="14" fill="#0369a1"/>
    <path d="M168 220 H237" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <circle cx="472" cy="220" r="14" fill="#0369a1"/>
    <circle cx="202" cy="410" r="14" fill="#0369a1"/>
    <circle cx="415" cy="410" r="14" fill="#b45309"/><circle cx="530" cy="410" r="14" fill="#0369a1"/>
    <path d="M438 410 H507" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="145" y="263" font-size="26">v₊</text><text x="260" y="263" font-size="26">w₊₊</text>
    <text x="472" y="263" font-size="26">w₊₋</text><text x="202" y="453" font-size="26">w₋₊</text>
    <text x="415" y="453" font-size="26">v₋</text><text x="530" y="453" font-size="26">w₋₋</text>
    <text x="202" y="305" font-size="28">M₂(ℂ)</text><text x="472" y="305" font-size="28">ℂ</text>
    <text x="202" y="495" font-size="28">ℂ</text><text x="472" y="495" font-size="28">M₂(ℂ)</text>
    <circle cx="85" cy="553" r="12" fill="#b45309"/><circle cx="85" cy="594" r="12" fill="#0369a1"/>
    <text x="112" y="561" text-anchor="start" font-size="22">Subgroup vector: selected by e<tspan baseline-shift="sub" font-size="17">A</tspan></text>
    <text x="112" y="602" text-anchor="start" font-size="22">Off-subgroup vector: killed by e<tspan baseline-shift="sub" font-size="17">A</tspan></text>
    <text x="320" y="652" font-size="24" font-weight="bold">e<tspan baseline-shift="sub" font-size="18">A</tspan> has rank 2 and is not central.</text>
  </g>
</svg>
