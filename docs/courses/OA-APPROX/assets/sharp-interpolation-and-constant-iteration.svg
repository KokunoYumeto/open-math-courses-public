<svg xmlns="http://www.w3.org/2000/svg" width="760" height="970" viewBox="0 0 760 970" role="img" aria-labelledby="title desc">
<title id="title">Interpolation and the exact improvement of the four-state constant</title>
<desc id="desc">A vertical strip from real part epsilon to 2, with evaluation at 1. The affine boundary weights tend to one half as epsilon tends to zero. Finite third-root averaging and state selection turn C into the square root of C times the form norm. The lower graph plots the exact normalized constants (81/16) to the power 2 to the minus n, decreasing to one.</desc>
<metadata>Original course figure and reproducible source: CC0-1.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2b566c"/></marker></defs>
<rect width="760" height="970" fill="#fbfcfe"/>
<style>text{font-family:Arial,sans-serif;fill:#183846} .small{font-size:15px} .body{font-size:18px} .title{font-size:23px;font-weight:700} .formula{font-size:21px}</style>
<text x="30" y="38" class="title" text-anchor="start">A strip turns fourth moments into a better constant</text>
<text x="30" y="69" class="formula" text-anchor="start">h(z) = V(f_x(z), f_y(z));  f_x(1) = x</text>
<text x="30" y="98" class="small" text-anchor="start">The drawing uses ε = 1/4; the proof allows every 0 &lt; ε &lt; 1.</text>
<rect x="145" y="125" width="435" height="214" fill="#e4eef6" stroke="#9eb8cb"/>
<line x1="145" y1="125" x2="145" y2="339" stroke="#2b566c" stroke-width="2"/>
<line x1="580" y1="125" x2="580" y2="339" stroke="#2b566c" stroke-width="2"/>
<line x1="331.42857142857144" y1="125" x2="331.42857142857144" y2="339" stroke="#bf6c23" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="331.42857142857144" cy="231" r="6" fill="#bf6c23"/>
<text x="145" y="365" class="body" text-anchor="middle">Re z = ε</text>
<text x="331.42857142857144" y="365" class="body" text-anchor="middle">Re z = 1</text>
<text x="580" y="365" class="body" text-anchor="middle">Re z = 2</text>
<text x="30" y="400" class="body" text-anchor="start">Left:  |h(ε+it)| ≤ ||V|| ||x||^ε ||y||^ε</text>
<text x="30" y="430" class="body" text-anchor="start">Right: |h(2+it)| ≤ C P(x)^(1/2) Q(y)^(1/2)</text>
<text x="30" y="462" class="formula" text-anchor="start">θ_left = 1/(2−ε);  θ_right = (1−ε)/(2−ε)</text>
<text x="30" y="493" class="body" text-anchor="start">As ε ↓ 0, both weights tend to 1/2.</text>
<text x="30" y="524" class="body" text-anchor="start">Thus |V(x,y)| ≤ √(C ||V||) P(x)^(1/4) Q(y)^(1/4).</text>
<text x="30" y="553" class="small" text-anchor="start">If x = 0 or y = 0, h = 0; zero boundary bounds use a tolerance.</text>
<line x1="30" y1="580" x2="730" y2="580" stroke="#c9d5dd" stroke-width="2"/>
<text x="30" y="616" class="title" text-anchor="start">Finite phases and common states complete the improvement</text>
<text x="30" y="647" class="formula" text-anchor="start">C_new = √(C ||V||);  c_n = C_n/||V|| = (81/16)^(2^(−n))</text>
<text x="30" y="674" class="small" text-anchor="start">Exact data below; V ≠ 0. The limiting state quadruple comes from compactness.</text>
<line x1="92" y1="891.0" x2="697" y2="891.0" stroke="#d4dee5" stroke-width="2" stroke-dasharray="3 5"/>
<text x="80" y="896.0" class="small" text-anchor="end">1</text>
<line x1="92" y1="845.2153846153847" x2="697" y2="845.2153846153847" stroke="#d4dee5" stroke-width="2" stroke-dasharray="3 5"/>
<text x="80" y="850.2153846153847" class="small" text-anchor="end">2</text>
<line x1="92" y1="799.4307692307692" x2="697" y2="799.4307692307692" stroke="#d4dee5" stroke-width="2" stroke-dasharray="3 5"/>
<text x="80" y="804.4307692307692" class="small" text-anchor="end">3</text>
<line x1="92" y1="753.6461538461539" x2="697" y2="753.6461538461539" stroke="#d4dee5" stroke-width="2" stroke-dasharray="3 5"/>
<text x="80" y="758.6461538461539" class="small" text-anchor="end">4</text>
<line x1="92" y1="705.0" x2="697" y2="705.0" stroke="#d4dee5" stroke-width="2" stroke-dasharray="3 5"/>
<text x="80" y="710.0" class="small" text-anchor="end">81/16</text>
<line x1="92" y1="891" x2="92" y2="695" stroke="#2b566c" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="92" y1="891" x2="709" y2="891" stroke="#2b566c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="92.000000,705.000000 192.833333,833.769231 293.666667,868.107692 394.500000,880.710143 495.333333,886.115609 596.166667,888.619680 697.000000,889.824920" fill="none" stroke="#bf6c23" stroke-width="3"/>
<circle cx="92.000000" cy="705.000000" r="4" fill="#bf6c23"/>
<text x="92.0" y="914" class="small" text-anchor="middle">0</text>
<circle cx="192.833333" cy="833.769231" r="4" fill="#bf6c23"/>
<text x="192.83333333333331" y="914" class="small" text-anchor="middle">1</text>
<circle cx="293.666667" cy="868.107692" r="4" fill="#bf6c23"/>
<text x="293.66666666666663" y="914" class="small" text-anchor="middle">2</text>
<circle cx="394.500000" cy="880.710143" r="4" fill="#bf6c23"/>
<text x="394.5" y="914" class="small" text-anchor="middle">3</text>
<circle cx="495.333333" cy="886.115609" r="4" fill="#bf6c23"/>
<text x="495.3333333333333" y="914" class="small" text-anchor="middle">4</text>
<circle cx="596.166667" cy="888.619680" r="4" fill="#bf6c23"/>
<text x="596.1666666666667" y="914" class="small" text-anchor="middle">5</text>
<circle cx="697.000000" cy="889.824920" r="4" fill="#bf6c23"/>
<text x="697.0" y="914" class="small" text-anchor="middle">6</text>
<text x="92" y="687" class="small" text-anchor="start">c_n</text>
<text x="712" y="914" class="small" text-anchor="start">n</text>
<text x="30" y="949" class="small" text-anchor="start">Proof: polar powers → three lines → finite third-root average → state selection.</text>
</svg>
