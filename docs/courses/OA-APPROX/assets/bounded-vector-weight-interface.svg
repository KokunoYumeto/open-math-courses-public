<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img" aria-labelledby="title desc">
<title id="title">Whole bounded-vector ideals and modular covariance</title>
<desc id="desc">J exchanges the whole left and right bounded-vector spaces. Their multiplication ideals belong to M and M prime, and the inverse vector maps recover each vector. The exact graph intersections are C and D. The mixed identity holds for every pair of bounded vectors. Modular unitaries preserve both whole spaces. BW1 to BW4 prove these maps on arbitrary Hilbert spaces.</desc>
<metadata>Original diagram by GPT-6.1 Sol (OpenAI), Ultra, 2026-10-07. CC0-1.0 to the extent of rights held. Proof locators BW1–BW4. Editable native vector source; no embedded font software.</metadata>
<rect width="600" height="780" fill="#f7fafc"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#254b6d"/></marker></defs>
<g fill="#17344c" font-family="Georgia, serif">
<text x="30" y="40" font-size="26" font-weight="bold">Whole bounded vectors and their ideals</text>
<text x="30" y="76" font-size="23">Any left Hilbert algebra on arbitrary H</text>
<g fill="white" stroke="#254b6d" stroke-width="2"><rect x="30" y="110" width="540" height="188" rx="10"/><rect x="30" y="410" width="540" height="188" rx="10"/></g>
<g font-size="28">
<text x="50" y="153">Left bounded: ξ ∈ B<tspan baseline-shift="sub" font-size="19">l</tspan></text>
<text x="50" y="202" font-size="25">ξ ↦ λ<tspan baseline-shift="sub" font-size="18">ξ</tspan> ∈ I<tspan baseline-shift="sub" font-size="18">l</tspan> ⊂ M; θ<tspan baseline-shift="sub" font-size="18">l</tspan>(λ<tspan baseline-shift="sub" font-size="18">ξ</tspan>) = ξ</text>
<text x="50" y="254">C = A″ = B<tspan baseline-shift="sub" font-size="19">l</tspan> ∩ D(S)</text>
<text x="50" y="453">Right bounded: η ∈ B<tspan baseline-shift="sub" font-size="19">r</tspan></text>
<text x="50" y="502" font-size="25">η ↦ R<tspan baseline-shift="sub" font-size="18">η</tspan> ∈ I<tspan baseline-shift="sub" font-size="18">r</tspan> ⊂ M′; θ<tspan baseline-shift="sub" font-size="18">r</tspan>(R<tspan baseline-shift="sub" font-size="18">η</tspan>) = η</text>
<text x="50" y="554">D = A′ = B<tspan baseline-shift="sub" font-size="19">r</tspan> ∩ D(F)</text>
</g>
<path d="M300 312V397" stroke="#254b6d" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="335" y="355" font-size="28">J</text><text x="30" y="360" font-size="21">Whole spaces</text>
<text x="30" y="643" font-size="26">λ<tspan baseline-shift="sub" font-size="18">ξ</tspan> η = R<tspan baseline-shift="sub" font-size="18">η</tspan> ξ (ξ ∈ B<tspan baseline-shift="sub" font-size="18">l</tspan>, η ∈ B<tspan baseline-shift="sub" font-size="18">r</tspan>) [BW8]</text>
<text x="30" y="685" font-size="24">U<tspan baseline-shift="sub" font-size="17">t</tspan> preserves both spaces and conjugates</text>
<text x="30" y="718" font-size="24">their multipliers [BW10]; U<tspan baseline-shift="sub" font-size="17">t</tspan> = Δ<tspan baseline-shift="super" font-size="17">it</tspan>.</text>
<text x="30" y="757" font-size="21">No condition ξ, η ∈ D(S) ∩ D(F) is imposed.</text>
