<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1280" viewBox="0 0 560 1280" role="img" aria-labelledby="title desc">
  <title id="title">From bounded representatives to one exact completely positive lift</title>
  <desc id="desc">For a nonzero limiting map first scaled to norm one, Theorem 4.3 bounds initially uncontrolled lifts. Forced unitization produces unital completely positive lifts. Quasicentral gluing preserves each new quotient map and bounds successive changes by two to the minus k on the first k dense tests. Their norm limit is an exact lift, with tail bound two to the one minus k. The scalar character returns the restriction to the original algebra B. The zero limiting map has the zero lift.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23617a"/></marker>
    <style>
      text{font:21px Georgia,serif;fill:#1d2d39}
      .heading{font:bold 23px system-ui,sans-serif}
      .small{font:18px system-ui,sans-serif}
      .math{font:23px Cambria,Georgia,serif}
      .box{fill:#f7fbfd;stroke:#23617a;stroke-width:2}
      .next{stroke:#23617a;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="560" height="1280" fill="#fff"/>
  <text class="heading" x="280" y="32" text-anchor="middle">One exact lift from bounded choices</text>
  <text class="small" x="280" y="62" text-anchor="middle">A separable; B and J arbitrary. Scale ‖θ‖ to 1.</text>

  <rect class="box" x="24" y="90" width="512" height="205" rx="12"/>
  <text class="heading" x="44" y="127">1. Control the representatives</text>
  <text x="44" y="164">Compress Ψₙ at e² and clip h = Ψₙ(e²).</text>
  <text class="math" x="44" y="201">Γ(a) = d Ψₙ(eae) d,    ‖Γ‖ ≤ 1</text>
  <text class="math" x="44" y="238">η = qΓ,   ‖η(a) − θ(a)‖ &lt; (3 + δ)δ</text>
  <text class="small" x="44" y="274">Finite tests in the unit ball · Theorem 4.3</text>

  <path class="next" d="M280 298 V335"/>
  <rect class="box" x="24" y="347" width="512" height="175" rx="12"/>
  <text class="heading" x="44" y="384">2. Adjoin units and choose tests</text>
  <text class="math" x="44" y="422">θₖ : A† → B†/J,   with ucp lifts Ψₖ</text>
  <text class="math" x="44" y="460">‖θₖ(aⱼ) − θ†(aⱼ)‖ &lt; 2⁻ᵏ⁻³,   j ≤ k</text>
  <text class="small" x="44" y="500">Lemma 4.1 · Theorem 3.2 · dense unit-ball tests</text>

  <path class="next" d="M280 525 V562"/>
  <rect class="box" x="24" y="574" width="512" height="280" rx="12"/>
  <text class="heading" x="44" y="611">3. Retain earlier choices inside J</text>
  <text class="math" x="44" y="649">Φₖ₊₁(a) = u<tspan baseline-shift="super" font-size="16">1/2</tspan> Φₖ(a) u<tspan baseline-shift="super" font-size="16">1/2</tspan></text>
  <text class="math" x="80" y="687">+ (1 − u)<tspan baseline-shift="super" font-size="16">1/2</tspan> Ψₖ₊₁(a) (1 − u)<tspan baseline-shift="super" font-size="16">1/2</tspan></text>
  <text x="44" y="724">Choose u ∈ J almost central on the tests.</text>
  <text class="math" x="44" y="764">q†Φₖ₊₁ = θₖ₊₁     (exact equality)</text>
  <text class="math" x="44" y="803">‖Φₖ₊₁(aⱼ) − Φₖ(aⱼ)‖ &lt; 2⁻ᵏ,   j ≤ k</text>
  <text class="small" x="44" y="833">Φₖ₊₁ remains ucp · Lemma 3.1</text>

  <path class="next" d="M280 857 V894"/>
  <rect class="box" x="24" y="906" width="512" height="310" rx="12"/>
  <text class="heading" x="44" y="943">4. Sum the changes and restrict</text>
  <text class="math" x="44" y="982">‖Φ(aⱼ) − Φₖ(aⱼ)‖ ≤ 2¹⁻ᵏ,   j ≤ k</text>
  <text x="44" y="1019">The common norm bound extends the limit</text>
  <text x="44" y="1051">from dense tests to every element of A†.</text>
  <text class="math" x="44" y="1093">q†Φ = θ†,    χ<tspan baseline-shift="sub" font-size="16">B</tspan>(Φ(a)) = 0 for a ∈ A</text>
  <text class="math" x="44" y="1135">Θ = Φ|<tspan baseline-shift="sub" font-size="16">A</tspan> : A → B,    qΘ = θ,    ‖Θ‖ = 1</text>
  <text class="small" x="44" y="1176">Theorems 3.2 and 4.3 · restore the original scale</text>
  <text class="small" x="44" y="1201">For θ = 0, use Θ = 0.</text>
  <text class="small" x="280" y="1253" text-anchor="middle">Original CC0 figure · exact maps and proved bounds</text>
</svg>
