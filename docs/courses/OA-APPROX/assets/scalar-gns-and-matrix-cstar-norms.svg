<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1270" viewBox="0 0 500 1270" role="img" aria-labelledby="title desc">
<title id="title">From scalar order to matrix positivity</title>
<desc id="desc">Six proof steps for arbitrary C-star algebras, including the zero algebra. Scalar Hahn–Banach gives norming states, scalar GNS gives representations, their direct sum is faithful and isometric, operator matrices give a complete choice-independent C-star norm, and matrix square roots prove complete positivity of positive functionals. No matrix positivity is used in the first three steps.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#275876"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#182c39} .heading{font-size:22px;font-weight:bold}.body{font-size:20px}.small{font-size:18px}.panel{fill:#f7fafb;stroke:#557489;stroke-width:1.5}.flow{stroke:#275876;stroke-width:2;marker-end:url(#arrow)}.math{font-family:Georgia,serif;font-size:22px}</style>
<rect width="500" height="1270" fill="#ffffff"/>
<text x="250" y="36" text-anchor="middle" class="heading">Scalar order → matrix positivity</text>
<text x="250" y="65" text-anchor="middle" class="body">Arbitrary A, including A = 0; n ≥ 1</text>
<rect x="20" y="88" width="460" height="146" rx="12" class="panel"/>
<text x="38" y="118" class="heading">MG01 · Scalar Hahn–Banach</text>
<text x="38" y="148" class="body">C ≠ 0 unital, h ≥ 0: a state s exists</text>
<text x="38" y="182" class="math">s(h) = ‖h‖,   ‖s‖ = s(1) = 1</text>
<text x="38" y="214" class="small">Order majorants give a positive extension.</text>
<path d="M250 237V264" class="flow"/>
<rect x="20" y="278" width="460" height="144" rx="12" class="panel"/>
<text x="38" y="308" class="heading">MG02 · Scalar GNS</text>
<text x="38" y="340" class="math">⟨a,b⟩ = s(a*b),   ξₛ = [1]</text>
<text x="38" y="372" class="body">Quotient null vectors; complete to Hₛ.</text>
<text x="38" y="403" class="math">πₛ(c)[a] = [ca],   ‖πₛ(c)‖ ≤ ‖c‖</text>
<path d="M250 425V453" class="flow"/>
<rect x="20" y="466" width="460" height="143" rx="12" class="panel"/>
<text x="38" y="496" class="heading">MG03 · Faithful direct sum</text>
<text x="38" y="527" class="body">C = A† = A ⊕ ℂ, even if A = 0</text>
<text x="38" y="560" class="math">Γ = ⊕ₛ πₛ,   ‖Γ(c)‖ = ‖c‖</text>
<text x="38" y="591" class="small">Test c*c with a norming state; restrict to A.</text>
<path d="M250 612V640" class="flow"/>
<rect x="20" y="653" width="460" height="156" rx="12" class="panel"/>
<text x="38" y="683" class="heading">MG04 · Matrix C*-norm</text>
<text x="38" y="715" class="math">P = [aᵢⱼ] ↦ [Γ(aᵢⱼ)] on Hⁿ</text>
<text x="38" y="748" class="math">max ‖aᵢⱼ‖ ≤ ‖P‖ ≤ Σ ‖aᵢⱼ‖</text>
<text x="38" y="778" class="small">Entry limits prove completeness.</text>
<text x="38" y="800" class="small">Scalar *-isomorphisms prove norm uniqueness.</text>
<path d="M250 812V840" class="flow"/>
<rect x="20" y="853" width="460" height="156" rx="12" class="panel"/>
<text x="38" y="883" class="heading">MG05 · Matrix square roots</text>
<text x="38" y="915" class="math">P ≥ 0 ⇒ P = R*R,   R ∈ Mₙ(A)</text>
<text x="38" y="947" class="math">yᵢ = Σⱼ Rᵢⱼ λⱼ,   λ ∈ ℂⁿ</text>
<text x="38" y="979" class="math">λ*fₙ(P)λ = f(Σᵢ yᵢ*yᵢ) ≥ 0</text>
<text x="38" y="1001" class="small">Scalar positive f : A → ℂ is bounded and CP.</text>
<path d="M250 1012V1040" class="flow"/>
<rect x="20" y="1053" width="460" height="109" rx="12" class="panel"/>
<text x="38" y="1083" class="heading">MG06 · Amplified *-maps</text>
<text x="38" y="1115" class="math">‖φₙ(P)‖ ≤ ‖P‖ for all n</text>
<text x="38" y="1147" class="body">Injective φ gives equality for all n.</text>
<text x="250" y="1192" text-anchor="middle" class="small">Proof locators: MG01–MG06 in the lesson.</text>
<text x="250" y="1217" text-anchor="middle" class="small">Scalar inputs: OA-FLOW-CF §§1–10.</text>
<text x="250" y="1242" text-anchor="middle" class="small">GNS comparison: Peterson 2015, pp.31–32.</text>
<text x="250" y="1262" text-anchor="middle" class="small">Original diagram · CC0-1.0</text>
</svg>
