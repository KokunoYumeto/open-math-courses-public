<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1020" role="img" aria-labelledby="title desc">
<title id="title">Finite-trace corners yield models of the whole algebra</title>
<desc id="desc">In an injective algebra N with a faithful normal semifinite trace, finite-trace projections e F increase strongly to one. Normal completely positive contraction maps compress N to the corner and map it to a matrix algebra. Completely positive contractions return it to the corner and include it into N. The normal functional error is bounded by the compression error plus the corner model error, each less than epsilon over two.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#146665" stroke-width="1.8"/></marker></defs>
<rect width="400" height="1020" fill="#fafaf7"/>
<g font-family="Arial,sans-serif" fill="#202730" text-anchor="middle">
<text x="200" y="34" font-size="23" font-weight="bold">Finite trace → finite models</text>
<text x="200" y="65" font-size="18">N injective; τ faithful, normal, semifinite</text>
<text x="200" y="94" font-size="19">0 &lt; τ(e<tspan baseline-shift="sub" font-size="13">F</tspan>) &lt; ∞; e<tspan baseline-shift="sub" font-size="13">F</tspan> ↑ 1 strongly</text>
<rect x="42" y="130" width="316" height="80" rx="10" fill="#e9f2f1" stroke="#146665" stroke-width="1.5"/>
<text x="200" y="162" font-size="25">N</text><text x="200" y="190" font-size="18">the whole algebra</text>
<rect x="42" y="285" width="316" height="80" rx="10" fill="#e9f2f1" stroke="#146665" stroke-width="1.5"/>
<text x="200" y="317" font-size="25">eꜰ N eꜰ</text><text x="200" y="345" font-size="18">τꜰ = τ / τ(eꜰ)</text>
<rect x="42" y="440" width="316" height="80" rx="10" fill="#e9f2f1" stroke="#146665" stroke-width="1.5"/>
<text x="200" y="472" font-size="25">Mₙ(ℂ)</text><text x="200" y="500" font-size="18">a finite matrix algebra</text>
<rect x="42" y="595" width="316" height="80" rx="10" fill="#e9f2f1" stroke="#146665" stroke-width="1.5"/>
<text x="200" y="627" font-size="25">eꜰ N eꜰ</text><text x="200" y="655" font-size="18">the same corner</text>
<rect x="42" y="750" width="316" height="80" rx="10" fill="#e9f2f1" stroke="#146665" stroke-width="1.5"/>
<text x="200" y="782" font-size="25">N</text><text x="200" y="810" font-size="18">the whole algebra</text>
<path d="M78 216 V276" stroke="#146665" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="229" y="238" font-size="20">x ↦ eꜰ x eꜰ</text><text x="229" y="263" font-size="17">normal cpc</text>
<path d="M78 371 V431" stroke="#146665" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="229" y="393" font-size="20">S</text><text x="229" y="418" font-size="17">normal cpc</text>
<path d="M78 526 V586" stroke="#146665" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="229" y="548" font-size="20">R</text><text x="229" y="573" font-size="17">cpc</text>
<path d="M78 681 V741" stroke="#146665" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="229" y="703" font-size="20">ιꜰ : corner inclusion</text><text x="229" y="728" font-size="17">cpc</text>
<text x="200" y="863" font-size="20" font-weight="bold">For every tested x and normal f</text>
<text x="200" y="896" font-size="19">|f(ιꜰ RS(eꜰ x eꜰ) − x)|</text>
<text x="200" y="927" font-size="18">≤ corner model error + compression error</text>
<text x="200" y="956" font-size="21">&lt; ε/2 + ε/2 = ε</text>
<text x="200" y="992" font-size="16">TC3–TC7 · finite-trace corner construction</text>
</g></svg>
