<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title description">
<title id="title">Exact trace transfers before equal dyadic splitting</title>
<desc id="description">Three original atom traces are 39 over 100, 34 over 100 and 27 over 100. Transfer 3 over 200 from the first and 1 over 50 from the third to the second. The adjusted traces are 3 over 8, 3 over 8 and 2 over 8. Split them into eight projections of trace 1 over 8. The moved projection has trace 7 over 200, and the simple-function error is at most twice its coefficient bound times the square root of this trace.</desc>
<defs>
<pattern id="move" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="6" height="6" fill="#fff3bb"/><path d="M0 0V6" stroke="#725400" stroke-width="2"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53420a"/></marker>
</defs>
<rect width="600" height="850" rx="16" fill="#faf9f5"/>
<g font-family="Arial, sans-serif" fill="#182a3a" font-size="22">
<text x="36" y="48" font-size="27" font-weight="bold">From spectral atoms to equal atoms</text>
<text x="36" y="82">Lemma 2.1 · exact diffuse trace cuts</text>

<text x="36" y="137" font-weight="bold">1. Start with the joint spectral partition</text>
<rect x="60" y="167" width="187.2" height="56" fill="#e2a9ae" stroke="#573037"/>
<rect x="247.2" y="167" width="163.2" height="56" fill="#a5ccb5" stroke="#244d39"/>
<rect x="410.4" y="167" width="129.6" height="56" fill="#a9c3e6" stroke="#264767"/>
<rect x="240" y="167" width="7.2" height="56" fill="url(#move)" stroke="#725400"/>
<rect x="410.4" y="167" width="9.6" height="56" fill="url(#move)" stroke="#725400"/>
<text x="113" y="203">p₁</text><text x="313" y="203">p₂</text><text x="461" y="203">p₃</text>
<text x="107" y="252">39/100</text><text x="283" y="252">34/100</text><text x="439" y="252">27/100</text>
<path d="M243.6 164Q267 140 295 164" fill="none" stroke="#725400" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M415.2 164Q393 140 371 164" fill="none" stroke="#725400" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="70" y="295">Move 3/200 from p₁ and 1/50 from p₃.</text>
<text x="70" y="329">Their sum goes to the deficit in p₂.</text>

<text x="36" y="387" font-weight="bold">2. Obtain the exact dyadic target traces</text>
<rect x="60" y="412" width="180" height="56" fill="#e2a9ae" stroke="#573037"/>
<rect x="240" y="412" width="180" height="56" fill="#a5ccb5" stroke="#244d39"/>
<rect x="420" y="412" width="120" height="56" fill="#a9c3e6" stroke="#264767"/>
<text x="128" y="448">p₁′</text><text x="308" y="448">p₂′</text><text x="457" y="448">p₃′</text>
<text x="128" y="498">3/8</text><text x="308" y="498">3/8</text><text x="458" y="498">2/8</text>

<text x="36" y="551" font-weight="bold">3. Split into q = 8 equal-trace pieces</text>
<g stroke="#243c50">
<rect x="60" y="576" width="60" height="56" fill="#e2a9ae"/><rect x="120" y="576" width="60" height="56" fill="#e2a9ae"/><rect x="180" y="576" width="60" height="56" fill="#e2a9ae"/>
<rect x="240" y="576" width="60" height="56" fill="#a5ccb5"/><rect x="300" y="576" width="60" height="56" fill="#a5ccb5"/><rect x="360" y="576" width="60" height="56" fill="#a5ccb5"/>
<rect x="420" y="576" width="60" height="56" fill="#a9c3e6"/><rect x="480" y="576" width="60" height="56" fill="#a9c3e6"/>
</g>
<text x="74" y="611">1/8</text><text x="134" y="611">1/8</text><text x="194" y="611">1/8</text><text x="254" y="611">1/8</text><text x="314" y="611">1/8</text><text x="374" y="611">1/8</text><text x="434" y="611">1/8</text><text x="494" y="611">1/8</text>

<rect x="36" y="670" width="528" height="147" rx="10" fill="#eaeef0"/>
<text x="56" y="705" font-weight="bold">Only the moved projection changes values</text>
<text x="56" y="740">T = 3/200 + 1/50 = 7/200.</text>
<text x="56" y="774">Error ≤ 2C√T; in general T ≤ ℓ/(2q).</text>
<text x="56" y="805" font-size="19">Bars show traces · DP1–DP2 give the full proof.</text>
</g>
</svg>
