<svg xmlns="http://www.w3.org/2000/svg" width="600" height="880" viewBox="0 0 600 880" role="img" aria-labelledby="title desc">
<title id="title">One binary cut reduces the energy of the whole tuple</title>
<desc id="desc">In a corner with identity e, p and r=e-p give four orthogonal GNS blocks of the direct-sum tuple Z. The off-diagonal blocks pZr and rZp are removed. Their squared norms equal the squared commutator norm, which is strictly larger than one sixteenth of the tuple energy. Every round reduces total normalized energy by at least fifteen sixteenths, with at most two children per corner.</desc>
<rect width="600" height="880" fill="#fafaf7"/>
<g font-family="Georgia,serif" font-size="26" fill="#202730">
<text x="30" y="42" font-family="Segoe UI,sans-serif" font-weight="600">Control the whole tuple</text>
<text x="30" y="83">Z = (z₁, …, z<tspan baseline-shift="sub" font-size="19">q</tspan>) in H<tspan baseline-shift="sub" font-size="19">φₑ</tspan><tspan baseline-shift="super" font-size="19">⊕q</tspan></text>
<text x="30" y="120">p + r = e,    pr = 0</text>
<rect x="30" y="146" width="260" height="112" rx="8" fill="#e0eee8" stroke="#477a68" stroke-width="2"/>
<rect x="310" y="146" width="260" height="112" rx="8" fill="#fae6dc" stroke="#b65c35" stroke-width="2"/>
<rect x="30" y="278" width="260" height="112" rx="8" fill="#fae6dc" stroke="#b65c35" stroke-width="2"/>
<rect x="310" y="278" width="260" height="112" rx="8" fill="#e0eee8" stroke="#477a68" stroke-width="2"/>
<text x="160" y="186" text-anchor="middle">pZp</text>
<text x="160" y="230" text-anchor="middle" font-family="Segoe UI,sans-serif">keep</text>
<text x="440" y="186" text-anchor="middle">pZr</text>
<text x="440" y="230" text-anchor="middle" font-family="Segoe UI,sans-serif">remove</text>
<text x="160" y="318" text-anchor="middle">rZp</text>
<text x="160" y="362" text-anchor="middle" font-family="Segoe UI,sans-serif">remove</text>
<text x="440" y="318" text-anchor="middle">rZr</text>
<text x="440" y="362" text-anchor="middle" font-family="Segoe UI,sans-serif">keep</text>
<text x="30" y="433">Lost energy = ‖pZr‖² + ‖rZp‖²</text>
<text x="30" y="472">= ‖[p,Z]‖² &gt; ‖Z‖² / 16</text>
<path d="M300 494 V530 M290 520 L300 530 L310 520" fill="none" stroke="#477a68" stroke-width="3"/>
<rect x="30" y="548" width="540" height="78" rx="8" fill="#e0eee8" stroke="#477a68" stroke-width="2"/>
<text x="300" y="595" text-anchor="middle">‖pZp + rZr‖² &lt; (15/16) ‖Z‖²</text>
<text x="30" y="675" font-family="Segoe UI,sans-serif" font-weight="600">Repeat in every current corner</text>
<text x="30" y="718">E(Q<tspan baseline-shift="sub" font-size="19">m</tspan>) ≤ (15/16)<tspan baseline-shift="super" font-size="19">m</tspan> q</text>
<text x="30" y="760">Number of atoms ≤ 2<tspan baseline-shift="super" font-size="19">m</tspan></text>
<text x="30" y="805" font-family="Segoe UI,sans-serif" font-size="22">Orthogonal GNS blocks; arbitrary dimensions.</text>
<text x="30" y="840" font-family="Segoe UI,sans-serif" font-size="22">Exact identities: Theorem 5.1, (BP1)–(BP3).</text>
</g></svg>
