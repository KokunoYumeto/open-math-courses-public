<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 815" role="img" aria-labelledby="title desc">
 <title id="title">Square coordinate projections reduce the complete balanced GNS graph</title>
 <desc id="desc">A schematic three by three Hilbert sum, with each column a full copy of its weight GNS space. The four coordinates in I times I, for I equal to {1,3}, are green. The closed involution exchanges coordinates 1,3 and 3,1. The square projection commutes with the closed involution and its adjoint on their complete domains, so its modular operator is the exact spectral restriction. No finite value of the weight at the corner unit is assumed.</desc>
 <metadata>Original vector diagram, GPT-6.1 Sol (OpenAI), Ultra, 2026-10-07. CC0-1.0 to the extent of rights held. Proof locators: OA-FLOW-BC, BC2, BC-GRAPH1 and BC-GRAPH2. This SVG is the reproducible editable source.</metadata>
 <rect width="600" height="815" rx="12" fill="#f8fbfc"/>
 <g font-family="Georgia,serif" fill="#173042">
  <text x="30" y="35" font-size="24" font-weight="bold">Balanced GNS graph: k=3, I={1,3}</text>
  <text x="30" y="65" font-size="20">Each cell is a full Hilbert space Hⱼ.</text>
  <g fill="#e0f4e7" stroke="#2c7452" stroke-width="2">
   <rect x="120" y="105" width="120" height="100"/>
   <rect x="360" y="105" width="120" height="100"/>
   <rect x="120" y="305" width="120" height="100"/>
   <rect x="360" y="305" width="120" height="100"/>
  </g>
  <g fill="#ffffff" stroke="#8a9aa4" stroke-width="1.5">
   <rect x="240" y="105" width="120" height="100"/>
   <rect x="120" y="205" width="120" height="100"/>
   <rect x="240" y="205" width="120" height="100"/>
   <rect x="360" y="205" width="120" height="100"/>
   <rect x="240" y="305" width="120" height="100"/>
  </g>
  <g text-anchor="middle" font-size="24">
   <text x="180" y="93">j=1</text><text x="300" y="93">j=2</text><text x="420" y="93">j=3</text>
   <text x="78" y="162">i=1</text><text x="78" y="262">i=2</text><text x="78" y="362">i=3</text>
   <text x="180" y="162">H₁</text><text x="300" y="162">H₂</text>
   <text x="420" y="145">H₃</text><text x="420" y="180">Λ₃(x)</text>
   <text x="180" y="262">H₁</text><text x="300" y="262">H₂</text><text x="420" y="262">H₃</text>
   <text x="180" y="345">H₁</text><text x="180" y="380">Λ₁(x*)</text>
   <text x="300" y="362">H₂</text><text x="420" y="362">H₃</text>
  </g>
  <text x="30" y="450" font-size="23">Q<tspan baseline-shift="sub" font-size="17">I</tspan> retains the four green cells.</text>
  <text x="30" y="484" font-size="24">Q<tspan baseline-shift="sub" font-size="17">I</tspan> = (P₁ + P₃)(R₁ + R₃)</text>
  <rect x="30" y="508" width="540" height="114" rx="10" fill="#eaf1f8"/>
  <text x="58" y="545" font-size="24">Λ₃(x)</text><text x="280" y="534" font-size="22">S</text>
  <path d="M185 548 H367" fill="none" stroke="#315b83" stroke-width="3"/>
  <path d="M357 540 L369 548 L357 556" fill="none" stroke="#315b83" stroke-width="3"/>
  <text x="410" y="555" font-size="24">Λ₁(x*)</text>
  <text x="48" y="591" font-size="20">x ∈ N₃ ∩ N₁*; take the full graph closure.</text>
  <text x="30" y="662" font-size="24">S Q<tspan baseline-shift="sub" font-size="17">I</tspan> = Q<tspan baseline-shift="sub" font-size="17">I</tspan> S on D(S)</text>
  <text x="30" y="697" font-size="24">S* Q<tspan baseline-shift="sub" font-size="17">I</tspan> = Q<tspan baseline-shift="sub" font-size="17">I</tspan> S* on D(S*)</text>
  <text x="30" y="739" font-size="22">Δ_corner = Δ restricted to Q<tspan baseline-shift="sub" font-size="17">I</tspan> H_Θ</text>
  <text x="30" y="770" font-size="21">All spectral domains are retained.</text>
  <text x="30" y="799" font-size="21">No condition Θ(p<tspan baseline-shift="sub" font-size="17">I</tspan>) &lt; ∞ is used.</text>
 </g>
</svg>
