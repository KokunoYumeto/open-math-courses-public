<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Higher-jet Spin conditions depend on the actual isotropy weights</title>
<desc id="desc">For dimension two and jet order two, the vertical tangent has positive weights 1 twice, 2 once and 3 once, with one fixed axis. The weight sum seven gives a nontrivial Spin endpoint. For jet order four it has weights 1 four times, 2 three times, 3 three times, 4 once and 5 once, with three fixed axes. Their sum twenty-eight gives a trivial Spin endpoint. Circles show one representative rotation plane at parameter t=pi/3, with coordinates cosine and sine of w times t. Multiplicities account for every plane. The fourth-order vertical rank is twenty-seven, so a trivial fixed line makes an even-rank Spin transfer of rank twenty-eight.</desc>
<metadata>Original CC0. Exact representation S^2(R^2) plus direct sum j=2..k of R^2 tensor S^j(R^2). Proof locators: Proposition 13.16, Figure 13.5 and Exercise 7.25 in the higher-frame lesson. Human sources: Connes 1986 Theorem 7.15; Bott 1976 section 3 for higher frames; Spin covering-loop fact already bound in the transverse lesson. Numerical angular positions render the explicitly stated exact cosine/sine sample; they are not a generic picture of a jet fiber.</metadata>
<style>text{font-family:Georgia,"DejaVu Serif",serif;fill:#18324a}.head{font-size:25px;font-weight:bold}.math{font-size:25px}.small{font-size:22px}</style>
<rect width="1200" height="980" fill="white"/>
<text x="28" y="43" class="head">The actual vertical SO(2) loop, before choosing a transfer</text>
<text x="28" y="86" class="small">Circle sample: t = π/3, point (cos(wt), sin(wt)); a weight-w lift ends at (−1)^w.</text>
<rect x="25" y="119" width="550" height="619" rx="12" fill="#edf4fb"/>
<text x="47" y="161" class="head">Dimension n = 2, jet order k = 2</text>
<text x="47" y="199" class="small">Each plane rotates by R(wt), 0 ≤ t ≤ 2π.</text>
