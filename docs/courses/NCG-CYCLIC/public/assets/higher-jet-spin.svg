<text x="732" y="481" class="small">w = 4    multiplicity 1    lift: +1</text>
<circle cx="684" cy="549" r="26" fill="white" stroke="#315c81" stroke-width="2"/>
<path d="M654 549H714M684 519V579" stroke="#c8d3dc"/>
<path d="M684 549L697.0000000 571.5166605" stroke="#ad4d39" stroke-width="2.5"/>
<circle cx="697.0000000" cy="571.5166605" r="4" fill="#ad4d39"/>
<text x="732" y="557" class="small">w = 5    multiplicity 1    lift: −1</text>
<text x="647" y="651" class="small">Fixed axes: 3. Vertical rank: 27.</text>
<text x="647" y="691" class="math">Total weight = 28; Spin endpoint = +1.</text>
<text x="647" y="723" class="small">The generating loop permits a Spin lift.</text>
<rect x="25" y="764" width="1150" height="147" rx="12" fill="#fff3e6"/>
<text x="48" y="807" class="math">Order four repairs Spin, while its vertical rank 27 is still odd.</text>
<text x="48" y="849" class="math">Add a trivial fixed real line: rank 28, the same Spin loop endpoint +1.</text>
<text x="48" y="890" class="small">The characteristic form pulls back; its original codimension and normalization stay fixed.</text>
<text x="28" y="953" class="small">13.16, Exercise 7.25: exact weights, ranks and covering-loop criterion; the transfer uses the auxiliary tower.</text>
</svg>