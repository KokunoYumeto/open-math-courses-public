<circle cx="97.0000000" cy="222.4833395" r="4" fill="#ad4d39"/>
<text x="132" y="253" class="small">w = 1    multiplicity 2    lift: −1</text>
<circle cx="84" cy="321" r="26" fill="white" stroke="#315c81" stroke-width="2"/>
<path d="M54 321H114M84 291V351" stroke="#c8d3dc"/>
<path d="M84 321L71.0000000 298.4833395" stroke="#ad4d39" stroke-width="2.5"/>
<circle cx="71.0000000" cy="298.4833395" r="4" fill="#ad4d39"/>
<text x="132" y="329" class="small">w = 2    multiplicity 1    lift: +1</text>
<circle cx="84" cy="397" r="26" fill="white" stroke="#315c81" stroke-width="2"/>
<path d="M54 397H114M84 367V427" stroke="#c8d3dc"/>
<path d="M84 397L58.0000000 397.0000000" stroke="#ad4d39" stroke-width="2.5"/>
<circle cx="58.0000000" cy="397.0000000" r="4" fill="#ad4d39"/>
<text x="132" y="405" class="small">w = 3    multiplicity 1    lift: −1</text>
<text x="132" y="481" class="small">w = 4    multiplicity 0    lift: +1</text>
<text x="132" y="557" class="small">w = 5    multiplicity 0    lift: −1</text>
<text x="47" y="651" class="small">Fixed axes: 1. Vertical rank: 9.</text>
<text x="47" y="691" class="math">Total weight = 7; Spin endpoint = −1.</text>
<text x="47" y="723" class="small">The generating loop obstructs a Spin lift.</text><rect x="625" y="119" width="550" height="619" rx="12" fill="#eef7ef"/>
<text x="647" y="161" class="head">Dimension n = 2, jet order k = 4</text>
<text x="647" y="199" class="small">Each plane rotates by R(wt), 0 ≤ t ≤ 2π.</text>
<circle cx="684" cy="245" r="26" fill="white" stroke="#315c81" stroke-width="2"/>
