<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc"><title id="title">Compact support, unbounded rank and locally finite duality</title><desc id="desc">Exact weights one through four have projection pairing ten and projection norm one. The two-trace bound fixes compact differential support and includes both external scalar coefficient terms. Finite-support cochains are dual to arbitrary locally finite simplex coefficients; transpose boundary and algebraic extension give locally finite homology as the algebraic dual of compact-support cohomology. The oriented integer line has a closed coefficient-one locally finite chain which pairs to one with a single edge; finite one-cycles are zero. Proof locators: n-traces Propositions 7.4 and 7.7, Lemmas 7.6 and 7.8, Corollary 7.9, Examples 7.5 and 7.10, Exercises 9.7 and 9.8. Topological finite-pair character foundations: Atiyah and Hirzebruch, Vector bundles and homogeneous spaces (1961), Sections 1.4 and 1.10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#33718c"/></marker></defs><rect width="1200" height="1150" fill="#f4f8fa"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="42" y="46" font-size="29" fill="#18384d" font-weight="bold">Compact support, unbounded rank and locally finite duality</text>
<text x="42" y="82" font-size="22" fill="#18384d" font-weight="normal">Exact examples and spaces; no global summability is imposed.</text>
<rect x="35" y="105" width="1130" height="315" rx="12" fill="white" stroke="#bed0db"/>
<text x="60" y="143" font-size="23" fill="#18384d" font-weight="bold">A. Weighted rank — Proposition 7.4, Example 7.5, Exercise 9.7</text>
<circle cx="105" cy="215" r="23" fill="#dfede5" stroke="#397151" stroke-width="2"/>
<text x="99" y="222" font-size="22" fill="#18384d" font-weight="bold">1</text>
<text x="85" y="266" font-size="20" fill="#18384d" font-weight="normal">w=1</text>
<circle cx="225" cy="215" r="23" fill="#dfede5" stroke="#397151" stroke-width="2"/>
<text x="219" y="222" font-size="22" fill="#18384d" font-weight="bold">2</text>
<text x="205" y="266" font-size="20" fill="#18384d" font-weight="normal">w=2</text>
<circle cx="345" cy="215" r="23" fill="#dfede5" stroke="#397151" stroke-width="2"/>
<text x="339" y="222" font-size="22" fill="#18384d" font-weight="bold">3</text>
<text x="325" y="266" font-size="20" fill="#18384d" font-weight="normal">w=3</text>
<circle cx="465" cy="215" r="23" fill="#dfede5" stroke="#397151" stroke-width="2"/>
<text x="459" y="222" font-size="22" fill="#18384d" font-weight="bold">4</text>
<text x="445" y="266" font-size="20" fill="#18384d" font-weight="normal">w=4</text>
<text x="550" y="220" font-size="23" fill="#18384d" font-weight="bold">P₄ = 1 on these four points</text>
<text x="550" y="262" font-size="21" fill="#18384d" font-weight="normal">‖P₄‖∞ = 1 ; J[P₄] = 1+2+3+4 = 10</text>
<text x="65" y="307" font-size="21" fill="#18384d" font-weight="normal">τ(a₀,a₁,a₂) = Σⱼ wⱼ a₀(j)a₁(j)a₂(j), on finite-support sequences.</text>
<text x="65" y="346" font-size="21" fill="#18384d" font-weight="normal">T(a,b;x,y) = ν Σⱼwⱼx₀(j)a(j)b(j) − λ Σⱼwⱼa(j)y₀(j)b(j).</text>
<text x="65" y="388" font-size="20" fill="#18384d" font-weight="normal">C(a,b)=Σⱼ|wⱼa(j)b(j)| is finite on the fixed support; Σⱼ|wⱼ| may diverge.</text>
<rect x="35" y="440" width="1130" height="295" rx="12" fill="white" stroke="#bed0db"/>
<text x="60" y="478" font-size="23" fill="#18384d" font-weight="bold">B. The algebraic dual — Lemma 7.8, Corollary 7.9</text>
<text x="65" y="527" font-size="25" fill="#18384d" font-weight="bold">Cᵖ_c = ⊕ₛ ℂ</text>
<path d="M280,520 L475,520" fill="none" stroke="#33718c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="318" y="503" font-size="20" fill="#18384d" font-weight="normal">dual</text>
<text x="495" y="527" font-size="25" fill="#18384d" font-weight="bold">Cˡᶠ_p = ∏ₛ ℂ</text>
<text x="790" y="527" font-size="22" fill="#18384d" font-weight="normal">⟨c,a⟩ = Σₛ cₛ aₛ</text>
<text x="65" y="569" font-size="21" fill="#18384d" font-weight="normal">Only a has finite support. Every displayed pairing is a finite sum.</text>
<text x="65" y="611" font-size="23" fill="#18384d" font-weight="normal">δ : Cᵖ_c → Cᵖ⁺¹_c</text>
<text x="570" y="611" font-size="23" fill="#18384d" font-weight="normal">∂ = δ* : Cˡᶠ_p+1 → Cˡᶠ_p</text>
<text x="65" y="650" font-size="20" fill="#18384d" font-weight="normal">Closed chains annihilate coboundaries; boundaries annihilate closed cochains.</text>
<text x="65" y="691" font-size="23" fill="#18384d" font-weight="bold">Hˡᶠ_p ≅ Homℂ(Hᵖ_c, ℂ). A basis extension proves both directions.</text>
<rect x="35" y="755" width="1130" height="275" rx="12" fill="white" stroke="#bed0db"/>
<text x="60" y="793" font-size="23" fill="#18384d" font-weight="bold">C. The whole oriented integer line — Example 7.10, Exercise 9.8</text>
<circle cx="175" cy="868" r="6" fill="#18384d"/>
<text x="163" y="902" font-size="20" fill="#18384d" font-weight="normal">-2</text>
<circle cx="335" cy="868" r="6" fill="#18384d"/>
<text x="323" y="902" font-size="20" fill="#18384d" font-weight="normal">-1</text>
<circle cx="495" cy="868" r="6" fill="#18384d"/>
<text x="483" y="902" font-size="20" fill="#18384d" font-weight="normal">0</text>
<circle cx="655" cy="868" r="6" fill="#18384d"/>
<text x="643" y="902" font-size="20" fill="#18384d" font-weight="normal">1</text>
<circle cx="815" cy="868" r="6" fill="#18384d"/>
<text x="803" y="902" font-size="20" fill="#18384d" font-weight="normal">2</text>
<path d="M184,868 L320,868" fill="none" stroke="#33718c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="243" y="850" font-size="20" fill="#356d57" font-weight="bold">1</text>
<path d="M344,868 L480,868" fill="none" stroke="#33718c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="403" y="850" font-size="20" fill="#356d57" font-weight="bold">1</text>
<path d="M495,868 L640,868" stroke="#b06d1b" stroke-width="6" marker-end="url(#arrow)"/>
<text x="563" y="850" font-size="20" fill="#356d57" font-weight="bold">1</text>
<path d="M664,868 L800,868" fill="none" stroke="#33718c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="723" y="850" font-size="20" fill="#356d57" font-weight="bold">1</text>
<path d="M80,868 L153,868" fill="none" stroke="#33718c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M827,868 L930,868" fill="none" stroke="#33718c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="100" y="836" font-size="25" fill="#18384d" font-weight="normal">…</text>
<text x="937" y="875" font-size="25" fill="#18384d" font-weight="normal">…</text>
<text x="977" y="871" font-size="21" fill="#996018" font-weight="normal">b(e₀)=1</text>
<text x="65" y="945" font-size="21" fill="#18384d" font-weight="normal">c=Σₖ[k,k+1] : ∂c=0 ; ⟨c,b⟩=1. All edge coefficients of c are one.</text>
<text x="65" y="990" font-size="22" fill="#18384d" font-weight="normal">H¹_c ≅ ℂ, by total sum. Finite one-cycles vanish; H₀ˡᶠ=H⁰_c=0.</text>
<text x="42" y="1068" font-size="19" fill="#18384d" font-weight="normal">Finite-pair character: Proposition 7.7, with scalar Bott and exact pair foundations.</text>
<text x="42" y="1104" font-size="18" fill="#18384d" font-weight="normal">Atiyah–Hirzebruch (1961), §§1.4/1.10. Positive-degree differential-form comparison is separate.</text>
</g></svg>