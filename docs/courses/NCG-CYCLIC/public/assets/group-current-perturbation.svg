<text x="590" y="675" class="small" text-anchor="middle">f(1 + BH)⁻¹</text>
<text x="684" y="695" class="math" text-anchor="start">Tot X</text>
<path d="M777 688 L886 688" fill="none" stroke="#245c80" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="831" y="675" class="small" text-anchor="middle">π = ε ⊗ α</text>
<text x="910" y="695" class="math" text-anchor="start">L, (bᴸ,Bᴸ)</text>
<text x="74" y="746" class="math" text-anchor="start">Fⱼ = (−1)ʲ π f(BH)ʲ μ⁻¹Pₑ : Cₙ → Lₙ₊₂ⱼ.</text>
<text x="74" y="788" class="body" text-anchor="start">Input cyclic column r permits only 0 ≤ j ≤ r; output column is r − j.</text>
<text x="74" y="822" class="small" text-anchor="start">The transferred differential is identified after π; its higher terms need not vanish before π.</text>
<rect x="35" y="864" width="1130" height="189" rx="14" class="panel"/>
<text x="60" y="906" class="heading" text-anchor="start">D. Transposing gives the group-current cochain map</text>
<text x="74" y="950" class="math" text-anchor="start">BᴸFⱼ − FⱼB + bᴸFⱼ₊₁ − Fⱼ₊₁b = 0.</text>
<text x="74" y="992" class="body" text-anchor="start">Fⱼ* changes raw current degree m to m − 2j and adds j cyclic columns.</text>
<text x="74" y="1030" class="small" text-anchor="start">Relative compact supports and smooth current continuity are preserved by every finite formula.</text>
<text x="43" y="1095" class="small" text-anchor="start">Proof: (13.90)–(13.97). Model method: Dold–Puppe §2; perturbation context: Khalkhali–Rangipour §3.</text>
