<text x="705" y="285" class="small" text-anchor="start">B: (2,3)</text>
<text x="873" y="194" class="small" text-anchor="start">r + s = 7</text>
<text x="630" y="500" class="body" text-anchor="start">Survival requires r ≤ 2 and s ≤ 3.</text>
<text x="630" y="536" class="body" text-anchor="start">Higher term j = 1 has r + s = 7 &gt; 5.</text>
<text x="630" y="565" class="small" text-anchor="start">Only the first transfer survives: Bᴸ = (−1)ᵖd.</text>
<rect x="35" y="602" width="1130" height="241" rx="14" class="panel"/>
