<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Recursive cone homotopy and the projected cyclic comparison</title>
<desc id="desc">The normalized degree-one cone is the negative triangle with vertices (0,0),(0,1),(1,1); its boundary is the diagonal minus the two shuffle edges. For p=q=2 the admissible input-variable region r at most 2 and s at most 3 contains the surviving B output (2,3), but has no point on the first higher transferred degree r+s=7. The full cyclic map has F_j=(-1)^j pi f(BH)^j mu inverse P_e, with only j at most the input column contributing. Exact proofs are Lemma 13.26 and Theorem 13.27, equations 13.90 through 13.97.</desc>
<metadata>Original CC0 diagram; reproducible source tools/draw_group_current_perturbation.py. Proof locators: public/src/gelfand-fuks-cohomology-and-the-godbillon-vey-invariant.md Lemma 13.26 and Theorem 13.27, equations 13.90-13.97; Exercise 7.31. Human references: Dold and Puppe, Homologie nicht-additiver Funktoren. Anwendungen, Annales de l'Institut Fourier 11 (1961), 201-312, DOI 10.5802/aif.114, Section 2; Khalkhali and Rangipour, On the Generalized Cyclic Eilenberg-Zilber Theorem, Canadian Mathematical Bulletin 47 (2004), 38-48, DOI 10.4153/CMB-2004-006-X, Section 3. Model-index schematic with exact integer coordinates; no metric or section of V is asserted.</metadata>
