<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1140" viewBox="0 0 1680 1140">
<rect width="1680" height="1140" fill="#f7f7f2"/>
<text x="45" y="65" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="40" font-weight="700" fill="#173245">The nonunital index: take the exact scalar kernels</text>
<text x="45" y="111" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="25" font-weight="400" fill="#173245">All n ≥ 1; A⁺ is the external coefficient unitization. Three exact symbol rows.</text>
<text x="45" y="166" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">Unitalized coefficient calculus</text>
<rect x="70" y="185" width="445" height="128" rx="16" fill="#e5edfa" stroke="#456171" stroke-width="2"/>
<text x="93" y="236" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">B(A⁺)</text>
<text x="93" y="282" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">A⁺ ⋊ ℝⁿ</text>
<rect x="615" y="185" width="445" height="128" rx="16" fill="#e5edfa" stroke="#456171" stroke-width="2"/>
<text x="638" y="236" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">E(A⁺)</text>
<text x="638" y="282" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">Completed order-zero calculus</text>
<rect x="1160" y="185" width="445" height="128" rx="16" fill="#e5edfa" stroke="#456171" stroke-width="2"/>
<text x="1183" y="236" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">C(Sⁿ⁻¹,A⁺)</text>
<text x="1183" y="282" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">Principal symbols</text>
<path d="M530,250 L600,250" stroke="#375666" stroke-width="4"/>
<polygon points="600,250 586,240 586,260" fill="#375666"/>
<path d="M1075,250 L1145,250" stroke="#375666" stroke-width="4"/>
<polygon points="1145,250 1131,240 1131,260" fill="#375666"/>
<text x="23" y="257" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">0</text>
<path d="M43,250 L60,250" stroke="#375666" stroke-width="4"/>
<polygon points="60,250 46,240 46,260" fill="#375666"/>
<path d="M1620,250 L1640,250" stroke="#375666" stroke-width="4"/>
<polygon points="1640,250 1626,240 1626,260" fill="#375666"/>
<text x="1645" y="257" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">0</text>
<path d="M250,330 L250,507" stroke="#375666" stroke-width="4"/>
<polygon points="250,507 240,493 260,493" fill="#375666"/>
<path d="M322,507 L322,330" stroke="#368261" stroke-width="4"/>
<polygon points="322,330 312,344 332,344" fill="#368261"/>
<text x="125" y="393" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">q_B</text>
<text x="340" y="432" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">s_B</text>
<path d="M795,330 L795,507" stroke="#375666" stroke-width="4"/>
<polygon points="795,507 785,493 805,493" fill="#375666"/>
<path d="M867,507 L867,330" stroke="#368261" stroke-width="4"/>
<polygon points="867,330 857,344 877,344" fill="#368261"/>
<text x="670" y="393" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">q_E</text>
<text x="885" y="432" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">s_E</text>
<path d="M1340,330 L1340,507" stroke="#375666" stroke-width="4"/>
<polygon points="1340,507 1330,493 1350,493" fill="#375666"/>
<path d="M1412,507 L1412,330" stroke="#368261" stroke-width="4"/>
<polygon points="1412,330 1402,344 1422,344" fill="#368261"/>
<text x="1215" y="393" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">q_S</text>
<text x="1430" y="432" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">s_S</text>
<rect x="70" y="517" width="445" height="128" rx="16" fill="#fff0d9" stroke="#456171" stroke-width="2"/>
<text x="93" y="568" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">B(ℂ)</text>
<text x="93" y="614" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">C*(ℝⁿ) = C₀(ℝⁿ)</text>
<rect x="615" y="517" width="445" height="128" rx="16" fill="#fff0d9" stroke="#456171" stroke-width="2"/>
<text x="638" y="568" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">E(ℂ)</text>
<text x="638" y="614" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">C(Xₙ), radial compactification</text>
<rect x="1160" y="517" width="445" height="128" rx="16" fill="#fff0d9" stroke="#456171" stroke-width="2"/>
<text x="1183" y="568" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">C(Sⁿ⁻¹)</text>
<text x="1183" y="614" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">Scalar principal symbols</text>
<path d="M530,582 L600,582" stroke="#375666" stroke-width="4"/>
<polygon points="600,582 586,572 586,592" fill="#375666"/>
<path d="M1075,582 L1145,582" stroke="#375666" stroke-width="4"/>
<polygon points="1145,582 1131,572 1131,592" fill="#375666"/>
<text x="23" y="589" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">0</text>
<path d="M43,582 L60,582" stroke="#375666" stroke-width="4"/>
<polygon points="60,582 46,572 46,592" fill="#375666"/>
<path d="M1620,582 L1640,582" stroke="#375666" stroke-width="4"/>
<polygon points="1640,582 1626,572 1626,592" fill="#375666"/>
<text x="1645" y="589" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">0</text>
<text x="45" y="701" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="700" fill="#173245">Take the kernels of q_B, q_E, q_S: the coefficient-A row</text>
<rect x="70" y="727" width="445" height="128" rx="16" fill="#e1f0e7" stroke="#456171" stroke-width="2"/>
<text x="93" y="778" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">B(A) = ker q_B</text>
<text x="93" y="824" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">(7.U3): split ideal sequence</text>
<rect x="615" y="727" width="445" height="128" rx="16" fill="#e1f0e7" stroke="#456171" stroke-width="2"/>
<text x="638" y="778" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">E(A) = ker q_E</text>
<text x="638" y="824" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">Step 2: actual A-symbol closure</text>
<rect x="1160" y="727" width="445" height="128" rx="16" fill="#e1f0e7" stroke="#456171" stroke-width="2"/>
<text x="1183" y="778" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="31" font-weight="700" fill="#173245">C(Sⁿ⁻¹,A) = ker q_S</text>
<text x="1183" y="824" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">(7.U5): lift, then subtract s_B(c)</text>
<path d="M530,792 L600,792" stroke="#375666" stroke-width="4"/>
<polygon points="600,792 586,782 586,802" fill="#375666"/>
<path d="M1075,792 L1145,792" stroke="#375666" stroke-width="4"/>
<polygon points="1145,792 1131,782 1131,802" fill="#375666"/>
<text x="23" y="799" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">0</text>
<path d="M43,792 L60,792" stroke="#375666" stroke-width="4"/>
<polygon points="60,792 46,782 46,802" fill="#375666"/>
<path d="M1620,792 L1640,792" stroke="#375666" stroke-width="4"/>
<polygon points="1640,792 1626,782 1626,802" fill="#375666"/>
<text x="1645" y="799" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">0</text>
<text x="45" y="925" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="26" font-weight="700" fill="#173245">Step 3: E(A) restricts faithfully into M(B(A)).  Step 4: K-theory ideal maps are injective.</text>
<text x="45" y="975" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="27" font-weight="400" fill="#173245">i_B* ∂A[u] = Φ(A⁺) Ψ(A⁺)⁻¹ i_S* red[u] = i_B* Φ(A) Ψ(A)⁻¹ red[u]</text>
<text x="45" y="1020" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="26" font-weight="400" fill="#173245">Cancel i_B*: the same ordered index identity holds in K₀(B(A)). Proof: (7.U6)–(7.U7).</text>
<text x="45" y="1082" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">Original diagram. Proof: Theorem 7.3a, steps 1–4, (7.U1)–(7.U7).</text>
<text x="45" y="1116" font-family="Segoe UI Symbol,Arial,sans-serif" font-size="24" font-weight="400" fill="#173245">Human context: Connes, C*-algebras and Differential Geometry, author English edition p.7.</text>
</svg>
