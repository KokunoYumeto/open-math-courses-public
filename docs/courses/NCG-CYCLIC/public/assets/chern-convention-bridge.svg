<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">One projection, two Chern characters</title>
<desc id="desc">The tautological planar projection has curvature integral two pi i, cyclic integral plus one, and geometric integral minus one. The geometric numerical map is minus the cyclic map in dimension two. The outward normal generator equals the cyclic generator and minus the positive geometric generator.</desc>
<rect width="1040" height="560" fill="#f7f9fc"/>
<style>text{font-family:Georgia,serif;fill:#18263b}.h{font-size:27px;font-weight:bold}.s{font-size:23px}.m{font-size:25px}.k{font-size:21px;fill:#42556b}</style>
<text x="34" y="43" class="h">One projection, two Chern characters</text>
<text x="34" y="77" class="k">Complex orientation dx ∧ dy; z = x + iy; q spans (z, 1).</text>
<rect x="30" y="98" width="980" height="126" rx="12" fill="#ffffff" stroke="#b8c8d9"/>
<text x="55" y="149" class="m">q(z) = (1 + |z|²)⁻¹</text>
<text x="305" y="134" class="m">[ |z|²    z ]</text>
<text x="305" y="169" class="m">[ z̄        1 ]</text>
<text x="585" y="135" class="m">Θ = Tr(q dq ∧ dq)</text>
<text x="585" y="174" class="s">= 2i dx ∧ dy / (1 + x² + y²)²</text>
<text x="55" y="206" class="k">The same column connection q d is used in both conventions.</text>
<rect x="30" y="244" width="470" height="145" rx="12" fill="#e7f1fc" stroke="#b8c8d9"/>
<rect x="540" y="244" width="470" height="145" rx="12" fill="#f5e9ee" stroke="#b8c8d9"/>
<text x="53" y="280" class="h">Cyclic character</text>
<text x="563" y="280" class="h">Geometric character</text>
<text x="53" y="319" class="m">ch₂,cyc(q) = Θ / (2πi)</text>
<text x="563" y="319" class="m">ch₂,geom(q) = −Θ / (2πi)</text>
<text x="53" y="365" class="m">∫ ch₂,cyc(q) = +1</text>
<text x="563" y="365" class="m">∫ ch₂,geom(q) = −1</text>
<text x="511" y="329" class="h">−</text>
<rect x="30" y="409" width="980" height="102" rx="12" fill="#ffffff" stroke="#b8c8d9"/>
<text x="54" y="447" class="m">φ₀(q) = −Fcyc(q) = −1;     φ̂₀(q) = Fcyc(q) = +1</text>
<text x="54" y="487" class="m">On the plane: [q] − [p] = b₂,cyc = κ₂ = −b₂,geom</text>
<text x="34" y="542" class="k">Geometric lesson (8.1a), (8.22a–b), Lemma 7.3; transverse (8.6a), Exercise 9.5.</text>
</svg>
