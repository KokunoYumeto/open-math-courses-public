<title id="title">A small crossed-product norm and an unbounded leading-slot functional</title>
<desc id="desc">Example 10.2. The first operator has a normalized column with N shifted Fourier entries. A fixed trace-class row sums its coefficients with weights j to the power minus three quarters. Their ratio is bounded below by c_h divided by C_h times N to the power one quarter. The plot shows this proved normalized lower bound on a logarithmic N axis, not computed operator norms.</desc>
<metadata>Course 6, Example 10.2. Original reproducible diagram, CC0.</metadata>
<style>text{font-family:Georgia,"DejaVu Serif",serif;fill:#17324a} .label{font-size:23px}.small{font-size:20px}.head{font-size:27px;font-weight:bold}.math{font-size:26px}.axis{stroke:#60778a;stroke-width:2}.grid{stroke:#dce5ec;stroke-width:1}</style>
<rect width="1200" height="760" fill="#fff"/>
<text x="36" y="45" class="head">The two operations in the domain counterexample</text>
<rect x="25" y="70" width="560" height="245" rx="14" fill="#eef4fb"/>
<rect x="615" y="70" width="560" height="245" rx="14" fill="#fff3e7"/>
<text x="45" y="110" class="head">Crossed-product norm</text>
<text x="45" y="150" class="label">b_N = |v_N⟩⟨e₀|,   v_N = N⁻¹⁄² Σⱼ₌₁ᴺ eⱼ</text>
<text x="45" y="190" class="small">At frequency ξ, row j carries ĥ(ξ + j)/√N.</text>
<text x="45" y="225" class="small">Square, sum the rows, then take sup over ξ.</text>
<text x="45" y="280" class="math">‖f_N‖ ≤ C_h / √N</text>
<text x="635" y="110" class="head">Fixed one-trace kernel</text>
<text x="635" y="150" class="label">c = |e₀⟩⟨w|,   wⱼ = j⁻³⁄⁴,   w ∈ ℓ²</text>
<text x="635" y="190" class="small">g(t) = h(−t)c is fixed as N varies.</text>
<text x="635" y="225" class="small">The pairing adds the weighted column entries.</text>
<text x="635" y="280" class="math">ψ̂(f_N,g) ≥ c_h N⁻¹⁄⁴</text>
<text x="35" y="355" class="label">R_N = |ψ̂(f_N,g)| / ‖f_N‖,   c_h = ∫ h² &gt; 0</text>
<text x="35" y="392" class="label">C_h² = sup_ξ Σⱼ≥₁ |ĥ(ξ + j)|² &lt; ∞</text>
<text x="35" y="455" class="head">Proved lower bound</text>
<text x="35" y="499" class="math">R_N / (c_h/C_h) ≥ N¹⁄⁴</text>
<text x="35" y="548" class="small">The curve is the bound,</text>
<text x="35" y="580" class="small">not measured norm values.</text>
<text x="35" y="639" class="small">The column changes with N;</text>
<text x="35" y="671" class="small">the test kernel stays fixed.</text>

