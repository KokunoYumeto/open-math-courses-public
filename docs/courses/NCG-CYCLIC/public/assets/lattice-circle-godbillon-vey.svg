<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">A compact hyperbolic circle cycle detects the included Dolbeault index</title>
<desc id="desc">Exact unit-disk geodesics from zero and i over three have common ideal endpoint one. The second ray is an arc of the circle with center one plus five i over three and radius five over three, orthogonal to the unit circle. A boundary endpoint identifies a unit tangent. Quotienting by a torsion-free cocompact lattice gives the unit tangent circle bundle of a closed hyperbolic surface. The constant-endpoint foliation has defining form b plus k, connection a, and Godbillon-Vey form minus a wedge b wedge k. The compact cycle maps to the surface Dolbeault index included in the circle crossed product, with numerical value four pi squared times the Euler characteristic.</desc>
<metadata>Original CC0. Exact circle center (1,5/3), radius 5/3; base points (0,0),(0,1/3), endpoint (1,0). Propositions 13.9 and Corollary 13.10. Human source: Connes 1986 Corollary 7.13. Numerical SVG samples approximate only the rendering of the exact arc.</metadata>
