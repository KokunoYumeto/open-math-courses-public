<text x="240" y="362" class="math">0</text>
<text x="209" y="258" class="math">i/3</text>
<text x="435" y="366" class="math">ξ = 1</text>
<text x="47" y="556" class="small">Arc center 1 + 5i/3; radius 5/3.</text>
<text x="47" y="591" class="small">Both rays end at the same boundary point.</text>
<rect x="584" y="75" width="592" height="540" rx="12" fill="#eef7ef"/>
<text x="608" y="116" class="head">The lattice quotient and its cycle</text>
<text x="608" y="167" class="math">ℍ × ∂ℍ → S(Tℍ),  (z, ξ) ↦ vξ(z)</text>
<text x="608" y="214" class="small">Equivariant for Λ ⊂ PSL(2, ℝ).</text>
<path d="M881 230L881 274" class="arrow" marker-end="url(#arrow)"/>
<text x="608" y="317" class="math">N = (ℍ × ∂ℍ)/Λ = S(TΣ)</text>
<text x="608" y="364" class="math">p: N → Σ = Λ ∖ ℍ</text>
<text x="608" y="411" class="small">Orientation: surface, then tangent circle.</text>
<text x="608" y="458" class="math">w = b + k,  dw = a ∧ w</text>
<text x="608" y="505" class="math">GV = a ∧ da = −a ∧ b ∧ k</text>
<text x="608" y="552" class="small">∫fiber k = 2π;  a ∧ b = p*dAhyp.</text>
<text x="608" y="594" class="small">The positive volume is a ∧ b ∧ k.</text>
<rect x="24" y="642" width="1152" height="235" rx="12" fill="#fff3e6"/>
<text x="47" y="687" class="head">The actual included index and its nonzero numerical value</text>
<text x="47" y="736" class="math">e = IndΛ(∂̄ℍ),  i: C*r(Λ) → C(∂ℍ) ⋊r Λ,  μ(x) = i*e</text>
<text x="47" y="785" class="math">𝔉(i*e) = ∫N GV = −2π Area(Σ) = 4π²χ(Σ) ≠ 0</text>
<text x="47" y="836" class="small">Thus i*e has infinite order. For genus three: −16π²; raw value 8πi.</text>
<text x="28" y="911" class="small">Proof: (13.28)–(13.39). Connes 1986, Corollary 7.13. Arc is exact geometry, drawn numerically.</text>
