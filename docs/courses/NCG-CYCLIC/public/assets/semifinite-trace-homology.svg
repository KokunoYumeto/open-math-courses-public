<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1020" viewBox="0 0 1680 1020">
<rect width="1680" height="1020" fill="#f7f7f2"/>
<text x="45" y="71" font-size="41" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="700" fill="#173245">Trace homology: exact domains and scaling signs</text>
<rect x="45" y="132" width="475" height="253" rx="15" fill="#e5edfa" stroke="#456171" stroke-width="2"/>
<text x="65" y="181" font-size="29" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="700" fill="#173245">R1: the source domain</text>
<text x="65" y="230" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">E = D ∩ L²(τ) is norm dense</text>
<text x="65" y="266" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">F₀ = span(EE) ⊂ L¹ ∩ L²</text>
<text x="65" y="302" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">δ(x)(y) + δ(y)(x) = τ(xy)</text>
<text x="65" y="338" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">No star stability of D is added.</text>
<rect x="605" y="132" width="475" height="253" rx="15" fill="#e5edfa" stroke="#456171" stroke-width="2"/>
<text x="625" y="181" font-size="29" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="700" fill="#173245">The integrable graph F</text>
<text x="625" y="230" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">||x||F = ||x|| + ||x||₁</text>
<text x="625" y="266" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">             + ||x||₂ + ||δx||</text>
<text x="625" y="302" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">F⁺ is matrix inverse closed.</text>
<text x="625" y="338" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">K₀(F) ≅ K₀(A)</text>
<rect x="1165" y="132" width="470" height="253" rx="15" fill="#e5edfa" stroke="#456171" stroke-width="2"/>
<text x="1185" y="181" font-size="29" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="700" fill="#173245">Idempotents give zero</text>
<text x="1185" y="230" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">δ⁺(P)(P) = 0</text>
<text x="1185" y="266" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">τ(P − Q) = 0</text>
<text x="1185" y="302" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">All relative K₀ classes.</text>
<text x="1185" y="338" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">Proof: R.6–R.7</text>
<path d="M535,260 L590,260" stroke="#375666" stroke-width="4"/>
<polygon points="590,260 577,251 577,269" fill="#375666"/>
<text x="525" y="115" font-size="22" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">R.2–R.5</text>
<path d="M1095,260 L1150,260" stroke="#375666" stroke-width="4"/>
<polygon points="1150,260 1137,251 1137,269" fill="#375666"/>
<text x="1080" y="115" font-size="22" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">R.6–R.7</text>
<rect x="45" y="500" width="700" height="220" rx="15" fill="#e1f0e7" stroke="#456171" stroke-width="2"/>
<text x="65" y="549" font-size="29" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="700" fill="#173245">R2: an actual dual-valued derivation</text>
<text x="65" y="598" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">τ ϑt = e^tτ; smooth L¹ ∩ L² vectors</text>
<text x="65" y="634" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">d = (d/dt)|₀ ϑt; δ(x)(a) = τ((dx)a)</text>
<text x="65" y="670" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">|δ(x)(a)| ≤ ||dx||₁ ||a||</text>
<text x="65" y="706" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">Homology identity: R.8–R.11</text>
<rect x="930" y="500" width="705" height="220" rx="15" fill="#fff0d9" stroke="#456171" stroke-width="2"/>
<text x="950" y="549" font-size="29" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="700" fill="#173245">R3: restrict the existing core trace</text>
<text x="950" y="598" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">h^(it) = λ(t); τN = Φ_{h^-1}</text>
<text x="950" y="634" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">τN θs = e^(-s)τN; ϑt = θ−t</text>
<text x="950" y="670" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">a f(P_A) ∈ A ⋊ ℝ; J(a f(P_A)) = π(a)f(P).</text>
<text x="950" y="706" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">Proof: R.12–R.15</text>
<path d="M915,600 L760,600" stroke="#375666" stroke-width="4"/>
<polygon points="760,600 773,591 773,609" fill="#375666"/>
<text x="755" y="474" font-size="23" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">reverse time</text>
<path d="M285,475 L285,404" stroke="#375666" stroke-width="4"/>
<polygon points="285,404 276,417 294,417" fill="#375666"/>
<text x="310" y="447" font-size="23" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">R.11</text>
<rect x="45" y="810" width="1590" height="148" rx="15" fill="#f2eee5" stroke="#456171" stroke-width="2"/>
<text x="65" y="859" font-size="29" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="700" fill="#173245">Finite frequency cutoffs give the C* density</text>
<text x="65" y="908" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">P = log h; f ∈ C_c^∞(ℝ):  τN(|J(a f(P_A))|²) ≤ ||a||² (1/2π) ∫ e^(-r) |f(r)|² dr &lt; ∞</text>
<text x="65" y="944" font-size="25" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">These integrated kernels span a norm-dense subspace. Proof: R.13–R.14. Boxes are schematic.</text>
<text x="45" y="998" font-size="23" font-family="Segoe UI Symbol,Arial,sans-serif" font-weight="400" fill="#173245">Original diagram. Proof: R1–R3. Human context: Connes, transverse fundamental class, author PDF p.10.</text>
</svg>
