<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">An even Spin auxiliary tower preserves a secondary characteristic class</title>
<desc id="desc">For an oriented surface, original higher-frame spaces have dimensions two, five, eleven and nineteen through jet order three. The auxiliary tower has dimensions two, twelve, twenty-four and forty. Its Hermitian metric stage has rank ten, its doubled quadratic affine stage rank twelve, and its doubled cubic stage rank sixteen. Every stage is even Spin. Projections point left; maps to the original jets point up; analytic transfers point right. The maps are bundle maps, not coordinate embeddings. Pullback of h1 c1 squared, a closed degree-five class in WO2, yields a current of degree thirty-five on the forty-dimensional target. Its even total transfer rank thirty-eight retains K-degree one.</desc>
<metadata>Original CC0. Reproducible exact dimension, rank, bundle map and degree data. Proof locators: Propositions 13.16 and 13.19, Theorems 13.21-13.22 and Exercise 7.26. Human sources: Bott 1976 sections 3-4 (finite-frame characteristic map); Connes 1986 Theorem 7.15; Connes-Skandalis 1984 Appendix A.5 (product criterion). This diagram displays the authored larger auxiliary tower; it does not attribute that particular tower to those sources.</metadata>
<defs><marker id="left" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#35556c"/></marker><marker id="up" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5d699c"/></marker><marker id="right" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#236a58"/></marker></defs>
