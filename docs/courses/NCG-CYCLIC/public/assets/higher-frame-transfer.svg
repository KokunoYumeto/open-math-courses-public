<rect x="20" y="728" width="1160" height="201" rx="12" fill="#fff3e6"/>
<text x="42" y="769" class="math">r = 3: Herm(3) × Herm(1) gives rank 3² + 1 = 10.</text>
<text x="42" y="810" class="math">Quadratic: 2 × 2 × 3 = 12. Cubic: 2 × 2 × 4 = 16.</text>
<text x="42" y="851" class="math">Total vertical rank R = 38; dim Z₃ = 40. Every stage retains an old odd factor.</text>
<text x="42" y="896" class="math">γ = h₁c₁² has degree 5; dγ = c₁³ = 0 in WO₂. Current degree: 40 − 5 = 35.</text>
<text x="24" y="974" class="small">13.16, 13.19: the transfer. 13.21–13.22: the current comparison and correction cancellation.</text>
<text x="24" y="1015" class="tiny">Left arrows: projections. Up arrows: jet maps. Right arrows: K-theory transfers. No fiber shape is inferred.</text>
