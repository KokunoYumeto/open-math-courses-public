<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#31536b"/></marker></defs>
<rect width="1440" height="1000" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#173245}.title{font-size:32px;font-weight:700}.h{font-size:25px;font-weight:700}.t{font-size:24px}.s{font-size:21px}.m{font-size:23px;font-family:'Cambria Math',Cambria,serif}.b{fill:#fff;stroke:#8aa5b8;stroke-width:2}.a{stroke:#31536b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>

<text x="42" y="52" class="title" text-anchor="start">The smooth compact-support current bridge</text>
<text x="42" y="88" class="s" text-anchor="start">B1–B6: actual maps, compact primitives, locally finite cycles and exact character factors</text>
<rect x="42" y="116" width="420" height="100" rx="13" class="b" style="fill:#fff"/>
<text x="252" y="153" class="h" text-anchor="middle">Ω<tspan baseline-shift="sub" font-size="70%">c</tspan><tspan baseline-shift="super" font-size="70%">*</tspan>(M)</text>
<text x="252" y="191" class="t" text-anchor="middle">globally smooth forms</text>
<rect x="510" y="116" width="420" height="100" rx="13" class="b" style="fill:#fff"/>
<text x="720" y="153" class="h" text-anchor="middle">Ω<tspan baseline-shift="sub" font-size="70%">c</tspan><tspan baseline-shift="super" font-size="70%">*</tspan>(T)</text>
<text x="720" y="191" class="t" text-anchor="middle">compatible simplex forms</text>
<rect x="978" y="116" width="420" height="100" rx="13" class="b" style="fill:#fff"/>
<text x="1188" y="153" class="h" text-anchor="middle">C<tspan baseline-shift="sub" font-size="70%">c</tspan><tspan baseline-shift="super" font-size="70%">*</tspan>(T; ℂ)</text>
<text x="1188" y="191" class="t" text-anchor="middle">finite-support cochains</text>
<path d="M462,166 L510,166" class="a"/>
<path d="M930,166 L978,166" class="a"/>
<text x="485" y="139" class="m" text-anchor="middle">R</text>
<text x="954" y="139" class="m" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">T</tspan></text>
<text x="42" y="256" class="m" text-anchor="start">(Rω)<tspan baseline-shift="sub" font-size="70%">s</tspan> = h<tspan baseline-shift="sub" font-size="70%">s</tspan><tspan baseline-shift="super" font-size="70%">*</tspan>ω;  I = I<tspan baseline-shift="sub" font-size="70%">T</tspan> R;  Iω(s) = ∫<tspan baseline-shift="sub" font-size="70%">s</tspan> h<tspan baseline-shift="sub" font-size="70%">s</tspan><tspan baseline-shift="super" font-size="70%">*</tspan>ω.  Both arrows are quasi-isomorphisms.</text>
<rect x="42" y="282" width="1356" height="186" rx="13" class="b" style="fill:#edf5fa"/>
<text x="65" y="321" class="h" text-anchor="start">Compact primitive: the step needed for an arbitrary current</text>
<text x="65" y="357" class="m" text-anchor="start">Rω = dη</text>
<text x="65" y="390" class="s" text-anchor="start">η compatible, compact</text>
<path d="M324,365 L385,365" class="a"/>
<text x="407" y="357" class="m" text-anchor="start">(η, −ω) is a closed cone element</text>
<text x="407" y="390" class="s" text-anchor="start">finite Čech descent + partitions (B1)</text>
<path d="M830,365 L890,365" class="a"/>
<text x="914" y="357" class="m" text-anchor="start">ω = dα</text>
<text x="914" y="390" class="s" text-anchor="start">α globally smooth, compact</text>
<text x="65" y="439" class="t" text-anchor="start">All constructions stay in a common compact neighborhood. Closed C therefore gives C(dα) = 0.</text>
<rect x="42" y="494" width="652" height="204" rx="13" class="b" style="fill:#fff"/>
<rect x="720" y="494" width="678" height="204" rx="13" class="b" style="fill:#fff"/>
<text x="65" y="532" class="h" text-anchor="start">Cycle current: a literal identity</text>
<text x="65" y="570" class="m" text-anchor="start">c = Σ<tspan baseline-shift="sub" font-size="70%">s</tspan> λ<tspan baseline-shift="sub" font-size="70%">s</tspan> s, locally finite, ∂c = 0</text>
<text x="65" y="606" class="m" text-anchor="start">S<tspan baseline-shift="sub" font-size="70%">c</tspan>(ω) = Σ<tspan baseline-shift="sub" font-size="70%">s</tspan> λ<tspan baseline-shift="sub" font-size="70%">s</tspan> ∫<tspan baseline-shift="sub" font-size="70%">s</tspan> h<tspan baseline-shift="sub" font-size="70%">s</tspan><tspan baseline-shift="super" font-size="70%">*</tspan>ω = c(Iω)</text>
<text x="65" y="644" class="s" text-anchor="start">Compact support meets finitely many simplices.</text>
<text x="65" y="677" class="s" text-anchor="start">Finite local volume bound; Stokes cancels faces.</text>
<text x="743" y="532" class="h" text-anchor="start">Any closed current: cohomological identity</text>
<text x="743" y="570" class="m" text-anchor="start">H<tspan baseline-shift="sub" font-size="70%">p</tspan><tspan baseline-shift="super" font-size="70%">lf</tspan>(T; ℂ) ≅ Hom<tspan baseline-shift="sub" font-size="70%">ℂ</tspan>(H<tspan baseline-shift="sub" font-size="70%">c</tspan><tspan baseline-shift="super" font-size="70%">p</tspan>(M; ℂ), ℂ)</text>
<text x="743" y="606" class="m" text-anchor="start">C(ω) = ⟨[C], I<tspan baseline-shift="sub" font-size="70%">*</tspan>[ω]⟩ for closed compact ω</text>
<text x="743" y="644" class="s" text-anchor="start">The smooth comparison defines [C] (B.11)–(B.12).</text>
<text x="743" y="677" class="s" text-anchor="start">Every homology class has an order-zero S<tspan baseline-shift="sub" font-size="70%">c</tspan>.</text>
<rect x="42" y="724" width="1356" height="192" rx="13" class="b" style="fill:#edf5fa"/>
<text x="65" y="762" class="h" text-anchor="start">The exact K-current equality (B.23)–(B.25)</text>
<text x="65" y="801" class="m" text-anchor="start">τ̂<tspan baseline-shift="sub" font-size="70%">C</tspan> = (−1)<tspan baseline-shift="super" font-size="70%">⌊d/2⌋</tspan> τ<tspan baseline-shift="sub" font-size="70%">C</tspan> / a<tspan baseline-shift="sub" font-size="70%">d</tspan></text>
<text x="720" y="801" class="m" text-anchor="start">J<tspan baseline-shift="sub" font-size="70%">τ̂<tspan baseline-shift="sub" font-size="70%">C</tspan></tspan>(z) = ⟨[C], ch<tspan baseline-shift="sub" font-size="70%">c,d</tspan>(z)⟩</text>
<text x="65" y="838" class="m" text-anchor="start">a<tspan baseline-shift="sub" font-size="70%">2m</tspan> = m! (2πi)<tspan baseline-shift="super" font-size="70%">m</tspan></text>
<text x="720" y="838" class="m" text-anchor="start">a<tspan baseline-shift="sub" font-size="70%">2m+1</tspan> = (2m+1)! (2πi)<tspan baseline-shift="super" font-size="70%">m+1</tspan> / m!</text>
<text x="65" y="875" class="s" text-anchor="start">Even m ≥ 1; odd m ≥ 0; κ<tspan baseline-shift="super" font-size="70%">+</tspan>([u]) = θ([u<tspan baseline-shift="super" font-size="70%">−1</tspan>]) = −θ([u]); increasing interval first.</text>
<text x="65" y="901" class="s" text-anchor="start">Degree zero: the locally finite measure gives a rank two-trace, J<tspan baseline-shift="sub" font-size="70%">τ<tspan baseline-shift="sub" font-size="70%">μ</tspan></tspan>(z) = μ(rank z).</text>
<text x="42" y="957" class="s" text-anchor="start">Domains, signs and support are exact. No fixed-arity amalgamation is claimed. Proof: Appendix B1–B6; Appendix A.</text>
</svg>