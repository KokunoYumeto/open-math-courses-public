<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">Two positive odd lines and the outward planar symbol</title><desc id="desc">The fixed right Clifford product has operator x sigma one minus y sigma two and grading sigma three. Conjugation to the outward operator reverses the grading. The same outward class has cyclic integral plus one and geometric integral minus one. Exact rank and odd-input Thom signs are displayed.</desc><rect width="1200" height="1100" fill="#f5f8fb"/><g font-family="Segoe UI,Arial,sans-serif">
<text x="42" y="46" font-size="30" fill="#173a50" font-weight="bold">Two positive odd lines and the outward planar symbol</text>
<text x="42" y="82" font-size="20" fill="#173a50" font-weight="normal">Coordinates ordered (x,y). The operator and its grading together determine the K-class.</text>
<rect x="35" y="108" width="1130" height="207" rx="14" fill="white" stroke="#b8cede"/>
<text x="60" y="146" font-size="24" fill="#173a50" font-weight="bold">A. Positive lines use the fixed right Clifford product</text>
<text x="65" y="195" font-size="27" fill="#173a50" font-weight="normal">u(t) = (t−i)/(t+i)</text>
<text x="650" y="195" font-size="27" fill="#173a50" font-weight="normal">(1/2πi) ∫ u⁻¹du = +1</text>
<text x="65" y="241" font-size="23" fill="#173a50" font-weight="normal">Second original generator: −σ₂. First auxiliary generator: σ₁.</text>
<text x="65" y="285" font-size="22" fill="#173a50" font-weight="normal">(−i)(−σ₂)σ₁ = σ₃  fixes the chirality of the coefficient C₂ reduction.</text>
<rect x="35" y="335" width="1130" height="265" rx="14" fill="white" stroke="#b8cede"/>
<text x="60" y="375" font-size="24" fill="#173a50" font-weight="bold">B. Conjugating the operator also reverses the grading</text>
<text x="65" y="426" font-size="21" fill="#173a50" font-weight="bold">Actual product</text>
<text x="660" y="426" font-size="21" fill="#173a50" font-weight="bold">Outward plane</text>
<text x="65" y="471" font-size="27" fill="#173a50" font-weight="normal">Q₋ = xσ₁ − yσ₂,  Γ = σ₃</text>
<text x="660" y="471" font-size="27" fill="#173a50" font-weight="normal">Q₊ = xσ₁ + yσ₂,  Γ = σ₃</text>
<text x="65" y="520" font-size="24" fill="#173a50" font-weight="normal">σ₁ Q₋ σ₁ = Q₊</text>
<text x="660" y="520" font-size="24" fill="#a55840" font-weight="normal">σ₁ Γ σ₁ = −Γ</text>
<text x="65" y="565" font-size="23" fill="#173a50" font-weight="bold">uₓ ⊠R uᵧ = −τ₂.   Both squares = (x²+y²)1; positivity = 2x² ≥ 0.</text>
<rect x="35" y="620" width="1130" height="224" rx="14" fill="white" stroke="#b8cede"/>
<text x="60" y="660" font-size="24" fill="#173a50" font-weight="bold">C. Two characters of the same planar class</text>
<text x="65" y="709" font-size="22" fill="#173a50" font-weight="bold">Class</text>
<text x="460" y="709" font-size="22" fill="#173a50" font-weight="bold">Cyclic integral</text>
<text x="845" y="709" font-size="22" fill="#173a50" font-weight="bold">Geometric integral</text>
<text x="65" y="752" font-size="23" fill="#173a50" font-weight="normal">Outward τ₂</text>
<text x="525" y="752" font-size="25" fill="#173a50" font-weight="normal">+1</text>
<text x="930" y="752" font-size="25" fill="#173a50" font-weight="normal">−1</text>
<text x="65" y="800" font-size="23" fill="#173a50" font-weight="normal">Product uₓ ⊠R uᵧ = −τ₂</text>
<text x="525" y="800" font-size="25" fill="#173a50" font-weight="normal">−1</text>
<text x="930" y="800" font-size="25" fill="#173a50" font-weight="normal">+1</text>
<rect x="35" y="864" width="1130" height="170" rx="14" fill="white" stroke="#b8cede"/>
<text x="60" y="904" font-size="24" fill="#173a50" font-weight="bold">D. Exact signs for later proofs</text>
<text x="65" y="949" font-size="23" fill="#173a50" font-weight="normal">τᵣ = (−1)ʳ⁽ʳ⁻¹⁾⁄² u₁ ⊠R ··· ⊠R uᵣ;    τᵣ₊ₛ = (−1)ʳˢ τᵣ ⊠R τₛ</text>
<text x="65" y="995" font-size="21" fill="#173a50" font-weight="normal">chcyc(ThF x) = (−1)ʳⁱ tF(chcyc(x) Â(F)⁻¹);    odd signed line map: −x ⊠R u</text>
<text x="42" y="1070" font-size="17" fill="#173a50" font-weight="normal">Proof: Proposition 8.12a, (8.35a)–(8.35d), Lemma 8.15. Primary context: Atiyah–Hirzebruch (1961), §§1.5–1.10.</text>
</g></svg>