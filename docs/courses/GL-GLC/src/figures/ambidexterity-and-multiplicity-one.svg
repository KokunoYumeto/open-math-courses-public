<svg xmlns="http://www.w3.org/2000/svg" width="540" height="3114" viewBox="0 0 390 2249" role="img" aria-labelledby="title desc">
<title id="title">Supported sections, central line summands and multiplicity one</title>
<desc id="desc">Conditional formal mechanism of Lemmas 14.R6 through 14.R11. Cohen-Macaulay and codimension-two geometry, the supported-unit comparison and the derived/descent frameworks are supplied hypotheses giving extension of degree-zero sections, also for the central line twists. A supplied vector-bundle decomposition and twisted-section vanishing eliminate nontrivial central line summands. For c nonempty open and closed components, the supplied vacuum dimension c bounds the sum of their ranks by c. Separate vacuum nonvanishing makes every rank positive; unitality alone does not imply this. The resulting rank-one algebra has invertible unit on the irreducible open locus by the local equation ab equals one. No geometric input is represented as proved.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#314f64"/></marker></defs>
<style>
text{fill:#203246;font-family:'Segoe UI',Arial,sans-serif}
.heading{font-size:18px;font-weight:650}.body{font-size:15px}.small{font-size:14px}
.math{font-family:'Cambria Math',Cambria,Georgia,serif;font-size:21px}
.sub{font-size:12px;baseline-shift:sub}.sup{font-size:12px;baseline-shift:super}
.panel{fill:#fbfcfe;stroke:#cad5df;stroke-width:1.2}
.hyp{fill:#eee8fa;stroke:#7c62a5;stroke-width:1.1}
.positive{fill:#fff0cf;stroke:#a87925;stroke-width:1.1}
.proof{fill:#e9f5ed;stroke:#3f7b5c;stroke-width:1.2}
.arrow{stroke:#314f64;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<rect width="390" height="2249" fill="white"/>
<text x="20" y="38" class="heading" style="font-size:24px">Multiplicity one</text>
<text x="20" y="66" class="body" style="font-size:18px">From supported sections to the unit</text>
<text x="20" y="94" class="body" style="font-size:14.5px">H⁰ denotes degree-zero derived sections.</text>
<rect x="20" y="109" width="100" height="27" rx="6" class="hyp"/>
<text x="70" y="128" class="small" text-anchor="middle">Hypothesis</text>
<rect x="129" y="109" width="130" height="27" rx="6" class="positive"/>
<text x="194" y="128" class="small" text-anchor="middle">Nonvanishing</text>
<rect x="268" y="109" width="102" height="27" rx="6" class="proof"/>
<text x="319" y="128" class="small" text-anchor="middle">Formal proof</text>
<rect x="20" y="153" width="350" height="167" rx="10" class="panel"/>
<text x="35" y="181" class="heading">Keep components and unit fixed</text>
<text x="35" y="214" class="math" style="font-size:17.5px">S = Y<tspan class="sub">G</tspan>; U = S ∖ Z; A<tspan class="sub">U</tspan> = j<tspan class="sup">*</tspan>A</text>
<text x="35" y="246" class="math" style="font-size:20px">U = ⨿<tspan class="sub">α=1</tspan><tspan class="sup">c</tspan> U<tspan class="sub">α</tspan>; c ≥ 1</text>
<text x="35" y="273" class="small">Each Uα is nonempty, open and closed.</text>
<text x="35" y="302" class="math" style="font-size:18px">u: 𝒪<tspan class="sub">S</tspan> → A is the given algebra unit.</text>
<rect x="20" y="336" width="350" height="366" rx="10" class="panel"/>
<text x="35" y="366" class="heading">1. Extend H⁰ sections</text>
<rect x="35" y="382" width="320" height="147" rx="7" class="hyp"/>
<text x="48" y="407" class="heading" style="font-size:15.5px">CM/codimension + supported unit</text>
<text x="48" y="430" class="small">CM Noetherian charts; codimS Z ≥ 2.</text>
<text x="48" y="451" class="small">Chart-to-stack descent is supplied.</text>
<text x="48" y="481" class="math" style="font-size:17.5px">RΓ<tspan class="sub">Z</tspan>(u): RΓ<tspan class="sub">Z</tspan>(𝒪<tspan class="sub">S</tspan>) ≃ RΓ<tspan class="sub">Z</tspan>(A)</text>
<text x="48" y="509" class="small">Twists commute with supported sections.</text>
<rect x="35" y="542" width="320" height="135" rx="7" class="proof"/>
<text x="48" y="567" class="heading" style="font-size:16px">Formal extension • 14.R6–R8</text>
<text x="48" y="599" class="math" style="font-size:20px">H<tspan class="sup">0</tspan>(S,A) ≃ H<tspan class="sup">0</tspan>(U,A<tspan class="sub">U</tspan>)</text>
<text x="48" y="628" class="math" style="font-size:17px">H<tspan class="sup">0</tspan>(S,A⊗L<tspan class="sup">−1</tspan>) ≃ H<tspan class="sup">0</tspan>(U,A<tspan class="sub">U</tspan>⊗L<tspan class="sup">−1</tspan>)</text>
<text x="48" y="657" class="small">Low supported H⁰,H¹ vanish; use exactness.</text>
<path d="M195 702 V726" class="arrow"/>
<rect x="20" y="732" width="350" height="461" rx="10" class="panel"/>
<text x="35" y="762" class="heading">2. Remove nontrivial central lines</text>
<rect x="35" y="778" width="320" height="170" rx="7" class="hyp"/>
<text x="48" y="803" class="heading" style="font-size:16px">Central-line hypotheses</text>
<text x="48" y="835" class="math" style="font-size:21px">A|<tspan class="sub">Uα</tspan> ≃ ⨁<tspan class="sub">τ</tspan> L<tspan class="sub">τ</tspan><tspan class="sup">⊕nτ,α</tspan></text>
<text x="48" y="862" class="small">Vector bundles; central lines come from S.</text>
<text x="48" y="885" class="body">For each nontrivial τ, supply</text>
<text x="48" y="914" class="math" style="font-size:20px">H<tspan class="sup">0</tspan>(S,A⊗L<tspan class="sub">τ</tspan><tspan class="sup">−1</tspan>) = 0</text>
<text x="48" y="936" class="small">No decomposition as product algebras.</text>
<rect x="35" y="961" width="320" height="209" rx="7" class="proof"/>
<text x="48" y="987" class="heading" style="font-size:16px">Twist detection • 14.R9</text>
<text x="48" y="1014" class="small">Extension gives H⁰(U, twisted A) = 0.</text>
<text x="48" y="1038" class="small">The matching twist contains 𝒪ⁿ on Uα.</text>
<text x="195" y="1071" class="math" style="font-size:22px" text-anchor="middle">k<tspan class="sup">nτ,α</tspan> ↪ 0 ⇒ n<tspan class="sub">τ,α</tspan> = 0</text>
<text x="48" y="1098" class="body">Only trivial lines remain:</text>
<text x="48" y="1128" class="math" style="font-size:22px">A|<tspan class="sub">Uα</tspan> ≃ 𝒪<tspan class="sub">Uα</tspan><tspan class="sup">⊕nα</tspan></text>
<text x="48" y="1152" class="small">Positivity has not yet been used.</text>
<path d="M195 1193 V1217" class="arrow"/>
<rect x="20" y="1223" width="350" height="490" rx="10" class="panel"/>
<text x="35" y="1253" class="heading">3. Count all c components</text>
<rect x="35" y="1268" width="320" height="88" rx="7" class="hyp"/>
<text x="48" y="1294" class="heading" style="font-size:16px">Vacuum dimension hypothesis</text>
<text x="48" y="1330" class="math" style="font-size:23px">dim<tspan class="sub">k</tspan> H<tspan class="sup">0</tspan>(S,A) = c</text>
<rect x="35" y="1370" width="320" height="133" rx="7" class="positive"/>
<text x="48" y="1396" class="heading" style="font-size:15.5px">Separate nonvanishing hypothesis</text>
<text x="48" y="1427" class="math" style="font-size:21px">n<tspan class="sub">α</tspan> ≥ 1 for every α</text>
<text x="48" y="1454" class="small">Nonzero vacuum summand on each Uα.</text>
<text x="48" y="1480" class="small">Unitality alone does not give positivity.</text>
<rect x="35" y="1517" width="320" height="176" rx="7" class="proof"/>
<text x="48" y="1543" class="heading" style="font-size:16px">Formal count • 14.R10</text>
<text x="195" y="1577" class="math" style="font-size:22px" text-anchor="middle">⨁<tspan class="sub">α</tspan> k<tspan class="sup">nα</tspan> ↪ H<tspan class="sup">0</tspan>(U,A<tspan class="sub">U</tspan>)</text>
<text x="195" y="1614" class="math" style="font-size:24px" text-anchor="middle">c ≤ ∑<tspan class="sub">α</tspan> n<tspan class="sub">α</tspan> ≤ c</text>
<text x="48" y="1641" class="small" style="font-size:13.5px">Extension identifies the last dimension with c.</text>
<text x="195" y="1674" class="math" style="font-size:23px" text-anchor="middle">⇒ every n<tspan class="sub">α</tspan> = 1</text>
<path d="M195 1713 V1737" class="arrow"/>
<rect x="20" y="1743" width="350" height="322" rx="10" class="proof"/>
<text x="35" y="1773" class="heading">4. Invert the rank-one unit</text>
<text x="35" y="1803" class="body">Restrict the given unital algebra to U.</text>
<text x="35" y="1828" class="body">In a local basis e:</text>
<text x="35" y="1864" class="math" style="font-size:22px">u(1) = a e; e·e = b e</text>
<text x="195" y="1900" class="math" style="font-size:23px" text-anchor="middle">Unit law: ab = 1</text>
<text x="195" y="1936" class="math" style="font-size:23px" text-anchor="middle">⇒ a is invertible</text>
<text x="195" y="1974" class="math" style="font-size:24px" text-anchor="middle">j<tspan class="sup">*</tspan>u: 𝒪<tspan class="sub">U</tspan> → A<tspan class="sub">U</tspan></text>
<text x="195" y="2004" class="body" style="font-size:18px" text-anchor="middle">is an isomorphism on U.</text>
<text x="35" y="2041" class="small">Local inverses glue • 14.R11</text>
<text x="20" y="2098" class="small">Figure 14.1. The formal multiplicity mechanism.</text>
<text x="20" y="2121" class="small">Geometric comparisons and vacuum dimensions</text>
<text x="20" y="2144" class="small">are hypotheses. Vacuum nonvanishing is separate.</text>
<text x="20" y="2167" class="small">The conclusion concerns the unit on U.</text>
<text x="20" y="2190" class="small">Proof: 14.R6–R8 (extension), 14.R9 (twists),</text>
<text x="20" y="2213" class="small">14.R10 (component count), 14.R11 (unit).</text>
</svg>
