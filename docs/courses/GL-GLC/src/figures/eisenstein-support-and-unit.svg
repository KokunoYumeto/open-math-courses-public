<svg xmlns="http://www.w3.org/2000/svg" width="540" height="2451" viewBox="0 0 390 1770" role="img" aria-labelledby="title desc">
<title id="title">Two-sector test for the Eisenstein reduction and the algebra unit</title>
<desc id="desc">Apply the exact localization triangle to K, the cofiber of u from the structure sheaf of Y to A_G. The proper-Levi geometric theorem and normalized comparisons are supplied hypotheses for supported sections. The irreducible unit assertion is still required. If both supported and open cofibers vanish, K vanishes and the unit is invertible. The supplied adjunction, conservative Langlands functor and monad comparison including its unit then imply an equivalence. Formal proof locators are Propositions 13.A and 13.B and equations 13.8 through 13.12.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#314f64"/></marker></defs>
<style>
text{fill:#203246;font-family:'Segoe UI',Arial,sans-serif}
.heading{font-size:18px;font-weight:650}
.math{font-family:'Cambria Math',Cambria,Georgia,serif;font-size:21px}
.body{font-size:15px}.small{font-size:14px}.sub{font-size:13px;baseline-shift:sub}.sup{font-size:13px;baseline-shift:super}
.panel{fill:#fbfcfe;stroke:#cad5df;stroke-width:1.2}
.node{fill:white;stroke:#668093;stroke-width:1.2}
.arrow{stroke:#314f64;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<rect width="390" height="1770" fill="white"/>
<text x="20" y="38" font-size="23" font-weight="700">Eisenstein reduction</text>
<text x="20" y="66" font-size="19">Two tests for the algebra unit</text>
<text x="20" y="94" class="body">Formal consequences at supplied hypotheses.</text>
<rect x="20" y="109" width="104" height="27" rx="6" fill="#eee8fa" stroke="#7c62a5"/>
<text x="72" y="128" text-anchor="middle" class="small">Hypothesis</text>
<rect x="133" y="109" width="111" height="27" rx="6" fill="#fff0cf" stroke="#a87925"/>
<text x="188.5" y="128" text-anchor="middle" class="small">Still required</text>
<rect x="253" y="109" width="117" height="27" rx="6" fill="#e9f5ed" stroke="#3f7b5c"/>
<text x="311.5" y="128" text-anchor="middle" class="small">Formal proof</text>

<rect x="20" y="153" width="350" height="175" rx="10" class="panel"/>
<text x="35" y="181" class="heading">1. Keep the same unit and cofiber</text>
<text x="35" y="218" class="math">u: 𝒪<tspan class="sub">Y</tspan> → A<tspan class="sub">G</tspan></text>
<text x="35" y="250" class="math">K = cofib(u)</text>
<text x="35" y="280" class="math" style="font-size:18px">Y = LS<tspan class="sub">Ǧ</tspan>;  j: Y<tspan class="sup">irred</tspan> ↪ Y</text>
<text x="35" y="307" class="body">The reducible locus is the complement.</text>

<rect x="20" y="344" width="350" height="387" rx="10" class="panel"/>
<text x="35" y="375" class="heading">2. Exact localization triangle</text>
<rect x="35" y="389" width="320" height="27" rx="6" fill="#eee8fa" stroke="#7c62a5"/>
<text x="195" y="408" text-anchor="middle" class="small">Supplied localization geometry</text>
<rect x="101" y="435" width="188" height="45" rx="7" class="node"/>
<text x="195" y="463" text-anchor="middle" class="math">Γ<tspan class="sub">red</tspan> K</text>
<path d="M195 480 V505" class="arrow"/>
<text x="210" y="497" class="small">support map</text>
<rect x="101" y="505" width="188" height="45" rx="7" class="node"/>
<text x="195" y="533" text-anchor="middle" class="math">K</text>
<path d="M195 550 V575" class="arrow"/>
<text x="210" y="568" class="math" style="font-size:17px">λ<tspan class="sub">K</tspan></text>
<rect x="101" y="575" width="188" height="45" rx="7" class="node"/>
<text x="195" y="603" text-anchor="middle" class="math">j<tspan class="sub">*</tspan> j<tspan class="sup">*</tspan> K</text>
<path d="M195 620 V645" class="arrow"/>
<text x="210" y="638" class="small">connecting map</text>
<rect x="101" y="645" width="188" height="45" rx="7" class="node"/>
<text x="195" y="673" text-anchor="middle" class="math">Γ<tspan class="sub">red</tspan> K[1]</text>
<text x="35" y="713" class="small">The connecting morphism has the shift [1].</text>

<rect x="20" y="747" width="350" height="337" rx="10" class="panel"/>
<text x="35" y="777" class="heading">3. Supply both vanishing tests</text>
<rect x="35" y="793" width="320" height="133" rx="7" fill="#eee8fa" stroke="#7c62a5"/>
<text x="48" y="818" font-size="16" font-weight="650">Supported-sector hypothesis</text>
<text x="48" y="842" class="body">Proper-Levi geometric theorem,</text>
<text x="48" y="863" class="body">with normalized comparisons.</text>
<text x="48" y="885" class="body">GLC assumed for every proper Levi.</text>
<text x="48" y="910" class="math" style="font-size:18px">Required output: Γ<tspan class="sub">red</tspan> K = 0</text>
<rect x="35" y="940" width="320" height="120" rx="7" fill="#fff0cf" stroke="#a87925"/>
<text x="48" y="966" font-size="15.5" font-weight="650">Irreducible assertion: still required</text>
<text x="48" y="995" class="math">j<tspan class="sup">*</tspan>u is an equivalence</text>
<text x="48" y="1024" class="math">⇔ j<tspan class="sup">*</tspan>K = 0</text>
<text x="48" y="1047" class="small">Both tests concern this same u.</text>
<path d="M195 1084 V1111" class="arrow"/>

<rect x="20" y="1117" width="350" height="217" rx="10" fill="#e9f5ed" stroke="#3f7b5c" stroke-width="1.2"/>
<text x="35" y="1147" class="heading">4. Formal support deduction</text>
<text x="195" y="1183" text-anchor="middle" class="math" style="font-size:19px">Γ<tspan class="sub">red</tspan>K = 0 and j<tspan class="sup">*</tspan>K = 0</text>
<text x="195" y="1215" text-anchor="middle" class="math">0 → K → 0 → 0</text>
<text x="195" y="1251" text-anchor="middle" class="math">⇒ K = 0 ⇒ u invertible</text>
<text x="35" y="1284" class="small">Proposition 13.B; (13.9)–(13.12)</text>
<text x="35" y="1308" class="small">Exactness converts both tests to vanishing.</text>
<path d="M195 1334 V1361" class="arrow"/>

<rect x="20" y="1367" width="350" height="251" rx="10" fill="#e9f5ed" stroke="#3f7b5c" stroke-width="1.2"/>
<text x="35" y="1398" class="heading">5. Formal adjunction consequence</text>
<rect x="35" y="1411" width="320" height="27" rx="6" fill="#eee8fa" stroke="#7c62a5"/>
<text x="195" y="1430" text-anchor="middle" font-size="13">Adjunction and monad comparison supplied</text>
<text x="35" y="1468" class="math" style="font-size:18px">L<tspan class="sub">G</tspan><tspan class="sup">L</tspan> ⊣ L<tspan class="sub">G</tspan>;  L<tspan class="sub">G</tspan>L<tspan class="sub">G</tspan><tspan class="sup">L</tspan> ≃ A<tspan class="sub">G</tspan> ⋆ (−)</text>
<text x="35" y="1496" class="body">The monad unit is u ⋆ id (unit included).</text>
<text x="35" y="1526" class="math" style="font-size:18px">u invertible ⇒ monad unit invertible</text>
<text x="35" y="1554" class="math" style="font-size:17px">Conservative L<tspan class="sub">G</tspan> ⇒ L<tspan class="sub">G</tspan> equivalence.</text>
<text x="35" y="1581" class="small">Proposition 13.A;</text>
<text x="35" y="1602" class="small">forward direction of (13.8).</text>

<text x="20" y="1652" class="small">Figure 13.1. The exact triangle tests the</text>
<text x="20" y="1674" class="small">cofiber of the algebra unit on two sectors.</text>
<text x="20" y="1696" class="small">Geometric statements are supplied hypotheses.</text>
<text x="20" y="1718" class="small">The irreducible-unit assertion remains required.</text>
<text x="20" y="1740" class="small">Proof: Propositions 13.A/13.B, (13.8)–(13.12).</text>
</svg>
