<svg xmlns="http://www.w3.org/2000/svg" width="450" height="620" viewBox="0 0 450 620" role="img" aria-labelledby="title desc">
  <title id="title">The coarse Langlands functor and its bounded lift</title>
  <desc id="desc">An action and compact vacuum define alpha and its continuous right adjoint F zero. The compact restriction of F zero lifts to IndCoh with nilpotent support through the bounded coarsening equivalence, then extends by colimits. Psi composed with F is naturally equivalent to F zero.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#214b65"/></marker></defs>
  <rect width="450" height="620" fill="#fff"/>
  <g font-family="Georgia,serif" fill="#16384f" text-anchor="middle">
    <text x="225" y="27" font-size="21">Construct from the action and vacuum</text>
    <rect x="30" y="47" width="356" height="92" rx="12" fill="#eef6fa" stroke="#214b65" stroke-width="1.6"/>
    <text x="208" y="79" font-size="21">C = D-mod½(Bun<tspan baseline-shift="sub" font-size="14">G</tspan>)</text>
    <text x="208" y="111" font-size="18">α(a) = a ⋆ P<tspan baseline-shift="sub" font-size="12">Vac</tspan></text>
    <path d="M59 139V239" stroke="#214b65" stroke-width="2.2" marker-end="url(#arrow)" fill="none"/>
    <text x="217" y="174" font-size="19">F: lift the compact restriction</text>
    <text x="224" y="199" font-size="17">then extend by colimits</text>
    <text x="224" y="222" font-size="17">each compact has its own bound</text>
    <rect x="30" y="247" width="356" height="100" rx="12" fill="#f2f7ef" stroke="#537748" stroke-width="1.6"/>
    <text x="208" y="282" font-size="21">D = IndCoh<tspan baseline-shift="sub" font-size="14">Nilp</tspan>(S)</text>
    <text x="208" y="318" font-size="17">F(Cᶜ) lies in ⋃<tspan baseline-shift="sub" font-size="12">n</tspan> D<tspan baseline-shift="super" font-size="12">≥n</tspan></text>
    <path d="M59 347V460" stroke="#214b65" stroke-width="2.2" marker-end="url(#arrow)" fill="none"/>
    <text x="222" y="385" font-size="20">Ψ: coarsening</text>
    <text x="222" y="411" font-size="17">an equivalence on</text>
    <text x="222" y="435" font-size="17">bounded-below subcategories</text>
    <rect x="30" y="468" width="356" height="91" rx="12" fill="#f5f1fb" stroke="#74589a" stroke-width="1.6"/>
    <text x="208" y="502" font-size="21">A = QCoh(S)</text>
    <text x="208" y="535" font-size="18">F₀ = αᴿ,   ΓF₀ ≃ W</text>
    <path d="M386 92H406V511H389" stroke="#214b65" stroke-width="2.2" marker-end="url(#arrow)" fill="none"/>
    <text x="430" y="301" transform="rotate(90 430 301)" font-size="18">F₀: the continuous coarse functor</text>
    <text x="225" y="593" font-size="21">Specified comparison: ΨF ≃ F₀</text>
  </g>
</svg>
