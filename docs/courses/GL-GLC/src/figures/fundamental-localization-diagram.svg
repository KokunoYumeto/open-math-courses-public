<svg xmlns="http://www.w3.org/2000/svg" width="450" height="750" viewBox="0 0 450 750" role="img" aria-labelledby="title desc">
 <title id="title">The two normalized localization and coefficient squares</title>
 <desc id="desc">Six categories in three rows. Critical Kac-Moody modules and local monodromy-free opers are at the bottom, automorphic D-modules and nilpotent ind-coherent sheaves in the middle, Whittaker and representation categories at the top. Every vertical arrow ascends. The localization line is ell minus; the upper coefficient is shifted by twice delta N. Spectral global sections factor through coarsening to quasi-coherent sheaves.</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#24364b"/></marker></defs>
 <rect width="450" height="750" rx="14" fill="#f6f8fb"/>
 <g font-family="Georgia,serif" fill="#182d43" text-anchor="middle">
  <text x="225" y="34" font-size="20">Local data and global functors</text>
  <text x="225" y="57" font-size="14">Both squares use the specified natural comparisons</text>
  <g fill="#e6eef8" stroke="#52769d" stroke-width="1.5">
   <rect x="18" y="92" width="174" height="98" rx="9"/>
   <rect x="258" y="92" width="174" height="98" rx="9"/>
  </g>
  <g fill="#e8f2e9" stroke="#5f8366" stroke-width="1.5">
   <rect x="18" y="308" width="174" height="98" rx="9"/>
   <rect x="258" y="308" width="174" height="98" rx="9"/>
  </g>
  <g fill="#fff1dc" stroke="#a7834d" stroke-width="1.5">
   <rect x="18" y="542" width="174" height="98" rx="9"/>
   <rect x="258" y="542" width="174" height="98" rx="9"/>
  </g>
  <text x="105" y="121" font-size="21">H = Whit! (G)</text>
  <text x="105" y="150" font-size="15">Ran Whittaker category</text>
  <text x="105" y="174" font-size="15">geometric side</text>
  <text x="345" y="121" font-size="21">V = Rep(G<tspan baseline-shift="super" font-size="13">∨</tspan>)</text>
  <text x="345" y="150" font-size="14">representations over Ran</text>
  <text x="345" y="174" font-size="15">spectral side</text>
  <text x="105" y="337" font-size="17">C = D-mod½(BunG)</text>
  <text x="105" y="366" font-size="15">global automorphic</text>
  <text x="105" y="390" font-size="15">with the half twist</text>
  <text x="345" y="337" font-size="18">D = IndCohNilp(S)</text>
  <text x="345" y="366" font-size="15">global spectral category</text>
  <text x="345" y="390" font-size="14">nilpotent singular support</text>
  <text x="105" y="571" font-size="21">K = KL(G)crit</text>
  <text x="105" y="600" font-size="15">local critical modules</text>
  <text x="105" y="624" font-size="15">over Ran</text>
  <text x="345" y="571" font-size="17">O = IndCoh*(Opmf)</text>
  <text x="345" y="600" font-size="15">monodromy-free opers</text>
  <text x="345" y="624" font-size="15">over Ran</text>
  <g fill="none" stroke="#24364b" stroke-width="2" marker-end="url(#arrow)">
   <path d="M194,139 H255"/>
   <path d="M194,355 H255"/>
   <path d="M194,589 H255"/>
   <path d="M105,305 V195"/>
   <path d="M345,305 V195"/>
   <path d="M105,539 V411"/>
   <path d="M345,539 V411"/>
  </g>
  <text x="225" y="119" font-size="18">CS</text>
  <text x="225" y="335" font-size="18">L<tspan baseline-shift="sub" font-size="12">G</tspan></text>
  <text x="225" y="569" font-size="17">FLE</text>
  <rect x="22" y="234" width="166" height="31" fill="#f6f8fb"/>
  <text x="105" y="255" font-size="19">coeffG [2δN]</text>
  <rect x="262" y="221" width="166" height="55" fill="#f6f8fb"/>
  <text x="345" y="241" font-size="17">Γspec,IndCoh</text>
  <text x="345" y="264" font-size="16">= Γspec Ψ</text>
  <rect x="22" y="455" width="166" height="38" fill="#f6f8fb"/>
  <text x="105" y="479" font-size="19">LocG ⊗ ℓ−</text>
  <rect x="262" y="455" width="166" height="38" fill="#f6f8fb"/>
  <text x="345" y="479" font-size="19">Pspec<tspan baseline-shift="sub" font-size="13">*</tspan></text>
  <text x="225" y="681" font-size="17">ℓ− = ℓG,N½ ⊗ ℓN−1 [−δN]</text>
  <text x="225" y="710" font-size="15">Γspec is fully faithful on A = QCoh(S).</text>
  <text x="225" y="733" font-size="15">Γspec Ψ on D need not be fully faithful.</text>
 </g>
</svg>
