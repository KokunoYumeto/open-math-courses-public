<svg xmlns="http://www.w3.org/2000/svg" width="540" height="3420" viewBox="0 0 390 2470" role="img" aria-labelledby="title desc">
<title id="title">Dependency map of the five geometric Langlands papers</title>
<desc id="desc">Purple cards are actual geometric hypotheses, not proofs supplied by this course. Paper I constructs the specified spectral-linear Langlands functor. Paper II localization and fundamental local equivalence, and Paper III Eisenstein and left-adjoint data, both enter the actual common-adjoint and oper comparisons of Paper IV. The finite-monodromy vector bundle from IV and the spectral central-character, supported-section and vacuum hypotheses of V give the formal rank-one unit argument on every nonempty component. Vacuum nonvanishing is a separate positivity premise. Paper III gives the supported comparison under full geometric Langlands for every proper Levi. Together with the actual unit-compatible monad and IV conservativity, the formal support and adjunction arguments give the equivalence. A full torus base, all proper Levi quotients, and the group and exceptional-genus comparisons complete semisimple-rank induction. Green cards are these conditional formal implications. Perfectness is explicitly a further premise; no spectral fundamental-group conclusion is inferred from simply connected automorphic G.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#314f64"/></marker></defs>
<style>
text{fill:#203246;font-family:'Segoe UI',Arial,sans-serif}
.heading{font-size:18px;font-weight:650}.body{font-size:15px}.small{font-size:14px}
.math{font-family:'Cambria Math',Cambria,Georgia,serif;font-size:21px}
.sub{font-size:12px;baseline-shift:sub}.sup{font-size:12px;baseline-shift:super}
.panel{fill:#fbfcfe;stroke:#cad5df;stroke-width:1.2}
.hyp{fill:#eee8fa;stroke:#7c62a5;stroke-width:1.1}
.positive{fill:#fff0cf;stroke:#a87925;stroke-width:1.1}
.proof{fill:#e9f5ed;stroke:#3f7b5c;stroke-width:1.2}
.arrow{stroke:#314f64;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<rect width="390" height="2470" fill="white"/>
<text x="20" y="38" class="heading" style="font-size:24px">The proof as a map</text>
<text x="20" y="66" class="body" style="font-size:19px">Five papers, specified maps</text>
<text x="20" y="94" class="small">de Rham; char(k) = 0; connected reductive G.</text>
<rect x="20" y="109" width="111" height="27" rx="6" class="hyp"/>
<text x="75.5" y="128" class="small" style="font-size:13px" text-anchor="middle">Geometric input</text>
<rect x="140" y="109" width="121" height="27" rx="6" class="positive"/>
<text x="200.5" y="128" class="small" style="font-size:12.5px" text-anchor="middle">Separate positivity</text>
<rect x="270" y="109" width="100" height="27" rx="6" class="proof"/>
<text x="320" y="128" class="small" style="font-size:13.5px" text-anchor="middle">Formal proof</text>
<rect x="20" y="150" width="350" height="180" rx="10" class="hyp"/>
<text x="35" y="180" class="heading">I • construction</text>
<text x="35" y="215" class="math" style="font-size:22px">L<tspan class="sub">G</tspan>: Dmod<tspan class="sub">1/2</tspan>(Bun<tspan class="sub">G</tspan>)</text>
<text x="75" y="246" class="math" style="font-size:22px">→ IndCoh<tspan class="sub">Nilp</tspan>(Y)</text>
<text x="35" y="276" class="math" style="font-size:17px">Y = LS<tspan class="sub">Ǧ</tspan>; U = Y<tspan class="sup">irred</tspan>; Z = Y<tspan class="sup">red</tspan></text>
<text x="35" y="308" class="small">Spectral-linear, normalized functor (H1).</text>
<path d="M195 330 V354" class="arrow"/>
<rect x="20" y="360" width="350" height="360" rx="10" class="panel"/>
<text x="35" y="390" class="heading">II + III: two inputs to IV</text>
<rect x="35" y="406" width="320" height="119" rx="7" class="hyp"/>
<text x="48" y="432" class="heading" style="font-size:16px">II • localization</text>
<text x="48" y="457" class="body">Critical localization and</text>
<text x="48" y="479" class="body">fundamental local equivalence.</text>
<text x="48" y="506" class="small">Actual right-adjoint square data.</text>
<rect x="35" y="541" width="320" height="150" rx="7" class="hyp"/>
<text x="48" y="567" class="heading" style="font-size:16px">III • Eisenstein reduction</text>
<text x="48" y="597" class="math" style="font-size:18px">F<tspan class="sub">G</tspan> ⊣ L<tspan class="sub">G</tspan>; unit-compatible A<tspan class="sub">G</tspan></text>
<text x="48" y="622" class="small">Proper-Levi and support comparison (H2).</text>
<text x="48" y="646" class="small">Actual left-adjoint square data.</text>
<text x="48" y="670" class="small">The same unit on reducible support.</text>
<text x="35" y="709" class="small">Both comparison squares feed IV.</text>
<path d="M195 720 V750" class="arrow"/>
<rect x="20" y="756" width="350" height="237" rx="10" class="hyp"/>
<text x="35" y="786" class="heading">IV • common adjoint and opers</text>
<text x="35" y="813" class="body">The actual normalized adjoints agree.</text>
<text x="35" y="843" class="math" style="font-size:22px">F<tspan class="sub">cusp</tspan> ≃ R<tspan class="sub">cusp</tspan> (15.A1)</text>
<text x="35" y="873" class="small">Compactness/perfectness: further premises.</text>
<text x="35" y="897" class="small">Oper homology and fibre bounds are inputs.</text>
<text x="35" y="925" class="body">H4: Aᵤ is a flat finite-monodromy bundle.</text>
<text x="35" y="953" class="body">H3: the actual L_G is conservative.</text>
<text x="35" y="978" class="small">Self-duality alone does not give perfectness.</text>
<path d="M195 993 V1017" class="arrow"/>
<rect x="20" y="1023" width="350" height="420" rx="10" class="hyp"/>
<text x="35" y="1053" class="heading">V • spectral topology and vacuum</text>
<text x="35" y="1080" class="small" style="font-size:13.5px">H5: spectral covers and central character lines.</text>
<text x="35" y="1112" class="math" style="font-size:20px">U = ⨿<tspan class="sub">α=1</tspan><tspan class="sup">c</tspan> U<tspan class="sub">α</tspan>; c = |Z(G)|</text>
<text x="35" y="1139" class="small">c nonempty open-and-closed components.</text>
<text x="35" y="1163" class="small">H6: supported H⁰ extension, also for twists.</text>
<text x="35" y="1187" class="small">H7: nontrivial twisted H⁰ vanish.</text>
<text x="35" y="1218" class="math" style="font-size:23px">dim<tspan class="sub">k</tspan> H<tspan class="sup">0</tspan>(Y,A<tspan class="sub">G</tspan>) = c</text>
<text x="35" y="1243" class="small">H5–H7: semisimple, large-genus branch.</text>
<text x="35" y="1267" class="small">g ≥ 2; at g = 2 exclude an A₁ factor here.</text>
<rect x="35" y="1282" width="320" height="132" rx="7" class="positive"/>
<text x="48" y="1308" class="heading" style="font-size:16px">Separate positivity (H7)</text>
<text x="48" y="1339" class="math" style="font-size:21px">n<tspan class="sub">α</tspan> ≥ 1 on every component</text>
<text x="48" y="1365" class="small">Vacuum nonvanishing is supplied.</text>
<text x="48" y="1391" class="small">Unitality does not exclude rank zero.</text>
<path d="M195 1443 V1467" class="arrow"/>
<rect x="20" y="1473" width="350" height="270" rx="10" class="proof"/>
<text x="35" y="1503" class="heading">Formal step: the unit on U</text>
<text x="35" y="1530" class="body">15.A: H⁰ extension uses H2 + H6.</text>
<text x="35" y="1557" class="body">15.B: matching twists inject kⁿ ↪ 0.</text>
<text x="195" y="1592" class="math" style="font-size:21px" text-anchor="middle">c ≤ ∑<tspan class="sub">α</tspan> n<tspan class="sub">α</tspan> ≤ c ⇒ n<tspan class="sub">α</tspan> = 1</text>
<text x="35" y="1619" class="body">All c components have rank one.</text>
<text x="35" y="1652" class="math" style="font-size:18.5px">u<tspan class="sub">U</tspan>(1) = a e; e² = b e ⇒ ab = 1</text>
<text x="195" y="1685" class="math" style="font-size:23px" text-anchor="middle">u<tspan class="sub">U</tspan>: 𝒪<tspan class="sub">U</tspan> → A<tspan class="sub">U</tspan></text>
<text x="195" y="1713" class="body" style="font-size:15px" text-anchor="middle">The specified open unit is invertible.</text>
<text x="35" y="1734" class="small">Proof: 15.A–15.B; 14.R6–14.R11.</text>
<path d="M195 1743 V1767" class="arrow"/>
<rect x="20" y="1773" width="350" height="254" rx="10" class="hyp"/>
<text x="35" y="1803" class="heading">III + IV + H8: global inputs</text>
<text x="35" y="1830" class="small">III: the supported S_Z(u) is an equivalence.</text>
<text x="35" y="1855" class="body">Use full GLC for every proper Levi.</text>
<text x="35" y="1885" class="math" style="font-size:17.5px">L<tspan class="sub">G</tspan>F<tspan class="sub">G</tspan> ≃ A<tspan class="sub">G</tspan>⋆(−), including the unit</text>
<text x="35" y="1911" class="small" style="font-size:13.5px">IV: conservativity. H8: all group-form changes.</text>
<text x="35" y="1936" class="small" style="font-size:13.5px">Exceptional irreducible units are separate inputs.</text>
<text x="35" y="1961" class="small" style="font-size:13px">Connected centres use torus/change-of-group data.</text>
<text x="35" y="1995" class="math" style="font-size:19px">rk<tspan class="sub">ss</tspan>(M) &lt; rk<tspan class="sub">ss</tspan>(G), proper Levi M</text>
<path d="M195 2027 V2051" class="arrow"/>
<rect x="20" y="2057" width="350" height="255" rx="10" class="proof"/>
<text x="35" y="2087" class="heading">Formal global assembly</text>
<text x="35" y="2115" class="body">15.C: open unit + supported unit</text>
<text x="35" y="2148" class="math" style="font-size:20px">⇒ K = cofib(u) = 0 ⇒ u invertible</text>
<text x="35" y="2176" class="body">15.D: monad unit + conservativity give</text>
<text x="195" y="2211" class="math" style="font-size:24px" text-anchor="middle">L<tspan class="sub">G</tspan>: 𝒞<tspan class="sub">G</tspan> ≃ 𝒟<tspan class="sub">G</tspan>; inverse F<tspan class="sub">G</tspan></text>
<text x="35" y="2243" class="small">15.E / 15.I1: semisimple-rank induction.</text>
<text x="35" y="2267" class="small">Full torus base; every proper Levi; all centres.</text>
<text x="35" y="2292" class="small">All conclusions retain the displayed inputs.</text>
<text x="20" y="2350" class="small">Figure 15.1. All five papers supply inputs.</text>
<text x="20" y="2374" class="small">Purple: actual geometry not proved here.</text>
<text x="20" y="2398" class="small">Green: the conditional formal deductions.</text>
<text x="20" y="2422" class="small">Proof locators: 15.A–15.E and 15.I1.</text>
<text x="20" y="2446" class="small">All geometric and foundational gaps remain open.</text>
</svg>
