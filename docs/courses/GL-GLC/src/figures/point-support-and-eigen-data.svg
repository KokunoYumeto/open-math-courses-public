<rect x="8" y="250" width="434" height="210" rx="14" fill="#f2f8ef" stroke="#426332"/>
<g font-family="Arial, sans-serif" fill="#162535">
<text x="225" y="44" text-anchor="middle" font-size="23">M = k[t]/(t²)</text>
<circle cx="130" cy="116" r="23" fill="white" stroke="#24577d"/><circle cx="320" cy="116" r="23" fill="white" stroke="#24577d"/>
<text x="130" y="123" text-anchor="middle" font-size="21">1</text><text x="320" y="123" text-anchor="middle" font-size="21">t</text>
<path d="M156,116 L283,116" fill="none" stroke="#24577d" stroke-width="2.5"/>
<path d="M293,116 L282,111 L282,121 Z" fill="#24577d"/>
<text x="225" y="101" text-anchor="middle" font-size="21">t · 1 = t</text>
<text x="320" y="162" text-anchor="middle" font-size="21">t · t = 0</text>
<text x="225" y="203" text-anchor="middle" font-size="20">support {0}; annihilator (t²)</text>
<text x="225" y="291" text-anchor="middle" font-size="23">Point pushforward i_* N</text>
<text x="225" y="354" text-anchor="middle" font-size="24">t acts by 0</text>
