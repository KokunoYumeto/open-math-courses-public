<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1360" viewBox="0 0 1120 1360" role="img" aria-labelledby="title desc">
<title id="title">Full complex Ran Hecke action, transitions and adjunctions</title>
<desc id="desc">Every finite-set function, the contravariant parameter arrow, full operator coefficient, output projection to Bun, dualizing normalization, compact dual adjunction and universal enhanced module category. Complex geometric ground field.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#324a65"/></marker></defs>
<rect width="1120" height="1360" fill="#fafbff"/>
<text x="35" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17263c">Full Ran Hecke action with operator coefficients</text>
<text x="35" y="75" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Complex ground field; every connected reductive group, genus and bundle component.</text>
<rect x="25" y="100" width="1070" height="183" rx="12" fill="#e9effb" stroke="#9baec6"/>
<text x="45" y="132" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">1. Dualizing parameter normalization — RA.1–RA.4</text>
<text x="45" y="169" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">R = (Ind Dᵇ Rep_fd(Ĝ))_Ran^dr,    M = Dmod(Bun_G(X))</text>
<text x="45" y="204" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#17263c">Ĥ_I(V; M) = H_I(V; M)[|I|],    Ĥ_I(1; M) = M ⊠ ω_Xᴵ</text>
<text x="45" y="239" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">Any α: I₁ → I₂:    (id × Δ_α)! Ĥ_I₁  ≃  Ĥ_I₂(mult^α V)</text>
<text x="45" y="268" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Empty fibres insert units. Collisions are unshifted; density and suspension signs agree.</text>
<rect x="25" y="299" width="1070" height="289" rx="12" fill="#edf6f2" stroke="#9baec6"/>
<text x="45" y="331" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">2. Every diagram transition — RA.7–RA.10; Solution 3.BC</text>
<text x="160" y="378" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">I₁ = {u,v}</text>
<text x="685" y="378" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">J₁ = {a,b,c}</text>
<text x="160" y="468" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">I₂ = {w}</text>
<text x="685" y="468" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">J₂ = {d,e}</text>
<path d="M307 373 L668 373" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="453" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">ψ₁: u,v ↦ a</text>
<path d="M307 463 L668 463" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="453" y="447" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">ψ₂: w ↦ d</text>
<path d="M215 391 L215 438" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="82" y="418" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">α: u,v ↦ w</text>
<path d="M755 438 L755 391" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="777" y="418" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">β: d,e ↦ a</text>
<text x="45" y="504" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">ψ₁ = β ψ₂ α.  The parameter arrow β points upward; its coordinate map is:</text>
<text x="45" y="540" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17263c">Δ_β: X³ → X²,   (x_a,x_b,x_c) ↦ (x_a,x_a)</text>
<text x="45" y="573" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">b,c are forgotten, d,e collide. For N = D_X³ on X = P¹:  (Δ_β)*N = i_diag,*D_X[−2].</text>
<rect x="25" y="604" width="1070" height="258" rx="12" fill="#f5f0fb" stroke="#9baec6"/>
<text x="45" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">3. Actual full stage action — RA.5–RA.15</text>
<text x="45" y="674" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#17263c">B_ψ = (id_Y × Δ_ψ)! Ĥ_I(V; M)</text>
<text x="45" y="711" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17263c">Φ_ψ(V,N;M) = p_Y,* (B_ψ ⊗! p_X! N)</text>
<text x="45" y="746" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">p_Y: Y × Xᴶ → Y is the output projection.  N is any full unbounded D-module.</text>
<text x="45" y="782" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Proper base change and projection formula:  Φ_ψ₂(mult^α V, Δ_β,*N) ≃ Φ_ψ₁(V,N)</text>
<text x="45" y="819" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Disjoint union + exterior parameters: Φ(A₁ ⋆ A₂) ≃ Φ(A₁)Φ(A₂); empty unit acts as Id.</text>
<text x="45" y="846" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Common chains and actual transfer bars give every coherent composition relation.</text>
<rect x="25" y="878" width="1070" height="206" rx="12" fill="#fff5e7" stroke="#9baec6"/>
<text x="45" y="910" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">4. Compact duals, the global half twist and derived parameters — RA.16–RA.18</text>
<text x="45" y="947" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">RHom(Φ(A)M,T) = RHom(M,Φ(A∨)T),    A compact in R</text>
<text x="45" y="981" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">The continuous right adjoint Φ(A∨) proves preservation of compact M.</text>
<text x="45" y="1015" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Half twist: Φᴸ = T⁻¹ΦT; actual P–Q operator factors cancel before pushforward.</text>
<text x="45" y="1051" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Any commutative DG C-algebra: full derived scalar extension, with its module bar.</text>
<rect x="25" y="1100" width="1070" height="234" rx="12" fill="#ffffff" stroke="#9baec6"/>
<text x="45" y="1132" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">5. Universal enhanced category — RA.19–RA.23</text>
<text x="45" y="1170" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">B = R ⊗ R,   N = M_L ⊗ R; first factor acts geometrically, second regularly.</text>
<text x="45" y="1209" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">H_univ = Funᴸ_B(R,N) = Mod_(R_R)(N),    R_R = ∫_(B∈R^c) B∨ ⊠ B</text>
<text x="45" y="1245" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">L ⊣ U; free images of all exterior compact generators generate H_univ.</text>
<text x="45" y="1281" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Still required: spectral coefficient functor, projector image and nilpotent regularity.</text>
<text x="45" y="1311" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">This is the complex action. Arbitrary geometric ground fields remain separate.</text>
</svg>
