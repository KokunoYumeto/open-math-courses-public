<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1200" viewBox="0 0 1120 1200" role="img" aria-labelledby="title desc">
<title id="title">Projective-line residue, normalized constant and dualizing D-modules</title>
<desc id="desc">For the projective line the overlap one-forms modulo the two chart contributions leave only dt over t, with residue one. A table gives the cohomology degrees of direct images of O, O shifted minus one, and O shifted plus one. The constant unit and the proper trace select their degree-zero summands. The regular D-module gives a nonholonomic proper-duality check, and the affine-line calculation shows why the proper right adjunction fails without properness.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#374151"/></marker>
</defs>
<style>
text{font-family:Arial,sans-serif;fill:#17253b}
.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.math{font-family:Georgia,serif;font-size:23px}
.card{fill:#f8fafc;stroke:#9eafc1;stroke-width:1.5}.blue{fill:#e8f2fd;stroke:#6395c9;stroke-width:1.5}.green{fill:#edf7f1;stroke:#5c9f79;stroke-width:1.5}.amber{fill:#fff5e7;stroke:#c29243;stroke-width:1.5}
.line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
.grid{stroke:#c4d0dc;stroke-width:1;fill:none}
</style>
<rect width="1120" height="1200" fill="white"/>
<text x="40" y="48" class="title">Two normalized objects, two structure-map adjunctions</text>
<text x="40" y="80" class="body">Y = P¹ over any characteristic-zero field; p : Y → Spec k</text>
<rect x="40" y="103" width="1040" height="224" rx="12" class="card"/>
<text x="62" y="138" class="head">The Čech residue fixes the trace and its sign</text>
<rect x="62" y="158" width="290" height="74" rx="8" class="blue"/>
<text x="80" y="187" class="body">t-chart: k[t] dt</text>
<text x="80" y="214" class="small">removes tᵐ dt for m ≥ 0</text>
<rect x="768" y="158" width="290" height="74" rx="8" class="blue"/>
<text x="786" y="187" class="body">u-chart: u = t⁻¹</text>
<text x="786" y="214" class="small">du = −t⁻² dt; removes m ≤ −2</text>
<path d="M362 196 H406" class="line"/><path d="M758 196 H714" class="line"/>
<text x="425" y="188" class="math">overlap quotient</text>
<text x="465" y="220" class="math">k · [dt/t]</text>
<text x="62" y="270" class="body">Exactly exponent −1 remains. The ordered residue sends [dt/t] to +1.</text>
<text x="62" y="302" class="small">A Laurent derivative cannot create exponent −1: its source exponent would be 0.</text>
<rect x="40" y="347" width="1040" height="269" rx="12" class="card"/>
<text x="62" y="382" class="head">Cohomology degrees: k[a] lies in degree −a</text>
<path d="M62 424 H1058 M62 478 H1058 M62 532 H1058 M62 586 H1058" class="grid"/>
<path d="M448 400 V586 M570 400 V586 M692 400 V586 M814 400 V586 M936 400 V586" class="grid"/>
<text x="72" y="415" class="small">direct image</text>
<text x="503" y="415" class="body">−2</text><text x="625" y="415" class="body">−1</text>
<text x="752" y="415" class="body">0</text><text x="874" y="415" class="body">1</text><text x="996" y="415" class="body">2</text>
<text x="72" y="459" class="math">p_* O = k[1] ⊕ k[−1]</text>
<text x="630" y="459" class="math">k</text><text x="874" y="459" class="math">k</text>
<text x="72" y="513" class="math">p_* 𝑘 = p_* O[−1]</text>
<rect x="714" y="488" width="78" height="34" rx="5" fill="#e0f1e7"/>
<text x="752" y="513" class="math">k</text><text x="996" y="513" class="math">k</text>
<text x="72" y="567" class="math">p_* ω = p_* O[1]</text>
<text x="508" y="567" class="math">k</text>
<rect x="714" y="542" width="78" height="34" rx="5" fill="#e0f1e7"/>
<text x="752" y="567" class="math">k</text>
<text x="62" y="603" class="small">The other two shifted summands are in opposite degrees.</text>
<rect x="40" y="636" width="504" height="164" rx="12" class="green"/>
<text x="62" y="670" class="head">Constant unit: p* ⊣ p_*</text>
<text x="62" y="708" class="math">η : k → p_* 𝑘 = k ⊕ k[−2]</text>
<text x="62" y="742" class="body">1 ↦ (1, 0)</text>
<text x="62" y="779" class="small">Selects the degree-zero constant class.</text>
<rect x="566" y="636" width="514" height="164" rx="12" class="green"/>
<text x="588" y="670" class="head">Proper trace: p_* ⊣ p!</text>
<text x="588" y="708" class="math">Tr : p_* ω = k[2] ⊕ k → k</text>
<text x="588" y="742" class="body">k[2] ↦ 0; [dt/t] ↦ 1</text>
<text x="588" y="779" class="small">Selects the degree-zero shifted top class.</text>
<rect x="40" y="820" width="1040" height="144" rx="12" class="blue"/>
<text x="62" y="854" class="head">All-coherent proper-duality check</text>
<text x="62" y="891" class="math">p_* D = k[−1];   p_* 𝔻(D) = k[1] = (p_* D)∨</text>
<text x="62" y="932" class="body">D is compact and nonholonomic: its characteristic support is the full T*P¹.</text>
<rect x="40" y="984" width="1040" height="160" rx="12" class="amber"/>
<text x="62" y="1018" class="head">Nonproper affine-line obstruction</text>
<text x="62" y="1055" class="math">p_* D = k[t];   p_* 𝔻(D) = k[t][1] ≠ k[t]∨</text>
<text x="62" y="1090" class="body">The proposed right-adjoint Hom spaces are in degrees −1 and 0.</text>
<text x="62" y="1123" class="small">The finite Spencer proof still gives the left adjunction on the full category.</text>
<text x="40" y="1181" class="small">Proof locators: GD.1–GD.6; Solutions3.AQ–3.AS; ordered projective residue in the earlier adjunction lesson.</text>
</svg>
