<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1460" viewBox="0 0 1120 1460" role="img" aria-labelledby="title desc"><title id="title">Nilpotent Hecke upper transport</title><desc id="desc">Exact graph characteristic relations preserve stratum tangent values. Proper ambient transport with a fixed finite cohomological window gives the all-genus nilpotent and zero-curve bound. Actual completed coefficients yield the full supported projector image in positive genus. Genus-zero torsion is separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31546b" /></marker><marker id="extra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b4c32" /></marker></defs><rect width="1120" height="1460" fill="white" /><text x="34" y="43" font-size="27" fill="#132f42" font-family="Arial, sans-serif">Nilpotent Hecke upper transport</text><rect x="28" y="72" width="1064" height="305" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="110" font-size="23" fill="#132f42" font-family="Arial, sans-serif">1. Algebraic graph comparison on a singular closed source</text><text x="70" y="156" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">A₁₂ = (Γ<tspan baseline-shift="sub" font-size="20.88">f</tspan>)₊ A₁ = (Γ<tspan baseline-shift="sub" font-size="20.88">g</tspan>)₊ A₂</text><text x="70" y="209" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">β₁ ∈ Ch(A₁)  ⇒  (β₁,0) ∈ Ch(A₁₂)</text><text x="70" y="262" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">β₂ = dgᵗβ₁ ∈ Ch(A₂)</text><text x="70" y="313" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">β₂(de₂v) = β₁(de₁v)  for v ∈ T<tspan baseline-shift="sub" font-size="19.44">zS</tspan></text><text x="70" y="359" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Actual stratum tangents; no identification of ambient conormals. NHT.4–7.</text><rect x="28" y="397" width="1064" height="300" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="435" font-size="23" fill="#132f42" font-family="Arial, sans-serif">2. Proper transport of every finite coherent source piece</text><text x="70" y="483" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">π : M → B × X proper;  Z ↪ M;  M smooth</text><text x="70" y="536" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">Input ξ₁ nilpotent ⇒ ξ₂ nilpotent, ξ<tspan baseline-shift="sub" font-size="19.44">X</tspan> = 0</text><text x="70" y="589" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">Ch Hʲ(π₊A) ⊂ Nilp<tspan baseline-shift="sub" font-size="20.88">B</tspan> × 0<tspan baseline-shift="sub" font-size="20.88">X</tspan></text><text x="70" y="643" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Graph comparison → orbit annihilator → compatible Higgs fields → residue.</text><text x="70" y="680" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Arbitrary coherent proper upper bound; no input regularity. NHT.18–21.</text><rect x="28" y="717" width="1064" height="280" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="755" font-size="23" fill="#132f42" font-family="Arial, sans-serif">3. Both infinite tails: one finite window for output degree n</text><text x="70" y="804" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">l = n − b − 1;   u = n − a + 1</text><text x="70" y="857" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">E → τ<tspan baseline-shift="super" font-size="20.88">≥l</tspan>E ← τ<tspan baseline-shift="super" font-size="20.88">≤u</tspan>τ<tspan baseline-shift="super" font-size="20.88">≥l</tspan>E</text><text x="70" y="909" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">Discarded output tails:  ≤ n−2  and  ≥ n+2</text><text x="70" y="963" font-size="21" fill="#132f42" font-family="Arial, sans-serif">Hⁿπ₊ sees this finite window. No inverse-limit exchange. NHT.22–25.</text><rect x="28" y="1017" width="1064" height="415" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="1055" font-size="23" fill="#132f42" font-family="Arial, sans-serif">4. Completed coefficients and the precise genus conclusion</text><text x="70" y="1103" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">All genera:  H<tspan baseline-shift="sub" font-size="20.16">V</tspan>(F) ∈ Dmod(Y) ⊗ Q<tspan baseline-shift="sub" font-size="20.16">X</tspan></text><text x="70" y="1158" font-size="21" fill="#132f42" font-family="Arial, sans-serif">All original operator actions, kernel maps and higher maps are retained.</text><text x="70" y="1215" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">g(X) &gt; 0:  Q<tspan baseline-shift="sub" font-size="20.88">X</tspan> = I<tspan baseline-shift="sub" font-size="20.88">X</tspan></text><text x="70" y="1270" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">S<tspan baseline-shift="sub" font-size="20.16">Y</tspan> = N<tspan baseline-shift="sub" font-size="20.16">Hl</tspan>(Y) = EssIm(Π<tspan baseline-shift="sub" font-size="20.16">res</tspan>) ⊂ R_∞(Y)</text><text x="70" y="1327" font-size="25" fill="#783e2b" font-family="Cambria Math, Georgia, serif">g(X) = 0:  actual u²-torsion is GZR.24–GZR.32.</text><text x="70" y="1388" font-size="21" fill="#132f42" font-family="Arial, sans-serif">NHT.26–33; complex coefficients, every connected reductive group.</text></svg>