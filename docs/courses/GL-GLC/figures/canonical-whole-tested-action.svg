<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1500" viewBox="0 0 1120 1500" role="img" aria-labelledby="title desc">
<title id="title">Whole kernel actions on pure directional coefficients</title>
<desc id="desc">The typed operation WTA.4, whole incidence equivariance WTA.15, and the finite free resolution solution test WTA.20. Coefficient cohomology is in degree one. All finite Hom degrees are retained.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1500" fill="#f8fafc"/>
<text x="42" y="54" font-family="Georgia,serif" font-size="38" fill="#17324b" font-weight="bold">Whole kernel actions on pure tests</text>
<text x="42" y="98" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Complex dimension N ≥ 1 · matched nonzero time directions p, q</text>
<rect x="32" y="128" width="1056" height="390" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="178" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">1  One typed coefficient operation</text>
<text x="65" y="231" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">kernel section in μhom(J, Ωinput[N])</text>
<text x="65" y="279" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">coefficient in μhom(A, OY)</text>
<line x1="780" y1="219" x2="780" y2="307" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="65" y="341" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Full four-entry cup · eight entries for associativity</text>
<text x="65" y="383" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Actual proper-support comparison and common collar</text>
<text x="65" y="425" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">Normalized density trace → μhom(ΦJ A, OX)</text>
<text x="65" y="479" font-family="Georgia,serif" font-size="25" fill="#17667d" font-weight="normal">WTA.4–WTA.12 · boundaries remain boundaries</text>
<rect x="32" y="544" width="1056" height="430" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="596" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">2  Every whole germ intertwines</text>
<text x="163" y="661" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">VY</text>
<text x="743" y="661" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">VX</text>
<line x1="260" y1="649" x2="685" y2="649" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="457" y="631" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="normal">β</text>
<line x1="187" y1="689" x2="187" y2="802" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="84" y="754" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="normal">r</text>
<line x1="768" y1="689" x2="768" y2="802" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="818" y="754" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="normal">ρ(r)</text>
<text x="163" y="851" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">VY</text>
<text x="743" y="851" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">VX</text>
<line x1="260" y1="838" x2="685" y2="838" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="457" y="820" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="normal">β</text>
<text x="65" y="908" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">β r = ρ(r) β   ·   sole coefficient degree: 1</text>
<text x="65" y="951" font-family="Georgia,serif" font-size="24" fill="#17667d" font-weight="normal">WTA.13–WTA.18 · fixed parameter-zero normalization</text>
<rect x="32" y="1000" width="1056" height="425" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="1052" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">3  Finite resolutions and actual solution tests</text>
<text x="65" y="1110" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Finite free differential resolutions PY and PX</text>
<text x="65" y="1161" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Extend to B exactly: HGT.8–HGT.9</text>
<text x="65" y="1212" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Use the given B-module isomorphism: WTA.19</text>
<text x="65" y="1263" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Apply Hom into V[−1], retaining every degree</text>
<text x="65" y="1314" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Keep finite maps and signed Hom homotopies</text>
<text x="65" y="1376" font-family="Georgia,serif" font-size="26" fill="#17667d" font-weight="normal">Actual compared solution tests: WTA.20–WTA.22</text>
<text x="42" y="1471" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">A conservative family of tests is a further condition for support equality.</text>
</svg>
