<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1840" viewBox="0 0 1120 1840" role="img" aria-labelledby="title desc">
<title id="title">Full unbounded support on actual chart arrows</title>
<desc id="desc">A smooth common chart W with projections p and q and section sigma proves noncharacteristicity of any chart arrow f. A finite graph Koszul strip, with unbounded internal cohomology, has vanishing positive Tor columns; its surviving zero column gives H j of f exclamation Q equal to f star H j plus r of Q.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1840" fill="#f8fafc"/>
<text x="42" y="54" text-anchor="start" font-family="Georgia,serif" font-size="36" fill="#17324b" font-weight="bold">Full unbounded support on actual charts</text>
<text x="42" y="99" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Common-chart section · finite graph transfer · NCS.1–NCS.23</text>
<rect x="32" y="128" width="1056" height="460" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="182" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="bold">1  A chart arrow has an actual common-chart section</text>
<text x="515" y="250" text-anchor="start" font-family="Georgia,serif" font-size="36" fill="#17324b" font-weight="normal">W</text>
<text x="220" y="419" text-anchor="start" font-family="Georgia,serif" font-size="36" fill="#17324b" font-weight="normal">U</text>
<text x="860" y="419" text-anchor="start" font-family="Georgia,serif" font-size="36" fill="#17324b" font-weight="normal">V</text>
<line x1="512" y1="275" x2="274" y2="376" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="565" y1="275" x2="832" y2="376" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="280" y1="405" x2="820" y2="405" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="209" y1="374" x2="473" y2="259" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="362" y="327" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">p</text>
<text x="708" y="327" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">q</text>
<text x="532" y="448" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">f</text>
<text x="240" y="293" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">σ</text>
<text x="65" y="504" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">pσ = 1, qσ = f; both p and q are smooth.</text>
<text x="65" y="558" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">The arrow f itself may be a section or a ramified map.</text>
<rect x="32" y="615" width="1056" height="350" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="670" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">2  Compatible covectors — NCS.3–NCS.4</text>
<text x="65" y="730" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">The cotangent pullbacks of Λ(U) and Λ(V) agree on W.</text>
<text x="65" y="789" text-anchor="start" font-family="Georgia,serif" font-size="32" fill="#17324b" font-weight="normal">dqᵗη = dpᵗξ  ⇒  ξ = dfᵗη</text>
<text x="65" y="847" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">dfᵗη = 0  ⇒  η = 0: no nonzero kernel covector.</text>
<text x="65" y="914" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Higgs fields give this compatibility for every bundle chart.</text>
<rect x="32" y="992" width="1056" height="720" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="1047" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">3  A finite graph strip for all internal degrees</text>
<text x="65" y="1104" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Tor row k, input degree j → output degree j − k (NCS.16)</text>
<text x="128" y="1182" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">j ∈ Z</text>
<text x="280" y="1182" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">−dim V</text>
<text x="450" y="1182" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">…</text>
<text x="640" y="1182" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">−1</text>
<text x="880" y="1182" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">0</text>
<text x="155" y="1268" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">1</text>
<rect x="215" y="1235" width="130" height="50" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<text x="280" y="1269" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#66717b" font-weight="normal">0</text>
<rect x="575" y="1235" width="130" height="50" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<text x="640" y="1269" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#66717b" font-weight="normal">0</text>
<text x="450" y="1268" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">…</text>
<rect x="795" y="1235" width="170" height="50" rx="7" fill="#d8f1e5" stroke="#79ad95"/>
<text x="880" y="1268" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#185b42" font-weight="normal">f*H¹Q</text>
<text x="155" y="1338" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">0</text>
<rect x="215" y="1305" width="130" height="50" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<text x="280" y="1339" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#66717b" font-weight="normal">0</text>
<rect x="575" y="1305" width="130" height="50" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<text x="640" y="1339" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#66717b" font-weight="normal">0</text>
<text x="450" y="1338" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">…</text>
<rect x="795" y="1305" width="170" height="50" rx="7" fill="#d8f1e5" stroke="#79ad95"/>
<text x="880" y="1338" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#185b42" font-weight="normal">f*H⁰Q</text>
<text x="155" y="1408" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">−1</text>
<rect x="215" y="1375" width="130" height="50" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<text x="280" y="1409" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#66717b" font-weight="normal">0</text>
<rect x="575" y="1375" width="130" height="50" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<text x="640" y="1409" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#66717b" font-weight="normal">0</text>
<text x="450" y="1408" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">…</text>
<rect x="795" y="1375" width="170" height="50" rx="7" fill="#d8f1e5" stroke="#79ad95"/>
<text x="880" y="1408" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#185b42" font-weight="normal">f*H⁻¹Q</text>
<line x1="190" y1="1230" x2="190" y2="1200" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="190" y1="1430" x2="190" y2="1470" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="65" y="1545" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">Only k = 0 survives: Hʲ(Lf*Q) = f*HʲQ.</text>
<text x="65" y="1605" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">NCS.17: Hʲ(f!Q) = f*Hʲ⁺ʳQ,  r = dim U − dim V.</text>
<text x="65" y="1670" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">No regularity assumption is used for this full support transfer.</text>
<text x="42" y="1774" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">Supported regular ind-descent follows; equality with all nilpotent</text>
<text x="42" y="1820" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">objects still requires regularity and supported compact factorization.</text>
</svg>
