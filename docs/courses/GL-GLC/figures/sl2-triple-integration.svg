<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc">
<title id="title">Integrating the triple with exact cocharacter weights</title>
<desc id="desc">The group triangle SL2 to G to GL(V) commutes. The two additive root subgroups map to nilpotent exponentials. SL3 standard weights are 2,0,-2. The PGL2 exact root weights are 2,-2, whereas primitive weights are 1,-1.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#536b80"/></marker></defs>
<rect width="1040" height="820" fill="#fcfcfa"/>
<text x="35" y="40" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="bold" text-anchor="start">Integrating a Lie triple, with its exact integer weights</text>
<text x="35" y="76" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">Characteristic zero · a given triple over k · smooth affine G · no analytic integration</text>
<rect x="30" y="100" width="980" height="262" rx="10" fill="#edf3f8" stroke="#cfd9e3"/>
<rect x="65" y="132" width="210" height="90" rx="10" fill="#edf3f8" stroke="#cfd9e3"/>
<rect x="415" y="132" width="210" height="90" rx="10" fill="#eaf5ed" stroke="#cfd9e3"/>
<rect x="765" y="132" width="210" height="90" rx="10" fill="#edf3f8" stroke="#cfd9e3"/>
<text x="170" y="172" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="bold" text-anchor="middle">SL₂</text>
<text x="520" y="172" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="bold" text-anchor="middle">G</text>
<text x="870" y="172" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="bold" text-anchor="middle">GL(V)</text>
<text x="170" y="202" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">polynomial strings</text>
<text x="520" y="202" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">the original group</text>
<text x="870" y="202" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">faithful finite V</text>
<path d="M280,177 L407,177" stroke="#536b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="342" y="159" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="middle">r</text>
<path d="M630,177 L756,177" stroke="#536b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="695" y="157" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">ρ: closed immersion</text>
<path d="M170,225 L170,283 L870,283 L870,228" stroke="#536b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="520" y="268" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="middle">R = ρ ∘ r</text>
<text x="520" y="322" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">dr = φ: sl₂ → Lie(G) · λ(t) = r(diag(t,t⁻¹)) · dλ(1) = h</text>
<text x="35" y="405" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="start">The two additive root subgroups stay inside G</text>
<rect x="30" y="427" width="980" height="125" rx="10" fill="#f1f5f9" stroke="#cfd9e3"/>
<text x="65" y="467" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start">u₊(s)</text>
<path d="M173,461 L321,461" stroke="#536b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="342" y="467" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">exp(sN₊) = Σ sʲN₊ʲ / j! ∈ G,  N₊ = dρ(e)</text>
<text x="65" y="511" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start">u₋(s)</text>
<path d="M173,505 L321,505" stroke="#536b80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="342" y="511" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">exp(sN₋) = Σ sʲN₋ʲ / j! ∈ G,  N₋ = dρ(f)</text>
<text x="65" y="540" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Both sums run from j = 0 to dim(V) − 1.</text>
<text x="35" y="585" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="start">Exact weights and the primitive-cocharacter distinction</text>
<rect x="30" y="607" width="475" height="151" rx="10" fill="#eaf5ed" stroke="#cfd9e3"/>
<rect x="523" y="607" width="487" height="151" rx="10" fill="#edf3f8" stroke="#cfd9e3"/>
<text x="52" y="638" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="start">SL₃: homogeneous degree two</text>
<text x="52" y="670" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">basis u², uv, v²/2</text>
<text x="52" y="702" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" text-anchor="start">λ(t) = diag(t², 1, t⁻²)</text>
<text x="52" y="735" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" text-anchor="start">standard weights: 2, 0, −2</text>
<text x="544" y="638" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">PGL₂: same sign cuts, different indices</text>
<text x="544" y="672" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">exact triple: [diag(t²,1)]  →  +2, −2</text>
<text x="544" y="704" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">primitive: [diag(t,1)]       →  +1, −1</text>
<text x="544" y="736" fill="#202d39" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">The full intrinsic filtration uses exact weights.</text>
<text x="35" y="792" fill="#49647b" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Proof: Lemma 6.2a · GI.1–GI.15 · checked solutions 6.D–6.F</text>
</svg>
