<?xml version='1.0' encoding='utf8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1460" viewBox="0 0 1120 1460" role="img" aria-labelledby="title desc"><title id="title">Holonomic factors on a proper curve</title><desc id="desc">Proper relative horizontal Hom and its actual fibre evaluation split a simple connection without regularity on the base. Actual holonomic middle extension, finite extensions and full operator-action bars give ind-connection or completed curve coefficients with their precise genus scope.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31546b" /></marker><marker id="extra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b4c32" /></marker></defs><rect width="1120" height="1460" fill="white" /><text x="34" y="43" font-size="27" fill="#132f42" font-family="Arial, sans-serif">Holonomic factors on a proper curve</text><rect x="28" y="72" width="1064" height="295" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="110" font-size="23" fill="#132f42" font-family="Arial, sans-serif">1. Proper horizontal Hom, with the actual shift</text><text x="70" y="158" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">W = L<tspan baseline-shift="super" font-size="19.44">∨</tspan> ⊗ V on U × X;  X smooth projective</text><text x="70" y="213" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">C<tspan baseline-shift="sub" font-size="20.16">L</tspan>(V) = Rp<tspan baseline-shift="sub" font-size="20.16">U,*</tspan> DR<tspan baseline-shift="sub" font-size="20.16">X</tspan>(W)</text><text x="70" y="268" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">M<tspan baseline-shift="sub" font-size="20.16">L</tspan>(V) = H<tspan baseline-shift="super" font-size="20.16">0</tspan> C<tspan baseline-shift="sub" font-size="20.16">L</tspan>(V) = H<tspan baseline-shift="super" font-size="20.16">−1</tspan> p<tspan baseline-shift="sub" font-size="20.16">U,+</tspan>(W)</text><text x="70" y="314" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">M<tspan baseline-shift="sub" font-size="19.44">L</tspan>(V)|<tspan baseline-shift="sub" font-size="19.44">u</tspan> = Hom<tspan baseline-shift="sub" font-size="19.44">𝒟X</tspan>(L,V<tspan baseline-shift="sub" font-size="19.44">u</tspan>)</text><text x="70" y="351" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Finite connection on U; regularity at the boundary of U is not assumed.</text><rect x="28" y="387" width="1064" height="270" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="425" font-size="23" fill="#132f42" font-family="Arial, sans-serif">2. Actual evaluation for simple V and irreducible L</text><text x="300" y="482" font-size="31" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">M<tspan baseline-shift="sub" font-size="22.32">L</tspan>(V) ⊠ L</text><text x="878" y="482" font-size="32" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">V</text><line x1="475" y1="469" x2="814" y2="469" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="644.5" y="456.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">ev</text><text x="70" y="537" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">End<tspan baseline-shift="sub" font-size="18.72">𝒟X</tspan>(L) = C ⇒ each fibre evaluation is injective.</text><text x="70" y="587" font-size="22" fill="#132f42" font-family="Arial, sans-serif">The image is nonzero; simplicity of V makes ev an isomorphism.</text><text x="70" y="632" font-size="20" fill="#132f42" font-family="Arial, sans-serif">HCF.5–HCF.16; no regular Riemann–Hilbert comparison is needed.</text><rect x="28" y="677" width="1064" height="300" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="715" font-size="23" fill="#132f42" font-family="Arial, sans-serif">3. Singular support, boundary extension and finite constructions</text><text x="70" y="764" font-size="31" fill="#132f42" font-family="Cambria Math, Georgia, serif">N = (j<tspan baseline-shift="sub" font-size="22.32">!*</tspan> E<tspan baseline-shift="sub" font-size="22.32">U</tspan>) ⊠ L</text><text x="70" y="818" font-size="21" fill="#132f42" font-family="Cambria Math, Georgia, serif">j<tspan baseline-shift="sub" font-size="15.12">*</tspan> and j<tspan baseline-shift="sub" font-size="15.12">!</tspan> retain the finite curve factor and their canonical map.</text><text x="70" y="871" font-size="21" fill="#132f42" font-family="Arial, sans-serif">Finite holonomic extensions lift through the full external category.</text><text x="70" y="923" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">Bounded below:  K ∈ H<tspan baseline-shift="sub" font-size="20.16">B</tspan> ⊗ I<tspan baseline-shift="sub" font-size="20.16">X</tspan></text><text x="70" y="959" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Actual image and comparison in Dmod(B × X); HCF.17–HCF.28.</text><rect x="28" y="997" width="1064" height="435" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="1035" font-size="23" fill="#132f42" font-family="Arial, sans-serif">4. Both infinite tails retain the whole affine operator action</text><text x="70" y="1085" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">U<tspan baseline-shift="sub" font-size="19.44">B</tspan> K = p<tspan baseline-shift="sub" font-size="19.44">X,*</tspan> oblv<tspan baseline-shift="sub" font-size="19.44">B-D</tspan>(K);  R = D(B)</text><text x="70" y="1141" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">H<tspan baseline-shift="super" font-size="20.88">m</tspan>(U<tspan baseline-shift="sub" font-size="20.88">B</tspan> K) ∈ Ind Conn<tspan baseline-shift="sub" font-size="20.88">f</tspan>(X)</text><text x="70" y="1198" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">K̃ ∈ R-Mod(Q<tspan baseline-shift="sub" font-size="20.88">X</tspan>);  J<tspan baseline-shift="sub" font-size="20.88">B</tspan><tspan baseline-shift="super" font-size="20.88">Q</tspan> K̃ ≅ K</text><text x="70" y="1254" font-size="22" fill="#132f42" font-family="Arial, sans-serif">All action faces, units and higher maps lift through full j<tspan baseline-shift="sub" font-size="15.84">X</tspan>.</text><text x="70" y="1310" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">g(X) &gt; 0: Q<tspan baseline-shift="sub" font-size="18.0">X</tspan> = I<tspan baseline-shift="sub" font-size="18.0">X</tspan>;   g(X) = 0: I<tspan baseline-shift="sub" font-size="18.0">X</tspan> is u²-torsion.</text><text x="70" y="1367" font-size="21" fill="#783e2b" font-family="Arial, sans-serif">GZR.24–GZR.32 give the genus-zero restricted coefficient refinement.</text><text x="70" y="1410" font-size="20" fill="#132f42" font-family="Arial, sans-serif">HCF.29–HCF.40; arbitrary holonomic base factors may be irregular.</text></svg>