<line x1="365" y1="549" x2="475" y2="549" stroke="#617083" stroke-width="2" marker-end="url(#a)"/>
<line x1="555" y1="549" x2="665" y2="549" stroke="#617083" stroke-width="2" marker-end="url(#a)"/>
<line x1="745" y1="549" x2="855" y2="549" stroke="#617083" stroke-width="2" marker-end="url(#a)"/>
<text x="281" y="539" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">ad(e): +2</text>
<line x1="415" y1="771" x2="170" y2="771" stroke="#617083" stroke-width="2" marker-end="url(#a)"/>
<text x="432" y="777" font-family="Arial, sans-serif" font-size="17" fill="#202a36" text-anchor="start">ad(f): −2</text>
<text x="35" y="807" font-family="Arial, sans-serif" font-size="15" fill="#535e6b" text-anchor="start">Weight movement arrows; no rank assertion · V(4) ⊕ V(2) · Proof: LT.8–LT.10 and Exercise 6.B</text>
