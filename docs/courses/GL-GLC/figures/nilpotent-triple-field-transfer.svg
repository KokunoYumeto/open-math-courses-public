<text x="515" y="663" font-family="Arial, sans-serif" font-size="19" fill="#202a36" text-anchor="middle">H₂₃</text>
<text x="515" y="696" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">mult. 2</text>
<text x="705" y="602" font-family="Arial, sans-serif" font-size="25" fill="#202a36" text-anchor="middle" font-weight="bold">2</text>
<text x="705" y="639" font-family="Arial, sans-serif" font-size="19" fill="#202a36" text-anchor="middle">E₁₂</text>
<text x="705" y="663" font-family="Arial, sans-serif" font-size="19" fill="#202a36" text-anchor="middle">E₂₃</text>
<text x="705" y="696" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">mult. 2</text>
<text x="895" y="602" font-family="Arial, sans-serif" font-size="25" fill="#202a36" text-anchor="middle" font-weight="bold">4</text>
<text x="895" y="639" font-family="Arial, sans-serif" font-size="19" fill="#202a36" text-anchor="middle">E₁₃</text>
