<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc">
<title id="title">Nilpotent triples over every algebraically closed characteristic-zero field</title>
<desc id="desc">A finite bracket table descends to K zero, which embeds separately in the complex numbers and in the original field k. Properness of the ideal of triple equations transfers between them; no map from k to the complex numbers is asserted. In sl3 the explicit triple has adjoint weights minus four, minus two, zero, two, four with multiplicities one, two, two, two, one. The filtration F zero has dimension five and F one equals F two has dimension three.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#617083"/></marker></defs>
<rect width="1040" height="820" fill="#fcfcf9"/>
<text x="35" y="40" font-family="Arial, sans-serif" font-size="26" fill="#202a36" text-anchor="start" font-weight="bold">The full field scope of a nilpotent Lie triple</text>
<text x="35" y="74" font-family="Arial, sans-serif" font-size="19" fill="#202a36" text-anchor="start">The bracket table is finite; the whole ground field need not fit inside ℂ.</text>
<rect x="30" y="97" width="980" height="327" rx="9" fill="#eef2f6" stroke="#d4dae1"/>
<rect x="300" y="113" width="440" height="70" rx="9" fill="#fcfcf9" stroke="#d4dae1"/>
<text x="520" y="140" font-family="Arial, sans-serif" font-size="20" fill="#202a36" text-anchor="middle" font-weight="bold">K₀ = field generated by the finite data</text>
<text x="520" y="167" font-family="Arial, sans-serif" font-size="17" fill="#202a36" text-anchor="middle">bracket constants and coordinates of e</text>
<line x1="385" y1="187" x2="245" y2="235" stroke="#617083" stroke-width="2" marker-end="url(#a)"/>
<line x1="655" y1="187" x2="795" y2="235" stroke="#617083" stroke-width="2" marker-end="url(#a)"/>
<text x="263" y="207" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="middle">chosen embedding</text>
<text x="777" y="207" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="middle">original inclusion</text>
<rect x="75" y="242" width="370" height="79" rx="9" fill="#edf5fb" stroke="#d4dae1"/>
<rect x="595" y="242" width="370" height="79" rx="9" fill="#eaf5ed" stroke="#d4dae1"/>
<text x="260" y="270" font-family="Arial, sans-serif" font-size="20" fill="#202a36" text-anchor="middle" font-weight="bold">ℂ: the complex Lie proof</text>
<text x="260" y="298" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="middle">gives h, f satisfying the same equations</text>
<text x="780" y="270" font-family="Arial, sans-serif" font-size="20" fill="#202a36" text-anchor="middle" font-weight="bold">k: algebraically closed, char 0</text>
<text x="780" y="298" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="middle">the Nullstellensatz gives h, f</text>
<text x="520" y="346" font-family="Arial, sans-serif" font-size="20" fill="#202a36" text-anchor="middle">I = ([h,e] − 2e, [h,f] + 2f, [e,f] − h)</text>
<text x="520" y="376" font-family="Arial, sans-serif" font-size="18" fill="#202a36" text-anchor="middle">A complex solution proves I is proper over K₀.</text>
<text x="520" y="402" font-family="Arial, sans-serif" font-size="17" fill="#202a36" text-anchor="middle">Finite coefficient comparison keeps I proper over k (LT.1, LT.7).</text>
<text x="35" y="461" font-family="Arial, sans-serif" font-size="23" fill="#202a36" text-anchor="start" font-weight="bold">Exact sl₃ example, defined over ℚ</text>
<text x="35" y="492" font-family="Arial, sans-serif" font-size="21" fill="#202a36" text-anchor="start">e = E₁₂ + E₂₃;   h = diag(2,0,−2);   f = 2E₂₁ + 2E₃₂</text>
<rect x="32" y="525" width="976" height="222" rx="9" fill="#f2f4f6" stroke="#d4dae1"/>
<rect x="487" y="566" width="495" height="159" rx="9" fill="#eaf5ed" stroke="#9bc7a4"/>
<rect x="679" y="575" width="293" height="139" rx="9" fill="#edf5fb" stroke="#91b9d3"/>
<text x="505" y="738" font-family="Arial, sans-serif" font-size="17" fill="#397849" text-anchor="start">F⁰: dimension 5</text>
<text x="685" y="738" font-family="Arial, sans-serif" font-size="17" fill="#174f88" text-anchor="start">F¹ = F²: dimension 3</text>
