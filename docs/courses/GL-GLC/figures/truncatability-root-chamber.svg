<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="915" viewBox="0 0 1000 915" role="img" aria-labelledby="title desc">
<title id="title">A bounded A2 chamber and its opposite-parabolic contraction fibre</title>
<desc id="desc">Genus two, cutoff theta with coroot coefficients two and two. The admissible segment from lambda three and five to its Levi projection five-halves and five stays outside that cutoff. The associated SL3 Levi bundle has line degrees three, two and minus five; its negative-radical extension fibre has dimension seventeen and contracts by multiplication by t cubed. A separate exact lattice panel shows the three solutions to q1 plus twice q2 equals four, each retaining a free degree-minus-one exterior-algebra action in the two-variable Cartan model.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#345d81"/></marker></defs>
