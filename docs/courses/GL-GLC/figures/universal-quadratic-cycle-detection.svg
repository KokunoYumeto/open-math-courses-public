<text x="560" y="48" class="title" text-anchor="middle">A submersive target test and a source cycle section</text>
<text x="560" y="91" class="" text-anchor="middle">f(z) = z³;  g(q,t) = t + qt²/2;  h(q,z) = z³ + qz⁶/2</text>
<text x="270" y="159" class="title" text-anchor="middle">Source Q × A¹z</text>
<text x="850" y="159" class="title" text-anchor="middle">Target Q × A¹t</text>
<path class="axis" d="M80,355 L455,355"/>
<path class="axis" d="M270,395 L270,220"/>
<path class="axis" d="M660,355 L1035,355"/>
<path class="axis" d="M850,395 L850,220"/>
<text x="458" y="387" class="small" text-anchor="start">q</text>
<text x="287" y="230" class="small" text-anchor="start">z</text>
<text x="1039" y="387" class="small" text-anchor="start">q</text>
<text x="866" y="230" class="small" text-anchor="start">t</text>
<path class="section" d="M120,355 L420,355"/>
<path class="section" d="M700,355 L1000,355"/>
<text x="270" y="426" class="" text-anchor="middle">T : z = 0</text>
<text x="850" y="426" class="" text-anchor="middle">b(Q) : t = 0</text>
<text x="270" y="194" class="small" text-anchor="middle">dq h = z⁶/2;  dz h = 3z²(1+qz³)</text>
<text x="850" y="194" class="small" text-anchor="middle">dq g = t²/2;  dt g = 1+qt</text>
<path class="map" d="M480,355 L625,355"/>
<text x="552" y="326" class="" text-anchor="middle">fQ</text>
<text x="270" y="469" class="small" text-anchor="middle">dh = 0 along the complex section</text>
<text x="850" y="469" class="small" text-anchor="middle">dg = dt ≠ 0 along the complex section</text>
<path class="map" d="M710,350 L710,277"/>
<path class="map" d="M990,350 L990,277"/>
<text x="850" y="266" class="small" text-anchor="middle">nonzero dt covector direction</text>
<text x="560" y="542" class="small" text-anchor="middle">Upper drawings: real coordinate sections; each parameter line is complex.</text>
<path d="M40,579 L1080,579" stroke="#b8c6cf" stroke-width="1.5"/>
<text x="560" y="635" class="title" text-anchor="middle">The actual normal fibre at q = 0 and h = 1/64</text>
<path class="axis" d="M120,858 L413,858"/>
<path class="axis" d="M265,1003 L265,713"/>
<circle cx="265" cy="858" r="100.0" fill="none" stroke="#b8c6cf" stroke-width="1.4"/>
