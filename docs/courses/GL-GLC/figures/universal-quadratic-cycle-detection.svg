<circle class="point" cx="215.00000" cy="771.39746" r="7"/>
<circle class="point" cx="215.00000" cy="944.60254" r="7"/>
<text x="397" y="846" class="small" text-anchor="start">1/4</text>
<text x="180" y="744" class="small" text-anchor="start">ζ/4</text>
<text x="171" y="985" class="small" text-anchor="start">ζ²/4</text>
<text x="284" y="886" class="small" text-anchor="start">0</text>
<text x="416" y="888" class="small" text-anchor="start">Re z</text>
<text x="281" y="710" class="small" text-anchor="start">Im z</text>
<text x="265" y="1040" class="" text-anchor="middle">ζ = exp(2πi/3)</text>
<text x="265" y="1081" class="small" text-anchor="middle">one value loop cycles the three roots</text>
<rect x="535" y="715" width="540" height="380" rx="12" fill="#edf5f7" stroke="#6f95a8" stroke-width="1.5"/>
<text x="805" y="762" class="" text-anchor="middle">The specified central map</text>
<text x="805" y="814" class="title" text-anchor="middle">C[1]  →  C³[1]</text>
<text x="805" y="852" class="small" text-anchor="middle">the diagonal, on the normal slice</text>
<text x="805" y="907" class="" text-anchor="middle">V₃ = C³ / Cdiag;  dim V₃ = 2</text>
<text x="805" y="958" class="" text-anchor="middle">section coefficient: OQ ⊗ V₃</text>
<text x="805" y="1005" class="small" text-anchor="middle">value monodromy: cyclic quotient</text>
<text x="805" y="1054" class="small" text-anchor="middle">point-image coefficient: one</text>
<text x="560" y="1162" class="title" text-anchor="middle">Cg(OQ ⊠ f₊O) ≃ b₊(OQ ⊗ V₃)</text>
<text x="560" y="1207" class="small" text-anchor="middle">g is a submersion; the actual module f₊O has nonzero cycles.</text>
<text x="560" y="1250" class="small" text-anchor="middle">UQD.25–UQD.28: a rank-two normal coefficient along the parameter line</text>
<text x="560" y="1290" class="small" text-anchor="middle">The full unbounded section retract uses UQD.11–UQD.21.</text>
</svg>
