<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1120" viewBox="0 0 1040 1120" role="img" aria-labelledby="title desc">
<title id="title">Weighted blow-up and preservation of the base covector</title>
<desc id="desc">The exact weighted blow-up for weights one and two, its stabilizer at the second projective axis, the path of normal covectors under codifferential pullback with base covector fixed at two, the two parabolic nilpotence implications, the no-extra-boundary-component contradiction, and the integer cohomological windows for output degree seven with d equal to four and N equal to three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#51677e"/></marker></defs>
<rect width="1040" height="1120" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="30" y="39" font-size="28" fill="#192c45" font-weight="bold" text-anchor="start">The horizontal covector is retained</text>
<text x="30" y="69" font-size="18" fill="#192c45" font-weight="normal" text-anchor="start">Weights (1, 2); all maps keep the whole coefficient base S.</text>
<rect x="25" y="93" width="480" height="430" rx="12" fill="#f1f6fb" stroke="#cddbea"/>
<rect x="525" y="93" width="490" height="430" rx="12" fill="#f1f6fb" stroke="#cddbea"/>
<text x="45" y="126" font-size="20" fill="#192c45" font-weight="bold" text-anchor="start">Proper weighted map  (NS.9–NS.16)</text>
<text x="45" y="162" font-size="23" fill="#192c45" font-weight="normal" text-anchor="start">B = [A¹ × (A² ∖ 0) / Gₘ]</text>
<text x="45" y="193" font-size="19" fill="#192c45" font-weight="normal" text-anchor="start">λ · (t, v₁, v₂) = (λ⁻¹t, λv₁, λ²v₂)</text>
<text x="60" y="244" font-size="21" fill="#192c45" font-weight="bold" text-anchor="start">q</text>
<line x1="84" y1="214" x2="84" y2="272" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="55" y="305" font-size="21" fill="#192c45" font-weight="normal" text-anchor="start">Q = [(A² ∖ 0) / Gₘ]</text>
<text x="55" y="335" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">zero section t = 0</text>
<text x="300" y="244" font-size="21" fill="#192c45" font-weight="bold" text-anchor="start">p</text>
<line x1="326" y1="214" x2="326" y2="272" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="278" y="305" font-size="22" fill="#192c45" font-weight="normal" text-anchor="start">E = A²</text>
<text x="278" y="335" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">p(t,v) = (tv₁, t²v₂)</text>
<text x="45" y="379" font-size="20" fill="#14656b" font-weight="bold" text-anchor="start">p⁻¹(0) = Q; p is proper.</text>
<text x="45" y="409" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">On t ≠ 0, p is an isomorphism onto E ∖ 0.</text>
<text x="45" y="445" font-size="18" fill="#192c45" font-weight="normal" text-anchor="start">At [0:1] in Q: stabilizer μ₂.</text>
<text x="45" y="474" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">The graph (q,p) is finite; NS.21 gives</text>
<text x="45" y="498" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">the coarse chart b² = ac.</text>
<text x="545" y="126" font-size="20" fill="#192c45" font-weight="bold" text-anchor="start">Codifferential pullback  (NS.18, NS.22)</text>
<text x="545" y="163" font-size="22" fill="#14656b" font-weight="bold" text-anchor="start">(ξ, η₁, η₂) = (2, λ, λ²)</text>
<text x="545" y="192" font-size="18" fill="#192c45" font-weight="normal" text-anchor="start">ξ = 2 stays fixed for 0 ≤ λ ≤ 1.</text>
<line x1="595" y1="424" x2="803" y2="424" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="436" x2="610" y2="234" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
