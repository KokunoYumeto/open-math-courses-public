<text x="586" y="227" font-size="19" fill="#192c45" font-weight="normal" text-anchor="start">η₂</text>
<line x1="610" y1="420" x2="610" y2="428" stroke="#51677e" stroke-width="1"/>
<line x1="606" y1="424" x2="614" y2="424" stroke="#51677e" stroke-width="1"/>
