<line x1="775" y1="420" x2="775" y2="428" stroke="#51677e" stroke-width="1"/>
<line x1="606" y1="259" x2="614" y2="259" stroke="#51677e" stroke-width="1"/>
<text x="775" y="449" font-size="14" fill="#192c45" font-weight="normal" text-anchor="middle">1</text>
<text x="598" y="264" font-size="14" fill="#192c45" font-weight="normal" text-anchor="end">1</text>
