<circle cx="692.5" cy="382.75" r="5" fill="#365bc4"/>
<circle cx="775" cy="259" r="5" fill="#365bc4"/>
<text x="800" y="262" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">λ = 1</text>
<text x="712" y="394" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">λ = ½</text>
<text x="625" y="479" font-size="18" fill="#14656b" font-weight="bold" text-anchor="start">λ = 0: (2,0,0)</text>
<text x="545" y="506" font-size="17" fill="#192c45" font-weight="normal" text-anchor="start">The surviving covector need not be zero.</text>
<rect x="25" y="547" width="990" height="157" rx="12" fill="#f5f8ee" stroke="#cddbea"/>
<text x="45" y="578" font-size="21" fill="#192c45" font-weight="bold" text-anchor="start">Local Higgs-field implication  (NS.25–NS.28)</text>
<text x="58" y="624" font-size="23" fill="#192c45" font-weight="normal" text-anchor="start">φ′ in p⁻</text>
<line x1="183" y1="616" x2="323" y2="616" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="208" y="604" font-size="16" fill="#192c45" font-weight="normal" text-anchor="start">Levi part</text>
<text x="349" y="624" font-size="23" fill="#192c45" font-weight="normal" text-anchor="start">φ_M in m</text>
<line x1="508" y1="616" x2="651" y2="616" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="525" y="604" font-size="16" fill="#192c45" font-weight="normal" text-anchor="start">nilpotence test</text>
<text x="678" y="624" font-size="23" fill="#192c45" font-weight="normal" text-anchor="start">φ in p⁺</text>
<text x="58" y="676" font-size="19" fill="#192c45" font-weight="normal" text-anchor="start">Nilpotent φ′ ⇒ nilpotent φ_M ⇒ nilpotent φ, with H⁰(u⁻ ⊗ ω_X) = 0.</text>
<rect x="25" y="725" width="990" height="172" rx="12" fill="#f3f4fc" stroke="#cddbea"/>
<text x="45" y="758" font-size="21" fill="#192c45" font-weight="bold" text-anchor="start">No extra boundary component  (ND.6–ND.9)</text>
<text x="45" y="793" font-size="18" fill="#192c45" font-weight="normal" text-anchor="start">Assume w ∈ C, where C is closed, unit-stable and avoids the fixed section.</text>
<text x="62" y="833" font-size="21" fill="#192c45" font-weight="normal" text-anchor="start">ρₜ(w) ∈ C,  t ≠ 0</text>
<line x1="286" y1="825" x2="428" y2="825" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="316" y="810" font-size="16" fill="#192c45" font-weight="normal" text-anchor="start">closedness</text>
<text x="460" y="833" font-size="21" fill="#192c45" font-weight="normal" text-anchor="start">ρ₀(w) = sπ(w) ∈ C ∩ s(S)</text>
<line x1="790" y1="825" x2="866" y2="825" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="833" font-size="28" fill="#ae3434" font-weight="bold" text-anchor="start">∅</text>
<text x="45" y="879" font-size="18" fill="#192c45" font-weight="normal" text-anchor="start">The given open immersion s(S) → f⁻¹(Z) is therefore an isomorphism.</text>
<rect x="25" y="920" width="990" height="180" rx="12" fill="#eef8f6" stroke="#cddbea"/>
<text x="45" y="953" font-size="21" fill="#192c45" font-weight="bold" text-anchor="start">The finite windows apply to full unbounded inputs  (NU.9, NU.13)</text>
<text x="45" y="982" font-size="18" fill="#192c45" font-weight="normal" text-anchor="start">Example: d = 4, N = 3, L = 10; compute output cohomological degree 7.</text>
<text x="45" y="1028" font-size="18" fill="#14656b" font-weight="bold" text-anchor="start">star: [5, 7]</text>
<text x="45" y="1063" font-size="18" fill="#365bc4" font-weight="bold" text-anchor="start">left: [7, 17]</text>
