<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1210" viewBox="0 0 1040 1210" role="img" aria-labelledby="title desc">
<title id="title">From the nilpotent chart upper bound to finite point detectors</title>
<desc id="desc">A parabolic reduction of the generic nilpotent family annihilates the cotangent one-form and proves dimension at most the chart dimension. All cohomology modules are unions of coherent holonomic modules. A finite smooth atlas of each bounded open gives finitely many point exceptional fibres. Degree components require more points as the open grows; an affine connection can still be irregular at infinity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34465e"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#192b42} .h{font-size:25px;font-weight:700}.s{font-size:20px}.m{font-size:22px}.k{font-size:19px;fill:#45617d}.box{fill:#fff;stroke:#91a9c3;stroke-width:2}.arr{fill:none;stroke:#34465e;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1040" height="1210" rx="18" fill="#f2f6fb"/>
<text x="40" y="48" class="h" text-anchor="start">The nilpotent upper bound supplies the detectors</text>
<text x="40" y="80" class="k" text-anchor="start">Characteristic zero • every connected reductive G • every genus and component</text>
<rect x="35" y="104" width="970" height="306" rx="12" class="box"/>
<text x="58" y="139" class="h" text-anchor="start">1. Geometry on a smooth affine chart A of dimension d</text>
<text x="58" y="177" class="s" text-anchor="start">A component W of the nilpotent cone has a dense smooth open W₀.</text>
<text x="58" y="212" class="s" text-anchor="start">A fixed Q-reduction on W₀ lifts its tangent vectors to Bun_Q.</text>
<text x="58" y="249" class="m" text-anchor="start">λ_A(v) = ξ(dF(dr(v))) = 0   ⇒   dλ_A|W₀ = 0</text>
<text x="58" y="286" class="m" text-anchor="start">L ⊆ L⊥,    dim L⊥ = 2d − dim L   ⇒   dim N_A ≤ d</text>
<text x="58" y="324" class="s" text-anchor="start">Every Hⁿ is a filtered union of coherent modules with Ch ⊆ N_A.</text>
<text x="58" y="360" class="m" text-anchor="start">These modules are holonomic: dim Ch ≤ d.</text>
<text x="58" y="390" class="k" text-anchor="start">NC.1–NC.3; SG.8–SG.9 • no lower bound is needed here</text>
<path d="M520 411V444" class="arr"/>
<rect x="35" y="451" width="970" height="388" rx="12" class="box"/>
<text x="58" y="487" class="h" text-anchor="start">2. One quasicompact open U, a finite affine smooth atlas</text>
<rect x="95" y="510" width="245" height="70" rx="12" class="box"/>
<rect x="700" y="510" width="245" height="70" rx="12" class="box"/>
<rect x="405" y="605" width="230" height="64" rx="12" class="box"/>
<text x="217" y="541" class="m" text-anchor="middle">A₁,  d₁ = dim A₁</text>
<text x="217" y="568" class="k" text-anchor="middle">relative dimension r₁</text>
<text x="822" y="541" class="m" text-anchor="middle">Aᵢ,  dᵢ = dim Aᵢ</text>
<text x="822" y="568" class="k" text-anchor="middle">relative dimension rᵢ</text>
<text x="520" y="645" class="m" text-anchor="middle">U ⊆ Bun_G(X)</text>
<path d="M270 580L405 624" class="arr"/>
<path d="M770 580L635 624" class="arr"/>
<text x="335" y="597" class="k" text-anchor="middle">q₁</text>
<text x="705" y="597" class="k" text-anchor="middle">qᵢ</text>
<text x="58" y="708" class="m" text-anchor="start">Lᵢ(M) = untwist(qᵢ! (M|U)[−rᵢ])</text>
<text x="58" y="746" class="m" text-anchor="start">Finite point tests:  Ψ_U(M) = (yᵢ,ₐ! Lᵢ(M))ᵢ,ₐ</text>
<text x="58" y="782" class="s" text-anchor="start">Ψ_U(M) = 0 ⇔ M|U = 0; equivalences are detected by their cones.</text>
<text x="58" y="816" class="k" text-anchor="start">NC.4–NC.8 • all cohomological degrees • finitely many tests per U</text>
<rect x="35" y="872" width="470" height="300" rx="12" class="box"/>
<rect x="535" y="872" width="470" height="300" rx="12" class="box"/>
<text x="58" y="910" class="h" text-anchor="start">3. The stage index matters</text>
<text x="58" y="946" class="s" text-anchor="start">G = Gₘ, X = ℙ¹: degrees d ∈ ℤ</text>
<text x="58" y="980" class="s" text-anchor="start">U₂: degrees −2, −1, 0, 1, 2</text>
<circle cx="82" cy="1028" r="26" fill="#d6e9fa" stroke="#416f99"/>
<text x="82" y="1035" class="s" text-anchor="middle">-2</text>
<circle cx="168" cy="1028" r="26" fill="#d6e9fa" stroke="#416f99"/>
<text x="168" y="1035" class="s" text-anchor="middle">-1</text>
<circle cx="254" cy="1028" r="26" fill="#d6e9fa" stroke="#416f99"/>
<text x="254" y="1035" class="s" text-anchor="middle">0</text>
<circle cx="340" cy="1028" r="26" fill="#d6e9fa" stroke="#416f99"/>
<text x="340" y="1035" class="s" text-anchor="middle">1</text>
<circle cx="426" cy="1028" r="26" fill="#d6e9fa" stroke="#416f99"/>
<text x="426" y="1035" class="s" text-anchor="middle">2</text>
<text x="58" y="1094" class="k" text-anchor="start">One atlas point per degree at this stage.</text>
<text x="58" y="1125" class="k" text-anchor="start">A finite global family misses some M_d.</text>
<text x="58" y="1155" class="k" text-anchor="start">NC.9–NC.10</text>
<text x="558" y="910" class="h" text-anchor="start">4. Regularity needs more</text>
<text x="558" y="948" class="s" text-anchor="start">Separate chart: A¹,  K = k[t]e</text>
<text x="558" y="983" class="s" text-anchor="start">∂ₜe = 2te;  Ch(K) = zero section</text>
<text x="558" y="1018" class="s" text-anchor="start">A point sees k[−1].</text>
<text x="558" y="1055" class="s" text-anchor="start">At infinity s = 1/t:</text>
<text x="558" y="1091" class="m" text-anchor="start">s∂ₛ(sᵃe) = (a − 2s⁻²)sᵃe</text>
<text x="558" y="1126" class="k" text-anchor="start">No logarithmically stable full lattice.</text>
<text x="558" y="1155" class="k" text-anchor="start">NC.11–NC.12 • holonomic, irregular</text>
</svg>
