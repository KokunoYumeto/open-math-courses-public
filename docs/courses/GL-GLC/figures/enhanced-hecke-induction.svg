<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1500" viewBox="0 0 1040 1500" role="img" aria-labelledby="title desc">
<title id="title">Regular algebra and enhanced Hecke induction for a specified rigid action</title>
<desc id="desc">The regular algebra constructs induction and conservative forgetful adjunctions. The full specified eigen-category and its compact generators extend over any field. In the Laurent example the monad is not idempotent. Geometric Ran and nilpotent-image inputs remain required.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#286482"/></marker></defs>
<rect width="1040" height="1500" fill="#eef5f8"/>
<text x="38" y="47" font-family="Georgia, Cambria Math, serif" font-size="31" fill="#163c51" font-weight="bold">Regular algebra → enhanced Hecke induction</text>
<text x="38" y="85" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">Compact rigid A; compactly generated M; specified Φ and continuous action.</text>
<rect x="25" y="110" width="990" height="326" rx="15" fill="#ffffff" stroke="#b7cfdd"/>
<text x="50" y="149" font-family="Georgia, Cambria Math, serif" font-size="24" fill="#163c51" font-weight="bold">1. The regular algebra is an explicit bar coend  [EP.1–EP.5]</text>
<rect x="70" y="178" width="235" height="78" rx="15" fill="#f5f9fb" stroke="#b7cfdd"/>
<rect x="674" y="178" width="275" height="78" rx="15" fill="#f5f9fb" stroke="#b7cfdd"/>
<text x="100" y="224" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">B = A ⊗ₖ A</text>
<text x="786" y="224" font-family="Georgia, Cambria Math, serif" font-size="28" fill="#163c51" font-weight="normal">A</text>
<line x1="325" y1="194" x2="650" y2="194" stroke="#286482" stroke-width="3" marker-end="url(#arrow)"/>
<text x="463" y="185" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">μ</text>
<line x1="650" y1="237" x2="325" y2="237" stroke="#286482" stroke-width="3" marker-end="url(#arrow)"/>
<text x="455" y="274" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">r   (μ ⊣ r)</text>
<text x="58" y="319" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">ℛ_A = r(1_A) = ∫ᵃ (a^∨ ⊠ a)</text>
<text x="58" y="360" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">Unit and multiplication make ℛ_A a commutative algebra.</text>
<text x="58" y="403" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">(a ⊠ 1) ⊗ ℛ_A ≃ r(a) ≃ (1 ⊠ a) ⊗ ℛ_A</text>
<rect x="25" y="454" width="990" height="364" rx="15" fill="#ffffff" stroke="#b7cfdd"/>
<text x="50" y="494" font-family="Georgia, Cambria Math, serif" font-size="24" fill="#163c51" font-weight="bold">2. Free coefficients and induction give the enhanced adjunction</text>
<rect x="60" y="531" width="210" height="75" rx="15" fill="#f5f9fb" stroke="#b7cfdd"/>
<text x="83" y="576" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">M</text>
<rect x="398" y="531" width="226" height="75" rx="15" fill="#f5f9fb" stroke="#b7cfdd"/>
<text x="421" y="576" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">N_R = Mod_R(M)</text>
<rect x="749" y="531" width="221" height="75" rx="15" fill="#f5f9fb" stroke="#b7cfdd"/>
<text x="772" y="576" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">H_R</text>
<line x1="284" y1="547" x2="380" y2="547" stroke="#286482" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="532" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">s</text>
<line x1="380" y1="592" x2="284" y2="592" stroke="#286482" stroke-width="3" marker-end="url(#arrow)"/>
<text x="302" y="623" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">v</text>
<line x1="638" y1="547" x2="731" y2="547" stroke="#286482" stroke-width="3" marker-end="url(#arrow)"/>
<text x="657" y="532" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">L</text>
<line x1="731" y1="592" x2="638" y2="592" stroke="#286482" stroke-width="3" marker-end="url(#arrow)"/>
<text x="655" y="623" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">U</text>
<text x="58" y="670" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">H_R = Fun_Bᴸ(A, N_R) ≃ Mod_{ℛ_A}(N_R)  [EP.6–EP.9]</text>
<text x="58" y="711" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">P_Rᵉⁿʰ = L ∘ s   ⊣   J_R = v ∘ U</text>
<text x="58" y="751" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">RHom_H(P_Rᵉⁿʰ c, F) ≃ RHom_M(c, J_R F)  [EP.10]</text>
<text x="58" y="790" font-family="Georgia, Cambria Math, serif" font-size="22" fill="#163c51" font-weight="normal">J_R preserves colimits and is conservative; compact tests generate.</text>
<rect x="25" y="837" width="990" height="251" rx="15" fill="#ffffff" stroke="#b7cfdd"/>
<text x="50" y="877" font-family="Georgia, Cambria Math, serif" font-size="24" fill="#163c51" font-weight="bold">3. Extend the same action and its full category  [EP.12–EP.14]</text>
<rect x="70" y="907" width="250" height="68" rx="15" fill="#f5f9fb" stroke="#b7cfdd"/>
<rect x="677" y="907" width="267" height="68" rx="15" fill="#f5f9fb" stroke="#b7cfdd"/>
<text x="93" y="950" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">H_R ⊗ₖ Vect_K</text>
<text x="752" y="950" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">H_{R_K}</text>
<line x1="340" y1="940" x2="654" y2="940" stroke="#286482" stroke-width="3" marker-end="url(#arrow)"/>
<text x="471" y="925" font-family="Georgia, Cambria Math, serif" font-size="28" fill="#163c51" font-weight="normal">≃</text>
<text x="58" y="1015" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">q(P_Rᵉⁿʰ cᵢ) ↦ P_{R_K}ᵉⁿʰ q(cᵢ): compact generators correspond.</text>
<text x="58" y="1057" font-family="Georgia, Cambria Math, serif" font-size="23" fill="#163c51" font-weight="normal">Every field extension K/k; every unbounded object.</text>
<rect x="25" y="1106" width="990" height="367" rx="15" fill="#ffffff" stroke="#b7cfdd"/>
<text x="50" y="1146" font-family="Georgia, Cambria Math, serif" font-size="24" fill="#163c51" font-weight="bold">4. Exact Laurent example: the monad is not idempotent</text>
<text x="58" y="1194" font-family="Georgia, Cambria Math, serif" font-size="22" fill="#163c51" font-weight="normal">A = Z-graded complexes; both actions forget weights; R = k.</text>
<text x="58" y="1240" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">ℛ_A = ⊕ₙ kₙ ⊠ k₋ₙ;   Hₖ = Mod_{k[z,z⁻¹]}.</text>
<text x="58" y="1285" font-family="Georgia, Cambria Math, serif" font-size="25" fill="#163c51" font-weight="normal">Pₖᵉⁿʰ(V) = k[z,z⁻¹] ⊗ₖ V;   m(zⁱ ⊗ zʲ) = zⁱ⁺ʲ.</text>
<text x="58" y="1330" font-family="Georgia, Cambria Math, serif" font-size="24" fill="#163c51" font-weight="normal">m(z ⊗ 1 − 1 ⊗ z) = 0, while z ⊗ 1 − 1 ⊗ z ≠ 0.</text>
<text x="58" y="1375" font-family="Georgia, Cambria Math, serif" font-size="22" fill="#163c51" font-weight="normal">This is free enhanced induction with its proved adjunction.</text>
<text x="58" y="1424" font-family="Georgia, Cambria Math, serif" font-size="22" fill="#965a27" font-weight="normal">Actual Ran action and nilpotent regular image still require proof.</text>
</svg>
