<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1630" viewBox="0 0 1120 1630" role="img" aria-labelledby="title desc"><title id="title">Geometric field points and the full regular Hecke-lisse image</title><desc id="desc">Two complex realizations of a countable algebraic model, faithful support reflection and extension, and the actual orthogonal triangle give geometric point membership and full original-complex Hecke-lisse regularity in every genus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31546b" /></marker><marker id="extra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b4c32" /></marker></defs><rect width="1120" height="1630" fill="white" /><text x="34" y="43" font-size="25" fill="#132f42" font-family="Arial, sans-serif">Geometric field points and the full regular Hecke-lisse image</text><rect x="28" y="72" width="1064" height="340" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="110" font-size="23" fill="#132f42" font-family="Arial, sans-serif">1. A countable model with two complex realizations</text><text x="125" y="170" font-size="31" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">k₀</text><text x="520" y="170" font-size="30" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">C<tspan baseline-shift="sub" font-size="21.6">original</tspan></text><text x="954" y="170" font-size="31" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">K</text><line x1="180" y1="155" x2="380" y2="155" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="280.0" y="142.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">inclusion</text><line x1="665" y1="155" x2="900" y2="155" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="782.5" y="142.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">inclusion</text><text x="125" y="282" font-size="31" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">k₁</text><text x="520" y="282" font-size="30" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">C<tspan baseline-shift="sub" font-size="21.6">aux</tspan></text><line x1="125" y1="194" x2="125" y2="245" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="180" y1="267" x2="380" y2="267" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="280.0" y="254.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">σ</text><line x1="195" y1="304" x2="901" y2="195" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="630" y="325" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">k₀ ⊂ k₁ ⊂ K;  y = y₀ ⊗ K</text><text x="70" y="370" font-size="21" fill="#132f42" font-family="Arial, sans-serif">σ need not fix the original k₀ realization; no embedding K → C is used.</text><text x="70" y="398" font-size="20" fill="#132f42" font-family="Arial, sans-serif">The complete coefficient functor, IC kernels and point adjunction are retained.</text><rect x="28" y="432" width="1064" height="365" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="470" font-size="23" fill="#132f42" font-family="Arial, sans-serif">2. The actual operator and support travel through the model</text><text x="70" y="523" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">T_σ δ<tspan baseline-shift="sub" font-size="19.44">yσ</tspan><tspan baseline-shift="super" font-size="19.44">!</tspan>: regular Hecke-lisse ⇒ nilpotent support</text><line x1="160" y1="544" x2="160" y2="590" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="205" y="578" font-size="22" fill="#132f42" font-family="Arial, sans-serif">faithful reflection along k₁ → C<tspan baseline-shift="sub" font-size="15.84">aux</tspan></text><text x="70" y="635" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">SS<tspan baseline-shift="sub" font-size="20.16">∞</tspan>(T₀ δ<tspan baseline-shift="sub" font-size="20.16">y₀</tspan><tspan baseline-shift="super" font-size="20.16">!</tspan>) ⊂ Nilp<tspan baseline-shift="sub" font-size="20.16">G</tspan> over k₁</text><line x1="160" y1="654" x2="160" y2="700" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="205" y="689" font-size="22" fill="#132f42" font-family="Arial, sans-serif">field extension k₁ → K</text><text x="70" y="745" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">(T₀ δ<tspan baseline-shift="sub" font-size="18.0">y₀</tspan><tspan baseline-shift="super" font-size="18.0">!</tspan>)<tspan baseline-shift="sub" font-size="18.0">K</tspan> = J<tspan baseline-shift="sub" font-size="18.0">E,K</tspan> P<tspan baseline-shift="sub" font-size="18.0">E,K</tspan> δ<tspan baseline-shift="sub" font-size="18.0">y</tspan><tspan baseline-shift="super" font-size="18.0">!</tspan>;  SS<tspan baseline-shift="sub" font-size="18.0">∞</tspan> ⊂ Nilp<tspan baseline-shift="sub" font-size="18.0">G,K</tspan></text><text x="70" y="778" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Only characteristic support is reflected; no arbitrary-field regularity is assumed.</text><rect x="28" y="817" width="1064" height="345" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="855" font-size="23" fill="#132f42" font-family="Arial, sans-serif">3. The actual supported-image criterion and all new points</text><text x="70" y="907" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">j<tspan baseline-shift="sub" font-size="20.88">E,K</tspan> r<tspan baseline-shift="sub" font-size="20.88">E,K</tspan> F  →  F  →  ℓ<tspan baseline-shift="sub" font-size="20.88">E,K</tspan> F</text><text x="70" y="961" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">Nilpotent support + the original extended point tests ⇒ ℓ<tspan baseline-shift="sub" font-size="18.0">E,K</tspan> F = 0</text><text x="70" y="1017" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">P<tspan baseline-shift="sub" font-size="20.16">E,K</tspan> δ<tspan baseline-shift="sub" font-size="20.16">y</tspan><tspan baseline-shift="super" font-size="20.16">!</tspan> ∈ D<tspan baseline-shift="sub" font-size="20.16">E,K</tspan>   for every K/C and y ∈ Y<tspan baseline-shift="sub" font-size="20.16">K</tspan>(K)</text><text x="70" y="1070" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">F ⟂ D<tspan baseline-shift="sub" font-size="18.0">E</tspan>  ⇒  all new point tests of J<tspan baseline-shift="sub" font-size="18.0">E,K</tspan> F<tspan baseline-shift="sub" font-size="18.0">K</tspan> vanish  ⇒  F = 0</text><text x="70" y="1125" font-size="21" fill="#132f42" font-family="Arial, sans-serif">GFP.17–GFP.20; actual field-point membership GFP.49–GFP.54.</text><rect x="28" y="1182" width="1064" height="420" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="1220" font-size="23" fill="#132f42" font-family="Arial, sans-serif">4. The full original-complex image, in every genus and on both tails</text><text x="120" y="1280" font-size="33" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">M</text><text x="566" y="1280" font-size="33" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">N = D</text><text x="981" y="1280" font-size="33" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">S</text><line x1="180" y1="1267" x2="432" y2="1267" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="306.0" y="1254.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">Π<tspan baseline-shift="sub" font-size="14.4">r</tspan></text><line x1="713" y1="1267" x2="912" y2="1267" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="812.5" y="1254.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">inclusion</text><text x="70" y="1350" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">D = M<tspan baseline-shift="sub" font-size="18.72">reg</tspan> ∩ N;  S = all independent nilpotent support.</text><text x="70" y="1410" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">EssIm Π<tspan baseline-shift="sub" font-size="18.72">r</tspan> = N ⊂ M<tspan baseline-shift="sub" font-size="18.72">reg</tspan>;  SS<tspan baseline-shift="sub" font-size="18.72">∞</tspan>(Π<tspan baseline-shift="sub" font-size="18.72">r</tspan> m) ⊂ Nilp<tspan baseline-shift="sub" font-size="18.72">G</tspan> for every m ∈ M.</text><text x="70" y="1470" font-size="22" fill="#132f42" font-family="Arial, sans-serif">The actual enhanced compact point generators generate N.</text><text x="70" y="1525" font-size="22" fill="#783e2b" font-family="Arial, sans-serif">GZR.33 identifies S = N in every genus over the complex numbers.</text><text x="70" y="1570" font-size="20" fill="#132f42" font-family="Arial, sans-serif">GFP.55–GFP.56; no adjunction for the nonunital Ran algebra is inferred.</text></svg>