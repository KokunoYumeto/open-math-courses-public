<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1590" viewBox="0 0 1040 1590" role="img" aria-labelledby="title desc"><title id="title">Bounded Hecke kernel: exact conormal fibre and source membership</title><desc id="desc">The normal Weyl symbols give all normal covectors. A square-zero point has a nonzero classical cotangent. For SL3, six orbit root jets pair to zero, while the transverse H over u pairs to 6q(0). Finite frames give a product chart and actual source support.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#294a65"/></marker></defs><g font-family="Segoe UI,DejaVu Sans,sans-serif"><rect width="1040" height="1590" fill="#edf3f6"/><text x="42" y="48" font-size="29" fill="#182b40" font-weight="bold">The bounded Hecke kernel contains the conormal fibre</text><text x="42" y="79" font-size="20" fill="#182b40" font-weight="normal">Characteristic-zero geometric points; original finite-stage nilpotents retained</text><rect x="30" y="104" width="980" height="335" rx="14" fill="#fff" stroke="#becbd6"/><text x="52" y="140" font-size="25" fill="#182b40" font-weight="bold">1. Constant orbit module → all normal symbols  [BK.1–BK.5]</text><text x="55" y="184" font-size="23" fill="#182b40" font-weight="normal">D / (D w + D ∂z)   has normal basis   Oorbit[∂w] e</text><text x="55" y="224" font-size="23" fill="#182b40" font-weight="normal">w ∂wʳ e = −r ∂wʳ⁻¹ e       gr = Oorbit[ξw]</text><path d="M165,380 L165,275" stroke="#294a65" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M88,373 L324,373" stroke="#294a65" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="95" y="404" font-size="19" fill="#182b40" font-weight="normal">orbit tangent z</text><text x="180" y="292" font-size="19" fill="#182b40" font-weight="normal">normal w</text><path d="M555,371 L555,278" stroke="#217b68" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="555" cy="371" r="5" fill="#217b68"/><text x="590" y="310" font-size="23" fill="#176b59" font-weight="normal">ξz = 0; ξw arbitrary</text><text x="590" y="346" font-size="20" fill="#182b40" font-weight="normal">Every conormal covector occurs.</text><text x="590" y="382" font-size="18" fill="#182b40" font-weight="normal">Schematic vector fibre; no metric.</text><text x="55" y="424" font-size="20" fill="#182b40" font-weight="normal">Ambient cotangent quotient gives Ann(Torbit ⊂ TYₙ), independent of the embedding.</text><rect x="30" y="460" width="980" height="266" rx="14" fill="#fff" stroke="#becbd6"/><text x="52" y="496" font-size="25" fill="#182b40" font-weight="bold">2. The same point module, different cotangent quotients  [Exercise 3.Z]</text><text x="55" y="536" font-size="24" fill="#182b40" font-weight="normal">Y₀ = Spec k</text><text x="550" y="536" font-size="24" fill="#182b40" font-weight="normal">Y = Spec k[s]/(s²)</text><text x="55" y="578" font-size="22" fill="#182b40" font-weight="normal">Relation ds = 0</text><text x="550" y="578" font-size="22" fill="#182b40" font-weight="normal">Relation 2s ds = 0</text><text x="55" y="617" font-size="24" fill="#217b68" font-weight="normal">T*₀Y₀ = 0</text><text x="550" y="617" font-size="24" fill="#217b68" font-weight="normal">T*₀Y = k ds</text><text x="55" y="659" font-size="22" fill="#182b40" font-weight="normal">δ₀ = D / D s      gr δ₀ = k[ξs]      ambient fibre = all k ds</text><text x="55" y="700" font-size="20" fill="#182b40" font-weight="normal">Nil-invariance of the supported category does not remove stage tangent tests.</text><rect x="30" y="746" width="980" height="376" rx="14" fill="#fff" stroke="#becbd6"/><text x="52" y="782" font-size="25" fill="#182b40" font-weight="bold">3. Six orbit root jets and a genuine transverse test  [Exercise 3.AA]</text><text x="55" y="821" font-size="22" fill="#182b40" font-weight="normal">SL₃:  λ = (1, 1, −2);   H = diag(1, 1, −2);   C = H + E₁₂</text><text x="55" y="863" font-size="22" fill="#182b40" font-weight="normal">η = C q(u) du;   q(0) ≠ 0;   trace pairing throughout</text><text x="55" y="910" font-size="23" fill="#182b40" font-weight="bold">Orbit tangent:</text><text x="55" y="945" font-size="23" fill="#182b40" font-weight="normal">u⁻ʳ E₁₃, u⁻ʳ E₂₃</text><text x="55" y="979" font-size="20" fill="#182b40" font-weight="normal">r = 1, 2, 3; dimension 6</text><text x="570" y="910" font-size="23" fill="#182b40" font-weight="bold">Transverse tangent:</text><text x="570" y="945" font-size="23" fill="#182b40" font-weight="normal">H/u from g (1 + ε H/u)</text><text x="570" y="979" font-size="20" fill="#182b40" font-weight="normal">ε² = 0; determinant = 1</text><text x="55" y="1026" font-size="23" fill="#217b68" font-weight="normal">Res tr(η · root jet) = 0</text><text x="570" y="1026" font-size="23" fill="#b45124" font-weight="normal">Res tr(η · H/u) = 6q(0)</text><text x="55" y="1070" font-size="20" fill="#182b40" font-weight="normal">η annihilates the orbit, yet is a nonzero normal covector in some finite stage.</text><text x="55" y="1103" font-size="19" fill="#182b40" font-weight="normal">BK.7 puts that covector in the actual intersection-complex characteristic fibre.</text><rect x="30" y="1142" width="980" height="322" rx="14" fill="#fff" stroke="#becbd6"/><text x="52" y="1178" font-size="25" fill="#182b40" font-weight="bold">4. Finite frames identify the global source  [BK.10–BK.13]</text><text x="55" y="1219" font-size="20" fill="#182b40" font-weight="normal">Kₘ fixes Oλ on all coefficient rings; frames lift by additive affine Čech exactness.</text><text x="55" y="1261" font-size="23" fill="#217b68" font-weight="normal">Global Hecke orbit ×base Fr_M  ≃  Fr_M × Oλ</text><text x="55" y="1307" font-size="23" fill="#182b40" font-weight="normal">Actual source on a smooth chart:  F_S ⊠ O_orbit</text><text x="55" y="1350" font-size="23" fill="#182b40" font-weight="normal">SS∞(source) = SS∞(F_S) × {0} on the orbit</text><text x="55" y="1392" font-size="20" fill="#182b40" font-weight="normal">p₂^*ξ₂ + s^*ξx = p₁^*ξ₁; the local conormal annihilates this stratum.</text><text x="55" y="1433" font-size="19" fill="#182b40" font-weight="normal">This proves source membership; proper-direct-image survival is a further theorem.</text><text x="42" y="1504" font-size="20" fill="#182b40" font-weight="normal">Proofs: Lesson 3, §§3.30–3.32; BK.1–BK.14; solved Exercises 3.Y, 3.Z, 3.AA.</text><text x="42" y="1538" font-size="18" fill="#182b40" font-weight="normal">Free reading: Arinkin–Gaitsgory–Kazhdan–Raskin–Rozenblyum–Varshavsky,</text><text x="42" y="1566" font-size="18" fill="#182b40" font-weight="normal">arXiv:2010.01906v2, §§16.5, 17.2, 17.8. Geometry is schematic; algebra is exact.</text></g></svg>