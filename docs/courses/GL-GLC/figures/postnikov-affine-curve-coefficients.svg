<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1460" viewBox="0 0 1120 1460" role="img" aria-labelledby="title desc"><title id="title">Actual truncation limits and affine curve coefficients</title><desc id="desc">The exact delta-module finite-prefix tower, its flat chart gluing, the original Weyl coefficient action on polynomial sections, the positive-genus unbounded regular-input criterion, and the distinct projective-line localized coefficient.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31546b" /></marker></defs><rect width="1120" height="1460" fill="white" /><text x="34" y="43" font-size="26" fill="#132f42" font-family="Arial, sans-serif">Actual truncation limits and affine curve coefficients</text><rect x="28" y="72" width="1064" height="405" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="110" font-size="23" fill="#132f42" font-family="Arial, sans-serif">1. A compatible operator tower and its actual affine gluing</text><text x="130" y="151" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">K<tspan baseline-shift="sub" font-size="16.56">0</tspan></text><text x="240" y="151" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">K<tspan baseline-shift="sub" font-size="16.56">1</tspan></text><line x1="207" y1="145" x2="162" y2="145" stroke="#31546b" stroke-width="1.6" marker-end="url(#arrow)" /><text x="350" y="151" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">K<tspan baseline-shift="sub" font-size="16.56">2</tspan></text><line x1="317" y1="145" x2="272" y2="145" stroke="#31546b" stroke-width="1.6" marker-end="url(#arrow)" /><text x="460" y="151" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">K<tspan baseline-shift="sub" font-size="16.56">3</tspan></text><line x1="427" y1="145" x2="382" y2="145" stroke="#31546b" stroke-width="1.6" marker-end="url(#arrow)" /><text x="59" y="200" font-size="19" fill="#132f42" font-family="Cambria Math, Georgia, serif">0</text><rect x="96" y="174" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="130" y="199" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><rect x="206" y="174" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="240" y="199" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><rect x="316" y="174" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="350" y="199" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><rect x="426" y="174" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="460" y="199" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><text x="59" y="247" font-size="19" fill="#132f42" font-family="Cambria Math, Georgia, serif">-1</text><rect x="96" y="221" width="68" height="36" rx="4" fill="#ecf0f3" stroke="#c6d3dc" /><text x="130" y="246" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">0</text><rect x="206" y="221" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="240" y="246" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><rect x="316" y="221" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="350" y="246" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><rect x="426" y="221" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="460" y="246" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><text x="59" y="294" font-size="19" fill="#132f42" font-family="Cambria Math, Georgia, serif">-2</text><rect x="96" y="268" width="68" height="36" rx="4" fill="#ecf0f3" stroke="#c6d3dc" /><text x="130" y="293" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">0</text><rect x="206" y="268" width="68" height="36" rx="4" fill="#ecf0f3" stroke="#c6d3dc" /><text x="240" y="293" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">0</text><rect x="316" y="268" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="350" y="293" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><rect x="426" y="268" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="460" y="293" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><text x="59" y="341" font-size="19" fill="#132f42" font-family="Cambria Math, Georgia, serif">-3</text><rect x="96" y="315" width="68" height="36" rx="4" fill="#ecf0f3" stroke="#c6d3dc" /><text x="130" y="340" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">0</text><rect x="206" y="315" width="68" height="36" rx="4" fill="#ecf0f3" stroke="#c6d3dc" /><text x="240" y="340" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">0</text><rect x="316" y="315" width="68" height="36" rx="4" fill="#ecf0f3" stroke="#c6d3dc" /><text x="350" y="340" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">0</text><rect x="426" y="315" width="68" height="36" rx="4" fill="#dcefe5" stroke="#c6d3dc" /><text x="460" y="340" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">δ</text><text x="84" y="393" font-size="18" fill="#132f42" font-family="Arial, sans-serif">Degrees shown: 0, −1, −2, −3.</text><text x="84" y="431" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif">K<tspan baseline-shift="sub" font-size="17.28">n</tspan> = ⊕<tspan baseline-shift="sub" font-size="17.28">0≤j≤n</tspan> δ[j]</text><text x="610" y="158" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">lim K<tspan baseline-shift="sub" font-size="18.72">n</tspan> = ⊕<tspan baseline-shift="sub" font-size="18.72">j≥0</tspan> δ[j]</text><text x="610" y="209" font-size="20" fill="#132f42" font-family="Arial, sans-serif">H<tspan baseline-shift="super" font-size="14.4">q</tspan> is eventually constant in every degree.</text><text x="610" y="251" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Flat restriction retains</text><text x="610" y="281" font-size="20" fill="#132f42" font-family="Arial, sans-serif">the stable cohomology value.</text><text x="667" y="351" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">U</text><text x="990" y="351" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">V</text><text x="827" y="415" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">U ∩ V</text><line x1="690" y1="363" x2="785" y2="397" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="965" y1="363" x2="875" y2="397" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="610" y="455" font-size="19" fill="#132f42" font-family="Arial, sans-serif">Glue limits with the original overlap paths.</text><rect x="28" y="497" width="1064" height="335" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="535" font-size="23" fill="#132f42" font-family="Arial, sans-serif">2. Retain the original affine operator action</text><text x="140" y="587" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">K on B₀ × X</text><line x1="293" y1="580" x2="548" y2="580" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="408" y="565" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">U<tspan baseline-shift="sub" font-size="16.56">B₀</tspan></text><text x="725" y="587" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">j<tspan baseline-shift="sub" font-size="19.44">X</tspan>(Q)</text><text x="70" y="642" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif">R = D(B₀)</text><text x="650" y="642" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif">R ⊗ Q → Q</text><text x="70" y="683" font-size="19" fill="#132f42" font-family="Arial, sans-serif">Multiplication, action and unit faces lift together.</text><text x="650" y="684" font-size="21" fill="#132f42" font-family="Cambria Math, Georgia, serif">j<tspan baseline-shift="sub" font-size="15.12">X</tspan>(R ⊗ Q) ≅ R ⊗ j<tspan baseline-shift="sub" font-size="15.12">X</tspan>(Q)</text><text x="70" y="718" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">B₀ = A¹:  U<tspan baseline-shift="sub" font-size="18.0">B₀</tspan>(O ⊠ E) = C[z] ⊗ E</text><text x="180" y="790" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">1</text><text x="350" y="790" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">z</text><line x1="318" y1="763" x2="212" y2="763" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="265.0" y="750" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">1</text><text x="520" y="790" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">z²</text><line x1="488" y1="763" x2="382" y2="763" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="435.0" y="750" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">2</text><text x="690" y="790" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">z³</text><line x1="658" y1="763" x2="552" y2="763" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="605.0" y="750" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">3</text><text x="77" y="790" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">∂<tspan baseline-shift="sub" font-size="16.56">z</tspan></text><text x="830" y="790" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">[∂<tspan baseline-shift="sub" font-size="18.0">z</tspan>,z] = 1</text><rect x="28" y="852" width="1064" height="250" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="890" font-size="23" fill="#132f42" font-family="Arial, sans-serif">3. Positive genus: both cohomological tails</text><text x="70" y="940" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">g(X) &gt; 0:  Q<tspan baseline-shift="sub" font-size="20.16">X</tspan> = I<tspan baseline-shift="sub" font-size="20.16">X</tspan></text><text x="70" y="995" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">F regular Ind:  SS<tspan baseline-shift="sub" font-size="20.88">∞</tspan>(F) ⊂ N  ⇔  F ∈ M<tspan baseline-shift="super" font-size="20.88">Hl</tspan></text><text x="70" y="1054" font-size="21" fill="#132f42" font-family="Arial, sans-serif">Nilpotent × zero-curve outputs; the full Ran parameters remain.</text><text x="730" y="940" font-size="19" fill="#132f42" font-family="Arial, sans-serif">All integer cohomological degrees.</text><line x1="757" y1="976" x2="1030" y2="976" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="1029" y1="976" x2="756" y2="976" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="755" y="1011" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif">−∞</text><text x="1003" y="1011" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif">+∞</text><rect x="28" y="1122" width="1064" height="310" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="1160" font-size="23" fill="#132f42" font-family="Arial, sans-serif">4. The projective-line coefficient distinction</text><text x="70" y="1216" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">X = P¹,  B = T(C[1]),  |u| = −1,  v = u²</text><text x="70" y="1271" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">Q<tspan baseline-shift="sub" font-size="18.0">X</tspan> = Mod<tspan baseline-shift="sub" font-size="18.0">B</tspan>;  I<tspan baseline-shift="sub" font-size="18.0">X</tspan> = v-torsion</text><text x="70" y="1326" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">L = B[v⁻¹] ≠ 0;  RHom<tspan baseline-shift="sub" font-size="18.0">B</tspan>(C,L) = 0</text><text x="762" y="1230" font-size="18" fill="#132f42" font-family="Arial, sans-serif">All integer words survive.</text><text x="775" y="1290" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">u⁻¹</text><text x="900" y="1290" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">1</text><text x="1025" y="1290" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">u</text><line x1="805" y1="1283" x2="870" y2="1283" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="928" y1="1283" x2="995" y2="1283" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="837" y="1260" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif">u</text><text x="960" y="1260" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif">u</text><text x="766" y="1357" font-size="19" fill="#132f42" font-family="Arial, sans-serif">u is invertible on L.</text><text x="70" y="1403" font-size="19" fill="#132f42" font-family="Arial, sans-serif">Independent nilpotent regularity is the separate assertion PAC.34.</text></svg>