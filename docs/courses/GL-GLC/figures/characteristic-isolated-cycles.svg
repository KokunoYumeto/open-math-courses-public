<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1500" viewBox="0 0 1120 1500" role="img" aria-labelledby="title desc">
<title id="title">Actual characteristic isolation with a persistent invisible critical line</title>
<desc id="desc">The left real section is u equals i b, v equals b, w equals c. The invisible line has c zero; the actual full ambient critical point for lambda one eighth is b zero c one sixteenth. The middle cotangent section plots the actual graph xi w equals two w minus one eighth against the zero section. The lower arrows are proper evaluation maps of whole relative compact pairs, followed by their single degree-zero visible Morse quotient. A drawing-plane critical point is not identified with an ambient critical point.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1500" fill="#f8fafc"/>
<text x="40" y="53" font-family="Georgia,serif" font-size="34" text-anchor="start" fill="#17324b" font-weight="bold">Actual characteristic isolation with invisible strata</text>
<text x="40" y="105" font-family="Georgia,serif" font-size="25" text-anchor="start" fill="#17324b" font-weight="normal">λ = 1/8;  h = u² + v² + w²;  P = K[3];  ε = 1/64, η = 1/16.</text>
<rect x="32" y="150" width="516" height="650" rx="14" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<rect x="572" y="150" width="516" height="650" rx="14" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="58" y="204" font-family="Georgia,serif" font-size="28" text-anchor="start" fill="#17324b" font-weight="bold">A persistent invisible line</text>
<text x="58" y="250" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">Real section: (u,v,w) = (ib,b,c).</text>
<line x1="290" y1="620" x2="290" y2="310" stroke="#687c8d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="80" y1="500" x2="510" y2="500" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="290" y1="491" x2="290" y2="434" stroke="#8c467a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<circle cx="290" cy="500" r="6" fill="white" stroke="#687c8d" stroke-width="2"/>
<circle cx="290" cy="425" r="6" fill="#8c467a" stroke="#8c467a" stroke-width="2"/>
<text x="305" y="320" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">c</text>
<text x="482" y="534" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">b</text>
<text x="304" y="527" font-family="Georgia,serif" font-size="21" text-anchor="start" fill="#17324b" font-weight="normal">0</text>
<text x="67" y="389" font-family="Georgia,serif" font-size="25" text-anchor="start" fill="#8c467a" font-weight="normal">p₁ = (0,0,1/16)</text>
<text x="68" y="571" font-family="Georgia,serif" font-size="24" text-anchor="start" fill="#17324b" font-weight="normal">S ∩ section: c = 0</text>
<text x="58" y="654" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">The ambient point is marked once.</text>
<text x="58" y="707" font-family="Georgia,serif" font-size="24" text-anchor="start" fill="#17324b" font-weight="normal">hₛ|S = 0 for every s.</text>
<text x="58" y="760" font-family="Georgia,serif" font-size="22" text-anchor="start" fill="#17324b" font-weight="normal">Full critical equations force u = v = 0.</text>
<text x="598" y="204" font-family="Georgia,serif" font-size="27" text-anchor="start" fill="#17324b" font-weight="bold">The actual cotangent section</text>
<text x="598" y="250" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">u = v = 0;  w and ξ<tspan baseline-shift="sub" font-size="75%">w</tspan> are real.</text>
<line x1="640" y1="480" x2="1050" y2="480" stroke="#687c8d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="810" y1="620" x2="810" y2="273" stroke="#687c8d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1028" y="517" font-family="Georgia,serif" font-size="22" text-anchor="start" fill="#17324b" font-weight="normal">w</text>
<text x="824" y="290" font-family="Georgia,serif" font-size="22" text-anchor="start" fill="#17324b" font-weight="normal">ξ<tspan baseline-shift="sub" font-size="75%">w</tspan></text>
<line x1="725.625" y1="636.25" x2="1035.0" y2="292.5" stroke="#17667d" stroke-width="3"/>
<circle cx="866.25" cy="480" r="6" fill="#8c467a" stroke="#8c467a" stroke-width="2"/>
<text x="883" y="519" font-family="Georgia,serif" font-size="22" text-anchor="start" fill="#8c467a" font-weight="normal">w = 1/16</text>
<text x="874" y="554" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#687c8d" font-weight="normal">Σ<tspan baseline-shift="sub" font-size="75%">P</tspan>: ξ<tspan baseline-shift="sub" font-size="75%">w</tspan> = 0</text>
<text x="849" y="624" font-family="Georgia,serif" font-size="22" text-anchor="start" fill="#17324b" font-weight="normal">ξ<tspan baseline-shift="sub" font-size="75%">w</tspan> = 2w − 1/8</text>
<text x="598" y="685" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">CIS.26: h₁(p₁) = −1/256.</text>
<text x="598" y="727" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">One visible point; integer count 1.</text>
<text x="598" y="768" font-family="Georgia,serif" font-size="23" text-anchor="start" fill="#17324b" font-weight="normal">The invisible line adds no jump.</text>
<rect x="32" y="830" width="1056" height="590" rx="14" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="58" y="886" font-family="Georgia,serif" font-size="30" text-anchor="start" fill="#17324b" font-weight="bold">Whole compact pairs and one visible jump</text>
<text x="58" y="940" font-family="Georgia,serif" font-size="26" text-anchor="start" fill="#17324b" font-weight="normal">Rₛ = Fib(Cₛ⁺ → Cₛ⁻),   C<tspan baseline-shift="sub" font-size="75%">s</tspan><tspan baseline-shift="super" font-size="75%">±</tspan> = RΓ(Bₛ±; P).</text>
<text x="58" y="982" font-family="Georgia,serif" font-size="24" text-anchor="start" fill="#17324b" font-weight="normal">CIS.14: proper counit evaluations on the open time interval</text>
<text x="180" y="1055" font-family="Georgia,serif" font-size="26" text-anchor="middle" fill="#17324b" font-weight="normal">R₀ = Mₕ(P)₀</text>
<text x="560" y="1055" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#17324b" font-weight="normal">RΓ(I; G)</text>
<text x="940" y="1055" font-family="Georgia,serif" font-size="24" text-anchor="middle" fill="#17324b" font-weight="normal">R₁ = perturbed pair</text>
<line x1="445" y1="1046" x2="330" y2="1046" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="678" y1="1046" x2="785" y2="1046" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="386" y="1024" font-family="Georgia,serif" font-size="24" text-anchor="middle" fill="#17324b" font-weight="normal">≃</text>
<text x="730" y="1024" font-family="Georgia,serif" font-size="24" text-anchor="middle" fill="#17324b" font-weight="normal">≃</text>
<text x="58" y="1124" font-family="Georgia,serif" font-size="25" text-anchor="start" fill="#17324b" font-weight="normal">CIS.20 and CIS.28: the actual relative-fibre filtration</text>
<text x="180" y="1190" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#17324b" font-weight="normal">F₀ = 0</text>
<text x="600" y="1190" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#17324b" font-weight="normal">F₁ ≃ R₁</text>
<line x1="270" y1="1180" x2="488" y2="1180" stroke="#17667d" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="1210" x2="600" y2="1260" stroke="#17667d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="1308" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#17324b" font-weight="normal">Q ≃ K, in degree zero</text>
<text x="58" y="1371" font-family="Georgia,serif" font-size="24" text-anchor="start" fill="#17324b" font-weight="normal">The lower section complex is retained; the relative fibre starts at zero.</text>
<text x="40" y="1472" font-family="Georgia,serif" font-size="25" text-anchor="start" fill="#17324b" font-weight="normal">Proofs and exact coordinates: CIS.14 · CIS.20 · CIS.26 · CIS.28.</text>
</svg>
