<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc">
<title id="title">Regular Ind inverse image from Zariski frame lifts</title>
<desc id="desc">A finite Zariski lift of a family to a smooth bundle atlas, its closed graph inverse image and closed-support localization, finite Cech gluing, and the exact degree shifts at a square-zero point. The first square commutes by a specified bundle isomorphism; it is not asserted cartesian.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315069"/></marker></defs>
<style>text{font-family:Georgia,"Times New Roman",serif;fill:#183549} .head{font-family:"Segoe UI",sans-serif;font-size:25px;font-weight:600}.label{font-size:28px}.small{font-family:"Segoe UI",sans-serif;font-size:20px}.math{font-size:25px}.panel{fill:#f7fafc;stroke:#bcced9;stroke-width:1.5}.arrow{fill:none;stroke:#315069;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1120" height="1120" fill="white"/>
<text x="34" y="44" class="head">Regular Ind inverse image and kernel-weighted input</text>
<rect x="28" y="68" width="1064" height="262" rx="14" class="panel"/>
<text x="52" y="104" class="head">1. A finite Zariski lift of a bundle family</text>
<text x="52" y="134" class="small">A basis of Wₘ gives a section of Fr(Wₘ) → T<tspan baseline-shift="sub" font-size="15">d,m</tspan>.</text>
<text x="190" y="190" class="label">Tᵢ</text><text x="770" y="190" class="label">Vᵢ</text>
<text x="190" y="273" class="label">T</text><text x="737" y="273" class="label">Bun<tspan baseline-shift="sub" font-size="19">G</tspan></text>
<path d="M248 181H726" class="arrow"/><text x="470" y="171" class="math">aᵢ</text>
<path d="M204 205V237" class="arrow"/><text x="65" y="234" class="small">open cover</text>
<path d="M786 205V237" class="arrow"/><text x="810" y="232" class="small">qᵢ smooth</text>
<path d="M248 264H704" class="arrow"/><text x="475" y="254" class="math">r</text>
<text x="310" y="315" class="small">r|Tᵢ ≃ qᵢaᵢ, including the specified bundle isomorphism</text>
<rect x="28" y="350" width="1064" height="312" rx="14" class="panel"/>
<text x="52" y="388" class="head">2. The actual closed-graph inverse image</text>
<text x="134" y="455" class="label">Γ<tspan baseline-shift="sub" font-size="19">a</tspan></text>
<text x="526" y="455" class="label">M × V</text><text x="953" y="455" class="label">V</text>
<text x="141" y="568" class="label">U</text><text x="556" y="568" class="label">M</text>
<path d="M223 445H493" class="arrow"/><text x="321" y="431" class="small">closed</text>
<path d="M658 445H917" class="arrow"/><text x="779" y="431" class="math">p</text>
<path d="M156 478V532" class="arrow"/><text x="179" y="511" class="small">isomorphism</text>
<path d="M574 478V532" class="arrow"/><text x="599" y="511" class="math">π</text>
<path d="M216 558H521" class="arrow"/><text x="353" y="585" class="math">i</text>
<text x="70" y="625" class="math">T<tspan baseline-shift="sub" font-size="18">M</tspan>(a,K) = π₊ Γ<tspan baseline-shift="sub" font-size="18">Γa</tspan>(p<tspan baseline-shift="super" font-size="18">!</tspan>K) = i₊a<tspan baseline-shift="super" font-size="18">!</tspan>K</text>
<rect x="28" y="682" width="1064" height="228" rx="14" class="panel"/>
<text x="52" y="720" class="head">3. Closed support and a finite Čech direction</text>
<text x="65" y="765" class="math">Γ<tspan baseline-shift="sub" font-size="18">Z</tspan> = Fib(id → j₊j<tspan baseline-shift="super" font-size="18">!</tspan>)</text>
<text x="565" y="765" class="small">Both functors preserve regular Ind objects.</text>
<text x="65" y="817" class="math">K</text><path d="M95 807H192" class="arrow"/>
<text x="208" y="817" class="math">⊕ (jᵢ)₊ K|Uᵢ</text><path d="M414 807H505" class="arrow"/>
<text x="522" y="817" class="math">⊕ (jᵢⱼ)₊ K|Uᵢ ∩ Uⱼ</text><path d="M850 807H925" class="arrow"/>
<text x="945" y="817" class="math">···</text>
<text x="65" y="870" class="small">Finite width r − 1; the coefficient complex may be unbounded in both directions.</text>
<rect x="28" y="930" width="1064" height="182" rx="14" class="panel"/>
<text x="52" y="968" class="head">Square-zero graph: two functor applications</text>
<text x="65" y="1010" class="math">I<tspan baseline-shift="sub" font-size="18">Γ</tspan> = (s², t − s),   √I<tspan baseline-shift="sub" font-size="18">Γ</tspan> = (s,t)</text>
<text x="65" y="1061" class="math">O<tspan baseline-shift="sub" font-size="18">A²</tspan>[1]</text><path d="M195 1050H339" class="arrow"/>
<text x="235" y="1090" class="small">Γ<tspan baseline-shift="sub" font-size="15">(0,0)</tspan></text>
<text x="359" y="1061" class="math">δ<tspan baseline-shift="sub" font-size="18">(0,0)</tspan>[−1]</text><path d="M539 1050H697" class="arrow"/>
<text x="565" y="1035" class="small">π₊</text><text x="720" y="1061" class="math">δ<tspan baseline-shift="sub" font-size="18">0</tspan>[−1]</text>
</svg>