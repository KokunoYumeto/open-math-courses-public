<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1290" viewBox="0 0 1120 1290" role="img" aria-labelledby="title desc">
<title id="title">Complex coefficient fusion and the full unbounded Hecke action</title>
<desc id="desc">The actual coefficient functor, normalized collision, projective correspondence, dualizing source factor, coefficient colimit and half-twist transport. Full unital Ran and spectral coefficients remain separate.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#324a65"/></marker></defs>
<rect width="1120" height="1290" fill="#fafbff"/>
<text x="35" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17263c">Complex coefficient fusion and the Hecke action</text>
<text x="35" y="74" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Ground and coefficient field: C. Every genus and every bundle component.</text>
<rect x="25" y="99" width="1070" height="175" rx="12" fill="#e9effb" stroke="#9baec6"/>
<text x="45" y="131" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">1. Keep the full ambient mapping complexes — §3.59; SH.6–SH.7</text>
<rect x="45" y="152" width="380" height="72" rx="12" fill="#ffffff" stroke="#9baec6"/>
<rect x="675" y="152" width="390" height="72" rx="12" fill="#ffffff" stroke="#9baec6"/>
<text x="60" y="181" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Dᵇ Rep_fd(Ĝ)  →  Ind Dᵇ Rep_fd(Ĝ)</text>
<text x="60" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Actual ordinary Satake heart coefficients</text>
<path d="M435 188 L665 188" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="474" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">S_fin, then colimits</text>
<text x="691" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Full spherical DG category</text>
<text x="691" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Higher equivariant Hom is retained</text>
<text x="45" y="252" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Example: the torus unit has ambient Ext² = C; its semisimple coefficient Ext² = 0.</text>
<rect x="25" y="290" width="1070" height="171" rx="12" fill="#edf6f2" stroke="#9baec6"/>
<text x="45" y="322" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">2. Moving families and normalized collision — §3.60; SH.9–SH.12</text>
<text x="45" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">F_r,D : one ordered-point base normalization [r], full coordinate and jet descent</text>
<text x="45" y="389" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">r points  →  b collision blocks</text>
<path d="M356 383 L539 383" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="561" y="389" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17263c">i! F_r,D [r − b]  ≃  F_b,D</text>
<text x="45" y="423" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Sheaves: i* F_r [−(r − b)]. At a fixed tuple: i! F_r,D [r].</text>
<text x="45" y="448" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Component exchange (−1)^{e(P)e(Q)} and coefficient cochain Koszul signs both remain.</text>
<rect x="25" y="477" width="1070" height="383" rx="12" fill="#f5f0fb" stroke="#9baec6"/>
<text x="45" y="509" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">3. Actual finite-support projective correspondence — §3.61; SH.14–SH.17</text>
<rect x="70" y="535" width="275" height="61" rx="12" fill="#ffffff" stroke="#9baec6"/>
<rect x="445" y="535" width="245" height="61" rx="12" fill="#ffffff" stroke="#9baec6"/>
<rect x="810" y="535" width="235" height="61" rx="12" fill="#ffffff" stroke="#9baec6"/>
<text x="85" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">Y = Bun_G(X)</text>
<text x="460" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">Hecke endpoint H</text>
<text x="825" y="571" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">Y × Xʳ</text>
<path d="M435 568 L356 568" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="361" y="545" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17263c">h_in</text>
<path d="M700 568 L800 568" stroke="#324a65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="711" y="545" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17263c">h_out</text>
<text x="45" y="628" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Common frame: U × Gr ←p A_U →q H_U, relative dimension e_(n,r) = nr dim G</text>
<text x="45" y="663" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">q! K_U = p!(ω_U ⊠ F_r,D),   ω_U = O_U[dim U]</text>
<text x="45" y="697" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">q!(h_in,U! M_U ⊗! K_U) = p!(M_U ⊠ F_r,D),   M_U = u! M</text>
<text x="45" y="732" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17263c">Hʳ_V(M) = h_out,* (h_in! M ⊗! K)</text>
<text x="45" y="766" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Normalized torsor formula: [−e_(n,r)] on both sides. It is not itself monoidal.</text>
<text x="45" y="800" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Singular finite supports use smooth projective ambients; all input degrees remain.</text>
<text x="45" y="834" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">SH.14 proves unbounded base change, projection formula and coherent chart maps.</text>
<rect x="25" y="876" width="1070" height="199" rx="12" fill="#fff5e7" stroke="#9baec6"/>
<text x="45" y="908" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">4. Units, coefficient colimits and the half twist — SH.18–SH.19</text>
<text x="45" y="944" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">Unit family:  Hʳ_1(M) = M ⊠ O_Xʳ = p_Y! M[−r]</text>
<text x="45" y="978" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Arbitrary coefficient: colimit of its bounded-support functors, with every arrow.</text>
<text x="45" y="1011" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Half twist:  Hʳ,L = T⁻¹ Hʳ T; middle operator factors cancel before pushforward.</text>
<text x="45" y="1048" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Three- and four-step chains retain composition, collision, exchange and the pentagon.</text>
<rect x="25" y="1091" width="1070" height="174" rx="12" fill="#ffffff" stroke="#9baec6"/>
<text x="45" y="1123" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">Proof locators and the remaining construction</text>
<text x="45" y="1158" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Finite correspondence: GL-SAT-07 §§1–9. Fusion and coordinates: GL-SAT-08 §§1–7.</text>
<text x="45" y="1189" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Actual dual group and cycle pinning: GL-SAT-11 §§7–8. Normalizations: SH.20–SH.24.</text>
<text x="45" y="1220" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Full D-module-valued unital Ran and spectral coefficients still require their proofs.</text>
<text x="45" y="1247" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Derived tempered Satake, all-field comparison and nilpotent regularity remain separate.</text>
</svg>
