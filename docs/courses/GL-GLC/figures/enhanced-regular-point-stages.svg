<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1460" viewBox="0 0 1120 1460" role="img" aria-labelledby="title desc"><title id="title">Regular nilpotent enhanced stages and full coefficient extension</title><desc id="desc">The actual continuous Ran lift supplies the restricted spectral action. The regular nilpotent enhanced stages have compact point generators. Their inclusion has a continuous spectral-linear right adjoint, which retains fullness under coefficient extension. Geometric-point membership is proved in GFP.49–GFP.52.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31546b" /></marker><marker id="extra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b4c32" /></marker></defs><rect width="1120" height="1460" fill="white" /><text x="34" y="43" font-size="25" fill="#132f42" font-family="Arial, sans-serif">Regular nilpotent enhanced stages and full coefficient extension</text><rect x="28" y="72" width="1064" height="280" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="110" font-size="23" fill="#132f42" font-family="Arial, sans-serif">1. The given Ran lift and the actual spectral action</text><text x="185" y="167" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">a ∈ A</text><text x="848" y="167" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">D(a) ∈ R</text><line x1="300" y1="150" x2="718" y2="150" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="509.0" y="137.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">D</text><line x1="718" y1="190" x2="300" y2="190" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="509.0" y="177.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">L</text><text x="480" y="234" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">L D(a) ≅ a</text><text x="70" y="285" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">Ψ(a,c) ≅ Φ(D(a),c) ∈ C</text><text x="70" y="325" font-size="20" fill="#132f42" font-family="Arial, sans-serif">g(X) &gt; 0; C consists of regular Ind objects with nilpotent support.</text><rect x="28" y="372" width="1064" height="365" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="410" font-size="23" fill="#132f42" font-family="Arial, sans-serif">2. Full action modules and compact point generators</text><text x="260" y="467" font-size="34" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">C<tspan baseline-shift="sub" font-size="24.48">E</tspan></text><text x="838" y="467" font-size="34" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">N<tspan baseline-shift="sub" font-size="24.48">E</tspan></text><line x1="340" y1="453" x2="749" y2="453" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="544.5" y="440.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">full</text><text x="260" y="640" font-size="34" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">C</text><text x="838" y="640" font-size="34" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">N</text><line x1="340" y1="627" x2="749" y2="627" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="544.5" y="614.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">j</text><line x1="259" y1="495" x2="259" y2="598" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="838" y1="495" x2="838" y2="598" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="85" y="550" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">J<tspan baseline-shift="sub" font-size="18.0">E</tspan><tspan baseline-shift="super" font-size="18.0">C</tspan></text><text x="876" y="550" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">J<tspan baseline-shift="sub" font-size="18.0">E</tspan><tspan baseline-shift="super" font-size="18.0">N</tspan></text><text x="340" y="528" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">Q<tspan baseline-shift="sub" font-size="18.0">E,i</tspan> ↦ P<tspan baseline-shift="sub" font-size="18.0">E</tspan> δ<tspan baseline-shift="sub" font-size="18.0">i</tspan></text><text x="340" y="573" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">G<tspan baseline-shift="sub" font-size="18.0">E,i</tspan> = J<tspan baseline-shift="sub" font-size="18.0">E</tspan> Q<tspan baseline-shift="sub" font-size="18.0">E,i</tspan></text><text x="70" y="692" font-size="22" fill="#132f42" font-family="Arial, sans-serif">The same generators are compact in C and in N.</text><rect x="28" y="757" width="1064" height="300" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="795" font-size="23" fill="#132f42" font-family="Arial, sans-serif">3. The continuous spectral-linear adjunction</text><text x="183" y="853" font-size="33" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">C</text><text x="877" y="853" font-size="33" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">N</text><line x1="280" y1="837" x2="778" y2="837" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="529.0" y="824.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">j</text><line x1="778" y1="875" x2="280" y2="875" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="529.0" y="862.0" font-size="20" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">r</text><text x="70" y="937" font-size="27" fill="#132f42" font-family="Cambria Math, Georgia, serif">r j ≅ Id<tspan baseline-shift="sub" font-size="19.44">C</tspan>;  r(n) = ∫<tspan baseline-shift="super" font-size="19.44">c</tspan> c ⊗ RHom<tspan baseline-shift="sub" font-size="19.44">N</tspan>(jc,n)</text><text x="70" y="992" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">j<tspan baseline-shift="sub" font-size="18.72">T</tspan> is full;  ℓ<tspan baseline-shift="sub" font-size="18.72">T</tspan>(F) = Cofib(j<tspan baseline-shift="sub" font-size="18.72">T</tspan> r<tspan baseline-shift="sub" font-size="18.72">T</tspan> F → F)</text><text x="70" y="1035" font-size="20" fill="#132f42" font-family="Arial, sans-serif">The adjunction, triangle and orthogonality extend with coefficients.</text><rect x="28" y="1077" width="1064" height="355" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="1115" font-size="23" fill="#132f42" font-family="Arial, sans-serif">4. Enhanced differentials and the additional geometric point test</text><text x="70" y="1170" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">A₂ = C[t]/(t²)</text><text x="70" y="1220" font-size="30" fill="#132f42" font-family="Cambria Math, Georgia, serif">[A₂  —t→  A₂]</text><text x="70" y="1268" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">degrees −1, 0; H<tspan baseline-shift="super" font-size="16.56">−1</tspan> = H<tspan baseline-shift="super" font-size="16.56">0</tspan> = k</text><text x="70" y="1315" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Compact, with a nonformal A₂-action.</text><text x="650" y="1170" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif">M = ⊕<tspan baseline-shift="sub" font-size="17.28">m</tspan> (C(x)[y] ⊗ C²)[2m]</text><text x="650" y="1215" font-size="22" fill="#132f42" font-family="Arial, sans-serif">Original points: Hom = 0</text><line x1="815" y1="1233" x2="815" y2="1280" stroke="#8b4c32" stroke-width="2" marker-end="url(#extra)" stroke-dasharray="7 6" /><text x="650" y="1320" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">K = C(u), point (u,0):</text><text x="650" y="1363" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">RHom(Δ,M<tspan baseline-shift="sub" font-size="16.56">K</tspan>) = ⊕<tspan baseline-shift="sub" font-size="16.56">m</tspan> K²[2m−2]</text><text x="70" y="1405" font-size="20" fill="#783e2b" font-family="Arial, sans-serif">Geometric point membership: ERP.24; proof GFP.49–GFP.52.</text></svg>