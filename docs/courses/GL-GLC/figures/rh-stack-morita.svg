<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1220" viewBox="0 0 1120 1220" role="img" aria-labelledby="title desc">
<title id="title">Chartwise Riemann-Hilbert descent and Morita cancellation</title>
<desc id="desc">A commuting inverse-image square on chartwise ind-categories, the equivalence of their descent limits, and the evaluation of the two intermediate operator bimodules in composed twisted kernels.</desc>
<metadata>{&quot;scope&quot;: &quot;Complex ground and coefficient field; smooth finite-type chart categories; chartwise ind-regular descent on Bun_G; normalized global root line&quot;, &quot;locators&quot;: [&quot;RH.1&quot;, &quot;RH.3&quot;, &quot;RH.4&quot;, &quot;RH.6&quot;, &quot;RH.7&quot;, &quot;RH.8&quot;, &quot;RH.12&quot;, &quot;RH.16&quot;, &quot;RH.17&quot;, &quot;RH.20&quot;, &quot;RH.21&quot;], &quot;kind&quot;: &quot;Schematic of exact categorical maps; no sampled geometry&quot;, &quot;provider&quot;: &quot;../GL-DMOD/the-riemann-hilbert-correspondence.html#1-the-general-theorem-and-its-precise-target&quot;, &quot;kernel_sides&quot;: {&quot;B21&quot;: [&quot;D(Y2)&quot;, &quot;D(Y1)&quot;], &quot;P2&quot;: [&quot;D(L2)&quot;, &quot;D(Y2)&quot;], &quot;Q2&quot;: [&quot;D(Y2)&quot;, &quot;D(L2)&quot;]}}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#344f6d"/></marker></defs>
<rect width="1120" height="1220" fill="white"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="40" y="55" font-size="31" fill="#152536" font-weight="650">Ind-complete the charts, then descend</text>
<text x="40" y="91" font-size="20" fill="#152536" font-weight="400">Complex coefficients. Smooth charts. Full derived maps and attaching data.</text>
<rect x="30" y="120" width="1060" height="395" rx="14" fill="#f6f9fc" stroke="#cad5e2"/>
<text x="50" y="160" font-size="25" fill="#152536" font-weight="600">1. The actual extraordinary comparison on each chart</text>
<text x="110" y="245" font-size="28" fill="#115b98" font-weight="600">Ind R(V)</text>
<text x="725" y="245" font-size="28" fill="#115b98" font-weight="600">Ind R(U)</text>
<path d="M330,237 L680,237" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="475" y="222" font-size="24" fill="#152536" font-weight="400">f !</text>
<path d="M230,266 L230,395" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M845,266 L845,395" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="60" y="339" font-size="22" fill="#177654" font-weight="400">DR ind</text>
<text x="882" y="339" font-size="22" fill="#177654" font-weight="400">DR ind</text>
<text x="110" y="437" font-size="28" fill="#177654" font-weight="600">Ind B(V)</text>
<text x="725" y="437" font-size="28" fill="#177654" font-weight="600">Ind B(U)</text>
<path d="M330,429 L680,429" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="435" y="414" font-size="23" fill="#152536" font-weight="400">f an,! ind</text>
<text x="412" y="324" font-size="20" fill="#152536" font-weight="600">β ind: the square commutes</text>
<text x="359" y="357" font-size="19" fill="#152536" font-weight="400">Smooth flat frames: (2πi)⁻ʳ</text>
<text x="50" y="488" font-size="18" fill="#152536" font-weight="400">R = bounded regular D-complexes; B = bounded finite algebraically constructible sheaves.</text>
<rect x="30" y="535" width="1060" height="230" rx="14" fill="#f0f8f5" stroke="#cad5e2"/>
<text x="50" y="577" font-size="25" fill="#152536" font-weight="600">2. Keep every transition and take the descent limit</text>
<text x="77" y="648" font-size="26" fill="#115b98" font-weight="600">lim charts Ind R(U)</text>
<path d="M455,640 L649,640" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="521" y="625" font-size="25" fill="#152536" font-weight="400">≃</text>
<text x="699" y="648" font-size="26" fill="#177654" font-weight="600">lim charts Ind B(U)</text>
<text x="50" y="697" font-size="20" fill="#152536" font-weight="400">All higher transition relations are transported by the same comparison maps.</text>
<text x="50" y="734" font-size="19" fill="#152536" font-weight="400">No interchange of Ind with an infinite limit; no chartwise-to-global compactness inference.</text>
<rect x="30" y="785" width="1060" height="335" rx="14" fill="#fff8ef" stroke="#cad5e2"/>
<text x="50" y="827" font-size="24" fill="#152536" font-weight="600">3. Cancel the middle operator factors before convolution pushforward</text>
<text x="60" y="887" font-size="26" fill="#115b98" font-weight="600">Bᴸ₃₂ = P₃ ⊗ B₃₂ ⊗ Q₂</text>
<text x="643" y="887" font-size="26" fill="#115b98" font-weight="600">Bᴸ₂₁ = P₂ ⊗ B₂₁ ⊗ Q₁</text>
<text x="60" y="941" font-size="21" fill="#152536" font-weight="400">The middle pair has opposite operator sides:</text>
<text x="150" y="991" font-size="27" fill="#a84810" font-weight="600">Q₂ ⊗ over D(L₂) P₂</text>
<path d="M610,981 L744,981" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="788" y="991" font-size="27" fill="#a84810" font-weight="600">D(Y₂)</text>
<text x="60" y="1043" font-size="21" fill="#152536" font-weight="400">Result: P₃ ⊗ (B₃₂ ⋆ B₂₁) ⊗ Q₁, with all transfer densities and shifts retained.</text>
<text x="60" y="1087" font-size="20" fill="#152536" font-weight="400">Triple composition evaluates the same two pairs, so both associations agree.</text>
<text x="40" y="1161" font-size="19" fill="#152536" font-weight="400">RH.3–RH.9: chart and stack proofs. RH.12–RH.17: Morita triangles and kernel composition.</text>
<text x="40" y="1197" font-size="18" fill="#152536" font-weight="400">L need not be flat: for O(1) on P¹, z ∂z z⁻¹ = ∂z − z⁻¹. Exercise 3.AY proves the obstruction.</text>
</g></svg>
