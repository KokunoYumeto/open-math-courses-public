<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="790" viewBox="0 0 1040 790" role="img" aria-labelledby="title desc">
<title id="title">Finite point detectors for a conical support on the plane</title>
<desc id="desc">The support is the zero section, the conormal to y equals zero, and the full cotangent fibre at the origin. The three strata have dimensions two, one and zero. Their support fibres have dimensions zero, one and two. Detectors are zero comma one, one comma zero and zero comma zero. The base drawing is a real coordinate slice; the covector planes are separately drawn fibres.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#617083"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,10 L10,0" stroke="#cb8d8d" stroke-width="1"/></pattern></defs>
<rect width="1040" height="790" fill="#fcfcf9"/>
<text x="38" y="42" font-family="Arial, sans-serif" font-size="25" fill="#202a36" text-anchor="start" font-weight="bold">Finite points detect a fixed characteristic-support category</text>
<text x="38" y="78" font-family="Arial, sans-serif" font-size="21" fill="#202a36" text-anchor="start">N = zero section ∪ conormal of D ∪ cotangent fibre at 0</text>
<text x="38" y="107" font-family="Arial, sans-serif" font-size="19" fill="#202a36" text-anchor="start">V = affine plane;  D = {y = 0};  covector = α dx + β dy</text>
<rect x="25" y="132" width="990" height="435" rx="10" fill="#eef2f6" stroke="#d4dae1"/>
<text x="51" y="165" font-family="Arial, sans-serif" font-size="19" fill="#202a36" text-anchor="start" font-weight="bold">Base: a real coordinate slice</text>
<rect x="55" y="190" width="220" height="220" fill="#edf5fb"/>
<line x1="55" y1="332" x2="275" y2="332" stroke="#b17b19" stroke-width="3"/>
<line x1="158" y1="410" x2="158" y2="190" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="55" y1="332" x2="275" y2="332" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<text x="282" y="339" font-family="Arial, sans-serif" font-size="17" fill="#202a36" text-anchor="start">x</text>
<text x="168" y="195" font-family="Arial, sans-serif" font-size="17" fill="#202a36" text-anchor="start">y</text>
<circle cx="158" cy="258" r="5" fill="#174f88"/>
<text x="167" y="250" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">(0,1)</text>
<circle cx="232" cy="332" r="5" fill="#174f88"/>
<text x="229" y="317" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="end">(1,0)</text>
<circle cx="158" cy="332" r="6" fill="#ad3a3a"/>
<text x="150" y="355" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="end">0</text>
<text x="55" y="436" font-family="Arial, sans-serif" font-size="16" fill="#8d610f" text-anchor="start">D is the horizontal axis.</text>
<text x="55" y="462" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">Blue: chosen point in each</text>
<text x="55" y="484" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">positive-dimensional stratum.</text>
<text x="55" y="518" font-family="Arial, sans-serif" font-size="16" fill="#ad3a3a" text-anchor="start">Red: the origin detector.</text>
<text x="418" y="169" font-family="Arial, sans-serif" font-size="20" fill="#202a36" text-anchor="middle" font-weight="bold">V ∖ D</text>
<text x="418" y="200" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">dim S = 2; dim Nᵥ = 0</text>
<line x1="335" y1="319" x2="507" y2="319" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="418" y1="402" x2="418" y2="229" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<text x="511" y="326" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">α</text>
<text x="426" y="235" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">β</text>
<circle cx="418" cy="319" r="6" fill="#174f88"/>
<text x="418" y="438" font-family="Arial, sans-serif" font-size="16" fill="#174f88" text-anchor="middle">α = β = 0</text>
<line x1="418" y1="450" x2="418" y2="482" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<text x="418" y="507" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">cotangent projection</text>
<text x="418" y="535" font-family="Arial, sans-serif" font-size="18" fill="#174f88" text-anchor="middle">(0,1)</text>
<text x="650" y="169" font-family="Arial, sans-serif" font-size="20" fill="#202a36" text-anchor="middle" font-weight="bold">D ∖ {0}</text>
<text x="650" y="200" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">dim S = 1; dim Nᵥ = 1</text>
<line x1="567" y1="319" x2="739" y2="319" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="402" x2="650" y2="229" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<text x="743" y="326" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">α</text>
<text x="658" y="235" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">β</text>
<line x1="650" y1="397" x2="650" y2="242" stroke="#a47117" stroke-width="5"/>
<text x="650" y="438" font-family="Arial, sans-serif" font-size="16" fill="#a47117" text-anchor="middle">α = 0; β arbitrary</text>
<line x1="650" y1="450" x2="650" y2="482" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="507" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">cotangent projection</text>
<text x="650" y="535" font-family="Arial, sans-serif" font-size="18" fill="#a47117" text-anchor="middle">(1,0)</text>
<text x="882" y="169" font-family="Arial, sans-serif" font-size="20" fill="#202a36" text-anchor="middle" font-weight="bold">{0}</text>
<text x="882" y="200" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">dim S = 0; dim Nᵥ = 2</text>
<rect x="800" y="237" width="164" height="164" fill="#f9e5e5"/>
<rect x="800" y="237" width="164" height="164" fill="url(#hatch)"/>
<line x1="799" y1="319" x2="971" y2="319" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="882" y1="402" x2="882" y2="229" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<text x="975" y="326" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">α</text>
<text x="890" y="235" font-family="Arial, sans-serif" font-size="16" fill="#202a36" text-anchor="start">β</text>
<circle cx="882" cy="319" r="4" fill="#ad3a3a"/>
<text x="882" y="438" font-family="Arial, sans-serif" font-size="16" fill="#ad3a3a" text-anchor="middle">α, β arbitrary</text>
<line x1="882" y1="450" x2="882" y2="482" stroke="#617083" stroke-width="2" marker-end="url(#arrow)"/>
<text x="882" y="507" font-family="Arial, sans-serif" font-size="15" fill="#202a36" text-anchor="middle">cotangent projection</text>
<text x="882" y="535" font-family="Arial, sans-serif" font-size="18" fill="#ad3a3a" text-anchor="middle">(0,0)</text>
<text x="37" y="603" font-family="Arial, sans-serif" font-size="22" fill="#202a36" text-anchor="start" font-weight="bold">Why the fibre bound works</text>
<text x="37" y="635" font-family="Arial, sans-serif" font-size="18" fill="#202a36" text-anchor="start">At a minimal nonzero stratum S, a supported module is i₊L by Kashiwara.</text>
<text x="37" y="666" font-family="Arial, sans-serif" font-size="18" fill="#202a36" text-anchor="start">Restriction ρ : T*V|S → T*S has full affine normal fibres of dimension c.</text>
<text x="37" y="697" font-family="Arial, sans-serif" font-size="18" fill="#202a36" text-anchor="start">Ch(i₊L) = ρ⁻¹Ch(L) ⊂ N;  dim Nᵥ ≤ c forces Ch(L) into the zero section.</text>
<text x="37" y="730" font-family="Arial, sans-serif" font-size="18" fill="#202a36" text-anchor="start">One point then detects every nonzero cohomology module of L (FD.7–FD.12).</text>
<text x="37" y="765" font-family="Arial, sans-serif" font-size="15" fill="#535e6b" text-anchor="start">Figure 3.4 · Exact algebraic support and detector coordinates · Proof: §§3.16–3.18</text>
</svg>
