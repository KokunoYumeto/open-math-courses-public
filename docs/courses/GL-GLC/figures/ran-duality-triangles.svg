<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1540" viewBox="0 0 1120 1540" role="img" aria-labelledby="title desc">
<title id="title">The two partial diagonals and the actual Ran duality triangles</title>
<desc id="desc">Exact affine coordinate equations for the common diagonal, the equality of three-coordinate D-module kernel maps, and the two normalized projection identities with the coefficient duality triangle.</desc>
<metadata>{&quot;projection&quot;: {&quot;origin&quot;: [340, 510], &quot;t1&quot;: [140, 80], &quot;t2&quot;: [140, -80], &quot;t3&quot;: [-60, -180]}, &quot;vertices&quot;: {&quot;000&quot;: [340, 510], &quot;001&quot;: [280, 330], &quot;010&quot;: [480, 430], &quot;011&quot;: [420, 250], &quot;100&quot;: [480, 590], &quot;101&quot;: [420, 410], &quot;110&quot;: [620, 510], &quot;111&quot;: [560, 330]}, &quot;coordinate_change&quot;: [[0, 1, 0], [-1, 1, 0], [0, -1, 1]], &quot;determinant&quot;: 1, &quot;mathematical_locators&quot;: [&quot;KG.12&quot;, &quot;KG.15&quot;, &quot;KG.16&quot;, &quot;KG.17&quot;, &quot;KG.18&quot;, &quot;KG.20&quot;, &quot;KG.21&quot;, &quot;KG.27&quot;, &quot;KG.29&quot;], &quot;source&quot;: &quot;https://arxiv.org/pdf/2010.01906v2, section11.3, Remark11.3.8&quot;}</metadata>
