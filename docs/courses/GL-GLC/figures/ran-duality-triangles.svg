<rect width="1120" height="1540" fill="white"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="40" y="55" font-size="30" fill="#152536" font-weight="650">The common diagonal gives both Ran triangles</text>
<text x="40" y="90" font-size="19" fill="#152536" font-weight="400">Smooth projective X/k; char(k) = 0; compact F ∈ D(Xᴶ); compact rigid coefficients.</text>
<rect x="30" y="115" width="1060" height="540" rx="14" fill="#f6f9fc" stroke="#cad5e2"/>
<text x="50" y="155" font-size="25" fill="#152536" font-weight="600">1. One coordinate: two transverse normal equations</text>
<text x="50" y="189" font-size="18" fill="#152536" font-weight="400">Affine polynomial model. The projected real cube illustrates the exact equations.</text>
