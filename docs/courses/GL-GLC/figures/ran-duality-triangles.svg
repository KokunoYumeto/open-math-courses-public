<path d="M340,510 L496.8,599.6" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="506.8" y="607.6" font-size="23" fill="#152536" font-weight="400">t₁</text>
<path d="M340,510 L496.8,420.4" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="506.8" y="428.4" font-size="23" fill="#152536" font-weight="400">t₂</text>
<path d="M340,510 L272.8,308.4" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="282.8" y="316.4" font-size="23" fill="#152536" font-weight="400">t₃</text>
<text x="284" y="535" font-size="17" fill="#152536" font-weight="400">(0,0,0)</text>
<text x="572" y="321" font-size="17" fill="#152536" font-weight="400">(1,1,1)</text>
<text x="70" y="275" font-size="23" fill="#177654" font-weight="600">Δ₂₃: b = 0</text>
<text x="67" y="307" font-size="21" fill="#177654" font-weight="400">t₂ = t₃</text>
<text x="70" y="405" font-size="23" fill="#115b98" font-weight="600">Δ₁₂: a = 0</text>
<text x="70" y="438" font-size="21" fill="#115b98" font-weight="400">t₁ = t₂</text>
<text x="520" y="555" font-size="21" fill="#a84810" font-weight="600">Small diagonal:</text>
<text x="520" y="585" font-size="21" fill="#a84810" font-weight="400">a = b = 0</text>
<rect x="735" y="232" width="330" height="370" rx="14" fill="#fff" stroke="#d2dbe6"/>
<text x="755" y="268" font-size="22" fill="#152536" font-weight="600">Base first, then normals</text>
<text x="755" y="312" font-size="24" fill="#152536" font-weight="400">z = t₂</text>
<text x="755" y="350" font-size="24" fill="#152536" font-weight="400">a = t₂ − t₁</text>
<text x="755" y="388" font-size="24" fill="#152536" font-weight="400">b = t₃ − t₂</text>
<text x="755" y="436" font-size="20" fill="#152536" font-weight="400">t₁ = z − a;  t₃ = z + b</text>
<text x="755" y="475" font-size="18" fill="#152536" font-weight="400">det ∂(z,a,b)/∂(t₁,t₂,t₃) = 1</text>
<text x="755" y="520" font-size="18" fill="#152536" font-weight="400">ε₂ = −1 on both ordered routes</text>
<text x="755" y="560" font-size="18" fill="#152536" font-weight="400">Their comparison coefficient is +1.</text>
<text x="50" y="632" font-size="18" fill="#152536" font-weight="400">Solution 3.AV; (KG.27)–(KG.29). General dimension retains every normal block.</text>
<rect x="30" y="680" width="1060" height="420" rx="14" fill="#f6f9fc" stroke="#cad5e2"/>
<text x="50" y="724" font-size="25" fill="#152536" font-weight="600">2. Kernel contraction before forgetting any coefficient label</text>
<text x="50" y="759" font-size="22" fill="#152536" font-weight="400">i₁₂(u,v) = (u,u,v);   i₂₃(u,v) = (u,v,v);   t(y) = (y,y,y).</text>
<rect x="50" y="803" width="290" height="74" rx="14" fill="#eaf3fc" stroke="#cad5e2"/>
<rect x="409" y="803" width="300" height="74" rx="14" fill="#fff" stroke="#cad5e2"/>
<rect x="780" y="803" width="290" height="74" rx="14" fill="#eaf7f1" stroke="#cad5e2"/>
<text x="71" y="848" font-size="26" fill="#152536" font-weight="400">i₁₂,*(k_Y ⊠ F)</text>
<text x="432" y="848" font-size="26" fill="#152536" font-weight="400">F ⊠ 𝔻F ⊠ F</text>
<text x="795" y="848" font-size="26" fill="#152536" font-weight="400">i₂₃,*(F ⊠ ω_Y)</text>
<path d="M340,840 L409,840" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M709,840 L780,840" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="290" y="797" font-size="17" fill="#152536" font-weight="400">cF ⊠ idF</text>
<text x="688" y="797" font-size="17" fill="#152536" font-weight="400">idF ⊠ e𝔻F</text>
<rect x="426" y="951" width="264" height="65" rx="14" fill="#fff0e4" stroke="#d98b50"/>
<text x="487" y="993" font-size="29" fill="#a84810" font-weight="600">t_* F</text>
<path d="M193,877 L426,980" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M690,980 L924,877" stroke="#344f6d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="189" y="941" font-size="20" fill="#152536" font-weight="400">i₁₂,* aF</text>
<text x="835" y="941" font-size="20" fill="#152536" font-weight="400">i₂₃,* bF</text>
<text x="50" y="1063" font-size="18" fill="#152536" font-weight="400">Both routes transpose to idF. Densities and ordered counit signs agree: (KG.12)–(KG.16).</text>
<rect x="30" y="1125" width="1060" height="350" rx="14" fill="#f6f9fc" stroke="#cad5e2"/>
<text x="50" y="1170" font-size="25" fill="#152536" font-weight="600">3. The outside maps and the coefficient triangle are identities</text>
<text x="58" y="1220" font-size="26" fill="#152536" font-weight="400">F  →  π₂,* (k_Y ⊠ F)  →  π₂,* j_* F = F</text>
<text x="700" y="1220" font-size="22" fill="#115b98" font-weight="400">unit, then aF: idF</text>
<text x="700" y="1250" font-size="18" fill="#152536" font-weight="400">(KG.17)</text>
<text x="58" y="1296" font-size="26" fill="#152536" font-weight="400">F = π₁,* j_* F  →  π₁,* (F ⊠ ω_Y)  →  F</text>
<text x="700" y="1296" font-size="22" fill="#177654" font-weight="400">bF, then trace: idF</text>
<text x="700" y="1326" font-size="18" fill="#152536" font-weight="400">(KG.18)</text>
<text x="58" y="1372" font-size="26" fill="#152536" font-weight="400">V  →  V ⊗ V∨ ⊗ V  →  V: idV</text>
<text x="700" y="1372" font-size="20" fill="#152536" font-weight="400">after all three labels fold</text>
<text x="58" y="1420" font-size="21" fill="#152536" font-weight="600">Together: idA and idA∨ in the actual Ran category. (KG.19)–(KG.22).</text>
<text x="40" y="1515" font-size="18" fill="#152536" font-weight="400">Free source: arXiv:2010.01906v2, §11.3, Remark 11.3.8. Complete proofs: Lesson 3, §§3.51–3.54.</text>
