<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1460" viewBox="0 0 1120 1460" role="img" aria-labelledby="title desc"><title id="title">Genus-zero restricted Hecke coefficients</title><desc id="desc">An arbitrary nilpotent-supported input generates a presentable fixed-point-Hecke-invariant envelope. The full loop action lifts into it. The universal odd tensor derivation has the finite exterior algebra Sym(h dual[1]); its even central action has an equivariant polynomial zero. Full frame descent and actual Ran action transport give ind-connection coefficients and the all-genus complex supported projector image.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31546b" /></marker><marker id="extra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b4c32" /></marker></defs><rect width="1120" height="1460" fill="white" /><text x="34" y="43" font-size="27" fill="#132f42" font-family="Arial, sans-serif">Genus-zero restricted Hecke coefficients</text><rect x="28" y="72" width="1064" height="295" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="110" font-size="23" fill="#132f42" font-family="Arial, sans-serif">1. An envelope for an arbitrary independently supported input</text><text x="70" y="156" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">F ∈ S<tspan baseline-shift="sub" font-size="18.0">Y</tspan>;   W<tspan baseline-shift="sub" font-size="18.0">F</tspan> = {finite fixed-point Hecke words on F}</text><text x="70" y="210" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">C<tspan baseline-shift="sub" font-size="20.88">F</tspan> = Loc<tspan baseline-shift="sub" font-size="20.88">M</tspan>(W<tspan baseline-shift="sub" font-size="20.88">F</tspan>) ⊂ S<tspan baseline-shift="sub" font-size="20.88">Y</tspan></text><text x="70" y="264" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">C<tspan baseline-shift="sub" font-size="20.88">F</tspan> ⊗ Q = B<tspan baseline-shift="sub" font-size="20.88">Ω</tspan>-Mod(C<tspan baseline-shift="sub" font-size="20.88">F</tspan>)</text><text x="70" y="316" font-size="20" fill="#132f42" font-family="Arial, sans-serif">The underlying fixed-point operation preserves C<tspan baseline-shift="sub" font-size="14.4">F</tspan>, so the full action lifts.</text><text x="70" y="350" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Presentable; no ordinary compactness or AIC.17 premise. GZR.4–GZR.11.</text><rect x="28" y="387" width="1064" height="320" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="425" font-size="23" fill="#132f42" font-family="Arial, sans-serif">2. The full framed odd tensor derivation</text><text x="70" y="473" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">A₀ = Sym(h<tspan baseline-shift="super" font-size="20.88">∨</tspan>[1]) = Λ(ξ₁,…,ξ<tspan baseline-shift="sub" font-size="20.88">d</tspan>)</text><text x="70" y="529" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">E<tspan baseline-shift="sub" font-size="20.16">V</tspan><tspan baseline-shift="super" font-size="20.16">fr</tspan> = A₀ ⊗ V;   u = Σ ξ<tspan baseline-shift="sub" font-size="20.16">i</tspan> dρ<tspan baseline-shift="sub" font-size="20.16">V</tspan>(e<tspan baseline-shift="sub" font-size="20.16">i</tspan>)</text><text x="70" y="585" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">v<tspan baseline-shift="super" font-size="20.16">m</tspan> = 0;   v = u²;   m = ⌊d/2⌋ + 1</text><text x="70" y="639" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">SL₂ standard coefficient:  U² ≠ 0;  U⁴ = 0.</text><text x="70" y="687" font-size="20" fill="#132f42" font-family="Arial, sans-serif">The loop algebra retains u² ≠ 0; the universal matrix is torsion. GZR.18–25.</text><rect x="28" y="727" width="1064" height="290" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="765" font-size="23" fill="#132f42" font-family="Arial, sans-serif">3. Full frame descent and the actual restricted action</text><text x="70" y="813" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">R<tspan baseline-shift="sub" font-size="20.16">Q</tspan> ≃ QCoh([Spec A₀/H]) = A</text><text x="70" y="869" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">A ⊗ C<tspan baseline-shift="sub" font-size="20.16">F</tspan> → C<tspan baseline-shift="sub" font-size="20.16">F</tspan>;   E<tspan baseline-shift="sub" font-size="20.16">V</tspan> ∈ A ⊗ I</text><text x="70" y="923" font-size="29" fill="#132f42" font-family="Cambria Math, Georgia, serif">H<tspan baseline-shift="sub" font-size="20.88">V</tspan>(F) = act(E<tspan baseline-shift="sub" font-size="20.88">V</tspan>,F) ∈ M ⊗ I</text><text x="70" y="977" font-size="21" fill="#132f42" font-family="Arial, sans-serif">Every original action map and higher relation is retained. GZR.26–32.</text><rect x="28" y="1037" width="1064" height="395" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="1075" font-size="23" fill="#132f42" font-family="Arial, sans-serif">4. Full independent nilpotent support in every genus over C</text><text x="70" y="1124" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">S<tspan baseline-shift="sub" font-size="20.16">Y</tspan> = N<tspan baseline-shift="sub" font-size="20.16">Hl</tspan>(Y) = EssIm(Π<tspan baseline-shift="sub" font-size="20.16">res</tspan>) ⊂ R_∞(Y)</text><text x="70" y="1181" font-size="22" fill="#132f42" font-family="Arial, sans-serif">Connected reductive G; every component; both infinite input tails.</text><text x="70" y="1238" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif">Π<tspan baseline-shift="sub" font-size="17.28">res</tspan> | S<tspan baseline-shift="sub" font-size="17.28">Y</tspan> ≃ Id;  the existing restricted normalization is retained.</text><text x="70" y="1295" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif">Q<tspan baseline-shift="sub" font-size="17.28">P¹</tspan> ≠ I<tspan baseline-shift="sub" font-size="17.28">P¹</tspan>;  the Laurent word module is still excluded.</text><text x="70" y="1350" font-size="21" fill="#783e2b" font-family="Arial, sans-serif">AIC.17 and other geometric ground fields retain their hypotheses.</text><text x="70" y="1403" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Exact comparisons: GZR.33–GZR.34. Matrix and scalar examples: 3.HS–HT.</text></svg>