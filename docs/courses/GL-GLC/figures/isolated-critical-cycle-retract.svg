<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1540" viewBox="0 0 1120 1540" role="img" aria-labelledby="title desc">
<title id="title">Quartic critical cluster and its reverse exit filtration</title>
<desc id="desc">Exact source coordinates four p equal cube roots of unity; exact target coordinates 1024 c equal minus three times those roots. The three columns use separate scales. Seven ordered real levels have schematic heights. The lower diagram gives actual restriction-fibre maps F zero to F three and the three degree-zero Morse quotients, retaining the original whole-cluster pair.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1540" fill="#f8fafc"/>
<text x="40" y="54" text-anchor="start" font-family="Georgia,serif" font-size="35" fill="#17324b" font-weight="bold">A degenerate quartic: the whole critical cluster</text>
<text x="40" y="104" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">gₛ(z) = z⁴/4 − sz/64;  s = 1 in the two complex diagrams.</text>
<rect x="32" y="150" width="336" height="650" rx="14" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<rect x="392" y="150" width="336" height="650" rx="14" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<rect x="752" y="150" width="336" height="650" rx="14" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="58" y="203" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="bold">Source: 4p = ζ</text>
<text x="58" y="247" text-anchor="start" font-family="Georgia,serif" font-size="22" fill="#17324b" font-weight="normal">Re and Im of 4p</text>
<text x="418" y="203" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="bold">Target: 1024c = −3ζ</text>
<text x="418" y="247" text-anchor="start" font-family="Georgia,serif" font-size="22" fill="#17324b" font-weight="normal">Re and Im of 1024c</text>
<line x1="68" y1="440" x2="332" y2="440" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<line x1="200" y1="580" x2="200" y2="297" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<text x="309" y="473" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">Re</text>
<text x="212" y="314" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">Im</text>
<text x="210" y="466" text-anchor="start" font-family="Georgia,serif" font-size="20" fill="#17324b" font-weight="normal">0</text>
<line x1="428" y1="440" x2="692" y2="440" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<line x1="560" y1="580" x2="560" y2="297" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<text x="669" y="473" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">Re</text>
<text x="572" y="314" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">Im</text>
<text x="570" y="466" text-anchor="start" font-family="Georgia,serif" font-size="20" fill="#17324b" font-weight="normal">0</text>
<polygon points="290,440 155.0,362.0577136594005 155.0,517.9422863405995" fill="none" stroke="#17667d" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="290" cy="440" r="6" fill="#17667d"/>
<circle cx="155.0" cy="362.0577136594005" r="6" fill="#17667d"/>
<circle cx="155.0" cy="517.9422863405995" r="6" fill="#17667d"/>
<polygon points="473,440 603.5,515.3442101292462 603.5,364.65578987075384" fill="none" stroke="#8c467a" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="473" cy="440" r="6" fill="#8c467a"/>
<circle cx="603.5" cy="515.3442101292462" r="6" fill="#8c467a"/>
<circle cx="603.5" cy="364.65578987075384" r="6" fill="#8c467a"/>
<text x="310" y="428" text-anchor="start" font-family="Georgia,serif" font-size="22" fill="#17324b" font-weight="normal">1</text>
<text x="126" y="340" text-anchor="start" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">ζ₊</text>
<text x="126" y="553" text-anchor="start" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">ζ₋</text>
<text x="450" y="428" text-anchor="start" font-family="Georgia,serif" font-size="22" fill="#17324b" font-weight="normal">−3</text>
<text x="621" y="548" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">−3ζ₊</text>
<text x="621" y="339" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">−3ζ₋</text>
<text x="58" y="655" text-anchor="start" font-family="Georgia,serif" font-size="22" fill="#17324b" font-weight="normal">ζ₊ = (−1 + i√3)/2</text>
<text x="58" y="706" text-anchor="start" font-family="Georgia,serif" font-size="22" fill="#17324b" font-weight="normal">ζ₋ = (−1 − i√3)/2</text>
<text x="418" y="655" text-anchor="start" font-family="Georgia,serif" font-size="22" fill="#17324b" font-weight="normal">pⱼ(s) → 0;  cⱼ(s) → 0.</text>
<text x="418" y="706" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">All three points are retained.</text>
<text x="778" y="203" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="bold">Real critical levels</text>
<text x="778" y="247" text-anchor="start" font-family="Georgia,serif" font-size="20" fill="#17324b" font-weight="normal">|g₁ − v|²;  v = −(1+i)/16</text>
<line x1="780" y1="284" x2="780" y2="680" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<line x1="776" y1="303" x2="792" y2="303" stroke="#17667d" stroke-width="2"/>
<text x="805" y="310" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">a₀ = 1/256</text>
<line x1="776" y1="356" x2="792" y2="356" stroke="#17667d" stroke-width="2"/>
<text x="805" y="363" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#8c467a" font-weight="normal">ℓ₀ = 7817/2²⁰</text>
<line x1="776" y1="409" x2="792" y2="409" stroke="#17667d" stroke-width="2"/>
<text x="805" y="416" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">a₁ = 1975/2¹⁸</text>
<line x1="776" y1="462" x2="792" y2="462" stroke="#17667d" stroke-width="2"/>
<text x="805" y="469" text-anchor="start" font-family="Georgia,serif" font-size="18" fill="#8c467a" font-weight="normal">ℓ₋ = (8393−192√3)/2²⁰</text>
<line x1="776" y1="515" x2="792" y2="515" stroke="#17667d" stroke-width="2"/>
<text x="805" y="522" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">a₂ = 2075/2¹⁸</text>
<line x1="776" y1="568" x2="792" y2="568" stroke="#17667d" stroke-width="2"/>
<text x="805" y="575" text-anchor="start" font-family="Georgia,serif" font-size="18" fill="#8c467a" font-weight="normal">ℓ₊ = (8393+192√3)/2²⁰</text>
<line x1="776" y1="621" x2="792" y2="621" stroke="#17667d" stroke-width="2"/>
<text x="805" y="628" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">a₃ = 49/4096</text>
<text x="778" y="725" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#17324b" font-weight="normal">Increasing downward.</text>
<text x="778" y="765" text-anchor="start" font-family="Georgia,serif" font-size="19" fill="#17324b" font-weight="normal">Order only; heights schematic.</text>
<rect x="32" y="830" width="1056" height="590" rx="14" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="58" y="885" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">Actual restriction-fibre filtration — ICR.24</text>
<text x="58" y="936" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">P = V[1];  Fᵣ = RΓ(B₃, B₃₋ᵣ; P).  Quotients occur in reverse order.</text>
<text x="120" y="1004" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">F₀ = 0</text>
<text x="380" y="1004" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">F₁</text>
<text x="640" y="1004" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">F₂</text>
<text x="900" y="1004" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">F₃ = Mₕ(P)</text>
<line x1="182" y1="995" x2="326" y2="995" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="418" y1="995" x2="586" y2="995" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="678" y1="995" x2="792" y2="995" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="380" y1="1028" x2="380" y2="1090" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<text x="380" y="1131" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Q₃ ≃ V</text>
<line x1="640" y1="1028" x2="640" y2="1090" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<text x="640" y="1131" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Q₂ ≃ V</text>
<line x1="900" y1="1028" x2="900" y2="1090" stroke="#17667d" stroke-width="2" marker-end="url(#arr)"/>
<text x="900" y="1131" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Q₁ ≃ V</text>
<text x="58" y="1210" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Each triangle is the fibre-of-composite triangle of restriction maps.</text>
<text x="58" y="1266" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">0 → H⁰Fᵣ₋₁ → H⁰Fᵣ → H⁰Q₄₋ᵣ → 0;   r = 1, 2, 3.</text>
<text x="58" y="1322" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">dim H⁰Mₕ(P) = 3 dim V.  No preferred splitting is chosen.</text>
<text x="58" y="1380" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">The source test has dh₀ = 0 and gradient ideal (z³).</text>
<text x="40" y="1475" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Proofs and exact coordinates: ICR.20 · ICR.22 · ICR.24.</text>
</svg>
