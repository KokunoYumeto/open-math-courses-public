<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1740" viewBox="0 0 1120 1740" role="img" aria-labelledby="title desc">
<title id="title">Actual analytic microlocalization and characteristic support</title>
<desc id="desc">Two mixed coefficient rings have the same formal commutative completion. Actual principal relation lifts and factorial bounds prove right flatness for finite-order analytic operators. On a complex line, the connection has zero-section characteristic support, while the point module has conormal support. The plots are real coordinate slices, not projections of scheme structure.</desc>
