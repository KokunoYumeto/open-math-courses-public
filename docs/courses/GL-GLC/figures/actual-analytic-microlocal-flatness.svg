<text x="56" y="468">Invert τ, write ξ = τw, localize at the coefficient point, then use A → H.</text>
<text x="56" y="520" class="small">This proves flatness of the graded extension.  (MFL.2–MFL.4)</text>
<text x="56" y="634" class="head">2. From principal relations to actual operators</text>
<text x="80" y="687" class="eq">V W = 0;   im V₀ = ker W₀   ⇒   g<tspan baseline-shift="sub" font-size="70%">ν</tspan> = a<tspan baseline-shift="sub" font-size="70%">ν</tspan>V₀,  R<tspan baseline-shift="sub" font-size="70%">ν</tspan> = a<tspan baseline-shift="sub" font-size="70%">ν</tspan> ∘ V</text>
<text x="80" y="739">R W = 0 and R₀ = (g<tspan baseline-shift="sub" font-size="70%">ν</tspan>); the principal lifts are actual kernel rows.</text>
<text x="80" y="791" class="eq">c = Σ (−ΛL)ʲΛb;   every correction lowers homogeneous order.</text>
<text x="80" y="843" class="eq">Finite upper input ⇒ finite upper output;  |c₋ₙ| ≤ B Cⁿ n! .</text>
<text x="80" y="895">The whole series has one common domain, with every fixed derivative.</text>
<text x="56" y="963" class="small">Strict finite resolutions ⇒ exact E ⊗ᴸ<tspan baseline-shift="sub" font-size="70%">D</tspan> N and the graded support test.</text>
<text x="56" y="1005" class="small">The finite lattice detects a zero symbol by the actual inverse of I − hA.</text>
