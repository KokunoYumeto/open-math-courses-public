<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1840" viewBox="0 0 1120 1840" role="img" aria-labelledby="title desc">
<title id="title">Exact chart support and finite compact factorization</title>
<desc id="desc">Faithful flatness of the algebraic-to-analytic cotangent stalk S_q to C_q reflects the nonzero symbol germ, AIC.5. Every regular compact map c to Q factors through a supported compact d, AIC.17. A null map extends through a cofiber e; factorization of e to Q through a supported d prime kills that map, AIC.19.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1840" fill="#f8fafc"/>
<text x="42" y="54" text-anchor="start" font-family="Georgia,serif" font-size="35" fill="#17324b" font-weight="bold">Exact chart support and finite factorization</text>
<text x="42" y="100" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Algebraic closed conic Λ · actual regular compact objects</text>
<rect x="32" y="128" width="1056" height="427" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="182" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">1  The chosen cotangent point — AIC.5–AIC.6</text>
<text x="65" y="245" text-anchor="start" font-family="Georgia,serif" font-size="31" fill="#17324b" font-weight="normal">S(q) → C(q) is faithfully flat</text>
<text x="65" y="305" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">Analytic symbol germ: C(q) ⊗ G(q), over S(q)</text>
<text x="65" y="365" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">G(q) ≠ 0 iff its analytic extension is nonzero.</text>
<text x="65" y="425" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">q = (x, ξ) includes every nonzero ξ and the zero covector.</text>
<text x="65" y="489" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Char(Mᵃⁿ) = (Char of algebraic M)ᵃⁿ; ideal powers persist.</text>
<rect x="32" y="581" width="1056" height="500" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="635" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">2  A supported intermediate compact — AIC.17</text>
<text x="130" y="735" text-anchor="start" font-family="Georgia,serif" font-size="37" fill="#17324b" font-weight="normal">c</text>
<text x="900" y="735" text-anchor="start" font-family="Georgia,serif" font-size="37" fill="#17324b" font-weight="normal">Q</text>
<text x="515" y="881" text-anchor="start" font-family="Georgia,serif" font-size="37" fill="#17324b" font-weight="normal">d</text>
<line x1="180" y1="720" x2="865" y2="720" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="172" y1="753" x2="496" y2="846" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="560" y1="850" x2="898" y2="752" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="222" y="687" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">a map from any bounded regular compact</text>
<text x="170" y="952" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">d is regular with support in Λ; c need not be supported.</text>
<text x="65" y="1020" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">This criterion holds for every ind-object, in all degrees.</text>
<rect x="32" y="1107" width="1056" height="607" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="1161" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="bold">3  Retaining the nullhomotopy — AIC.18–AIC.19</text>
<text x="65" y="1223" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">A null composite c → d → Q extends to e = cofib(c → d).</text>
<text x="65" y="1281" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Factor e → Q as e → d′ → Q with d′ supported.</text>
<text x="120" y="1400" text-anchor="start" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">c</text>
<text x="405" y="1400" text-anchor="start" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">d</text>
<text x="702" y="1400" text-anchor="start" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">e</text>
<line x1="165" y1="1387" x2="363" y2="1387" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="452" y1="1387" x2="665" y2="1387" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="252" y="1359" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">a</text>
<text x="695" y="1550" text-anchor="start" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">d′</text>
<text x="955" y="1550" text-anchor="start" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">Q</text>
<line x1="716" y1="1420" x2="716" y2="1500" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="447" y1="1420" x2="671" y2="1518" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="755" y1="1537" x2="921" y2="1537" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="65" y="1621" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">The induced c → d → d′ is null at a supported stage.</text>
<text x="65" y="1680" text-anchor="start" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">All shifted compact Hom complexes detect F → Q as an isomorphism.</text>
<text x="42" y="1776" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Cohomological support recovers the supported ind-category for</text>
<text x="42" y="1820" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">bounded-below objects (AIC.24); AIC.17 covers all ind-objects.</text>
</svg>
