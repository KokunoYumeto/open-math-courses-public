<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1840" viewBox="0 0 1120 1840" role="img" aria-labelledby="title desc">
<title id="title">Componentwise cycle isolation and arbitrary field support</title>
<desc id="desc">Finite heart subobjects have individual isolation neighbourhoods and natural point retracts. The exact rational sequence b j equals 1 divided by j plus 1 accumulates at zero; a finite piece has a neighbourhood which the entire sequence does not share. Every new finite submodule after field extension is contained in one extended original finite piece, and full cohomological support is preserved and reflected.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1840" fill="#f8fafc"/>
<text x="42" y="54" text-anchor="start" font-family="Georgia,serif" font-size="36" fill="#17324b" font-weight="bold">Componentwise cycles and field extension</text>
<text x="42" y="99" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Varying neighbourhoods · actual point maps · all unbounded degrees</text>
<rect x="32" y="128" width="1056" height="425" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="182" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">1  Each finite piece has its own isolated carrier</text>
<text x="65" y="243" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">A ⊂ HᵐE  ⇒  supp Φ(DR A) ∩ W(A) ⊂ {x}</text>
<text x="65" y="300" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Each coherent cycle: B(A) = i<tspan baseline-shift="sub" font-size="75%">*</tspan>V(A) ⊕ away part.</text>
<text x="65" y="358" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Both point adjoints give V(A), in degree zero.</text>
<text x="65" y="414" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Uniform finite amplitude handles every internal degree m.</text>
<text x="65" y="474" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Actual unit and counit:  i<tspan baseline-shift="sub" font-size="75%">*</tspan>V → B → i<tspan baseline-shift="sub" font-size="75%">*</tspan>V,  r u = 1.</text>
<text x="65" y="526" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">No common neighbourhood or closed holonomic cone is needed.</text>
<rect x="32" y="580" width="1056" height="565" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="634" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">2  Exact accumulating points — Solution 3.GJ</text>
<text x="65" y="691" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Real t-axis:  bⱼ = 1/(j + 1), j ≥ 1;  bⱼ → 0.</text>
<line x1="80" y1="810" x2="1010" y2="810" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<rect x="70" y="748" width="300" height="105" rx="9" fill="#d8f1e5" fill-opacity="0.65" stroke="#79ad95"/>
<line x1="80" y1="810" x2="1010" y2="810" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<circle cx="220" cy="810" r="8" fill="#185b42"/>
<text x="220" y="739" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">0</text>
<circle cx="720.0" cy="810" r="6" fill="#17667d"/>
<text x="720.0" y="880" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17667d" font-weight="normal">1/2</text>
<circle cx="553.3333333333333" cy="810" r="6" fill="#17667d"/>
<text x="553.3333333333333" y="928" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17667d" font-weight="normal">1/3</text>
<circle cx="470.0" cy="810" r="6" fill="#17667d"/>
<text x="470.0" y="880" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17667d" font-weight="normal">1/4</text>
<circle cx="420.0" cy="810" r="6" fill="#17667d"/>
<text x="420.0" y="928" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17667d" font-weight="normal">1/5</text>
<circle cx="386.66666666666663" cy="810" r="6" fill="#7b8790"/>
<circle cx="362.8571428571429" cy="810" r="6" fill="#7b8790"/>
<circle cx="345.0" cy="810" r="6" fill="#7b8790"/>
<circle cx="331.1111111111111" cy="810" r="6" fill="#7b8790"/>
<circle cx="320.0" cy="810" r="6" fill="#7b8790"/>
<circle cx="310.9090909090909" cy="810" r="6" fill="#7b8790"/>
<circle cx="303.3333333333333" cy="810" r="6" fill="#7b8790"/>
<circle cx="296.9230769230769" cy="810" r="6" fill="#7b8790"/>
<text x="264" y="806" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#7b8790" font-weight="normal">…</text>
<text x="65" y="985" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">Green interval: (−3/20, 3/20), for A = δ₀ ⊕ δ<tspan baseline-shift="sub" font-size="75%">b₁</tspan> ⊕ ⋯ ⊕ δ<tspan baseline-shift="sub" font-size="75%">b₄</tspan>.</text>
<text x="65" y="1039" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Blue points belong to this finite piece; grey points do not.</text>
<text x="65" y="1100" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Every interval about 0 still meets the full infinite sequence.</text>
<rect x="32" y="1172" width="1056" height="540" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="1227" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">3  Arbitrary characteristic-zero extension K/k</text>
<text x="65" y="1287" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">CIC.16: Char(M ⊗ₖ K) = Char(M) ×ₖ K.</text>
<text x="65" y="1349" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Every new finite C ⊂ Hᵐ(Q ⊗ₖ K) lies in some A ⊗ₖ K.</text>
<text x="65" y="1409" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Here A ⊂ HᵐQ is finite over the original operator ring.</text>
<text x="65" y="1471" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Good symbols extend exactly, including nilpotent thickness.</text>
<text x="65" y="1536" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Finite Nakayama tests every cotangent prime upstairs.</text>
<text x="65" y="1602" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">CIC.19: Q has support Λ  ⇔  Q ⊗ₖ K has support Λₖ.</text>
<text x="65" y="1670" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">The condition concerns every finite submodule of every Hᵐ.</text>
<text x="42" y="1773" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Regular cycles over the new fields and full nilpotent regularity</text>
<text x="42" y="1820" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">retain their own geometric and categorical hypotheses.</text>
</svg>
