<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1840" viewBox="0 0 1120 1840" role="img" aria-labelledby="title desc">
<title id="title">The density map and the single de Rham dimension shift</title>
<desc id="desc">The balanced density map SDR.9, the identity SDR.14, and exact tested degrees for K equal to two point modules plus one in degree one plus four in degree three. Solution degrees are one, zero and minus two; de Rham degrees on a curve are zero, one and three.</desc>
<rect width="1120" height="1840" fill="#f8fafc"/>
<text x="42" y="54" text-anchor="start" font-family="Georgia,serif" font-size="36" fill="#17324b" font-weight="bold">Densities, duality and bounded support</text>
<text x="42" y="100" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Complex analytic holonomic complexes · SDR.1–SDR.24</text>
<rect x="32" y="128" width="1056" height="412" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="182" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">1  The intrinsic balanced map — SDR.9</text>
<text x="65" y="245" text-anchor="start" font-family="Georgia,serif" font-size="32" fill="#17324b" font-weight="normal">fη ⊗ (q ⊗ η⁻¹)  →  q ⊗ f</text>
<text x="65" y="303" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">(fη)ξ = −(ξf + bf)η</text>
<text x="65" y="361" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">ξ SC(q) = SC(−qξ − qb)</text>
<text x="65" y="419" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">Both sides map to −q ⊗ (ξf + bf).</text>
<text x="65" y="477" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">b = divη ξ; changing η to uη leaves the map unchanged.</text>
<rect x="32" y="567" width="1056" height="427" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="620" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">2  One dimension shift — SDR.12–SDR.14</text>
<text x="65" y="687" text-anchor="start" font-family="Georgia,serif" font-size="34" fill="#17324b" font-weight="normal">DR_N(K) = S₀(𝔻K)[N]</text>
<text x="65" y="747" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="normal">Hʲ(𝔻K) = 𝔻(H⁻ʲK)</text>
<text x="65" y="807" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Char(𝔻M) = Char(M): transpose, conicity, biduality.</text>
<text x="65" y="867" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">SS(DR_N K) = SS(S₀K) = ⋃ᵢ Char(HⁱK)</text>
<text x="65" y="930" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Bounded holonomic K; all irregular systems included.</text>
<rect x="32" y="1020" width="1056" height="690" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="1076" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">3  Exact degrees for point modules on a curve</text>
<text x="65" y="1133" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">K = δ² ⊕ δ[−1] ⊕ δ⁴[−3]    (SDR.28)</text>
<text x="65" y="1194" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17667d" font-weight="normal">Solution test · SDR.29</text>
<line x1="75" y1="1296" x2="1010" y2="1296" stroke="#7b8d9c" stroke-width="2"/>
<line x1="100" y1="1290" x2="100" y2="1303" stroke="#7b8d9c" stroke-width="2"/>
<text x="100" y="1334" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">−2</text>
<line x1="240" y1="1290" x2="240" y2="1303" stroke="#7b8d9c" stroke-width="2"/>
<text x="240" y="1334" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">−1</text>
<line x1="380" y1="1290" x2="380" y2="1303" stroke="#7b8d9c" stroke-width="2"/>
<text x="380" y="1334" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">0</text>
<line x1="520" y1="1290" x2="520" y2="1303" stroke="#7b8d9c" stroke-width="2"/>
<text x="520" y="1334" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">1</text>
<line x1="660" y1="1290" x2="660" y2="1303" stroke="#7b8d9c" stroke-width="2"/>
<text x="660" y="1334" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">2</text>
<line x1="800" y1="1290" x2="800" y2="1303" stroke="#7b8d9c" stroke-width="2"/>
<text x="800" y="1334" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">3</text>
<line x1="940" y1="1290" x2="940" y2="1303" stroke="#7b8d9c" stroke-width="2"/>
<text x="940" y="1334" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">4</text>
<circle cx="520" cy="1260" r="22" fill="#17667d"/>
<text x="520" y="1269" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="white" font-weight="normal">2</text>
<circle cx="380" cy="1260" r="22" fill="#17667d"/>
<text x="380" y="1269" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="white" font-weight="normal">1</text>
<circle cx="100" cy="1260" r="22" fill="#17667d"/>
<text x="100" y="1269" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="white" font-weight="normal">4</text>
<text x="1028" y="1334" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">j</text>
<text x="65" y="1395" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17667d" font-weight="normal">De Rham test · SDR.30</text>
<line x1="75" y1="1496" x2="1010" y2="1496" stroke="#7b8d9c" stroke-width="2"/>
<line x1="100" y1="1490" x2="100" y2="1503" stroke="#7b8d9c" stroke-width="2"/>
<text x="100" y="1534" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">−2</text>
<line x1="240" y1="1490" x2="240" y2="1503" stroke="#7b8d9c" stroke-width="2"/>
<text x="240" y="1534" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">−1</text>
<line x1="380" y1="1490" x2="380" y2="1503" stroke="#7b8d9c" stroke-width="2"/>
<text x="380" y="1534" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">0</text>
<line x1="520" y1="1490" x2="520" y2="1503" stroke="#7b8d9c" stroke-width="2"/>
<text x="520" y="1534" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">1</text>
<line x1="660" y1="1490" x2="660" y2="1503" stroke="#7b8d9c" stroke-width="2"/>
<text x="660" y="1534" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">2</text>
<line x1="800" y1="1490" x2="800" y2="1503" stroke="#7b8d9c" stroke-width="2"/>
<text x="800" y="1534" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">3</text>
<line x1="940" y1="1490" x2="940" y2="1503" stroke="#7b8d9c" stroke-width="2"/>
<text x="940" y="1534" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">4</text>
<circle cx="380" cy="1460" r="22" fill="#17667d"/>
<text x="380" y="1469" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="white" font-weight="normal">2</text>
<circle cx="520" cy="1460" r="22" fill="#17667d"/>
<text x="520" y="1469" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="white" font-weight="normal">1</text>
<circle cx="800" cy="1460" r="22" fill="#17667d"/>
<text x="800" y="1469" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="white" font-weight="normal">4</text>
<text x="1028" y="1534" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">j</text>
<text x="65" y="1608" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Circle entries are dimensions; every other degree is zero.</text>
<text x="65" y="1664" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">SDR.19–SDR.21 gives noncancellation by exact truncations.</text>
<text x="42" y="1775" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Algebraic analytification, ind-extension and stack descent require</text>
<text x="42" y="1820" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">their specified support comparisons.</text>
</svg>
