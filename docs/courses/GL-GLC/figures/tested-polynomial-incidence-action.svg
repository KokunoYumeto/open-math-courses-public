<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1760" viewBox="0 0 1120 1760" role="img" aria-labelledby="title desc">
<title id="title">The tested polynomial incidence action</title>
<desc id="desc">Pole derivatives and proper integration by parts give every polynomial Ore generator identity. Normalizing by the N-th inverse derivative cancels the N in time multiplication. The resulting tested module comparison preserves finite Hom complexes. A real cubic t=u cubed, x=u crosses the halfspace t nonnegative at zero: its linear support test vanishes although the positive t covector is conormal.</desc>
