<text x="514" y="1484" class="small">x = u</text>
<text x="341" y="1226" class="small">t</text>
<text x="118" y="1241" class="small">Re t ≥ 0</text>
<text x="347" y="1393" class="small">p = d Re t</text>
<text x="606" y="1260" class="small">t = u³, x = u;  −1 ≤ u ≤ 1</text>
<text x="606" y="1318" class="small">Im t = Im x = 0</text>
<text x="606" y="1376" class="small">p is conormal at zero.</text>
<text x="606" y="1434" class="small">On the curve, t ≥ 0 means u ≥ 0.</text>
<text x="606" y="1492" class="small">C → C is the identity on the</text>
<text x="606" y="1530" class="small">interval and its negative half.</text>
<text x="606" y="1588" class="eq">Thus T<tspan baseline-shift="sub" font-size="70%">p</tspan>(C<tspan baseline-shift="sub" font-size="70%">C</tspan>) = 0.</text>
