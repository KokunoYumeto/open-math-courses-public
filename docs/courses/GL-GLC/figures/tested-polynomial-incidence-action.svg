<text x="48" y="54" class="title">The tested polynomial incidence action</text>
<text x="48" y="88" class="small">Actual pole derivatives · proper complement maps · exact scope of one linear test</text>
<text x="56" y="159" class="head">1. Every polynomial generator has its ordered action</text>
<text x="80" y="220" class="eq">ρ(σ) = τ ;     ρ(y<tspan baseline-shift="sub" font-size="70%">i</tspan>) = ξ<tspan baseline-shift="sub" font-size="70%">i</tspan> τ<tspan baseline-shift="super" font-size="70%">−1</tspan> ;     ρ(η<tspan baseline-shift="sub" font-size="70%">i</tspan>) = −x<tspan baseline-shift="sub" font-size="70%">i</tspan> τ</text>
<text x="80" y="282" class="eq">ρ(s) = t + E<tspan baseline-shift="sub" font-size="70%">x</tspan> τ<tspan baseline-shift="super" font-size="70%">−1</tspan> ;     E<tspan baseline-shift="sub" font-size="70%">x</tspan> = Σ x<tspan baseline-shift="sub" font-size="70%">i</tspan> ξ<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
<text x="80" y="344" class="eq">D<tspan baseline-shift="sub" font-size="70%">xᵢ</tspan> m = y<tspan baseline-shift="sub" font-size="70%">i</tspan> D<tspan baseline-shift="sub" font-size="70%">t</tspan> m ;     D<tspan baseline-shift="sub" font-size="70%">yᵢ</tspan> m = x<tspan baseline-shift="sub" font-size="70%">i</tspan> D<tspan baseline-shift="sub" font-size="70%">t</tspan> m</text>
<text x="80" y="406">Vertical integration by parts retains every relative complement entry.</text>
<text x="80" y="466">All comparisons use the specified density and one common proper collar.</text>
<text x="56" y="508" class="small">Full ordinary maps and finite generator identities: PIA.1–PIA.13.</text>
<text x="56" y="609" class="head">2. The two normalizing terms cancel exactly</text>
<text x="80" y="673" class="eq">D<tspan baseline-shift="sub" font-size="70%">t</tspan>(Fm) = N m ;     U<tspan baseline-shift="sub" font-size="70%">Fm</tspan> = N τ<tspan baseline-shift="super" font-size="70%">−1</tspan> U</text>
<text x="80" y="737" class="eq">U Φ(s) = (t + E<tspan baseline-shift="sub" font-size="70%">x</tspan> τ<tspan baseline-shift="super" font-size="70%">−1</tspan> + N τ<tspan baseline-shift="super" font-size="70%">−1</tspan>) U</text>
<text x="80" y="801" class="eq">τ<tspan baseline-shift="super" font-size="70%">−N</tspan> t = t τ<tspan baseline-shift="super" font-size="70%">−N</tspan> − N τ<tspan baseline-shift="super" font-size="70%">−N−1</tspan></text>
<text x="80" y="865" class="eq">a Φ(s) = (t + E<tspan baseline-shift="sub" font-size="70%">x</tspan> τ<tspan baseline-shift="super" font-size="70%">−1</tspan>) a</text>
<text x="80" y="929">The pure degree-one test converts these identities to a module-derived roof.</text>
<text x="80" y="989">Every degree of each finite Hom complex and its homotopies is retained.</text>
<text x="56" y="1031" class="small">Normalization, tested actions and finite Hom: PIA.14–PIA.22.</text>
<text x="56" y="1135" class="head">3. One linear test is not conservative</text>
