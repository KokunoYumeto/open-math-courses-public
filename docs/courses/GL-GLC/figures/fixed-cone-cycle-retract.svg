<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1840" viewBox="0 0 1120 1840" role="img" aria-labelledby="title desc">
<title id="title">Fixed characteristic cone and unbounded cycle retract</title>
<desc id="desc">Every finite heart subobject has the same characteristic and microsupport bound. A transverse test gives isolated cycles. Both infinite cohomology tails are removed only outside a finite window for each output degree. The actual point comparison, unit and counit produce inclusion and retraction with composite identity. Ind regularity is an explicit premise.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1840" fill="#f8fafc"/>
<text x="42" y="54" text-anchor="start" font-family="Georgia,serif" font-size="35" fill="#17324b" font-weight="bold">A fixed cone gives an unbounded cycle retract</text>
<text x="42" y="99" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Ind-regular E · every internal degree · actual unit and counit</text>
<rect x="32" y="128" width="1056" height="435" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="181" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">1  One cone for every finite heart subobject</text>
<text x="65" y="239" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">A ⊂ HᵐE coherent, for all m ∈ Z</text>
<text x="65" y="294" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">Char(A) ⊂ Λ  ⇒  SS(DR A) ⊂ Λᵃⁿ   (FCR.5)</text>
<text x="65" y="352" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Near p = (x, ξ), ξ ≠ 0: Λᵃⁿ = smooth conic Lagrangian C.</text>
<text x="65" y="411" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">graph(dh) transverse to C  ⇒  each cycle is isolated at x.</text>
<text x="65" y="468" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">One witness p ∈ Char(A₀) gives a nonzero point coefficient.</text>
<text x="65" y="524" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">The same analytic neighbourhood works for every A and m.</text>
<rect x="32" y="590" width="1056" height="520" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="646" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">2  A finite window for any fixed output degree m</text>
<text x="65" y="704" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Point-functor amplitudes: i<tspan baseline-shift="super" font-size="75%">!</tspan> in [0, 2d], i<tspan baseline-shift="super" font-size="75%">*</tspan> in [−3d, d].</text>
<rect x="120" y="758" width="235" height="82" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<rect x="355" y="758" width="410" height="82" rx="7" fill="#d8f1e5" stroke="#b4c9d6"/>
<rect x="765" y="758" width="235" height="82" rx="7" fill="#e5e7eb" stroke="#b4c9d6"/>
<text x="237" y="809" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#66717b" font-weight="normal">… low tail</text>
<text x="560" y="809" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#185b42" font-weight="normal">finite Postnikov window</text>
<text x="882" y="809" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#66717b" font-weight="normal">high tail …</text>
<text x="355" y="891" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">L ≤ m − 2d − 2</text>
<text x="765" y="939" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">H ≥ m + 3d + 2</text>
<text x="65" y="1003" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Both tails give zero in degrees m − 1, m, m + 1.</text>
<text x="65" y="1063" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">FCR.16: Hᵐ(TB) = H⁰(T(HᵐB)),  T = i<tspan baseline-shift="super" font-size="75%">!</tspan>, i<tspan baseline-shift="super" font-size="75%">*</tspan>.</text>
<rect x="32" y="1138" width="1056" height="575" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="1194" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">3  The comparison gives actual retract maps</text>
<text x="65" y="1254" text-anchor="start" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">B = Φʳᵉᵍₕ E,   V = i<tspan baseline-shift="super" font-size="75%">!</tspan>B,   θ: i<tspan baseline-shift="super" font-size="75%">!</tspan>B ≃ i<tspan baseline-shift="super" font-size="75%">*</tspan>B   (FCR.17)</text>
<text x="240" y="1362" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#17324b" font-weight="normal">i<tspan baseline-shift="sub" font-size="75%">*</tspan>V</text>
<text x="865" y="1362" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#17324b" font-weight="normal">B</text>
<line x1="315" y1="1323" x2="785" y2="1323" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="785" y1="1394" x2="315" y2="1394" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="550" y="1303" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">u = ε (right counit)</text>
<text x="550" y="1444" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">r = i<tspan baseline-shift="sub" font-size="75%">*</tspan>(θ⁻¹) η (left unit)</text>
<text x="65" y="1511" text-anchor="start" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">FCR.18: r u = 1;    e = u r and e² = e.</text>
<text x="65" y="1574" text-anchor="start" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">B ≃ i<tspan baseline-shift="sub" font-size="75%">*</tspan>V ⊕ cofib(u);  Hᵐ⁰V ≠ 0 by the witness A₀.</text>
<text x="65" y="1642" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">The point extension retains its actual coefficient V.</text>
<text x="65" y="1688" text-anchor="start" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">The arrows retain all coefficient complexes and homotopies.</text>
<text x="42" y="1771" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Regularity of arbitrary nilpotent objects and their supported</text>
<text x="42" y="1818" text-anchor="start" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">compact factorization remain separate mathematical requirements.</text>
</svg>
