<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1300" viewBox="0 0 1120 1300" role="img" aria-labelledby="title desc">
<title id="title">Regular Hecke families and characteristic support</title>
<desc id="desc">The identity self-nerve forces a chart covector to annihilate vertical directions. The actual bounded Hecke source embeds in a smooth proper ambient with exact kernels IC[b] and IC[b+1]. An exact affine addition model shows the line z+t=0 and the normal covector dz+dt, drawn using equal coordinate scales and the Euclidean identification of the dual coordinate basis.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315069"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a13d31"/></marker></defs>
<style>text{font-family:Georgia,"Times New Roman",serif;fill:#173448}.head{font-family:"Segoe UI",sans-serif;font-size:25px;font-weight:600}.small{font-family:"Segoe UI",sans-serif;font-size:20px}.label{font-size:29px}.math{font-size:24px}.panel{fill:#f7fafc;stroke:#bfced8;stroke-width:1.5}.arrow{fill:none;stroke:#315069;stroke-width:2.5;marker-end:url(#arrow)}.axis{fill:none;stroke:#315069;stroke-width:1.6;marker-end:url(#arrow)}</style>
<rect width="1120" height="1300" fill="white"/>
<text x="34" y="44" class="head">Regular Hecke families and characteristic support</text>
<rect x="28" y="70" width="1064" height="310" rx="14" class="panel"/>
<text x="52" y="109" class="head">1. The identity self-nerve: finite covectors descend</text>
<text x="350" y="150" class="math">dp₁ᵗα = dp₂ᵗβ</text>
<text x="159" y="211" class="label">A</text><text x="473" y="211" class="label">W = A ×<tspan baseline-shift="sub" font-size="19">Y</tspan> A</text><text x="939" y="211" class="label">A</text>
<path d="M450 198H225" class="arrow"/><text x="323" y="185" class="math">p₁</text>
<path d="M700 198H894" class="arrow"/><text x="789" y="185" class="math">p₂</text>
<text x="550" y="299" class="label">A</text><path d="M565 265V231" class="arrow"/><text x="590" y="254" class="math">δ</text>
<text x="70" y="348" class="math">δ*: α = β;   tangent (v,0): α(v) = 0;   α = dqᵗξ</text>
<rect x="28" y="400" width="1064" height="360" rx="14" class="panel"/>
<text x="52" y="439" class="head">2. The actual bounded proper Hecke input</text>
<text x="580" y="493" class="label">M</text><text x="887" y="493" class="label">B × C</text>
<path d="M653 482H854" class="arrow"/><text x="708" y="467" class="small">π proper</text>
<text x="122" y="604" class="label">Bun<tspan baseline-shift="sub" font-size="19">G</tspan></text><text x="553" y="604" class="label">Z<tspan baseline-shift="sub" font-size="19">μ</tspan></text>
<path d="M591 563V517" class="arrow"/><text x="615" y="546" class="small">i closed</text>
<path d="M516 594H260" class="arrow"/><text x="383" y="579" class="math">r</text>
<text x="813" y="541" class="math">η = (ξ₂, ξ<tspan baseline-shift="sub" font-size="18">x</tspan>)</text><text x="869" y="582" class="math">ξ<tspan baseline-shift="sub" font-size="18">x</tspan> ≠ 0</text>
<text x="68" y="659" class="math">K<tspan baseline-shift="sub" font-size="18">Z</tspan> = IC<tspan baseline-shift="sub" font-size="18">Z</tspan>[b],    K̂<tspan baseline-shift="sub" font-size="18">Z</tspan> = IC<tspan baseline-shift="sub" font-size="18">Z</tspan>[b+1],    b = dim B</text>
<text x="68" y="701" class="small">Selected z₀ = u<tspan baseline-shift="super" font-size="15">−λ</tspan>: isolated in the actual compatible fibre.</text>
<text x="68" y="735" class="small">UQD gives an actual finite target characteristic witness at η.</text>
<rect x="28" y="780" width="1064" height="492" rx="14" class="panel"/>
<text x="52" y="819" class="head">3. Exact affine addition model: z+t=0, ξ<tspan baseline-shift="sub" font-size="18">z</tspan>=ξ<tspan baseline-shift="sub" font-size="18">t</tspan></text>
<path d="M105 1040H470" class="axis"/><path d="M280 1200V861" class="axis"/>
<text x="479" y="1048" class="math">z</text><text x="292" y="882" class="math">t</text>
<path d="M200 1034V1046M360 1034V1046M274 960H286M274 1120H286" stroke="#315069" stroke-width="1.5"/>
<text x="185" y="1073" class="small">−1</text><text x="353" y="1073" class="small">1</text>
<text x="249" y="967" class="small">1</text><text x="240" y="1127" class="small">−1</text><text x="260" y="1067" class="small">0</text>
<path d="M160 920L400 1160" stroke="#26769a" stroke-width="4"/>
<text x="81" y="910" class="math">z+t=0</text>
<circle cx="280" cy="1040" r="4" fill="#173448"/>
<path d="M280 1040L360 960" stroke="#a13d31" stroke-width="3" marker-end="url(#redArrow)"/>
<text x="369" y="947" class="small" fill="#a13d31">dz+dt</text>
<text x="370" y="978" class="small">(1,1)</text>
<text x="76" y="1230" class="small">Equal scales; covector in the dual basis.</text>
<text x="596" y="901" class="math">E = ⊕ δ<tspan baseline-shift="sub" font-size="18">z+t=0</tspan>[2n]</text>
<text x="596" y="946" class="math">Ê = ⊕ δ<tspan baseline-shift="sub" font-size="18">z+t=0</tspan>[2n+1]</text>
<text x="596" y="991" class="small">All n ∈ Z; both cohomological tails.</text>
<text x="596" y="1040" class="math">ξ<tspan baseline-shift="sub" font-size="18">t</tspan> = 1 ≠ 0 at the shown covector.</text>
<text x="596" y="1100" class="small">GL₄ trace example: eight root jets,</text><text x="596" y="1132" class="math">Res B(A,g⁻¹g′) = 8,</text><text x="596" y="1162" class="math">ξ<tspan baseline-shift="sub" font-size="18">x</tspan> = 8 dx.</text>
<text x="596" y="1210" class="small">Nilpotent residue: zero at geometric points.</text>
<text x="596" y="1240" class="small">Dual numbers: residue mε (Exercise 3.HC).</text>
</svg>