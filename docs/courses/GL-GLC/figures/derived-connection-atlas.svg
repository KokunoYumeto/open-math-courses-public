<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1640" viewBox="0 0 1120 1640" role="img" aria-labelledby="title desc">
<title id="title">The full derived connection atlas</title>
<desc id="desc">Proper two-term cohomology gives the affine derived nullhomotopy equations. Full square-zero and Postnikov comparison represents the frame functor by Q. The Cartesian connection square gives the actual spectral quotient by GL_b. Exact examples retain the nonflat negative coordinate and a degree-minus-two coefficient loop.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#51627d"/></marker></defs>
<rect width="1120" height="1640" fill="#fafbff"/>
<text x="35" y="43" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#17263c">The full derived connection atlas</text>
<text x="35" y="78" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Complex projective curve; every connective DG base, nonflat change and higher path.</text>
<rect x="25" y="100" width="1070" height="250" rx="12" fill="#e9effb" stroke="#9baec6"/>
<text x="45" y="136" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">1. Proper cohomology retains the full coefficient algebra — DCA.1–DCA.5</text>
<text x="45" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">E → E(D) → E(D)|_D, with D a sufficiently large effective hyperplane divisor.</text>
<text x="125" y="230" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">K_0 = RΓ(E(D))</text>
<path d="M 385 223 L 565 223" fill="none" stroke="#51627d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="463" y="210" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">δ</text>
<text x="598" y="230" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">K_1 = RΓ(E(D)|_D)</text>
<text x="125" y="267" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">relative degree 0</text>
<text x="598" y="267" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">relative degree 1</text>
<text x="45" y="310" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Both terms are projective over A; RΓ(E) is their fibre, with every negative A-degree.</text>
<text x="45" y="337" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">RΓ(E) ⊗ᴸ_A B ≃ RΓ(E_B), including nonflat B.</text>
<rect x="25" y="368" width="1070" height="305" rx="12" fill="#edf6f2" stroke="#9baec6"/>
<text x="45" y="404" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">2. The entire connection fibre is an affine nullhomotopy scheme — DCA.6–DCA.13</text>
<text x="45" y="449" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">F = ad(P) ⊗ Ω¹_X,   K = [K_0 → K_1],   a = the Atiyah cocycle</text>
<text x="45" y="494" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">D_A(P) = Sym_A(K_0∨ ⊕ K_1∨[1]),     dξ = ⟨ξ, δt + a⟩</text>
<text x="45" y="536" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">t has relative degree 0; ξ has relative degree −1. Maps retain the nullhomotopy.</text>
<text x="45" y="578" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">A B-point has d_B h = δt_B + a_B; the same equations compute every higher simplex.</text>
<text x="45" y="620" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">D_A(P) ⊗ᴸ_A B ≃ D_B(P_B).  Relative cotangent degrees: −1 and 0.</text>
<text x="45" y="653" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Curve curvature is zero because Ω²_X = 0; formal Taylor transport retains every jet.</text>
<rect x="25" y="691" width="1070" height="469" rx="12" fill="#f5f0fb" stroke="#9baec6"/>
<text x="45" y="727" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">3. Full frames and the Cartesian spectral atlas — DCA.14–DCA.24</text>
<text x="45" y="769" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">T_frame = Cone(RΓ(ad(P)) → End(W_P)) is finite projective over A.</text>
<text x="45" y="809" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Square-zero comparison + effective Postnikov limits give Q(A) ≃ full framed torsors.</text>
<text x="130" y="887" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17263c">W</text>
<text x="721" y="887" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17263c">Q</text>
<path d="M 183 878 L 670 878" fill="none" stroke="#51627d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="860" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">affine derived connection fibre</text>
<path d="M 142 905 L 142 1009" fill="none" stroke="#51627d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="173" y="952" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">GL_b frame torsor</text>
<path d="M 735 905 L 735 1009" fill="none" stroke="#51627d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="764" y="952" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">GL_b frame torsor</text>
<text x="130" y="1042" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17263c">Z</text>
<text x="642" y="1042" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17263c">Bun_H bounded</text>
<path d="M 183 1033 L 605 1033" fill="none" stroke="#51627d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="283" y="1080" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">forget connection (affine)</text>
<text x="45" y="1129" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">W ×_Z W ≃ W × GL_b;   Z ≃ [W / GL_b].  All assertions are on full DG mapping spaces.</text>
<rect x="25" y="1178" width="1070" height="440" rx="12" fill="#fff5e7" stroke="#9baec6"/>
<text x="45" y="1214" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">4. Exact obstructions and negative coefficients — Solutions 3.BR–3.BT</text>
<text x="45" y="1257" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">On P¹, O(d) has D_d = C[ξ], |ξ|=−1, dξ=d: nonzero d gives an empty fibre.</text>
<text x="45" y="1294" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">For d=0 the negative coordinate remains, even though there is one ordinary point.</text>
<text x="45" y="1339" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">Nonflat model: dξ=st</text>
<text x="45" y="1371" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Ordinary real slice st=0:</text>
<path d="M 175 1495 H 450 M 312.5 1585 V 1405" stroke="#adb7c7" stroke-width="1.3" fill="none"/>
<path d="M 175 1495 H 450" stroke="#116746" stroke-width="4" fill="none"/>
<path d="M 312.5 1585 V 1405" stroke="#3c67b5" stroke-width="4" fill="none"/>
<text x="165" y="1524" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17263c">−2</text>
<text x="306.5" y="1524" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17263c">0</text>
<text x="441" y="1524" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17263c">2</text>
<text x="326" y="1413" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17263c">2</text>
<text x="326" y="1580" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#17263c">−2</text>
<text x="468" y="1502" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">t</text>
<text x="299" y="1396" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">s</text>
<text x="45" y="1608" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">At s=0: C[t,ξ], with nonzero H⁻¹=C[t]ξ.</text>
<text x="585" y="1339" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">Trivial line on P¹, d=0</text>
<text x="585" y="1380" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">B=C[δ]/δ², |δ|=−2</text>
<text x="585" y="1423" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Loop: ξ ↦ δ du; both endpoints are 0.</text>
<text x="585" y="1466" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">π_0 has one component; π_1=C.</text>
<text x="585" y="1509" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">π_i=0 for i&gt;1.</text>
<text x="585" y="1552" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">H⁰(B) erases this higher path.</text>
</svg>
