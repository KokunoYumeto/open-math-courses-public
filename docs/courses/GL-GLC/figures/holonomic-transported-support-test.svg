<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1840" viewBox="0 0 1120 1840" role="img" aria-labelledby="title desc">
<title id="title">A nonzero transported test detects holonomic characteristic support</title>
<desc id="desc">Finite full-operator resolution transport HTS.9, the exact real section x prime equals z and t prime equals minus z squared over two of a quadratic contact shear, and nonzero Euler test transfer HTS.19 to HTS.22.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#17667d" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="1840" fill="#f8fafc"/>
<text x="42" y="54" font-family="Georgia,serif" font-size="35" fill="#17324b" font-weight="bold">A nonzero test detects characteristic support</text>
<text x="42" y="98" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Coherent holonomic analytic modules · every dimension · HTS.1</text>
<rect x="32" y="128" width="1056" height="395" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="180" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">1  A finite contact chain with actual coefficients</text>
<text x="65" y="237" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">D-module M₀</text>
<text x="759" y="237" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">Euler D-module N_A</text>
<text x="65" y="293" font-family="Georgia,serif" font-size="31" fill="#17324b" font-weight="normal">B₀ ⊗ P₀</text>
<text x="484" y="293" font-family="Georgia,serif" font-size="31" fill="#17324b" font-weight="normal">P₁ over B₁</text>
<text x="861" y="293" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">Pₘ over Bₘ</text>
<line x1="260" y1="279" x2="450" y2="279" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<line x1="682" y1="279" x2="824" y2="279" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="65" y="352" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Only endpoints need differential modules on the base.</text>
<text x="65" y="401" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Backward test transport keeps coefficient degree 1.</text>
<text x="65" y="451" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Keep finite matrices, source counits and Hom homotopies.</text>
<text x="65" y="497" font-family="Georgia,serif" font-size="25" fill="#17667d" font-weight="normal">Actual solution-test comparison: HTS.9–HTS.10</text>
<rect x="32" y="550" width="1056" height="650" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="601" font-family="Georgia,serif" font-size="30" fill="#17324b" font-weight="bold">2  Exact quadratic contact geometry</text>
<text x="65" y="651" font-family="Georgia,serif" font-size="26" fill="#17324b" font-weight="normal">Real section: C = 1, τ = 1, −1 ≤ z ≤ 1</text>
<text x="65" y="697" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Old point conormal x = t = 0 → x′ = z, t′ = −z²/2</text>
<line x1="100" y1="920" x2="575" y2="920" stroke="#7b8d9c" stroke-width="2"/>
<line x1="330" y1="1080" x2="330" y2="795" stroke="#7b8d9c" stroke-width="2"/>
<path d="M150,1045 Q330,795 510,1045" fill="none" stroke="#c05725" stroke-width="5"/>
<circle cx="330" cy="920" r="6" fill="#c05725"/>
<line x1="330" y1="910" x2="330" y2="829" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="348" y="845" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">p′ at z = 0</text>
<text x="542" y="951" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">x′</text>
<text x="347" y="791" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">t′</text>
<text x="140" y="1094" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">−1</text>
<text x="497" y="1094" font-family="Georgia,serif" font-size="23" fill="#17324b" font-weight="normal">1</text>
<text x="620" y="795" font-family="Georgia,serif" font-size="26" fill="#17667d" font-weight="normal">Ring direction: HTS.12</text>
<text x="620" y="842" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">old x → x′ − z′</text>
<text x="620" y="889" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">old t → t′ + z′²/2</text>
<text x="620" y="956" font-family="Georgia,serif" font-size="25" fill="#17324b" font-weight="normal">Ordinary straightening:</text>
<text x="620" y="1001" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">t″ = t′ + x′²/2</text>
<text x="620" y="1048" font-family="Georgia,serif" font-size="28" fill="#17324b" font-weight="normal">ξ″ = ξ′ − x′τ′</text>
<text x="620" y="1095" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Front: t″ = ξ″ = 0</text>
<text x="65" y="1163" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">The curve is an exact quadratic Bézier section; the whole chart is complex.</text>
<rect x="32" y="1226" width="1056" height="505" rx="16" fill="white" stroke="#b4c9d6" stroke-width="2"/>
<text x="60" y="1279" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="bold">3  Positive Euler rank forces a nonzero original test</text>
<text x="65" y="1339" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">H¹ of the Euler test has dimension r &gt; 0</text>
<line x1="525" y1="1363" x2="525" y2="1407" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="65" y="1452" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">H¹ μhom(A₀, Sol M₀) is nonzero at p₀</text>
<line x1="525" y1="1475" x2="525" y2="1519" stroke="#17667d" stroke-width="3" marker-end="url(#arr)"/>
<text x="65" y="1566" font-family="Georgia,serif" font-size="29" fill="#17324b" font-weight="normal">MO15 implies p₀ ∈ SS(Sol M₀)</text>
<text x="65" y="1630" font-family="Georgia,serif" font-size="27" fill="#17324b" font-weight="normal">Dense generic points + closedness give HTS.22.</text>
<text x="65" y="1694" font-family="Georgia,serif" font-size="25" fill="#17667d" font-weight="normal">The zero covectors use the connection argument of §3.446.</text>
<text x="42" y="1780" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">The support equality is holonomic; signed DR and ind/global statements</text>
<text x="42" y="1820" font-family="Georgia,serif" font-size="24" fill="#17324b" font-weight="normal">retain their own hypotheses.</text>
</svg>
