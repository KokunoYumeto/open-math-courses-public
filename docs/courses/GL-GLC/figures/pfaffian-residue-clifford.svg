<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Clifford coefficient models for the family Pfaffian</title>
<desc id="desc">PF.31: contraction e and exterior multiplication phi on the basis 1, phi, with e phi plus phi e equal to the identity. PF.32–PF.33: over R=k[epsilon]/epsilon^2 the graph spanned by e1+epsilon phi2 and e2-epsilon phi1 has a free rank-one Clifford quotient; its two cohomology modules are not projective.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285b91"/></marker></defs>
<rect width="1000" height="600" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#17263b} .title{font-size:25px;font-weight:bold}.heading{font-size:20px;font-weight:bold}.body{font-size:18px}.small{font-size:16px}.basis{font-size:27px;font-weight:bold}</style>
<text x="500" y="38" class="title" text-anchor="middle">Clifford lines retain the coefficient ring</text>
<text x="500" y="68" class="body" text-anchor="middle">Exact finite algebra underlying the residue construction</text>
<rect x="26" y="96" width="460" height="448" rx="10" fill="#f5f8fc" stroke="#b8c7d8"/>
<rect x="514" y="96" width="460" height="448" rx="10" fill="#f5f8fc" stroke="#b8c7d8"/>
<text x="48" y="128" class="heading" text-anchor="start">One hyperbolic pair</text>
<text x="48" y="151" class="body" text-anchor="start">M = R·1 ⊕ R·φ;   b(e, φ) = 1</text>
<circle cx="135" cy="228" r="34" fill="#e1edfa" stroke="#285b91" stroke-width="2"/>
<text x="135" y="237" class="basis" text-anchor="middle">1</text>
<circle cx="368" cy="228" r="34" fill="#e1edfa" stroke="#285b91" stroke-width="2"/>
<text x="368" y="237" class="basis" text-anchor="middle">φ</text>
<path d="M160 204 C210 168 294 168 343 204" fill="none" stroke="#285b91" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M343 251 C294 288 210 288 160 251" fill="none" stroke="#285b91" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="252" y="174" class="small" text-anchor="middle">φ: exterior multiplication</text>
<text x="252" y="309" class="small" text-anchor="middle">e: contraction</text>
<text x="48" y="336" class="body" text-anchor="start">In basis order (1, φ):</text>
<text x="48" y="366" class="body" text-anchor="start">e = [[0, 1], [0, 0]]</text>
<text x="48" y="395" class="body" text-anchor="start">φ = [[0, 0], [1, 0]]</text>
<text x="48" y="428" class="body" text-anchor="start">eφ + φe = I;   e² = φ² = 0</text>
<text x="48" y="474" class="small" text-anchor="start">B = Re:      Q = R[φ]      (odd)</text>
<text x="48" y="508" class="small" text-anchor="start">B = Rφ:      Q = R[1]      (even)</text>
<text x="536" y="128" class="heading" text-anchor="start">Two pairs with nilpotent coefficients</text>
<text x="536" y="162" class="body" text-anchor="start">R = k[ε]/(ε²),   A = Re₁ ⊕ Re₂</text>
<text x="536" y="196" class="body" text-anchor="start">B = span(e₁ + εφ₂,  e₂ − εφ₁)</text>
<text x="536" y="230" class="small" text-anchor="start">On Λ(φ₁, φ₂): contraction + wedge</text>
<rect x="536" y="250" width="416" height="110" rx="10" fill="#eaf6ef" stroke="#5e9b74"/>
<text x="554" y="281" class="heading" text-anchor="start">Q is a free line over R</text>
<text x="554" y="313" class="small" text-anchor="start">[φ₁] = [φ₂] = 0;  [1] = ε[φ₁∧φ₂]</text>
<text x="554" y="344" class="body" text-anchor="start">Q = R[φ₁∧φ₂]</text>
<rect x="536" y="382" width="416" height="132" rx="10" fill="#fff3ec" stroke="#c18763"/>
<text x="554" y="414" class="heading" text-anchor="start">Cohomology is not projective</text>
<text x="554" y="447" class="body" text-anchor="start">H⁰ = (εR)²;   H¹ = (R/ε)²</text>
<text x="554" y="482" class="small" text-anchor="start">Its pointwise determinant cannot</text>
<text x="554" y="504" class="small" text-anchor="start">replace this family line.</text>
<text x="500" y="578" class="small" text-anchor="middle">PF.31–PF.33. Algebraic models; the curve construction is PF.18–PF.29.</text>
</svg>
