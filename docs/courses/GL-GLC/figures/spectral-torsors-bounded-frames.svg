<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1500" viewBox="0 0 1120 1500" role="img" aria-labelledby="title desc">
<title id="title">Derived spectral torsors and one bounded frame size</title>
<desc id="desc">Full Hopf torsor reconstruction, degree-zero residues and the HN-gap bound, exact necessary rank-three genus-two polygons, and the full derived Ran frame module. The ordinary atlas is distinguished from the required derived connection atlas and global localization.</desc>
<rect width="1120" height="1500" fill="#fafbff"/>
<text x="35" y="43" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17263c">Derived spectral torsors and bounded frame modules</text>
<text x="35" y="78" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Complex projective curve; every connective DG base and all coherent paths.</text>
<rect x="25" y="100" width="1070" height="248" rx="12" fill="#e9effb" stroke="#9baec6"/>
<text x="45" y="134" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">1. Actual full torsor reconstruction — TBF.1–TBF.7</text>
<text x="45" y="178" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">V_z(V) = u_A E_z(V),   T = V_z(O(H)),   P_z = Spec T</text>
<text x="45" y="219" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">T is a filtered union of finite projective S-modules, with S a retract.</text>
<text x="45" y="260" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">T ⊗ᴸ_S T ≃ T ⊗ O(H);   T ⊗ᴸ_S V_z(V) ≃ T ⊗ V.</text>
<text x="45" y="300" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Full faithfully flat descent retains unbounded modules, tensor maps and higher paths.</text>
<text x="45" y="333" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">For H = G_m, coordinate t is in L∨ and a line-frame change sends t ↦ a⁻¹t.</text>
<rect x="25" y="364" width="1070" height="405" rx="12" fill="#edf6f2" stroke="#9baec6"/>
<text x="45" y="398" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">2. Residues and the exact HN bound — TBF.8–TBF.14</text>
<text x="45" y="440" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Σ Res(α) = 0 ⇒ deg E = 0; every horizontal prefix also has degree zero.</text>
<text x="45" y="480" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#17263c">Gaps satisfy λ_j − λ_j+1 ≤ c,   c = max(0,2g−2).</text>
<text x="45" y="519" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">−(n−1)c/2 ≤ every HN slope ≤ (n−1)c/2.</text>
<text x="45" y="556" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Rank 3, genus 2: necessary polygon comparison (Solution 3.BP)</text>
<path d="M 140 707 H 580" stroke="#526784" stroke-width="1.5" fill="none"/>
<path d="M 140 707 V 582" stroke="#526784" stroke-width="1.5" fill="none"/>
<polyline points="140,707 280,631 420,631 560,707" fill="none" stroke="#116746" stroke-width="4"/>
<polyline points="140,707 280,593 420,593 560,707" fill="none" stroke="#ae3d42" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="140" cy="707" r="4" fill="#116746"/>
<circle cx="280" cy="631" r="4" fill="#116746"/>
<circle cx="420" cy="631" r="4" fill="#116746"/>
<circle cx="560" cy="707" r="4" fill="#116746"/>
<circle cx="280" cy="593" r="4" fill="#ae3d42"/>
<circle cx="420" cy="593" r="4" fill="#ae3d42"/>
<text x="135" y="733" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">0</text>
<text x="275" y="733" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">1</text>
<text x="415" y="733" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">2</text>
<text x="555" y="733" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">3</text>
<text x="87" y="600" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17263c">deg 3</text>
<text x="87" y="639" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17263c">deg 2</text>
<text x="637" y="603" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Excluded: slopes (3,0,−3); gaps 3 &gt; 2.</text>
<text x="637" y="648" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Passes the bound: slopes (2,0,−2).</text>
<text x="637" y="690" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">This necessary test does not prove</text>
<text x="637" y="721" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">existence of the second connection.</text>
<rect x="25" y="785" width="1070" height="332" rx="12" fill="#f5f0fb" stroke="#9baec6"/>
<text x="45" y="819" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17263c">3. The full derived frame module is an actual Ran value — TBF.15–TBF.19</text>
<text x="45" y="861" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">B_n = (n−1) max(g−1,0),   m = B_n + 2g,   b = n(m+1−g)</text>
<text x="45" y="902" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">T_m = ins_id(ρ ⊗ 𝔻_X(F_m)[−1]),   F_m = D_X ⊗ O_X(−mx)</text>
<text x="45" y="943" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17263c">F_z(T_m) ≃ RΓ(X_A, V_z(ρ)(mx)) = W_z</text>
<text x="45" y="984" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Compact Ran duality + all residue fibres ⇒ W_z finite projective of rank b over A.</text>
<text x="45" y="1025" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Rank 3:   genus 0 → b=3;   genus 1 → b=6;   genus 2 → b=15.</text>
<text x="45" y="1066" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">For A = C[δ]/δ², |δ|=−2: a local frame is A^b, with H⁰ and H⁻² both C^b.</text>
<text x="45" y="1097" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Evaluation has an actual finite projective kernel of rank b−n over X_A.</text>
<rect x="25" y="1133" width="1070" height="343" rx="12" fill="#fff5e7" stroke="#9baec6"/>
<text x="45" y="1167" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17263c">4. The bounded atlas input and the remaining global argument — TBF.20</text>
<text x="45" y="1210" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17263c">All reduced spectral torsors use one framed Quot atlas V_(n,0,m).</text>
<text x="45" y="1253" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">Q = V_(n,0,m) ×_Bun_GL_n Bun_H is an ordinary finite-type frame atlas.</text>
<text x="45" y="1296" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#17263c">The full-DG frame module and its evaluation quotient above are proved.</text>
<text x="45" y="1339" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Still required: the derived connection atlas and global quasicoherent comparison.</text>
<text x="45" y="1382" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#17263c">Localization, global generation, the ordinary projector and nilpotent regularity remain.</text>
<text x="45" y="1440" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#17263c">Field extension and the tempered/microlocal comparison still require proofs.</text>
</svg>
