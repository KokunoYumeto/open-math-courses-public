<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1380" viewBox="0 0 1120 1380" role="img" aria-labelledby="title desc"><title id="title">External connection factors and finite curve witnesses</title><desc id="desc">The real coordinate cross z xi_z=0 times zero curve cotangent, an actual middle-extension comparison, the commuting nilpotent tensor square, and the finite DVR torsion proof with an explicit two-tail exterior product.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31546b" /></marker></defs><rect width="1120" height="1380" fill="white" /><text x="34" y="43" font-size="26" fill="#132f42" font-family="Arial, sans-serif">External connection factors and finite curve witnesses</text><rect x="28" y="72" width="1064" height="330" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="110" font-size="23" fill="#132f42" font-family="Arial, sans-serif">1. Product characteristic components: the Kummer boundary</text><line x1="135" y1="274" x2="450" y2="274" stroke="#31546b" stroke-width="1.3" marker-end="url(#arrow)" /><line x1="280" y1="382" x2="280" y2="146" stroke="#31546b" stroke-width="1.3" marker-end="url(#arrow)" /><line x1="172" y1="274" x2="388" y2="274" stroke="#237d9c" stroke-width="4" /><line x1="280" y1="382" x2="280" y2="166" stroke="#b13d32" stroke-width="4" /><text x="462" y="282" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">z</text><text x="300" y="147" font-size="21" fill="#132f42" font-family="Cambria Math, Georgia, serif">ξ<tspan baseline-shift="sub" font-size="15.12">z</tspan></text><text x="256" y="298" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif">0</text><text x="346" y="299" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif">1</text><text x="257" y="210" font-size="18" fill="#132f42" font-family="Cambria Math, Georgia, serif">1</text><line x1="352" y1="269" x2="352" y2="279" stroke="#31546b" stroke-width="1" /><line x1="275" y1="202" x2="285" y2="202" stroke="#31546b" stroke-width="1" /><text x="165" y="248" font-size="20" fill="#237d9c" font-family="Cambria Math, Georgia, serif">ξ<tspan baseline-shift="sub" font-size="14.4">z</tspan> = 0</text><text x="299" y="184" font-size="20" fill="#b13d32" font-family="Cambria Math, Georgia, serif">z = 0</text><text x="82" y="345" font-size="18" fill="#132f42" font-family="Arial, sans-serif">Real section.</text><text x="82" y="375" font-size="18" fill="#132f42" font-family="Arial, sans-serif">Equal scales.</text><text x="540" y="156" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">M = D<tspan baseline-shift="sub" font-size="18.0">B</tspan> / D<tspan baseline-shift="sub" font-size="18.0">B</tspan>(z∂<tspan baseline-shift="sub" font-size="18.0">z</tspan> − 1/2)</text><text x="540" y="204" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif">Char(M ⊠ E<tspan baseline-shift="sub" font-size="17.28">X</tspan>) = {z ξ<tspan baseline-shift="sub" font-size="17.28">z</tspan> = 0} × 0<tspan baseline-shift="sub" font-size="17.28">X</tspan></text><text x="540" y="249" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Both characteristic components have zero</text><text x="540" y="278" font-size="20" fill="#132f42" font-family="Arial, sans-serif">curve covector. The boundary is retained.</text><text x="540" y="328" font-size="20" fill="#132f42" font-family="Arial, sans-serif">General component: conormal(W<tspan baseline-shift="sub" font-size="14.4">i</tspan>) × 0<tspan baseline-shift="sub" font-size="14.4">X</tspan>.</text><text x="540" y="365" font-size="18" fill="#132f42" font-family="Arial, sans-serif">Product geometry: EFC.4–7; calculation: EFC.38–40.</text><rect x="28" y="422" width="1064" height="310" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="460" font-size="23" fill="#132f42" font-family="Arial, sans-serif">2. The actual extension and the commuting coefficient square</text><text x="70" y="507" font-size="25" fill="#132f42" font-family="Cambria Math, Georgia, serif">E<tspan baseline-shift="sub" font-size="18.0">U</tspan> ⊠ E<tspan baseline-shift="sub" font-size="18.0">X</tspan>  ≅  V on U × X</text><line x1="140" y1="529" x2="140" y2="574" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="158" y="557" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif">(j × id<tspan baseline-shift="sub" font-size="15.84">X</tspan>)_!*</text><text x="70" y="618" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">M<tspan baseline-shift="sub" font-size="20.16">B</tspan> ⊠ E<tspan baseline-shift="sub" font-size="20.16">X</tspan>  ≅  N</text><text x="70" y="664" font-size="18" fill="#132f42" font-family="Arial, sans-serif">Specified open evaluation and strict boundary bounds.</text><text x="70" y="700" font-size="18" fill="#132f42" font-family="Arial, sans-serif">Full map: EFC.9–15.</text><text x="740" y="520" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">e₁₁</text><text x="985" y="520" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">e₁₂</text><text x="740" y="650" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">e₂₁</text><text x="985" y="650" font-size="24" fill="#132f42" font-family="Cambria Math, Georgia, serif" text-anchor="middle">e₂₂</text><line x1="740" y1="620" x2="740" y2="537" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="985" y1="620" x2="985" y2="537" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="955" y1="513" x2="770" y2="513" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><line x1="955" y1="643" x2="770" y2="643" stroke="#31546b" stroke-width="2" marker-end="url(#arrow)" /><text x="704" y="587" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif">P</text><text x="1008" y="587" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif">P</text><text x="853" y="500" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif">Q</text><text x="853" y="680" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif">Q</text><text x="724" y="713" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">PQ = QP = E₁₄</text><rect x="28" y="752" width="1064" height="255" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="790" font-size="23" fill="#132f42" font-family="Arial, sans-serif">3. Relative operator coherence and the actual curve connection</text><text x="70" y="835" font-size="26" fill="#132f42" font-family="Cambria Math, Georgia, serif">ξ<tspan baseline-shift="sub" font-size="18.72">t</tspan>ᵏ gr N = 0  ⇒  N finite over R = D(B) ⊗ O(C)</text><text x="70" y="887" font-size="22" fill="#132f42" font-family="Cambria Math, Georgia, serif">At a curve point: u = t − t(c), ∂<tspan baseline-shift="sub" font-size="15.84">t</tspan> u = 1.</text><text x="70" y="929" font-size="20" fill="#132f42" font-family="Arial, sans-serif">T = u-power torsion; R<tspan baseline-shift="sub" font-size="14.4">c</tspan> is noetherian.</text><text x="70" y="970" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Finite generators give a uniform exponent h.</text><text x="624" y="887" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">uʰ T = 0,  ∂<tspan baseline-shift="sub" font-size="16.56">t</tspan> T ⊂ T</text><text x="624" y="931" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">0 = ∂<tspan baseline-shift="sub" font-size="16.56">t</tspan>(uʰ n) = h uʰ⁻¹ n</text><text x="624" y="973" font-size="19" fill="#132f42" font-family="Arial, sans-serif">Minimal h ≥ 1 is impossible; N is curve-flat.</text><rect x="28" y="1027" width="1064" height="320" rx="15" fill="#f7fafc" stroke="#bed0dc" stroke-width="1.5" /><text x="52" y="1065" font-size="23" fill="#132f42" font-family="Arial, sans-serif">4. A specified exterior product with both cohomological tails</text><text x="70" y="1114" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">N = δ<tspan baseline-shift="sub" font-size="20.16">z=0</tspan> ⊠ E<tspan baseline-shift="sub" font-size="20.16">X</tspan>,     K = ⊕<tspan baseline-shift="sub" font-size="20.16">n∈Z</tspan> N[2n]</text><text x="70" y="1170" font-size="28" fill="#132f42" font-family="Cambria Math, Georgia, serif">K = J<tspan baseline-shift="sub" font-size="20.16">B</tspan>( ⊕<tspan baseline-shift="sub" font-size="20.16">n∈Z</tspan> δ<tspan baseline-shift="sub" font-size="20.16">z=0</tspan>[2n], E<tspan baseline-shift="sub" font-size="20.16">X</tspan> )</text><text x="70" y="1222" font-size="23" fill="#132f42" font-family="Cambria Math, Georgia, serif">H²ᵐK = N,    H²ᵐ⁺¹K = 0   for every integer m.</text><text x="70" y="1270" font-size="20" fill="#132f42" font-family="Arial, sans-serif">Curve module: ⊕<tspan baseline-shift="sub" font-size="14.4">r≥0</tspan> E<tspan baseline-shift="sub" font-size="14.4">C</tspan> ∂<tspan baseline-shift="sub" font-size="14.4">z</tspan>ʳ; relative operator generators are finite.</text><text x="70" y="1316" font-size="19" fill="#132f42" font-family="Arial, sans-serif">The general support-only factorization is the separate assertion EFC.33.</text></svg>