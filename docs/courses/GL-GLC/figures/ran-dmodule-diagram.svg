<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1370" viewBox="0 0 1120 1370" role="img" aria-labelledby="title desc">
<title id="title">The actual proper-curve D-module Ran diagram</title>
<desc id="desc">A twisted-arrow morphism tensors the labels u and v at w and pushes D-modules along the proper coordinate map from X cubed to X squared sending xa, xb, xc to xa, xa. The full colimit is obtained by localizing the Grothendieck module category at transition edges. Inserted compact stage objects generate it, its empty-stage unit is compact, and geometric rigidity is a further obligation.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#294756"/></marker>
 <style>
  text{font-family:Georgia,"Times New Roman",serif;fill:#173542}
  .title{font-size:32px;font-weight:bold}.head{font-size:26px;font-weight:bold}
  .label{font-size:24px}.small{font-size:21px}.tiny{font-size:19px}
  .line{stroke:#294756;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
  .box{fill:#fff;stroke:#648995;stroke-width:2;rx:12}
 </style>
</defs>
<rect width="1120" height="1370" fill="#f8faf9"/>
<text x="46" y="56" class="title">From proper coordinate maps to the full Ran category</text>
<text x="46" y="92" class="small">X smooth projective; k of characteristic zero; C compact rigid with compact unit</text>
<rect x="32" y="116" width="1056" height="375" rx="16" fill="#e8f1f3"/>
<text x="54" y="156" class="head">1. A twisted-arrow morphism — (RN.7)–(RN.8)</text>
<rect x="92" y="182" width="236" height="70" class="box"/>
<text x="210" y="225" class="label" text-anchor="middle">I₁ = {u, v}</text>
<rect x="758" y="182" width="270" height="70" class="box"/>
<text x="893" y="225" class="label" text-anchor="middle">J₁ = {a, b, c}</text>
<path d="M342 217H742" class="line"/>
<text x="542" y="202" class="label" text-anchor="middle">ψ₁: u, v ↦ a</text>
<rect x="92" y="337" width="236" height="70" class="box"/>
<text x="210" y="380" class="label" text-anchor="middle">I₂ = {w}</text>
<rect x="758" y="337" width="270" height="70" class="box"/>
<text x="893" y="380" class="label" text-anchor="middle">J₂ = {d, e}</text>
<path d="M342 372H742" class="line"/>
<text x="542" y="357" class="label" text-anchor="middle">ψ₂: w ↦ d</text>
<path d="M210 265V321" class="line"/>
<text x="233" y="299" class="small">α: u, v ↦ w</text>
<path d="M893 322V267" class="line"/>
<text x="634" y="299" class="small">β: d, e ↦ a</text>
<text x="54" y="453" class="label">ψ₁ = β ψ₂ α. Labels multiply: Vᵤ, Vᵥ ↦ Vᵤ ⊗ Vᵥ at w.</text>
<rect x="32" y="510" width="1056" height="307" rx="16" fill="#edf2e6"/>
<text x="54" y="552" class="head">2. The geometric map is proper — (RN.5)–(RN.6)</text>
<rect x="62" y="582" width="270" height="92" class="box"/>
<text x="197" y="618" class="label" text-anchor="middle">X³</text>
<text x="197" y="652" class="label" text-anchor="middle">(x_a, x_b, x_c)</text>
<rect x="452" y="582" width="215" height="92" class="box"/>
<text x="559" y="618" class="label" text-anchor="middle">X</text>
<text x="559" y="652" class="label" text-anchor="middle">x_a</text>
<rect x="801" y="582" width="253" height="92" class="box"/>
<text x="928" y="618" class="label" text-anchor="middle">X²</text>
<text x="928" y="652" class="label" text-anchor="middle">(x_a, x_a)</text>
<path d="M343 626H436" class="line"/>
<path d="M680 626H786" class="line"/>
<text x="390" y="706" class="small" text-anchor="middle">projection</text>
<text x="390" y="734" class="tiny" text-anchor="middle">projective X² fibre</text>
<text x="735" y="706" class="small" text-anchor="middle">diagonal</text>
<text x="735" y="734" class="tiny" text-anchor="middle">closed embedding</text>
<text x="54" y="778" class="small">(Δβ)∗ carries every bounded coherent D-module complex to a compact object.</text>
<rect x="32" y="836" width="1056" height="491" rx="16" fill="#f1ecf5"/>
<text x="54" y="878" class="head">3. Impose all coherent transition identifications — (RN.10)–(RN.13)</text>
<rect x="63" y="905" width="418" height="95" class="box"/>
<text x="272" y="941" class="label" text-anchor="middle">Stages Aψ = C⊗ᴵ ⊗ Dmod(Xᴶ)</text>
<text x="272" y="977" class="small" text-anchor="middle">compact labels and induced ample twists</text>
<rect x="629" y="905" width="426" height="95" class="box"/>
<text x="842" y="941" class="label" text-anchor="middle">Full modules over the Grothendieck G</text>
<text x="842" y="977" class="small" text-anchor="middle">transition edge ξ and compact cone S</text>
<path d="M493 952H614" class="line"/>
<rect x="139" y="1038" width="842" height="110" class="box"/>
<text x="560" y="1074" class="label" text-anchor="middle">Mₙ₊₁ = cofib( ⊕ₛ S ⊗ RHom(S, Mₙ) → Mₙ )</text>
<text x="560" y="1113" class="small" text-anchor="middle">L(M) = colim Mₙ; RHom(S, L(M)) = 0 for every transition cone</text>
<path d="M842 1011V1026" class="line"/>
<text x="54" y="1191" class="label">Full Ran colimit: continuous functors are coherent compatible stage functors.</text>
<text x="54" y="1230" class="label">Compacts = finite constructions and retracts of inserted stage compacts.</text>
<text x="54" y="1269" class="label">Unit = ins∅→∅(k), compact. Disjoint union defines the tensor ⋆.</text>
<text x="54" y="1306" class="small">Geometric evaluation, coevaluation and triangle identities are still required for rigidity.</text>
</svg>
