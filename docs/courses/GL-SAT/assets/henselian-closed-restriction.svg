<svg xmlns="http://www.w3.org/2000/svg" width="600" height="970" viewBox="0 0 600 970" role="img" aria-labelledby="title desc">
<title id="title">Why the closed restriction remains connected</title>
<desc id="desc">For integral projective C over a Noetherian henselian pair A,I, the finite domain B of global functions has only trivial idempotents modulo I and in its completion. A hypothetical partition of C modulo I gives an idempotent which lifts uniquely through all infinitesimal thickenings. Formal functions identifies that compatible sequence with an idempotent of completed B, giving a contradiction. No flatness of C or reducedness of its closed restriction is required.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#263e50" stroke-width="1.5"/></marker></defs>
<rect width="600" height="970" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172e40">
<text x="24" y="36" font-size="26" font-weight="bold">A connected closed restriction</text>
<text x="24" y="66" font-size="20">A Noetherian; C integral and projective over A</text>
<text x="24" y="89" font-size="20">(A, I) henselian; C nonempty</text>
<rect x="24" y="103" width="552" height="92" rx="9" fill="#f0f6fc" stroke="#9fb3c6"/>
<text x="43" y="130" font-size="23">B = Γ(C, O<tspan baseline-shift="sub" font-size="16">C</tspan>) is a finite A-algebra</text>
<text x="43" y="165" font-size="23">and a domain.</text>
<path d="M300,207 V245" fill="none" stroke="#263e50" stroke-width="2" marker-end="url(#arrow)"/>
<text x="319" y="233" font-size="20">henselian idempotent lifting</text>
<rect x="24" y="256" width="552" height="106" rx="9" fill="#f0f6fc" stroke="#9fb3c6"/>
<text x="43" y="295" font-size="23">Idempotents of B/IB: only 0 and 1.</text>
<text x="43" y="332" font-size="21">Nilpotent uniqueness gives the same in B/IⁿB.</text>
<path d="M300,374 V413" fill="none" stroke="#263e50" stroke-width="2" marker-end="url(#arrow)"/>
<text x="319" y="401" font-size="20">compatible inverse limit</text>
<rect x="24" y="424" width="552" height="82" rx="9" fill="#eaf5ed" stroke="#95b69e"/>
<text x="43" y="472" font-size="23">Completed B has only idempotents 0 and 1.</text>
<rect x="24" y="541" width="552" height="91" rx="9" fill="#fcf0ee" stroke="#cc9d98"/>
<text x="43" y="580" font-size="23">A hypothetical partition of C<tspan baseline-shift="sub" font-size="16">1</tspan> gives</text>
<text x="43" y="613" font-size="23">a nontrivial idempotent e<tspan baseline-shift="sub" font-size="16">1</tspan>.</text>
<path d="M300,644 V681" fill="none" stroke="#263e50" stroke-width="2" marker-end="url(#arrow)"/>
<text x="319" y="671" font-size="20">unique nilpotent lifts</text>
<rect x="24" y="692" width="552" height="88" rx="9" fill="#fcf0ee" stroke="#cc9d98"/>
<text x="43" y="730" font-size="23">Compatible e<tspan baseline-shift="sub" font-size="16">n</tspan> in Γ(C<tspan baseline-shift="sub" font-size="16">n</tspan>, O<tspan baseline-shift="sub" font-size="16">Cₙ</tspan>)</text>
<text x="43" y="764" font-size="21">C<tspan baseline-shift="sub" font-size="15">n</tspan> = C ×<tspan baseline-shift="sub" font-size="15">A</tspan> Spec(A/Iⁿ)</text>
<path d="M300,792 V829" fill="none" stroke="#263e50" stroke-width="2" marker-end="url(#arrow)"/>
<text x="319" y="819" font-size="20">projective formal functions</text>
<rect x="24" y="840" width="552" height="90" rx="9" fill="#fcf0ee" stroke="#cc9d98"/>
<text x="43" y="879" font-size="23">The sequence defines an idempotent of</text>
<text x="43" y="913" font-size="23">completed B: contradiction.</text>
<text x="24" y="957" font-size="16">Lesson 05, D.1–D.3. CC0; this SVG is the editable source.</text>
</g></svg>
