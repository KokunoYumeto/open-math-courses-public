<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1260" viewBox="0 0 600 1260" role="img" aria-labelledby="title desc">
<title id="title">A finite refinement of an étale cover</title>
<desc id="desc">Finite completion, removal of one sheet, induction and finite extension produce a finite surjection with local maps into the original étale cover. No flatness of the finite replacement is required.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#294653" stroke-width="1.5"/></marker></defs>
<rect width="600" height="1260" fill="white"/>
<g font-family="Arial, sans-serif" fill="#193b50">
<text x="24" y="36" font-size="26" font-weight="bold">A finite refinement of an étale cover</text>
<text x="24" y="65" font-size="20">Noetherian X, separated over an affine base</text>
<rect x="24" y="86" width="552" height="96" rx="9" fill="#edf5fb" stroke="#a9bccb"/>
<text x="42" y="116" font-size="23">U → X: surjective étale, quasi-affine</text>
<text x="42" y="147" font-size="22">Geometric fibre counts have a bound d.</text>
<path d="M300 193 V228" stroke="#294653" stroke-width="2" marker-end="url(#arrow)"/>
<text x="321" y="218" font-size="19">quasi-affine completion</text>
<rect x="24" y="242" width="552" height="93" rx="9" fill="#edf5fb" stroke="#a9bccb"/>
<text x="42" y="274" font-size="23">U ⊂ Y → X: open, dense, then finite</text>
<text x="42" y="305" font-size="22">Remove its graph from U ×<tspan baseline-shift="sub" font-size="16">X</tspan> Y.</text>
<path d="M300 347 V382" stroke="#294653" stroke-width="2" marker-end="url(#arrow)"/>
<text x="321" y="371" font-size="19">one sheet removed</text>
<rect x="24" y="396" width="552" height="130" rx="9" fill="#edf5fb" stroke="#a9bccb"/>
<text x="42" y="428" font-size="23">V → W ⊂ Y: étale and surjective</text>
<text x="42" y="458" font-size="22">W is its image; Y ∖ U lies in W.</text>
<text x="42" y="489" font-size="22">Fibre counts ≤ d − 1, also on Y ∖ U.</text>
<text x="42" y="512" font-size="17">Lower semicontinuity + dense U give the bound.</text>
<path d="M300 538 V573" stroke="#294653" stroke-width="2" marker-end="url(#arrow)"/>
<text x="321" y="562" font-size="19">induction on d</text>
<rect x="24" y="587" width="552" height="96" rx="9" fill="#edf5fb" stroke="#a9bccb"/>
<text x="42" y="619" font-size="23">T<tspan baseline-shift="sub" font-size="17">W</tspan> → W: finite and surjective</text>
<text x="42" y="651" font-size="22">Zariski locally: T<tspan baseline-shift="sub" font-size="16">W</tspan> → V → U.</text>
<path d="M300 695 V730" stroke="#294653" stroke-width="2" marker-end="url(#arrow)"/>
<text x="321" y="719" font-size="19">integral-algebra extension</text>
<rect x="24" y="744" width="552" height="96" rx="9" fill="#edf5fb" stroke="#a9bccb"/>
<text x="42" y="777" font-size="23">T<tspan baseline-shift="sub" font-size="17">Y</tspan> → Y: finite, extending T<tspan baseline-shift="sub" font-size="17">W</tspan></text>
<text x="42" y="809" font-size="22">Over U, projection itself maps to U.</text>
<path d="M300 852 V887" stroke="#294653" stroke-width="2" marker-end="url(#arrow)"/>
<text x="321" y="876" font-size="19">cover the complement</text>
<rect x="24" y="901" width="552" height="107" rx="9" fill="#eef8f0" stroke="#8db49a"/>
<text x="42" y="935" font-size="23">T = T<tspan baseline-shift="sub" font-size="17">Y</tspan> ⨿ (Y ∖ W)<tspan baseline-shift="sub" font-size="16">red</tspan> → X</text>
<text x="42" y="968" font-size="22">Finite surjective; locally mapping to U.</text>
<text x="42" y="992" font-size="17">W and U cover Y, since Y ∖ W ⊂ U.</text>
<path d="M300 1020 V1055" stroke="#294653" stroke-width="2" marker-end="url(#arrow)"/>
<text x="321" y="1044" font-size="19">finite-surjection descent</text>
<rect x="24" y="1070" width="552" height="127" rx="9" fill="#fff5e9" stroke="#ccb286"/>
<text x="42" y="1103" font-size="22">Proper X over Noetherian henselian (A,I):</text>
<text x="42" y="1137" font-size="23">Γ(X, F) → Γ(Z, F|<tspan baseline-shift="sub" font-size="16">Z</tspan>) is bijective.</text>
<text x="42" y="1167" font-size="20">Appendix D supplies connected point closures.</text>
<text x="42" y="1189" font-size="17">F is any étale sheaf of sets; no flatness premise.</text>
<text x="24" y="1233" font-size="17">Proof: E.4.3, E.5.1, E.6.1 and E.7.1. Editable SVG; CC0.</text>
</g></svg>
