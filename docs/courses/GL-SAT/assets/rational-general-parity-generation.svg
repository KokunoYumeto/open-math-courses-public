<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="24" text-anchor="middle">Full equivalence first; general IC parity follows</text>
<rect x="28" y="80" width="564" height="178" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="121" font-size="29" text-anchor="middle">Sat_G(E) ≃ Rep_E(Ĝ_E)</text>
<text x="310" y="162" font-size="21" text-anchor="middle">Appendix B removed every extension kernel.</text>
<text x="310" y="204" font-size="20" text-anchor="middle">The whole heart is semisimple over the original E.</text>
<text x="310" y="241" font-size="17" text-anchor="middle">This equivalence was proved without general IC boundary parity.</text>
<path d="M310,273 L310,305" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="319" width="564" height="196" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="359" font-size="23" text-anchor="middle">Choose finitely many geometric generators</text>
<text x="310" y="403" font-size="23" text-anchor="middle">Minuscule IC: smooth closed flag support.</text>
<text x="310" y="447" font-size="20" text-anchor="middle">Short-coroot IC: supported Euler cone + Lefschetz.</text>
<text x="310" y="485" font-size="18" text-anchor="middle">Their duals have these same forms and component parities.</text>
<text x="310" y="506" font-size="17" text-anchor="middle">Their simple modules form a schematically faithful sum.</text>
<path d="M310,530 L310,562" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="576" width="564" height="196" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="616" font-size="18" text-anchor="middle">Rootwise fibres are affine paved in every characteristic.</text>
<text x="310" y="657" font-size="18" text-anchor="middle">Odd Hom on affine cells gives actual derived IC retracts.</text>
<text x="310" y="699" font-size="26" text-anchor="middle">One wall:  DΘ_s(Q)=Θ_s(DQ)(1)[2]</text>
<text x="310" y="741" font-size="22" text-anchor="middle">The dual Tate line stays; the shift is even.</text>
<text x="310" y="762" font-size="17" text-anchor="middle">Concatenation preserves parity with its sole [d_λ] shift.</text>
<path d="M310,787 L310,819" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="833" width="564" height="247" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="874" font-size="24" text-anchor="middle">Every IC is a summand of generator words.</text>
<text x="310" y="916" font-size="26" text-anchor="middle">word component [Σξ_j]=[λ]</text>
<text x="310" y="958" font-size="27" text-anchor="middle">Σh_G(ξ_j)−d_λ ∈ 2ℤ</text>
<text x="310" y="1000" font-size="24" text-anchor="middle">because 〈2ρ_G,α_i∨〉=2.</text>
<text x="310" y="1041" font-size="22" text-anchor="middle">The summand has stalk and costalk parity d_λ.</text>
<text x="310" y="1069" font-size="17" text-anchor="middle">Stratum duality adds 2d_μ and a Tate line, preserving parity.</text>
<text x="310" y="1126" font-size="16" text-anchor="middle">Theorems C.3.1.1, C.3.2.1 and C.4.1.1; Exercise C.5.4</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">Finite E/ℚ_ℓ; k algebraically closed, with ℓ invertible.</text>
</svg>