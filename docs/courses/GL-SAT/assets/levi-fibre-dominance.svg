<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">A top component dominates its rank-one image</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="22" text-anchor="middle">K ⊂ Gr^λ∩S_ν; K° ⊂ K is dense open.</text>
<text x="310" y="198" font-size="25" text-anchor="middle">dim K = D=(d_λ+h_G(ν))/2</text>
<text x="310" y="237" font-size="26" text-anchor="middle">q_i:K°→Gr_Mi^η∩S_Mi,ν</text>
<text x="310" y="276" font-size="23" text-anchor="middle">δ=h_G(ν)−h_Mi(ν); m=d_η^Mi</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="23" text-anchor="middle">j_!E[d_λ] has perverse degrees ≤0.</text>
<text x="310" y="443" font-size="23" text-anchor="middle">The actual CT preserves this bound.</text>
<text x="310" y="482" font-size="21" text-anchor="middle">A fibre of dimension f has H_c^(2f)≠0.</text>
<text x="310" y="521" font-size="30" text-anchor="middle">2f ≤ d_λ+δ−m</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="23" text-anchor="middle">D = dim(image) + dim(generic fibre)</text>
<text x="310" y="688" font-size="23" text-anchor="middle">dim(image) ≥ (m+n)/2; n=〈α_i,ν〉</text>
<text x="310" y="727" font-size="18" text-anchor="middle">The rank-one slice is irreducible of that dimension.</text>
<text x="310" y="766" font-size="24" text-anchor="middle">Therefore the generic image is dense.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="21" text-anchor="middle">s=(n−m)/2; x(t)=Σ_(j=s)^(n−1) a_j t^j</text>
<text x="310" y="933" font-size="27" text-anchor="middle">Closed slice: A^((m+n)/2)</text>
<text x="310" y="972" font-size="22" text-anchor="middle">For |n|&lt;m: open slice G_m×A^(r−1)</text>
<text x="310" y="1011" font-size="26" text-anchor="middle">Its last residue is a_(n−1).</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Proposition F.1.1.1; Lemma F.2.1.1; Proposition F.3.1.1.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">Full torus lattices and nonprimitive coroots are retained.</text>
</svg>