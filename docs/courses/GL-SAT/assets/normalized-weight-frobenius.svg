<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The actual operator on every Satake weight</text>
<text x="310" y="84" font-size="24" text-anchor="middle">a²=q;  d_λ=〈2ρ,λ〉;  h_ν=〈2ρ,ν〉</text>
<rect x="28" y="119" width="564" height="185" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="163" font-size="30" text-anchor="middle">t = (2ρ)(a) ∈ T∨(E)</text>
<text x="310" y="207" font-size="28" text-anchor="middle">ν(t)=a^(h_ν);  βᵢ(t)=q</text>
<text x="310" y="251" font-size="22" text-anchor="middle">Φ_G = Ad(t) as group-scheme automorphisms</text>
<text x="310" y="282" font-size="18" text-anchor="middle">Root-group polynomial identities retain the full centre.</text>
<path d="M310,320 L310,353" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="369" width="564" height="186" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="413" font-size="32" text-anchor="middle">F_λ = c_λ ρ_λ(t)</text>
<text x="310" y="457" font-size="22" text-anchor="middle">The commutant of the actual simple IC is E.</text>
<text x="310" y="501" font-size="18" text-anchor="middle">Highest split affine slice A^(d_λ): Frobenius q^(d_λ)</text>
<text x="310" y="535" font-size="27" text-anchor="middle">Hence c_λ = a^(d_λ).</text>
<path d="M310,571 L310,604" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="620" width="564" height="211" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="664" font-size="28" text-anchor="middle">Raw weight: F_λ = a^(d_λ+h_ν) id</text>
<text x="310" y="708" font-size="29" text-anchor="middle">= q^((d_λ+h_ν)/2) id</text>
<text x="310" y="752" font-size="21" text-anchor="middle">The exponent is integral by the coroot parity.</text>
<text x="310" y="796" font-size="21" text-anchor="middle">Half twist (d_λ/2) multiplies by a^(−d_λ).</text>
<path d="M310,847 L310,880" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="896" width="564" height="176" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="940" font-size="30" text-anchor="middle">Normalized weight: a^(h_ν) id</text>
<text x="310" y="984" font-size="20" text-anchor="middle">No root-of-unity factor or unipotent part remains.</text>
<text x="310" y="1028" font-size="18" text-anchor="middle">The normalized Weil maps form a symmetric tensor lift.</text>
<text x="310" y="1056" font-size="17" text-anchor="middle">Faithful cohomology detects the actual tensor-map equality.</text>
<text x="310" y="1125" font-size="19" text-anchor="middle">Theorem A.3.1.1; Exercises A.4.1–A.4.2.</text>
<text x="310" y="1165" font-size="18" text-anchor="middle">The graded stalk formula is proved in Theorem D.6.1.1.</text>
</svg>