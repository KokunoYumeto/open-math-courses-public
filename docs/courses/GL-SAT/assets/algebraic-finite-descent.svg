<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="24" text-anchor="middle">Finite data in the actual coefficient category</text>
<text x="310" y="81" font-size="20" text-anchor="middle">F/ℚ_ℓ algebraic, with the final coefficient topology</text>
<rect x="28" y="111" width="564" height="194" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="25" text-anchor="middle">P profinite;  f:P→F continuous</text>
<text x="310" y="195" font-size="25" text-anchor="middle">compact image ⊂ one finite E/ℚ_ℓ</text>
<text x="310" y="236" font-size="19" text-anchor="middle">If no E contains it: choose ℚ_ℓ-independent cₙ.</text>
<text x="310" y="273" font-size="17" text-anchor="middle">{cₙ} is closed discrete: impossible inside a compact set.</text>
<path d="M310,320 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="367" width="564" height="180" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="409" font-size="26" text-anchor="middle">F_X = colim E′_X = E_X ⊗_E F</text>
<text x="310" y="451" font-size="24" text-anchor="middle">Scalar extension is exact and faithful.</text>
<text x="310" y="493" font-size="22" text-anchor="middle">RHom(K_F,L_F) = RHom(K_E,L_E) ⊗_E F</text>
<text x="310" y="531" font-size="17" text-anchor="middle">A common lower bound makes every total degree finite.</text>
<path d="M310,562 L310,594" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="609" width="564" height="205" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="652" font-size="25" text-anchor="middle">Descend the attaching maps too</text>
<text x="310" y="695" font-size="24" text-anchor="middle">j_!C_U → C → i_*C_Z ─δ→ j_!C_U[1]</text>
<text x="310" y="737" font-size="23" text-anchor="middle">Then descend the finite Postnikov tower.</text>
<text x="310" y="779" font-size="19" text-anchor="middle">One finite compositum contains all objects and maps.</text>
<path d="M310,829 L310,861" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="876" width="564" height="201" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="918" font-size="24" text-anchor="middle">Genuine action: a*P[d_J] ≃ p*P[d_J]</text>
<text x="310" y="960" font-size="22" text-anchor="middle">Action + inverse on J×X; unit on X.</text>
<text x="310" y="1002" font-size="22" text-anchor="middle">Cocycle on J²×X; all equations descend.</text>
<text x="310" y="1047" font-size="17" text-anchor="middle">Heart actions have no further chosen higher homotopies.</text>
<text x="310" y="1126" font-size="18" text-anchor="middle">Lemmas D.1.1.1–D.1.2.1; Theorem D.2.2.1</text>
<text x="310" y="1167" font-size="16" text-anchor="middle">Proposition D.4.1.1; Exercise D.5.1 distinguishes the two topologies.</text>
</svg>