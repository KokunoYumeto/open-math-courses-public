<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Extensions split; the full multiplicity survives</text>
<text x="310" y="84" font-size="18" text-anchor="middle">Geometric Ext; actual Frobenius; original central labels</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="17" text-anchor="middle">Ext¹(Πμ,Πν) reduces by rigid Hecke adjunction.</text>
<text x="310" y="198" font-size="16" text-anchor="middle">Full central indices differ: the Ext group is zero.</text>
<text x="310" y="237" font-size="21" text-anchor="middle">Zero central character: Vσ ⊂ End(Vλ).</text>
<text x="310" y="276" font-size="17" text-anchor="middle">Absorption reduces Ext¹ to Ext¹(Πλ,Πλ)=0.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="16" text-anchor="middle">An actual image/cokernel filtration puts Δμ in W.</text>
<text x="310" y="443" font-size="24" text-anchor="middle">Semisimplicity splits Δμ → Πμ.</text>
<text x="310" y="482" font-size="16" text-anchor="middle">The boundary summand has zero stalks: it is zero.</text>
<text x="310" y="521" font-size="25" text-anchor="middle">Canonical cleanness: Δμ ≅ Πμ ≅ ∇μ.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="21" text-anchor="middle">η=μ+ν; D=(dλ+hν)/2; raw IC is used.</text>
<text x="310" y="688" font-size="16" text-anchor="middle">H_c^hν = Hom(Vλ⊗Vμ,Vη)(−D); all others vanish.</text>
<text x="310" y="727" font-size="15" text-anchor="middle">Raw Frobenius = q^D id; normalized multiplicity = id.</text>
<text x="310" y="766" font-size="21" text-anchor="middle">SL₂, λ=μ=α∨: ν=−α∨,0,α∨.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="17" text-anchor="middle">SL₂ groups: H⁻²=E; H⁰=E(−1); H²=E(−2).</text>
<text x="310" y="933" font-size="23" text-anchor="middle">Their actual operators are 1,q,q².</text>
<text x="310" y="972" font-size="16" text-anchor="middle">PGL₂ lift: ν̃=(−α∨sc,ω∨), not (0,−ω∨).</text>
<text x="310" y="1011" font-size="17" text-anchor="middle">The adjusted central character retains the unit.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorems P.6.1.1–P.10.1.1; Exercises P.11.1–P.11.2.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Local cohomology transfers to every original split reductive G.</text>
</svg>