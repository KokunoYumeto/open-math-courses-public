<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="45" font-size="28" text-anchor="middle">Double evaluation with its signs</text>
<text x="310" y="84" font-size="22" text-anchor="middle">D_X = RHom(−, Ω_X),   Ω_X = a_X^! Ô_k</text>
<rect x="28" y="117" width="564" height="182" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="157" font-size="23" text-anchor="middle">Integral constructible complexes</text>
<text x="130" y="225" font-size="32" text-anchor="middle">K</text>
<text x="490" y="225" font-size="29" text-anchor="middle">D_X² K</text>
<path d="M207,212 L413,212" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="196" font-size="25" text-anchor="middle">η_K</text>
<text x="310" y="269" font-size="20" text-anchor="middle">η_K is defined by evaluation and tensor symmetry.</text>
<path d="M130,312 L130,363" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M490,312 L490,363" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="344" font-size="22" text-anchor="middle">Derived reduction mod π</text>
<rect x="28" y="374" width="564" height="179" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="414" font-size="23" text-anchor="middle">Finite-field structural duality</text>
<text x="130" y="480" font-size="31" text-anchor="middle">K₁</text>
<text x="490" y="480" font-size="27" text-anchor="middle">D_X,1² K₁</text>
<path d="M207,467 L413,467" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="451" font-size="24" text-anchor="middle">η_K₁</text>
<text x="310" y="523" font-size="20" text-anchor="middle">The reduced map is canonical finite biduality.</text>
<rect x="28" y="580" width="564" height="120" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="620" font-size="20" text-anchor="middle">Cone(η_K) is complete and has first reduction 0.</text>
<text x="310" y="668" font-size="25" text-anchor="middle" style="fill:#15803d">Therefore Cone(η_K) = 0.</text>
<rect x="28" y="729" width="564" height="267" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="768" font-size="21" text-anchor="middle">At a point: P = [O → O] in degrees −1, 0</text>
<text x="130" y="811" font-size="29" text-anchor="middle">O</text>
<text x="490" y="811" font-size="29" text-anchor="middle">O</text>
<path d="M179,799 L437,799" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="786" font-size="25" text-anchor="middle">π</text>
<text x="67" y="813" font-size="23" text-anchor="middle">P</text>
<path d="M130,831 L130,896" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M490,831 L490,896" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="166" y="870" font-size="23" text-anchor="start">−1</text>
<text x="517" y="870" font-size="23" text-anchor="start">+1</text>
<text x="130" y="938" font-size="29" text-anchor="middle">O</text>
<text x="490" y="938" font-size="29" text-anchor="middle">O</text>
<path d="M179,926 L437,926" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="913" font-size="24" text-anchor="middle">−π</text>
<text x="64" y="940" font-size="20" text-anchor="middle">D²P</text>
<text x="310" y="976" font-size="19" text-anchor="middle">The evaluation square commutes: (−π)(−1) = π.</text>
<text x="310" y="1023" font-size="20" text-anchor="middle">Theorem P.3.2.1 and Exercise P.4.1</text>
</svg>