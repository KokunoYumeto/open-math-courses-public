<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="45" font-size="29" text-anchor="middle">Exceptional inverse image</text>
<text x="310" y="83" font-size="23" text-anchor="middle">from the actual finite adjunctions</text>
<text x="310" y="119" font-size="20" text-anchor="middle">K ∈ C_O(Y),   f : X → Y separated and finite type</text>
<rect x="28" y="146" width="564" height="126" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="189" font-size="24" text-anchor="middle">H = f_O^!K = Rlim_n ν_X⁻¹(f_n^!K_n)</text>
<text x="310" y="230" font-size="20" text-anchor="middle">The finite transitions are adjunction mates.</text>
<path d="M310,282 L310,329" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="341" y="312" font-size="20" text-anchor="start">reduce over O</text>
<rect x="28" y="340" width="564" height="202" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="384" font-size="28" text-anchor="middle">H ⊗^L_O O_n</text>
<path d="M310,402 L310,450" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="341" y="430" font-size="24" text-anchor="start">α_n</text>
<text x="310" y="484" font-size="28" text-anchor="middle">ν_X⁻¹ f_n^!K_n</text>
<text x="310" y="520" font-size="20" text-anchor="middle">α_n is the map from the limit projection.</text>
<rect x="28" y="570" width="564" height="187" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="612" font-size="24" text-anchor="middle">On W → A^N_V → V → Y</text>
<text x="310" y="648" font-size="21" text-anchor="middle">i closed,   q projection,   v open</text>
<text x="310" y="687" font-size="22" text-anchor="middle">H|_W = A_W = i^!q_O^*v_O^*K(N)[2N]</text>
<text x="310" y="727" font-size="20" text-anchor="middle">A_W is complete; its reductions identify α_n.</text>
<rect x="28" y="790" width="564" height="186" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="831" font-size="20" text-anchor="middle">Take the limit of the finite mapping complexes</text>
<text x="310" y="875" font-size="24" text-anchor="middle">RHom_X(F,H) ≅ RHom_Y(Rf_!F,K)</text>
<text x="310" y="915" font-size="20" text-anchor="middle">The same counits specify the global adjunction.</text>
<text x="310" y="951" font-size="20" text-anchor="middle">No perfectness of O_n over O_m is assumed.</text>
<text x="310" y="1020" font-size="19" text-anchor="middle">Theorem P.2.2.1 and Corollary P.2.2.2</text>
</svg>