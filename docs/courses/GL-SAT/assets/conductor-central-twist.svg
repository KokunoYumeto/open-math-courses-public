<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="25" fill="#172554" text-anchor="middle">Central twist preserves the root line</text><text x="310" y="77" font-size="20" fill="#172554" text-anchor="middle">Original SL₂ on ℙ¹; conductor divisor x+y</text><rect x="25" y="108" width="570" height="237" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="149" font-size="23" fill="#172554" text-anchor="middle">Enlarged GL₂ bundle E⁺</text><text x="310" y="196" font-size="25" fill="#172554" text-anchor="middle">0 → O(−1) → E⁺ → O(3) → 0</text><text x="310" y="239" font-size="20" fill="#172554" text-anchor="middle">det(E⁺)=O(2); auxiliary line C=O(−2)</text><text x="310" y="282" font-size="20" fill="#172554" text-anchor="middle">Root line = O(−1) ⊗ O(3)⁻¹ = O(−4)</text><text x="310" y="321" font-size="18" fill="#172554" text-anchor="middle">Ext¹(O(3),O(−1))=H¹(O(−4)): dimension 3</text><path d="M310,360 L310,406" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="440" y="389" font-size="20" fill="#172554" text-anchor="middle">⊗ O(−1)</text><rect x="25" y="422" width="570" height="240" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="464" font-size="21" fill="#172554" text-anchor="middle">Actual original determinant-one bundle E</text><text x="310" y="511" font-size="25" fill="#172554" text-anchor="middle">0 → O(−2) → E → O(2) → 0</text><text x="310" y="555" font-size="23" fill="#172554" text-anchor="middle">det(E)=O; root line still O(−4)</text><text x="310" y="598" font-size="20" fill="#172554" text-anchor="middle">C ⊗ O(−1)⁻² = O: exact auxiliary frame</text><text x="310" y="639" font-size="18" fill="#172554" text-anchor="middle">All highest maps and inverse units transport.</text><rect x="25" y="702" width="570" height="266" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="744" font-size="19" fill="#172554" text-anchor="middle">Local slice: λ=α∨, μ=ν=0; n(a t⁻¹) ∈ 𝔸¹</text><text x="310" y="789" font-size="22" fill="#172554" text-anchor="middle">Raw IC on the slice is E[2].</text><text x="310" y="835" font-size="20" fill="#172554" text-anchor="middle">c=0: χ(a)=a; entire compact complex = 0</text><text x="310" y="879" font-size="20" fill="#172554" text-anchor="middle">c=1: χ(a)=0; compact complex = E(−1)[0]</text><text x="310" y="924" font-size="19" fill="#172554" text-anchor="middle">Only H⁰=E(−1) survives; actual Frobenius q.</text><text x="310" y="1010" font-size="18" fill="#172554" text-anchor="middle">For c=1: HomGL₂(Ad ⊗ Std, Std) has dimension 1.</text><text x="310" y="1048" font-size="18" fill="#172554" text-anchor="middle">Std is in the enlarged degree-one central block.</text><text x="310" y="1090" font-size="16" fill="#172554" text-anchor="middle">Theorems Q.2.1.1–Q.3.1.1, Q.6.1.1; §Q.7.</text></g></svg>