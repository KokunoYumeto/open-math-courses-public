<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Strict operator models retain their entire comparison</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.67: the canonical unit and marked model-change signs</text><rect x="25" y="105" width="570" height="340" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="21" fill="#172554" text-anchor="middle">The extra unit term in the strict section</text><text x="310" y="191" font-size="20" fill="#172554" text-anchor="middle">A = ΩB(k[2]),     D = ba,     dH = D − c</text><text x="310" y="236" font-size="20" fill="#172554" text-anchor="middle">dH′ = D′ − c′;   P = b′a′;   dV = P − D′</text><text x="310" y="281" font-size="24" fill="#172554" text-anchor="middle">σ(H) = H′ + V,     σ(D) = P</text><text x="310" y="326" font-size="24" fill="#172554" text-anchor="middle">dσ(H) = P − c′</text><text x="310" y="373" font-size="21" fill="#172554" text-anchor="middle">Full comparison: u₀ = Id,     u₁(D) = −V</text><text x="310" y="419" font-size="18" fill="#172554" text-anchor="middle">The exact inverse has higher value +V on D.</text><rect x="25" y="485" width="570" height="340" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="528" font-size="21" fill="#172554" text-anchor="middle">The resulting actual operator correction</text><text x="125" y="591" font-size="28" fill="#172554" text-anchor="middle">e⁰</text><text x="500" y="591" font-size="28" fill="#172554" text-anchor="middle">y⁰</text><text x="310" y="706" font-size="28" fill="#172554" text-anchor="middle">f⁻¹</text><path d="M160,583 L460,583 M447.0,589.0 L460,583 L447.0,577.0" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="310" y="568" font-size="20" fill="#7c3aed" text-anchor="middle">L = ∂K</text><path d="M150,610 L280,675 M265.68916494400133,674.5527864045 L280,675 L271.05572809000085,663.819660112501" fill="none" stroke="#2563eb" stroke-width="3"/><text x="188" y="655" font-size="21" fill="#2563eb" text-anchor="middle">K</text><path d="M345,675 L475,610 M466.05572809000085,621.180339887499 L475,610 L460.68916494400133,610.4472135955" fill="none" stroke="#15803d" stroke-width="3"/><text x="433" y="655" font-size="21" fill="#15803d" text-anchor="middle">d</text><text x="310" y="752" font-size="22" fill="#172554" text-anchor="middle">F♯(H′) = 0,     F♯(V) = K</text><text x="310" y="799" font-size="23" fill="#172554" text-anchor="middle">Fˢᵗ(H) = K,     ∂K = L</text><rect x="25" y="865" width="570" height="190" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="907" font-size="19" fill="#172554" text-anchor="middle">Whole diagrams are conjugated by the full isomorphism</text><text x="310" y="950" font-size="25" fill="#172554" text-anchor="middle">R(θ) = α_G θ (α_F)⁻¹</text><text x="310" y="992" font-size="21" fill="#172554" text-anchor="middle">(W_*)₂(b_p,a_q) = (−1)^((q+1)p) K</text><text x="310" y="1035" font-size="18" fill="#172554" text-anchor="middle">p = 1, q = 0 gives −K; strict operators are fixed.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.67.1.1–3.1; Exercises C.67.4.1–2.</text></g></svg>