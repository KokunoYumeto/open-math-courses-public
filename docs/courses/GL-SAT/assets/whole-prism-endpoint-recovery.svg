<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="19" fill="#172554" text-anchor="middle">Recover the whole endpoint comparison with exact cores</text><text x="310" y="78" font-size="18" fill="#172554" text-anchor="middle">C.50.1–2: retain the entire prism bimodule action</text><rect x="25" y="104" width="570" height="304" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="25" fill="#172554" text-anchor="middle">M(y,x) = Hom_prism(x₀,y₁)</text><text x="310" y="198" font-size="19" fill="#172554" text-anchor="middle">B(qx,y) → M(y,x) is a quasi-isomorphism.</text><text x="310" y="249" font-size="18" fill="#172554" text-anchor="middle">Whole A-action + represented evaluation ⇒ F:A→B</text><text x="310" y="300" font-size="22" fill="#172554" text-anchor="middle">All several-cross source words are retained.</text><text x="310" y="346" font-size="17" fill="#172554" text-anchor="middle">Shared faces use actual compatible kernel contractions.</text><text x="310" y="396" font-size="18" fill="#172554" text-anchor="middle">The represented target recovers the original dg B.</text><rect x="25" y="442" width="570" height="324" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="485" font-size="18" fill="#172554" text-anchor="middle">C.50.4.1: normalize the Hom contraction at the unit</text><text x="310" y="539" font-size="21" fill="#172554" text-anchor="middle">e survives;   x → y is the acyclic pair.</text><text x="310" y="591" font-size="27" fill="#172554" text-anchor="middle">H(1_L) = h ≠ 0</text><text x="310" y="643" font-size="26" fill="#172554" text-anchor="middle">Hᵘ = H(1 − IᵘP)</text><text x="310" y="695" font-size="21" fill="#172554" text-anchor="middle">Hᵘ(1_L)=0;   dHᵘ+Hᵘd=1−IᵘP</text><text x="310" y="750" font-size="16" fill="#172554" text-anchor="middle">The same projection is kept; all normalized identities hold.</text><rect x="25" y="805" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="847" font-size="19" fill="#172554" text-anchor="middle">C.50.3: the dg path category fixes the core maps</text><text x="310" y="893" font-size="22" fill="#172554" text-anchor="middle">D(a,b,h) = (δa,δb,−δh+va−bu)</text><text x="310" y="937" font-size="16" fill="#172554" text-anchor="middle">π₀ has a contracted kernel; lift ΩBA relative to its cores.</text><text x="310" y="980" font-size="17" fill="#172554" text-anchor="middle">π₁ gives the replacement with the prescribed qᵢ exactly.</text><text x="310" y="1017" font-size="16" fill="#172554" text-anchor="middle">Common-core coordinate: g^⊗n ⊗ Id, with every cross word.</text><text x="310" y="1070" font-size="15" fill="#172554" text-anchor="middle">Exercise C.50.4.2 checks the essential graded composition sign.</text><text x="310" y="1104" font-size="15" fill="#172554" text-anchor="middle">Product and grafting covariance retain their full marked scope.</text></g></svg>