<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem57; Exercise57", "specific_kernel": "terminal evaluation on full Nat complexes", "relative_condition": "A contains t and every normalized terminal extension of its simplices", "native_transport": "Gamma=Gamma_orig star V; Gamma star V_inverse=Gamma_orig", "parallel_higher_cores": ["R1(y)=f+z", "R2(y)=f+2z"], "relative_obstruction": "triangle boundary edge01 value1 has coboundary1", "full_cone_extension": "face013=2, face023=3, face123=5 force face012=4", "simplex_drawing": "schematic projection of the three terminal cone faces"}</metadata><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">The original prism survives the whole comparison</text><text x="310" y="76" font-size="15" fill="#172554" text-anchor="middle">Terminal evaluation contracts its kernel, with exact relative hypotheses.</text><rect x="18" y="103" width="584" height="233" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="24" fill="#2563eb" text-anchor="middle">e_t : Nat_P(F,G) → O(F_t,G_t)</text><text x="310" y="191" font-size="27" fill="#15803d" text-anchor="middle">δH + Hδ = 1 − se_t</text><text x="310" y="232" font-size="21" fill="#172554" text-anchor="middle">Only ker(e_t) is contracted.</text><text x="310" y="273" font-size="17" fill="#172554" text-anchor="middle">The complete target Hom and original inputs remain.</text><text x="310" y="311" font-size="15" fill="#172554" text-anchor="middle">Relative restriction requires [σ,t] in A whenever σ is in A.</text><rect x="18" y="358" width="584" height="328" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="399" font-size="21" fill="#172554" text-anchor="middle">Different closed cores on parallel parameters</text><text x="310" y="442" font-size="23" fill="#172554" text-anchor="middle">R₁(y) = f + z;     R₂(y) = f + 2z</text><text x="310" y="485" font-size="24" fill="#2563eb" text-anchor="middle">V₁(δ) = R₁;     V₁(α′) = −Z</text><text x="310" y="530" font-size="28" fill="#172554" text-anchor="middle">Γ = Γ_orig ⋆ V</text><text x="310" y="575" font-size="28" fill="#15803d" text-anchor="middle">Γ ⋆ V⁻¹ = Γ_orig</text><text x="310" y="619" font-size="16" fill="#172554" text-anchor="middle">Every original higher prism core is recoverable exactly.</text><text x="310" y="659" font-size="20" fill="#b91c1c" text-anchor="middle">Deleting the z-part leaves the defect −Z.</text><rect x="18" y="708" width="584" height="308" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="745" font-size="21" fill="#172554" text-anchor="middle">The terminal vertex and the whole cone differ</text><text x="165" y="783" font-size="17" fill="#b91c1c" text-anchor="middle">Boundary contains vertex 2</text><path d="M72,821 L258,821 L165,929 Z" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="60" y="825" font-size="20" fill="#172554" text-anchor="middle">0</text><text x="270" y="825" font-size="20" fill="#172554" text-anchor="middle">1</text><text x="165" y="956" font-size="20" fill="#b91c1c" text-anchor="middle">2</text><text x="165" y="811" font-size="17" fill="#172554" text-anchor="middle">φ(01)=1</text><text x="93" y="881" font-size="18" fill="#172554" text-anchor="middle">0</text><text x="237" y="881" font-size="18" fill="#172554" text-anchor="middle">0</text><text x="165" y="874" font-size="15" fill="#b91c1c" text-anchor="middle">No face012</text><text x="165" y="996" font-size="21" fill="#b91c1c" text-anchor="middle">δφ(012)=1</text><text x="463" y="783" font-size="17" fill="#15803d" text-anchor="middle">Three given cone faces</text><path d="M459,812 L350,928 L566,928 Z" fill="#f0fdf4" stroke="#2563eb" stroke-width="2"/><path d="M459,812 L460,871 L350,928 M460,871 L566,928" fill="none" stroke="#15803d" stroke-width="2"/><text x="459" y="807" font-size="18" fill="#172554" text-anchor="middle">0</text><text x="338" y="939" font-size="18" fill="#172554" text-anchor="middle">1</text><text x="578" y="939" font-size="18" fill="#172554" text-anchor="middle">2</text><circle cx="460" cy="871" r="11" fill="white" stroke="#15803d" stroke-width="2"/><text x="460" y="877" font-size="17" fill="#15803d" text-anchor="middle">3</text><text x="408" y="867" font-size="21" fill="#15803d" text-anchor="middle">2</text><text x="512" y="867" font-size="21" fill="#15803d" text-anchor="middle">3</text><text x="460" y="916" font-size="21" fill="#15803d" text-anchor="middle">5</text><text x="463" y="973" font-size="21" fill="#15803d" text-anchor="middle">φ(012)=5−3+2=4</text><text x="463" y="998" font-size="14" fill="#172554" text-anchor="middle">Schematic terminal cone</text><text x="310" y="1043" font-size="11" fill="#172554" text-anchor="middle">Specific evaluation kernel and exact native-prism transport: Theorem 57.</text><text x="310" y="1075" font-size="11" fill="#172554" text-anchor="middle">Parallel closed cores and the relative boundary obstruction: Exercise 57.</text><text x="310" y="1107" font-size="11" fill="#172554" text-anchor="middle">Original endpoint cones: Theorems 22, 38; required full cone words: (57.2).</text></g></svg>