<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Finite tensor coherence: matrices, trees and degrees</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">Characteristic-zero k; all displayed maps retain their data.</text><rect x="25" y="101" width="570" height="241" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="18" fill="#172554" text-anchor="middle">1. Degree-zero matrices are coefficients, not letters</text><text x="310" y="190" font-size="20" fill="#172554" text-anchor="middle">S = ∏λ Mdλ(k);  e = Σλ (1/dλ) Σij eij ⊗ eji</text><text x="310" y="232" font-size="19" fill="#172554" text-anchor="middle">Two-sided averaging fixes the unit; C.30.1.1.</text><text x="310" y="275" font-size="17" fill="#172554" text-anchor="middle">Positive bar letters: |sM| ≥ 1, so length ≤ degree.</text><text x="310" y="317" font-size="17" fill="#172554" text-anchor="middle">All verified operations descend together; C.30.3.1.</text><rect x="25" y="368" width="570" height="391" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="408" font-size="20" fill="#172554" text-anchor="middle">2. T₃ retains both contractions to the corolla</text><text x="75" y="445" font-size="18" fill="#172554" text-anchor="middle">1</text><text x="135" y="445" font-size="18" fill="#172554" text-anchor="middle">2</text><text x="215" y="445" font-size="18" fill="#172554" text-anchor="middle">3</text><text x="405" y="445" font-size="18" fill="#172554" text-anchor="middle">1</text><text x="465" y="445" font-size="18" fill="#172554" text-anchor="middle">2</text><text x="525" y="445" font-size="18" fill="#172554" text-anchor="middle">3</text><line x1="75" y1="458" x2="105" y2="503" stroke="#24415a" stroke-width="3"/><line x1="135" y1="458" x2="105" y2="503" stroke="#24415a" stroke-width="3"/><line x1="105" y1="503" x2="165" y2="553" stroke="#ea580c" stroke-width="5"/><line x1="215" y1="458" x2="165" y2="553" stroke="#24415a" stroke-width="3"/><line x1="165" y1="553" x2="165" y2="570" stroke="#24415a" stroke-width="3"/><circle cx="105" cy="503" r="5" fill="#24415a"/><circle cx="165" cy="553" r="5" fill="#24415a"/><line x1="465" y1="458" x2="495" y2="503" stroke="#24415a" stroke-width="3"/><line x1="525" y1="458" x2="495" y2="503" stroke="#24415a" stroke-width="3"/><line x1="495" y1="503" x2="445" y2="553" stroke="#ea580c" stroke-width="5"/><line x1="405" y1="458" x2="445" y2="553" stroke="#24415a" stroke-width="3"/><line x1="445" y1="553" x2="445" y2="570" stroke="#24415a" stroke-width="3"/><circle cx="495" cy="503" r="5" fill="#24415a"/><circle cx="445" cy="553" r="5" fill="#24415a"/><text x="165" y="598" font-size="19" fill="#172554" text-anchor="middle">a = ((12)3)</text><text x="445" y="598" font-size="19" fill="#172554" text-anchor="middle">b = (1(23))</text><line x1="215" y1="560" x2="280" y2="627" stroke="#2563eb" stroke-width="3"/><path d="M273,612 L280,627 L291,619" fill="none" stroke="#2563eb" stroke-width="3"/><line x1="405" y1="560" x2="340" y2="627" stroke="#2563eb" stroke-width="3"/><path d="M333,612 L340,627 L351,619" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="596" font-size="16" fill="#172554" text-anchor="middle">contract</text><text x="260" y="652" font-size="18" fill="#172554" text-anchor="middle">1</text><text x="310" y="652" font-size="18" fill="#172554" text-anchor="middle">2</text><text x="360" y="652" font-size="18" fill="#172554" text-anchor="middle">3</text><line x1="260" y1="664" x2="310" y2="708" stroke="#24415a" stroke-width="3"/><line x1="310" y1="664" x2="310" y2="708" stroke="#24415a" stroke-width="3"/><line x1="360" y1="664" x2="310" y2="708" stroke="#24415a" stroke-width="3"/><circle cx="310" cy="708" r="5" fill="#24415a"/><line x1="310" y1="708" x2="310" y2="721" stroke="#24415a" stroke-width="3"/><text x="310" y="744" font-size="18" fill="#172554" text-anchor="middle">c = (123);  resolution: 0 → k² → k⁵ → k³ → 0</text><rect x="25" y="790" width="570" height="223" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="830" font-size="17" fill="#172554" text-anchor="middle">3. Retain the output suspension in the profile bound</text><text x="310" y="876" font-size="24" fill="#172554" text-anchor="middle">d = w+h−q+ε;   0 ≤ q ≤ H = n−2</text><text x="310" y="919" font-size="24" fill="#172554" text-anchor="middle">w ≤ D+H−h−ε;   ε = 0 or 1</text><text x="310" y="961" font-size="15" fill="#172554" text-anchor="middle">w: summed suspended input degree; d: ordinary output degree.</text><text x="310" y="997" font-size="16" fill="#172554" text-anchor="middle">Finite tree resolution and positive profiles; C.31.1–C.31.3.</text><text x="310" y="1050" font-size="17" fill="#172554" text-anchor="middle">Orange edges are the actual contracted internal edges.</text><text x="310" y="1084" font-size="15" fill="#172554" text-anchor="middle">The full geometric coordinate-group presentation remains required.</text><text x="310" y="1110" font-size="16" fill="#172554" text-anchor="middle">No full tensor descent follows merely from these finite bounds.</text></g></svg>