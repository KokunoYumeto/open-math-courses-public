<svg xmlns="http://www.w3.org/2000/svg" width="620" height="920" viewBox="0 0 620 920">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a} .small{fill:#475569}</style>
<text x="310" y="45" font-size="28" text-anchor="middle">Clearing a derived attaching map</text>
<text x="310" y="80" font-size="22" text-anchor="middle">α : B_E → A_E[1],     a_E = πᵐα</text>
<rect x="28" y="110" width="564" height="418" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="151" font-size="21" text-anchor="middle">Exact square in the rational category</text>
<text x="115" y="228" font-size="29" text-anchor="middle">B_E</text>
<text x="477" y="228" font-size="29" text-anchor="middle">A_E[1]</text>
<text x="115" y="420" font-size="29" text-anchor="middle">B_E</text>
<text x="477" y="420" font-size="29" text-anchor="middle">A_E[1]</text>
<path d="M170,216 L400,216" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M170,408 L400,408" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M115,258 L115,373" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M477,258 L477,373" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285" y="201" font-size="26" text-anchor="middle">α</text>
<text x="285" y="452" font-size="23" text-anchor="middle">a_E = πᵐα</text>
<text x="144" y="326" font-size="22" text-anchor="start">id</text>
<text x="420" y="326" font-size="25" text-anchor="start">πᵐ</text>
<text x="310" y="493" font-size="18" text-anchor="middle">Both vertical maps are invertible over E.</text>
<rect x="28" y="553" width="564" height="246" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="598" font-size="21" text-anchor="middle">Apply enhanced cofibres and shift by −1</text>
<text x="310" y="643" font-size="25" text-anchor="middle">F = Cone(α)[−1]</text>
<text x="310" y="686" font-size="25" text-anchor="middle">F_O = Cone(a)[−1]</text>
<text x="310" y="735" font-size="28" text-anchor="middle" style="fill:#15803d">F_O ⊗_O E ≅ F</text>
<text x="310" y="775" font-size="18" text-anchor="middle">Finite integral cones remain constructible.</text>
<text x="310" y="837" font-size="20" text-anchor="middle">One denominator exponent m ≥ 0 suffices.</text>
<text x="310" y="872" font-size="18" text-anchor="middle">Integral models may have different torsion.</text>
<text x="310" y="905" font-size="17" text-anchor="middle">Lemma N.4.2.1 and Exercise N.5.3</text>
</svg>