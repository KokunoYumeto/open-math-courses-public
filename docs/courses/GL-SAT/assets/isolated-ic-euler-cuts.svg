<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="43" font-size="27" text-anchor="middle">The Euler cone gives the two IC cuts</text>
<text x="310" y="83" font-size="23" text-anchor="middle">n = dim Y,   d = n+1,   e = c₁(L)</text>
<rect x="28" y="112" width="564" height="172" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="155" font-size="21" text-anchor="middle">C = Cone(RΓ(Y,E(−1))[−2] → RΓ(Y,E))</text>
<text x="310" y="195" font-size="18" text-anchor="middle">Even s: coker[H^(s−2)(Y,E(−1)) → H^s(Y,E)]</text>
<text x="310" y="234" font-size="18" text-anchor="middle">Odd s: ker[H^(s−1)(Y,E(−1)) → H^(s+1)(Y,E)]</text>
<text x="310" y="267" font-size="19" text-anchor="middle">Actual proper vertex comparison fixes this cone.</text>
<path d="M310,299 L310,340" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="354" width="564" height="138" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="395" font-size="23" text-anchor="middle">Lefschetz: e injective below n,</text>
<text x="310" y="432" font-size="23" text-anchor="middle">surjective from degree n−1 onward.</text>
<text x="310" y="473" font-size="18" text-anchor="middle">Odd H^s(C)=0 for s≤n; even H^s(C)=0 for s≥n+1.</text>
<path d="M310,508 L310,548" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="562" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="604" font-size="25" text-anchor="middle">Stalk K₀ = τ_≤−1(C[d])</text>
<text x="310" y="645" font-size="23" text-anchor="middle">r&lt;0: index s=r+d≤n</text>
<text x="310" y="683" font-size="21" text-anchor="middle">r opposite to d ⇒ s odd ⇒ H^r(K₀)=0.</text>
<text x="310" y="725" font-size="20" text-anchor="middle">All stalk degrees r≥0 vanish by truncation.</text>
<path d="M310,766 L310,808" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="822" width="564" height="150" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="863" font-size="24" text-anchor="middle">Costalk K! = (τ_≥0(C[d]))[−1]</text>
<text x="310" y="902" font-size="22" text-anchor="middle">r&gt;0: index s=r−1+d≥n+1</text>
<text x="310" y="940" font-size="20" text-anchor="middle">r opposite to d ⇒ s even ⇒ H^r(K!)=0.</text>
<text x="310" y="962" font-size="18" text-anchor="middle">All costalk degrees r≤0 vanish.</text>
<text x="310" y="1021" font-size="20" text-anchor="middle">Theorem A.3.1.1 and Exercise A.4.4</text>
</svg>