<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The actual coefficient proof of affine exactness</text>
<text x="310" y="84" font-size="18" text-anchor="middle">Geometric κ; ℓ invertible; finite E/Q_ℓ; O,π,F=O/π</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="18" text-anchor="middle">K upper perverse over E has a global model L.</text>
<text x="310" y="198" font-size="23" text-anchor="middle">Integral gluing makes L upper.</text>
<text x="310" y="237" font-size="22" text-anchor="middle">Cone of π:L→L is L₁; L₁ is upper.</text>
<text x="310" y="276" font-size="19" text-anchor="middle">The derived reduction retains its Tor degree.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="17" text-anchor="middle">Finite affine support: dim Supp R^qf_*H ≤ d−q.</text>
<text x="310" y="443" font-size="21" text-anchor="middle">For H=H^b(L₁), d≤−b and n=q+b.</text>
<text x="310" y="482" font-size="20" text-anchor="middle">Therefore dim Supp H^n(Rf_*L₁)≤−n.</text>
<text x="310" y="521" font-size="19" text-anchor="middle">The stalk uses the strict localization of Y.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="18" text-anchor="middle">M=Rf_*L constructible; take n&gt;−dim cl{y}.</text>
<text x="310" y="688" font-size="21" text-anchor="middle">H^n(M_y)/π ↪ H^n((M₁)_y)=0.</text>
<text x="310" y="727" font-size="18" text-anchor="middle">Finite O stalks ⇒ Nakayama ⇒ H^n(M_y)=0.</text>
<text x="310" y="766" font-size="23" text-anchor="middle">Actual M[1/π]=Rf_*K is upper.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="17" text-anchor="middle">Field duality makes Rf_! preserve the lower part.</text>
<text x="310" y="933" font-size="17" text-anchor="middle">For affine open j, adjunction gives both halves.</text>
<text x="310" y="972" font-size="25" text-anchor="middle">j_! and Rj_* are perverse t-exact.</text>
<text x="310" y="1011" font-size="21" text-anchor="middle">For N-jet atlases use q†=q*[r](r/2).</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Proposition N.1.1.1; Theorems N.2.1.1–N.3.1.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Exactness preserves perverse degree; it does not force cleanness.</text>
</svg>