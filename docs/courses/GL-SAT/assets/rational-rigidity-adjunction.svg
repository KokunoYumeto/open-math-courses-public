<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="26" text-anchor="middle">The actual adjunction gives both triangles</text>
<text x="310" y="82" font-size="23" text-anchor="middle">VQ = I(DQ),   1 = the unit point sheaf</text>
<rect x="28" y="111" width="564" height="178" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="152" font-size="23" text-anchor="middle">Proper unit fiber and structural trace</text>
<text x="310" y="194" font-size="28" text-anchor="middle">Hom(P*Q,1) = Hom(P,VQ)</text>
<text x="310" y="236" font-size="24" text-anchor="middle">Coefficient on the fiber: P ⊗ I(Q)</text>
<text x="310" y="274" font-size="19" text-anchor="middle">Coherent chart comparisons retain the evaluation.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="176" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="27" text-anchor="middle">Hom(A*Q,C) = Hom(A,C*VQ)</text>
<text x="310" y="439" font-size="28" text-anchor="middle">ev : VQ*Q → 1</text>
<text x="310" y="479" font-size="28" text-anchor="middle">coev : 1 → Q*VQ</text>
<text x="310" y="516" font-size="19" text-anchor="middle">Identity maps fix the adjunction normalization.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="640" font-size="21" text-anchor="middle">Projection and the same composed counits:</text>
<text x="310" y="683" font-size="29" text-anchor="middle">η_A = 1_A*coev</text>
<text x="310" y="724" font-size="29" text-anchor="middle">ε_C = 1_C*ev</text>
<text x="310" y="761" font-size="18" text-anchor="middle">The extra modification keeps its coefficient factor.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="25" text-anchor="middle">Q → Q*VQ*Q → Q is 1_Q.</text>
<text x="310" y="929" font-size="23" text-anchor="middle">VQ → VQ*Q*VQ → VQ is 1_VQ.</text>
<text x="310" y="968" font-size="17" text-anchor="middle">The maps use coev then ev, with the proved associator.</text>
<text x="310" y="1002" font-size="18" text-anchor="middle">Left convolution gives the two left triangles too.</text>
<text x="310" y="1057" font-size="23" text-anchor="middle">Rank-two vector example:</text>
<text x="310" y="1095" font-size="19" text-anchor="middle">Both triangles are identities; the closed trace is 2.</text>
<text x="310" y="1140" font-size="19" text-anchor="middle">Lemmas B.3.1.1–B.4.1.1; Theorem B.5.1.1</text>
</svg>