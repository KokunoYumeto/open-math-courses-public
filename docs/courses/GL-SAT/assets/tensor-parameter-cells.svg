<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">Full tensor parameters and relative coherent cells</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">C.74: ordinary units, complete boundaries and actual kernels</text><rect x="25" y="105" width="570" height="260" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="147" font-size="23" fill="#172554" text-anchor="middle">z = t(s1 ⊗ sa) = 0,     a = E(y,e)</text><text x="310" y="191" font-size="20" fill="#172554" text-anchor="middle">The full tensor coproduct has both cuts:</text><text x="310" y="234" font-size="25" fill="#172554" text-anchor="middle">(s1 ⊗ 1) ⊗ (1 ⊗ sa)</text><text x="310" y="277" font-size="25" fill="#172554" text-anchor="middle">−(1 ⊗ sa) ⊗ (s1 ⊗ 1)</text><text x="310" y="324" font-size="24" fill="#172554" text-anchor="middle">Dz = t(1 ⊗ sa) − t(1 ⊗ sa) = 0</text><rect x="25" y="405" width="570" height="355" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="447" font-size="20" fill="#172554" text-anchor="middle">A coherent square retains every boundary face</text><rect x="165" y="505" width="290" height="160" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/><text x="310" y="488" font-size="18" fill="#15803d" text-anchor="middle">given top face</text><text x="310" y="697" font-size="18" fill="#15803d" text-anchor="middle">given bottom face</text><text x="147" y="578" font-size="16" fill="#15803d" text-anchor="end">given</text><text x="147" y="602" font-size="16" fill="#15803d" text-anchor="end">left</text><text x="473" y="578" font-size="16" fill="#15803d" text-anchor="start">given</text><text x="473" y="602" font-size="16" fill="#15803d" text-anchor="start">right</text><text x="310" y="561" font-size="20" fill="#15803d" text-anchor="middle">interior kernel</text><text x="310" y="603" font-size="29" fill="#15803d" text-anchor="middle">N[−2]</text><text x="310" y="646" font-size="19" fill="#15803d" text-anchor="middle">contracted by h(N)</text><text x="310" y="739" font-size="16" fill="#172554" text-anchor="middle">A supplied whole boundary extends relative to parameter faces.</text><rect x="25" y="800" width="570" height="255" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="841" font-size="21" fill="#172554" text-anchor="middle">An actual path retains its third coordinate</text><text x="310" y="883" font-size="21" fill="#172554" text-anchor="middle">b = Z(e,e),     c = S + Z(f,y),     dc = b</text><text x="310" y="925" font-size="24" fill="#172554" text-anchor="middle">x ↦ (b, 0, c),     D(b,0,c) = 0</text><text x="310" y="968" font-size="26" fill="#7c3aed" text-anchor="middle">D(0,0,−c) = (0,0,b)</text><text x="310" y="1010" font-size="17" fill="#172554" text-anchor="middle">The regraded path kernel contraction has sign −h(N).</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.74.1.1–2.1; Exercises C.74.3.1–2.</text></g></svg>