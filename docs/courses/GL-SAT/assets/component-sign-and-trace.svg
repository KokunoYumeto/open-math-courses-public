<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="22" text-anchor="middle">The component sign gives ordinary vector symmetry</text>
<text x="310" y="82" font-size="27" text-anchor="middle">p([λ]) = 〈2ρ,λ〉 mod 2</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="22" text-anchor="middle">〈2ρ,α_i∨〉 = 2 for each simple coroot.</text>
<text x="310" y="195" font-size="24" text-anchor="middle">Thus p is defined on X_*(T)/ZΦ∨.</text>
<text x="310" y="237" font-size="24" text-anchor="middle">Weight ν occurs in degree 〈2ρ,ν〉.</text>
<text x="310" y="275" font-size="19" text-anchor="middle">On component c: every degree r ≡ p(c) mod 2.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="20" text-anchor="middle">Point exchange gives the graded constraint c′.</text>
<text x="310" y="440" font-size="27" text-anchor="middle">H(c′)(x⊗y) = (−1)^(ij) y⊗x</text>
<text x="310" y="482" font-size="22" text-anchor="middle">For nonzero homogeneous tensors:</text>
<text x="310" y="518" font-size="24" text-anchor="middle">i ≡ p(P),   j ≡ p(Q) mod 2.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="28" text-anchor="middle">c = (−1)^(p(P)p(Q)) c′</text>
<text x="310" y="683" font-size="19" text-anchor="middle">The two signs cancel; H(c) is the ordinary flip.</text>
<text x="310" y="725" font-size="24" text-anchor="middle">Bilinearity retains both hexagons.</text>
<text x="310" y="761" font-size="23" text-anchor="middle">The unit has parity zero and sign +1.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="21" text-anchor="middle">Actual evaluation and coevaluation trace:</text>
<text x="310" y="927" font-size="24" text-anchor="middle">dim_c′ P = Σ_r (−1)^r dim H^r(P)</text>
<text x="310" y="968" font-size="29" text-anchor="middle">dim_c P = dim H(P)</text>
<text x="310" y="1001" font-size="18" text-anchor="middle">An odd nonzero object has negative naive dimension.</text>
<text x="310" y="1058" font-size="22" text-anchor="middle">Raw minuscule P on P¹:   −2 becomes +2.</text>
<text x="310" y="1098" font-size="20" text-anchor="middle">The raw dual is P(1); its Tate line is retained.</text>
<text x="310" y="1140" font-size="17" text-anchor="middle">Lemma A.4.1.1; Theorem A.4.2.1; Exercises A.5.2–A.5.3</text>
</svg>