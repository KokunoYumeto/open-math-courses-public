<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Horizontal composition keeps its higher mixed term</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.69: complete marked evaluation and substitution</text><rect x="25" y="105" width="570" height="300" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="21" fill="#172554" text-anchor="middle">The same full evaluation in either order</text><text x="310" y="200" font-size="21" fill="#172554" text-anchor="middle">outer marks ⊗ inner marks ⊗ source word</text><path d="M310,218 L310,260 M304.0,247.0 L310,260 L316.0,247.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="296" font-size="24" fill="#172554" text-anchor="middle">M = entire horizontal substitution</text><text x="310" y="341" font-size="25" fill="#172554" text-anchor="middle">ev (M ⊗ 1) = ev (1 ⊗ ev)</text><text x="310" y="381" font-size="17" fill="#172554" text-anchor="middle">L source letters and r + s marks give ≤ L + r + s letters.</text><rect x="25" y="445" width="570" height="345" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="487" font-size="20" fill="#172554" text-anchor="middle">The two whiskering products differ by a boundary</text><text x="310" y="535" font-size="24" fill="#172554" text-anchor="middle">G₀(c) = 1,     G₁(c) = 1 − L</text><text x="310" y="579" font-size="23" fill="#172554" text-anchor="middle">η₀ = 1,     η₁(c) = K,     ∂K = L</text><text x="310" y="630" font-size="22" fill="#172554" text-anchor="middle">(ηF₁)(G₀θ) − (G₁θ)(ηF₀) = dK</text><text x="125" y="700" font-size="27" fill="#172554" text-anchor="middle">e⁰</text><text x="500" y="700" font-size="27" fill="#172554" text-anchor="middle">y⁰</text><text x="310" y="757" font-size="27" fill="#172554" text-anchor="middle">f⁻¹</text><path d="M160,692 L460,692 M447.0,698.0 L460,692 L447.0,686.0" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="310" y="676" font-size="19" fill="#7c3aed" text-anchor="middle">L = ∂K</text><path d="M160,718 L275,741 M261.0757544051889,744.3339742973491 L275,741 L263.42914802684714,732.5670061890581" fill="none" stroke="#2563eb" stroke-width="3"/><text x="203" y="758" font-size="20" fill="#2563eb" text-anchor="middle">K</text><path d="M345,741 L460,718 M448.42914802684714,726.4329938109419 L460,718 L446.0757544051889,714.6660257026509" fill="none" stroke="#15803d" stroke-width="3"/><text x="420" y="758" font-size="20" fill="#15803d" text-anchor="middle">d</text><rect x="25" y="830" width="570" height="235" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="871" font-size="20" fill="#172554" text-anchor="middle">Nonminimal inputs and nonlinear model changes</text><text x="310" y="918" font-size="22" fill="#172554" text-anchor="middle">da = b;   η₁(a) = 0,   η₁(b) = −K</text><text x="310" y="961" font-size="23" fill="#172554" text-anchor="middle">(dη)₁(a) = K + (−K) = 0</text><text x="310" y="1004" font-size="23" fill="#7c3aed" text-anchor="middle">(w_*)₂(E(e,f), E(y,e))₀ = −1</text><text x="310" y="1045" font-size="18" fill="#172554" text-anchor="middle">Ordinary identity outputs remain actual bar letters.</text><text x="310" y="1102" font-size="14" fill="#172554" text-anchor="middle">Theorems C.69.1.1–2.1; Lemma C.69.3.1; Exercises C.69.4.1–2.</text></g></svg>