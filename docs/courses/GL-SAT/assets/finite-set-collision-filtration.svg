<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1200" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="37" font-size="26" fill="#172554" text-anchor="middle">Five labels, three collision blocks</text><text x="310" y="75" font-size="20" fill="#172554" text-anchor="middle">π={1,3}|{2,4}|{5}; r=5, b=3, c=2</text><rect x="26" y="103" width="568" height="235" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="137" font-size="20" fill="#172554" text-anchor="middle">Ordered modifications retain their labels</text><circle cx="78" cy="209" r="19" fill="#2563eb"/><text x="78" y="215" font-size="18" fill="white" text-anchor="middle">1</text><text x="78" y="254" font-size="24" fill="#172554" text-anchor="middle">a</text><circle cx="194" cy="209" r="19" fill="#7c3aed"/><text x="194" y="215" font-size="18" fill="white" text-anchor="middle">2</text><text x="194" y="254" font-size="24" fill="#172554" text-anchor="middle">b</text><circle cx="310" cy="209" r="19" fill="#2563eb"/><text x="310" y="215" font-size="18" fill="white" text-anchor="middle">3</text><text x="310" y="254" font-size="24" fill="#172554" text-anchor="middle">a</text><circle cx="426" cy="209" r="19" fill="#7c3aed"/><text x="426" y="215" font-size="18" fill="white" text-anchor="middle">4</text><text x="426" y="254" font-size="24" fill="#172554" text-anchor="middle">b</text><circle cx="542" cy="209" r="19" fill="#15803d"/><text x="542" y="215" font-size="18" fill="white" text-anchor="middle">5</text><text x="542" y="254" font-size="24" fill="#172554" text-anchor="middle">c</text><path d="M78,188 Q194,146 310,188" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M194,188 Q310,160 426,188" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="310" y="303" font-size="18" fill="#172554" text-anchor="middle">x₁=x₃=a; x₂=x₄=b; x₅=c; a,b,c distinct</text><path d="M310,350 L310,389" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="26" y="405" width="568" height="168" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="441" font-size="22" fill="#172554" text-anchor="middle">Independent block endpoints</text><circle cx="125" cy="484" r="19" fill="#2563eb"/><text x="125" y="490" font-size="18" fill="white" text-anchor="middle">a</text><circle cx="310" cy="484" r="19" fill="#7c3aed"/><text x="310" y="490" font-size="18" fill="white" text-anchor="middle">b</text><circle cx="495" cy="484" r="19" fill="#15803d"/><text x="495" y="490" font-size="18" fill="white" text-anchor="middle">c</text><text x="125" y="530" font-size="23" fill="#172554" text-anchor="middle">P₁*P₃</text><text x="310" y="530" font-size="23" fill="#172554" text-anchor="middle">P₂*P₄</text><text x="495" y="530" font-size="23" fill="#172554" text-anchor="middle">P₅</text><rect x="26" y="610" width="568" height="210" rx="18" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="649" font-size="22" fill="#172554" text-anchor="middle">Stratum dimension s=Σdν+3</text><text x="310" y="691" font-size="17" fill="#172554" text-anchor="middle">Ordinary perverse degrees ≤−2; exceptional ≥2</text><text x="310" y="735" font-size="22" fill="#172554" text-anchor="middle">iπ*F₅[−2]=F₃(R₁,R₂,R₃)</text><text x="310" y="779" font-size="20" fill="#172554" text-anchor="middle">iπ!F₅[2]=F₃(R₁,R₂,R₃)(−2)</text><path d="M310,831 L310,868" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="26" y="882" width="568" height="214" rx="18" fill="white" stroke="#d97706" stroke-width="2"/><text x="310" y="922" font-size="20" fill="#172554" text-anchor="middle">Merge further: a=b; θ={1,2,3,4}|{5}</text><text x="310" y="966" font-size="18" fill="#172554" text-anchor="middle">r=5, b=2, c=3; one extra collision equation</text><text x="310" y="1009" font-size="21" fill="#172554" text-anchor="middle">Ordinary shifts: [−2]+[−1]=[−3]</text><text x="310" y="1050" font-size="20" fill="#172554" text-anchor="middle">Exceptional twists: (−2)+(−1)=(−3)</text><text x="310" y="1140" font-size="16" fill="#172554" text-anchor="middle">Theorems C.2.1.1–C.3.1.1, C.6.1.1; Exercise C.7.1.</text><text x="310" y="1174" font-size="15" fill="#172554" text-anchor="middle">A labeled endpoint schematic; no geometric point replaces its scheme.</text></g></svg>