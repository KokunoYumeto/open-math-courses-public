<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Typed kernels retain the actual intermediate cores</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.66: changing arities and a specific acyclic kernel</text><rect x="25" y="105" width="570" height="340" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="21" fill="#172554" text-anchor="middle">Original state path and frontier arities</text><text x="70" y="225" font-size="25" fill="#172554" text-anchor="middle">s₀</text><text x="70" y="261" font-size="17" fill="#172554" text-anchor="middle">arity 0</text><text x="230" y="225" font-size="25" fill="#172554" text-anchor="middle">s₁</text><text x="230" y="261" font-size="17" fill="#172554" text-anchor="middle">arity 2</text><text x="390" y="225" font-size="25" fill="#172554" text-anchor="middle">s₂</text><text x="390" y="261" font-size="17" fill="#172554" text-anchor="middle">arity 1</text><text x="550" y="225" font-size="25" fill="#172554" text-anchor="middle">s₃</text><text x="550" y="261" font-size="17" fill="#172554" text-anchor="middle">arity 0</text><path d="M97,217 L203,217 M190.0,223.0 L203,217 L190.0,211.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="150.0" y="201" font-size="19" fill="#172554" text-anchor="middle">M₁</text><path d="M257,217 L363,217 M350.0,223.0 L363,217 L350.0,211.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310.0" y="201" font-size="19" fill="#172554" text-anchor="middle">M₂</text><path d="M417,217 L523,217 M510.0,223.0 L523,217 L510.0,211.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="470.0" y="201" font-size="19" fill="#172554" text-anchor="middle">M₃</text><text x="310" y="285" font-size="14" fill="#172554" text-anchor="middle">Mᵢ is the kernel with central complex Nᵢ.</text><text x="310" y="310" font-size="21" fill="#172554" text-anchor="middle">C⁰ ⊗ N₃ ⊗ C¹ ⊗ N₂ ⊗ C² ⊗ N₁ ⊗ C⁰</text><text x="310" y="353" font-size="18" fill="#172554" text-anchor="middle">Ordinary path dimension 216; retract dimension 8.</text><text x="310" y="392" font-size="17" fill="#172554" text-anchor="middle">Both middle cores and three cross suspensions remain.</text><text x="310" y="430" font-size="17" fill="#172554" text-anchor="middle">s₀ and s₃ keep distinct colors at equal arity zero.</text><rect x="25" y="485" width="570" height="340" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="527" font-size="20" fill="#172554" text-anchor="middle">A full Nat-projection kernel needs two corrections</text><text x="150" y="577" font-size="25" fill="#172554" text-anchor="middle">a₀</text><text x="470" y="577" font-size="25" fill="#172554" text-anchor="middle">b₁</text><text x="150" y="637" font-size="25" fill="#172554" text-anchor="middle">c₁</text><text x="470" y="637" font-size="25" fill="#172554" text-anchor="middle">d₂</text><text x="150" y="697" font-size="25" fill="#172554" text-anchor="middle">e₂</text><text x="470" y="697" font-size="25" fill="#172554" text-anchor="middle">f₃</text><path d="M180,568 L438,568 M425.0,574.0 L438,568 L425.0,562.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M180,628 L438,628 M425.0,634.0 L438,628 L425.0,622.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M180,688 L438,688 M425.0,694.0 L438,688 L425.0,682.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="555" font-size="17" fill="#2563eb" text-anchor="middle">d</text><text x="310" y="615" font-size="17" fill="#2563eb" text-anchor="middle">d</text><text x="310" y="675" font-size="17" fill="#2563eb" text-anchor="middle">d</text><path d="M180,580 L438,619 M424.24923964128425,622.9895600706307 L438,619 L426.04281707937764,611.124355480167" fill="none" stroke="#7c3aed" stroke-width="3"/><path d="M180,640 L438,679 M424.24923964128425,682.9895600706307 L438,679 L426.04281707937764,671.124355480167" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="310" y="597" font-size="15" fill="#7c3aed" text-anchor="middle">G(ε)</text><text x="310" y="657" font-size="15" fill="#7c3aed" text-anchor="middle">G(ε)</text><text x="310" y="740" font-size="21" fill="#172554" text-anchor="middle">Primitive of x ↦ b₁:   a₀, −c₁, +e₂</text><text x="310" y="773" font-size="18" fill="#172554" text-anchor="middle">at Taylor lengths q = 0, 1, 2</text><text x="310" y="810" font-size="20" fill="#b91c1c" text-anchor="middle">Omit q = 2: residual −f₃ remains.</text><rect x="25" y="865" width="570" height="190" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="909" font-size="20" fill="#172554" text-anchor="middle">The specified projection kernel is contractible</text><text x="310" y="956" font-size="22" fill="#172554" text-anchor="middle">H = H₀ (1 + δH₀)⁻¹; finite on each input</text><text x="310" y="1003" font-size="18" fill="#172554" text-anchor="middle">The full Nat quotient has L + 1 cohomology classes</text><text x="310" y="1039" font-size="18" fill="#172554" text-anchor="middle">on Taylor lengths 0,…,L; those classes remain.</text><text x="310" y="1102" font-size="14" fill="#172554" text-anchor="middle">Lemma C.66.1.1; Theorems C.66.2.1–3.1; Exercises C.66.4.1–2.</text></g></svg>