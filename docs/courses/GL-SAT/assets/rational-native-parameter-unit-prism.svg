<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem56; Exercise56", "section": "pj=1_D; j is a normalized unital A-infinity section", "whole_unit": "u:1_T -&gt; jp; p*u=1_p; uj=1_j", "full_family": "U_P=(Theta_hat_* u) kappa_P : F_P -&gt; Ld", "finite_section_second_core": "j2(b1,a0)=-M", "finite_unit_first_core": "u1(sBA)=M", "path_coordinate": "c_delta=-M", "recorded_delta_R_core": "-R1 tensor R2", "unconverted_twist_defect_on_sM": "2M"}</metadata><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">The whole parameter unit keeps its mixed core</text><text x="310" y="76" font-size="16" fill="#172554" text-anchor="middle">Identity object maps can have nonzero higher section values.</text><rect x="18" y="103" width="584" height="270" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="22" fill="#172554" text-anchor="middle">A normalized section of the actual p : T → D</text><text x="310" y="192" font-size="27" fill="#2563eb" text-anchor="middle">j : D → T;     pj = 1_D</text><text x="310" y="239" font-size="29" fill="#15803d" text-anchor="middle">u : 1_T ⇒ jp</text><text x="310" y="283" font-size="25" fill="#172554" text-anchor="middle">p_*u = 1_p;     uj = 1_j</text><text x="310" y="326" font-size="18" fill="#172554" text-anchor="middle">j and u include all their higher components.</text><text x="310" y="353" font-size="16" fill="#172554" text-anchor="middle">This is a whole unit prism, with its exact inverse.</text><rect x="18" y="395" width="584" height="245" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="436" font-size="23" fill="#172554" text-anchor="middle">Transport the complete section family</text><text x="310" y="482" font-size="28" fill="#2563eb" text-anchor="middle">U_P : F_P → Ld</text><text x="310" y="529" font-size="27" fill="#15803d" text-anchor="middle">U_P = (Θ̂_* u) κ_P</text><text x="310" y="575" font-size="24" fill="#172554" text-anchor="middle">κ_P = ξ_P ι_P;     pκ_P = d</text><text x="310" y="615" font-size="18" fill="#172554" text-anchor="middle">All mixed parameter and section cores remain.</text><rect x="18" y="662" width="584" height="348" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="704" font-size="23" fill="#172554" text-anchor="middle">The actual unsafe-triangle example</text><text x="310" y="747" font-size="27" fill="#172554" text-anchor="middle">DM = AB − BA</text><text x="310" y="790" font-size="23" fill="#15803d" text-anchor="middle">j₂(b₁,a₀) = −M;     u₁(sBA) = +M</text><text x="310" y="835" font-size="23" fill="#172554" text-anchor="middle">The ordered path has c_δ = −M.</text><text x="310" y="880" font-size="24" fill="#2563eb" text-anchor="middle">U_P(sδ) = (0,0,−R₁ ⊗ R₂)</text><text x="310" y="925" font-size="19" fill="#172554" text-anchor="middle">R_i(y) = f + z;   the mixed value is nonzero.</text><text x="310" y="970" font-size="17" fill="#b91c1c" text-anchor="middle">An unconverted unary convention leaves the defect 2M.</text><text x="310" y="1043" font-size="11" fill="#172554" text-anchor="middle">Full normalized section, unit, inverse and parameter transport: Theorem 56.</text><text x="310" y="1075" font-size="12" fill="#172554" text-anchor="middle">Positive-unary bar conversion and nonzero mixed core: Exercise 56.</text><text x="310" y="1107" font-size="12" fill="#172554" text-anchor="middle">Whole Nat kernels and unit identities: C.68.1, C.70.1–2, C.73.1.</text></g></svg>