<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">The actual unital tensor comparison</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.75: full unary terms, finite kernel and shuffle span</text><rect x="25" y="105" width="570" height="245" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="149" font-size="18" fill="#172554" text-anchor="middle">Two mapping quasi-isomorphisms with literal objects</text><text x="310" y="202" font-size="27" fill="#172554" text-anchor="middle">T(A,B)</text><path d="M277,218 L182,267" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M343,218 L438,267" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="219" y="241" font-size="23" fill="#2563eb" text-anchor="middle">ρ</text><text x="402" y="241" font-size="23" fill="#2563eb" text-anchor="middle">ζ</text><text x="156" y="297" font-size="24" fill="#172554" text-anchor="middle">Q(A) ⊗ Q(B)</text><text x="465" y="297" font-size="24" fill="#172554" text-anchor="middle">Q(A ⊗ B)</text><text x="310" y="332" font-size="21" fill="#172554" text-anchor="middle">ε(A⊗B) ζ = (ε(A) ⊗ ε(B)) ρ</text><rect x="25" y="390" width="570" height="370" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="431" font-size="18" fill="#172554" text-anchor="middle">Leading cut complex: the proper grid for p=2, q=1</text><path d="M150,535 H450 M150,650 H450 M150,535 V650 M300,535 V650 M450,535 V650" stroke="#cbd5e1" fill="none"/><path d="M150,535 H300 V650 H450" stroke="#15803d" stroke-width="4" fill="none"/><circle cx="150" cy="535" r="6" fill="#15803d"/><circle cx="300" cy="535" r="6" fill="#15803d"/><circle cx="450" cy="650" r="6" fill="#15803d"/><circle cx="300" cy="650" r="8" fill="#7c3aed"/><circle cx="150" cy="650" r="6" stroke="#94a3b8" fill="white"/><circle cx="450" cy="535" r="6" stroke="#94a3b8" fill="white"/><text x="150" y="519" font-size="18" fill="#172554" text-anchor="middle">(0,1)</text><text x="300" y="519" font-size="18" fill="#172554" text-anchor="middle">(1,1)</text><text x="450" y="519" font-size="15" fill="#64748b" text-anchor="middle">top excluded</text><text x="150" y="680" font-size="15" fill="#64748b" text-anchor="middle">bottom excluded</text><text x="300" y="680" font-size="18" fill="#7c3aed" text-anchor="middle">a=(1,0)</text><text x="450" y="680" font-size="18" fill="#172554" text-anchor="middle">(2,0)</text><text x="310" y="475" font-size="19" fill="#172554" text-anchor="middle">c(v) = max(v,a):   Id ≤ c,   const(a) ≤ c</text><text x="310" y="720" font-size="16" fill="#172554" text-anchor="middle">The finite prism contracts this tree with its original unary complex.</text><text x="310" y="745" font-size="16" fill="#172554" text-anchor="middle">The actual kernel perturbation is finite in original letter count.</text><rect x="25" y="800" width="570" height="255" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="839" font-size="21" fill="#172554" text-anchor="middle">Odd commutator and actual scalar tensor term</text><text x="310" y="883" font-size="24" fill="#172554" text-anchor="middle">a = E(e,f):   Dz = −(XY + YX)</text><text x="310" y="925" font-size="25" fill="#7c3aed" text-anchor="middle">H(XY + YX) = −z</text><text x="310" y="967" font-size="18" fill="#172554" text-anchor="middle">The term +1 ⊗ y(c) survives in D(h(a,b) ⊗ y(c)).</text><text x="310" y="1010" font-size="21" fill="#7c3aed" text-anchor="middle">Omitting it gives counit defect −1 ⊗ c ≠ 0.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.75.1.1–2.1; Exercises C.75.3.1–2.</text></g></svg>