<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Keep every homotopy term before normalizing cuts</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.59: full projection squares and the actual finest primitive</text><rect x="25" y="105" width="570" height="430" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="23" fill="#172554" text-anchor="middle">All four roof terms contribute</text><text x="310" y="190" font-size="25" fill="#172554" text-anchor="middle">R = s′Ca + s′B′A₀</text><text x="310" y="229" font-size="25" fill="#172554" text-anchor="middle">− H′usBa − s′A₁sBa</text><text x="310" y="278" font-size="19" fill="#172554" text-anchor="middle">Exercise C.59.4.1: their values on e</text><text x="310" y="478" font-size="25" fill="#172554" text-anchor="middle">∂R(e) = y₁ + y₂ − z − y₃</text><text x="310" y="515" font-size="17" fill="#172554" text-anchor="middle">These four boundary directions are independent.</text><rect x="25" y="565" width="570" height="225" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="606" font-size="22" fill="#172554" text-anchor="middle">The inverse belongs on the right</text><text x="310" y="650" font-size="30" fill="#172554" text-anchor="middle">K<tspan baseline-shift="sub" font-size="65%">*</tspan> = −L J⁻¹</text><text x="310" y="693" font-size="26" fill="#172554" text-anchor="middle">∂K<tspan baseline-shift="sub" font-size="65%">*</tspan> = U − J′T J⁻¹</text><text x="310" y="733" font-size="21" fill="#172554" text-anchor="middle">Exercise C.59.4.2: K<tspan baseline-shift="sub" font-size="65%">*</tspan>(y) = ½f</text><text x="310" y="771" font-size="16" fill="#172554" text-anchor="middle">An ordinary-complex calculation of the inverse and sign.</text><rect x="25" y="825" width="570" height="230" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="863" font-size="18" fill="#172554" text-anchor="middle">One finest primitive; two displayed cut domains</text><text x="310" y="899" font-size="23" fill="#172554" text-anchor="middle">K<tspan baseline-shift="sub" font-size="65%">*</tspan></text><text x="165" y="949" font-size="23" fill="#172554" text-anchor="middle">K₁</text><text x="455" y="949" font-size="23" fill="#172554" text-anchor="middle">K₂</text><path d="M285,904 L185,931 M195.98658295951444,921.8187694248697 L185,931 L199.11457318700363,933.4039184155704" fill="none" stroke="#7c3aed" stroke-width="3"/><path d="M335,904 L435,931 M420.8854268129964,933.4039184155704 L435,931 L424.01341704048554,921.8187694248697" fill="none" stroke="#7c3aed" stroke-width="3"/><path d="M185,953 L280,975 M265.98151469017625,977.9123992889465 L280,975 L268.6888154376477,966.2217824248653" fill="none" stroke="#7c3aed" stroke-width="3"/><path d="M435,953 L340,975 M351.3111845623523,966.2217824248653 L340,975 L354.01848530982375,977.9123992889465" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="310" y="993" font-size="19" fill="#172554" text-anchor="middle">glue K on the actual sum; extend</text><text x="310" y="1033" font-size="24" fill="#172554" text-anchor="middle">T<tspan baseline-shift="sub" font-size="65%">new</tspan> = T + ∂K</text><text x="310" y="1102" font-size="16" fill="#172554" text-anchor="middle">Theorem C.59.1.1; Corollary C.59.2.1; Theorem C.59.3.1.</text><text x="100" y="328" font-size="26" fill="#2563eb" text-anchor="middle">f₁</text><path d="M100,345 L100,390 M94.0,377.0 L100,390 L106.0,377.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="100" y="425" font-size="26" fill="#2563eb" text-anchor="middle">y₁</text><text x="240" y="328" font-size="26" fill="#15803d" text-anchor="middle">f₂</text><path d="M240,345 L240,390 M234.0,377.0 L240,390 L246.0,377.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="240" y="425" font-size="26" fill="#15803d" text-anchor="middle">y₂</text><text x="380" y="328" font-size="26" fill="#7c3aed" text-anchor="middle">−g</text><path d="M380,345 L380,390 M374.0,377.0 L380,390 L386.0,377.0" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="380" y="425" font-size="26" fill="#7c3aed" text-anchor="middle">−z</text><text x="520" y="328" font-size="26" fill="#c2410c" text-anchor="middle">−f₃</text><path d="M520,345 L520,390 M514.0,377.0 L520,390 L526.0,377.0" fill="none" stroke="#c2410c" stroke-width="3"/><text x="520" y="425" font-size="26" fill="#c2410c" text-anchor="middle">−y₃</text></g></svg>