<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem55; Exercise55", "source_objects": ["00", "01", "11"], "roof": "Q^u(kP) -&gt; T(kP1,kP2) -&gt; k(P1 x P2)", "whole_counit_square": "Bp Lambda = Bd", "mixed_degree": -1, "mixed_differential": "DM=AB-BA", "second_roof_length_two_value": "sM+sA|sB", "whole_tensor_unit_mixed_value": "sM+sA|sB-sB|sA", "mixed_section_recording": "Theta_hat(M)=(0,0,-R1 tensor R2)", "relative_path_third_coordinate_on_direct_arrow": "-M"}</metadata><defs><marker id="roof-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#2563eb"/></marker><marker id="roof-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#15803d"/></marker></defs><text x="310" y="38" font-size="23" fill="#172554" text-anchor="middle">A whole joint-parameter common input</text><text x="310" y="75" font-size="17" fill="#172554" text-anchor="middle">The simultaneous arrow keeps its original source label.</text><rect x="18" y="101" width="584" height="259" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="141" font-size="21" fill="#172554" text-anchor="middle">The exact original compatible triangle P</text><text x="94" y="199" font-size="25" fill="#2563eb" text-anchor="middle">00</text><text x="309" y="199" font-size="25" fill="#2563eb" text-anchor="middle">01</text><text x="525" y="199" font-size="25" fill="#2563eb" text-anchor="middle">11</text><path d="M127,191 L270,191" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#roof-blue)"/><path d="M344,191 L487,191" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#roof-blue)"/><text x="199" y="180" font-size="22" fill="#172554" text-anchor="middle">α</text><text x="417" y="180" font-size="22" fill="#172554" text-anchor="middle">β</text><path d="M108,217 Q310,290 510,217" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#roof-green)"/><text x="310" y="283" font-size="24" fill="#15803d" text-anchor="middle">δ = βα</text><text x="310" y="321" font-size="18" fill="#172554" text-anchor="middle">No original native state 10 is adjoined.</text><text x="310" y="346" font-size="15" fill="#172554" text-anchor="middle">A proper identity-valued arrow is still a parameter.</text><rect x="18" y="380" width="584" height="235" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="421" font-size="23" fill="#172554" text-anchor="middle">The actual full unital roof</text><text x="310" y="467" font-size="25" fill="#2563eb" text-anchor="middle">ξ_P : R_P = Qᵘ(kP) → T</text><text x="310" y="514" font-size="28" fill="#15803d" text-anchor="middle">p ξ_P = d ε_P</text><text x="310" y="557" font-size="23" fill="#172554" text-anchor="middle">Λ_P = Bξ_P η_P;     Bp Λ_P = Bd</text><text x="310" y="593" font-size="17" fill="#172554" text-anchor="middle">The target is BT, with every full parameter core.</text><rect x="18" y="637" width="584" height="363" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="679" font-size="22" fill="#172554" text-anchor="middle">The first mixed generator has degree −1</text><text x="310" y="725" font-size="29" fill="#15803d" text-anchor="middle">DM = AB − BA</text><text x="310" y="770" font-size="24" fill="#2563eb" text-anchor="middle">Λ₁(sβ | sα) = sM + sA | sB</text><text x="310" y="815" font-size="20" fill="#172554" text-anchor="middle">η_K(sa ⊗ sb) = sM + sA | sB − sB | sA</text><text x="310" y="860" font-size="22" fill="#172554" text-anchor="middle">K₁₂ = −R₁ ⊗ R₂;    R_i(y) = f + z</text><text x="310" y="904" font-size="22" fill="#15803d" text-anchor="middle">K₁₂(y ⊗ y) = −(f + z) ⊗ (f + z)</text><text x="310" y="948" font-size="23" fill="#b91c1c" text-anchor="middle">κ(M) = 0;    Θ̂(M) = (0,0,K₁₂)</text><text x="310" y="981" font-size="18" fill="#172554" text-anchor="middle">The relative path has c(x_δ) = −M.</text><text x="310" y="1037" font-size="12" fill="#172554" text-anchor="middle">Actual roof, exact counit and coherent relative choices: Theorem 55.</text><text x="310" y="1071" font-size="12" fill="#172554" text-anchor="middle">Mixed differential, full bar chain equation and path sign: Exercise 55.</text><text x="310" y="1105" font-size="12" fill="#172554" text-anchor="middle">Normalized unital resolutions and tensor cuts: C.72, C.74, C.76.</text></g></svg>