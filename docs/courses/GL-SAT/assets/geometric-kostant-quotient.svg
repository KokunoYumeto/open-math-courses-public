<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="26" fill="#172554" text-anchor="middle">The actual Kostant quotient</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">Compact attraction → invariant traces → graded frame</text><rect x="25" y="105" width="570" height="277" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="143" font-size="22" fill="#172554" text-anchor="middle">1. A = Sμ ∩ X, with fixed point t^μ</text><text x="310" y="186" font-size="17" fill="#172554" text-anchor="middle">D(xᵢ) covers A ∖ {t^μ}; xᵢ has weight ηᵢ ≠ 0.</text><text x="310" y="226" font-size="18" fill="#172554" text-anchor="middle">On D(xᵢ): the character line has a frame.</text><text x="310" y="263" font-size="20" fill="#172554" text-anchor="middle">c₁(ηᵢ) = 0; localized compact image = 0.</text><text x="310" y="303" font-size="21" fill="#172554" text-anchor="middle">Q ⊗ Hᵀ,c(A,P)  ≅  Q ⊗ Hᵀ(t^μ,i*P)</text><text x="310" y="342" font-size="20" fill="#172554" text-anchor="middle">rank = dim Fμ(P) = total stalk dimension</text><text x="310" y="369" font-size="16" fill="#172554" text-anchor="middle">Actual restriction; Q = Frac S.  Lemma C.20.1.1.</text><rect x="25" y="414" width="570" height="258" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="454" font-size="21" fill="#172554" text-anchor="middle">2. On the μ-block: eigenvalue μ(βρ(u))</text><text x="310" y="498" font-size="22" fill="#172554" text-anchor="middle">trVλ(ξρⁿ) = Σμ dim Vλ[μ] · μ(βρ(u))ⁿ</text><text x="310" y="540" font-size="16" fill="#172554" text-anchor="middle">All invariant polynomials are spanned by these traces.</text><path d="M310,557 L310,590" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="310" y="619" font-size="22" fill="#172554" text-anchor="middle">χ(ξρ) = βρ(u) mod W, already over R₀</text><text x="310" y="655" font-size="17" fill="#172554" text-anchor="middle">Injective R₀ → S → Q; full centre retained.</text><rect x="25" y="706" width="570" height="302" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="747" font-size="21" fill="#172554" text-anchor="middle">3. Adapt the rational pinning to ξρ(0)</text><text x="310" y="790" font-size="23" fill="#172554" text-anchor="middle">eρ = Σᵢ aᵢeᵢ;  fρ = Σᵢ cᵢaᵢ⁻¹fᵢ</text><text x="310" y="832" font-size="19" fill="#172554" text-anchor="middle">P = {(p,g): Adg σρ(βρ(p) mod W) = ξρ(p)}</text><text x="310" y="873" font-size="19" fill="#172554" text-anchor="middle">P → Spec R₀ is smooth; (0,1) is fixed.</text><text x="310" y="914" font-size="22" fill="#172554" text-anchor="middle">t·(p,g) = (t·p, θ(t⁻¹)gθ(t))</text><path d="M310,930 L310,959" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="310" y="987" font-size="17" fill="#172554" text-anchor="middle">Positive grading gives a polynomial section g(p).</text><text x="310" y="1043" font-size="22" fill="#172554" text-anchor="middle">New tensor frame g⁻¹τ; Adg⁻¹ ξρ = σρ</text><text x="310" y="1082" font-size="16" fill="#172554" text-anchor="middle">The augmentation stays fixed; higher operators come next.</text><text x="310" y="1107" font-size="15" fill="#172554" text-anchor="middle">Proofs C.20.2.1–C.20.4.1; E has characteristic zero.</text></g></svg>