<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Correct product maps inside the whole graph</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">All equations use the full differential and fixed pure cores.</text><rect x="25" y="105" width="570" height="290" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="19" fill="#172554" text-anchor="middle">C.51.1: start with an actual raw square homotopy</text><text x="310" y="194" font-size="28" fill="#172554" text-anchor="middle">∂R = φ′t − uφ</text><text x="310" y="242" font-size="22" fill="#172554" text-anchor="middle">L = q′Ri − q′φ′h′ti + q′ukφi</text><text x="310" y="288" font-size="26" fill="#172554" text-anchor="middle">∂L = J′T − UJ</text><text x="310" y="334" font-size="20" fill="#172554" text-anchor="middle">K = −(J′)⁻¹L;     ∂K = (J′)⁻¹UJ − T</text><text x="310" y="378" font-size="19" fill="#172554" text-anchor="middle">Both contraction terms are retained.</text><rect x="25" y="430" width="570" height="295" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="473" font-size="21" fill="#172554" text-anchor="middle">C.51.3: extend the one-cross correction</text><text x="310" y="522" font-size="22" fill="#172554" text-anchor="middle">V = T′T⁻¹,   N = V − 1,   ∂H = N</text><text x="310" y="568" font-size="22" fill="#172554" text-anchor="middle">s = H log(1+N)/N;     ∂s = log V</text><text x="310" y="614" font-size="20" fill="#172554" text-anchor="middle">h extends s as a full path coderivation.</text><text x="310" y="662" font-size="25" fill="#172554" text-anchor="middle">v = Dh + hD;     A = exp(v)</text><text x="310" y="708" font-size="23" fill="#172554" text-anchor="middle">DA = AD,     ΔA = (A ⊗ A)Δ</text><rect x="25" y="765" width="570" height="260" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="807" font-size="18" fill="#172554" text-anchor="middle">C.51.4.1: the higher-cross correction is nonzero</text><text x="310" y="855" font-size="26" fill="#172554" text-anchor="middle">w = u₂₁ | α₁ | u₁₀</text><text x="310" y="900" font-size="24" fill="#172554" text-anchor="middle">h(w) = −u₂₁ | u₁₀</text><text x="310" y="945" font-size="22" fill="#172554" text-anchor="middle">[D,h](w) = u₂₀;     A(w) = w + u₂₀</text><text x="310" y="989" font-size="17" fill="#172554" text-anchor="middle">|αᵢ|=1, |uⱼᵢ|=−1;  the product sign is retained.</text><text x="310" y="1065" font-size="16" fill="#172554" text-anchor="middle">C.51.2 proves ordered tensor regrouping and the shift sign.</text><text x="310" y="1100" font-size="15" fill="#172554" text-anchor="middle">Hypothesis: actual homotopies agree on every prescribed overlap.</text></g></svg>