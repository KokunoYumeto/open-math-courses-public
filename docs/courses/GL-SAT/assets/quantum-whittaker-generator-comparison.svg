<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proofs": ["C.83.1.1", "C.83.2.1", "C.83.3.1", "C.83.4.1", "C.83.5.1", "C.83.6.1"], "actual_functor": "right Whittaker coinvariants followed by full N invariants", "coefficient_operators": "z_i=(C_i^L-C_i^R)/hbar, including degree0", "unit": "full Z(U_hbar)", "tensor": "right centre of first balanced with left centre of second", "standard_tensor_basis": "source aa,ab,ba,bb; target A,B,C-prime,D of ExerciseC83.7.2", "geometric_rotation": "positive t -&gt; a t; eta=c1(O(1))", "actual_parameter_identification": "hbar -&gt; -eta; original labels retained", "necessary_rank_one_central_identification": "C+hbar^2/2 maps to q"}</metadata><text x="310" y="38" font-size="23" fill="#172554" text-anchor="middle">Quantum Whittaker maps and their coefficients</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">Actual functor · full tensor · positive rotation convention</text><rect x="18" y="98" width="584" height="270" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="139" font-size="23" fill="#2563eb" text-anchor="middle">The full free-generator comparison</text><text x="310" y="184" font-size="23" fill="#172554" text-anchor="middle">P(V)  ↦  κħ(V) = (P(V) ⊗<tspan baseline-shift="sub" font-size="16">U</tspan> Qψ)ᴺ</text><text x="310" y="228" font-size="26" fill="#172554" text-anchor="middle">zᵢ = (Cᵢᴸ − Cᵢᴿ) / ħ</text><text x="310" y="270" font-size="23" fill="#172554" text-anchor="middle">zᵢ mod ħ = ρV(∇fᵢ(σρ))</text><text x="310" y="313" font-size="18" fill="#172554" text-anchor="middle">Full graded Hom isomorphism;  unit κħ(k) = Z(Uħ).</text><text x="310" y="346" font-size="16" fill="#172554" text-anchor="middle">Both central actions and all degree-zero operators remain.</text><rect x="18" y="388" width="584" height="354" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="430" font-size="22" fill="#15803d" text-anchor="middle">The standard tensor has quantum corrections</text><text x="310" y="469" font-size="18" fill="#172554" text-anchor="middle">Source: aa, ab, ba, bb;  target: A, B, C′, D</text><text x="310" y="511" font-size="24" fill="#172554" text-anchor="middle">μ =</text><path d="M211,524 h-12 v136 h12 M409,524 h12 v136 h-12" fill="none" stroke="#123049" stroke-width="2"/><text x="235" y="550" font-size="23" fill="#172554" text-anchor="middle">1</text><text x="285" y="550" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="335" y="550" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="385" y="550" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="235" y="581" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="285" y="581" font-size="23" fill="#172554" text-anchor="middle">1</text><text x="335" y="581" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="385" y="581" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="235" y="612" font-size="23" fill="#172554" text-anchor="middle">−ħ/2</text><text x="285" y="612" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="335" y="612" font-size="23" fill="#172554" text-anchor="middle">1</text><text x="385" y="612" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="235" y="643" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="285" y="643" font-size="23" fill="#172554" text-anchor="middle">ħ/2</text><text x="335" y="643" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="385" y="643" font-size="23" fill="#172554" text-anchor="middle">1</text><text x="310" y="708" font-size="17" fill="#172554" text-anchor="middle">det μ = 1;  μ mod ħ = I.  Exact right-to-left balancing.</text><rect x="18" y="762" width="584" height="246" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="803" font-size="22" fill="#2563eb" text-anchor="middle">The actual geometric torus fixes the sign</text><text x="310" y="848" font-size="25" fill="#172554" text-anchor="middle">xᴸ = x;    xᴿ = x + mη</text><text x="310" y="889" font-size="21" fill="#172554" text-anchor="middle">Quantum: xᴿ = x − mħ;    therefore ħ ↦ −η</text><text x="310" y="930" font-size="22" fill="#172554" text-anchor="middle">(q(u) − q(u + ηλ)) / (−η)</text><text x="310" y="958" font-size="17" fill="#172554" text-anchor="middle">At η = 0: Dλq(u); original label λ retained.</text><text x="310" y="986" font-size="18" fill="#172554" text-anchor="middle">Rank-one normalization: C + ħ²/2 ↦ q.</text><text x="310" y="1045" font-size="15" fill="#172554" text-anchor="middle">Proofs C.83.2–C.83.6; exact matrix in Exercise C.83.7.2.</text><text x="310" y="1080" font-size="15" fill="#172554" text-anchor="middle">The geometric statements use the original full action nerves.</text><text x="310" y="1110" font-size="14" fill="#172554" text-anchor="middle">Free reading: Bezrukavnikov–Finkelberg, arXiv:0707.3799v4.</text></g></svg>