<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem66; Exercise66", "native_domain": "unary outer with two-vertex inner chain", "total_arrow": "execute both factors and contract original edge e", "proper_prefix_labels": ["a", "z", "b", "d", "c"], "cover_relations": [["a", "z"], ["z", "d"], ["z", "c"], ["b", "d"]], "closure": {"a": "z", "b": "d", "z": "z", "d": "d", "c": "c"}, "invariant": "every selected prefix contraction set L is unchanged", "bar_rescaling": "(-1)^(p(p-1)/2)", "normalized_contraction": "h=h0 b h0"}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">Complete the inner execution; keep its edge labels</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">The original total arrow executes both factors and contracts e.</text><rect x="18" y="104" width="584" height="431" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="23" fill="#2563eb" text-anchor="middle">Proper labelled prefixes</text><path d="M 180 204 L 180 247" stroke="#15803d" stroke-width="3"/><path d="M 180 279 L 395 327" stroke="#15803d" stroke-width="3"/><path d="M 180 279 L 110 327" stroke="#15803d" stroke-width="3"/><path d="M 445 204 L 395 327" stroke="#15803d" stroke-width="3"/><rect x="158" y="170" width="44" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="180" y="195" font-size="23" fill="#2563eb" text-anchor="middle">a</text><rect x="423" y="170" width="44" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="445" y="195" font-size="23" fill="#2563eb" text-anchor="middle">b</text><rect x="158" y="245" width="44" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="180" y="270" font-size="23" fill="#2563eb" text-anchor="middle">z</text><rect x="88" y="325" width="44" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="110" y="350" font-size="23" fill="#2563eb" text-anchor="middle">c</text><rect x="373" y="325" width="44" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="395" y="350" font-size="23" fill="#2563eb" text-anchor="middle">d</text><text x="310" y="203" font-size="14" fill="#172554" text-anchor="middle">order increases ↓</text><text x="310" y="401" font-size="22" fill="#15803d" text-anchor="middle">a ↦ z;    b ↦ d;    z, d and c stay fixed.</text><text x="310" y="446" font-size="21" fill="#172554" text-anchor="middle">In c: outer done, inner complete, L = ∅.</text><text x="310" y="493" font-size="17" fill="#b91c1c" text-anchor="middle">Also contracting e would send c to the removed top.</text><rect x="18" y="556" width="584" height="273" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="597" font-size="20" fill="#15803d" text-anchor="middle">A prefix is (Lᵢ,Iᵢ) of the fixed total arrow fᵢ.</text><text x="310" y="642" font-size="24" fill="#172554" text-anchor="middle">Lᵢ ⊆ Kᵢ;     Jᵢ ⊆ Iᵢ ⊆ Iᵢ*</text><text x="310" y="687" font-size="19" fill="#172554" text-anchor="middle">c changes only the newly required inner ideals.</text><text x="310" y="733" font-size="26" fill="#2563eb" text-anchor="middle">Id ≤ c;      const_z ≤ c</text><text x="310" y="781" font-size="17" fill="#172554" text-anchor="middle">The closure stays in the same proper factorization poset.</text><rect x="18" y="850" width="584" height="139" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="893" font-size="25" fill="#2563eb" text-anchor="middle">λₚ = (−1)^(p(p−1)/2)</text><text x="310" y="941" font-size="21" fill="#15803d" text-anchor="middle">h = h₀ b h₀;      bh + hb = 1;      h² = 0</text><text x="310" y="1031" font-size="14" fill="#172554" text-anchor="middle">Safe blocks keep the whole shuffle; unsafe blocks are contracted.</text><text x="310" y="1070" font-size="15" fill="#172554" text-anchor="middle">Total original arrows with the same endpoints remain distinct.</text><text x="310" y="1105" font-size="14" fill="#172554" text-anchor="middle">General compatible graft input union and exact bar signs: §66.</text></g></svg>