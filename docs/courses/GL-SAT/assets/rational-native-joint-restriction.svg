<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem 58; Exercise 58", "projection": "Pi(A,B,R)=B", "input": "eta(C)=sM+sa1|sb0-sb1|sa0", "kernel": "Pi theta=0 and theta iota=0", "contraction": "H=H0(1+DH0+H0D-1)^(-1)", "degree": -1, "series": "finite on each fixed outer bar word"}</metadata><text x="310" y="40" font-size="25" fill="#172554" text-anchor="middle">Keep both entire images fixed</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">Native coefficients and the prescribed input family</text><rect x="18" y="106" width="584" height="268" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="147" font-size="25" fill="#2563eb" text-anchor="middle">θ ∈ Nat_T(F,G)</text><text x="310" y="187" font-size="20" fill="#172554" text-anchor="middle">↙ Π                         restriction ι ↘</text><text x="163" y="232" font-size="18" fill="#2563eb" text-anchor="middle">a ∈ Nat_T(ΠF,ΠG)</text><text x="462" y="232" font-size="18" fill="#15803d" text-anchor="middle">b ∈ Nat_K(Fι,Gι)</text><text x="310" y="285" font-size="24" fill="#172554" text-anchor="middle">Compatibility:   aι = Πb</text><text x="310" y="333" font-size="20" fill="#15803d" text-anchor="middle">A closed lift keeps a and b exactly.</text><rect x="18" y="395" width="584" height="275" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="436" font-size="23" fill="#15803d" text-anchor="middle">The kernel has both images zero</text><text x="310" y="480" font-size="25" fill="#172554" text-anchor="middle">Πθ = 0             θι = 0</text><text x="310" y="525" font-size="25" fill="#172554" text-anchor="middle">H₀θ = h ∘ θ</text><text x="310" y="568" font-size="24" fill="#172554" text-anchor="middle">J = DH₀ + H₀D − 1</text><text x="310" y="611" font-size="23" fill="#2563eb" text-anchor="middle">H = H₀(1 − J + J² − ⋯)</text><text x="310" y="647" font-size="19" fill="#172554" text-anchor="middle">DH + HD = 1;    H² = 0;    |H| = −1</text><rect x="18" y="691" width="584" height="311" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="732" font-size="23" fill="#2563eb" text-anchor="middle">Retain the whole mixed input</text><text x="310" y="780" font-size="23" fill="#172554" text-anchor="middle">ι(C) = sM + sa₁|sb₀ − sb₁|sa₀</text><text x="310" y="824" font-size="21" fill="#172554" text-anchor="middle">dM = AB − BA;    |M| = −1</text><text x="310" y="870" font-size="17" fill="#172554" text-anchor="middle">H₀ acts on the output, including the RQ term.</text><text x="310" y="909" font-size="19" fill="#15803d" text-anchor="middle">It preserves θι = 0 on this entire sum.</text><text x="310" y="952" font-size="18" fill="#172554" text-anchor="middle">No terminal-cone closure is required of ι.</text><text x="310" y="1043" font-size="14" fill="#172554" text-anchor="middle">Exact full cochain extension: Theorem 58.</text><text x="310" y="1074" font-size="12" fill="#172554" text-anchor="middle">Mixed unary signs and a nonzero relative perturbation: Exercise 58.</text><text x="310" y="1105" font-size="14" fill="#b91c1c" text-anchor="middle">The native target complex itself need not be acyclic.</text></g></svg>