<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="24" text-anchor="middle">The rank-one integral retains the whole coroot</text>
<text x="310" y="84" font-size="22" text-anchor="middle">α simple; β=α∨; I: upper O, lower tO</text>
<rect x="28" y="118" width="564" height="192" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="20" text-anchor="middle">Bottom row after s u(x) t^(jβ): (t^j, x t^(−j))</text>
<text x="310" y="202" font-size="26" text-anchor="middle">Membership: c ∈ tO, d ∈ O×</text>
<text x="310" y="245" font-size="26" text-anchor="middle">w=1: j≥1, x ∈ t^jO×</text>
<text x="310" y="287" font-size="26" text-anchor="middle">w=s: j=0, x ∈ tO</text>
<path d="M310,325 L310,357" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="373" width="564" height="171" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="415" font-size="26" text-anchor="middle">I_α(v₁)=q^(−1)v_s</text>
<text x="310" y="458" font-size="26" text-anchor="middle">+ (1−q^(−1)) Σ_(j≥1) e^(jβ)v₁</text>
<text x="310" y="501" font-size="22" text-anchor="middle">J_α=(1−e^β)I_α cancels the series.</text>
<text x="310" y="531" font-size="18" text-anchor="middle">I_α e^ν = e^(sν) I_α; the measure factor is q^n.</text>
<path d="M310,560 L310,592" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="608" width="564" height="166" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="650" font-size="29" text-anchor="middle">T_s θ_ν − θ_(sν) T_s</text>
<text x="310" y="697" font-size="24" text-anchor="middle">= (q−1)(θ_ν−θ_(sν))/(1−θ_(−β))</text>
<text x="310" y="744" font-size="20" text-anchor="middle">n=〈α,ν〉; this quotient is a finite root string.</text>
<path d="M310,790 L310,822" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="838" width="564" height="243" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="880" font-size="24" text-anchor="middle">PGL₂ example: β=2γ, ν=2γ, n=2</text>
<text x="215" y="943" font-size="25" text-anchor="middle">θ_(2γ) − θ_(−2γ)</text>
<path d="M92,962 L338,962" stroke="#0f172a" stroke-width="2"/>
<text x="215" y="1005" font-size="25" text-anchor="middle">1 − θ_(−2γ)</text>
<text x="356" y="974" font-size="23" text-anchor="start">= θ_(2γ) + 1</text>
<text x="310" y="1055" font-size="21" text-anchor="middle">Only full β-steps occur in the quotient.</text>
<text x="310" y="1124" font-size="20" text-anchor="middle">Lemma D.2.1.1; Exercise D.7.1.</text>
<text x="310" y="1164" font-size="18" text-anchor="middle">Geometric root coordinates work in every characteristic.</text>
</svg>