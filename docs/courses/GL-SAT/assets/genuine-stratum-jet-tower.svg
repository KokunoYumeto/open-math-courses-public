<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Genuine strata: frames, quotients, duality</text>
<text x="310" y="84" font-size="18" text-anchor="middle">P¹; original split G and T; k≥1 and k&gt;max d_α</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="21" text-anchor="middle">Root lines: L_α=O(d_α); level k at y.</text>
<text x="310" y="198" font-size="24" text-anchor="middle">Framed roots: L_α(−ky); H⁰=0.</text>
<text x="310" y="237" font-size="18" text-anchor="middle">Central height lifts form affine vector torsors.</text>
<text x="310" y="276" font-size="22" text-anchor="middle">M_k ≅ A^{m_k}; m_k=Σ(k−d_α−1).</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="21" text-anchor="middle">H_k=U(O_Dk) has kn root coefficients.</text>
<text x="310" y="443" font-size="24" text-anchor="middle">Bun_U=[M_k/H_k]; n=|Φ⁺|.</text>
<text x="310" y="482" font-size="24" text-anchor="middle">d=m_k−kn=−Σ(d_α+1).</text>
<text x="310" y="521" font-size="19" text-anchor="middle">The frame atlas is smooth of dimension kn.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="23" text-anchor="middle">M_{k+1} → M_k is an Aⁿ-torsor.</text>
<text x="310" y="688" font-size="21" text-anchor="middle">m_{k+1}=m_k+n; dim H_{k+1}=kn+n.</text>
<text x="310" y="727" font-size="23" text-anchor="middle">The stack dimension d stays fixed.</text>
<text x="310" y="766" font-size="21" text-anchor="middle">Its nerve is M_k×H_k^p in degree p.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="23" text-anchor="middle">q†=q*[kn](kn/2); q†D=D_M q†.</text>
<text x="310" y="933" font-size="19" text-anchor="middle">Raw atlas dual: D_M(q*K)[−2kn](−kn).</text>
<text x="310" y="972" font-size="22" text-anchor="middle">RΓ(Bun_U,E)=E via the actual unit.</text>
<text x="310" y="1011" font-size="21" text-anchor="middle">B G_a has d=−1, M₁=point, H₁=G_a.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Proposition L.1.1.1; Theorems L.2.1.1–L.4.1.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Genuine-stratum duality does not supply compactified boundary bounds.</text>
</svg>