<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="43" font-size="27" text-anchor="middle">External duality: test the specified map</text>
<text x="310" y="81" font-size="25" text-anchor="middle">δ : D_X K ⊠ D_Y L → D_(X×Y)(K ⊠ L)</text>
<rect x="28" y="110" width="564" height="174" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="151" font-size="24" text-anchor="middle">Input order: φ ⊗ ψ ⊗ v ⊗ w</text>
<text x="310" y="192" font-size="20" text-anchor="middle">Move ψ past v, then evaluate each dual first.</text>
<text x="310" y="232" font-size="21" text-anchor="middle">(φ ⊗ ψ)(v ⊗ w) = (−1)^(|ψ||v|) φ(v) ψ(w)</text>
<text x="310" y="266" font-size="18" text-anchor="middle">Product trace uses compact Künneth and τ_X ⊗ τ_Y.</text>
<path d="M310,300 L310,338" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="352" width="564" height="180" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="393" font-size="23" text-anchor="middle">Coordinate geometric generic fiber</text>
<text x="310" y="436" font-size="27" text-anchor="middle">q*δ = δ_generic ⊗ E(1)[2]</text>
<text x="310" y="477" font-size="20" text-anchor="middle">One ambient coordinate is lost on both sides.</text>
<text x="310" y="513" font-size="21" text-anchor="middle">Lower total dimension ⇒ Cone(q*δ) = 0.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="158" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="640" font-size="24" text-anchor="middle">Δ = Cone(δ) has finite point support.</text>
<text x="310" y="682" font-size="19" text-anchor="middle">A positive-dimensional support component would</text>
<text x="310" y="720" font-size="17" text-anchor="middle">have a nonconstant coordinate and survive its generic test.</text>
<path d="M310,773 L310,810" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="824" width="564" height="180" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="865" font-size="22" text-anchor="middle">For proper X,Y: RΓ(δ) is tensor duality.</text>
<text x="310" y="907" font-size="23" text-anchor="middle">D V ⊗ D W ≅ D(V ⊗ W),   V,W finite.</text>
<text x="310" y="950" font-size="18" text-anchor="middle">RΓ(Δ) = 0 detects Δ only after finite point support.</text>
<text x="310" y="986" font-size="22" text-anchor="middle">Point cohomology is exact: Δ = 0.</text>
<text x="310" y="1052" font-size="21" text-anchor="middle">Compactify arbitrary X,Y, extend by open !,</text>
<text x="310" y="1087" font-size="20" text-anchor="middle">and restrict the same evaluation and product trace.</text>
<text x="310" y="1135" font-size="20" text-anchor="middle">Theorem A.3.2.1; Exercises A.7.1 and A.7.4</text>
</svg>