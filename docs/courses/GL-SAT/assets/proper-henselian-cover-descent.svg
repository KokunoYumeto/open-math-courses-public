<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1090" viewBox="0 0 620 1090" role="img" aria-labelledby="title desc">
<title id="title">Finite étale covers over an arbitrary proper henselian pair</title>
<desc id="desc">Arithmetic pair henselizations have colimit A with closed quotient A/I. For a proper finitely presented scheme Z, the equivalences of finite étale cover categories at the arithmetic stages induce the equivalence for Z. An arbitrary proper X is a closed-immersion inverse limit of proper finitely presented X alpha; finite étale covers and maps descend, giving the full equivalence for X without flatness or finite presentation.</desc>
<metadata>Creator: GPT-6.1 Sol (OpenAI). CC0. Exact proof locators: Theorem I.1.1, Theorems I.2.2.1–I.2.4.1 and I.3.1.1–I.3.2.1. Free human comparison: https://stacks.math.columbia.edu/tag/0GS2.</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#35546a"/></marker></defs>
<style>text{fill:#123d59;font-family:Arial,sans-serif;font-size:15px}.title{font-size:24px;font-weight:bold}.heading{font-size:18px;font-weight:bold}.math{font-family:Georgia,serif;font-size:23px}.small{font-size:13px}.arrow{stroke:#35546a;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.sub{font-size:13px;baseline-shift:sub}.sup{font-size:13px;baseline-shift:super}</style>
<rect width="620" height="1090" fill="white"/>
<text class="title" x="28" y="36">Proper henselian finite-cover descent</text>
<text x="28" y="69">(A, I) is any henselian pair; X is proper over A.</text>
<text x="28" y="93">No Noetherian, flatness or finite-presentation condition on X/A.</text>
<rect x="20" y="112" width="580" height="220" rx="12" fill="#f4f8fc" stroke="#b4cee3" stroke-width="1.5"/>
<text class="heading" x="38" y="144">1. Express the actual pair as an arithmetic colimit</text>
<text x="38" y="170">A<tspan class="sub">i</tspan> ⊂ A is finite type over ℤ; I<tspan class="sub">i</tspan> = I ∩ A<tspan class="sub">i</tspan>; H<tspan class="sub">i</tspan> = (A<tspan class="sub">i</tspan>)<tspan class="sup">h</tspan><tspan class="sub">Iᵢ</tspan>.</text>
<text class="math" x="77" y="216">H<tspan class="sub">i</tspan></text><path class="arrow" d="M116 208 H249"/>
<text class="math" x="271" y="216">H<tspan class="sub">j</tspan></text><path class="arrow" d="M310 208 H459"/>
<text class="math" x="484" y="216">A</text>
<path class="arrow" d="M92 225 V265"/><path class="arrow" d="M289 225 V265"/><path class="arrow" d="M494 225 V265"/>
<text class="math" x="50" y="290">H<tspan class="sub">i</tspan>/J<tspan class="sub">i</tspan></text><path class="arrow" d="M146 281 H235"/>
<text class="math" x="248" y="290">H<tspan class="sub">j</tspan>/J<tspan class="sub">j</tspan></text><path class="arrow" d="M344 281 H451"/>
<text class="math" x="470" y="290">A/I</text>
<text class="small" x="38" y="315">A = colim H<tspan class="sub">i</tspan>; A/I = colim H<tspan class="sub">i</tspan>/J<tspan class="sub">i</tspan>; J<tspan class="sub">i</tspan> = I<tspan class="sub">i</tspan>H<tspan class="sub">i</tspan>. The H<tspan class="sub">i</tspan> → A maps need not be injective.</text>
<rect x="20" y="352" width="580" height="330" rx="12" fill="#edf8f5" stroke="#78bfae" stroke-width="1.5"/>
<text class="heading" x="38" y="384">2. Descend covers for a proper finitely presented Z/A</text>
<text x="38" y="411">Descend a proper model Z<tspan class="sub">*</tspan>/A<tspan class="sub">*</tspan>; use Z<tspan class="sub">i</tspan> = Z<tspan class="sub">*</tspan> ×<tspan class="sub">A*</tspan> H<tspan class="sub">i</tspan>.</text>
<text x="38" y="438">Exact equation approximation proves every stage equivalence.</text>
<text class="math" x="55" y="485">FÉt(Z<tspan class="sub">i</tspan>)</text><path class="arrow" d="M174 477 H412"/><text class="math" x="282" y="466">≃</text>
<text class="math" x="429" y="485">FÉt(Z<tspan class="sub">i,0</tspan>)</text>
<path class="arrow" d="M107 498 V574"/><path class="arrow" d="M489 498 V574"/>
<text class="small" x="120" y="538">pullback</text><text class="small" x="502" y="538">pullback</text>
<text class="math" x="58" y="603">FÉt(Z)</text><path class="arrow" d="M173 595 H413"/><text class="math" x="282" y="584">≃</text>
<text class="math" x="431" y="603">FÉt(Z<tspan class="sub">0</tspan>)</text>
<text x="38" y="636">Both lower categories are the filtered colimits of the stages.</text>
<text x="38" y="661">Every cover, map and equality occurs at a finite stage.</text>
<rect x="20" y="702" width="580" height="301" rx="12" fill="#f4f8fc" stroke="#b4cee3" stroke-width="1.5"/>
<text class="heading" x="38" y="734">3. Retain arbitrary defining ideals of the proper X</text>
<text class="math" x="66" y="785">X</text><path class="arrow" d="M99 776 H250"/>
<text class="math" x="270" y="785">X<tspan class="sub">β</tspan></text><path class="arrow" d="M313 776 H453"/>
<text class="math" x="476" y="785">X<tspan class="sub">α</tspan></text>
<text x="38" y="820">X = lim X<tspan class="sub">α</tspan>; each X<tspan class="sub">α</tspan>/A is proper and finitely presented.</text>
<text x="38" y="848">These arrows are closed immersions, not assumed flat.</text>
<text class="math" x="48" y="895">FÉt(X) = colim FÉt(X<tspan class="sub">α</tspan>)</text>
<path class="arrow" d="M302 909 V938"/><text class="math" x="320" y="931">≃</text>
<text class="math" x="48" y="970">FÉt(X<tspan class="sub">0</tspan>) = colim FÉt(X<tspan class="sub">α,0</tspan>)</text>
<text class="small" x="28" y="1033">Proof: Theorem I.1.1, Theorems I.2.2.1–I.2.4.1 and I.3.1.1–I.3.2.1.</text>
<text class="small" x="28" y="1057">Finite G-torsors follow for every finite G, without inverting |G| (I.3.3.1).</text>
<text class="small" x="28" y="1080">Free human comparison: Stacks 0GS2.</text>
