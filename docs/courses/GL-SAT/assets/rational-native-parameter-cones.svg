<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem22; Exercise22", "rho_q": "(-1)^q s_(q+1)(parameter_word,a_Ua)", "H_q": "s_(q+2)(parameter_word,a_Ub,a_ba)", "T_q": "(-1)^(q+1) s_(q+3)(parameter_word,a_Uc,a_cb,a_ba)", "negative_constant_map_cut_sign": "(-1)^q", "triangle_objects": ["D_a", "D_b", "D_U"], "triangle_boundary": "dH=rho_a-rho_b f_ba", "counterexample_rho1_1_to_13": "epsilon", "counterexample_sigma1_1_to_13": "-epsilon", "counterexample_full_inverse_identities": true, "parallel_index": {"arrows": "u,v:1-&gt;2", "relation": "u a=v a=b", "rho1_u": "epsilon", "rho1_v": 0}, "comparison_scope": "parameter diagrams with all original higher components"}</metadata><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">Keep the whole comparison in an initial cone</text><text x="310" y="79" font-size="16" fill="#172554" text-anchor="middle">Original parameter components give the base-change homotopy.</text><path d="M 110 390 L 304.56473574801356 179.87008539214537" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M 294.10185206293966 183.81065197483554 L 304.56473574801356 179.87008539214537 L 301.4394588031214 190.60473228981857" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M 510 390 L 315.43526425198644 179.87008539214537" stroke="#15803d" stroke-width="3" fill="none"/><path d="M 318.5605411968786 190.60473228981857 L 315.43526425198644 179.87008539214537 L 325.89814793706034 183.81065197483554" stroke="#15803d" stroke-width="2" fill="none"/><path d="M 110 390 L 502.0 390.0" stroke="#7e22ce" stroke-width="3" fill="none"/><path d="M 492.0 385.0 L 502.0 390.0 L 492.0 395.0" stroke="#7e22ce" stroke-width="2" fill="none"/><circle cx="110" cy="390" r="4" fill="#334155"/><text x="110" y="420" font-size="20" fill="#172554" text-anchor="middle">D_a</text><circle cx="510" cy="390" r="4" fill="#334155"/><text x="510" y="420" font-size="20" fill="#172554" text-anchor="middle">D_b</text><circle cx="310" cy="174" r="4" fill="#334155"/><text x="310" y="152" font-size="20" fill="#172554" text-anchor="middle">D_U</text><text x="126" y="248" font-size="21" fill="#2563eb" text-anchor="middle">ρᵃ₀(U)</text><text x="494" y="248" font-size="21" fill="#15803d" text-anchor="middle">ρᵇ₀(U)</text><text x="310" y="425" font-size="19" fill="#7e22ce" text-anchor="middle">f_ba = s₁(a_ba)</text><text x="310" y="288" font-size="20" fill="#172554" text-anchor="middle">H₀ = s₂(a_Ub, a_ba)</text><text x="310" y="323" font-size="16" fill="#172554" text-anchor="middle">degree −1</text><text x="310" y="477" font-size="23" fill="#172554" text-anchor="middle">dH = ρᵃ − ρᵇ ⋆ f_ba</text><rect x="17" y="515" width="586" height="264" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="556" font-size="20" fill="#2563eb" text-anchor="middle">Every parameter word is retained</text><text x="310" y="601" font-size="19" fill="#172554" text-anchor="middle">ρᵃ_q = (−1)^q s_(q+1)(…, a_Ua)</text><text x="310" y="647" font-size="19" fill="#172554" text-anchor="middle">Hᵃᵇ_q = s_(q+2)(…, a_Ub, a_ba)</text><text x="310" y="693" font-size="17" fill="#172554" text-anchor="middle">Tᵃᵇᶜ_q = (−1)^(q+1) s_(q+3)(…, a_Uc, a_cb, a_ba)</text><text x="310" y="744" font-size="17" fill="#172554" text-anchor="middle">ρᶜ ⋆ h has the cut sign (−1)^q at word length q.</text><rect x="17" y="800" width="586" height="242" rx="15" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="310" y="838" font-size="20" fill="#172554" text-anchor="middle">Full inverses retain the positive components</text><text x="310" y="876" font-size="22" fill="#172554" text-anchor="middle">ρ₀ = σ₀ = 1</text><text x="310" y="914" font-size="19" fill="#b91c1c" text-anchor="middle">ρ₁({1} → {1,3}) = ε;  σ₁({1} → {1,3}) = −ε</text><text x="310" y="952" font-size="22" fill="#15803d" text-anchor="middle">σ ⋆ ρ = 1;       ρ ⋆ σ = 1</text><text x="310" y="989" font-size="18" fill="#b91c1c" text-anchor="middle">Parallel u ≠ v:  ρ₁(u) = ε,  ρ₁(v) = 0</text><text x="310" y="1022" font-size="16" fill="#172554" text-anchor="middle">u,v: 1 → 2;       ua = va = b</text><text x="310" y="1071" font-size="13" fill="#172554" text-anchor="middle">Theorem 22 and Exercise 22. Original higher parameter comparison.</text><text x="310" y="1104" font-size="12" fill="#172554" text-anchor="middle">Free full-bar background: Keller, arXiv:math/9910179, §4.2.</text></g></svg>