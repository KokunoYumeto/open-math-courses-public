<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">The same core controls each module</text><text x="310" y="76" font-size="18" fill="#172554" text-anchor="middle">Actual functor graphs; directed bar words retained.</text><rect x="25" y="104" width="570" height="295" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="21" fill="#172554" text-anchor="middle">1. One interval parameter for both coactions</text><text x="310" y="195" font-size="21" fill="#172554" text-anchor="middle">target core  ←  cross module  ←  source core</text><text x="310" y="242" font-size="24" fill="#172554" text-anchor="middle">λH = (Hₒ⊗1 + Eₒ⊗H)λ</text><text x="310" y="291" font-size="24" fill="#172554" text-anchor="middle">ρH = (H⊗1 + E⊗Hᵢ)ρ</text><text x="310" y="337" font-size="23" fill="#172554" text-anchor="middle">Δe = e⊗v₁ + v₀⊗e</text><text x="310" y="382" font-size="19" fill="#172554" text-anchor="middle">Theorems C.37.1.1–C.37.3.1.</text><rect x="25" y="432" width="570" height="370" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="474" font-size="18" fill="#172554" text-anchor="middle">2. Two cross arrows have an actual grafting product</text><text x="95" y="535" font-size="28" fill="#172554" text-anchor="middle">A</text><text x="310" y="535" font-size="28" fill="#172554" text-anchor="middle">B</text><text x="525" y="535" font-size="28" fill="#172554" text-anchor="middle">C</text><path d="M125,525 L275,525 M262.0,531.0 L275,525 L262.0,519.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M345,525 L495,525 M482.0,531.0 L495,525 L482.0,519.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="202" y="502" font-size="21" fill="#172554" text-anchor="middle">F</text><text x="420" y="502" font-size="21" fill="#172554" text-anchor="middle">G</text><path d="M125,555 Q310,665 495,555" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="310" y="638" font-size="22" fill="#172554" text-anchor="middle">GF</text><text x="310" y="679" font-size="26" fill="#172554" text-anchor="middle">m⊗n  ↦  m G♯(n)</text><text x="310" y="724" font-size="21" fill="#172554" text-anchor="middle">b₂(sm|sn) = (−1)^|sm| s(m G♯(n))</text><text x="310" y="765" font-size="18" fill="#172554" text-anchor="middle">The full bar retains direct and two-cross words.</text><rect x="25" y="836" width="570" height="188" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="878" font-size="18" fill="#172554" text-anchor="middle">3. Finite windows preserve the grafting differential</text><text x="310" y="922" font-size="23" fill="#172554" text-anchor="middle">W = |word| + endpoint height difference</text><text x="310" y="965" font-size="22" fill="#172554" text-anchor="middle">length ≤ W+H;    b raises W by 1</text><text x="310" y="1007" font-size="19" fill="#172554" text-anchor="middle">Two degree-zero cross arrows: W = 0 → 1.</text><text x="310" y="1061" font-size="17" fill="#172554" text-anchor="middle">C.38 proves nested module grafting and rational descent.</text><text x="310" y="1101" font-size="16" fill="#172554" text-anchor="middle">Common tensor inputs and complete marked coherence remain.</text></g></svg>