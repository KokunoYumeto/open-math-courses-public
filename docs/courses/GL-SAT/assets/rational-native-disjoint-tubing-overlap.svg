<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem75; Exercise75", "tree": "Four operation vertices in a chain.", "tubes": {"A": [0], "B": [2]}, "joining_seam": 1, "pentagon_vertex_tubings": [[[0], [2]], [[2], [1, 2]], [[1], [1, 2]], [[1], [0, 1]], [[0], [0, 1]]], "whole_square": "S=(0,0,R_A graft R_B); dS=P_AB-P_BA", "retargeted_square": "S_new=T(S)-M_pathAB+M_pathBA", "native_example": "Old full paths commute; new S at vertex1 has R=M1 M2", "native_two_parameter_each_core": "+4 z tensor z"}</metadata><text x="310" y="40" font-size="23" fill="#172554" text-anchor="middle">The disjoint corner retains its whole square</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">Original flags · a genuine common input · the joining seam</text><rect x="18" y="104" width="584" height="316" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="141" font-size="20" fill="#2563eb" text-anchor="middle">C_T is the actual four-vertex pentagon</text><polygon points="310,178 475,266 410,385 210,385 145,266" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><circle cx="310" cy="178" r="7" fill="#15803d"/><text x="310" y="211" font-size="20" fill="#15803d" text-anchor="middle">{A,B}</text><text x="200" y="209" font-size="17" fill="#15803d" text-anchor="middle">A = {e₀}</text><text x="422" y="209" font-size="17" fill="#15803d" text-anchor="middle">B = {e₂}</text><text x="480" y="338" font-size="15" fill="#172554" text-anchor="middle">{e₁,e₂}</text><text x="310" y="408" font-size="15" fill="#172554" text-anchor="middle">{e₁}</text><text x="137" y="338" font-size="15" fill="#172554" text-anchor="middle">{e₀,e₁}</text><text x="310" y="294" font-size="18" fill="#2563eb" text-anchor="middle">Blocks: {v₀,v₁} and {v₂,v₃}</text><text x="310" y="330" font-size="18" fill="#172554" text-anchor="middle">The uncontracted seam is e₁.</text><rect x="18" y="440" width="584" height="218" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="481" font-size="23" fill="#15803d" text-anchor="middle">Two distinct complete face flags</text><text x="310" y="531" font-size="28" fill="#2563eb" text-anchor="middle">∅ → A → A∪B → E</text><text x="310" y="579" font-size="28" fill="#2563eb" text-anchor="middle">∅ → B → A∪B → E</text><text x="310" y="627" font-size="16" fill="#172554" text-anchor="middle">Their A/B operators agree on the full expanded carrier.</text><rect x="18" y="678" width="584" height="310" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="720" font-size="20" fill="#2563eb" text-anchor="middle">Original and retargeted section comparisons</text><text x="310" y="766" font-size="20" fill="#172554" text-anchor="middle">S = (0,0,R_A ⋆ R_B);     dS = P_AB − P_BA</text><text x="310" y="810" font-size="22" fill="#172554" text-anchor="middle">|S| = −1;       |R_A ⋆ R_B| = −2</text><text x="310" y="855" font-size="23" fill="#15803d" text-anchor="middle">S_new = T(S) − M_AB + M_BA</text><text x="310" y="901" font-size="18" fill="#172554" text-anchor="middle">A strict old square can need a nonzero new S.</text><text x="310" y="949" font-size="23" fill="#15803d" text-anchor="middle">Native length-two cores:       +4z ⊗ z</text><text x="310" y="1030" font-size="15" fill="#172554" text-anchor="middle">Every independent cube face retains its full Koszul boundary.</text><text x="310" y="1067" font-size="15" fill="#172554" text-anchor="middle">The actual joining row, its η and all original unit words remain.</text><text x="310" y="1105" font-size="15" fill="#172554" text-anchor="middle">Whole graph identities and quadratic path corrections: §75.</text></g></svg>