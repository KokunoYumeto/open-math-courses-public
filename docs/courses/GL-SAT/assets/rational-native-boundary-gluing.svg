<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="27" fill="#172554" text-anchor="middle">One whole boundary row</text><text x="310" y="76" font-size="16" fill="#172554" text-anchor="middle">Original facets · full unary differential · retained section data</text><rect x="18" y="99" width="584" height="342" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="137" font-size="23" fill="#2563eb" text-anchor="middle">Four facets through one painted vertex</text><text x="310" y="174" font-size="18" fill="#172554" text-anchor="middle">J(path₃):  x = (2, 8, 2),  normal (−1, −2, −1)</text><path d="M171,225 L449,225" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M171,225 L214,354" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M171,225 L409,354" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M449,225 L214,354" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M449,225 L409,354" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M214,354 L409,354" stroke="#2563eb" stroke-width="2" fill="none"/><circle cx="171" cy="225" r="22" fill="white" stroke="#2563eb" stroke-width="2"/><text x="171" y="231" font-size="19" fill="#2563eb" text-anchor="middle">2</text><circle cx="449" cy="225" r="22" fill="white" stroke="#2563eb" stroke-width="2"/><text x="449" y="231" font-size="19" fill="#2563eb" text-anchor="middle">3</text><circle cx="214" cy="354" r="22" fill="white" stroke="#2563eb" stroke-width="2"/><text x="214" y="360" font-size="19" fill="#2563eb" text-anchor="middle">6</text><circle cx="409" cy="354" r="22" fill="white" stroke="#2563eb" stroke-width="2"/><text x="409" y="360" font-size="19" fill="#2563eb" text-anchor="middle">7</text><text x="310" y="405" font-size="17" fill="#172554" text-anchor="middle">The containing-facet simplex has Čech degree 0…3.</text><rect x="18" y="462" width="584" height="254" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="503" font-size="23" fill="#15803d" text-anchor="middle">A finite correction on full cochains</text><text x="310" y="548" font-size="28" fill="#172554" text-anchor="middle">D = ∂̌ + (−1)ᵖ dᵥ</text><text x="310" y="594" font-size="22" fill="#172554" text-anchor="middle">P = p₀(1 + Δh)⁻¹;     H = h(1 + Δh)⁻¹</text><text x="310" y="639" font-size="22" fill="#172554" text-anchor="middle">DH + HD = 1 − jP;      PD = dglob P</text><text x="310" y="685" font-size="18" fill="#172554" text-anchor="middle">Δh lowers Čech degree: every series is finite.</text><rect x="18" y="737" width="584" height="252" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="779" font-size="23" fill="#2563eb" text-anchor="middle">A and B remain whole and unchanged</text><text x="310" y="825" font-size="26" fill="#172554" text-anchor="middle">F∂ = P𝓕;       𝓕 − jF∂ = D(H𝓕)</text><text x="310" y="871" font-size="17" fill="#172554" text-anchor="middle">Closed higher R survives in F∂ or its full comparison.</text><text x="310" y="916" font-size="18" fill="#172554" text-anchor="middle">Serial R-only products vanish; their tensors remain.</text><text x="310" y="960" font-size="17" fill="#172554" text-anchor="middle">B = ε β augments only the new geometric direction.</text><text x="310" y="1031" font-size="15" fill="#172554" text-anchor="middle">The complete painted boundary has 13 facets and 66 proper faces.</text><text x="310" y="1069" font-size="14" fill="#172554" text-anchor="middle">Source and operator bars, proper identity parameters and units remain.</text><text x="310" y="1105" font-size="15" fill="#172554" text-anchor="middle">Exact domains, signs and relative construction: Theorem 77.</text></g></svg>