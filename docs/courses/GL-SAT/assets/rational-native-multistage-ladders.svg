<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem42; Exercise42", "section_equation": "kappa_(j-1) i_j-i_j_prime kappa_j=delta R_j", "homotopy_difference": "delta F_n=E_flat_n-E_tel_n", "pair_formula": "F_n=sum_(a&lt;j) p_n_prime...p_a_prime R_a i_(a+1)...i_(j-1) h_j P_(j-1)", "binary_regrouping": "F_n=P_tail_prime F_m+F_tail P_m+P_n_prime R_prefix H_tail P_m", "two_stage_values": {"E_flat_u": 0, "E_tel_u": "z", "F_v": "z", "delta_F_u": "-z"}}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">A tower retains its original section homotopies</text><text x="310" y="79" font-size="17" fill="#172554" text-anchor="middle">Full typed cochains · every parameter cut remains</text><rect x="18" y="108" width="584" height="248" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="62" y="146" font-size="23" fill="#2563eb" text-anchor="middle">X₀</text><text x="62" y="237" font-size="23" fill="#15803d" text-anchor="middle">X′₀</text><path d="M 62 158 L 62 207 l -4 -7 M 62 207 l 4 -7" stroke="#334155" fill="none" stroke-width="1.5"/><text x="82" y="190" font-size="18" fill="#172554" text-anchor="middle">κ₀</text><text x="184" y="146" font-size="23" fill="#2563eb" text-anchor="middle">X₁</text><text x="184" y="237" font-size="23" fill="#15803d" text-anchor="middle">X′₁</text><path d="M 184 158 L 184 207 l -4 -7 M 184 207 l 4 -7" stroke="#334155" fill="none" stroke-width="1.5"/><text x="204" y="190" font-size="18" fill="#172554" text-anchor="middle">κ₁</text><text x="306" y="146" font-size="23" fill="#2563eb" text-anchor="middle">X₂</text><text x="306" y="237" font-size="23" fill="#15803d" text-anchor="middle">X′₂</text><path d="M 306 158 L 306 207 l -4 -7 M 306 207 l 4 -7" stroke="#334155" fill="none" stroke-width="1.5"/><text x="326" y="190" font-size="18" fill="#172554" text-anchor="middle">κ₂</text><text x="558" y="146" font-size="23" fill="#2563eb" text-anchor="middle">Xₙ</text><text x="558" y="237" font-size="23" fill="#15803d" text-anchor="middle">X′ₙ</text><path d="M 558 158 L 558 207 l -4 -7 M 558 207 l 4 -7" stroke="#334155" fill="none" stroke-width="1.5"/><text x="578" y="190" font-size="18" fill="#172554" text-anchor="middle">κₙ</text><text x="123" y="146" font-size="22" fill="#2563eb" text-anchor="middle">⇄</text><text x="123" y="237" font-size="22" fill="#15803d" text-anchor="middle">⇄</text><text x="245" y="146" font-size="22" fill="#2563eb" text-anchor="middle">⇄</text><text x="245" y="237" font-size="22" fill="#15803d" text-anchor="middle">⇄</text><text x="367" y="146" font-size="22" fill="#2563eb" text-anchor="middle">⇄</text><text x="367" y="237" font-size="22" fill="#15803d" text-anchor="middle">⇄</text><text x="497" y="146" font-size="22" fill="#2563eb" text-anchor="middle">⇄</text><text x="497" y="237" font-size="22" fill="#15803d" text-anchor="middle">⇄</text><text x="430" y="146" font-size="23" fill="#2563eb" text-anchor="middle">⋯</text><text x="430" y="237" font-size="23" fill="#15803d" text-anchor="middle">⋯</text><text x="310" y="280" font-size="22" fill="#172554" text-anchor="middle">κⱼ₋₁ iⱼ − i′ⱼ κⱼ = δRⱼ;  |Rⱼ| = −1</text><text x="310" y="325" font-size="17" fill="#172554" text-anchor="middle">The given Rⱼ is retained, including its closed part.</text><rect x="18" y="377" width="584" height="310" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="418" font-size="21" fill="#172554" text-anchor="middle">Compare the two full projection homotopies</text><text x="310" y="461" font-size="21" fill="#172554" text-anchor="middle">δE(flat) = δE(tel) = P′ₙ κ₀ − κₙ Pₙ</text><text x="310" y="508" font-size="24" fill="#15803d" text-anchor="middle">δFₙ = E(flat) − E(tel);  |Fₙ| = −2</text><text x="310" y="553" font-size="25" fill="#2563eb" text-anchor="middle">Fₙ = Σ P′ₙ ℛⱼ₋₁ hⱼ Pⱼ₋₁</text><text x="310" y="598" font-size="18" fill="#172554" text-anchor="middle">The sum runs over j = 2, …, n.</text><text x="310" y="641" font-size="17" fill="#172554" text-anchor="middle">Expanding ℛⱼ₋₁ gives one term for each pair a &lt; j.</text><rect x="18" y="708" width="584" height="314" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="748" font-size="19" fill="#172554" text-anchor="middle">An equal leading map can hide a nonzero difference</text><text x="310" y="792" font-size="22" fill="#172554" text-anchor="middle">du = v;  M(u) = z;  |z| = −1</text><text x="310" y="836" font-size="23" fill="#172554" text-anchor="middle">E(flat)(u) = 0;  E(tel)(u) = z</text><text x="310" y="880" font-size="25" fill="#15803d" text-anchor="middle">F₂(v) = z;  δF₂(u) = −z</text><text x="310" y="923" font-size="17" fill="#b91c1c" text-anchor="middle">The incoming differential supplies the minus sign.</text><text x="310" y="966" font-size="17" fill="#172554" text-anchor="middle">Every consecutive binary grouping gives the same Fₙ.</text><text x="310" y="1000" font-size="16" fill="#172554" text-anchor="middle">Each ordered pair a &lt; j appears once at its first split.</text><text x="310" y="1055" font-size="13" fill="#172554" text-anchor="middle">Full ladder and exact regrouping identities: Theorem 42.</text><text x="310" y="1082" font-size="12" fill="#172554" text-anchor="middle">The nonzero two-stage comparison and its Hom sign: Exercise 42.</text><text x="310" y="1107" font-size="12" fill="#172554" text-anchor="middle">Full parameter transfer and source pullback: Theorems 37, 40–41.</text></g></svg>