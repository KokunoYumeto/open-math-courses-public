<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proofs": ["Theorem30", "Theorem31"], "exercises": ["Exercise30", "Exercise31"], "big": "Z=K_F tensor C_B tensor B tensor Gamma tensor L", "actual_maps": ["U:Z->Xsep", "SU:Xsep->Z", "V:Z->Xjoint", "IV:Xjoint->Z"], "shuffle": "J=V SU", "inverse": "K=U IV", "inverse_homotopies": ["U HV SU", "V HU IV"], "retargeting": "N=I(Q-Q0);N2=0;H_Q=(1-N)H0(1+N)", "actual_projection_changed": false, "old_full_comparison_retained": true, "old_second_comparison": "-2z", "new_second_comparison": 0, "mixed_second_comparison": "2z", "free_background": "https://arxiv.org/pdf/math/9910179#page=13"}</metadata><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">One common resolution compares both middle models</text><text x="310" y="78" font-size="21" fill="#172554" text-anchor="middle">Z = K_F ⊗ C_B ⊗ B ⊗ Γ ⊗ L</text><rect x="18" y="108" width="584" height="272" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="149" font-size="23" fill="#172554" text-anchor="middle">U S_U = 1          V I_V = 1</text><text x="310" y="194" font-size="24" fill="#2563eb" text-anchor="middle">X_sep  ←ᵁ  Z  →ⱽ  X_joint</text><text x="310" y="236" font-size="24" fill="#15803d" text-anchor="middle">J = V S_U          K = U I_V</text><text x="310" y="278" font-size="21" fill="#172554" text-anchor="middle">δ(U H_V S_U) = 1 − K J</text><text x="310" y="317" font-size="21" fill="#172554" text-anchor="middle">δ(V H_U I_V) = 1 − J K</text><text x="310" y="356" font-size="21" fill="#15803d" text-anchor="middle">S_U S_sep = I_V S_joint = I</text><rect x="18" y="402" width="584" height="261" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="443" font-size="20" fill="#172554" text-anchor="middle">Keep each actual endpoint projection fixed</text><text x="310" y="487" font-size="18" fill="#172554" text-anchor="middle">N = I(Q − Q₀)       N² = 0       A = 1 + N</text><text x="310" y="532" font-size="23" fill="#172554" text-anchor="middle">Q₀ A = Q       A I = I</text><text x="310" y="576" font-size="23" fill="#15803d" text-anchor="middle">H_Q = (1 − N) H₀ (1 + N)</text><text x="310" y="620" font-size="21" fill="#172554" text-anchor="middle">δH_Q = 1 − I Q       H_Q² = 0</text><text x="310" y="648" font-size="14" fill="#172554" text-anchor="middle">The source differential and original target diagram stay fixed.</text><rect x="18" y="686" width="584" height="327" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="726" font-size="20" fill="#172554" text-anchor="middle">Retain the full comparison to an old choice</text><text x="310" y="769" font-size="22" fill="#172554" text-anchor="middle">B_Q = (H_Q − H_old) H_Q</text><text x="310" y="811" font-size="22" fill="#172554" text-anchor="middle">δB_Q = H_old − H_Q</text><text x="310" y="854" font-size="21" fill="#b91c1c" text-anchor="middle">Original second comparison: −2z</text><text x="310" y="895" font-size="21" fill="#172554" text-anchor="middle">New second comparison: 0</text><text x="310" y="936" font-size="21" fill="#15803d" text-anchor="middle">Retained mixed second comparison: 2z</text><text x="310" y="984" font-size="14" fill="#172554" text-anchor="middle">Mixed faces carry the original higher data through the change.</text><text x="310" y="1055" font-size="11" fill="#172554" text-anchor="middle">Actual contractions: Theorem 30. Exact retargeting and mixed faces: Theorem 31.</text><text x="310" y="1085" font-size="12" fill="#172554" text-anchor="middle">Free module background: Keller, arXiv:math/9910179, §4.2.</text><text x="310" y="1107" font-size="11" fill="#172554" text-anchor="middle">Native connected-tree primitive and calibrated product-face extraction remain.</text></g></svg>