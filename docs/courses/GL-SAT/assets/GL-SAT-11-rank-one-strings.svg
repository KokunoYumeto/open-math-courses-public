<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
<title id="title">Two integral rank-one weight strings</title>
<desc id="desc">For original PGL2, IC of three times the fundamental coweight has weights minus three, minus one, one, three in units of the fundamental coweight. Its dual root step is twice that generator. For original SL2, IC of twice the coroot has weights minus two, minus one, zero, one, two in coroot units. Its dual root step is one generator. All displayed weight spaces have dimension one.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0a6c72"/></marker></defs>
<rect x="1" y="1" width="678" height="418" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="system-ui,sans-serif" fill="#17233a" text-anchor="middle">
<text x="340" y="34" font-size="22" font-weight="700">The integral root step matters</text>
<text x="340" y="67" font-size="18">Original G = PGL₂: IC of 3ω∨</text>
<text x="340" y="94" font-size="17">Character lattice ℤω∨; dual group SL₂</text>
<line x1="100" y1="154" x2="580" y2="154" stroke="#64748b" stroke-width="2"/>
<path d="M164 146Q220 110 276 146" fill="none" stroke="#0a6c72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="220" y="119" font-size="17" fill="#0a6c72">+2ω∨</text>
<g fill="#146c94" stroke="#fff" stroke-width="2"><circle cx="160" cy="154" r="8"/><circle cx="280" cy="154" r="8"/><circle cx="400" cy="154" r="8"/><circle cx="520" cy="154" r="8"/></g>
<g font-size="19"><text x="160" y="185">−3ω∨</text><text x="280" y="185">−ω∨</text><text x="400" y="185">ω∨</text><text x="520" y="185">3ω∨</text></g>
<line x1="40" y1="208" x2="640" y2="208" stroke="#cbd5e1"/>
<text x="340" y="239" font-size="18">Original G = SL₂: IC of 2α∨</text>
<text x="340" y="266" font-size="17">Character lattice ℤα∨; dual group PGL₂</text>
<line x1="100" y1="324" x2="580" y2="324" stroke="#64748b" stroke-width="2"/>
<path d="M164 316Q205 284 246 316" fill="none" stroke="#0a6c72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="205" y="289" font-size="17" fill="#0a6c72">+α∨</text>
<g fill="#146c94" stroke="#fff" stroke-width="2"><circle cx="160" cy="324" r="8"/><circle cx="250" cy="324" r="8"/><circle cx="340" cy="324" r="8"/><circle cx="430" cy="324" r="8"/><circle cx="520" cy="324" r="8"/></g>
<g font-size="19"><text x="160" y="355">−2α∨</text><text x="250" y="355">−α∨</text><text x="340" y="355">0</text><text x="430" y="355">α∨</text><text x="520" y="355">2α∨</text></g>
<text x="340" y="394" font-size="17">Every dot has multiplicity one. Proof: §§3.1–3.3.</text>
</g></svg>
