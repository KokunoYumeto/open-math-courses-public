<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">All highest lines have finite equations</text>
<text x="310" y="84" font-size="18" text-anchor="middle">G split; derived group simply connected; any char(k)</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="22" text-anchor="middle">Y=G/B; Aᵢ is the fundamental flag line.</text>
<text x="310" y="198" font-size="20" text-anchor="middle">W=P(⊕Aᵢ); O_W(1) is globally generated.</text>
<text x="310" y="237" font-size="22" text-anchor="middle">B₀=⊕ H⁰(Y,⊗Aᵢⁿⁱ)=⊕ H⁰(W,O_W(n))</text>
<text x="310" y="276" font-size="18" text-anchor="middle">Projective coherent finiteness gives finite generators.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="22" text-anchor="middle">X*(T)=⊕ Zωᵢ ⊕ C; dominant: nᵢ≥0.</text>
<text x="310" y="443" font-size="25" text-anchor="middle">B_G=B₀⊗k[C]; uᶜu⁻ᶜ=1.</text>
<text x="310" y="482" font-size="20" text-anchor="middle">C_G=Spec B_G retains the full central torus.</text>
<text x="310" y="521" font-size="20" text-anchor="middle">Extra homogeneous generators are allowed.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="22" text-anchor="middle">Choose sᵢ∈H⁰(Y,Aᵢ); F=∏sᵢ.</text>
<text x="310" y="688" font-size="21" text-anchor="middle">U=Y_F is affine; B_G[F⁻¹]=Γ(Q|_U,O).</text>
<text x="310" y="727" font-size="22" text-anchor="middle">Q=G/N: the actual torus frame torsor.</text>
<text x="310" y="766" font-size="19" text-anchor="middle">Fundamental vectors unimodular ⇔ point in Q.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="22" text-anchor="middle">All weights obey κ_λ⊗κ_μ=Δκ_(λ+μ).</text>
<text x="310" y="933" font-size="20" text-anchor="middle">Finite homogeneous generators + finite relations</text>
<text x="310" y="972" font-size="19" text-anchor="middle">give the entire parameter functor on every ring.</text>
<text x="310" y="1011" font-size="18" text-anchor="middle">Geometric generic nonzero is the injection open.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Proposition J.1.1.1–Theorem J.4.1.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Exact algebra and maps; panels show the construction.</text>
</svg>