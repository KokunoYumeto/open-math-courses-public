<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Use the ordered retraction at the central Taylor map</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.55: actual parameter bars; target-to-source word order</text><rect x="25" y="105" width="570" height="400" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="147" font-size="19" fill="#172554" text-anchor="middle">Exercise C.55.4.1: the square and its two cuts</text><polygon points="155,225 445,225 155,385" fill="#f0fdf4"/><path d="M155,377 L155,233 M161.0,246.0 L155,233 L149.0,246.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M163,225 L437,225 M424.0,231.0 L437,225 L424.0,219.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M163,385 L437,385 M424.0,391.0 L437,385 L424.0,379.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M445,377 L445,233 M451.0,246.0 L445,233 L439.0,246.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M155,385 L445,225" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" fill="none"/><g fill="#172554"><circle cx="155" cy="225" r="5"/><circle cx="445" cy="225" r="5"/><circle cx="155" cy="385" r="5"/></g><circle cx="445" cy="385" r="6" fill="#ef4444"/><text x="155" y="205" font-size="22" fill="#172554" text-anchor="middle">01</text><text x="445" y="205" font-size="22" fill="#172554" text-anchor="middle">11</text><text x="155" y="420" font-size="22" fill="#172554" text-anchor="middle">00</text><text x="445" y="420" font-size="22" fill="#b91c1c" text-anchor="middle">10</text><text x="300" y="215" font-size="17" fill="#2563eb" text-anchor="middle">A_top</text><text x="300" y="377" font-size="17" fill="#2563eb" text-anchor="middle">A_bottom</text><text x="103" y="310" font-size="17" fill="#15803d" text-anchor="middle">B_left</text><text x="508" y="310" font-size="17" fill="#15803d" text-anchor="middle">B_right</text><text x="310" y="458" font-size="20" fill="#172554" text-anchor="middle">w = sA_top | sB_left;     r₂(w) = a ⊗ b</text><text x="310" y="490" font-size="17" fill="#172554" text-anchor="middle">The full face {00,01,11} omits the red corner.</text><rect x="25" y="545" width="570" height="210" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="587" font-size="22" fill="#172554" text-anchor="middle">The retraction is a linear chain map</text><text x="310" y="631" font-size="28" fill="#172554" text-anchor="middle">r₂ j₂ = Id</text><text x="310" y="676" font-size="23" fill="#172554" text-anchor="middle">Δr₂(w) − (r₂⊗r₂)Δw</text><text x="310" y="719" font-size="22" fill="#172554" text-anchor="middle">= −sB_right ⊗ sA_bottom ≠ 0</text><text x="310" y="747" font-size="15" fill="#172554" text-anchor="middle">The other odd-letter cut is missing in the source word.</text><rect x="25" y="795" width="570" height="260" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="837" font-size="19" fill="#172554" text-anchor="middle">Exercise C.55.4.2: one common signed relation</text><text x="310" y="882" font-size="26" fill="#172554" text-anchor="middle">ABC − ACB − BAC</text><text x="310" y="922" font-size="26" fill="#172554" text-anchor="middle">+ BCA + CAB − CBA</text><text x="310" y="968" font-size="19" fill="#172554" text-anchor="middle">r₃ retains only ABC; its central value is λ.</text><text x="310" y="1010" font-size="16" fill="#172554" text-anchor="middle">The groupings (AB)|C and A|(BC) give that same value.</text><text x="310" y="1041" font-size="15" fill="#172554" text-anchor="middle">A,B,C label the three odd suspended factor arrows.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.55.1–2 and Proposition C.55.3 retain the full cut domains.</text></g></svg>