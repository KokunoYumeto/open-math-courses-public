<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="20" fill="#172554" text-anchor="middle">Keep unit vertices and their full execution diagram</text><text x="310" y="77" font-size="16" fill="#172554" text-anchor="middle">u = nullary unit;   ι = unary identity;   μ = binary convolution</text><rect x="25" y="104" width="570" height="304" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="18" fill="#172554" text-anchor="middle">1. Different contractions can have one quotient shape</text><text x="115" y="235" font-size="25" fill="#172554" text-anchor="middle">μ(u,u)</text><text x="325" y="235" font-size="25" fill="#172554" text-anchor="middle">ι(u)</text><text x="525" y="235" font-size="26" fill="#172554" text-anchor="middle">u</text><path d="M190,205 L270,205 M257.0,211.0 L270,205 L257.0,199.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M190,253 L270,253 M257.0,259.0 L270,253 L257.0,247.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M405,226 L481,226 M468.0,232.0 L481,226 L468.0,220.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="230" y="189" font-size="16" fill="#172554" text-anchor="middle">aL</text><text x="230" y="281" font-size="16" fill="#172554" text-anchor="middle">aR</text><text x="444" y="210" font-size="16" fill="#172554" text-anchor="middle">b</text><text x="115" y="316" font-size="17" fill="#172554" text-anchor="middle">V=3, h=0</text><text x="325" y="316" font-size="17" fill="#172554" text-anchor="middle">V=2, h=1</text><text x="525" y="316" font-size="17" fill="#172554" text-anchor="middle">V=1, h=2</text><text x="310" y="359" font-size="24" fill="#172554" text-anchor="middle">b aL = b aR;    aL ≠ aR</text><text x="310" y="398" font-size="17" fill="#172554" text-anchor="middle">C.44.1 and C.44.4.1 retain both index arrows.</text><rect x="25" y="442" width="570" height="324" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="485" font-size="21" fill="#172554" text-anchor="middle">2. Unit creation raises execution height</text><text x="77" y="579" font-size="24" fill="#172554" text-anchor="middle">∅</text><text x="230" y="548" font-size="20" fill="#172554" text-anchor="middle">{ℓ}</text><text x="230" y="621" font-size="20" fill="#172554" text-anchor="middle">{r}</text><text x="393" y="579" font-size="20" fill="#172554" text-anchor="middle">{ℓ,r}</text><text x="538" y="579" font-size="19" fill="#172554" text-anchor="middle">{ℓ,r,b}</text><path d="M110,563 L190,539 M179.2723456055231,548.4824802236894 L190,539 L175.82417097872698,536.9885648010356" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M110,584 L190,606 M175.87439099542445,608.3381980775491 L190,606 L179.05626879167698,596.7677333639037" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M272,541 L350,560 M335.9493104288665,562.752839002855 L350,560 L338.7893434272871,551.0937561672337" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M272,606 L350,584 M339.1169152023076,593.3036802012019 L350,584 L335.8593932220459,581.7542840893651" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M433,571 L484,571 M471.0,577.0 L484,571 L471.0,565.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="77" y="617" font-size="16" fill="#172554" text-anchor="middle">m=0</text><text x="230" y="518" font-size="16" fill="#172554" text-anchor="middle">m=1</text><text x="230" y="657" font-size="16" fill="#172554" text-anchor="middle">m=1</text><text x="393" y="617" font-size="16" fill="#172554" text-anchor="middle">m=2</text><text x="538" y="617" font-size="16" fill="#172554" text-anchor="middle">m=1</text><text x="310" y="708" font-size="22" fill="#172554" text-anchor="middle">Frontier arity: 0 → 1 → 2 → 1</text><text x="310" y="748" font-size="21" fill="#172554" text-anchor="middle">Execution height: 0 → 1 → 2 → 3</text><rect x="25" y="805" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="847" font-size="19" fill="#172554" text-anchor="middle">3. The actual finite-frame unit maps remain</text><text x="310" y="890" font-size="18" fill="#172554" text-anchor="middle">F₀ selects IC₀;   F₁ = Id;   Fᵣ = ordered convolution</text><text x="310" y="934" font-size="17" fill="#172554" text-anchor="middle">Variable inputs + fixed IC₀ inputs: one expanded chain.</text><text x="310" y="978" font-size="17" fill="#172554" text-anchor="middle">Contractions use tensor, proper and identity-unit maps.</text><text x="310" y="1015" font-size="16" fill="#172554" text-anchor="middle">V(graft) = Σ V;   height jumps add, even for empty inputs.</text><text x="310" y="1070" font-size="15" fill="#172554" text-anchor="middle">C.44.2: all-arity grafting; C.44.3: the native execution diagram.</text><text x="310" y="1104" font-size="16" fill="#172554" text-anchor="middle">mJ = n + ΣJ(1−r(v));  empty inputs retain their true type.</text></g></svg>