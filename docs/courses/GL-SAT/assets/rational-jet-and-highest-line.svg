<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="43" font-size="23" text-anchor="middle">Finite jets descend maps; highest lines detect objects</text>
<text x="310" y="83" font-size="21" text-anchor="middle">G split over algebraically closed k,   E/Q_ℓ finite</text>
<rect x="28" y="112" width="564" height="184" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="155" font-size="24" text-anchor="middle">J_nG = G × A^((n−1)dim G)</text>
<text x="310" y="197" font-size="20" text-anchor="middle">q : J_nG → J_mG forgets affine coordinates.</text>
<text x="310" y="237" font-size="19" text-anchor="middle">B → R(q×1)_* (q×1)* B is an isomorphism.</text>
<text x="310" y="276" font-size="19" text-anchor="middle">Group multiplication retains its cross terms.</text>
<path d="M310,311 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="366" width="564" height="169" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="408" font-size="19" text-anchor="middle">Descend the action isomorphism and its inverse.</text>
<text x="310" y="449" font-size="23" text-anchor="middle">Identity section fixes normalization.</text>
<text x="310" y="491" font-size="18" text-anchor="middle">Full faithfulness for q×q×1 descends the cocycle.</text>
<text x="310" y="524" font-size="19" text-anchor="middle">Thus jet inflation is an equivalence of hearts.</text>
<path d="M310,551 L310,592" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="606" width="564" height="165" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="648" font-size="18" text-anchor="middle">Smooth connected stabilizer ⇒ constant orbit systems.</text>
<text x="310" y="690" font-size="24" text-anchor="middle">Simple objects: IC_λ = j_!* E[d_λ]</text>
<text x="310" y="732" font-size="24" text-anchor="middle">Raw duality: D IC_λ = IC_λ(d_λ)</text>
<text x="310" y="756" font-size="18" text-anchor="middle">Finite orbit induction gives composition series.</text>
<path d="M310,787 L310,828" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="842" width="564" height="132" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="883" font-size="24" text-anchor="middle">F_λ(IC_λ) = E(−d_λ), in degree d_λ</text>
<text x="310" y="925" font-size="21" text-anchor="middle">Every simple has nonzero cohomology.</text>
<text x="310" y="963" font-size="18" text-anchor="middle">Exactness + composition series ⇒ faithful cohomology.</text>
<text x="310" y="1020" font-size="19" text-anchor="middle">Theorems B.2.1.1, B.2.3.1 and B.3.2.1</text>
</svg>