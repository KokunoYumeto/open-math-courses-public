ne"/><path d="M 150.0 429.0 L 145.0 439.0 L 140.0 429.0" stroke="#15803d" stroke-width="2" fill="none"/><path d="M 145 447 L 303.06702034500665 538.0082844410645" stroke="#15803d" stroke-width="3" fill="none"/><path d="M 296.89561800059965 528.6855277080242 L 303.06702034500665 538.0082844410645 L 291.90597355193023 537.3517522767659" stroke="#15803d" stroke-width="2" fill="none"/><path d="M 310 162 L 151.93297965499335 253.00828444106443" stroke="#7e22ce" stroke-width="3" fill="none"/><path d="M 163.09402644806977 252.35175227676584 L 151.93297965499335 253.00828444106443 L 158.1043819994003 243.68552770802413" stroke="#7e22ce" stroke-width="2" fill="none"/><path d="M 310 542 L 468.06702034500665 450.99171555893554" stroke="#7e22ce" stroke-width="3" fill="none"/><path d="M 456.90597355193023 451.6482477232342 L 468.06702034500665 450.99171555893554 L 461.89561800059965 460.31447229197585" stroke="#7e22ce" stroke-width="2" fill="none"/><circle cx="310" cy="162" r="4" fill="#334155"/><text x="310" y="145" font-size="17" fill="#172554" text-anchor="middle">0</text><circle cx="475" cy="257" r="4" fill="#334155"/><text x="497" y="262" font-size="17" fill="#172554" text-anchor="middle">1</text><circle cx="475" cy="447" r="4" fill="#334155"/><text x="497" y="452" font-size="17" fill="#172554" text-anchor="middle">2</text><circle cx="310" cy="542" r="4" fill="#334155"/><text x="310" y="570" font-size="17" fill="#172554" text-anchor="middle">3</text><circle cx="145" cy="447" r="4" fill="#334155"/><text x="123" y="452" font-size="17" fill="#172554" text-anchor="middle">4</text><circle cx="145" cy="257" r="4" fill="#334155"/><text x="123" y="262" font-size="17" fill="#172554" text-anchor="middle">5</text><text x="451" y="191" font-size="17" fill="#2563eb" text-anchor="middle">G(c₁)ν(d₀)</text><text x="395" y="384" font-size="17" fill="#2563eb" text-anchor="middle">ν(c₁)F(d₀)</text><text x="225" y="384" font-size="17" fill="#15803d" text-anchor="middle">−G(d₁)ν(c₀)</text><text x="169" y="507" font-size="17" fill="#15803d" text-anchor="middle">−ν(d₁)F(c₀)</text><text x="169" y="191" font-size="18" fill="#7e22ce" text-anchor="middle">X_G β₀₀</text><text x="451" y="507" font-size="18" fill="#7e22ce" text-anchor="middle">−β₁₁ X_F</text><text x="310" y="296" font-size="23" fill="#172554" text-anchor="middle">Λ_β(c,d)</text><text x="310" y="330" font-size="17" fill="#172554" text-anchor="middle">degree −2</text><text x="310" y="603" font-size="19" fill="#172554" text-anchor="middle">Every vertex maps F(x₀₀) → G(x₁₁).</text><rect x="17" y="633" width="586" height="324" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="676" font-size="20" fill="#172554" text-anchor="middle">v₀ = G(c₁)G(d₀)β₀₀</text><text x="310" y="725" font-size="20" fill="#172554" text-anchor="middle">v₁ = G(c₁)β₀₁F(d₀)</text><text x="310" y="774" font-size="20" fill="#172554" text-anchor="middle">v₂ = β₁₁F(c₁)F(d₀)</text><text x="310" y="823" font-size="20" fill="#172554" text-anchor="middle">v₃ = β₁₁F(d₁)F(c₀)</text><text x="310" y="872" font-size="20" fill="#172554" text-anchor="middle">v₄ = G(d₁)β₁₀F(c₀)</text><text x="310" y="921" font-size="20" fill="#172554" text-anchor="middle">v₅ = G(d₁)G(c₀)β₀₀</text><text x="310" y="994" font-size="15" fill="#172554" text-anchor="middle">An edge has boundary v_end − v_start; all six differences cancel.</text><text x="310" y="1030" font-size="14" fill="#172554" text-anchor="middle">Native β = α_(n,m,i); G = F_n ∘ ι_i F_m. Both composite terms remain.</text><text x="310" y="1065" font-size="13" fill="#172554" text-anchor="middle">Theorem 18 and Exercise 19. Schematic of this prescribed surface piece.</text><text x="310" y="1100" font-size="12" fill="#172554" text-anchor="middle">Free bar-convention background: Keller, arXiv:math/9910179, §4.2.</text></g></svg>