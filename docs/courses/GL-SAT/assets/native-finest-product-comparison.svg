<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">Use the entire represented module comparison</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.58: the specified native rootwise product family</text><rect x="25" y="105" width="570" height="540" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="19" fill="#172554" text-anchor="middle">Five typed full chain maps over identity pure cores</text><text x="310" y="628" font-size="17" fill="#172554" text-anchor="middle">The leading map is the actual calibrated identity.</text><text x="310" y="680" font-size="17" fill="#172554" text-anchor="middle">Mixed generator ↦ 0; the actual 00 → 11 arrow is retained.</text><rect x="25" y="715" width="570" height="340" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="755" font-size="22" fill="#172554" text-anchor="middle">An essential higher Taylor component</text><text x="310" y="800" font-size="26" fill="#172554" text-anchor="middle">F(e | sε) = e | sε − f</text><text x="310" y="845" font-size="21" fill="#172554" text-anchor="middle">D<tspan baseline-shift="sub" font-size="65%">new</tspan>(e | sε) = y,       D<tspan baseline-shift="sub" font-size="65%">new</tspan>(f) = y</text><text x="310" y="890" font-size="24" fill="#172554" text-anchor="middle">D<tspan baseline-shift="sub" font-size="65%">new</tspan> F(e | sε) = y − y = 0</text><text x="310" y="934" font-size="24" fill="#172554" text-anchor="middle">D<tspan baseline-shift="sub" font-size="65%">old</tspan>(e | sε) = 0</text><text x="310" y="980" font-size="18" fill="#172554" text-anchor="middle">The bare identity leaves the nonzero defect y.</text><text x="310" y="1020" font-size="18" fill="#172554" text-anchor="middle">Left z-action and right ε-action are both retained.</text><text x="310" y="1102" font-size="16" fill="#172554" text-anchor="middle">Lemma C.58.1.1; Theorem C.58.2.1; Exercises C.58.3.1–2.</text><text x="245" y="190" font-size="24" fill="#172554" text-anchor="middle">Z<tspan baseline-shift="sub" font-size="65%">old</tspan> | finest</text><path d="M245,202 L245,247 M239.0,234.0 L245,247 L251.0,234.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="405" y="234" font-size="23" fill="#172554" text-anchor="middle">I₀</text><text x="245" y="270" font-size="24" fill="#172554" text-anchor="middle">Y₀</text><path d="M245,282 L245,327 M239.0,314.0 L245,327 L251.0,314.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="405" y="314" font-size="23" fill="#172554" text-anchor="middle">φ₀</text><text x="245" y="350" font-size="24" fill="#172554" text-anchor="middle">Y<tspan baseline-shift="sub" font-size="65%">Q₀</tspan></text><path d="M245,362 L245,407 M239.0,394.0 L245,407 L251.0,394.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="405" y="394" font-size="23" fill="#172554" text-anchor="middle">R<tspan baseline-shift="sub" font-size="65%">β</tspan></text><text x="245" y="430" font-size="24" fill="#172554" text-anchor="middle">Y<tspan baseline-shift="sub" font-size="65%">Q₁</tspan></text><path d="M245,442 L245,487 M239.0,474.0 L245,487 L251.0,474.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="405" y="474" font-size="23" fill="#172554" text-anchor="middle">σ<tspan baseline-shift="sub" font-size="65%">Π</tspan></text><text x="245" y="510" font-size="24" fill="#172554" text-anchor="middle">Y<tspan baseline-shift="sub" font-size="65%">Π</tspan></text><path d="M245,522 L245,567 M239.0,554.0 L245,567 L251.0,554.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="405" y="554" font-size="23" fill="#172554" text-anchor="middle">P<tspan baseline-shift="sub" font-size="65%">Π</tspan></text><text x="245" y="590" font-size="24" fill="#172554" text-anchor="middle">Z<tspan baseline-shift="sub" font-size="65%">Π</tspan></text></g></svg>