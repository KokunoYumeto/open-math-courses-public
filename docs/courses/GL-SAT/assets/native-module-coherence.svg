<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">Transport the full native module coherence</text><text x="310" y="77" font-size="18" fill="#172554" text-anchor="middle">Actual Hom differentials and all higher parameter cells</text><rect x="25" y="105" width="570" height="315" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="19" fill="#172554" text-anchor="middle">C.53.2 and Exercise C.53.6.1: the middle term</text><text x="310" y="196" font-size="23" fill="#172554" text-anchor="middle">Y = ke</text><text x="130" y="285" font-size="25" fill="#172554" text-anchor="middle">X</text><text x="490" y="285" font-size="25" fill="#172554" text-anchor="middle">X</text><path d="M150,267 L278,207 M268.77563708991903,217.95039400675256 L278,207 L263.68243057515036,207.08488677524616" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M342,207 L470,267 M455.68243057515036,266.91511322475384 L470,267 L460.77563708991903,256.04960599324744" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M153,282 L467,282 M454.0,288.0 L467,282 L454.0,276.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="212" y="226" font-size="23" fill="#172554" text-anchor="middle">p</text><text x="408" y="226" font-size="23" fill="#172554" text-anchor="middle">i</text><text x="310" y="271" font-size="23" fill="#172554" text-anchor="middle">Ĥ = −h</text><text x="310" y="318" font-size="19" fill="#172554" text-anchor="middle">direct edge = Id_X</text><text x="310" y="362" font-size="26" fill="#172554" text-anchor="middle">∂Ĥ = ip − Id_X</text><text x="310" y="403" font-size="17" fill="#172554" text-anchor="middle">X: e survives; x → y is the acyclic pair; h(y)=x.</text><rect x="25" y="456" width="570" height="265" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="498" font-size="22" fill="#172554" text-anchor="middle">C.53.4: the path-projection kernel</text><text x="310" y="545" font-size="23" fill="#172554" text-anchor="middle">d_K(g,a) = (∂g, −∂a − gp)</text><text x="310" y="592" font-size="24" fill="#172554" text-anchor="middle">k(g,a) = (−ai, (−1)^r ah)</text><text x="310" y="638" font-size="22" fill="#172554" text-anchor="middle">d_K k + k d_K = Id;     k² = 0</text><text x="310" y="682" font-size="19" fill="#172554" text-anchor="middle">Degree-one example: k(0,x*) = (0,−y*).</text><text x="310" y="708" font-size="15" fill="#172554" text-anchor="middle">Omitting (−1)^r gives the opposite contraction value.</text><rect x="25" y="760" width="570" height="305" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="802" font-size="20" fill="#172554" text-anchor="middle">C.53.5: every original parameter generator</text><text x="310" y="848" font-size="21" fill="#172554" text-anchor="middle">o = Dv − H(dx) lies in the closed kernel.</text><text x="310" y="893" font-size="22" fill="#172554" text-anchor="middle">H(x) = v − ko;     D H(x) = H(dx)</text><text x="310" y="940" font-size="21" fill="#172554" text-anchor="middle">A q-arrow generator has degree 1−q.</text><text x="310" y="982" font-size="22" fill="#172554" text-anchor="middle">q=3: degree −2;     q=4: degree −3</text><text x="310" y="1025" font-size="18" fill="#172554" text-anchor="middle">Merges and proper splits use shorter strings.</text><text x="310" y="1054" font-size="16" fill="#172554" text-anchor="middle">The construction retains assigned full-face restrictions.</text><text x="310" y="1103" font-size="15" fill="#172554" text-anchor="middle">The whole nested-path product and grafting marks retain their scope.</text></g></svg>