<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">Derived weights retain the whole tensor diagram</text><text x="310" y="76" font-size="15" fill="#172554" text-anchor="middle">Resolve before taking primary vectors; retain all coherence.</text><rect x="25" y="103" width="570" height="337" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="144" font-size="21" fill="#172554" text-anchor="middle">1. The Laurent counterexample is repaired</text><text x="310" y="187" font-size="23" fill="#172554" text-anchor="middle">R  —t−a→  R, in degrees 0 and 1</text><text x="310" y="228" font-size="18" fill="#172554" text-anchor="middle">H¹ = E with F = a; termwise LF parts are zero.</text><text x="310" y="269" font-size="26" fill="#172554" text-anchor="middle">C → J(C) ← ΓW J(C)</text><text x="310" y="309" font-size="19" fill="#172554" text-anchor="middle">Explicit model: Pa —p→ Pa, in degrees 1 and 2</text><text x="310" y="349" font-size="19" fill="#172554" text-anchor="middle">p = t−a;  Pa = R[1/p]/R;  ej = p⁻ʲ mod R</text><text x="310" y="389" font-size="21" fill="#172554" text-anchor="middle">p ej = ej−1;   F ej = a ej + ej−1;   e0 = 0</text><text x="310" y="424" font-size="15" fill="#172554" text-anchor="middle">All j ≥ 1 are retained.  C.23.1.1; Exercise C.23.6.1.</text><rect x="25" y="471" width="570" height="263" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="511" font-size="20" fill="#172554" text-anchor="middle">2. Derived equivalence and diagonal truncation</text><text x="310" y="553" font-size="24" fill="#172554" text-anchor="middle">D⁺(LF W) ≃ D⁺W(E[t,t⁻¹])</text><text x="310" y="594" font-size="19" fill="#172554" text-anchor="middle">Tensor is over E, with diagonal Frobenius.</text><text x="310" y="635" font-size="21" fill="#172554" text-anchor="middle">Hⁿ Hom(P,Q): sole aⁿ; Jordan parts allowed</text><text x="310" y="676" font-size="25" fill="#172554" text-anchor="middle">C ← D(C) → H*(C)</text><text x="310" y="716" font-size="18" fill="#172554" text-anchor="middle">The entire Weil diagram is transported together.</text><rect x="25" y="769" width="570" height="283" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="808" font-size="22" fill="#172554" text-anchor="middle">3. Actual arithmetic monoidal Satake</text><text x="310" y="851" font-size="26" fill="#172554" text-anchor="middle">Dᵇsph(GrG,E) ≃ PerfH(A)</text><text x="310" y="893" font-size="25" fill="#172554" text-anchor="middle">* ↔ ⊗ᴸA;    ICλ ↔ A ⊗ Vλ</text><text x="310" y="934" font-size="19" fill="#172554" text-anchor="middle">A = Sym(h[−2]); linear coordinates have degree 2.</text><text x="310" y="974" font-size="18" fill="#172554" text-anchor="middle">Full H, centre, components and corrected symmetry.</text><text x="310" y="1016" font-size="17" fill="#172554" text-anchor="middle">Extend the diagram through shifts, cones and retracts.</text><text x="310" y="1084" font-size="18" fill="#172554" text-anchor="middle">C.23.2.1–C.23.5.1 prove these comparisons.</text><text x="310" y="1110" font-size="13" fill="#172554" text-anchor="middle">Complex coefficients and the remaining full-course upgrades still need proofs.</text></g></svg>