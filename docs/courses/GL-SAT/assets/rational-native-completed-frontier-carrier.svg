<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem70; Exercise70", "full_initial_frontier": 1, "serial_identity_stage_labels": [4, 2, 6, 0], "full_stage_frontiers": [1, 1, 1, 1, 1], "empty_initial_stage_frontiers": [0, 1, 2, 2, 1], "source": "Complete B_full(A_N), including B_full(k) at N=0", "simultaneous_source_letter_degree": -1, "two_separate_suspensions_degree": -2, "field": "q(b4 b3 b2 b1)=q(b4)q(b3)q(b2)q(b1), not q^4 of one coefficient", "essential_second_core": "phi2(u,w)=1"}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">Completed factors use the actual global frontier</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">Arbitrary frontier variables · full joint source bars</text><rect x="18" y="104" width="584" height="259" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="20" fill="#2563eb" text-anchor="middle">One completed variable; four identity graph factors</text><text x="59" y="205" font-size="24" fill="#2563eb" text-anchor="middle">x</text><text x="565" y="205" font-size="24" fill="#2563eb" text-anchor="middle">x</text><path d="M 83 198 L 125 198" stroke="#15803d" stroke-width="3"/><rect x="126" y="176" width="58" height="44" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="155" y="205" font-size="22" fill="#2563eb" text-anchor="middle">Id₄</text><path d="M 185 198 L 227 198" stroke="#15803d" stroke-width="3"/><rect x="228" y="176" width="58" height="44" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="257" y="205" font-size="22" fill="#2563eb" text-anchor="middle">Id₂</text><path d="M 287 198 L 329 198" stroke="#15803d" stroke-width="3"/><rect x="330" y="176" width="58" height="44" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="359" y="205" font-size="22" fill="#2563eb" text-anchor="middle">Id₆</text><path d="M 389 198 L 431 198" stroke="#15803d" stroke-width="3"/><rect x="432" y="176" width="58" height="44" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="461" y="205" font-size="22" fill="#2563eb" text-anchor="middle">Id₀</text><path d="M 490 198 L 544 198" stroke="#15803d" stroke-width="3"/><text x="310" y="260" font-size="18" fill="#172554" text-anchor="middle">Each factor retains its whole original parameter input.</text><text x="310" y="305" font-size="23" fill="#15803d" text-anchor="middle">q(b₄b₃b₂b₁) = q(b₄)q(b₃)q(b₂)q(b₁)</text><text x="310" y="340" font-size="18" fill="#172554" text-anchor="middle">The external variable is transported once.</text><rect x="18" y="384" width="584" height="261" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="426" font-size="21" fill="#15803d" text-anchor="middle">Empty initial frontier in the nullary example</text><circle cx="76" cy="478" r="23" fill="white" stroke="#2563eb" stroke-width="2"/><text x="76" y="486" font-size="25" fill="#2563eb" text-anchor="middle">0</text><circle cx="193" cy="478" r="23" fill="white" stroke="#2563eb" stroke-width="2"/><text x="193" y="486" font-size="25" fill="#2563eb" text-anchor="middle">1</text><path d="M 101 478 L 168 478" stroke="#15803d" stroke-width="3"/><text x="134.5" y="529" font-size="17" fill="#15803d" text-anchor="middle">r = 0</text><circle cx="310" cy="478" r="23" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="486" font-size="25" fill="#2563eb" text-anchor="middle">2</text><path d="M 218 478 L 285 478" stroke="#15803d" stroke-width="3"/><text x="251.5" y="529" font-size="17" fill="#15803d" text-anchor="middle">r = 0</text><circle cx="427" cy="478" r="23" fill="white" stroke="#2563eb" stroke-width="2"/><text x="427" y="486" font-size="25" fill="#2563eb" text-anchor="middle">2</text><path d="M 335 478 L 402 478" stroke="#15803d" stroke-width="3"/><text x="368.5" y="529" font-size="17" fill="#15803d" text-anchor="middle">r = 1</text><circle cx="544" cy="478" r="23" fill="white" stroke="#2563eb" stroke-width="2"/><text x="544" y="486" font-size="25" fill="#2563eb" text-anchor="middle">1</text><path d="M 452 478 L 519 478" stroke="#15803d" stroke-width="3"/><text x="485.5" y="529" font-size="17" fill="#15803d" text-anchor="middle">r = 2</text><text x="310" y="568" font-size="20" fill="#172554" text-anchor="middle">A₀ = k; the full source B_full(k) is retained.</text><text x="310" y="614" font-size="17" fill="#172554" text-anchor="middle">A nullary output keeps its entire coefficient Hom complex.</text><rect x="18" y="666" width="584" height="325" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="708" font-size="21" fill="#2563eb" text-anchor="middle">A joint source letter is not two separate bars</text><text x="310" y="755" font-size="23" fill="#172554" text-anchor="middle">|s(a ⊗ b)| = −1;      |sa ⊗ sb| = −2</text><text x="310" y="802" font-size="25" fill="#15803d" text-anchor="middle">b(su | sv) = −su | sw + st</text><text x="310" y="850" font-size="25" fill="#2563eb" text-anchor="middle">φ₁(t) = 1;      φ₂(u,w) = 1</text><text x="310" y="898" font-size="20" fill="#172554" text-anchor="middle">The whole bar images −s1 and +s1 cancel.</text><text x="310" y="945" font-size="19" fill="#b91c1c" text-anchor="middle">Dropping the second core leaves the defect −s1.</text><text x="310" y="1031" font-size="16" fill="#172554" text-anchor="middle">Original leaf labels determine every consecutive stage block.</text><text x="310" y="1070" font-size="17" fill="#172554" text-anchor="middle">Each edge uses its complete frontier category A_N.</text><text x="310" y="1105" font-size="13" fill="#172554" text-anchor="middle">Typed graph carrier, marked sections and entire comparison cubes: §70.</text></g></svg>