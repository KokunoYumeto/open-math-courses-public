<svg xmlns="http://www.w3.org/2000/svg" width="550" height="590" viewBox="0 0 550 590" role="img" aria-labelledby="title desc"><title id="title">GL2 Schubert surface: three slices, three weights</title><desc id="desc">For lambda=(2,0), slices indexed (2,0), (1,1), and (0,2) have complex dimensions 2, 1, and 0. With IC normalized as Lambda[2], their compact cohomology lies in degrees 2, 0, and minus 2.</desc><rect width="550" height="590" fill="#f5f7fb"/><g font-family="sans-serif" fill="#16233b"><text x="32" y="43" font-size="27" font-weight="700">GL₂: λ = (2, 0), IC = Λ[2]</text><text x="32" y="78" font-size="21">Closed slices, characteristic-zero coefficients</text><rect x="32" y="105" width="486" height="142" rx="12" fill="white" stroke="#3b70ad" stroke-width="2"/><text x="51" y="142" font-size="25" fill="#3b70ad" font-weight="700">ν = (2, 0)</text><text x="391" y="142" font-size="28">A²</text><text x="51" y="177" font-size="22">complex dimension 2</text><text x="51" y="208" font-size="22">top compact degree 4</text><text x="51" y="236" font-size="22" font-weight="700">after [2]: weight degree 2</text><rect x="32" y="264" width="486" height="142" rx="12" fill="white" stroke="#287b76" stroke-width="2"/><text x="51" y="301" font-size="25" fill="#287b76" font-weight="700">ν = (1, 1)</text><text x="391" y="301" font-size="28">A¹</text><text x="51" y="336" font-size="22">complex dimension 1</text><text x="51" y="367" font-size="22">top compact degree 2</text><text x="51" y="395" font-size="22" font-weight="700">after [2]: weight degree 0</text><rect x="32" y="423" width="486" height="142" rx="12" fill="white" stroke="#945b9b" stroke-width="2"/><text x="51" y="460" font-size="25" fill="#945b9b" font-weight="700">ν = (0, 2)</text><text x="391" y="460" font-size="28">point</text><text x="51" y="495" font-size="22">complex dimension 0</text><text x="51" y="526" font-size="22">top compact degree 0</text><text x="51" y="554" font-size="22" font-weight="700">after [2]: weight degree −2</text></g></svg>