<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The parity gap gives natural splitting maps</text>
<text x="310" y="81" font-size="21" text-anchor="middle">One component: h_ν = ⟨2ρ,ν⟩ has fixed parity.</text>
<rect x="28" y="112" width="564" height="230" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="155" font-size="23" text-anchor="middle">Closed lower part Y_&lt;h</text>
<text x="310" y="191" font-size="20" text-anchor="middle">heights ≤ h−2; H_c^(h−1) = H_c^h = 0</text>
<text x="310" y="233" font-size="23" text-anchor="middle">Middle piece Y_h</text>
<text x="310" y="269" font-size="22" text-anchor="middle">H_c^h(Y_h,P) = ⊕_(h_ν=h) F_ν(P)</text>
<text x="310" y="310" font-size="21" text-anchor="middle">Upper open U_&gt;h: heights ≥ h+2</text>
<path d="M310,356 L310,398" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="412" width="564" height="143" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="451" font-size="23" text-anchor="middle">H_c^h(U_≥h,P) → H_c^h(Y_h,P)</text>
<text x="310" y="493" font-size="21" text-anchor="middle">Restriction is an isomorphism:</text>
<text x="310" y="532" font-size="19" text-anchor="middle">H_c^h(U_&gt;h,P) = H_c^(h+1)(U_&gt;h,P) = 0.</text>
<path d="M310,570 L310,611" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="625" width="564" height="148" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="667" font-size="25" text-anchor="middle">H_c^h(U_≥h,P) → H^h(Y,P)</text>
<text x="310" y="709" font-size="21" text-anchor="middle">Extension by zero is an isomorphism:</text>
<text x="310" y="749" font-size="19" text-anchor="middle">H_c^(h−1)(Y_&lt;h,P) = H_c^h(Y_&lt;h,P) = 0.</text>
<path d="M310,789 L310,828" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="842" width="564" height="136" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="888" font-size="25" text-anchor="middle">⊕_(h_ν=h) F_ν(P) → H^h(Y,P)</text>
<text x="310" y="928" font-size="20" text-anchor="middle">inverse restriction, then extension by zero</text>
<text x="310" y="962" font-size="18" text-anchor="middle">Natural in P and compatible with closed support stages.</text>
<text x="310" y="1021" font-size="20" text-anchor="middle">Theorem Q.4.3.1 and Exercise Q.5.4</text>
</svg>