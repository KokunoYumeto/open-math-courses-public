<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">Change every input core in the whole graph</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">Core nodes and cross modules; the cobar recovers functors.</text><rect x="25" y="104" width="570" height="321" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="21" fill="#172554" text-anchor="middle">1. Keep all paths and their genuine grafting</text><text x="110" y="200" font-size="24" fill="#172554" text-anchor="middle">C^(⊗3)</text><text x="310" y="200" font-size="24" fill="#172554" text-anchor="middle">C^(⊗2)</text><text x="515" y="200" font-size="27" fill="#172554" text-anchor="middle">C</text><path d="M185,191 L240,191 M227.0,197.0 L240,191 L227.0,185.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M380,191 L466,191 M453.0,197.0 L466,191 L453.0,185.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="213" y="177" font-size="16" fill="#172554" text-anchor="middle">F</text><text x="425" y="177" font-size="16" fill="#172554" text-anchor="middle">G</text><path d="M160,220 Q310,275 460,220" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="310" y="283" font-size="18" fill="#172554" text-anchor="middle">Direct and two-cross sectors both remain.</text><text x="310" y="331" font-size="21" fill="#172554" text-anchor="middle">μA = μB ∘ (f₀⊗1⊗f₁⊗…⊗1⊗f_q)</text><text x="310" y="374" font-size="18" fill="#172554" text-anchor="middle">Q DA = DB Q;  central projection proves DA²=0.</text><text x="310" y="416" font-size="18" fill="#172554" text-anchor="middle">C.40.1: no injectivity assumption on Q.</text><rect x="25" y="459" width="570" height="320" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="501" font-size="19" fill="#172554" text-anchor="middle">2. Recover the original nested convolution graph</text><text x="310" y="549" font-size="18" fill="#172554" text-anchor="middle">Cross count q ≤ H;   central degree p ≤ |word|+q</text><text x="310" y="595" font-size="21" fill="#172554" text-anchor="middle">Associated comparison: ⊗ fᵢ, with each fᵢ = σₙᵢ</text><text x="310" y="641" font-size="18" fill="#172554" text-anchor="middle">Q is a quasi-isomorphism; ΩQ recovers the graph.</text><text x="310" y="686" font-size="22" fill="#172554" text-anchor="middle">W = |word| + total endpoint height jump</text><text x="310" y="730" font-size="22" fill="#172554" text-anchor="middle">core letters ≤ W;  cross letters ≤ H</text><text x="310" y="771" font-size="17" fill="#172554" text-anchor="middle">C.40.2 retains every higher grafting operation.</text><rect x="25" y="821" width="570" height="199" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="863" font-size="19" fill="#172554" text-anchor="middle">3. The coordinate group has one common core</text><text x="310" y="910" font-size="21" fill="#172554" text-anchor="middle">G|Aₙ = g^(⊗n);   output restriction = g</text><text x="310" y="954" font-size="23" fill="#172554" text-anchor="middle">(h,H)(g,G)=(hg,HG)</text><text x="310" y="998" font-size="18" fill="#172554" text-anchor="middle">γG(w)−Gγ(w)=sa₂₀;  w=sz₂₁|u³|sz₁₀</text><text x="310" y="1061" font-size="17" fill="#172554" text-anchor="middle">C.40.3: inverse, finite domains and target stabilizers.</text><text x="310" y="1102" font-size="16" fill="#172554" text-anchor="middle">Full geometric marked coherence and E-comparison remain.</text></g></svg>