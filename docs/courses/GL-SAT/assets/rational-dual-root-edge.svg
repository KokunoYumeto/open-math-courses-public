<text x="310" y="774" font-size="23" text-anchor="middle">Raw vertex lines in this A₂ example</text>
<text x="310" y="817" font-size="23" text-anchor="middle">d_λ=8;  h_G(λ)=8;  h_G(s₁λ)=4</text>
<text x="310" y="860" font-size="25" text-anchor="middle">F_λ=E(−8);   F_(s₁λ)=E(−6)</text>
<text x="310" y="910" font-size="22" text-anchor="middle">Nonprimitive roots must remain nonprimitive.</text>
<text x="310" y="951" font-size="25" text-anchor="middle">G=PGL₂:  L=ℤω∨,  α∨=2ω∨</text>
<text x="310" y="992" font-size="25" text-anchor="middle">I_(3ω∨):  3ω∨, ω∨, −ω∨, −3ω∨</text>
<text x="310" y="1033" font-size="18" text-anchor="middle">Dual group SL₂;  centre μ₂;  central character [3] mod 2.</text>
<text x="310" y="1063" font-size="16" text-anchor="middle">Replacing the root step by ω∨ loses both the string and centre.</text>
<text x="310" y="1126" font-size="17" text-anchor="middle">Lemma B.1.1.1; Theorem B.1.2.1; Exercise B.5.1</text>
<text x="310" y="1167" font-size="16" text-anchor="middle">Only the selected edge and vertex lines are assigned multiplicities here.</text>
