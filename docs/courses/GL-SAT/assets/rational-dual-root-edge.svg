<text x="310" y="303" font-size="20" text-anchor="middle">Three exact weights on this face:</text>
<text x="310" y="345" font-size="24" text-anchor="middle">λ,  λ−α₁∨,  λ−2α₁∨</text>
<text x="310" y="387" font-size="22" text-anchor="middle" style="fill:#15803d">Each adjacent step is α₁∨.</text>
<text x="310" y="426" font-size="17" text-anchor="middle">These determine β₁=α₁∨ in the reconstructed group.</text>
