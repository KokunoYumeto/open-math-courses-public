<text x="310" y="622" font-size="18" text-anchor="middle">Vertices drawn in the stated Euclidean coordinates.</text>
<text x="310" y="700" font-size="23" text-anchor="middle">r_w=(d_λ+h_G(wλ))/2;  F_(wλ)(I_λ)=E(−r_w)</text>
