<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="23" text-anchor="middle">The actual fusion maps survive curve coordinates</text>
<text x="310" y="82" font-size="24" text-anchor="middle">Aut_m = G_m × A^(m−2) as a scheme</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="24" text-anchor="middle">C_m → X: the full coordinate torsor.</text>
<text x="310" y="195" font-size="25" text-anchor="middle">P_X locally equals P ⊠ E_X[1].</text>
<text x="310" y="237" font-size="18" text-anchor="middle">Finite coordinate and bundle frames descend coefficients.</text>
<text x="310" y="275" font-size="23" text-anchor="middle">The two-step support is proper over X².</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="21" text-anchor="middle">Remove the other branches of U ×_(A¹) U.</text>
<text x="310" y="440" font-size="22" text-anchor="middle">(z,z) : W → A² is étale;   D_W = D_X.</text>
<text x="310" y="482" font-size="18" text-anchor="middle">The sum of the two graphs is finite flat of rank 2.</text>
<text x="310" y="518" font-size="17" text-anchor="middle">Its completion comparison retains nilpotent parameters.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="25" text-anchor="middle">m_X proper;   F_X = Rm_X* A_X[2]</text>
<text x="310" y="683" font-size="29" text-anchor="middle">F_X = j_!*j*F_X</text>
<text x="310" y="725" font-size="28" text-anchor="middle">i*F_X[−1] = (P*Q)_X</text>
<text x="310" y="761" font-size="18" text-anchor="middle">The one common base shift fixes point interchange.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="21" text-anchor="middle">Proper cohomology sheaves extend constantly.</text>
<text x="310" y="927" font-size="19" text-anchor="middle">ULA + normality retain the actual tensor map μ.</text>
<text x="310" y="968" font-size="20" text-anchor="middle">Thus μ, c′ and the adjusted c are unchanged.</text>
<text x="310" y="1001" font-size="18" text-anchor="middle">This does not assert a global derived splitting over X.</text>
<text x="310" y="1058" font-size="19" text-anchor="middle">Example z(u)=u², char(k)≠2:   W={x₁+x₂≠0}.</text>
<text x="310" y="1098" font-size="17" text-anchor="middle">x₁²−x₂² = (x₁−x₂)(x₁+x₂): the second factor is a unit.</text>
<text x="310" y="1140" font-size="19" text-anchor="middle">Theorem B.3.1.1; Exercises B.4.3–B.4.4</text>
</svg>