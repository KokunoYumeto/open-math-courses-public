<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem34; Exercise34", "joint_operator_bar": "B_full(tensor_v O_v^op)", "compatible_states": [[0, 0], [0, 1], [1, 1]], "forbidden_state": [1, 0], "original_arrows": {"alpha": "a-&gt;b", "beta": "b-&gt;c", "gamma": "a-&gt;c"}, "bar_boundary": "b(s beta | s alpha) = -s gamma", "left_module_boundary": "-s gamma tensor 1_a + s beta tensor 1_b", "operator_images": "all identity; original index labels retained"}</metadata><text x="310" y="40" font-size="23" fill="#172554" text-anchor="middle">Use the full joint operator bar</text><text x="310" y="79" font-size="17" fill="#172554" text-anchor="middle">A simultaneous operator is an original single letter</text><rect x="18" y="108" width="584" height="231" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="150" font-size="21" fill="#172554" text-anchor="middle">O_T = ⊗ᵥ Oᵥᵒᵖ       X_T : O_T → DGMod</text><text x="310" y="195" font-size="20" fill="#2563eb" text-anchor="middle">s(a₁ ⊗ a₂) has degree |a₁| + |a₂| − 1</text><text x="310" y="238" font-size="20" fill="#172554" text-anchor="middle">sa₁ ⊗ sa₂ has degree |a₁| + |a₂| − 2</text><text x="310" y="284" font-size="16" fill="#172554" text-anchor="middle">Joint letters are not identified with separate-bar shuffles.</text><text x="310" y="318" font-size="16" fill="#15803d" text-anchor="middle">Every original operator differential is retained.</text><rect x="18" y="360" width="584" height="411" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="401" font-size="20" fill="#172554" text-anchor="middle">The actual compatible domain has three states</text><path d="M150 588 L310 468" stroke="#15803d" stroke-width="3"/><path d="M310 468 L470 588" stroke="#15803d" stroke-width="3"/><path d="M150 588 L470 588" stroke="#15803d" stroke-width="3"/><circle cx="150" cy="588" r="5" fill="#15803d"/><circle cx="310" cy="468" r="5" fill="#15803d"/><circle cx="470" cy="588" r="5" fill="#15803d"/><text x="123" y="625" font-size="18" fill="#172554" text-anchor="middle">a = (0,0)</text><text x="310" y="448" font-size="18" fill="#172554" text-anchor="middle">b = (0,1)</text><text x="495" y="625" font-size="18" fill="#172554" text-anchor="middle">c = (1,1)</text><text x="207" y="515" font-size="22" fill="#15803d" text-anchor="middle">α</text><text x="413" y="515" font-size="22" fill="#15803d" text-anchor="middle">β</text><text x="310" y="576" font-size="21" fill="#15803d" text-anchor="middle">γ = β α</text><text x="310" y="677" font-size="17" fill="#b91c1c" text-anchor="middle">(1,0) is forbidden: execute the inner tree first.</text><text x="310" y="721" font-size="17" fill="#172554" text-anchor="middle">Both β | α and γ belong to the full compatible bar.</text><text x="310" y="750" font-size="15" fill="#172554" text-anchor="middle">The second product interleaving is outside this domain.</text><rect x="18" y="793" width="584" height="227" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="834" font-size="19" fill="#172554" text-anchor="middle">Identity operator images do not delete labels</text><text x="310" y="880" font-size="20" fill="#2563eb" text-anchor="middle">D(sβ | sα ⊗ 1ₐ) = −sγ ⊗ 1ₐ + sβ ⊗ 1_b</text><text x="310" y="924" font-size="23" fill="#15803d" text-anchor="middle">D² = +1_c − 1_c = 0</text><text x="310" y="967" font-size="18" fill="#172554" text-anchor="middle">Pull back the whole parameter coalgebra map.</text><text x="310" y="1001" font-size="16" fill="#172554" text-anchor="middle">No missing state or clipped shuffle is inserted.</text><text x="310" y="1055" font-size="13" fill="#172554" text-anchor="middle">Full joint action and finite transfer: Theorem 34.</text><text x="310" y="1082" font-size="13" fill="#172554" text-anchor="middle">Exact compatible-domain calculation: Exercise 34.</text><text x="310" y="1107" font-size="11" fill="#172554" text-anchor="middle">Free bar-module background: Keller, arXiv:math/9910179, §4.2.</text></g></svg>