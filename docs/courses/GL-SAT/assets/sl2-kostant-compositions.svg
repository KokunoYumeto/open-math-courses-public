<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">SL₂: compositions and the whole centre</text><text x="310" y="77" font-size="19" fill="#172554" text-anchor="middle">B(X,Y)=tr(XY); c=½tr(X²); |c|=4, |z|=2</text><rect x="25" y="105" width="570" height="227" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="23" fill="#172554" text-anchor="middle">X(c)=[0  1; c  0];  z on Std = X(c)</text><text x="310" y="189" font-size="20" fill="#172554" text-anchor="middle">Adj basis (e,h,f), degrees (2,0,−2)</text><text x="310" y="234" font-size="19" fill="#172554" text-anchor="middle">T = ad X(c) = [0 −2 0; −c 0 1; 0 2c 0]</text><text x="310" y="279" font-size="20" fill="#172554" text-anchor="middle">X²=cI; T³=4cT; cyclic determinants −1, 2</text><text x="310" y="310" font-size="16" fill="#172554" text-anchor="middle">End(Std)=E[c,X]/(X²−c); End(Adj)=E[c,T]/(T³−4cT)</text><rect x="25" y="365" width="570" height="234" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="405" font-size="25" fill="#172554" text-anchor="middle">unit  ── i=(1,0,c)ᵗ ──→  Adj</text><text x="310" y="449" font-size="25" fill="#172554" text-anchor="middle">unit  ←── ℓ=(c,0,1) ───  Adj</text><text x="310" y="493" font-size="22" fill="#172554" text-anchor="middle">|i|=|ℓ|=2; Ti=0 and ℓT=0</text><text x="310" y="540" font-size="27" fill="#172554" text-anchor="middle">ℓi = 2c;    iℓ = 2cI − T²/2</text><text x="310" y="575" font-size="17" fill="#172554" text-anchor="middle">Actual morphisms and products on every parameter algebra.</text><rect x="25" y="635" width="570" height="264" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="676" font-size="23" fill="#172554" text-anchor="middle">J = Spec E[c,u,v]/(u²−cv²−1)</text><text x="310" y="719" font-size="23" fill="#172554" text-anchor="middle">g = [u  v; cv  u]  ∈ original SL₂</text><text x="310" y="762" font-size="22" fill="#172554" text-anchor="middle">c=0: J₀ ≅ μ₂ × Gₐ, coordinate v/u</text><text x="310" y="805" font-size="18" fill="#172554" text-anchor="middle">Lie kernel on Std₀ = E·v₊, but −I acts by −1.</text><text x="310" y="849" font-size="17" fill="#172554" text-anchor="middle">Homfull J₀(unit,Std₀)=0; global Homℬ(unit,Std)=0.</text><text x="310" y="879" font-size="16" fill="#172554" text-anchor="middle">Finite-centre equivariance survives the full descent argument.</text><text x="310" y="947" font-size="18" fill="#172554" text-anchor="middle">c=ε, ε²=0: [1+ε/2  1; ε  1+ε/2] ∈ J(E[ε]/ε²)</text><text x="310" y="983" font-size="17" fill="#172554" text-anchor="middle">Its determinant is exactly 1; the ε coefficient is retained.</text><text x="310" y="1032" font-size="18" fill="#172554" text-anchor="middle">Proposition B.6.1.1; Exercises B.7.2–B.7.3.</text><text x="310" y="1068" font-size="16" fill="#172554" text-anchor="middle">SL₃ nilpotent fibre: μ₃×Gₐ², with three geometric components.</text><text x="310" y="1100" font-size="15" fill="#172554" text-anchor="middle">Free reading: Bezrukavnikov–Finkelberg, arXiv:0707.3799.</text></g></svg>