<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">Localization and integral morphism lifting</text><text x="310" y="77" font-size="19" fill="#172554" text-anchor="middle">Finite proper T-cell support; S=E[u₁,…,uᵣ]</text><rect x="25" y="104" width="570" height="239" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="143" font-size="24" fill="#172554" text-anchor="middle">Q=Frac(S);  QHₜ(X,E)=∏ₓ Q</text><text x="310" y="183" font-size="23" fill="#172554" text-anchor="middle">V=⊕kαⱼ:  eₜ(V)=∏αⱼ ≠ 0 in S</text><text x="310" y="225" font-size="20" fill="#172554" text-anchor="middle">The Euler product vanishes on V∖{0}.</text><text x="310" y="263" font-size="19" fill="#172554" text-anchor="middle">Punctured cells vanish after localization.</text><text x="310" y="304" font-size="18" fill="#172554" text-anchor="middle">Disjoint fixed-point supports + torsion-free target</text><text x="310" y="330" font-size="18" fill="#172554" text-anchor="middle">⇒ integral cross-Hom = 0  (C.1 and C.5)</text><path d="M310,356 L310,390" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="403" width="570" height="269" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="441" font-size="20" fill="#172554" text-anchor="middle">Assume surjective fixed-point restrictions.</text><text x="310" y="482" font-size="25" fill="#172554" text-anchor="middle">0 → ExtZ → ExtX′ → ExtC → 0</text><text x="99" y="528" font-size="21" fill="#172554" text-anchor="middle">hZ ≅</text><text x="339" y="528" font-size="24" fill="#172554" text-anchor="middle">h</text><text x="521" y="528" font-size="21" fill="#172554" text-anchor="middle">hC ≅</text><path d="M136,493 L136,550" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M310,493 L310,550" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M484,493 L484,550" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="310" y="590" font-size="24" fill="#172554" text-anchor="middle">0 → HomZ → HomX′ → HomC</text><text x="310" y="631" font-size="18" fill="#172554" text-anchor="middle">Lower row: left exact before the lifting argument.</text><text x="310" y="658" font-size="17" fill="#172554" text-anchor="middle">All arrows are the actual Ext/cohomology maps.</text><rect x="25" y="708" width="570" height="244" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="750" font-size="19" fill="#172554" text-anchor="middle">Lift β(g) through hC and the top surjection.</text><text x="310" y="794" font-size="21" fill="#172554" text-anchor="middle">Subtract the lifted map: β(g−h(e))=0.</text><text x="310" y="837" font-size="22" fill="#172554" text-anchor="middle">Exactness gives g−h(e)=α(z).</text><text x="310" y="880" font-size="22" fill="#172554" text-anchor="middle">Lift z through hZ:  g=h(e+s(z)).</text><text x="310" y="927" font-size="19" fill="#172554" text-anchor="middle">C.3 and C.10 prove fullness and composition.</text><text x="310" y="994" font-size="17" fill="#172554" text-anchor="middle">HomZ / ExtZ use *source and !target restriction.</text><text x="310" y="1031" font-size="16" fill="#172554" text-anchor="middle">No rational morphism is extended by localization alone.</text><text x="310" y="1065" font-size="17" fill="#172554" text-anchor="middle">Proofs C.1–C.3, C.5.2.1 and C.10.1.1.</text><text x="310" y="1097" font-size="15" fill="#172554" text-anchor="middle">Free reading: Ginzburg, arXiv:2508.15958v2, §4.2.</text></g></svg>