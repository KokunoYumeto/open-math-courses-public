<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem 9; Exercise 9", "V_degrees": {"e": 0, "f": -1, "y": 0}, "V_differential": {"f": "y"}, "bar_signs": {"unary": "-(-1)^prefix", "binary": "(-1)^(prefix+|a|-1)"}, "w": ["Eef", "Eff", "Eye"], "D_w": {"v": -1, "z": 1}, "v": ["Eef", "Eyf", "Eye"], "z": ["Eef", "Eye"], "D_v": 1, "D_z": 1, "D_le2_squared_w": 1, "opposite_sign": "T_theta T_eta = (-1)^(r*s) T_(eta star theta)", "free_background": "https://arxiv.org/pdf/math/9910179#page=13"}</metadata><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">A full module needs its higher scalar action</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">An exact nonminimal End(V) calculation</text><text x="310" y="121" font-size="19" fill="#172554" text-anchor="middle">V = k e⁰ ⊕ k f⁻¹ ⊕ k y⁰       d(f) = y</text><text x="310" y="158" font-size="19" fill="#172554" text-anchor="middle">F_r(a₁,…,a_r) = p a₁ h a₂ ⋯ h a_r i</text><rect x="18" y="194" width="584" height="390" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="230" font-size="22" fill="#172554" text-anchor="middle">w = (E_ef, E_ff, E_ye)</text><text x="310" y="268" font-size="22" fill="#2563eb" text-anchor="middle">D(w) = −v + z</text><path d="M 310 284 L 170 316" stroke="#2563eb" stroke-width="2"/><path d="M 310 284 L 450 316" stroke="#2563eb" stroke-width="2"/><text x="170" y="349" font-size="17" fill="#172554" text-anchor="middle">v = (E_ef, E_yf, E_ye)</text><text x="450" y="349" font-size="17" fill="#172554" text-anchor="middle">z = (E_ef, E_ye)</text><text x="170" y="389" font-size="20" fill="#15803d" text-anchor="middle">F₃(v) = 1</text><text x="450" y="389" font-size="20" fill="#15803d" text-anchor="middle">F₂(z) = 1</text><text x="310" y="439" font-size="23" fill="#15803d" text-anchor="middle">D²(w) = −1 + 1 = 0</text><text x="310" y="488" font-size="17" fill="#172554" text-anchor="middle">The unary term d(E_ff) = E_yf creates v.</text><text x="310" y="527" font-size="17" fill="#172554" text-anchor="middle">Each 1 is an ordinary coefficient output.</text><text x="310" y="562" font-size="20" fill="#b91c1c" text-anchor="middle">Omitting F₃ gives D²(w) = 1.</text><rect x="18" y="613" width="584" height="235" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="650" font-size="19" fill="#172554" text-anchor="middle">Full natural maps reverse the kernel direction</text><text x="310" y="697" font-size="19" fill="#172554" text-anchor="middle">θ : F → G       induces       T_θ : K_G → K_F</text><text x="310" y="747" font-size="23" fill="#172554" text-anchor="middle">T_θ T_η = (−1)ʳˢ T_(η ⋆ θ)</text><text x="310" y="793" font-size="18" fill="#15803d" text-anchor="middle">For two odd maps, the sign is minus.</text><text x="310" y="828" font-size="16" fill="#172554" text-anchor="middle">Every original source cut remains in the formula.</text><rect x="18" y="877" width="584" height="174" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="917" font-size="19" fill="#172554" text-anchor="middle">The bar encoding is not the primitive complex</text><text x="310" y="961" font-size="21" fill="#172554" text-anchor="middle">For A = B = k:       D(1 | s1) = 1</text><text x="310" y="1004" font-size="18" fill="#172554" text-anchor="middle">The represented primitive is still K_F = k.</text><text x="310" y="1035" font-size="16" fill="#172554" text-anchor="middle">Its actual module maps and homotopies must be retained.</text><text x="310" y="1080" font-size="13" fill="#172554" text-anchor="middle">Proof and all signs: Theorem 9. Worked calculation: Exercise 9.</text><text x="310" y="1106" font-size="12" fill="#172554" text-anchor="middle">Free background: Keller, arXiv:math/9910179, §4.2; no theorem imported.</text></g></svg>