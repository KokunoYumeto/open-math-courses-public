<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">One global root-profile choice;all finite restrictions</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.63: actual selected edges and positive height jumps</text><rect x="25" y="105" width="570" height="335" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="20" fill="#172554" text-anchor="middle">Exercise C.63.4.1: keep both contractions</text><text x="90" y="227" font-size="27" fill="#172554" text-anchor="middle">t₃</text><text x="310" y="227" font-size="27" fill="#172554" text-anchor="middle">t₂</text><text x="530" y="227" font-size="27" fill="#172554" text-anchor="middle">t₁</text><path d="M112 211 Q200 156 286 211" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M112 231 Q200 285 286 231" fill="none" stroke="#15803d" stroke-width="2.5"/><path d="M274,203 L286,211 M271.8551449962566,208.78119921509906 L286,211 L278.5115473509594,198.79659568304496" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M274,239 L286,231 M278.5115473509594,243.20340431695504 L286,231 L271.8551449962566,233.21880078490094" fill="none" stroke="#15803d" stroke-width="3"/><text x="200" y="180" font-size="22" fill="#2563eb" text-anchor="middle">α</text><text x="200" y="275" font-size="22" fill="#15803d" text-anchor="middle">β</text><path d="M336,218 L506,218 M493.0,224.0 L506,218 L493.0,212.0" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="420" y="202" font-size="22" fill="#7c3aed" text-anchor="middle">γ</text><text x="90" y="310" font-size="17" fill="#172554" text-anchor="middle">h = −3</text><text x="310" y="310" font-size="17" fill="#172554" text-anchor="middle">h = −2</text><text x="530" y="310" font-size="17" fill="#172554" text-anchor="middle">h = −1</text><text x="310" y="354" font-size="23" fill="#172554" text-anchor="middle">γα = γβ = δ;       α ≠ β</text><text x="310" y="394" font-size="22" fill="#172554" text-anchor="middle">z = sγ | sα − sγ | sβ,       dz = 0</text><text x="310" y="426" font-size="17" fill="#172554" text-anchor="middle">|z| = −2; no length-three word starts at t₃.</text><rect x="25" y="485" width="570" height="355" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="525" font-size="20" fill="#172554" text-anchor="middle">Exercise C.63.4.2: input blocks (0,2,1)</text><text x="155" y="575" font-size="28" fill="#172554" text-anchor="middle">−4</text><text x="465" y="575" font-size="28" fill="#172554" text-anchor="middle">−3</text><text x="155" y="745" font-size="28" fill="#172554" text-anchor="middle">−3</text><text x="465" y="745" font-size="28" fill="#172554" text-anchor="middle">−2</text><path d="M190,566 L430,566 M417.0,572.0 L430,566 L417.0,560.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M155,595 L155,710 M149.0,697.0 L155,710 L161.0,697.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M465,595 L465,710 M459.0,697.0 L465,710 L471.0,697.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M190,736 L430,736 M417.0,742.0 L430,736 L417.0,730.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="310" y="551" font-size="17" fill="#172554" text-anchor="middle">Δh = 1</text><text x="97" y="658" font-size="19" fill="#172554" text-anchor="middle">+1</text><text x="522" y="658" font-size="19" fill="#172554" text-anchor="middle">+1</text><text x="310" y="786" font-size="17" fill="#172554" text-anchor="middle">Unit output ⊗ binary convolution ⊗ identity strand</text><text x="310" y="814" font-size="17" fill="#172554" text-anchor="middle">All three actual central mapping factors remain.</text><rect x="25" y="865" width="570" height="190" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="905" font-size="19" fill="#172554" text-anchor="middle">Choose on the whole locally forward finite index</text><text x="310" y="948" font-size="19" fill="#172554" text-anchor="middle">restrict to a finite capacity,corner or full face</text><text x="310" y="991" font-size="19" fill="#172554" text-anchor="middle">both restrictions agree on their intersection</text><text x="310" y="1035" font-size="16" fill="#172554" text-anchor="middle">Profile-changing grafting retains its separate full domain.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Lemma C.63.1.1; Theorems C.63.2.1–3.1; Exercises C.63.4.1–2.</text></g></svg>