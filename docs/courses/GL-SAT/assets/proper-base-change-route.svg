<title id="title">The canonical proper base-change proof</title>
<desc id="desc">A commutative strict-local projective-line cohomology square, the finite binary-form surjection to projective space, and the Noetherian and changing-source reductions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#185b85"/></marker></defs>
