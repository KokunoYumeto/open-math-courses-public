<text x="34" y="80" font-size="18">All torsion orders · arbitrary bases and base changes</text>
<rect x="34" y="108" width="552" height="340" rx="14" fill="#edf5fb" stroke="#b6cedd"/>
<text x="54" y="140" font-size="21" font-weight="600">1. Test the actual map on a geometric stalk</text>
<text x="54" y="173" font-size="17">Compatible strict-local rings A → A′, residues k → k′</text>
<g font-family="Cambria Math,Segoe UI,serif" font-size="22">
<text x="68" y="230">H<tspan baseline-shift="super" font-size="15">q</tspan>(P¹<tspan baseline-shift="sub" font-size="15">A</tspan>, F<tspan baseline-shift="sub" font-size="15">A</tspan>)</text>
<text x="374" y="230">H<tspan baseline-shift="super" font-size="15">q</tspan>(P¹<tspan baseline-shift="sub" font-size="15">A′</tspan>, F<tspan baseline-shift="sub" font-size="15">A′</tspan>)</text>
<text x="68" y="348">H<tspan baseline-shift="super" font-size="15">q</tspan>(P¹<tspan baseline-shift="sub" font-size="15">k</tspan>, F<tspan baseline-shift="sub" font-size="15">k</tspan>)</text>
<text x="374" y="348">H<tspan baseline-shift="super" font-size="15">q</tspan>(P¹<tspan baseline-shift="sub" font-size="15">k′</tspan>, F<tspan baseline-shift="sub" font-size="15">k′</tspan>)</text>
</g>
<g stroke="#185b85" stroke-width="2" marker-end="url(#arrow)">
