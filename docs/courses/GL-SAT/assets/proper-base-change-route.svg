<text x="267" y="209" font-size="15">pullback</text>
<text x="265" y="327" font-size="15">isomorphism</text>
<text x="62" y="285" font-size="15">restriction</text><text x="158" y="301" font-size="15">≅</text>
<text x="367" y="285" font-size="15">restriction</text><text x="462" y="301" font-size="15">≅</text>
<text x="54" y="393" font-size="17">Vertical maps: henselian comparison, K.1.3.1</text>
<text x="54" y="420" font-size="17">Bottom map: proper-curve field comparison; K.2.4.1</text>
<rect x="34" y="470" width="552" height="266" rx="14" fill="#f0f5e9" stroke="#b9cba5"/>
<text x="54" y="502" font-size="21" font-weight="600">2. Pass from products to projective spaces</text>
<g font-family="Cambria Math,Segoe UI,serif" font-size="24">
<text x="62" y="573">(P¹<tspan baseline-shift="sub" font-size="15">S</tspan>)ⁿ</text><text x="336" y="573">Pⁿ<tspan baseline-shift="sub" font-size="15">S</tspan></text><text x="520" y="573">S</text>
</g>
<path d="M181 564H315" stroke="#185b85" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M389 564H503" stroke="#185b85" stroke-width="2" marker-end="url(#arrow)"/>
<text x="204" y="544" font-size="16">finite, surjective ρ</text>
<text x="54" y="622" font-size="17">ρ sends ordered linear factors to their binary form.</text>
<text x="54" y="652" font-size="17">The product projection compares by composition.</text>
<text x="54" y="682" font-size="17">A split injective test gives comparison for Pⁿ → S.</text>
<text x="54" y="710" font-size="16">K.3.3.1–K.3.7.1 · No division by n!</text>
<rect x="34" y="758" width="552" height="374" rx="14" fill="#fff1e6" stroke="#dcc0a7"/>
<text x="54" y="791" font-size="21" font-weight="600">3. Keep every source and coefficient scope</text>
<text x="54" y="832" font-size="18" font-weight="600">Noetherian proper source</text>
<text x="54" y="859" font-size="17">A projective modification T → X compares, and so</text>
<text x="54" y="885" font-size="17">does T → S; proper surjective descent gives X → S.</text>
<text x="54" y="926" font-size="18" font-weight="600">Arbitrary base, finite presentation</text>
<text x="54" y="953" font-size="17">Paired rings (Aᵢ, Bⱼ) and actual sheaves Fᵢ = πᵢ,*F</text>
<text x="54" y="979" font-size="17">recover the base-change map by filtered continuity.</text>
<text x="54" y="1020" font-size="18" font-weight="600">Proper source without finite presentation</text>
<text x="54" y="1047" font-size="17">X = lim Xα with closed transition maps; model F too.</text>
<text x="54" y="1073" font-size="17">Sheafify the cohomology-presheaf continuity formula.</text>
<text x="54" y="1105" font-size="16">K.3.8.1, K.4.1.1–K.4.3.1</text>
<text x="34" y="1160" font-size="16">The diagrams show canonical maps and proved reductions.</text>
</g></svg>
