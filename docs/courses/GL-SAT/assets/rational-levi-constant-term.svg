<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="25" text-anchor="middle">Levi constant term retains its actual maps</text>
<text x="310" y="83" font-size="21" text-anchor="middle">P=MU;  B_G is the inverse image of B_M in P.</text>
<rect x="28" y="112" width="564" height="230" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="145" y="153" font-size="23" text-anchor="middle">Gr_(B_G)</text>
<text x="469" y="153" font-size="23" text-anchor="middle">Gr_(B_M)</text>
<path d="M232,146 L370,146" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M145,170 L145,223" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M469,170 L469,223" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="145" y="257" font-size="25" text-anchor="middle">Gr_P</text>
<text x="469" y="257" font-size="25" text-anchor="middle">Gr_M</text>
<path d="M214,249 L387,249" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="241" font-size="19" text-anchor="middle">q</text>
<text x="310" y="302" font-size="17" text-anchor="middle">Cartesian on every base, with punctured frames retained.</text>
<text x="310" y="329" font-size="20" text-anchor="middle">At t^ν:  q⁻¹(S_ν^M)=S_ν^G.</text>
<path d="M310,357 L310,389" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="403" width="564" height="182" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="444" font-size="25" text-anchor="middle">CT(A)|κ=(Rq! i*A)|κ[d(κ)]</text>
<text x="310" y="485" font-size="25" text-anchor="middle">d([ν])=〈2ρ_G−2ρ_M,ν〉</text>
<text x="310" y="525" font-size="26" text-anchor="middle">L_ν^M(CT A) ≃ L_ν^G(A)</text>
<text x="310" y="561" font-size="18" text-anchor="middle">Concentrated weights detect perversity and exactness.</text>
<path d="M310,600 L310,632" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="646" width="564" height="181" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="687" font-size="23" text-anchor="middle">Moving comparison across the collision</text>
<text x="310" y="729" font-size="25" text-anchor="middle">i_D* E = CT(A*B) ⊠ E_D[2]</text>
<text x="310" y="769" font-size="18" text-anchor="middle">i_D* D E has the same [2] and base Tate twist (2).</text>
<text x="310" y="806" font-size="17" text-anchor="middle">Closed perverse degrees −1,+1 force intermediate extension.</text>
<rect x="28" y="862" width="564" height="220" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="903" font-size="22" text-anchor="middle">Normalize each output pair by</text>
<text x="310" y="945" font-size="24" text-anchor="middle">χ(κ₁,κ₂)=(−1)^(e_G(κ₁)d(κ₂))</text>
<text x="310" y="985" font-size="23" text-anchor="middle">e_G([ν])=〈2ρ_G,ν〉 mod 2</text>
<text x="310" y="1024" font-size="16" text-anchor="middle">Then γ: H_M CT ≃ H_G is monoidal and symmetry is ordinary.</text>
<text x="310" y="1062" font-size="16" text-anchor="middle">Nested raw and correction phases are both (−1)^(d₁κ₁·d₂κ₂).</text>
<text x="310" y="1126" font-size="16" text-anchor="middle">Lemma A.3.1.1; Theorems A.3.2.1, A.4.1.1 and A.4.2.1</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">No equality of G- and M-cohomological degrees or parities is assumed.</text>
</svg>