<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Unital cobar models retain the actual scalar terms</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.72: the normalized quotient, counit and functors</text><rect x="25" y="105" width="570" height="300" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="21" fill="#172554" text-anchor="middle">Impose the unit relations on the full cobar</text><text x="310" y="195" font-size="25" fill="#172554" text-anchor="middle">Qᵘ(A) = Ω B(full A) / J(unit)</text><text x="310" y="241" font-size="18" fill="#172554" text-anchor="middle">one-letter coefficient generator = actual coefficient</text><text x="310" y="282" font-size="21" fill="#172554" text-anchor="middle">higher block with a unit argument = 0</text><text x="310" y="327" font-size="24" fill="#172554" text-anchor="middle">ε : Qᵘ(A) → A,     DH + HD = 1 − Iε</text><text x="310" y="378" font-size="18" fill="#172554" text-anchor="middle">The actual ε is the projection in the finite word SDR.</text><rect x="25" y="445" width="570" height="260" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="487" font-size="20" fill="#172554" text-anchor="middle">A scalar binary output belongs in the differential</text><text x="310" y="532" font-size="21" fill="#172554" text-anchor="middle">a = E(e,f),    b = E(f,e),    c = E(y,e)</text><text x="310" y="577" font-size="25" fill="#172554" text-anchor="middle">ab = 1 − E(f,f) − E(y,y)</text><text x="310" y="620" font-size="20" fill="#172554" text-anchor="middle">Dropping that constant gives</text><text x="310" y="665" font-size="27" fill="#15803d" text-anchor="middle">(D′)² h(a,b,c) = x(c) ≠ 0</text><rect x="25" y="745" width="570" height="320" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="787" font-size="19" fill="#172554" text-anchor="middle">A higher coefficient output survives as a coefficient</text><text x="310" y="831" font-size="24" fill="#172554" text-anchor="middle">(QᵘF)(h(E(e,f), E(y,e))) = −1</text><text x="310" y="875" font-size="24" fill="#172554" text-anchor="middle">dE(e,y) = −E(e,f)</text><text x="310" y="919" font-size="23" fill="#172554" text-anchor="middle">source unary image: +1</text><text x="310" y="960" font-size="23" fill="#172554" text-anchor="middle">source binary constant image: −1</text><text x="310" y="1003" font-size="18" fill="#172554" text-anchor="middle">Both terms give the dg functor equation 0 = +1 − 1.</text><text x="310" y="1042" font-size="18" fill="#172554" text-anchor="middle">A scalar unary term is also allowed: dh = 1.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.72.1.1–2.1; Exercises C.72.3.1–2.</text></g></svg>