<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">One tensor input retains all ordered cuts</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">C.76: full multishuffles and simultaneous kernel contraction</text><rect x="25" y="105" width="570" height="255" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="19" fill="#172554" text-anchor="middle">Every finite ordered family uses the same input Tₘ</text><text x="310" y="191" font-size="24" fill="#172554" text-anchor="middle">κ(π) : Tₘ → ⊗ⱼ T(Iⱼ)</text><text x="310" y="234" font-size="23" fill="#172554" text-anchor="middle">ρᵣ L(π) = (⊗ⱼ ζ(Iⱼ)) κ(π)</text><text x="310" y="279" font-size="25" fill="#172554" text-anchor="middle">P(C) P(D) = P(C ∪ D)</text><text x="310" y="326" font-size="25" fill="#2563eb" text-anchor="middle">H P(C) = P(C) H</text><rect x="25" y="400" width="570" height="400" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="438" font-size="21" fill="#172554" text-anchor="middle">Three odd square-zero letters: aᵢ²=0, daᵢ=0</text><text x="310" y="472" font-size="18" fill="#172554" text-anchor="middle">Original profile (1,1,1),   |aᵢ|=1</text><path d="M310,510 L420,555 V655 L310,700 L200,655 V555 Z" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/><g fill="#15803d"><circle cx="310" cy="510" r="5"/><circle cx="420" cy="555" r="5"/><circle cx="420" cy="655" r="5"/><circle cx="310" cy="700" r="5"/><circle cx="200" cy="655" r="5"/><circle cx="200" cy="555" r="5"/></g><text x="310" y="498" font-size="19" fill="#172554" text-anchor="middle">{1}</text><text x="462" y="559" font-size="19" fill="#172554" text-anchor="middle">{1,2}</text><text x="457" y="661" font-size="19" fill="#172554" text-anchor="middle">{2}</text><text x="310" y="732" font-size="19" fill="#172554" text-anchor="middle">{2,3}</text><text x="163" y="661" font-size="19" fill="#172554" text-anchor="middle">{3}</text><text x="152" y="559" font-size="19" fill="#172554" text-anchor="middle">{1,3}</text><text x="365" y="527" font-size="24" fill="#7c3aed" text-anchor="middle">+</text><text x="441" y="611" font-size="24" fill="#7c3aed" text-anchor="middle">−</text><text x="371" y="690" font-size="24" fill="#7c3aed" text-anchor="middle">+</text><text x="247" y="690" font-size="24" fill="#7c3aed" text-anchor="middle">−</text><text x="179" y="611" font-size="24" fill="#7c3aed" text-anchor="middle">+</text><text x="249" y="527" font-size="24" fill="#7c3aed" text-anchor="middle">−</text><text x="310" y="579" font-size="23" fill="#172554" text-anchor="middle">k → k⁶ → k⁶</text><text x="310" y="614" font-size="17" fill="#172554" text-anchor="middle">source degrees 1,2,3</text><text x="310" y="648" font-size="18" fill="#15803d" text-anchor="middle">one class in degree 3</text><text x="310" y="758" font-size="17" fill="#172554" text-anchor="middle">Edge labels: signed maximal-chain projection ρ₃.</text><text x="310" y="785" font-size="17" fill="#172554" text-anchor="middle">The tensor class survives; its actual kernel is contracted.</text><rect x="25" y="840" width="570" height="225" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="879" font-size="19" fill="#172554" text-anchor="middle">A primitive keeps its required intermediate cut value</text><text x="310" y="921" font-size="22" fill="#172554" text-anchor="middle">K = −x₁₃Y − Xx₂₃,    DK = ZXY − XYZ</text><text x="310" y="963" font-size="25" fill="#7c3aed" text-anchor="middle">ρ₃K = 0,    P(12|3)K = 0</text><text x="310" y="1005" font-size="18" fill="#172554" text-anchor="middle">Adding s=XY+YX keeps DK and ρ₃K unchanged</text><text x="310" y="1042" font-size="20" fill="#7c3aed" text-anchor="middle">but gives P(12|3)(K+s)=s ≠ 0.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.76.1.1–2.1; Exercises C.76.3.1–2.</text></g></svg>