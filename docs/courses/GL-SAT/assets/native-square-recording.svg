<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="20" fill="#172554" text-anchor="middle">Lift the whole coherent family,then return to its edges</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.60: the reverse kernel and actual comparison homotopies</text><rect x="25" y="105" width="570" height="295" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="22" fill="#172554" text-anchor="middle">The reverse path-projection kernel</text><text x="310" y="190" font-size="24" fill="#172554" text-anchor="middle">d<tspan baseline-shift="sub" font-size="65%">K</tspan>(f,a) = (∂f, −∂a + pf)</text><text x="310" y="238" font-size="26" fill="#172554" text-anchor="middle">k₁(f,a) = (hf + ia, 0)</text><text x="310" y="286" font-size="25" fill="#172554" text-anchor="middle">d<tspan baseline-shift="sub" font-size="65%">K</tspan> k₁ + k₁ d<tspan baseline-shift="sub" font-size="65%">K</tspan> = Id</text><text x="310" y="332" font-size="28" fill="#172554" text-anchor="middle">k₁² = 0</text><text x="310" y="377" font-size="17" fill="#172554" text-anchor="middle">The target SDR supplies the actual correction.</text><rect x="25" y="440" width="570" height="240" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="482" font-size="22" fill="#172554" text-anchor="middle">Projection-compatible comparisons</text><text x="310" y="530" font-size="25" fill="#172554" text-anchor="middle">t₀ = a′ti,       t<tspan baseline-shift="sub" font-size="65%">c</tspan> = i′t₀a</text><text x="310" y="575" font-size="25" fill="#172554" text-anchor="middle">A₀ = a′th,       A₁ = b′uk</text><text x="310" y="624" font-size="18" fill="#172554" text-anchor="middle">The full coherent square retains C = H₀ − H₁.</text><text x="310" y="662" font-size="18" fill="#172554" text-anchor="middle">Both A₀ and A₁ may be nonzero.</text><rect x="25" y="720" width="570" height="335" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="762" font-size="19" fill="#172554" text-anchor="middle">Exercise C.60.4.2: three independent terms</text><text x="310" y="807" font-size="26" fill="#172554" text-anchor="middle">R = iCp + ipth − huip</text><text x="310" y="905" font-size="17" fill="#172554" text-anchor="middle">The fourth roof term is zero because hi = 0.</text><text x="310" y="950" font-size="16" fill="#172554" text-anchor="middle">It is not zero merely because the cohomology map is Id.</text><text x="310" y="997" font-size="27" fill="#172554" text-anchor="middle">∂R = φ′t − uφ</text><text x="310" y="1038" font-size="16" fill="#172554" text-anchor="middle">Every raw comparison and higher parameter cell is retained.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Lemma C.60.1.1; Theorems C.60.2.1–3.1; Exercises C.60.4.1–2.</text><text x="120" y="853" font-size="21" fill="#2563eb" text-anchor="middle">e ↦ f₃</text><text x="310" y="853" font-size="21" fill="#15803d" text-anchor="middle">z ↦ f₁</text><text x="500" y="853" font-size="21" fill="#7c3aed" text-anchor="middle">e ↦ −g</text></g></svg>