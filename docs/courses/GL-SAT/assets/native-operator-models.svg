<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">The full bridge retains the actual geometric objects</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.68: fixed input and output types, complete comparisons</text><rect x="25" y="105" width="570" height="330" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="21" fill="#172554" text-anchor="middle">One bridge, two mapping quasi-isomorphisms</text><text x="310" y="199" font-size="24" fill="#172554" text-anchor="middle">R(v): objects (x, y, u : vx → y)</text><text x="310" y="242" font-size="18" fill="#172554" text-anchor="middle">u is an actual closed homotopy equivalence</text><text x="105" y="320" font-size="31" fill="#172554" text-anchor="middle">U</text><text x="310" y="279" font-size="29" fill="#172554" text-anchor="middle">R(v)</text><text x="515" y="320" font-size="31" fill="#172554" text-anchor="middle">G</text><path d="M267,296 L145,313 M157.04753431653768,305.26327479537713 L145,313 L158.7036643708326,317.1484434203172" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M353,296 L475,313 M461.2963356291674,317.1484434203172 L475,313 L462.9524656834624,305.26327479537713" fill="none" stroke="#15803d" stroke-width="3"/><text x="196" y="277" font-size="21" fill="#2563eb" text-anchor="middle">p</text><text x="423" y="277" font-size="21" fill="#15803d" text-anchor="middle">q</text><text x="310" y="370" font-size="23" fill="#172554" text-anchor="middle">maps (f, g, a),     |a| = r − 1</text><text x="310" y="411" font-size="21" fill="#172554" text-anchor="middle">D₃(f,g,a) = −∂a + u′v(f) − gu</text><rect x="25" y="475" width="570" height="330" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="517" font-size="20" fill="#172554" text-anchor="middle">Two distinct representatives of the same object</text><text x="139" y="575" font-size="19" fill="#172554" text-anchor="middle">V = ke⁰ ⊕ kf⁻¹ ⊕ ky⁰</text><text x="510" y="575" font-size="21" fill="#172554" text-anchor="middle">Q = ke⁰</text><path d="M280,591 L443,591 M430.0,597.0 L443,591 L430.0,585.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="360" y="573" font-size="21" fill="#15803d" text-anchor="middle">p</text><path d="M443,627 L280,627 M293.0,621.0 L280,627 L293.0,633.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="360" y="657" font-size="21" fill="#2563eb" text-anchor="middle">i</text><text x="310" y="701" font-size="23" fill="#172554" text-anchor="middle">df = y,    h(y) = f,    ∂h = 1 − ip</text><text x="310" y="745" font-size="26" fill="#172554" text-anchor="middle">F = (1,p,0),    I = (1,i,h)</text><text x="310" y="785" font-size="21" fill="#172554" text-anchor="middle">FI = 1,    D(0,h,0) = 1 − IF</text><rect x="25" y="845" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="887" font-size="21" fill="#172554" text-anchor="middle">The source differential forces a higher term</text><text x="310" y="933" font-size="21" fill="#172554" text-anchor="middle">A = E(e,y),   B = E(y,e),   C = E(e,f)</text><text x="310" y="975" font-size="23" fill="#172554" text-anchor="middle">∂A = −C,    AB = Eₑ,ₑ</text><text x="310" y="1017" font-size="27" fill="#7c3aed" text-anchor="middle">w₂(C,B) = −1</text><text x="310" y="1050" font-size="18" fill="#172554" text-anchor="middle">End(V) has no graded unital augmentation to k.</text><text x="310" y="1102" font-size="14" fill="#172554" text-anchor="middle">Theorems C.68.1.1, C.68.3.1, C.68.4.1; Exercises C.68.5.1–2.</text></g></svg>