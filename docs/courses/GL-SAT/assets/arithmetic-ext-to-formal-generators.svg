<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="38" font-size="25" fill="#172554" text-anchor="middle">Actual Ext purity → formal generators</text><text x="310" y="77" font-size="20" fill="#172554" text-anchor="middle">a²=q; Aλ is the normalized IC generator</text><rect x="25" y="110" width="570" height="209" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="150" font-size="22" fill="#172554" text-anchor="middle">Connected orbit stabilizer H=U⋊L</text><text x="310" y="194" font-size="18" fill="#172554" text-anchor="middle">Hᵖ(BH): actual scalar aᵖ; finite in every degree</text><text x="310" y="238" font-size="18" fill="#172554" text-anchor="middle">Ordinary IC fibre Hᵘ: aᵘ; exceptional Hᵛ: aᵛ</text><text x="310" y="280" font-size="21" fill="#172554" text-anchor="middle">Fibre Hom degree t=v−u: scalar aᵗ</text><path d="M310,333 L310,374" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="390" width="570" height="201" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="433" font-size="18" fill="#172554" text-anchor="middle">Nerve and finite orbit-filtration spectral sequences</text><text x="310" y="478" font-size="23" fill="#172554" text-anchor="middle">Total degree n=p+t has eigenvalue aⁿ</text><text x="310" y="524" font-size="21" fill="#172554" text-anchor="middle">d: degree n → n+1; aⁿ ≠ aⁿ⁺¹ ⇒ d=0</text><text x="310" y="566" font-size="16" fill="#172554" text-anchor="middle">Extensions retain sole eigenvalue aⁿ; Jordan parts allowed.</text><path d="M310,605 L310,647" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="665" width="570" height="216" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="706" font-size="20" fill="#172554" text-anchor="middle">Enhanced Frobenius on the minimal category</text><text x="310" y="751" font-size="19" fill="#172554" text-anchor="middle">Fᵣ has degree 1−r; ratio a¹⁻ʳ ≠ 1 for r&gt;1</text><text x="310" y="795" font-size="20" fill="#172554" text-anchor="middle">Sylvester inversion removes every higher Fᵣ.</text><text x="310" y="839" font-size="19" fill="#172554" text-anchor="middle">mᵣ has degree 2−r; ratio a²⁻ʳ ≠ 1 for r&gt;2</text><rect x="25" y="921" width="570" height="110" rx="15" fill="white" stroke="#d97706" stroke-width="2"/><text x="310" y="963" font-size="21" fill="#172554" text-anchor="middle">Perf(actual Ext category, genuine composition)</text><text x="310" y="1006" font-size="17" fill="#172554" text-anchor="middle">The dual Lie-algebra and monoidal identifications remain.</text><text x="310" y="1083" font-size="16" fill="#172554" text-anchor="middle">Theorems A.1.1.1–A.2.1.1, A.3.1.2–A.4.1.1.</text></g></svg>