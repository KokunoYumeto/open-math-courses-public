<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem32; Exercise32", "coordinate": ["k", "w1", "l1", "c1", "w2", "l2", "c2"], "tree": "binary root with two unary children", "internal_bars": ["w1", "w2"], "external_bars": ["c1", "c2"], "all_vertex_coefficients_retained": true, "vertex_sign": "B+p+sum(i&lt;j)|u_j|(|v_i|+|Z_i|)", "endpoint_sign": "-(-1)^(B_e+|u|)"}</metadata><text x="310" y="40" font-size="22" fill="#172554" text-anchor="middle">Every branch has its own full edge bar</text><text x="310" y="79" font-size="16" fill="#172554" text-anchor="middle">A rooted graph object with all coefficients retained</text><rect x="18" y="106" width="584" height="405" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><path d="M310 186 L170 300 M170 336 L170 406" stroke="#2563eb" stroke-width="3"/><circle cx="170" cy="318" r="24" fill="white" stroke="#15803d" stroke-width="2"/><path d="M310 186 L450 300 M450 336 L450 406" stroke="#2563eb" stroke-width="3"/><circle cx="450" cy="318" r="24" fill="white" stroke="#15803d" stroke-width="2"/><circle cx="310" cy="166" r="24" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="173" font-size="22" fill="#15803d" text-anchor="middle">k</text><text x="170" y="325" font-size="21" fill="#15803d" text-anchor="middle">l₁</text><text x="450" y="325" font-size="21" fill="#15803d" text-anchor="middle">l₂</text><text x="202" y="248" font-size="18" fill="#2563eb" text-anchor="middle">w₁ ∈ C₁</text><text x="425" y="248" font-size="18" fill="#2563eb" text-anchor="middle">w₂ ∈ C₂</text><text x="170" y="435" font-size="16" fill="#172554" text-anchor="middle">c₁ : original input</text><text x="450" y="435" font-size="16" fill="#172554" text-anchor="middle">c₂ : original input</text><text x="310" y="480" font-size="17" fill="#172554" text-anchor="middle">Root-first order:  k ; w₁ ; l₁ ; c₁ ; w₂ ; l₂ ; c₂</text><rect x="18" y="532" width="584" height="258" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="572" font-size="21" fill="#172554" text-anchor="middle">Two local operations determine D_T</text><text x="310" y="615" font-size="18" fill="#172554" text-anchor="middle">Vertex: extract every selected input prefix uᵢ</text><text x="310" y="651" font-size="22" fill="#15803d" text-anchor="middle">k ↦ k τ_v(u₁,…,u_r)</text><text x="310" y="689" font-size="17" fill="#172554" text-anchor="middle">Sign exponent:  B + |k| + Σᵢ&lt;ⱼ |uⱼ| (|vᵢ| + |Zᵢ|)</text><text x="310" y="732" font-size="19" fill="#2563eb" text-anchor="middle">Edge:  (u | sa ; l) ↦ −(−1)ᴮᵉ⁺|ᵘ| (u ; al)</text><text x="310" y="768" font-size="17" fill="#172554" text-anchor="middle">The dg cotensor construction proves D_T² = 0.</text><rect x="18" y="812" width="584" height="211" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="853" font-size="20" fill="#172554" text-anchor="middle">Normalize only auxiliary middle identities</text><text x="310" y="896" font-size="16" fill="#2563eb" text-anchor="middle">w₁ and w₂: quotient literal identity-word degeneracies</text><text x="310" y="937" font-size="17" fill="#15803d" text-anchor="middle">k, l₁, l₂ and all original cᵢ: keep their full spaces</text><text x="310" y="982" font-size="17" fill="#172554" text-anchor="middle">A nullary vertex keeps its full Hom out of F₀.</text><text x="310" y="1054" font-size="13" fill="#172554" text-anchor="middle">Exact signs and full marked parameters: Theorem 32.</text><text x="310" y="1081" font-size="13" fill="#172554" text-anchor="middle">Grafting with a closed odd coefficient: Exercise 32.</text><text x="310" y="1107" font-size="11" fill="#172554" text-anchor="middle">Free bar-module background: Keller, arXiv:math/9910179, §4.2.</text></g></svg>