<svg xmlns="http://www.w3.org/2000/svg" width="620" height="960" viewBox="0 0 620 960">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="46" font-size="28" text-anchor="middle">The closed-support right adjoint</text>
<text x="310" y="85" font-size="20" text-anchor="middle">i : Z → T closed,   j : U → T its open complement</text>
<text x="310" y="119" font-size="21" text-anchor="middle">K is a completed-ring complex on T.</text>
<rect x="28" y="148" width="564" height="105" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="190" font-size="29" text-anchor="middle" style="fill:#15803d">B_K = i_* i^! K</text>
<text x="310" y="225" font-size="20" text-anchor="middle">The fiber of the open-restriction unit</text>
<rect x="28" y="322" width="564" height="96" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="364" font-size="29" text-anchor="middle" style="fill:#2563eb">K</text>
<text x="310" y="399" font-size="20" text-anchor="middle">The original complex</text>
<rect x="28" y="484" width="564" height="105" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="526" font-size="29" text-anchor="middle" style="fill:#7c3aed">Rj_* j^* K</text>
<text x="310" y="561" font-size="20" text-anchor="middle">The ordinary open image</text>
<path d="M310,262 L310,313" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="336" y="294" font-size="20" text-anchor="start">supported counit</text>
<path d="M310,428 L310,475" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="336" y="458" font-size="20" text-anchor="start">open unit</text>
<rect x="28" y="623" width="564" height="258" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="663" font-size="23" text-anchor="middle">Restrict the same exact triangle</text>
<text x="310" y="712" font-size="25" text-anchor="middle">On U:   0 → j^*K → j^*K</text>
<text x="310" y="749" font-size="20" text-anchor="middle">The last arrow is the identity.</text>
<text x="310" y="797" font-size="21" text-anchor="middle">On Z:   i^!K → i^*K → i^*Rj_*j^*K</text>
<text x="310" y="843" font-size="21" text-anchor="middle" style="fill:#b45309">The last term can be nonzero.</text>
<text x="310" y="920" font-size="20" text-anchor="middle">Lemma O.2.2.1 and Exercise O.5.3</text>
</svg>