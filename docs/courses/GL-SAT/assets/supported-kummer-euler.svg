<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="43" font-size="25" text-anchor="middle">A global supported class gives the Euler map</text>
<text x="310" y="82" font-size="22" text-anchor="middle">q : V(L) → S,   s : S → V(L),   qs = 1</text>
<rect x="28" y="112" width="564" height="174" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="152" font-size="28" text-anchor="middle">s! Λ = Λ(−1)[−2]</text>
<text x="310" y="195" font-size="19" text-anchor="middle">Smooth trace + transitivity fix the orientation.</text>
<text x="310" y="235" font-size="19" text-anchor="middle">Section counit followed by line trace = identity.</text>
<text x="310" y="267" font-size="21" text-anchor="middle">Locally: positive point class −λκ(t).</text>
<path d="M310,300 L310,341" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="355" width="564" height="182" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="395" font-size="21" text-anchor="middle">O_V(L)(S), with its complement trivialization</text>
<text x="310" y="440" font-size="25" text-anchor="middle">relative Kummer boundary → θ_m</text>
<text x="310" y="483" font-size="23" text-anchor="middle">H²_S(V(L), μ_ℓ^m) = H⁰(S, Λ_m)</text>
<text x="310" y="518" font-size="22" text-anchor="middle">θ_m is the supported section 1.</text>
<path d="M310,551 L310,592" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="606" width="564" height="178" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="647" font-size="24" text-anchor="middle">Forget support: c₁(O_V(L)(S))</text>
<text x="310" y="691" font-size="27" text-anchor="middle" style="fill:#15803d">Pull back by s: c₁(L)</text>
<text x="310" y="732" font-size="20" text-anchor="middle">Frames: e_b = e_a g_ab,   t_b = g_ab⁻¹t_a.</text>
<text x="310" y="765" font-size="19" text-anchor="middle">Hence O_V(L)(S)|_S = L, with these transitions.</text>
<path d="M310,799 L310,838" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="852" width="564" height="125" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="897" font-size="25" text-anchor="middle">Λ(−1)[−2] → Λ → s*Rj_*Λ →</text>
<text x="310" y="932" font-size="21" text-anchor="middle">The first arrow is the actual global c₁(L).</text>
<text x="310" y="962" font-size="18" text-anchor="middle">Finite, integral and rational maps retain this triangle.</text>
<text x="310" y="1020" font-size="18" text-anchor="middle">Lemma A.1.2.1; Theorems A.2.1.1 and A.2.2.1</text>
</svg>