<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="20" fill="#172554" text-anchor="middle">Keep the native first family and every higher path term</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.62: the compatible entire common path is supplied</text><rect x="25" y="105" width="570" height="280" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="23" fill="#172554" text-anchor="middle">A contractible path-recording kernel</text><text x="310" y="190" font-size="27" fill="#172554" text-anchor="middle">S(f,g,a) = (f,Pg,Pa)</text><text x="310" y="235" font-size="24" fill="#172554" text-anchor="middle">d<tspan baseline-shift="sub" font-size="65%">K</tspan>(g,a) = (∂g, −∂a − g)</text><text x="310" y="280" font-size="27" fill="#172554" text-anchor="middle">k(g,a) = (−a,0)</text><text x="310" y="326" font-size="23" fill="#172554" text-anchor="middle">d<tspan baseline-shift="sub" font-size="65%">K</tspan> k + k d<tspan baseline-shift="sub" font-size="65%">K</tspan> = Id,       k² = 0</text><text x="310" y="365" font-size="17" fill="#172554" text-anchor="middle">ker P itself can have nonzero cohomology.</text><rect x="25" y="425" width="570" height="220" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="466" font-size="20" fill="#172554" text-anchor="middle">The original first component stays exactly F</text><text x="310" y="511" font-size="27" fill="#172554" text-anchor="middle">o = Dv − H̃(dx)</text><text x="310" y="555" font-size="29" fill="#172554" text-anchor="middle">H̃(x) = v − ko</text><text x="310" y="600" font-size="17" fill="#172554" text-anchor="middle">S H̃ = H; previously assigned full faces are retained.</text><text x="310" y="631" font-size="15" fill="#172554" text-anchor="middle">Only the native second component changes in the correction.</text><rect x="25" y="685" width="570" height="370" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="729" font-size="19" fill="#172554" text-anchor="middle">Exercise C.62.4.2: the essential triangle term</text><text x="310" y="775" font-size="26" fill="#172554" text-anchor="middle">∂(JK) = JL</text><text x="310" y="818" font-size="25" fill="#172554" text-anchor="middle">G̃₁₂G̃₀₁ − G̃₀₂ = JL + NJL</text><text x="310" y="865" font-size="29" fill="#172554" text-anchor="middle">G̃₀₁₂ = JK + NJK</text><text x="310" y="910" font-size="23" fill="#172554" text-anchor="middle">NJK(e) = g,       ∂(NJK)(e) = z</text><text x="310" y="954" font-size="20" fill="#172554" text-anchor="middle">P(NJK) = 0: the common image is still K.</text><text x="310" y="997" font-size="17" fill="#172554" text-anchor="middle">Omitting NJK leaves the nonzero native defect z.</text><text x="310" y="1034" font-size="17" fill="#172554" text-anchor="middle">The full third path equation also retains this term.</text><text x="310" y="1102" font-size="16" fill="#172554" text-anchor="middle">Lemma C.62.1.1; Theorem C.62.2.1; Exercises C.62.4.1–2.</text></g></svg>