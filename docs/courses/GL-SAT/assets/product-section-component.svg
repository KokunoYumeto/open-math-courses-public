<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">A section can retain a singular point of a connected fibre</title>
<desc id="desc">Left: the algebraic fibre xy equals zero, with singular selected point y at coordinates zero, zero and smooth section point q at coordinates one, zero. The two coordinate lines meet, so the fibre is connected. Right: a commuting scheme diagram U prime to U over S prime to S. U prime is an open subset after an etale base change, its map a to S prime has geometrically connected fibres and a section sigma. The section need not pass through the selected singular point.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#243a4d" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172d40">
<text x="38" y="43" font-size="25" font-weight="bold">A section selects a component, while the singular point stays</text>
<rect x="28" y="75" width="518" height="505" rx="12" fill="#f4f8fc" stroke="#a6b7c6"/>
<rect x="568" y="75" width="604" height="505" rx="12" fill="#f8fbf7" stroke="#a6b7c6"/>
<text x="50" y="115" font-size="22" font-weight="bold">An algebraic fibre: X = V(xy)</text>
<text x="50" y="146" font-size="18">The two coordinate lines meet at the origin.</text>
<path d="M76,328 H480 M268,461 V193" stroke="#d6dde5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M86,328 H470 M268,205 V450" stroke="#2666a7" stroke-width="7"/>
<text x="463" y="311" font-size="21">x</text><text x="281" y="210" font-size="21">y</text>
<circle cx="268" cy="328" r="10" fill="#b64444" stroke="#fff" stroke-width="3"/>
<circle cx="388" cy="328" r="9" fill="#237746" stroke="#fff" stroke-width="3"/>
<path d="M256,336 L208,385" fill="none" stroke="#b64444" stroke-width="2"/>
<text x="75" y="407" font-size="19" fill="#8c2929">selected y = (0, 0)</text>
<text x="75" y="433" font-size="18" fill="#8c2929">singular, and retained</text>
<path d="M388,317 V268" fill="none" stroke="#237746" stroke-width="2"/>
<text x="328" y="239" font-size="19" fill="#1d623b">q = (1, 0)</text>
<text x="313" y="266" font-size="18" fill="#1d623b">smooth section point</text>
<text x="50" y="510" font-size="19">For X × S → S, the section is q × S.</text>
<text x="50" y="540" font-size="18">Each geometric fibre is connected and reduced.</text>
<text x="593" y="115" font-size="22" font-weight="bold">The general neighbourhood</text>
<text x="593" y="147" font-size="18">U′ contains a lift of the initially selected point.</text>
<g stroke="#243a4d" stroke-width="2" fill="#fff">
<rect x="632" y="205" width="128" height="63" rx="6"/><rect x="974" y="205" width="128" height="63" rx="6"/>
<rect x="632" y="421" width="128" height="63" rx="6"/><rect x="974" y="421" width="128" height="63" rx="6"/>
<path d="M775,235 H957" fill="none" marker-end="url(#arrow)"/>
<path d="M775,452 H957" fill="none" marker-end="url(#arrow)"/>
<path d="M660,283 V404" fill="none" marker-end="url(#arrow)"/>
<path d="M732,406 V283" fill="none" stroke="#237746" marker-end="url(#arrow)"/>
<path d="M1038,283 V404" fill="none" marker-end="url(#arrow)"/>
</g>
<text x="678" y="247" font-size="27">U′</text><text x="1025" y="247" font-size="27">U</text>
<text x="678" y="463" font-size="27">S′</text><text x="1025" y="463" font-size="27">S</text>
<text x="803" y="200" font-size="17">open after étale</text><text x="817" y="221" font-size="17">base change</text>
<text x="837" y="479" font-size="18">étale</text>
<text x="602" y="349" font-size="22">a</text><text x="749" y="349" font-size="22" fill="#1d623b">σ</text>
<text x="797" y="324" font-size="18">a: flat, finitely presented;</text>
<text x="797" y="351" font-size="18">geometrically connected</text>
<text x="797" y="378" font-size="18">fibres.  aσ = identity.</text>
<text x="593" y="523" font-size="18">U′ is an open subset of U ×<tspan baseline-shift="sub" font-size="13">S</tspan> S′.</text>
<text x="593" y="553" font-size="18">σ need not pass through the selected singular point.</text>
<text x="38" y="606" font-size="15">Coordinate schematic and scheme maps: Lesson 05, C.8–C.10.1. CC0; source is this SVG.</text>
</g></svg>
