<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Finite jets reconstruct compactified charts</text>
<text x="310" y="84" font-size="18" text-anchor="middle">P¹ over κ; y=[1:0]; u=T/S; D_k=ky; all test algebras</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="19" text-anchor="middle">J=(κ[u]/uᵏ)ʳ; P,Q are actual subbundles.</text>
<text x="310" y="198" font-size="26" text-anchor="middle">rk P=e+r; rk Q=e.</text>
<text x="310" y="237" font-size="24" text-anchor="middle">Closed incidence: Q⊂P and uQ⊂P.</text>
<text x="310" y="276" font-size="25" text-anchor="middle">i:Q↪P; j(q)=u·q.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="22" text-anchor="middle">0 → O(−1)⊗Q → O⊗P → E → 0</text>
<text x="310" y="443" font-size="26" text-anchor="middle">The first map is T·i−S·j.</text>
<text x="310" y="482" font-size="21" text-anchor="middle">Open: full rank on the entire curve.</text>
<text x="310" y="521" font-size="20" text-anchor="middle">Open: E|D_k → J is an isomorphism.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="20" text-anchor="middle">G=Stab(ℓ⊂W) ⊂ GL(V), schematically.</text>
<text x="310" y="688" font-size="19" text-anchor="middle">E_G ⇔ F⊂E_W factors through GL(V)/G.</text>
<text x="310" y="727" font-size="19" text-anchor="middle">Closed: orbit equations and full jet frame.</text>
<text x="310" y="766" font-size="19" text-anchor="middle">Open: subbundle and boundary avoidance.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="18" text-anchor="middle">Add every highest-line generator and relation.</text>
<text x="310" y="933" font-size="17" text-anchor="middle">Closed jets: κ_λ|D_k=v_λ, including central units.</text>
<text x="310" y="972" font-size="18" text-anchor="middle">Defect lengths ≤b_i are ambient minor opens.</text>
<text x="310" y="1011" font-size="21" text-anchor="middle">Result: separated finite-type M̄_{b,y,k}.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Proofs M.1.1.1–M.5.1.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">The equations retain nilpotents; geometric defect is used only for bounds.</text>
</svg>