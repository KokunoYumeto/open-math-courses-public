<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Finite section schemes retain parameter fibres</text>
<text x="310" y="84" font-size="19" text-anchor="middle">R Noetherian; V locally free on P¹_R; A arbitrary/R</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="23" text-anchor="middle">Two affine charts give R-flat C⁰ → C¹.</text>
<text x="310" y="198" font-size="21" text-anchor="middle">Finite H⁰,H¹ give finite projective P⁰ → P¹.</text>
<text x="310" y="237" font-size="24" text-anchor="middle">RΓ(P¹_A,V_A) = [P⁰⊗A → P¹⊗A]</text>
<text x="310" y="276" font-size="19" text-anchor="middle">Actual sections are ker(d⊗A), also for nonflat A.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="24" text-anchor="middle">S(V) = Spec Sym((P⁰)∨)/(d∨(P¹)∨)</text>
<text x="310" y="443" font-size="21" text-anchor="middle">Finite tensor relations give closed zero fibres.</text>
<text x="310" y="482" font-size="21" text-anchor="middle">Central inverse maps obey κ_χ κ_(−χ) = 1.</text>
<text x="310" y="521" font-size="19" text-anchor="middle">Larger pole bounds give closed scheme immersions.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="20" text-anchor="middle">Nonzero on every geometric curve fibre: open.</text>
<text x="310" y="688" font-size="18" text-anchor="middle">⇔ sheaf injection with a finitely presented flat quotient</text>
<text x="310" y="727" font-size="19" text-anchor="middle">e z=z, Fz=0; its coefficients generate finite M₀.</text>
<text x="310" y="766" font-size="21" text-anchor="middle">Residue injection and Nakayama force M₀=0.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="21" text-anchor="middle">V(ax) ⊂ A² is the actual jumping section scheme.</text>
<path d="M 62 968 H 258" stroke="#2563eb" stroke-width="4"/>
<path d="M 160 916 V 1022" stroke="#d97706" stroke-width="4"/>
<circle cx="160" cy="968" r="4" fill="#111827"/>
<text x="270" y="975" font-size="20" text-anchor="middle">a</text>
<text x="172" y="922" font-size="20" text-anchor="middle">x</text>
<text x="425" y="931" font-size="22" text-anchor="middle">a≠0: x=0</text>
<text x="425" y="967" font-size="21" text-anchor="middle">a=0: x arbitrary</text>
<text x="425" y="1003" font-size="19" text-anchor="middle">a=ε: x=b ε; ε²=0</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Propositions I.1.1.1–I.2.1.1; Theorem I.3.1.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Exercise I.4.1: the axes are a coordinate schematic of ax=0.</text>
</svg>