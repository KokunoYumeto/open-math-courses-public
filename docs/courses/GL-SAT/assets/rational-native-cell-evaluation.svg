<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="28" fill="#172554" text-anchor="middle">Whole cell evaluation</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">Source first · painted comparison next · all target blocks</text><rect x="18" y="100" width="584" height="233" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="143" font-size="23" fill="#2563eb" text-anchor="middle">C_T: dimension q − 2     →     |α_T| = 2 − q</text><text x="310" y="193" font-size="23" fill="#15803d" text-anchor="middle">J_T: dimension q − 1     →     |φ_T| = 1 − q</text><text x="310" y="244" font-size="17" fill="#172554" text-anchor="middle">Integrate the complete oriented fundamental flag chain.</text><text x="310" y="293" font-size="18" fill="#172554" text-anchor="middle">The full source unary differential remains in dHom.</text><rect x="18" y="355" width="584" height="263" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="396" font-size="22" fill="#15803d" text-anchor="middle">A target partition with two higher outputs</text><circle cx="175" cy="450" r="21" fill="white" stroke="#2563eb" stroke-width="2"/><text x="175" y="456" font-size="18" fill="#2563eb" text-anchor="middle">1</text><circle cx="175" cy="548" r="21" fill="white" stroke="#2563eb" stroke-width="2"/><text x="175" y="554" font-size="18" fill="#2563eb" text-anchor="middle">2</text><circle cx="445" cy="450" r="21" fill="white" stroke="#2563eb" stroke-width="2"/><text x="445" y="456" font-size="18" fill="#2563eb" text-anchor="middle">3</text><circle cx="445" cy="548" r="21" fill="white" stroke="#2563eb" stroke-width="2"/><text x="445" y="554" font-size="18" fill="#2563eb" text-anchor="middle">4</text><path d="M175,471 V527 M445,471 V527" stroke="#2563eb" stroke-width="2"/><path d="M194,541 L426,457" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,5"/><path d="M151,430 V571 M469,430 V571" stroke="#15803d" stroke-width="3"/><text x="310" y="480" font-size="16" fill="#172554" text-anchor="middle">retained seam</text><text x="310" y="594" font-size="18" fill="#172554" text-anchor="middle">Keep both φ₂ blocks and their complete product.</text><rect x="18" y="639" width="584" height="350" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="681" font-size="22" fill="#2563eb" text-anchor="middle">Extend through the exact restriction kernel</text><text x="310" y="727" font-size="26" fill="#172554" text-anchor="middle">K_T = Hom(U_T / Y_T, Gout)</text><text x="310" y="772" font-size="24" fill="#172554" text-anchor="middle">dh_T + h_Td = 1;     t′ = t − h_T Z</text><text x="310" y="817" font-size="18" fill="#172554" text-anchor="middle">The source-generator differential is included.</text><text x="310" y="862" font-size="19" fill="#172554" text-anchor="middle">Full Ξ matrices and genuine grafts come first.</text><text x="310" y="908" font-size="20" fill="#172554" text-anchor="middle">Then recover the original graph A-slot.</text><text x="310" y="953" font-size="27" fill="#15803d" text-anchor="middle">b_G² = 0;       b_H Φ = Φ b_G</text><text x="310" y="1030" font-size="14" fill="#172554" text-anchor="middle">The drawn blocks are {1,2} and {3,4} in a four-vertex unary tree.</text><text x="310" y="1068" font-size="15" fill="#172554" text-anchor="middle">No multiplicativity is assumed for the based linear projection.</text><text x="310" y="1105" font-size="15" fill="#172554" text-anchor="middle">All profiles, units, orientations and relative lifts: Theorem 78.</text></g></svg>