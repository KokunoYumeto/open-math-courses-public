<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Keep every root factor and correct the full action</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.57: actual frontier data and nonlinear module extension</text><rect x="25" y="105" width="570" height="500" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="20" fill="#172554" text-anchor="middle">Unit,convolution and identity roots: (0,2,1)</text><text x="110" y="195" font-size="23" fill="#172554" text-anchor="middle">IC₀</text><text x="310" y="195" font-size="23" fill="#172554" text-anchor="middle">x₁ ∗ x₂</text><text x="510" y="195" font-size="23" fill="#172554" text-anchor="middle">x₃</text><path d="M110,280 L110,210 M116.0,223.0 L110,210 L104.0,223.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M310,280 L310,210 M316.0,223.0 L310,210 L304.0,223.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M510,382 L510,210 M516.0,223.0 L510,210 L504.0,223.0" fill="none" stroke="#7c3aed" stroke-width="3"/><circle cx="110" cy="295" r="13" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="310" cy="295" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110" y="301" font-size="17" fill="#172554" text-anchor="middle">u</text><text x="310" y="301" font-size="17" fill="#172554" text-anchor="middle">b</text><text x="110" y="337" font-size="17" fill="#15803d" text-anchor="middle">no input</text><path d="M245,382 L301,309 M297.8480122811097,322.96656627163475 L301,309 L288.3268355854272,315.662649902344" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M375,382 L319,309 M331.6731644145728,315.662649902344 L319,309 L322.1519877188903,322.96656627163475" fill="none" stroke="#2563eb" stroke-width="3"/><text x="245" y="414" font-size="22" fill="#172554" text-anchor="middle">x₁</text><text x="375" y="414" font-size="22" fill="#172554" text-anchor="middle">x₂</text><text x="510" y="414" font-size="22" fill="#172554" text-anchor="middle">x₃</text><text x="310" y="452" font-size="16" fill="#172554" text-anchor="middle">The ternary parent remains unexecuted.</text><text x="310" y="488" font-size="21" fill="#172554" text-anchor="middle">N₁ = H* RHom(IC₀,y₁)</text><text x="310" y="523" font-size="21" fill="#172554" text-anchor="middle">N₂ = H* RHom(x₁ ∗ x₂,y₂)</text><text x="310" y="558" font-size="21" fill="#172554" text-anchor="middle">N₃ = H* RHom(x₃,y₃)</text><text x="310" y="591" font-size="18" fill="#172554" text-anchor="middle">One-cross degree: d₁ + d₂ + d₃ − 1</text><rect x="25" y="645" width="570" height="410" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="685" font-size="19" fill="#172554" text-anchor="middle">A closed first-order action can have curvature</text><text x="310" y="729" font-size="19" fill="#172554" text-anchor="middle">d₀x = y,   d₀u = v;   h₀y = x,   h₀v = u</text><text x="310" y="769" font-size="22" fill="#172554" text-anchor="middle">δ₁x = u,    δ₁y = −v,    δ₁u = v</text><text x="310" y="809" font-size="23" fill="#172554" text-anchor="middle">∂₀δ₁ = 0,       δ₁²x = v ≠ 0</text><text x="310" y="853" font-size="25" fill="#172554" text-anchor="middle">F(tδ₁)x = t²v</text><text x="310" y="895" font-size="24" fill="#172554" text-anchor="middle">ν₂x = −t²h₀(v) = −t²u</text><text x="310" y="936" font-size="24" fill="#172554" text-anchor="middle">Dx = y + t/(1+t) u</text><text x="310" y="975" font-size="20" fill="#172554" text-anchor="middle">Dy = −tv,    Du = (1+t)v,    Dv = 0</text><text x="310" y="1020" font-size="18" fill="#172554" text-anchor="middle">D² = 0; every finite t-adic window is finite.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.57.1–4; Exercises C.57.5.1–2. Grafting still uses its full domain.</text></g></svg>