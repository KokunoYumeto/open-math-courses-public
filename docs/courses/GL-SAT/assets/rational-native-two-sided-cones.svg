<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem38; Exercise38", "cones": {"initial": "rho_q=(-1)^q S[a,sigma]", "terminal": "lambda_q=S[sigma,b]", "homotopy": "J_q=(-1)^q S[a,sigma,b]"}, "full_family": "A=lambda star rho", "homotopy_equation": "delta J=f-A", "both_endpoint_comparison": "delta E=g*A-R A_intrinsic L", "weighted_example": {"L": 2, "R": 2, "intrinsic": 4, "transported": 16, "omitted_endpoint_defect": 12, "positive_endpoint_homotopy": "16 eps"}}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">Keep both native endpoint maps and their cones</text><text x="310" y="79" font-size="16" fill="#172554" text-anchor="middle">The entire original parameter functor supplies every core</text><rect x="18" y="108" width="584" height="287" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="150" font-size="25" fill="#172554" text-anchor="middle">D_a  →ρ  D_x  →λ  D_b</text><text x="310" y="194" font-size="21" fill="#2563eb" text-anchor="middle">ρ_q = (−1)ᵠ S[a,σ]       λ_q = S[σ,b]</text><text x="310" y="237" font-size="20" fill="#172554" text-anchor="middle">A = λ ⋆ ρ       J_q = (−1)ᵠ S[a,σ,b]</text><text x="310" y="281" font-size="24" fill="#15803d" text-anchor="middle">δJ = f − A       f = S[a,b]</text><text x="310" y="326" font-size="15" fill="#172554" text-anchor="middle">All original parameter arrows and all operator inputs remain.</text><text x="310" y="368" font-size="15" fill="#172554" text-anchor="middle">Identity-valued positive parameters are not formal identities.</text><rect x="18" y="416" width="584" height="331" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="457" font-size="19" fill="#172554" text-anchor="middle">A parameter change moves both endpoint images</text><path d="M139 510 L473 510" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/><path d="M139 629 L473 629" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/><path d="M139 517 L139 622" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/><path d="M473 622 L473 517" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/><text x="105" y="517" font-size="20" fill="#172554" text-anchor="middle">D_a</text><text x="513" y="517" font-size="20" fill="#172554" text-anchor="middle">D_b</text><text x="103" y="637" font-size="20" fill="#172554" text-anchor="middle">D_a₀</text><text x="514" y="637" font-size="20" fill="#172554" text-anchor="middle">D_b₀</text><text x="310" y="496" font-size="20" fill="#15803d" text-anchor="middle">g* A</text><text x="310" y="615" font-size="20" fill="#15803d" text-anchor="middle">A′</text><text x="109" y="577" font-size="22" fill="#2563eb" text-anchor="middle">L</text><text x="502" y="577" font-size="22" fill="#2563eb" text-anchor="middle">R</text><text x="310" y="565" font-size="21" fill="#172554" text-anchor="middle">δE = g* A − R A′ L</text><text x="310" y="690" font-size="22" fill="#15803d" text-anchor="middle">E = Kᴿ ⋆ ρ + R λ′ ⋆ Hᴸ</text><text x="310" y="726" font-size="16" fill="#172554" text-anchor="middle">The square is compared by its full homotopy E.</text><rect x="18" y="769" width="584" height="252" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="810" font-size="20" fill="#172554" text-anchor="middle">Exact weighted example: [0,4] and [1,3]</text><text x="310" y="853" font-size="23" fill="#172554" text-anchor="middle">L = 2       f₃₁ = 4       R = 2</text><text x="310" y="898" font-size="25" fill="#15803d" text-anchor="middle">R f₃₁ L = 16 = f₄₀</text><text x="310" y="942" font-size="18" fill="#b91c1c" text-anchor="middle">Dropping L and R gives 4, with defect 12.</text><text x="310" y="986" font-size="17" fill="#172554" text-anchor="middle">The original endpoint homotopy also retains 16 ε.</text><text x="310" y="1055" font-size="12" fill="#172554" text-anchor="middle">Full two-sided cones and both-end base change: Theorem 38.</text><text x="310" y="1082" font-size="12" fill="#172554" text-anchor="middle">Weighted and nonclosed higher-cochain examples: Exercise 38.</text><text x="310" y="1107" font-size="11" fill="#172554" text-anchor="middle">Free bar-module background: Keller, arXiv:math/9910179, §4.2.</text></g></svg>