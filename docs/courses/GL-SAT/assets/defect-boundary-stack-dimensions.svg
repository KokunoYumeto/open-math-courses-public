<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Boundary bounds retain divisor and stack dimensions</text>
<text x="310" y="84" font-size="18" text-anchor="middle">P=j_!*L; exact coroot divisors; original central characters</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="17" text-anchor="middle">On an adapted boundary stratum of dimension d:</text>
<text x="310" y="198" font-size="25" text-anchor="middle">H^n(s*P)=0 for n≥−d.</text>
<text x="310" y="237" font-size="25" text-anchor="middle">H^n(s!P)=0 for n≤−d.</text>
<text x="310" y="276" font-size="18" text-anchor="middle">Strict inequalities allow other boundary groups.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="21" text-anchor="middle">d₀=−Σ_{α&gt;0}(d_α+1); m=Σ_i m_i.</text>
<text x="310" y="443" font-size="17" text-anchor="middle">Twisting T by Σ_i α_i∨D_i changes d₀ by −2m.</text>
<text x="310" y="482" font-size="17" text-anchor="middle">Moving divisor base: ∏_i P^{m_i}, dimension m.</text>
<text x="310" y="521" font-size="18" text-anchor="middle">Moving stratum: d₀−m; fixed divisor: d₀−2m.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="20" text-anchor="middle">SL₂; actual torus line O(−1); root O(−2).</text>
<text x="310" y="688" font-size="20" text-anchor="middle">Degree 0: genuine stack A¹, dimension 1.</text>
<text x="310" y="727" font-size="22" text-anchor="middle">m≥1: moving stratum B_{P^m}V_m.</text>
<text x="310" y="766" font-size="21" text-anchor="middle">V_m=H⁰(O(2m−2))⊗O_{P^m}(2).</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="17" text-anchor="middle">rk V_m=2m−1; full additive stabilizer retained.</text>
<text x="310" y="933" font-size="27" text-anchor="middle">m=1 moving dimension: 0.</text>
<text x="310" y="972" font-size="18" text-anchor="middle">Fixed degree-one divisor: B G_a, dimension −1.</text>
<text x="310" y="1011" font-size="17" text-anchor="middle">Constant punctured-line extension is not clean.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorem N.4.1.1; Proposition N.5.1.1; Exercises N.6.1–N.6.2.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Apply the strict bounds on strata adapted to the actual complex.</text>
</svg>