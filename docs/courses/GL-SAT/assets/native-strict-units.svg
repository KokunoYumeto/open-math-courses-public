<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">The native diagram keeps its actual identity labels</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.71: strict formal units and the full comparison</text><rect x="25" y="105" width="570" height="300" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="23" fill="#172554" text-anchor="middle">Parallel index arrows remain distinct</text><text x="310" y="192" font-size="20" fill="#172554" text-anchor="middle">a₀ has native Id; a₁ has F₁; b has F₂</text><circle cx="95" cy="290" r="24" fill="#eff6ff" stroke="#2563eb"/><circle cx="310" cy="290" r="24" fill="#eff6ff" stroke="#2563eb"/><circle cx="525" cy="290" r="24" fill="#eff6ff" stroke="#2563eb"/><text x="95" y="299" font-size="25" fill="#172554" text-anchor="middle">0</text><text x="310" y="299" font-size="25" fill="#172554" text-anchor="middle">1</text><text x="525" y="299" font-size="25" fill="#172554" text-anchor="middle">2</text><path d="M120,281 Q203,213 284,281" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><path d="M120,300 Q203,368 284,300" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arr)"/><text x="203" y="235" font-size="23" fill="#2563eb" text-anchor="middle">a₀</text><text x="203" y="363" font-size="23" fill="#15803d" text-anchor="middle">a₁</text><path d="M341,290 L493,290 M480.0,296.0 L493,290 L480.0,284.0" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="417" y="268" font-size="24" fill="#7c3aed" text-anchor="middle">b</text><text x="310" y="387" font-size="22" fill="#172554" text-anchor="middle">b a₀ = c₀,     b a₁ = c₁</text><rect x="25" y="445" width="570" height="235" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="487" font-size="21" fill="#172554" text-anchor="middle">The operator model remembers that distinction</text><text x="310" y="533" font-size="21" fill="#172554" text-anchor="middle">formal i₀ :  Id(R),     nonidentity a₀ : E = jq</text><text x="310" y="578" font-size="24" fill="#172554" text-anchor="middle">(Id(R))₁(S) = S,     E₁(S) = 0</text><text x="310" y="621" font-size="25" fill="#172554" text-anchor="middle">qE = q,     E² = E</text><text x="310" y="659" font-size="19" fill="#172554" text-anchor="middle">S = (1,0,0) is a bridge basis element.</text><rect x="25" y="720" width="570" height="345" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="762" font-size="21" fill="#172554" text-anchor="middle">The actual native comparison has a higher term</text><text x="310" y="807" font-size="22" fill="#172554" text-anchor="middle">β = U₁ : F₂ → F₃,     α = j_*(βq)</text><text x="310" y="851" font-size="23" fill="#172554" text-anchor="middle">α₀ = Id(R) + M(y,e) − Z(f,e)</text><text x="310" y="895" font-size="21" fill="#172554" text-anchor="middle">α₁(M(e,f)) = −S − 2Z(f,y) + 3Z(f,e)</text><text x="310" y="945" font-size="19" fill="#172554" text-anchor="middle">Bare truncation leaves the nonzero defect</text><text x="310" y="988" font-size="22" fill="#172554" text-anchor="middle">Z(e,e) − Z(f,f) − Z(y,y) + 3Z(y,e).</text><text x="310" y="1036" font-size="18" fill="#172554" text-anchor="middle">Full α and its actual inverse retain all Taylor terms.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorem C.71.1.1; Exercises C.71.2.1–2.</text></g></svg>