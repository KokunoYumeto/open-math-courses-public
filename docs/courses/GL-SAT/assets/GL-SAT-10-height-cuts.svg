<svg xmlns="http://www.w3.org/2000/svg" width="540" height="760" viewBox="0 0 540 760" role="img" aria-labelledby="title desc">
  <title id="title">Height cuts preserve total-coweight summands through fusion</title>
  <desc id="desc">Schematic of the maps in Lesson 10 equations 5.4 to 5.8. Equal-height pieces with different total coweights remain separate. Pieces labelled by pairs whose sum is the same coweight are compared with that diagonal weight space by canonical local-system transport.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27565c"/></marker></defs>
  <rect width="540" height="760" rx="12" fill="#fbfaf4"/>
  <g font-family="Arial, sans-serif" fill="#183d43" text-anchor="middle">
    <text x="270" y="34" font-size="23" font-weight="bold">Height cuts and fusion</text>
    <text x="270" y="63" font-size="18">Schematic of summand maps, not a geometric plot</text>
    <text x="270" y="99" font-size="21">Plücker weight: wν = C₀ − q hν, q &gt; 0</text>
    <rect x="28" y="123" width="484" height="201" rx="8" fill="#fff" stroke="#75989a" stroke-width="2"/>
    <line x1="28" y1="185" x2="512" y2="185" stroke="#75989a"/>
    <line x1="28" y1="261" x2="512" y2="261" stroke="#75989a"/>
    <text x="72" y="160" font-size="21">h + 2</text><text x="302" y="160" font-size="18">upper cohomology degrees</text>
    <text x="72" y="229" font-size="21">h</text>
    <rect x="122" y="199" width="169" height="48" rx="6" fill="#dceee8" stroke="#357963"/>
    <rect x="311" y="199" width="169" height="48" rx="6" fill="#fff0cf" stroke="#9b7629"/>
    <text x="206" y="228" font-size="21">Zν⁺</text><text x="395" y="228" font-size="21">Zν′⁺</text>
    <text x="72" y="299" font-size="21">h − 2</text><text x="302" y="299" font-size="18">lower cohomology degrees</text>
    <text x="270" y="355" font-size="20">hν = hν′ = h, but χν ≠ χν′ if ν ≠ ν′</text>
    <text x="270" y="385" font-size="18">Distinct character spaces separate the layer.</text>
    <text x="270" y="434" font-size="21" font-weight="bold">One fixed total label ν</text>
    <rect x="38" y="453" width="464" height="93" rx="8" fill="#dceee8" stroke="#357963" stroke-width="2"/>
    <text x="270" y="482" font-size="20">Distinct points: a ≠ b</text>
    <text x="270" y="517" font-size="22">⊕μ+η=ν Fμ(P) ⊗ Fη(Q)</text>
    <line x1="270" y1="550" x2="270" y2="626" stroke="#27565c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="47" y="571" width="446" height="31" fill="#fbfaf4"/>
    <text x="270" y="593" font-size="18">canonical local-system transport</text>
    <rect x="38" y="633" width="464" height="93" rx="8" fill="#dceee8" stroke="#357963" stroke-width="2"/>
    <text x="270" y="661" font-size="20">Collision: a = b</text>
    <text x="270" y="699" font-size="23">Fν(P ∗ Q)</text>
    <text x="270" y="748" font-size="17">Proof: §5.2–§5.4, equations (5.4)–(5.8)</text>
  </g>
</svg>
