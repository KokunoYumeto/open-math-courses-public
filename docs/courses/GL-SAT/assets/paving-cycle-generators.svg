<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Cell closures give actual Tate generators</text>
<text x="310" y="84" font-size="21" text-anchor="middle">BM_m(Z)=H^(−m)(Z,Ω_Z); geometric Frobenius</text>
<rect x="28" y="118" width="564" height="185" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="160" font-size="24" text-anchor="middle">Split cell U=A^e over F_q; closure C</text>
<text x="310" y="203" font-size="27" text-anchor="middle">D=C∖U; dim D ≤ e−1</text>
<text x="310" y="246" font-size="25" text-anchor="middle">BM_(2e)(D)=BM_(2e−1)(D)=0</text>
<text x="310" y="279" font-size="18" text-anchor="middle">The bound comes from actual compact-support duality.</text>
<path d="M310,320 L310,353" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="369" width="564" height="189" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="413" font-size="25" text-anchor="middle">BM_(2e)(C) → BM_(2e)(U)=E(e)</text>
<text x="310" y="457" font-size="25" text-anchor="middle">Restriction is an isomorphism.</text>
<text x="310" y="501" font-size="23" text-anchor="middle">Its inverse gives the cell-closure class.</text>
<text x="310" y="536" font-size="18" text-anchor="middle">All maps are defined over F_q; Frobenius is q^(−e).</text>
<path d="M310,574 L310,607" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="623" width="564" height="207" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="666" font-size="24" text-anchor="middle">Proper push of each closure class into Y</text>
<text x="310" y="710" font-size="19" text-anchor="middle">Dimension-j cell classes form a basis of BM_(2j)(Y).</text>
<text x="310" y="754" font-size="25" text-anchor="middle">BM_(2j)(Y)=E(j)^(c_j); F=q^(−j) id</text>
<text x="310" y="798" font-size="23" text-anchor="middle">c_j is the number of dimension-j cells.</text>
<path d="M310,846 L310,879" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="895" width="564" height="177" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="939" font-size="29" text-anchor="middle">H^(2j)(Y,E)=E(−j)^(c_j)</text>
<text x="310" y="983" font-size="24" text-anchor="middle">F=q^j id; odd cohomology vanishes.</text>
<text x="310" y="1027" font-size="19" text-anchor="middle">Cycle maps exclude Jordan blocks between equal cells.</text>
<text x="310" y="1055" font-size="18" text-anchor="middle">Nilpotents are removed by actual coefficient invariance.</text>
<text x="310" y="1125" font-size="20" text-anchor="middle">Lemma C.1.1.1; Exercise C.4.2.</text>
<text x="310" y="1165" font-size="19" text-anchor="middle">No singular-immersion purity theorem is used.</text>
</svg>