<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="20" fill="#172554" text-anchor="middle">Keep native parameter tags and complete finite domains</text><text x="310" y="78" font-size="18" fill="#172554" text-anchor="middle">C.49.1–3: count the nonnegative mapping degrees</text><rect x="25" y="104" width="570" height="304" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="150" font-size="24" fill="#172554" text-anchor="middle">P = |word| + index count + cross count</text><text x="310" y="198" font-size="17" fill="#172554" text-anchor="middle">= Σ positive core degrees + Σ central mapping degrees</text><text x="310" y="246" font-size="18" fill="#172554" text-anchor="middle">Coordinate / inverse: Pout ≤ Pin;   d: Pout ≤ Pin+1</text><text x="310" y="290" font-size="20" fill="#172554" text-anchor="middle">Products: P = Σ Pᵢ;   faces preserve P exactly.</text><text x="310" y="339" font-size="20" fill="#172554" text-anchor="middle">c ⊗ su₁ ⊗ a₀₁  ↦  su₀:   P drops 1 → 0.</text><text x="310" y="392" font-size="16" fill="#172554" text-anchor="middle">The complete differential domain is Pin ≤ D−1, output ≤ D.</text><rect x="25" y="442" width="570" height="324" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="484" font-size="19" fill="#172554" text-anchor="middle">C.49.5: ordinary scalar 1 keeps its nonidentity tag</text><text x="110" y="546" font-size="27" fill="#172554" text-anchor="middle">0</text><text x="310" y="546" font-size="27" fill="#172554" text-anchor="middle">1</text><text x="510" y="546" font-size="27" fill="#172554" text-anchor="middle">2</text><path d="M145,535 L270,535 M257.0,541.0 L270,535 L257.0,529.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M350,535 L475,535 M462.0,541.0 L475,535 L462.0,529.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="208" y="519" font-size="19" fill="#172554" text-anchor="middle">1 ⊗ a</text><text x="414" y="519" font-size="19" fill="#172554" text-anchor="middle">1 ⊗ b</text><text x="310" y="598" font-size="23" fill="#172554" text-anchor="middle">(1 ⊗ b)(1 ⊗ a) = 1 ⊗ c</text><text x="310" y="649" font-size="21" fill="#172554" text-anchor="middle">d t(sb|sa) = −t(sc) + t(sb)t(sa)</text><text x="310" y="698" font-size="20" fill="#172554" text-anchor="middle">Both terms survive; their tagged images cancel.</text><text x="310" y="749" font-size="17" fill="#172554" text-anchor="middle">Each output retains its actual parameter arrow.</text><rect x="25" y="805" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="847" font-size="20" fill="#172554" text-anchor="middle">C.49.6: the whole nested tagged prism graph</text><text x="310" y="892" font-size="22" fill="#172554" text-anchor="middle">F_I: ΩB(Uₙ ⊗ kI) → ΩB(Uₘ ⊗ kI)</text><text x="310" y="938" font-size="22" fill="#172554" text-anchor="middle">Cross evaluation: m ⊗ v ↦ m Fτ(v)</text><text x="310" y="980" font-size="18" fill="#172554" text-anchor="middle">Arity-n core: C⊗⋯⊗C ⊗ D_I; all path cuts remain.</text><text x="310" y="1016" font-size="16" fill="#172554" text-anchor="middle">C.49.4 gives the actual face-compatible cell coordinates.</text><text x="310" y="1070" font-size="15" fill="#172554" text-anchor="middle">Exercises C.49.7.1–2 compute the strict P drop and unit tag.</text><text x="310" y="1104" font-size="15" fill="#172554" text-anchor="middle">Tensor and grafting covariance use their full marked equations.</text></g></svg>