<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="24" text-anchor="middle">A fixed second kernel transports derived maps</text>
<text x="310" y="83" font-size="20" text-anchor="middle">Q is genuine perverse; A is any bounded first complex.</text>
<rect x="28" y="112" width="564" height="219" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="25" text-anchor="middle">(e,y)·h=(eh,h⁻¹y),   H=J_nG</text>
<text x="310" y="197" font-size="25" text-anchor="middle">The first endpoint eK⁺ stays fixed.</text>
<text x="310" y="240" font-size="18" text-anchor="middle">The second factor supplies the action and coherent descent.</text>
<text x="310" y="281" font-size="25" text-anchor="middle">On a frame chart: K_Q=E_U ⊠ Q.</text>
<text x="310" y="314" font-size="15" text-anchor="middle">Negative perverse Hom gives coherence; bounded Čech layers give descent.</text>
<path d="M310,346 L310,377" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="391" width="564" height="180" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="432" font-size="23" text-anchor="middle">Y=X₁ ~× X₂;   p:Y→X₁;   m:Y→X</text>
<text x="310" y="478" font-size="28" text-anchor="middle">C_Q(A)=Rm_*(p*A ⊗ K_Q)</text>
<text x="310" y="522" font-size="19" text-anchor="middle">A global functor on underlying constructible complexes.</text>
<text x="310" y="556" font-size="18" text-anchor="middle">On perverse genuine A, it is the actual heart convolution.</text>
<path d="M310,586 L310,617" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="631" width="564" height="184" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="672" font-size="26" text-anchor="middle">I_λ ─u→ B_λ ─v→ I_λ,   vu=1</text>
<text x="310" y="714" font-size="18" text-anchor="middle">Affine cells: matching parity kills the odd Hom obstruction.</text>
<text x="310" y="756" font-size="18" text-anchor="middle">The dense-cell identity lifts to the whole resolution image.</text>
<text x="310" y="800" font-size="20" text-anchor="middle">These underlying first-factor maps need no left action.</text>
<path d="M310,830 L310,861" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="875" width="564" height="205" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="916" font-size="28" text-anchor="middle">C_Q(v) C_Q(u)=C_Q(vu)=1</text>
<text x="310" y="958" font-size="23" text-anchor="middle">I_λ*Q is an actual derived retract of B_λ*Q.</text>
<text x="310" y="1000" font-size="24" text-anchor="middle">B_λ*Q=(n_ω·)_* Θ_s₁⋯Θ_sᵣ(Q)[r]</text>
<text x="310" y="1042" font-size="23" text-anchor="middle">r=d_λ; wall complexes are unshifted.</text>
<text x="310" y="1070" font-size="19" text-anchor="middle">The resolution shift supplies the added parity d_λ.</text>
<text x="310" y="1126" font-size="17" text-anchor="middle">Lemmas C.1.1.1 and C.2.3.1; Theorem C.3.2.1</text>
<text x="310" y="1167" font-size="16" text-anchor="middle">Every construction stays on finite schemes in the actual rational theory.</text>
</svg>