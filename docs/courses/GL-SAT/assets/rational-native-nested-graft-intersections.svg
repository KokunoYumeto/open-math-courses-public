<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem67; Exercise67", "component_edges": [[0, 1], [0, 2], [1, 3]], "chart_seams_A": ["e01", "e02"], "chart_seams_B": ["e13"], "intersection": "U_A intersect U_B = U_(A union B)", "proper_states": [4, 8, 10, 12, 14], "descendant_completion": [1, 3], "closure": {"4": 14, "8": 10, "10": 10, "12": 14, "14": 14}, "wrong_child_only_at_4": 6, "correct_subtree_completion_at_4": 14, "invariant": "Every selected prefix contraction set is fixed"}</metadata><text x="310" y="40" font-size="22" fill="#172554" text-anchor="middle">A nested completion includes every descendant</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">Original component labels and uncontracted seam edges</text><rect x="18" y="104" width="584" height="374" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="23" fill="#2563eb" text-anchor="middle">Four operation components</text><path d="M 310 219 L 195 262" stroke="#15803d" stroke-width="3"/><text x="283.5" y="245.0" font-size="18" fill="#15803d" text-anchor="middle">e₀₁</text><path d="M 310 219 L 425 262" stroke="#15803d" stroke-width="3"/><text x="398.5" y="245.0" font-size="18" fill="#15803d" text-anchor="middle">e₀₂</text><path d="M 195 305 L 195 370" stroke="#15803d" stroke-width="3"/><text x="226.0" y="342.0" font-size="18" fill="#15803d" text-anchor="middle">e₁₃</text><rect x="287" y="177" width="46" height="42" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="206" font-size="24" fill="#2563eb" text-anchor="middle">0</text><rect x="172" y="263" width="46" height="42" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/><text x="195" y="292" font-size="24" fill="#2563eb" text-anchor="middle">1</text><rect x="402" y="263" width="46" height="42" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/><text x="425" y="292" font-size="24" fill="#2563eb" text-anchor="middle">2</text><rect x="172" y="371" width="46" height="42" rx="9" fill="white" stroke="#2563eb" stroke-width="2"/><text x="195" y="400" font-size="24" fill="#2563eb" text-anchor="middle">3</text><text x="310" y="449" font-size="18" fill="#172554" text-anchor="middle">0: binary;  1: unary;  2 and 3: nullary</text><rect x="18" y="499" width="584" height="226" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="541" font-size="19" fill="#15803d" text-anchor="middle">Unsafe seam 0 → 1: complete components {1,3}.</text><text x="310" y="587" font-size="20" fill="#172554" text-anchor="middle">At prefix 4, only component 2 is executed.</text><text x="310" y="631" font-size="22" fill="#b91c1c" text-anchor="middle">Only child 1:   4 ↦ 6   (incompatible)</text><text x="310" y="681" font-size="24" fill="#15803d" text-anchor="middle">Whole subtree:   4 ↦ 14;    z = 10</text><rect x="18" y="746" width="584" height="245" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="788" font-size="24" fill="#2563eb" text-anchor="middle">A = {e₀₁,e₀₂};     B = {e₁₃}</text><text x="310" y="833" font-size="25" fill="#15803d" text-anchor="middle">U_A ∩ U_B = U_(A ∪ B)</text><text x="310" y="878" font-size="17" fill="#172554" text-anchor="middle">The common partition has all four original components.</text><text x="310" y="921" font-size="16" fill="#172554" text-anchor="middle">c changes execution ideals; every prefix edge set stays fixed.</text><text x="310" y="961" font-size="17" fill="#172554" text-anchor="middle">The parent stays unchanged, preventing the removed top.</text><text x="310" y="1031" font-size="14" fill="#172554" text-anchor="middle">Original bar mergers and deleted cuts use the same labelled words.</text><text x="310" y="1070" font-size="22" fill="#2563eb" text-anchor="middle">λₚ = (−1)^(p(p−1)/2);      h = h₀ b h₀</text><text x="310" y="1105" font-size="13" fill="#172554" text-anchor="middle">Nested compatible inputs and exact original chart intersections: §67.</text></g></svg>