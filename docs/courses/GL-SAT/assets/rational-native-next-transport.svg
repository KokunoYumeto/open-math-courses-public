<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem14", "example": "Exercise14", "source_coordinate": "g1=1,g2=0,g3=k3; all remaining nonidentity primitives0", "third_structure": "b3new=b3+[K3,b1]_3", "fourth_structure": "b4new=b4+[K3,b2]_4", "third_comparison": "f3new=f3-f1k3", "fourth_comparison": "f4new=f4-(f2 K3)_4", "source_witness": ["Eef", "Efe", "Eef", "Eee"], "bad_source_square": "sEee", "comparison_witness": ["Eef", "Eff", "Eee"], "bad_comparison_defect": "-s1"}</metadata><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">A source coordinate changes the next cells</text><text x="310" y="79" font-size="17" fill="#172554" text-anchor="middle">The original unary and binary data remain fixed.</text><rect x="17" y="112" width="586" height="242" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="153" font-size="22" fill="#172554" text-anchor="middle">g₁ = 1,  g₂ = 0,  g₃ = k₃</text><text x="310" y="203" font-size="24" fill="#172554" text-anchor="middle">b′₃ = b₃ + [K₃,b₁]₃</text><text x="310" y="253" font-size="24" fill="#2563eb" text-anchor="middle">b′₄ = b₄ + [K₃,b₂]₄</text><text x="310" y="303" font-size="17" fill="#172554" text-anchor="middle">Every original connected subtree is retained.</text><text x="310" y="335" font-size="15" fill="#172554" text-anchor="middle">K₃ has degree zero in the suspended tree bar.</text><rect x="17" y="383" width="586" height="228" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="425" font-size="20" fill="#15803d" text-anchor="middle">Fourth correction: original facet indices</text><text x="164" y="474" font-size="18" fill="#172554" text-anchor="middle">Linear internal tree</text><text x="456" y="474" font-size="18" fill="#172554" text-anchor="middle">Internal star</text><text x="164" y="520" font-size="20" fill="#172554" text-anchor="middle">3 terms − 2 terms</text><text x="456" y="520" font-size="20" fill="#172554" text-anchor="middle">3 terms − 3 terms</text><text x="164" y="563" font-size="18" fill="#15803d" text-anchor="middle">5 pentagon facets</text><text x="456" y="563" font-size="18" fill="#15803d" text-anchor="middle">6 hexagon facets</text><text x="310" y="596" font-size="15" fill="#172554" text-anchor="middle">Terms are K₃b₂ − b₂K₃, with their graded signs.</text><rect x="17" y="642" width="586" height="191" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="684" font-size="20" fill="#172554" text-anchor="middle">The fixed-target comparison also changes</text><text x="310" y="732" font-size="24" fill="#2563eb" text-anchor="middle">f′₃ = f₃ − f₁k₃</text><text x="310" y="778" font-size="22" fill="#172554" text-anchor="middle">f′₄ = f₄ − (f₂K₃)₄</text><text x="310" y="817" font-size="17" fill="#172554" text-anchor="middle">Use the whole map F′ = Fg⁻¹.</text><rect x="17" y="863" width="586" height="200" rx="15" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="310" y="895" font-size="18" fill="#b91c1c" text-anchor="middle">Exact nonminimal failures if transport is omitted</text><text x="310" y="933" font-size="16" fill="#172554" text-anchor="middle">w = sE_ef | sE_fe | sE_ef | sE_ee</text><text x="310" y="968" font-size="20" fill="#b91c1c" text-anchor="middle">(b_bad)²(w) = sE_ee</text><text x="310" y="1003" font-size="16" fill="#172554" text-anchor="middle">u = sE_ef | sE_ff | sE_ee</text><text x="310" y="1038" font-size="17" fill="#b91c1c" text-anchor="middle">Omitting f′₃ gives chain defect −s1 on u.</text><text x="310" y="1081" font-size="13" fill="#172554" text-anchor="middle">Exact formulas and witnesses: Theorem 14 and Exercise 14.</text><text x="310" y="1107" font-size="11" fill="#172554" text-anchor="middle">Full tree-bar conventions: Theorem 1; free background: Keller, math/9910179.</text></g></svg>