<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">Tensor generators and their envelope</text><text x="310" y="76" font-size="15" fill="#172554" text-anchor="middle">Actual graded tensors; arithmetic enhancement; cochain weights</text><rect x="25" y="105" width="570" height="279" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="20" fill="#172554" text-anchor="middle">1. All generator morphisms, with composition</text><text x="310" y="188" font-size="24" fill="#172554" text-anchor="middle">Φ(b*c) = Φ(b) ⊗A Φ(c)</text><text x="310" y="229" font-size="22" fill="#172554" text-anchor="middle">ICλ → A ⊗ Vλ;  A = Sym(Lie(H)[−2])</text><text x="310" y="270" font-size="19" fill="#172554" text-anchor="middle">Every linear coordinate has degree two.</text><text x="310" y="309" font-size="21" fill="#172554" text-anchor="middle">Dᵇsph  ≃  PerfH(A), at arithmetic coefficients</text><text x="310" y="348" font-size="18" fill="#172554" text-anchor="middle">Enhanced envelope equivalence: C.22.2.1.</text><text x="310" y="375" font-size="15" fill="#172554" text-anchor="middle">An enhanced monoidal upgrade still needs its own proof.</text><rect x="25" y="415" width="570" height="247" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="455" font-size="21" fill="#172554" text-anchor="middle">2. Actual normalized convolution words P</text><text x="310" y="499" font-size="23" fill="#172554" text-anchor="middle">F on Hⁿ(ICλ) = aⁿ id;  a² = q</text><text x="310" y="542" font-size="22" fill="#172554" text-anchor="middle">P = ⊕ν ICν ⊗ Mν(P);  F on Mν(P) = id</text><text x="310" y="582" font-size="22" fill="#172554" text-anchor="middle">F on Extⁿ(P,Q): sole eigenvalue aⁿ</text><text x="310" y="620" font-size="16" fill="#172554" text-anchor="middle">Global retraction transport; tensor cup; evaluation.</text><text x="310" y="647" font-size="15" fill="#172554" text-anchor="middle">Theorem C.22.3.1; Jordan parts in Ext are retained.</text><rect x="25" y="707" width="570" height="302" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="747" font-size="20" fill="#172554" text-anchor="middle">3. Hypothesis: strict, locally finite cochain F</text><text x="310" y="790" font-size="19" fill="#172554" text-anchor="middle">C = ⊕w Cw;  Cw is the primary aʷ-space.</text><text x="310" y="831" font-size="23" fill="#172554" text-anchor="middle">Dⁿ = (⊕w&gt;n Cwⁿ) ⊕ cycles(Cnⁿ)</text><text x="310" y="872" font-size="17" fill="#172554" text-anchor="middle">C  ←  D  →  H*(C): multiplicative quasi-isomorphisms</text><text x="310" y="913" font-size="19" fill="#172554" text-anchor="middle">Degree −r &lt; 0 ⇒ output weight &gt; output degree</text><text x="310" y="952" font-size="19" fill="#172554" text-anchor="middle">Its projected higher operation is zero.</text><text x="310" y="991" font-size="16" fill="#172554" text-anchor="middle">Verify the hypothesis before a geometric application.</text><text x="310" y="1046" font-size="18" fill="#172554" text-anchor="middle">Termwise locally finite parts can lose cohomology.</text><text x="310" y="1082" font-size="17" fill="#172554" text-anchor="middle">Theorem C.22.4.1; counterexample C.22.5.2.</text><text x="310" y="1107" font-size="14" fill="#172554" text-anchor="middle">All groups are the full H; no monoidal equivalence inferred.</text></g></svg>