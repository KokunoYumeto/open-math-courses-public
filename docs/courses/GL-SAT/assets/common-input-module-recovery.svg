<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">One core supplies every tensor input</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">Actual bar modules; the full higher differential remains.</text><rect x="25" y="104" width="570" height="302" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="20" fill="#172554" text-anchor="middle">1. Pull back the represented convolution module</text><text x="310" y="194" font-size="26" fill="#172554" text-anchor="middle">C = BM;     Aₙ = C^(⊗n)</text><text x="310" y="243" font-size="27" fill="#172554" text-anchor="middle">Zσ = C⊗sMₙ⊗Aₙ</text><text x="310" y="289" font-size="25" fill="#172554" text-anchor="middle">Zσ = Z □_(BMₙ) Aₙ</text><text x="310" y="334" font-size="22" fill="#172554" text-anchor="middle">ι(c,m,a) = Σ c⊗m⊗σₙ(a₁)⊗a₂</text><text x="310" y="382" font-size="17" fill="#172554" text-anchor="middle">C.39.1–C.39.2: actual pullback and finite coordinates.</text><rect x="25" y="442" width="570" height="348" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="484" font-size="19" fill="#172554" text-anchor="middle">2. The common-input graph recovers convolution</text><text x="310" y="535" font-size="24" fill="#172554" text-anchor="middle">Lcommon = C ⊕ Aₙ ⊕ Zσ</text><path d="M310,555 L310,606 M304.0,593.0 L310,606 L316.0,593.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="470" y="591" font-size="24" fill="#172554" text-anchor="middle">Qₙ</text><text x="310" y="640" font-size="24" fill="#172554" text-anchor="middle">Loriginal = C ⊕ BMₙ ⊕ Z</text><text x="310" y="686" font-size="23" fill="#172554" text-anchor="middle">Qₙ on cores: 1C and σₙ</text><text x="310" y="731" font-size="23" fill="#172554" text-anchor="middle">Qₙ on cross: 1⊗1⊗σₙ</text><text x="310" y="770" font-size="17" fill="#172554" text-anchor="middle">ΩQₙ is an actual graph quasi-equivalence; C.39.5.</text><rect x="25" y="829" width="570" height="191" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="870" font-size="21" fill="#172554" text-anchor="middle">3. One common-core coordinate group</text><text x="310" y="916" font-size="23" fill="#172554" text-anchor="middle">(g,{Tₙ});  left g, right g^(⊗n)</text><text x="310" y="960" font-size="21" fill="#172554" text-anchor="middle">(h,{Uₙ})(g,{Tₙ}) = (hg,{UₙTₙ})</text><text x="310" y="1000" font-size="18" fill="#172554" text-anchor="middle">W = |c|+|m|+|a|;  the differential raises W by 1.</text><text x="310" y="1060" font-size="17" fill="#172554" text-anchor="middle">C.39.3–C.39.4 prove shuffle and bar–cobar recovery.</text><text x="310" y="1101" font-size="16" fill="#172554" text-anchor="middle">Complete geometric unit/permutation/substitution marks remain.</text></g></svg>