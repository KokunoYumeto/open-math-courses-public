<svg xmlns="http://www.w3.org/2000/svg" width="620" height="950" viewBox="0 0 620 950" role="img" aria-labelledby="title desc">
<title id="title">A smooth line with an inseparable closed residue</title>
<desc id="desc">For k equal to F p of a, with a transcendental, L equals k of u, f equals u to the p minus a, and q is the ideal generated by f. The residue field E is k of alpha with alpha to the p equal to a. The absolute differential obstruction E da maps to minus the class of f in the cotangent space. The polynomial base P equals k of Y, with Y sent to u, gives an identity finite etale Artinian model P localized at Y to the p minus a modulo its nth power, equal to L localized at q modulo f to the n.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#152b3b}.title{font-size:24px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.math{font-size:19px;font-weight:600}.card{fill:#f4f8fb;stroke:#b9cbd7;stroke-width:1.4}.green{fill:#ecf7f3;stroke:#89bba7;stroke-width:1.4}.map{stroke:#34495e;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="620" height="950" fill="white"/>
<text x="28" y="38" class="title">A smooth line with an inseparable residue</text>
<text x="28" y="75" class="body">k = F<tspan baseline-shift="sub" font-size="12">p</tspan>(a), a transcendental; L = k[u]; f = u<tspan baseline-shift="super" font-size="12">p</tspan> − a; q = (f).</text>
<text x="28" y="103" class="body">E = κ(q) = k(α), α<tspan baseline-shift="super" font-size="12">p</tspan> = a. The extension E/k is purely inseparable.</text>

<rect x="20" y="125" width="580" height="152" rx="12" class="card"/>
<text x="38" y="155" class="heading">1. Regularity of the local ring is retained</text>
<text x="91" y="202" class="math" text-anchor="middle">k</text>
<text x="299" y="202" class="math" text-anchor="middle">L<tspan baseline-shift="sub" font-size="14">q</tspan></text>
<text x="528" y="202" class="math" text-anchor="middle">E</text>
<path d="M115 195 H270" class="map"/><path d="M326 195 H501" class="map"/>
<text x="410" y="184" class="small" text-anchor="middle">f ↦ 0, u ↦ α</text>
<text x="38" y="243" class="body">L is smooth over k; L<tspan baseline-shift="sub" font-size="12">q</tspan> is regular of dimension 1.</text>

<rect x="20" y="297" width="580" height="282" rx="12" class="green"/>
<text x="38" y="328" class="heading">2. Absolute differentials locate the obstruction</text>
<text x="100" y="378" class="math" text-anchor="middle">E da</text>
<text x="300" y="378" class="math" text-anchor="middle">E da ⊕ E du</text>
<text x="528" y="378" class="math" text-anchor="middle">E dα</text>
<path d="M143 371 H218" class="map"/><path d="M381 371 H489" class="map"/>
<text x="430" y="404" class="small" text-anchor="middle">da ↦ 0; du ↦ dα</text>
<text x="38" y="445" class="body">D(E/k) = E da is the kernel of the composite.</text>
<text x="112" y="492" class="math" text-anchor="middle">E [f]</text>
<path d="M162 485 H223" class="map"/>
<text x="304" y="492" class="math" text-anchor="middle">E da ⊕ E du</text>
<text x="183" y="466" class="small" text-anchor="middle">[f] ↦ −da</text>
<text x="38" y="538" class="body">D(E/k) ↪ qL<tspan baseline-shift="sub" font-size="12">q</tspan>/(qL<tspan baseline-shift="sub" font-size="12">q</tspan>)² sends da ↦ −[f].</text>
<text x="38" y="561" class="small">The obstruction has dimension 1, equal to dim L<tspan baseline-shift="sub" font-size="11">q</tspan>.</text>

<rect x="20" y="599" width="580" height="226" rx="12" class="card"/>
<text x="38" y="630" class="heading">3. Use the polynomial base for every n ≥ 1</text>
<text x="38" y="665" class="body">P = k[Y],  Y ↦ u;  p = (Y<tspan baseline-shift="super" font-size="12">p</tspan> − a) ↦ q.</text>
<text x="126" y="713" class="math" text-anchor="middle">P<tspan baseline-shift="sub" font-size="14">p</tspan> / p<tspan baseline-shift="super" font-size="13">n</tspan>P<tspan baseline-shift="sub" font-size="14">p</tspan></text>
<text x="337" y="713" class="math" text-anchor="middle">C</text>
<text x="524" y="713" class="math" text-anchor="middle">L<tspan baseline-shift="sub" font-size="14">q</tspan> / (f<tspan baseline-shift="super" font-size="13">n</tspan>)</text>
<path d="M211 706 H310" class="map"/><path d="M365 706 H453" class="map"/>
<text x="261" y="738" class="small" text-anchor="middle">isomorphism</text>
<text x="410" y="738" class="small" text-anchor="middle">identity</text>
<text x="38" y="779" class="body">C = k[u]/(f<tspan baseline-shift="super" font-size="12">n</tspan>): finite étale over P<tspan baseline-shift="sub" font-size="12">p</tspan> / p<tspan baseline-shift="super" font-size="12">n</tspan>P<tspan baseline-shift="sub" font-size="12">p</tspan>, flat into the target.</text>
<text x="38" y="804" class="small">The residue extension over this base is E/E, hence separable.</text>
<text x="28" y="857" class="body">The inseparable parameter relation belongs to the polynomial base.</text>
<text x="28" y="882" class="body">The entire Artinian deformation is étale over that base.</text>
<text x="28" y="912" class="small">Proof: Theorems G.12.3.1 and G.14.1; Exercise G.16.2.</text>
<a href="https://stacks.math.columbia.edu/tag/07E5"><text x="28" y="936" class="small">Free human sources: Stacks 07E5</text></a>
<a href="https://stacks.math.columbia.edu/tag/07FH"><text x="285" y="936" class="small">and 07FH.</text></a>
</svg>
