xiliary consumed identity middle letters vanish.</text><text x="310" y="990" font-size="16" fill="#172554" text-anchor="middle">Original proper parameters and direct δ remain.</text><text x="310" y="1043" font-size="12" fill="#172554" text-anchor="middle">Completed native cut families and marked sections: Theorem 51.</text><text x="310" y="1075" font-size="12" fill="#172554" text-anchor="middle">Unsafe bar boundary and genuine nullary output: Exercise 51.</text><text x="310" y="1106" font-size="10" fill="#172554" text-anchor="middle">Original full comparisons: C47.2–3, C48.2 and C69; graph formulas: 24–27, 43.</text></g></svg>