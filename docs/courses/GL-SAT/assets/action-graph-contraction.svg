<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="26" text-anchor="middle">The action graph kills the open term</text>
<text x="310" y="82" font-size="21" text-anchor="middle">Every a_i − b_j &gt; 0; no weight is inverted.</text>
<rect x="28" y="112" width="564" height="212" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="154" font-size="25" text-anchor="middle">Γ ⊂ A¹_S × Y × P(A ⊕ B)</text>
<text x="310" y="197" font-size="24" text-anchor="middle">y_j z_i = t^(a_i−b_j) y_i z_j</text>
<text x="310" y="238" font-size="19" text-anchor="middle">At t = 0: some y_j in B is a unit ⇒ z_i = 0.</text>
<text x="310" y="274" font-size="21" text-anchor="middle">The second point lies in Z = P(B).</text>
<text x="310" y="306" font-size="19" text-anchor="middle">r₁ is proper; r₂ is an isomorphism for t ≠ 0.</text>
<path d="M310,338 L310,379" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="393" width="564" height="184" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="431" font-size="20" text-anchor="middle">U = Y ∖ Z,   F_U = σ_! σ*F,   C = Rf_* F_U</text>
<text x="310" y="474" font-size="24" text-anchor="middle">D = RQ_* Rr₂,* r₂* p_Y* F_U</text>
<text x="310" y="518" font-size="19" text-anchor="middle">The graph open is G_m × U; equivariance gives</text>
<text x="310" y="552" font-size="22" text-anchor="middle">D = RQ_* j_Y,! j_Y* p_Y* F_U.</text>
<path d="M310,591 L310,632" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="646" width="564" height="175" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="687" font-size="25" text-anchor="middle">j*D = (q×)* C,   Rq_*D = 0</text>
<text x="310" y="729" font-size="22" text-anchor="middle">Affine-line localization ⇒ z*D = 0</text>
<text x="310" y="772" font-size="24" text-anchor="middle" style="fill:#15803d">Therefore D = j_! j*D.</text>
<text x="310" y="805" font-size="18" text-anchor="middle">This uses contraction, not nonproper special-fiber BC.</text>
<path d="M310,836 L310,877" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="891" width="564" height="191" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="100" y="953" font-size="27" text-anchor="middle">q*C</text>
<text x="310" y="953" font-size="28" text-anchor="middle">D</text>
<text x="520" y="953" font-size="27" text-anchor="middle">q*C</text>
<path d="M148,942 L253,942" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="200" y="925" font-size="25" text-anchor="middle">β</text>
<path d="M362,942 L468,942" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="415" y="925" font-size="25" text-anchor="middle">γ</text>
<text x="310" y="995" font-size="22" text-anchor="middle">γβ: invertible at 1, zero at 0 ⇒ C = 0.</text>
<text x="310" y="1038" font-size="21" text-anchor="middle">Restriction gives Rf_*F ≅ Rτ_* i*F.</text>
<text x="310" y="1070" font-size="21" text-anchor="middle">Duality gives Rτ_! i!F ≅ Rf_!F.</text>
<text x="310" y="1138" font-size="18" text-anchor="middle">Theorem Q.2.2.1; actual units, counits and open maps</text>
</svg>