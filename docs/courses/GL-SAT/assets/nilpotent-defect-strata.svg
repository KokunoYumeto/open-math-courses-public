<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">A nilpotent family can cross a defect stratum</text>
<text x="310" y="84" font-size="18" text-anchor="middle">Exact SL₂ family O(−1) → O²: homogeneous pair (T,aS)</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="18" text-anchor="middle">Finite chart: κ=(t,a); infinity: first entry a unit.</text>
<text x="310" y="198" font-size="20" text-anchor="middle">Exact zero scheme: Z=Spec k[a,t]/(t,a).</text>
<text x="310" y="237" font-size="22" text-anchor="middle">Finite zero algebra: Q=k[a]/(a).</text>
<text x="310" y="276" font-size="17" text-anchor="middle">The ambient map is generically nonzero on all fibres.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="25" text-anchor="middle">Fitt₀(Q)=(a); Fitt₁(Q)=k[a].</text>
<text x="310" y="443" font-size="19" text-anchor="middle">Degree 0: a invertible; zero divisor empty.</text>
<text x="310" y="482" font-size="20" text-anchor="middle">Degree 1: exact closed equation a=0.</text>
<text x="310" y="521" font-size="21" text-anchor="middle">At a=0: D=α∨[0]; saturated pair (1,0).</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="21" text-anchor="middle">A=k[ε]/ε²; a=ε gives Z=Spec A/(ε).</text>
<text x="310" y="688" font-size="25" text-anchor="middle">A/(ε) is not flat over A.</text>
<text x="310" y="727" font-size="18" text-anchor="middle">The point factors through neither defect stratum.</text>
<text x="310" y="766" font-size="21" text-anchor="middle">It remains in the full compactification.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="25" text-anchor="middle">Attempted division gives (1,ε/t).</text>
<text x="310" y="933" font-size="24" text-anchor="middle">ε/t is not regular at zero.</text>
<text x="310" y="972" font-size="18" text-anchor="middle">Do not saturate this family by its reduced fibre.</text>
<text x="310" y="1011" font-size="16" text-anchor="middle">General strata impose every higher divisibility equation.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorem K.5.1.1; Exercise K.6.2.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">All equations and flatness assertions hold also in characteristic two.</text>
</svg>