<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1360" viewBox="0 0 620 1360">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">From compact traces to Satake characters</text>
<text x="310" y="83" font-size="23" text-anchor="middle">Geometric Frobenius; a²=q; h_ν=〈2ρ,ν〉</text>
<rect x="28" y="115" width="564" height="191" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="158" font-size="24" text-anchor="middle">One lisse stratum over F_q</text>
<text x="310" y="199" font-size="21" text-anchor="middle">L_n=L/πⁿ; C_n=RΓ_c(L_n) perfect over O_n</text>
<text x="310" y="240" font-size="25" text-anchor="middle">Tr(F;C_n)=Σ_x Tr(F_x;L_(n,x))</text>
<text x="310" y="282" font-size="17" text-anchor="middle">Finite curve induction + constructibility: Theorem B.1.1.1.</text>
<path d="M310,323 L310,354" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="370" width="564" height="178" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="413" font-size="23" text-anchor="middle">Compatible finite free O-complex P with F</text>
<text x="310" y="454" font-size="22" text-anchor="middle">RΓ_c(L_E)=P⊗_O E  (actual compact image)</text>
<text x="310" y="495" font-size="21" text-anchor="middle">Matrix traces agree modulo πⁿ for every n.</text>
<text x="310" y="526" font-size="18" text-anchor="middle">Finite strata and truncations give the general complex.</text>
<path d="M310,564 L310,595" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="611" width="564" height="206" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="654" font-size="25" text-anchor="middle">Supported slice S_ν ∩ Gr^(≤λ)</text>
<text x="310" y="698" font-size="27" text-anchor="middle">H_c^i(𝓘_λ)=0 unless i=h_ν</text>
<text x="310" y="742" font-size="21" text-anchor="middle">F=a^(h_ν) id; dim H_c^(h_ν)=dim V_λ(ν)</text>
<text x="310" y="786" font-size="19" text-anchor="middle">Σ_x t_(𝓘_λ)(x)=(−1)^(h_ν) a^(h_ν) dim V_λ(ν)</text>
<path d="M310,833 L310,864" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="880" width="564" height="186" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="923" font-size="23" text-anchor="middle">Satake coefficient: multiply by a^(−h_ν)</text>
<text x="310" y="967" font-size="24" text-anchor="middle">[e^ν] S(t_(𝓘_λ))=(−1)^(d_λ) dim V_λ(ν)</text>
<text x="310" y="1011" font-size="27" text-anchor="middle">h_ν ≡ d_λ mod 2</text>
<text x="310" y="1045" font-size="17" text-anchor="middle">Lemma B.0.1.1 identifies rational slice points and cosets.</text>
<path d="M310,1082 L310,1113" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="1129" width="564" height="154" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="1170" font-size="28" text-anchor="middle">S(t_(𝓘_λ))=(−1)^(d_λ) ch V_λ</text>
<text x="310" y="1210" font-size="24" text-anchor="middle">T_f φ₀=S(f)φ₀; T_f T_g=T_(f*g)</text>
<text x="310" y="1252" font-size="18" text-anchor="middle">Character bases give H_G ≅ E[L]^W (Theorem B.2.1.1).</text>
<text x="310" y="1325" font-size="18" text-anchor="middle">Canonical normalized tensor Weil maps: Corollary B.3.1.1.</text>
</svg>