<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">A negative-loop chart on every algebra</text><text x="310" y="77" font-size="19" fill="#172554" text-anchor="middle">tᴺOⁿ ⊂ L ⊂ t⁻ᴺOⁿ;  O=R[[t]]; index 0</text><rect x="25" y="105" width="570" height="232" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="25" fill="#172554" text-anchor="middle">π̄₊: L/tᴺOⁿ → Oⁿ/tᴺOⁿ</text><text x="310" y="189" font-size="23" fill="#172554" text-anchor="middle">ΩN = determinant-invertible open</text><text x="310" y="231" font-size="23" fill="#172554" text-anchor="middle">π₊⁻¹(eᵢ) gives h=I+Σ hⱼt⁻ʲ</text><text x="310" y="271" font-size="21" fill="#172554" text-anchor="middle">det h = 1 + nilpotent polynomial</text><text x="310" y="310" font-size="19" fill="#172554" text-anchor="middle">h⁻¹ is polynomial;  T_h T_(h⁻¹)=I;  L=hOⁿ</text><path d="M310,352 L310,390" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="404" width="570" height="233" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="446" font-size="21" fill="#172554" text-anchor="middle">Original G ⊂ H=GL(V);  H/G ↪ affine A</text><text x="310" y="488" font-size="22" fill="#172554" text-anchor="middle">g=hk ∈ G(R((t))) ⇒ kG=h⁻¹G</text><text x="310" y="534" font-size="27" fill="#172554" text-anchor="middle">R[t⁻¹] ∩ R[[t]] = R</text><text x="310" y="578" font-size="21" fill="#172554" text-anchor="middle">The quotient coordinates are constant.</text><text x="310" y="613" font-size="18" fill="#172554" text-anchor="middle">h(∞)=I ⇒ h ∈ L⁻⁻G, including the full centre.</text><rect x="25" y="680" width="570" height="287" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="722" font-size="24" fill="#172554" text-anchor="middle">aₛ(t^λh(t⁻¹)K)=t^λh(st⁻¹)K</text><text x="310" y="765" font-size="21" fill="#172554" text-anchor="middle">For s≠0:  aₛ(gK)=λ(s)g(s⁻¹t)K</text><text x="310" y="807" font-size="20" fill="#172554" text-anchor="middle">hⱼ ↦ sʲhⱼ;  at s=0 the point is t^λK.</text><text x="310" y="851" font-size="24" fill="#172554" text-anchor="middle">GL₁, N=1:  Spec k[a]/(a²)</text><text x="310" y="895" font-size="22" fill="#172554" text-anchor="middle">h=1+a/t; h⁻¹=1−a/t;  a ↦ sa</text><text x="310" y="938" font-size="17" fill="#172554" text-anchor="middle">One geometric point, one retained tangent direction.</text><text x="310" y="1006" font-size="18" fill="#172554" text-anchor="middle">λ is any actual cocharacter in X_*(T).</text><text x="310" y="1043" font-size="17" fill="#172554" text-anchor="middle">Proofs C.6.1.1–C.8.1.1; Exercise C.11.1.</text><text x="310" y="1080" font-size="16" fill="#172554" text-anchor="middle">Open chart, contraction and stalk map retain nilpotents.</text><text x="310" y="1106" font-size="15" fill="#172554" text-anchor="middle">Source coordinates: Lesson 2, Lemma 2.1 and §7.1.</text></g></svg>