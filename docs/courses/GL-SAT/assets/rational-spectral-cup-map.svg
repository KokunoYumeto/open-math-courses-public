<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proofs": ["C.81.1.1", "C.81.2.1", "C.81.3.1", "C.81.4.1", "C.81.5.1"], "geometric_mapping_source": "Full genuine L+G-equivariant generator Ext", "finite_equations": "C^a(u)=(Z_mu,i u-u Z_lambda,i)_i", "central_operator_degrees": "2d_i-2, including0", "coefficient_comparison": "The entire displayed rational maps, extended Q-&gt;E", "unit": "IC0 to A_Q with full End ring R", "human_reading": "Bezrukavnikov-Finkelberg, arXiv:0707.3799v4"}</metadata><defs><marker id="cupArrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">Rational cup maps and spectral generators</text><text x="310" y="76" font-size="16" fill="#172554" text-anchor="middle">Actual maps · finite homogeneous equations · full tensor data</text><rect x="18" y="99" width="584" height="321" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="139" font-size="23" fill="#2563eb" text-anchor="middle">A genuine coefficient-comparison square</text><text x="160" y="201" font-size="25" fill="#172554" text-anchor="middle">Extᵃ over ℚ</text><text x="462" y="201" font-size="24" fill="#172554" text-anchor="middle">ker Cᵃ over ℚ</text><text x="160" y="229" font-size="16" fill="#172554" text-anchor="middle">L⁺G: ICλ → ICμ</text><text x="462" y="229" font-size="16" fill="#172554" text-anchor="middle">Mλ → Mμ</text><path d="M263,193 L351,193" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#cupArrow)"/><text x="308" y="178" font-size="17" fill="#2563eb" text-anchor="middle">Ψℚ</text><path d="M157,245 L157,299" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#cupArrow)"/><path d="M460,245 L460,299" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#cupArrow)"/><text x="105" y="266" font-size="18" fill="#15803d" text-anchor="middle">⊗ E</text><text x="508" y="266" font-size="18" fill="#15803d" text-anchor="middle">⊗ E</text><text x="160" y="335" font-size="25" fill="#172554" text-anchor="middle">Extᵃ over E</text><text x="462" y="335" font-size="24" fill="#172554" text-anchor="middle">ker Cᵃ over E</text><text x="160" y="359" font-size="16" fill="#172554" text-anchor="middle">L⁺G: ICλ → ICμ</text><text x="462" y="359" font-size="16" fill="#172554" text-anchor="middle">Mλ → Mμ</text><path d="M263,327 L351,327" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#cupArrow)"/><text x="308" y="312" font-size="17" fill="#2563eb" text-anchor="middle">ΨE</text><text x="310" y="383" font-size="17" fill="#172554" text-anchor="middle">The lower map is the actual known mapping isomorphism.</text><rect x="18" y="441" width="584" height="257" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="481" font-size="23" fill="#15803d" text-anchor="middle">Finite equations in every fixed degree</text><text x="310" y="528" font-size="26" fill="#172554" text-anchor="middle">Cᵃ(u) = (Zμ,ᵢ u − u Zλ,ᵢ)ᵢ</text><text x="310" y="574" font-size="24" fill="#172554" text-anchor="middle">R = ℚ[q₁,…,qᵣ];     |qᵢ| = 2dᵢ</text><text x="310" y="619" font-size="20" fill="#172554" text-anchor="middle">δᵢ = 2dᵢ − 2;  central δᵢ = 0 equations remain.</text><text x="310" y="664" font-size="19" fill="#172554" text-anchor="middle">Flat field extension preserves this actual kernel.</text><rect x="18" y="719" width="584" height="269" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="760" font-size="21" fill="#2563eb" text-anchor="middle">Full native and polynomial spectral comparisons</text><text x="310" y="810" font-size="24" fill="#172554" text-anchor="middle">Geometric envelope  →  ℋℚ</text><text x="310" y="852" font-size="25" fill="#15803d" text-anchor="middle">ℋℚ  →  Perfᴴℚ(Aℚ)</text><text x="310" y="899" font-size="25" fill="#172554" text-anchor="middle">IC₀ ↦ Aℚ;       End(IC₀) = R</text><text x="310" y="946" font-size="18" fill="#172554" text-anchor="middle">Corrected symmetry gives the ordinary spectral flip.</text><text x="310" y="1031" font-size="15" fill="#172554" text-anchor="middle">The full group and its centre are retained: C.81.2–C.81.5.</text><text x="310" y="1068" font-size="15" fill="#172554" text-anchor="middle">The complete native tensor and unit constraints come from C.80.</text><text x="310" y="1105" font-size="14" fill="#172554" text-anchor="middle">Free reading: Bezrukavnikov–Finkelberg, arXiv:0707.3799v4.</text></g></svg>