<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The top Whittaker group keeps zero-character cycles</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="25" text-anchor="middle">Y=Gr^λ∩S_ν; D=(d_λ+h_ν)/2</text>
<text x="310" y="198" font-size="21" text-anchor="middle">Strict IC boundary degrees give ≤h_ν−2.</text>
<text x="310" y="237" font-size="20" text-anchor="middle">H_c^(h_ν)(X,IC⊗AS)=H_c^(2D)(Y,AS)</text>
<text x="310" y="276" font-size="19" text-anchor="middle">This is the top group; lower degrees need a proof.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="22" text-anchor="middle">f=Σ f_i; f_i has simple-root weight α_i.</text>
<text x="310" y="443" font-size="27" text-anchor="middle">AS(f) trivial ⇒ f=g^p−g.</text>
<text x="310" y="482" font-size="20" text-anchor="middle">Lowest weight γ and highest p^rγ both survive.</text>
<text x="310" y="521" font-size="20" text-anchor="middle">Two simple roots cannot form such a p-chain.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="22" text-anchor="middle">Therefore AS(f)|_K trivial ⇔ f|_K=0.</text>
<text x="310" y="688" font-size="25" text-anchor="middle">H_c^(h_ν)= ⊕_(K with f=0) E(−D)</text>
<text x="310" y="727" font-size="18" text-anchor="middle">Positive trace orientations give the component lines.</text>
<text x="310" y="766" font-size="19" text-anchor="middle">The selected lines inject into untwisted IC weights.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="30" text-anchor="middle">Raw Frobenius: q^D id</text>
<text x="310" y="933" font-size="24" text-anchor="middle">Normalized Frobenius: a^(h_ν) id; a²=q</text>
<text x="310" y="972" font-size="21" text-anchor="middle">For ν=λ, μ dominant: Y=A^(d_λ), f=0.</text>
<text x="310" y="1011" font-size="24" text-anchor="middle">Raw compact complex: E(−d_λ)[−d_λ]</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Theorems E.4.1.1–E.6.1.1; Exercise E.7.2.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">Character lattices remain integral even for nonprimitive roots.</text>
</svg>