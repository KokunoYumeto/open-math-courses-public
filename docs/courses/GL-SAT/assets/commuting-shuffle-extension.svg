<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">Extend on the actual sum of product domains</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.56: commuting cuts and the full action differential</text><rect x="25" y="105" width="570" height="310" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="23" fill="#172554" text-anchor="middle">Three factors: two commuting cuts</text><text x="310" y="185" font-size="25" fill="#172554" text-anchor="middle">P₁P₂ = P₂P₁ = P₁₂</text><text x="310" y="223" font-size="24" fill="#172554" text-anchor="middle">U = im P₁ + im P₂</text><text x="310" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#172554">Q<tspan baseline-shift="sub" font-size="16">U</tspan> = P₁ + P₂ − P₁₂</text><text x="310" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#172554">U = D<tspan baseline-shift="sub" font-size="15">{1}</tspan> ⊕ D<tspan baseline-shift="sub" font-size="15">{2}</tspan> ⊕ D<tspan baseline-shift="sub" font-size="15">{1,2}</tspan></text><text x="310" y="395" font-size="17" fill="#172554" text-anchor="middle">The common finest shuffle is counted once.</text><rect x="25" y="445" width="570" height="270" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="485" font-size="19" fill="#172554" text-anchor="middle">Exercise C.56.7.1: endpoints 000 → 111</text><text x="310" y="694" font-size="16" fill="#172554" text-anchor="middle">The quotient is acyclic; U retains the top shuffle cycle.</text><rect x="25" y="745" width="570" height="310" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="785" font-size="20" fill="#172554" text-anchor="middle">Exercise C.56.7.2: the action changes h</text><text x="310" y="829" font-size="24" fill="#172554" text-anchor="middle">d(a) = b,       d(c) = e + b</text><text x="310" y="873" font-size="21" fill="#172554" text-anchor="middle">h₀(e) = c     ⇒     d h₀(e) = e + b</text><text x="310" y="917" font-size="22" fill="#172554" text-anchor="middle">h = h₀(1 + δh₀)⁻¹ = h₀ − h₀δh₀</text><text x="310" y="961" font-size="24" fill="#172554" text-anchor="middle">h(b) = a,       h(e) = c − a</text><text x="310" y="1005" font-size="24" fill="#172554" text-anchor="middle">dh + hd = Id,       h² = 0</text><text x="310" y="1040" font-size="17" fill="#172554" text-anchor="middle">δ(c) = b lowers rank one to rank zero.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.56.1–5 and Proposition C.56.6 state the extension hypotheses.</text><rect x="105" y="285" width="110" height="43" rx="8" fill="#dbeafe"/><text x="160" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172554">D<tspan baseline-shift="sub" font-size="12">{1}</tspan></text><rect x="255" y="285" width="110" height="43" rx="8" fill="#dcfce7"/><text x="310" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172554">D<tspan baseline-shift="sub" font-size="12">{1,2}</tspan></text><rect x="405" y="285" width="110" height="43" rx="8" fill="#dbeafe"/><text x="460" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172554">D<tspan baseline-shift="sub" font-size="12">{2}</tspan></text><text x="165" y="531" font-size="21" fill="#172554" text-anchor="middle">degree</text><text x="315" y="531" font-size="21" fill="#172554" text-anchor="middle">−1</text><text x="415" y="531" font-size="21" fill="#172554" text-anchor="middle">−2</text><text x="515" y="531" font-size="21" fill="#172554" text-anchor="middle">−3</text><text x="165" y="572" font-size="21" fill="#172554" text-anchor="middle">D</text><text x="315" y="572" font-size="21" fill="#172554" text-anchor="middle">1</text><text x="415" y="572" font-size="21" fill="#172554" text-anchor="middle">6</text><text x="515" y="572" font-size="21" fill="#172554" text-anchor="middle">6</text><text x="165" y="613" font-size="21" fill="#172554" text-anchor="middle">U</text><text x="315" y="613" font-size="21" fill="#172554" text-anchor="middle">0</text><text x="415" y="613" font-size="21" fill="#172554" text-anchor="middle">2</text><text x="515" y="613" font-size="21" fill="#172554" text-anchor="middle">3</text><text x="165" y="654" font-size="21" fill="#172554" text-anchor="middle">D/U</text><text x="315" y="654" font-size="21" fill="#172554" text-anchor="middle">1</text><text x="415" y="654" font-size="21" fill="#172554" text-anchor="middle">4</text><text x="515" y="654" font-size="21" fill="#172554" text-anchor="middle">3</text></g></svg>