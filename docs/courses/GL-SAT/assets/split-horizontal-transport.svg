<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="20" fill="#172554" text-anchor="middle">A full relative contraction keeps the split source image</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.70: exact unit comparisons and changing-fiber transport</text><rect x="25" y="105" width="570" height="285" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="21" fill="#172554" text-anchor="middle">Use stability under the entire differential</text><text x="310" y="196" font-size="25" fill="#172554" text-anchor="middle">T = dH₀ + H₀d = 1 + J</text><text x="310" y="240" font-size="23" fill="#172554" text-anchor="middle">H = H₀ (1 + J)⁻¹,     dH + Hd = 1</text><text x="310" y="284" font-size="19" fill="#172554" text-anchor="middle">Every J consumes positive original input length.</text><text x="310" y="327" font-size="21" fill="#172554" text-anchor="middle">Kᵣₑₗ stable under d and H₀  ⇒  H preserves Kᵣₑₗ</text><text x="310" y="367" font-size="18" fill="#172554" text-anchor="middle">The leading differential alone can fail this condition.</text><rect x="25" y="430" width="570" height="300" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="472" font-size="20" fill="#172554" text-anchor="middle">One chosen split bridge at every intermediate type</text><text x="145" y="535" font-size="30" fill="#172554" text-anchor="middle">R</text><text x="475" y="535" font-size="30" fill="#172554" text-anchor="middle">G</text><path d="M185,521 L435,521 M422.0,527.0 L435,521 L422.0,515.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="310" y="506" font-size="20" fill="#15803d" text-anchor="middle">q</text><path d="M435,565 L185,565 M198.0,559.0 L185,565 L198.0,571.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="596" font-size="20" fill="#2563eb" text-anchor="middle">j</text><text x="310" y="640" font-size="25" fill="#172554" text-anchor="middle">qj = Id,     E = jq,     E² = E</text><text x="310" y="681" font-size="22" fill="#172554" text-anchor="middle">u : Id → E,     q_*u = Id,     uj = Id</text><text x="310" y="714" font-size="20" fill="#172554" text-anchor="middle">Full horizontal transport: Lₐᵦ(F) = jᵦFqₐ</text><rect x="25" y="770" width="570" height="295" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="814" font-size="19" fill="#172554" text-anchor="middle">The second full unit component cancels a real defect</text><text x="310" y="859" font-size="21" fill="#172554" text-anchor="middle">S = (1,0,0),     Z(a,b) = (0,0,E(a,b))</text><text x="310" y="905" font-size="25" fill="#172554" text-anchor="middle">u₁(Z(e,e)) = S + Z(f,y)</text><text x="310" y="950" font-size="22" fill="#172554" text-anchor="middle">u₂(M(e,f), Z(y,e)) = −S − Z(f,y)</text><text x="310" y="994" font-size="22" fill="#172554" text-anchor="middle">D(S + Z(f,y)) = Z(e,e)</text><text x="310" y="1037" font-size="18" fill="#172554" text-anchor="middle">Omitting the second component leaves +Z(e,e).</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.70.1.1–3.1; Exercises C.70.4.1–2.</text></g></svg>