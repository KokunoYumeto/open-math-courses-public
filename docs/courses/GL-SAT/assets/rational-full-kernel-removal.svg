<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="25" text-anchor="middle">Every finite-stage kernel is forced to vanish</text>
<text x="310" y="83" font-size="25" text-anchor="middle">G̃_E → S → R_E,   U=ker(S→R_E)</text>
<rect x="28" y="113" width="564" height="168" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="18" text-anchor="middle">U is smooth and unitriangular; S→R_E is its torsor.</text>
<text x="310" y="196" font-size="21" text-anchor="middle">log U=Lie(U);  A=Lie(U)/[Lie(U),Lie(U)]</text>
<text x="310" y="237" font-size="21" text-anchor="middle">If U≠1, then A≠0.  D=exp[Lie(U),Lie(U)].</text>
<text x="310" y="267" font-size="16" text-anchor="middle">Finite exp/log polynomials give these maps on every E-algebra.</text>
<path d="M310,296 L310,327" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="341" width="564" height="166" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="382" font-size="27" text-anchor="middle">1 → A → S/D → R_E → 1</text>
<text x="310" y="422" font-size="20" text-anchor="middle">The full centre Z(R_E)=D_E(L/Q∨) lifts centrally.</text>
<text x="310" y="463" font-size="19" text-anchor="middle">Hence Z(R_E) acts trivially on the vector module A.</text>
<text x="310" y="492" font-size="15" text-anchor="middle">Amitsur descent + the regular-cochain contraction split this extension.</text>
<path d="M310,522 L310,553" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="567" width="564" height="166" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="608" font-size="29" text-anchor="middle">S/D=A⋊R_E</text>
<text x="310" y="650" font-size="18" text-anchor="middle">A has a zero weight; a stable tensor character detects it.</text>
<text x="310" y="692" font-size="22" text-anchor="middle">φ: A → End_E(V_λ) is nonzero and equivariant.</text>
<text x="310" y="719" font-size="15" text-anchor="middle">All modules and the splitting are over the original coefficient field E.</text>
<path d="M310,748 L310,779" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="793" width="564" height="200" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="834" font-size="24" text-anchor="middle">a ↦ [1  φ(a);  0  1] on V_λ⊕V_λ</text>
<text x="310" y="875" font-size="16" text-anchor="middle">A acts trivially on the two factors, nontrivially in the middle.</text>
<text x="310" y="916" font-size="21" text-anchor="middle">This gives a nonsplit genuine IC self-extension.</text>
<text x="310" y="956" font-size="18" text-anchor="middle">But H¹(O_λ,E)=0 and two perverse Hom injections split it.</text>
<text x="310" y="983" font-size="18" text-anchor="middle">Contradiction: U=1 at every cofinal finite Hopf stage.</text>
<text x="310" y="1041" font-size="23" text-anchor="middle">Therefore G̃_E=R_E=Ĝ_E and Sat_G(E)=Rep_E(Ĝ_E).</text>
<text x="310" y="1082" font-size="22" text-anchor="middle">Full-heart semisimplicity precedes general IC parity.</text>
<text x="310" y="1126" font-size="15" text-anchor="middle">Lemmas B.2.2.1, B.2.3.1, B.3.1.1, B.3.2.1; Theorem B.4.1.1</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Finite E/ℚ_ℓ; geometric k algebraically closed; ℓ invertible in k.</text>
</svg>