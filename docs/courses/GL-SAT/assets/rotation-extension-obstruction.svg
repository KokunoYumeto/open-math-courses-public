<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="22" text-anchor="middle">Rotation invariance detects an actual extension class</text>
<text x="310" y="82" font-size="25" text-anchor="middle">p : G_m × Y → Y;   Y proper</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="19" text-anchor="middle">The section and positive boundary fix the splitting.</text>
<text x="310" y="195" font-size="28" text-anchor="middle">Rp_*p*L = L ⊕ L(−1)[−1]</text>
<text x="310" y="237" font-size="23" text-anchor="middle">Two extensions agree at parameter 1.</text>
<text x="310" y="275" font-size="22" text-anchor="middle">Their difference is ν ∈ Hom(Q,S(−1)).</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="24" text-anchor="middle">Component cohomology has one parity.</text>
<text x="310" y="440" font-size="28" text-anchor="middle">Hom(V_Q,V_S[1]) = 0</text>
<text x="310" y="482" font-size="21" text-anchor="middle">A constant V_R has no degree −1 self-map.</text>
<text x="310" y="518" font-size="21" text-anchor="middle">Normalized endpoint actions induce identities.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="18" text-anchor="middle">Proper relative cohomology retains the boundary κ.</text>
<text x="310" y="683" font-size="30" text-anchor="middle">κ · H(ν) = 0</text>
<text x="310" y="725" font-size="20" text-anchor="middle">κ identifies the nonzero degree-one Tate line.</text>
<text x="310" y="761" font-size="21" text-anchor="middle">Injectivity ⇒ H(ν)=0;   faithfulness ⇒ ν=0.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="23" text-anchor="middle">The actual extension classes are equal.</text>
<text x="310" y="927" font-size="19" text-anchor="middle">A normalized middle isomorphism gives rotation.</text>
<text x="310" y="968" font-size="20" text-anchor="middle">Connected-group uniqueness gives its cocycle.</text>
<text x="310" y="1001" font-size="19" text-anchor="middle">This argument does not split the heart extension.</text>
<text x="310" y="1058" font-size="23" text-anchor="middle">Tangent-one action + rotation ⇒ full Aut_m.</text>
<text x="310" y="1098" font-size="18" text-anchor="middle">m ≥ max(2,n,2N+2);   ordinary cohomology action = 1.</text>
<text x="310" y="1140" font-size="16" text-anchor="middle">Lemma B.1.1.1; Theorems B.1.2.1–B.2.1.1; Exercise B.4.2</text>
</svg>