<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Inverse frames in every allowed characteristic</text>
<text x="310" y="83" font-size="26" text-anchor="middle">p([g]) = gK,   f([g]) = g⁻¹K</text>
<rect x="28" y="113" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="155" font-size="24" text-anchor="middle">Lattice bound N; choose n &gt; 6N.</text>
<text x="310" y="197" font-size="27" text-anchor="middle">r = n−2N,   ℓ₀ = n+2N</text>
<text x="310" y="239" font-size="26" text-anchor="middle">2r ≥ ℓ₀,   2n ≥ ℓ₀+2N</text>
<text x="310" y="276" font-size="21" text-anchor="middle">Deep congruence ideals are square-zero.</text>
<path d="M310,306 L310,343" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="357" width="564" height="175" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="400" font-size="26" text-anchor="middle">H_U = (h⁻¹K_n h)/K_ℓ₀</text>
<text x="310" y="441" font-size="26" text-anchor="middle">M = tⁿ Ad(h⁻¹) 𝔤[[t]]</text>
<text x="310" y="483" font-size="21" text-anchor="middle">H_U = M/t^ℓ₀𝔤[[t]], a vector subbundle.</text>
<text x="310" y="516" font-size="21" text-anchor="middle">Rank = (ℓ₀−n) dim G;   no exponential.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="22" text-anchor="middle">J_ℓ₀G × U → f⁻¹(U) is an H_U-torsor.</text>
<text x="310" y="683" font-size="26" text-anchor="middle">dim J_ℓ₀G −dim H_U = n dim G</text>
<text x="310" y="724" font-size="18" text-anchor="middle">Smooth cover + flat fiber criterion ⇒ f smooth.</text>
<text x="310" y="761" font-size="19" text-anchor="middle">Connected jet fibers give connected f-fibers.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="24" text-anchor="middle">h_n = n dim G for both p and f.</text>
<text x="310" y="926" font-size="28" text-anchor="middle">p*I(Q)[h_n] = f*Q[h_n]</text>
<text x="310" y="967" font-size="20" text-anchor="middle">Equal shifts and smooth Tate lines cancel.</text>
<text x="310" y="1001" font-size="22" text-anchor="middle">I² = 1;   I(DQ) = D(IQ).</text>
<text x="310" y="1059" font-size="25" text-anchor="middle">V(IC_λ^raw) = IC_(−w₀λ)^raw(d_λ)</text>
<text x="310" y="1099" font-size="22" text-anchor="middle">The raw dual retains its Tate line.</text>
<text x="310" y="1140" font-size="21" text-anchor="middle">Lemma B.1.1.1; Theorem B.2.1.1</text>
</svg>