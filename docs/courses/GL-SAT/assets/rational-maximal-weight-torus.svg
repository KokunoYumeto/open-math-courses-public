<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="24" text-anchor="middle">The weight torus is geometrically maximal</text>
<text x="310" y="81" font-size="27" text-anchor="middle">T̂_E = Spec E[L]  ↪  R_E</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="152" font-size="20" text-anchor="middle">The closed immersion uses simple IC monomials.</text>
<text x="310" y="193" font-size="24" text-anchor="middle">γ = −2ρ: its largest IC weight is w₀λ.</text>
<text x="310" y="234" font-size="20" text-anchor="middle">The antidominant point slice gives a single line.</text>
<text x="310" y="274" font-size="18" text-anchor="middle">This holds for every geometric simple representation.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="23" text-anchor="middle">Choose a maximal torus T′ containing T̂_E.</text>
<text x="310" y="439" font-size="20" text-anchor="middle">A root wall 〈a,γ〉=0 would give two top vectors:</text>
<text x="310" y="480" font-size="24" text-anchor="middle">v_κ and f_a v_κ, at distinct T′-weights.</text>
<text x="310" y="518" font-size="18" text-anchor="middle">The one-dimensional largest IC space excludes this.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="640" font-size="28" text-anchor="middle">γ is regular for R_E.</text>
<text x="310" y="683" font-size="19" text-anchor="middle">Equal highest-weight restrictions give one IC label.</text>
<text x="310" y="724" font-size="23" text-anchor="middle">Thus dominant restrictions are injective.</text>
<text x="310" y="762" font-size="21" text-anchor="middle">Use κ and κ+χ to exclude a character kernel.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="884" font-size="25" text-anchor="middle">X*(T′) → L is injective and surjective.</text>
<text x="310" y="926" font-size="27" text-anchor="middle">Hence T′ = T̂_E: R_E is split.</text>
<text x="310" y="966" font-size="20" text-anchor="middle">For S⊃T̂_E in G̃_E, lift S to a finite quotient.</text>
<text x="310" y="1001" font-size="17" text-anchor="middle">The unitriangular kernel meets S trivially on all algebras.</text>
<text x="310" y="1056" font-size="18" text-anchor="middle">The same argument in its reductive image gives S=T̂_E.</text>
<text x="310" y="1096" font-size="18" text-anchor="middle">Neither full root identification nor kernel removal follows.</text>
<text x="310" y="1139" font-size="17" text-anchor="middle">Proposition A.3.1.1; Lemma B.1.1.1; Theorem B.2.2.1</text>
</svg>