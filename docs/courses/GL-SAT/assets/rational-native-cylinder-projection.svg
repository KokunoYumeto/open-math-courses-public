<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem60; Exercise60", "cylinder": "Z=X+ sY+Y", "differential": "D(x,su,y)=(dx-Iu,-sdu,dy+u)", "kernel_contraction": "k(f)=(-1)^|f| f h_input", "actual_native_R": "R(y)=f+z", "positive_nullary_output": "p of degree1"}</metadata><text x="310" y="40" font-size="23" fill="#172554" text-anchor="middle">A faithful native comparison cylinder</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">The graph map and its original homotopy remain visible.</text><rect x="18" y="106" width="584" height="293" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="147" font-size="27" fill="#2563eb" text-anchor="middle">Z = X ⊕ sY ⊕ Y</text><text x="310" y="192" font-size="21" fill="#172554" text-anchor="middle">D(x,su,y) = (dx − Iu, −sdu, dy + u)</text><text x="310" y="238" font-size="20" fill="#172554" text-anchor="middle">j(y) = (0,0,y);     q(x,su,y) = Qx + y</text><text x="310" y="284" font-size="25" fill="#15803d" text-anchor="middle">Ξ(Sy) = Sy − Xf − Xz</text><text x="310" y="329" font-size="22" fill="#172554" text-anchor="middle">R(y) = f + z is recovered exactly.</text><text x="310" y="372" font-size="16" fill="#172554" text-anchor="middle">The closed z term remains in the two-factor product.</text><rect x="18" y="420" width="584" height="272" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="461" font-size="23" fill="#15803d" text-anchor="middle">Retain the section jY in every arity</text><text x="310" y="507" font-size="19" fill="#172554" text-anchor="middle">πⱼ : Eⱼ(Z₁,…,Zₙ; Zₒ) → Hom(Y₁⊗⋯⊗Yₙ,Yₒ)</text><text x="310" y="553" font-size="20" fill="#172554" text-anchor="middle">ker πⱼ = Hom((⊗Zᵢ)/(⊗jYᵢ), Zₒ)</text><text x="310" y="600" font-size="23" fill="#2563eb" text-anchor="middle">k(f) = (−1)^|f| f h_input</text><text x="310" y="650" font-size="23" fill="#172554" text-anchor="middle">δk + kδ = 1;    k² = 0</text><rect x="18" y="714" width="584" height="283" rx="14" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="310" y="756" font-size="23" fill="#2563eb" text-anchor="middle">Keep the nullary coefficient output</text><text x="310" y="805" font-size="23" fill="#15803d" text-anchor="middle">B(1) = p,   |p| = 1     →     f(1) = Yp</text><text x="310" y="852" font-size="25" fill="#15803d" text-anchor="middle">πⱼ(f)(1) = p</text><text x="310" y="902" font-size="18" fill="#b91c1c" text-anchor="middle">Requiring f(1) ∈ iX ∩ jY would force f(1) = 0.</text><text x="310" y="951" font-size="18" fill="#172554" text-anchor="middle">The two-endpoint condition fails in arity zero.</text><text x="310" y="1040" font-size="12" fill="#172554" text-anchor="middle">Full matrix signs, kernel proof and literal graph grafts: Theorem60.</text><text x="310" y="1074" font-size="14" fill="#172554" text-anchor="middle">15,664 one-section kernel basis values: Exercise60.</text><text x="310" y="1106" font-size="12" fill="#172554" text-anchor="middle">A positive-degree output is retained; the target Hom is not contracted.</text></g></svg>