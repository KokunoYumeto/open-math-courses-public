<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="18" fill="#172554" text-anchor="middle">Lift the whole comparison, retaining the prescribed edges</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.46.1: every higher defect stays in the contracted kernel</text><rect x="25" y="104" width="570" height="304" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="120" y="171" font-size="28" fill="#172554" text-anchor="middle">X</text><text x="505" y="171" font-size="28" fill="#172554" text-anchor="middle">X′</text><text x="120" y="276" font-size="28" fill="#172554" text-anchor="middle">Y</text><text x="505" y="276" font-size="28" fill="#172554" text-anchor="middle">Y′</text><path d="M155,161 L470,161 M457.0,167.0 L470,161 L457.0,155.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M155,266 L470,266 M457.0,272.0 L470,266 L457.0,260.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M120,185 L120,242 M114.0,229.0 L120,242 L126.0,229.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M505,185 L505,242 M499.0,229.0 L505,242 L511.0,229.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="145" font-size="19" fill="#172554" text-anchor="middle">T</text><text x="310" y="249" font-size="16" fill="#172554" text-anchor="middle">S (the supplied full raw map)</text><text x="90" y="220" font-size="18" fill="#172554" text-anchor="middle">P</text><text x="543" y="220" font-size="18" fill="#172554" text-anchor="middle">P′</text><text x="310" y="318" font-size="17" fill="#172554" text-anchor="middle">P′ T = S P;   all prescribed one-cross maps stay exact.</text><text x="310" y="358" font-size="20" fill="#172554" text-anchor="middle">At cross count r:  o = ∂t₀ + e;   ∂o = 0.</text><text x="310" y="396" font-size="17" fill="#172554" text-anchor="middle">Correct by tᵣ = t₀ − h o;   stop at the directed height.</text><rect x="25" y="442" width="570" height="324" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="485" font-size="21" fill="#172554" text-anchor="middle">C.46.2: retain the incoming unary differential</text><text x="310" y="536" font-size="25" fill="#172554" text-anchor="middle">∂v = d v − v d₁</text><text x="310" y="587" font-size="19" fill="#172554" text-anchor="middle">d u = v;   provisional u ↦ u₀+x, v ↦ v₀</text><text x="310" y="633" font-size="19" fill="#172554" text-anchor="middle">Defect: d(u₀+x) − v₀ = y;   h(y) = x</text><text x="310" y="678" font-size="22" fill="#172554" text-anchor="middle">Corrected lift: u ↦ u₀;   v ↦ v₀</text><text x="310" y="722" font-size="18" fill="#172554" text-anchor="middle">Two-cross example: T(sa|sb) = sa′|sb′ + sx</text><text x="310" y="754" font-size="17" fill="#172554" text-anchor="middle">The extra sx cancels the nonzero product defect −sy.</text><rect x="25" y="805" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="847" font-size="20" fill="#172554" text-anchor="middle">C.46.3: one natural strict resolution per state</text><text x="106" y="906" font-size="26" fill="#172554" text-anchor="middle">Rₘ</text><text x="310" y="906" font-size="26" fill="#172554" text-anchor="middle">Qₘ</text><text x="519" y="906" font-size="26" fill="#172554" text-anchor="middle">Uₘ</text><path d="M145,897 L268,897 M255.0,903.0 L268,897 L255.0,891.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M352,897 L480,897 M467.0,903.0 L480,897 L467.0,891.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="204" y="880" font-size="19" fill="#172554" text-anchor="middle">ξₘ</text><text x="417" y="880" font-size="19" fill="#172554" text-anchor="middle">εₘ</text><text x="310" y="953" font-size="24" fill="#172554" text-anchor="middle">Qₘ = ΩB(Uₘ);   εₘ ξₘ = κₘ</text><text x="310" y="991" font-size="17" fill="#172554" text-anchor="middle">ξₘ = Ω(shₘ ηC^⊗m);   all zero-fold maps are identities.</text><text x="310" y="1018" font-size="15" fill="#172554" text-anchor="middle">Core comparisons commute with this canonical input square.</text><text x="310" y="1070" font-size="16" fill="#172554" text-anchor="middle">Exercises C.46.4.1–2 retain both nonzero corrections.</text><text x="310" y="1104" font-size="16" fill="#172554" text-anchor="middle">The full native geometric raw comparison is still required.</text></g></svg>