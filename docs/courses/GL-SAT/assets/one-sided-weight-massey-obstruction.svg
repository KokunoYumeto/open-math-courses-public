<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="37" font-size="24" fill="#172554" text-anchor="middle">A one-sided weight bound is insufficient</text><text x="310" y="75" font-size="20" fill="#172554" text-anchor="middle">D=Λ(a,b,c), degrees 1; weights 1,1,2</text><rect x="25" y="109" width="570" height="219" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="150" font-size="26" fill="#172554" text-anchor="middle">da=db=0; dc=ab</text><text x="173" y="215" font-size="19" fill="#172554" text-anchor="middle">c: degree1, weight2</text><path d="M285,207 L348,207" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="455" y="215" font-size="18" fill="#172554" text-anchor="middle">ab: degree2, weight2</text><text x="310" y="286" font-size="21" fill="#172554" text-anchor="middle">The differential preserves weight.</text><rect x="25" y="368" width="570" height="242" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="409" font-size="19" fill="#172554" text-anchor="middle">Cohomology includes actual off-diagonal classes</text><text x="310" y="451" font-size="22" fill="#172554" text-anchor="middle">H¹: [a],[b] — degree1, weight1</text><text x="310" y="496" font-size="22" fill="#172554" text-anchor="middle">H²: [ac],[bc] — degree2, weight3</text><text x="310" y="541" font-size="22" fill="#172554" text-anchor="middle">H³: [abc] — degree3, weight4</text><text x="310" y="585" font-size="17" fill="#172554" text-anchor="middle">Every weight ≥ degree; projection kills H² and H³.</text><rect x="25" y="655" width="570" height="184" rx="15" fill="white" stroke="#d97706" stroke-width="2"/><text x="310" y="697" font-size="25" fill="#172554" text-anchor="middle">〈[a],[a],[b]〉 = {[ac]} ≠ {0}</text><text x="310" y="744" font-size="20" fill="#172554" text-anchor="middle">Primitives: a²=0; ab=dc; resulting cycle ac</text><text x="310" y="791" font-size="23" fill="#172554" text-anchor="middle">Indeterminacy aH¹+H¹b=0.</text><rect x="25" y="885" width="570" height="146" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="927" font-size="18" fill="#172554" text-anchor="middle">Full diagonal purity gives the truncation equivalence.</text><text x="310" y="972" font-size="17" fill="#172554" text-anchor="middle">Actual enhanced Frobenius gives nonresonant formality.</text><text x="310" y="1008" font-size="17" fill="#172554" text-anchor="middle">A grading automorphism on cohomology alone does not.</text><text x="310" y="1083" font-size="17" fill="#172554" text-anchor="middle">Proposition A.5.1.1; Exercises A.6.1–A.6.3.</text></g></svg>