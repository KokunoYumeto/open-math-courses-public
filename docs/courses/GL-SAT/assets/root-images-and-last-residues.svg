<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Root images force a nonzero last residue</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="21" text-anchor="middle">V_λ,ν has independent component axes v_K.</text>
<text x="310" y="198" font-size="21" text-anchor="middle">For n_i≤0, remove Z_(s_iν) in the Levi.</text>
<text x="310" y="237" font-size="24" text-anchor="middle">Its open top classes span im(e_i).</text>
<text x="310" y="276" font-size="18" text-anchor="middle">These are precisely the axes with a positive i-image.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="25" text-anchor="middle">For ν≠w₀λ: V_λ,ν = Σ_i im(e_i).</text>
<text x="310" y="443" font-size="20" text-anchor="middle">Thus every axis belongs to at least one subset.</text>
<text x="310" y="482" font-size="23" text-anchor="middle">That Levi image has positive dimension.</text>
<text x="310" y="521" font-size="21" text-anchor="middle">Dominance makes its last residue nonconstant.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="23" text-anchor="middle">Example A₂: λ=α₁∨+α₂∨; ν=0; D=2</text>
<text x="310" y="688" font-size="29" text-anchor="middle">V_λ,0=E h₁ ⊕ E h₂</text>
<text x="310" y="727" font-size="22" text-anchor="middle">K₁: q₁-image G_m; q₂-image a point.</text>
<text x="310" y="766" font-size="22" text-anchor="middle">K₂: q₂-image G_m; q₁-image a point.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="23" text-anchor="middle">f=Σ_i f_i; distinct simple-root weights.</text>
<text x="310" y="933" font-size="22" text-anchor="middle">No nonzero f_i can cancel in this sum.</text>
<text x="310" y="972" font-size="20" text-anchor="middle">AS(f) is nontrivial on every nonlowest top K.</text>
<text x="310" y="1011" font-size="23" text-anchor="middle">Hence the top Whittaker group vanishes.</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Theorems F.4.1.1, F.6.1.1; Lemma F.5.1.1; Exercise F.7.2.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">This is a top-degree theorem; lower concentration is separate.</text>
</svg>