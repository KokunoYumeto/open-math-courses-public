<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">A geometric character forces vanishing</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="23" text-anchor="middle">a:z ↦ z^p−z is a finite étale F_p-torsor</text>
<text x="310" y="198" font-size="25" text-anchor="middle">Deck translations: z ↦ z+c</text>
<text x="310" y="237" font-size="20" text-anchor="middle">L_ψ is the ψ-character line; its zero fibre is E.</text>
<text x="310" y="276" font-size="25" text-anchor="middle">L_ψ(x+y)=L_ψ(x)⊗L_ψ(y)</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="28" text-anchor="middle">RΓ_c(A¹,a_*E)=E(−1)[−2]</text>
<text x="310" y="443" font-size="20" text-anchor="middle">Deck translations preserve the trace generator.</text>
<text x="310" y="482" font-size="23" text-anchor="middle">Only the trivial character survives.</text>
<text x="310" y="521" font-size="28" text-anchor="middle">Hence RΓ_c(A¹,L_ψ)=0.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="25" text-anchor="middle">a:G_a×X→X; a*F=L_ψ ⊠ F</text>
<text x="310" y="688" font-size="20" text-anchor="middle">τ(c,x)=(c,c·x) identifies a with projection.</text>
<text x="310" y="727" font-size="27" text-anchor="middle">RΓ_c(a*F)=C(−1)[−2]=0</text>
<text x="310" y="766" font-size="20" text-anchor="middle">C=RΓ_c(X,F), so C=0 in every degree.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="26" text-anchor="middle">n=〈α_i,μ〉&lt;0; m=−n−1≥0</text>
<text x="310" y="933" font-size="23" text-anchor="middle">u_i(c t^m) belongs to N(O); χ_μ=c.</text>
<text x="310" y="972" font-size="19" text-anchor="middle">It preserves Z_λ∩S_ν and twists IC by L_ψ.</text>
<text x="310" y="1011" font-size="18" text-anchor="middle">Every nondominant-conductor compact group is zero.</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Lemmas E.1.1.1–E.2.1.1; Proposition E.3.1.1.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">All products, shifts and character comparisons are actual maps.</text>
</svg>