<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">A closed proper Hecke image gives the clean generator</text>
<text x="310" y="84" font-size="18" text-anchor="middle">Fixed distinct marks; simply connected derived group</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="16" text-anchor="middle">One-sided lattice bound: t^〈χ,λ〉Wχ[[t]] ⊂ Λ′.</text>
<text x="310" y="198" font-size="21" text-anchor="middle">Reverse modification has type λ*=−w₀λ.</text>
<text x="310" y="237" font-size="22" text-anchor="middle">Source label: τ=η+λ*; target label: η.</text>
<text x="310" y="276" font-size="16" text-anchor="middle">All highest maps and central inverse maps are kept.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="17" text-anchor="middle">Target regularity: every polar coefficient is zero.</text>
<text x="310" y="443" font-size="16" text-anchor="middle">This defines a closed locus in the projective fibre.</text>
<text x="310" y="482" font-size="17" text-anchor="middle">From the target: an open inverse-Schubert chart.</text>
<text x="310" y="521" font-size="16" text-anchor="middle">Proper duality: D H_Aλ Πη^ψ = H_Aλ Πη^(ψ⁻¹).</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="17" text-anchor="middle">Basic Π₀ is clean; irrelevant restrictions vanish.</text>
<text x="310" y="688" font-size="16" text-anchor="middle">Relevant label μ: Cλ,μ,−μ(D)[h₋μ] has degrees ≤0.</text>
<text x="310" y="727" font-size="22" text-anchor="middle">Strict boundary bound unless μ=λ*.</text>
<text x="310" y="766" font-size="18" text-anchor="middle">At μ=λ*: the whole coefficient is the unit E.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="18" text-anchor="middle">Duality supplies the exceptional lower bound.</text>
<text x="310" y="933" font-size="20" text-anchor="middle">No boundary subobject or quotient remains.</text>
<text x="310" y="972" font-size="22" text-anchor="middle">H_Aλ Π₀ ≅ Πλ* with its actual open unit.</text>
<text x="310" y="1011" font-size="17" text-anchor="middle">Original torus, nilpotents and Weil maps survive.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorems P.2.1.1–P.3.1.1; local bounds G.5.1.1–G.6.1.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">This comparison does not assert moving-point or Ran factorization.</text>
</svg>