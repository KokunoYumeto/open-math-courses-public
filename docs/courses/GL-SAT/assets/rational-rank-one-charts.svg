<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="24" text-anchor="middle">Rank-one charts retain the integral root step</text>
<text x="310" y="83" font-size="25" text-anchor="middle">M → PGL₂,   q(λ)=mω∨,   q(α∨)=2ω∨</text>
<rect x="28" y="112" width="564" height="209" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="151" font-size="21" text-anchor="middle">m=〈α,λ〉;  m&gt;0 gives two affine m-charts.</text>
<text x="310" y="192" font-size="27" text-anchor="middle">uα(x₀+⋯+xₘ₋₁tᵐ⁻¹)t^λ</text>
<text x="310" y="232" font-size="18" text-anchor="middle">x₀ is the flag coordinate; the rest are jet coordinates.</text>
<text x="310" y="272" font-size="20" text-anchor="middle">The adjoint map keeps these root coordinates.</text>
<text x="310" y="304" font-size="17" text-anchor="middle">m=0 is a central point; no integral frame lifting is used.</text>
<path d="M310,336 L310,369" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="383" width="564" height="183" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="423" font-size="26" text-anchor="middle">Z_λ(M) → Z_(mω∨)(PGL₂)</text>
<text x="310" y="465" font-size="20" text-anchor="middle">Proper; exactly one point in each geometric fibre.</text>
<text x="310" y="505" font-size="18" text-anchor="middle">Nilpotent fibres and inseparable residues are retained.</text>
<text x="310" y="545" font-size="17" text-anchor="middle">Actual pullback and proper image are coefficient inverses.</text>
<path d="M310,581 L310,614" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="628" width="564" height="197" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="669" font-size="23" text-anchor="middle">F_ν(I_λ) has dimension 1 exactly at</text>
<text x="310" y="714" font-size="28" text-anchor="middle">ν=λ−jα∨,   j=0,…,m</text>
<text x="310" y="755" font-size="25" text-anchor="middle">Target weights: (m−2j)ω∨</text>
<text x="310" y="796" font-size="17" text-anchor="middle">The central component stays fixed; the root step is integral.</text>
<rect x="28" y="859" width="564" height="223" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="901" font-size="23" text-anchor="middle">Two characteristic-p checks</text>
<text x="310" y="943" font-size="19" text-anchor="middle">char k=2: diag(1+t,1) has no SL₂(k[[t]]) lift.</text>
<text x="310" y="981" font-size="20" text-anchor="middle">A scalar lift would make 1+t a square.</text>
<text x="310" y="1020" font-size="20" text-anchor="middle">Frobenius on P¹: F*c₁(O(1))=p·c₁(O(1)).</text>
<text x="310" y="1060" font-size="18" text-anchor="middle">The coefficient equivalence does not erase this scalar.</text>
<text x="310" y="1126" font-size="16" text-anchor="middle">Lemma A.1.1.1; Theorem A.2.1.1; Exercises A.5.3–A.5.4</text>
<text x="310" y="1167" font-size="16" text-anchor="middle">All geometric characteristics allowed by ℓ; coefficient field E has char 0.</text>
</svg>