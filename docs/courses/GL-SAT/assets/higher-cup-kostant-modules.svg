<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="26" fill="#172554" text-anchor="middle">Higher actual cup operators</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">Framed curve class → full gradients → generator maps</text><rect x="25" y="105" width="570" height="276" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="143" font-size="22" fill="#172554" text-anchor="middle">1. At fixed label λ, on ℙ¹ × BT</text><text x="310" y="187" font-size="22" fill="#172554" text-anchor="middle">χ-line: 𝒪(−⟨χ,λ⟩·0) ⊗ kχ</text><text x="310" y="230" font-size="22" fill="#172554" text-anchor="middle">q(bundle) − q(reference) = −Dλq(u) h</text><text x="310" y="270" font-size="21" fill="#172554" text-anchor="middle">h² = 0; curve trace h = 1</text><path d="M310,287 L310,320" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="310" y="348" font-size="22" fill="#172554" text-anchor="middle">zq = − curve trace; zq|t^λ = Dλq(u)</text><text x="310" y="373" font-size="15" fill="#172554" text-anchor="middle">degree 2d−2, twist E(d−1); d = polynomial degree q</text><rect x="25" y="414" width="570" height="249" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="454" font-size="22" fill="#172554" text-anchor="middle">2. The full moving framed torsor</text><text x="310" y="498" font-size="19" fill="#172554" text-anchor="middle">Disjoint graphs: supported class is a sum.</text><text x="310" y="536" font-size="18" fill="#172554" text-anchor="middle">Collision: endpoint cup under actual counits.</text><text x="310" y="576" font-size="22" fill="#172554" text-anchor="middle">zq(P*Q) = zq(P)⊗1 + 1⊗zq(Q)</text><text x="310" y="619" font-size="19" fill="#172554" text-anchor="middle">In the adapted frame: ηq = ∇BH(q∘βρ⁻¹)(σρ)</text><text x="310" y="648" font-size="15" fill="#172554" text-anchor="middle">All centralizer gradients, including degree-zero centre.</text><rect x="25" y="706" width="570" height="301" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="747" font-size="20" fill="#172554" text-anchor="middle">3. Every Bop-linear map preserves λ-blocks</text><text x="310" y="790" font-size="16" fill="#172554" text-anchor="middle">Over Q: determinant eigenvalues distinguish labels.</text><text x="310" y="832" font-size="15" fill="#172554" text-anchor="middle">Every whole cohomology class acts by its scalar at t^λ.</text><path d="M310,849 L310,882" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="310" y="912" font-size="19" fill="#172554" text-anchor="middle">Finite free S-modules: descend Q → S.</text><text x="310" y="951" font-size="19" fill="#172554" text-anchor="middle">Faithfully flat S/R₀: descend S → R₀.</text><text x="310" y="990" font-size="20" fill="#172554" text-anchor="middle">HomA_G = HomBop, with composition</text><text x="310" y="1045" font-size="21" fill="#172554" text-anchor="middle">ExtL⁺G(ICλ,ICμ)  ≅  HomA,H(A⊗Vλ,A⊗Vμ)</text><text x="310" y="1082" font-size="17" fill="#172554" text-anchor="middle">A = E[Lie(H)*]; grading and full group as in B.5.</text><text x="310" y="1107" font-size="15" fill="#172554" text-anchor="middle">Proofs C.21.1.1–C.21.5.1; enhanced equivalence remains.</text></g></svg>