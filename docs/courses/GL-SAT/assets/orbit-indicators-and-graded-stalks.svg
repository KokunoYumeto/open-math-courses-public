<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="24" text-anchor="middle">Orbit indicators determine every stalk degree</text>
<text x="310" y="84" font-size="20" text-anchor="middle">λ, μ dominant; μ≤λ; a²=q; geometric Frobenius</text>
<rect x="28" y="118" width="564" height="181" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="160" font-size="28" text-anchor="middle">g_(λμ)(u)=Σ_r b_r u^r</text>
<text x="310" y="205" font-size="24" text-anchor="middle">b_r=dim H^(−d_μ−2r)(i_μ* IC_λ)</text>
<text x="310" y="251" font-size="20" text-anchor="middle">0≤r≤(d_λ−d_μ)/2; b_r are nonnegative.</text>
<text x="310" y="282" font-size="19" text-anchor="middle">Normalized stalk scalar: a^(−d_μ) q^(−r).</text>
<path d="M310,316 L310,348" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="364" width="564" height="163" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="406" font-size="28" text-anchor="middle">S(c_μ)=a^(d_μ) H_μ(q^(−1))</text>
<text x="310" y="451" font-size="21" text-anchor="middle">Finite Hecke symmetrizer + actual orbit count</text>
<text x="310" y="496" font-size="18" text-anchor="middle">Whole dual roots and central lattice directions retained</text>
<path d="M310,543 L310,575" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="591" width="564" height="184" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="633" font-size="22" text-anchor="middle">χ_λ=Σ_μ g_(λμ)(q^(−n)) H_μ(q^(−n))</text>
<text x="310" y="678" font-size="25" text-anchor="middle">For every extension F_(q^n), n≥1</text>
<text x="310" y="723" font-size="19" text-anchor="middle">The same geometric stalks; Frobenius becomes F^n.</text>
<text x="310" y="756" font-size="18" text-anchor="middle">Triangularity gives g_(λμ)(q^(−n))=m_λ^μ(q^(−n)).</text>
<path d="M310,791 L310,823" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="839" width="564" height="239" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="881" font-size="24" text-anchor="middle">Infinitely many values ⇒ g_(λμ)(u)=m_λ^μ(u)</text>
<text x="310" y="926" font-size="26" text-anchor="middle">GL₂: λ=(2,0), μ=(1,1)</text>
<text x="310" y="970" font-size="22" text-anchor="middle">H_(2,0)=x²+y²+(1−u)xy; H_(1,1)=xy</text>
<text x="310" y="1013" font-size="26" text-anchor="middle">χ_(2,0)=H_(2,0)+u H_(1,1)</text>
<text x="310" y="1056" font-size="21" text-anchor="middle">One raw stalk group in degree −2; g(u)=u.</text>
<text x="310" y="1123" font-size="20" text-anchor="middle">Theorems D.5.1.1–D.6.1.1; Exercise D.7.2.</text>
<text x="310" y="1163" font-size="18" text-anchor="middle">The polynomial variable u is formal; evaluation uses q^(−n).</text>
</svg>