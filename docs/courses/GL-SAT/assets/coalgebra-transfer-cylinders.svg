<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">The actual nonlinear transfer cylinder</text><text x="310" y="76" font-size="18" fill="#172554" text-anchor="middle">Strict positive bars; full perturbed homotopies retained.</text><rect x="25" y="104" width="570" height="300" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="22" fill="#172554" text-anchor="middle">1. The directed dg interval coalgebra J</text><text x="310" y="183" font-size="18" fill="#172554" text-anchor="middle">e has degree −1</text><text x="180" y="223" font-size="27" fill="#172554" text-anchor="middle">v₀</text><text x="440" y="223" font-size="27" fill="#172554" text-anchor="middle">v₁</text><path d="M210,213 L410,213 M397.0,219.0 L410,213 L397.0,207.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="262" font-size="25" fill="#172554" text-anchor="middle">de = v₁−v₀</text><text x="310" y="306" font-size="25" fill="#172554" text-anchor="middle">Δe = e⊗v₁ + v₀⊗e</text><text x="310" y="349" font-size="22" fill="#172554" text-anchor="middle">Ψ(v₀,x)=IPx;  Ψ(v₁,x)=x</text><text x="310" y="390" font-size="20" fill="#172554" text-anchor="middle">Ψ(e,x)=H∞x;  C.36.1–C.36.2.</text><rect x="25" y="438" width="570" height="345" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="481" font-size="18" fill="#172554" text-anchor="middle">2. Both cylinders retain the common comparison</text><text x="135" y="532" font-size="26" fill="#172554" text-anchor="middle">gₙσₙ</text><text x="483" y="532" font-size="23" fill="#172554" text-anchor="middle">σ̃ₙg₁^(⊗n)</text><path d="M150,551 L310,648 M295.7728405692184,646.3912941440026 L310,648 L301.9938824841056,636.1297817070752" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M470,551 L310,648 M318.0061175158944,636.1297817070752 L310,648 L324.2271594307816,646.3912941440026" fill="none" stroke="#15803d" stroke-width="3"/><text x="135" y="607" font-size="18" fill="#172554" text-anchor="middle">J source</text><text x="480" y="607" font-size="18" fill="#172554" text-anchor="middle">Jⁿ target</text><circle cx="310" cy="653" r="5" fill="#24415a"/><text x="310" y="687" font-size="23" fill="#172554" text-anchor="middle">Mₙ = P̃ₙFₙ shₙ I₁^(⊗n)</text><text x="310" y="729" font-size="19" fill="#172554" text-anchor="middle">Kₙ = −source edge + ordered target path</text><text x="310" y="768" font-size="20" fill="#172554" text-anchor="middle">dKₙ+Kₙd = gₙσₙ−σ̃ₙg₁^(⊗n)</text><rect x="25" y="817" width="570" height="210" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="861" font-size="17" fill="#172554" text-anchor="middle">3. Keep the full cube and nonlinear coproduct faces</text><text x="310" y="907" font-size="23" fill="#172554" text-anchor="middle">q-cell: degree −q;   wout = win−q</text><text x="310" y="953" font-size="17" fill="#172554" text-anchor="middle">Intermediate vertices and higher cells are actual maps.</text><text x="310" y="996" font-size="18" fill="#172554" text-anchor="middle">156 perturbed words; 468 cylinder coproduct checks.</text><text x="310" y="1067" font-size="17" fill="#172554" text-anchor="middle">Convolution-module grafting and cross-arity descent remain.</text><text x="310" y="1110" font-size="16" fill="#172554" text-anchor="middle">Chain identities alone do not prove the full tensor equivalence.</text></g></svg>