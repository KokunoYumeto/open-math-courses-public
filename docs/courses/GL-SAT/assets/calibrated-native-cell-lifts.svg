<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Calibrate the target and retain every chosen face</text><text x="310" y="78" font-size="18" fill="#172554" text-anchor="middle">C.48.1: fix actual rational mapping cohomology first</text><rect x="25" y="104" width="570" height="304" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="147" font-size="21" fill="#172554" text-anchor="middle">Hℚ = H*RHom;   its differential is zero.</text><text x="110" y="217" font-size="24" fill="#172554" text-anchor="middle">Hℚ ⊗ E</text><text x="506" y="217" font-size="25" fill="#172554" text-anchor="middle">Sᴱ</text><path d="M210,205 L450,205 M437.0,211.0 L450,205 L437.0,199.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M450,247 L210,247 M223.0,241.0 L210,247 L223.0,253.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="188" font-size="19" fill="#172554" text-anchor="middle">L = H*(Φ)</text><text x="310" y="276" font-size="19" fill="#172554" text-anchor="middle">J = L⁻¹</text><text x="310" y="324" font-size="20" fill="#172554" text-anchor="middle">J Φ has identity first cohomology map.</text><text x="310" y="369" font-size="18" fill="#172554" text-anchor="middle">L = diag(1,√2,2);   J L = 1 in the example.</text><text x="310" y="397" font-size="16" fill="#172554" text-anchor="middle">The target is rational; these comparison matrices use E.</text><rect x="25" y="442" width="570" height="324" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="485" font-size="18" fill="#172554" text-anchor="middle">C.48.2: lift a whole native cell relative to its faces</text><text x="310" y="537" font-size="27" fill="#172554" text-anchor="middle">Rₙ,[p] → Qₘ → Uₘ</text><text x="310" y="581" font-size="23" fill="#172554" text-anchor="middle">Qₘ = ΩB(Uₘ);   εₘ F̃α = Fα</text><text x="310" y="630" font-size="17" fill="#172554" text-anchor="middle">o = d v − v d₁ − F̃δ lies in the contracted kernel.</text><text x="310" y="674" font-size="24" fill="#172554" text-anchor="middle">Replace v by v − h o.</text><text x="310" y="719" font-size="16" fill="#172554" text-anchor="middle">On every prescribed face o=0, so its lift stays unchanged.</text><text x="310" y="752" font-size="17" fill="#172554" text-anchor="middle">Nullary inputs and actual scalar index outputs remain.</text><rect x="25" y="805" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="847" font-size="18" fill="#172554" text-anchor="middle">C.48.3: two prism triangles keep the same diagonal</text><text x="110" y="900" font-size="17" fill="#172554" text-anchor="middle">(0,1)</text><text x="510" y="900" font-size="17" fill="#172554" text-anchor="middle">(1,1)</text><text x="110" y="999" font-size="17" fill="#172554" text-anchor="middle">(0,0)</text><text x="510" y="999" font-size="17" fill="#172554" text-anchor="middle">(1,0)</text><path d="M130,963 L480,963 M467.0,969.0 L480,963 L467.0,957.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M130,963 L130,918 M136.0,931.0 L130,918 L124.0,931.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M480,963 L480,918 M486.0,931.0 L480,918 L474.0,931.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M160,910 L450,910 M437.0,916.0 L450,910 L437.0,904.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M160,954 L450,919 M437.8125779920156,926.5144357605409 L450,919 L436.37473606972526,914.6008884044213" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="1018" font-size="16" fill="#172554" text-anchor="middle">Lift the second triangle relative to their shared face.</text><text x="310" y="1070" font-size="15" fill="#172554" text-anchor="middle">Exercises C.48.4.1–2 compute calibration and face correction.</text><text x="310" y="1104" font-size="16" fill="#172554" text-anchor="middle">Pure state maps use the single q=Ωg and its literal powers.</text></g></svg>