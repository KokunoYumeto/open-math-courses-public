<svg xmlns="http://www.w3.org/2000/svg" width="620" height="960" viewBox="0 0 620 960" role="img" aria-labelledby="title desc">
<title id="title">An eighth-order approximation becomes an exact smooth factorization</title>
<desc id="desc">For a Noetherian ring R, a strictly standard element pi in A and stable pi annihilators in R and L, a smooth factor C zero modulo pi to the eighth lifts to a smooth R algebra D with a compatible factorization modulo pi to the fourth. The correction produces A to B to L and D to B, with B smooth over D and R. The correction uses x equals pi squared S v plus pi cubed w, a unit Jacobian modulo pi, and stable annihilator cancellation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#152b3b} .title{font-size:24px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.obj{font-size:20px;font-weight:600}.map{stroke:#34495e;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#f4f8fb;stroke:#b9cbd7;stroke-width:1.4}.accent{fill:#ecf7f3;stroke:#89bba7;stroke-width:1.4}</style>
<rect width="620" height="960" fill="white"/>
<text x="28" y="38" class="title">From an eighth-order approximation</text>
<text x="28" y="68" class="title">to an exact smooth factorization</text>
<text x="28" y="102" class="body">R Noetherian; π strictly standard in A/R.</text>
<text x="28" y="127" class="body">Ann(π) = Ann(π²) in both R and the target algebra L.</text>

<rect x="20" y="151" width="580" height="250" rx="12" class="card"/>
<text x="38" y="182" class="heading">1. Lift a second-order algebra using τ = π⁴</text>
<text x="76" y="226" class="obj" text-anchor="middle">A/π⁸A</text>
<text x="305" y="226" class="obj" text-anchor="middle">C₀</text>
<text x="530" y="226" class="obj" text-anchor="middle">L/π⁸L</text>
<path d="M 130 219 H 274" class="map"/><path d="M 337 219 H 468" class="map"/>
<text x="305" y="254" class="small" text-anchor="middle">smooth over R/π⁸R</text>
<path d="M 76 242 V 293" class="map"/><path d="M 305 266 V 293" class="map"/><path d="M 530 242 V 293" class="map"/>
<text x="76" y="324" class="obj" text-anchor="middle">A/π⁴A</text>
<text x="305" y="324" class="obj" text-anchor="middle">D/π⁴D</text>
<text x="530" y="324" class="obj" text-anchor="middle">L/π⁴L</text>
<path d="M 130 317 H 250" class="map"/><path d="M 362 317 H 468" class="map"/>
<text x="38" y="368" class="body">D is smooth over R and has an actual map D → L.</text>

<rect x="20" y="422" width="580" height="224" rx="12" class="accent"/>
<text x="38" y="453" class="heading">2. Correct the compatible fourth-order factorization</text>
<text x="86" y="504" class="obj" text-anchor="middle">A</text>
<text x="305" y="504" class="obj" text-anchor="middle">B</text>
<text x="532" y="504" class="obj" text-anchor="middle">L</text>
<path d="M 107 497 H 278" class="map"/><path d="M 330 497 H 507" class="map"/>
<text x="305" y="592" class="obj" text-anchor="middle">D</text>
<path d="M 305 566 V 520" class="map"/>
<path d="M 331 584 L 510 518" class="map"/>
<text x="267" y="551" class="small" text-anchor="end">smooth</text>
<text x="38" y="625" class="body">The triangle commutes; B is smooth over D and R.</text>

<rect x="20" y="667" width="580" height="199" rx="12" class="card"/>
<text x="38" y="698" class="heading">The correction over D and its exact cancellation</text>
<text x="38" y="730" class="body">J₀S = uπI,  u ∈ 1 + π³D;  x = π²Sv + π³w.</text>
<text x="38" y="758" class="body">fⱼ(x) = π³gⱼ (j ≤ c),  g ≡ v + J₀w mod π.</text>
<text x="38" y="786" class="body">The Jacobian in v is the identity modulo π.</text>
<text x="38" y="814" class="body">In L: v ↦ 0, w ↦ πλ, x ↦ π⁴λ.</text>
<text x="38" y="842" class="body">gⱼ lies in πL and π³gⱼ = 0; stable annihilators give gⱼ = 0.</text>
<text x="28" y="888" class="small">x denotes translated coordinates of A⊗<tspan baseline-shift="sub" font-size="11">R</tspan>D.</text>
<text x="28" y="916" class="small">Proof: Appendix G, G.4–G.6; Corollary G.6.2.</text>
<a href="https://stacks.math.columbia.edu/tag/07CP"><text x="28" y="941" class="small">Free human construction: Stacks 07CP</text></a>
<a href="https://stacks.math.columbia.edu/tag/07CT"><text x="331" y="941" class="small">and 07CT.</text></a>
</svg>
