<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#234257"/></marker></defs>
<rect width="1120" height="490" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#183748">
<text x="40" y="43" font-size="26" font-weight="bold">From a splitting on the zero section to a splitting on V</text>
<text x="40" y="76" font-size="18">B = A[[x₁,…,x_d]], I = (x₁,…,x_d), V lies over the punctured base U.</text>
<rect x="60" y="120" width="230" height="95" rx="10" fill="#e9f2f1" stroke="#234257"/>
<text x="175" y="152" text-anchor="middle" font-size="22">N ⊂ L</text>
<text x="175" y="181" text-anchor="middle" font-size="17">finite normalization</text>
<text x="175" y="204" text-anchor="middle" font-size="17">N|V = C</text>
<rect x="815" y="120" width="230" height="95" rx="10" fill="#e9f2f1" stroke="#234257"/>
<text x="930" y="154" text-anchor="middle" font-size="24">Bʳ</text>
<text x="930" y="184" text-anchor="middle" font-size="17">limₙ (B/Iⁿ)ʳ</text>
<path d="M 310 151 L 790 151" stroke="#234257" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="551" y="137" text-anchor="middle" font-size="20">α: compatible component sections</text>
<text x="551" y="183" text-anchor="middle" font-size="17">Tr(z) = Σᵢ αᵢ(z) for every z ∈ N</text>
<text x="551" y="208" text-anchor="middle" font-size="17">Trace nondegeneracy ⇒ α_K injective ⇒ α_K is an isomorphism</text>
<path d="M 175 233 L 175 298" stroke="#234257" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="195" y="267" font-size="17">restrict to Vₙ</text>
<path d="M 930 233 L 930 298" stroke="#234257" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="950" y="267" font-size="17">mod Iⁿ</text>
<rect x="60" y="316" width="310" height="65" rx="10" fill="#fff0d8" stroke="#234257"/>
<text x="215" y="355" text-anchor="middle" font-size="20">Γ(Vₙ, C|Vₙ)</text>
<rect x="815" y="316" width="230" height="65" rx="10" fill="#fff0d8" stroke="#234257"/>
<text x="930" y="355" text-anchor="middle" font-size="21">(B/Iⁿ)ʳ</text>
<path d="M 390 348 L 790 348" stroke="#234257" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="590" y="332" text-anchor="middle" font-size="18">ordered split algebra; idempotents lift uniquely</text>
<text x="590" y="377" text-anchor="middle" font-size="17">Γ(U, O) = A gives Γ(Vₙ, O) = B/Iⁿ</text>
<text x="40" y="427" font-size="19" font-weight="bold">Normality completes the argument: integral closure of B in Kʳ is Bʳ, so N = Bʳ.</text>
<text x="40" y="460" font-size="17">Lemma A.4.3, §§A.4.2–A.4.3. Assumptions include a regular sequence in A and normal Noetherian B.</text>
</g></svg>
