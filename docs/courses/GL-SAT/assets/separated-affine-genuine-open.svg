<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The separated chart makes the open affine</text>
<text x="310" y="84" font-size="18" text-anchor="middle">Actual fixed T; simply connected derived G; arbitrary parameters</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="19" text-anchor="middle">Compactified chart: Z=M̄_{b,y,k}, separated.</text>
<text x="310" y="198" font-size="22" text-anchor="middle">Entire genuine open: U=M_k, affine.</text>
<text x="310" y="237" font-size="16" text-anchor="middle">For affine V⊂Z, U∩V=(U×V)×_{Z×Z}Δ_Z.</text>
<text x="310" y="276" font-size="18" text-anchor="middle">Δ_Z closed ⇒ U∩V closed in affine U×V.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="19" text-anchor="middle">Therefore U→Z is an affine open immersion.</text>
<text x="310" y="443" font-size="22" text-anchor="middle">B̄_{b,y}=[Z/N_k]; Bun_Nᵀ=[U/N_k].</text>
<text x="310" y="482" font-size="22" text-anchor="middle">N_k=N(κ[u]/uᵏ); dim N_k=k|Φ⁺|.</text>
<text x="310" y="521" font-size="19" text-anchor="middle">The action retains every stabilizer scheme.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="23" text-anchor="middle">Pull back to any test S→B̄_{b,y}.</text>
<text x="310" y="688" font-size="18" text-anchor="middle">Compatible full jet frames give an N_k-torsor.</text>
<text x="310" y="727" font-size="19" text-anchor="middle">It is an affine faithfully flat cover of S.</text>
<text x="310" y="766" font-size="19" text-anchor="middle">Affine descent proves the open affine on S.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="18" text-anchor="middle">Separatedness is necessary: double A² at 0.</text>
<text x="310" y="933" font-size="21" text-anchor="middle">Its two affine opens meet in W=A²∖{0}.</text>
<text x="310" y="972" font-size="20" text-anchor="middle">Γ(W,O)=κ[x,y], but W omits the origin.</text>
<text x="310" y="1011" font-size="17" text-anchor="middle">Thus W is not affine; the diagonal is not closed.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorem M.6.1.1; Exercise M.7.2.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">This proves the affine geometric input; boundary coefficients come later.</text>
</svg>