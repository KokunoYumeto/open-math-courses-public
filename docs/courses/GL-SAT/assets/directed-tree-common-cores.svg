<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">A tree diagram over one common IC bar</text><text x="310" y="77" font-size="18" fill="#172554" text-anchor="middle">C = Bℳ;   Dᵢ = Bar(kI);   source = C^(⊗n) ⊗ Dᵢ</text><rect x="25" y="104" width="570" height="292" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="19" fill="#172554" text-anchor="middle">1. The index and its negative bar degrees remain</text><text x="145" y="195" font-size="23" fill="#172554" text-anchor="middle">(12)3</text><text x="475" y="195" font-size="23" fill="#172554" text-anchor="middle">1(23)</text><text x="145" y="222" font-size="15" fill="#172554" text-anchor="middle">height 0</text><text x="475" y="222" font-size="15" fill="#172554" text-anchor="middle">height 0</text><path d="M208,204 L276,253 M261.9452823234342,250.26780106287472 L276,253 L268.96071016199164,240.5321052869174" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M411,204 L345,253 M351.8612326331005,240.43323881206948 L345,253 L359.0144326122904,250.0681612330191" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="279" font-size="22" fill="#172554" text-anchor="middle">3-corolla</text><text x="310" y="305" font-size="15" fill="#172554" text-anchor="middle">height 1</text><text x="310" y="347" font-size="20" fill="#172554" text-anchor="middle">|s(index arrow)| = −1;   W = −1 + 1 = 0</text><text x="310" y="382" font-size="17" fill="#172554" text-anchor="middle">Actual shuffle and finite windows: C.42.1.</text><rect x="25" y="430" width="570" height="302" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="473" font-size="19" fill="#172554" text-anchor="middle">2. Recover the full graph with a weighted centre</text><text x="310" y="520" font-size="22" fill="#172554" text-anchor="middle">ν = Σ (|N| + cross endpoint height jump)</text><text x="310" y="566" font-size="23" fill="#172554" text-anchor="middle">Δν = W(consumed cores) + 1 ≥ 1</text><text x="310" y="611" font-size="22" fill="#172554" text-anchor="middle">W(path) = Σ W(core slots) + ν − q</text><text x="310" y="652" font-size="23" fill="#172554" text-anchor="middle">0 ≤ ν ≤ W + q;   q ≤ H</text><text x="310" y="698" font-size="16" fill="#172554" text-anchor="middle">All native index-chain components survive: C.42.2.</text><rect x="25" y="774" width="570" height="254" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="816" font-size="17" fill="#172554" text-anchor="middle">3. Grafting keeps the index; unit maps keep their data</text><text x="310" y="861" font-size="21" fill="#172554" text-anchor="middle">input coordinate = g^(⊗n) ⊗ id(index)</text><text x="310" y="903" font-size="20" fill="#172554" text-anchor="middle">g^(⊗(n+1)) j = j g^(⊗n),  j inserts e(unit)</text><text x="310" y="948" font-size="17" fill="#172554" text-anchor="middle">Collapsed arrow: reduced zero → 0, actual functor → 1</text><text x="310" y="994" font-size="17" fill="#172554" text-anchor="middle">The augmentation condition matters: C.42.4.2.</text><text x="310" y="1070" font-size="16" fill="#172554" text-anchor="middle">C.42.3: positive grafting preserves height and composition.</text><text x="310" y="1104" font-size="15" fill="#172554" text-anchor="middle">Geometric unit comparison retains its full module diagram.</text></g></svg>