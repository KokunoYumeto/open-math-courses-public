<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">Block products over the same common cores</text><text x="310" y="77" font-size="20" fill="#172554" text-anchor="middle">C = Bℳ;   Aᵢ = C^(⊗nᵢ);   N = Σ nᵢ</text><rect x="25" y="104" width="570" height="261" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="21" fill="#172554" text-anchor="middle">1. Actual common-cobar projections</text><text x="154" y="201" font-size="24" fill="#172554" text-anchor="middle">Ω(⊗ Aᵢ)</text><text x="464" y="201" font-size="24" fill="#172554" text-anchor="middle">⊗ ΩAᵢ</text><path d="M253,192 L365,192 M352.0,198.0 L365,192 L352.0,186.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="179" font-size="19" fill="#172554" text-anchor="middle">κ</text><text x="310" y="245" font-size="18" fill="#172554" text-anchor="middle">κ sends each generator to its one-factor sum.</text><text x="310" y="286" font-size="24" fill="#172554" text-anchor="middle">Bκ ∘ η = sh ∘ (⊗ ηᵢ)</text><text x="310" y="330" font-size="17" fill="#172554" text-anchor="middle">Strict ordered regrouping; quasi-equivalence: C.41.1.</text><rect x="25" y="402" width="570" height="317" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="446" font-size="20" fill="#172554" text-anchor="middle">2. One product has one cross suspension</text><text x="310" y="491" font-size="22" fill="#172554" text-anchor="middle">K(Z) = Z[−1];   ZP = (⊗ K(Zᵢ))[1]</text><text x="310" y="542" font-size="23" fill="#172554" text-anchor="middle">ZP = C^(⊗m) ⊗ s(⊗ Mᵢ) ⊗ C^(⊗N)</text><text x="310" y="585" font-size="17" fill="#172554" text-anchor="middle">Two bare degree-0 mappings: product cross degree −1.</text><text x="310" y="632" font-size="20" fill="#172554" text-anchor="middle">T₁ ⊗ ⋯ ⊗ Tₘ: output g^(⊗m), input g^(⊗N)</text><text x="310" y="679" font-size="17" fill="#172554" text-anchor="middle">Both coactions and all module actions: C.41.2.</text><rect x="25" y="758" width="570" height="261" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="801" font-size="18" fill="#172554" text-anchor="middle">3. Vanishing one-letter actions leaves higher actions</text><text x="310" y="850" font-size="20" fill="#172554" text-anchor="middle">wvup → wvy → wvx → −wz → wt → q</text><text x="310" y="896" font-size="19" fill="#172554" text-anchor="middle">maps: δ, H, δ, H, δ;   |p|=0, |q|=4</text><text x="310" y="939" font-size="22" fill="#172554" text-anchor="middle">Transferred three-letter term: +q ≠ 0</text><text x="310" y="983" font-size="18" fill="#172554" text-anchor="middle">Degree and exact signs: Exercise C.41.4.2.</text><text x="310" y="1054" font-size="16" fill="#172554" text-anchor="middle">C.41.3 normalizes products inside the full grafting graph.</text><text x="310" y="1100" font-size="16" fill="#172554" text-anchor="middle">Ordered-tree and unit coherence require their full data.</text></g></svg>