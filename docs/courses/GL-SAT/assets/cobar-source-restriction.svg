<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Full transformation restriction has a contracted kernel</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.73: exact section, mixed homotopy and higher units</text><rect x="25" y="105" width="570" height="300" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="26" fill="#172554" text-anchor="middle">r : Nat(F,G) → Nat(Fj,Gj)</text><text x="310" y="193" font-size="22" fill="#172554" text-anchor="middle">s(ψ) = U(G)⁻¹ (ψq) U(F),     rs = 1</text><text x="310" y="239" font-size="23" fill="#172554" text-anchor="middle">P = sr,     U(F) = F₍*,1₎(u)</text><text x="310" y="285" font-size="23" fill="#172554" text-anchor="middle">h(φ) = (−1)ʳ⁺¹ U(G)⁻¹ M₁₁(φ,u)</text><text x="310" y="331" font-size="25" fill="#172554" text-anchor="middle">dh + hd = 1 − P,     rh = 0</text><text x="310" y="378" font-size="17" fill="#172554" text-anchor="middle">All degrees, all source components, actual identity outputs.</text><rect x="25" y="445" width="570" height="260" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="488" font-size="24" fill="#172554" text-anchor="middle">Contract N = ker r with H(N) = hdh</text><text x="310" y="535" font-size="23" fill="#172554" text-anchor="middle">dH(N) + H(N)d = 1(N),     H(N)² = 0</text><text x="310" y="581" font-size="22" fill="#172554" text-anchor="middle">Length ≤ 2:   3087 → 657,   dim N = 2430</text><text x="310" y="627" font-size="21" fill="#172554" text-anchor="middle">The absolute identity class is nonzero:</text><text x="310" y="670" font-size="26" fill="#15803d" text-anchor="middle">β(dT) = 0,     β(1) = 1</text><rect x="25" y="745" width="570" height="320" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="789" font-size="23" fill="#172554" text-anchor="middle">A second unit component is necessary</text><text x="310" y="835" font-size="23" fill="#172554" text-anchor="middle">u₂(M(e,f), Z(y,e)) = −S − Z(f,y)</text><text x="310" y="879" font-size="21" fill="#172554" text-anchor="middle">φ₁(M(e,e)) = E(e,e),   φ₁(S) = −E(e,e)</text><text x="310" y="923" font-size="21" fill="#172554" text-anchor="middle">On the input (M(e,f), M(y,e)):</text><text x="310" y="967" font-size="21" fill="#172554" text-anchor="middle">(dhφ + hdφ)₂ = ((1 − P)φ)₂ = −E(e,e)</text><text x="310" y="1010" font-size="21" fill="#7c3aed" text-anchor="middle">Omitting u₂ gives the defect +E(e,e) ≠ 0.</text><text x="310" y="1045" font-size="18" fill="#172554" text-anchor="middle">Full lifted composition agrees after restriction.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.73.1.1–2.1; Exercises C.73.3.1–2.</text></g></svg>