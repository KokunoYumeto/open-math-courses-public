<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The central cover retains Whittaker complexes</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="25" text-anchor="middle">G̃=G_sc ⋊ T → G; kernel S=T_sc</text>
<text x="310" y="198" font-size="24" text-anchor="middle">λ̃=(0,λ); q_*(m,ℓ)=φ_*(m)+ℓ</text>
<text x="310" y="237" font-size="20" text-anchor="middle">Ñ ≅ N; roots and all original labels persist.</text>
<text x="310" y="276" font-size="20" text-anchor="middle">The kernel is the actual smooth central torus.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="20" text-anchor="middle">u: Z_(λ̃) → Z_λ is a universal homeomorphism.</text>
<text x="310" y="443" font-size="19" text-anchor="middle">u* ≅ u!; Ru_* ≅ Ru_! are inverse equivalences.</text>
<text x="310" y="482" font-size="22" text-anchor="middle">u*IC_λ=IC_(λ̃), with the same half twist.</text>
<text x="310" y="521" font-size="20" text-anchor="middle">Actual units, duality and Frobenius correspond.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="23" text-anchor="middle">ν̃=(−θ_sc,λ), where φ_*(θ_sc)=λ−ν</text>
<text x="310" y="688" font-size="22" text-anchor="middle">S_(ν̃) ≅ S_ν on every parameter ring.</text>
<text x="310" y="727" font-size="19" text-anchor="middle">X_(λ̃,ν̃) ↪ X_(λ,ν): nilpotent closed immersion</text>
<text x="310" y="766" font-size="20" text-anchor="middle">χ_(μ̃) pulls back χ_μ with the positive residue.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="23" text-anchor="middle">PGL₂ label n lifts to GL₂ label (n,0).</text>
<text x="310" y="933" font-size="20" text-anchor="middle">ν=n−2c lifts to (n−c,c), retaining the centre.</text>
<text x="310" y="972" font-size="23" text-anchor="middle">n=2, ν=0 lifts to (1,1), not to (0,0).</text>
<text x="310" y="1011" font-size="22" text-anchor="middle">d=n; h_ν=n−2c; D=n−c on both sides.</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Theorems H.4.1.1, H.5.1.1, H.7.1.1; Lemma H.6.1.1.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">Exercise H.8.2 retains the actual central labels and Weil maps.</text>
</svg>