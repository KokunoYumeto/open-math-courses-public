<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem19; Exercise20", "V_degrees": {"e": 0, "f": -1, "y": 0}, "zeta_object": "Efe", "Gamma_object": "1+Eye", "eta_object": "1", "input_u": "Eef", "input_u_degree": 1, "Gamma_one_input": "-Eee-Eff", "pushforward_three_terms": [-1, 0, 1], "eta_one_input": 0, "source_v": "Eey", "d_v": "-Eef", "bare_q_v": 0, "bare_q_Eef": -1, "bare_partial_q_v": 1, "full_partial_eta_v": 0, "native_coherence_surface": "chi_omega=omega^[1]; full boundary has8terms"}</metadata><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">An identity image still needs the higher term</text><text x="310" y="79" font-size="17" fill="#172554" text-anchor="middle">Actual full scalar End(V) functor W</text><rect x="17" y="109" width="586" height="421" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="150" font-size="21" fill="#172554" text-anchor="middle">Γ = 1 + d_Nat ζ;     ζ₀ = E_fe</text><text x="310" y="194" font-size="21" fill="#172554" text-anchor="middle">Γ₀ = 1_V + E_ye;     η₀ = W₁Γ₀ = 1_V</text><text x="310" y="239" font-size="20" fill="#172554" text-anchor="middle">u = E_ef;     ν_Γ(u) = −E_ee − E_ff</text><text x="113" y="308" font-size="17" fill="#b91c1c" text-anchor="middle">W₁ν_Γ(u)</text><text x="113" y="357" font-size="26" fill="#b91c1c" text-anchor="middle">−1_V</text><text x="310" y="308" font-size="17" fill="#2563eb" text-anchor="middle">σ_W(Γ₀,u)</text><text x="310" y="357" font-size="26" fill="#2563eb" text-anchor="middle">0</text><text x="507" y="308" font-size="17" fill="#15803d" text-anchor="middle">−σ_W(u,Γ₀)</text><text x="507" y="357" font-size="26" fill="#15803d" text-anchor="middle">+1_V</text><text x="310" y="412" font-size="23" fill="#15803d" text-anchor="middle">ν_η(u) = −1_V + 0 + 1_V = 0</text><text x="310" y="462" font-size="17" fill="#172554" text-anchor="middle">Each term comes from an actual coextension cut.</text><text x="310" y="504" font-size="17" fill="#172554" text-anchor="middle">Taking only W₁ν_Γ loses the last source-input term.</text><rect x="17" y="560" width="586" height="291" rx="15" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="310" y="601" font-size="20" fill="#b91c1c" text-anchor="middle">The missing term breaks the source differential</text><text x="310" y="647" font-size="20" fill="#172554" text-anchor="middle">q(v) = W₁ν_Γ(v);     v = E_ey</text><text x="310" y="692" font-size="18" fill="#172554" text-anchor="middle">q(v) = 0;     d(v) = −E_ef;     q(E_ef) = −1_V</text><text x="310" y="744" font-size="23" fill="#b91c1c" text-anchor="middle">∂q(v) = d q(v) + q(dv) = 1_V</text><text x="310" y="799" font-size="22" fill="#15803d" text-anchor="middle">The full ∂ν_η(v) is zero.</text><rect x="17" y="882" width="586" height="152" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="920" font-size="18" fill="#172554" text-anchor="middle">The original coherence retains its one-input surface</text><text x="310" y="960" font-size="22" fill="#172554" text-anchor="middle">χ_ω(u) = ω^[1](su)</text><text x="310" y="1001" font-size="17" fill="#172554" text-anchor="middle">Its full native boundary has all eight terms of (19.2).</text><text x="310" y="1070" font-size="13" fill="#172554" text-anchor="middle">Theorem 19 and Exercise 20. Full source differentials are retained.</text><text x="310" y="1103" font-size="12" fill="#172554" text-anchor="middle">Free full-bar background: Keller, arXiv:math/9910179, §4.2.</text></g></svg>