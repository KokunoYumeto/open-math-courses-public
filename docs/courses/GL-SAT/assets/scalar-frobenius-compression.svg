<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">A scalar operator passes to the actual IC</text>
<text x="310" y="84" font-size="24" text-anchor="middle">Raw I=IC_λ; B=Rf_*E[d]; d=d_λ</text>
<rect x="28" y="119" width="564" height="183" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="163" font-size="27" text-anchor="middle">Underlying derived maps: I → B → I</text>
<text x="310" y="207" font-size="19" text-anchor="middle">v u=1; both maps are identity on the dense cell.</text>
<text x="310" y="251" font-size="21" text-anchor="middle">They need not separately intertwine Frobenius.</text>
<text x="310" y="281" font-size="18" text-anchor="middle">The rootwise resolution has split affine-paved fibres.</text>
<path d="M310,318 L310,351" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="367" width="564" height="187" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="411" font-size="26" text-anchor="middle">σ*I ─σ*u→ σ*B ─α_B→ B ─v→ I</text>
<text x="310" y="455" font-size="31" text-anchor="middle">v α_B σ*u = α_I</text>
<text x="310" y="499" font-size="20" text-anchor="middle">Both sides have the same raw dense-open identity.</text>
<text x="310" y="533" font-size="19" text-anchor="middle">Intermediate-extension uniqueness proves equality.</text>
<path d="M310,570 L310,603" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="619" width="564" height="208" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="663" font-size="20" text-anchor="middle">Natural stalk transport retains the field pullback.</text>
<text x="310" y="707" font-size="31" text-anchor="middle">F_I^i = v_i F_B^i u_i</text>
<text x="310" y="751" font-size="28" text-anchor="middle">F_B^i=q^((i+d)/2) id</text>
<text x="310" y="795" font-size="27" text-anchor="middle">Hence F_I^i=q^((i+d)/2) id.</text>
<path d="M310,843 L310,876" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="892" width="564" height="179" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="936" font-size="29" text-anchor="middle">Normalized IC stalk: F^i=a^i id</text>
<text x="310" y="980" font-size="28" text-anchor="middle">Normalized costalk: F^i=a^i id</text>
<text x="310" y="1024" font-size="22" text-anchor="middle">Point duality inverts the degree −i scalar.</text>
<text x="310" y="1054" font-size="19" text-anchor="middle">The integer raw exponent uses i+d even; a²=q.</text>
<text x="310" y="1125" font-size="20" text-anchor="middle">Lemma C.2.1.1; Theorem C.3.1.1.</text>
<text x="310" y="1165" font-size="18" text-anchor="middle">The multiplicity polynomial is proved in Theorem D.6.1.1.</text>
</svg>