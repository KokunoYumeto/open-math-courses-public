<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem61; Exercise61", "fixed_carrier": "P_n=(tensor C_i)+X_input", "interval_product": "MAX; 0 is unit; 1 absorbing; e^2=0; de=1-0", "pentagon_order": ["((12)3)4", "(1(23))4", "1((23)4)", "1(2(34))", "(12)(34)"], "pentagon_loop": "X(f,y,y,g)-X(g,y,y,f)", "pentagon_filler": "-X(f,y,y,f)", "closed_section": "c_n ell_n=1 for n&gt;=1", "native_recovery": "Psi_F ell_n=Xi(F)", "unit_defect": "Id-r_C=delta(H,0,0)"}</metadata><defs><marker id="cylGraftArrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><text x="310" y="40" font-size="23" fill="#172554" text-anchor="middle">A whole carrier and a nonzero pentagon</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">The represented projection is fixed on every comparison.</text><rect x="18" y="105" width="584" height="268" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="148" font-size="23" fill="#2563eb" text-anchor="middle">⊗ Cyl(Iᵢ)   ── cₙ ──→   Cyl(⊗ Iᵢ)</text><text x="310" y="193" font-size="24" fill="#15803d" text-anchor="middle">Pₙ = (⊗ Cᵢ) + X_input</text><text x="310" y="236" font-size="20" fill="#172554" text-anchor="middle">Cᵢ = IᵢYᵢ ⊕ sYᵢ ⊕ Yᵢ ≅ Yᵢ ⊗ L</text><text x="310" y="280" font-size="18" fill="#172554" text-anchor="middle">On the full cube: MAX of the interval factors.</text><text x="310" y="321" font-size="19" fill="#172554" text-anchor="middle">On the original graph block: the identity.</text><text x="310" y="352" font-size="15" fill="#172554" text-anchor="middle">For n ≥ 1: cₙℓₙ = 1, recovering the original joining prism.</text><rect x="18" y="395" width="584" height="420" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><path d="M310 492 L452 589" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#cylGraftArrow)"/><path d="M452 589 L398 746" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#cylGraftArrow)"/><path d="M398 746 L222 746" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#cylGraftArrow)"/><path d="M222 746 L168 589" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#cylGraftArrow)"/><path d="M168 589 L310 492" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#cylGraftArrow)"/><circle cx="310" cy="492" r="4" fill="#2563eb"/><circle cx="452" cy="589" r="4" fill="#2563eb"/><circle cx="398" cy="746" r="4" fill="#2563eb"/><circle cx="222" cy="746" r="4" fill="#2563eb"/><circle cx="168" cy="589" r="4" fill="#2563eb"/><text x="310" y="439" font-size="22" fill="#2563eb" text-anchor="middle">Five specified local rotations</text><text x="310" y="476" font-size="18" fill="#172554" text-anchor="middle">((12)3)4</text><text x="502" y="590" font-size="17" fill="#172554" text-anchor="middle">(1(23))4</text><text x="421" y="781" font-size="17" fill="#172554" text-anchor="middle">1((23)4)</text><text x="199" y="781" font-size="17" fill="#172554" text-anchor="middle">1(2(34))</text><text x="115" y="590" font-size="17" fill="#172554" text-anchor="middle">(12)(34)</text><text x="310" y="613" font-size="28" fill="#b91c1c" text-anchor="middle">δK = Λ</text><text x="310" y="650" font-size="23" fill="#b91c1c" text-anchor="middle">|K| = −2</text><text x="310" y="689" font-size="17" fill="#172554" text-anchor="middle">Λ need not be zero.</text><rect x="18" y="835" width="584" height="167" rx="14" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="310" y="870" font-size="20" fill="#172554" text-anchor="middle">u = (Xg, Xy, Yy, Xg)</text><text x="310" y="917" font-size="23" fill="#b91c1c" text-anchor="middle">Λ(u) = X(f,y,y,g) − X(g,y,y,f)</text><text x="310" y="963" font-size="24" fill="#15803d" text-anchor="middle">K(u) = −X(f,y,y,f)</text><text x="310" y="1041" font-size="17" fill="#172554" text-anchor="middle">Unit insertion: Id − r_C = δ(H,0,0).</text><text x="310" y="1074" font-size="14" fill="#172554" text-anchor="middle">Full marked carriers use the entire closed section Σ.</text><text x="310" y="1106" font-size="11" fill="#172554" text-anchor="middle">Structural collapse, relative kernel and pentagon signs: Theorem61; Exercise61.</text></g></svg>