<svg xmlns="http://www.w3.org/2000/svg" width="620" height="800" viewBox="0 0 620 800" role="img" aria-labelledby="title desc">
<title id="title">Ordered factors, two reduced points and a double-root fibre</title>
<desc id="desc">The degree-two coefficient map has two ordered points over distinct roots. Its fibre at both roots zero is a length-two scheme with one geometric point and coordinate algebra k[epsilon]/epsilon squared, in every characteristic.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#185b85"/></marker></defs>
<rect width="620" height="800" fill="#faf9f5"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173344">
<text x="34" y="46" font-size="27" font-weight="700">A finite fibre can be nonreduced</text>
<text x="34" y="81" font-size="18">Degree-two binary forms · K.3.6.1 and Exercise K.4.7</text>
<rect x="34" y="107" width="552" height="144" rx="14" fill="#edf5fb" stroke="#b6cedd"/>
<text x="54" y="143" font-size="21" font-weight="600">The leading-coefficient chart</text>
<text x="54" y="180" font-size="22" font-family="Cambria Math,serif">(X + z₁Y)(X + z₂Y) = X² + a₁XY + a₂Y²</text>
<text x="54" y="216" font-size="21" font-family="Cambria Math,serif">(z₁, z₂) ↦ (a₁, a₂) = (z₁ + z₂, z₁z₂)</text>
<rect x="34" y="274" width="552" height="200" rx="14" fill="#f0f5e9" stroke="#b9cba5"/>
<text x="54" y="308" font-size="21" font-weight="600">Distinct roots r₁ ≠ r₂ over algebraically closed k</text>
<circle cx="94" cy="361" r="8" fill="#185b85"/><circle cx="94" cy="415" r="8" fill="#185b85"/>
<text x="114" y="368" font-size="21" font-family="Cambria Math,serif">(r₁, r₂)</text>
<text x="114" y="422" font-size="21" font-family="Cambria Math,serif">(r₂, r₁)</text>
<path d="M210 360L355 388M210 414L355 388" stroke="#185b85" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="372" cy="388" r="8" fill="#b76b2f"/>
<text x="392" y="372" font-size="18">same coefficients</text>
<text x="392" y="403" font-size="20" font-family="Cambria Math,serif">(r₁+r₂, r₁r₂)</text>
<text x="54" y="454" font-size="17">Fibre: Spec(k × k), two reduced points.</text>
<rect x="34" y="496" width="552" height="252" rx="14" fill="#fff1e6" stroke="#dcc0a7"/>
<text x="54" y="531" font-size="21" font-weight="600">Double root: a₁ = a₂ = 0</text>
<circle cx="110" cy="593" r="28" fill="#d8e9f4" stroke="#185b85" stroke-dasharray="5 4"/>
<circle cx="110" cy="593" r="8" fill="#185b85"/>
<text x="157" y="580" font-size="18">one geometric point (0, 0)</text>
<text x="157" y="612" font-size="18">length two; not étale</text>
<text x="54" y="658" font-size="20" font-family="Cambria Math,serif">k[z₁,z₂]/(z₁+z₂,z₁z₂) ≅ k[ε]/(ε²)</text>
<text x="54" y="693" font-size="17">z₂ = −z₁; the formula also holds in characteristic 2.</text>
<text x="54" y="722" font-size="16">Dashed halo: schematic nilpotent thickness, not extra points.</text>
<text x="34" y="780" font-size="17">Comparison uses finite surjectivity, with no division by 2!</text>
</g></svg>
