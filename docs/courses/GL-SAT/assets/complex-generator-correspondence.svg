<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">Actual generator maps through a correspondence</text><text x="310" y="76" font-size="18" fill="#172554" text-anchor="middle">C = Y ×X Z;  f and g proper;  Y and Z smooth.</text><rect x="25" y="103" width="570" height="302" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="20" fill="#172554" text-anchor="middle">1. Adjunction keeps the shifts and orientation</text><text x="310" y="189" font-size="19" fill="#172554" text-anchor="middle">r = dim Y;  s = dim Z;  D = RHomE(−,E)</text><text x="310" y="234" font-size="24" fill="#172554" text-anchor="middle">Bf = Rf*E[r];   Bg = Rg*E[s]</text><text x="310" y="281" font-size="25" fill="#172554" text-anchor="middle">RHomX(Bf,Bg)</text><text x="310" y="324" font-size="26" fill="#172554" text-anchor="middle">≃ D RΓc(C,E)[−r−s](−s)</text><text x="310" y="373" font-size="15" fill="#172554" text-anchor="middle">Compact support is required even when Z is nonproper.</text><rect x="25" y="437" width="570" height="279" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="479" font-size="19" fill="#172554" text-anchor="middle">2. Linear duality reverses the comparison arrow</text><text x="310" y="524" font-size="23" fill="#172554" text-anchor="middle">c : RΓc,et(C,E) → RΓc,an(C,E)</text><text x="310" y="569" font-size="25" fill="#172554" text-anchor="middle">h : Hom et → Hom an</text><text x="310" y="614" font-size="25" fill="#172554" text-anchor="middle">D(c) ◦ h = id;    h = D(c⁻¹)</text><text x="310" y="662" font-size="18" fill="#172554" text-anchor="middle">The equality follows from evaluation and trace.</text><text x="310" y="696" font-size="15" fill="#172554" text-anchor="middle">C.25.1.1–C.25.3.1; positive complex orientation.</text><rect x="25" y="750" width="570" height="299" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="791" font-size="19" fill="#172554" text-anchor="middle">3. Retain every level of the Iwahori action nerve</text><text x="310" y="834" font-size="24" fill="#172554" text-anchor="middle">At level m:  Qᵐ × C</text><text x="310" y="877" font-size="24" fill="#172554" text-anchor="middle">Hom m ≃ D RΓc(Qᵐ × C,E)</text><text x="310" y="919" font-size="23" fill="#172554" text-anchor="middle">[−2m dim Q−r−s](−m dim Q−s)</text><text x="310" y="960" font-size="16" fill="#172554" text-anchor="middle">Then derived totalization, cones and coherent retracts.</text><text x="310" y="1000" font-size="17" fill="#172554" text-anchor="middle">Root sections give actual closed affine pavings.</text><text x="310" y="1035" font-size="16" fill="#172554" text-anchor="middle">Stalks and costalks identify the Betti IC retract.</text><text x="310" y="1085" font-size="16" fill="#172554" text-anchor="middle">C.25.4.1–C.25.5.1 prove the full generator comparison.</text><text x="310" y="1110" font-size="14" fill="#172554" text-anchor="middle">Complex geometric fibre; finite E/Qℓ; ordered wall operations.</text></g></svg>