<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="38" font-size="21" fill="#172554" text-anchor="middle">Indexed products keep the actual parameter words</text><text x="310" y="77" font-size="17" fill="#172554" text-anchor="middle">C.52: original degrees,full faces and full square homotopies</text><rect x="25" y="105" width="570" height="252" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="18" fill="#172554" text-anchor="middle">C.52.1–3: even height makes the cobar proof positive</text><text x="310" y="197" font-size="27" fill="#172554" text-anchor="middle">|x|ₕ = |x| + 2Δh ≥ r + q</text><text x="310" y="242" font-size="18" fill="#172554" text-anchor="middle">All original Koszul signs remain exactly the same.</text><text x="310" y="286" font-size="23" fill="#172554" text-anchor="middle">Zero-input ΩD_[2]:  dH = ba − c</text><text x="310" y="331" font-size="18" fill="#172554" text-anchor="middle">Original |H|=−1; auxiliary degrees H:3, ba,c:4.</text><rect x="25" y="393" width="570" height="405" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="435" font-size="22" fill="#172554" text-anchor="middle">C.52.4: two actual full square faces</text><path d="M165,687 L455,510" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5" fill="none"/><path d="M165,687 L165,518 M171.0,531.0 L165,518 L159.0,531.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M173,510 L447,510 M434.0,516.0 L447,510 L434.0,504.0" fill="none" stroke="#15803d" stroke-width="3"/><path d="M173,695 L447,695 M434.0,701.0 L447,695 L434.0,689.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M455,687 L455,518 M461.0,531.0 L455,518 L449.0,531.0" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="165" cy="695" r="5" fill="#172554"/><circle cx="455" cy="695" r="5" fill="#172554"/><circle cx="165" cy="510" r="5" fill="#172554"/><circle cx="455" cy="510" r="5" fill="#172554"/><text x="165" y="490" font-size="22" fill="#172554" text-anchor="middle">01</text><text x="455" y="490" font-size="22" fill="#172554" text-anchor="middle">11</text><text x="165" y="727" font-size="22" fill="#172554" text-anchor="middle">00</text><text x="455" y="727" font-size="22" fill="#172554" text-anchor="middle">10</text><text x="131" y="607" font-size="22" fill="#15803d" text-anchor="middle">p_b</text><text x="493" y="607" font-size="22" fill="#2563eb" text-anchor="middle">p_a</text><text x="326" y="609" font-size="16" fill="#64748b" text-anchor="middle">direct arrow</text><text x="310" y="760" font-size="24" fill="#172554" text-anchor="middle">j(sa ⊗ sb) = p_b − p_a</text><text x="310" y="788" font-size="15" fill="#172554" text-anchor="middle">The shuffle line lies in the sum of the two face spaces.</text><rect x="25" y="830" width="570" height="245" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="870" font-size="21" fill="#172554" text-anchor="middle">C.52.6: the resolved product square</text><text x="310" y="914" font-size="23" fill="#172554" text-anchor="middle">W</text><text x="122" y="997" font-size="23" fill="#172554" text-anchor="middle">Z</text><text x="500" y="997" font-size="23" fill="#172554" text-anchor="middle">W′</text><path d="M145,979 L283,919 M273.47044593719465,929.6858597859073 L283,919 L268.6857326002213,918.6810191108684" fill="none" stroke="#7c3aed" stroke-width="3"/><path d="M337,919 L475,979 M460.6857326002213,979.3189808891316 L475,979 L465.47044593719465,968.3141402140927" fill="none" stroke="#7c3aed" stroke-width="3"/><path d="M148,994 L472,994 M459.0,1000.0 L472,994 L459.0,988.0" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="203" y="936" font-size="23" fill="#7c3aed" text-anchor="middle">φ</text><text x="418" y="936" font-size="23" fill="#7c3aed" text-anchor="middle">u</text><text x="310" y="961" font-size="20" fill="#172554" text-anchor="middle">∂H = uφ − φ′t</text><text x="310" y="1027" font-size="19" fill="#172554" text-anchor="middle">c = φ′t</text><text x="310" y="1061" font-size="19" fill="#172554" text-anchor="middle">R = −H gives ∂R = φ′t − uφ.</text><text x="310" y="1110" font-size="15" fill="#172554" text-anchor="middle">C.52.5 extends central homotopies with every full face retained.</text></g></svg>