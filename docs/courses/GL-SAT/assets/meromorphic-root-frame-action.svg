<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Root coefficients describe the entire action</text>
<text x="310" y="84" font-size="18" text-anchor="middle">SL₃; original torus; m=4, k=15; every parameter algebra</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="18" text-anchor="middle">New formal frame: φ′=nφ; transition: g′=ng.</text>
<text x="310" y="198" font-size="23" text-anchor="middle">New lattice: Λ=φ⁻¹n⁻¹ A[[u]]³.</text>
<text x="310" y="237" font-size="20" text-anchor="middle">Algebraic patch is a finite-jet preimage.</text>
<text x="310" y="276" font-size="16" text-anchor="middle">Its quotient is parameter-flat; base change is exact.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="20" text-anchor="middle">Heights: 1,1,2; thresholds a: 11,11,7.</text>
<text x="310" y="443" font-size="19" text-anchor="middle">K is normal; H=H₄/K₄,₁₅ has dimension 45.</text>
<text x="310" y="482" font-size="22" text-anchor="middle">Regular frames B have dimension 29.</text>
<text x="310" y="521" font-size="18" text-anchor="middle">s=7; J₇/K₄,₁₅ is the full vector group A⁸.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="21" text-anchor="middle">O₀ simple coefficients: u⁻⁴,u⁻³,u⁻².</text>
<text x="310" y="688" font-size="21" text-anchor="middle">O₀ long coefficients: u⁻⁸,…,u⁻⁴.</text>
<text x="310" y="727" font-size="17" text-anchor="middle">The full stabilizer has dimension 3+3+5=11.</text>
<text x="310" y="766" font-size="18" text-anchor="middle">Homogeneous scheme H/O₀ has dimension 34.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="21" text-anchor="middle">Surviving simple exponents: −1,…,10.</text>
<text x="310" y="933" font-size="21" text-anchor="middle">Surviving long exponents: −3,…,6.</text>
<text x="310" y="972" font-size="17" text-anchor="middle">Dimension: 12+12+10=34; stack: 34−29=5.</text>
<text x="310" y="1011" font-size="16" text-anchor="middle">Group law: c″=c+c′+ab′; no division by 2 or 3.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Proposition O.1.1.1; Theorems O.2.1.1–O.3.1.1; Exercise O.9.2.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">The center μ₃ is retained, including in characteristic three.</text>
</svg>