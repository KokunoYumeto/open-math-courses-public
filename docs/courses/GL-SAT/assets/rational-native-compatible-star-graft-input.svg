<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem65; Exercise65", "native_states": [0, 2, 4, 6, 7], "root_bit": 1, "inner_bits": [2, 4], "native_proper_arrows": 9, "P_bar_inputs": 23, "K_inputs": 27, "intersection_inputs": 11, "whole_joint_union_inputs": 39, "D_joint_quotient_inputs": 12, "T_bar_inputs": 87, "T_joint_quotient_inputs": 48, "whole_cubic_R_coefficient": -8, "calibrated_coefficient": "-1/8", "parameter_height": 3, "normalized_relative_inputs": true}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">A compatible three-factor graft keeps its whole input</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">Two nullary children and one binary parent · normalized inputs</text><rect x="18" y="104" width="584" height="358" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="144" font-size="23" fill="#2563eb" text-anchor="middle">Original compatible states</text><path d="M 310 199 L 184 245" stroke="#15803d" stroke-width="3"/><path d="M 310 199 L 436 245" stroke="#15803d" stroke-width="3"/><path d="M 184 277 L 310 322" stroke="#15803d" stroke-width="3"/><path d="M 436 277 L 310 322" stroke="#15803d" stroke-width="3"/><path d="M 310 354 L 310 390" stroke="#15803d" stroke-width="3"/><rect x="286" y="165" width="48" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="310" y="190" font-size="21" fill="#2563eb" text-anchor="middle">0</text><rect x="160" y="243" width="48" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="184" y="268" font-size="21" fill="#2563eb" text-anchor="middle">2</text><rect x="412" y="243" width="48" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="436" y="268" font-size="21" fill="#2563eb" text-anchor="middle">4</text><rect x="286" y="320" width="48" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="310" y="345" font-size="21" fill="#2563eb" text-anchor="middle">6</text><rect x="286" y="388" width="48" height="36" rx="8" fill="white" stroke="#2563eb"/><text x="310" y="413" font-size="21" fill="#2563eb" text-anchor="middle">7</text><text x="119" y="197" font-size="15" fill="#172554" text-anchor="middle">outer bit: 1</text><text x="119" y="224" font-size="15" fill="#172554" text-anchor="middle">inner bits: 2, 4</text><text x="473" y="363" font-size="15" fill="#15803d" text-anchor="middle">outer executes</text><text x="473" y="389" font-size="15" fill="#15803d" text-anchor="middle">after both inners</text><text x="310" y="447" font-size="15" fill="#172554" text-anchor="middle">Cover diagram; all 9 original proper arrows are retained.</text><rect x="18" y="483" width="584" height="257" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="524" font-size="24" fill="#15803d" text-anchor="middle">ξζ = 1;      Bp Bj = 1;      Bj sh = η_K</text><text x="310" y="568" font-size="20" fill="#172554" text-anchor="middle">K: 27 inputs     BP: 23 inputs     intersection: 11</text><text x="310" y="612" font-size="23" fill="#172554" text-anchor="middle">The whole joint input has 39 directions.</text><text x="310" y="656" font-size="20" fill="#172554" text-anchor="middle">BD / J: 12 directions;      BT / Q: 48 directions</text><text x="310" y="702" font-size="19" fill="#172554" text-anchor="middle">The contraction preserves every ordered endpoint.</text><rect x="18" y="761" width="584" height="229" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="801" font-size="23" fill="#2563eb" text-anchor="middle">Keep the actual cubic section term</text><text x="310" y="848" font-size="19" fill="#172554" text-anchor="middle">g₁₂₃ has degree −2; its R-slot has degree −3.</text><text x="310" y="894" font-size="25" fill="#15803d" text-anchor="middle">S((sa|sb;y)⊗³)  ↦  −8 X(z⊗³)</text><text x="310" y="943" font-size="22" fill="#172554" text-anchor="middle">Whole calibration:  −8 / 4³ = −1/8</text><text x="310" y="1031" font-size="15" fill="#172554" text-anchor="middle">Full parameter and state unary terms remain in the Nat kernel.</text><text x="310" y="1069" font-size="14" fill="#172554" text-anchor="middle">A supplied native comparison is retained on its original P-input.</text><text x="310" y="1105" font-size="14" fill="#172554" text-anchor="middle">Tensor-preserving roof and compatible corolla domains: §65.</text></g></svg>