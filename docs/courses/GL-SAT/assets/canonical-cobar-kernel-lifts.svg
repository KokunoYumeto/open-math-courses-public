<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="20" fill="#172554" text-anchor="middle">Lift through the actual canonical cobar projection</text><text x="310" y="78" font-size="18" fill="#172554" text-anchor="middle">C.45.1: correct the defect in its contracted kernel</text><rect x="25" y="104" width="570" height="304" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="105" y="166" font-size="27" fill="#172554" text-anchor="middle">Rₛ</text><text x="310" y="166" font-size="27" fill="#172554" text-anchor="middle">Rᵣ</text><text x="515" y="166" font-size="27" fill="#172554" text-anchor="middle">Uᵣ</text><path d="M140,157 L270,157 M257.0,163.0 L270,157 L257.0,151.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M350,157 L480,157 M467.0,163.0 L480,157 L467.0,151.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="205" y="138" font-size="21" fill="#172554" text-anchor="middle">P̃</text><text x="415" y="138" font-size="21" fill="#172554" text-anchor="middle">κᵣ</text><text x="310" y="213" font-size="17" fill="#172554" text-anchor="middle">κᵣ P̃ = P;   κᵣ is surjective and a quasi-isomorphism.</text><text x="310" y="258" font-size="21" fill="#172554" text-anchor="middle">o = d v − P̃(d x) ∈ ker κᵣ;   d o = 0</text><text x="310" y="305" font-size="20" fill="#172554" text-anchor="middle">P̃(x) = v − h o;   its differential is P̃(d x).</text><text x="310" y="350" font-size="18" fill="#172554" text-anchor="middle">Mixed generator: d w = a b − b a, while κᵣ(w)=0.</text><text x="310" y="394" font-size="16" fill="#172554" text-anchor="middle">The common cobar retains this nonzero kernel term.</text><rect x="25" y="442" width="570" height="324" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="485" font-size="20" fill="#172554" text-anchor="middle">C.45.2: contract the full cofree module kernel</text><text x="310" y="534" font-size="18" fill="#172554" text-anchor="middle">φ = Id ⊗ κᵣ ⊗ Id;   both common cores stay fixed.</text><text x="310" y="581" font-size="24" fill="#172554" text-anchor="middle">hK = H₀ (1 + δ H₀)⁻¹</text><text x="310" y="621" font-size="17" fill="#172554" text-anchor="middle">Every δ consumes a surrounding letter: the sum is finite.</text><text x="310" y="673" font-size="23" fill="#172554" text-anchor="middle">Example: hK(c ⊗ y) = −c ⊗ x + z</text><text x="310" y="719" font-size="17" fill="#172554" text-anchor="middle">d(−c ⊗ x + z) = c ⊗ y: the action term cancels.</text><text x="310" y="753" font-size="16" fill="#172554" text-anchor="middle">The same contraction lifts closed linear comparison data.</text><rect x="25" y="805" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="847" font-size="19" fill="#172554" text-anchor="middle">C.45.3: preserve the prescribed product contraction</text><text x="310" y="893" font-size="20" fill="#172554" text-anchor="middle">I = Iφ IΠ;   P = PΠ φ;   H = Hφ + Iφ HΠ φ</text><text x="310" y="938" font-size="24" fill="#172554" text-anchor="middle">φ I = IΠ;   φ H = HΠ φ</text><text x="310" y="982" font-size="23" fill="#172554" text-anchor="middle">φ′ T = TΠ φ  ⇒  P′ T I = P′Π TΠ IΠ</text><text x="310" y="1016" font-size="16" fill="#172554" text-anchor="middle">Nullary input blocks and the empty product are retained.</text><text x="310" y="1070" font-size="16" fill="#172554" text-anchor="middle">Exercises C.45.4.1–2 show both nonzero corrections.</text><text x="310" y="1104" font-size="16" fill="#172554" text-anchor="middle">Full several-cross coherence needs its complete equations.</text></g></svg>