<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem59; Exercise59", "whole_section": "K=I star J", "mixed_core": "K(s beta|s alpha)=R S=P", "coefficient_degrees": {"e": 0, "z": -1, "w": -2, "v": -1}, "differential": "dw=v", "R": "R(z)=w", "S": "S(e)=z", "omitted_core_defect": "e maps to -v"}</metadata><text x="310" y="40" font-size="23" fill="#172554" text-anchor="middle">The joining prism has mixed products</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">Full section cochains compose on every original cut.</text><rect x="18" y="105" width="584" height="288" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="28" fill="#2563eb" text-anchor="middle">K = I ⋆ J</text><text x="310" y="191" font-size="25" fill="#172554" text-anchor="middle">K(c) = Σ I(c_L) J(c_R)</text><text x="310" y="236" font-size="19" fill="#172554" text-anchor="middle">The two-mark input has three cuts:</text><text x="310" y="279" font-size="21" fill="#172554" text-anchor="middle">I(β|α) J₀  +  I₂ J(β|α)  +  I(β) J(α)</text><text x="310" y="325" font-size="18" fill="#172554" text-anchor="middle">Each one-mark section value has degree −1.</text><text x="310" y="366" font-size="21" fill="#15803d" text-anchor="middle">Their product has degree −2.</text><rect x="18" y="414" width="584" height="270" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="455" font-size="23" fill="#15803d" text-anchor="middle">An exact nonzero mixed component</text><text x="310" y="500" font-size="25" fill="#172554" text-anchor="middle">e  ──S──→  z  ──R──→  w</text><text x="310" y="545" font-size="20" fill="#172554" text-anchor="middle">|e| = 0       |z| = −1       |w| = −2</text><text x="310" y="590" font-size="23" fill="#172554" text-anchor="middle">P = RS;     P(e) = w;     dw = v</text><text x="310" y="641" font-size="21" fill="#172554" text-anchor="middle">δP = NS;      N = δR;      NS(e) = v</text><rect x="18" y="705" width="584" height="292" rx="14" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="310" y="746" font-size="23" fill="#2563eb" text-anchor="middle">Its full boundary equation</text><text x="310" y="795" font-size="22" fill="#172554" text-anchor="middle">δP + (R + S) − (1 + N)S − R = 0</text><text x="310" y="845" font-size="25" fill="#b91c1c" text-anchor="middle">Omitting P leaves e ↦ −v.</text><text x="310" y="893" font-size="19" fill="#172554" text-anchor="middle">The two one-mark rows alone do not close.</text><text x="310" y="944" font-size="18" fill="#15803d" text-anchor="middle">Every longer composite uses all multipart cuts.</text><text x="310" y="1041" font-size="12" fill="#172554" text-anchor="middle">Section-comparison signs and full parameter differential: Theorem59.</text><text x="310" y="1074" font-size="14" fill="#172554" text-anchor="middle">The original direct arrow δ = βα stays a separate input.</text><text x="310" y="1106" font-size="12" fill="#172554" text-anchor="middle">Exact model, calibration and three-section regrouping: Exercise59.</text></g></svg>