<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem76; Exercise76", "graph": "Path on coordinates0,1,2", "normal": [-1, -2, -1], "kappa": 2, "original_connected_set_weights": 1, "mixed_vertex": [2, 8, 2], "four_target_facets": [[1], [0, 1], [1, 2], [0, 1, 2]], "root_region": [1], "child_universes": [[0], [2]], "auxiliary_order_polytope": "Permutohedron on three independent events", "rank_vector_projection": ["x=310+65*(r1-r3)", "y=853+65*(r2-2)"], "cellular_incidence": "(-1)^(prefix_dim+|U|-1+inv(U,V))", "higher_row": "K123=(0,0,R1 graft R2 graft R3)", "higher_row_degree": -2, "third_slot_degree": -3, "cofree_partitions": "Tensor outputs remain even when a composite R-only row is zero."}</metadata><text x="310" y="40" font-size="24" fill="#172554" text-anchor="middle">Every face keeps its painted hierarchy</text><text x="310" y="78" font-size="15" fill="#172554" text-anchor="middle">Exact summands · original facets · all higher replacement orders</text><rect x="18" y="104" width="584" height="248" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="22" fill="#2563eb" text-anchor="middle">Four target facets at one mixed vertex</text><text x="310" y="188" font-size="25" fill="#172554" text-anchor="middle">w = (−1,−2,−1);     x = (2,8,2)</text><text x="310" y="231" font-size="23" fill="#15803d" text-anchor="middle">x₁ = 8;             x₀ + x₁ = 10</text><text x="310" y="272" font-size="22" fill="#15803d" text-anchor="middle">x₁ + x₂ = 10;      x₀ + x₁ + x₂ = 12</text><text x="310" y="321" font-size="19" fill="#172554" text-anchor="middle">The four original facet labels are distinct.</text><rect x="18" y="374" width="584" height="291" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="416" font-size="20" fill="#15803d" text-anchor="middle">Root minimum and complementary components</text><path d="M 310 459 L 150 543 M 310 459 L 470 543" stroke="#2563eb" stroke-width="2.5"/><rect x="232" y="439" width="156" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="310" y="469" font-size="22" fill="#2563eb" text-anchor="middle">root R = {1}</text><rect x="72" y="528" width="156" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="392" y="528" width="156" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="558" font-size="22" fill="#2563eb" text-anchor="middle">child {0}</text><text x="470" y="558" font-size="22" fill="#2563eb" text-anchor="middle">child {2}</text><text x="310" y="616" font-size="21" fill="#172554" text-anchor="middle">The two child events are independent.</text><text x="310" y="650" font-size="14" fill="#172554" text-anchor="middle">Source, comparison and target factors retain their original types.</text><rect x="18" y="686" width="584" height="312" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="727" font-size="19" fill="#2563eb" text-anchor="middle">Three independent events: the full order hexagon</text><polygon points="180,853 245,918 375,918 440,853 375,788 245,788" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="150" y="859" font-size="18" fill="#2563eb" text-anchor="middle">123</text><text x="245" y="942" font-size="18" fill="#2563eb" text-anchor="middle">132</text><text x="375" y="942" font-size="18" fill="#2563eb" text-anchor="middle">312</text><text x="470" y="859" font-size="18" fill="#2563eb" text-anchor="middle">321</text><text x="375" y="774" font-size="18" fill="#2563eb" text-anchor="middle">231</text><text x="245" y="774" font-size="18" fill="#2563eb" text-anchor="middle">213</text><text x="310" y="846" font-size="19" fill="#15803d" text-anchor="middle">K₁₂₃ = (0,0,</text><text x="310" y="879" font-size="21" fill="#15803d" text-anchor="middle">R₁ ⋆ R₂ ⋆ R₃)</text><text x="310" y="978" font-size="20" fill="#172554" text-anchor="middle">row degree −2;       third-slot degree −3</text><text x="310" y="1030" font-size="17" fill="#172554" text-anchor="middle">The signed boundary retains all six edge comparisons.</text><text x="310" y="1067" font-size="15" fill="#172554" text-anchor="middle">Only auxiliary schedules are contracted; original bars remain.</text><text x="310" y="1105" font-size="14" fill="#172554" text-anchor="middle">Canonical face factors and whole interleaving comparisons: §76.</text></g></svg>