<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The stabilizer character decides boundary support</text>
<text x="310" y="84" font-size="18" text-anchor="middle">Actual defect ηₓ; conductor cᵢ,ₓ; χ=Σᵢ Res_y(ωᵢ nᵢ)</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="19" text-anchor="middle">Relevant: cᵢ,ₓ−〈αᵢ,ηₓ〉≥0 for every i,x.</text>
<text x="310" y="198" font-size="17" text-anchor="middle">Then χ vanishes on the entire stabilizer O_D.</text>
<text x="310" y="237" font-size="18" text-anchor="middle">Perverse fibre restrictions are sums of Ψ_D.</text>
<text x="310" y="276" font-size="16" text-anchor="middle">Their multiplicities still require the Hecke argument.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="20" text-anchor="middle">A failed inequality gives a pole of ω′ᵢ.</text>
<text x="310" y="443" font-size="20" text-anchor="middle">Interpolation gives G_a ⊂ O_D with χ(t)=t.</text>
<text x="310" y="482" font-size="17" text-anchor="middle">Nontrivial Artin–Schreier monodromy forces zero.</text>
<text x="310" y="521" font-size="17" text-anchor="middle">Both ordinary and exceptional restrictions vanish.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="16" text-anchor="middle">SL₂: L=O(−r); ω has zero divisor of degree 2r−2.</text>
<text x="310" y="688" font-size="24" text-anchor="middle">Relevant defects: 0≤mₓ≤⌊cₓ/2⌋.</text>
<text x="310" y="727" font-size="23" text-anchor="middle">r=2, double zero: D=0 or D=x.</text>
<text x="310" y="766" font-size="22" text-anchor="middle">r=2, two simple zeros: only D=0.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="17" text-anchor="middle">Zero conductor: every nonzero defect is irrelevant.</text>
<text x="310" y="933" font-size="18" text-anchor="middle">Boundary i*Rj_*Ψ=0; localization identifies</text>
<text x="310" y="972" font-size="29" text-anchor="middle">j_!Ψ ≅ j_!*Ψ ≅ Rj_*Ψ.</text>
<text x="310" y="1011" font-size="16" text-anchor="middle">Strict relevant-fibre bounds alone do not give this.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorems O.4.1.1–O.5.1.1, O.7.1.1–O.8.1.1; Exercise O.9.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Geometric support tests retain the full underlying moduli functor.</text>
</svg>