<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Saturation records every simple coroot</text>
<text x="310" y="84" font-size="19" text-anchor="middle">A geometric smooth curve; full central maps retained</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="20" text-anchor="middle">Generic fundamental lines give a point of G/N.</text>
<text x="310" y="198" font-size="20" text-anchor="middle">Its flag extends uniquely in the projective G/B.</text>
<text x="310" y="237" font-size="24" text-anchor="middle">At x: κ_λ=a_λv_λ; v_λ primitive.</text>
<text x="310" y="276" font-size="21" text-anchor="middle">a_(λ+μ)=a_λa_μ; central a_c are units.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="27" text-anchor="middle">mᵢ,x=ord_x(a_ωᵢ)≥0</text>
<text x="310" y="443" font-size="22" text-anchor="middle">λ=Σnᵢωᵢ+c ⇒ ord_x(a_λ)=Σnᵢmᵢ,x</text>
<text x="310" y="482" font-size="26" text-anchor="middle">D=Σ_x Σᵢ mᵢ,x αᵢ∨[x]</text>
<text x="310" y="521" font-size="18" text-anchor="middle">L_λ ↦ L_λ(〈λ,D〉); central lines unchanged.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="18" text-anchor="middle">Divide by t^(Σnᵢmᵢ,x) in the new source frame.</text>
<text x="310" y="688" font-size="22" text-anchor="middle">Every residual coefficient is a unit.</text>
<text x="310" y="727" font-size="20" text-anchor="middle">The resulting maps are actual subbundle maps.</text>
<text x="310" y="766" font-size="20" text-anchor="middle">Zero residual orders determine D uniquely.</text>
<rect x="28" y="855" width="564" height="208" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="884" font-size="21" text-anchor="middle">Rank-two fixed-flag example on P¹:</text>
<path d="M 70 935 H 550" stroke="#475569" stroke-width="3"/>
<circle cx="190" cy="935" r="7" fill="#d97706"/>
<text x="190" y="921" font-size="20" text-anchor="middle">−1</text>
<text x="190" y="972" font-size="19" text-anchor="middle">(m₁,m₂)=(2,1)</text>
<circle cx="430" cy="935" r="7" fill="#d97706"/>
<text x="430" y="921" font-size="20" text-anchor="middle">1</text>
<text x="430" y="972" font-size="19" text-anchor="middle">(m₁,m₂)=(0,3)</text>
<text x="310" y="1005" font-size="24" text-anchor="middle">D=(2α₁∨+α₂∨)[−1]+3α₂∨[1]</text>
<text x="310" y="1040" font-size="18" text-anchor="middle">Orders of λ: 2n₁+n₂ at −1; 3n₂ at 1.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorem J.5.1.1; geometric-point saturation.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Relative nilpotent defect strata need a separate construction.</text>
</svg>