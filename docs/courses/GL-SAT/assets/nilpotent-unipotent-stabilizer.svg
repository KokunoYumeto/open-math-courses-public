<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The atlas retains a nilpotent stabilizer</text>
<text x="310" y="84" font-size="18" text-anchor="middle">GL₃; full T line degrees (−2,0,0); roots (−2,0,−2)</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="23" text-anchor="middle">Entire quotient: [A²_{a,b}/G_{a,c}].</text>
<text x="310" y="198" font-size="26" text-anchor="middle">c:(a,b) ↦ (a,b−ac).</text>
<text x="310" y="237" font-size="23" text-anchor="middle">Transition: x=a/t; y=0; z=b/t.</text>
<text x="310" y="276" font-size="22" text-anchor="middle">Actual stabilizer: Spec A[c]/(ac).</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="21" text-anchor="middle">a invertible ⇒ c=0: trivial stabilizer.</text>
<text x="310" y="443" font-size="22" text-anchor="middle">a=0 ⇒ every c: additive stabilizer.</text>
<text x="310" y="482" font-size="22" text-anchor="middle">Both are exact scheme equations.</text>
<text x="310" y="521" font-size="21" text-anchor="middle">The action on A² is not globally free.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="26" text-anchor="middle">A=k[ε]/ε²; take a=ε.</text>
<text x="310" y="688" font-size="26" text-anchor="middle">Stabilizer = Spec A[c]/(εc).</text>
<text x="310" y="727" font-size="19" text-anchor="middle">It is not flat over the parameter ring A.</text>
<text x="310" y="766" font-size="18" text-anchor="middle">The ε·c equation remains in characteristic two.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="22" text-anchor="middle">Level 1: M₁=A⁴; H₁=N has dim 3.</text>
<text x="310" y="933" font-size="22" text-anchor="middle">Level 2: M₂=A⁷; H₂ has dim 6.</text>
<text x="310" y="972" font-size="25" text-anchor="middle">Both give stack dimension 1.</text>
<text x="310" y="1011" font-size="18" text-anchor="middle">Smooth frame atlases preserve every arrow.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Theorem L.2.1.1; Exercise L.5.2.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">The quotient records entire stabilizer schemes, including nilpotents.</text>
</svg>