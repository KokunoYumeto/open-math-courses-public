<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem49; Exercise49", "graded_composition": "(C,E,K)(A,B,R)=(CA,EB,KB+(-1)^s CR)", "cube_differential": "de=1-0; tensor differential with one degree-1 shift per e", "square_correction": "K12=-R1 tensor R2; delta K12=R12-R21", "evaluation_sign": "K12(z1 tensor z2)=-(-1)^|z1| R1(z1) tensor R2(z2)", "model_square": "K12(y tensor y)=-(f+z) tensor (f+z)", "model_six_parameter_top_core": "8 z tensor z tensor z"}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">Whole prisms compose; product squares have a face</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">Every displayed R has degree −1; K has degree −2.</text><rect x="18" y="106" width="584" height="214" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="23" fill="#172554" text-anchor="middle">A whole comparison is (A, B, R)</text><text x="310" y="194" font-size="27" fill="#2563eb" text-anchor="middle">δR = AΣ − Σ′B</text><text x="310" y="240" font-size="23" fill="#15803d" text-anchor="middle">R_gf = A_g R_f + R_g B_f</text><text x="310" y="283" font-size="16" fill="#172554" text-anchor="middle">Graded matrices retain every parameter component.</text><rect x="18" y="342" width="584" height="403" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="380" font-size="20" fill="#172554" text-anchor="middle">Two telescoped paths bound a specified square</text><text x="145" y="423" font-size="23" fill="#172554" text-anchor="middle">u₁ ⊗ u₂</text><text x="475" y="423" font-size="23" fill="#172554" text-anchor="middle">v₁ ⊗ u₂</text><text x="145" y="650" font-size="23" fill="#172554" text-anchor="middle">u₁ ⊗ v₂</text><text x="475" y="650" font-size="23" fill="#172554" text-anchor="middle">v₁ ⊗ v₂</text><path d="M430,443 L190,443" stroke="#2563eb" stroke-width="3"/><polygon points="190,443 200,437 200,449" fill="#2563eb"/><path d="M475,598 L475,457" stroke="#2563eb" stroke-width="3"/><polygon points="475,457 469,467 481,467" fill="#2563eb"/><path d="M430,618 L190,618" stroke="#15803d" stroke-width="3"/><polygon points="190,618 200,612 200,624" fill="#15803d"/><path d="M145,598 L145,457" stroke="#15803d" stroke-width="3"/><polygon points="145,457 139,467 151,467" fill="#15803d"/><text x="310" y="479" font-size="20" fill="#2563eb" text-anchor="middle">R₁ ⊗ u₂</text><text x="79" y="537" font-size="17" fill="#15803d" text-anchor="middle">u₁ ⊗ R₂</text><text x="540" y="537" font-size="17" fill="#2563eb" text-anchor="middle">v₁ ⊗ R₂</text><text x="310" y="531" font-size="23" fill="#b91c1c" text-anchor="middle">K = −R₁ ⊗ R₂</text><text x="310" y="574" font-size="22" fill="#b91c1c" text-anchor="middle">δK = R₁₂ − R₂₁</text><text x="310" y="607" font-size="20" fill="#15803d" text-anchor="middle">R₁ ⊗ v₂</text><text x="310" y="697" font-size="21" fill="#172554" text-anchor="middle">u_i = A_iΣ_i;   v_i = Σ_i′B_i</text><text x="310" y="727" font-size="16" fill="#172554" text-anchor="middle">Tensor evaluation includes the full input degrees.</text><rect x="18" y="768" width="584" height="241" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="809" font-size="21" fill="#172554" text-anchor="middle">Nonzero faces in the exact graded model</text><text x="310" y="854" font-size="22" fill="#172554" text-anchor="middle">K(y ⊗ y) = −(f + z) ⊗ (f + z)</text><text x="310" y="897" font-size="20" fill="#b91c1c" text-anchor="middle">Its boundary has four nonzero terms.</text><text x="310" y="940" font-size="23" fill="#2563eb" text-anchor="middle">Three-factor top core:   8z ⊗ z ⊗ z</text><text x="310" y="982" font-size="16" fill="#172554" text-anchor="middle">It consumes two original parameter marks per factor.</text><text x="310" y="1044" font-size="12" fill="#172554" text-anchor="middle">Graded cone matrices and all product-cube faces: Theorem 49.</text><text x="310" y="1075" font-size="12" fill="#172554" text-anchor="middle">Whole-section signs and normalization: Theorems 43, 48.</text><text x="310" y="1106" font-size="12" fill="#172554" text-anchor="middle">Four-term square boundary and six-parameter cube core: Exercise 49.</text></g></svg>