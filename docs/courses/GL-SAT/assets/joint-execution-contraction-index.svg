<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Execute and contract in one directed native index</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">C.47.1: retain the selected edge set and the executed ideal</text><rect x="25" y="104" width="570" height="304" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="22" fill="#172554" text-anchor="middle">(t,J) → (t/K,J′) requires πK(J) ⊆ J′</text><text x="310" y="199" font-size="20" fill="#172554" text-anchor="middle">I = πK⁻¹(J′);   execute J ⊆ I, then contract K.</text><text x="310" y="251" font-size="25" fill="#172554" text-anchor="middle">h(t,J) = 2(L−V) + |J| ≤ 2L−1</text><text x="310" y="301" font-size="18" fill="#172554" text-anchor="middle">Nonidentity: Δh = k + (k−kex) + (|I|−|J|) &gt; 0</text><text x="310" y="348" font-size="17" fill="#172554" text-anchor="middle">Sharp L=3 unit chain: h = 0 → 1 → 2 → 3 → 4 → 5</text><text x="310" y="391" font-size="18" fill="#172554" text-anchor="middle">Its frontier arity is 0 → 1 → 1 → 1 → 1 → 1.</text><rect x="25" y="442" width="570" height="324" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="485" font-size="17" fill="#172554" text-anchor="middle">C.47.2: the selected edge forces the actual target state</text><text x="310" y="536" font-size="18" fill="#172554" text-anchor="middle">μ(uℓ,uᵣ), only uℓ executed: h=1, arbitrary factor X</text><path d="M270,562 L180,606 M189.04373589991994,594.8999621184206 L180,606 L194.31425748397928,605.680574449451" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M350,562 L440,606 M425.6857425160207,605.680574449451 L440,606 L430.95626410008003,594.8999621184206" fill="none" stroke="#2563eb" stroke-width="3"/><text x="150" y="636" font-size="18" fill="#172554" text-anchor="middle">Contract left edge</text><text x="465" y="636" font-size="18" fill="#172554" text-anchor="middle">Contract right edge</text><text x="150" y="678" font-size="16" fill="#172554" text-anchor="middle">Both vertices executed</text><text x="465" y="678" font-size="16" fill="#172554" text-anchor="middle">Only bottom executed</text><text x="150" y="717" font-size="20" fill="#172554" text-anchor="middle">h′=4;   F₂(X,IC₀)</text><text x="465" y="717" font-size="20" fill="#172554" text-anchor="middle">h′=3;   Id(X)</text><text x="310" y="754" font-size="17" fill="#172554" text-anchor="middle">Same quotient shape; distinct arrows, states and functors.</text><rect x="25" y="805" width="570" height="220" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="847" font-size="19" fill="#172554" text-anchor="middle">C.47.3: graft only on the compatible ideal domain</text><text x="310" y="893" font-size="17" fill="#172554" text-anchor="middle">An executed outer vertex requires all inner descendants.</text><text x="310" y="936" font-size="20" fill="#172554" text-anchor="middle">h(graft) = Σ hᵢ;   original edges and seams remain.</text><text x="310" y="979" font-size="17" fill="#172554" text-anchor="middle">Empty outer states give the exact external product sector.</text><text x="310" y="1016" font-size="16" fill="#172554" text-anchor="middle">Zero-input blocks retain the actual IC₀ mapping complexes.</text><text x="310" y="1070" font-size="15" fill="#172554" text-anchor="middle">Exercises C.47.4.1–2 prove the displayed sharp/unit cases.</text><text x="310" y="1104" font-size="16" fill="#172554" text-anchor="middle">All comparisons use the native tensor, proper and unit maps.</text></g></svg>