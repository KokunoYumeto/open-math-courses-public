<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">Polynomial slice → full generator maps</text><text x="310" y="77" font-size="19" fill="#172554" text-anchor="middle">Full split reductive R over E, char(E)=0</text><rect x="25" y="105" width="570" height="233" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="144" font-size="25" fill="#172554" text-anchor="middle">Σ=e+𝔯ᶠ   →   𝔯//R ≅ 𝔱/W</text><text x="310" y="188" font-size="21" fill="#172554" text-anchor="middle">χ|Σ: actual polynomial isomorphism</text><text x="310" y="230" font-size="19" fill="#172554" text-anchor="middle">slice weights 2(mᵢ+1); invariant weights 2dᵢ</text><text x="310" y="271" font-size="18" fill="#172554" text-anchor="middle">Σmᵢ = Σ(dᵢ−1) = number of positive roots</text><text x="310" y="312" font-size="18" fill="#172554" text-anchor="middle">Jacobian: nonzero weight 0; positive blocks invert.</text><path d="M310,350 L310,391" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="406" width="570" height="257" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="445" font-size="22" fill="#172554" text-anchor="middle">p: R×Σ → 𝔯reg,  (g,σ) ↦ Adg σ</text><text x="310" y="488" font-size="18" fill="#172554" text-anchor="middle">Smooth surjection; every regular fibre: one orbit</text><text x="310" y="531" font-size="23" fill="#172554" text-anchor="middle">(R×Σ) ×𝔯reg (R×Σ) ≅ R×J</text><text x="310" y="575" font-size="19" fill="#172554" text-anchor="middle">J = full centralizer, smooth, flat, commutative</text><text x="310" y="618" font-size="17" fill="#172554" text-anchor="middle">Generic torus Lie commutation → full J commutation</text><text x="310" y="645" font-size="16" fill="#172554" text-anchor="middle">Flat equations preserve all finite centres and nilpotents.</text><path d="M310,679 L310,719" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="734" width="570" height="243" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="775" font-size="19" fill="#172554" text-anchor="middle">HomA,R(A⊗V,A⊗W) ≅ Homℬ(M(V),M(W))</text><text x="310" y="821" font-size="21" fill="#172554" text-anchor="middle">M(V)=E[Σ]⊗V;  zᵢ acts by ρV(∇pᵢ)</text><text x="310" y="865" font-size="18" fill="#172554" text-anchor="middle">|pᵢ|=2dᵢ; |zᵢ|=2dᵢ−2; vector degree = h-weight</text><text x="310" y="910" font-size="17" fill="#172554" text-anchor="middle">Descent gives a map on 𝔯reg; codim(𝔯∖𝔯reg)≥2.</text><text x="310" y="953" font-size="17" fill="#172554" text-anchor="middle">Polynomial extension is unique and preserves composition.</text><text x="310" y="1020" font-size="17" fill="#172554" text-anchor="middle">Proofs B.1.1.1–B.5.1.1: all displayed arrows and bounds.</text><text x="310" y="1058" font-size="15" fill="#172554" text-anchor="middle">Free reading: Bezrukavnikov–Finkelberg, arXiv:0707.3799.</text><text x="310" y="1094" font-size="16" fill="#172554" text-anchor="middle">The geometric cohomology/Ext identification still requires proof.</text></g></svg>