<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="24" text-anchor="middle">The exceptional curve fixes the Weil splitting</text>
<rect x="28" y="82" width="564" height="191" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="125" font-size="26" text-anchor="middle">D = P¹;  L = O_D(−2);  T = V(L)</text>
<text x="310" y="168" font-size="28" text-anchor="middle">D ─s→ T ─q→ D;  qs = 1</text>
<text x="310" y="211" font-size="29" text-anchor="middle">s! E_T = E_D(−1)[−2]</text>
<text x="310" y="250" font-size="18" text-anchor="middle">Forget support, then restrict: cup product by c₁(L).</text>
<path d="M310,288 L310,320" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="336" width="564" height="160" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="380" font-size="30" text-anchor="middle">c₁(L) = −2 c₁(O_D(1))</text>
<text x="310" y="424" font-size="27" text-anchor="middle">Tr_D c₁(O_D(1)) = +1</text>
<text x="310" y="470" font-size="29" text-anchor="middle">Tr_D c₁(L) = −2</text>
<path d="M310,512 L310,544" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="560" width="564" height="192" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="603" font-size="26" text-anchor="middle">P = E_(1,1)(−1);  A = Rm_* E[2]</text>
<text x="310" y="647" font-size="29" text-anchor="middle">P ─v→ A ─u→ P;  u v = −2</text>
<text x="310" y="691" font-size="30" text-anchor="middle">r = −u/2;  r v = 1</text>
<text x="310" y="731" font-size="17" text-anchor="middle">The actual adjunction maps are Frobenius compatible.</text>
<path d="M310,768 L310,800" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="816" width="564" height="268" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="860" font-size="26" text-anchor="middle">A = IC_raw(2,0) ⊕ E_(1,1)(−1)</text>
<text x="310" y="906" font-size="22" text-anchor="middle">Raw central summand: geometric Frobenius q.</text>
<text x="310" y="952" font-size="25" text-anchor="middle">Twist the whole splitting by (1).</text>
<text x="310" y="998" font-size="24" text-anchor="middle">I_(1,0) * I_(1,0) = I_(2,0) ⊕ I_(1,1)</text>
<text x="310" y="1044" font-size="19" text-anchor="middle">Normalized central summand: geometric Frobenius 1.</text>
<text x="310" y="1068" font-size="18" text-anchor="middle">The two half twists together give (1).</text>
<text x="310" y="1124" font-size="19" text-anchor="middle">Theorem 2.0 and §4, equations (4.5)–(4.8).</text>
<text x="310" y="1166" font-size="18" text-anchor="middle">Rational coefficients; division by 2 is allowed even if ℓ=2.</text>
</svg>