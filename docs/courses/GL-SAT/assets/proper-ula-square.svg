<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1100" viewBox="0 0 620 1100" role="img" aria-labelledby="title desc">
<title id="title">The canonical square preserving ULA under proper image</title>
<desc id="desc">For a proper map m from Y to Z over S, proper base change identifies the target specialization with the proper image of the source specialization. The source unit and both vertical comparisons are isomorphisms, so the target unit is an isomorphism, after every parameter base change.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#215b74"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#183a4b;font-size:18px}.title{font-size:25px;font-weight:700}.head{font-size:21px;font-weight:700}.math{font-family:"Cambria Math","Segoe UI",serif;font-size:22px}.small{font-size:17px}.label{font-size:18px;font-weight:600}.box{fill:#f1f7fa;stroke:#95b8c8;stroke-width:1.5;rx:12}.panel{fill:white;stroke:#c9dbe4;stroke-width:1.5;rx:14}.arrow{fill:none;stroke:#215b74;stroke-width:2;marker-end:url(#arrow)}.iso{fill:#0e705b;font-weight:700}</style>
<rect width="620" height="1100" fill="#f7fafc"/>
<text x="28" y="40" class="title">Proper images preserve the actual ULA unit</text>
<text x="28" y="74">L bounded below with torsion cohomology; M = Rm*L.</text>
<rect x="22" y="98" width="576" height="210" class="panel"/>
<text x="40" y="134" class="head">1. The family and its selected fibres</text>
<text x="88" y="185" class="math">Y</text>
<path d="M116 178H254" class="arrow"/>
<text x="184" y="163" text-anchor="middle" class="label">m proper</text>
<text x="278" y="185" class="math">Z</text>
<path d="M306 178H455" class="arrow"/>
<text x="380" y="164" text-anchor="middle" class="label">q</text>
<text x="478" y="185" class="math">S</text>
<text x="44" y="224">Pass to S₀ = S₍s̄₎. Take the closed fibre s̄</text>
<text x="44" y="253">and any geometric point t̄ → S₀.</text>
<text x="44" y="283">i denotes the s̄-fibre map; j denotes the t̄-fibre map.</text>
<rect x="22" y="326" width="576" height="358" class="panel"/>
<text x="40" y="363" class="head">2. The square of specialization maps</text>
<rect x="43" y="400" width="218" height="80" class="box"/>
<text x="152" y="447" text-anchor="middle" class="math">iZ⁻¹ M₀</text>
<rect x="358" y="400" width="218" height="80" class="box"/>
<text x="467" y="432" text-anchor="middle" class="math">iZ⁻¹ RjZ*</text>
<text x="467" y="461" text-anchor="middle" class="math">jZ⁻¹ M₀</text>
<path d="M270 440H348" class="arrow"/>
<text x="309" y="420" text-anchor="middle" class="label">αZ</text>
<path d="M152 490V564" class="arrow"/>
<path d="M467 490V564" class="arrow"/>
<text x="67" y="530" class="math iso">≅</text>
<text x="521" y="530" class="math iso">≅</text>
<text x="309" y="521" text-anchor="middle" class="small">proper base change</text>
<text x="309" y="546" text-anchor="middle" class="small">and composition</text>
<rect x="43" y="576" width="218" height="62" class="box"/>
<text x="152" y="616" text-anchor="middle" class="math">Rmₛ* A</text>
<rect x="358" y="576" width="218" height="62" class="box"/>
<text x="467" y="616" text-anchor="middle" class="math">Rmₛ* C</text>
<path d="M270 607H348" class="arrow"/>
<text x="309" y="655" text-anchor="middle" class="label">Rmₛ* αY   ≅</text>
<rect x="22" y="702" width="576" height="174" class="panel"/>
<text x="40" y="739" class="head">3. What the lower objects mean</text>
<text x="44" y="776" class="math">A = iY⁻¹ L₀</text>
<text x="44" y="811" class="math">C = iY⁻¹ RjY* jY⁻¹ L₀</text>
<text x="44" y="846">αY : A → C is the source adjunction unit; source ULA</text>
<text x="44" y="868">makes it an isomorphism on every geometric stalk.</text>
<rect x="22" y="894" width="576" height="148" class="panel"/>
<text x="40" y="930" class="head">4. The map, and universality</text>
<text x="44" y="965">Adjunction sends both routes to the same counit.</text>
<text x="44" y="994">Thus the top map is the actual target restriction αZ.</text>
<text x="44" y="1023">Properness and the square persist after every S′ → S.</text>
<text x="28" y="1076" class="small">Proof: L.6.3.1, square (L.6.3.4). The j maps need not be open.</text>
</svg>
