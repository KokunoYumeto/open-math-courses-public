<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The finite Hecke chart retains the character</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="28" text-anchor="middle">μ,η dominant; ν=η−μ</text>
<text x="310" y="198" font-size="29" text-anchor="middle">Z=B_μ×(Z_λ∩S_ν)</text>
<text x="310" y="237" font-size="27" text-anchor="middle">l:Z→B_μ; r:Z→B_η</text>
<text x="310" y="276" font-size="20" text-anchor="middle">The bounded modification uses left-frame IC_λ.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="28" text-anchor="middle">m t^μ n t^ν = p t^η</text>
<text x="310" y="443" font-size="25" text-anchor="middle">p=m Ad(t^μ)n = h_− m′ h_+,η</text>
<text x="310" y="482" font-size="19" text-anchor="middle">r is the actual middle-coordinate morphism m′.</text>
<text x="310" y="521" font-size="28" text-anchor="middle">e_η∘r=e_μ∘l+χ_μ^ν</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="22" text-anchor="middle">C=RΓ_c(Z_λ∩S_ν,IC_λ⊗AS(χ_μ))</text>
<text x="310" y="688" font-size="25" text-anchor="middle">Raw compact image: Ψ_μ⊗C[h_ν]</text>
<text x="310" y="727" font-size="25" text-anchor="middle">Normalized: Ψ_μ^n⊗C(D)[h_ν]</text>
<text x="310" y="766" font-size="21" text-anchor="middle">D=(d_λ+h_ν)/2; top Frobenius becomes 1.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="22" text-anchor="middle">For η=0: perverse degrees ≤0 on B_μ.</text>
<text x="310" y="933" font-size="23" text-anchor="middle">The bound is strict unless μ=−w₀λ.</text>
<text x="310" y="972" font-size="23" text-anchor="middle">At μ=−w₀λ the entire coefficient is E.</text>
<text x="310" y="1011" font-size="19" text-anchor="middle">Compactified boundary and cleanness need proofs.</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Theorems G.4.1.1–G.6.1.1; Exercise G.7.1.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">These are actual finite charts and relevant-stratum bounds.</text>
</svg>