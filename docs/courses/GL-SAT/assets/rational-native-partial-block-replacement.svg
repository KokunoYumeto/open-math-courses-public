<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem53; Exercise53", "actual_factorization": "A_e=V_alpha Q_e; all other edge bars remain", "literal_common_section": "Q_e I_T=I_L", "original_native_section": "delta R_alpha=V_alpha I_L-I_L_prime B_alpha", "closed_triple": "delta R_alpha=A_e I_T-I_L_prime B_alpha", "projection_comparison": "J=(Q_L_prime A_e-B_alpha Q_T)H_T+Q_L_prime R_alpha Q_T", "object_model": "A(y)=y+g; R(y)=f+z; J(y)=z", "essential_parameter_core": "R_2(sa|sb;y)=2z; deleting it gives +2z on sc|sb;y"}</metadata><text x="310" y="40" font-size="22" fill="#172554" text-anchor="middle">A native replacement keeps the other edge bars</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">Literal edge contraction, then the original vertex comparison</text><rect x="18" y="106" width="584" height="258" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="88" y="158" font-size="25" fill="#172554" text-anchor="middle">Z_T</text><text x="310" y="158" font-size="25" fill="#172554" text-anchor="middle">Z_L</text><text x="533" y="158" font-size="25" fill="#172554" text-anchor="middle">Z_L′</text><path d="M135,153 L265,153" stroke="#2563eb" stroke-width="3"/><polygon points="265,153 255,147 255,159" fill="#2563eb"/><path d="M358,153 L488,153" stroke="#15803d" stroke-width="3"/><polygon points="488,153 478,147 478,159" fill="#15803d"/><text x="200" y="193" font-size="21" fill="#2563eb" text-anchor="middle">Q_e</text><text x="422" y="193" font-size="21" fill="#15803d" text-anchor="middle">V_α</text><text x="310" y="239" font-size="26" fill="#2563eb" text-anchor="middle">Q_e I_T = I_L</text><text x="310" y="284" font-size="27" fill="#15803d" text-anchor="middle">A_e = V_α Q_e</text><text x="310" y="333" font-size="16" fill="#172554" text-anchor="middle">L has the literal composite; L′ has the native block.</text><rect x="18" y="386" width="584" height="285" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="430" font-size="21" fill="#172554" text-anchor="middle">The original full marked section fixes R_α</text><text x="310" y="478" font-size="23" fill="#172554" text-anchor="middle">δR_α = V_α I_L − I_L′ B_α</text><text x="310" y="525" font-size="25" fill="#15803d" text-anchor="middle">= A_e I_T − I_L′ B_α</text><text x="310" y="575" font-size="16" fill="#172554" text-anchor="middle">Every original source and parameter component remains.</text><text x="310" y="619" font-size="20" fill="#2563eb" text-anchor="middle">Its projection homotopy keeps Q_L′ R_α Q_T.</text><text x="310" y="650" font-size="16" fill="#172554" text-anchor="middle">No naturality of independently chosen H is needed.</text><rect x="18" y="693" width="584" height="316" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="737" font-size="23" fill="#172554" text-anchor="middle">Exact partial-collapse model</text><text x="310" y="784" font-size="26" fill="#172554" text-anchor="middle">A(y) = y + g</text><text x="310" y="828" font-size="26" fill="#15803d" text-anchor="middle">R(y) = f + z</text><text x="310" y="872" font-size="26" fill="#2563eb" text-anchor="middle">J(y) = z</text><text x="310" y="916" font-size="21" fill="#172554" text-anchor="middle">Original two-parameter R core: 2z</text><text x="310" y="965" font-size="19" fill="#b91c1c" text-anchor="middle">Delete it: the unchanged triple has defect +2z.</text><text x="310" y="992" font-size="16" fill="#172554" text-anchor="middle">The partial graph and its object values stay fixed.</text><text x="310" y="1044" font-size="11" fill="#172554" text-anchor="middle">Whole literal section, native triple and projection square: Theorem 53.</text><text x="310" y="1075" font-size="12" fill="#172554" text-anchor="middle">Nonzero section value and higher-core defect: Exercise 53.</text><text x="310" y="1106" font-size="11" fill="#172554" text-anchor="middle">Full graph and marked multicut constructions: Theorems 25–27, 33, 43–44.</text></g></svg>