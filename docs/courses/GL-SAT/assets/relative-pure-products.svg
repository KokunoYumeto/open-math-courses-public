<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="22" fill="#172554" text-anchor="middle">Fix the pure actions throughout whole recovery</text><text x="310" y="77" font-size="17" fill="#172554" text-anchor="middle">C.54: full pure bimodules and actual mixed-action components</text><rect x="25" y="105" width="570" height="250" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="148" font-size="20" fill="#172554" text-anchor="middle">C.54.1–2: keep the represented pure module</text><text x="310" y="196" font-size="29" fill="#172554" text-anchor="middle">Rᵢ(y,x) = B(qᵢx,y)</text><text x="310" y="240" font-size="19" fill="#172554" text-anchor="middle">The retract maps retain both full pure actions.</text><text x="310" y="285" font-size="18" fill="#172554" text-anchor="middle">Transfer only mixed words,including every transition.</text><text x="310" y="330" font-size="21" fill="#172554" text-anchor="middle">The resulting pure functor is exactly qᵢ.</text><rect x="25" y="395" width="570" height="315" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="437" font-size="18" fill="#172554" text-anchor="middle">C.54.3: whole restriction T → product lift i′uφ</text><text x="310" y="484" font-size="25" fill="#172554" text-anchor="middle">τ = φ′Ti;     ∂R₀ = τ − u</text><text x="310" y="535" font-size="28" fill="#172554" text-anchor="middle">K = −h′T</text><text x="310" y="575" font-size="28" fill="#172554" text-anchor="middle">− i′φ′Th</text><text x="310" y="615" font-size="28" fill="#172554" text-anchor="middle">− i′R₀φ</text><text x="310" y="663" font-size="28" fill="#172554" text-anchor="middle">∂K = i′uφ − T</text><text x="310" y="697" font-size="15" fill="#172554" text-anchor="middle">Both kernel homotopies and the native coherence term are retained.</text><rect x="25" y="750" width="570" height="300" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="792" font-size="19" fill="#172554" text-anchor="middle">Exercise C.54.6.2: a nonzero mixed component</text><text x="310" y="838" font-size="23" fill="#172554" text-anchor="middle">R=k[t]/t², |t|=0;    dx=y</text><text x="310" y="878" font-size="22" fill="#172554" text-anchor="middle">|e|=|y|=0;    |f|=|x|=−1</text><text x="310" y="921" font-size="21" fill="#172554" text-anchor="middle">I₀(e)=e+ty,   h₁(y)=x,   P₂(x)=−f</text><text x="310" y="966" font-size="24" fill="#172554" text-anchor="middle">H′(e)=−P₂h₁I₀(e)=tf ≠ 0</text><text x="310" y="1010" font-size="23" fill="#172554" text-anchor="middle">PᵢtʳIᵢ=tʳ;    hᵢtʳIᵢ=0</text><text x="310" y="1040" font-size="15" fill="#172554" text-anchor="middle">Algebraic module example;all maps retain the pure R-action.</text><text x="310" y="1097" font-size="15" fill="#172554" text-anchor="middle">C.54.4–5 retain all parameter cells when normalizing product edges.</text></g></svg>