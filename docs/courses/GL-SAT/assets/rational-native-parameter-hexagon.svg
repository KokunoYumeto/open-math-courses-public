xt x="169" y="205" font-size="17" fill="#15803d" text-anchor="middle">C₁₃₂ − C₁₂₃</text><text x="310" y="291" font-size="22" fill="#172554" text-anchor="middle">Ω = −Σ sign(π) T_π</text><text x="310" y="327" font-size="17" fill="#172554" text-anchor="middle">degree −2</text><text x="310" y="418" font-size="17" fill="#172554" text-anchor="middle">Six given S₃ values</text><text x="310" y="636" font-size="18" fill="#172554" text-anchor="middle">Six shortcut pairs cancel; twelve S₂ terms remain.</text><rect x="17" y="674" width="586" height="323" rx="15" fill="white" stroke="#b91c1c" stroke-width="2"/><text x="310" y="716" font-size="19" fill="#172554" text-anchor="middle">S₁(u) = 1 for every original positive arrow</text><text x="310" y="755" font-size="18" fill="#172554" text-anchor="middle">B = k ⊕ kε;  |ε| = −1,  d = 0,  ε² = 0</text><text x="310" y="795" font-size="18" fill="#172554" text-anchor="middle">ℓ(∅ → {1}) = 1;  all other ℓ = 0</text><text x="310" y="837" font-size="19" fill="#172554" text-anchor="middle">S₂(v,u) = [ℓ(vu) − ℓ(v) − ℓ(u)] ε</text><text x="310" y="882" font-size="20" fill="#b91c1c" text-anchor="middle">H₃₁₂,₁₃₂ = ε;  the other five sum to −ε</text><text x="310" y="927" font-size="17" fill="#b91c1c" text-anchor="middle">B⁻² = 0: those five prescribed cochains have no filler.</text><text x="310" y="973" font-size="17" fill="#172554" text-anchor="middle">The red edge retains the original pair {1,3}.</text><text x="310" y="1036" font-size="13" fill="#172554" text-anchor="middle">Theorems 20–21 and Exercise 21. Exact parameter boundary signs.</text><text x="310" y="1071" font-size="13" fill="#172554" text-anchor="middle">A tree-cell projection still requires the native external/graft comparison.</text><text x="310" y="1104" font-size="12" fill="#172554" text-anchor="middle">Free full-bar background: Keller, arXiv:math/9910179, §4.2.</text></g></svg>