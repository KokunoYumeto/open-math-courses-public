<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="465" viewBox="0 0 1160 465">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#25445a"/></marker></defs>
<rect width="1160" height="465" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#173647">
<text x="35" y="43" font-size="27" font-weight="bold">The same matrix kernel before and after formal restriction</text>
<text x="35" y="78" font-size="18">A has a regular pair; B = A[[x₁,…,x_d]], I = (x₁,…,x_d), V = p⁻¹U.</text>
<text x="35" y="107" font-size="18">Choose 0 → ℰ → O_Vʳ → O_Vˢ exact at its first two terms, using locally split maps.</text>
<rect x="45" y="144" width="300" height="80" rx="10" fill="#e9f2f1" stroke="#25445a"/>
<text x="195" y="177" text-anchor="middle" font-size="22">Γ(V, ℰ)</text>
<text x="195" y="205" text-anchor="middle" font-size="18">ker(T: Bʳ → Bˢ)</text>
<rect x="760" y="144" width="350" height="80" rx="10" fill="#e9f2f1" stroke="#25445a"/>
<text x="935" y="177" text-anchor="middle" font-size="22">limₙ Γ(Vₙ, ℰ|Vₙ)</text>
<text x="935" y="205" text-anchor="middle" font-size="18">limₙ ker(Tₙ: (B/Iⁿ)ʳ → (B/Iⁿ)ˢ)</text>
<path d="M365 174 L735 174" stroke="#25445a" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="550" y="158" text-anchor="middle" font-size="19">canonical restriction isomorphism</text>
<text x="550" y="205" text-anchor="middle" font-size="17">lim is left exact; limₙ B/Iⁿ = B</text>
<path d="M195 242 L195 294" stroke="#25445a" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="215" y="274" font-size="17">restrict</text>
<path d="M935 242 L935 294" stroke="#25445a" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="955" y="274" font-size="17">nth coordinate</text>
<rect x="45" y="310" width="1065" height="65" rx="10" fill="#fff0d8" stroke="#25445a"/>
<text x="577" y="348" text-anchor="middle" font-size="21">Γ(Vₙ, ℰ|Vₙ) = ker(Tₙ: (B/Iⁿ)ʳ → (B/Iⁿ)ˢ), with Tₙ = T mod Iⁿ</text>
<text x="35" y="414" font-size="20" font-weight="bold">Apply to Hom(ℰ, ℱ) = ℰ* ⊗ ℱ: every compatible formal map is one actual map.</text>
<text x="35" y="445" font-size="17">Proof §§A.5.3–A.5.4. Algebra units and multiplication are checked by faithfulness in §A.5.7.</text>
</g></svg>
