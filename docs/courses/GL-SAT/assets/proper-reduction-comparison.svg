<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="46" font-size="29" text-anchor="middle">The actual proper comparison</text>
<text x="310" y="84" font-size="22" text-anchor="middle">f : X → Y proper;   g : Y′ → Y arbitrary</text>
<text x="310" y="119" font-size="22" text-anchor="middle">X′ = X ×_Y Y′,   K ∈ C_O(X)</text>
<rect x="28" y="151" width="564" height="219" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="191" font-size="24" text-anchor="middle">Completed O modules</text>
<text x="149" y="255" font-size="22" text-anchor="middle">g_O^* Rf_* K</text>
<text x="464" y="255" font-size="22" text-anchor="middle">Rf′_* g′_O^* K</text>
<path d="M247,244 L356,244" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="300" y="228" font-size="25" text-anchor="middle">β</text>
<text x="310" y="300" font-size="20" text-anchor="middle">Both objects, and C = Cone(β), are complete.</text>
<text x="310" y="337" font-size="20" text-anchor="middle">β is the transpose of the image counit.</text>
<path d="M149,382 L149,427" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M464,382 L464,427" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310" y="411" font-size="21" text-anchor="middle">Derived reduction mod π</text>
<rect x="28" y="440" width="564" height="205" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="482" font-size="24" text-anchor="middle">Classical étale O₁ modules</text>
<text x="149" y="541" font-size="21" text-anchor="middle">g^* Rf_et,* K₁</text>
<text x="464" y="541" font-size="21" text-anchor="middle">Rf′_et,* g′^* K₁</text>
<path d="M247,530 L356,530" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="300" y="515" font-size="24" text-anchor="middle">β₁</text>
<text x="310" y="586" font-size="20" text-anchor="middle">β₁ is the canonical finite proper comparison.</text>
<text x="310" y="621" font-size="20" text-anchor="middle">Theorem K.4.4.1: β₁ is an isomorphism.</text>
<rect x="28" y="674" width="564" height="192" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="719" font-size="27" text-anchor="middle" style="fill:#15803d">C₁ = Cone(β₁) = 0</text>
<text x="310" y="765" font-size="20" text-anchor="middle">Completeness gives C = 0, so β is invertible.</text>
<text x="310" y="809" font-size="20" text-anchor="middle">Localize the actual square to obtain β_E.</text>
<text x="310" y="843" font-size="20" text-anchor="middle">Pullback and image keep their coefficient maps.</text>
<text x="310" y="917" font-size="23" text-anchor="middle">Y′ need not be Noetherian.</text>
<text x="310" y="963" font-size="22" text-anchor="middle">Reduction detects invertibility;</text>
<text x="310" y="995" font-size="21" text-anchor="middle">adjunction and pasting establish coherence.</text>
<text x="310" y="1026" font-size="19" text-anchor="middle">Theorem O.4.1.1 and Exercise O.5.4</text>
</svg>