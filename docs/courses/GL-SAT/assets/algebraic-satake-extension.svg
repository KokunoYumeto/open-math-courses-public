<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="23" text-anchor="middle">The full Satake group extends with its Hopf algebra</text>
<rect x="28" y="82" width="564" height="184" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="125" font-size="28" text-anchor="middle">P_F = ⊕_λ I_λ,F ⊗_F V_λ</text>
<text x="310" y="167" font-size="19" text-anchor="middle">A finite sum of the actual raw IC middle extensions.</text>
<text x="310" y="210" font-size="20" text-anchor="middle">End(I_λ,F)=F; Hom(I_λ,F,I_μ,F)=0 for λ≠μ.</text>
<text x="310" y="248" font-size="19" text-anchor="middle">Finite-E semisimplicity + actual scalar descent.</text>
<path d="M310,282 L310,314" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="329" width="564" height="195" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="371" font-size="24" text-anchor="middle">A_F = ⊕_λ H(I_λ,F)* ⊗_F H(I_λ,F)</text>
<text x="310" y="414" font-size="25" text-anchor="middle">A_F ≃ A_ℚℓ ⊗_ℚℓ F as Hopf algebras</text>
<text x="310" y="456" font-size="17" text-anchor="middle">Tensor coefficients give multiplication; duality gives antipode.</text>
<text x="310" y="498" font-size="21" text-anchor="middle">Evaluation retains comultiplication and counit.</text>
<path d="M310,539 L310,571" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="586" width="564" height="180" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="629" font-size="30" text-anchor="middle">Sat_G(F) ≃ Rep_F(G∨_F)</text>
<text x="310" y="671" font-size="23" text-anchor="middle">roots α_i∨; coroots α_i; lattice X_*(T)</text>
<text x="310" y="713" font-size="25" text-anchor="middle">full centre: D(X_*(T)/Q_G∨)</text>
<text x="310" y="749" font-size="18" text-anchor="middle">The entire coend extends, so no extra kernel appears.</text>
<path d="M310,781 L310,813" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="828" width="564" height="253" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="871" font-size="29" text-anchor="middle">I_λ,F = j_!* F[d_λ]</text>
<text x="310" y="913" font-size="29" text-anchor="middle">D I_λ,F = I_λ,F(d_λ)</text>
<text x="310" y="955" font-size="23" text-anchor="middle">stalk and costalk degrees ≡ d_λ (mod 2)</text>
<text x="310" y="997" font-size="24" text-anchor="middle">highest line F(−d_λ) in degree d_λ</text>
<text x="310" y="1041" font-size="24" text-anchor="middle">lowest line F in degree −d_λ</text>
<text x="310" y="1067" font-size="16" text-anchor="middle">Extension retains the Tate lines, integer degrees and schematic centre.</text>
<text x="310" y="1126" font-size="18" text-anchor="middle">Theorem D.4.2.1; Exercise D.5.4 checks PGL₂ and μ₂.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">k algebraically closed, ℓ invertible; F/ℚ_ℓ any algebraic extension.</text>
</svg>