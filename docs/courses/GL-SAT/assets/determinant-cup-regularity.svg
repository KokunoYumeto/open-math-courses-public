<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="26" fill="#172554" text-anchor="middle">The determinant cup operator</text><text x="310" y="76" font-size="18" fill="#172554" text-anchor="middle">Full lattices → actual fusion → regular Lie element</text><rect x="25" y="105" width="570" height="251" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="143" font-size="20" fill="#172554" text-anchor="middle">1. A common lower lattice U ⊂ L₀,L₁,L₂</text><text x="310" y="186" font-size="22" fill="#172554" text-anchor="middle">D(Lᵢ,Lⱼ) = det(Lᵢ/U)⁻¹ ⊗ det(Lⱼ/U)</text><text x="115" y="236" font-size="25" fill="#172554" text-anchor="middle">L₀</text><text x="310" y="236" font-size="25" fill="#172554" text-anchor="middle">L₁</text><text x="505" y="236" font-size="25" fill="#172554" text-anchor="middle">L₂</text><path d="M144,227 L277,227" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M341,227 L472,227" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="213" y="262" font-size="16" fill="#172554" text-anchor="middle">modification</text><text x="409" y="262" font-size="16" fill="#172554" text-anchor="middle">modification</text><text x="310" y="300" font-size="21" fill="#172554" text-anchor="middle">D(L₂,L₀) = D(L₁,L₀) ⊗ D(L₂,L₁)</text><text x="310" y="335" font-size="16" fill="#172554" text-anchor="middle">Finite projective quotients; graded determinant signs.</text><rect x="25" y="389" width="570" height="279" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="428" font-size="21" fill="#172554" text-anchor="middle">2. One moving line on the ordered chain</text><circle cx="228" cy="468" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="392" cy="468" r="17" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="228" y="475" font-size="18" fill="#172554" text-anchor="middle">a₁</text><text x="392" y="475" font-size="18" fill="#172554" text-anchor="middle">a₂</text><text x="310" y="518" font-size="21" fill="#172554" text-anchor="middle">distinct discs: D₁ ⊗ D₂ (input supports)</text><path d="M310,535 L310,569" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="310" y="595" font-size="20" fill="#172554" text-anchor="middle">collision: m^*D (endpoint pullback)</text><text x="310" y="632" font-size="23" fill="#172554" text-anchor="middle">d(P*Q) = d(P)⊗1 + 1⊗d(Q)</text><text x="310" y="655" font-size="16" fill="#172554" text-anchor="middle">Actual counit transport; degree 2; Tate line E(1).</text><rect x="25" y="702" width="570" height="293" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="742" font-size="21" fill="#172554" text-anchor="middle">3. Nonzero top cup → principal origin</text><text x="310" y="789" font-size="23" fill="#172554" text-anchor="middle">H⁻ᵈ(ICλ)  ── cρᵈ ──→  Hᵈ(ICλ)(d)</text><text x="310" y="829" font-size="21" fill="#172554" text-anchor="middle">Point trace = |Z′| ∈ ℤ₊; |Z′| ≠ 0 in E</text><text x="310" y="870" font-size="23" fill="#172554" text-anchor="middle">ξρ(0) = Σᵢ aᵢeᵢ; every aᵢ ≠ 0</text><text x="310" y="910" font-size="18" fill="#172554" text-anchor="middle">Positive coefficient weights; take t → 0.</text><text x="180" y="951" font-size="23" fill="#172554" text-anchor="middle">t·p</text><path d="M220,943 L406,943" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="443" y="951" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="310" y="979" font-size="16" fill="#172554" text-anchor="middle">Closed nonregular locus would contain the origin.</text><text x="310" y="1035" font-size="22" fill="#172554" text-anchor="middle">At t^λ: character ψλ = Σχ ⟨χ,λ⟩ χ</text><text x="310" y="1070" font-size="17" fill="#172554" text-anchor="middle">Trace pairing is nondegenerate, including the centre.</text><text x="310" y="1102" font-size="16" fill="#172554" text-anchor="middle">Proofs C.19.1.1–C.19.6.1; full E/ℚℓ coefficients.</text></g></svg>