<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Entire coherent strings survive model transport</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.65: exact higher components and their signs</text><rect x="25" y="105" width="570" height="340" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="150" font-size="20" fill="#172554" text-anchor="middle">A length-three component with even cohomology</text><text x="55" y="254" font-size="25" fill="#172554" text-anchor="middle">x</text><text x="55" y="287" font-size="14" fill="#172554" text-anchor="middle">deg 0</text><text x="155" y="254" font-size="25" fill="#172554" text-anchor="middle">b₁</text><text x="155" y="287" font-size="14" fill="#172554" text-anchor="middle">deg 0</text><text x="255" y="254" font-size="25" fill="#172554" text-anchor="middle">a₁</text><text x="255" y="287" font-size="14" fill="#172554" text-anchor="middle">deg −1</text><text x="355" y="254" font-size="25" fill="#172554" text-anchor="middle">b₂</text><text x="355" y="287" font-size="14" fill="#172554" text-anchor="middle">deg −1</text><text x="455" y="254" font-size="25" fill="#172554" text-anchor="middle">a₂</text><text x="455" y="287" font-size="14" fill="#172554" text-anchor="middle">deg −2</text><text x="565" y="254" font-size="25" fill="#172554" text-anchor="middle">z</text><text x="565" y="287" font-size="14" fill="#172554" text-anchor="middle">deg −2</text><path d="M74,246 L135,246 M122.0,252.0 L135,246 L122.0,240.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="105.0" y="218" font-size="16" fill="#2563eb" text-anchor="middle">F₀₁</text><path d="M174,246 L235,246 M222.0,252.0 L235,246 L222.0,240.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="205.0" y="218" font-size="16" fill="#15803d" text-anchor="middle">h₁</text><path d="M274,246 L335,246 M322.0,252.0 L335,246 L322.0,240.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="305.0" y="218" font-size="16" fill="#2563eb" text-anchor="middle">F₁₂</text><path d="M374,246 L435,246 M422.0,252.0 L435,246 L422.0,240.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="405.0" y="218" font-size="16" fill="#15803d" text-anchor="middle">h₂</text><path d="M474,246 L545,246 M532.0,252.0 L545,246 L532.0,240.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="510.0" y="218" font-size="16" fill="#2563eb" text-anchor="middle">F₂₃</text><text x="310" y="333" font-size="17" fill="#172554" text-anchor="middle">T[0,1,2,3](x) = +z; every shorter component is zero.</text><text x="310" y="375" font-size="20" fill="#172554" text-anchor="middle">First stage: T⁽¹⁾[0,1,2](x) = −b₂</text><text x="310" y="417" font-size="18" fill="#172554" text-anchor="middle">Second stage: −F₂₃ h₂ T⁽¹⁾[0,1,2](x) = +z</text><rect x="25" y="485" width="570" height="340" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="529" font-size="20" fill="#172554" text-anchor="middle">A higher path component is also necessary</text><text x="310" y="588" font-size="23" fill="#172554" text-anchor="middle">A[1,2,3](b₁) = z,     |A| = −2</text><text x="310" y="641" font-size="22" fill="#172554" text-anchor="middle">da₁ = b₁,     ∂A(a₁) = −z</text><text x="310" y="694" font-size="20" fill="#172554" text-anchor="middle">−∂A(a₁) = A[2,3] F[1,2](a₁) = z</text><text x="310" y="747" font-size="16" fill="#172554" text-anchor="middle">The corresponding transported two-arrow component is zero.</text><text x="310" y="795" font-size="17" fill="#172554" text-anchor="middle">Its path comparison still retains this higher component.</text><rect x="25" y="865" width="570" height="190" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="909" font-size="20" fill="#172554" text-anchor="middle">Staged contractions give the exact same functor</text><text x="310" y="956" font-size="23" fill="#172554" text-anchor="middle">P = qp,     I = ij,     H = h + ikp</text><text x="310" y="1003" font-size="19" fill="#172554" text-anchor="middle">Nested partitions ↔ seams marked h or ikp</text><text x="310" y="1040" font-size="17" fill="#172554" text-anchor="middle">Every original string; compatible full-face restrictions.</text><text x="310" y="1102" font-size="14" fill="#172554" text-anchor="middle">Theorems C.65.1.1–2.1; Proposition C.65.3.1; Exercises C.65.4.1–2.</text></g></svg>