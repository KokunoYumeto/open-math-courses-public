<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Retain the actual unit and the full mapping complex</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.61: negative index degrees and positive mapping degrees</text><rect x="25" y="105" width="570" height="340" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="19" fill="#172554" text-anchor="middle">Exercise C.61.5.1: the parameter triangle</text><text x="310" y="189" font-size="23" fill="#172554" text-anchor="middle">w = sb | sa,       dH = BA − C</text><text x="310" y="234" font-size="26" fill="#172554" text-anchor="middle">η(w) = sH + sB | sA</text><text x="310" y="279" font-size="24" fill="#172554" text-anchor="middle">d(sH) = s(BA) − sC</text><text x="310" y="320" font-size="24" fill="#172554" text-anchor="middle">d(sB | sA) = −s(BA)</text><text x="310" y="365" font-size="26" fill="#172554" text-anchor="middle">dη(w) = −sC = η(dw)</text><text x="310" y="410" font-size="17" fill="#172554" text-anchor="middle">The full face {0,2} retains the actual direct arrow c.</text><rect x="25" y="485" width="570" height="215" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="525" font-size="24" fill="#172554" text-anchor="middle">The acyclic unit quotient</text><text x="150" y="574" font-size="22" fill="#172554" text-anchor="middle">v = sB | sA</text><text x="470" y="574" font-size="22" fill="#172554" text-anchor="middle">u = s(BA)</text><path d="M250,570 L360,570 M347.0,576.0 L360,570 L347.0,564.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="305" y="551" font-size="18" fill="#172554" text-anchor="middle">d(v) = −u</text><text x="310" y="620" font-size="24" fill="#172554" text-anchor="middle">h(u) = −v,       h(v) = 0</text><text x="310" y="668" font-size="23" fill="#172554" text-anchor="middle">dh + hd = Id,       h² = 0</text><rect x="25" y="745" width="570" height="310" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="785" font-size="19" fill="#172554" text-anchor="middle">Exercise C.61.5.2: positive original rank two</text><text x="310" y="831" font-size="23" fill="#172554" text-anchor="middle">|u| = 3,       |v| = 2,       dv = −u</text><text x="310" y="875" font-size="21" fill="#172554" text-anchor="middle">|f| = −2,       f(v) = 1,       f(u) = 0</text><text x="310" y="919" font-size="25" fill="#172554" text-anchor="middle">H₀(f) = (−1)<tspan baseline-shift="super" font-size="65%">|f|</tspan> f h</text><text x="310" y="964" font-size="22" fill="#172554" text-anchor="middle">H₀(f)(u) = −1,       |H₀(f)| = −3</text><text x="310" y="1006" font-size="27" fill="#172554" text-anchor="middle">∂H₀(f) = f</text><text x="310" y="1040" font-size="17" fill="#172554" text-anchor="middle">Full module actions require the finite perturbation.</text><text x="310" y="1102" font-size="17" fill="#172554" text-anchor="middle">Theorems C.61.1.1–4.1; Exercises C.61.5.1–2.</text></g></svg>