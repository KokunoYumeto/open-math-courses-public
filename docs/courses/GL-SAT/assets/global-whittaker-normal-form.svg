<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Actual Whittaker strata on P¹</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="19" text-anchor="middle">γ=Σ_(α&gt;0) α∨ belongs to the full torus lattice.</text>
<text x="310" y="198" font-size="21" text-anchor="middle">T₀=O(−1)×_(G_m,γ) T; T_μ=T₀(−μx)</text>
<text x="310" y="237" font-size="24" text-anchor="middle">a_β=2 ht(β); b_β=〈β,μ〉≥0</text>
<text x="310" y="276" font-size="27" text-anchor="middle">Root line: O(−a_β−b_β)</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="27" text-anchor="middle">Global powers: j≤−a_β</text>
<text x="310" y="443" font-size="27" text-anchor="middle">Middle powers: −a_β&lt;j&lt;b_β</text>
<text x="310" y="482" font-size="27" text-anchor="middle">Local powers: j≥b_β</text>
<text x="310" y="521" font-size="20" text-anchor="middle">The middle contributes a_β+b_β−1 coordinates.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="27" text-anchor="middle">H_− × M_μ × H_+,μ ≅ N((t))</text>
<text x="310" y="688" font-size="23" text-anchor="middle">Normalize in increasing root height.</text>
<text x="310" y="727" font-size="20" text-anchor="middle">The identities hold on every parameter ring.</text>
<text x="310" y="766" font-size="23" text-anchor="middle">B_μ=M_μ=A^(m_μ); m_μ=m₀+h_μ</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="27" text-anchor="middle">Simple roots have a_i=2.</text>
<text x="310" y="933" font-size="21" text-anchor="middle">e_μ=Σ_i a_(i,−1), with positive residue trace.</text>
<text x="310" y="972" font-size="29" text-anchor="middle">Ψ_μ=e_μ*L_ψ[m_μ]</text>
<text x="310" y="1011" font-size="23" text-anchor="middle">RHom(Ψ_μ,Ψ_μ)=E geometrically.</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Theorem G.1.1.1; Lemma G.2.1.1; Proposition G.3.1.1.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">The fixed T-quotient retains its central characters.</text>
</svg>