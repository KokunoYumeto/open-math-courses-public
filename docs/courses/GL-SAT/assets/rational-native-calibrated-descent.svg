<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="25" fill="#172554" text-anchor="middle">Rational full coefficient descent</text><text x="310" y="76" font-size="16" fill="#172554" text-anchor="middle">Minimal transfer · compatible unipotent windows · Yoneda</text><rect x="18" y="100" width="584" height="294" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="144" font-size="23" fill="#2563eb" text-anchor="middle">One whole calibrated field comparison</text><text x="124" y="215" font-size="25" fill="#172554" text-anchor="middle">M_E</text><text x="310" y="215" font-size="25" fill="#172554" text-anchor="middle">P_G ⊗ E</text><text x="502" y="215" font-size="25" fill="#172554" text-anchor="middle">P_H ⊗ E</text><text x="217" y="211" font-size="28" fill="#15803d" text-anchor="middle">→</text><text x="405" y="211" font-size="28" fill="#15803d" text-anchor="middle">→</text><text x="217" y="180" font-size="18" fill="#15803d" text-anchor="middle">I_E</text><text x="405" y="180" font-size="21" fill="#15803d" text-anchor="middle">Φ</text><text x="310" y="273" font-size="25" fill="#172554" text-anchor="middle">g_E = Φ I_E;      (g_E)₁ = 1_H</text><text x="310" y="320" font-size="24" fill="#15803d" text-anchor="middle">g_ℚ : M → P_H;     (g_ℚ)₁ = 1_H</text><text x="310" y="365" font-size="16" fill="#172554" text-anchor="middle">Every connected-subtree window and restriction is retained.</text><rect x="18" y="416" width="584" height="269" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="458" font-size="22" fill="#15803d" text-anchor="middle">The given E-point remains in the comparison</text><text x="310" y="505" font-size="28" fill="#172554" text-anchor="middle">F_ℚ = g_ℚ J;       JI = 1</text><text x="310" y="553" font-size="27" fill="#172554" text-anchor="middle">a = g_E (g_ℚ ⊗ E)⁻¹</text><text x="310" y="601" font-size="26" fill="#172554" text-anchor="middle">a(F_ℚ ⊗ E) = Φ I_E J_E</text><text x="310" y="648" font-size="20" fill="#172554" text-anchor="middle">A whole prism compares Φ I_E J_E to Φ.</text><rect x="18" y="706" width="584" height="282" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="748" font-size="21" fill="#2563eb" text-anchor="middle">Recover the actual tensor and unit constraints</text><text x="310" y="795" font-size="26" fill="#172554" text-anchor="middle">u_x = 1_(T_G x)</text><text x="310" y="843" font-size="28" fill="#15803d" text-anchor="middle">θ_x  ↔  (F_ℚ)₁(u_x)</text><text x="310" y="889" font-size="16" fill="#172554" text-anchor="middle">All higher components give naturality and graft coherence.</text><text x="310" y="934" font-size="21" fill="#172554" text-anchor="middle">At the empty tuple: T_G(∅) = IC₀.</text><text x="310" y="970" font-size="17" fill="#172554" text-anchor="middle">Its whole represented mapping complex remains.</text><text x="310" y="1030" font-size="15" fill="#172554" text-anchor="middle">The rational target has its fixed cohomological tensor objects.</text><text x="310" y="1068" font-size="15" fill="#172554" text-anchor="middle">Individual coefficients of the chosen E-point need not be rational.</text><text x="310" y="1105" font-size="14" fill="#172554" text-anchor="middle">Complete construction and perfect-envelope extension: Theorem 79.</text></g></svg>