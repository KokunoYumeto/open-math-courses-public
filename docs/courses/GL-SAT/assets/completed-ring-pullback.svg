<svg xmlns="http://www.w3.org/2000/svg" width="620" height="940" viewBox="0 0 620 940">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#36576b"/></marker></defs>
<rect width="620" height="940" fill="#fafbfd"/>
<g font-family="Arial,sans-serif" fill="#163a4b">
<text x="30" y="42" font-size="25" font-weight="bold">Actual completed-ring pullback</text>
<text x="30" y="72" font-size="17">A morphism g: Y → X, with X Noetherian</text>
<rect x="25" y="99" width="570" height="165" rx="12" fill="#e8f2f8" stroke="#8db2c6"/>
<text x="43" y="130" font-size="18" font-weight="bold">1. Extend the coefficient ring</text>
<text x="43" y="163" font-size="19">gₙ⁻¹ Ô_X  →  Ô_Y</text>
<text x="43" y="196" font-size="18">g_O* K = gₙ⁻¹ K ⊗ᴸ_(gₙ⁻¹ Ô_X) Ô_Y</text>
<text x="43" y="228" font-size="15">gₙ⁻¹ is inverse image of underlying sheaves.</text>
<path d="M310 270V308" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="25" y="320" width="570" height="177" rx="12" fill="#e8f6ef" stroke="#8cba9e"/>
<text x="43" y="352" font-size="18" font-weight="bold">2. Compute on stratal perfect models</text>
<text x="43" y="387" font-size="19">P ⊗_O Ô_Z  ↦  P ⊗_O Ô_(Z×_X Y)</text>
<text x="43" y="420" font-size="16">P is a bounded finite free O-complex.</text>
<text x="43" y="450" font-size="16">Closed-open triangles give the general K.</text>
<text x="43" y="478" font-size="15">The ordinary ringed pullback is already complete.</text>
<path d="M310 503V541" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="25" y="553" width="570" height="171" rx="12" fill="#f2edf9" stroke="#b7a3ce"/>
<text x="43" y="586" font-size="18" font-weight="bold">3. Keep every finite reduction and its map</text>
<text x="43" y="622" font-size="19">(g_O* K) ⊗ᴸ_O O_n = ν_Y⁻¹ g_et⁻¹ K_n</text>
<text x="43" y="657" font-size="16">O_n = O / πⁿ; the quotient over O is perfect.</text>
<text x="43" y="690" font-size="16">All coefficient and restriction maps agree.</text>
<path d="M310 730V768" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="25" y="780" width="570" height="122" rx="12" fill="#fff6df" stroke="#c5aa60"/>
<text x="43" y="812" font-size="18" font-weight="bold">The canonical completion map is an isomorphism</text>
<text x="43" y="848" font-size="19">g_O* K  ≃  R lim_n (ν_Y⁻¹ g_et⁻¹ K_n)</text>
<text x="43" y="881" font-size="15">Lemma M.6.1.1 and Theorem M.6.2.1</text>
</g></svg>
