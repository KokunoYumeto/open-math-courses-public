<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Two actual coordinate-section orientations</text>
<text x="310" y="83" font-size="18" text-anchor="middle">k a field; ℓ invertible; finite or rational-adic coefficients</text>
<rect x="28" y="119" width="564" height="191" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="161" font-size="28" text-anchor="middle">Spec k ─s₀→ A¹_v ─sᵤ→ A²_(u,v)</text>
<text x="310" y="205" font-size="24" text-anchor="middle">s₀: v=0;  sᵤ(v)=(0,v)</text>
<text x="310" y="248" font-size="26" text-anchor="middle">qᵥ s₀ = 1;  qᵤ sᵤ = 1</text>
<text x="310" y="286" font-size="19" text-anchor="middle">The identity counits fix each section orientation.</text>
<path d="M310,326 L310,357" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="373" width="564" height="194" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="417" font-size="27" text-anchor="middle">sᵤ! E_(A²) = E_(A¹)(−1)[−2]</text>
<text x="310" y="462" font-size="27" text-anchor="middle">s₀! E_(A¹) = E(−1)[−2]</text>
<text x="310" y="506" font-size="18" text-anchor="middle">Each positive coordinate Kummer class has trace +1.</text>
<text x="310" y="544" font-size="22" text-anchor="middle">Each class has cohomological degree 2.</text>
<path d="M310,583 L310,614" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="630" width="564" height="197" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="674" font-size="28" text-anchor="middle">i₀ = sᵤ s₀;  i₀! = s₀! sᵤ!</text>
<text x="310" y="720" font-size="31" text-anchor="middle">i₀! E_(A²) = E(−2)[−4]</text>
<text x="310" y="764" font-size="21" text-anchor="middle">Exchanging the two classes gives (−1)⁴ = +1.</text>
<text x="310" y="804" font-size="19" text-anchor="middle">The composite trace is +1 by counit transitivity.</text>
<path d="M310,843 L310,874" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="890" width="564" height="176" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="934" font-size="23" text-anchor="middle">The maps retain coefficient reductions.</text>
<text x="310" y="976" font-size="19" text-anchor="middle">Completion and rationalization retain the counits.</text>
<text x="310" y="1018" font-size="21" text-anchor="middle">Over F_q: geometric Frobenius on E(−2) is q².</text>
<text x="310" y="1047" font-size="18" text-anchor="middle">Both inverse Kummer lines are retained.</text>
<text x="310" y="1120" font-size="19" text-anchor="middle">Theorem 2.0; Lesson 6, A.1.1.1 and A.2.2.1.</text>
<text x="310" y="1160" font-size="18" text-anchor="middle">Lesson 5, P.2.4.1 and P.3.4.1 fix composition and twists.</text>
</svg>