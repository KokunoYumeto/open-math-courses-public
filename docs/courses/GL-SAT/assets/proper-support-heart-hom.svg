<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="43" font-size="26" text-anchor="middle">Proper support identifies degree-zero maps</text>
<text x="310" y="82" font-size="22" text-anchor="middle">Y proper,   H smooth connected,   1 ∈ H(k)</text>
<rect x="28" y="112" width="564" height="184" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="155" font-size="24" text-anchor="middle">A = RHom_Y(P,Q),   V = RΓ(Y,A)</text>
<text x="310" y="196" font-size="22" text-anchor="middle">P,Q perverse ⇒ H^r(V) = 0 for r&lt;0.</text>
<text x="310" y="237" font-size="21" text-anchor="middle">Smooth pullback:</text>
<text x="310" y="275" font-size="23" text-anchor="middle">p* A ≅ RHom_(H×Y)(p*P,p*Q)</text>
<path d="M310,311 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="366" width="564" height="155" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="408" font-size="24" text-anchor="middle">π : H×Y → H is proper.</text>
<text x="310" y="451" font-size="28" text-anchor="middle">Rπ_* p*A = V_H</text>
<text x="310" y="494" font-size="20" text-anchor="middle">Actual proper base change from Y → Spec k.</text>
<path d="M310,536 L310,577" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="591" width="564" height="160" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="633" font-size="24" text-anchor="middle">H⁰ RΓ(H,V_H) = Γ(H,(H⁰V)_H)</text>
<text x="310" y="677" font-size="22" text-anchor="middle">Connectedness gives Γ(H,W_H) = W.</text>
<text x="310" y="719" font-size="18" text-anchor="middle">Higher H-cohomology needs negative Hom degree;</text>
<text x="310" y="742" font-size="18" text-anchor="middle">the perverse bounds eliminate that contribution.</text>
<path d="M310,767 L310,808" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="822" width="564" height="151" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="863" font-size="24" text-anchor="middle">Hom(P,Q) ≅ Hom(p*P[h],p*Q[h])</text>
<text x="310" y="902" font-size="20" text-anchor="middle">h = dim H; restriction at 1 is the inverse.</text>
<text x="310" y="936" font-size="18" text-anchor="middle">Normalize the action; uniqueness proves its cocycle.</text>
<text x="310" y="963" font-size="17" text-anchor="middle">Exercise B.4.1 retains nonzero H¹(G_m,E).</text>
<text x="310" y="1020" font-size="22" text-anchor="middle">Theorems B.1.3.1–B.1.4.1</text>
</svg>