x="95" y="266" font-size="18" fill="#15803d" text-anchor="middle">u</text><text x="225" y="283" font-size="21" fill="#172554" text-anchor="middle">x</text><text x="395" y="283" font-size="21" fill="#15803d" text-anchor="middle">v</text><text x="525" y="283" font-size="21" fill="#172554" text-anchor="middle">x</text><path d="M 272 218 L 347 218" stroke="#15803d" stroke-width="3"/><text x="310" y="201" font-size="14" fill="#15803d" text-anchor="middle">execute u</text><text x="160" y="317" font-size="22" fill="#172554" text-anchor="middle">μ(u(),x)</text><text x="460" y="317" font-size="22" fill="#172554" text-anchor="middle">μ(v,x)</text><text x="310" y="351" font-size="20" fill="#15803d" text-anchor="middle">m = 1 + (1 − 0) = 2;       v is arbitrary.</text><rect x="18" y="407" width="584" height="317" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="448" font-size="21" fill="#15803d" text-anchor="middle">The linear row and its full quadratic core</text><text x="310" y="494" font-size="20" fill="#172554" text-anchor="middle">F = (A,B,R);     G = (C,E,S);     |G| = s</text><text x="310" y="541" font-size="24" fill="#2563eb" text-anchor="middle">T(F) = (A, Bₒ, R u + I′ L(B))</text><text x="310" y="590" font-size="25" fill="#15803d" text-anchor="middle">τ₂(sG | sF) = (0, 0, S L(B))</text><text x="310" y="637" font-size="22" fill="#172554" text-anchor="middle">M(G,F) = (0, 0, (−1)ˢ S L(B))</text><text x="310" y="681" font-size="20" fill="#172554" text-anchor="middle">|τ₂| = 1 on suspended words;     |M| = −1.</text><text x="310" y="710" font-size="15" fill="#172554" text-anchor="middle">The full cofree map retains every partition into these cores.</text><rect x="18" y="745" width="584" height="247" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="786" font-size="19" fill="#2563eb" text-anchor="middle">The original section has a whole comparison back</text><text x="310" y="831" font-size="21" fill="#172554" text-anchor="middle">Υ₀ = (1,u,0);       Υ₁(sF) = (0,L(B),0)</text><text x="310" y="876" font-size="21" fill="#15803d" text-anchor="middle">τ₂ = (0,0,−M₁M₂) in the native example</text><text x="310" y="921" font-size="24" fill="#172554" text-anchor="middle">Object core:  −(f+z) ⊗ (f+z)</text><text x="310" y="965" font-size="22" fill="#15803d" text-anchor="middle">Two parameters in each factor:  −4z ⊗ z</text><text x="310" y="1030" font-size="17" fill="#172554" text-anchor="middle">dT = Td; the quadratic and cubic bar equations hold.</text><text x="310" y="1067" font-size="15" fill="#172554" text-anchor="middle">Two R-only outputs multiply to zero; all unit cores normalize.</text><text x="310" y="1105" font-size="14" fill="#172554" text-anchor="middle">Exact degrees, all unary terms and full comparison: (74.1)–(74.17).</text></g></svg>