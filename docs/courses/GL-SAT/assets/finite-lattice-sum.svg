<text x="310" y="78" font-size="20" text-anchor="middle">O = Z₃,  E = Q₃,  cover degree d = 3</text>
<text x="310" y="108" font-size="18" text-anchor="middle">Every grid is the exact quotient O² / 3O² = F₃².</text>
