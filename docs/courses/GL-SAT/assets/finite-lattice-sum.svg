<text x="48" y="754" font-size="25" text-anchor="start" style="fill:#15803d">M₁ + M₂ + M₃ = O²</text>
<text x="48" y="795" font-size="18" text-anchor="start">Their quotient sum is all 9 points.</text>
<text x="48" y="835" font-size="18" text-anchor="start">Use addition of the three sheets.</text>
<text x="48" y="870" font-size="18" text-anchor="start">No division by d = 3 occurs.</text>
