<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Specialization retains the actual enhanced diagram</text><text x="310" y="76" font-size="17" fill="#172554" text-anchor="middle">S: strict henselian trait; ℓ invertible; relative dimensions.</text><rect x="25" y="103" width="570" height="302" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="20" fill="#172554" text-anchor="middle">1. Relative compact support is a perfect constant</text><text x="310" y="190" font-size="23" fill="#172554" text-anchor="middle">C = Y ×X Z;   K = RΓ(S, Ra!E)</text><text x="310" y="235" font-size="17" fill="#172554" text-anchor="middle">f, g proper;   Y/S, Z/S smooth of dimensions r, s.</text><text x="310" y="281" font-size="27" fill="#172554" text-anchor="middle">κb : K  ≃  RΓc(Cb,E)</text><text x="310" y="326" font-size="24" fill="#172554" text-anchor="middle">RHomX(Bf,Bg) ≃ D K[−r−s](−s)</text><text x="310" y="371" font-size="15" fill="#172554" text-anchor="middle">Closed relative cells + localization; C.26.1.1–C.26.2.1.</text><rect x="25" y="437" width="570" height="279" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="479" font-size="19" fill="#172554" text-anchor="middle">2. Evaluation and relative trace determine the arrow</text><text x="310" y="525" font-size="24" fill="#172554" text-anchor="middle">ab : Hom family → Hom fibre</text><text x="310" y="571" font-size="25" fill="#172554" text-anchor="middle">D(κb) ◦ ab = id;    ab = D(κb⁻¹)</text><text x="310" y="618" font-size="22" fill="#172554" text-anchor="middle">D = RHomE(−,E);   Bf = Rf*E[r]</text><text x="310" y="664" font-size="18" fill="#172554" text-anchor="middle">The shift uses relative dimensions, not dim S.</text><text x="310" y="697" font-size="17" fill="#172554" text-anchor="middle">Both IC stalks and costalks compare; C.26.4.1.</text><rect x="25" y="750" width="570" height="299" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="791" font-size="19" fill="#172554" text-anchor="middle">3. Retain the full action nerve before totalization</text><text x="310" y="834" font-size="22" fill="#172554" text-anchor="middle">At level m:  Qᵐ ×S C;   dimS Q = DQ</text><text x="310" y="878" font-size="25" fill="#172554" text-anchor="middle">Hom m ≃ D K(Qᵐ ×S C)</text><text x="310" y="920" font-size="25" fill="#172554" text-anchor="middle">[−2mDQ−r−s](−mDQ−s)</text><text x="310" y="960" font-size="18" fill="#172554" text-anchor="middle">Uniform lower degree: L = r+s−2 dimS C.</text><text x="310" y="1000" font-size="16" fill="#172554" text-anchor="middle">Window ≤N uses m≤N+1−L; then localize coefficients.</text><text x="310" y="1035" font-size="17" fill="#172554" text-anchor="middle">C.26.3.1 proves the complete nerve comparison.</text><text x="310" y="1085" font-size="18" fill="#172554" text-anchor="middle">Arithmetic fibre ↔ family ↔ complex geometric fibre</text><text x="310" y="1110" font-size="14" fill="#172554" text-anchor="middle">Rootwise Iwahori envelopes; spherical fusion is a further step.</text></g></svg>