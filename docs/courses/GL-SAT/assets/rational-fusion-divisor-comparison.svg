<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="23" text-anchor="middle">The actual divisor map gives sheaf-level fusion</text>
<text x="310" y="82" font-size="25" text-anchor="middle">B = A²_(a,b),   D : δ=b−a=0</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="24" text-anchor="middle">Positive supported base class</text>
<text x="310" y="195" font-size="27" text-anchor="middle">u_B : i_B*E_D(−1)[−2] → E_B</text>
<text x="310" y="237" font-size="20" text-anchor="middle">Pull it back, tensor with A, then transpose.</text>
<text x="310" y="275" font-size="26" text-anchor="middle">θ_A : i* A(−1)[−2] → i! A</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="20" text-anchor="middle">Étale charts pull a fixed coefficient product.</text>
<text x="310" y="440" font-size="26" text-anchor="middle">s!v!F = F;   v!F = v*F(1)[2]</text>
<text x="310" y="482" font-size="21" text-anchor="middle">The section counit and line trace fix θ_A.</text>
<text x="310" y="518" font-size="20" text-anchor="middle">Thus θ_A is invertible on the moving source.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="21" text-anchor="middle">m_B : 𝒴 → Z_M is proper;   K=Rm_B* A.</text>
<text x="310" y="683" font-size="19" text-anchor="middle">Proper and supported mates carry θ_A to θ_K.</text>
<text x="310" y="725" font-size="25" text-anchor="middle">𝓕=K[2];   G=(P*Q) ⊠ E_D[1]</text>
<text x="310" y="761" font-size="25" text-anchor="middle">i*𝓕=G[1],   i!𝓕=G(−1)[−1]</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="24" text-anchor="middle">Closed perverse degrees: −1 and +1.</text>
<text x="310" y="927" font-size="19" text-anchor="middle">No closed subobject or quotient ⇒ 𝓕=j_!*j*𝓕.</text>
<text x="310" y="968" font-size="21" text-anchor="middle">At (0,0), remove [2]: the fiber is P*Q.</text>
<text x="310" y="1001" font-size="17" text-anchor="middle">Point exchange extends uniquely from the open product.</text>
<text x="310" y="1058" font-size="21" text-anchor="middle">The one common E_U[2] base factor is fixed.</text>
<text x="310" y="1098" font-size="19" text-anchor="middle">The coefficient interchange retains its graded signs.</text>
<text x="310" y="1140" font-size="17" text-anchor="middle">Lemmas A.1.1.1–A.1.2.1; Theorems A.3.1.1–A.3.2.1</text>
</svg>