<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">Whole evaluation retains native operator cubes</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.77: full source words, parameter marks and actual units</text><rect x="25" y="105" width="570" height="245" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="147" font-size="19" fill="#172554" text-anchor="middle">Exact entire restriction, including all higher outputs</text><text x="310" y="193" font-size="23" fill="#172554" text-anchor="middle">r Φ̂ = B(ι(B)₍*₎) Φ · (1 ⊗ ε(cube))</text><text x="310" y="238" font-size="20" fill="#172554" text-anchor="middle">Inner evaluation lies in the full Bι(B) image.</text><text x="310" y="281" font-size="18" fill="#172554" text-anchor="middle">Outer admissibility then applies to that entire output.</text><text x="310" y="325" font-size="18" fill="#172554" text-anchor="middle">Nested evaluation gives the same full native composite.</text><rect x="25" y="390" width="570" height="365" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="432" font-size="21" fill="#172554" text-anchor="middle">The whole boundary needs its interior value</text><text x="310" y="470" font-size="19" fill="#172554" text-anchor="middle">|x|=−1, |y|=−2,   dy=x,   ideal²=0</text><path d="M165,635 L455,635" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M165,635 L165,515" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M165,515 L455,515" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M455,635 L455,515" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="150" y="665" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="465" y="665" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="150" y="503" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="465" y="503" font-size="23" fill="#172554" text-anchor="middle">0</text><text x="310" y="668" font-size="20" fill="#15803d" text-anchor="middle">bottom edge x</text><text x="139" y="580" font-size="20" fill="#172554" text-anchor="middle">0</text><text x="481" y="580" font-size="20" fill="#172554" text-anchor="middle">0</text><text x="310" y="502" font-size="18" fill="#172554" text-anchor="middle">top edge 0</text><text x="310" y="557" font-size="25" fill="#15803d" text-anchor="middle">interior y</text><text x="310" y="596" font-size="18" fill="#15803d" text-anchor="middle">dy − φ(d(e⊗e)) = x − x = 0</text><text x="310" y="716" font-size="19" fill="#172554" text-anchor="middle">Omitting the interior leaves the nonzero defect −x.</text><rect x="25" y="795" width="570" height="270" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="837" font-size="21" fill="#172554" text-anchor="middle">A formal middle identity uses μ = minimum</text><text x="310" y="879" font-size="21" fill="#172554" text-anchor="middle">μ(e⊗v₁)=μ(v₁⊗e)=e,   μ(e⊗e)=0</text><text x="310" y="923" font-size="18" fill="#172554" text-anchor="middle">An interval comparison:   ψ(v₁)=α, ψ(e)=β, dβ=α</text><text x="310" y="967" font-size="18" fill="#172554" text-anchor="middle">Its identity-degeneracy square has value α at (1,1),</text><text x="310" y="1008" font-size="19" fill="#172554" text-anchor="middle">value β on both edges with other vertex 1,</text><text x="310" y="1043" font-size="18" fill="#7c3aed" text-anchor="middle">and zero top cell. It is a nonconstant closed square.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.77.1.1–2.1; Exercises C.77.3.1–2.</text></g></svg>