<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1020" viewBox="0 0 620 1020">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#36576b"/></marker></defs>
<rect width="620" height="1020" fill="#fafbfd"/>
<g font-family="Arial,sans-serif" fill="#163a4b">
<text x="25" y="42" font-size="25" font-weight="bold">The rational specialization map</text>
<text x="25" y="72" font-size="17">X ×_k B → B, for every parameter scheme B</text>
<rect x="25" y="96" width="570" height="164" rx="12" fill="#e8f2f8" stroke="#8db2c6"/>
<text x="43" y="129" font-size="18" font-weight="bold">Affine strict-local and fibre schemes</text>
<text x="64" y="174" font-size="20">Q = Y_(ȳ)</text>
<text x="300" y="174" font-size="20">S = B_(b̄)</text>
<path d="M204 167H285" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="64" y="221" font-size="19">P = Q ×_S t̄</text>
<text x="300" y="221" font-size="19">t̄ → S</text>
<text x="25" y="303" font-size="18" font-weight="bold">At every finite coefficient level</text>
<rect x="25" y="320" width="265" height="105" rx="9" fill="#e8f6ef" stroke="#8cba9e"/>
<rect x="330" y="320" width="265" height="105" rx="9" fill="#e8f6ef" stroke="#8cba9e"/>
<text x="43" y="356" font-size="17">RΓ_et(Q, a_Q⁻¹ K_n)</text>
<text x="43" y="393" font-size="16">= (K_n)_(x̄)</text>
<text x="347" y="376" font-size="17">RΓ_et(P, a_P⁻¹ K_n)</text>
<path d="M294 370H326" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="299" y="349" font-size="16">≃</text>
<text x="25" y="471" font-size="18" font-weight="bold">Take the coherent limit, then tensor with E</text>
<rect x="25" y="489" width="265" height="106" rx="9" fill="#f2edf9" stroke="#b7a3ce"/>
<rect x="330" y="489" width="265" height="106" rx="9" fill="#f2edf9" stroke="#b7a3ce"/>
<text x="43" y="529" font-size="17">RΓ(Q, K̂_Q) ⊗_O E</text>
<text x="347" y="529" font-size="17">RΓ(P, K̂_P) ⊗_O E</text>
<text x="43" y="570" font-size="15">Completed restriction</text>
<text x="347" y="570" font-size="15">Completed restriction</text>
<path d="M294 537H326" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="299" y="516" font-size="16">≃</text>
<path d="M158 600V698" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M463 600V698" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="179" y="652" font-size="20">≃</text>
<text x="485" y="652" font-size="20">≃</text>
<text x="25" y="630" font-size="14">λ_Q</text>
<text x="331" y="630" font-size="14">λ_P</text>
<rect x="25" y="712" width="265" height="102" rx="9" fill="#fff6df" stroke="#c5aa60"/>
<rect x="330" y="712" width="265" height="102" rx="9" fill="#fff6df" stroke="#c5aa60"/>
<text x="43" y="749" font-size="17">RΓ(Q, a_Q,E* K_E)</text>
<text x="347" y="749" font-size="17">RΓ(P, a_P,E* K_E)</text>
<text x="43" y="790" font-size="15">Actual ringed pullback</text>
<text x="347" y="790" font-size="15">Actual ringed pullback</text>
<path d="M294 760H326" stroke="#36576b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="299" y="739" font-size="16">≃</text>
<text x="25" y="859" font-size="17">λ_Q and λ_P are affine section localization</text>
<text x="25" y="888" font-size="17">combined with the actual pullback comparison.</text>
<text x="25" y="927" font-size="17" font-weight="bold">Commutativity identifies the lower restriction.</text>
<text x="25" y="965" font-size="15">Theorem M.7.1.1; E = O[1/π]; K_E = K[1/π]</text>
<text x="25" y="993" font-size="15">The same test applies after every B′ → B.</text>
</g></svg>
