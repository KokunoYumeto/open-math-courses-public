<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="22" text-anchor="middle">The actual rational fibre functor reconstructs a group</text>
<text x="310" y="82" font-size="25" text-anchor="middle">Sat_G(E) → finite E-vector spaces</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="18" text-anchor="middle">Exact faithful H; actual tensor, unit and duality maps.</text>
<text x="310" y="195" font-size="21" text-anchor="middle">Component-adjusted symmetry → ordinary flip.</text>
<text x="310" y="237" font-size="24" text-anchor="middle">[ξ,H(f)v]_Q = [ξ∘H(f),v]_P</text>
<text x="310" y="275" font-size="17" text-anchor="middle">These relations define the coefficient Hopf algebra A_E.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="30" text-anchor="middle">G̃_E = Spec A_E</text>
<text x="310" y="440" font-size="26" text-anchor="middle">G̃_E(R) = Aut^⊗(R ⊗_E H)</text>
<text x="310" y="482" font-size="18" text-anchor="middle">The coefficient matrix coproduct gives multiplication.</text>
<text x="310" y="518" font-size="19" text-anchor="middle">Actual evaluation and coevaluation give its inverse.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="28" text-anchor="middle">T̂_E = Spec E[L]  ↪  G̃_E</text>
<text x="310" y="683" font-size="23" text-anchor="middle">a : L → R× acts on F_ν(P) by a(ν).</text>
<text x="310" y="725" font-size="19" text-anchor="middle">An antidominant point slice gives F_η(IC_λ)=E.</text>
<text x="310" y="761" font-size="18" text-anchor="middle">Its coefficient restricts to e^η; these generate E[L].</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="29" text-anchor="middle">C = L / ZΦ∨</text>
<text x="310" y="927" font-size="22" text-anchor="middle">D_E(C) ↪ T̂_E ↪ G̃_E is central and closed.</text>
<text x="310" y="968" font-size="20" text-anchor="middle">On component κ, its action is the scalar a(κ).</text>
<text x="310" y="1001" font-size="18" text-anchor="middle">Full root identification and kernel removal come later.</text>
<text x="310" y="1058" font-size="21" text-anchor="middle">Torus test: x=1+aε, ε²=0 gives x^n=1+naε.</text>
<text x="310" y="1098" font-size="22" text-anchor="middle">The reconstruction retains every test algebra.</text>
<text x="310" y="1140" font-size="16" text-anchor="middle">Theorem A.1.1.1; Proposition A.3.1.1; Lemmas A.3.2.1–A.3.3.1</text>
</svg>