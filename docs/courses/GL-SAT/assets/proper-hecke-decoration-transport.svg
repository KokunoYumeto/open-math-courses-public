<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Projective Hecke transport retains the data</text>
<text x="310" y="84" font-size="19" text-anchor="middle">char(k)=p; char(E)=0; ℓ≠p; ψ:F_p→E× nontrivial</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="23" text-anchor="middle">E → E′: type λ; inverse type λ*=−w₀λ</text>
<text x="310" y="198" font-size="21" text-anchor="middle">Frames: P_j(E), with actual finite G_j action</text>
<text x="310" y="237" font-size="25" text-anchor="middle">H_λ(E)=P_j(E) ×^(G_j) Z_λ</text>
<text x="310" y="276" font-size="20" text-anchor="middle">Closed in a relative Grassmannian: projective.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="25" text-anchor="middle">κ′=β_V κ as actual meromorphic maps</text>
<text x="310" y="443" font-size="22" text-anchor="middle">Pole bounds increase by at most c(V,λ).</text>
<text x="310" y="482" font-size="20" text-anchor="middle">Tensor identities and central inverses persist.</text>
<text x="310" y="521" font-size="20" text-anchor="middle">Both source and target squares are Cartesian.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="26" text-anchor="middle">Y_x ← l — 𝒵_λ — r → Y_x</text>
<text x="310" y="688" font-size="20" text-anchor="middle">Both projections are representably projective.</text>
<text x="310" y="727" font-size="20" text-anchor="middle">H_A(F)=Rl_!(r*F⊗A_left)=Rl_*(r*F⊗A_left)</text>
<text x="310" y="766" font-size="20" text-anchor="middle">Inverse frames change λ to λ*, including centre.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="23" text-anchor="middle">Full chains give H_A H_B ≅ H_(A*B).</text>
<text x="310" y="933" font-size="22" text-anchor="middle">Same proper images, units and Frobenius.</text>
<text x="310" y="972" font-size="24" text-anchor="middle">GL₂: A¹×P¹ is proper over A¹.</text>
<text x="310" y="1011" font-size="21" text-anchor="middle">Its A¹×A¹ highest chart alone is not proper.</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Theorems H.1.1.1 and H.3.1.1; Proposition H.2.1.1.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">Exercise H.8.1 retains the entire projective modification.</text>
</svg>