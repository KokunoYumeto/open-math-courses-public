<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Central inverse maps retain nilpotent loops</text>
<text x="310" y="84" font-size="19" text-anchor="middle">A arbitrary/k; x=0; actual central line O(−1)</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="22" text-anchor="middle">v_∞=t⁻¹v₀ for O(−1); dual frame v₀∨</text>
<text x="310" y="198" font-size="23" text-anchor="middle">κ⁺=(b t⁻²+c t⁻¹)v₀; pole bound two</text>
<text x="310" y="237" font-size="23" text-anchor="middle">κ⁻=(e+d t)v₀∨; pole bound zero</text>
<text x="310" y="276" font-size="19" text-anchor="middle">These are the entire two global Laurent ranges.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="24" text-anchor="middle">κ⁺κ⁻=1 as an actual line-map identity</text>
<text x="310" y="443" font-size="29" text-anchor="middle">be=0; bd+ce=0; cd=1</text>
<text x="310" y="482" font-size="20" text-anchor="middle">Each coefficient is an equation on every A.</text>
<text x="310" y="521" font-size="21" text-anchor="middle">The constant term retains the tensor unit.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="25" text-anchor="middle">c∈A×; d=c⁻¹; b=−c²e; e²=0</text>
<text x="310" y="688" font-size="20" text-anchor="middle">Spec k[c,c⁻¹,e]/e² is the full solution scheme.</text>
<text x="310" y="727" font-size="19" text-anchor="middle">Every solution and its actual inverse are retained.</text>
<text x="310" y="766" font-size="21" text-anchor="middle">Reduced points alone discard the e-direction.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="25" text-anchor="middle">c=1, e=ε, ε²=0: b=−ε, d=1</text>
<text x="310" y="933" font-size="23" text-anchor="middle">κ⁺=(t⁻¹−ε t⁻²)v₀; κ⁻=(t+ε)v₀∨</text>
<text x="310" y="972" font-size="18" text-anchor="middle">Their actual product is 1, also in characteristic 2.</text>
<text x="310" y="1011" font-size="20" text-anchor="middle">Pole bound one gives the closed immersion e=0.</text>
<text x="310" y="1127" font-size="19" text-anchor="middle">Proposition I.2.1.1; Exercise I.4.2.</text>
<text x="310" y="1167" font-size="18" text-anchor="middle">The actual units and every parameter nilpotent are retained.</text>
</svg>