<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem64; Exercise64", "normalized_relative_inputs": true, "K_inputs": 9, "P_inputs": 7, "intersection_inputs": 5, "union_inputs": 11, "ambient_inputs": 13, "quotient_degrees": {"u": -1, "v": -2}, "quotient_differential": "dv=-u", "quotient_homotopy": "hu=-v", "original_input": "q_P=-sM+x", "canonical_input": "q_K=-sM+x-y", "original_delta_closed_R_coefficient": -4, "calibrated_coefficient": "-1/4"}</metadata><text x="310" y="40" font-size="24" fill="#172554" text-anchor="middle">Retain both whole parameter inputs</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">Canonical tensor and original triangle · full normalized data</text><rect x="18" y="104" width="584" height="270" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="21" fill="#2563eb" text-anchor="middle">K (9 inputs)  →  Q (11 inputs)  ←  BP (7 inputs)</text><text x="310" y="191" font-size="20" fill="#172554" text-anchor="middle">I = K ∩ BP:   3 objects and the 2 shared axes</text><text x="310" y="235" font-size="21" fill="#172554" text-anchor="middle">q_P = −sM + x;       q_K = −sM + x − y</text><text x="310" y="279" font-size="24" fill="#15803d" text-anchor="middle">b q_P = −sBA;       b q_K = 0</text><text x="310" y="324" font-size="22" fill="#172554" text-anchor="middle">x = sa₁|sb₀;      y = sb₁|sa₀</text><rect x="18" y="395" width="584" height="262" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="437" font-size="21" fill="#15803d" text-anchor="middle">Only two input directions remain in C / Q</text><text x="310" y="484" font-size="20" fill="#172554" text-anchor="middle">u = [sAB],  |u| = −1;    v = [sM],  |v| = −2</text><text x="310" y="531" font-size="24" fill="#172554" text-anchor="middle">dv = −u;      h(u) = −v;      h(v) = 0</text><text x="310" y="577" font-size="23" fill="#2563eb" text-anchor="middle">Hφ = (−1)^|φ| φh;      DH + HD = 1</text><text x="310" y="623" font-size="18" fill="#172554" text-anchor="middle">No target mapping space is declared acyclic.</text><rect x="18" y="678" width="584" height="307" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="719" font-size="21" fill="#2563eb" text-anchor="middle">A closed lift retains both prescribed restrictions</text><text x="310" y="763" font-size="27" fill="#172554" text-anchor="middle">φ = φ₀ − H Dφ₀</text><text x="310" y="808" font-size="20" fill="#172554" text-anchor="middle">The original direct δ-core remains separate.</text><text x="310" y="852" font-size="25" fill="#15803d" text-anchor="middle">Model δ-core:  −4 X(z ⊗ z)</text><text x="310" y="896" font-size="22" fill="#172554" text-anchor="middle">Canonical K-restriction: identity</text><text x="310" y="944" font-size="19" fill="#172554" text-anchor="middle">Full calibration retains the coefficient −1/4.</text><text x="310" y="1030" font-size="16" fill="#b91c1c" text-anchor="middle">Replacing q_P by q_K gives the nonzero chain defect +sBA.</text><text x="310" y="1069" font-size="15" fill="#172554" text-anchor="middle">The auxiliary state 10 belongs to T, never to the original P.</text><text x="310" y="1105" font-size="13" fill="#172554" text-anchor="middle">Whole input union, exact kernel and original-prism retention: §64.</text></g></svg>