<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">The full torus quotient is projective</text>
<text x="310" y="84" font-size="18" text-anchor="middle">P¹_R; R Noetherian; split G with simply connected derived group</text>
<rect x="28" y="120" width="564" height="190" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="159" font-size="20" text-anchor="middle">Central unit maps have their actual inverses.</text>
<text x="310" y="198" font-size="21" text-anchor="middle">Degree zero ⇒ M_c=p*P_c; P_c invertible.</text>
<text x="310" y="237" font-size="20" text-anchor="middle">Isomorphisms form the central frame torsor.</text>
<text x="310" y="276" font-size="20" text-anchor="middle">Fix frames faithfully flatly, then descend.</text>
<path d="M310,324 L310,352" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="365" width="564" height="190" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="404" font-size="22" text-anchor="middle">Choose distinct reduced sampling points D.</text>
<text x="310" y="443" font-size="23" text-anchor="middle">S(V_j) ↪ A(Γ(D,V_j|_D)) is closed.</text>
<text x="310" y="482" font-size="18" text-anchor="middle">The full cone is finite over fundamental values.</text>
<text x="310" y="521" font-size="22" text-anchor="middle">Hence D_full → A_fund is finite.</text>
<path d="M310,569 L310,597" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="610" width="564" height="190" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="649" font-size="23" text-anchor="middle">Generic nonzero: D⁺ → A⁺ is finite.</text>
<text x="310" y="688" font-size="22" text-anchor="middle">A⁺ → ∏ Proj Sym(P_i⁰)∨/(d_i∨)</text>
<text x="310" y="727" font-size="21" text-anchor="middle">is the actual (G_m)^r frame torsor.</text>
<text x="310" y="766" font-size="20" text-anchor="middle">D⁺/T is finite over that projective product.</text>
<path d="M310,814 L310,842" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="855" width="564" height="190" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="894" font-size="19" text-anchor="middle">Finite inverse images of affine charts are affine.</text>
<text x="310" y="933" font-size="19" text-anchor="middle">Clear denominators for their finite generators.</text>
<text x="310" y="972" font-size="18" text-anchor="middle">A power of the pulled-back ample line embeds.</text>
<text x="310" y="1011" font-size="20" text-anchor="middle">The full compactification is projective over R.</text>
<text x="310" y="1127" font-size="18" text-anchor="middle">Proposition K.1.1.1–Theorem K.4.1.1.</text>
<text x="310" y="1167" font-size="17" text-anchor="middle">Every map and quotient is defined on arbitrary parameter rings.</text>
</svg>