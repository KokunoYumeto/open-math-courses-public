<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Frobenius on the whole reconstructed group</text>
<rect x="28" y="82" width="564" height="215" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="126" font-size="24" text-anchor="middle">Geometric group PGL₂;  dual group SL₂</text>
<text x="310" y="170" font-size="28" text-anchor="middle">Raw minuscule IC: E_(P¹)[1]</text>
<text x="310" y="214" font-size="23" text-anchor="middle">Highest line E(−1): q;  lowest line E: 1</text>
<text x="310" y="258" font-size="32" text-anchor="middle">F = diag(q,1)</text>
<path d="M310,313 L310,346" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="362" width="564" height="207" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="406" font-size="33" text-anchor="middle">Φ(g) = F g F⁻¹</text>
<text x="310" y="450" font-size="29" text-anchor="middle">E₁₂ ↦ q E₁₂;  E₂₁ ↦ q⁻¹ E₂₁</text>
<text x="310" y="494" font-size="22" text-anchor="middle">Φ fixes the specified weight torus pointwise.</text>
<text x="310" y="546" font-size="20" text-anchor="middle">Lemma A.1.1.1 fixes the pullback direction.</text>
<path d="M310,585 L310,618" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="634" width="564" height="180" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="678" font-size="26" text-anchor="middle">Actual constant term: C_G → C_Mᵢ</text>
<text x="310" y="722" font-size="32" text-anchor="middle">Φ_G jᵢ = jᵢ Φ_Mᵢ</text>
<text x="310" y="766" font-size="19" text-anchor="middle">The common torus keeps the coroot tangent vector.</text>
<text x="310" y="791" font-size="18" text-anchor="middle">Its nonzero rank-one bracket keeps both root lines.</text>
<path d="M310,830 L310,863" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="879" width="564" height="187" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="923" font-size="27" text-anchor="middle">βᵢ = αᵢ∨;  dΦ_G on g_(βᵢ) is q</text>
<text x="310" y="967" font-size="24" text-anchor="middle">The negative simple line has scalar q⁻¹.</text>
<text x="310" y="1011" font-size="19" text-anchor="middle">Torus + simple root groups determine the whole map.</text>
<text x="310" y="1046" font-size="18" text-anchor="middle">All statements hold on every coefficient algebra.</text>
<text x="310" y="1122" font-size="19" text-anchor="middle">Lemmas A.1.1.1–A.2.1.1; Theorem A.3.1.1.</text>
<text x="310" y="1165" font-size="18" text-anchor="middle">Raw IC Weil maps need not already form a tensor family.</text>
</svg>