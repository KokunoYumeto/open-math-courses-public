<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem62; Exercise62", "interval": "de=1-0", "coaction": "rho(Sy)=1 tensor Sy-e tensor Yy", "kernel": "Hom(U/Y_U,G_V)", "coefficient_source": "L=Cyl(id_k), e=-S1", "ordinary_nullary_source": "k_0", "degree_zero_R": "f+z", "degree_one_R": "y"}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">Full comparisons compose in one dg category</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">Interval comodules retain every native matrix block.</text><rect x="18" y="104" width="584" height="248" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="144" font-size="22" fill="#2563eb" text-anchor="middle">ρ(Xx) = 1 ⊗ Xx;     ρ(Yy) = 0 ⊗ Yy</text><text x="310" y="189" font-size="25" fill="#2563eb" text-anchor="middle">ρ(Sy) = 1 ⊗ Sy − e ⊗ Yy</text><text x="310" y="234" font-size="17" fill="#172554" text-anchor="middle">de = 1 − 0;     0 is a basis vertex and the MAX unit.</text><text x="310" y="279" font-size="22" fill="#172554" text-anchor="middle">Ξᵣ(Sy) = (−1)ʳ⁺¹ XRy + (−1)ʳ SBy</text><text x="310" y="324" font-size="19" fill="#15803d" text-anchor="middle">Every A, B and R coordinate is retained.</text><rect x="18" y="373" width="584" height="241" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="413" font-size="22" fill="#15803d" text-anchor="middle">Eρ(U₁,…,Uₙ; V) = Hom_L(⊗Uᵢ,V)</text><text x="310" y="459" font-size="19" fill="#172554" text-anchor="middle">Ordinary tensor products and graft composition</text><text x="310" y="504" font-size="23" fill="#172554" text-anchor="middle">ker Π = Hom(U / Y_U, G_V)</text><text x="310" y="548" font-size="22" fill="#2563eb" text-anchor="middle">h(f) = (−1)^|f| f h̄_U;     δh + hδ = 1</text><text x="310" y="588" font-size="20" fill="#172554" text-anchor="middle">rᵢ = XRᵢ;     qᵢ = Ξ(Fᵢ)sᵢ</text><rect x="18" y="635" width="584" height="352" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="676" font-size="21" fill="#2563eb" text-anchor="middle">A geometric zero-input row has source L</text><text x="310" y="719" font-size="22" fill="#172554" text-anchor="middle">f₀(0) = Yy;     f₀(1) = Xy + Xg</text><text x="310" y="762" font-size="23" fill="#15803d" text-anchor="middle">f₀(e) = Xf + Xz − Sy;     R₀ = f + z</text><text x="310" y="808" font-size="22" fill="#172554" text-anchor="middle">f₁(0) = Yp;     f₁(1) = Xp</text><text x="310" y="850" font-size="23" fill="#15803d" text-anchor="middle">f₁(e) = −Xy + Sp;     R₁ = y</text><text x="310" y="897" font-size="19" fill="#172554" text-anchor="middle">|p| = 1;     df = g;     dz = dy = dp = 0</text><text x="310" y="945" font-size="18" fill="#172554" text-anchor="middle">The separate nullary map k₀ → Z sends 1 ↦ Yp.</text><text x="310" y="1030" font-size="20" fill="#2563eb" text-anchor="middle">J₁₂(Sy) = (r₁ ⊗ q₂)(y);     q₂ = Ξ(F₂)s₂</text><text x="310" y="1068" font-size="20" fill="#15803d" text-anchor="middle">K₁₂₃(Sy) = −(r₁ ⊗ r₂ ⊗ q₃)(y)</text><text x="310" y="1104" font-size="13" fill="#172554" text-anchor="middle">All product lengths and the specified triple filler: (62.20)–(62.28).</text></g></svg>