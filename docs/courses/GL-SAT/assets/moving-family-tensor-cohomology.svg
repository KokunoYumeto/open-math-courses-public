<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="25" text-anchor="middle">Moving points define the graded tensor map</text>
<text x="310" y="82" font-size="24" text-anchor="middle">B = A²_(a,b);   disc coordinate t−b</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="23" text-anchor="middle">Finite frames of the first moving bundle</text>
<text x="310" y="195" font-size="25" text-anchor="middle">𝒴 = E_n^B ×^(J_nG) X₂ → X₁ × B</text>
<text x="310" y="237" font-size="20" text-anchor="middle">Equivariant Plücker embedding ⇒ projective.</text>
<text x="310" y="275" font-size="21" text-anchor="middle">τ : 𝒴 → B is proper; charts pull P ⊠ Q.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="19" text-anchor="middle">Off diagonal a≠b: the disc frame is canonical.</text>
<text x="310" y="440" font-size="25" text-anchor="middle">(𝒴,𝒜)|U = (X₁×X₂,P⊠Q) × U</text>
<text x="310" y="482" font-size="19" text-anchor="middle">H^r(Rτ_*𝒜)|U = ⊕_(i+j=r) H^i(P)⊗H^j(Q)</text>
<text x="310" y="518" font-size="21" text-anchor="middle">This is the actual ordered Künneth map.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="23" text-anchor="middle">Local models + proper ULA + normality</text>
<text x="310" y="683" font-size="20" text-anchor="middle">j_*V_U = V_B; the comparison extends uniquely.</text>
<text x="310" y="725" font-size="26" text-anchor="middle">At (0,0): 𝒴₀ = X₁ ~× X₂.</text>
<text x="310" y="761" font-size="20" text-anchor="middle">The common [2] base shift has been removed.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="26" text-anchor="middle">μ_(P,Q) : H(P)⊗H(Q) ≃ H(P*Q)</text>
<text x="310" y="927" font-size="20" text-anchor="middle">A³: distinct points → partial → full diagonal.</text>
<text x="310" y="968" font-size="20" text-anchor="middle">Both groupings use the same proper counits.</text>
<text x="310" y="1001" font-size="17" text-anchor="middle">The constant comparison retains associativity and units.</text>
<text x="310" y="1058" font-size="23" text-anchor="middle">Grading and Tate lines are retained.</text>
<text x="310" y="1098" font-size="21" text-anchor="middle">The sheaf-level symmetry requires fusion.</text>
<text x="310" y="1140" font-size="20" text-anchor="middle">Lemma C.3.1.1; Theorems C.4.1.1–C.4.2.1</text>
</svg>