<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="20" fill="#172554" text-anchor="middle">Joint grafting retains its complete compatible domain</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.64: execution prerequisites and actual bar words</text><rect x="25" y="105" width="570" height="340" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="21" fill="#172554" text-anchor="middle">One unit below a unary operation</text><text x="130" y="211" font-size="27" fill="#172554" text-anchor="middle">00</text><text x="490" y="211" font-size="27" fill="#172554" text-anchor="middle">01</text><text x="130" y="331" font-size="27" fill="#b91c1c" text-anchor="middle">10</text><text x="490" y="331" font-size="27" fill="#172554" text-anchor="middle">11</text><path d="M164,204 L453,204 M440.0,210.0 L453,204 L440.0,198.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="310" y="189" font-size="16" fill="#15803d" text-anchor="middle">α: inner unit executes</text><path d="M490,231 L490,298 M484.0,285.0 L490,298 L496.0,285.0" fill="none" stroke="#15803d" stroke-width="3"/><text x="393" y="269" font-size="16" fill="#15803d" text-anchor="middle">β: outer executes</text><path d="M130,231 L130,298 M124.0,285.0 L130,298 L136.0,285.0" fill="none" stroke="#b91c1c" stroke-width="3"/><text x="231" y="274" font-size="16" fill="#b91c1c" text-anchor="middle">forbidden state</text><path d="M165,323 L453,323 M440.0,329.0 L453,323 L440.0,317.0" fill="none" stroke="#b91c1c" stroke-width="3"/><text x="310" y="368" font-size="18" fill="#172554" text-anchor="middle">Allowed: 00 → 01 → 11, and its diagonal δ</text><text x="310" y="401" font-size="23" fill="#172554" text-anchor="middle">b(sβ | sα) = −sδ ≠ 0</text><text x="310" y="430" font-size="16" fill="#172554" text-anchor="middle">Deleting the other shuffle term breaks the chain equation.</text><rect x="25" y="485" width="570" height="395" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="525" font-size="21" fill="#172554" text-anchor="middle">Two units below a binary operation</text><text x="310" y="547" font-size="15" fill="#172554" text-anchor="middle">States (outer,left,right); cover arrows shown</text><text x="310" y="574" font-size="25" fill="#172554" text-anchor="middle">000</text><text x="150" y="664" font-size="25" fill="#172554" text-anchor="middle">010</text><text x="470" y="664" font-size="25" fill="#172554" text-anchor="middle">001</text><text x="310" y="754" font-size="25" fill="#172554" text-anchor="middle">011</text><text x="310" y="824" font-size="25" fill="#172554" text-anchor="middle">111</text><path d="M280,586 L180,634 M189.12341334157892,622.9653577765883 L180,634 L194.3161861525962,633.7836344662077" fill="none" stroke="#15803d" stroke-width="3"/><path d="M340,586 L440,634 M425.6838138474038,633.7836344662077 L440,634 L430.87658665842105,622.9653577765883" fill="none" stroke="#15803d" stroke-width="3"/><path d="M180,675 L280,723 M265.6838138474038,722.7836344662077 L280,723 L270.87658665842105,711.9653577765883" fill="none" stroke="#15803d" stroke-width="3"/><path d="M440,675 L340,723 M349.12341334157895,711.9653577765883 L340,723 L354.3161861525962,722.7836344662077" fill="none" stroke="#15803d" stroke-width="3"/><path d="M310,768 L310,795 M304.0,782.0 L310,795 L316.0,782.0" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="111" y="724" font-size="15" fill="#172554" text-anchor="middle">frontier 1</text><text x="509" y="724" font-size="15" fill="#172554" text-anchor="middle">frontier 1</text><text x="410" y="780" font-size="15" fill="#7c3aed" text-anchor="middle">2 inputs → 1 output</text><text x="310" y="857" font-size="17" fill="#172554" text-anchor="middle">Full bar: 5 + 9 + 7 + 2 = 23 words; safe tensor: 11</text><rect x="25" y="905" width="570" height="150" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="945" font-size="18" fill="#172554" text-anchor="middle">A complete shuffle must retain every interleaving.</text><text x="310" y="985" font-size="18" fill="#172554" text-anchor="middle">Outer final requirements ⊆ inner initially complete</text><text x="310" y="1025" font-size="16" fill="#172554" text-anchor="middle">The full graft map retains joint arrows and all higher strings.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Lemma C.64.1.1; Theorems C.64.2.1–3.1; Exercises C.64.4.1–2.</text></g></svg>