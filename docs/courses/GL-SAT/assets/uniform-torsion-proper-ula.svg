<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="24" text-anchor="middle">Uniform torsion proves the rational comparison</text>
<text x="310" y="82" font-size="24" text-anchor="middle">Y → Z → B,   m : Y → Z proper</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="21" text-anchor="middle">Finite étale charts have integral ULA models.</text>
<text x="310" y="195" font-size="26" text-anchor="middle">T_j = Cone(A_O|V_j → K_j)</text>
<text x="310" y="237" font-size="24" text-anchor="middle">T_j[1/π] = 0  ⇒  π^N · 1_(T_j) = 0</text>
<text x="310" y="275" font-size="21" text-anchor="middle">Choose one N for the finite cover.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="23" text-anchor="middle">Φ_m = Cone(A_m|Y_s → nearby image)</text>
<text x="310" y="440" font-size="26" text-anchor="middle">π^N kills every H^q(Φ_m).</text>
<text x="310" y="482" font-size="21" text-anchor="middle">Φ_m lies in [b−1,c+d];   L = c−b+d+2.</text>
<text x="310" y="518" font-size="22" text-anchor="middle">Truncation gives π^(NL) · 1_(Φ_m) = 0.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="24" text-anchor="middle">Actual finite proper comparison</text>
<text x="310" y="683" font-size="24" text-anchor="middle">Φ_m(Rm_*A_O) = Rm_s* Φ_m(A_O)</text>
<text x="310" y="725" font-size="22" text-anchor="middle">The same π^(NL) kills the image cone.</text>
<text x="310" y="761" font-size="19" text-anchor="middle">The bound is independent of coefficient level m.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="22" text-anchor="middle">Pull the constructible M_O = Rm_*A_O.</text>
<text x="310" y="927" font-size="23" text-anchor="middle">Its actual local sections are complete.</text>
<text x="310" y="968" font-size="22" text-anchor="middle">Milnor: π^(2NL) kills H^q(holim C_m).</text>
<text x="310" y="1001" font-size="19" text-anchor="middle">Rationalization makes the restriction invertible.</text>
<text x="310" y="1058" font-size="23" text-anchor="middle">Example: [−3,4], N=2 ⇒ π¹⁶ then π³².</text>
<text x="310" y="1098" font-size="21" text-anchor="middle">All parameter changes retain the same bound.</text>
<text x="310" y="1140" font-size="18" text-anchor="middle">Lemma C.2.1.1; Theorem C.2.2.1; Exercise C.5.2</text>
</svg>