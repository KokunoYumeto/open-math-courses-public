<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Moving generators across every collision partition</text><text x="310" y="76" font-size="18" fill="#172554" text-anchor="middle">Bₙ = AⁿS;  f(u) = ∏(u−xᵢ);  Uₙ = all points distinct.</text><rect x="25" y="103" width="570" height="302" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="145" font-size="19" fill="#172554" text-anchor="middle">1. Configuration compact support by closed diagonals</text><text x="310" y="188" font-size="21" fill="#172554" text-anchor="middle">Each diagonal intersection is an actual AᶜS.</text><text x="310" y="232" font-size="20" fill="#172554" text-anchor="middle">Finite closed-cover Čech → localization → K(Uₙ).</text><text x="310" y="276" font-size="23" fill="#172554" text-anchor="middle">K(Uₙ) is a perfect constant; C.28.1.1.</text><text x="310" y="319" font-size="17" fill="#172554" text-anchor="middle">U₃ has compact ranks 2, 3, 1 in degrees 4, 5, 6.</text><text x="310" y="362" font-size="19" fill="#172554" text-anchor="middle">Tate twists: −1, −2, −3; C.28.4.1.</text><text x="310" y="391" font-size="15" fill="#172554" text-anchor="middle">A toric-cell paving of U₃ would contradict q(q−1)(q−2).</text><rect x="25" y="437" width="570" height="279" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="479" font-size="19" fill="#172554" text-anchor="middle">2. Retain flags and walls inside each collision block</text><text x="310" y="524" font-size="19" fill="#172554" text-anchor="middle">Final wall fibre: closed F(v), open A¹S × F(vs).</text><text x="310" y="567" font-size="18" fill="#172554" text-anchor="middle">Flag insertion is the original affine-flag pullback.</text><text x="310" y="611" font-size="17" fill="#172554" text-anchor="middle">Endpoint root sections trivialize both source fibres.</text><text x="310" y="653" font-size="21" fill="#172554" text-anchor="middle">Pair over a root cell = cell × Fᵢ × Fⱼ.</text><text x="310" y="693" font-size="19" fill="#172554" text-anchor="middle">Actual relative affine filtrations; C.28.2.1.</text><rect x="25" y="750" width="570" height="299" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="791" font-size="20" fill="#172554" text-anchor="middle">3. Moving frame jets grow when points collide</text><text x="310" y="834" font-size="23" fill="#172554" text-anchor="middle">Qₙ,N(A) = G(A[u]/fᴺ);   D = nN dim G</text><text x="310" y="877" font-size="21" fill="#172554" text-anchor="middle">On partition π:  Qₙ,N = ∏C∈π JN|C|G</text><text x="310" y="918" font-size="26" fill="#172554" text-anchor="middle">Hom q ≃ Dₑ K(pair q)</text><text x="310" y="957" font-size="25" fill="#172554" text-anchor="middle">[−2qD−Rᵢ−Rⱼ](−qD−Rⱼ)</text><text x="310" y="1000" font-size="17" fill="#172554" text-anchor="middle">Rᵢ = n+n dim F+wall length; Dₑ = RHomE(−,E)</text><text x="310" y="1035" font-size="16" fill="#172554" text-anchor="middle">Full nerve; lower bound Rᵢ+Rⱼ−2 dim(pair₀); C.28.3.1.</text><text x="310" y="1085" font-size="17" fill="#172554" text-anchor="middle">Distinct GL₁ frames: Gm²; colliding frames: Gm × Ga.</text><text x="310" y="1110" font-size="15" fill="#172554" text-anchor="middle">The full moving IC fusion diagram remains a further argument.</text></g></svg>