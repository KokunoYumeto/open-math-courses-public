<text x="38" y="792" font-size="15">Lift the actual B → H/J<tspan baseline-shift="super" font-size="10">N</tspan> map for the selected N.</text>
<text x="38" y="832" font-family="Cambria,Georgia,serif" font-size="22">f<tspan baseline-shift="sub" font-size="13">j</tspan>(x) = 0 in H,   x<tspan baseline-shift="sub" font-size="13">i</tspan> − x̂<tspan baseline-shift="sub" font-size="13">i</tspan> ∈ J<tspan baseline-shift="super" font-size="13">N</tspan>T.</text>
<text x="38" y="869" font-size="15">The algebra map C → B → H preserves every relation.</text>
<text x="38" y="896" font-size="15">Its reduction agrees with the specified C → T solution.</text>

<text x="28" y="955" font-size="13">Proof: Theorems H.5.3.1, H.6.2.1, H.6.4.1 and H.2.2.1.</text>
