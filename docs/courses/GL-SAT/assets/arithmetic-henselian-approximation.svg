<title>Regular completion and exact henselian approximation</title>
<desc>The common completion of an arithmetic pair and its pair henselization is faithfully flat and regular over the henselization. A finite equation algebra factors through a smooth algebra; lifting its actual residue section gives exact equations with prescribed residues.</desc>
