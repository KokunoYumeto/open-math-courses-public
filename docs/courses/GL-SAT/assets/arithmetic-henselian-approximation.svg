<text x="28" y="65" font-size="23" font-weight="700">henselian approximation</text>
<text x="28" y="101" font-size="15">A is finite type over ℤ; I is an ideal.</text>
<text x="28" y="126" font-size="15">H = A<tspan baseline-shift="sub" font-size="11">I</tspan><tspan baseline-shift="super" font-size="11">h</tspan>; J = IH; T is their common completion along I and J.</text>

