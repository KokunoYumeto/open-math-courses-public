<text x="155" y="276" font-size="14">ind-étale</text>
<text x="353" y="276" font-size="14">faithfully flat, regular</text>
<text x="171" y="332" font-size="15">≅</text><text x="385" y="332" font-size="15">≅</text>
<text x="38" y="388" font-size="14">For every N ≥ 1, the lower maps are canonical isomorphisms.</text>

<rect x="20" y="433" width="580" height="273" rx="12" fill="#ecf7f4" stroke="#83bdaf" stroke-width="1.5"/>
<text x="38" y="463" font-size="18" font-weight="700">2. Factor through a smooth algebra</text>
<text x="38" y="491" font-size="14">C = H[X]/(f); C may have a singular closed fibre.</text>
