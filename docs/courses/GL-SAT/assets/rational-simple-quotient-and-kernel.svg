<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="42" font-size="22" text-anchor="middle">Simple ICs give a canonical finite reductive quotient</text>
<text x="310" y="81" font-size="23" text-anchor="middle">X = ⊕ I_λᵢ;  λᵢ generate the dominant monoid</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="151" font-size="18" text-anchor="middle">Both central signs and finitely many remainders occur.</text>
<text x="310" y="193" font-size="18" text-anchor="middle">Each I_λ is a subquotient of a convolution word in X.</text>
<text x="310" y="236" font-size="23" text-anchor="middle">A_R ⊂ A_E: coefficients of H(X) and det⁻¹</text>
<text x="310" y="275" font-size="21" text-anchor="middle">G̃_E → R_E is faithfully flat; H(X) is faithful.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="396" font-size="23" text-anchor="middle">R_E is smooth and geometrically connected.</text>
<text x="310" y="440" font-size="19" text-anchor="middle">A normal unipotent U fixes a vector in each simple.</text>
<text x="310" y="480" font-size="19" text-anchor="middle">Normality makes that fixed space the entire simple.</text>
<text x="310" y="518" font-size="23" text-anchor="middle">Faithfulness gives U=1: R_E is reductive.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="640" font-size="24" text-anchor="middle">All simple IC coefficients lie in A_R.</text>
<text x="310" y="682" font-size="27" text-anchor="middle">Finite IC sums ≃ Rep_E(R_E)</text>
<text x="310" y="724" font-size="23" text-anchor="middle">IC convolution products are semisimple.</text>
<text x="310" y="761" font-size="18" text-anchor="middle">This does not split every extension in the whole heart.</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="884" font-size="23" text-anchor="middle">Finite stages: Gᵢ → R_E,  Uᵢ=ker(Gᵢ→R_E)</text>
<text x="310" y="926" font-size="20" text-anchor="middle">Uᵢ embeds schematically in a unitriangular group.</text>
<text x="310" y="966" font-size="26" text-anchor="middle">Gᵢ × Uᵢ ≃ Gᵢ ×_(R_E) Gᵢ</text>
<text x="310" y="1001" font-size="19" text-anchor="middle">The full kernel still requires a separate argument.</text>
<text x="310" y="1056" font-size="21" text-anchor="middle">Example: (r,u)(a,v)=(a,rv+au) on E⊕V.</text>
<text x="310" y="1096" font-size="20" text-anchor="middle">Its simple factors miss the nonsplit additive kernel.</text>
<text x="310" y="1139" font-size="16" text-anchor="middle">Theorem B.2.1.1; Corollary B.2.3.1; Proposition B.3.1.1</text>
</svg>