<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1200" viewBox="0 0 620 1200"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1200" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="24" fill="#172554" text-anchor="middle">The two braid routes have the same sign</text><text x="310" y="77" font-size="19" fill="#172554" text-anchor="middle">x,y,z have odd degrees; one common base E[3]</text><rect x="26" y="110" width="568" height="230" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="152" font-size="17" fill="#172554" text-anchor="middle">s₁ s₂ s₁: each adjacent interchange contributes −1</text><text x="77" y="222" font-size="26" fill="#172554" text-anchor="middle">xyz</text><text x="233" y="222" font-size="26" fill="#172554" text-anchor="middle">yxz</text><text x="389" y="222" font-size="26" fill="#172554" text-anchor="middle">yzx</text><text x="545" y="222" font-size="26" fill="#172554" text-anchor="middle">zyx</text><path d="M106,214 L201,214" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="155.0" y="261" font-size="18" fill="#172554" text-anchor="middle">s₁ : −</text><path d="M262,214 L357,214" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="311.0" y="261" font-size="18" fill="#172554" text-anchor="middle">s₂ : −</text><path d="M418,214 L513,214" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="467.0" y="261" font-size="18" fill="#172554" text-anchor="middle">s₁ : −</text><rect x="26" y="370" width="568" height="230" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="412" font-size="17" fill="#172554" text-anchor="middle">s₂ s₁ s₂: the same three pairs are interchanged</text><text x="77" y="485" font-size="26" fill="#172554" text-anchor="middle">xyz</text><text x="233" y="485" font-size="26" fill="#172554" text-anchor="middle">xzy</text><text x="389" y="485" font-size="26" fill="#172554" text-anchor="middle">zxy</text><text x="545" y="485" font-size="26" fill="#172554" text-anchor="middle">zyx</text><path d="M106,477 L201,477" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="155.0" y="524" font-size="18" fill="#172554" text-anchor="middle">s₂ : −</text><path d="M262,477 L357,477" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="311.0" y="524" font-size="18" fill="#172554" text-anchor="middle">s₁ : −</text><path d="M418,477 L513,477" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="467.0" y="524" font-size="18" fill="#172554" text-anchor="middle">s₂ : −</text><text x="310" y="306" font-size="17" fill="#172554" text-anchor="middle">Exponent: ab+ac+bc; graded reversal has sign −1</text><text x="310" y="569" font-size="17" fill="#172554" text-anchor="middle">Exponent: bc+ac+ab; graded reversal has sign −1</text><rect x="26" y="638" width="568" height="208" rx="18" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="681" font-size="23" fill="#172554" text-anchor="middle">Reversal has three inversions</text><text x="310" y="724" font-size="20" fill="#172554" text-anchor="middle">Graded sign −1 × component sign −1 = +1</text><text x="310" y="769" font-size="19" fill="#172554" text-anchor="middle">The adjusted map is ordinary factor reversal.</text><text x="310" y="812" font-size="17" fill="#172554" text-anchor="middle">The square of an adjacent interchange is the identity.</text><rect x="26" y="882" width="568" height="213" rx="18" fill="white" stroke="#d97706" stroke-width="2"/><text x="310" y="925" font-size="21" fill="#172554" text-anchor="middle">Keep the common base normalization fixed</text><text x="310" y="971" font-size="18" fill="#172554" text-anchor="middle">Permutation acts on E[3] by its identity comparison.</text><text x="310" y="1013" font-size="17" fill="#172554" text-anchor="middle">No sign from swapping separately shifted curve factors.</text><text x="310" y="1056" font-size="18" fill="#172554" text-anchor="middle">A unit has degree 0 and every interchange sign +1.</text><text x="310" y="1141" font-size="17" fill="#172554" text-anchor="middle">Theorems C.4.1.1–C.6.1.1; Exercise C.7.3.</text><text x="310" y="1174" font-size="16" fill="#172554" text-anchor="middle">Every degree, original component parity and Tate line is retained.</text></g></svg>