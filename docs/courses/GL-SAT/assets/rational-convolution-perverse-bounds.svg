<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="43" font-size="26" text-anchor="middle">Rational convolution: both perverse bounds</text>
<text x="310" y="80" font-size="20" text-anchor="middle">k algebraically closed,   ℓ invertible,   E/Q_ℓ finite</text>
<rect x="28" y="110" width="564" height="174" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="151" font-size="20" text-anchor="middle">Finite frame torsors π and q have dimension h_n.</text>
<text x="310" y="192" font-size="28" text-anchor="middle">q*A[h_n] = π*(P ⊠ Q)[h_n]</text>
<text x="310" y="231" font-size="27" text-anchor="middle">A|_frame = P|_U ⊠ Q</text>
<text x="310" y="266" font-size="21" text-anchor="middle">Both normalized shifts cancel in descent.</text>
<path d="M310,300 L310,338" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="352" width="564" height="180" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="393" font-size="23" text-anchor="middle">On the source stratum T_(α,β):</text>
<text x="310" y="436" font-size="23" text-anchor="middle">H^b(A|_T) = 0 for b &gt; −d_α −d_β.</text>
<text x="310" y="477" font-size="23" text-anchor="middle">For x ∈ O_δ,  F_x = m⁻¹(x):</text>
<text x="310" y="513" font-size="21" text-anchor="middle">2 dim(F_x ∩ T_(α,β)) ≤ d_α + d_β −d_δ</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="174" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="640" font-size="22" text-anchor="middle">Compact cohomology adds at most 2 dim.</text>
<text x="310" y="684" font-size="24" text-anchor="middle">b + 2 dim(F_x ∩ T_(α,β)) ≤ −d_δ</text>
<text x="310" y="724" font-size="22" text-anchor="middle">Localization assembles the proper fiber.</text>
<text x="310" y="759" font-size="19" text-anchor="middle">Proper base change gives the upper stalk bound.</text>
<path d="M310,789 L310,826" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="840" width="564" height="172" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="881" font-size="29" text-anchor="middle">D(P*Q) = DP*DQ</text>
<text x="310" y="924" font-size="18" text-anchor="middle">Apply the same bound to DP,DQ for the lower bound.</text>
<text x="310" y="960" font-size="19" text-anchor="middle">P*Q is perverse; input triangles give exactness.</text>
<text x="310" y="996" font-size="17" text-anchor="middle">Finite frames descend the genuine action and cocycle.</text>
<text x="310" y="1052" font-size="19" text-anchor="middle">Unit and associativity: the same chain correspondence.</text>
<text x="310" y="1087" font-size="23" text-anchor="middle">Largest IC constituent: multiplicity one.</text>
<text x="310" y="1135" font-size="20" text-anchor="middle">Theorems A.4.2.1 and A.6.1.1–A.6.3.1</text>
</svg>