<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="21" fill="#172554" text-anchor="middle">Canonical input squares; exact module products</text><text x="310" y="77" font-size="19" fill="#172554" text-anchor="middle">ψ = sh ∘ (η^(⊗n) ⊗ id(index));   q = Ωg</text><rect x="25" y="104" width="570" height="300" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="21" fill="#172554" text-anchor="middle">1. The canonical square commutes exactly</text><text x="154" y="205" font-size="20" fill="#172554" text-anchor="middle">C^(⊗n) ⊗ Dᵢ</text><text x="458" y="205" font-size="20" fill="#172554" text-anchor="middle">B(Uc^n ⊗ kI)</text><text x="154" y="310" font-size="20" fill="#172554" text-anchor="middle">D^(⊗n) ⊗ Dᵢ</text><text x="458" y="310" font-size="20" fill="#172554" text-anchor="middle">B(Ud^n ⊗ kI)</text><path d="M261,196 L349,196 M336.0,202.0 L349,196 L336.0,190.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M261,301 L349,301 M336.0,307.0 L349,301 L336.0,295.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M154,221 L154,277 M148.0,264.0 L154,277 L160.0,264.0" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M458,221 L458,277 M452.0,264.0 L458,277 L464.0,264.0" fill="none" stroke="#2563eb" stroke-width="3"/><text x="310" y="178" font-size="16" fill="#172554" text-anchor="middle">ψC</text><text x="310" y="334" font-size="16" fill="#172554" text-anchor="middle">ψD</text><text x="74" y="253" font-size="16" fill="#172554" text-anchor="middle">g^n</text><text x="542" y="253" font-size="16" fill="#172554" text-anchor="middle">B(q^n)</text><text x="310" y="381" font-size="17" fill="#172554" text-anchor="middle">The index maps are identities throughout: C.43.1.</text><rect x="25" y="438" width="570" height="233" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="481" font-size="18" fill="#172554" text-anchor="middle">2. An index arrow can act as the scalar identity</text><text x="310" y="528" font-size="23" fill="#172554" text-anchor="middle">F♯(t(sa)) = 1, not 0</text><text x="310" y="575" font-size="22" fill="#172554" text-anchor="middle">d t(sb|sa) = −t(sc) + t(sb)t(sa)</text><text x="310" y="620" font-size="21" fill="#172554" text-anchor="middle">Its actual image is −1 + 1 = 0.</text><text x="310" y="660" font-size="16" fill="#172554" text-anchor="middle">Full unital twisting outputs: C.43.2 and C.43.4.1.</text><rect x="25" y="715" width="570" height="310" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="759" font-size="18" fill="#172554" text-anchor="middle">3. Choose module contractions before graft transfer</text><text x="310" y="805" font-size="16" fill="#172554" text-anchor="middle">δ merges at least two crosses; one-cross maps stay fixed.</text><text x="310" y="851" font-size="24" fill="#172554" text-anchor="middle">T̄P = (⊗ K(P′ᵢTᵢIᵢ))[1]</text><text x="310" y="897" font-size="21" fill="#172554" text-anchor="middle">sy₂₁|sx₁₀ → sx₂₁|sx₁₀ → sq₂₀</text><text x="310" y="940" font-size="23" fill="#172554" text-anchor="middle">P∞(sy₂₁|sx₁₀) = −sq₂₀</text><text x="310" y="987" font-size="17" fill="#172554" text-anchor="middle">The complete graph keeps this higher projection.</text><text x="310" y="1065" font-size="16" fill="#172554" text-anchor="middle">C.43.3: exact product comparisons with full grafting retained.</text><text x="310" y="1104" font-size="15" fill="#172554" text-anchor="middle">C.43.4.2: actual dg graph, with even central cohomology.</text></g></svg>