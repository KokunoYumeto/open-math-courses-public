<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1160" viewBox="0 0 620 1160">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="620" height="100%" fill="#f8fafc"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#0f172a}</style>
<text x="310" y="44" font-size="22" text-anchor="middle">The tensor map retains every total-coweight projector</text>
<text x="310" y="82" font-size="24" text-anchor="middle">π : Z → A² proper;   K = Rm_* A</text>
<rect x="28" y="112" width="564" height="177" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="153" font-size="24" text-anchor="middle">Full character: χ_ν = C_N − b_V(ν)</text>
<text x="310" y="195" font-size="23" text-anchor="middle">Height: h_ν=〈2ρ,ν〉;   w_ν=C₀−qh_ν</text>
<text x="310" y="237" font-size="19" text-anchor="middle">Z_≤h uses the projective weights w ≥ C₀−qh.</text>
<text x="310" y="275" font-size="21" text-anchor="middle">Equal heights still have distinct full characters.</text>
<path d="M310,305 L310,342" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="356" width="564" height="177" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="310" y="397" font-size="20" text-anchor="middle">Each W_ν has cohomology only in degree h_ν.</text>
<text x="310" y="440" font-size="26" text-anchor="middle">Above h: vanish in h,h+1.</text>
<text x="310" y="482" font-size="26" text-anchor="middle">Below h: vanish in h−1,h.</text>
<text x="310" y="518" font-size="21" text-anchor="middle">Two localization maps become isomorphisms.</text>
<path d="M310,548 L310,585" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="599" width="564" height="177" rx="16" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="310" y="641" font-size="20" text-anchor="middle">Canonical injections give orthogonal projectors.</text>
<text x="310" y="683" font-size="22" text-anchor="middle">R^h π_*K is the specified constant sheaf.</text>
<text x="310" y="725" font-size="22" text-anchor="middle">Off D:  ⊕_(μ+η=ν) F_μ(P) ⊗ F_η(Q)</text>
<text x="310" y="761" font-size="29" text-anchor="middle">On D:  F_ν(P*Q)</text>
<path d="M310,792 L310,829" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="843" width="564" height="169" rx="16" fill="white" stroke="#d97706" stroke-width="2"/>
<text x="310" y="885" font-size="23" text-anchor="middle">The actual μ carries the same projectors.</text>
<text x="310" y="927" font-size="17" text-anchor="middle">Three-point maps retain associativity; grade 0 is the unit.</text>
<text x="310" y="968" font-size="18" text-anchor="middle">The component sign gives ordinary graded-label flip.</text>
<text x="310" y="1001" font-size="19" text-anchor="middle">Full coordinates commute with T and fix t^νK.</text>
<text x="310" y="1058" font-size="20" text-anchor="middle">GL₃: (1,0,1) and (0,2,0) both have height 0.</text>
<text x="310" y="1098" font-size="21" text-anchor="middle">Their distinct χ_ν separate the two summands.</text>
<text x="310" y="1140" font-size="17" text-anchor="middle">Lemma A.2.1.1; Theorem A.2.2.1; Exercises A.4.1,A.4.3</text>
</svg>