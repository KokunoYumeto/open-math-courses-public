<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">The tensor unit retains the full mapping complex</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.78: actual kernel, shifted Hom sign and full unit outputs</text><rect x="25" y="105" width="570" height="245" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="149" font-size="23" fill="#172554" text-anchor="middle">η : K = ⊗ᵢ B(full Aᵢ) → B(full T)</text><text x="310" y="193" font-size="23" fill="#172554" text-anchor="middle">r(η) : Nat(F,G) → Nat(K)(Fη,Gη)</text><text x="310" y="238" font-size="21" fill="#2563eb" text-anchor="middle">The actual restriction kernel is contracted.</text><text x="310" y="281" font-size="17" fill="#172554" text-anchor="middle">All scalar/unary terms and full transformation lengths remain.</text><text x="310" y="325" font-size="18" fill="#172554" text-anchor="middle">Native external comparisons are supplied, then lifted here.</text><rect x="25" y="390" width="570" height="325" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="433" font-size="22" fill="#172554" text-anchor="middle">The shifted Nat sign is necessary</text><text x="310" y="478" font-size="24" fill="#172554" text-anchor="middle">D₀φ = dφ + (−1)ʳ φb₀</text><text x="310" y="522" font-size="25" fill="#15803d" text-anchor="middle">H₀φ = (−1)ʳ⁺¹ φh(Q)</text><text x="310" y="566" font-size="23" fill="#172554" text-anchor="middle">u=sh,   v=s(x²),   w=sx|sx</text><text x="310" y="609" font-size="20" fill="#172554" text-anchor="middle">b(u)=v,   b(w)=−v,   η(sa|sa)=u+w</text><text x="310" y="652" font-size="22" fill="#172554" text-anchor="middle">g(u)=−1,   g(w)=1,   Hg(v)=1</text><text x="310" y="692" font-size="17" fill="#172554" text-anchor="middle">The opposite sign gives −f and differentiates to −g.</text><rect x="25" y="755" width="570" height="310" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="797" font-size="21" fill="#172554" text-anchor="middle">Ordinary unit outputs remain in the full bar</text><text x="310" y="845" font-size="23" fill="#172554" text-anchor="middle">η(sa ⊗ sb) = sz + sX|sY − sY|sX</text><text x="310" y="891" font-size="19" fill="#172554" text-anchor="middle">For a=1:   X=1, z=0, but the full output is</text><text x="310" y="938" font-size="29" fill="#7c3aed" text-anchor="middle">s1|sY − sY|s1</text><text x="310" y="981" font-size="17" fill="#172554" text-anchor="middle">A normalized Nat cochain evaluates both words to zero.</text><text x="310" y="1025" font-size="17" fill="#172554" text-anchor="middle">That evaluation does not delete the full coalgebra words.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Theorems C.78.1.1–2.1; Exercises C.78.3.1–2.</text></g></svg>