310" y="346" font-size="15" fill="#172554" text-anchor="middle">Every original da and db remains in ∂H.</text><rect x="17" y="392" width="586" height="284" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="433" font-size="19" fill="#15803d" text-anchor="middle">Four successive differences telescope to L − R</text><path d="M 53 492 L 171 492" stroke="#15803d" stroke-width="2"/><path d="M 165 488 L 172 492 L 165 496" stroke="#15803d" stroke-width="2" fill="none"/><text x="113.5" y="475" font-size="14" fill="#15803d" text-anchor="middle">σ_Ψ(a,vα)</text><path d="M 184 492 L 302 492" stroke="#15803d" stroke-width="2"/><path d="M 296 488 L 303 492 L 296 496" stroke="#15803d" stroke-width="2" fill="none"/><text x="244.5" y="475" font-size="14" fill="#15803d" text-anchor="middle">σ_Ψ(v,α)</text><path d="M 315 492 L 433 492" stroke="#15803d" stroke-width="2"/><path d="M 427 488 L 434 492 L 427 496" stroke="#15803d" stroke-width="2" fill="none"/><text x="375.5" y="475" font-size="14" fill="#15803d" text-anchor="middle">−ω_κ</text><path d="M 446 492 L 564 492" stroke="#15803d" stroke-width="2"/><path d="M 558 488 L 565 492 L 558 496" stroke="#15803d" stroke-width="2" fill="none"/><text x="506.5" y="475" font-size="14" fill="#15803d" text-anchor="middle">ν_κn(b)</text><circle cx="48" cy="492" r="4" fill="#15803d"/><text x="48" y="526" font-size="18" fill="#172554" text-anchor="middle">L</text><circle cx="179" cy="492" r="4" fill="#15803d"/><text x="179" y="526" font-size="18" fill="#172554" text-anchor="middle">S₁</text><circle cx="310" cy="492" r="4" fill="#15803d"/><text x="310" y="526" font-size="18" fill="#172554" text-anchor="middle">S₂</text><circle cx="441" cy="492" r="4" fill="#15803d"/><text x="441" y="526" font-size="18" fill="#172554" text-anchor="middle">S₃</text><circle cx="572" cy="492" r="4" fill="#15803d"/><text x="572" y="526" font-size="18" fill="#172554" text-anchor="middle">R</text><text x="310" y="571" font-size="16" fill="#172554" text-anchor="middle">Two functor homotopies · native graft cell · tensor naturality</text><text x="310" y="611" font-size="16" fill="#172554" text-anchor="middle">Input-degree signs are given in the complete formula.</text><text x="310" y="650" font-size="16" fill="#172554" text-anchor="middle">Higher mixed partitions are still a separate equation.</text><rect x="17" y="706" width="586" height="331" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="747" font-size="20" fill="#2563eb" text-anchor="middle">A required ordinary scalar output</text><text x="310" y="789" font-size="18" fill="#172554" text-anchor="middle">u = E_ef,  v = E_fe,  t = E_ye,  e = E_ee</text><text x="310" y="826" font-size="18" fill="#172554" text-anchor="middle">|u| = 1,  |v| = −1       d(v) = t,  uv = e</text><text x="310" y="873" font-size="22" fill="#172554" text-anchor="middle">b(su | sv) = se − su | st</text><text x="310" y="921" font-size="21" fill="#172554" text-anchor="middle">F₁(se) = s1       F₂(su | st) = s1</text><text x="310" y="972" font-size="22" fill="#15803d" text-anchor="middle">F b(su | sv) = s1 − s1 = 0</text><text x="310" y="1017" font-size="17" fill="#172554" text-anchor="middle">The second s1 is a higher output; it is retained.</text><text x="310" y="1080" font-size="13" fill="#172554" text-anchor="middle">Theorem 13 and Exercise 13. Original native comparison: C.48.</text><text x="310" y="1106" font-size="12" fill="#172554" text-anchor="middle">Free bar-convention background: Keller, arXiv:math/9910179.</text></g></svg>