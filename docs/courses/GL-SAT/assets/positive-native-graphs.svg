<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="310" y="39" font-size="23" fill="#172554" text-anchor="middle">Positive native inputs retain the whole unit</text><text x="310" y="78" font-size="17" fill="#172554" text-anchor="middle">C.79: the tower, a nonzero path and fixed covariance</text><rect x="25" y="105" width="570" height="270" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="149" font-size="23" fill="#172554" text-anchor="middle">Vₘ = Ω(C⊗ᵐ)   —ξₘ→   Pₘ = T(U,…,U)</text><text x="310" y="194" font-size="25" fill="#2563eb" text-anchor="middle">pₘ ξₘ = κₘ : Vₘ → U⊗ᵐ</text><text x="310" y="240" font-size="24" fill="#172554" text-anchor="middle">Δ̄d = c⊗c,   dz = x²</text><text x="310" y="281" font-size="28" fill="#172554" text-anchor="middle">ξ₁(z) = Z + H</text><text x="310" y="321" font-size="24" fill="#172554" text-anchor="middle">DZ = Y,   DH = X² − Y</text><text x="310" y="358" font-size="17" fill="#172554" text-anchor="middle">The higher unit term cancels the actual unary term.</text><rect x="25" y="412" width="570" height="290" rx="15" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="455" font-size="22" fill="#172554" text-anchor="middle">The native path has a third component</text><text x="310" y="502" font-size="24" fill="#172554" text-anchor="middle">F₀(w) = W,   F₁(w) = W + DH</text><text x="310" y="551" font-size="26" fill="#15803d" text-anchor="middle">w ↦ (W, W + DH, −H)</text><text x="310" y="598" font-size="23" fill="#172554" text-anchor="middle">−D(−H) + W − (W + DH) = 0</text><text x="310" y="645" font-size="17" fill="#172554" text-anchor="middle">Both projections under p are the same whole native map.</text><text x="310" y="683" font-size="18" fill="#172554" text-anchor="middle">Omitting −H leaves the nonzero defect −DH.</text><rect x="25" y="745" width="570" height="320" rx="15" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="310" y="788" font-size="22" fill="#172554" text-anchor="middle">Fixed product marks require covariance</text><text x="310" y="835" font-size="25" fill="#172554" text-anchor="middle">A₁ = Id,   A₃(a,a,a) = b</text><text x="310" y="878" font-size="17" fill="#172554" text-anchor="middle">|a|=1, |b|=3; zero differential; Δ = deconcatenation</text><text x="310" y="925" font-size="20" fill="#172554" text-anchor="middle">A is a chain coalgebra automorphism.</text><text x="310" y="970" font-size="21" fill="#7c3aed" text-anchor="middle">A(a shuffle aa) − A(a) shuffle A(aa) = b</text><text x="310" y="1020" font-size="18" fill="#172554" text-anchor="middle">A preserves a fixed graft μ only if A μ = μ A⊗ʳ.</text><text x="310" y="1102" font-size="15" fill="#172554" text-anchor="middle">Propositions C.79.1.1–3.1; Exercises C.79.4.1–3.</text></g></svg>