<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1120" viewBox="0 0 620 1120"><defs><clipPath id="grid"><rect x="115" y="140" width="390" height="360"/></clipPath><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><rect width="620" height="1120" fill="#f8fafc"/><g font-family="Arial, sans-serif"><metadata>{"proof": "Theorem71; Exercise71", "last_cut": "r(C)=max(C), r(empty)=a", "proper_identity_image": "{y} subset {x,y}, x&lt;y, maps to Id_y", "cone_homotopy": "L(Gamma)_q=(-1)^(degree(Gamma)+q+1)Gamma_(q+1)(o,sigma)", "graded_product": "L(Delta Gamma)=(-1)^degree(Delta) Delta L(Gamma)+L(Delta) Gamma_o", "auxiliary_original_word": [0, 8, 10, 14, 15], "F4_y": "-24t", "native_square": "delta K_Gamma=Gamma Theta_Q-Theta_E r*Gamma_P"}</metadata><text x="310" y="40" font-size="21" fill="#172554" text-anchor="middle">Original execution words and native cut families</text><text x="310" y="78" font-size="16" fill="#172554" text-anchor="middle">Full initial-cone comparison · all source words retained</text><rect x="18" y="104" width="584" height="254" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="146" font-size="22" fill="#2563eb" text-anchor="middle">Last-cut map on a proper refinement</text><text x="145" y="209" font-size="27" fill="#172554" text-anchor="middle">{y}</text><text x="471" y="209" font-size="27" fill="#172554" text-anchor="middle">{x,y}</text><path d="M 198 201 L 405 201" stroke="#15803d" stroke-width="3"/><text x="310" y="188" font-size="16" fill="#15803d" text-anchor="middle">refine; x &lt; y</text><text x="145" y="284" font-size="27" fill="#2563eb" text-anchor="middle">y</text><text x="471" y="284" font-size="27" fill="#2563eb" text-anchor="middle">y</text><path d="M 145 225 L 145 251 M 471 225 L 471 251" stroke="#2563eb" stroke-width="2"/><path d="M 198 276 L 405 276" stroke="#15803d" stroke-width="3"/><text x="310" y="263" font-size="21" fill="#15803d" text-anchor="middle">Idᵧ</text><text x="310" y="335" font-size="17" fill="#172554" text-anchor="middle">The proper input survives as an ordinary sId output.</text><rect x="18" y="378" width="584" height="294" rx="14" fill="white" stroke="#15803d" stroke-width="2"/><text x="310" y="420" font-size="19" fill="#15803d" text-anchor="middle">The supplied whole comparison remains in the square</text><text x="115" y="478" font-size="24" fill="#2563eb" text-anchor="middle">r*F_Q</text><text x="495" y="478" font-size="24" fill="#2563eb" text-anchor="middle">S_Q</text><text x="115" y="590" font-size="24" fill="#2563eb" text-anchor="middle">r*F_E</text><text x="495" y="590" font-size="24" fill="#2563eb" text-anchor="middle">S_E</text><path d="M 193 470 L 433 470 M 193 582 L 433 582" stroke="#15803d" stroke-width="3"/><path d="M 115 499 L 115 550 M 495 499 L 495 550" stroke="#2563eb" stroke-width="3"/><text x="310" y="455" font-size="19" fill="#15803d" text-anchor="middle">Θ_Q = ρ_Q r*β_Q</text><text x="310" y="615" font-size="19" fill="#15803d" text-anchor="middle">Θ_E = ρ_E r*β_E</text><text x="310" y="529" font-size="21" fill="#172554" text-anchor="middle">δK = ΓΘ_Q − Θ_E r*Γ_P</text><text x="57" y="532" font-size="14" fill="#2563eb" text-anchor="middle">r*Γ_P</text><text x="565" y="532" font-size="21" fill="#2563eb" text-anchor="middle">Γ</text><text x="310" y="649" font-size="16" fill="#172554" text-anchor="middle">K retains L(Γ), the full native higher-word contribution.</text><rect x="18" y="692" width="584" height="298" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="310" y="733" font-size="20" fill="#2563eb" text-anchor="middle">A degree −1 homotopy with an exact product law</text><text x="310" y="781" font-size="23" fill="#172554" text-anchor="middle">L(Γ)q = (−1)^(|Γ|+q+1) Γq+1(o,σ)</text><text x="310" y="829" font-size="23" fill="#15803d" text-anchor="middle">δL(Γ) + L(δΓ) = Γρ − ρΓₒ</text><text x="310" y="877" font-size="21" fill="#172554" text-anchor="middle">L(ΔΓ) = (−1)^|Δ| ΔL(Γ) + L(Δ)Γₒ</text><text x="310" y="925" font-size="24" fill="#2563eb" text-anchor="middle">F₄(0,8,10,14,15)(y) = −24t</text><text x="310" y="967" font-size="18" fill="#172554" text-anchor="middle">The closed chain y → z → w → t is retained.</text><text x="310" y="1031" font-size="14" fill="#172554" text-anchor="middle">Native partition data and original execution data have distinct inputs.</text><text x="310" y="1070" font-size="16" fill="#172554" text-anchor="middle">Their comparison uses full bars and every original label.</text><text x="310" y="1105" font-size="14" fill="#172554" text-anchor="middle">Proof, all graded signs and exact product formula: §71.</text></g></svg>