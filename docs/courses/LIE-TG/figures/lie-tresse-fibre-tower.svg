<svg xmlns="http://www.w3.org/2000/svg" width="800" height="485" viewBox="0 0 800 485" role="img" aria-labelledby="title desc">
  <title id="title">Two higher-level lifts have different fibre images</title>
  <desc id="desc">Fix a lower point x with nonzero product p. The lift with last coordinate one maps its line parameter s to lower parameter s and then to ps. The lift with last coordinate zero maps every s to lower parameter zero and then to zero. Total images remain the full field at every level.</desc>
  <rect width="800" height="485" rx="12" fill="#f6f8fb"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#37485a"/></marker></defs>
  <g font-family="system-ui, sans-serif" fill="#162637">
    <text x="32" y="38" font-size="22" font-weight="650">Same lower point; two different higher fibre images</text>
    <text x="32" y="68" font-size="17">Example 4.6 · p = x₂ ··· xℓ ≠ 0 · all fibre lines are copies of F</text>
    <rect x="30" y="99" width="272" height="108" rx="9" fill="#e4f2ee" stroke="#337764"/>
    <text x="48" y="129" font-size="18" font-weight="600">Higher lift: xℓ₊₁ = 1</text>
    <text x="48" y="160" font-size="18">ψℓ₊₁(s) = ps</text>
    <text x="48" y="188" font-size="18">Image = F</text>
    <rect x="30" y="280" width="272" height="108" rx="9" fill="#fff0e5" stroke="#986025"/>
    <text x="48" y="310" font-size="18" font-weight="600">Higher lift: xℓ₊₁ = 0</text>
    <text x="48" y="341" font-size="18">ψℓ₊₁(s) = 0</text>
    <text x="48" y="369" font-size="18">Image = {0}</text>
    <rect x="489" y="184" width="280" height="126" rx="9" fill="#e7edf9" stroke="#486594"/>
    <text x="508" y="214" font-size="18" font-weight="600">Lower point x ∈ U ⊂ Eℓ</text>
    <text x="508" y="245" font-size="18">Fibre parameter u</text>
    <text x="508" y="276" font-size="18">ψℓ(u) = pu; image = F</text>
    <path d="M306 158 L480 214" fill="none" stroke="#37485a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M306 328 L480 277" fill="none" stroke="#37485a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="337" y="151" font-size="18">σ: s ↦ s</text>
    <text x="337" y="351" font-size="18">σ: s ↦ 0</text>
    <text x="32" y="425" font-size="18" font-weight="600">At every level: union of all fibre images = F.</text>
    <text x="32" y="453" font-size="17">Every nonempty finite-level open admits a higher lift with zero image.</text>
  </g>
</svg>
