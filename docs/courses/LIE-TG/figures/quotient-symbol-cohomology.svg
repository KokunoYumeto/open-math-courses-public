<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Koszul support and Spencer bidegrees</title>
<desc id="desc">For Q=F[t1,t2]/(t1 squared,t2 cubed), all nonzero Koszul homology classes occur at internal and exterior degrees (0,0), (2,1), (3,1), and (5,2). Subtracting exterior degree gives Spencer bidegrees (0,0), (1,1), (2,1), and (3,2). The degree-five class has symmetric degree three. The lower complex and homotopy explain finite support; one coefficient localization is needed to preserve homology under specialization.</desc>
<rect width="1200" height="830" fill="#f6f8fc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#17283d">
<rect x="25" y="106" width="555" height="412" rx="12" fill="white" stroke="#c5d0df"/>
<rect x="620" y="106" width="555" height="412" rx="12" fill="white" stroke="#c5d0df"/>
<rect x="25" y="541" width="1150" height="262" rx="12" fill="white" stroke="#c5d0df"/>

<text x="30" y="39" font-size="27" font-weight="650">Koszul support and Spencer bidegrees</text>
<text x="30" y="74" font-size="20" >Q = F[t₁,t₂]/(t₁²,t₂³);  exterior vectors have internal degree one.</text>
<text x="46" y="143" font-size="23" font-weight="600">Koszul indices (a,j)</text>
<text x="642" y="143" font-size="23" font-weight="600">Spencer indices (i,j),  i = a − j</text>
<path d="M100 443H490" stroke="#dbe2ed"/>
<text x="72" y="449" font-size="17" text-anchor="middle">0</text>
<path d="M100 328H490" stroke="#dbe2ed"/>
<text x="72" y="334" font-size="17" text-anchor="middle">1</text>
<path d="M100 213H490" stroke="#dbe2ed"/>
<text x="72" y="219" font-size="17" text-anchor="middle">2</text>
<path d="M100 443V213" stroke="#dbe2ed"/>
<text x="100" y="470" font-size="17" text-anchor="middle">0</text>
<path d="M178 443V213" stroke="#dbe2ed"/>
<text x="178" y="470" font-size="17" text-anchor="middle">1</text>
<path d="M256 443V213" stroke="#dbe2ed"/>
<text x="256" y="470" font-size="17" text-anchor="middle">2</text>
<path d="M334 443V213" stroke="#dbe2ed"/>
<text x="334" y="470" font-size="17" text-anchor="middle">3</text>
<path d="M412 443V213" stroke="#dbe2ed"/>
<text x="412" y="470" font-size="17" text-anchor="middle">4</text>
<path d="M490 443V213" stroke="#dbe2ed"/>
<text x="490" y="470" font-size="17" text-anchor="middle">5</text>
<text x="62" y="188" font-size="20" >j</text>
<text x="515" y="470" font-size="20" >a</text>
<circle cx="100" cy="443" r="7" fill="#265ba8"/>
<text x="100" y="425" font-size="19" text-anchor="middle" fill="#174880">1</text>
<circle cx="256" cy="328" r="7" fill="#265ba8"/>
<text x="256" y="310" font-size="19" text-anchor="middle" fill="#174880">t₁e₁</text>
<circle cx="334" cy="328" r="7" fill="#265ba8"/>
<text x="334" y="310" font-size="19" text-anchor="middle" fill="#174880">t₂²e₂</text>
<circle cx="490" cy="213" r="7" fill="#265ba8"/>
<text x="490" y="195" font-size="19" text-anchor="middle" fill="#174880">t₁t₂²e₁₂</text>
<path d="M700 443H1066" stroke="#dbe2ed"/>
<text x="672" y="449" font-size="17" text-anchor="middle">0</text>
<path d="M700 328H1066" stroke="#dbe2ed"/>
<text x="672" y="334" font-size="17" text-anchor="middle">1</text>
<path d="M700 213H1066" stroke="#dbe2ed"/>
<text x="672" y="219" font-size="17" text-anchor="middle">2</text>
<path d="M700 443V213" stroke="#dbe2ed"/>
<text x="700" y="470" font-size="17" text-anchor="middle">0</text>
<path d="M822 443V213" stroke="#dbe2ed"/>
<text x="822" y="470" font-size="17" text-anchor="middle">1</text>
<path d="M944 443V213" stroke="#dbe2ed"/>
<text x="944" y="470" font-size="17" text-anchor="middle">2</text>
<path d="M1066 443V213" stroke="#dbe2ed"/>
<text x="1066" y="470" font-size="17" text-anchor="middle">3</text>
<text x="662" y="188" font-size="20" >j</text>
<text x="1091" y="470" font-size="20" >i</text>
<circle cx="700" cy="443" r="7" fill="#265ba8"/>
<text x="700" y="425" font-size="19" text-anchor="middle" fill="#174880">1</text>
<circle cx="822" cy="328" r="7" fill="#265ba8"/>
<text x="822" y="310" font-size="19" text-anchor="middle" fill="#174880">t₁e₁</text>
<circle cx="944" cy="328" r="7" fill="#265ba8"/>
<text x="944" y="310" font-size="19" text-anchor="middle" fill="#174880">t₂²e₂</text>
<circle cx="1066" cy="213" r="7" fill="#265ba8"/>
<text x="1066" y="195" font-size="19" text-anchor="middle" fill="#174880">t₁t₂²e₁₂</text>
<text x="46" y="500" font-size="17" >All unmarked lattice positions have zero homology.</text>
<text x="642" y="500" font-size="18" fill="#174880">The top class has i = 5 − 2 = 3.</text>
<text x="48" y="580" font-size="22" font-weight="600">Proof mechanism: Theorem 4.30 and Example 4.31</text>
<text x="65" y="624" font-size="25" >0  →  Qe₁₂  →  Qe₁ ⊕ Qe₂  →  Q  →  0</text>
<text x="65" y="661" font-size="21" >d(ce₁₂) = t₁ce₂ − t₂ce₁;    d(ae₁ + be₂) = t₁a + t₂b.</text>
<text x="65" y="705" font-size="22" fill="#174880">dεᵣ + εᵣd = tᵣ id  ⇒  tᵣHⱼ = 0  ⇒  finite internal-degree support.</text>
<text x="65" y="746" font-size="20" >For a coefficient family: split the differential cokernels after one localization.</text>
<text x="65" y="779" font-size="20" >Then specialized homology equals the field specialization of homology.</text>
</g></svg>
