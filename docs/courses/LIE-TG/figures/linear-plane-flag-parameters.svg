<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc">
<title id="title">Which weights may be exchanged?</title>
<desc id="desc">A semisimple matrix line has two unordered eigenlines. A triangular two-dimensional algebra has an intrinsic line L, determined by its unique nilpotent matrix line, and the nonzero induced map N from V/L to L. The ordered weights a and d give parameter [a-d:a+d]. Projectivization discards scalar weights, while differentiation at a fixed origin preserves linear conjugacy.</desc>
<rect width="1280" height="1420" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#102238;font-size:22px}.title{font-size:32px;font-weight:bold}.head{font-size:25px;font-weight:bold}.small{font-size:19px}.math{font-family:Georgia,serif}</style>
<text x="40" y="50" class="title">The parameter belongs to the representation</text>
<text x="40" y="87" class="">Complex linear conjugacy retains more information than the projective image.</text>
<rect x="40" y="115" width="575" height="342" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<rect x="640" y="115" width="600" height="342" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="65" y="157" class="head">A nonscalar semisimple line</text>
<text x="65" y="198" class="math">L<tspan baseline-shift="sub" font-size="75%">[a:d]</tspan> = ℂ diag(a,d),   a ≠ d</text>
<rect x="75" y="232" width="175" height="69" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<rect x="375" y="232" width="175" height="69" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="162" y="274" class="math" text-anchor="middle">eigenline Eₐ</text>
<text x="462" y="274" class="math" text-anchor="middle">eigenline E<tspan baseline-shift="sub" font-size="75%">d</tspan></text>
<path d="M265 266 L360 266" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="312" y="327" class="small" text-anchor="middle">Basis exchange is allowed.</text>
<text x="65" y="374" class="head math">[a:d] ~ [d:a]</text>
<text x="65" y="417" class="small">Both weights also scale with the generator.</text>
<text x="665" y="157" class="head">A triangular matrix plane</text>
<text x="665" y="198" class="math">B<tspan baseline-shift="sub" font-size="75%">[u:v]</tspan> = ⟨N,uH+vI⟩,   (u,v) ≠ (0,0)</text>
<rect x="675" y="232" width="190" height="69" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<rect x="1000" y="232" width="205" height="69" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="770" y="273" class="math" text-anchor="middle">quotient V/L</text>
<text x="1102" y="273" class="math" text-anchor="middle">line L</text>
<path d="M879 266 L985 266" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="931" y="246" class="small math" text-anchor="middle">N ≠ 0</text>
<text x="665" y="338" class="math">N: V/L → L;  L = ker N = im N</text>
<text x="665" y="377" class="math">a = u+v on L;  d = v−u on V/L</text>
<text x="665" y="417" class="small">[u:v] = [a−d:a+d], with this fixed order.</text>
<rect x="40" y="485" width="1200" height="230" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="65" y="528" class="head">The intrinsic flag distinguishes s from −s</text>
<text x="65" y="569" class="math">B<tspan baseline-shift="sub" font-size="75%">[1:1]</tspan> = ⟨N, diag(2,0)⟩</text>
<text x="675" y="569" class="math">B<tspan baseline-shift="sub" font-size="75%">[1:−1]</tspan> = ⟨N, diag(0,−2)⟩</text>
<text x="65" y="612" class="math">Common kernel = 0</text>
<text x="675" y="612" class="math">Common kernel = L</text>
<text x="65" y="650" class="math">Total image = L</text>
<text x="675" y="650" class="math">Total image = V</text>
<text x="65" y="690" class="small">No invertible basis change can alter these dimensions.</text>
<rect x="40" y="744" width="1200" height="250" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="65" y="786" class="head">Projectivization forgets the scalar weight</text>
<text x="65" y="827" class="math">z = x/y,   ρ(A) = (b + (a−d)z − cz²)∂z,   A = ((a,b),(c,d))</text>
<text x="65" y="867" class="math">ker ρ = ℂI;   π(A) = A − ½ tr(A)I ∈ sl₂</text>
<text x="65" y="907" class="math">u ≠ 0: every B<tspan baseline-shift="sub" font-size="75%">[u:v]</tspan> maps to ⟨H,N⟩, independently of v/u.</text>
<text x="65" y="954" class="small">u = 0: B<tspan baseline-shift="sub" font-size="75%">[0:1]</tspan> maps to the one-dimensional nilpotent algebra ℂN.</text>
<rect x="40" y="1022" width="1200" height="215" rx="12" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="65" y="1064" class="head">An analytic coordinate germ fixing 0 retains the matrix class</text>
<text x="65" y="1106" class="math">Φ(0) = 0,  P = DΦ₀  ⇒  D(Φ<tspan baseline-shift="sub" font-size="75%">*</tspan>X<tspan baseline-shift="sub" font-size="75%">A</tspan>)₀ = PAP⁻¹</text>
<text x="65" y="1148" class="small">For two already linear algebras, analytic equivalence at 0 implies linear conjugacy.</text>
<text x="65" y="1190" class="small">This identity does not linearize arbitrary nonlinear fields.</text>
<text x="40" y="1284" class="small">Duality is a different operation:  S B<tspan baseline-shift="sub" font-size="75%">[u:v]</tspan>∨ S⁻¹ = B<tspan baseline-shift="sub" font-size="75%">[−u:v]</tspan>,  S exchanges the basis vectors.</text>
<text x="40" y="1324" class="small">For u ≠ 0 it sends s = v/u to −s; Theorem 8.2 does not identify those parameters.</text>
<text x="40" y="1385" class="small">Proof locators: Theorem 8.2, Corollaries 8.3–8.4 and Example 8.5.</text>
</svg>
