<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">One finite domain and the affine geometric quotient tower</title>
<desc id="desc">For j at least L, X_j is the entire inverse image of U_a in the fixed equation fibre. The commuting square has q_(j+1)=(q_j pi,z) from X_(j+1) to Y_j times affine d-space, vertical equation projection pi and target projection pr1, and q_j from X_j to Y_j. In a fixed lower equation fibre, the linear map T on g_(j+1) has right inverse S and kernel the full vertical orbit symbol. Polynomial expansion in z has invariant lower coefficients. The eventual transporter images T'_k are nonempty with surjective transitions and define a compatible formal arrow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="1000" fill="#f6f8fc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#17283d">

<text x="30" y="40" font-size="26" font-weight="650">One finite domain and the affine geometric quotient tower</text>
<text x="30" y="77" font-size="22" >j ≥ L;  Xⱼ is the full inverse image of Uₐ in the fixed equation fibre.</text>
<rect x="25" y="104" width="1150" height="442" rx="12" fill="white" stroke="#c4cfdd"/>
<text x="47" y="143" font-size="23" font-weight="600">The commutative quotient square — equation (4.88)</text>
<rect x="95" y="194" width="280" height="80" rx="12" fill="#edf2fc" stroke="#c4cfdd"/>
<text x="235" y="244" font-size="31" text-anchor="middle">Xⱼ₊₁</text>
<rect x="775" y="194" width="325" height="80" rx="12" fill="#eaf4ed" stroke="#c4cfdd"/>
<text x="937" y="244" font-size="31" text-anchor="middle">Yⱼ × Aᵈ</text>
<rect x="95" y="406" width="280" height="80" rx="12" fill="#edf2fc" stroke="#c4cfdd"/>
<text x="235" y="456" font-size="31" text-anchor="middle">Xⱼ</text>
<rect x="775" y="406" width="325" height="80" rx="12" fill="#eaf4ed" stroke="#c4cfdd"/>
<text x="937" y="456" font-size="31" text-anchor="middle">Yⱼ</text>
<path d="M391 234L757 234" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="574" y="213" font-size="23" text-anchor="middle">qⱼ₊₁ = (qⱼπ,z)</text>
<path d="M391 446L757 446" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="574" y="426" font-size="24" text-anchor="middle">qⱼ</text>
<path d="M235 289L235 389" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="263" y="340" font-size="23" >πⱼ₊₁,ⱼ</text>
<path d="M937 289L937 389" stroke="#2c6547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="967" y="340" font-size="23" >pr₁</text>
<text x="48" y="519" font-size="21" >Left fibres: affine equation spaces.  Right fibres: Aᵈ with d=dim(gⱼ₊₁/ϖⱼ₊₁).</text>
<rect x="25" y="568" width="1150" height="222" rx="12" fill="white" stroke="#c4cfdd"/>
<text x="47" y="606" font-size="23" font-weight="600">A fixed lower fibre: actual affine functions and full orbit level spaces</text>
<text x="48" y="649" font-size="22" >z=T(v)+c,  TS=id;   ker T=ϖⱼ₊₁.   Each z-level is one full stabilizer orbit.</text>
<text x="48" y="691" font-size="22" >v=S(z−c)+w,  w∈ker T.   This is an exact polynomial coordinate split.</text>
<text x="48" y="734" font-size="22" fill="#174880">f=Σ_α h_α z^α: unique expansion; each h_α is a full lower invariant.</text>
<text x="48" y="769" font-size="21" >All inverses and highest linear coefficients come from the same order-L ring.</text>
<rect x="25" y="812" width="1150" height="164" rx="12" fill="white" stroke="#c4cfdd"/>
<text x="47" y="850" font-size="23" font-weight="600">Formal orbit separation: the eventual transporter images</text>
<text x="150" y="901" font-size="28" text-anchor="middle">T′_L</text>
<text x="435" y="901" font-size="28" text-anchor="middle">T′_(L+1)</text>
<text x="745" y="901" font-size="28" text-anchor="middle">T′_(L+2)</text>
<text x="1050" y="901" font-size="32" text-anchor="middle">⋯</text>
<path d="M335 891L215 891" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M655 891L530 891" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1010 891L840 891" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="275" y="879" font-size="17" text-anchor="middle">onto</text>
<text x="590" y="879" font-size="17" text-anchor="middle">onto</text>
<text x="925" y="879" font-size="17" text-anchor="middle">onto</text>
<text x="48" y="948" font-size="21" >Nonempty eventual images + onto transitions ⇒ one compatible admissible formal arrow.</text>
</g></svg>
