<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1480" viewBox="0 0 1280 1480" role="img" aria-labelledby="title desc">
<title id="title">All complex matrix Lie subalgebras of gl2 under linear conjugacy</title>
<desc id="desc">An irreducible algebra is sl2 or gl2. A reducible algebra preserves a line, and its projection onto diagonal matrices has either the nilpotent line as kernel or zero kernel. All dimensions, scalar and Jordan lines, diagonal and triangular planes, and exact parameter relations are shown.</desc>
<rect width="1280" height="1480" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#102238;font-size:22px}.title{font-size:31px;font-weight:bold}.head{font-size:25px;font-weight:bold}.small{font-size:19px}.math{font-family:Georgia,serif}</style>
<text x="40" y="49" class="title">Every matrix subalgebra, with its precise conjugacy</text>
<text x="40" y="86" class="math">V = ℂ²,   [A,B] = AB − BA;   equivalence h ↦ P h P⁻¹, P ∈ GL₂(ℂ).</text>
<rect x="40" y="110" width="1200" height="80" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="640" y="144" class="head" text-anchor="middle">Does h preserve a line L ⊂ V?</text>
<text x="640" y="175" class="small" text-anchor="middle">This is a property of the matrix representation at the fixed origin.</text>
<path d="M340 190 L340 225" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M930 190 L930 225" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="227" width="560" height="183" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="65" y="265" class="head">No: irreducible</text>
<text x="65" y="302" class="math">π(h) = sl₂,   π(A) = A − ½ tr(A)I</text>
<text x="65" y="337" class="math">[h,h] = sl₂  ⇒  sl₂ ⊂ h</text>
<text x="65" y="376" class="head math">h = sl₂   or   h = gl₂</text>
<rect x="630" y="227" width="610" height="183" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="655" y="265" class="head">Yes: choose L = ℂe₁</text>
<text x="655" y="302" class="math">h ⊂ T = ⟨I,H,N⟩,   N = E₁₂</text>
<text x="655" y="337" class="math">Diagonal image W; kernel h ∩ ℂN</text>
<text x="655" y="376" class="head">The kernel is ℂN or zero.</text>
<path d="M935 410 L935 448" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="450" width="1200" height="202" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="65" y="490" class="head math">Kernel ℂN:   h = W ⊕ ℂN</text>
<text x="65" y="532" class="math">dim W = 0</text>
<text x="385" y="532" class="math">dim W = 1</text>
<text x="880" y="532" class="math">dim W = 2</text>
<text x="65" y="571" class="head math">ℂN</text>
<text x="385" y="571" class="head math">B<tspan baseline-shift="sub" font-size="75%">[u:v]</tspan> = ⟨N,uH+vI⟩</text>
<text x="880" y="571" class="head math">T = ⟨I,H,N⟩</text>
<text x="65" y="616" class="small">One nilpotent line</text>
<text x="385" y="616" class="small">[u:v] ∈ ℙ¹; exact equality only</text>
<text x="880" y="616" class="small">All upper triangular</text>
<rect x="40" y="678" width="1200" height="252" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="65" y="720" class="head math">Kernel zero:   h = { D + β(D)N : D ∈ W }</text>
<text x="65" y="758" class="math">Commutativity: δ(D)β(E) = δ(E)β(D), where δ(diag(a,d)) = a−d.</text>
<text x="65" y="800" class="head">W contains a nonscalar matrix</text>
<text x="760" y="800" class="head">W consists of scalars</text>
<text x="65" y="839" class="small">β = tδ; shear I+tN sends the whole graph to W.</text>
<text x="65" y="882" class="math">dim W = 1: L<tspan baseline-shift="sub" font-size="75%">[a:d]</tspan>;   dim W = 2: D = ⟨I,H⟩</text>
<text x="760" y="839" class="math">h = ℂ(I+bN), or h = 0</text>
<text x="760" y="882" class="math">b = 0: ℂI;  b ≠ 0: ℂ(I+N)</text>
<rect x="40" y="958" width="1200" height="268" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="65" y="999" class="head">No cases omitted; no hidden parameter identifications</text>
<text x="65" y="1041" class="small">dim 0</text>
<text x="205" y="1041" class="math">0</text>
<text x="65" y="1077" class="small">dim 1</text>
<text x="205" y="1077" class="math">L<tspan baseline-shift="sub" font-size="75%">[a:d]</tspan> with [a:d] ~ [d:a];  ℂN;  ℂ(I+N)</text>
<text x="65" y="1113" class="small">dim 2</text>
<text x="205" y="1113" class="math">D;  B<tspan baseline-shift="sub" font-size="75%">[u:v]</tspan> with [u:v] unchanged</text>
<text x="65" y="1149" class="small">dim 3</text>
<text x="205" y="1149" class="math">T;  sl₂</text>
<text x="65" y="1185" class="small">dim 4</text>
<text x="205" y="1185" class="math">gl₂</text>
<rect x="40" y="1253" width="1200" height="145" rx="12" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="65" y="1293" class="head">Why the two-dimensional parameter has an order</text>
<text x="65" y="1333" class="math">Nilpotent set of B<tspan baseline-shift="sub" font-size="75%">[u:v]</tspan> = ℂN  ⇒  L = ker N = im N is intrinsic.</text>
<text x="65" y="1370" class="small">Its weights on L and V/L give [u:v] = [a−d:a+d]; exchanging them is not allowed.</text>
<text x="40" y="1441" class="small">Proof: Lemma 8.1 and Theorem 8.2. Projective images: Corollary 8.3. Fixed-origin germs: Corollary 8.4.</text>
</svg>
