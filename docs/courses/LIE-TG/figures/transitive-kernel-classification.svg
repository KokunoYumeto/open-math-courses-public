<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1390" viewBox="0 0 1280 1390" role="img" aria-labelledby="title desc">
<title id="title">The quotient and vertical kernel classify transitive imprimitive plane actions</title>
<desc id="desc">All twelve combinations of quotient dimension and vertical kernel type. Low-dimensional coefficient and zero-index cases are retained and lead to the product and small normal forms. The diagram concerns generic regular complex analytic point actions.</desc>
<rect width="1280" height="1390" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#102238;font-size:21px}.title{font-size:31px;font-weight:bold}.sub{font-size:25px;font-weight:bold}.small{font-size:18px}.math{font-family:Georgia,serif}</style>
<text x="42" y="48" class="title">Every quotient / vertical-kernel case</text>
<text x="42" y="84" class="">Transitive imprimitive holomorphic plane germs; one chosen invariant curve foliation.</text>
<rect x="42" y="107" width="1196" height="93" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="640" y="145" class="sub math" text-anchor="middle">0 → k → g → h → 0,    X = a(x)∂x + b(x,y)∂y</text>
<text x="640" y="178" class="small" text-anchor="middle">h acts on the transverse x-line; k acts along the leaves x = constant.</text>
<rect x="235" y="222" width="321" height="83" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="395.5" y="254" class="sub" text-anchor="middle">dim h = 1</text>
<text x="395.5" y="286" class="math" text-anchor="middle">⟨p⟩</text>
<rect x="571" y="222" width="321" height="83" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="731.5" y="254" class="sub" text-anchor="middle">dim h = 2</text>
<text x="731.5" y="286" class="math" text-anchor="middle">⟨p, xp⟩</text>
<rect x="907" y="222" width="321" height="83" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="1067.5" y="254" class="sub" text-anchor="middle">dim h = 3</text>
<text x="1067.5" y="286" class="math" text-anchor="middle">⟨p, xp, x²p⟩</text>
<text x="42" y="371" class="sub math">k = c</text>
<text x="42" y="404" class="small">projective vertical</text>
<rect x="235" y="326" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="395.5" y="369" class="sub math" text-anchor="middle">sᵧ ⊕ tₓ</text>
<text x="395.5" y="411" class="small" text-anchor="middle">product</text>
<rect x="571" y="326" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="731.5" y="369" class="sub math" text-anchor="middle">sᵧ ⊕ aₓ</text>
<text x="731.5" y="411" class="small" text-anchor="middle">product</text>
<rect x="907" y="326" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="1067.5" y="369" class="sub math" text-anchor="middle">sᵧ ⊕ sₓ</text>
<text x="1067.5" y="411" class="small" text-anchor="middle">product</text>
<text x="42" y="571" class="sub math">k = b(V)</text>
<text x="42" y="604" class="small">affine vertical</text>
<rect x="235" y="526" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="395.5" y="569" class="sub math" text-anchor="middle">B₁(Σ)</text>
<text x="395.5" y="611" class="small" text-anchor="middle">dim V ≥ 2</text>
<text x="395.5" y="653" class="small" text-anchor="middle">dim V = 1: aᵧ ⊕ tₓ</text>
<rect x="571" y="526" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="731.5" y="569" class="sub math" text-anchor="middle">B₂(r), r ≥ 1</text>
<text x="731.5" y="611" class="math" text-anchor="middle">V = Pᵣ</text>
<text x="731.5" y="653" class="small" text-anchor="middle">r = 0: aₓ ⊕ aᵧ</text>
<rect x="907" y="526" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="1067.5" y="569" class="sub math" text-anchor="middle">B₃(r), r ≥ 1</text>
<text x="1067.5" y="611" class="math" text-anchor="middle">V = Pᵣ</text>
<text x="1067.5" y="653" class="small" text-anchor="middle">r = 0: sₓ ⊕ aᵧ</text>
<text x="42" y="771" class="sub math">k = a(V)</text>
<text x="42" y="804" class="small">abelian vertical</text>
<rect x="235" y="726" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="395.5" y="769" class="sub math" text-anchor="middle">A₁(Σ)</text>
<text x="395.5" y="811" class="small" text-anchor="middle">dim V ≥ 2</text>
<text x="395.5" y="853" class="small" text-anchor="middle">dim V = 1: small actions</text>
<rect x="571" y="726" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="731.5" y="769" class="sub math" text-anchor="middle">A₂(r,κ) or Jᵣ</text>
<text x="731.5" y="811" class="small" text-anchor="middle">r ≥ 1 for A₂; r ≥ 0 for J</text>
<text x="731.5" y="853" class="small" text-anchor="middle">r = 0 in A₂: Tκ</text>
<rect x="907" y="726" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="1067.5" y="769" class="sub math" text-anchor="middle">A₃(r), r ≥ 1</text>
<text x="1067.5" y="811" class="small" text-anchor="middle">r = 0: sₓ ⊕ tᵧ or Z</text>
<text x="1067.5" y="853" class="small" text-anchor="middle">residual coefficient t = 0 or 1</text>
<text x="42" y="971" class="sub math">k = 0</text>
<text x="42" y="1004" class="small">faithful quotient</text>
<rect x="235" y="926" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="395.5" y="969" class="sub" text-anchor="middle">Impossible</text>
<text x="395.5" y="1011" class="small" text-anchor="middle">dim g = 1 cannot be transitive</text>
<rect x="571" y="926" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="731.5" y="969" class="sub" text-anchor="middle">Free affine action</text>
<text x="731.5" y="1011" class="math" text-anchor="middle">⟨q, xp + Y⟩</text>
<text x="731.5" y="1053" class="small" text-anchor="middle">regular where x ≠ 0</text>
<rect x="907" y="926" width="321" height="178" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="1067.5" y="969" class="sub math" text-anchor="middle">N or Δ</text>
<text x="1067.5" y="1011" class="small" text-anchor="middle">nilpotent / semisimple isotropy</text>
<text x="1067.5" y="1053" class="small" text-anchor="middle">two distinct local sl₂ actions</text>
<rect x="42" y="1151" width="1196" height="178" rx="12" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="65" y="1189" class="sub">Exact coefficient mechanisms</text>
<text x="65" y="1224" class="math">V differentiation-invariant  ⇒  V = ⊕ e^(αᵢx) P_(nᵢ−1).</text>
<text x="65" y="1258" class="small">Affine quotient  ⇒  polynomial blocks; projective quotient fixes the highest weight r.</text>
<text x="65" y="1293" class="small">The affine extension leaves one coefficient t x^(r+1); it survives exactly at κ = r+1.</text>
<text x="42" y="1365" class="small">Proof: Theorem 7.14. Parameter equivalence: Theorem 7.15. Foliation counts and multiplicities: Proposition 7.16.</text>
</svg>
