<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1000" viewBox="0 0 520 1000" role="img" aria-labelledby="title desc">
<title id="title">Generic fibre and orbit rank</title>
<desc id="desc">Theorem 4.35. Over an algebraically closed field of characteristic zero, a finite full orbit quotient has generic fibre dimension r equal to m minus d. Finite normalization and field extension compute this dimension. The entire geometric generic fibre is one full orbit. Separability and translation give generic orbit rank r, so invariant differentials of rank d span the orbit annihilator on the invariant regular rank locus.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#305b57" stroke-width="1.5"/></marker></defs>
<rect width="520" height="1000" fill="#f7f6ed"/>
<text x="260" y="34" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Generic fibre and orbit rank</text>
<text x="260" y="61" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Theorem 4.35 · characteristic zero</text>
<rect x="24" y="82" width="472" height="144" rx="10" fill="#ffffff" stroke="#9eb6af" stroke-width="1.5"/>
<text x="42" y="112" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">The quotient fields</text>
<text x="42" y="143" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">k ⊂ F = k(Y) ⊂ K = k(X) ⊂ Ω</text>
<text x="42" y="170" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">m = trdegₖ K, d = trdegₖ F</text>
<text x="42" y="197" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Ω algebraically closed, r = m − d</text>
<path d="M260 232 V258" fill="none" stroke="#305b57" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="271" width="472" height="145" rx="10" fill="#ffffff" stroke="#9eb6af" stroke-width="1.5"/>
<text x="42" y="301" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">The generic fibre Uη over F</text>
<text x="42" y="332" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">On every nonempty affine chart:</text>
<text x="42" y="359" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">F[t₁, …, tᵣ] ↪ B is finite</text>
<text x="42" y="386" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Frac B = K, trdegꜰ K = r</text>
<path d="M260 422 V448" fill="none" stroke="#305b57" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="461" width="472" height="145" rx="10" fill="#ffffff" stroke="#9eb6af" stroke-width="1.5"/>
<text x="42" y="491" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Extend to Z = Uη ×ꜰ Ω</text>
<text x="42" y="522" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Ω[t₁, …, tᵣ] ↪ B ⊗ꜰ Ω is finite</text>
<text x="42" y="549" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">dim Z = r, allowing nilpotents</text>
<text x="42" y="576" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">and multiple components</text>
<path d="M260 612 V638" fill="none" stroke="#305b57" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="651" width="472" height="145" rx="10" fill="#ffffff" stroke="#9eb6af" stroke-width="1.5"/>
<text x="42" y="681" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">The full geometric fibre is an orbit</text>
<text x="42" y="712" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Zred = GΩ · xΩ</text>
<text x="42" y="739" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">xΩ comes from the generic point of X</text>
<text x="42" y="766" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">dim(GΩ · xΩ) = r</text>
<path d="M260 802 V828" fill="none" stroke="#305b57" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="841" width="472" height="135" rx="10" fill="#ffffff" stroke="#9eb6af" stroke-width="1.5"/>
<text x="42" y="871" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Invariant regular rank loci</text>
<text x="42" y="902" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">rank Δ = r, rank(df₁, …, dfₛ) = d</text>
<text x="42" y="929" fill="#173c3a" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">span{df₁, …, dfₛ} = Ann Δ</text>
</svg>
