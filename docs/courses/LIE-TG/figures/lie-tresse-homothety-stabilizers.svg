<svg xmlns="http://www.w3.org/2000/svg" width="840" height="530" viewBox="0 0 840 530" role="img" aria-labelledby="title desc">
<title id="title">Example 4.8: one first jet, different higher stabilizers</title>
<desc id="desc">At the origin the line u=0 and parabola u=x squared over two share slope zero. The line retains the full scalar infinitesimal stabilizer; the parabola has zero stabilizer. Common scaling by two sends the parabola to U=X squared over four. Restricting to nonzero second derivative gives one invariant domain where every higher stabilizer vanishes.</desc>
<rect width="840" height="530" fill="#f6f8fc"/>
<g font-family="Arial, sans-serif" fill="#17253d">
<text x="30" y="38" font-size="24" font-weight="bold">Same first jet does not mean same stabilizer</text>
<text x="30" y="65" font-size="17">Actual plane action: (x,u) ↦ (λx+b, λu+c), λ ≠ 0</text>
<text x="680" y="65" font-size="17">Orders k ≥ 2</text>
<rect x="25" y="86" width="385" height="302" rx="12" fill="#fff" stroke="#bcc9dc"/>
<rect x="430" y="86" width="385" height="302" rx="12" fill="#fff" stroke="#bcc9dc"/>
<text x="45" y="119" font-size="21" font-weight="bold">Straight lift</text>
<text x="450" y="119" font-size="21" font-weight="bold">Curved lift</text>
<text x="45" y="145" font-size="17">u = 0; all derivatives of order ≥ 2 vanish</text>
<text x="450" y="145" font-size="17">u = x²/2; u₂ = 1</text>
<path d="M65 254 H385 M225 274 V166 M470 254 H790 M630 274 V166" fill="none" stroke="#7a879b" stroke-width="1.5"/>
<text x="379" y="274" font-size="15">x</text><text x="234" y="179" font-size="15">u</text>
<text x="784" y="274" font-size="15">x</text><text x="639" y="179" font-size="15">u</text>
<path d="M85 254 H365" fill="none" stroke="#176a94" stroke-width="4"/>
<path d="M490 182 Q630 326 770 182" fill="none" stroke="#b25216" stroke-width="4"/>
<path d="M490 218 Q630 290 770 218" fill="none" stroke="#176a94" stroke-width="3" stroke-dasharray="7 5"/>
<text x="48" y="302" font-size="18">st(zₖ) = F,   ψₖ(a) = a id</text>
<text x="453" y="302" font-size="18">st(zₖ) = 0,   ψₖ(st(zₖ)) = 0</text>
<text x="48" y="332" font-size="16">The scaling derivative preserves the line.</text>
<text x="453" y="332" font-size="16">Dashed: after λ = 2, U = X²/4</text>
<text x="48" y="360" font-size="16">Same base point and slope as the right.</text>
<text x="453" y="360" font-size="16">The second derivative changes to 1/2.</text>
<rect x="25" y="406" width="790" height="98" rx="12" fill="#e6f3ed" stroke="#82bca2"/>
<text x="45" y="435" font-size="20" font-weight="bold">Correct uniform domain for this action: U² = {u₂ ≠ 0}</text>
<text x="45" y="462" font-size="17">All higher stabilizers vanish above U²; orbit symbols vanish from order 3.</text>
<text x="45" y="488" font-size="16">The full-space total image remains F because straight lifts are still present.</text>
</g>
</svg>
