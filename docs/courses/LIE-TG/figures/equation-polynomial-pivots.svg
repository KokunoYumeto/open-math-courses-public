<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Actual equation coordinates from monic symbol pivots</title>
<desc id="desc">Fix a lower jet of (1+p squared)u_xx=u_xy with f=1+p squared nonzero and q=u_xy. At order three the free variables are a=u_xyy and b=u_yyy. The solved pivots are c=u_xxy=a/f minus 2p q squared/f squared, and d=u_xxx=a/f squared minus 4p q squared/f cubed. The entire affine equation fibre is the plane (d,c,a,b) parametrized by (a,b), with inverse projection to its last two coordinates. All denominators depend only on p. The monic symbol row is t_x squared minus t_x t_y/f; standard degree-three monomials are t_y cubed and t_x t_y squared.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="850" fill="#f6f8fc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#17283d">

<text x="30" y="39" font-size="26" font-weight="650">Actual equation coordinates from monic symbol pivots</text>
<text x="30" y="74" font-size="21" >(1+p²)uₓₓ = uₓᵧ;   fixed lower jet: p=uₓ, q=uₓᵧ, f=1+p² ≠ 0.</text>
<rect x="25" y="103" width="1150" height="241" rx="10" fill="#ffffff" stroke="#c4cfdd"/>
<text x="47" y="141" font-size="23" font-weight="600">Degree-three symbol: tₓ² − f⁻¹tₓtᵧ, with tₓ &gt; tᵧ</text>
<rect x="65" y="169" width="238" height="120" rx="10" fill="#eaf4ed" stroke="#c4cfdd"/>
<text x="184" y="200" font-size="23" text-anchor="middle">tᵧ³</text>
<text x="184" y="233" font-size="21" text-anchor="middle">b = uᵧᵧᵧ</text>
<text x="184" y="269" font-size="18" text-anchor="middle" fill="#2c6547">free</text>
<rect x="342" y="169" width="238" height="120" rx="10" fill="#eaf4ed" stroke="#c4cfdd"/>
<text x="461" y="200" font-size="23" text-anchor="middle">tₓtᵧ²</text>
<text x="461" y="233" font-size="21" text-anchor="middle">a = uₓᵧᵧ</text>
<text x="461" y="269" font-size="18" text-anchor="middle" fill="#2c6547">free</text>
<rect x="619" y="169" width="238" height="120" rx="10" fill="#edf2fc" stroke="#c4cfdd"/>
<text x="738" y="200" font-size="23" text-anchor="middle">tₓ²tᵧ</text>
<text x="738" y="233" font-size="21" text-anchor="middle">c = uₓₓᵧ</text>
<text x="738" y="269" font-size="18" text-anchor="middle" fill="#265ba8">pivot</text>
<rect x="896" y="169" width="238" height="120" rx="10" fill="#edf2fc" stroke="#c4cfdd"/>
<text x="1015" y="200" font-size="23" text-anchor="middle">tₓ³</text>
<text x="1015" y="233" font-size="21" text-anchor="middle">d = uₓₓₓ</text>
<text x="1015" y="269" font-size="18" text-anchor="middle" fill="#265ba8">pivot</text>
<path d="M580 231H612" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M857 231H889" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="321" font-size="20" >Increasing pivot order: solve c from a, then d from c; b remains arbitrary.</text>
<rect x="25" y="366" width="1150" height="286" rx="10" fill="#ffffff" stroke="#c4cfdd"/>
<text x="47" y="405" font-size="23" font-weight="600">The entire highest equation fibre is an affine plane in four coordinates</text>
<rect x="54" y="433" width="239" height="161" rx="10" fill="#eaf4ed" stroke="#c4cfdd"/>
<text x="173" y="474" font-size="26" text-anchor="middle">(a,b) ∈ A²</text>
<text x="173" y="512" font-size="21" text-anchor="middle">a = uₓᵧᵧ</text>
<text x="173" y="548" font-size="21" text-anchor="middle">b = uᵧᵧᵧ</text>
<path d="M309 490H406" stroke="#265ba8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="357" y="470" font-size="23" text-anchor="middle" fill="#265ba8">Φ</text>
<path d="M406 554H309" stroke="#2c6547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="357" y="582" font-size="21" text-anchor="middle" fill="#2c6547">π</text>
<rect x="424" y="433" width="710" height="161" rx="10" fill="#edf2fc" stroke="#c4cfdd"/>
<text x="447" y="472" font-size="25" >Φ(a,b) = (d,c,a,b)</text>
<text x="447" y="512" font-size="24" >c = f⁻¹a − 2p f⁻²q²</text>
<text x="447" y="552" font-size="24" >d = f⁻²a − 4p f⁻³q²</text>
<text x="49" y="630" font-size="21" fill="#2c6547">π(d,c,a,b)=(a,b);  π ∘ Φ=id.  Every a,b is allowed; rank dΦ=2.</text>
<rect x="25" y="674" width="1150" height="151" rx="10" fill="#ffffff" stroke="#c4cfdd"/>
<text x="48" y="710" font-size="23" font-weight="600">One denominator collection at every order</text>
<text x="48" y="746" font-size="22" >Dᵢ(f⁻ʳ) = −r f⁻ʳ⁻¹Dᵢf.  Only powers of f are inverted; f has order one.</text>
<text x="48" y="786" font-size="21" >Theorem 4.32: actual raw equations + monic division + whole affine fibres.</text>
</g></svg>
