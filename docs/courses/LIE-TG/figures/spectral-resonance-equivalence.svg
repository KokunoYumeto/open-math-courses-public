<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1320" viewBox="0 0 1280 1320" role="img" aria-labelledby="title desc">
<title id="title">Spectral, resonant and reciprocal parameter equivalence</title>
<desc id="desc">The spectral list records exponent and block length. A common spectral shift is allowed in B1 because vertical dilations belong to it, whereas A1 permits only exponent scaling. The polynomial extension coefficient transforms by t plus r+1 minus kappa times d. At resonance zero and nonzero coefficients are distinct. Exchanging coordinate foliations identifies kappa and its reciprocal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
<rect width="1280" height="1320" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#102238;font-size:22px}.title{font-size:31px;font-weight:bold}.sub{font-size:25px;font-weight:bold}.small{font-size:19px}.math{font-family:Georgia,serif}</style>
<text x="42" y="49" class="title">The exact parameter equivalence mechanisms</text>
<text x="42" y="87" class="">Theorem 7.15: all exponents move together; polynomial resonance retains a class.</text>
<rect x="42" y="112" width="1196" height="442" rx="13" fill="#ffffff" stroke="#94a3b8"/>
<text x="66" y="151" class="sub math">Spectral list: (αᵢ, nᵢ) means e^(αᵢx) P_(nᵢ−1)</text>
<line x1="104" y1="226" x2="1082" y2="226" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="145" cy="226" r="7" fill="#155e75"/>
<text x="145" y="207" class="small" text-anchor="middle">α = 0</text>
<text x="145" y="259" class="small" text-anchor="middle">n = 1</text>
<circle cx="312" cy="226" r="7" fill="#155e75"/>
<text x="312" y="207" class="small" text-anchor="middle">α = 1</text>
<text x="312" y="259" class="small" text-anchor="middle">n = 2</text>
<circle cx="646" cy="226" r="7" fill="#155e75"/>
<text x="646" y="207" class="small" text-anchor="middle">α = 3</text>
<text x="646" y="259" class="small" text-anchor="middle">n = 1</text>
<line x1="104" y1="360" x2="1082" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="479" cy="360" r="7" fill="#155e75"/>
<text x="479" y="341" class="small" text-anchor="middle">α = 2</text>
<text x="479" y="393" class="small" text-anchor="middle">n = 1</text>
<circle cx="646" cy="360" r="7" fill="#155e75"/>
<text x="646" y="341" class="small" text-anchor="middle">α = 3</text>
<text x="646" y="393" class="small" text-anchor="middle">n = 2</text>
<circle cx="980" cy="360" r="7" fill="#155e75"/>
<text x="980" y="341" class="small" text-anchor="middle">α = 5</text>
<text x="980" y="393" class="small" text-anchor="middle">n = 1</text>
<text x="1120" y="233" class="small">α ∈ R</text>
<text x="1120" y="367" class="small">real slice</text>
<text x="640" y="300" class="math" text-anchor="middle">ỹ = e^(2x)y:  Σ → Σ+2;  p → p+2Y;  Y → Y.</text>
<text x="66" y="435" class="">B₁: common affine change α → aα+b, a ≠ 0; block lengths are retained.</text>
<text x="66" y="473" class="">A₁: common scaling α → aα only; a zero exponent stays zero.</text>
<text x="66" y="514" class="small">Thus these two lists are B₁-equivalent and A₁-inequivalent. Exercise 7.</text>
<rect x="42" y="578" width="1196" height="386" rx="13" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="66" y="619" class="sub">Resonance of the affine quotient lift</text>
<text x="66" y="660" class="math">H = xp + κY + t x^R q,   R = r+1,   kernel = Pᵣq.</text>
<text x="66" y="699" class="math">ỹ = y + d x^R  ⇒  t → t+(R−κ)d.</text>
<text x="66" y="735" class="small">p changes by Rd x^(R−1)q, which lies in the kernel.</text>
<rect x="66" y="765" width="543" height="157" rx="13" fill="#ffffff" stroke="#94a3b8"/>
<rect x="633" y="765" width="581" height="157" rx="13" fill="#ffffff" stroke="#94a3b8"/>
<text x="337" y="807" class="sub math" text-anchor="middle">κ ≠ R</text>
<text x="337" y="851" class="math" text-anchor="middle">Choose d = −t/(R−κ).</text>
<text x="337" y="889" class="small" text-anchor="middle">Every t is equivalent to zero.</text>
<text x="923" y="807" class="sub math" text-anchor="middle">κ = R</text>
<text x="923" y="851" class="" text-anchor="middle">Translation leaves t unchanged.</text>
<text x="923" y="889" class="small" text-anchor="middle">Constant y scale: two classes, t=0 and t≠0.</text>
<rect x="42" y="988" width="1196" height="259" rx="13" fill="#ffffff" stroke="#94a3b8"/>
<text x="66" y="1027" class="sub">Exchanging the two invariant coordinate foliations</text>
<text x="66" y="1070" class="math">Tκ = ⟨p, q, xp+κY⟩,   κ ≠ 0,1.</text>
<text x="66" y="1112" class="math">X = y,  ỹ = x:   diag(1,κ) → diag(κ,1) → diag(1,1/κ).</text>
<text x="66" y="1154" class="small">The last step rescales the isotropy generator by 1/κ.</text>
<text x="66" y="1196" class="">The complete point-equivalence relation is κ ~ 1/κ.</text>
<text x="42" y="1291" class="small">Local holomorphic coordinates; no classification of singular orbits or restricted projective conjugacy is asserted.</text>
</svg>
