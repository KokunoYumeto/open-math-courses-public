<text x="48" y="710" font-size="20" >a=t², b=t³;  −1.15 ≤ t ≤ 1.15.</text>
<text x="48" y="745" font-size="19" >601 samples of the exact parametrization.</text>
<text x="640" y="145" font-size="22" font-weight="600">Equal point fibres and rational fields</text>
<text x="640" y="188" font-size="22" >k(t²,t³) = k(t),   t = t³/t² in the field.</text>
<text x="640" y="230" font-size="25" fill="#a34224">t ∉ k[t²,t³]</text>
<text x="640" y="272" font-size="24" fill="#a34224">d(t²)|₀ = d(t³)|₀ = 0</text>
<rect x="638" y="308" width="513" height="226" rx="11" fill="#edf2fc" stroke="#c4cfdd"/>
<text x="659" y="344" font-size="22" font-weight="600">On the fibre pair X ×_Y X</text>
<text x="659" y="385" font-size="23" >R=k[t,s]/(t²−s²,t³−s³)</text>
<text x="659" y="426" font-size="24" >ε=t−s ≠ 0;   ε²=−2sε</text>
<text x="659" y="467" font-size="24" >s²ε=0  ⇒  ε³=0</text>
<text x="659" y="507" font-size="20" >Pointwise equality leaves nilpotents.</text>
<rect x="638" y="560" width="513" height="196" rx="11" fill="#eaf4ed" stroke="#c4cfdd"/>
<text x="659" y="599" font-size="23" font-weight="600">On the target open a ≠ 0</text>
<text x="659" y="644" font-size="30" fill="#2c6547">t=b/a</text>
<text x="659" y="687" font-size="22" >p is an isomorphism:</text>
<text x="659" y="726" font-size="20" >flatness, differential rank and descent.</text>
<rect x="25" y="810" width="1150" height="72" rx="11" fill="white" stroke="#c4cfdd"/>
<text x="47" y="852" font-size="22" >Theorems 4.35–4.36: differential rank and the invariant sheaf need their own arguments.</text>
</g></svg>
