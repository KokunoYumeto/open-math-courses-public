<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Intrinsic fibre rationality depends on the base</title>
<desc id="desc">The intrinsic presentation has invariant coordinates I j equals exp minus p times w j. The original derivative rational invariant field consists of the ratios w j over w 2. In the slice x equals u equals w equals p equals z equals zero, the exact points w 2,w 3 equals one,one and two,two have equal ratio but different intrinsic invariant coordinates and different H orbits.</desc>
<rect width="1200" height="920" fill="#fbfcfe"/><g font-family="DejaVu Sans,Arial,sans-serif">
<text x="30" y="42" font-size="26" font-weight="bold" fill="#203c50">An intrinsic action: the base fixes the rational coefficient class</text>
<rect x="25" y="65" width="1150" height="255" rx="10" fill="#edf3fb" stroke="#c7d4de"/>
<text x="45" y="105" font-size="24" font-weight="bold" fill="#203c50">Equation uₓₓ=0; free function w(x).  Intrinsic base M′=E¹.</text>
<text x="45" y="146" font-size="23" font-weight="normal" fill="#203c50">p=uₓ,  z=wₓ,  b=u−px.   On M′: bₓ=pₓ=0,  wₓ=z.</text>
<text x="45" y="189" font-size="23" font-weight="normal" fill="#203c50">x′=x+s,  b′=b+h,  p′=p+a,  z′=eᵃz+c,  w′=eᵃw+cx+d.</text>
<text x="45" y="232" font-size="23" font-weight="normal" fill="#203c50">Iⱼ=e⁻ᵖwⱼ (j≥2),   DIⱼ=Iⱼ₊₁.   All fixed-point jet groups are trivial.</text>
<text x="45" y="278" font-size="22" font-weight="normal" fill="#203c50">In (x,u,w), u′=u+ax+sp+as+h depends on the derivative p when s≠0.</text>
<rect x="25" y="340" width="555" height="440" rx="10" fill="#f2f8f5" stroke="#c7d4de"/>
<text x="45" y="380" font-size="24" font-weight="bold" fill="#203c50">Exact original third-order slice</text>
<text x="45" y="416" font-size="21" font-weight="normal" fill="#203c50">x=u=w=p=z=0;  w₂≠0</text>
<path d="M90 720 L435 720 M90 720 L90 450" stroke="#355668" stroke-width="2" fill="none"/>
<text x="445" y="727" font-size="23" font-weight="normal" fill="#203c50">w₂</text>
<text x="62" y="455" font-size="23" font-weight="normal" fill="#203c50">w₃</text>
<path d="M90 720 L340 470" stroke="#738b9a" stroke-width="2" stroke-dasharray="7 7"/>
<text x="310" y="505" font-size="22" font-weight="normal" fill="#203c50">r₃=1</text>
<circle cx="180" cy="630" r="7" fill="#187e75"/><circle cx="270" cy="540" r="7" fill="#a44f2a"/>
<path d="M180 720 L180 630 L90 630 M270 720 L270 540 L90 540" stroke="#b7c7d0" stroke-width="1" fill="none"/>
<text x="171" y="749" font-size="19" font-weight="normal" fill="#203c50">1</text>
<text x="261" y="749" font-size="19" font-weight="normal" fill="#203c50">2</text>
<text x="66" y="637" font-size="19" font-weight="normal" fill="#203c50">1</text>
<text x="66" y="547" font-size="19" font-weight="normal" fill="#203c50">2</text>
<text x="193" y="655" font-size="20" font-weight="normal" fill="#187e75">P=(1,1)</text>
<text x="282" y="563" font-size="20" font-weight="normal" fill="#a44f2a">Q=(2,2)</text>
<rect x="605" y="340" width="570" height="440" rx="10" fill="#fff6eb" stroke="#c7d4de"/>
<text x="627" y="380" font-size="24" font-weight="bold" fill="#203c50">Two different invariant fields</text>
<text x="627" y="427" font-size="23" font-weight="bold" fill="#203c50">Intrinsic S² over M′:</text>
<text x="627" y="464" font-size="23" font-weight="normal" fill="#203c50">ℝ(I₂,I₃),   q₂(P)=(1,1),</text>
<text x="627" y="501" font-size="23" font-weight="normal" fill="#203c50">q₂(Q)=(2,2).  Full H-orbits differ.</text>
<text x="627" y="555" font-size="23" font-weight="bold" fill="#203c50">Original derivative-rational class:</text>
<text x="627" y="593" font-size="22" font-weight="normal" fill="#203c50">ℝ(r₃),  r₃=w₃/w₂.  Both values are 1.</text>
<text x="627" y="639" font-size="22" font-weight="normal" fill="#203c50">δ=∂ₚ+t∂ₜ on ℝ(p,t,r₃),  t=w₂.</text>
<text x="627" y="676" font-size="22" font-weight="normal" fill="#203c50">Its rational constants are ℝ(r₃).</text>
<text x="627" y="723" font-size="22" font-weight="bold" fill="#203c50">The dashed ray is not one H-orbit.</text>
<text x="45" y="820" font-size="22" font-weight="normal" fill="#203c50">Example 4.41: full normalization and affine quotient tower, (4.109)–(4.111).</text>
<text x="45" y="856" font-size="21" font-weight="normal" fill="#203c50">Lemma 4.42 and Proposition 4.43: the rational constant field and failure of orbit separation.</text>
<text x="45" y="895" font-size="17" font-weight="normal" fill="#203c50">Scope context: Kruglikov–Lychagin, arXiv:1111.5480v3 §0.1.  GPT-6.1 Sol (OpenAI). CC0 1.0.</text>
</g></svg>
