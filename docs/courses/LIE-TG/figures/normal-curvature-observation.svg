<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">A tangential translation and its gauged normal commutator</title>
<desc id="desc">The graph line (x,u,v)=(t,t,t/2) has tangential translation velocity (1,1,1/2). In the coefficient algebra of straight-line jets, Z1=partial u+v partial p and Z2=partial v have bracket minus partial p. On Q1=beta-p xi this gives xi. The full gauged observation copy retains the same xi component, so its graph relation still maps to zero.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="690" fill="#f7f9fc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#17283d">
<text x="34" y="44" font-size="25" font-weight="650">Tangency and normal curvature</text>
<text x="34" y="73" font-size="16">Straight-line jets: uₓₓ = vₓₓ = 0, with p = uₓ and q = vₓ.</text>
<rect x="26" y="98" width="532" height="554" rx="13" fill="white" stroke="#c5d0df"/>
<rect x="580" y="98" width="594" height="554" rx="13" fill="white" stroke="#c5d0df"/>
<text x="48" y="132" font-size="21" font-weight="600">A translation tangent to the line</text>
<text x="48" y="160" font-size="17">(x,u,v) = (t,t,t/2)</text>
<g stroke="#8797ab" stroke-width="1.6" marker-end="url(#arrow)">
<path d="M250 300L394 237"/><path d="M250 300L349 300"/><path d="M250 300L250 147"/>
</g>
<text x="403" y="239" font-size="17">x</text><text x="355" y="306" font-size="17">u</text><text x="234" y="182" font-size="17">v</text>
<path d="M34 424L466 176" stroke="#14757e" stroke-width="4"/>
<circle cx="250" cy="300" r="5" fill="#17283d"/><text x="261" y="325" font-size="16">a = (0,0,0)</text>
<path d="M250 300L385 222.5" stroke="#c25430" stroke-width="5" marker-end="url(#arrow)"/>
<text x="298" y="378" font-size="18" fill="#a34224">velocity (1,1,1/2)</text>
<text x="48" y="458" font-size="19">Q₁ = β − pξ,     Q₂ = γ − qξ</text>
<text x="48" y="494" font-size="19">(ξ,β,γ) = (1,1,1/2)</text>
<text x="48" y="530" font-size="19">(ξ,Q₁,Q₂) = (1,0,0)</text>
<text x="48" y="580" font-size="16">The characteristic equations retain this translation.</text>
<text x="48" y="612" font-size="14" fill="#52647a">Linear projection for the drawing:</text>
<text x="48" y="634" font-size="14" fill="#52647a">P(x,u,v) = (250 + 80x + 55u, 300 − 35x − 85v).</text>
<text x="602" y="132" font-size="21" font-weight="600">The full observation copy retains curvature</text>
<text x="602" y="171" font-size="18">Z₁ = ∂ᵤ + v∂ₚ,     Z₂ = ∂ᵥ</text>
<text x="602" y="204" font-size="18">[Z₁,Z₂] = −∂ₚ,     [Z₁,Z₂]Q₁ = ξ</text>
<rect x="604" y="230" width="545" height="93" rx="8" fill="#edf4f8"/>
<text x="621" y="260" font-size="18">C(e<tspan baseline-shift="sub" font-size="13">ξ</tspan>) = ξ,     C(e<tspan baseline-shift="sub" font-size="13">Q₁</tspan>) = β − pξ,     C(e<tspan baseline-shift="sub" font-size="13">Q₂</tspan>) = γ − qξ</text>
<text x="621" y="291" font-size="17">Observation actions are transported through C.</text>
<text x="602" y="366" font-size="19">Graph relation:</text>
<text x="825" y="366" font-size="21">(−Q₁, e<tspan baseline-shift="sub" font-size="14">Q₁</tspan>)</text>
<path d="M939 383L939 429" stroke="#14757e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="613" y="412" font-size="17">normal commutator</text>
<text x="825" y="464" font-size="21">(−ξ, e<tspan baseline-shift="sub" font-size="14">ξ</tspan>)</text>
<text x="602" y="519" font-size="18">Under the graph map:</text>
<text x="853" y="519" font-size="22" fill="#14757e">−ξ + ξ = 0</text>
<text x="602" y="572" font-size="16">N₁ = Z₁ + zᵤ and N₂ = Z₂ + zᵥ act on all</text>
<text x="602" y="598" font-size="16">three gauged components. The curvature term remains</text>
<text x="602" y="624" font-size="16">in the observation copy throughout elimination.</text>
</g></svg>