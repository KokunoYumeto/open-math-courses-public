<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">An orbit quotient and its exceptional parameter</title>
<desc id="desc">For t acting on (x,y) as (x,y+tx), every vertical line with x nonzero is one orbit. The line x=0 consists of fixed points. On x nonzero the quotient is q=x and the orbit ideal is generated by X-x; at x=0 the point orbit also requires Y-y.</desc>
<rect width="960" height="540" fill="#fcfbf6"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374b60"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#152d41">
<text x="36" y="40" font-size="26">t · (x,y) = (x, y + tx)</text>
<text x="36" y="71" font-size="19">On x ≠ 0, q(x,y) = x has one orbit in each fibre.</text>
<g stroke="#bbc1c6" stroke-width="1"><path d="M62 277H470M266 105V353"/></g>
<g stroke="#008678" stroke-width="4"><path d="M92 110V345M179 110V345M353 110V345M440 110V345"/></g>
<path d="M266 108V346" stroke="#b77a17" stroke-width="2" stroke-dasharray="5 5"/>
<g font-size="18" text-anchor="middle"><text x="92" y="377">−2</text><text x="179" y="377">−1</text><text x="266" y="377">0</text><text x="353" y="377">1</text><text x="440" y="377">2</text></g>
<text x="475" y="282" font-size="18">x</text><text x="277" y="112" font-size="18">y</text>
<g fill="#b77a17"><circle cx="266" cy="135" r="6"/><circle cx="266" cy="206" r="6"/><circle cx="266" cy="277" r="6"/><circle cx="266" cy="335" r="6"/></g>
<text x="36" y="410" font-size="18">Every point on x = 0 is fixed.</text>
<text x="36" y="435" font-size="17">The marked points are distinct orbits.</text>
<path d="M514 227H603" stroke="#374b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="546" y="210" font-size="22">q</text>
<rect x="628" y="108" width="290" height="290" rx="10" fill="#eaf4f0" stroke="#008678"/>
<text x="651" y="145" font-size="22">Quotient on x ≠ 0</text>
<text x="651" y="187" font-size="19">Target coordinate: x</text>
<text x="651" y="226" font-size="19">Orbit ideal: (X − x)</text>
<text x="651" y="265" font-size="19">Invariant field: k(x)</text>
<text x="651" y="311" font-size="18">At the excluded parameter:</text>
<text x="651" y="343" font-size="19">actual ideal (X, Y − y)</text>
<text x="651" y="376" font-size="18">generic specialization (X)</text>
<path d="M36 458H918" stroke="#b7c5cd"/>
<text x="36" y="490" font-size="19">Graph equations: X − x = 0,   Y − y − tx = 0.</text>
<text x="36" y="519" font-size="17">The localization x ≠ 0 makes elimination commute with every parameter specialization.</text>
</g>
