<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1260" viewBox="0 0 520 1260" role="img" aria-labelledby="title desc">
<title id="title">Finite Cartan reconstruction and the scalar exception</title>
<desc id="desc">For k at least two, characteristic fibres of the first derived Cartan distribution recover projection to the previous jet level. At first order, several dependent variables force the unique maximal isotropic slope-vertical space; one dependent variable admits contact maps such as Legendre transformation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24649a"/></marker></defs>
<rect width="520" height="1260" fill="#fbfaf5"/>
<g font-family="Segoe UI,DejaVu Sans,sans-serif" fill="#12333d">
<text x="260" y="32" font-size="24" font-weight="bold" text-anchor="middle">Recovering finite jet maps</text>
<text x="260" y="62" font-size="16" font-weight="normal" text-anchor="middle">n ≥ 1, m ≥ 1; the upper square has k ≥ 2</text>
<rect x="24" y="92" width="200" height="118" rx="10" fill="#eef4f6" stroke="#678c99" stroke-width="1.4"/>
<rect x="24" y="292" width="200" height="118" rx="10" fill="#eef4f6" stroke="#678c99" stroke-width="1.4"/>
<text x="124" y="130" font-size="23" font-weight="bold" text-anchor="middle">Jᵏ, Cₖ</text>
<text x="124" y="165" font-size="18" font-weight="normal" text-anchor="middle">Vₖ = Char(Cₖ¹)</text>
<text x="124" y="191" font-size="16" font-weight="normal" text-anchor="middle">highest-jet fibre</text>
<text x="124" y="337" font-size="23" font-weight="bold" text-anchor="middle">Jᵏ⁻¹, Cₖ₋₁</text>
<text x="124" y="375" font-size="16" font-weight="normal" text-anchor="middle">lower finite jet level</text>
<rect x="296" y="92" width="200" height="118" rx="10" fill="#eef4f6" stroke="#678c99" stroke-width="1.4"/>
<rect x="296" y="292" width="200" height="118" rx="10" fill="#eef4f6" stroke="#678c99" stroke-width="1.4"/>
<text x="396" y="130" font-size="23" font-weight="bold" text-anchor="middle">Jᵏ, Cₖ</text>
<text x="396" y="165" font-size="18" font-weight="normal" text-anchor="middle">Vₖ = Char(Cₖ¹)</text>
<text x="396" y="191" font-size="16" font-weight="normal" text-anchor="middle">highest-jet fibre</text>
<text x="396" y="337" font-size="23" font-weight="bold" text-anchor="middle">Jᵏ⁻¹, Cₖ₋₁</text>
<text x="396" y="375" font-size="16" font-weight="normal" text-anchor="middle">lower finite jet level</text>
<path d="M230 148L288 148" fill="none" stroke="#24649a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="260" y="128" font-size="20" font-weight="normal" text-anchor="middle">Φₖ</text>
<path d="M230 348L288 348" fill="none" stroke="#24649a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="260" y="328" font-size="20" font-weight="normal" text-anchor="middle">Φₖ₋₁</text>
<path d="M124 216L124 284" fill="none" stroke="#24649a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="137" y="253" font-size="17" font-weight="normal" text-anchor="start">πₖ,ₖ₋₁</text>
<path d="M396 216L396 284" fill="none" stroke="#24649a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="409" y="253" font-size="17" font-weight="normal" text-anchor="start">πₖ,ₖ₋₁</text>
<text x="260" y="447" font-size="20" font-weight="normal" text-anchor="middle">Cₖ¹ = Cₖ + [Cₖ,Cₖ]</text>
<text x="260" y="480" font-size="20" font-weight="normal" text-anchor="middle">Cₖ¹ = (dπₖ,ₖ₋₁)⁻¹ Cₖ₋₁</text>
<text x="260" y="514" font-size="18" font-weight="bold" text-anchor="middle">Iterate the descent to J¹.</text>
<path d="M24 536H496" stroke="#9aafb4"/>
<rect x="24" y="556" width="472" height="202" rx="10" fill="#eff5ec" stroke="#678c99" stroke-width="1.4"/>
<text x="44" y="589" font-size="21" font-weight="bold" text-anchor="start">m = 1: contact maps on J¹</text>
<text x="44" y="623" font-size="18" font-weight="normal" text-anchor="start">Slope fibres need not be preserved.</text>
<text x="44" y="657" font-size="18" font-weight="normal" text-anchor="start">Example with n = 1:</text>
<text x="260" y="691" font-size="20" font-weight="normal" text-anchor="middle">L(x,z,p) = (p, xp − z, x)</text>
<text x="260" y="730" font-size="18" font-weight="normal" text-anchor="middle">q ≠ 0: Q = 1/q    (Exercise 6)</text>
<rect x="24" y="782" width="472" height="310" rx="10" fill="#f6f0e8" stroke="#678c99" stroke-width="1.4"/>
<text x="44" y="817" font-size="21" font-weight="bold" text-anchor="start">m &gt; 1: point maps on J⁰</text>
<text x="44" y="853" font-size="18" font-weight="normal" text-anchor="start">C₁ = H ⊕ V₁,   V₁ = Hom(H, Kᵐ)</text>
<text x="44" y="889" font-size="18" font-weight="normal" text-anchor="start">Let S be Levi-isotropic and let</text>
<text x="44" y="917" font-size="18" font-weight="normal" text-anchor="start">s = dim(projection of S to H).</text>
<text x="260" y="957" font-size="21" font-weight="bold" text-anchor="middle">dim S ≤ mn − (m − 1)s</text>
<text x="260" y="997" font-size="18" font-weight="normal" text-anchor="middle">dim S = mn  ⇒  s = 0  ⇒  S = V₁</text>
<text x="44" y="1035" font-size="18" font-weight="normal" text-anchor="start">V₁ is the unique isotropic mn-plane.</text>
<text x="44" y="1066" font-size="18" font-weight="normal" text-anchor="start">Thus Φ₁ descends to the point space J⁰.</text>
<text x="260" y="1136" font-size="20" font-weight="bold" text-anchor="middle">Higher levels are unique prolongations.</text>
<text x="260" y="1174" font-size="22" font-weight="normal" text-anchor="middle">zₖ ↦ (zₖ₋₁, P_zₖ)</text>
<text x="260" y="1210" font-size="17" font-weight="normal" text-anchor="middle">The image plane recovers every highest derivative.</text>
<text x="260" y="1242" font-size="16" font-weight="normal" text-anchor="middle">Lemmas 7.1–7.2 and Theorem 7.3</text>
</g></svg>
