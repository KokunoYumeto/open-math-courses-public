<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">An admissible symbol contraction from a varying kernel section</title>
<desc id="desc">In coordinates where the graph k-jet is flat, differentiate a local section of the kernel of the lower action and subtract the ordinary transformation index shift. The difference is admissible by the differentiated determining equations. If the representative derivative on the tangent plane is zero, its action is minus insertion of the orbit symbol, with all lower action coefficients zero.</desc>
<rect width="900" height="490" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#13233a">
<text x="450" y="33" text-anchor="middle" font-size="23" font-weight="bold">A section supplies the contraction</text>
<text x="450" y="59" text-anchor="middle" font-size="16">Lemma 4.13 · coordinates with the graph k-jet flat</text>
<rect x="230" y="81" width="440" height="64" rx="9" fill="#e2ecff" stroke="#5475a3"/>
<text x="450" y="108" text-anchor="middle" font-size="19">s(z) in ker B, with s(zₖ₋₁) = aₖ</text>
<text x="450" y="132" text-anchor="middle" font-size="16">Aₖ(aₖ) = qₖ and daₖ restricted to τ = 0</text>
<path d="M340 145 L245 177 M560 145 L655 177" stroke="#5475a3" stroke-width="2" fill="none"/>
<rect x="60" y="177" width="365" height="76" rx="9" fill="white" stroke="#8ca0b9"/>
<rect x="475" y="177" width="365" height="76" rx="9" fill="white" stroke="#8ca0b9"/>
<text x="242" y="207" text-anchor="middle" font-size="19">Differentiate the section</text>
<text x="242" y="235" text-anchor="middle" font-size="21">H_i(s^b_I)</text>
<text x="657" y="207" text-anchor="middle" font-size="19">Shift the ordinary jet index</text>
<text x="657" y="235" text-anchor="middle" font-size="21">s^b_(I+e_i)</text>
<text x="450" y="224" text-anchor="middle" font-size="30">−</text>
<path d="M242 253 L242 279 L450 279 L657 279 L657 253 M450 279 L450 301" stroke="#5475a3" stroke-width="2" fill="none"/>
<rect x="190" y="301" width="520" height="69" rx="9" fill="#e4f5ec" stroke="#478567"/>
<text x="450" y="329" text-anchor="middle" font-size="21">Spencer difference 𝒟ᵢs belongs to Rₖ₋₁</text>
<text x="450" y="354" text-anchor="middle" font-size="16">Differentiating and subtracting the determining equations proves this.</text>
<path d="M450 370 L450 394" stroke="#478567" stroke-width="2" fill="none"/>
<rect x="170" y="394" width="560" height="48" rx="9" fill="#e2ecff" stroke="#5475a3"/>
<text x="450" y="425" text-anchor="middle" font-size="22">Aₖ₋₁(𝒟ᵢs) = − insertion of ∂ₓⁱ into qₖ</text>
<text x="450" y="470" text-anchor="middle" font-size="16">All lower action coefficients vanish. Neither term need be admissible separately.</text>
</g>
</svg>
