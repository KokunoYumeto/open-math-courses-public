<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Horizontal vectors with the same action on invariants</title>
<desc id="desc">At the point (1,0), H x is the vector (2,-1) and H y is (1,0). Both increase I=x+y from 1 to 2. Their difference is (1,-1), along the annihilator of dI. The two arrow endpoints are joined along the level line I=2.</desc>
<defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176c9e"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#008474"/></marker>
<marker id="grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#46556b"/></marker>
</defs>
<rect width="960" height="540" fill="#fcfbf6"/>
<g font-family="Arial,sans-serif" fill="#172f43">
<text x="32" y="39" font-size="26">One derivation, different horizontal representatives</text>
<text x="32" y="72" font-size="19">I = x + y,     L = span(1, −1),     HₓI = HᵧI = 1</text>
<path d="M65 300H515M225 110V455" stroke="#aebac3" stroke-width="1.2"/>
<text x="518" y="307" font-size="18">x</text><text x="211" y="112" font-size="18">y</text>
<path d="M130 130L455 455" stroke="#c08c25" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M205 130L530 455" stroke="#9eabb2" stroke-width="2" stroke-dasharray="5 5"/>
<text x="108" y="122" font-size="18">I = 1</text><text x="232" y="140" font-size="18">I = 2</text>
<circle cx="300" cy="300" r="6" fill="#172f43"/>
<text x="243" y="280" font-size="18">(1,0)</text>
<path d="M300 300L450 375" stroke="#176c9e" stroke-width="3.3" marker-end="url(#blue)"/>
<path d="M300 300L375 300" stroke="#008474" stroke-width="3.3" marker-end="url(#green)"/>
<path d="M375 300L450 375" stroke="#46556b" stroke-width="2.2" marker-end="url(#grey)"/>
<text x="348" y="280" font-size="19" fill="#008474">Hᵧ = (1,0)</text>
<text x="355" y="411" font-size="19" fill="#176c9e">Hₓ = (2,−1)</text>
<text x="460" y="341" font-size="18">difference</text><text x="460" y="365" font-size="18">in L</text>
<rect x="622" y="121" width="304" height="280" rx="9" fill="#eaf4f0" stroke="#008474"/>
<text x="646" y="159" font-size="22">The quotient τ / L</text>
<text x="646" y="201" font-size="19">[Hₓ] = [Hᵧ]</text>
<text x="646" y="240" font-size="19">Both act as d / dI.</text>
<text x="646" y="287" font-size="18">On every f(I):</text>
<text x="646" y="322" font-size="19">Hₓ f = Hᵧ f = f′(I).</text>
<text x="646" y="370" font-size="18">Their difference kills f(I).</text>
<path d="M32 468H926" stroke="#bac6cc"/>
<text x="32" y="497" font-size="18">Hₓ = ∂ₓ + x(∂ₓ − ∂ᵧ),     Hᵧ = ∂ₓ + y(∂ₓ − ∂ᵧ)</text>
<text x="32" y="525" font-size="17">The arrows show values at (1,0). The fields vary with the point.</text>
</g>
<metadata>Original diagram: GPT-6.1 Sol (OpenAI). CC0 1.0. Exact vectors in Example 4.23 and Exercise 9.</metadata>
</svg>
