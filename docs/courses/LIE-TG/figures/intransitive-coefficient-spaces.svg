<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
<title id="title">Intransitive actions and projective coefficient spaces</title>
<desc id="desc">An exact classification diagram for generic rank-one holomorphic actions. The three orbit-restriction dimensions give the translation, affine and projective cases. The coefficient curve example is the conic z0 z2 equals z1 squared; a constant matrix induces x maps to x divided by one plus x.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
<rect width="1280" height="1160" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#102238;font-size:22px}.title{font-size:32px;font-weight:bold}.sub{font-size:25px;font-weight:bold}.small{font-size:19px}.math{font-family:Georgia,serif}.blue{fill:#155e75}.green{fill:#166534}</style>
<text x="48" y="53" class="title">Rank-one actions and the projective coefficient curve</text>
<text x="48" y="90" class="small">Holomorphic germs; equivalence by local point coordinates. Theorem 7.6 and Proposition 7.7.</text>
<rect x="48" y="115" width="1184" height="105" rx="14" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="640" y="151" class="sub math" text-anchor="middle">g ⊂ { f(x,y) ∂y }   →   gx = restriction to the orbit x = constant</text>
<text x="640" y="187" class="" text-anchor="middle">Finite dimension + the line theorem: generic d = dim gx is 1, 2, or 3.</text>
<line x1="235" y1="220" x2="235" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="254" width="376" height="260" rx="14" fill="#ffffff" stroke="#94a3b8"/>
<line x1="639" y1="220" x2="639" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="452" y="254" width="376" height="260" rx="14" fill="#ffffff" stroke="#94a3b8"/>
<line x1="1043" y1="220" x2="1043" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="856" y="254" width="376" height="260" rx="14" fill="#ffffff" stroke="#94a3b8"/>
<text x="235" y="290" class="sub" text-anchor="middle">d = 1: translations</text>
<text x="235" y="329" class="math" text-anchor="middle">g′ = 0</text>
<text x="235" y="367" class="math" text-anchor="middle">∂y ∈ g  ⇒  fy = 0</text>
<text x="235" y="405" class="sub math" text-anchor="middle">a(V) = V(x) ∂y</text>
<text x="235" y="450" class="small" text-anchor="middle">V finite dimensional, 1 ∈ V</text>
<text x="235" y="482" class="small" text-anchor="middle">All fields commute.</text>
<text x="639" y="290" class="sub" text-anchor="middle">d = 2: affine motions</text>
<text x="639" y="329" class="math" text-anchor="middle">g′ ≠ 0, g″ = 0</text>
<text x="639" y="367" class="small math" text-anchor="middle">a(x) V ⊂ V  ⇒  a is constant</text>
<text x="639" y="405" class="sub math" text-anchor="middle">b(V) = C y∂y + V(x) ∂y</text>
<text x="639" y="450" class="math small" text-anchor="middle">b(V)′ = a(V)</text>
<text x="639" y="482" class="small" text-anchor="middle">The translation ideal is intrinsic.</text>
<text x="1043" y="290" class="sub" text-anchor="middle">d = 3: projective motions</text>
<text x="1043" y="329" class="small math" text-anchor="middle">gx ≅ sl₂; finitely many kernels</text>
<text x="1043" y="367" class="math" text-anchor="middle">Kx holomorphic  ⇒  Kx = 0</text>
<text x="1043" y="405" class="sub math" text-anchor="middle">c = ⟨∂y, y∂y, y²∂y⟩</text>
<text x="1043" y="450" class="small" text-anchor="middle">One constant sl₂ triple</text>
<text x="1043" y="482" class="small" text-anchor="middle">No decomposition theorem needed.</text>
<text x="48" y="553" class="sub">Coefficient-space equivalence for a(V) and b(V)</text>
<text x="48" y="592" class="math">g(φ(x)) = λ(x) C f(x),     C ∈ GLs(C),     φ′λ ≠ 0.</text>
<text x="48" y="626" class="">The orbit-preserving point map is X = φ(x), Y = λ(x)y + μ(x).</text>
<text x="48" y="657" class="small">For a(V): μ arbitrary.   For b(V): μ ∈ λV.   Germ base points must be matched.</text>
<rect x="48" y="681" width="1184" height="430" rx="14" fill="#ffffff" stroke="#94a3b8"/>
<text x="76" y="718" class="sub">Exact conic example: V = W = ⟨1, x, x²⟩</text>
<text x="76" y="753" class="math">f = (1,x,x²)ᵀ;  φ = x/(1+x);  λ = 1/(1+x)²;  |x| &lt; 1.</text>
<text x="76" y="788" class="math">C = [(1,2,1), (0,1,1), (0,0,1)]   ⇒   [Cf(x)] = [f(φ(x))].</text>
<text x="76" y="826" class="small">Real slice in z₀ = 1: (u,v) = (x,x²), so v = u².</text>
<line x1="144" y1="1053" x2="524" y2="1053" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="254" y1="1065" x2="254" y2="853" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="534" y="1061" class="math">u</text>
<text x="246" y="839" class="math">v</text>
