<circle cx="368.0" cy="1010.0" r="7" fill="#155e75"/>
<text x="398.0" y="980.0" class="small">x = 1/2</text>
<circle cx="330.0" cy="1033.888888888889" r="7" fill="#166534"/>
<text x="160.0" y="1016.8888888888889" class="small">φ(x) = 1/3</text>
<line x1="376" y1="1008" x2="337" y2="1031" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="626" y="880" class="math">C sends (1, 1/2, 1/4)ᵀ</text>
<text x="626" y="920" class="math">to (9/4, 3/4, 1/4)ᵀ.</text>
<text x="626" y="960" class="math">Dividing by 9/4 gives (1, 1/3, 1/9)ᵀ.</text>
<text x="626" y="1002" class="math">(z₀+2z₁+z₂)z₂ − (z₁+z₂)²</text>
<text x="626" y="1042" class="math">= z₀z₂ − z₁².</text>
<text x="626" y="1081" class="small">Conic preservation is an exact polynomial identity.</text>
<text x="48" y="1144" class="small">Generic normalization excludes critical transverse points; [1:x²] and [1:x] differ at x=0. Example 7.10.</text>
</svg>
