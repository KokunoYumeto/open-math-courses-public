<svg xmlns="http://www.w3.org/2000/svg" width="840" height="700" viewBox="0 0 840 700" role="img" aria-labelledby="title desc">
<title id="title">Scalar tests in the dual unit ball of the max-norm plane</title>
<desc id="desc">The closed diamond has vertices (0,1), (1,0), (0,-1), (-1,0). Its first-quadrant edge consists of the norm-preserving extensions of the functional f(t,t)=t. The blue relative open strip has absolute a less than one quarter; its two dashed vertical boundaries are excluded.</desc>
<metadata>Original CC0-1.0; exact coefficient geometry; Phase 34.4 and Exercise 73.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526371"/></marker></defs>
<rect width="840" height="700" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#182124">
<text x="40" y="40" font-size="26" font-weight="bold">A dual ball seen through scalar evaluations</text>
<text x="40" y="76" font-size="22">φ(x,y) = ax + by;   ‖(x,y)‖∞ = max(|x|,|y|)</text>

<polygon points="370,140 560,330 370,520 180,330" fill="#f3f1ec" stroke="#38464f" stroke-width="3"/>
<polygon points="322.5,472.5 370,520 417.5,472.5 417.5,187.5 370,140 322.5,187.5" fill="#a9d9ec" fill-opacity=".8"/>
<path d="M135,330 H645 M370,529 V102" fill="none" stroke="#526371" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="657" y="337" font-size="24">a = φ(1,0)</text>
<text x="386" y="109" font-size="24">b = φ(0,1)</text>
<path d="M322.5,187.5 V472.5" stroke="#16749b" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
<path d="M417.5,187.5 V472.5" stroke="#16749b" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
<polyline points="370,140 560,330" fill="none" stroke="#b94b12" stroke-width="7" stroke-linecap="round"/>
<circle cx="370" cy="140" r="6" fill="#b94b12" stroke="#fff" stroke-width="1.5"/>
<circle cx="465" cy="235" r="6" fill="#b94b12" stroke="#fff" stroke-width="1.5"/>
<circle cx="560" cy="330" r="6" fill="#b94b12" stroke="#fff" stroke-width="1.5"/>
<text x="305" y="128" font-size="21">(0,1)</text>
<text x="564" y="367" font-size="21">(1,0)</text>
<text x="99" y="363" font-size="21">(−1,0)</text>
<text x="320" y="548" font-size="21">(0,−1)</text>
<text x="344" y="355" font-size="20">0</text>
<text x="275" y="375" font-size="21">−¼</text>
<text x="425" y="375" font-size="21">¼</text>
<path d="M470,232 L563,174" stroke="#b94b12" stroke-width="1.8" fill="none"/>
<text x="570" y="151" font-size="22" fill="#9c3e0d">a + b = 1</text>
<text x="570" y="181" font-size="22" fill="#9c3e0d">a,b ≥ 0</text>
<text x="570" y="211" font-size="20" fill="#9c3e0d">Fₛ: (a,b) = (s,1−s)</text>
<text x="570" y="240" font-size="20" fill="#9c3e0d">0 ≤ s ≤ 1</text>
<path d="M220,203 L332,218" stroke="#16749b" stroke-width="1.8" fill="none"/>
<text x="42" y="170" font-size="22" fill="#126080">|a| &lt; ¼</text>
<text x="42" y="201" font-size="20" fill="#126080">One evaluation test</text>
<text x="40" y="601" font-size="22">Closed dual ball: |a| + |b| ≤ 1.</text>
<text x="40" y="637" font-size="22">Blue: a relative weak-star neighborhood of zero.</text>
<text x="40" y="673" font-size="20">Dashed boundaries excluded; orange endpoints included.</text>
</g></svg>
