<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">A4 thermal endpoint sectors</title>
<desc id="desc">Odd vertices 1 and 3 index the two extreme graph KMS states. The negative transfer tail tends to the identity; the positive tail mixes to pi. The finite interval has odd endpoints at positions minus 2m minus 1 and 2m plus 1.</desc>
<rect width="900" height="660" fill="#ffffff"/>
<text x="450" y="34" font-family="Arial,sans-serif" font-size="27" text-anchor="middle" fill="#182124" font-weight="bold">A₄: two graph thermal boundary sectors</text>
<text x="450" y="64" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">δ = φ = (1 + √5)/2     index = φ²     V = {1, 3}</text>
<line x1="140" y1="117" x2="340" y2="117" stroke="#52636c" stroke-width="3"/>
<line x1="340" y1="117" x2="540" y2="117" stroke="#52636c" stroke-width="3"/>
<line x1="540" y1="117" x2="740" y2="117" stroke="#52636c" stroke-width="3"/>
<circle cx="140" cy="117" r="19" fill="#ffffff" stroke="#155d7a" stroke-width="3"/>
<text x="140" y="124" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#155d7a" font-weight="bold">0</text>
<text x="140" y="163" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#182124" font-weight="normal">even vertex</text>
<circle cx="340" cy="117" r="19" fill="#155d7a" stroke="#155d7a" stroke-width="3"/>
<text x="340" y="124" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<text x="340" y="163" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#182124" font-weight="normal">odd endpoint</text>
<circle cx="540" cy="117" r="19" fill="#ffffff" stroke="#155d7a" stroke-width="3"/>
<text x="540" y="124" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#155d7a" font-weight="bold">2</text>
<text x="540" y="163" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#182124" font-weight="normal">even vertex</text>
<circle cx="740" cy="117" r="19" fill="#155d7a" stroke="#155d7a" stroke-width="3"/>
<text x="740" y="124" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<text x="740" y="163" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#182124" font-weight="normal">odd endpoint</text>
<text x="450" y="201" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#182124" font-weight="normal">B = [[1, 1], [1, 0]]     λ = φ     π = (φ², 1)/(φ² + 1)</text>
<text x="450" y="236" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">P = [[1/φ, 1/φ²], [1, 0]]     Pₙ = (λP + e⁻ᵝⁿI)/(λ + e⁻ᵝⁿ)</text>
<rect x="30" y="267" width="390" height="213" rx="12" fill="#eaf3f5" stroke="#d2dde0"/>
<text x="225" y="305" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#182124" font-weight="bold">Negative indices n = −k</text>
<rect x="480" y="267" width="390" height="213" rx="12" fill="#f5f2e8" stroke="#d2dde0"/>
<text x="675" y="305" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#182124" font-weight="bold">Positive indices n = k</text>
<text x="225" y="346" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#182124" font-weight="normal">P₋ₖ → I; changes are summable</text>
<text x="225" y="380" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#182124" font-weight="normal">Lₘ = ∏ₖ₌ₘ₊₁∞ P₋ₖ → I</text>
<text x="225" y="415" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">Keeps the limiting vector h</text>
<text x="225" y="451" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#182124" font-weight="normal">Extreme h: (1/π₁, 0), (0, 1/π₃)</text>
<text x="675" y="346" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">Pₖ → P; P is primitive</text>
<text x="675" y="380" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">∏ₖ₌ₘ₊₁ᴺ Pₖ → Π as N → ∞</text>
<text x="675" y="415" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#182124" font-weight="normal">Π(a, b) = πᵦ</text>
<text x="675" y="451" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">Forgets the right endpoint</text>
<text x="450" y="522" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#182124" font-weight="bold">Finite path window for Aₘ</text>
<line x1="105" y1="552" x2="795" y2="552" stroke="#52636c" stroke-width="3"/>
<circle cx="105" cy="552" r="7" fill="#155d7a"/>
<circle cx="795" cy="552" r="7" fill="#155d7a"/>
<text x="105" y="584" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">−2m−1</text>
<text x="795" y="584" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#182124" font-weight="normal">2m+1</text>
<text x="450" y="584" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#182124" font-weight="normal">Hₘ = Σₙ₌₋ₘᵐ n e₂ₙ</text>
<text x="450" y="629" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#182124" font-weight="normal">Canonical mixture: π₁ ω⁽¹⁾ + π₃ ω⁽³⁾</text>
</svg>
