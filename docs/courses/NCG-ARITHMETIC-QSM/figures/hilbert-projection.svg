<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" role="img" aria-labelledby="title desc">
<title id="title">Orthogonal projection onto the line spanned by (2,1)</title>
<desc id="desc">A real plane in the complex projection theorem. Vector x is (1,3), its projection p is (2,1), and the residual is (-1,2). Both p and the residual have squared norm five. The exact distance identity holds for every complex coefficient.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#355fd3"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#176b7b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45b18"/></marker></defs>
<rect width="820" height="750" fill="#ffffff"/>
<rect x="20" y="20" width="780" height="710" rx="14" fill="#f3f7f8" stroke="#c8d9df"/>
<text x="42" y="59" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#182124">Orthogonal projection in a real plane</text>
<text x="42" y="88" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182124">Theorem 32.3 • this is a section of the complex Hilbert-space result</text>
<line x1="130" y1="525" x2="130" y2="111" stroke="#e2e9ec" stroke-width="1"/>
