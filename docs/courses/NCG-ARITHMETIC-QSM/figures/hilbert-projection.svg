<line x1="490" y1="525" x2="490" y2="111" stroke="#e2e9ec" stroke-width="1"/>
<line x1="610" y1="525" x2="610" y2="111" stroke="#e2e9ec" stroke-width="1"/>
<line x1="76" y1="495" x2="712" y2="495" stroke="#e2e9ec" stroke-width="1"/>
<line x1="76" y1="375" x2="712" y2="375" stroke="#e2e9ec" stroke-width="1"/>
<line x1="76" y1="255" x2="712" y2="255" stroke="#e2e9ec" stroke-width="1"/>
<line x1="76" y1="135" x2="712" y2="135" stroke="#e2e9ec" stroke-width="1"/>
<line x1="76" y1="495" x2="712" y2="495" stroke="#71878f" stroke-width="1.5"/>
<line x1="130" y1="525" x2="130" y2="111" stroke="#71878f" stroke-width="1.5"/>
<text x="245" y="519" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#526970">1</text>
<text x="365" y="519" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#526970">2</text>
<text x="485" y="519" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#526970">3</text>
<text x="605" y="519" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#526970">4</text>
<text x="107" y="380" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#526970">1</text>
<text x="107" y="260" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#526970">2</text>
<text x="107" y="140" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#526970">3</text>
<line x1="76" y1="522" x2="712" y2="204" stroke="#95b0ba" stroke-width="3"/>
<line x1="130" y1="495" x2="250" y2="135" stroke="#176b7b" stroke-width="3.5" marker-end="url(#teal)"/>
<line x1="130" y1="495" x2="370" y2="375" stroke="#355fd3" stroke-width="4" marker-end="url(#blue)"/>
<line x1="370" y1="375" x2="250" y2="135" stroke="#b45b18" stroke-width="3.5" marker-end="url(#orange)"/>
<circle cx="250" cy="135" r="5" fill="#182124"/>
<circle cx="370" cy="375" r="5" fill="#182124"/>
<line x1="343.6" y1="388.2" x2="330.4" y2="361.8" stroke="#526970" stroke-width="1.7"/>
<line x1="330.4" y1="361.8" x2="356.8" y2="348.6" stroke="#526970" stroke-width="1.7"/>
<text x="104" y="524" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#182124">0</text>
<text x="262" y="132" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#176b7b">x = (1,3)</text>
<text x="385" y="380" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#355fd3">p = (2,1)</text>
<text x="316" y="240" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#b45b18">r = x − p = (−1,2)</text>
<text x="606" y="300" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#526970">L = span(2,1)</text>
<text x="54" y="563" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#182124">p · r = 0;  ‖p‖² = 5;  ‖r‖² = 5;  ‖x‖² = 10</text>
<rect x="42" y="586" width="736" height="118" rx="9" fill="#ffffff" stroke="#c8d9df"/>
<text x="61" y="617" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#182124">P_L = (1/5) [[4,2],[2,1]]</text>
<text x="61" y="649" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#182124">‖x − t(2,1)‖² = 5 + 5|t − 1|²   for every complex t</text>
<text x="61" y="683" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#182124">Nearest vector: t = 1 • exact proof: (32.4)–(32.5), Exercise 60</text>
</svg>
