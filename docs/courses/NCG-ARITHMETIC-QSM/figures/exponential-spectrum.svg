<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 610" role="img" aria-labelledby="title desc">
<title id="title">The spectral exponential sends imaginary-part levels to radius circles</title>
<desc id="desc">The map lambda to exp(i lambda) sends Im lambda equal to 1, 0, minus 1 to circles with exact radii exp(minus 1), 1, exp(1). Only Im lambda equal to zero can map to a unitary spectral value. Circle radii use a common linear scale.</desc>
<rect width="840" height="610" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<text x="190" y="42" fill="#182124" font-family="sans-serif" font-size="24" text-anchor="middle">Input: λ = s + it</text>
<text x="620" y="42" fill="#182124" font-family="sans-serif" font-size="24" text-anchor="middle">Output: exp(iλ)</text>
<line x1="190" y1="95" x2="190" y2="385" stroke="#68777c" stroke-width="2"/>
<line x1="40" y1="240" x2="340" y2="240" stroke="#182124" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="198" y="88" fill="#182124" font-family="sans-serif" font-size="19" text-anchor="start">Im λ</text>
<text x="290" y="271" fill="#182124" font-family="sans-serif" font-size="19" text-anchor="start">Re λ</text>
<line x1="40" y1="170" x2="340" y2="170" stroke="#147cac" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle cx="190" cy="170" r="4" fill="#147cac"/>
<text x="202" y="158" fill="#147cac" font-family="sans-serif" font-size="21" text-anchor="start">i</text>
<line x1="40" y1="240" x2="340" y2="240" stroke="#ac640d" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle cx="190" cy="240" r="4" fill="#ac640d"/>
<text x="202" y="228" fill="#ac640d" font-family="sans-serif" font-size="21" text-anchor="start">0</text>
<line x1="40" y1="310" x2="340" y2="310" stroke="#b33750" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle cx="190" cy="310" r="4" fill="#b33750"/>
<text x="202" y="298" fill="#b33750" font-family="sans-serif" font-size="21" text-anchor="start">−i</text>
<line x1="352" y1="225" x2="423" y2="225" stroke="#182124" stroke-width="2" marker-end="url(#arrow)"/>
<text x="388" y="198" fill="#182124" font-family="sans-serif" font-size="21" text-anchor="middle">λ ↦ eⁱλ</text>
<line x1="435" y1="280" x2="810" y2="280" stroke="#68777c" stroke-width="2"/>
<line x1="620" y1="95" x2="620" y2="462" stroke="#68777c" stroke-width="2"/>
<circle cx="620" cy="280" r="163.096909708" fill="none" stroke="#b33750" stroke-width="3" data-imaginary-level="-1" data-exact-radius="e"/>
<circle cx="783.096909708" cy="280" r="4" fill="#b33750"/>
<circle cx="620" cy="280" r="60.000000000" fill="none" stroke="#ac640d" stroke-width="3" data-imaginary-level="0" data-exact-radius="1"/>
<circle cx="680.000000000" cy="280" r="4" fill="#ac640d"/>
<circle cx="620" cy="280" r="22.072766470" fill="none" stroke="#147cac" stroke-width="3" data-imaginary-level="1" data-exact-radius="e^-1"/>
<circle cx="642.072766470" cy="280" r="4" fill="#147cac"/>
<path d="M602.268787601,337.320189348 A60,60 0 0,0 637.731212399,337.320189348" fill="none" stroke="#ac640d" stroke-width="3" marker-end="url(#arrow)" data-orientation="counterclockwise-as-s-increases"/>
<text x="650" y="478" fill="#182124" font-family="sans-serif" font-size="18" text-anchor="middle">Common linear radius scale</text>
<line x1="55" y1="502" x2="95" y2="502" stroke="#147cac" stroke-width="4"/>
<text x="110" y="510" fill="#147cac" font-family="sans-serif" font-size="24" text-anchor="start">t = 1  →  |eⁱλ| = e⁻¹ &lt; 1</text>
<line x1="55" y1="542" x2="95" y2="542" stroke="#ac640d" stroke-width="4"/>
<text x="110" y="550" fill="#ac640d" font-family="sans-serif" font-size="24" text-anchor="start">t = 0  →  |eⁱλ| = 1</text>
<line x1="55" y1="582" x2="95" y2="582" stroke="#b33750" stroke-width="4"/>
<text x="110" y="590" fill="#b33750" font-family="sans-serif" font-size="24" text-anchor="start">t = −1 →  |eⁱλ| = e &gt; 1</text>
<text x="440" y="552" fill="#182124" font-family="sans-serif" font-size="24" text-anchor="start">Unitarity forces t = 0.</text>
</svg>
