<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1040" viewBox="0 0 820 1040" role="img" aria-labelledby="title desc">
<title id="title">The rooted Jones window and its thermal factor</title>
<desc id="desc">A4 with base1 and root0; faithful finite compression, canonical endpoint Gibbs masses with lower bound phi to the minus3, and bounded strong lifts identifying the Jones closure with a type II infinity graph factor.</desc>
<rect width="820" height="1040" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#17657b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#182124}.heading{font-size:24px;font-weight:700}.label{font-size:22px}.small{font-size:19px}.box{fill:#f3f7f8;stroke:#cad8dd;stroke-width:1.5}.line{stroke:#17657b;stroke-width:2.5;fill:none}</style>
<rect x="20" y="20" width="780" height="225" rx="12" class="box"/>
<text x="42" y="58" class="heading" text-anchor="start">1. A line graph with endpoint root 0</text>
<path d="M120,119 L310,119" class="line"/>
<path d="M310,119 L500,119" class="line"/>
<path d="M500,119 L690,119" class="line"/>
<circle cx="120" cy="119" r="17" fill="#17657b" stroke="#17657b" stroke-width="2"/>
<text x="120" y="90" class="label" text-anchor="middle">0</text>
<text x="120" y="159" class="small" text-anchor="middle">odd</text>
<circle cx="310" cy="119" r="17" fill="#fff" stroke="#17657b" stroke-width="2"/>
<text x="310" y="90" class="label" text-anchor="middle">1</text>
<text x="310" y="159" class="small" text-anchor="middle">even</text>
<circle cx="500" cy="119" r="17" fill="#17657b" stroke="#17657b" stroke-width="2"/>
<text x="500" y="90" class="label" text-anchor="middle">2</text>
<text x="500" y="159" class="small" text-anchor="middle">odd</text>
<circle cx="690" cy="119" r="17" fill="#fff" stroke="#17657b" stroke-width="2"/>
<text x="690" y="90" class="label" text-anchor="middle">3</text>
<text x="690" y="159" class="small" text-anchor="middle">even</text>
<text x="120" y="194" class="small" text-anchor="middle">root</text>
<text x="310" y="194" class="small" text-anchor="middle">base</text>
<text x="42" y="229" class="small" text-anchor="start">δ = φ, λ = φ, v₂/v₀ = φ;   B = [[0, 1], [1, 1]]</text>
<rect x="20" y="263" width="780" height="238" rx="12" class="box"/>
<text x="42" y="301" class="heading" text-anchor="start">2. The local isomorphism — Lemma 19.1</text>
<rect x="52" y="330" width="240" height="66" fill="#fff" stroke="#cad8dd"/>
<rect x="436" y="330" width="312" height="66" fill="#fff" stroke="#cad8dd"/>
<text x="172" y="371" class="label" text-anchor="middle">J_N</text>
<text x="592" y="371" class="label" text-anchor="middle">q_N⁰ A_N q_N⁰</text>
<path d="M306,363 L419,363" class="line" marker-end="url(#arrow)"/>
<text x="362" y="343" class="label" text-anchor="middle">ρ_N</text>
<text x="42" y="431" class="label" text-anchor="start">ρ_N(x) = q_N⁰ x;  rooted path length = 4N + 2</text>
<text x="42" y="468" class="label" text-anchor="start">x_N = ρ_N⁻¹(q_N⁰a),   ‖x_N‖ ≤ ‖a‖     (19.9)</text>
<rect x="20" y="519" width="780" height="275" rx="12" class="box"/>
<text x="42" y="557" class="heading" text-anchor="start">3. Canonical Gibbs block masses</text>
<text x="42" y="595" class="label" text-anchor="start">w_m(b) = Q_m(0, b)     (19.4)</text>
<text x="42" y="654" class="small" text-anchor="start">m=0, b=0</text>
<rect x="220" y="632" width="510" height="28" fill="#e5ecef"/>
<rect x="220" y="632" width="194.8027" height="28" fill="#17657b"/>
<text x="424.80266573755364" y="654" class="label" text-anchor="start">φ⁻²</text>
<text x="42" y="710" class="small" text-anchor="start">m=0, b=2</text>
<rect x="220" y="688" width="510" height="28" fill="#e5ecef"/>
<rect x="220" y="688" width="315.1973" height="28" fill="#17657b"/>
<text x="545.1973342624464" y="710" class="label" text-anchor="start">φ⁻¹</text>
<path d="M340.3947,624 L340.3947,724" stroke="#b46324" stroke-width="3" stroke-dasharray="6 4"/>
<text x="42" y="754" class="label" text-anchor="start">Every w_m(b) ≥ φ⁻³;  Jones KMS χ ≤ φ³ ω_can</text>
<text x="42" y="783" class="small" text-anchor="start">m=0: C ⊕ C;   m=1: M₅ ⊕ M₈     (rooted A₄)</text>
<rect x="20" y="813" width="780" height="200" rx="12" class="box"/>
<text x="42" y="851" class="heading" text-anchor="start">4. Recover the thermal factor — Theorem 19.2</text>
<text x="42" y="892" class="label" text-anchor="start">q_N⁰ → 1 strongly in the root-0 graph sector</text>
<text x="42" y="930" class="label" text-anchor="start">‖(x_N − a)ξ‖ ≤ 2‖a‖ ‖(1 − q_N⁰)ξ‖ → 0</text>
<text x="42" y="971" class="label" text-anchor="start">Jones closure M_J = M₀, of type II∞ at index φ²</text>
<text x="42" y="999" class="small" text-anchor="start">Theorem 19.2 also proves uniqueness for every β &gt; 0.</text>
</svg>
