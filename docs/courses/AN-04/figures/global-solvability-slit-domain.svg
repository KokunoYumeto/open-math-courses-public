<svg xmlns="http://www.w3.org/2000/svg" width="430" height="500" viewBox="0 0 430 500" role="img" aria-labelledby="title desc">
  <title id="title">Characteristic excursions approach the removed origin</title>
  <desc id="desc">Base projection of X equal to the plane minus the ray x=0,y at least zero. The compact set K consists of the two vertical segments x=-1 and x=1 with y from minus one to zero. Horizontal characteristic intervals at heights minus one, minus one half and minus one quarter have endpoints in K. Their marked midpoints converge to the missing origin. The flow arrows point in the positive x direction; every strip carries the positive covector dy. Proof: the global-solvability lesson, Exercise 2, formula GS19.</desc>
  <metadata>Original mathematical drawing. CC0-1.0. Exact affine diagram of the base projection; three numerical samples j=1,2,4. The upper removed ray continues beyond the drawing.</metadata>
  <defs>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#205ca2"/></marker>
    <marker id="ray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ad2639"/></marker>
  </defs>
  <rect x="0" y="0" width="430" height="500" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#233b49">
    <text x="22" y="26" font-size="20" font-weight="600">Excursions in the slit plane</text>
    <text x="22" y="53">Flow: ∂x. Covector on each strip: +dy.</text>
    <path d="M215 150L215 73" stroke="#ad2639" stroke-width="5" marker-end="url(#ray)"/>
    <text x="232" y="94" fill="#ad2639">removed ray</text>
    <text x="232" y="117" fill="#ad2639">x = 0, y ≥ 0</text>
    <path d="M45 150H385" stroke="#9aabb6" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="50" y="143" fill="#536875">y = 0</text>
    <circle cx="215" cy="150" r="7" fill="#ffffff" stroke="#ad2639" stroke-width="3"/>
    <text x="183" y="174" fill="#ad2639">(0,0) ∉ X</text>
    <path d="M85 150V410M345 150V410" stroke="#23734e" stroke-width="6"/>
    <circle cx="85" cy="150" r="4" fill="#23734e"/><circle cx="345" cy="150" r="4" fill="#23734e"/>
    <text x="60" y="191" fill="#23734e">K</text><text x="358" y="191" fill="#23734e">K</text>
    <g stroke="#205ca2" stroke-width="2" fill="none">
      <path d="M85 215H315" marker-end="url(#flow)"/><path d="M315 215H345"/>
      <path d="M85 280H315" marker-end="url(#flow)"/><path d="M315 280H345"/>
      <path d="M85 410H315" marker-end="url(#flow)"/><path d="M315 410H345"/>
    </g>
    <g fill="#d18a16" stroke="#875506" stroke-width="1">
      <circle cx="215" cy="215" r="5"/><circle cx="215" cy="280" r="5"/><circle cx="215" cy="410" r="5"/>
    </g>
    <text x="22" y="220" fill="#205ca2">−1/4</text><text x="357" y="220" fill="#205ca2">j = 4</text>
    <text x="22" y="285" fill="#205ca2">−1/2</text><text x="357" y="285" fill="#205ca2">j = 2</text>
    <text x="37" y="415" fill="#205ca2">−1</text><text x="357" y="415" fill="#205ca2">j = 1</text>
    <text x="64" y="438">x = −1</text><text x="191" y="438">x = 0</text><text x="324" y="438">x = 1</text>
    <text x="22" y="468">Midpoints (0,−1/j) → the missing origin.</text>
    <text x="22" y="491">Every compact subset of X omits the tail.</text>
  </g>
</svg>
