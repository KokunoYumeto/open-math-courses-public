<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">A middle commutator lies outside every matching return interval</title>
<desc id="desc">Exact flat model p=tau on a fixed trajectory z=0, tau=0, zeta nonzero. Horizontal coordinates are x=500+130t. Endpoints s and t in minus one to one require a forward matching middle v between them. The cutoff is one on minus two to two, while its derivative has support minus three to minus two and two to three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243e4b"/></marker></defs>
<rect width="1000" height="440" rx="12" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#243e4b">
<text x="50" y="40" font-size="23" font-weight="600">The compact middle cannot meet the commutator wavefront</text>
<text x="50" y="71" font-size="17">Exact trajectory: p=τ, z=0, τ=0, ζ≠0.  Horizontal coordinate: x=500+130t.</text>
<path d="M92 116H914" stroke="#243e4b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="930" y="121" font-size="18">time</text>
<g stroke="#243e4b"><path d="M110 110V122M240 110V122M370 110V122M500 110V122M630 110V122M760 110V122M890 110V122"/></g>
<g text-anchor="middle" font-size="17"><text x="110" y="145">−3</text><text x="240" y="145">−2</text><text x="370" y="145">−1</text><text x="500" y="145">0</text><text x="630" y="145">1</text><text x="760" y="145">2</text><text x="890" y="145">3</text></g>
<rect x="110" y="175" width="130" height="28" rx="3" fill="#b04a42"/>
<rect x="760" y="175" width="130" height="28" rx="3" fill="#b04a42"/>
<text x="500" y="195" text-anchor="middle" font-size="18" fill="#923c36">supp φ′ = [−3,−2] ∪ [2,3]</text>
<rect x="240" y="225" width="520" height="32" rx="3" fill="#d9e9e2" stroke="#3c7462"/>
<text x="500" y="248" text-anchor="middle" font-size="18">φ=1 on [−2,2]; return set K′</text>
<rect x="370" y="278" width="260" height="30" rx="3" fill="#3c7462"/>
<text x="500" y="300" text-anchor="middle" font-size="18" fill="#fff">endpoint set K = [−1,1]</text>
<path d="M435 345H597.5" stroke="#243e4b" stroke-width="3" marker-end="url(#arrow)"/>
<g fill="#243e4b"><circle cx="435" cy="345" r="5"/><circle cx="532.5" cy="345" r="5"/><circle cx="597.5" cy="345" r="5"/></g>
<g text-anchor="middle" font-size="17"><text x="435" y="373">s=−1/2</text><text x="532.5" y="373">v=1/4</text><text x="614" y="373">t=3/4</text></g>
<text x="50" y="416" font-size="18">s≤v≤t with s,t∈[−1,1] forces v∈[−1,1], where dφ=0.  Proof: CM9–CM11.</text>
</g></svg>
