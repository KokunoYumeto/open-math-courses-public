<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">A displacement cutoff places signed errors away from the diagonal</title>
<desc id="desc">Exact flat characteristic section z equals w equals zero, with zero time covectors and fixed nonzero transverse covector. Source time s is horizontal and target time t vertical. Coordinates are x equals 420 plus 80 s and y equals 300 minus 80 t. The characteristic diagonal is t equals s. Residual bands are one to two units forward or backward; the cutoff plateau contains travel times between minus one and one. Signed correction tails continue beyond two units.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#243e4b"/></marker><clipPath id="plane"><rect x="180" y="60" width="480" height="480"/></clipPath></defs>
<rect width="1000" height="660" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#243e4b">
<text x="34" y="30" font-size="22" font-weight="650">The diagonal jump stays intact; cutoff errors occur later</text>
<g clip-path="url(#plane)">
<rect x="180" y="60" width="480" height="480" fill="#f5f7f8"/>
<polygon points="180,540 660,60 580,60 180,460" fill="#d7ecdf"/>
<polygon points="180,540 660,60 660,140 260,540" fill="#d7ecdf"/>
<polygon points="180,460 580,60 500,60 180,380" fill="#efcfb2"/>
<polygon points="260,540 660,140 660,220 340,540" fill="#efcfb2"/>
<g stroke="#bfc9ce" stroke-width="1">
<path d="M260 60V540M340 60V540M420 60V540M500 60V540M580 60V540M180 140H660M180 220H660M180 300H660M180 380H660M180 460H660"/>
</g>
<path d="M180 540L660 60" fill="none" stroke="#243e4b" stroke-width="3"/>
<g fill="none" stroke="#906041" stroke-width="1.8" stroke-dasharray="6 5">
<path d="M180 460L580 60M180 380L500 60M260 540L660 140M340 540L660 220"/>
</g>
<path d="M420 300V92M420 300V508" fill="none" stroke="#243e4b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="420" cy="300" r="5" fill="#243e4b"/>
</g>
<rect x="180" y="60" width="480" height="480" fill="none" stroke="#526b77" stroke-width="1.5"/>
<g font-size="17" text-anchor="middle">
<text x="180" y="567">−3</text><text x="260" y="567">−2</text><text x="340" y="567">−1</text><text x="420" y="567">0</text><text x="500" y="567">1</text><text x="580" y="567">2</text><text x="660" y="567">3</text>
</g>
<g font-size="17" text-anchor="end">
<text x="164" y="546">−3</text><text x="164" y="466">−2</text><text x="164" y="386">−1</text><text x="164" y="306">0</text><text x="164" y="226">1</text><text x="164" y="146">2</text><text x="164" y="66">3</text>
</g>
<text x="420" y="602" font-size="20" text-anchor="middle">source time s</text>
<text x="102" y="300" font-size="20" text-anchor="middle" transform="rotate(-90 102 300)">target time t</text>
<g font-size="18">
<rect x="265" y="277" width="102" height="32" rx="5" fill="#fff" fill-opacity=".94"/><text x="276" y="300">R₊ band</text>
<rect x="320" y="477" width="105" height="32" rx="5" fill="#fff" fill-opacity=".94"/><text x="330" y="500">R₋ band</text>
<rect x="480" y="249" width="112" height="31" rx="5" fill="#fff" fill-opacity=".94"/><text x="490" y="272">t = s</text>
<text x="434" y="98">C₊</text><text x="434" y="514">C₋</text>
</g>
<g transform="translate(710 76)" font-size="18">
<text x="0" y="0" font-weight="650">Exact selected section</text>
<text x="0" y="34">z = w = 0</text><text x="0" y="64">τ = σ = 0, ζ = η ≠ 0</text>
<rect x="0" y="99" width="26" height="19" fill="#d7ecdf"/><text x="38" y="115">χ = 1: |t − s| &lt; 1</text>
<rect x="0" y="139" width="26" height="19" fill="#efcfb2"/><text x="38" y="155">supp χ′: delayed error</text>
<text x="0" y="203" font-weight="650">Forward band</text><text x="0" y="233">1 ≤ t − s ≤ 2</text>
<text x="0" y="276" font-weight="650">Backward band</text><text x="0" y="306">−2 ≤ t − s ≤ −1</text>
<text x="0" y="354">G₊ and G₋ continue</text><text x="0" y="383">on their signed tails.</text>
<text x="0" y="430" font-size="16">Band inclusion may be strict.</text><text x="0" y="456" font-size="16">Full kernel identities: LP8–LP10,</text><text x="0" y="480" font-size="16">and LP22–LP23.</text>
</g>
<text x="34" y="640" font-size="16">A characteristic base projection; the other full diagonal covectors are not shown.</text>
</g>
</svg>
