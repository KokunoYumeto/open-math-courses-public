<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620">
<rect width="1040" height="620" fill="#f7fafc"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#235470"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18354a;font-size:17px}.small{font-size:15px}.title{font-size:21px;font-weight:bold}.box{fill:white;stroke:#8aa6b7;stroke-width:1.5}</style>
<text x="28" y="34" class="title" text-anchor="start">A cap separated from both roots</text>
<text x="28" y="62" class="small" text-anchor="start">p = ζ² − 4x²η²; vertical coordinate s = ζ / |η|</text>
<rect x="75" y="107.0" width="158.7713240271471" height="396.0" fill="#eaf0f5"/>
<rect x="75" y="107.0" width="374.0" height="70.98294077828231" fill="#d5eade"/>
<rect x="75" y="432.01705922171766" width="374.0" height="70.98294077828234" fill="#d5eade"/>
<line x1="75" y1="305" x2="471.0" y2="305" stroke="#235470" stroke-width="2" marker-end="url(#arr)"/>
<line x1="75" y1="511.79999999999995" x2="75" y2="91.6" stroke="#235470" stroke-width="2" marker-end="url(#arr)"/>
<text x="475.0" y="330" class="" text-anchor="start">x</text>
<text x="85" y="86.6" class="" text-anchor="start">s</text>
<line x1="75" y1="432.01705922171766" x2="449.0" y2="432.01705922171766" stroke="#5f9777" stroke-width="2"/>
<text x="113.5" y="455.01705922171766" class="small" text-anchor="start">−1/√3</text>
<line x1="75" y1="177.9829407782823" x2="449.0" y2="177.9829407782823" stroke="#5f9777" stroke-width="2"/>
<text x="113.5" y="167.9829407782823" class="small" text-anchor="start">1/√3</text>
<line x1="75" y1="305" x2="449.0" y2="454.6" stroke="#8c6655" stroke-width="3"/>
<text x="416.0" y="476.4" class="small" text-anchor="start">s = −2x</text>
<line x1="75" y1="305" x2="449.0" y2="155.39999999999998" stroke="#8c6655" stroke-width="3"/>
<text x="416.0" y="146.6" class="small" text-anchor="start">s = 2x</text>
<line x1="233.7713240271471" y1="503.0" x2="233.7713240271471" y2="107.0" stroke="#567d9c" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="228.7713240271471" y1="305" x2="238.7713240271471" y2="305" stroke="#235470" stroke-width="2"/>
<text x="233.7713240271471" y="335" class="small" text-anchor="middle">1/(4√3)</text>
<circle cx="233.7713240271471" cy="368.50852961085883" r="4" fill="#8c6655"/>
<circle cx="233.7713240271471" cy="241.49147038914117" r="4" fill="#8c6655"/>
<text x="28" y="551" class="small" text-anchor="start">Within the collar and shaded cap:</text>
<text x="28" y="578" class="small" text-anchor="start">ζ² − 4x²η² ≥ 3ζ²/4. Pure normal directions</text>
<text x="28" y="602" class="small" text-anchor="start">continue beyond this finite slope window.</text>
<text x="548" y="34" class="title" text-anchor="start">Keep both actual terms</text>
<rect x="534" y="84" width="487" height="88" rx="7" class="box"/>
<text x="549" y="115" class="" text-anchor="start">C u = x² Θ²H f + R u</text>
<text x="549" y="145" class="small" text-anchor="start">f = Pₐu; H is the complete elliptic parametrix.</text>
<line x1="775" y1="173" x2="775" y2="193" stroke="#235470" stroke-width="2" marker-end="url(#arr)"/>
<rect x="534" y="196" width="487" height="88" rx="7" class="box"/>
<text x="549" y="227" class="" text-anchor="start">Differentiate the weighted source part</text>
<text x="549" y="257" class="small" text-anchor="start">Dₓ²(x²v) = (Q² − 3iQ − 2I)v,  Q = xDₓ</text>
<line x1="775" y1="285" x2="775" y2="305" stroke="#235470" stroke-width="2" marker-end="url(#arr)"/>
<rect x="534" y="308" width="487" height="88" rx="7" class="box"/>
<text x="549" y="339" class="" text-anchor="start">Control R u by its residual source tree</text>
<text x="549" y="369" class="small" text-anchor="start">The full boundary remainder has an H² bound.</text>
<line x1="775" y1="397" x2="775" y2="417" stroke="#235470" stroke-width="2" marker-end="url(#arr)"/>
<rect x="534" y="420" width="487" height="88" rx="7" class="box"/>
<text x="549" y="451" class="" text-anchor="start">One fixed scalar source test A</text>
<text x="549" y="481" class="small" text-anchor="start">‖C u‖H² + equation + traces ≤ C (‖A f‖ + ‖u‖B)</text>
<text x="548" y="551" class="small" text-anchor="start">All coefficients and residual kernels are retained.</text>
<text x="548" y="578" class="small" text-anchor="start">The source test is fixed across the parameter family.</text>
<text x="548" y="602" class="small" text-anchor="start">The estimate applies to the stated elliptic cap.</text>
</svg>
