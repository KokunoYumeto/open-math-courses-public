<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="title desc">
<title id="title">Cone and collar costs in the normal-energy estimate</title>
<desc id="desc">Exact lines theta equals one eighth plus twice h and two theta equals one quarter plus four h, for h from zero to one eighth. The source term remains separate.</desc>
<rect width="780" height="390" fill="white"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#18334a">
<text x="30" y="30" font-size="21" font-weight="bold">Both localization widths enter the coefficient</text>
<text x="30" y="56">a₀ = b₀ = C = 1,  ω = 1/8,  γ = θ</text>
<path d="M100 290.0 H580" stroke="#dce4ea"/><text x="88" y="295.0" text-anchor="end">0</text>
<path d="M100 258.0 H580" stroke="#dce4ea"/><text x="88" y="263.0" text-anchor="end">1/8</text>
<path d="M100 226.0 H580" stroke="#dce4ea"/><text x="88" y="231.0" text-anchor="end">1/4</text>
<path d="M100 162.0 H580" stroke="#dce4ea"/><text x="88" y="167.0" text-anchor="end">1/2</text>
<path d="M100 98.0 H580" stroke="#dce4ea"/><text x="88" y="103.0" text-anchor="end">3/4</text>
<path d="M100 85 V290 H590" fill="none" stroke="#18334a" stroke-width="2"/>
<path d="M100.0 290 v6" stroke="#18334a"/><text x="100.0" y="318" text-anchor="middle">0</text>
<path d="M340.0 290 v6" stroke="#18334a"/><text x="340.0" y="318" text-anchor="middle">1/16</text>
<path d="M580.0 290 v6" stroke="#18334a"/><text x="580.0" y="318" text-anchor="middle">1/8</text>
<path d="M100 258.0 L580 194.0" stroke="#167497" stroke-width="4" fill="none"/>
<circle cx="100" cy="258.0" r="5" fill="white" stroke="#167497" stroke-width="2"/>
<path d="M100 226.0 L580 98.0" stroke="#b8560a" stroke-width="4" fill="none"/>
<circle cx="100" cy="226.0" r="5" fill="white" stroke="#b8560a" stroke-width="2"/>
<text x="597" y="102" fill="#b8560a">2θ = 1/4 + 4h</text>
<text x="597" y="198" fill="#167497">θ = 1/8 + 2h</text>
<text x="390" y="345">normal collar width h</text>
<text x="30" y="378">Exact coefficients only. Source norm remains; h = 0 is a limit.</text></g></svg>
