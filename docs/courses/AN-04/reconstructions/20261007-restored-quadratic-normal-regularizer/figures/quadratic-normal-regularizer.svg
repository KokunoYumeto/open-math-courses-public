<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
  <title id="title">Quadratic normal error and removal of a boundary regularizer</title>
  <desc id="desc">One ordinary normal derivative on each factor. The exact parametrix identity retains three negative corrections. A fixed-width uniform Hilbert norm bound, with distributional convergence, yields the unregularized norm bound.</desc>
  <rect width="780" height="440" fill="#f8fafc" />
  <text x="22" y="30" font-family="Arial, sans-serif" font-size="20" fill="#132238" font-weight="bold">Quadratic error: normalize both normal factors</text>
  <rect x="22" y="48" width="344" height="72" rx="8" fill="white" stroke="#6585a7" stroke-width="1.3" />
  <rect x="407" y="48" width="351" height="72" rx="8" fill="white" stroke="#6585a7" stroke-width="1.3" />
  <line x1="369" y1="84" x2="400" y2="84" stroke="#34567b" stroke-width="2" />
  <path d="M 393 80 L 400 84 L 393 88" fill="none" stroke="#34567b" stroke-width="2" />
  <text x="35" y="74" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="normal">g = DₓBu,    w = Tg,    T⁻T = I + E</text>
  <text x="35" y="99" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">e = Eg has residual coefficients (QR2–QR7)</text>
  <text x="420" y="74" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="normal">F = (T⁻)* R T⁻,    ‖f₀‖ ≤ M/ε</text>
  <text x="420" y="99" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">‖Fw‖ ≤ (2M/ε)‖w‖ + C Xν (QR13)</text>
  <rect x="22" y="137" width="736" height="66" rx="8" fill="white" stroke="#6585a7" stroke-width="1.3" />
  <text x="35" y="162" font-family="Arial, sans-serif" font-size="17" fill="#132238" font-weight="bold">(Rg,g) = (Fw,w) − (Re,g) − (Rg,e) − (Re,e)</text>
  <text x="35" y="187" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">Every signed tail has a bare energy bound. Only b-coefficient adjoints move. (QR5, QR8)</text>
  <rect x="22" y="220" width="736" height="58" rx="8" fill="white" stroke="#6585a7" stroke-width="1.3" />
  <text x="35" y="243" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="normal">‖w‖² ≤ C_N ω ‖Bu‖² + K Zν²    ⇒    quadratic leading coefficient 2M C_N ω/ε + γ</text>
  <text x="35" y="265" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">ω ≤ C_w εδ gives 2M C_N C_w δ + γ; all lower/source errors remain. (QR15–QR16)</text>
  <text x="22" y="311" font-family="Arial, sans-serif" font-size="20" fill="#132238" font-weight="bold">Regularizer limit: fix the spatial widths first</text>
  <rect x="22" y="329" width="344" height="62" rx="8" fill="white" stroke="#6585a7" stroke-width="1.3" />
  <rect x="407" y="329" width="351" height="62" rx="8" fill="white" stroke="#6585a7" stroke-width="1.3" />
  <line x1="369" y1="360" x2="400" y2="360" stroke="#34567b" stroke-width="2" />
  <path d="M 393 356 L 400 360 L 393 364" fill="none" stroke="#34567b" stroke-width="2" />
  <text x="35" y="353" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="normal">Bᵣ = BΛᵣ,   individual order ν − L ≤ 0</text>
  <text x="35" y="377" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">Bᵣu → Bu in distributions (QR22–QR23)</text>
  <text x="420" y="353" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">supᵣ ‖Bᵣu‖ℋ ≤ C  ⇒  ‖Bu‖ℋ ≤ C</text>
  <text x="420" y="377" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">ℋ = L2 or V, with the same norm (QR24–QR25)</text>
  <text x="22" y="421" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">Both form domains retained. No positive-commutator estimate or uniform shrinking-width bound is asserted.</text>
</svg>