<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Compact logarithmic kernels and one scalar test</title>
<desc id="desc">The exact support wedge y over two at most x at most two y, zero at most y at most one, includes the boundary corner. The other panel gives the input cutoff, logarithmic unitary, positive multiplier and bounded quotient in their actual order.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17314b} .title{font-size:25px;font-weight:bold}.head{font-size:21px;font-weight:bold}.body{font-size:18px}.small{font-size:16px}.axis{stroke:#17314b;stroke-width:2}.grid{stroke:#dce3ea;stroke-width:1}.box{fill:#f3f7fa;stroke:#8fa3b6;stroke-width:1.5}</style>
<rect width="1200" height="660" fill="white"/>
<text x="40" y="43" class="title">Compact logarithmic kernels and one scalar source test</text>
<text x="40" y="84" class="head">Exact allowed normal support</text>
<text x="650" y="84" class="head">The full factorization, in order</text>
<line x1="90.0" y1="530.0" x2="519.0" y2="530.0" class="grid" />
<text x="76" y="535.0" class="small" text-anchor="end">0</text>
<line x1="90.0" y1="440.0" x2="519.0" y2="440.0" class="grid" />
<text x="76" y="445.0" class="small" text-anchor="end">0.5</text>
<line x1="90.0" y1="350.0" x2="519.0" y2="350.0" class="grid" />
<text x="76" y="355.0" class="small" text-anchor="end">1</text>
<line x1="90.0" y1="260.0" x2="519.0" y2="260.0" class="grid" />
<text x="76" y="265.0" class="small" text-anchor="end">1.5</text>
<line x1="90.0" y1="170.0" x2="519.0" y2="170.0" class="grid" />
<text x="76" y="175.0" class="small" text-anchor="end">2</text>
<line x1="90.0" y1="530.0" x2="90.0" y2="134.0" class="grid" />
<text x="90.0" y="555" class="small" text-anchor="middle">0</text>
<line x1="285.0" y1="530.0" x2="285.0" y2="134.0" class="grid" />
<text x="285.0" y="555" class="small" text-anchor="middle">0.5</text>
<line x1="480.0" y1="530.0" x2="480.0" y2="134.0" class="grid" />
<text x="480.0" y="555" class="small" text-anchor="middle">1</text>
<polygon points="90.0,530.0 480.0,440.0 480.0,170.0" fill="#d0e5f5" stroke="#2878b7" stroke-width="2.5"/>
<line x1="90" y1="530" x2="537" y2="530" class="axis" />
<line x1="90" y1="530" x2="90" y2="125" class="axis" />
<circle cx="90" cy="530" r="5" fill="#bc4d37"/>
<text x="90" y="120" class="body" text-anchor="start">x: output</text>
<text x="355" y="584" class="body" text-anchor="start">y: input</text>
<text x="296" y="260" class="body" text-anchor="start">x = 2y</text>
<text x="315" y="494" class="body" text-anchor="start">x = y/2</text>
<text x="489" y="151" class="small" text-anchor="start">y = 1</text>
<text x="40" y="622" class="small" text-anchor="start">The corner is retained. Shading gives support bounds,</text>
<text x="40" y="645" class="small" text-anchor="start">not nonzero kernel values or a computed solution.</text>
<rect x="650" y="115" width="510" height="81" rx="8" class="box"/>
<text x="670" y="144" class="body" text-anchor="start">1. Localize the actual input</text>
<text x="670" y="173" class="small" text-anchor="start">χf; Tχ = T on the complete kernel</text>
<line x1="905" y1="197" x2="905" y2="217" class="axis" />
<path d="M900 212 L905 219 L910 212" fill="none" stroke="#17314b" stroke-width="2"/>
<rect x="650" y="227" width="510" height="81" rx="8" class="box"/>
<text x="670" y="256" class="body" text-anchor="start">2. Apply the L2 unitary</text>
<text x="670" y="285" class="small" text-anchor="start">g(v,z) = exp(v/2) χf(exp(v),z)</text>
<line x1="905" y1="309" x2="905" y2="329" class="axis" />
<path d="M900 324 L905 331 L910 324" fill="none" stroke="#17314b" stroke-width="2"/>
<rect x="650" y="339" width="510" height="81" rx="8" class="box"/>
<text x="670" y="368" class="body" text-anchor="start">3. Apply one positive multiplier</text>
<text x="670" y="397" class="small" text-anchor="start">q(D)g; compact difference kernel</text>
<line x1="905" y1="421" x2="905" y2="441" class="axis" />
<path d="M900 436 L905 443 L910 436" fill="none" stroke="#17314b" stroke-width="2"/>
<rect x="650" y="451" width="510" height="81" rx="8" class="box"/>
<text x="670" y="480" class="body" text-anchor="start">4. Apply the bounded quotient</text>
<text x="670" y="509" class="small" text-anchor="start">B = Op(a/q); uniform finite-derivative bound</text>
<text x="660" y="594" class="head" text-anchor="start">𝒰Tf = B q(D) 𝒰(χf)</text>
<text x="660" y="629" class="body" text-anchor="start">‖Tf‖₂ ≤ C ‖𝒰⁻¹q(D)𝒰(χf)‖₂</text>
</svg>
