<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
<title id="title">One finite corrected inverse, two error spaces</title>
<desc id="desc">P maps E to F and Q maps F to E. The error R F acts on F; R E acts on E. Both finite correction formulas agree, while the two remainders act on different spaces.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246497"/></marker></defs>
<rect width="1080" height="680" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#14283a}.title{font-size:27px;font-weight:bold}.head{font-size:23px;font-weight:bold}.body{font-size:20px}.small{font-size:17px}</style>
<text x="540" y="43" class="title" text-anchor="middle">One finite corrected inverse, two error spaces</text>
<rect x="110" y="125" width="90" height="85" rx="12" fill="#e4eff8" stroke="#246497"/>
<text x="155" y="180" class="head" text-anchor="middle">E</text>
<rect x="880" y="125" width="90" height="85" rx="12" fill="#e4eff8" stroke="#246497"/>
<text x="925" y="180" class="head" text-anchor="middle">F</text>
<path d="M220 146 H860" stroke="#246497" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M860 202 H220" stroke="#246497" stroke-width="3" marker-end="url(#arrow)"/>
<text x="540" y="126" class="body" text-anchor="middle">P : E → F       degree m</text>
<text x="540" y="242" class="body" text-anchor="middle">Q : F → E       degree −m</text>
<text x="210" y="294" class="head" text-anchor="middle">R_E = QP − I_E</text>
<text x="870" y="294" class="head" text-anchor="middle">R_F = PQ − I_F</text>
<text x="210" y="327" class="small" text-anchor="middle">acts on E; degree −1</text>
<text x="870" y="327" class="small" text-anchor="middle">acts on F; degree −1</text>
<text x="540" y="375" class="body" text-anchor="middle">R_E Q = Q R_F   (actual associativity)</text>
<rect x="72" y="400" width="936" height="86" rx="10" fill="#f0f5e7" stroke="#748b48"/>
<text x="540" y="435" class="head" text-anchor="middle">Q_N = Q ∑(−R_F)ʲ = ∑(−R_E)ʲ Q</text>
<text x="540" y="467" class="small" text-anchor="middle">Each sum is finite: j = 0, …, N − 1.   See PN18.</text>
<text x="270" y="542" class="head" text-anchor="middle">Q_N P = I_E − (−R_E)ᴺ</text>
<text x="810" y="542" class="head" text-anchor="middle">P Q_N = I_F − (−R_F)ᴺ</text>
<text x="270" y="576" class="small" text-anchor="middle">error on E has degree −N</text>
<text x="810" y="576" class="small" text-anchor="middle">error on F has degree −N</text>
<text x="540" y="622" class="small" text-anchor="middle">Both errors keep their complete signed-tail and separated-kernel estimates.</text>
<text x="540" y="651" class="small" text-anchor="middle">PN13, PN17–PN19. The seed Q is an actual operator; N is finite.</text>
</svg>
