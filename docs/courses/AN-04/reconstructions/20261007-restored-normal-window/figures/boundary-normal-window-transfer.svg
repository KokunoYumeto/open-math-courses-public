<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
  <title id="title">A boundary-fixed collar retains the full time-covector shift</title>
  <desc id="desc">Exact model at t=1: y=v+x squared over two, with v=0 and v=1 and x between zero and one. Dashed reference lines show the original v levels, solid quadratic curves show their images. These are coordinate lines, not characteristic rays. Full time and compressed normal covector shifts are labeled.</desc>
  <rect width="780" height="440" fill="#f8fafc" />
  <text x="22" y="29" font-family="Arial, sans-serif" font-size="20" fill="#132238" font-weight="bold">A normal form that preserves the boundary wavefront</text>
  <text x="28" y="56" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">Exact section at t = 1</text>
  <line x1="70" y1="306" x2="362.4" y2="306" stroke="#61748c" stroke-width="1.5" />
  <line x1="70" y1="306" x2="70" y2="91.30000000000001" stroke="#61748c" stroke-width="1.5" />
  <line x1="66" y1="211.0" x2="74" y2="211.0" stroke="#61748c" stroke-width="1.5" />
  <text x="38" y="216.0" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">0.5</text>
  <line x1="66" y1="116" x2="74" y2="116" stroke="#61748c" stroke-width="1.5" />
  <text x="38" y="121" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">1</text>
  <line x1="70" y1="302" x2="70" y2="310" stroke="#61748c" stroke-width="1.5" />
  <text x="62" y="328" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">0</text>
  <line x1="155.0" y1="302" x2="155.0" y2="310" stroke="#61748c" stroke-width="1.5" />
  <text x="147.0" y="328" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">0.5</text>
  <line x1="240" y1="302" x2="240" y2="310" stroke="#61748c" stroke-width="1.5" />
  <text x="232" y="328" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">1</text>
  <line x1="325.0" y1="302" x2="325.0" y2="310" stroke="#61748c" stroke-width="1.5" />
  <text x="317.0" y="328" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">1.5</text>
  <text x="51" y="93" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="bold">x</text>
  <text x="377" y="311" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="bold">y</text>
  <line x1="70" y1="306" x2="70" y2="116" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5" />
  <path d="M 70 306 Q 70 211.0 155.0 116" fill="none" stroke="#2563eb" stroke-width="2.7" />
  <circle cx="70" cy="306" r="4" fill="#2563eb" />
  <line x1="240" y1="306" x2="240" y2="116" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5" />
  <path d="M 240 306 Q 240 211.0 325.0 116" fill="none" stroke="#059669" stroke-width="2.7" />
  <circle cx="240" cy="306" r="4" fill="#059669" />
  <text x="115" y="103" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">y = x²/2</text>
  <text x="270" y="84" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">y = 1 + x²/2</text>
  <text x="130" y="353" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">Boundary points are fixed.</text>
  <rect x="420" y="47" width="338" height="311" rx="8" fill="white" stroke="#6a86a6" />
  <text x="435" y="72" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">Keep every covector component</text>
  <text x="435" y="106" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="normal">ρ = ξ + xt ζ</text>
  <text x="435" y="139" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">ϑ = τ + x² ζ/2</text>
  <text x="435" y="172" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="normal">η = ζ</text>
  <line x1="435" y1="190" x2="744" y2="190" stroke="#61748c" stroke-width="1.5" />
  <text x="435" y="215" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="normal">σ̂ = σ + x²t ζ</text>
  <text x="435" y="247" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="normal">R = (ϑ − x²η/2)² − η²</text>
  <text x="435" y="278" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">Time mixing remains in R.</text>
  <text x="435" y="305" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">x = O(s²) gives an O(s⁴)</text>
  <text x="435" y="329" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">coordinate error. (NC19), (NC23)</text>
  <rect x="22" y="373" width="736" height="49" rx="7" fill="white" stroke="#6a86a6" />
  <text x="35" y="394" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">Dashed: reference levels. Solid: exact collar images, not characteristic rays.</text>
  <text x="35" y="414" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">Proof: NC2–NC10, NC27–NC29. Primary geometric credit: Melrose–Sjöstrand XV.1.</text>
</svg>