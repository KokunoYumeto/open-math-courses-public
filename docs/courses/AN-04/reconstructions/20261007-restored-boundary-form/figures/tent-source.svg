<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
<title id="title">A tent function has a source consisting of two point masses</title>
<desc id="desc">On the half-line, u joins (0,0), (1,1), and (2,0), then remains zero. The interior source minus u double prime has weight plus two at one and minus one at two. The arrows represent distribution weights, not a density.</desc>
<rect width="840" height="420" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#183044">
<text x="32" y="31" font-size="21" font-weight="bold">The tent function and its interior source</text>
<text x="32" y="59" font-size="15">Exact coordinates from Exercise 5.3 • Dirichlet boundary value u(0) = 0</text>
<g stroke="#a9b6bd" stroke-width="1" stroke-dasharray="4 5">
<path d="M330 82V351 M570 82V351 M90 90H330"/></g>
<g fill="none" stroke="#556875" stroke-width="1.5"><path d="M90 78V218 M76 200H735 M90 310H735"/></g>
<text x="68" y="94" font-size="15">1</text><text x="69" y="221" font-size="15">0</text>
<text x="54" y="79" font-size="17">u</text><text x="744" y="205" font-size="17">x</text>
<path d="M90 200L330 90L570 200H690" fill="none" stroke="#087b86" stroke-width="4" stroke-linejoin="round"/>
<g fill="#087b86"><circle cx="90" cy="200" r="4"/><circle cx="330" cy="90" r="4"/><circle cx="570" cy="200" r="4"/></g>
<text x="164" y="117" font-size="16">slope +1</text><text x="404" y="116" font-size="16">slope −1</text>
<text x="610" y="180" font-size="16">slope 0</text>
<text x="270" y="79" font-size="15">(1, 1)</text>
<text x="83" y="235" font-size="15">0</text><text x="324" y="235" font-size="15">1</text><text x="564" y="235" font-size="15">2</text>
<text x="32" y="276" font-size="17" font-weight="bold">−u″</text><text x="744" y="315" font-size="17">x</text>
<path d="M330 310V254" stroke="#087b86" stroke-width="4"/><path d="M322 261L330 247L338 261Z" fill="#087b86"/>
<path d="M570 310V338" stroke="#b34b35" stroke-width="4"/><path d="M562 333L570 347L578 333Z" fill="#b34b35"/>
<text x="348" y="265" fill="#066873" font-size="17">weight +2 at x = 1</text>
<text x="584" y="344" fill="#943c2c" font-size="17">weight −1 at x = 2</text>
<text x="83" y="336" font-size="15">0</text><text x="320" y="335" font-size="15">1</text>
<text x="32" y="383" font-size="17">f(w) = 2 conjugate(w(1)) − conjugate(w(2)), for Dirichlet tests w.</text>
<text x="32" y="408" font-size="15">Arrows show point-mass weights, not values of an L2 density. Only the source on x &gt; 0 is shown.</text>
</g></svg>