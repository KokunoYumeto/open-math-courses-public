<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Global tangential-equator scalar assembly</title><desc id="desc">A bounded positive operator Q and a residual sandwich S have a smooth interior commutator. The normal cutoff margin and its interior error interval are exact.</desc><rect width="1100" height="660" fill="#f7f9fc"/><text x="30" y="39" font-family="Arial,sans-serif" font-size="28" fill="#162942">One scalar test on the whole manifold</text><text x="30" y="73" font-family="Arial,sans-serif" font-size="18" fill="#162942">Allowed cone contains every boundary tangential direction; full corner kernels remain.</text><rect x="30" y="105" width="320" height="86" rx="12" fill="white" stroke="#355a85" stroke-width="2"/><text x="45" y="135" font-family="Arial,sans-serif" font-size="22" fill="#162942">Q = B²,   R = I − Q</text><text x="45" y="164" font-family="Arial,sans-serif" font-size="17" fill="#162942">Q bounded, positive; elliptic on K</text><rect x="390" y="105" width="320" height="86" rx="12" fill="white" stroke="#355a85" stroke-width="2"/><text x="405" y="135" font-family="Arial,sans-serif" font-size="22" fill="#162942">P = χ p(Dv) χ</text><text x="405" y="164" font-family="Arial,sans-serif" font-size="17" fill="#162942">Bounded positive normal operator</text><rect x="750" y="105" width="320" height="86" rx="12" fill="white" stroke="#355a85" stroke-width="2"/><text x="765" y="135" font-family="Arial,sans-serif" font-size="22" fill="#162942">S = R P R</text><text x="765" y="164" font-family="Arial,sans-serif" font-size="17" fill="#162942">Positive full boundary residual</text><text x="34" y="229" font-family="Arial,sans-serif" font-size="21" fill="#162942">Q(κ) − I is tangentially smoothing, with polynomial κ bounds.</text><text x="34" y="265" font-family="Arial,sans-serif" font-size="21" fill="#162942">[Q,S] has a smooth kernel with both projections compactly interior.</text><rect x="80" y="295" width="940" height="87" rx="12" fill="white" stroke="#355a85" stroke-width="2"/><text x="95" y="325" font-family="Arial,sans-serif" font-size="22" fill="#162942">A = (Q + iS) Lᴹ</text><text x="95" y="354" font-family="Arial,sans-serif" font-size="17" fill="#162942">The commutator quadratic form is bounded by C ‖u‖²B; both test norms are recovered.</text><text x="30" y="424" font-family="Arial,sans-serif" font-size="23" fill="#162942">Exact support buffer in logarithmic normal distance</text><text x="30" y="460" font-family="Arial,sans-serif" font-size="20" fill="#162942">χ = 1 for x ≤ a₀;  χ = 0 for x ≥ 2a₀.    2a₀ exp(4HQ + 2Hp) &lt; ε₀.</text><line x1="70" y1="512" x2="1030" y2="512" stroke="#62748b" stroke-width="3"/><rect x="250" y="492" width="580" height="40" fill="#d8e9f5" stroke="#355a85"/><text x="50" y="563" font-family="Arial,sans-serif" font-size="17" fill="#162942">x = 0</text><text x="205" y="563" font-family="Arial,sans-serif" font-size="18" fill="#162942">a₀ exp(−Hp − 2HQ)</text><text x="690" y="563" font-family="Arial,sans-serif" font-size="18" fill="#162942">2a₀ exp(Hp + 2HQ)</text><text x="250" y="607" font-family="Arial,sans-serif" font-size="20" fill="#162942">Support of the output-cutoff error: a fixed interior annulus.</text><text x="30" y="643" font-family="Arial,sans-serif" font-size="17" fill="#162942">See Q0–Q2, S0–S3 and P0–P1 for full kernels, densities and exact support arguments.</text></svg>