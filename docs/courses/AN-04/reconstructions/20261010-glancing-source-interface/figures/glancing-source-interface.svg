<text x="572" y="219" class="label" text-anchor="start">Finite half gains on the same final region</text>
<text x="572" y="247" class="small" text-anchor="start">Keep incoming, source and coarse terms.</text>
<text x="572" y="270" class="small" text-anchor="start">Mⱼ₊₁ ≤ Cⱼ (Mⱼ + Iⱼ + Fⱼ + coarse)</text>
