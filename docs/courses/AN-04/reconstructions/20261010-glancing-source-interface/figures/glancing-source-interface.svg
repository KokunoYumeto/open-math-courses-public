<text x="572" y="342" class="label" text-anchor="start">One fixed incoming observation</text>
<text x="572" y="369" class="small" text-anchor="start">O = G Aobs + R; retain the full residual R.</text>
<text x="572" y="393" class="small" text-anchor="start">Its bound uses the original equation Pu = f.</text>
<line x1="779" y1="404" x2="779" y2="432" stroke="#536c80" stroke-width="2" marker-end="url(#arrow)"/>
