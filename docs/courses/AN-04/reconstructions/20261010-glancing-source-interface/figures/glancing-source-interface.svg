<text x="572" y="466" class="label" text-anchor="start">One scalar source test for the full union</text>
<text x="572" y="493" class="small" text-anchor="start">Tf = Bₜ A f, including every residual family.</text>
<text x="572" y="519" class="small" text-anchor="start">‖Cu‖ ≤ C (‖Af‖ + ‖Aobs u‖ + ‖u‖ℬ)</text>
<text x="573" y="565" class="small" text-anchor="start">No ordinary normal derivative of f is required.</text>
