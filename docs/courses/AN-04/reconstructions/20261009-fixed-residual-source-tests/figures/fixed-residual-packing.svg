<text x="28" y="42" class="title" text-anchor="start">A fixed residual test from separated output regions</text>
<text x="28" y="76" class="label" text-anchor="start">First six intervals: center 1/(j+1), radius 1/[10(j+1)²].</text>
<line x1="85" y1="204" x2="960" y2="204" stroke="#425c6b" stroke-width="2"/>
