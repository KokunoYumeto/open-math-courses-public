<line x1="515.0" y1="204" x2="515.0" y2="214" stroke="#425c6b"/>
<text x="515.0" y="241" class="small" text-anchor="middle">0.3</text>
<line x1="655.0" y1="204" x2="655.0" y2="214" stroke="#425c6b"/>
<text x="655.0" y="241" class="small" text-anchor="middle">0.4</text>
<line x1="795.0" y1="204" x2="795.0" y2="214" stroke="#425c6b"/>
