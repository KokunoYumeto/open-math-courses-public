<circle cx="95.0" cy="204" r="5" fill="white" stroke="#425c6b" stroke-width="2"/>
<text x="95" y="279" class="small" text-anchor="start">0 is an accumulation point; every packed kernel has zero jets there.</text>
<text x="875" y="241" class="label" text-anchor="start">z₁</text>
<line x1="28" y1="310" x2="1012" y2="310" stroke="#c4d1db"/>
<text x="28" y="348" class="title" text-anchor="start">Two modes: Rₐ = R₀ + eⁱᵃ R₁</text>
<text x="28" y="383" class="small" text-anchor="start">The output maps U₁ and U₂ preserve each L² norm and have disjoint ranges.</text>
<rect x="60" y="412" width="250" height="60" rx="8" fill="#dcecf1"/>
<text x="185" y="450" class="title" text-anchor="middle">2 U₁ R₀ f</text>
<rect x="375" y="412" width="250" height="60" rx="8" fill="#dcecf1"/>
<text x="500" y="450" class="title" text-anchor="middle">3 U₂ R₁ f</text>
<text x="338" y="451" class="title" text-anchor="middle">+</text>
<text x="668" y="451" class="title" text-anchor="middle">=</text>
<text x="745" y="451" class="title" text-anchor="start">S f</text>
<text x="28" y="522" class="title" text-anchor="start">‖S f‖² = 4 ‖R₀ f‖² + 9 ‖R₁ f‖²</text>
<text x="28" y="563" class="small" text-anchor="start">Only residual kernels are relocated. The normal coordinate and input coordinates stay fixed.</text>
