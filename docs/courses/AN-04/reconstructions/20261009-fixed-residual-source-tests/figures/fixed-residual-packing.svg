<rect x="546.1111111111111" y="156" width="31.111111111111086" height="48" fill="#208496"/>
<line x1="561.6666666666666" y1="152" x2="561.6666666666666" y2="133" stroke="#208496"/>
<text x="561.6666666666666" y="123" class="small" text-anchor="middle">2</text>
