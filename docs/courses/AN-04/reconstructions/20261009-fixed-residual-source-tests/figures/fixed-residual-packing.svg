<line x1="328.3333333333333" y1="152" x2="328.3333333333333" y2="133" stroke="#208496"/>
<text x="328.3333333333333" y="123" class="small" text-anchor="middle">5</text>
<rect x="292.1428571428571" y="156" width="5.714285714285722" height="48" fill="#208496"/>
<line x1="295.0" y1="152" x2="295.0" y2="133" stroke="#208496"/>
<text x="295.0" y="123" class="small" text-anchor="middle">6</text>
<line x1="95.0" y1="204" x2="95.0" y2="214" stroke="#425c6b"/>
<text x="95.0" y="241" class="small" text-anchor="middle">0.0</text>
<line x1="235.0" y1="204" x2="235.0" y2="214" stroke="#425c6b"/>
