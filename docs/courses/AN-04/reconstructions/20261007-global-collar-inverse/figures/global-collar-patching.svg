<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
<title id="title">Nested local supports, one global inverse</title>
<desc id="desc">The left panel shows allowed one-dimensional support bounds inside one chart, not graphs of the smooth cutoffs. The right panel shows the finite square-partition sum, its unchanged leading bundle inverse, and its two distinct errors.</desc>
<rect width="1080" height="680" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#14283a}.title{font-size:27px;font-weight:bold}.head{font-size:22px;font-weight:bold}.body{font-size:19px}.small{font-size:16px}</style>
<text x="540" y="42" class="title" text-anchor="middle">Nested local supports, one global inverse</text>
<text x="264" y="92" class="head" text-anchor="middle">One possible coordinate nesting</text>
<rect x="60" y="152" width="408" height="19" fill="#dfe8ef" stroke="#576c7d"/>
<text x="264" y="142" class="small" text-anchor="middle">support of ψ lies inside [−4, 4]</text>
<rect x="111" y="224" width="306" height="19" fill="#b9d0e1" stroke="#576c7d"/>
<text x="264" y="214" class="small" text-anchor="middle">ψ = 1 on [−3, 3]</text>
<rect x="121.20000000000002" y="296" width="285.59999999999997" height="19" fill="#dce9c4" stroke="#576c7d"/>
<text x="264" y="286" class="small" text-anchor="middle">image of v lies inside [−2.8, 2.8]</text>
<rect x="151.8" y="368" width="224.4" height="19" fill="#a9c67c" stroke="#576c7d"/>
<text x="264" y="358" class="small" text-anchor="middle">v(y) = y on [−2.2, 2.2]</text>
<rect x="162" y="440" width="204" height="19" fill="#ead2ae" stroke="#576c7d"/>
<text x="264" y="430" class="small" text-anchor="middle">support of ρ lies inside [−2, 2]</text>
<rect x="213" y="512" width="102" height="19" fill="#caa16a" stroke="#576c7d"/>
<text x="264" y="502" class="small" text-anchor="middle">support of ϑ lies inside [−1, 1]</text>
<text x="264" y="556" class="small" text-anchor="middle">Take ρ = 1 on [−1.2, 1.2].</text>
<text x="264" y="582" class="small" text-anchor="middle">Smooth cutoff values are not plotted.</text>
<text x="264" y="608" class="small" text-anchor="middle">All these sets lie within the same chart.</text>
<path d="M532 82 V622" stroke="#c9d6df"/>
<text x="796" y="92" class="head" text-anchor="middle">The actual finite sum</text>
<text x="796" y="153" class="head" text-anchor="middle">Q = ∑ ϑᵢ Tᵢ ϑᵢ : F → E</text>
<text x="796" y="190" class="body" text-anchor="middle">∑ ϑᵢ² = 1</text>
<text x="796" y="245" class="head" text-anchor="middle">Leading coefficient: M⁻¹</text>
<text x="796" y="279" class="small" text-anchor="middle">Complete right-cutoff products retained.</text>
<text x="796" y="347" class="head" text-anchor="middle">QP_c = I_E + R_E</text>
<text x="796" y="381" class="head" text-anchor="middle">P_c Q = I_F + R_F</text>
<text x="796" y="424" class="body" text-anchor="middle">Both errors have paired degree −1.</text>
<text x="796" y="490" class="head" text-anchor="middle">Finite correction gives Q_N</text>
<text x="796" y="527" class="body" text-anchor="middle">and error degree −N on each space.</text>
<text x="796" y="583" class="small" text-anchor="middle">GC13–GC21; no boundary condition</text>
<text x="796" y="608" class="small" text-anchor="middle">is imposed by the cylinder inverse.</text>
<text x="540" y="655" class="small" text-anchor="middle">Support equalities justify both exact local comparisons in GC15; all cutoff terms remain in GC17–GC18.</text>
</svg>
