<text x="565" y="32" class="head" text-anchor="start">Dense tests alone do not give the limit</text>
<text x="30" y="62" class="" text-anchor="start">a(j,n) = jⁿ for j &lt; n;  a(j,n) = 2⁻ʲ for j ≥ n</text>
