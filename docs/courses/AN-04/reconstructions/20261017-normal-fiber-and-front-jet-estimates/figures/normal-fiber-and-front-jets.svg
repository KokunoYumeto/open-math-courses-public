<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">Normal-fiber bound and finite front jets</title>
<desc id="desc">The top path splits a symbol at its front constant and obtains a two-marginal Fourier bound from two output derivatives. The bottom path retains N exact front jets and bounds only the weighted full residual error by the original Banach norm.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs>
<rect width="1100" height="610" fill="#f8fafc"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172c43;font-size:20px}.title{font-size:26px;font-weight:600}.small{font-size:18px}.box{fill:white;stroke:#58768d;stroke-width:2}.line{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="40" class="title">Output smoothness controls the normal-frequency operator</text>
<rect x="30" y="65" width="305" height="110" rx="10" class="box"/>
<text x="46" y="97" class="">a(v, κ) = θ(v) C(0, κ) + F</text>
<text x="46" y="127" class="">F and ∂²ᵥF are integrable</text>
<text x="46" y="157" class="">Only two x-derivatives used</text>
<rect x="395" y="65" width="305" height="110" rx="10" class="box"/>
<text x="411" y="97" class="">‖F̂(η, κ)‖ ≤ 2L/(1 + η²)</text>
<text x="411" y="127" class="">η = ξ − κ</text>
<text x="411" y="157" class="">Both marginal integrals finite</text>
<rect x="760" y="65" width="310" height="110" rx="10" class="box"/>
<text x="776" y="97" class="">‖Op(a)g‖₂ ≤ C ‖g‖₂</text>
<text x="776" y="127" class="">Plancherel + Cauchy–Schwarz</text>
<text x="776" y="157" class="">No κ-derivatives required</text>
<line x1="338" y1="120" x2="390" y2="120" class="line"/>
<line x1="703" y1="120" x2="755" y2="120" class="line"/>
<text x="30" y="225" class="title">Full residuals reduce to finitely many exact front jets</text>
<rect x="30" y="250" width="305" height="110" rx="10" class="box"/>
<text x="46" y="282" class="">R = Rᵇ + F₀</text>
<text x="46" y="312" class="">F₀: smooth, flat input kernel</text>
<text x="46" y="342" class="">‖F₀ D u‖₂ ≤ C ‖u‖ℬ</text>
<rect x="395" y="250" width="305" height="110" rx="10" class="box"/>
<text x="411" y="282" class="">JₙR: jets j = 0, …, N − 1</text>
<text x="411" y="312" class="">Full normal-difference tails</text>
<text x="411" y="342" class="">Compact physical projections</text>
<rect x="760" y="250" width="310" height="110" rx="10" class="box"/>
<text x="776" y="282" class="">R − JₙR = F₀ + ρᴺ Eₙ</text>
<text x="776" y="312" class="">Eₙ: full residual kernel</text>
<text x="776" y="342" class="">Every term retained</text>
<line x1="338" y1="305" x2="390" y2="305" class="line"/>
<line x1="703" y1="305" x2="755" y2="305" class="line"/>
<rect x="395" y="415" width="675" height="105" rx="10" class="box"/>
<text x="411" y="447" class="">M: flat-test order;  q: differential order;  N ≥ M + q + 2</text>
<text x="411" y="477" class="">Input test bound: xᴺ⁻¹⁻ᴹ⁻ᑫ ≤ x for 0 &lt; x ≤ 1</text>
<text x="411" y="507" class="">‖(R − JₙR)D u‖₂ ≤ C ‖u‖ℬ</text>
<line x1="915" y1="365" x2="915" y2="410" class="line"/>
<text x="30" y="565" class="small">Exact proof locators: N1–N2, W0–W1, J0–J2, T0.  Angular scalar assembly uses a separate geometric construction.</text>
</svg>
