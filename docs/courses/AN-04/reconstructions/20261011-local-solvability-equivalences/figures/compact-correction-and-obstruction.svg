<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">A compact correction leaves one compatibility condition</title><desc id="desc">Exact circle Fourier multipliers for T and I+T at modes zero to three. The constant mode of I+T is zero. Every nonconstant multiplier is at least one half. Negative modes are identical.</desc><rect width="1100" height="650" fill="#f7fafb"/><g font-family="sans-serif" fill="#183344"><text x="30" y="42" font-size="25" font-weight="bold">A compact correction leaves one compatibility condition</text><text x="30" y="79" font-size="18">X2 and V0: exact Fourier multipliers on the circle; negative modes have the same values.</text><text x="52" y="135" font-size="22" font-weight="bold">Correction T</text><text x="605" y="135" font-size="22" font-weight="bold">Identity plus correction I + T</text><text x="52" y="167" font-size="18">tₖ = −1 / (1 + k²)</text><text x="605" y="167" font-size="18">ℓₖ = k² / (1 + k²)</text><line x1="68" y1="210" x2="498" y2="210" stroke="#183344" stroke-width="2"/><line x1="620" y1="470" x2="1050" y2="470" stroke="#183344" stroke-width="2"/><text x="35" y="216" font-size="17">0</text><text x="35" y="476" font-size="17">−1</text><text x="565" y="216" font-size="17">1</text><text x="565" y="346" font-size="17">1/2</text><text x="565" y="476" font-size="17">0</text><line x1="620" y1="340" x2="1050" y2="340" stroke="#669e9d" stroke-width="2" stroke-dasharray="5 4"/><rect x="83" y="210" width="46" height="260.0" fill="#946143"/><text x="82" y="497.0" font-size="18">−1</text><text x="100" y="525" font-size="18">0</text><circle cx="660" cy="470" r="7" fill="#aa483b"/><text x="642" y="454.0" font-size="18">0</text><text x="654" y="525" font-size="18">0</text><rect x="188" y="210" width="46" height="130.0" fill="#946143"/><text x="187" y="367.0" font-size="18">−1/2</text><text x="205" y="525" font-size="18">1</text><rect x="742" y="340.0" width="46" height="130.0" fill="#176f82"/><text x="747" y="324.0" font-size="18">1/2</text><text x="759" y="525" font-size="18">1</text><rect x="293" y="210" width="46" height="52.0" fill="#946143"/><text x="292" y="289.0" font-size="18">−1/5</text><text x="310" y="525" font-size="18">2</text><rect x="847" y="262.0" width="46" height="208.0" fill="#176f82"/><text x="852" y="246.0" font-size="18">4/5</text><text x="864" y="525" font-size="18">2</text><rect x="398" y="210" width="46" height="26.0" fill="#946143"/><text x="397" y="263.0" font-size="18">−1/10</text><text x="415" y="525" font-size="18">3</text><rect x="952" y="236.0" width="46" height="234.0" fill="#176f82"/><text x="957" y="220.0" font-size="18">9/10</text><text x="969" y="525" font-size="18">3</text><text x="254" y="562" font-size="17">mode k</text><text x="808" y="562" font-size="17">mode k</text><text x="30" y="605" font-size="19">Lost mode: constants. Exact solvability requires zero mean.</text><text x="30" y="633" font-size="17">The infinite-dimensional proof is X2 and F2. The dashed line is the proved lower bound 1/2 for k ≠ 0.</text></g></svg>