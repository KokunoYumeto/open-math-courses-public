<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Global reduction to an elliptic test and a residual test</title><desc id="desc">The full identity T equals C Q plus R retains every corner kernel. The compact cutoff frame gives D J equals V S_Y with V a partial isometry. The flat-input remainder uses the original Banach norm. Two scalar norms are displayed explicitly.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#315d6a" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="620" rx="12" fill="#f3f7f8"/>
<g font-family="Arial,sans-serif" fill="#152d3a"><text x="35" y="42" font-size="25">A complete global family: T = C Q + R</text>
<text x="35" y="74" font-size="18">Y may be noncompact. All input and output kernel projections are compact.</text>
<rect x="60" y="115" width="200" height="70" rx="8" fill="white" stroke="#7da2af"/><text x="160" y="156" text-anchor="middle" font-size="22">input f = Dₐ u</text>
<rect x="480" y="115" width="230" height="70" rx="8" fill="white" stroke="#7da2af"/><text x="595" y="146" text-anchor="middle" font-size="22">elliptic test Q f</text><text x="595" y="172" text-anchor="middle" font-size="16">Q = Σ Bᵢ* Bᵢ</text>
<rect x="480" y="235" width="230" height="70" rx="8" fill="white" stroke="#7da2af"/><text x="595" y="266" text-anchor="middle" font-size="22">residual test S f</text><text x="595" y="292" text-anchor="middle" font-size="16">Rᵇ f = bounded factor × S f</text>
<rect x="480" y="355" width="230" height="70" rx="8" fill="white" stroke="#7da2af"/><text x="595" y="386" text-anchor="middle" font-size="22">flat-input remainder</text><text x="595" y="412" text-anchor="middle" font-size="16">bounded by original ‖u‖_ℬ</text>
<g stroke="#315d6a" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M260 150 L470 150"/><path d="M260 165 L470 265"/><path d="M260 180 L470 385"/></g>
<text x="790" y="150" font-size="19">C is uniformly L² bounded</text>
<text x="765" y="257" font-size="19">J*J = θ²;  D J = V S_Y</text><text x="765" y="288" font-size="18">V*V = projection onto (ker J)⊥</text>
<text x="765" y="383" font-size="19">Every nonflat corner remains</text><text x="765" y="412" font-size="18">in the residual test branch.</text>
<text x="60" y="490" font-size="22">‖T Dₐ u‖₂ ≤ C ( ‖Q Dₐ u‖₂ + ‖S Dₐ u‖₂ + ‖u‖_ℬ )</text>
<text x="60" y="537" font-size="18">Two scalar norms remain explicit; their single-test gluing is a separate assertion.</text>
<text x="60" y="575" font-size="17">Map and support schematic. Proof: L0–L3, A0–A2, T0–G0; identities GF4–GF11.</text></g></svg>