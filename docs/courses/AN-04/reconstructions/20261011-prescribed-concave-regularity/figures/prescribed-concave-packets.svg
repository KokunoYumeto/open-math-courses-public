<text x="1020" y="292" font-family="Arial,sans-serif" font-size="18" fill="#21374d" text-anchor="start">t</text>
<text x="584" y="137" font-family="Arial,sans-serif" font-size="17" fill="#21374d" text-anchor="start">index</text>
<text x="195" y="225" font-family="Arial,sans-serif" font-size="18" fill="#a7551b" text-anchor="start">ℓ₁(t) = −t</text>
<text x="770" y="266" font-family="Arial,sans-serif" font-size="18" fill="#7a557e" text-anchor="start">ℓ₀(t) = 0</text>
<text x="695" y="372" font-family="Arial,sans-serif" font-size="20" fill="#087684" text-anchor="start">h(t)</text>
<text x="140" y="480" font-family="Arial,sans-serif" font-size="18" fill="#21374d" text-anchor="start">Below both lines: finite norms. Above either line: positivity prevents cancellation.</text>
<text x="40" y="527" font-family="Arial,sans-serif" font-size="22" fill="#21374d" text-anchor="start">Actual frequency windows in the rescaled coordinate z = ζ / √(λ log λ)</text>
<text x="40" y="558" font-family="Arial,sans-serif" font-size="18" fill="#21374d" text-anchor="start">Light bar: |η| ≤ 1. Dark bar: |η| ≤ 1/2. Centers θ = 0 and θ = 1.</text>
<text x="40" y="626" font-family="Arial,sans-serif" font-size="18" fill="#21374d" text-anchor="start">log λ = 4</text>
