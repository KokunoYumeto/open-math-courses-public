<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><rect width="1100" height="900" fill="#f5f7fa"/>
<text x="40" y="42" font-family="Arial,sans-serif" font-size="25" fill="#21374d" text-anchor="start">A positive sum realizes the concave envelope</text>
<text x="40" y="75" font-family="Arial,sans-serif" font-size="18" fill="#21374d" text-anchor="start">Exact example: h(t) = min(0, −t), with Q(ζ) = ζ² and n = 3.</text>
