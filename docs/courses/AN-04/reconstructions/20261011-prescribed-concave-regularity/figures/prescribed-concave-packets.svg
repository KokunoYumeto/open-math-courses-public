<text x="985" y="808" font-family="Arial,sans-serif" font-size="18" fill="#21374d" text-anchor="start">z</text>
<text x="40" y="869" font-family="Arial,sans-serif" font-size="17" fill="#21374d" text-anchor="start">In the original conic coordinate ζ/λ, both windows tend to zero; only the positive λ ray remains.</text>
