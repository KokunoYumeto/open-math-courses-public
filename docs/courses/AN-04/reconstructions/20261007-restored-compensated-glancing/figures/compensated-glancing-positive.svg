<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
  <title id="title">An exact glancing support envelope and the leading normal errors</title>
  <desc id="desc">For beta one and epsilon one quarter, the normalized cutoff support is T at least minus five quarters and X squared plus T at most two, with X nonnegative. The incoming transition lies between T minus five quarters and minus one. The compressed normal cutoff shrinks with omega equal to epsilon delta. Zero, linear and quadratic normal errors have different small scales.</desc>
  <rect width="780" height="440" fill="#f8fafc" />
  <text x="22" y="28" font-family="Arial, sans-serif" font-size="20" fill="#132238" font-weight="bold">Cutoff geometry and the positive weak form</text>
  <text x="30" y="56" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">Exact envelope: β = 1, ε = 1/4</text>
  <path d="M 74.24999999999999 300 L 74.24999999999999 105.30023112494459 Q 383.0 202.6501155624723 383.0 300 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <path d="M 74.24999999999999 300 L 74.24999999999999 105.30023112494459 Q 86.36259507607612 109.11937195375293 98.0 112.93851278256128 L 98.0 300 Z" fill="#fed7aa" fill-opacity=".8" />
  <line x1="60.0" y1="300" x2="402.0" y2="300" stroke="#66788a" stroke-width="1.4" />
  <line x1="60.0" y1="300" x2="60.0" y2="89.4" stroke="#66788a" stroke-width="1.4" />
  <line x1="98.0" y1="300" x2="98.0" y2="112.93851278256128" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="4 3" />
  <line x1="74.24999999999999" y1="300" x2="74.24999999999999" y2="105.30023112494459" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="4 3" />
  <line x1="74.24999999999999" y1="296" x2="74.24999999999999" y2="304" stroke="#66788a" stroke-width="1.4" />
  <text x="50.249999999999986" y="318" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">−5/4</text>
  <line x1="98.0" y1="296" x2="98.0" y2="304" stroke="#66788a" stroke-width="1.4" />
  <text x="87.0" y="318" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">−1</text>
  <line x1="193.0" y1="296" x2="193.0" y2="304" stroke="#66788a" stroke-width="1.4" />
  <text x="182.0" y="318" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">0</text>
  <line x1="288.0" y1="296" x2="288.0" y2="304" stroke="#66788a" stroke-width="1.4" />
  <text x="277.0" y="318" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">1</text>
  <line x1="383.0" y1="296" x2="383.0" y2="304" stroke="#66788a" stroke-width="1.4" />
  <text x="372.0" y="318" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">2</text>
  <line x1="56.0" y1="192" x2="64.0" y2="192" stroke="#66788a" stroke-width="1.4" />
  <text x="31" y="196" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">1</text>
  <line x1="56.0" y1="138.0" x2="64.0" y2="138.0" stroke="#66788a" stroke-width="1.4" />
  <text x="31" y="142.0" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">1.5</text>
  <text x="58" y="82" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">X</text>
  <text x="368" y="288" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">T</text>
  <text x="207" y="133" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">T + X² = 2</text>
  <text x="125" y="246" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">χ₁ = 1 for T ≥ −1</text>
  <text x="66" y="101" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">incoming</text>
  <text x="66" y="116" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">strip</text>
  <rect x="424" y="47" width="334" height="268" rx="8" fill="white" stroke="#6585a7" />
  <text x="438" y="72" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">Full support and leading scales</text>
  <text x="438" y="100" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="normal">ω = εδ;  |σ|/|τ| ≤ 2 Cσ ω</text>
  <text x="438" y="124" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="normal">normal energy:  ‖T DₓBᵣu‖²</text>
  <text x="438" y="146" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">≤ C′N ω ‖Bᵣu‖² + lower/source</text>
  <line x1="438" y1="161" x2="744" y2="161" stroke="#66788a" stroke-width="1.4" />
  <text x="438" y="186" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="normal">zero error:     δ + δ/ε</text>
  <text x="438" y="213" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="normal">linear error:   √(δ/ε)</text>
  <text x="438" y="240" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="normal">quadratic:      δ</text>
  <text x="438" y="268" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="normal">weight derivative:  δ/A₀</text>
  <text x="438" y="293" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">(PC18), (PC33)–(PC34), (PC44)</text>
  <rect x="22" y="337" width="736" height="84" rx="8" fill="white" stroke="#6585a7" />
  <text x="35" y="361" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">Cᵣ = 4 ‖Bᵣu‖² + zero + linear + quadratic + incoming + elliptic + lower</text>
  <text x="35" y="386" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">The full source and complex lower form remain in Cᵣ. (PC26), (PC35)</text>
  <text x="35" y="408" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">Choose ε = L* δ; then L* large, δ small and A₀ large. Both weak form domains.</text>
</svg>