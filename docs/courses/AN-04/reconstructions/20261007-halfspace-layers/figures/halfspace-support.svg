<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">Model support and complete source gains</title>
<desc id="desc">The model kernel is supported where output normal r is at most input normal s. A source at s zero has no positive output. A source part with q coefficient derivatives gains q tangential orders; either finite inverse error layer adds N.</desc>
<rect width="1120" height="610" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#142b45}.title{font-size:23px;font-weight:700}.label{font-size:18px}.small{font-size:16px}.box{fill:#f2f6fc;stroke:#315b88;stroke-width:1.6}</style>
<text x="65" y="42" class="title" text-anchor="start">Where the model can send an input</text>
<polygon points="80,420 400,420 400,100" fill="#d6eadd"/>
<line x1="80.0" y1="100" x2="80.0" y2="420" stroke="#dbe1e8" stroke-width="1.5"/>
<line x1="80" y1="420.0" x2="400" y2="420.0" stroke="#dbe1e8" stroke-width="1.5"/>
<text x="80.0" y="447" class="small" text-anchor="middle">-1</text>
<text x="61" y="425.0" class="small" text-anchor="end">-1</text>
<line x1="186.66666666666669" y1="100" x2="186.66666666666669" y2="420" stroke="#dbe1e8" stroke-width="1.5"/>
<line x1="80" y1="313.3333333333333" x2="400" y2="313.3333333333333" stroke="#dbe1e8" stroke-width="1.5"/>
<text x="186.66666666666669" y="447" class="small" text-anchor="middle">0</text>
<text x="61" y="318.3333333333333" class="small" text-anchor="end">0</text>
<line x1="293.33333333333337" y1="100" x2="293.33333333333337" y2="420" stroke="#dbe1e8" stroke-width="1.5"/>
<line x1="80" y1="206.66666666666666" x2="400" y2="206.66666666666666" stroke="#dbe1e8" stroke-width="1.5"/>
<text x="293.33333333333337" y="447" class="small" text-anchor="middle">1</text>
<text x="61" y="211.66666666666666" class="small" text-anchor="end">1</text>
<line x1="400.0" y1="100" x2="400.0" y2="420" stroke="#dbe1e8" stroke-width="1.5"/>
<line x1="80" y1="100.0" x2="400" y2="100.0" stroke="#dbe1e8" stroke-width="1.5"/>
<text x="400.0" y="447" class="small" text-anchor="middle">2</text>
<text x="61" y="105.0" class="small" text-anchor="end">2</text>
<rect x="80" y="100" width="320" height="320" fill="none" stroke="#142b45"/>
<line x1="80" y1="420" x2="400" y2="100" stroke="#278150" stroke-width="2.5"/>
<line x1="186.66666666666669" y1="100" x2="186.66666666666669" y2="313.3333333333333" stroke="#b23b32" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="186.66666666666669" y1="313.3333333333333" x2="186.66666666666669" y2="420" stroke="#278150" stroke-width="3"/>
<text x="95" y="82" class="label" text-anchor="start">output r</text>
<text x="240" y="478" class="label" text-anchor="middle">input s</text>
<text x="286" y="342" class="label" text-anchor="middle">allowed: r ≤ s</text>
<text x="98" y="136" class="label" text-anchor="start">r &gt; s</text>
<text x="98" y="160" class="small" text-anchor="start">zero kernel</text>
<text x="191" y="283" class="small" text-anchor="start">s = 0</text>
<text x="194" y="307" class="small" text-anchor="start">r = 0</text>
<text x="68" y="516" class="small" text-anchor="start">Dashed red: a boundary source has</text>
<text x="68" y="539" class="small" text-anchor="start">no positive output under this model.</text>
<text x="68" y="572" class="small" text-anchor="start">Exact support bound: HM18–HM19.</text>
<text x="555" y="42" class="title" text-anchor="start">Every source derivative and error gain</text>
<rect x="550" y="85" width="520" height="68" rx="9" class="box"/>
<text x="810" y="112" class="small" text-anchor="middle">Original jets: Uₐ ∈ H^(σ−a−½)</text>
<text x="810" y="136" class="small" text-anchor="middle">0 ≤ a &lt; m</text>
<rect x="550" y="185" width="520" height="72" rx="9" class="box"/>
<text x="810" y="212" class="small" text-anchor="middle">q-th source part C_P^(q) U</text>
<text x="810" y="236" class="small" text-anchor="middle">H_(−m, σ+q), supported at r = 0</text>
<rect x="550" y="290" width="520" height="92" rx="9" class="box"/>
<text x="810" y="317" class="small" text-anchor="middle">Either E_N Q_N or Q_N F_N, restricted to r &gt; 0</text>
<text x="810" y="341" class="small" text-anchor="middle">H_(ν, σ+q+N−ν), every real ν</text>
<text x="810" y="365" class="small" text-anchor="middle">Full source: q = 0,…,m−1</text>
<rect x="550" y="420" width="520" height="83" rx="9" class="box"/>
<text x="810" y="447" class="small" text-anchor="middle">Trace k, then boundary row of order mⱼ−k</text>
<text x="810" y="471" class="small" text-anchor="middle">H^(σ+q+N−mⱼ−½)</text>
<text x="810" y="495" class="small" text-anchor="middle">Choose ν &gt; k+½ before taking the trace</text>
<line x1="810" y1="153" x2="810" y2="180" stroke="#315b88" stroke-width="2"/>
<path d="M 805 173 L 810 180 L 815 173" fill="none" stroke="#315b88" stroke-width="2"/>
<line x1="810" y1="257" x2="810" y2="285" stroke="#315b88" stroke-width="2"/>
<path d="M 805 278 L 810 285 L 815 278" fill="none" stroke="#315b88" stroke-width="2"/>
<line x1="810" y1="382" x2="810" y2="415" stroke="#315b88" stroke-width="2"/>
<path d="M 805 408 L 810 415 L 815 408" fill="none" stroke="#315b88" stroke-width="2"/>
<text x="555" y="548" class="small" text-anchor="start">The two errors act on their respective bundles.</text>
<text x="555" y="572" class="small" text-anchor="start">Exact maps: HM11, HM14, HM24–HM27.</text>
</svg>
