<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
<title id="title">A reflected wave has two full covectors and one compressed boundary limit</title>
<desc id="desc">Exact section tau equals one of the flat wave symbol rho squared minus tau squared. The base rays are t equals minus r incoming, and t equals r outgoing. The compressed normal components are zeta equals r and zeta equals minus r, both meeting at r equals zero, zeta equals zero.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="760" height="650" rx="12" fill="#f8fafb"/>
<g font-family="Arial,sans-serif" font-size="18" fill="#243e4b">
<text x="34" y="36" font-size="22" font-weight="bold">Two transverse wave branches, τ = 1</text>
<text x="34" y="66">Base projection for P = Dᵣ² − Dₜ²; r ≥ 0</text>
<path d="M96 320H672" stroke="#687882" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M380 337V91" stroke="#687882" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="684" y="326">t</text><text x="392" y="102">r</text>
<text x="127" y="350">−1</text><text x="373" y="350">0</text><text x="614" y="350">1</text>
<text x="358" y="207">1</text>
<path d="M140 200L380 320" stroke="#256783" stroke-width="4"/>
<path d="M380 320L620 200" stroke="#b15536" stroke-width="4"/>
<path d="M224 242L260 260" stroke="#256783" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M488 266L524 248" stroke="#b15536" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="380" cy="320" r="6" fill="#243e4b"/>
<text x="52" y="106" fill="#256783">Incoming: t = −r</text>
<text x="45" y="145" fill="#256783">ξ = dt + dr; ρ = 1</text>
<text x="488" y="106" fill="#b15536">Outgoing: t = r</text>
<text x="488" y="145" fill="#b15536">ξ = dt − dr; ρ = −1</text>
<text x="45" y="268">Dirichlet cancellation</text>
<text x="45" y="291">(r, t) = (0, 0)</text>
<text x="34" y="390" font-size="22" font-weight="bold">Compressed normal component ζ = rρ</text>
<text x="34" y="419">Tangential component τ stays equal to one</text>
<path d="M115 535H672" stroke="#687882" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M140 624V441" stroke="#687882" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="684" y="542">r</text><text x="114" y="449">ζ</text>
<path d="M140 535L620 465" stroke="#256783" stroke-width="4"/>
<path d="M140 535L620 605" stroke="#b15536" stroke-width="4"/>
<circle cx="140" cy="535" r="6" fill="#243e4b"/>
<text x="156" y="490">Same boundary covector</text>
<text x="405" y="475" fill="#256783">ρ = 1; ζ = r</text>
<text x="405" y="598" fill="#b15536">ρ = −1; ζ = −r</text>
<text x="108" y="474">1</text><text x="94" y="608">−1</text>
<text x="613" y="560">1</text><text x="121" y="560">0</text>
</g></svg>