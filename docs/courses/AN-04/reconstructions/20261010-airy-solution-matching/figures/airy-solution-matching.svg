<text x="573" y="128" class="label">1. Actual weak Cauchy trace</text>
<text x="573" y="155" class="label">Q₁(Dq − A₊)u(q₁) ∈ H⁻¹ᐟ²</text>
<text x="573" y="180" class="small">ASM:C0</text>
