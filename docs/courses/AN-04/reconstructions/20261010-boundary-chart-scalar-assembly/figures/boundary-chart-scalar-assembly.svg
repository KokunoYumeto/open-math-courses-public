<text x="399" y="97" class="" text-anchor="start">η</text>
<text x="374" y="132" class="small" text-anchor="end">+1</text>
<rect x="148.0" y="112" width="120" height="28" rx="5" fill="#cfeadd"/>
<circle cx="208.0" cy="126" r="5" fill="#17694d"/>
<circle cx="148.0" cy="126" r="5" fill="white" stroke="#17694d" stroke-width="2"/>
<circle cx="268.0" cy="126" r="5" fill="white" stroke="#17694d" stroke-width="2"/>
<line x1="561.0" y1="119" x2="575.0" y2="133" stroke="#ad3556" stroke-width="3"/>
<line x1="561.0" y1="133" x2="575.0" y2="119" stroke="#ad3556" stroke-width="3"/>
<text x="374" y="250" class="small" text-anchor="end">−1</text>
<line x1="201.0" y1="237" x2="215.0" y2="251" stroke="#ad3556" stroke-width="3"/>
<line x1="201.0" y1="251" x2="215.0" y2="237" stroke="#ad3556" stroke-width="3"/>
<rect x="508.0" y="230" width="120" height="28" rx="5" fill="#cfeadd"/>
<circle cx="568.0" cy="244" r="5" fill="#17694d"/>
<circle cx="508.0" cy="244" r="5" fill="white" stroke="#17694d" stroke-width="2"/>
<circle cx="628.0" cy="244" r="5" fill="white" stroke="#17694d" stroke-width="2"/>
<line x1="148" y1="180" x2="148" y2="190" stroke="#536c80" stroke-width="2"/>
<text x="148" y="210" class="small" text-anchor="middle">-2</text>
<line x1="268" y1="180" x2="268" y2="190" stroke="#536c80" stroke-width="2"/>
<text x="268" y="210" class="small" text-anchor="middle">-1</text>
<line x1="388" y1="180" x2="388" y2="190" stroke="#536c80" stroke-width="2"/>
<text x="388" y="210" class="small" text-anchor="middle">0</text>
