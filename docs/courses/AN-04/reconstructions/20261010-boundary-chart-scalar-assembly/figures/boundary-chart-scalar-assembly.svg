<line x1="628" y1="180" x2="628" y2="190" stroke="#536c80" stroke-width="2"/>
<text x="628" y="210" class="small" text-anchor="middle">2</text>
<text x="794" y="118" class="small" text-anchor="start">Green: open intervals</text>
<text x="794" y="145" class="small" text-anchor="start">Red crosses: excluded</text>
<text x="794" y="194" class="small" text-anchor="start">A rectangle containing</text>
<text x="794" y="220" class="small" text-anchor="start">both green points also</text>
<text x="794" y="246" class="small" text-anchor="start">contains both crosses.</text>
<text x="35" y="323" class="title" text-anchor="start">One scalar test has two disjoint output channels</text>
<line x1="62" y1="424" x2="963" y2="424" stroke="#536c80" stroke-width="2" marker-end="url(#arrow)"/>
<text x="975" y="431" class="" text-anchor="start">z</text>
<rect x="100" y="367" width="440" height="37" rx="5" fill="#dbeaf8"/>
<rect x="760" y="367" width="110" height="37" rx="5" fill="#ecdff4"/>
<text x="320.0" y="392" class="" text-anchor="middle">Qf: output in [−2, 2]</text>
<text x="815.0" y="392" class="" text-anchor="middle">USf</text>
<line x1="100" y1="419" x2="100" y2="429" stroke="#536c80" stroke-width="2"/>
<text x="100" y="451" class="small" text-anchor="middle">-2</text>
<line x1="320" y1="419" x2="320" y2="429" stroke="#536c80" stroke-width="2"/>
<text x="320" y="451" class="small" text-anchor="middle">0</text>
<line x1="540" y1="419" x2="540" y2="429" stroke="#536c80" stroke-width="2"/>
<text x="540" y="451" class="small" text-anchor="middle">2</text>
<line x1="760" y1="419" x2="760" y2="429" stroke="#536c80" stroke-width="2"/>
<text x="760" y="451" class="small" text-anchor="middle">4</text>
<line x1="870" y1="419" x2="870" y2="429" stroke="#536c80" stroke-width="2"/>
<text x="870" y="451" class="small" text-anchor="middle">5</text>
<text x="650.0" y="394" class="small" text-anchor="middle">gap = 2</text>
<text x="34" y="498" class="" text-anchor="start">U: [−3, 3] → [4, 5],   z = 9/2 + Z/6,   amplitude = √6</text>
<text x="34" y="532" class="" text-anchor="start">A = Q + US;     ‖Af‖² = ‖Qf‖² + ‖Sf‖²</text>
<text x="34" y="565" class="small" text-anchor="start">Only the residual output moves. Normal and input coordinates stay unchanged.</text>
</svg>
