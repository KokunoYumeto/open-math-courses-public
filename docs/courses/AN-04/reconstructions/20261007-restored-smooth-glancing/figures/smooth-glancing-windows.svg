<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
  <title id="title">Nested glancing supports retain one common smooth neighborhood</title>
  <desc id="desc">Exact support envelopes for beta one, three quarters and the limiting one half, epsilon one quarter and incoming threshold one quarter. Each has T plus X squared at most one plus beta and T at least minus one plus epsilon times threshold minus beta. The common inner rectangle and independently regular compressed normal guard are distinct.</desc>
  <rect width="780" height="440" fill="#f8fafc" />
  <text x="22" y="28" font-family="Arial, sans-serif" font-size="20" fill="#132238" font-weight="bold">One smooth neighborhood from nested glancing estimates</text>
  <text x="28" y="54" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">Exact support: ε = h* = 1/4</text>
  <path d="M 69.92500000000001 294 L 69.92500000000001 101.18143242934303 Q 382.3 197.59071621467152 382.3 294 Z" fill="#2563eb" fill-opacity=".18" stroke="#2563eb" stroke-width="1.6" />
  <path d="M 76.05000000000001 294 L 76.05000000000001 110.87709045561775 Q 357.8 202.43854522780887 357.8 294 Z" fill="#0891b2" fill-opacity=".22" stroke="#0891b2" stroke-width="1.6" />
  <path d="M 82.17500000000001 294 L 82.17500000000001 121.11564558931309 Q 333.3 207.55782279465654 333.3 294 Z" fill="#059669" fill-opacity=".25" stroke="#059669" stroke-width="1.6" />
  <rect x="161.8" y="267.0" width="49.0" height="27.0" fill="#fef08a" stroke="#a16207" stroke-width="1.5" />
  <line x1="54.0" y1="294" x2="397.0" y2="294" stroke="#66788a" stroke-width="1.4" />
  <line x1="54.0" y1="294" x2="54.0" y2="83.4" stroke="#66788a" stroke-width="1.4" />
  <line x1="88.30000000000001" y1="290" x2="88.30000000000001" y2="298" stroke="#66788a" stroke-width="1.4" />
  <text x="82.30000000000001" y="312" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">−1</text>
  <line x1="186.3" y1="290" x2="186.3" y2="298" stroke="#66788a" stroke-width="1.4" />
  <text x="180.3" y="312" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">0</text>
  <line x1="284.3" y1="290" x2="284.3" y2="298" stroke="#66788a" stroke-width="1.4" />
  <text x="278.3" y="312" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">1</text>
  <line x1="382.3" y1="290" x2="382.3" y2="298" stroke="#66788a" stroke-width="1.4" />
  <text x="376.3" y="312" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">2</text>
  <line x1="50.0" y1="186" x2="58.0" y2="186" stroke="#66788a" stroke-width="1.4" />
  <text x="24" y="190" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">1</text>
  <line x1="50.0" y1="132.0" x2="58.0" y2="132.0" stroke="#66788a" stroke-width="1.4" />
  <text x="24" y="136.0" font-family="Arial, sans-serif" font-size="12" fill="#132238" font-weight="normal">1.5</text>
  <text x="52" y="81" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">X</text>
  <text x="385" y="283" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">T</text>
  <text x="187" y="88" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">T + X² ≤ 1 + β</text>
  <line x1="276" y1="184" x2="297" y2="184" stroke="#2563eb" stroke-width="1.4" />
  <text x="304" y="188" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">β = 1</text>
  <line x1="276" y1="207" x2="297" y2="207" stroke="#0891b2" stroke-width="1.4" />
  <text x="304" y="211" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">β = 3/4</text>
  <line x1="276" y1="230" x2="297" y2="230" stroke="#059669" stroke-width="1.4" />
  <text x="304" y="234" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">β → 1/2</text>
  <text x="172" y="327" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">common inner rectangle</text>
  <rect x="420" y="47" width="338" height="283" rx="8" fill="white" stroke="#6585a7" />
  <text x="435" y="72" font-family="Arial, sans-serif" font-size="16" fill="#132238" font-weight="bold">Supply every lower energy tester</text>
  <text x="435" y="101" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">new positive support lies inside:</text>
  <text x="447" y="126" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="bold">old positive elliptic set</text>
  <text x="447" y="150" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">∪ independently smooth normal guard</text>
  <line x1="435" y1="165" x2="744" y2="165" stroke="#66788a" stroke-width="1.4" />
  <text x="435" y="190" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="bold">Guard: |σ|/|τ| &gt; Cσ ω/2</text>
  <text x="435" y="214" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">The outer χ₂ edge remains here.</text>
  <text x="435" y="238" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">β nesting alone does not remove it.</text>
  <text x="435" y="265" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">stage j: energy output order j/2</text>
  <text x="435" y="290" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">next lower order = (j−1)/2</text>
  <text x="435" y="314" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">(CG7), (CG21)–(CG27)</text>
  <rect x="22" y="346" width="736" height="76" rx="8" fill="white" stroke="#6585a7" />
  <text x="35" y="370" font-family="Arial, sans-serif" font-size="15" fill="#132238" font-weight="bold">incoming characteristic window → all-order incoming tester → common inner region</text>
  <text x="35" y="394" font-family="Arial, sans-serif" font-size="14" fill="#132238" font-weight="normal">Source front removed; noncharacteristic points regular. Both clock signs. (CG32)–(CG34)</text>
  <text x="35" y="414" font-family="Arial, sans-serif" font-size="13" fill="#132238" font-weight="normal">Quadratic scale: δ = 2 |h|,  ω = L* δ². Complete arguments in Sections 2–8.</text>
</svg>