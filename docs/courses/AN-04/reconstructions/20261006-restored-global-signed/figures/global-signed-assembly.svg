<text x="521" y="358">At t − s = 1, choose the witness b = t.</text>
<text x="521" y="390">This boundary must remain in the hull.</text>
<text x="521" y="435">Every witness satisfies s &lt; b ≤ t.</text>
<text x="521" y="466">The whole correction is strictly forward.</text>
<text x="521" y="497" class="small">Plot window: −2 ≤ s ≤ 2, −2 ≤ t ≤ 3.</text>
