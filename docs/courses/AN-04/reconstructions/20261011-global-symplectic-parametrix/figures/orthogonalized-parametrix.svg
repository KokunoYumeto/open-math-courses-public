<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">Different complements solve the same equation</title><desc id="desc">For P(x,y)=(x+y,0), the input (2,1), oblique reconstruction (3,0) and orthogonal reconstruction (1.5,1.5) have the same image. The kernel is x+y=0; its perpendicular is y=x.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="630" fill="#f7fafb"/><g fill="#183344" font-family="sans-serif"><text x="30" y="42" font-size="25" font-weight="bold">Same equation, different choices of solution</text><text x="40" y="84" font-size="18">X1 and V0: exact finite-dimensional projection algebra</text><line x1="73" y1="525" x2="73" y2="133.7" stroke="#dbe5e9" stroke-width="1"/><line x1="73" y1="525" x2="464.3" y2="525" stroke="#dbe5e9" stroke-width="1"/><text x="68" y="456" font-size="15">-1</text><text x="140" y="530" font-size="15">-1</text><line x1="164" y1="525" x2="164" y2="133.7" stroke="#dbe5e9" stroke-width="1"/><line x1="73" y1="434" x2="464.3" y2="434" stroke="#dbe5e9" stroke-width="1"/><line x1="255" y1="525" x2="255" y2="133.7" stroke="#dbe5e9" stroke-width="1"/><line x1="73" y1="343" x2="464.3" y2="343" stroke="#dbe5e9" stroke-width="1"/><text x="250" y="456" font-size="15">1</text><text x="140" y="348" font-size="15">1</text><line x1="346" y1="525" x2="346" y2="133.7" stroke="#dbe5e9" stroke-width="1"/><line x1="73" y1="252" x2="464.3" y2="252" stroke="#dbe5e9" stroke-width="1"/><text x="341" y="456" font-size="15">2</text><text x="140" y="257" font-size="15">2</text><line x1="437" y1="525" x2="437" y2="133.7" stroke="#dbe5e9" stroke-width="1"/><line x1="73" y1="161" x2="464.3" y2="161" stroke="#dbe5e9" stroke-width="1"/><text x="432" y="456" font-size="15">3</text><text x="140" y="166" font-size="15">3</text><line x1="73" y1="434" x2="473.4" y2="434" stroke="#183344" stroke-width="2"/><line x1="164" y1="525" x2="164" y2="124.60000000000002" stroke="#183344" stroke-width="2"/><line x1="73" y1="343" x2="255" y2="525" stroke="#704495" stroke-width="2" stroke-dasharray="5 4"/><line x1="91.2" y1="506.8" x2="450.65" y2="147.35000000000002" stroke="#669e9d" stroke-width="2" stroke-dasharray="5 4"/><line x1="145.8" y1="142.8" x2="455.2" y2="452.2" stroke="#8b969c" stroke-width="2" stroke-dasharray="3 5"/><line x1="164" y1="434" x2="346" y2="343" stroke="#183344" stroke-width="3" marker-end="url(#arrow)"/><circle cx="346" cy="343" r="4" fill="#183344"/><line x1="164" y1="434" x2="437" y2="434" stroke="#b3592b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="437" cy="434" r="4" fill="#b3592b"/><line x1="164" y1="434" x2="300.5" y2="297.5" stroke="#166e80" stroke-width="3" marker-end="url(#arrow)"/><circle cx="300.5" cy="297.5" r="4" fill="#166e80"/><text x="358" y="334" font-size="17">v=(2,1)</text><text x="343" y="478" font-size="17" fill="#b3592b">E₀Pv=(3,0)</text><text x="218.5" y="278.5" font-size="17" fill="#166e80">EPv=(3/2,3/2)</text><text x="480" y="448" font-size="18">x</text><text x="145" y="117" font-size="18">y</text><text x="43" y="561" font-size="17" fill="#704495">Kernel: x+y=0</text><text x="256" y="561" font-size="17" fill="#669e9d">Perpendicular: y=x</text><rect x="575" y="130" width="482" height="354" rx="10" fill="#e4eff2"/><text x="603" y="170" font-size="22" font-weight="bold">P(x,y) = (x+y,0)</text><text x="603" y="217" font-size="19">All three displayed points satisfy x+y=3.</text><text x="603" y="264" font-size="19" fill="#b3592b">E₀ chooses the horizontal complement.</text><text x="603" y="309" font-size="19" fill="#166e80">E chooses the perpendicular complement.</text><text x="603" y="356" font-size="19">P E = I − Π₊</text><text x="603" y="394" font-size="19">E P = I − Π₋</text><text x="603" y="451" font-size="18">Π₋ is the orthogonal kernel projection.</text><text x="575" y="528" font-size="17">The dotted fiber is x+y=3.</text><text x="30" y="606" font-size="17">Coordinates are exact. This illustrates the normalization algebra, not a physical characteristic manifold.</text></g></svg>