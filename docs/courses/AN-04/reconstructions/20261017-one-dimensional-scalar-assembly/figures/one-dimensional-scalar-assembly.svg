<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Boundary and interior scalar test supports on the interval from zero to four">
<rect width="1100" height="620" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#183246;font-size:20px}.small{font-size:18px}</style>
<text x="100" y="34" font-size="25">Join two collar tests to one positive interior test</text>
<text x="100" y="65" class="small">X = [0,4]; inward coordinates xL = t and xR = 4 − t</text>
<text x="100" y="98">Collar output bounds</text>
<line x1="100" y1="135" x2="1000" y2="135" stroke="#becad2" stroke-width="2"/>
<rect x="100" y="122" width="225" height="26" fill="#146575" opacity="0.85"/>
<rect x="775" y="122" width="225" height="26" fill="#146575" opacity="0.85"/>
<text x="100" y="178" text-anchor="middle">0</text>
<text x="1000" y="178" text-anchor="middle">4</text>
<text x="325" y="178" text-anchor="middle">1</text>
<text x="775" y="178" text-anchor="middle">3</text>
<text x="100" y="218">Interior output buffer</text>
<line x1="100" y1="255" x2="1000" y2="255" stroke="#becad2" stroke-width="2"/>
<rect x="156.25" y="242" width="787.5" height="26" fill="#c37a19" opacity="0.85"/>
<text x="100" y="298" text-anchor="middle">0</text>
<text x="1000" y="298" text-anchor="middle">4</text>
<circle cx="156.25" cy="255" r="6" fill="white" stroke="#c37a19" stroke-width="2"/>
<text x="156.25" y="298" text-anchor="middle">1/4</text>
<circle cx="943.75" cy="255" r="6" fill="white" stroke="#c37a19" stroke-width="2"/>
<text x="943.75" y="298" text-anchor="middle">15/4</text>
<text x="100" y="338">Deep cutoff supports</text>
<line x1="100" y1="375" x2="1000" y2="375" stroke="#becad2" stroke-width="2"/>
<rect x="100" y="362" width="28.125" height="26" fill="#624d91" opacity="0.85"/>
<rect x="971.875" y="362" width="28.125" height="26" fill="#624d91" opacity="0.85"/>
<text x="100" y="418" text-anchor="middle">0</text>
<text x="1000" y="418" text-anchor="middle">4</text>
<circle cx="128.125" cy="375" r="5" fill="white" stroke="#624d91" stroke-width="2"/>
<text x="153.125" y="418" text-anchor="middle">1/8</text>
<circle cx="971.875" cy="375" r="5" fill="white" stroke="#624d91" stroke-width="2"/>
<text x="946.875" y="418" text-anchor="middle">31/8</text>
<text x="100" y="465">The interior test overlaps the collar tests. Positivity handles this overlap.</text>
<text x="100" y="500">Only the two separate endpoint output channels are disjoint.</text>
<text x="100" y="540" class="small">Ratio bound in each collar: 3y/4 ≤ x ≤ 4y/3, with input y ≤ 3/4.</text>
<text x="100" y="575" class="small">Allowed support bounds, not nonzero kernel values. See C1, A0, P0 and Exercise 1.</text>
</svg>
