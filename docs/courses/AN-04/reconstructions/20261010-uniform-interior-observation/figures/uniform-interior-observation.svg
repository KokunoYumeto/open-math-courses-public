<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="810" viewBox="0 0 1040 810">
<title>Changing-speed interior rays and the observed interval</title>
<desc>Exact rays x=4-c z for c from 0.9 to 1.1 and 0 to 2 in z, with constant covectors rho=-1, eta=-c. The lowest endpoint is x=1.8 above the boundary. The observed interval has length one half within an interval of length two.</desc>
<rect width="1040" height="810" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#173044}.title{font-size:26px;font-weight:700}.label{font-size:20px}.small{font-size:18px}.ray{fill:none;stroke-width:3}.axis{stroke:#506575;stroke-width:1.6}</style>
<text x="40" y="42" class="title" text-anchor="start">Interior rays with changing speed</text>
<text x="40" y="75" class="label" text-anchor="start">x = 4 − c z,   9/10 ≤ c ≤ 11/10;   (ρ, η) = (−1, −c)</text>
<rect x="105" y="110" width="165.0" height="340" fill="#eee8f7"/>
<polygon points="105,146 765,282.79999999999995 765,313.2" fill="#cce8e7"/>
<line x1="105" y1="450" x2="814.5" y2="450" stroke="#506575" stroke-width="2"/>
<line x1="105" y1="450" x2="105" y2="115.59999999999997" stroke="#506575" stroke-width="2"/>
<line x1="100" y1="450" x2="105" y2="450" stroke="#506575" stroke-width="2"/>
<text x="89" y="456" class="small" text-anchor="end">0</text>
<line x1="100" y1="374" x2="105" y2="374" stroke="#506575" stroke-width="2"/>
<text x="89" y="380" class="small" text-anchor="end">1</text>
<line x1="100" y1="298" x2="105" y2="298" stroke="#506575" stroke-width="2"/>
<text x="89" y="304" class="small" text-anchor="end">2</text>
<line x1="100" y1="222" x2="105" y2="222" stroke="#506575" stroke-width="2"/>
<text x="89" y="228" class="small" text-anchor="end">3</text>
<line x1="100" y1="146" x2="105" y2="146" stroke="#506575" stroke-width="2"/>
<text x="89" y="152" class="small" text-anchor="end">4</text>
<line x1="105" y1="450" x2="105" y2="456" stroke="#506575" stroke-width="2"/>
<text x="105" y="478" class="small" text-anchor="middle">0</text>
<line x1="270.0" y1="450" x2="270.0" y2="456" stroke="#506575" stroke-width="2"/>
<text x="270.0" y="478" class="small" text-anchor="middle">1/2</text>
<line x1="435" y1="450" x2="435" y2="456" stroke="#506575" stroke-width="2"/>
<text x="435" y="478" class="small" text-anchor="middle">1</text>
<line x1="600.0" y1="450" x2="600.0" y2="456" stroke="#506575" stroke-width="2"/>
<text x="600.0" y="478" class="small" text-anchor="middle">3/2</text>
<line x1="765" y1="450" x2="765" y2="456" stroke="#506575" stroke-width="2"/>
<text x="765" y="478" class="small" text-anchor="middle">2</text>
<text x="826.5" y="456" class="label" text-anchor="start">z</text>
<text x="79" y="105.59999999999997" class="label" text-anchor="start">x</text>
<line x1="105" y1="146" x2="765" y2="282.79999999999995" stroke="#246c82" stroke-width="3"/>
<circle cx="765" cy="282.79999999999995" r="4" fill="#246c82"/>
<line x1="771" y1="282.79999999999995" x2="820" y2="238" stroke="#246c82" stroke-width="1.4"/>
<text x="832" y="244" class="small" text-anchor="start">c = 9/10</text>
<line x1="105" y1="146" x2="765" y2="298" stroke="#164653" stroke-width="3"/>
<circle cx="765" cy="298" r="4" fill="#164653"/>
<line x1="771" y1="298" x2="820" y2="271" stroke="#164653" stroke-width="1.4"/>
<text x="832" y="277" class="small" text-anchor="start">c = 1</text>
<line x1="105" y1="146" x2="765" y2="313.20000000000005" stroke="#ad5a35" stroke-width="3"/>
<circle cx="765" cy="313.20000000000005" r="4" fill="#ad5a35"/>
<line x1="771" y1="313.20000000000005" x2="820" y2="304" stroke="#ad5a35" stroke-width="1.4"/>
<text x="832" y="310" class="small" text-anchor="start">c = 11/10</text>
<circle cx="105" cy="146" r="4" fill="#173044"/>
<text x="150" y="130" class="small" text-anchor="start">observed strip</text>
<line x1="765" y1="313.2" x2="765" y2="450" stroke="#ad5a35" stroke-width="1.7" stroke-dasharray="5 5"/>
<text x="790" y="393" class="label" text-anchor="start">x ≥ 9/5 &gt; 0</text>
<text x="400" y="437" class="small" text-anchor="start">physical boundary x = 0</text>
<text x="105" y="514" class="small" text-anchor="start">The shaded band is a base projection; its full covectors are specified above.</text>
<line x1="40" y1="540" x2="1000" y2="540" stroke="#cad6df" stroke-width="1"/>
<text x="40" y="580" class="title" text-anchor="start">Observation by an interval average</text>
<line x1="105" y1="631" x2="765" y2="631" stroke="#246c82" stroke-width="7"/>
<line x1="105" y1="631" x2="270.0" y2="631" stroke="#7a53a2" stroke-width="10"/>
<line x1="105" y1="618" x2="105" y2="644" stroke="#173044" stroke-width="1.5"/>
<text x="105" y="671" class="small" text-anchor="middle">0</text>
<line x1="270.0" y1="618" x2="270.0" y2="644" stroke="#173044" stroke-width="1.5"/>
<text x="270.0" y="671" class="small" text-anchor="middle">1/2</text>
<line x1="765" y1="618" x2="765" y2="644" stroke="#173044" stroke-width="1.5"/>
<text x="765" y="671" class="small" text-anchor="middle">2</text>
<text x="300" y="620" class="label" text-anchor="start">I = [0, 2],  length 2</text>
<text x="105" y="707" class="label" text-anchor="start">J = [0, 1/2],  length 1/2</text>
<text x="105" y="747" class="label" text-anchor="start">‖v‖ on I  ≤  2 ‖v‖ on J  +  2 ‖Dₜv‖ on I</text>
<text x="105" y="782" class="small" text-anchor="start">The first coefficient is sharp for constant v; no derivative sharpness is claimed.</text>
</svg>
