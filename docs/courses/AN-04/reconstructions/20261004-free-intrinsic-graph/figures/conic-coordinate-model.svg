<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 750" role="img" aria-labelledby="title desc">
<title id="title">One conormal in two base coordinate systems</title>
<desc id="desc">Top: the line y1=0 with covectors (1,0). Bottom: the parabola x1=x2 squared over 2 with covectors (1,-s). Covector arrows use a common factor one quarter. This is a base projection, not the full cotangent space.</desc>
<rect width="550" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bb541b"/></marker></defs>
<text x="28" y="45" font-family="system-ui,sans-serif" font-size="22" fill="#152f42">Original coordinates: y₁ = 0</text>
<line x1="75" y1="190" x2="420" y2="190" stroke="#a7b2bc" stroke-width="1.4"/>
<line x1="220" y1="315" x2="220" y2="65" stroke="#a7b2bc" stroke-width="1.4"/>
<text x="430" y="196" font-family="system-ui,sans-serif" font-size="18" fill="#152f42">y₁</text>
<text x="190" y="67" font-family="system-ui,sans-serif" font-size="18" fill="#152f42">y₂</text>
<text x="202" y="212" font-family="system-ui,sans-serif" font-size="15" fill="#152f42">0</text>
<line x1="220" y1="295" x2="255" y2="295" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="220" y1="225" x2="255" y2="225" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="220" y1="155" x2="255" y2="155" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="220" y1="85" x2="255" y2="85" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="220" y1="302" x2="220" y2="78" stroke="#126f86" stroke-width="3"/>
<text x="300" y="105" font-family="system-ui,sans-serif" font-size="18" fill="#152f42">η = (1, 0)</text>
<text x="28" y="338" font-family="system-ui,sans-serif" font-size="17" fill="#152f42">Frequency projection retains λ, loses s.</text>
<text x="28" y="390" font-family="system-ui,sans-serif" font-size="22" fill="#152f42">New coordinates: x₁ = x₂² / 2</text>
<line x1="75" y1="535" x2="420" y2="535" stroke="#a7b2bc" stroke-width="1.4"/>
<line x1="220" y1="660" x2="220" y2="410" stroke="#a7b2bc" stroke-width="1.4"/>
<text x="430" y="541" font-family="system-ui,sans-serif" font-size="18" fill="#152f42">x₁</text>
<text x="190" y="412" font-family="system-ui,sans-serif" font-size="18" fill="#152f42">x₂</text>
<text x="202" y="557" font-family="system-ui,sans-serif" font-size="15" fill="#152f42">0</text>
<line x1="259.375" y1="640" x2="294.375" y2="613.75" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="224.375" y1="570" x2="259.375" y2="561.25" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="224.375" y1="500" x2="259.375" y2="508.75" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="259.375" y1="430" x2="294.375" y2="456.25" stroke="#bb541b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M 264.8 647 Q 175.2 535 264.8 423" fill="none" stroke="#126f86" stroke-width="3"/>
<text x="325" y="450" font-family="system-ui,sans-serif" font-size="18" fill="#152f42">ξ = (1, −s)</text>
<text x="28" y="683" font-family="system-ui,sans-serif" font-size="18" fill="#152f42">ξ₁ = λ,  ξ₂ = −sλ  ⇒  s = −ξ₂ / ξ₁</text>
<text x="28" y="735" font-family="system-ui,sans-serif" font-size="16" fill="#152f42">Base projections · −0.8 ≤ s ≤ 0.8 · arrows scaled by ¼</text>
</svg>
