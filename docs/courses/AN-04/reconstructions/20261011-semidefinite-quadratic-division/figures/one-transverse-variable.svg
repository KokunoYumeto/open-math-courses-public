<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">One normalized transverse variable and the prescribed divisor</title>
<desc id="desc">The degree-one two-dimensional normal form has only x after tau equals zero and xi equals one. The three-dimensional flat-family model has active x and eta after kappa equals one, with z inactive. A degenerate prescribed divisor can fail while a different exact divisor exists.</desc>
<rect width="1120" height="740" rx="14" fill="#f5f8fb"/>
<style>text{font-family:system-ui,sans-serif;fill:#142e43}.heading{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:17px}.formula{font-size:23px;font-family:Georgia,serif}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247682"/></marker></defs>
<text x="32" y="40" class="heading">Exact division and the cotangent slice</text>
<rect x="25" y="65" width="1070" height="195" rx="10" fill="white" stroke="#9bb4c6"/>
<text x="45" y="97" class="heading">D2 · Base dimension two</text>
<text x="45" y="132" class="formula">(t,x; τ,ξ),  ξ &gt; 0</text>
<path d="M315 125H450" fill="none" stroke="#247682" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="335" y="109" class="small">τ = 0</text>
<text x="335" y="151" class="small">ξ = 1</text>
<text x="475" y="130" class="body">One active transverse variable: x</text>
<text x="45" y="179" class="formula">a(t,x) = x²A(t,x),     a(t₀,x) = x²K(x)</text>
<text x="45" y="218" class="formula">K(0) ≠ 0    ⇒    h = A/K is smooth and nonnegative;  r = 0</text>
<text x="45" y="244" class="small">The sign inequality and the nonzero Hessian are both hypotheses.</text>
<rect x="25" y="280" width="1070" height="190" rx="10" fill="white" stroke="#9bb4c6"/>
<text x="45" y="312" class="heading">X3 · Base dimension three</text>
<text x="45" y="348" class="formula">(t,x,z; τ,η,κ),  κ &gt; 0</text>
<path d="M340 341H455" fill="none" stroke="#247682" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="355" y="325" class="small">τ = 0</text>
<text x="355" y="367" class="small">κ = 1</text>
<text x="478" y="346" class="body">Two active variables: (x,η);  z is inactive</text>
<text x="45" y="395" class="formula">p = τ + iκF(t,x,η/κ)</text>
<text x="45" y="432" class="formula">For x &gt; 0 and η = 0:   F(0,x,0) = 0,   F(t,x,0) = t²E₊(x)²</text>
<text x="45" y="457" class="small">At t ≠ 0 the numerator is nonzero on the prescribed divisor-zero set.</text>
<rect x="25" y="490" width="1070" height="220" rx="10" fill="white" stroke="#9bb4c6"/>
<text x="45" y="523" class="heading">D3 · A different divisor changes the question</text>
<text x="45" y="564" class="formula">Im p = ξ(x⁴ + t²x²)</text>
<text x="45" y="607" class="formula">Prescribed g = ξx⁴</text>
<path d="M350 599H455" fill="none" stroke="#247682" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="475" y="607" class="body">h = 1 + t²/x²  (x ≠ 0): no continuous extension</text>
<text x="45" y="655" class="formula">Alternative divisor ξx²</text>
<path d="M350 647H455" fill="none" stroke="#247682" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="475" y="655" class="body">h* = x² + t² ≥ 0: exact smooth factorization</text>
<text x="45" y="691" class="small">The Hessian at the prescribed time t₀ = 0 is zero.</text>
</svg>
