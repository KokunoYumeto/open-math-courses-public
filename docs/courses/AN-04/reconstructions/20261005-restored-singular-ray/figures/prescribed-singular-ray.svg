<svg xmlns="http://www.w3.org/2000/svg" width="420" height="860" viewBox="0 0 420 860" role="img" aria-labelledby="title desc">
<title id="title">A closed singular segment with forcing at its endpoints</title>
<desc id="desc">At transverse position zero and covector zero in time, zero in the other transverse components and one in the last component, U is singular throughout a closed time interval from a to b. Its time derivative is singular only at a and b. Exact sections of the cones absolute r less than lambda divided by q are drawn for q one, three and six.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52616a"/></marker></defs>
<rect x="1" y="1" width="418" height="858" rx="10" fill="#fafbf9" stroke="#ced7d6"/>
<g font-family="Georgia,serif" fill="#263e48">
<text x="20" y="38" font-size="25">A finite singular ray</text>
<text x="20" y="76" font-size="20">z = 0; (τ, ν, λ) = (0, 0, 1).</text>
<text x="20" y="106" font-size="19">Include every positive dilation.</text>
<g stroke="#52616a" stroke-width="2"><path d="M140 162 H382" marker-end="url(#arrow)"/><path d="M140 242 H382" marker-end="url(#arrow)"/></g>
<text x="20" y="169" font-size="21">WF(U)</text><text x="20" y="249" font-size="21">WF(DₜU)</text>
<path d="M185 162 H335" stroke="#147f86" stroke-width="8"/>
<g fill="#147f86"><circle cx="185" cy="162" r="7"/><circle cx="335" cy="162" r="7"/></g>
<g fill="#b55831"><circle cx="185" cy="242" r="7"/><circle cx="335" cy="242" r="7"/></g>
<text x="180" y="201" font-size="21">a</text><text x="330" y="201" font-size="21">b</text>
<text x="391" y="169" font-size="20">t</text><text x="391" y="249" font-size="20">t</text>
<text x="20" y="287" font-size="19">All H⁻ᵋ hold for ε &gt; 0.</text>
<text x="20" y="316" font-size="19">L2 fails at each segment point.</text>
<path d="M20 341 H400" stroke="#ced7d6"/>
<text x="20" y="380" font-size="23">Narrowing frequency cones</text>
<text x="20" y="414" font-size="20">Exact section: |r| &lt; λ/q, λ &gt; 0.</text>
<text x="20" y="444" font-size="18">Other frequency components are zero.</text>
<path d="M210 730 L82 490 H338 Z" fill="#dce7eb"/>
<path d="M210 730 L167.3333 490 H252.6667 Z" fill="#aacecf"/>
<path d="M210 730 L188.6667 490 H231.3333 Z" fill="#54a1a5"/>
<g fill="none" stroke-width="2" stroke-dasharray="5 5">
<path d="M82 490 L210 730 L338 490" stroke="#8fa7b3"/>
<path d="M167.3333 490 L210 730 L252.6667 490" stroke="#468d91"/>
<path d="M188.6667 490 L210 730 L231.3333 490" stroke="#147f86"/>
</g>
<g stroke="#52616a" stroke-width="1.5"><path d="M58 730 H374" marker-end="url(#arrow)"/><path d="M210 745 V473" marker-end="url(#arrow)"/>
<path d="M82 725 V735 M146 725 V735 M274 725 V735 M338 725 V735 M205 670 H215 M205 610 H215 M205 550 H215 M205 490 H215"/>
</g>
<text x="383" y="737" font-size="21">r</text><text x="222" y="480" font-size="21">λ</text>
<g font-size="19"><text x="70" y="762">−4</text><text x="134" y="762">−2</text><text x="204" y="762">0</text><text x="268" y="762">2</text><text x="332" y="762">4</text>
<text x="185" y="676">1</text><text x="185" y="616">2</text><text x="185" y="556">3</text><text x="185" y="496">4</text>
<text x="344" y="512">q = 1</text><text x="261" y="548">q = 3</text><text x="240" y="588">q = 6</text>
</g>
<text x="20" y="806" font-size="19">Limit: r = 0, λ &gt; 0.</text>
<text x="20" y="835" font-size="19">Dashed edges bound the estimates.</text>
</g></svg>
