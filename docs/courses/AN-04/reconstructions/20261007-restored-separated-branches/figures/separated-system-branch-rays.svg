<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
<title id="title">Exact separated branch rays and endpoint polarization</title>
<desc id="desc">For s=y=0, theta(t)=pi t/4 and eta=1, the plus ray is x=t and the minus ray is x=-t. At t=1 their output vectors are (1,1)/sqrt(2) and (-1,1)/sqrt(2). Separate component planes distinguish polarization from physical position.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="690" rx="10" fill="#fffdf8"/>
<style>text{font-family:Arial,sans-serif;fill:#243943;font-size:19px}.small{font-size:17px}.title{font-size:26px;font-weight:bold}.axis{stroke:#465963;stroke-width:2;marker-end:url(#arrow)}.plus{stroke:#17688d;fill:none;stroke-width:4;marker-end:url(#arrow)}.minus{stroke:#aa3b34;fill:none;stroke-width:4;marker-end:url(#arrow)}.grid{stroke:#deddd4;stroke-width:1}</style>
<text x="36" y="42" class="title">Two characteristic rays; rotating endpoint polarization</text>
<text x="36" y="73">s = 0, y = 0, eta = 1, theta(t) = pi t / 4</text>
<path class="grid" d="M100 170H560M130 120V570M530 120V570"/>
<path class="axis" d="M65 540H615"/><path class="axis" d="M330 590V110"/>
<text x="600" y="572">x</text><text x="350" y="122">t</text>
<text x="312" y="569">0</text><text x="111" y="569">-1</text><text x="524" y="569">1</text>
<text x="351" y="177">1</text>
<path class="plus" d="M330 540L530 170"/><path class="minus" d="M330 540L130 170"/>
<circle cx="330" cy="540" r="5" fill="#243943"/>
<circle cx="530" cy="170" r="6" fill="#17688d"/><circle cx="130" cy="170" r="6" fill="#aa3b34"/>
<text x="421" y="355">x = t</text><text x="117" y="355">x = -t</text>
<text x="450" y="141">(+1, 1)</text><text x="75" y="141">(-1, 1)</text>
<text x="54" y="617" class="small">Physical (x,t) plane. Both covectors stay eta = 1.</text>
<path d="M652 102V633" stroke="#ccc9bc" stroke-width="2"/>
<text x="690" y="115">Component planes (u1,u2)</text>
<text x="690" y="148" class="small">Input at t = 0</text>
<path class="axis" d="M755 260H985"/><path class="axis" d="M855 315V170"/>
<text x="984" y="286" class="small">u1</text><text x="870" y="177" class="small">u2</text>
<path class="plus" d="M855 260H945"/><path class="minus" d="M855 260V170"/>
<text x="901" y="239">e+</text><text x="810" y="189">e-</text>
<text x="690" y="362" class="small">Output at t = 1: angle pi / 4</text>
<path class="axis" d="M755 493H985"/><path class="axis" d="M855 555V386"/>
<text x="984" y="520" class="small">u1</text><text x="871" y="393" class="small">u2</text>
<path class="plus" d="M855 493L918.6396 429.3604"/><path class="minus" d="M855 493L791.3604 429.3604"/>
<text x="908" y="414" class="small">(1,1) / sqrt(2)</text>
<text x="686" y="414" class="small">(-1,1) / sqrt(2)</text>
<text x="690" y="588" class="small">Each map: R(theta(t)) e± e±^T R(theta(s))^T</text>
<text x="690" y="617" class="small">Rank 1; initial maps sum to I.</text>
<text x="36" y="660" class="small">Exact model: BR32–BR33, Exercise 4. Branch-kernel proof: Sections 6–7. Original figure: CC0-1.0.</text>
</svg>
