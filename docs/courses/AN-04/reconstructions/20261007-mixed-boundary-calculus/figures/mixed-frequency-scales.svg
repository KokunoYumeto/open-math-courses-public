<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">Tangential and full-frequency gains</title>
<desc id="desc">Exact unit ellipses of the mixed frequency metric, with semiaxes one and nine at frequency zero comma eight, and nine and nine at frequency eight comma zero. Both panels have twenty pixels per increment unit.</desc>
<rect width="1080" height="620" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#14283a}.title{font-size:27px;font-weight:bold}.head{font-size:21px;font-weight:bold}.label{font-size:18px}.small{font-size:16px}</style>
<text x="40" y="42" class="title" text-anchor="start">The two frequency gains have different meanings</text>
<text x="270" y="85" class="head" text-anchor="middle">Frequency (η, κ) = (0, 8)</text>
<text x="270" y="112" class="label" text-anchor="middle">T = 1,  R = 9</text>
<ellipse cx="270" cy="310" rx="20" ry="180" fill="#e4f0fa" stroke="#23649b" stroke-width="2.5"/>
<path d="M 62 310 H 478 M 270 504 V 116" stroke="#617080" stroke-width="1.2" fill="none"/>
<path d="M 90 306 v 8 M 266 490 h 8" stroke="#617080"/>
<path d="M 250 306 v 8 M 266 330 h 8" stroke="#617080"/>
<path d="M 290 306 v 8 M 266 290 h 8" stroke="#617080"/>
<path d="M 450 306 v 8 M 266 130 h 8" stroke="#617080"/>
<text x="474" y="298" class="label" text-anchor="end">δη</text>
<text x="279" y="126" class="label" text-anchor="start">δκ</text>
<text x="298" y="335" class="small" text-anchor="start">T = 1</text>
<text x="280" y="156" class="small" text-anchor="start">R = 9</text>
<circle cx="270" cy="310" r="3" fill="#14283a"/>
<text x="270" y="530" class="head" text-anchor="middle">T⁻¹ = 1     R⁻¹ = 1/9</text>
<text x="800" y="85" class="head" text-anchor="middle">Frequency (η, κ) = (8, 0)</text>
<text x="800" y="112" class="label" text-anchor="middle">T = 9,  R = 9</text>
<ellipse cx="800" cy="310" rx="180" ry="180" fill="#e4f0fa" stroke="#23649b" stroke-width="2.5"/>
<path d="M 592 310 H 1008 M 800 504 V 116" stroke="#617080" stroke-width="1.2" fill="none"/>
<path d="M 620 306 v 8 M 796 490 h 8" stroke="#617080"/>
<path d="M 780 306 v 8 M 796 330 h 8" stroke="#617080"/>
<path d="M 820 306 v 8 M 796 290 h 8" stroke="#617080"/>
<path d="M 980 306 v 8 M 796 130 h 8" stroke="#617080"/>
<text x="1004" y="298" class="label" text-anchor="end">δη</text>
<text x="809" y="126" class="label" text-anchor="start">δκ</text>
<text x="988" y="335" class="small" text-anchor="start">T = 9</text>
<text x="810" y="156" class="small" text-anchor="start">R = 9</text>
<circle cx="800" cy="310" r="3" fill="#14283a"/>
<text x="800" y="530" class="head" text-anchor="middle">T⁻¹ = 1/9     R⁻¹ = 1/9</text>
<text x="540" y="570" class="label" text-anchor="middle">Unit metric ellipse: (δη/T)² + (δκ/R)² = 1</text>
<text x="540" y="605" class="small" text-anchor="middle">Equal coordinate scale in both panels. See MB9, MB18–MB19 and Exercise 1.</text>
</svg>
