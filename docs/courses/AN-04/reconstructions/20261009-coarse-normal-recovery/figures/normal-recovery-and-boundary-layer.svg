<line x1="780.000" y1="134.000" x2="780.000" y2="374.000" stroke="#d8e2eb" stroke-width="1"/>
<text x="780.000" y="394.000" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#18334c" font-weight="normal">4</text>
