<text x="24.000" y="495.000" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#18334c" font-weight="normal">The index gain uses restriction norms; no boundary value is assumed in the normal step.</text>
<text x="24.000" y="519.000" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#18334c" font-weight="normal">P = Dₓ²,  uₖ(0) = 0,  ‖Puₖ‖² = 5/4.  The third derivative has squared norm 13k²/4.</text>
<text x="24.000" y="543.000" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#18334c" font-weight="normal">Proofs: B1–B8 and Exercises 1–3. Lines and lattice arrows encode exact formulas, not numerical PDE solutions.</text>
</svg>
