<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Finite normal recovery and a boundary layer</title>
<desc id="desc">Four steps preserve total mixed order minus two. An exact sourced boundary layer has bounded second normal derivative but an unbounded third.</desc>
<rect width="1040" height="560" fill="#f7f9fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#147b89"/></marker></defs>
<text x="24.000" y="29.000" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18334c" font-weight="bold">Weak input → finite normal graph, with the actual source retained</text>
<text x="24.000" y="55.000" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#18334c" font-weight="normal">Left: mixed Sobolev indices. Right: exact L² norms for uₖ(x) = k⁻³ᐟ²(kx)e⁻ᵏˣ.</text>
<rect x="24" y="78" width="476" height="386" rx="8" fill="white" stroke="#d3e0ea"/>
<rect x="540" y="78" width="476" height="386" rx="8" fill="white" stroke="#d3e0ea"/>
<text x="38.000" y="104.000" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18334c" font-weight="bold">N = 2: four normal steps</text>
