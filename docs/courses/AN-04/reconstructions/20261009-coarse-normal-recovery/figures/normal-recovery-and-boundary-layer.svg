<text x="434.000" y="394.000" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#18334c" font-weight="normal">2</text>
<line x1="75.000" y1="364.000" x2="451.000" y2="364.000" stroke="#d8e2eb" stroke-width="1"/>
<text x="67.000" y="368.000" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#18334c" font-weight="normal">-4</text>
