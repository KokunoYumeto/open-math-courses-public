<text x="964.000" y="394.000" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#18334c" font-weight="normal">16</text>
<line x1="586.000" y1="359.000" x2="971.000" y2="359.000" stroke="#d8e2eb" stroke-width="1"/>
<text x="580.000" y="363.000" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#18334c" font-weight="normal">-8</text>
<line x1="586.000" y1="299.000" x2="971.000" y2="299.000" stroke="#d8e2eb" stroke-width="1"/>
<text x="580.000" y="303.000" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#18334c" font-weight="normal">-4</text>
<line x1="586.000" y1="239.000" x2="971.000" y2="239.000" stroke="#d8e2eb" stroke-width="1"/>
