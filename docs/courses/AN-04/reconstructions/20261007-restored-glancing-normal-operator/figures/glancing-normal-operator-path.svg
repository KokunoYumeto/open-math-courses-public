<text x="390" y="30" font-size="22" font-weight="bold">Normal energy → the corrected linear error</text>
<text x="390" y="54" font-size="14">Fixed widths; uniform in the family parameter; lower constants remain explicit.</text>
<g fill="#eff6fa" stroke="#50778a" stroke-width="1.5">
<rect x="30" y="76" width="330" height="98" rx="7"/>
