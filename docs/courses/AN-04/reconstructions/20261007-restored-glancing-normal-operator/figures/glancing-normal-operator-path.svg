<text x="195" y="101" font-size="16" font-weight="bold">GN13–GN14: full form + freezing</text>
<text x="195" y="128" font-size="15">κ ‖Dsp v‖² ≤ ‖Dt v‖² + C Z²</text>
<text x="195" y="154" font-size="14">Freeze G at x = 0; error ≤ Cg h ‖Dsp v‖².</text>
<text x="585" y="101" font-size="16" font-weight="bold">GN8–GN12: principal factorization</text>
<text x="585" y="128" font-size="15">C±* C± = μ I ± F + R±; μ = (H + 1) ω</text>
<text x="585" y="154" font-size="14">R± has order −1; its full form bound is retained.</text>
<path d="M195 174 L295 223" stroke="#315d70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M585 174 L485 223" stroke="#315d70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="252" font-size="16" font-weight="bold">GN17–GN22: normalize the actual derivative</text>
<text x="390" y="278" font-size="16">‖T Dx Bλ u‖² ≤ CN ω ‖Bλ u‖² + Cω,h,B Zν²</text>
<text x="390" y="302" font-size="14">[Dx,T] = M−1 + N−2 Dx is included; T has order −1.</text>
<path d="M390 314 L390 352" stroke="#315d70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="382" font-size="16" font-weight="bold">GN27–GN28: R has order −1; |τ r−1| ≤ M / ε</text>
<text x="390" y="406" font-size="15">Leading mixed coefficient: 2M √(CN Cw) √(δ / ε) + γ.</text>
<text x="390" y="435" font-size="13">ω ≤ Cw εδ; h ≤ ω; exact lower/source remainder in GN27.  No propagation-limit claim.</text>
</g></svg>
