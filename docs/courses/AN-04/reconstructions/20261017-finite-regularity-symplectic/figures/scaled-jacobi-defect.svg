<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">The exact Jacobi defect after a dilation-invariant rescaling</title>
<desc id="desc">On the cone r=xi1&gt;0, omega-hat equals omega0/r. Its bracket of xi2 and x2 is r, and the bracket of x1 with r is minus r. The other cyclic terms vanish. The form is invertible and dilation invariant but is not closed. The plotted function is exactly J-hat=-r.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#466378" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="430" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#182a3b">
<text x="28" y="34" font-size="22" font-weight="bold">An invertible invariant form can have a nonzero Jacobi defect</text>
<text x="28" y="66" font-size="18">ω₀ = dr ∧ dx₁ + dξ₂ ∧ dx₂,   r = ξ₁ &gt; 0,   ω̂ = ω₀/r</text>
<rect x="22" y="90" width="365" height="280" rx="8" fill="#edf5f6" stroke="#bbcbd2"/>
<text x="40" y="121" font-size="19" font-weight="bold">The three nested brackets</text>
<text x="42" y="156" font-size="18">f = x₁,    g = ξ₂,    h = x₂</text>
<text x="42" y="196" font-size="19">{g,h}′ = r</text>
<path d="M180 189H210" stroke="#466378" stroke-width="2" marker-end="url(#arrow)"/>
<text x="224" y="196" font-size="19">{f,r}′ = −r</text>
<text x="42" y="238" font-size="18">{h,f}′ = 0,    {f,g}′ = 0</text>
<text x="42" y="285" font-size="22" fill="#a73236" font-weight="bold">J′(f,g,h) = −r ≠ 0</text>
<text x="42" y="333" font-size="15">Arrows denote bracket evaluation.</text>
<rect x="403" y="90" width="345" height="280" rx="8" fill="#f7f5ee" stroke="#bbcbd2"/>
<text x="421" y="121" font-size="19" font-weight="bold">Form and regularity</text>
<text x="421" y="162" font-size="18">det ω̂ = r⁻⁴ &gt; 0</text>
<text x="421" y="201" font-size="18">Mₜ* ω̂ = ω̂</text>
<text x="421" y="240" font-size="18">dω̂ = −r⁻²dr ∧ dξ₂ ∧ dx₂</text>
<text x="421" y="282" font-size="18" fill="#a73236">The exterior derivative is nonzero.</text>
<text x="421" y="329" font-size="15">Here {u,v}′ = r {u,v}₀.</text>
<rect x="766" y="90" width="310" height="280" rx="8" fill="#fff" stroke="#bbcbd2"/>
<text x="784" y="121" font-size="19" font-weight="bold">The exact algebraic value</text>
<path d="M803 165H1048M818 148V333" fill="none" stroke="#466378" stroke-width="1.5"/>
<text x="1042" y="154" font-size="16">r</text><text x="787" y="153" font-size="16">J′</text>
<path d="M818 165L1016 315" fill="none" stroke="#a73236" stroke-width="3"/>
<circle cx="818" cy="165" r="4" fill="white" stroke="#a73236" stroke-width="2"/>
<g font-size="15"><text x="807" y="188">0</text><text x="878" y="184">1</text><text x="944" y="184">2</text><text x="1010" y="184">3</text><text x="785" y="219">−1</text><text x="785" y="269">−2</text><text x="785" y="319">−3</text></g>
<path d="M884 161V169M950 161V169M1016 161V169M814 215H822M814 265H822M814 315H822" stroke="#466378"/>
<text x="912" y="288" font-size="18" fill="#a73236">J′ = −r</text>
<text x="847" y="351" font-size="15">r = 0 is excluded.</text>
<text x="28" y="402" font-size="17">Exact signs and all hypotheses: X2, formulas (FR6) and (FR12). This is not a ray or a propagation diagram.</text>
</g></svg>