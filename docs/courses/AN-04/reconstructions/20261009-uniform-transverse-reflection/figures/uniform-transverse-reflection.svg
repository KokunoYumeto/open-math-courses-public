<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590">
<rect width="1040" height="590" fill="#f7fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#255777"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18354a;font-size:17px}.small{font-size:15px}.title{font-size:21px;font-weight:bold}.box{fill:white;stroke:#89a4b6;stroke-width:1.5}</style>
<text x="34" y="38" class="title" text-anchor="start">Exact transverse reflection</text>
<text x="34" y="65" class="small" text-anchor="start">p = ξ² − η²; η = 1</text>
<text x="567" y="38" class="title" text-anchor="start">From one strip to both branches</text>
<text x="567" y="65" class="small" text-anchor="start">Every source and residual norm is retained.</text>
<rect x="55" y="290" width="420" height="75.0" fill="#e0efe5"/>
<line x1="45" y1="440" x2="490" y2="440" stroke="#255777" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="265" y1="458" x2="265" y2="103" stroke="#255777" stroke-width="2" marker-end="url(#arrow)"/>
<text x="491" y="467" class="" text-anchor="start">z</text>
<text x="281" y="112" class="" text-anchor="start">x</text>
<line x1="65" y1="435" x2="65" y2="445" stroke="#255777" stroke-width="2"/>
<text x="65" y="468" class="" text-anchor="middle">-2</text>
<line x1="165" y1="435" x2="165" y2="445" stroke="#255777" stroke-width="2"/>
<text x="165" y="468" class="" text-anchor="middle">-1</text>
<line x1="365" y1="435" x2="365" y2="445" stroke="#255777" stroke-width="2"/>
<text x="365" y="468" class="" text-anchor="middle">1</text>
<line x1="465" y1="435" x2="465" y2="445" stroke="#255777" stroke-width="2"/>
<text x="465" y="468" class="" text-anchor="middle">2</text>
<line x1="260" y1="365.0" x2="270" y2="365.0" stroke="#255777" stroke-width="2"/>
<text x="253" y="358.0" class="" text-anchor="end">0.5</text>
<line x1="260" y1="290" x2="270" y2="290" stroke="#255777" stroke-width="2"/>
<text x="253" y="283" class="" text-anchor="end">1</text>
<line x1="260" y1="140" x2="270" y2="140" stroke="#255777" stroke-width="2"/>
<text x="253" y="133" class="" text-anchor="end">2</text>
<line x1="465" y1="140" x2="265" y2="440" stroke="#255777" stroke-width="4"/>
<line x1="265" y1="440" x2="65" y2="140" stroke="#255777" stroke-width="4"/>
<line x1="405.0" y1="230.0" x2="365" y2="290" stroke="#255777" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="175.0" y1="305.0" x2="135.0" y2="245.0" stroke="#255777" stroke-width="4" marker-end="url(#arrow)"/>
<text x="365" y="132" class="" text-anchor="start">ξ = −1</text>
<text x="52" y="132" class="" text-anchor="start">ξ = +1</text>
<text x="353" y="355" class="small" text-anchor="start">J = [½, 1]</text>
<text x="278" y="421" class="small" text-anchor="start">(0, 0)</text>
<text x="50" y="513" class="small" text-anchor="start">Incoming: (z, x) = (−2τ, −2τ), τ ≤ 0</text>
<text x="50" y="540" class="small" text-anchor="start">Outgoing: (z, x) = (−2τ, 2τ), τ ≥ 0</text>
<text x="50" y="568" class="small" text-anchor="start">Arrows: increasing Hamilton parameter τ.</text>
<rect x="559" y="94" width="450" height="69" rx="7" class="box"/>
<text x="579" y="120" class="" text-anchor="start">Observe v₊ on J</text>
<text x="579" y="145" class="small" text-anchor="start">Average gives a slice; cost |J|⁻½.</text>
<line x1="780" y1="164" x2="780" y2="185" stroke="#255777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="559" y="189" width="450" height="69" rx="7" class="box"/>
<text x="579" y="215" class="" text-anchor="start">Propagate v₊ to x = 0</text>
<text x="579" y="240" class="small" text-anchor="start">Two-sided energy; complex lower terms kept.</text>
<line x1="780" y1="259" x2="780" y2="280" stroke="#255777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="559" y="284" width="450" height="69" rx="7" class="box"/>
<text x="579" y="310" class="" text-anchor="start">v₋(0) − v₊(0) = β b</text>
<text x="579" y="335" class="small" text-anchor="start">The full common Q₀ cancels Dₓu(0).</text>
<line x1="780" y1="354" x2="780" y2="375" stroke="#255777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="559" y="379" width="450" height="69" rx="7" class="box"/>
<text x="579" y="405" class="" text-anchor="start">Propagate v₋ through the collar</text>
<text x="579" y="430" class="small" text-anchor="start">For b = 0 the two initial outputs agree.</text>
<line x1="780" y1="449" x2="780" y2="470" stroke="#255777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="559" y="474" width="450" height="69" rx="7" class="box"/>
<text x="579" y="500" class="" text-anchor="start">Recover u and Dₓ(T₀u)</text>
<text x="579" y="525" class="small" text-anchor="start">Subtract full roots; elliptic gap = 2|η|.</text>
</svg>
