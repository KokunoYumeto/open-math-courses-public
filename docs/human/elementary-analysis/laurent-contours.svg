<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">The two-circle Cauchy contour</title><desc id="desc">Concentric circles around p with r less than u less than v less than R. The outer contour at v is counterclockwise and the inner contour at u is clockwise. Their difference has index one between u and v, and zero inside u or outside v.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#173e68"/></marker></defs>
<rect width="640" height="340" fill="#fff"/>
<circle cx="174" cy="170" r="138" fill="#eaf3fa"/><circle cx="174" cy="170" r="32" fill="#fff"/>
<circle cx="174" cy="170" r="102" fill="#bdd8ee"/><circle cx="174" cy="170" r="65" fill="#eaf3fa"/><circle cx="174" cy="170" r="32" fill="#fff"/>
<g fill="none" stroke="#6b8293" stroke-dasharray="5 5"><circle cx="174" cy="170" r="138"/><circle cx="174" cy="170" r="32"/></g>
<g fill="none" stroke="#173e68" stroke-width="2"><circle cx="174" cy="170" r="102"/><circle cx="174" cy="170" r="65"/>
<path d="M266.4 213.1 A102 102 0 0 0 266.4 126.9" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M232.9 142.5 A65 65 0 0 1 232.9 197.5" stroke-width="4" marker-end="url(#arrow)"/></g>
<circle cx="174" cy="170" r="3" fill="#173e68"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#162d42"><text x="159" y="194">p</text><text x="177" y="127">r</text><text x="177" y="95">u</text><text x="177" y="57">v</text><text x="177" y="22">R</text>
<text x="338" y="91">Outer circle: counterclockwise</text><text x="338" y="127">Inner circle: clockwise</text><text x="338" y="191">Index 1 in the darker annulus</text><text x="338" y="227">Index 0 inside u and outside v</text><text x="338" y="279">r &lt; u &lt; |z − p| &lt; v &lt; R</text><text x="338" y="307" font-size="14">Schematic, not a metric assertion</text></g>
</svg>
